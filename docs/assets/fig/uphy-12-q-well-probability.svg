<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" class="fig-small" role="img" aria-labelledby="t-uphy-12-q-well-probability d-uphy-12-q-well-probability">
  <title id="t-uphy-12-q-well-probability">그림 일반물리학 12-10 예제 9 풀이의 바닥상태 확률 밀도</title>
  <desc id="d-uphy-12-q-well-probability">폭 L인 무한 퍼텐셜 우물의 바닥상태 확률 밀도 |ψ₁|² = (2/L)sin²(πx/L)이다. 가운데 1/3 영역(L/3 < x < 2L/3)의 넓이가 그 영역에서 발견될 확률로 약 0.61이며, 고르게 퍼진 고전적 입자(점선, 1/L)라면 1/3이다.</desc>
