<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 322" role="img" aria-labelledby="t-cell-2-temp-ph d-cell-2-temp-ph">
  <title id="t-cell-2-temp-ph">그림 세포와 물질대사 2-3 온도와 pH에 따른 효소의 반응 속도</title>
  <desc id="d-cell-2-temp-ph">온도가 오르면 반응 속도가 빨라지다가 최적 온도(사람 효소는 약 35~40 °C)를 넘으면 효소가 변성되어 급격히 느려진다. 온천 세균의 효소는 더 높은 온도에서 잘 작용한다. 효소마다 최적 pH가 달라 펩신은 약 2, 침 아밀레이스는 약 7, 트립신은 약 8에서 가장 활발하다. 경향을 나타낸 모식도.</desc>
