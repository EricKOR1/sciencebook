  <title id="t-umath-8-gibbs">그림 수학 도구 8-4 직사각형 함수의 사인 급수 부분합과 깁스 현상</title>
  <desc id="d-umath-8-gibbs">구간 0 &lt; x &lt; L에서 값이 1인 직사각형 함수(검은 점선)와 홀수 n 항 1개, 3개, 10개, 50개를 더한 사인 급수 부분합. 항이 많을수록 직사각형에 가까워지지만 x = 0과 x = L 근처에서는 약 1.18까지 솟는 물결이 남는다(오른쪽 확대).</desc>
