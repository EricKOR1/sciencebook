<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="t-ochem-7-ir-correlation d-ochem-7-ir-correlation">
  <title id="t-ochem-7-ir-correlation">그림 유기화학 7-8 IR 상관 도표</title>
  <desc id="d-ochem-7-ir-correlation">가로축은 파수 4000 → 500 cm⁻¹이고, 일반적인 스펙트럼처럼 2000 cm⁻¹ 아래는 같은 파수 폭을 두 배로 넓혀 그렸다. 네 영역(X–H 신축, 삼중 결합, 이중 결합, 지문 영역) 위에 작용기별 흡수 범위를 가로 막대로, 세기를 s(강함)·m(중간)·w(약함)로 적었다.</desc>
