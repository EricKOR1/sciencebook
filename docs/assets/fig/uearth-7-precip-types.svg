<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-uearth-7-precip-types d-uearth-7-precip-types">
  <title id="t-uearth-7-precip-types">그림 일반지구과학 7-8 연직 기온 분포와 강수 형태</title>
  <desc id="d-uearth-7-precip-types">상층 구름에서 만들어진 눈이 떨어지며 지나는 층의 기온 분포(빨간 선)에 따라 지표에 닿는 강수 형태가 달라짐을 보이는 다섯 그림이다. 0 °C 이상 층이 두꺼우면 비, 지표까지 0 °C 이하이면 눈, 지표 부근에만 얕은 영상 층이 있으면 진눈깨비가 된다. 상층에 녹는 층이 있고 지표 부근 영하층이 두꺼우면 녹은 방울이 다시 얼어 얼음싸라기, 영하층이 얇으면 과냉각된 빗방울이 지면에서 얼어붙는 어는비가 된다. 기온 값은 예시이다.</desc>
