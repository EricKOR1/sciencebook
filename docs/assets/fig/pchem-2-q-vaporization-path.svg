    .pc2q-vaporization-path-fgreen{fill:var(--fig-green)}
    .pc2q-vaporization-path-famber{fill:var(--fig-amber)}
    .pc2q-vaporization-path-fviolet{fill:var(--fig-violet)}
    .pc2q-vaporization-path-fteal{fill:var(--fig-teal)}
    .pc2q-vaporization-path-faccent{fill:var(--fig-accent)}
  </style>
