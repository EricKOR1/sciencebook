<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-pchem-2-q-vaporization-path d-pchem-2-q-vaporization-path">
  <title id="t-pchem-2-q-vaporization-path">그림 물리화학 2-8 예제 8의 가역 경로</title>
  <desc id="d-pchem-2-q-vaporization-path">298.15 K의 물(l)을 1 bar, 298.15 K의 수증기(g)로 바꾸는 과정(굵은 점선)을, 373.15 K까지 가열 ㉠, 정상 끓는점에서 가역 증발 ㉡, 298.15 K까지 냉각 ㉢의 세 가역 단계로 대신한다. 엔트로피는 상태 함수이므로 세 단계의 합이 구하는 ΔS°이다.</desc>
  <style>
    .pc2q-vaporization-path-t{font-size:14px;fill:var(--fig-ink)}
    .pc2q-vaporization-path-s{font-size:13px;fill:var(--fig-muted)}
    .pc2q-vaporization-path-b{font-size:14px;fill:var(--fig-ink);font-weight:600}
    .pc2q-vaporization-path-ax{font-size:13px;fill:var(--fig-muted)}
