<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="t-pchem-7-photoelectric-lines d-pchem-7-photoelectric-lines">
  <title id="t-pchem-7-photoelectric-lines">그림 물리화학 7-3 광전 효과의 저지 전압과 진동수</title>
  <desc id="d-pchem-7-photoelectric-lines">두 금속의 저지 전압 Vs = (h/e)ν − Φ/e. 기울기 h/e = 4.136×10⁻¹⁵ V·s(10¹⁴ Hz당 0.4136 V)는 금속과 무관하여 두 직선이 평행하다. 금속 A(Φ = 2.30 eV)는 문턱 진동수 5.56×10¹⁴ Hz, 금속 B(Φ = 4.50 eV)는 10.88×10¹⁴ Hz이고, 점선으로 연장한 직선의 세로축 절편이 −Φ/e = −2.30 V, −4.50 V이다. 문턱 진동수보다 낮으면 전자가 나오지 않으므로 점선 부분은 측정되지 않는다.</desc>
