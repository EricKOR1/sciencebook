<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-1-4-q-temp-quantize d-1-4-q-temp-quantize">
  <title id="t-1-4-q-temp-quantize">그림 1-4-6 예제 2 풀이: 기온의 표본화와 양자화</title>
  <desc id="d-1-4-q-temp-quantize">예제 2의 기온을 4시간마다 표본화한 값(점)을 5 °C 간격의 양자화 단계 위에 나타냈다. 각 점은 그 점이 들어 있는 구간(색칠한 칸)의 단계 번호로 바뀌고, 단계 번호는 3비트 이진수로 부호화된다. 12.4 °C와 14.1 °C는 같은 부호 010이 된다.</desc>
