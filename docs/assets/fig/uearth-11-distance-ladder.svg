<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" role="img" aria-labelledby="t-uearth-11-distance-ladder d-uearth-11-distance-ladder">
  <title id="t-uearth-11-distance-ladder">그림 일반지구과학 11-6 연주 시차와 우주의 거리 사다리</title>
  <desc id="d-uearth-11-distance-ladder">위: 6개월 간격으로 지구의 위치가 2 AU만큼 바뀌면 가까운 별이 먼 배경별에 대해 위치가 달라 보인다. 별에서 본 지구 궤도 반지름(1 AU)의 각이 연주 시차 p이며 d(pc) = 1/p(″)이다(각은 크게 과장). 아래: 거리 측정 방법이 쓰이는 범위(로그 눈금). 연주 시차로 가까운 별의 거리를 정하고, 그것으로 세페이드 변광성의 주기–광도 관계를, 다시 Ⅰa형 초신성의 밝기를 보정하여 더 먼 거리로 이어 가며, 가장 먼 곳에서는 허블–르메트르 법칙을 쓴다. 범위는 대략값.</desc>
  <style>
    .uearth-11-distance-ladder-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .uearth-11-distance-ladder-t{font-size:13px;fill:var(--fig-ink)}
    .uearth-11-distance-ladder-s{font-size:13px;fill:var(--fig-muted)}
    .uearth-11-distance-ladder-n{font-size:12px;fill:var(--fig-muted)}
    .uearth-11-distance-ladder-b{font-size:13px;font-weight:600;fill:var(--fig-ink)}
    .uearth-11-distance-ladder-o{paint-order:stroke;stroke:var(--fig-paper);stroke-width:4px;stroke-linejoin:round}
  </style>
