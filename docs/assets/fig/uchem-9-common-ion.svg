  <text x="644" y="84" text-anchor="middle" class="uchem-9-common-ion-t" style="font-weight:600">Ag⁺ + Cl⁻</text>
  <text x="644" y="106" text-anchor="middle" class="uchem-9-common-ion-s">Ksp = 1.8×10⁻¹⁰</text>
  <text x="590" y="138" text-anchor="start" class="uchem-9-common-ion-s">Cl⁻를 더 넣으면</text>
  <text x="590" y="158" text-anchor="start" class="uchem-9-common-ion-s">Q &gt; Ksp가 되어</text>
  <text x="590" y="178" text-anchor="start" class="uchem-9-common-ion-s">평형이 왼쪽으로</text>
  <text x="590" y="198" text-anchor="start" class="uchem-9-common-ion-s">이동한다.</text>
