<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-uchem-9-common-ion d-uchem-9-common-ion">
  <title id="t-uchem-9-common-ion">그림 일반화학 9-3 공통 이온이 낮추는 AgCl의 용해도</title>
  <desc id="d-uchem-9-common-ion">NaCl 농도(가로, 로그 눈금)에 따른 AgCl의 몰 용해도 s(세로, 로그 눈금)이다. Cl⁻를 거의 넣지 않으면 s = √Ksp = 1.3×10⁻⁵ M로 일정하지만, 넣은 Cl⁻가 이보다 많아지면 s = Ksp/[Cl⁻]가 되어 기울기 −1의 직선으로 줄어든다. 0.10 M NaCl에서는 1.8×10⁻⁹ M로 약 7500분의 1이다.</desc>
