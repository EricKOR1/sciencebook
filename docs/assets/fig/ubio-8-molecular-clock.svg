<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-ubio-8-molecular-clock d-ubio-8-molecular-clock">
<title id="t-ubio-8-molecular-clock">그림 일반생명과학 8-7 분자 시계의 보정과 적용</title>
<desc id="d-ubio-8-molecular-clock">두 계통이 갈라진 뒤의 시간 T와 서열 차이 d는 d = 2rT로 비례한다고 가정한다. 화석으로 연대를 아는 분기(3000만 년, d = 0.060)로 기울기를 정한 뒤, 다른 두 종의 차이 0.024를 직선에 대어 1200만 년을 읽는다. 오래된 분기에서는 같은 자리에 치환이 겹쳐 관찰되는 차이(점선)가 직선보다 작아지므로 시간을 과소평가하게 된다.</desc>
<style>
.ubio-8-molecular-clock-h{font-size:14px;font-weight:700;fill:var(--fig-ink)} .ubio-8-molecular-clock-t{font-size:13px;fill:var(--fig-ink)} .ubio-8-molecular-clock-s{font-size:13px;fill:var(--fig-muted)} .ubio-8-molecular-clock-b{font-size:13px;font-weight:700;fill:var(--fig-ink)}
</style>
<rect x="90" y="40" width="600" height="280" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1"/>
<line x1="90.0" y1="320" x2="90.0" y2="325" style="stroke:var(--fig-ink)"/>
<text x="90.0" y="341.0" text-anchor="middle" class="ubio-8-molecular-clock-s">0</text>
<line x1="210.0" y1="320" x2="210.0" y2="325" style="stroke:var(--fig-ink)"/>
<text x="210.0" y="341.0" text-anchor="middle" class="ubio-8-molecular-clock-s">30</text>
<line x1="330.0" y1="320" x2="330.0" y2="325" style="stroke:var(--fig-ink)"/>
<text x="330.0" y="341.0" text-anchor="middle" class="ubio-8-molecular-clock-s">60</text>
<line x1="450.0" y1="320" x2="450.0" y2="325" style="stroke:var(--fig-ink)"/>
<text x="450.0" y="341.0" text-anchor="middle" class="ubio-8-molecular-clock-s">90</text>
<line x1="570.0" y1="320" x2="570.0" y2="325" style="stroke:var(--fig-ink)"/>
<text x="570.0" y="341.0" text-anchor="middle" class="ubio-8-molecular-clock-s">120</text>
<line x1="690.0" y1="320" x2="690.0" y2="325" style="stroke:var(--fig-ink)"/>
<text x="690.0" y="341.0" text-anchor="middle" class="ubio-8-molecular-clock-s">150</text>
<line x1="85" y1="320.0" x2="90" y2="320.0" style="stroke:var(--fig-ink)"/>
<text x="81.0" y="325.0" text-anchor="end" class="ubio-8-molecular-clock-s">0.0</text>
<line x1="85" y1="232.5" x2="90" y2="232.5" style="stroke:var(--fig-ink)"/>
<text x="81.0" y="237.5" text-anchor="end" class="ubio-8-molecular-clock-s">0.1</text>
<line x1="85" y1="145.0" x2="90" y2="145.0" style="stroke:var(--fig-ink)"/>
<text x="81.0" y="150.0" text-anchor="end" class="ubio-8-molecular-clock-s">0.2</text>
<line x1="85" y1="57.5" x2="90" y2="57.5" style="stroke:var(--fig-ink)"/>
<text x="81.0" y="62.5" text-anchor="end" class="ubio-8-molecular-clock-s">0.3</text>
<text x="390.0" y="364.0" text-anchor="middle" class="ubio-8-molecular-clock-t">두 계통이 갈라진 뒤의 시간 T (백만 년)</text>
<text x="26" y="180" text-anchor="middle" transform="rotate(-90 26 180)" class="ubio-8-molecular-clock-t">서열 차이 d (부위당)</text>
<line x1="90.0" y1="320.0" x2="690.0" y2="57.5" style="stroke:var(--fig-blue);stroke-width:2.6"/>
