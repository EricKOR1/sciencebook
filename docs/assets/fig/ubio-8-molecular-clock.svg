fig-amber);stroke-width:2.4;stroke-dasharray:7 4"/>
<line x1="210.0" y1="267.5" x2="210.0" y2="320" style="stroke:var(--fig-green);stroke-width:1.2;stroke-dasharray:3 3"/>
<circle cx="210.0" cy="267.5" r="6" style="fill:var(--fig-green)"/>
<text x="330.0" y="254.4" text-anchor="start" class="ubio-8-molecular-clock-t" style="fill:var(--fig-green)">① 보정: 화석 3000만 년, d = 0.060</text>
<text x="330.0" y="272.4" text-anchor="start" class="ubio-8-molecular-clock-t" style="fill:var(--fig-green)">   → r = 0.060 ÷ (2 × 3.0×10⁷) = 1.0×10⁻⁹/년</text>
<line x1="217.0" y1="269.5" x2="326.0" y2="250.4" style="stroke:var(--fig-green);stroke-width:1"/>
<path d="M90 299.0 H138.0 V320" style="fill:none;stroke:var(--fig-red);stroke-width:1.4;stroke-dasharray:4 3"/>
<circle cx="138.0" cy="299.0" r="5.5" style="fill:var(--fig-red)"/>
<text x="142.0" y="312.0" text-anchor="start" class="ubio-8-molecular-clock-b" style="fill:var(--fig-red)">12</text>
<text x="94.0" y="291.0" text-anchor="start" class="ubio-8-molecular-clock-b" style="fill:var(--fig-red)">0.024</text>
<text x="330.0" y="300.8" text-anchor="start" class="ubio-8-molecular-clock-t" style="fill:var(--fig-red)">② 적용: d = 0.024 → T = 0.024 ÷ (2r) = 1200만 년</text>
<line x1="110" y1="66" x2="150" y2="66" style="stroke:var(--fig-blue);stroke-width:2.6"/>
<text x="158.0" y="71.0" text-anchor="start" class="ubio-8-molecular-clock-t">실제 치환 수: d = 2rT (직선)</text>
<line x1="110" y1="92" x2="150" y2="92" style="stroke:var(--fig-amber);stroke-width:2.4;stroke-dasharray:7 4"/>
<text x="158.0" y="97.0" text-anchor="start" class="ubio-8-molecular-clock-t">관찰되는 차이: 같은 자리 치환이 겹쳐 휘어짐</text>
<text x="158.0" y="118.0" text-anchor="start" class="ubio-8-molecular-clock-s">→ 오래된 분기일수록 시간을 과소평가</text>
</svg>
