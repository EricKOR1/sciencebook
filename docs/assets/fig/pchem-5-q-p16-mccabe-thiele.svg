  <title id="t-pchem-5-q-p16-mccabe-thiele">그림 물리화학 5-19 문제 16 해설: α = 2.4인 계의 전환류 계단(y–x 도표)</title>
  <desc id="d-pchem-5-q-p16-mccabe-thiele">α = 2.4인 이상 계의 평형 곡선 y = 2.4x/(1 + 1.4x)와 대각선 y = x. 전환류에서는 한 단의 증기 조성이 바로 위 단의 액체 조성과 같으므로 x_W = 0.05에서 평형 곡선까지 수직으로, 대각선까지 수평으로 오르는 계단을 반복한다. 일곱째 단에서 x_D = 0.95를 넘는다.</desc>
