  <title id="t-m3-05-nose-tongue">그림 중3-5-4 코와 혀에서 화학 물질을 받아들이는 곳</title>
  <desc id="d-m3-05-nose-tongue">왼쪽은 코의 단면 모식도로, 콧구멍으로 들어온 기체 상태의 냄새 물질이 콧속 윗부분 후각 상피의 후각 세포를 자극하고 신호가 후각 신경을 따라 대뇌로 간다. 오른쪽은 혀와 맛봉오리 모식도로, 맛봉오리는 혀 전체에 퍼져 있고 물에 녹은 물질이 맛세포를 자극하면 신호가 미각 신경을 따라 대뇌로 간다.</desc>
