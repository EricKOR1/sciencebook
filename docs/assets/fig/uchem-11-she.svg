<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-uchem-11-she d-uchem-11-she">
  <title id="t-uchem-11-she">그림 일반화학 11-1 표준 수소 전극으로 표준 환원 전위 재기</title>
  <desc id="d-uchem-11-she">표준 수소 전극(백금 전극, 1 bar 수소 기체, 1 M 수소 이온)을 아연 반쪽 전지(1 M 아연 이온)와 염다리로 잇고 전압계를 연결하면 0.76 V가 읽힌다. 아연이 산화되어 전자가 아연에서 백금 쪽으로 흐르므로 아연은 (−)극이다. 수소 전극의 전위를 0 V로 약속했으므로 E°(Zn²⁺/Zn) = −0.76 V이다.</desc>
  <style>.uchem-11-she-t{font-size:14px;fill:var(--fig-ink)} .uchem-11-she-s{font-size:13px;fill:var(--fig-muted)} .uchem-11-she-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}</style>
