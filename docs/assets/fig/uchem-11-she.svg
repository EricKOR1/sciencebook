  <text x="66.0" y="272.0" class="uchem-11-she-t" style="fill:var(--fig-blue)">H⁺(aq) 1 M</text>
  <text x="176.0" y="236.0" text-anchor="middle" class="uchem-11-she-b">Pt</text>
  <text x="140.0" y="316.0" text-anchor="middle" class="uchem-11-she-t">2H⁺ + 2e⁻ → H₂</text>
