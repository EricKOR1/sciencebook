  <text x="520.0" y="30.0" class="umath-6-roots-frost-t" text-anchor="middle">프로스트 원 (반지름 2|β|)</text>
  <text x="520.0" y="368.0" class="umath-6-roots-frost-s" text-anchor="middle">꼭짓점 높이 = α + 2β cos(2πk/6), 아래 세 준위에 π 전자 6개</text>
