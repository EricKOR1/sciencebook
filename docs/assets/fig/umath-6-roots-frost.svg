  <text x="176.0" y="52.0" class="umath-6-roots-frost-s">Im</text>
  <circle cx="170.0" cy="190.0" r="120.0" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.4;fill-opacity:0"/>
  <path d="M290.0 190.0 L230.0 86.1 L110.0 86.1 L50.0 190.0 L110.0 293.9 L230.0 293.9 Z" style="fill:var(--fig-soft-blue);stroke:var(--fig-accent);stroke-width:2;stroke-linejoin:round"/>
  <circle cx="290.0" cy="190.0" r="5.0" style="fill:var(--fig-accent);stroke:var(--fig-accent);stroke-width:1.5"/>
  <text x="310.0" y="195.0" class="umath-6-roots-frost-s umath-6-roots-frost-b" text-anchor="middle" style="fill:var(--fig-accent)">k = 0</text>
  <circle cx="230.0" cy="86.1" r="5.0" style="fill:var(--fig-accent);stroke:var(--fig-accent);stroke-width:1.5"/>
  <text x="240.0" y="73.8" class="umath-6-roots-frost-s umath-6-roots-frost-b" text-anchor="middle" style="fill:var(--fig-accent)">k = 1</text>
  <circle cx="110.0" cy="86.1" r="5.0" style="fill:var(--fig-accent);stroke:var(--fig-accent);stroke-width:1.5"/>
  <text x="100.0" y="73.8" class="umath-6-roots-frost-s umath-6-roots-frost-b" text-anchor="middle" style="fill:var(--fig-accent)">k = 2</text>
  <circle cx="50.0" cy="190.0" r="5.0" style="fill:var(--fig-accent);stroke:var(--fig-accent);stroke-width:1.5"/>
  <text x="30.0" y="195.0" class="umath-6-roots-frost-s umath-6-roots-frost-b" text-anchor="middle" style="fill:var(--fig-accent)">k = 3</text>
  <circle cx="110.0" cy="293.9" r="5.0" style="fill:var(--fig-accent);stroke:var(--fig-accent);stroke-width:1.5"/>
  <text x="100.0" y="316.2" class="umath-6-roots-frost-s umath-6-roots-frost-b" text-anchor="middle" style="fill:var(--fig-accent)">k = 4</text>
  <circle cx="230.0" cy="293.9" r="5.0" style="fill:var(--fig-accent);stroke:var(--fig-accent);stroke-width:1.5"/>
  <text x="240.0" y="316.2" class="umath-6-roots-frost-s umath-6-roots-frost-b" text-anchor="middle" style="fill:var(--fig-accent)">k = 5</text>
  <text x="170.0" y="30.0" class="umath-6-roots-frost-t" text-anchor="middle">z<tspan dy="4" style="font-size:0.72em">k</tspan><tspan dy="-4">&#8203;</tspan> = e<tspan dy="-6" style="font-size:0.72em">2πik/6</tspan><tspan dy="6">&#8203;</tspan>,  k = 0, 1, …, 5</text>
  <text x="170.0" y="368.0" class="umath-6-roots-frost-s" text-anchor="middle">이웃한 근 사이의 각 60°, 여섯 화살표의 합 = 0</text>
