  <circle cx="520.0" cy="315.0" r="4.5" style="fill:var(--fig-violet);stroke:var(--fig-violet);stroke-width:1.5"/>
  <text x="658.0" y="320.0" class="umath-6-roots-frost-t umath-6-roots-frost-b">α + 2β</text>
  <line x1="390.0" y1="255.0" x2="652.0" y2="255.0" style="stroke:var(--fig-ink);stroke-width:1.0;stroke-dasharray:2 3"/>
  <circle cx="623.9" cy="255.0" r="4.5" style="fill:var(--fig-violet);stroke:var(--fig-violet);stroke-width:1.5"/>
