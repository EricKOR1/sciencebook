<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-umath-6-roots-frost d-umath-6-roots-frost">
  <title id="t-umath-6-roots-frost">그림 수학 도구 6-3 1의 6제곱근과 벤젠의 프로스트 원</title>
  <desc id="d-umath-6-roots-frost">왼쪽: z⁶ = 1 의 여섯 근 z_k = e^(2πik/6) 은 단위원 위에 정육각형을 이룬다. 오른쪽: 반지름 2|β| 인 원에 꼭짓점 하나가 맨 아래로 오게 정육각형을 내접시키면, 꼭짓점의 높이가 벤젠의 π 오비탈 에너지 α + 2β(1개), α + β(2개), α − β(2개), α − 2β(1개)가 된다(β &amp;lt; 0). π 전자 6개가 아래 세 오비탈을 채운다.</desc>
  <style>.umath-6-roots-frost-t{font-size:14px;fill:var(--fig-ink)} .umath-6-roots-frost-s{font-size:13px;fill:var(--fig-muted)} .umath-6-roots-frost-b{font-weight:600} .umath-6-roots-frost-i{font-style:italic}</style>
  <line x1="20.0" y1="190.0" x2="320.0" y2="190.0" style="stroke:var(--fig-ink);stroke-width:1.2"/>
  <line x1="170.0" y1="40.0" x2="170.0" y2="340.0" style="stroke:var(--fig-ink);stroke-width:1.2"/>
