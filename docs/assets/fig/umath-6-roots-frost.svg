  <circle cx="416.1" cy="135.0" r="4.5" style="fill:var(--fig-violet);stroke:var(--fig-violet);stroke-width:1.5"/>
  <text x="658.0" y="140.0" class="umath-6-roots-frost-t umath-6-roots-frost-b">α − β</text>
  <line x1="390.0" y1="75.0" x2="652.0" y2="75.0" style="stroke:var(--fig-ink);stroke-width:1.0;stroke-dasharray:2 3"/>
  <circle cx="520.0" cy="75.0" r="4.5" style="fill:var(--fig-violet);stroke:var(--fig-violet);stroke-width:1.5"/>
  <text x="658.0" y="80.0" class="umath-6-roots-frost-t umath-6-roots-frost-b">α − 2β</text>
  <line x1="496.0" y1="326.0" x2="496.0" y2="309.1" style="stroke:var(--fig-red);stroke-width:1.6"/>
  <path d="M496.0 304.0 L498.5 310.0 L493.5 310.0 Z" style="fill:var(--fig-red);stroke:none"/>
  <line x1="504.0" y1="304.0" x2="504.0" y2="320.9" style="stroke:var(--fig-red);stroke-width:1.6"/>
  <path d="M504.0 326.0 L501.5 320.0 L506.5 320.0 Z" style="fill:var(--fig-red);stroke:none"/>
  <line x1="637.9" y1="266.0" x2="637.9" y2="249.1" style="stroke:var(--fig-red);stroke-width:1.6"/>
  <path d="M637.9 244.0 L640.4 250.0 L635.4 250.0 Z" style="fill:var(--fig-red);stroke:none"/>
  <line x1="645.9" y1="244.0" x2="645.9" y2="260.9" style="stroke:var(--fig-red);stroke-width:1.6"/>
  <path d="M645.9 266.0 L643.4 260.0 L648.4 260.0 Z" style="fill:var(--fig-red);stroke:none"/>
  <line x1="394.1" y1="266.0" x2="394.1" y2="249.1" style="stroke:var(--fig-red);stroke-width:1.6"/>
