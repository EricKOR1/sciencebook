<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-ochem-7-c13-shift-chart d-ochem-7-c13-shift-chart">
  <title id="t-ochem-7-c13-shift-chart">그림 유기화학 7-16 ¹³C 화학적 이동 상관 도표</title>
  <desc id="d-ochem-7-c13-shift-chart">가로축 δ 220 → 0 ppm(오른쪽 끝 TMS). 탄소 종류별 화학적 이동 범위를 막대로, 대표 화합물의 값(아세톤 C=O 206.6, 에탄산 에틸 C=O 171.1, 벤젠 128.4, 에탄올 CH₂ 58.3)을 점으로 나타냈다. 77.2 ppm의 삼중선은 용매 CDCl₃의 신호이다. 160 ppm 위쪽은 대체로 sp² 탄소(C=O 포함), 아래쪽은 포화 탄소와 헤테로 원자가 붙은 탄소의 영역이다.</desc>
  <style>.ochem-7-c13-shift-chart-t{font-size:14px;fill:var(--fig-ink)} .ochem-7-c13-shift-chart-b{font-size:14px;fill:var(--fig-ink);font-weight:600} .ochem-7-c13-shift-chart-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ochem-7-c13-shift-chart-s{font-size:13px;fill:var(--fig-muted)} .ochem-7-c13-shift-chart-n{font-size:13px;fill:var(--fig-muted)} .ochem-7-c13-shift-chart-r{font-size:13px;fill:var(--fig-red);font-weight:600} .ochem-7-c13-shift-chart-g{font-size:13px;fill:var(--fig-green);font-weight:600} .ochem-7-c13-shift-chart-v{font-size:13px;fill:var(--fig-violet)} .ochem-7-c13-shift-chart-pl{font-size:20px;fill:var(--fig-ink)} .ochem-7-c13-shift-chart-f{font-size:14px;fill:var(--fig-ink)}</style>
  <rect x="170.0" y="36.0" width="144.5" height="364.0" rx="0" style="fill:var(--fig-soft-violet);stroke:none;stroke-width:1.2;opacity:0.5"/>
  <rect x="314.5" y="36.0" width="385.5" height="364.0" rx="0" style="fill:var(--fig-soft-teal);stroke:none;stroke-width:1.2;opacity:0.4"/>
  <text x="242.3" y="54.0" class="ochem-7-c13-shift-chart-b" text-anchor="middle">sp² 영역 (C=O)</text>
  <text x="507.3" y="54.0" class="ochem-7-c13-shift-chart-b" text-anchor="middle">sp² C=C·방향족 + 포화·헤테로 원자 영역</text>
  <text x="162.0" y="90.0" class="ochem-7-c13-shift-chart-t" text-anchor="end">케톤 C=O</text>
