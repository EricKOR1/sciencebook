  <title id="t-umath-5-rotation-order">그림 수학 도구 5-3 회전의 순서를 바꾸면 결과가 다르다</title>
  <desc id="d-umath-5-rotation-order">위 줄: x 방향 결합을 z축 둘레로 90° 돌리면 +y, 다시 x축 둘레로 90° 돌리면 +z. 아래 줄: x축 둘레로 먼저 돌리면 그대로 +x, 다음 z축 둘레로 돌리면 +y. 굵은 축은 회전축, 굽은 화살표는 오른손 규칙의 회전 방향이다.</desc>
