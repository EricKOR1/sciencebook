<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-matter-1-q-charles-graph d-matter-1-q-charles-graph">
  <title id="t-matter-1-q-charles-graph">그림 물질과 에너지 1-10 문제 14의 온도–부피 그래프</title>
  <desc id="d-matter-1-q-charles-graph">같은 압력에서 기체 A와 B의 부피를 0~100 °C 범위에서 섭씨 온도에 따라 측정한 그래프. 두 그래프는 모두 직선이고, 0 °C에서 A의 부피는 11.2 L, B의 부피는 22.4 L이다.</desc>
  <style>
    .matter-1-q-charles-graph-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
    .matter-1-q-charles-graph-gr{fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4}
    .matter-1-q-charles-graph-l{font-size:14px;fill:var(--fig-ink)}
    .matter-1-q-charles-graph-t{font-size:13px;fill:var(--fig-muted)}
    .matter-1-q-charles-graph-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .matter-1-q-charles-graph-ink{fill:var(--fig-ink)}
    .matter-1-q-charles-graph-lead{fill:none;stroke:var(--fig-muted);stroke-width:1}
  </style>
  <line x1="110" y1="275" x2="610" y2="275" class="matter-1-q-charles-graph-gr"/>
  <text x="100" y="280" text-anchor="end" class="matter-1-q-charles-graph-t">10</text>
  <line x1="110" y1="190" x2="610" y2="190" class="matter-1-q-charles-graph-gr"/>
  <text x="100" y="195" text-anchor="end" class="matter-1-q-charles-graph-t">20</text>
  <line x1="110" y1="105" x2="610" y2="105" class="matter-1-q-charles-graph-gr"/>
  <text x="100" y="110" text-anchor="end" class="matter-1-q-charles-graph-t">30</text>
  <text x="100" y="365" text-anchor="end" class="matter-1-q-charles-graph-t">0</text>
  <text x="110" y="382" text-anchor="middle" class="matter-1-q-charles-graph-t">0</text>
  <line x1="210" y1="54" x2="210" y2="360" class="matter-1-q-charles-graph-gr"/>
  <text x="210" y="382" text-anchor="middle" class="matter-1-q-charles-graph-t">20</text>
  <line x1="310" y1="54" x2="310" y2="360" class="matter-1-q-charles-graph-gr"/>
  <text x="310" y="382" text-anchor="middle" class="matter-1-q-charles-graph-t">40</text>
  <line x1="410" y1="54" x2="410" y2="360" class="matter-1-q-charles-graph-gr"/>
  <text x="410" y="382" text-anchor="middle" class="matter-1-q-charles-graph-t">60</text>
  <line x1="510" y1="54" x2="510" y2="360" class="matter-1-q-charles-graph-gr"/>
  <text x="510" y="382" text-anchor="middle" class="matter-1-q-charles-graph-t">80</text>
  <line x1="610" y1="54" x2="610" y2="360" class="matter-1-q-charles-graph-gr"/>
  <text x="610" y="382" text-anchor="middle" class="matter-1-q-charles-graph-t">100</text>
  <path d="M110 41.2 L110 360 L632 360" class="matter-1-q-charles-graph-ax"/>
  <path d="M110 35.2 l-5 9 l10 0 z" class="matter-1-q-charles-graph-ink"/>
  <path d="M638 360 l-9 -5 l0 10 z" class="matter-1-q-charles-graph-ink"/>
  <text x="638" y="404" text-anchor="end" class="matter-1-q-charles-graph-l">온도(°C)</text>
  <text x="120" y="45.2" class="matter-1-q-charles-graph-l">부피(L)</text>
  <line x1="110" y1="264.8" x2="610" y2="229.9" style="stroke:var(--fig-blue);stroke-width:3"/>
  <circle cx="110" cy="264.8" r="4.5" style="fill:var(--fig-blue)"/>
  <circle cx="235" cy="256.1" r="4.5" style="fill:var(--fig-blue)"/>
  <circle cx="360" cy="247.4" r="4.5" style="fill:var(--fig-blue)"/>
  <circle cx="485" cy="238.6" r="4.5" style="fill:var(--fig-blue)"/>
  <circle cx="610" cy="229.9" r="4.5" style="fill:var(--fig-blue)"/>
  <text x="622" y="234.9" class="matter-1-q-charles-graph-h" style="fill:var(--fig-blue)">A</text>
  <rect x="120" y="235.8" width="118" height="22" rx="3" style="fill:var(--fig-paper);opacity:0.92"/>
  <text x="124" y="251.8" class="matter-1-q-charles-graph-l" style="fill:var(--fig-blue)">0 °C에서 11.2 L</text>
  <line x1="110" y1="169.6" x2="610" y2="99.9" style="stroke:var(--fig-red);stroke-width:3"/>
  <circle cx="110" cy="169.6" r="4.5" style="fill:var(--fig-red)"/>
  <circle cx="235" cy="152.2" r="4.5" style="fill:var(--fig-red)"/>
  <circle cx="360" cy="134.7" r="4.5" style="fill:var(--fig-red)"/>
  <circle cx="485" cy="117.3" r="4.5" style="fill:var(--fig-red)"/>
  <circle cx="610" cy="99.9" r="4.5" style="fill:var(--fig-red)"/>
  <text x="622" y="104.9" class="matter-1-q-charles-graph-h" style="fill:var(--fig-red)">B</text>
  <rect x="120" y="140.6" width="118" height="22" rx="3" style="fill:var(--fig-paper);opacity:0.92"/>
  <text x="124" y="156.6" class="matter-1-q-charles-graph-l" style="fill:var(--fig-red)">0 °C에서 22.4 L</text>
  <text x="360" y="412" text-anchor="middle" class="matter-1-q-charles-graph-t">압력 일정, 측정 범위 0~100 °C</text>
</svg>
