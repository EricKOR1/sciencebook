<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-ubio-6-srp-targeting d-ubio-6-srp-targeting">
  <title id="t-ubio-6-srp-targeting">그림 일반생명과학 6-8 신호 펩타이드에 의한 소포체 표적화</title>
  <desc id="d-ubio-6-srp-targeting">한 mRNA를 여러 리보솜이 차례로 번역하는 모습으로 과정을 나타냈다(왼쪽일수록 번역 초기). ① 번역이 시작되어 N 말단의 신호 펩타이드가 리보솜 밖으로 나오면 ② 신호 인식 입자(SRP)가 이를 붙잡아 번역을 잠시 멈춘다. ③ SRP가 소포체 막의 SRP 수용체에 붙으면 리보솜이 막의 통로(전위체)에 자리 잡고 SRP는 떨어진다. ④ 번역이 다시 시작되어 사슬이 통로를 지나 소포체 안으로 들어가고, 신호 펩타이드는 신호 펩타이드 분해 효소가 잘라 낸다. ⑤ 완성된 단백질은 소포체 안에 남아 접히고 리보솜은 떨어진다. 모식도.</desc>
  <style>.ubio-6-srp-targeting-t{font-size:14px;fill:var(--fig-ink)} .ubio-6-srp-targeting-s{font-size:13px;fill:var(--fig-muted)} .ubio-6-srp-targeting-b{font-size:14px;fill:var(--fig-ink);font-weight:600} .ubio-6-srp-targeting-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-6-srp-targeting-m{font-size:13px;fill:var(--fig-ink)}</style>
