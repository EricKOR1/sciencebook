  <text x="150.0" y="120.0" text-anchor="middle" class="ubio-6-srp-targeting-s" style="fill:var(--fig-red)">mRNA</text>
  <ellipse cx="80.0" cy="115.0" rx="26" ry="12" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6"/>
