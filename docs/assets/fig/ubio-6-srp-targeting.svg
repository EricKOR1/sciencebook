  <text x="80.0" y="48.0" text-anchor="middle" class="ubio-6-srp-targeting-b">① 번역 시작</text>
  <text x="80.0" y="66.0" text-anchor="middle" class="ubio-6-srp-targeting-s">신호 펩타이드</text>
  <text x="210.0" y="48.0" text-anchor="middle" class="ubio-6-srp-targeting-b">② SRP 결합</text>
