<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-m1-02-taxonomy-nested d-m1-02-taxonomy-nested">
<title id="t-m1-02-taxonomy-nested">그림 중1-2-7 분류 단계의 포함 관계 — 사람과 호랑이</title>
<desc id="d-m1-02-taxonomy-nested">계 안에 문, 문 안에 강, 강 안에 목, 목 안에 과, 과 안에 속, 속 안에 종이 들어 있다. 사람과 호랑이는 동물계, 척삭동물문, 포유강까지 같고 목부터 다르다. 같은 표범속인 호랑이와 사자는 호랑이와 고양이보다 가깝다.</desc>
