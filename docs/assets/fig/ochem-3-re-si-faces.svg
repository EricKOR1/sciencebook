<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-ochem-3-re-si-faces d-ochem-3-re-si-faces">
  <title id="t-ochem-3-re-si-faces">그림 유기화학 3-17 뷰탄-2-온 카보닐 탄소의 Re 면과 Si 면</title>
  <desc id="d-ochem-3-re-si-faces">카보닐 탄소의 평면 삼각형(O 위, CH₂CH₃ 오른쪽 아래, CH₃ 왼쪽 아래)을 비스듬히 그렸다. 앞면에서 보면 ①O → ②CH₂CH₃ → ③CH₃이 시계 방향이므로 앞면이 Re 면, 뒷면이 Si 면이다. Re 면 쪽에서 H⁻가 붙으면 (S)-뷰탄-2-올(오른쪽), Si 면 쪽에서 붙으면 (R)-뷰탄-2-올(왼쪽)이 생긴다. NaBH₄는 두 면을 같은 비율로 공격해 라세미체를, 효소·카이랄 촉매는 한 면을 골라 한 거울상을 준다.</desc>
