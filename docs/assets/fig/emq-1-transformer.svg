  <text x="600.0" y="40.0" text-anchor="middle" style="font-size:14px;fill:var(--fig-ink);font-weight:700">2차 코일</text>
  <text x="600.0" y="274.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-ink)">N₂ = 5회, V₂</text>
  <text x="360.0" y="298.0" text-anchor="middle" style="font-size:14px;fill:var(--fig-ink);font-weight:600">V₁ : V₂ = N₁ : N₂,  이상적이면 V₁I₁ = V₂I₂</text>
  <text x="360.0" y="318.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-muted)">직류를 넣으면 선속이 변하지 않아 2차 코일에 전압이 생기지 않는다</text>
</svg>
