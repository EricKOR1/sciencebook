<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 326" role="img" aria-labelledby="t-emq-1-transformer d-emq-1-transformer">
  <title id="t-emq-1-transformer">그림 전자기와 양자 1-5 변압기의 구조 — 상호 유도</title>
  <desc id="d-emq-1-transformer">철심 하나에 1차 코일(감은 수 N₁)과 2차 코일(감은 수 N₂)을 감는다. 1차 코일에 교류를 흘리면 계속 변하는 자기선속이 철심을 따라 2차 코일을 지나며 기전력을 유도한다. 두 코일의 전압비는 감은 수의 비와 같다. 그림은 감은 수 10회와 5회인 모식도이다.</desc>
  <path d="M210 50 H510 V250 H210 Z M250 90 V210 H470 V90 Z" style="fill:var(--fig-soft-violet);stroke:var(--fig-line);stroke-width:1.5;fill-rule:evenodd"/>
  <text x="360.0" y="42.0" text-anchor="middle" style="font-size:14px;fill:var(--fig-violet);font-weight:700">철심</text>
  <path d="M230 70 H490 V230 H230 Z" style="fill:none;stroke:var(--fig-violet);stroke-width:2;stroke-dasharray:6 5"/>
  <path d="M360.0 70.0 L349.0 75.0 L349.0 65.0 Z" style="fill:var(--fig-violet)"/>
  <path d="M490.0 150.0 L485.1 139.0 L494.9 139.0 Z" style="fill:var(--fig-violet)"/>
  <path d="M360.0 230.0 L371.0 225.1 L371.0 234.9 Z" style="fill:var(--fig-violet)"/>
  <path d="M230.0 150.0 L234.9 161.0 L225.1 161.0 Z" style="fill:var(--fig-violet)"/>
  <text x="360.0" y="124.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-violet)">변하는 자기선속 Φ</text>
  <text x="360.0" y="142.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-violet)">(1차·2차 코일을 똑같이 지난다)</text>
