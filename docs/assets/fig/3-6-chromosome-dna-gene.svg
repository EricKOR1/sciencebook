<title id="t-3-6-chromosome-dna-gene">그림 3-6-1 세포, 염색체, DNA, 유전자의 관계</title>
<desc id="d-3-6-chromosome-dna-gene">핵 속의 염색체는 DNA가 히스톤 등 단백질에 감겨 응축된 구조이고, 유전자는 DNA 중 특정 단백질 정보를 담은 구간이며 그 정보는 염기 서열로 저장된다. 모식도(크기 비율은 실제와 다름).</desc>
