<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="t-pchem-9-hf-mo d-pchem-9-hf-mo">
  <title id="t-pchem-9-hf-mo">그림 물리화학 9-12 HF의 분자 오비탈 준위도 (예제 15의 값)</title>
  <desc id="d-pchem-9-hf-mo">H 1s(−13.6 eV)와 F 2pz(−17.4 eV)가 섞여 σ 결합성(−19.9 eV, 전자가 F에 72 %, H에 28 %)과 σ* 반결합성(−11.1 eV)을 만든다. F 2px, 2py는 H에 같은 대칭의 짝이 없어 −17.4 eV의 비결합성 π 오비탈로 남고, F 2s(약 −40 eV, 축을 끊어 그림)는 거의 섞이지 않는다. 원자가 전자 8개가 σ(2s 성격), σ, π×2를 채운다.</desc>
