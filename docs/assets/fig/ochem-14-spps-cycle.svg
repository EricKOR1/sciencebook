<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="t-ochem-14-spps-cycle d-ochem-14-spps-cycle">
  <title id="t-ochem-14-spps-cycle">그림 유기화학 14-11 Fmoc/tBu 고체상 펩타이드 합성의 한 사이클</title>
  <desc id="d-ochem-14-spps-cycle">모식도. 폴리스타이렌–링커 수지 알갱이(회색 공)에 C-말단이 에스터로 묶인 Fmoc-AA₁에서 시작해 ① 20 % 피페리딘/DMF로 Fmoc 제거 → ② 세척 → ③ Fmoc-AA₂-OH + DIC/HOBt로 짝지음 → ④ 세척을 되풀이한다. 사슬은 C-말단(수지)에서 N-말단 쪽으로 자란다. 곁사슬 보호기(tBu, 주황 네모)는 산에서만 떨어진다. n번 되풀이한 뒤 TFA/H₂O/TIS로 처리하면 곁사슬 보호기 제거와 수지에서 떼어 내기가 한 번에 일어나 자유 펩타이드 H-AAₙ-…-AA₁-OH가 나오고, 떨어진 tBu⁺는 청소제가 가로챈다.</desc>
