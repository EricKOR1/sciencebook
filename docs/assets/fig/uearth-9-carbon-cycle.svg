<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-uearth-9-carbon-cycle d-uearth-9-carbon-cycle">
  <title id="t-uearth-9-carbon-cycle">그림 일반지구과학 9-3 탄소 순환의 저장고와 흐름</title>
  <desc id="d-uearth-9-carbon-cycle">저장고의 탄소량(GtC)과 해마다의 흐름(GtC/년)을 나타냈다. 육상 광합성과 호흡·분해(각 약 120), 대기와 해양 사이의 교환(각 방향 약 80)은 거의 균형을 이룬다. 화석 연료와 토지 이용으로 해마다 약 11 GtC가 대기로 더해지며, 그 가운데 약 45 %는 대기에 남고 약 25 %는 해양, 약 30 %는 육상 생태계가 흡수한다. 상자 크기는 탄소량에 비례하지 않는다.</desc>
  <style>
    .uearth-9-carbon-cycle-h{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .uearth-9-carbon-cycle-t{font-size:13px;fill:var(--fig-ink)}
    .uearth-9-carbon-cycle-b{font-size:13px;font-weight:600;fill:var(--fig-ink)}
    .uearth-9-carbon-cycle-s{font-size:13px;fill:var(--fig-muted)}
    .uearth-9-carbon-cycle-ax{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .uearth-9-carbon-cycle-grid{fill:none;stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 4}
  </style>
  <rect x="250.0" y="14.0" width="220.0" height="64.0" rx="8" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.6"/>
  <text x="360.0" y="34.0" text-anchor="middle" class="uearth-9-carbon-cycle-b" style="fill:var(--fig-amber)">대기</text>
  <text x="360.0" y="52.0" text-anchor="middle" class="uearth-9-carbon-cycle-t">약 870 (산업화 이전 약 590)</text>
  <rect x="16.0" y="160.0" width="180.0" height="60.0" rx="8" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.6"/>
  <text x="106.0" y="180.0" text-anchor="middle" class="uearth-9-carbon-cycle-b" style="fill:var(--fig-green)">육상 식생</text>
  <text x="106.0" y="198.0" text-anchor="middle" class="uearth-9-carbon-cycle-t">약 450~650</text>
  <rect x="16.0" y="240.0" width="180.0" height="60.0" rx="8" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.6"/>
  <text x="106.0" y="260.0" text-anchor="middle" class="uearth-9-carbon-cycle-b" style="fill:var(--fig-green)">토양</text>
  <text x="106.0" y="278.0" text-anchor="middle" class="uearth-9-carbon-cycle-t">약 1500~2400</text>
  <rect x="16.0" y="320.0" width="180.0" height="60.0" rx="8" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.6"/>
  <text x="106.0" y="340.0" text-anchor="middle" class="uearth-9-carbon-cycle-b" style="fill:var(--fig-teal)">영구 동토</text>
  <text x="106.0" y="358.0" text-anchor="middle" class="uearth-9-carbon-cycle-t">약 1400~1700</text>
  <rect x="500.0" y="176.0" width="204.0" height="92.0" rx="8" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6"/>
  <text x="602.0" y="196.0" text-anchor="middle" class="uearth-9-carbon-cycle-b" style="fill:var(--fig-blue)">해양</text>
  <text x="602.0" y="214.0" text-anchor="middle" class="uearth-9-carbon-cycle-t">약 38000</text>
  <text x="602.0" y="231.0" text-anchor="middle" class="uearth-9-carbon-cycle-t">(대부분 심층의 용존 무기 탄소)</text>
  <rect x="266.0" y="300.0" width="188.0" height="60.0" rx="8" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.6"/>
  <text x="360.0" y="320.0" text-anchor="middle" class="uearth-9-carbon-cycle-b" style="fill:var(--fig-violet)">화석 연료 매장량</text>
  <text x="360.0" y="338.0" text-anchor="middle" class="uearth-9-carbon-cycle-t">약 1000~2000</text>
  <rect x="266.0" y="390.0" width="188.0" height="60.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.6"/>
  <text x="360.0" y="410.0" text-anchor="middle" class="uearth-9-carbon-cycle-b" style="fill:var(--fig-ink)">퇴적암(탄산염·유기 탄소)</text>
  <text x="360.0" y="428.0" text-anchor="middle" class="uearth-9-carbon-cycle-t">수천만</text>
  <path d="M262.0 60.0 Q150.0 80.0 110.0 156.0" style="fill:none;stroke:var(--fig-green);stroke-width:2.6"/>
  <path d="M110.0 156.0 L110.8 146.0 L117.7 149.7 Z" style="fill:var(--fig-green)"/>
  <text x="150.0" y="96.0" text-anchor="middle" class="uearth-9-carbon-cycle-b" style="fill:var(--fig-green)">광합성 약 120</text>
  <path d="M196.0 262.0 Q250.0 170.0 300.0 82.0" style="fill:none;stroke:var(--fig-muted);stroke-width:2.6"/>
  <path d="M300.0 82.0 L298.8 91.9 L292.1 88.1 Z" style="fill:var(--fig-muted)"/>
  <text x="262.0" y="214.0" class="uearth-9-carbon-cycle-t">호흡·분해</text>
  <text x="262.0" y="230.0" class="uearth-9-carbon-cycle-t">약 120</text>
  <path d="M470.0 40.0 Q590.0 60.0 600.0 172.0" style="fill:none;stroke:var(--fig-blue);stroke-width:2.6"/>
  <path d="M600.0 172.0 L595.3 163.2 L603.1 162.5 Z" style="fill:var(--fig-blue)"/>
  <text x="662.0" y="112.0" text-anchor="middle" class="uearth-9-carbon-cycle-b" style="fill:var(--fig-blue)">대기 → 해양</text>
  <text x="662.0" y="128.0" text-anchor="middle" class="uearth-9-carbon-cycle-b" style="fill:var(--fig-blue)">약 80</text>
  <path d="M540.0 174.0 Q520.0 110.0 472.0 72.0" style="fill:none;stroke:var(--fig-muted);stroke-width:2.2"/>
  <path d="M472.0 72.0 L481.6 74.7 L476.8 80.8 Z" style="fill:var(--fig-muted)"/>
  <text x="470.0" y="126.0" text-anchor="end" class="uearth-9-carbon-cycle-t">해양 → 대기</text>
  <text x="470.0" y="142.0" text-anchor="end" class="uearth-9-carbon-cycle-t">약 80</text>
  <line x1="360.0" y1="298.0" x2="360.0" y2="96.0" style="stroke:var(--fig-red);stroke-width:4.5"/>
  <path d="M360.0 82.0 L353.0 96.0 L367.0 96.0 Z" style="fill:var(--fig-red)"/>
  <text x="372.0" y="170.0" class="uearth-9-carbon-cycle-b" style="fill:var(--fig-red)">인위적 배출</text>
  <text x="372.0" y="188.0" class="uearth-9-carbon-cycle-b" style="fill:var(--fig-red)">약 11 GtC/년</text>
  <text x="372.0" y="206.0" class="uearth-9-carbon-cycle-s">(화석 연료+토지 이용)</text>
  <rect x="490.0" y="300.0" width="214.0" height="124.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-red);stroke-width:1.4;stroke-dasharray:5 3"/>
  <text x="597.0" y="322.0" text-anchor="middle" class="uearth-9-carbon-cycle-b">인위적 탄소의 행방(2010년대)</text>
  <rect x="500.0" y="340.0" width="72.0" height="14.0" style="fill:var(--fig-amber)"/>
  <text x="578.0" y="352.0" class="uearth-9-carbon-cycle-t" style="font-size:12px">대기에 남음 45 %</text>
  <rect x="500.0" y="362.0" width="40.0" height="14.0" style="fill:var(--fig-blue)"/>
  <text x="546.0" y="374.0" class="uearth-9-carbon-cycle-t" style="font-size:12px">해양 흡수 25 %</text>
  <rect x="500.0" y="384.0" width="48.0" height="14.0" style="fill:var(--fig-green)"/>
  <text x="554.0" y="396.0" class="uearth-9-carbon-cycle-t" style="font-size:12px">육상 생태계 흡수 30 %</text>
  <text x="597.0" y="412.0" text-anchor="middle" class="uearth-9-carbon-cycle-s">→ 대기 CO₂ 해마다 약 2.3 ppm 증가</text>
  <text x="16.0" y="410.0" class="uearth-9-carbon-cycle-s">저장고: GtC</text>
  <text x="16.0" y="428.0" class="uearth-9-carbon-cycle-s">흐름: GtC/년</text>
  <text x="16.0" y="446.0" class="uearth-9-carbon-cycle-s">상자 크기는 탄소량과 무관</text>
</svg>
