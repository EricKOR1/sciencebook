<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="t-3-6-substitution-effects d-3-6-substitution-effects">
  <title id="t-3-6-substitution-effects">그림 3-6-5 mRNA 염기 하나가 바뀔 때 생길 수 있는 세 가지 결과</title>
  <desc id="d-3-6-substitution-effects">같은 mRNA에서 염기 하나만 바뀌어도 (가) 같은 아미노산을 지정해 단백질이 그대로이거나, (나) 아미노산 하나가 바뀌거나, (다) 종결 코돈이 생겨 단백질이 짧아질 수 있다. 빨간 글자가 바뀐 염기이다.</desc>
  <style>
    .f3-6-substitution-effects-lbl{font-size:15px;fill:var(--fig-ink)} .f3-6-substitution-effects-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .f3-6-substitution-effects-sm{font-size:13px;fill:var(--fig-muted)} .f3-6-substitution-effects-ink{font-size:13px;fill:var(--fig-ink)}
    .f3-6-substitution-effects-ax{stroke:var(--fig-ink);stroke-width:1.5;fill:none} .f3-6-substitution-effects-grid{stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 4;fill:none}
  </style>
