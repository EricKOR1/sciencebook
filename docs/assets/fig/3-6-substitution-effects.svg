/text><text x="643" y="414" text-anchor="middle" class="f3-6-substitution-effects-sm">(번역 안 됨)</text><text x="360" y="448" text-anchor="middle" class="f3-6-substitution-effects-sm">위 칸: mRNA 코돈, 아래 칸: 지정하는 아미노산. 종결 코돈 뒤의 코돈은 번역되지 않는다.</text></svg>
