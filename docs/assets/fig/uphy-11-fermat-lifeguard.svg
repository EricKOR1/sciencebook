<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 345" role="img" aria-labelledby="t-uphy-11-fermat-lifeguard d-uphy-11-fermat-lifeguard">
  <title id="t-uphy-11-fermat-lifeguard">그림 일반물리학 11-1 페르마 원리 — 구조 요원이 고르는 가장 빠른 경로</title>
  <desc id="d-uphy-11-fermat-lifeguard">모래 위의 구조 요원 P가 물속의 Q로 갈 때, 거리가 가장 짧은 직선 경로보다 빠른 모래 위를 조금 더 달리고 느린 물속 거리를 줄인 경로가 시간이 가장 짧다. 경계를 지나는 위치 x에 따른 이동 시간 t(x)는 한 곳에서 최소가 되며, 그 조건 dt/dx = 0이 sinθ₁/v₁ = sinθ₂/v₂, 곧 굴절 법칙이다. 여기서는 v₁ = 2v₂로 그렸다.</desc>
