    .u11a-t{font-size:14px;fill:var(--fig-ink)} .u11a-tb{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .u11a-s{font-size:13px;fill:var(--fig-muted)} .u11a-sm{font-size:13px;fill:var(--fig-ink)}
    .u11a-ax{stroke:var(--fig-ink);stroke-width:1.5;fill:none} .u11a-grid{stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4;fill:none}
  </style>
