<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-rxn-3-functional-groups d-rxn-3-functional-groups">
  <title id="t-rxn-3-functional-groups">그림 화학 반응의 세계 3-1 알코올·알데하이드·카복실산의 구조식과 작용기</title>
  <desc id="d-rxn-3-functional-groups">탄소 2개짜리 세 화합물의 구조식이다. 노란 상자가 작용기로, 에탄올은 하이드록시기(−OH), 에탄알은 폼일기(−CHO: C=O 이중 결합 + H), 에탄산은 카복실기(−COOH: C=O 이중 결합 + O−H)를 가진다. 작용기 탄소의 산화수는 −1, +1, +3으로 커진다.</desc>
