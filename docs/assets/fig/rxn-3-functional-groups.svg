    .rxn-3-functional-groups-T{font-size:15px;fill:var(--fig-ink);font-weight:700}
    .rxn-3-functional-groups-f{font-size:14px;fill:var(--fig-ink);font-weight:600}
    .rxn-3-functional-groups-k{font-size:13px;fill:var(--fig-ink)}
    .rxn-3-functional-groups-s{font-size:13px;fill:var(--fig-muted)}
    .rxn-3-functional-groups-b{font-size:15px;fill:var(--fig-ink);font-weight:600}
