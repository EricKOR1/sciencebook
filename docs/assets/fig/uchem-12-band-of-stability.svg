<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-uchem-12-band-of-stability d-uchem-12-band-of-stability">
  <title id="t-uchem-12-band-of-stability">그림 일반화학 12-1 핵 안정 띠와 붕괴 방향</title>
  <desc id="d-uchem-12-band-of-stability">가로축은 양성자 수 Z, 세로축은 중성자 수 N이다. 안정한 핵(초록 띠)은 가벼운 원소에서 N = Z 선 근처에 있다가 무거워질수록 N/Z가 1.5 정도까지 커지며, Z가 83보다 크면 안정 핵이 없다. 띠 위쪽(중성자 과잉) 핵은 β⁻ 붕괴, 아래쪽(양성자 과잉) 핵은 β⁺ 붕괴나 전자 포획, 아주 무거운 핵은 α 붕괴로 띠 쪽으로 다가간다(띠 모양은 모식도).</desc>
