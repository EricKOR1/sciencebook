<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-pchem-12-t-jump-relaxation d-pchem-12-t-jump-relaxation">
  <title id="t-pchem-12-t-jump-relaxation">그림 물리화학 12-3 온도 도약 뒤의 이완 곡선</title>
  <desc id="d-pchem-12-t-jump-relaxation">t &lt; 0에서는 처음 온도의 평형 농도에 머물던 [C]가, t = 0에 수 μs 동안 온도를 올리면 새 온도의 더 낮은 평형값(점선)으로 [C] − [C]eq,새 ∝ e^(−t/τ)를 따라 지수적으로 이완한다(τ = 36 μs). t = τ에서 편차는 처음 편차의 1/e = 0.37이다. 오른쪽 끼움 그래프는 여러 평형 농도에서 잰 1/τ를 ([A]eq + [B]eq)에 대해 그린 직선으로, 기울기가 k₁, 절편이 k₋₁이다(모식도, 눈금 없음).</desc>
