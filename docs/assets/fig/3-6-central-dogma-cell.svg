<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 366" role="img" aria-labelledby="t-3-6-central-dogma-cell d-3-6-central-dogma-cell">
<title id="t-3-6-central-dogma-cell">그림 3-6-2 세포 속 유전 정보의 흐름과 장소</title>
<desc id="d-3-6-central-dogma-cell">핵 속에서 DNA는 복제되고, 유전자의 정보는 mRNA로 전사된다. mRNA는 핵공을 지나 세포질로 나가 리보솜에서 번역되어 아미노산 사슬(단백질)이 만들어진다. 모식도(크기 비율은 실제와 다름).</desc>
