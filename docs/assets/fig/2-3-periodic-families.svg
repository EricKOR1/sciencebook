<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" role="img" aria-labelledby="t-2-3-periodic-families d-2-3-periodic-families">
  <title id="t-2-3-periodic-families">그림 2-3-1 원자 번호 1~20번 원소의 간이 주기율표</title>
  <desc id="d-2-3-periodic-families">가로줄은 주기, 세로줄은 족이다. 1족(수소 제외)은 알칼리 금속, 17족은 할로젠, 18족은 비활성 기체이며 같은 족 원소는 화학적 성질이 비슷하다. 3~12족은 4주기부터 나타나므로 생략하였다.</desc>
