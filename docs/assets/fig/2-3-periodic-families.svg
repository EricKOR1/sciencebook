    .ptf-lbl{font-size:15px;fill:var(--fig-ink)} .ptf-sm{font-size:13px;fill:var(--fig-muted)}
    .ptf-ink{fill:var(--fig-ink)} .ptf-mut{fill:var(--fig-muted)} .ptf-b{font-weight:600}
    .ptf-night{fill:var(--fig-ink)}
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ptf-night{fill:var(--fig-paper)} }
    :root[data-theme="dark"] .ptf-night{fill:var(--fig-paper)}
  </style>
