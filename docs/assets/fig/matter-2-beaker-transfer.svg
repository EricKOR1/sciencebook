<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-matter-2-beaker-transfer d-matter-2-beaker-transfer">
  <title id="t-matter-2-beaker-transfer">그림 물질과 에너지 2-5 밀폐된 상자 속 물과 설탕물</title>
  <desc id="d-matter-2-beaker-transfer">밀폐된 상자 안에 순수한 물이 든 비커 A와 진한 설탕물이 든 비커 B를 함께 두면, 며칠 뒤 A의 물은 줄고 B의 설탕물은 늘어난다. 증기 압력이 큰 A에서 증발한 물 분자가 증기 압력이 작은 B로 응축되기 때문이다. 모식도이다.</desc>
  <style>
    .matter-2-beaker-transfer-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
    .matter-2-beaker-transfer-gr{fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4}
    .matter-2-beaker-transfer-l{font-size:14px;fill:var(--fig-ink)}
    .matter-2-beaker-transfer-t{font-size:13px;fill:var(--fig-muted)}
    .matter-2-beaker-transfer-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .matter-2-beaker-transfer-ink{fill:var(--fig-ink)}
    .matter-2-beaker-transfer-gl{fill:none;stroke:var(--fig-ink);stroke-width:2.2}
    .matter-2-beaker-transfer-bk{fill:none;stroke:var(--fig-ink);stroke-width:2.4;stroke-linejoin:round}
  </style>
  <text x="185" y="28" text-anchor="middle" class="matter-2-beaker-transfer-h">처음</text>
  <rect x="30" y="50" width="310" height="220" style="fill:var(--fig-panel)"/>
  <rect x="30" y="50" width="310" height="220" rx="8" class="matter-2-beaker-transfer-gl"/>
  <line x1="20" y1="270" x2="350" y2="270" style="stroke:var(--fig-muted);stroke-width:3"/>
  <rect x="70" y="192" width="90" height="70" style="fill:var(--fig-soft-blue)"/>
  <path d="M70 150 L70 262 L160 262 L160 150" class="matter-2-beaker-transfer-bk"/>
  <text x="115" y="292" text-anchor="middle" class="matter-2-beaker-transfer-l">A 순수한 물</text>
  <rect x="210" y="192" width="90" height="70" style="fill:var(--fig-soft-amber)"/>
  <circle cx="252.3" cy="220.9" r="3.4" style="fill:var(--fig-amber)"/>
  <circle cx="228.3" cy="248.5" r="3.4" style="fill:var(--fig-amber)"/>
  <circle cx="218.5" cy="228.2" r="3.4" style="fill:var(--fig-amber)"/>
  <circle cx="284.5" cy="204.5" r="3.4" style="fill:var(--fig-amber)"/>
  <circle cx="259" cy="234.5" r="3.4" style="fill:var(--fig-amber)"/>
  <circle cx="270.1" cy="225.3" r="3.4" style="fill:var(--fig-amber)"/>
  <circle cx="271.7" cy="208.8" r="3.4" style="fill:var(--fig-amber)"/>
  <path d="M210 150 L210 262 L300 262 L300 150" class="matter-2-beaker-transfer-bk"/>
  <text x="255" y="292" text-anchor="middle" class="matter-2-beaker-transfer-l">B 진한 설탕물</text>
  <line x1="350" y1="160" x2="362" y2="160" style="stroke:var(--fig-muted);stroke-width:2.5;stroke-linecap:round"/>
  <path d="M372 160 L362 155 L362 165 Z" style="fill:var(--fig-muted)"/>
  <text x="540" y="28" text-anchor="middle" class="matter-2-beaker-transfer-h">며칠 뒤</text>
  <rect x="385" y="50" width="310" height="220" style="fill:var(--fig-panel)"/>
  <rect x="385" y="50" width="310" height="220" rx="8" class="matter-2-beaker-transfer-gl"/>
  <line x1="375" y1="270" x2="705" y2="270" style="stroke:var(--fig-muted);stroke-width:3"/>
  <rect x="425" y="224" width="90" height="38" style="fill:var(--fig-soft-blue)"/>
  <path d="M425 150 L425 262 L515 262 L515 150" class="matter-2-beaker-transfer-bk"/>
  <text x="470" y="292" text-anchor="middle" class="matter-2-beaker-transfer-l">A 순수한 물</text>
  <rect x="565" y="166" width="90" height="96" style="fill:var(--fig-soft-amber)"/>
  <circle cx="590.6" cy="183.1" r="3.4" style="fill:var(--fig-amber)"/>
  <circle cx="610.5" cy="249.8" r="3.4" style="fill:var(--fig-amber)"/>
  <circle cx="616.7" cy="237.5" r="3.4" style="fill:var(--fig-amber)"/>
  <circle cx="601.4" cy="235.2" r="3.4" style="fill:var(--fig-amber)"/>
  <circle cx="580.5" cy="197.9" r="3.4" style="fill:var(--fig-amber)"/>
  <circle cx="604.2" cy="181.2" r="3.4" style="fill:var(--fig-amber)"/>
  <circle cx="587.8" cy="246.7" r="3.4" style="fill:var(--fig-amber)"/>
  <circle cx="638.1" cy="178.5" r="3.4" style="fill:var(--fig-amber)"/>
  <circle cx="601" cy="214.3" r="3.4" style="fill:var(--fig-amber)"/>
  <circle cx="617.2" cy="183.9" r="3.4" style="fill:var(--fig-amber)"/>
  <path d="M565 150 L565 262 L655 262 L655 150" class="matter-2-beaker-transfer-bk"/>
  <text x="610" y="292" text-anchor="middle" class="matter-2-beaker-transfer-l">B 진한 설탕물</text>
  <path d="M470 128 Q540 70 607 124" style="fill:none;stroke:var(--fig-blue);stroke-width:2.6;stroke-dasharray:6 5"/>
  <path d="M610 132 l-1 -14 l-11 8 z" style="fill:var(--fig-blue)"/>
  <text x="540" y="80" text-anchor="middle" class="matter-2-beaker-transfer-t" style="fill:var(--fig-blue);font-weight:700">수증기</text>
  <text x="360" y="320" text-anchor="middle" class="matter-2-beaker-transfer-t">증기 압력: A(순수한 물) &gt; B(설탕물) → A에서 증발한 물이 B에서 응축한다</text>
</svg>
