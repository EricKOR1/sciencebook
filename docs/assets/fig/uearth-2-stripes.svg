<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-uearth-2-stripes d-uearth-2-stripes">
  <title id="t-uearth-2-stripes">그림 일반지구과학 2-2 해령의 대칭 자기 줄무늬와 지자기 역전 연대표</title>
  <desc id="d-uearth-2-stripes">해령 축에서 굳은 현무암이 그때의 자기장 방향을 기록하고 양쪽으로 멀어져, 해령을 축으로 거울 대칭인 정자극기·역자극기 띠가 생긴다. 반확장 속도 2.5 cm/년이면 거리(km) = 25 × 나이(백만 년)이므로, 줄무늬의 폭 순서가 육상 용암으로 구한 역전 연대표와 같다.</desc>
