    .3-5-ph-optimum-ax{stroke:var(--fig-ink);stroke-width:1.5;fill:none} .3-5-ph-optimum-grid{stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 4;fill:none}
  </style>
