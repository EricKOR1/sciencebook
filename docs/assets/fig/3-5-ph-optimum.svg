<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-3-5-ph-optimum d-3-5-ph-optimum">
  <title id="t-3-5-ph-optimum">그림 3-5-6 효소마다 다른 최적 pH</title>
  <desc id="d-3-5-ph-optimum">펩신은 pH 약 2, 침 속 아밀레이스는 pH 약 7, 트립신은 pH 약 8에서 가장 잘 작용한다. 최적 pH에서 멀어지면 입체 구조가 변해 활성이 떨어진다. 곡선의 폭과 높이는 설명을 위한 모식도이다.</desc>
