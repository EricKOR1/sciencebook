<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="t-uearth-6-wave-shoaling d-uearth-6-wave-shoaling">
<title id="t-uearth-6-wave-shoaling">그림 일반지구과학 6-10 심해파에서 천해파로 — 물 입자의 운동과 쇄파</title>
<desc id="d-uearth-6-wave-shoaling">깊은 바다(수심 > 파장의 1/2)에서 물 입자는 원운동을 하며 그 반지름은 깊이에 따라 빠르게 줄어 파장의 1/2 깊이에서 거의 0이 된다. 얕은 바다(수심 &lt; 파장의 1/20)에서는 입자가 바닥까지 납작한 타원 운동을 하고 바닥에서는 앞뒤로만 움직인다. 해안으로 갈수록 주기는 그대로이지만 속력과 파장이 줄고 파고가 커져(천수 변형), 파고가 수심의 약 0.8배에 이르면 부서진다. 모식도이다.</desc>
