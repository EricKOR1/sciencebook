<text x="360" y="600" text-anchor="middle" class="umath-7-accuracy-precision-s">과녁 중심 = 참값, 빨간 점 = 측정값 8개, × = 측정값의 평균, 노란 화살표 = 평균의 어긋남(계통 오차)</text>
</svg>
