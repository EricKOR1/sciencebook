<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 615" role="img" aria-labelledby="t-umath-7-accuracy-precision d-umath-7-accuracy-precision">
  <title id="t-umath-7-accuracy-precision">그림 수학 도구 7-8 정확도와 정밀도 — 계통 오차와 우연 오차</title>
  <desc id="d-umath-7-accuracy-precision">과녁 중심을 참값, 점을 반복 측정값으로 본 모식도. (가) 점이 중심에 촘촘히, (나) 중심에서 벗어난 한곳에 촘촘히(계통 오차), (다) 평균은 중심이지만 넓게 흩어짐(우연 오차), (라) 벗어난 곳 주위로 넓게 흩어짐. 점들이 모인 정도가 정밀도, 평균(×)이 중심에 가까운 정도가 정확도이다.</desc>
  <style>
    .umath-7-accuracy-precision-ax{stroke:var(--fig-ink);stroke-width:1.3;fill:none}
    .umath-7-accuracy-precision-grid{stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:2 4;fill:none;opacity:0.7}
    .umath-7-accuracy-precision-tk{font-size:13px;fill:var(--fig-muted)}
    .umath-7-accuracy-precision-lb{font-size:14px;fill:var(--fig-ink)}
    .umath-7-accuracy-precision-t{font-size:14px;fill:var(--fig-ink)}
    .umath-7-accuracy-precision-tb{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .umath-7-accuracy-precision-s{font-size:13px;fill:var(--fig-muted)}
    .umath-7-accuracy-precision-ink{fill:var(--fig-ink)}
    .umath-7-accuracy-precision-r1{fill:var(--fig-soft-blue);stroke:var(--fig-line);stroke-width:1}
    .umath-7-accuracy-precision-r2{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1}
    .umath-7-accuracy-precision-hit{fill:var(--fig-red);stroke:var(--fig-panel);stroke-width:1.2}
    .umath-7-accuracy-precision-mean{stroke:var(--fig-ink);stroke-width:2.6;stroke-linecap:round;fill:none}
    .umath-7-accuracy-precision-sys{stroke:var(--fig-amber);stroke-width:2.4;fill:none}
    .umath-7-accuracy-precision-amb{font-size:13px;font-weight:600;fill:var(--fig-amber)}
    .umath-7-accuracy-precision-ok{font-size:13px;fill:var(--fig-green)}
    .umath-7-accuracy-precision-no{font-size:13px;fill:var(--fig-red)}
  </style>
  <defs>
    <marker id="umath-7-accuracy-precision-ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-amber)"/></marker>
  </defs>
<text x="190" y="32" text-anchor="middle" class="umath-7-accuracy-precision-tb">(가) 정확 · 정밀</text>
