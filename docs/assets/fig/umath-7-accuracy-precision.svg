<text x="530" y="322" text-anchor="middle" class="umath-7-accuracy-precision-tb">(라) 부정확 · 부정밀</text>
<circle cx="530" cy="440" r="100" class="umath-7-accuracy-precision-r1"/>
<circle cx="530" cy="440" r="75" class="umath-7-accuracy-precision-r2"/>
