<text x="526" y="124" text-anchor="end" class="umath-7-accuracy-precision-amb">계통 오차</text>
<text x="530" y="274" text-anchor="middle"><tspan class="umath-7-accuracy-precision-no">계통 오차 큼</tspan><tspan class="umath-7-accuracy-precision-s"> · </tspan><tspan class="umath-7-accuracy-precision-ok">우연 오차 작음</tspan></text>
