  <text x="140" y="340" text-anchor="middle" class="m2-08-balloon-s">스티커 = 은하</text>
  <text x="360" y="424" text-anchor="middle" class="m2-08-balloon-t">어느 스티커에서 보아도 다른 스티커가 멀어지고, 중심이 되는 스티커는 없다</text>
