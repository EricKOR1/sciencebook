  <text x="270" y="232" text-anchor="middle" class="m2-08-balloon-t">풍선을 분다</text><text x="270" y="250" text-anchor="middle" class="m2-08-balloon-s">(우주 팽창)</text>
  <text x="150" y="330" text-anchor="middle" class="m2-08-balloon-s">스티커 = 은하</text>
  <text x="470" y="390" text-anchor="middle" class="m2-08-balloon-t">어느 스티커에서 보아도 다른 스티커가 멀어지고, 중심이 되는 스티커는 없다</text>
  <text x="470" y="410" text-anchor="middle" class="m2-08-balloon-s">스티커(은하) 자체의 크기는 변하지 않는다</text>
