  <title id="t-phy-1-motion-graphs">그림 물리학 1-6 등속 운동과 등가속도 운동의 그래프</title>
  <desc id="d-phy-1-motion-graphs">위 줄은 등속 운동, 아래 줄은 속력이 일정하게 증가하는 등가속도 운동의 가속도–시간, 속도–시간, 위치–시간 그래프이다. 속도–시간 그래프의 기울기는 가속도, 그래프 아래 넓이는 변위이다.</desc>
