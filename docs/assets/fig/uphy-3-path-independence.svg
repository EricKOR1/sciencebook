<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-uphy-3-path-independence d-uphy-3-path-independence">
  <title id="t-uphy-3-path-independence">그림 일반물리학 3-2 보존력과 비보존력 — 경로에 따라 일이 달라지는가</title>
  <desc id="d-uphy-3-path-independence">(가) 물체를 A에서 높이 h인 B까지 옮길 때 연직으로 올린 뒤 수평으로 가든(경로 1), 빗면을 따라가든(경로 2), 굽은 길을 가든(경로 3) 중력이 한 일은 모두 −mgh이다. 연직 높이 변화만 일에 기여하기 때문이다. (나) 운동 마찰력은 언제나 운동의 반대 방향이라 A에서 B로 갔다가 돌아오면 일이 −fk d씩 두 번 더해져 −2fk d가 된다. 한 바퀴 돈 일이 0이 아니므로 마찰력은 보존력이 아니다.</desc>
