<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-mech-1-vector-components d-mech-1-vector-components">
  <title id="t-mech-1-vector-components">그림 역학과 에너지 1-3 벡터의 성분 분해와 합성</title>
  <desc id="d-mech-1-vector-components">(가) 크기 F이고 x축과 각 θ를 이루는 힘은 x성분 F cosθ와 y성분 F sinθ로 나뉜다. (나) 동쪽 60 N과 북쪽 80 N의 두 힘을 평행사변형법으로 더하면 동쪽에서 북쪽으로 약 53° 방향의 100 N 합력이 된다.</desc>
  <rect x="10.0" y="10.0" width="345.0" height="320.0" rx="10" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <rect x="365.0" y="10.0" width="345.0" height="320.0" rx="10" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <text x="26.0" y="36.0" style="font-size:15px;fill:var(--fig-ink);font-weight:600">(가) 성분으로 나누기</text>
  <text x="381.0" y="36.0" style="font-size:15px;fill:var(--fig-ink);font-weight:600">(나) 두 힘의 합성(평행사변형법)</text>
  <line x1="50.0" y1="280.0" x2="321.0" y2="280.0" style="stroke:var(--fig-line);stroke-width:1.5;fill:none"/>
  <path d="M330.0 280.0 L321.0 284.5 L321.0 275.5 Z" style="fill:var(--fig-line);stroke:none"/>
  <text x="322.0" y="302.0" style="font-size:14px;fill:var(--fig-muted)">x</text>
  <line x1="70.0" y1="300.0" x2="70.0" y2="69.0" style="stroke:var(--fig-line);stroke-width:1.5;fill:none"/>
  <path d="M70.0 60.0 L74.5 69.0 L65.5 69.0 Z" style="fill:var(--fig-line);stroke:none"/>
  <text x="52.0" y="72.0" style="font-size:14px;fill:var(--fig-muted)">y</text>
  <line x1="249.7" y1="144.6" x2="249.7" y2="280.0" style="stroke:var(--fig-line);stroke-width:1.5;fill:none;stroke-dasharray:5 4"/>
  <line x1="249.7" y1="144.6" x2="70.0" y2="144.6" style="stroke:var(--fig-line);stroke-width:1.5;fill:none;stroke-dasharray:5 4"/>
  <line x1="70.0" y1="280.0" x2="236.7" y2="280.0" style="stroke:var(--fig-red);stroke-width:4;fill:none"/>
  <path d="M249.7 280.0 L236.7 286.5 L236.7 273.5 Z" style="fill:var(--fig-red);stroke:none"/>
  <line x1="70.0" y1="280.0" x2="70.0" y2="157.6" style="stroke:var(--fig-blue);stroke-width:4;fill:none"/>
  <path d="M70.0 144.6 L76.5 157.6 L63.5 157.6 Z" style="fill:var(--fig-blue);stroke:none"/>
  <line x1="70.0" y1="280.0" x2="238.5" y2="153.0" style="stroke:var(--fig-ink);stroke-width:4;fill:none"/>
  <path d="M249.7 144.6 L242.7 158.6 L234.3 147.4 Z" style="fill:var(--fig-ink);stroke:none"/>
  <path d="M120 280 A50 50 0 0 0 109.9 249.9" style="fill:none;stroke:var(--fig-ink);stroke-width:1.5"/>
  <text x="126.0" y="268.0" style="font-size:15px;fill:var(--fig-ink)">θ</text>
  <text x="209.7" y="208.6" style="font-size:17px;fill:var(--fig-ink);font-weight:600">F</text>
  <text x="159.8" y="304.0" text-anchor="middle" style="font-size:15px;fill:var(--fig-red);font-weight:600">F<tspan dy="4" style="font-size:11px">x</tspan><tspan dy="-4"></tspan> = F cosθ</text>
  <text x="80.0" y="174.6" style="font-size:15px;fill:var(--fig-blue);font-weight:600">F<tspan dy="4" style="font-size:11px">y</tspan><tspan dy="-4"></tspan> = F sinθ</text>
  <text x="172.0" y="252.0" text-anchor="middle" style="font-size:14px;fill:var(--fig-muted)">F = √(F<tspan dy="4" style="font-size:11px">x</tspan><tspan dy="-4"></tspan>² + F<tspan dy="4" style="font-size:11px">y</tspan><tspan dy="-4"></tspan>²)</text>
  <line x1="425.0" y1="272.0" x2="517.0" y2="272.0" style="stroke:var(--fig-red);stroke-width:4;fill:none"/>
  <path d="M530.0 272.0 L517.0 278.5 L517.0 265.5 Z" style="fill:var(--fig-red);stroke:none"/>
  <line x1="425.0" y1="272.0" x2="425.0" y2="145.0" style="stroke:var(--fig-blue);stroke-width:4;fill:none"/>
  <path d="M425.0 132.0 L431.5 145.0 L418.5 145.0 Z" style="fill:var(--fig-blue);stroke:none"/>
  <line x1="530.0" y1="272.0" x2="530.0" y2="132.0" style="stroke:var(--fig-line);stroke-width:1.5;fill:none;stroke-dasharray:5 4"/>
  <line x1="425.0" y1="132.0" x2="530.0" y2="132.0" style="stroke:var(--fig-line);stroke-width:1.5;fill:none;stroke-dasharray:5 4"/>
  <line x1="425.0" y1="272.0" x2="521.0" y2="144.0" style="stroke:var(--fig-ink);stroke-width:4.5;fill:none"/>
  <path d="M530.0 132.0 L527.0 148.5 L515.0 139.5 Z" style="fill:var(--fig-ink);stroke:none"/>
  <path d="M470 272 A45 45 0 0 0 452.0 236.0" style="fill:none;stroke:var(--fig-ink);stroke-width:1.5"/>
  <text x="475.0" y="254.0" style="font-size:13px;fill:var(--fig-ink)">약 53°</text>
  <text x="477.5" y="296.0" text-anchor="middle" style="font-size:14px;fill:var(--fig-red);font-weight:600">60 N (동)</text>
  <text x="417.0" y="202.0" text-anchor="end" style="font-size:14px;fill:var(--fig-blue);font-weight:600">80 N</text>
  <text x="417.0" y="220.0" text-anchor="end" style="font-size:13px;fill:var(--fig-blue)">(북)</text>
  <text x="540.0" y="126.0" style="font-size:15px;fill:var(--fig-ink);font-weight:600">합력 100 N</text>
  <text x="540.0" y="146.0" style="font-size:13px;fill:var(--fig-muted)">√(60² + 80²)</text>
  <text x="537.0" y="320.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-muted)">대각선이 합력: 크기는 140 N이 아닌 피타고라스로</text>
</svg>
