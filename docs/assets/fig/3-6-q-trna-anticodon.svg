    .f3-6-q-trna-anticodon-ax{stroke:var(--fig-ink);stroke-width:1.5;fill:none} .f3-6-q-trna-anticodon-grid{stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 4;fill:none}
  </style>
