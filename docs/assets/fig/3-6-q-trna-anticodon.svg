  <title id="t-3-6-q-trna-anticodon">그림 3-6-6 문제 11의 tRNA와 안티코돈</title>
  <desc id="d-3-6-q-trna-anticodon">리보솜에 차례로 결합한 tRNA ①~④의 안티코돈은 UAC, CCG, AAA, GUC이다. mRNA의 염기와 아미노산은 물음표로 비워 두었다. 리보솜을 생략하고 tRNA를 나란히 그린 모식도이다.</desc>
