="562" cy="242" r="4.5" class="c1pe-ves"/><g transform="translate(360 278) rotate(-15)"><ellipse cx="0" cy="0" rx="26" ry="12" class="c1pe-mit"/><path d="M-16 -9 v9 M-8 9 v-9 M0 -9 v9 M8 9 v-9 M16 -9 v9" class="c1pe-cri"/></g><g transform="translate(505 132) rotate(10)"><ellipse cx="0" cy="0" rx="26" ry="12" class="c1pe-mit"/><path d="M-16 -9 v9 M-8 9 v-9 M0 -9 v9 M8 9 v-9 M16 -9 v9" class="c1pe-cri"/></g><circle cx="352" cy="160" r="2.6" class="c1pe-rib"/><circle cx="470" cy="268" r="2.6" class="c1pe-rib"/><circle cx="540" cy="262" r="2.6" class="c1pe-rib"/><circle cx="378" cy="128" r="2.6" class="c1pe-rib"/><circle cx="340" cy="228" r="2.6" class="c1pe-rib"/><circle cx="560" cy="170" r="2.6" class="c1pe-rib"/><path d="M540 127 L584 105" class="c1pe-lead"/><text x="590" y="110" class="c1pe-lbl">세포막</text><path d="M530 136 L584 135" class="c1pe-lead"/><text x="590" y="140" class="c1pe-lbl">미토콘드리아</text><path d="M462 162 L584 171" class="c1pe-lead"/><text x="590" y="176" class="c1pe-lbl">거친면 소포체</text><path d="M550 220 L584 217" class="c1pe-lead"/><text x="590" y="222" class="c1pe-lbl">골지체</text><path d="M543 262 L584 251" class="c1pe-lead"/><text x="590" y="256" class="c1pe-lbl">리보솜(80S)</text><path d="M432 236 L584 287" class="c1pe-lead"/><text x="590" y="292" class="c1pe-lbl">핵(2중막·핵공)</text><text x="290" y="326" class="c1pe-sub">세포벽 없음(식물은 셀룰로스, 균류는 키틴 세포벽)</text><rect x="20" y="346" width="680" height="62" rx="8" class="c1pe-box"/><text x="360" y="372" text-anchor="middle" class="c1pe-lbl" style="font-weight:600">공통점: 세포막 · 세포질 · 리보솜 · 유전 물질(DNA)</text><text x="360" y="394" text-anchor="middle" class="c1pe-sub">모식도 — 실제로는 진핵세포가 원핵세포보다 대체로 10배쯤 더 크다</text></svg>
