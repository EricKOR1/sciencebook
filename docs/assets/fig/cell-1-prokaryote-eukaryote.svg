<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-cell-1-prokaryote-eukaryote d-cell-1-prokaryote-eukaryote">
<title id="t-cell-1-prokaryote-eukaryote">그림 세포와 물질대사 1-2 원핵세포와 진핵세포</title>
<desc id="d-cell-1-prokaryote-eukaryote">원핵세포는 핵막이 없어 고리 모양 DNA가 세포질의 핵양체에 있고 막으로 된 세포 소기관이 없다. 진핵세포는 핵막으로 둘러싸인 핵과 소포체·골지체·미토콘드리아 같은 막성 소기관을 가진다. 두 세포 모두 세포막, 세포질, 리보솜, DNA를 가진다. 모식도(크기 비율은 실제와 다름).</desc>
<style>
.c1pe-wall{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2}
.c1pe-cyt{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2}
.c1pe-dna{fill:none;stroke:var(--fig-violet);stroke-width:2}
.c1pe-nucO{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2}
.c1pe-nucI{fill:none;stroke:var(--fig-violet);stroke-width:1.5}
.c1pe-pore{fill:var(--fig-soft-blue)}
.c1pe-nl{fill:var(--fig-violet)}
.c1pe-er{fill:none;stroke:var(--fig-teal);stroke-width:3;stroke-linecap:round}
.c1pe-go{fill:none;stroke:var(--fig-green);stroke-width:3.5;stroke-linecap:round}
.c1pe-ves{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.5}
.c1pe-mit{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8}
.c1pe-cri{fill:none;stroke:var(--fig-red);stroke-width:1.3}
.c1pe-rib{fill:var(--fig-ink)}
.c1pe-fl{fill:none;stroke:var(--fig-amber);stroke-width:2.2}
.c1pe-lead{fill:none;stroke:var(--fig-muted);stroke-width:1}
.c1pe-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .c1pe-sub{font-size:13px;fill:var(--fig-muted)}
.c1pe-lbl{font-size:13px;fill:var(--fig-ink)}
.c1pe-box{fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1}
.c1pe-div{stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4;fill:none}
</style>
<line x1="262" y1="30" x2="262" y2="330" class="c1pe-div"/><text x="20" y="36" class="c1pe-h">원핵세포</text><text x="20" y="56" class="c1pe-sub">예: 대장균 · 약 1~10 µm</text><path d="M205 192 q8 -10 16 0 t16 0 t16 0" class="c1pe-fl"/><rect x="40" y="148" width="168" height="88" rx="44" class="c1pe-wall"/><rect x="47" y="155" width="154" height="74" rx="37" class="c1pe-cyt"/><path d="M100 178 q12 -10 24 -2 q14 10 26 2 q10 -4 8 10 q-4 14 -18 10 q-12 -4 -22 6 q-12 8 -20 -4 q-8 -10 2 -22 z" class="c1pe-dna"/><circle cx="176" cy="176" r="7" class="c1pe-dna"/><circle cx="80" cy="208" r="5" class="c1pe-dna"/><circle cx="70" cy="170" r="2.6" class="c1pe-rib"/><circle cx="72" cy="214" r="2.6" class="c1pe-rib"/><circle cx="92" cy="222" r="2.6" class="c1pe-rib"/><circle cx="150" cy="218" r="2.6" class="c1pe-rib"/><circle cx="172" cy="206" r="2.6" class="c1pe-rib"/><circle cx="186" cy="190" r="2.6" class="c1pe-rib"/><circle cx="60" cy="192" r="2.6" class="c1pe-rib"/><circle cx="132" cy="165" r="2.6" class="c1pe-rib"/><path d="M75 150 L60 99" class="c1pe-lead"/><text x="20" y="94" class="c1pe-lbl">세포벽(펩티도글리칸)</text><path d="M90 156 L40 122" class="c1pe-lead"/><text x="20" y="118" class="c1pe-lbl">세포막</text><path d="M176 169 L176 122" class="c1pe-lead"/><text x="150" y="118" class="c1pe-lbl">플라스미드</text><path d="M118 204 L100 263" class="c1pe-lead"/><text x="20" y="276" class="c1pe-lbl">핵양체(고리 모양 DNA)</text><path d="M172 208 L190 287" class="c1pe-lead"/><text x="175" y="300" class="c1pe-lbl">리보솜(70S)</text><path d="M238 197 L226 239" class="c1pe-lead"/><text x="212" y="252" class="c1pe-lbl">편모</text><text x="20" y="326" class="c1pe-sub">핵막·막성 세포 소기관 없음</text><text x="290" y="36" class="c1pe-h">진핵세포(동물세포)</text><text x="290" y="56" class="c1pe-sub">예: 사람의 간세포 · 약 10~100 µm</text><ellipse cx="440" cy="200" rx="135" ry="110" class="c1pe-cyt"/><path d="M433.7 144.2 A56 56 0 0 1 433.7 245.8" class="c1pe-er"/><circle cx="443.5" cy="145.8" r="1.8" class="c1pe-rib"/><circle cx="457.4" cy="159.1