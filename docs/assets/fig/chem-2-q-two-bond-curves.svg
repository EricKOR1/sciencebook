<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-chem-2-q-two-bond-curves d-chem-2-q-two-bond-curves">
  <title id="t-chem-2-q-two-bond-curves">그림 화학 2-13 문제 14 해설 — X₂와 Y₂의 원자핵 사이 거리에 따른 에너지</title>
  <desc id="d-chem-2-q-two-bond-curves">두 곡선은 X₂(가장 낮은 점 74 pm, −436 kJ/mol)와 Y₂(가장 낮은 점 199 pm, −242 kJ/mol)의 에너지를 나타낸다. Y₂의 결합 길이가 더 길고, X₂의 골이 더 깊어 결합이 더 강하다. X₂의 핵 사이 거리를 50 pm으로 줄이면 반발력이 우세해져 에너지가 74 pm일 때보다 높아진다. 곡선의 모양은 모식적이다.</desc>
