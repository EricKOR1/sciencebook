  <title id="t-umath-5-eigen-ellipse">그림 수학 도구 5-6 A = [[2, 1], [1, 2]]가 단위원을 바꾸는 모습</title>
  <desc id="d-umath-5-eigen-ellipse">왼쪽: 단위원과 0°, 30°, 45°, 90°, 135° 방향의 단위 벡터. 오른쪽: A로 변환하면 단위원은 45° 방향 반지름 3, 135° 방향 반지름 1인 타원이 된다. 45°와 135° 방향(고유벡터)은 방향이 그대로이고 길이만 3배, 1배가 되며, 다른 방향은 방향이 바뀐다.</desc>
