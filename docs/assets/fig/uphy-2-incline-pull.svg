  <text x="26.0" y="70.0" style="font-size:13px;fill:var(--fig-ink)">빗면 방향: mg sin θ = f<tspan dy="4" style="font-size:11px">s</tspan><tspan dy="-4">​</tspan> ≤ μ<tspan dy="4" style="font-size:11px">s</tspan><tspan dy="-4">​</tspan>N</text>
  <text x="26.0" y="88.0" style="font-size:13px;fill:var(--fig-ink)">수직 방향: N = mg cos θ</text>
  <text x="26.0" y="108.0" style="font-size:13px;fill:var(--fig-ink);font-weight:600">직전 → μ<tspan dy="4" style="font-size:11px">s</tspan><tspan dy="-4">​</tspan> = tan θ (질량과 무관)</text>
