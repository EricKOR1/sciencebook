<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-uphy-2-incline-pull d-uphy-2-incline-pull">
  <title id="t-uphy-2-incline-pull">그림 일반물리학 2-5 빗면 위 물체와 비스듬히 끄는 상자의 자유 물체 도형</title>
  <desc id="d-uphy-2-incline-pull">(가) 빗면에 놓인 물체의 중력을 빗면 방향 mg sin θ와 빗면에 수직인 mg cos θ로 나눈다. 미끄러지기 직전에는 mg sin θ = μs mg cos θ이므로 μs = tan θ이다(예제 5 (1)). (나) 줄로 각 θ만큼 위로 끌면 줄의 연직 성분 F sin θ만큼 수직 항력이 줄어 최대 정지 마찰력도 준다. 필요한 힘 F(θ) = μs mg/(cos θ + μs sin θ)는 tan θ = μs인 26.6°에서 최소 131 N이다(예제 5 (2), m = 30.0 kg, μs = 0.500).</desc>
  <rect x="10.0" y="10.0" width="345.0" height="360.0" rx="10" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <rect x="365.0" y="10.0" width="345.0" height="360.0" rx="10" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
