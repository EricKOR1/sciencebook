  <title id="t-uearth-7-q-sounding">그림 일반지구과학 7-9 문제 16의 아침 기온 연직 분포</title>
  <desc id="d-uearth-7-q-sounding">라디오존데로 관측한 높이 0~3 km의 기온(점과 실선)이다. 비교를 위해 지표의 점을 지나는 건조 단열 감률(9.8 K/km)과 습윤 단열 감률(5 K/km)의 기울기 선을 점선으로 함께 나타냈다. 값은 문제의 표와 같다.</desc>
