<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uearth-4-groundwater-system d-uearth-4-groundwater-system">
<title id="t-uearth-4-groundwater-system">그림 일반지구과학 4-7 지하수계 — 자유면 대수층과 피압 대수층</title>
<desc id="d-uearth-4-groundwater-system">지표 아래 비포화대와 포화대가 지하수면으로 나뉘고, 지하수면은 지형을 완만하게 따라 하천에서 지표와 만난다. 양수 우물 주변에는 지하수면 하강 원뿔이 생긴다. 점토층 아래 피압 대수층은 높은 곳에서 함양되어 수두(점선)가 높으므로, 수두가 지표보다 높은 곳의 우물에서는 물이 저절로 솟는다(자분정).</desc>
