<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-earth-1-salinity-latitude d-earth-1-salinity-latitude">
  <title id="t-earth-1-salinity-latitude">그림 지구과학 1-9 위도에 따른 표층 염분과 (증발량 − 강수량)</title>
  <desc id="d-earth-1-salinity-latitude">표층 염분은 증발량에서 강수량을 뺀 값이 큰 위도 약 20°~30°의 고압대에서 가장 높고, 비가 많은 적도에서 조금 낮으며, 고위도에서 가장 낮다. 두 곡선의 모양이 거의 같다. 대략적인 모양을 나타낸 모식도이다.</desc>
  <style>
    .earth-1-salinity-latitude-t{font-size:14px;fill:var(--fig-ink)}
    .earth-1-salinity-latitude-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .earth-1-salinity-latitude-s{font-size:13px;fill:var(--fig-muted)}
    .earth-1-salinity-latitude-land{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:0.8;fill-rule:evenodd}
    .earth-1-salinity-latitude-sea{fill:var(--fig-soft-blue)}
    .earth-1-salinity-latitude-grat{fill:none;stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3;opacity:0.7}
    .earth-1-salinity-latitude-frame{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .earth-1-salinity-latitude-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
