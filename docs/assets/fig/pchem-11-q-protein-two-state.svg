  <title id="t-pchem-11-q-protein-two-state">그림 물리화학 11-14 문제 11의 단백질 두 상태 모형(모식도)</title>
  <desc id="d-pchem-11-q-protein-two-state">접힌 상태 F는 구조가 하나뿐인 준위 하나(아래 왼쪽)이고, 풀린 상태 U는 ΔE₀만큼 높은 곳에 매우 많은 상태가 촘촘한 띠를 이룬다(위 오른쪽). 사슬 그림은 F의 한 가지 접힌 모양과 U의 여러 풀린 모양을 나타낸다.</desc>
