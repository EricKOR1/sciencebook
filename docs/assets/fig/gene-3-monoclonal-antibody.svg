<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-gene-3-monoclonal-antibody d-gene-3-monoclonal-antibody">
  <title id="t-gene-3-monoclonal-antibody">그림 생물의 유전 3-2 단일클론항체를 만드는 과정</title>
  <desc id="d-gene-3-monoclonal-antibody">항원을 주사한 생쥐에서 얻은 B 림프구를 계속 분열하는 골수종 세포와 융합해 잡종 세포(하이브리도마)를 만들고, 그중 원하는 항체를 만드는 잡종 세포 하나만 골라 배양하면 한 가지 항원 결정 부위만 인식하는 같은 항체를 대량으로 얻는다.</desc>
  <style>
    .gene-3-monoclonal-antibody-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .gene-3-monoclonal-antibody-tx{font-size:14px;fill:var(--fig-ink)}
    .gene-3-monoclonal-antibody-sm{font-size:13px;fill:var(--fig-muted)}
    .gene-3-monoclonal-antibody-pan{fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1}
    .gene-3-monoclonal-antibody-mouse{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.6}
    .gene-3-monoclonal-antibody-eye{fill:var(--fig-ink)}
    .gene-3-monoclonal-antibody-syr{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5}
    .gene-3-monoclonal-antibody-b{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2}
    .gene-3-monoclonal-antibody-m{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2}
    .gene-3-monoclonal-antibody-hy{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2}
    .gene-3-monoclonal-antibody-nb{fill:var(--fig-blue)}
    .gene-3-monoclonal-antibody-nm{fill:var(--fig-amber)}
    .gene-3-monoclonal-antibody-nh{fill:var(--fig-green)}
    .gene-3-monoclonal-antibody-ar{fill:none;stroke:var(--fig-muted);stroke-width:1.8}
    .gene-3-monoclonal-antibody-ah{fill:var(--fig-muted)}
    .gene-3-monoclonal-antibody-well{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}
    .gene-3-monoclonal-antibody-pick{fill:none;stroke:var(--fig-red);stroke-width:2.5}
    .gene-3-monoclonal-antibody-ok{font-size:14px;font-weight:600;fill:var(--fig-red)}
  </style>
  <rect x="10" y="10" width="700" height="180" rx="10" class="gene-3-monoclonal-antibody-pan"/>
  <rect x="10" y="202" width="700" height="188" rx="10" class="gene-3-monoclonal-antibody-pan"/>
  <text x="90" y="36" text-anchor="middle" class="gene-3-monoclonal-antibody-h">① 생쥐에 항원 주사</text>
  <ellipse cx="90" cy="110" rx="40" ry="24" class="gene-3-monoclonal-antibody-mouse"/>
  <circle cx="134" cy="100" r="16" class="gene-3-monoclonal-antibody-mouse"/>
  <circle cx="130" cy="83" r="8" class="gene-3-monoclonal-antibody-mouse"/>
  <circle cx="140" cy="97" r="2" class="gene-3-monoclonal-antibody-eye"/>
  <path d="M50 114 q-24 4 -30 24" class="gene-3-monoclonal-antibody-mouse" style="fill:none"/>
  <rect x="70" y="48" width="40" height="10" rx="2" class="gene-3-monoclonal-antibody-syr" transform="rotate(30 90 53)"/>
  <text x="90" y="166" text-anchor="middle" class="gene-3-monoclonal-antibody-sm">항체를 만드는 B 림프구가 생긴다</text>
  <line x1="170" y1="105" x2="200" y2="105" class="gene-3-monoclonal-antibody-ar"/>
  <path d="M200.0 105.0 L192.7 108.3 L192.7 101.7 Z" class="gene-3-monoclonal-antibody-ah"/>
  <text x="300" y="36" text-anchor="middle" class="gene-3-monoclonal-antibody-h">B 림프구와 골수종 세포</text>
  <circle cx="240" cy="84" r="18" class="gene-3-monoclonal-antibody-b"/>
  <circle cx="240" cy="84" r="7.6" class="gene-3-monoclonal-antibody-nb"/>
  <path d="M266 82.0 L266 74.0 L260.4 67.6 M266 74.0 L271.6 67.6" style="fill:none;stroke:var(--fig-blue);stroke-width:1.9;stroke-linecap:round"/>
