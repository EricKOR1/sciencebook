  <text x="592" y="350" text-anchor="middle" class="gene-3-monoclonal-antibody-h">단일클론항체 대량 생산</text>
  <text x="592" y="368" text-anchor="middle" class="gene-3-monoclonal-antibody-sm">모두 같은 항원 결정 부위를 인식</text>
