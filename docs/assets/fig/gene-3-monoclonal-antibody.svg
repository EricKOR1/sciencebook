  <text x="580" y="152" text-anchor="middle" class="gene-3-monoclonal-antibody-sm">잡종 세포(하이브리도마)마다 다른 항체</text>
  <text x="580" y="170" text-anchor="middle" class="gene-3-monoclonal-antibody-sm">항체를 만들면서 계속 분열한다</text>
  <path d="M660 182 L660 196 L130 196 L130 220" class="gene-3-monoclonal-antibody-ar"/>
  <path d="M130 226 l-5 -9 l10 0 z" class="gene-3-monoclonal-antibody-ah"/>
  <text x="200" y="232" class="gene-3-monoclonal-antibody-h">④ 원하는 항체를 만드는 잡종 세포 하나만 골라 배양</text>
