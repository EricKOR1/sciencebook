  <text x="362" y="182" text-anchor="middle" class="gene-3-monoclonal-antibody-sm">계속 분열, 항체 없음</text>
  <line x1="420" y1="105" x2="456" y2="105" class="gene-3-monoclonal-antibody-ar"/>
  <path d="M456.0 105.0 L448.7 108.3 L448.7 101.7 Z" class="gene-3-monoclonal-antibody-ah"/>
  <text x="590" y="36" text-anchor="middle" class="gene-3-monoclonal-antibody-h">② 세포 융합 → ③ 잡종 세포</text>
  <circle cx="500" cy="100" r="22" class="gene-3-monoclonal-antibody-hy"/>
  <circle cx="500" cy="100" r="9.2" class="gene-3-monoclonal-antibody-nh"/>
