  <text x="240" y="182" text-anchor="middle" class="gene-3-monoclonal-antibody-sm">항체 생산, 오래 못 삶</text>
  <text x="300" y="112" text-anchor="middle" class="gene-3-monoclonal-antibody-tx">+</text>
  <circle cx="360" cy="106" r="20" class="gene-3-monoclonal-antibody-m"/>
