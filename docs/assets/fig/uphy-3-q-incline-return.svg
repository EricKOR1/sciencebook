<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" class="fig-small" role="img" aria-labelledby="t-uphy-3-q-incline-return d-uphy-3-q-incline-return">
  <title id="t-uphy-3-q-incline-return">그림 일반물리학 3-12 문제 12의 빗면 위로 밀어 올린 토막</title>
  <desc id="d-uphy-3-q-incline-return">30.0° 빗면의 바닥에서 질량 2.00 kg인 토막을 빗면 위쪽으로 8.00 m/s로 밀어 올린다. 토막과 빗면 사이의 운동 마찰 계수는 0.250, 정지 마찰 계수는 0.400이다. 토막이 올라가는 거리 d는 구할 값이다.</desc>
