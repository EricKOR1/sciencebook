  <line x1="235.0" y1="37.4" x2="240.0" y2="46.1" style="stroke:var(--fig-muted);stroke-width:1.2;fill:none"/>
  <text x="130.9" y="87.1" text-anchor="middle" style="font-size:14px;fill:var(--fig-ink);font-weight:600">d = ?</text>
