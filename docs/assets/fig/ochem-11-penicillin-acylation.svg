<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" role="img" aria-labelledby="t-ochem-11-penicillin-acylation d-ochem-11-penicillin-acylation">
  <title id="t-ochem-11-penicillin-acylation">그림 유기화학 11-24 페니실린 G가 효소를 아실화하는 메커니즘</title>
  <desc id="d-ochem-11-penicillin-acylation">왼쪽 위: 페니실린 G(2S,5R,6R, 쐐기·점선). 색으로 표시한 β-락탐 C=O는 N이 피라미드형이라 아마이드 공명이 약하다(IR 약 1770 cm⁻¹). 효소 활성 자리의 세린 Enz–CH₂–OH는 염기(B:)가 OH의 H를 받으며(점선 화살표) 친핵체가 된다. 1단계: 세린 O의 전자쌍이 β-락탐 카보닐 탄소로, C=O π 전자쌍이 O로 → 사면체 중간체. 옥시음이온 구멍의 N–H 두 개가 O⁻를 수소 결합으로 붙잡는다(점선). 2단계: O⁻의 전자쌍이 C=O를 다시 만들며 고리의 C–N 결합 전자쌍이 N으로 간다(N은 양성자를 받는다) → 고리가 열린 아실–효소(효소와 에스터 결합, 싸이아졸리딘 고리의 NH와 COOH는 남음). 탈아실화가 매우 느려 효소가 불활성이 된다. 아래 회색 상자: β-락타메이스는 같은 아실–효소를 물로 빠르게 가수 분해해 효소를 되살리고 약을 분해한다. 클라불란산((2R,5R,Z), CH₂OH와 고리 O가 이중 결합의 같은 쪽)은 β-락타메이스 저해제이다.</desc>
