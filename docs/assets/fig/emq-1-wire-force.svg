<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-labelledby="t-emq-1-wire-force d-emq-1-wire-force">
  <title id="t-emq-1-wire-force">그림 전자기와 양자 1-3 자기장 속 도선이 받는 힘과 나란한 두 도선</title>
  <desc id="d-emq-1-wire-force">오른쪽으로 향하는 자기장 속에서 종이면에서 나오는 전류가 흐르는 도선은 위쪽으로 힘을 받는다(F = BIL). 나란한 두 도선은 서로의 자기장 속에 있으므로, 같은 방향 전류끼리는 끌어당기고 반대 방향 전류끼리는 밀어낸다.</desc>
