<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="t-gene-2-bicoid-gradient d-gene-2-bicoid-gradient">
  <title id="t-gene-2-bicoid-gradient">그림 생물의 유전 2-7 비코이드 농도 기울기에서 마디까지 — 초파리 발생 초기의 연쇄적 발현 조절</title>
  <desc id="d-gene-2-bicoid-gradient">① 어미는 비코이드 mRNA를 난자의 앞쪽 끝에 넣어 둔다. ② 수정 후 번역된 비코이드 단백질이 앞에서 뒤로 퍼지며 농도 기울기를 이룬다(그래프). ③ 이 농도에 따라 간극 유전자들이 서로 다른 큰 구역에서 발현된다. ④ 짝 규칙 유전자는 일정한 간격의 띠(7줄)로 발현되어 마디의 틀을 만든다. ⑤ 혹스 유전자가 각 마디가 머리·가슴·배 중 무엇이 될지 정한다. 구역의 위치와 개수는 예시를 단순화한 모식도이다.</desc>
