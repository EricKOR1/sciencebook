  <title id="t-m2-08-nebulae">그림 중2-8-5 방출 성운, 반사 성운, 암흑 성운</title>
  <desc id="d-m2-08-nebulae">방출 성운은 가까운 뜨거운 별의 에너지를 받은 가스가 스스로 빛을 내어 주로 붉게 보인다. 반사 성운은 주변 별빛을 반사하여 주로 파랗게 보인다. 암흑 성운은 뒤에서 오는 별빛을 가려 어둡게 보인다. 모식도이다.</desc>
