    .hhr-night{fill:var(--fig-ink)}
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hhr-night{fill:var(--fig-paper)} }
    :root[data-theme="dark"] .hhr-night{fill:var(--fig-paper)}
  </style>
