<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 284" role="img" aria-labelledby="t-2-1-h-he-ratio d-2-1-h-he-ratio">
  <title id="t-2-1-h-he-ratio">그림 2-1-3 우주 초기 수소와 헬륨의 개수비와 질량비</title>
  <desc id="d-2-1-h-he-ratio">양성자 14개와 중성자 2개에서 중성자가 모두 헬륨 원자핵에 들어가면 수소 원자핵 12개, 헬륨 원자핵 1개가 남는다. 개수비는 12 : 1이지만 헬륨 원자핵이 입자 4개분으로 무거우므로 질량비는 12 : 4 = 3 : 1이 된다.</desc>
