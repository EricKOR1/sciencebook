<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-uphy-2-q-drag-models d-uphy-2-q-drag-models">
  <title id="t-uphy-2-q-drag-models">그림 일반물리학 2-14 문제 16 해설: 두 끌림힘 모형의 속도–시간 그래프</title>
  <desc id="d-uphy-2-q-drag-models">종단 속도가 48.3 m/s로 같은 두 모형의 v–t 그래프이다. 끌림힘이 kv²이면 v = v_t tanh(gt/v_t)로 7.26 s에 종단 속도의 90 %에 이르고, bv이면 v = v_t(1 − e^(−t/τ)), τ = 4.93 s로 11.3 s가 걸린다. 점선 직선은 끌림이 없는 자유 낙하 v = gt이다.</desc>
