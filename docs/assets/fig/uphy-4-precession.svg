  <text x="394.6" y="122.5" class="u4pr-b" style="fill:var(--fig-green)">dL = τ dt</text>
  <text x="106.1" y="116.5" text-anchor="end" class="u4pr-s" style="fill:var(--fig-violet)">L 끝의 자취(세차)</text>
  <text x="470" y="250" class="u4pr-t">dL ⟂ L 이므로</text>
  <text x="470" y="272" class="u4pr-t">· L의 크기는 그대로</text>
  <text x="470" y="294" class="u4pr-t">· 방향만 수평으로 돈다</text>
  <text x="470" y="324" class="u4pr-b" style="fill:var(--fig-violet)">Ω = τ/L = Mgr/(Iω)</text>
  <text x="470" y="346" class="u4pr-s">빨리 돌수록 세차는 느리다</text>
  <text x="360" y="388" text-anchor="middle" class="u4pr-s">위에서 보면 L의 수평 성분이 시계 반대 방향으로 돈다(자전이 축 끝에서 볼 때 시계 반대 방향일 때)</text>
</svg>
