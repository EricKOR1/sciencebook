<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uphy-4-precession d-uphy-4-precession">
  <title id="t-uphy-4-precession">그림 일반물리학 4-3 기울어진 팽이의 세차 운동</title>
  <desc id="d-uphy-4-precession">받침점 O에 대한 중력의 토크 τ = r_cm × Mg는 수평이고 각운동량 L에 수직이다. 짧은 시간 동안 dL = τ dt가 L 끝에 더해지므로 L은 길이가 그대로인 채 수평면에서 옆으로 돌아가며, 축 끝이 점선 원을 따라 돈다. 모식도이다.</desc>
