  <path d="M307.2 300.6 L299.7 310 L295.2 301.2 Z" style="fill:var(--fig-green);stroke:none"/>
  <text x="315.2" y="304.6" class="u4pr-b" style="fill:var(--fig-green)">τ = r<tspan baseline-shift="sub" font-size="11">cm</tspan> × Mg</text>
