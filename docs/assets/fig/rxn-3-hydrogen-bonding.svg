<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" role="img" aria-labelledby="t-rxn-3-hydrogen-bonding d-rxn-3-hydrogen-bonding">
  <title id="t-rxn-3-hydrogen-bonding">그림 화학 반응의 세계 3-1 작용기에 따른 분자 사이의 힘과 끓는점</title>
  <desc id="d-rxn-3-hydrogen-bonding">분자량이 44~46으로 비슷한 네 물질. 작용기가 없으면 분산력만, C=O만 있으면 쌍극자–쌍극자 힘, O–H가 있으면 수소 결합이 생기고, 폼산은 두 분자가 수소 결합 2개로 짝을 이루어 끓는점이 가장 높다.</desc>
  <style>
    .rxn-3-hydrogen-bonding-a{font-size:15px;fill:var(--fig-ink);font-weight:600}
    .rxn-3-hydrogen-bonding-o{font-size:15px;fill:var(--fig-red);font-weight:600}
    .rxn-3-hydrogen-bonding-n{font-size:15px;fill:var(--fig-ink);font-weight:600}
    .rxn-3-hydrogen-bonding-s{font-size:13px;fill:var(--fig-muted)}
    .rxn-3-hydrogen-bonding-d{font-size:12px;fill:var(--fig-muted)}
    .rxn-3-hydrogen-bonding-l{stroke:var(--fig-ink);stroke-width:1.6}
    .rxn-3-hydrogen-bonding-hb{stroke:var(--fig-red);stroke-width:2.5;stroke-dasharray:2 4;stroke-linecap:round}
    .rxn-3-hydrogen-bonding-dd{stroke:var(--fig-amber);stroke-width:2;stroke-dasharray:6 4}
  </style>
  <!-- 프로페인 -->
  <text x="90" y="64" text-anchor="middle" class="rxn-3-hydrogen-bonding-a">CH₃–CH₂–CH₃</text>
  <text x="90" y="112" text-anchor="middle" class="rxn-3-hydrogen-bonding-a">CH₃–CH₂–CH₃</text>
  <text x="90" y="88" text-anchor="middle" class="rxn-3-hydrogen-bonding-d">(극성 작용기 없음)</text>
  <!-- 아세트알데하이드 -->
  <text x="216" y="65" text-anchor="middle" class="rxn-3-hydrogen-bonding-a">H₃C</text>
  <line x1="234" y1="60" x2="248" y2="60" class="rxn-3-hydrogen-bonding-l"/>
  <text x="256" y="65" text-anchor="middle" class="rxn-3-hydrogen-bonding-a">C</text>
  <line x1="256" y1="50" x2="256" y2="38" class="rxn-3-hydrogen-bonding-l"/>
  <text x="256" y="34" text-anchor="middle" class="rxn-3-hydrogen-bonding-a">H</text>
  <line x1="265" y1="57" x2="287" y2="57" class="rxn-3-hydrogen-bonding-l"/><line x1="265" y1="62" x2="287" y2="62" class="rxn-3-hydrogen-bonding-l"/>
  <text x="296" y="65" text-anchor="middle" class="rxn-3-hydrogen-bonding-o">O</text>
  <text x="309" y="50" class="rxn-3-hydrogen-bonding-d">δ−</text><text x="240" y="48" class="rxn-3-hydrogen-bonding-d">δ+</text>
  <text x="246" y="115" text-anchor="middle" class="rxn-3-hydrogen-bonding-o">O</text>
  <line x1="255" y1="107" x2="277" y2="107" class="rxn-3-hydrogen-bonding-l"/><line x1="255" y1="112" x2="277" y2="112" class="rxn-3-hydrogen-bonding-l"/>
  <text x="286" y="115" text-anchor="middle" class="rxn-3-hydrogen-bonding-a">C</text>
  <line x1="294" y1="110" x2="308" y2="110" class="rxn-3-hydrogen-bonding-l"/>
  <text x="326" y="115" text-anchor="middle" class="rxn-3-hydrogen-bonding-a">CH₃</text>
  <line x1="286" y1="120" x2="286" y2="130" class="rxn-3-hydrogen-bonding-l"/>
  <text x="286" y="145" text-anchor="middle" class="rxn-3-hydrogen-bonding-a">H</text>
  <line x1="294" y1="70" x2="288" y2="98" class="rxn-3-hydrogen-bonding-dd"/>
  <line x1="254" y1="70" x2="248" y2="98" class="rxn-3-hydrogen-bonding-dd"/>
  <!-- 에탄올 -->
  <text x="404" y="60" text-anchor="middle" class="rxn-3-hydrogen-bonding-a">C₂H₅</text>
  <line x1="424" y1="55" x2="436" y2="55" class="rxn-3-hydrogen-bonding-l"/>
  <text x="444" y="60" text-anchor="middle" class="rxn-3-hydrogen-bonding-o">O</text>
  <line x1="451" y1="62" x2="460" y2="71" class="rxn-3-hydrogen-bonding-l"/>
  <text x="466" y="84" text-anchor="middle" class="rxn-3-hydrogen-bonding-a">H</text>
  <line x1="470" y1="88" x2="477" y2="100" class="rxn-3-hydrogen-bonding-hb"/>
  <text x="482" y="116" text-anchor="middle" class="rxn-3-hydrogen-bonding-o">O</text>
  <line x1="490" y1="111" x2="502" y2="111" class="rxn-3-hydrogen-bonding-l"/>
  <text x="522" y="116" text-anchor="middle" class="rxn-3-hydrogen-bonding-a">C₂H₅</text>
  <line x1="482" y1="121" x2="482" y2="131" class="rxn-3-hydrogen-bonding-l"/>
  <text x="482" y="146" text-anchor="middle" class="rxn-3-hydrogen-bonding-a">H</text>
  <line x1="476" y1="150" x2="468" y2="160" class="rxn-3-hydrogen-bonding-hb"/>
  <!-- 폼산 두 분자 -->
  <text x="551" y="90" text-anchor="middle" class="rxn-3-hydrogen-bonding-a">H</text>
  <line x1="559" y1="85" x2="569" y2="85" class="rxn-3-hydrogen-bonding-l"/>
  <text x="576" y="90" text-anchor="middle" class="rxn-3-hydrogen-bonding-a">C</text>
  <line x1="580" y1="76" x2="592" y2="66" class="rxn-3-hydrogen-bonding-l"/><line x1="584" y1="80" x2="596" y2="70" class="rxn-3-hydrogen-bonding-l"/>
  <text x="601" y="64" text-anchor="middle" class="rxn-3-hydrogen-bonding-o">O</text>
  <line x1="582" y1="94" x2="594" y2="104" class="rxn-3-hydrogen-bonding-l"/>
  <text x="601" y="116" text-anchor="middle" class="rxn-3-hydrogen-bonding-o">O</text>
  <line x1="610" y1="111" x2="616" y2="111" class="rxn-3-hydrogen-bonding-l"/>
  <text x="623" y="116" text-anchor="middle" class="rxn-3-hydrogen-bonding-a">H</text>
  <line x1="610" y1="59" x2="630" y2="59" class="rxn-3-hydrogen-bonding-hb"/>
  <line x1="632" y1="111" x2="651" y2="111" class="rxn-3-hydrogen-bonding-hb"/>
  <text x="639" y="64" text-anchor="middle" class="rxn-3-hydrogen-bonding-a">H</text>
  <line x1="646" y1="59" x2="652" y2="59" class="rxn-3-hydrogen-bonding-l"/>
  <text x="660" y="64" text-anchor="middle" class="rxn-3-hydrogen-bonding-o">O</text>
  <line x1="667" y1="68" x2="679" y2="78" class="rxn-3-hydrogen-bonding-l"/>
  <text x="685" y="90" text-anchor="middle" class="rxn-3-hydrogen-bonding-a">C</text>
  <line x1="680" y1="94" x2="668" y2="104" class="rxn-3-hydrogen-bonding-l"/><line x1="684" y1="98" x2="672" y2="108" class="rxn-3-hydrogen-bonding-l"/>
  <text x="660" y="116" text-anchor="middle" class="rxn-3-hydrogen-bonding-o">O</text>
  <line x1="693" y1="85" x2="703" y2="85" class="rxn-3-hydrogen-bonding-l"/>
  <text x="710" y="90" text-anchor="middle" class="rxn-3-hydrogen-bonding-a">H</text>
  <!-- 이름과 힘 -->
  <g text-anchor="middle">
    <text x="90" y="178" class="rxn-3-hydrogen-bonding-n">프로페인</text>
    <text x="270" y="178" class="rxn-3-hydrogen-bonding-n">아세트알데하이드</text>
    <text x="450" y="178" class="rxn-3-hydrogen-bonding-n">에탄올</text>
    <text x="630" y="178" class="rxn-3-hydrogen-bonding-n">폼산</text>
    <text x="90" y="196" class="rxn-3-hydrogen-bonding-s">분자량 44 · 작용기 없음</text>
    <text x="270" y="196" class="rxn-3-hydrogen-bonding-s">분자량 44 · 폼일기</text>
    <text x="450" y="196" class="rxn-3-hydrogen-bonding-s">분자량 46 · 하이드록시기</text>
    <text x="630" y="196" class="rxn-3-hydrogen-bonding-s">분자량 46 · 카복실기</text>
    <text x="90" y="214" class="rxn-3-hydrogen-bonding-s" style="fill:var(--fig-ink)">분산력만</text>
    <text x="270" y="214" class="rxn-3-hydrogen-bonding-s" style="fill:var(--fig-amber);font-weight:600">- - 쌍극자–쌍극자 힘</text>
    <text x="450" y="214" class="rxn-3-hydrogen-bonding-s" style="fill:var(--fig-red);font-weight:600">··· 수소 결합</text>
    <text x="630" y="214" class="rxn-3-hydrogen-bonding-s" style="fill:var(--fig-red);font-weight:600">··· 수소 결합 2개로 짝</text>
  </g>
  <!-- 끓는점 막대 (1 ℃ = 1 px) -->
  <line x1="20" y1="320" x2="710" y2="320" style="stroke:var(--fig-line);stroke-width:1.5"/>
  <text x="20" y="314" class="rxn-3-hydrogen-bonding-d">0 ℃</text>
  <text x="20" y="250" class="rxn-3-hydrogen-bonding-s" style="fill:var(--fig-ink);font-weight:600">끓는점 (약)</text>
  <rect x="60" y="320" width="60" height="42" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
  <rect x="240" y="300" width="60" height="20" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <rect x="420" y="242" width="60" height="78" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5"/>
  <rect x="600" y="219" width="60" height="101" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5"/>
  <g text-anchor="start" class="rxn-3-hydrogen-bonding-a" style="font-size:14px">
    <text x="128" y="346">−42 ℃</text><text x="308" y="315">20 ℃</text><text x="488" y="262">78 ℃</text><text x="668" y="240">101 ℃</text>
  </g>
</svg>
