<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="t-pchem-7-hydrogen-levels d-pchem-7-hydrogen-levels">
  <title id="t-pchem-7-hydrogen-levels">그림 물리화학 7-4 수소 원자의 에너지 준위와 스펙트럼 계열</title>
  <desc id="d-pchem-7-hydrogen-levels">수소 원자의 에너지 준위 E_n = −13.60 eV/n²(n = 1~6)와 이온화 극한 E = 0(점선). 아래로 향하는 화살표는 빛을 내는 전이로, 라이먼 계열(n → 1, 자외선), 발머 계열(n → 2, 가시광선: 656, 486, 434, 410 nm, 화살표 색은 실제 빛의 색), 파셴 계열(n → 3, 적외선)이다. 굵은 세 화살표 Lyα(2 → 1), Hα(3 → 2), Lyβ(3 → 1)는 리츠 결합 원리 Lyβ = Lyα + Hα를 보여 준다.</desc>
