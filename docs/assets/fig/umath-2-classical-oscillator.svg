<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-umath-2-classical-oscillator d-umath-2-classical-oscillator">
  <title id="t-umath-2-classical-oscillator">그림 수학 도구 2-2 고전 조화 진동자의 확률 밀도</title>
  <desc id="d-umath-2-classical-oscillator">p(x) = 1/(π√(A² − x²))는 가운데 x = 0에서 가장 작고(1/π ≈ 0.318), 되돌이점 x = ±A로 갈수록 위로 끝없이 커진다(그래프 위쪽은 잘라 냄). 가운데 절반 |x| &lt; A/2의 넓이가 1/3이고, 바깥 두 구간이 1/3씩이다.</desc>
