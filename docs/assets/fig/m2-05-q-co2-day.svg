  <desc id="d-m2-05-q-co2-day">밤에는 호흡만 일어나 이산화 탄소가 쌓이므로 해 뜰 무렵에 가장 높고, 낮에는 광합성량이 호흡량보다 많아 계속 줄어 해 질 무렵에 가장 낮다. 광합성량과 호흡량이 같아지는 때에 꺾인다. 세로축은 상댓값인 모식 그래프이다.</desc>
