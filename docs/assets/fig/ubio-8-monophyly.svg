<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" role="img" aria-labelledby="t-ubio-8-monophyly d-ubio-8-monophyly">
<title id="t-ubio-8-monophyly">그림 일반생명과학 8-7 단계통군, 측계통군, 다계통군</title>
<desc id="d-ubio-8-monophyly">같은 계통수 (양서류, (포유류, (도마뱀, (거북, (악어, 새))))) 위에서 세 가지 묶음을 비교한다. 단계통군은 한 조상과 모든 자손(새를 포함한 파충류), 측계통군은 한 조상과 일부 자손(새를 뺀 전통적 파충류), 다계통군은 공통 조상을 빼고 따로 생긴 형질로 묶은 것(새와 포유류를 묶은 정온 동물)이다.</desc>
<style>
.ubio-8-monophyly-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .ubio-8-monophyly-s{font-size:13px;fill:var(--fig-muted)} .ubio-8-monophyly-t{font-size:13px;fill:var(--fig-ink)}
.ubio-8-monophyly-e{fill:none;stroke:var(--fig-line);stroke-width:2}
</style>
<text x="124.0" y="30" text-anchor="middle" class="ubio-8-monophyly-h" style="fill:var(--fig-green)">단계통군</text>
<text x="171" y="63" text-anchor="start" class="ubio-8-monophyly-t">양서류</text>
<text x="171" y="93" text-anchor="start" class="ubio-8-monophyly-t">포유류</text>
<rect x="165" y="107" width="67" height="22" rx="5" style="fill:var(--fig-soft-green)"/>
<text x="171" y="123" text-anchor="start" class="ubio-8-monophyly-t">도마뱀</text>
<rect x="165" y="137" width="67" height="22" rx="5" style="fill:var(--fig-soft-green)"/>
<text x="171" y="153" text-anchor="start" class="ubio-8-monophyly-t">거북</text>
<rect x="165" y="167" width="67" height="22" rx="5" style="fill:var(--fig-soft-green)"/>
<text x="171" y="183" text-anchor="start" class="ubio-8-monophyly-t">악어</text>
<rect x="165" y="197" width="67" height="22" rx="5" style="fill:var(--fig-soft-green)"/>
<text x="171" y="213" text-anchor="start" class="ubio-8-monophyly-t">새</text>
