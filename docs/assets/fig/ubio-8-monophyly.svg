<path d="M80 144.25 L80 170.5 L107 170.5" class="ubio-8-monophyly-e" style="stroke:var(--fig-green);stroke-width:4"/>
<path d="M107 170.5 L107 148 L161 148" class="ubio-8-monophyly-e" style="stroke:var(--fig-green);stroke-width:4"/>
<path d="M107 170.5 L107 193.0 L134 193.0" class="ubio-8-monophyly-e" style="stroke:var(--fig-green);stroke-width:4"/>
<path d="M134 193.0 L134 178 L161 178" class="ubio-8-monophyly-e" style="stroke:var(--fig-green);stroke-width:4"/>
<path d="M134 193.0 L134 208 L161 208" class="ubio-8-monophyly-e" style="stroke:var(--fig-green);stroke-width:4"/>
<circle cx="80" cy="144.25" r="6" style="fill:var(--fig-green);stroke:var(--fig-panel);stroke-width:1.5"/>
<text x="124.0" y="258" text-anchor="middle" class="ubio-8-monophyly-t">한 조상과 그 모든 자손</text>
<text x="124.0" y="278" text-anchor="middle" class="ubio-8-monophyly-s">예: 새를 포함한 파충류</text>
<text x="374.0" y="30" text-anchor="middle" class="ubio-8-monophyly-h" style="fill:var(--fig-amber)">측계통군</text>
<text x="421" y="63" text-anchor="start" class="ubio-8-monophyly-t">양서류</text>
<text x="421" y="93" text-anchor="start" class="ubio-8-monophyly-t">포유류</text>
<rect x="415" y="107" width="67" height="22" rx="5" style="fill:var(--fig-soft-amber)"/>
<text x="421" y="123" text-anchor="start" class="ubio-8-monophyly-t">도마뱀</text>
<rect x="415" y="137" width="67" height="22" rx="5" style="fill:var(--fig-soft-amber)"/>
<text x="421" y="153" text-anchor="start" class="ubio-8-monophyly-t">거북</text>
<rect x="415" y="167" width="67" height="22" rx="5" style="fill:var(--fig-soft-amber)"/>
<text x="421" y="183" text-anchor="start" class="ubio-8-monophyly-t">악어</text>
<text x="421" y="213" text-anchor="start" class="ubio-8-monophyly-t">새</text>
<line x1="266" y1="87.0625" x2="276" y2="87.0625" class="ubio-8-monophyly-e"/>
<path d="M276 87.0625 L276 58 L411 58" class="ubio-8-monophyly-e"/>
<path d="M276 87.0625 L276 116.125 L303 116.125" class="ubio-8-monophyly-e"/>
<path d="M303 116.125 L303 88 L411 88" class="ubio-8-monophyly-e"/>
<path d="M303 116.125 L303 144.25 L330 144.25" class="ubio-8-monophyly-e" style="stroke:var(--fig-amber);stroke-width:4"/>
<path d="M330 144.25 L330 118 L411 118" class="ubio-8-monophyly-e" style="stroke:var(--fig-amber);stroke-width:4"/>
<path d="M330 144.25 L330 170.5 L357 170.5" class="ubio-8-monophyly-e" style="stroke:var(--fig-amber);stroke-width:4"/>
<path d="M357 170.5 L357 148 L411 148" class="ubio-8-monophyly-e" style="stroke:var(--fig-amber);stroke-width:4"/>
<path d="M357 170.5 L357 193.0 L384 193.0" class="ubio-8-monophyly-e" style="stroke:var(--fig-amber);stroke-width:4"/>
<path d="M384 193.0 L384 178 L411 178" class="ubio-8-monophyly-e" style="stroke:var(--fig-amber);stroke-width:4"/>
<path d="M384 193.0 L384 208 L411 208" class="ubio-8-monophyly-e"/>
<circle cx="330" cy="144.25" r="6" style="fill:var(--fig-amber);stroke:var(--fig-panel);stroke-width:1.5"/>
<text x="374.0" y="258" text-anchor="middle" class="ubio-8-monophyly-t">한 조상과 일부 자손만</text>
<text x="374.0" y="278" text-anchor="middle" class="ubio-8-monophyly-s">예: 새를 뺀 전통적 '파충류'</text>
<text x="624.0" y="30" text-anchor="middle" class="ubio-8-monophyly-h" style="fill:var(--fig-red)">다계통군</text>
<text x="671" y="63" text-anchor="start" class="ubio-8-monophyly-t">양서류</text>
<rect x="665" y="77" width="67" height="22" rx="5" style="fill:var(--fig-soft-red)"/>
<text x="671" y="93" text-anchor="start" class="ubio-8-monophyly-t">포유류</text>
<text x="671" y="123" text-anchor="start" class="ubio-8-monophyly-t">도마뱀</text>
<text x="671" y="153" text-anchor="start" class="ubio-8-monophyly-t">거북</text>
<text x="671" y="183" text-anchor="start" class="ubio-8-monophyly-t">악어</text>
<rect x="665" y="197" width="67" height="22" rx="5" style="fill:var(--fig-soft-red)"/>
<text x="671" y="213" text-anchor="start" class="ubio-8-monophyly-t">새</text>
<line x1="516" y1="87.0625" x2="526" y2="87.0625" class="ubio-8-monophyly-e"/>
<path d="M526 87.0625 L526 58 L661 58" class="ubio-8-monophyly-e"/>
<path d="M526 87.0625 L526 116.125 L553 116.125" class="ubio-8-monophyly-e"/>
<path d="M553 116.125 L553 88 L661 88" class="ubio-8-monophyly-e" style="stroke:var(--fig-red);stroke-width:4"/>
<path d="M553 116.125 L553 144.25 L580 144.25" class="ubio-8-monophyly-e"/>
<path d="M580 144.25 L580 118 L661 118" class="ubio-8-monophyly-e"/>
<path d="M580 144.25 L580 170.5 L607 170.5" class="ubio-8-monophyly-e"/>
<path d="M607 170.5 L607 148 L661 148" class="ubio-8-monophyly-e"/>
<path d="M607 170.5 L607 193.0 L634 193.0" class="ubio-8-monophyly-e"/>
<path d="M634 193.0 L634 178 L661 178" class="ubio-8-monophyly-e"/>
<path d="M634 193.0 L634 208 L661 208" class="ubio-8-monophyly-e" style="stroke:var(--fig-red);stroke-width:4"/>
<circle cx="553" cy="116.125" r="6" style="fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.5;stroke-dasharray:3 2"/>
<text x="624.0" y="258" text-anchor="middle" class="ubio-8-monophyly-t">공통 조상을 빼고 묶음</text>
<text x="624.0" y="278" text-anchor="middle" class="ubio-8-monophyly-s">예: 새 + 포유류('정온 동물')</text>
<text x="360" y="314" text-anchor="middle" class="ubio-8-monophyly-s">점선 동그라미는 새와 포유류의 공통 조상이다. 이 조상은 정온성이 없었으므로,</text>
<text x="360" y="332" text-anchor="middle" class="ubio-8-monophyly-s">'정온 동물'은 두 계통에서 따로 생긴 형질(상사)로 묶은 무리이다.</text>
</svg>
