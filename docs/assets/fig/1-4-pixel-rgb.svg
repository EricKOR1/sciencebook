  <text x="325.0" y="40.0" text-anchor="middle" class="pix14-lbl">화소 하나</text>
  <text x="325.0" y="58.0" text-anchor="middle" class="pix14-sm">세 빛의 밝기(막대 높이)</text>
  <text x="430.0" y="92.0" text-anchor="start" class="pix14-lbl">밝기(0~255)  →  8비트 이진수</text>
  <text x="430.0" y="130.0" text-anchor="start" class="pix14-txt" style="fill:var(--fig-red);font-weight:600">빨강</text>
  <text x="500.0" y="130.0" text-anchor="end" class="pix14-txt">255</text>
  <text x="520.0" y="130.0" text-anchor="start" class="pix14-txt">→</text>
  <text x="546.0" y="130.0" text-anchor="start" class="pix14-mono">11111111</text>
