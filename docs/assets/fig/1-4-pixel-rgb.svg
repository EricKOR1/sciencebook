<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-1-4-pixel-rgb d-1-4-pixel-rgb">
  <title id="t-1-4-pixel-rgb">그림 1-4-3 화소 하나를 0과 1로 나타내기</title>
  <desc id="d-1-4-pixel-rgb">디지털 사진은 작은 화소들로 이루어진다. 화소 하나는 빨강·초록·파랑 빛의 밝기를 각각 8비트(0~255)로 나타내므로 24비트(3바이트)이고, 256×256×256 = 16 777 216가지 색을 나타낼 수 있다. 그림 속 색은 실제 색을 보여 주기 위한 것이다.</desc>
