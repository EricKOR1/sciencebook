<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-uearth-3-melting d-uearth-3-melting">
  <title id="t-uearth-3-melting">그림 일반지구과학 3-3 지온 곡선과 고상선 — 마그마가 생기는 세 가지 방법</title>
  <desc id="d-uearth-3-melting">깊이에 따른 실제 온도(지온 곡선)가 암석이 녹기 시작하는 온도(고상선)보다 낮으면 암석은 고체이다. ① 뜨거운 맨틀이 빠르게 상승하면 온도는 거의 그대로인 채 압력이 줄어 고상선과 만난다(감압 용융, 예제 8의 직선: 약 69 km, 약 1380 °C). ② 섭입판에서 나온 물이 고상선을 크게 낮추면 보통의 지온에서도 녹는다(물 공급). ③ 뜨거운 마그마가 대륙 지각 아래를 데우면 녹는점이 낮은 지각이 녹는다(가열 용융). 직선과 곡선은 단순화한 값이다.</desc>
