<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="t-ochem-1-curved-arrow-rules d-ochem-1-curved-arrow-rules">
  <title id="t-ochem-1-curved-arrow-rules">그림 유기화학 1-13 굽은 화살표 읽는 법</title>
  <desc id="d-ochem-1-curved-arrow-rules">(가) 비공유 전자쌍 → 두 원자 사이: 수산화 이온 O의 전자쌍이 H⁺ 쪽으로 가서 새 O–H 결합이 되어 물이 생긴다. (나) 결합 → 원자: C–Br 결합의 전자쌍이 Br로 가서 Br⁻(전자쌍 4개)와 탄소 양이온이 생긴다. (다) π 결합 → 두 원자 사이: 에텐의 C=C π 전자쌍이 H⁺ 쪽으로 가서 새 C–H 결합이 되고 에틸 양이온이 생긴다. 꼬리는 전자의 출발점, 머리는 전자의 도착점이다. 틀린 예: H⁺에서 염기 쪽으로 그은 화살표(H⁺에는 전자가 없다). 오른쪽 아래 상자는 온화살표(전자 2개)와 낚싯바늘 화살표(전자 1개)의 머리 모양을 비교한다.</desc>
