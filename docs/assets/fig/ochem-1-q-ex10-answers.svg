  <desc id="d-ochem-1-q-ex10-answers">(1) 4-메틸펜트-3-엔-2-온(C₆H₁₀O): 2번 탄소에 C=O, 3–4번 사이에 C=C, 4번에 메틸 가지. (2) (E)-뷰트-2-엔산 에틸(C₆H₁₀O₂): 이중 결합 양쪽의 CH₃와 COOEt가 대각선 반대편에 놓인 트랜스 배치.</desc>
