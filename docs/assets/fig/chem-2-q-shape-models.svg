<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-labelledby="t-chem-2-q-shape-models d-chem-2-q-shape-models">
  <title id="t-chem-2-q-shape-models">그림 화학 2-9 문제 4의 분자 모양 모형</title>
  <desc id="d-chem-2-q-shape-models">ㄱ~ㅁ은 문제에 주어진 다섯 가지 분자 모양을 공–막대 모형으로 나타낸 것이다. 큰 공은 중심 원자, 작은 공은 중심 원자에 결합한 원자이며, 비공유 전자쌍은 나타내지 않았다. 점선 막대와 흐린 공은 종이 뒤쪽, 굵은 막대와 조금 큰 공은 앞쪽에 있는 원자이다.</desc>
