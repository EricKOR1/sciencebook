<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-astro-3-ms-fitting d-astro-3-ms-fitting">
  <title id="t-astro-3-ms-fitting">그림 행성우주과학 3-2 주계열 맞추기로 성단의 거리지수 구하기</title>
  <desc id="d-astro-3-ms-fitting">절대등급으로 그린 표준 주계열(회색 띠)과 먼 성단의 C-M도(파란 점)를 같은 색지수 축 위에 놓으면, 성단의 주계열은 표준 주계열을 세로로 일정하게 내려놓은 모양이다. 같은 색지수에서 두 주계열의 등급 차가 거리지수 m − M이다. 그림은 예제 2의 플레이아데스 값(5.6)으로 그린 모식도이다.</desc>
