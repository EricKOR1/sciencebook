<text x="200" y="440" text-anchor="middle" class="m3-02-general-circulation-l">적도·60° 부근: 공기 상승 → 구름·비가 많다</text><text x="530" y="440" text-anchor="middle" class="m3-02-general-circulation-l">30° 부근·극: 공기 하강 → 맑고 건조</text>
<text x="360" y="462" text-anchor="middle" class="m3-02-general-circulation-t">지구 표면의 굵은 화살표는 지상에서 부는 바람, 바깥 고리는 순환(대기의 두께는 과장함)</text>
