<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-m3-02-general-circulation d-m3-02-general-circulation">
  <title id="t-m3-02-general-circulation">그림 중3-2-3 북반구의 대기 대순환과 지상의 바람</title>
  <desc id="d-m3-02-general-circulation">북반구에는 해들리 순환(0°~30°), 페렐 순환(30°~60°), 극순환(60°~90°)의 세 순환이 있다. 지상에서는 0°~30°에 북동 무역풍, 30°~60°에 편서풍, 60°~90°에 극동풍이 분다. 대기의 두께를 크게 과장한 모식도이다.</desc>
  <style>
    .m3-02-general-circulation-t{font-size:13px;fill:var(--fig-muted)}
    .m3-02-general-circulation-l{font-size:14px;fill:var(--fig-ink)}
    .m3-02-general-circulation-n{font-size:15px;font-weight:700}
  </style>
