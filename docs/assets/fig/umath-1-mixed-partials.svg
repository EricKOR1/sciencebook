<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-umath-1-mixed-partials d-umath-1-mixed-partials">
  <title id="t-umath-1-mixed-partials">그림 수학 도구 1-7 같은 네 수를 두 순서로 읽기</title>
  <desc id="d-umath-1-mixed-partials">작은 직사각형의 네 꼭짓점 값에 +, −, −, + 부호를 붙여 더한 Δ²를, 왼쪽은 가로변의 차이(x 방향 차이)를 먼저 구한 뒤 위아래의 차이로, 오른쪽은 세로변의 차이(y 방향 차이)를 먼저 구한 뒤 좌우의 차이로 읽는다. 같은 네 수의 같은 조합이므로 hk로 나누고 극한을 취한 f_xy와 f_yx는 같다.</desc>
  <style>
    .umath-1-mp-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.3}
    .umath-1-mp-tk{fill:none;stroke:var(--fig-ink);stroke-width:1}
    .umath-1-mp-gr{fill:none;stroke:var(--fig-line);stroke-width:0.7;stroke-dasharray:2 4}
    .umath-1-mp-t{font-size:13px;fill:var(--fig-ink)}
    .umath-1-mp-tb{font-size:14px;fill:var(--fig-ink);font-weight:600}
    .umath-1-mp-m{font-size:13px;fill:var(--fig-muted)}
    .umath-1-mp-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:4px;stroke-linejoin:round}
    .umath-1-mp-blue{fill:var(--fig-blue)} .umath-1-mp-red{fill:var(--fig-red)} .umath-1-mp-green{fill:var(--fig-green)}
    .umath-1-mp-amber{fill:var(--fig-amber)} .umath-1-mp-violet{fill:var(--fig-violet)} .umath-1-mp-teal{fill:var(--fig-teal)}
    .umath-1-mp-ink{fill:var(--fig-ink)} .umath-1-mp-mut{fill:var(--fig-muted)}
  </style>
  <rect x="90" y="110" width="170" height="120" style="fill:var(--fig-soft-blue);stroke:var(--fig-line);stroke-width:1.2"/>
  <circle cx="90.0" cy="230.0" r="13" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.4"/>
  <text x="90.0" y="235.0" text-anchor="middle" class="umath-1-mp-tb">+</text>
  <text x="74.0" y="252.0" text-anchor="end" class="umath-1-mp-m">(x, y)</text>
  <circle cx="260.0" cy="230.0" r="13" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.4"/>
  <text x="260.0" y="235.0" text-anchor="middle" class="umath-1-mp-tb">−</text>
  <text x="276.0" y="252.0" class="umath-1-mp-m">(x+h, y)</text>
  <circle cx="90.0" cy="110.0" r="13" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.4"/>
  <text x="90.0" y="115.0" text-anchor="middle" class="umath-1-mp-tb">−</text>
  <text x="74.0" y="98.0" text-anchor="end" class="umath-1-mp-m">(x, y+k)</text>
  <circle cx="260.0" cy="110.0" r="13" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.4"/>
  <text x="260.0" y="115.0" text-anchor="middle" class="umath-1-mp-tb">+</text>
  <text x="276.0" y="98.0" class="umath-1-mp-m">(x+h, y+k)</text>
  <line x1="108.0" y1="220.0" x2="234.0" y2="220.0" style="stroke:var(--fig-red);stroke-width:2.4;fill:none"/>
  <path d="M242.0 220.0 L232.7 223.7 L232.7 216.3 Z" style="fill:var(--fig-red);stroke:none"/>
  <line x1="108.0" y1="120.0" x2="234.0" y2="120.0" style="stroke:var(--fig-red);stroke-width:2.4;fill:none"/>
  <path d="M242.0 120.0 L232.7 123.7 L232.7 116.3 Z" style="fill:var(--fig-red);stroke:none"/>
  <text x="175.0" y="212.0" text-anchor="middle" class="umath-1-mp-t">① x 방향 차이</text>
  <text x="175.0" y="140.0" text-anchor="middle" class="umath-1-mp-t">① x 방향 차이</text>
  <line x1="175.0" y1="190.0" x2="175.0" y2="162.0" style="stroke:var(--fig-blue);stroke-width:2.4;fill:none"/>
  <path d="M175.0 154.0 L178.7 163.3 L171.3 163.3 Z" style="fill:var(--fig-blue);stroke:none"/>
  <text x="181.0" y="175.0" class="umath-1-mp-t umath-1-mp-halo">② 위 − 아래</text>
  <text x="175.0" y="290.0" text-anchor="middle" class="umath-1-mp-tb">x 방향 차이 먼저 → f<tspan style="font-size:72%" baseline-shift="sub">xy</tspan></text>
  <rect x="460" y="110" width="170" height="120" style="fill:var(--fig-soft-blue);stroke:var(--fig-line);stroke-width:1.2"/>
  <circle cx="460.0" cy="230.0" r="13" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.4"/>
  <text x="460.0" y="235.0" text-anchor="middle" class="umath-1-mp-tb">+</text>
  <text x="444.0" y="252.0" text-anchor="end" class="umath-1-mp-m">(x, y)</text>
  <circle cx="630.0" cy="230.0" r="13" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.4"/>
  <text x="630.0" y="235.0" text-anchor="middle" class="umath-1-mp-tb">−</text>
  <text x="646.0" y="252.0" class="umath-1-mp-m">(x+h, y)</text>
  <circle cx="460.0" cy="110.0" r="13" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.4"/>
  <text x="460.0" y="115.0" text-anchor="middle" class="umath-1-mp-tb">−</text>
  <text x="444.0" y="98.0" text-anchor="end" class="umath-1-mp-m">(x, y+k)</text>
  <circle cx="630.0" cy="110.0" r="13" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.4"/>
  <text x="630.0" y="115.0" text-anchor="middle" class="umath-1-mp-tb">+</text>
  <text x="646.0" y="98.0" class="umath-1-mp-m">(x+h, y+k)</text>
  <line x1="470.0" y1="212.0" x2="470.0" y2="136.0" style="stroke:var(--fig-blue);stroke-width:2.4;fill:none"/>
  <path d="M470.0 128.0 L473.7 137.3 L466.3 137.3 Z" style="fill:var(--fig-blue);stroke:none"/>
  <line x1="620.0" y1="212.0" x2="620.0" y2="136.0" style="stroke:var(--fig-blue);stroke-width:2.4;fill:none"/>
  <path d="M620.0 128.0 L623.7 137.3 L616.3 137.3 Z" style="fill:var(--fig-blue);stroke:none"/>
  <text x="478.0" y="148.0" class="umath-1-mp-t">①</text>
  <text x="612.0" y="148.0" text-anchor="end" class="umath-1-mp-t">①</text>
  <text x="545.0" y="148.0" text-anchor="middle" class="umath-1-mp-m">y 방향 차이</text>
  <line x1="494.0" y1="170.0" x2="588.0" y2="170.0" style="stroke:var(--fig-red);stroke-width:2.4;fill:none"/>
  <path d="M596.0 170.0 L586.7 173.7 L586.7 166.3 Z" style="fill:var(--fig-red);stroke:none"/>
  <text x="545.0" y="192.0" text-anchor="middle" class="umath-1-mp-t umath-1-mp-halo">② 오른쪽 − 왼쪽</text>
  <text x="545.0" y="290.0" text-anchor="middle" class="umath-1-mp-tb">y 방향 차이 먼저 → f<tspan style="font-size:72%" baseline-shift="sub">yx</tspan></text>
  <text x="360.0" y="40.0" text-anchor="middle" class="umath-1-mp-tb">Δ<tspan style="font-size:72%" baseline-shift="super">2</tspan> = f(x+h, y+k) − f(x+h, y) − f(x, y+k) + f(x, y)</text>
  <rect x="292" y="140" width="136" height="64" rx="6" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1"/>
  <text x="360.0" y="164.0" text-anchor="middle" class="umath-1-mp-t">같은 네 수의</text>
  <text x="360.0" y="184.0" text-anchor="middle" class="umath-1-mp-t">같은 조합</text>
  <text x="360.0" y="230.0" text-anchor="middle" class="umath-1-mp-tb">f<tspan style="font-size:72%" baseline-shift="sub">xy</tspan> = f<tspan style="font-size:72%" baseline-shift="sub">yx</tspan></text>
  <text x="360.0" y="250.0" text-anchor="middle" class="umath-1-mp-m">(Δ<tspan style="font-size:72%" baseline-shift="super">2</tspan>/hk, h, k → 0)</text>
</svg>
