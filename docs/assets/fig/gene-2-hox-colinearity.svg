  <rect x="604.0" y="55.0" width="64.0" height="30.0" rx="3" class="gene-2-hox-colinearity-b-green"/>
  <text x="636.0" y="75.0" text-anchor="middle" class="gene-2-hox-colinearity-tx" style="font-size:13px;font-style:italic;font-weight:600">Abd-B</text>
  <text x="20.0" y="160.0" class="gene-2-hox-colinearity-h">몸의 구역(배아)</text>
  <rect x="60.0" y="204.0" width="34.8" height="52.0" rx="2" class="gene-2-hox-colinearity-b-red"/>
  <text x="77.4" y="274.0" text-anchor="middle" class="gene-2-hox-colinearity-sm" style="font-size:12px;font-style:italic">lab</text>
  <line x1="102.0" y1="85.0" x2="77.4" y2="204.0" class="gene-2-hox-colinearity-dash" style="stroke-width:1.2"/>
  <rect x="94.8" y="204.0" width="31.3" height="52.0" rx="2" class="gene-2-hox-colinearity-b-amber"/>
  <text x="110.5" y="274.0" text-anchor="middle" class="gene-2-hox-colinearity-sm" style="font-size:12px;font-style:italic">pb</text>
  <line x1="174.0" y1="85.0" x2="110.5" y2="204.0" class="gene-2-hox-colinearity-dash" style="stroke-width:1.2"/>
  <rect x="126.1" y="204.0" width="41.8" height="52.0" rx="2" class="gene-2-hox-colinearity-b-green"/>
  <text x="147.0" y="274.0" text-anchor="middle" class="gene-2-hox-colinearity-sm" style="font-size:12px;font-style:italic">Dfd</text>
  <line x1="246.0" y1="85.0" x2="147.0" y2="204.0" class="gene-2-hox-colinearity-dash" style="stroke-width:1.2"/>
  <text x="110.5" y="234.0" text-anchor="middle" class="gene-2-hox-colinearity-tx" style="font-size:11px;font-weight:600">머리</text>
  <rect x="167.9" y="204.0" width="48.7" height="52.0" rx="2" class="gene-2-hox-colinearity-b-teal"/>
  <text x="192.3" y="274.0" text-anchor="middle" class="gene-2-hox-colinearity-sm" style="font-size:12px;font-style:italic">Scr</text>
  <line x1="318.0" y1="85.0" x2="192.3" y2="204.0" class="gene-2-hox-colinearity-dash" style="stroke-width:1.2"/>
  <text x="192.3" y="235.0" text-anchor="middle" class="gene-2-hox-colinearity-tx" style="font-size:13px;font-weight:600">T1</text>
  <rect x="216.6" y="204.0" width="48.7" height="52.0" rx="2" class="gene-2-hox-colinearity-b-blue"/>
  <text x="241.0" y="274.0" text-anchor="middle" class="gene-2-hox-colinearity-sm" style="font-size:12px;font-style:italic">Antp</text>
  <line x1="390.0" y1="85.0" x2="241.0" y2="204.0" class="gene-2-hox-colinearity-dash" style="stroke-width:1.2"/>
  <text x="241.0" y="235.0" text-anchor="middle" class="gene-2-hox-colinearity-tx" style="font-size:13px;font-weight:600">T2</text>
  <rect x="265.4" y="204.0" width="48.7" height="52.0" rx="2" class="gene-2-hox-colinearity-b-violet"/>
  <text x="289.7" y="274.0" text-anchor="middle" class="gene-2-hox-colinearity-sm" style="font-size:12px;font-style:italic">Ubx</text>
  <line x1="492.0" y1="85.0" x2="289.7" y2="204.0" class="gene-2-hox-colinearity-dash" style="stroke-width:1.2"/>
  <text x="289.7" y="235.0" text-anchor="middle" class="gene-2-hox-colinearity-tx" style="font-size:13px;font-weight:600">T3</text>
  <rect x="314.1" y="204.0" width="188.0" height="52.0" rx="2" class="gene-2-hox-colinearity-b-red"/>
  <text x="408.1" y="274.0" text-anchor="middle" class="gene-2-hox-colinearity-sm" style="font-size:12px;font-style:italic">abd-A</text>
  <line x1="564.0" y1="85.0" x2="408.1" y2="204.0" class="gene-2-hox-colinearity-dash" style="stroke-width:1.2"/>
  <text x="408.1" y="235.0" text-anchor="middle" class="gene-2-hox-colinearity-tx" style="font-size:13px;font-weight:600">A1~A4</text>
  <rect x="502.0" y="204.0" width="188.0" height="52.0" rx="2" class="gene-2-hox-colinearity-b-green"/>
  <text x="596.0" y="274.0" text-anchor="middle" class="gene-2-hox-colinearity-sm" style="font-size:12px;font-style:italic">Abd-B</text>
  <line x1="636.0" y1="85.0" x2="596.0" y2="204.0" class="gene-2-hox-colinearity-dash" style="stroke-width:1.2"/>
  <text x="596.0" y="235.0" text-anchor="middle" class="gene-2-hox-colinearity-tx" style="font-size:13px;font-weight:600">A5~A8</text>
  <text x="60.0" y="196.0" class="gene-2-hox-colinearity-sm" style="font-size:12px">앞(머리)</text>
  <text x="690.0" y="196.0" text-anchor="end" class="gene-2-hox-colinearity-sm" style="font-size:12px">뒤</text>
  <text x="20.0" y="306.0" class="gene-2-hox-colinearity-tx" style="font-size:13px">· Antp가 머리에서 발현되는 돌연변이 → 더듬이 자리에 다리(안테나페디아 돌연변이)</text>
  <text x="20.0" y="328.0" class="gene-2-hox-colinearity-tx" style="font-size:13px">· Ubx 기능을 잃은 돌연변이 → 평균곤 자리(T3)에 날개가 생겨 날개 4장</text>
</svg>
