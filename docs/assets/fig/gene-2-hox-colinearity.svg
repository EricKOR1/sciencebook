  <rect x="286.0" y="55.0" width="64.0" height="30.0" rx="3" class="gene-2-hox-colinearity-b-teal"/>
  <text x="318.0" y="75.0" text-anchor="middle" class="gene-2-hox-colinearity-tx" style="font-size:13px;font-style:italic;font-weight:600">Scr</text>
  <rect x="358.0" y="55.0" width="64.0" height="30.0" rx="3" class="gene-2-hox-colinearity-b-blue"/>
  <text x="390.0" y="75.0" text-anchor="middle" class="gene-2-hox-colinearity-tx" style="font-size:13px;font-style:italic;font-weight:600">Antp</text>
  <text x="438.0" y="76.0" text-anchor="middle" class="gene-2-hox-colinearity-tx" style="font-weight:700">//</text>
  <rect x="460.0" y="55.0" width="64.0" height="30.0" rx="3" class="gene-2-hox-colinearity-b-violet"/>
  <text x="492.0" y="75.0" text-anchor="middle" class="gene-2-hox-colinearity-tx" style="font-size:13px;font-style:italic;font-weight:600">Ubx</text>
  <rect x="532.0" y="55.0" width="64.0" height="30.0" rx="3" class="gene-2-hox-colinearity-b-red"/>
