<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-gene-2-hox-colinearity d-gene-2-hox-colinearity">
  <title id="t-gene-2-hox-colinearity">그림 생물의 유전 2-9 초파리 혹스 유전자의 배열과 발현 구역</title>
  <desc id="d-gene-2-hox-colinearity">위는 초파리 염색체 위 혹스 유전자 8개의 배열 순서(lab, pb, Dfd, Scr, Antp, Ubx, abd-A, Abd-B)이고, 아래는 각 유전자가 주로 발현되어 마디의 정체성을 정하는 몸의 구역이다. 유전자의 배열 순서가 몸의 앞뒤 순서와 같다. 실제로는 두 묶음으로 나뉘어 있고(//), 발현 구역은 겹치는 부분이 있으나 단순화한 모식도이다.</desc>
  <style>
    .gene-2-hox-colinearity-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .gene-2-hox-colinearity-tx{font-size:14px;fill:var(--fig-ink)}
    .gene-2-hox-colinearity-sm{font-size:13px;fill:var(--fig-muted)}
    .gene-2-hox-colinearity-mono{font-size:14px;font-weight:600;fill:var(--fig-ink);letter-spacing:1px}
    .gene-2-hox-colinearity-ln{fill:none;stroke:var(--fig-ink);stroke-width:2}
    .gene-2-hox-colinearity-lnm{fill:none;stroke:var(--fig-line);stroke-width:1.5}
    .gene-2-hox-colinearity-dash{fill:none;stroke:var(--fig-line);stroke-width:1.5;stroke-dasharray:5 4}
    .gene-2-hox-colinearity-ink{fill:var(--fig-ink)}
    .gene-2-hox-colinearity-paper{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}
    .gene-2-hox-colinearity-gray{fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1.5}
    .gene-2-hox-colinearity-b-blue{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2}
    .gene-2-hox-colinearity-f-blue{fill:var(--fig-blue)}
    .gene-2-hox-colinearity-s-blue{fill:none;stroke:var(--fig-blue);stroke-width:2.5}
    .gene-2-hox-colinearity-t-blue{fill:var(--fig-blue)}
    .gene-2-hox-colinearity-b-red{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2}
    .gene-2-hox-colinearity-f-red{fill:var(--fig-red)}
    .gene-2-hox-colinearity-s-red{fill:none;stroke:var(--fig-red);stroke-width:2.5}
    .gene-2-hox-colinearity-t-red{fill:var(--fig-red)}
    .gene-2-hox-colinearity-b-green{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2}
    .gene-2-hox-colinearity-f-green{fill:var(--fig-green)}
    .gene-2-hox-colinearity-s-green{fill:none;stroke:var(--fig-green);stroke-width:2.5}
    .gene-2-hox-colinearity-t-green{fill:var(--fig-green)}
    .gene-2-hox-colinearity-b-amber{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2}
    .gene-2-hox-colinearity-f-amber{fill:var(--fig-amber)}
    .gene-2-hox-colinearity-s-amber{fill:none;stroke:var(--fig-amber);stroke-width:2.5}
    .gene-2-hox-colinearity-t-amber{fill:var(--fig-amber)}
    .gene-2-hox-colinearity-b-violet{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2}
    .gene-2-hox-colinearity-f-violet{fill:var(--fig-violet)}
    .gene-2-hox-colinearity-s-violet{fill:none;stroke:var(--fig-violet);stroke-width:2.5}
    .gene-2-hox-colinearity-t-violet{fill:var(--fig-violet)}
    .gene-2-hox-colinearity-b-teal{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:2}
    .gene-2-hox-colinearity-f-teal{fill:var(--fig-teal)}
    .gene-2-hox-colinearity-s-teal{fill:none;stroke:var(--fig-teal);stroke-width:2.5}
    .gene-2-hox-colinearity-t-teal{fill:var(--fig-teal)}
  </style>
  <text x="20.0" y="30.0" class="gene-2-hox-colinearity-h">염색체 위의 배열</text>
