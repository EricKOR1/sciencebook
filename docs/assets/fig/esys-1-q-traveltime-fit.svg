<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-esys-1-q-traveltime-fit d-esys-1-q-traveltime-fit">
  <title id="t-esys-1-q-traveltime-fit">그림 지구시스템과학 1-11 문제 12 해설의 주시 곡선</title>
  <desc id="d-esys-1-q-traveltime-fit">측정한 세 점(60 km에서 10.0초, 200 km에서 29.0초, 300 km에서 41.5초)으로 그린 주시 곡선이다. 원점을 지나는 직접파 직선(기울기 1/6.0 s/km)과 세로축 절편 4.0초인 굴절파 직선(기울기 1/8.0 s/km)이 진원 거리 96 km에서 만난다.</desc>
  <style>
    .esys-1-q-traveltime-fit-t{font-size:14px;fill:var(--fig-ink)} .esys-1-q-traveltime-fit-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .esys-1-q-traveltime-fit-s{font-size:13px;fill:var(--fig-muted)} .esys-1-q-traveltime-fit-ax{fill:none;stroke:var(--fig-muted);stroke-width:1.4} .esys-1-q-traveltime-fit-gr{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4}
  </style>
  <line x1="80" y1="300" x2="520" y2="300" class="esys-1-q-traveltime-fit-gr"/>
