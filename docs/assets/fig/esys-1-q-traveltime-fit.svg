  <text x="218" y="292" class="esys-1-q-traveltime-fit-b">교차 거리 96 km</text>
  <circle cx="80" cy="276.9" r="4" style="fill:var(--fig-red)"/>
  <text x="85.5" y="230.7" class="esys-1-q-traveltime-fit-s" style="fill:var(--fig-red)">절편 4.0 s</text>
  <line x1="548" y1="80" x2="582" y2="80" style="stroke:var(--fig-blue);stroke-width:2.6"/>
  <text x="590" y="85" class="esys-1-q-traveltime-fit-b">직접파</text>
  <text x="590" y="105" class="esys-1-q-traveltime-fit-s">t = x / 6.0</text>
  <line x1="548" y1="140" x2="582" y2="140" style="stroke:var(--fig-red);stroke-width:2.6"/>
  <text x="590" y="145" class="esys-1-q-traveltime-fit-b">굴절파</text>
  <text x="590" y="165" class="esys-1-q-traveltime-fit-s">t = x / 8.0 + 4.0</text>
  <circle cx="565" cy="195" r="5" style="fill:var(--fig-ink)"/>
  <text x="590" y="200" class="esys-1-q-traveltime-fit-s">측정한 세 점</text>
  <text x="548" y="240" class="esys-1-q-traveltime-fit-s">교차 거리보다 가까우면</text>
  <text x="548" y="259" class="esys-1-q-traveltime-fit-s">직접파, 멀면 굴절파가</text>
  <text x="548" y="278" class="esys-1-q-traveltime-fit-s">먼저 도착한다.</text>
</svg>
