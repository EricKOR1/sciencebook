  <text x="410" y="319" text-anchor="middle" class="esys-1-q-traveltime-fit-s">240</text>
  <line x1="465" y1="300" x2="465" y2="40" class="esys-1-q-traveltime-fit-gr"/>
  <text x="465" y="319" text-anchor="middle" class="esys-1-q-traveltime-fit-s">280</text>
