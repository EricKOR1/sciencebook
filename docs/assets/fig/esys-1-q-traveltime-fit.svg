  <text x="526" y="338" text-anchor="end" class="esys-1-q-traveltime-fit-s">진원 거리(km)</text>
  <text x="74" y="26" text-anchor="start" class="esys-1-q-traveltime-fit-s">첫 도착 시간(s)</text>
  <path d="M80 300 L286.2 155.6" style="fill:none;stroke:var(--fig-blue);stroke-width:2.6"/>
  <path d="M80 276.9 L520 45.8" style="fill:none;stroke:var(--fig-red);stroke-width:2.6;stroke-dasharray:8 5"/>
  <path d="M212 207.6 L520 45.8" style="fill:none;stroke:var(--fig-red);stroke-width:2.6"/>
