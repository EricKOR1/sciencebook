  <text x="74" y="276.1" text-anchor="end" class="esys-1-q-traveltime-fit-s">5</text>
  <line x1="80" y1="242.2" x2="520" y2="242.2" class="esys-1-q-traveltime-fit-gr"/>
  <text x="74" y="247.2" text-anchor="end" class="esys-1-q-traveltime-fit-s">10</text>
  <line x1="80" y1="213.3" x2="520" y2="213.3" class="esys-1-q-traveltime-fit-gr"/>
  <text x="74" y="218.3" text-anchor="end" class="esys-1-q-traveltime-fit-s">15</text>
  <line x1="80" y1="184.4" x2="520" y2="184.4" class="esys-1-q-traveltime-fit-gr"/>
  <text x="74" y="189.4" text-anchor="end" class="esys-1-q-traveltime-fit-s">20</text>
