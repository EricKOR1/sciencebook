<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-uchem-11-concentration-cell d-uchem-11-concentration-cell">
  <title id="t-uchem-11-concentration-cell">그림 일반화학 11-5 구리 농도차 전지</title>
  <desc id="d-uchem-11-concentration-cell">두 전극이 모두 구리이고 Cu²⁺ 농도만 0.010 M과 1.0 M으로 다르다. E° = 0이지만 E = −(0.0592/2) log(0.010/1.0) = +0.0592 V이다. 묽은 쪽 구리가 녹아 Cu²⁺가 늘어나는 산화 전극(−)이 되고, 진한 쪽에서는 Cu²⁺가 구리로 석출되는 환원 전극(+)이 된다. 전자는 도선을 따라 묽은 쪽에서 진한 쪽으로 흐르고, 두 농도가 같아지면 전위가 0이 된다.</desc>
  <style>.uchem-11-concentration-cell-t{font-size:14px;fill:var(--fig-ink)} .uchem-11-concentration-cell-s{font-size:13px;fill:var(--fig-muted)} .uchem-11-concentration-cell-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}</style>
  <rect x="60.0" y="192.0" width="180.0" height="98.0" rx="0" style="fill:var(--fig-soft-blue);stroke:none;stroke-width:0;fill-opacity:0.35"/>
  <path d="M60 170 L60 290 L240 290 L240 170" style="fill:none;stroke:var(--fig-muted);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>
  <rect x="480.0" y="192.0" width="180.0" height="98.0" rx="0" style="fill:var(--fig-soft-blue);stroke:none;stroke-width:0;fill-opacity:1.0"/>
  <path d="M480 170 L480 290 L660 290 L660 170" style="fill:none;stroke:var(--fig-muted);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>
  <rect x="480.0" y="192.0" width="180.0" height="98.0" rx="0" style="fill:var(--fig-blue);stroke:none;stroke-width:0;fill-opacity:0.25"/>
  <rect x="131.0" y="140.0" width="18.0" height="130.0" rx="0" style="fill:var(--fig-amber);stroke:var(--fig-muted);stroke-width:1.4"/>
  <rect x="551.0" y="140.0" width="18.0" height="130.0" rx="0" style="fill:var(--fig-amber);stroke:var(--fig-muted);stroke-width:1.4"/>
  <path d="M210 250 L210 160 Q210 150 220 150 L500 150 Q510 150 510 160 L510 250" style="fill:none;stroke:var(--fig-amber);stroke-width:18;stroke-linejoin:round;stroke-linecap:round;stroke-linecap:butt"/>
  <path d="M210 250 L210 160 Q210 150 220 150 L500 150 Q510 150 510 160 L510 250" style="fill:none;stroke:var(--fig-soft-amber);stroke-width:13;stroke-linejoin:round;stroke-linecap:round;stroke-linecap:butt"/>
  <text x="360.0" y="172.0" text-anchor="middle" class="uchem-11-concentration-cell-s">염다리 (KNO₃)</text>
  <line x1="140.0" y1="140.0" x2="140.0" y2="70.0" style="stroke:var(--fig-ink);stroke-width:2;stroke-linecap:round"/>
  <line x1="560.0" y1="140.0" x2="560.0" y2="70.0" style="stroke:var(--fig-ink);stroke-width:2;stroke-linecap:round"/>
  <line x1="140.0" y1="70.0" x2="335.0" y2="70.0" style="stroke:var(--fig-ink);stroke-width:2;stroke-linecap:round"/>
  <line x1="385.0" y1="70.0" x2="560.0" y2="70.0" style="stroke:var(--fig-ink);stroke-width:2;stroke-linecap:round"/>
  <circle cx="360.0" cy="70.0" r="25.0" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2"/>
  <text x="360.0" y="66.0" text-anchor="middle" class="uchem-11-concentration-cell-b">V</text>
  <text x="360.0" y="84.0" text-anchor="middle" class="uchem-11-concentration-cell-s" style="font-size:11px">0.0592</text>
  <line x1="170.0" y1="56.0" x2="293.0" y2="56.0" style="stroke:var(--fig-violet);stroke-width:2;stroke-linecap:round"/>
  <polygon points="300.0,56.0 292.0,59.6 292.0,52.4" style="fill:var(--fig-violet);stroke:none;stroke-width:1;stroke-linejoin:round"/>
  <line x1="420.0" y1="56.0" x2="533.0" y2="56.0" style="stroke:var(--fig-violet);stroke-width:2;stroke-linecap:round"/>
  <polygon points="540.0,56.0 532.0,59.6 532.0,52.4" style="fill:var(--fig-violet);stroke:none;stroke-width:1;stroke-linejoin:round"/>
  <text x="235.0" y="48.0" text-anchor="middle" class="uchem-11-concentration-cell-t" style="fill:var(--fig-violet);font-weight:600">e⁻</text>
  <text x="480.0" y="48.0" text-anchor="middle" class="uchem-11-concentration-cell-t" style="fill:var(--fig-violet);font-weight:600">e⁻</text>
  <text x="126.0" y="158.0" text-anchor="end" class="uchem-11-concentration-cell-t" style="font-weight:600">Cu</text>
  <text x="574.0" y="158.0" class="uchem-11-concentration-cell-t" style="font-weight:600">Cu</text>
  <text x="72.0" y="222.0" class="uchem-11-concentration-cell-s" style="fill:var(--fig-blue)">0.010 M</text>
  <text x="72.0" y="240.0" class="uchem-11-concentration-cell-s" style="fill:var(--fig-blue)">Cu²⁺</text>
  <text x="584.0" y="222.0" class="uchem-11-concentration-cell-s" style="fill:var(--fig-ink)">1.0 M</text>
  <text x="584.0" y="240.0" class="uchem-11-concentration-cell-s" style="fill:var(--fig-ink)">Cu²⁺</text>
  <line x1="165.0" y1="275.0" x2="194.4" y2="264.1" style="stroke:var(--fig-blue);stroke-width:1.6;stroke-linecap:round"/>
  <polygon points="200.0,262.0 194.5,267.4 192.3,261.5" style="fill:var(--fig-blue);stroke:none;stroke-width:1;stroke-linejoin:round"/>
  <text x="70.0" y="284.0" class="uchem-11-concentration-cell-s" style="font-size:12px;fill:var(--fig-blue)">Cu²⁺ 늘어남</text>
  <line x1="520.0" y1="262.0" x2="542.5" y2="252.4" style="stroke:var(--fig-blue);stroke-width:1.6;stroke-linecap:round"/>
  <polygon points="548.0,250.0 542.8,255.7 540.3,249.9" style="fill:var(--fig-blue);stroke:none;stroke-width:1;stroke-linejoin:round"/>
  <text x="490.0" y="284.0" class="uchem-11-concentration-cell-s" style="font-size:12px;fill:var(--fig-blue)">Cu²⁺ 줄어듦</text>
  <text x="310.0" y="210.0" class="uchem-11-concentration-cell-s"></text>
  <text x="150.0" y="316.0" text-anchor="middle" class="uchem-11-concentration-cell-t" style="fill:var(--fig-blue);font-weight:600">산화 전극 (−)</text>
  <text x="150.0" y="336.0" text-anchor="middle" class="uchem-11-concentration-cell-s">Cu → Cu²⁺ + 2e⁻</text>
  <text x="150.0" y="354.0" text-anchor="middle" class="uchem-11-concentration-cell-s">묽은 쪽이 진해진다</text>
  <text x="570.0" y="316.0" text-anchor="middle" class="uchem-11-concentration-cell-t" style="fill:var(--fig-red);font-weight:600">환원 전극 (+)</text>
  <text x="570.0" y="336.0" text-anchor="middle" class="uchem-11-concentration-cell-s">Cu²⁺ + 2e⁻ → Cu</text>
  <text x="570.0" y="354.0" text-anchor="middle" class="uchem-11-concentration-cell-s">진한 쪽이 묽어진다</text>
  <text x="360.0" y="230.0" text-anchor="middle" class="uchem-11-concentration-cell-t">E° = 0 이지만</text>
  <text x="360.0" y="252.0" text-anchor="middle" class="uchem-11-concentration-cell-s">E = −(0.0592/2) log(0.010/1.0)</text>
  <text x="360.0" y="272.0" text-anchor="middle" class="uchem-11-concentration-cell-t" style="fill:var(--fig-green);font-weight:600">= +0.0592 V</text>
  <text x="360.0" y="316.0" text-anchor="middle" class="uchem-11-concentration-cell-s">두 농도가 같아지면</text>
  <text x="360.0" y="334.0" text-anchor="middle" class="uchem-11-concentration-cell-s">E = 0 (평형)</text>
</svg>
