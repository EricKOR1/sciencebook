  <title id="t-ochem-2-q-p6-staggered">그림 유기화학 2-26 문제 6 풀이: 2,3-다이메틸뷰테인 C2–C3의 형태</title>
  <desc id="d-ochem-2-q-p6-staggered">(가) 앞·뒤 H가 안티인 엇갈린 형태: CH₃/CH₃ 고시 2개, 7.6 kJ/mol(가장 안정). (나)·(다) 서로 거울상인 엇갈린 형태: 고시 3개, 11.4 kJ/mol. (라) 가장 에너지가 높은 가린 형태: 앞·뒤 H가 겹치고 CH₃/CH₃ 가림 두 쌍, 2 × 11 + 4.0 = 약 26 kJ/mol. 붉은 호는 메틸 사이의 고시 상호작용이다.</desc>
