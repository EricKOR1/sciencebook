<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="t-uchem-1-burette-reading d-uchem-1-burette-reading">
  <title id="t-uchem-1-burette-reading">그림 일반화학 1-1 뷰렛 눈금 읽기</title>
  <desc id="d-uchem-1-burette-reading">뷰렛의 눈금은 0.1 mL 간격이고 위에서 아래로 커진다. 눈높이를 메니스커스(액면의 오목한 곡면) 아랫면에 맞추고, 눈금 사이를 어림해 0.01 mL 자리까지 읽는다. 그림의 읽은 값은 20.27 mL이며 마지막 자리 7이 어림한 숫자이다(확대 모식도).</desc>
  <style>
    .uchem-1-burette-reading-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-1-burette-reading-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-1-burette-reading-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}

  </style>
  <rect x="150.0" y="123.0" width="50.0" height="127.0" rx="0" style="fill:var(--fig-soft-blue);stroke:none"/>
  <path d="M150 122.99999999999989 Q175.0 138.9999999999999 200 122.99999999999989 Z" style="fill:var(--fig-paper);stroke:none;stroke-width:0"/>
  <path d="M150 122.99999999999989 Q175.0 138.9999999999999 200 122.99999999999989" style="fill:none;stroke:var(--fig-blue);stroke-width:2"/>
  <line x1="150.0" y1="30.0" x2="150.0" y2="250.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <line x1="200.0" y1="30.0" x2="200.0" y2="250.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <line x1="150.0" y1="50.0" x2="176.0" y2="50.0" style="stroke:var(--fig-ink);stroke-width:1.8"/>
  <text x="142.0" y="55.0" text-anchor="end" class="uchem-1-burette-reading-t">20.0</text>
  <line x1="150.0" y1="80.0" x2="176.0" y2="80.0" style="stroke:var(--fig-ink);stroke-width:1.8"/>
  <text x="142.0" y="85.0" text-anchor="end" class="uchem-1-burette-reading-t">20.1</text>
  <line x1="150.0" y1="110.0" x2="176.0" y2="110.0" style="stroke:var(--fig-ink);stroke-width:1.8"/>
  <text x="142.0" y="115.0" text-anchor="end" class="uchem-1-burette-reading-t">20.2</text>
  <line x1="150.0" y1="140.0" x2="176.0" y2="140.0" style="stroke:var(--fig-ink);stroke-width:1.8"/>
  <text x="142.0" y="145.0" text-anchor="end" class="uchem-1-burette-reading-t">20.3</text>
  <line x1="150.0" y1="170.0" x2="176.0" y2="170.0" style="stroke:var(--fig-ink);stroke-width:1.8"/>
  <text x="142.0" y="175.0" text-anchor="end" class="uchem-1-burette-reading-t">20.4</text>
  <line x1="150.0" y1="200.0" x2="176.0" y2="200.0" style="stroke:var(--fig-ink);stroke-width:1.8"/>
  <text x="142.0" y="205.0" text-anchor="end" class="uchem-1-burette-reading-t">20.5</text>
  <line x1="150.0" y1="230.0" x2="176.0" y2="230.0" style="stroke:var(--fig-ink);stroke-width:1.8"/>
  <text x="142.0" y="235.0" text-anchor="end" class="uchem-1-burette-reading-t">20.6</text>
  <text x="142.0" y="22.0" text-anchor="end" class="uchem-1-burette-reading-s">mL</text>
  <line x1="204.0" y1="131.0" x2="282.0" y2="131.0" style="stroke:var(--fig-accent);stroke-width:1.5;stroke-dasharray:5 4"/>
  <path d="M284 130.9999999999999 Q300 118.99999999999989 316 130.9999999999999 Q300 142.9999999999999 284 130.9999999999999 Z" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.5"/>
  <circle cx="300.0" cy="131.0" r="5.0" style="fill:var(--fig-ink);stroke:none"/>
  <text x="326.0" y="127.0" class="uchem-1-burette-reading-t">눈높이 = 메니스커스 아랫면</text>
  <rect x="360.0" y="150.0" width="340.0" height="96.0" rx="8" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <text x="376.0" y="176.0" class="uchem-1-burette-reading-b">읽은 값: 20.2<tspan style="fill:var(--fig-red);font-weight:600">7</tspan> mL</text>
  <text x="376.0" y="200.0" class="uchem-1-burette-reading-t">20.2까지는 눈금으로 확실, 마지막 7은 어림</text>
  <text x="376.0" y="222.0" class="uchem-1-burette-reading-t">→ 유효 숫자 4개 (0.01 mL 자리까지)</text>
  <text x="376.0" y="240.0" class="uchem-1-burette-reading-s">적정 부피 = 나중 읽기 − 처음 읽기</text>
  <text x="376.0" y="56.0" class="uchem-1-burette-reading-s">0.1 mL 간격 눈금 사이를</text>
  <text x="376.0" y="74.0" class="uchem-1-burette-reading-s">열 칸으로 나누어 어림한다</text>
</svg>
