<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-m1-07-planet-groups d-m1-07-planet-groups">
  <title id="t-m1-07-planet-groups">그림 중1-7-1 지구형 행성과 목성형 행성</title>
  <desc id="d-m1-07-planet-groups">여덟 행성을 실제 반지름 비율로 그리고, 그 아래에 평균 밀도를 막대로 비교했다. 목성형 행성은 훨씬 크지만 밀도는 작고, 토성은 물보다도 밀도가 작다.</desc>
  <style>.m1-07-planet-groups-t{font-size:14px;fill:var(--fig-ink)} .m1-07-planet-groups-b{font-size:15px;font-weight:600} .m1-07-planet-groups-s{font-size:13px;fill:var(--fig-muted)}
    .m1-07-planet-groups-ter{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5} .m1-07-planet-groups-jov{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5}
    .m1-07-planet-groups-ring{fill:none;stroke:var(--fig-muted);stroke-width:1.2} .m1-07-planet-groups-ax{stroke:var(--fig-line);stroke-width:1}</style>
  <rect x="14" y="14" width="176" height="56" rx="8" style="fill:var(--fig-soft-amber)"/>
  <text x="102" y="36" text-anchor="middle" class="m1-07-planet-groups-t m1-07-planet-groups-b" style="fill:var(--fig-amber)">지구형 행성</text>
  <text x="102" y="58" text-anchor="middle" class="m1-07-planet-groups-s">작고 밀도가 크다 · 암석 표면</text>
  <rect x="214" y="14" width="492" height="56" rx="8" style="fill:var(--fig-soft-blue)"/>
  <text x="460" y="36" text-anchor="middle" class="m1-07-planet-groups-t m1-07-planet-groups-b" style="fill:var(--fig-blue)">목성형 행성</text>
  <text x="460" y="58" text-anchor="middle" class="m1-07-planet-groups-s">크고 밀도가 작다 · 기체가 주성분 · 고리와 위성이 많다</text>
  <line x1="202" y1="84" x2="202" y2="440" style="stroke:var(--fig-line);stroke-width:1.5;stroke-dasharray:5 5"/>
  <text x="202" y="456" text-anchor="middle" class="m1-07-planet-groups-s">소행성대</text>
  <circle cx="40" cy="150" r="2.1" class="m1-07-planet-groups-ter"/>
  <text x="40" y="242" text-anchor="middle" class="m1-07-planet-groups-t">수성</text>
  <circle cx="80" cy="150" r="5.2" class="m1-07-planet-groups-ter"/>
  <text x="80" y="242" text-anchor="middle" class="m1-07-planet-groups-t">금성</text>
  <circle cx="120" cy="150" r="5.5" class="m1-07-planet-groups-ter"/>
  <text x="120" y="242" text-anchor="middle" class="m1-07-planet-groups-t">지구</text>
  <circle cx="160" cy="150" r="2.9" class="m1-07-planet-groups-ter"/>
  <text x="160" y="242" text-anchor="middle" class="m1-07-planet-groups-t">화성</text>
  <ellipse cx="262" cy="150" rx="98.6" ry="15.4" class="m1-07-planet-groups-ring" style="stroke-dasharray:3 3"/>
  <circle cx="262" cy="150" r="61.6" class="m1-07-planet-groups-jov"/>
  <text x="262" y="242" text-anchor="middle" class="m1-07-planet-groups-t">목성</text>
  <ellipse cx="445" cy="150" rx="113.7" ry="21.7" class="m1-07-planet-groups-ring" style="stroke:var(--fig-amber);stroke-width:2.5"/>
  <circle cx="445" cy="150" r="51.7" class="m1-07-planet-groups-jov"/>
  <path d="M331.3 150 A113.7 21.7 0 0 0 558.7 150" class="m1-07-planet-groups-ring" style="stroke:var(--fig-amber);stroke-width:2.5"/>
  <text x="445" y="242" text-anchor="middle" class="m1-07-planet-groups-t">토성</text>
  <ellipse cx="598" cy="150" rx="5.5" ry="37.4" class="m1-07-planet-groups-ring" style="stroke-dasharray:3 3"/>
  <circle cx="598" cy="150" r="22.0" class="m1-07-planet-groups-jov"/>
  <text x="598" y="242" text-anchor="middle" class="m1-07-planet-groups-t">천왕성</text>
  <ellipse cx="672" cy="150" rx="34.3" ry="5.4" class="m1-07-planet-groups-ring" style="stroke-dasharray:3 3"/>
  <circle cx="672" cy="150" r="21.4" class="m1-07-planet-groups-jov"/>
  <text x="672" y="242" text-anchor="middle" class="m1-07-planet-groups-t">해왕성</text>
  <text x="360" y="268" text-anchor="middle" class="m1-07-planet-groups-s">원의 크기 = 실제 반지름 비율 (행성 사이의 거리는 실제와 다름)</text>
  <text x="10" y="300" class="m1-07-planet-groups-s">평균 밀도 (g/cm³)</text>
  <line x1="20" y1="430" x2="706" y2="430" class="m1-07-planet-groups-ax"/>
  <line x1="20" y1="406" x2="706" y2="406" style="stroke:var(--fig-teal);stroke-width:1.5;stroke-dasharray:6 4"/>
  <text x="530" y="400" text-anchor="middle" class="m1-07-planet-groups-s" style="fill:var(--fig-teal)">물의 밀도 1 g/cm³</text>
  <rect x="29" y="300.4" width="22" height="129.6" class="m1-07-planet-groups-ter"/>
  <text x="40" y="294.4" text-anchor="middle" class="m1-07-planet-groups-t" style="font-size:13px">5.4</text>
  <rect x="69" y="305.2" width="22" height="124.8" class="m1-07-planet-groups-ter"/>
  <text x="80" y="299.2" text-anchor="middle" class="m1-07-planet-groups-t" style="font-size:13px">5.2</text>
  <rect x="109" y="298.0" width="22" height="132.0" class="m1-07-planet-groups-ter"/>
  <text x="120" y="292.0" text-anchor="middle" class="m1-07-planet-groups-t" style="font-size:13px">5.5</text>
  <rect x="149" y="336.4" width="22" height="93.6" class="m1-07-planet-groups-ter"/>
  <text x="160" y="330.4" text-anchor="middle" class="m1-07-planet-groups-t" style="font-size:13px">3.9</text>
  <rect x="251" y="398.8" width="22" height="31.2" class="m1-07-planet-groups-jov"/>
  <text x="262" y="392.8" text-anchor="middle" class="m1-07-planet-groups-t" style="font-size:13px">1.3</text>
  <rect x="434" y="413.2" width="22" height="16.8" class="m1-07-planet-groups-jov"/>
  <text x="445" y="407.2" text-anchor="middle" class="m1-07-planet-groups-t" style="font-size:13px">0.7</text>
  <rect x="587" y="398.8" width="22" height="31.2" class="m1-07-planet-groups-jov"/>
  <text x="598" y="392.8" text-anchor="middle" class="m1-07-planet-groups-t" style="font-size:13px">1.3</text>
  <rect x="661" y="391.6" width="22" height="38.4" class="m1-07-planet-groups-jov"/>
  <text x="672" y="385.6" text-anchor="middle" class="m1-07-planet-groups-t" style="font-size:13px">1.6</text>
</svg>
