<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="t-uearth-5-korea-history d-uearth-5-korea-history">
<title id="t-uearth-5-korea-history">그림 일반지구과학 5-9 한반도 지층과 암석의 순서(모식 주상도)</title>
<desc id="d-uearth-5-korea-history">아래에서 위로 선캄브리아 시대의 육괴 변성암, 조선 누층군, 대결층의 평행 부정합, 평안 누층군, 대동 누층군, 경상 누층군, 신생대 지층과 화산암이 놓인다. 쥐라기의 대보 화강암과 백악기 말의 불국사 화강암은 그보다 오래된 지층을 뚫고 관입했다.</desc>
<style>
.uearth-5-korea-history-t{font-size:14px;fill:var(--fig-ink)} .uearth-5-korea-history-s{font-size:13px;fill:var(--fig-muted)} .uearth-5-korea-history-b{font-size:14px;fill:var(--fig-ink);font-weight:600}
</style>
<rect x="0" y="0" width="720" height="480" style="fill:var(--fig-paper)"/>
<text x="20" y="30" class="uearth-5-korea-history-b">시대</text><text x="236.0" y="30" text-anchor="middle" class="uearth-5-korea-history-b">모식 주상도</text><text x="300" y="30" class="uearth-5-korea-history-b">지층·암석과 사건</text>
<rect x="196" y="44" width="80" height="46" style="fill:var(--fig-soft-amber);stroke:var(--fig-line);stroke-width:1"/>
<text x="20" y="72.0" class="uearth-5-korea-history-t">신생대</text>
<text x="300" y="64.0" class="uearth-5-korea-history-t">동해안 일부 해성층(포항 분지), 현무암</text><text x="300" y="81.0" class="uearth-5-korea-history-s">동해가 열림 · 제주도·울릉도·독도·백두산 화산</text>
<rect x="196" y="90" width="80" height="58" style="fill:var(--fig-soft-green);stroke:var(--fig-line);stroke-width:1"/>
<text x="20" y="124.0" class="uearth-5-korea-history-t">백악기</text>
<text x="300" y="116.0" class="uearth-5-korea-history-t">경상 누층군: 호수·하천 퇴적층, 화산암</text><text x="300" y="133.0" class="uearth-5-korea-history-s">공룡 발자국·알(고성·해남·화순) · 말기 불국사 화강암</text>
<rect x="196" y="148" width="80" height="50" style="fill:var(--fig-soft-teal);stroke:var(--fig-line);stroke-width:1"/>
<text x="20" y="178.0" class="uearth-5-korea-history-t">쥐라기</text>
<text x="300" y="170.0" class="uearth-5-korea-history-t">대동 누층군: 하천·호수 퇴적층</text><text x="300" y="187.0" class="uearth-5-korea-history-s">대보 조산 운동(습곡·단층) · 대보 화강암 관입</text>
<rect x="196" y="198" width="80" height="28" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1"/>
<text x="20" y="217.0" class="uearth-5-korea-history-t">트라이아스기</text>
<text x="300" y="217.0" class="uearth-5-korea-history-s">송림 변동(지각 변동)</text>
<rect x="196" y="226" width="80" height="50" style="fill:var(--fig-soft-blue);stroke:var(--fig-line);stroke-width:1"/>
<text x="20" y="248.0" class="uearth-5-korea-history-t">고생대 후기~</text><text x="20" y="264.0" class="uearth-5-korea-history-t">중생대 초</text>
<text x="300" y="248.0" class="uearth-5-korea-history-t">평안 누층군: 사암·셰일·석탄층</text><text x="300" y="265.0" class="uearth-5-korea-history-s">바다와 육지가 번갈아 · 무연탄(태백·삼척)</text>
<path d="M190 308 q10 -6 20 0 t20 0 t20 0 t20 0 t12 0" style="fill:none;stroke:var(--fig-red);stroke-width:2.4"/>
<text x="20" y="289.0" class="uearth-5-korea-history-t">오르도비스기 중기~</text><text x="20" y="305.0" class="uearth-5-korea-history-t">석탄기 전기</text>
<text x="300" y="297.0" class="uearth-5-korea-history-t" style="fill:var(--fig-red)">지층 없음(대결층) → 평행 부정합</text>
<rect x="196" y="308" width="80" height="56" style="fill:var(--fig-soft-teal);stroke:var(--fig-line);stroke-width:1"/>
<text x="20" y="341.0" class="uearth-5-korea-history-t">고생대 전기</text>
<text x="300" y="333.0" class="uearth-5-korea-history-t">조선 누층군: 석회암·셰일</text><text x="300" y="350.0" class="uearth-5-korea-history-s">얕은 바다 · 삼엽충 · 석회 동굴(강원 남부·단양)</text>
<path d="M190 378 q10 -6 20 0 t20 0 t20 0 t20 0 t12 0" style="fill:none;stroke:var(--fig-red);stroke-width:2.4"/>
<text x="290" y="382" class="uearth-5-korea-history-s" style="fill:var(--fig-red)">난정합</text>
<rect x="196" y="378" width="80" height="58" style="fill:var(--fig-soft-violet);stroke:var(--fig-line);stroke-width:1"/>
<text x="20" y="412.0" class="uearth-5-korea-history-t">선캄브리아 시대</text>
<text x="300" y="404.0" class="uearth-5-korea-history-t">육괴의 편마암·편암(약 25억~18억 년 전)</text><text x="300" y="421.0" class="uearth-5-korea-history-s">깊은 곳에서 변성 → 한반도의 기반</text>
<line x1="20" y1="90" x2="186" y2="90" style="stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:2 3"/>
<line x1="20" y1="148" x2="186" y2="148" style="stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:2 3"/>
