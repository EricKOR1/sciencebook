<line x1="20" y1="276" x2="186" y2="276" style="stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:2 3"/>
<line x1="20" y1="308" x2="186" y2="308" style="stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:2 3"/>
<line x1="20" y1="364" x2="186" y2="364" style="stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:2 3"/>
<line x1="20" y1="378" x2="186" y2="378" style="stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:2 3"/>
<line x1="20" y1="436" x2="186" y2="436" style="stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:2 3"/>
<path d="M203.0 436 C 203.0 192, 208.5 162, 214 162 C 219.5 162, 225.0 192, 225.0 436 Z" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
<path d="M246.0 436 C 246.0 138, 251.0 108, 256 108 C 261.0 108, 266.0 138, 266.0 436 Z" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
<text x="214" y="454" text-anchor="middle" class="uearth-5-korea-history-s" style="fill:var(--fig-red)">대보</text>
<text x="258" y="454" text-anchor="middle" class="uearth-5-korea-history-s" style="fill:var(--fig-red)">불국사</text>
<text x="20" y="476" class="uearth-5-korea-history-s">붉은 기둥: 화강암 관입(위 끝이 관입한 시기) · 물결선: 부정합 · 두께와 간격은 실제 비율이 아닌 모식</text>
</svg>