  <circle cx="143.0" cy="156.0" r="4.0" class="gene-3-sickle-editing-b-blue" style="stroke-width:1"/>
  <rect x="188.0" y="14.0" width="168.0" height="300.0" rx="8" class="gene-3-sickle-editing-gray"/>
  <text x="198.0" y="40.0" class="gene-3-sickle-editing-h" style="font-size:14px">② 체외 편집</text>
