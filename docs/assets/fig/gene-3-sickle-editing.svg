  <text x="485.0" y="101.0" text-anchor="middle" class="gene-3-sickle-editing-sm" style="font-size:12px">태아형</text>
  <text x="485.0" y="124.0" text-anchor="middle" class="gene-3-sickle-editing-sm" style="font-size:12px">꺼짐</text>
  <text x="372.0" y="160.0" class="gene-3-sickle-editing-sm" style="font-size:12px">편집 후</text>
  <circle cx="402.0" cy="184.0" r="12.0" class="gene-3-sickle-editing-paper" style="stroke-dasharray:3 2"/>
  <text x="402.0" y="188.0" text-anchor="middle" class="gene-3-sickle-editing-sm" style="font-size:11px">B</text>
  <rect x="452.0" y="174.0" width="66.0" height="20.0" rx="0" class="gene-3-sickle-editing-b-green"/>
  <text x="485.0" y="189.0" text-anchor="middle" class="gene-3-sickle-editing-tx" style="font-size:12px">태아형</text>
  <text x="485.0" y="212.0" text-anchor="middle" class="gene-3-sickle-editing-sm" style="font-size:12px;fill:var(--fig-green);font-weight:700">켜짐!</text>
  <text x="402.0" y="218.0" text-anchor="middle" class="gene-3-sickle-editing-sm" style="font-size:11px">B = BCL11A</text>
  <rect x="536.0" y="14.0" width="168.0" height="300.0" rx="8" class="gene-3-sickle-editing-gray"/>
  <text x="546.0" y="40.0" class="gene-3-sickle-editing-h" style="font-size:14px">④ 다시 넣기</text>
  <text x="546.0" y="250.0" class="gene-3-sickle-editing-sm" style="font-size:12px">기존 골수 세포를 없앤 뒤</text>
  <text x="546.0" y="267.0" class="gene-3-sickle-editing-sm" style="font-size:12px">편집 세포를 넣는다</text>
  <text x="546.0" y="284.0" class="gene-3-sickle-editing-sm" style="font-size:12px">→ 낫 모양 적혈구 감소</text>
  <circle cx="586.0" cy="110.0" r="14.0" class="gene-3-sickle-editing-paper"/>
  <path d="M 560 180 Q 560 130 586 128 Q 612 130 612 180 Z" class="gene-3-sickle-editing-paper"/>
  <circle cx="666.0" cy="86.0" r="9.0" class="gene-3-sickle-editing-b-green"/>
  <circle cx="666.0" cy="86.0" r="3.6" class="gene-3-sickle-editing-b-blue" style="stroke-width:1"/>
  <circle cx="682.0" cy="106.0" r="9.0" class="gene-3-sickle-editing-b-green"/>
  <circle cx="682.0" cy="106.0" r="3.6" class="gene-3-sickle-editing-b-blue" style="stroke-width:1"/>
  <circle cx="660.0" cy="116.0" r="9.0" class="gene-3-sickle-editing-b-green"/>
  <circle cx="660.0" cy="116.0" r="3.6" class="gene-3-sickle-editing-b-blue" style="stroke-width:1"/>
