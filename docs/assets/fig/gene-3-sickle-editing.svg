<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-gene-3-sickle-editing d-gene-3-sickle-editing">
  <title id="t-gene-3-sickle-editing">그림 생물의 유전 3-6 낫 모양 적혈구 빈혈증의 유전자 편집 치료 과정</title>
  <desc id="d-gene-3-sickle-editing">① 환자의 골수에서 조혈모세포를 채취한다. ② 체외에서 크리스퍼로 BCL11A 유전자 중 적혈구 계열 세포에서 작동하는 조절 부위를 자른다. ③ 태아형 헤모글로빈 유전자의 발현을 억제하던 BCL11A 단백질이 줄어 태아형 헤모글로빈 유전자가 다시 켜진다. ④ 기존 골수 세포를 약물로 없앤 뒤 편집한 세포를 다시 넣으면, 적혈구가 낫 모양이 되지 않는 태아형 헤모글로빈을 만든다. 모식도이다.</desc>
  <style>
    .gene-3-sickle-editing-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .gene-3-sickle-editing-tx{font-size:14px;fill:var(--fig-ink)}
    .gene-3-sickle-editing-sm{font-size:13px;fill:var(--fig-muted)}
    .gene-3-sickle-editing-mono{font-size:14px;font-weight:600;fill:var(--fig-ink);letter-spacing:1px}
    .gene-3-sickle-editing-ln{fill:none;stroke:var(--fig-ink);stroke-width:2}
    .gene-3-sickle-editing-lnm{fill:none;stroke:var(--fig-line);stroke-width:1.5}
    .gene-3-sickle-editing-dash{fill:none;stroke:var(--fig-line);stroke-width:1.5;stroke-dasharray:5 4}
    .gene-3-sickle-editing-ink{fill:var(--fig-ink)}
    .gene-3-sickle-editing-paper{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}
    .gene-3-sickle-editing-gray{fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1.5}
    .gene-3-sickle-editing-b-blue{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2}
    .gene-3-sickle-editing-f-blue{fill:var(--fig-blue)}
    .gene-3-sickle-editing-s-blue{fill:none;stroke:var(--fig-blue);stroke-width:2.5}
    .gene-3-sickle-editing-t-blue{fill:var(--fig-blue)}
    .gene-3-sickle-editing-b-red{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2}
    .gene-3-sickle-editing-f-red{fill:var(--fig-red)}
    .gene-3-sickle-editing-s-red{fill:none;stroke:var(--fig-red);stroke-width:2.5}
    .gene-3-sickle-editing-t-red{fill:var(--fig-red)}
    .gene-3-sickle-editing-b-green{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2}
    .gene-3-sickle-editing-f-green{fill:var(--fig-green)}
    .gene-3-sickle-editing-s-green{fill:none;stroke:var(--fig-green);stroke-width:2.5}
    .gene-3-sickle-editing-t-green{fill:var(--fig-green)}
    .gene-3-sickle-editing-b-amber{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2}
    .gene-3-sickle-editing-f-amber{fill:var(--fig-amber)}
    .gene-3-sickle-editing-s-amber{fill:none;stroke:var(--fig-amber);stroke-width:2.5}
    .gene-3-sickle-editing-t-amber{fill:var(--fig-amber)}
    .gene-3-sickle-editing-b-violet{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2}
    .gene-3-sickle-editing-f-violet{fill:var(--fig-violet)}
    .gene-3-sickle-editing-s-violet{fill:none;stroke:var(--fig-violet);stroke-width:2.5}
    .gene-3-sickle-editing-t-violet{fill:var(--fig-violet)}
    .gene-3-sickle-editing-b-teal{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:2}
    .gene-3-sickle-editing-f-teal{fill:var(--fig-teal)}
    .gene-3-sickle-editing-s-teal{fill:none;stroke:var(--fig-teal);stroke-width:2.5}
    .gene-3-sickle-editing-t-teal{fill:var(--fig-teal)}
  </style>
  <rect x="14.0" y="14.0" width="168.0" height="300.0" rx="8" class="gene-3-sickle-editing-gray"/>
  <text x="24.0" y="40.0" class="gene-3-sickle-editing-h" style="font-size:14px">① 채취</text>
  <text x="24.0" y="250.0" class="gene-3-sickle-editing-sm" style="font-size:12px">환자의 골수에서</text>
  <text x="24.0" y="267.0" class="gene-3-sickle-editing-sm" style="font-size:12px">조혈모세포를 꺼낸다</text>
  <circle cx="64.0" cy="110.0" r="14.0" class="gene-3-sickle-editing-paper"/>
  <path d="M 38 180 Q 38 130 64 128 Q 90 130 90 180 Z" class="gene-3-sickle-editing-paper"/>
  <line x1="96.0" y1="140.0" x2="119.7" y2="140.0" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/>
  <polygon points="126.0,140.0 118.2,144.5 118.2,135.5" class="gene-3-sickle-editing-ink" style="fill:var(--fig-ink)"/>
  <circle cx="149.0" cy="126.0" r="10.0" class="gene-3-sickle-editing-b-green"/>
