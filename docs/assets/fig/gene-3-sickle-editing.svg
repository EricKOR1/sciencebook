  <line x1="202.0" y1="140.0" x2="342.0" y2="140.0" class="gene-3-sickle-editing-ln" style="stroke-width:3;stroke:var(--fig-line)"/>
  <rect x="214.0" y="130.0" width="40.0" height="20.0" rx="0" class="gene-3-sickle-editing-b-amber"/>
  <text x="234.0" y="168.0" text-anchor="middle" class="gene-3-sickle-editing-sm" style="font-size:11px">조절 부위</text>
  <rect x="262.0" y="130.0" width="72.0" height="20.0" rx="0" class="gene-3-sickle-editing-b-blue"/>
  <text x="298.0" y="145.0" text-anchor="middle" class="gene-3-sickle-editing-tx" style="font-size:12px">BCL11A</text>
  <ellipse cx="234.0" cy="122.0" rx="26.0" ry="18.0" class="gene-3-sickle-editing-b-violet" style="opacity:0.6"/>
  <text x="234.0" y="96.0" text-anchor="middle" class="gene-3-sickle-editing-sm" style="font-size:12px;fill:var(--fig-violet)">Cas9</text>
  <text x="200.0" y="200.0" class="gene-3-sickle-editing-sm" style="font-size:11px;fill:var(--fig-red)">✂ 잘림 → 조절 부위 고장</text>
  <rect x="362.0" y="14.0" width="168.0" height="300.0" rx="8" class="gene-3-sickle-editing-gray"/>
  <text x="372.0" y="40.0" class="gene-3-sickle-editing-h" style="font-size:14px">③ 발현 변화</text>
  <text x="372.0" y="250.0" class="gene-3-sickle-editing-sm" style="font-size:12px">억제 단백질이 줄어</text>
  <text x="372.0" y="267.0" class="gene-3-sickle-editing-sm" style="font-size:12px">태아형 헤모글로빈</text>
  <text x="372.0" y="284.0" class="gene-3-sickle-editing-sm" style="font-size:12px">유전자가 다시 켜짐</text>
  <text x="372.0" y="72.0" class="gene-3-sickle-editing-sm" style="font-size:12px">편집 전</text>
  <circle cx="402.0" cy="96.0" r="12.0" class="gene-3-sickle-editing-b-red"/>
  <text x="402.0" y="100.0" text-anchor="middle" class="gene-3-sickle-editing-sm" style="font-size:11px;fill:var(--fig-ink)">B</text>
  <line x1="416.0" y1="96.0" x2="446.0" y2="96.0" class="gene-3-sickle-editing-ln"/>
  <line x1="446.0" y1="88.0" x2="446.0" y2="104.0" class="gene-3-sickle-editing-ln"/>
