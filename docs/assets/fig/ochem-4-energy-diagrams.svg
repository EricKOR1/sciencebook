  <title id="t-ochem-4-energy-diagrams">그림 유기화학 4-3 한 단계 반응과 두 단계 반응의 에너지 도표</title>
  <desc id="d-ochem-4-energy-diagrams">위: 한 단계 반응(SN2). 반응물 R(0)에서 전이 상태 TS(‡, +80 kJ/mol)를 지나 생성물 P(−30 kJ/mol)로 간다. ΔG‡는 R에서 TS까지, ΔG°는 R에서 P까지이다. 아래: 두 단계 반응(SN1). R(0) → TS1(+100) → 중간체 I(+85, 극소점) → TS2(+90) → P(−20). 가장 높은 꼭대기 TS1을 지나는 첫 단계가 속도 결정 단계이고, ΔG‡₂는 I에서 TS2까지 잰다. 가로축 아래에 각 점의 대표 구조를 적었다. 높이는 kJ/mol 단위의 예시 값이다.</desc>
