  <title id="t-rxn-1-strong-weak-particles">그림 화학 반응의 세계 1-3 같은 농도의 강산과 약산 — 입자 모형</title>
  <desc id="d-rxn-1-strong-weak-particles">0.10 M 염산에서는 HCl이 거의 모두 H₃O⁺와 Cl⁻로 이온화하지만, 0.10 M 아세트산에서는 대부분이 CH₃COOH 분자로 남고 아주 일부만 이온화한다. 물 분자는 생략했고 입자 수의 비율은 모식적으로 나타냈다.</desc>
