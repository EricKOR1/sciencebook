<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-ubio-4-ip3-calcium d-ubio-4-ip3-calcium">
  <title id="t-ubio-4-ip3-calcium">그림 일반생명과학 4-5 IP₃·DAG와 Ca²⁺ — 2차 전달자는 어디서 생겨 어디로 가나</title>
  <desc id="d-ubio-4-ip3-calcium">신호가 G 단백질 연결 수용체에 붙으면 G 단백질이 인지질 가수 분해 효소 C를 켜고, 이 효소가 세포막의 PIP₂를 잘라 DAG(막에 남음)와 IP₃(세포질로 확산)를 만든다. IP₃는 소포체 막의 Ca²⁺ 통로를 열어, 약 10⁻³ M인 소포체 안의 Ca²⁺이 약 10⁻⁷ M인 세포질로 쏟아져 나온다. Ca²⁺과 DAG가 함께 단백질 인산화 효소 C를 켠다. Ca²⁺ 펌프가 ATP를 써서 Ca²⁺을 다시 퍼내면 신호가 꺼진다. 모식도.</desc>
