<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-m1-02-variation-finch d-m1-02-variation-finch">
<title id="t-m1-02-variation-finch">그림 중1-2-6 변이와 환경이 만드는 생물다양성 — 핀치의 부리</title>
<desc id="d-m1-02-variation-finch">처음 핀치 집단에는 부리 모양의 변이가 있었다. 딱딱한 씨앗이 많은 섬에서는 굵고 짧은 부리가, 곤충이 많은 섬에서는 가늘고 긴 부리가 먹이를 얻기에 유리하여 더 많이 살아남았다. 이 과정이 오랜 세월 되풀이되어 섬마다 다른 종이 생겼다. 모식도.</desc>
