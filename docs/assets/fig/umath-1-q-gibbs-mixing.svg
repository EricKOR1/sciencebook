<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-umath-1-q-gibbs-mixing d-umath-1-q-gibbs-mixing">
  <title id="t-umath-1-q-gibbs-mixing">그림 수학 도구 1-12 예제 17의 조성에 따른 깁스 에너지</title>
  <desc id="d-umath-1-q-gibbs-mixing">G/n = (1 − x_B)RT ln(1 − x_B) + x_B(−3.00 + RT ln x_B) (kJ/mol, μ_A° = 0, RT = 2.479 kJ/mol). 곡선은 x_B = 0.770에서 최소(−3.65 kJ/mol)이고, 그 점에서 기울기 dG/dx_B = μ_B − μ_A가 0이다. 회색 점선은 섞이지 않은 경우의 직선으로, 혼합 항이 곡선을 그 아래로 처지게 한다.</desc>
