<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" class="fig-small" role="img" aria-labelledby="t-uphy-11-q-film-slit d-uphy-11-q-film-slit">
  <title id="t-uphy-11-q-film-slit">그림 일반물리학 11-12 문제 13의 필름을 덮은 이중 슬릿</title>
  <desc id="d-uphy-11-q-film-slit">파장 600 nm인 빛이 이중 슬릿을 지나 스크린에 무늬를 만든다. 위쪽 슬릿만 굴절률 1.50인 얇은 투명 필름으로 덮었다. O는 필름을 덮기 전 중앙 밝은 무늬의 자리(두 슬릿에서 같은 거리)이다. 크기는 실제와 다른 모식도이다.</desc>
