<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-ochem-1-q-propene-hbr d-ochem-1-q-propene-hbr">
  <title id="t-ochem-1-q-propene-hbr">그림 유기화학 1-15 예제 12 프로펜과 HBr의 두 단계 메커니즘</title>
  <desc id="d-ochem-1-q-propene-hbr">1단계: 프로펜의 C=C π 전자쌍이 HBr의 H 쪽으로(말단 CH₂와 H 사이에 새 결합), H–Br 결합의 전자쌍이 Br로 간다(화살표 2개). 생성물은 가운데 탄소에 ⊕가 있는 평면의 프로판-2-일 양이온 CH₃–CH⁺–CH₃와 전자쌍 4개의 Br⁻이다. 2단계: Br⁻의 전자쌍이 C⁺로 가서 2-브로모프로페인이 된다. 각 단계에서 전체 전하(0)가 보존된다.</desc>
