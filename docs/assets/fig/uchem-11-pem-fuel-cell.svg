<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-uchem-11-pem-fuel-cell d-uchem-11-pem-fuel-cell">
  <title id="t-uchem-11-pem-fuel-cell">그림 일반화학 11-7 양성자 교환막 연료 전지의 구조</title>
  <desc id="d-uchem-11-pem-fuel-cell">왼쪽 통로로 수소, 오른쪽 통로로 산소(공기)를 계속 공급한다. 산화 전극의 백금 촉매에서 H₂가 H⁺와 전자로 나뉘고, H⁺는 가운데 양성자 교환막을 지나, 전자는 바깥 도선과 기기를 지나 환원 전극에 모인다. 환원 전극에서 O₂가 H⁺·전자와 만나 물이 되어 빠져나간다. 이론 전위는 1.23 V이다.</desc>
