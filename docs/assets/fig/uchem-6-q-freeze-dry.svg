  <title id="t-uchem-6-q-freeze-dry">그림 일반화학 6-11 문제 10 해설 — 물의 상평형 그림 위의 동결 건조 경로</title>
  <desc id="d-uchem-6-q-freeze-dry">물의 상평형 그림(세로축 압력은 로그 눈금). A(20 °C, 1 atm, 액체)에서 냉각하여 B(−40 °C, 고체)로 얼리고, 삼중점 압력(0.006 atm)보다 훨씬 낮은 0.0002 atm까지 감압하여 C에 이른 뒤, 조금 가열하면 D로 가는 도중 승화 곡선을 넘어 얼음이 곧바로 수증기가 된다. 액체 영역을 지나지 않는다.</desc>
