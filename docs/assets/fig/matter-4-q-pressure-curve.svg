  <title id="t-matter-4-q-pressure-curve">그림 물질과 에너지 4-9 문제 12의 압력 증가량–시간 그래프</title>
  <desc id="d-matter-4-q-pressure-curve">측정값(점)을 이으면 처음에는 가파르다가 점점 완만해진다. 0~10초 구간의 평균 기울기(0.83 kPa/s)가 30~60초 구간(약 0.33 kPa/s)보다 크다. 40.0 kPa까지 남은 높이(초록 막대)는 남은 과산화 수소에 비례하며 30초마다 절반(½, ¼, ⅛)이 되어 반감기가 30초로 일정하다.</desc>
