  <desc id="d-uchem-10-q-ice-rule">얼음의 수소 결합망을 평면에 펼친 모식도(실제 얼음은 3차원 사면체 배치이다). 각 O는 이웃 O 4개와 이어지고, O–O 사이마다 H가 하나씩 한쪽 O에 가깝게 놓이며, 각 O 가까이에는 H가 2개 있다.</desc>
