<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" class="fig-small" role="img" aria-labelledby="t-esys-3-q-surface-wind-forces d-esys-3-q-surface-wind-forces">
  <title id="t-esys-3-q-surface-wind-forces">그림 지구시스템과학 3-13 문제 14 해설의 지상풍에 작용하는 힘</title>
  <desc id="d-esys-3-q-surface-wind-forces">북반구 지표 부근에서 북쪽이 저기압인 직선 등압선을 바람이 30° 가로질러 저기압 쪽으로 분다. 기압 경도력(저기압 쪽)은 전향력(바람의 오른쪽 직각)과 마찰력(바람의 반대 방향)의 합력과 크기가 같고 방향이 반대여서 세 힘의 합이 0이다. 힘 화살표의 길이는 크기에 비례하게 그렸고, 바람 화살표는 방향만 나타낸다.</desc>
  <style>
    .esys-3-q-surface-wind-forces-t{font-size:14px;fill:var(--fig-ink)} .esys-3-q-surface-wind-forces-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .esys-3-q-surface-wind-forces-s{font-size:13px;fill:var(--fig-muted)} .esys-3-q-surface-wind-forces-ax{fill:none;stroke:var(--fig-muted);stroke-width:1.4} .esys-3-q-surface-wind-forces-gr{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4}
  </style>
  <line x1="30" y1="60" x2="370" y2="60" style="stroke:var(--fig-ink);stroke-width:1.5"/>
  <text x="376" y="65" class="esys-3-q-surface-wind-forces-s">1000 hPa</text>
  <line x1="30" y1="160" x2="370" y2="160" style="stroke:var(--fig-ink);stroke-width:1.5"/>
  <text x="376" y="165" class="esys-3-q-surface-wind-forces-s">1002 hPa</text>
  <line x1="30" y1="260" x2="370" y2="260" style="stroke:var(--fig-ink);stroke-width:1.5"/>
  <text x="376" y="265" class="esys-3-q-surface-wind-forces-s">1004 hPa</text>
  <text x="30" y="48" class="esys-3-q-surface-wind-forces-s">저기압 쪽</text>
  <text x="30" y="290" class="esys-3-q-surface-wind-forces-s">고기압 쪽</text>
  <line x1="200" y1="180" x2="200" y2="82" style="stroke:var(--fig-red);stroke-width:3;fill:none"/>
  <path d="M200 70 L206 82 L194 82 Z" style="fill:var(--fig-red)"/>
  <line x1="200" y1="180" x2="162.8" y2="201.5" style="stroke:var(--fig-amber);stroke-width:3;fill:none"/>
  <path d="M152.4 207.5 L159.8 196.3 L165.8 206.7 Z" style="fill:var(--fig-amber)"/>
  <line x1="200" y1="180" x2="241.6" y2="252.1" style="stroke:var(--fig-violet);stroke-width:3;fill:none"/>
  <path d="M247.6 262.5 L236.4 255.1 L246.8 249.1 Z" style="fill:var(--fig-violet)"/>
  <line x1="200" y1="180" x2="317.8" y2="112" style="stroke:var(--fig-blue);stroke-width:3.4;fill:none"/>
  <path d="M329.9 105 L321.3 118.1 L314.3 105.9 Z" style="fill:var(--fig-blue)"/>
  <line x1="200" y1="180" x2="340" y2="180" style="stroke:var(--fig-muted);stroke-width:1.6;fill:none;stroke-dasharray:5 4"/>
  <path d="M350 180 L340 185 L340 175 Z" style="fill:var(--fig-muted)"/>
  <circle cx="200" cy="180" r="5" style="fill:var(--fig-ink)"/>
  <path d="M260 180 A60 60 0 0 0 252 150" style="fill:none;stroke:var(--fig-ink);stroke-width:1.2"/>
  <text x="266" y="170" class="esys-3-q-surface-wind-forces-s">30°</text>
  <text x="208" y="92" class="esys-3-q-surface-wind-forces-s" style="fill:var(--fig-red);font-weight:600">기압 경도력</text>
  <text x="146.4" y="229.5" text-anchor="end" class="esys-3-q-surface-wind-forces-s" style="fill:var(--fig-amber);font-weight:600">마찰력</text>
  <text x="254" y="286" class="esys-3-q-surface-wind-forces-s" style="fill:var(--fig-violet);font-weight:600">전향력</text>
  <text x="325.9" y="95" text-anchor="middle" class="esys-3-q-surface-wind-forces-s" style="fill:var(--fig-blue);font-weight:600">바람(지상풍)</text>
  <text x="352" y="202" text-anchor="end" class="esys-3-q-surface-wind-forces-s">지균풍 방향</text>
  <text x="30" y="330" class="esys-3-q-surface-wind-forces-b">세 힘의 합 = 0</text>
  <line x1="420" y1="340" x2="420" y2="314" style="stroke:var(--fig-ink);stroke-width:2;fill:none"/>
  <path d="M420 304 L425 314 L415 314 Z" style="fill:var(--fig-ink)"/>
  <text x="436" y="330" class="esys-3-q-surface-wind-forces-s">N</text>
</svg>
