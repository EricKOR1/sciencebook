<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-ubio-3-q-coupling-dg d-ubio-3-q-coupling-dg">
  <title id="t-ubio-3-q-coupling-dg">그림 일반생명과학 3-14 문제 13 해설 글루타민 합성의 자유 에너지 변화</title>
  <desc id="d-ubio-3-q-coupling-dg">짝짓지 않은 반응은 표준 조건(+14.2 kJ/mol)에서도 세포 속 농도(약 +32 kJ/mol)에서도 양수여서 저절로 일어나지 않는다. ATP 가수 분해와 짝지으면 표준 조건 −16.3 kJ/mol, 세포 속 약 −18.7 kJ/mol로 음수가 된다.</desc>
