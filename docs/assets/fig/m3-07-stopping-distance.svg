<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 368" role="img" aria-labelledby="t-m3-07-stopping-distance d-m3-07-stopping-distance">
  <title id="t-m3-07-stopping-distance">그림 중3-7-2 속력에 따른 정지 거리</title>
  <desc id="d-m3-07-stopping-distance">정지 거리는 반응 거리와 제동 거리의 합이다. 반응 시간이 1초일 때 속력이 10, 20, 30 m/s로 커지면 반응 거리는 10, 20, 30 m로 속력에 비례하고, 제동 거리는 약 6, 25, 56 m로 속력의 제곱에 비례하여 늘어난다.</desc>
  <style>
    .m3-07-stopping-distance-lbl{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .m3-07-stopping-distance-tx{font-size:14px;fill:var(--fig-ink)}
    .m3-07-stopping-distance-sm{font-size:13px;fill:var(--fig-muted)}
    .m3-07-stopping-distance-re{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8}
    .m3-07-stopping-distance-br{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8}
  </style>
  <rect x="20" y="18" width="26" height="16" class="m3-07-stopping-distance-re"/>
  <text x="54" y="31" class="m3-07-stopping-distance-tx"><tspan style="font-weight:600">반응 거리</tspan> — 위험을 보고 브레이크를 밟기까지 달린 거리 (속력 × 반응 시간)</text>
  <rect x="20" y="44" width="26" height="16" class="m3-07-stopping-distance-br"/>
  <text x="54" y="57" class="m3-07-stopping-distance-tx"><tspan style="font-weight:600">제동 거리</tspan> — 브레이크를 밟은 뒤 멈출 때까지 미끄러진 거리 (속력의 제곱에 비례)</text>
  <text x="20" y="114" class="m3-07-stopping-distance-lbl">10 m/s</text>
  <text x="20" y="132" class="m3-07-stopping-distance-sm">(36 km/h)</text>
  <rect x="140" y="100" width="54.0" height="30" class="m3-07-stopping-distance-re"/>
  <rect x="194.0" y="100" width="33.8" height="30" class="m3-07-stopping-distance-br"/>
  <text x="167.0" y="120" text-anchor="middle" class="m3-07-stopping-distance-tx">10 m</text>
  <text x="210.9" y="148" text-anchor="middle" class="m3-07-stopping-distance-sm">6.25 m</text>
  <text x="237.8" y="120" class="m3-07-stopping-distance-lbl">= 16.25 m</text>
  <text x="20" y="184" class="m3-07-stopping-distance-lbl">20 m/s</text>
  <text x="20" y="202" class="m3-07-stopping-distance-sm">(72 km/h)</text>
  <rect x="140" y="170" width="108.0" height="30" class="m3-07-stopping-distance-re"/>
  <rect x="248.0" y="170" width="135.0" height="30" class="m3-07-stopping-distance-br"/>
  <text x="194.0" y="190" text-anchor="middle" class="m3-07-stopping-distance-tx">20 m</text>
  <text x="315.5" y="190" text-anchor="middle" class="m3-07-stopping-distance-tx">25 m</text>
  <text x="393.0" y="190" class="m3-07-stopping-distance-lbl">= 45 m</text>
  <text x="20" y="254" class="m3-07-stopping-distance-lbl">30 m/s</text>
  <text x="20" y="272" class="m3-07-stopping-distance-sm">(108 km/h)</text>
  <rect x="140" y="240" width="162.0" height="30" class="m3-07-stopping-distance-re"/>
  <rect x="302.0" y="240" width="303.8" height="30" class="m3-07-stopping-distance-br"/>
  <text x="221.0" y="260" text-anchor="middle" class="m3-07-stopping-distance-tx">30 m</text>
  <text x="453.9" y="260" text-anchor="middle" class="m3-07-stopping-distance-tx">56.25 m</text>
  <text x="615.8" y="260" class="m3-07-stopping-distance-lbl">= 86.25 m</text>
  <line x1="140" y1="290" x2="626.0" y2="290" style="stroke:var(--fig-line);stroke-width:1.5"/>
  <line x1="140.0" y1="290" x2="140.0" y2="296" style="stroke:var(--fig-line);stroke-width:1.5"/>
  <text x="140.0" y="312" text-anchor="middle" class="m3-07-stopping-distance-sm">0</text>
  <line x1="194.0" y1="290" x2="194.0" y2="296" style="stroke:var(--fig-line);stroke-width:1.5"/>
  <line x1="248.0" y1="290" x2="248.0" y2="296" style="stroke:var(--fig-line);stroke-width:1.5"/>
  <text x="248.0" y="312" text-anchor="middle" class="m3-07-stopping-distance-sm">20</text>
  <line x1="302.0" y1="290" x2="302.0" y2="296" style="stroke:var(--fig-line);stroke-width:1.5"/>
  <line x1="356.0" y1="290" x2="356.0" y2="296" style="stroke:var(--fig-line);stroke-width:1.5"/>
  <text x="356.0" y="312" text-anchor="middle" class="m3-07-stopping-distance-sm">40</text>
  <line x1="410.0" y1="290" x2="410.0" y2="296" style="stroke:var(--fig-line);stroke-width:1.5"/>
  <line x1="464.0" y1="290" x2="464.0" y2="296" style="stroke:var(--fig-line);stroke-width:1.5"/>
  <text x="464.0" y="312" text-anchor="middle" class="m3-07-stopping-distance-sm">60</text>
  <line x1="518.0" y1="290" x2="518.0" y2="296" style="stroke:var(--fig-line);stroke-width:1.5"/>
  <line x1="572.0" y1="290" x2="572.0" y2="296" style="stroke:var(--fig-line);stroke-width:1.5"/>
  <text x="572.0" y="312" text-anchor="middle" class="m3-07-stopping-distance-sm">80</text>
  <line x1="626.0" y1="290" x2="626.0" y2="296" style="stroke:var(--fig-line);stroke-width:1.5"/>
  <text x="626.0" y="312" text-anchor="middle" class="m3-07-stopping-distance-sm">90 m</text>
  <line x1="140" y1="86" x2="140" y2="290" style="stroke:var(--fig-ink);stroke-width:2;stroke-dasharray:5 4"/>
  <text x="144" y="84" class="m3-07-stopping-distance-sm">위험 발견</text>
  <text x="360" y="338" text-anchor="middle" class="m3-07-stopping-distance-sm">가정: 반응 시간 1초, 20 m/s에서 제동 거리 25 m(마른 도로). 속력이 2배, 3배가 되면</text>
  <text x="360" y="356" text-anchor="middle" class="m3-07-stopping-distance-sm">반응 거리는 2배, 3배로, 제동 거리는 4배, 9배로 늘어난다.</text>
</svg>
