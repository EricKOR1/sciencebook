<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-ubio-9-three-domains d-ubio-9-three-domains">
<title id="t-ubio-9-three-domains">그림 일반생명과학 9-1 세 역의 세포 구조와 막 지질 비교</title>
<desc id="d-ubio-9-three-domains">세균과 고세균은 핵막과 막성 세포 소기관이 없는 원핵세포이지만, 세균만 펩티도글리칸 세포벽을 가진다. 고세균의 막 지질은 가지 친 탄화수소 사슬이 에터 결합으로 붙어 있고, 세균과 진핵생물의 막 지질은 곧은 지방산이 에스터 결합으로 붙어 있다. 고세균의 전사·번역 장치와 히스톤은 진핵생물과 닮았다. 크기 비율은 실제와 다른 모식도이다.</desc>
