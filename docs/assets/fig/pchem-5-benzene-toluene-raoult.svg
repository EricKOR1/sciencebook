<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-pchem-5-benzene-toluene-raoult d-pchem-5-benzene-toluene-raoult">
  <title id="t-pchem-5-benzene-toluene-raoult">그림 물리화학 5-5 25 ℃ 벤젠–톨루엔 이상 용액의 증기 압력</title>
  <desc id="d-pchem-5-benzene-toluene-raoult">가로축은 액체 속 벤젠의 몰 분율 x_B, 세로축은 압력(kPa). 라울 법칙으로 계산한 세 직선: 톨루엔 부분 압력 p_T = (1 − x_B) × 3.79, 벤젠 부분 압력 p_B = x_B × 12.7, 전체 압력 p = 3.79 + 8.91 x_B.</desc>
  <style>.pchem-5-benzene-toluene-raoult-t{font-size:14px;fill:var(--fig-ink)} .pchem-5-benzene-toluene-raoult-s{font-size:13px;fill:var(--fig-muted)} .pchem-5-benzene-toluene-raoult-b{font-size:15px;font-weight:600;fill:var(--fig-ink)} .pchem-5-benzene-toluene-raoult-i{font-size:14px;font-style:italic;fill:var(--fig-ink)} </style>
