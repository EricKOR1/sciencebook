  <rect x="201.4" y="283.7" width="178.8" height="19.0" rx="2" style="fill:var(--fig-panel);stroke:none"/>
  <text x="204.4" y="296.7" text-anchor="start" class="pchem-5-benzene-toluene-raoult-t" style="fill:var(--fig-blue)">톨루엔 p<tspan baseline-shift="sub" font-size="10">T</tspan> = (1 − x<tspan baseline-shift="sub" font-size="10">B</tspan>) × 3.79</text>
  <text x="620.0" y="316.0" text-anchor="start" class="pchem-5-benzene-toluene-raoult-s"></text>
  <text x="350.0" y="392.0" text-anchor="middle" class="pchem-5-benzene-toluene-raoult-s">전체 압력 = 두 부분 압력의 합(모든 조성에서 직선)</text>
</svg>
