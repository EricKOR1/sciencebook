  <text x="528" y="105" text-anchor="end" class="c4ti-lbl">8.0</text>
  <line x1="536" y1="120" x2="550" y2="120" class="c4ti-tk" style="stroke-width:1"/>
  <line x1="536" y1="140" x2="550" y2="140" class="c4ti-tk" style="stroke-width:1"/>
