  <text x="528" y="205" text-anchor="end" class="c4ti-lbl">8.5</text>
  <line x1="536" y1="220" x2="550" y2="220" class="c4ti-tk" style="stroke-width:1"/>
  <line x1="536" y1="240" x2="550" y2="240" class="c4ti-tk" style="stroke-width:1"/>
  <line x1="536" y1="260" x2="550" y2="260" class="c4ti-tk" style="stroke-width:1"/>
  <line x1="536" y1="280" x2="550" y2="280" class="c4ti-tk" style="stroke-width:1"/>
  <line x1="536" y1="300" x2="562" y2="300" class="c4ti-tk" style="stroke-width:1.6"/>
  <text x="528" y="305" text-anchor="end" class="c4ti-lbl">9.0</text>
  <path d="M616 200 q12 -9 24 0 q-12 9 -24 0 z" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.5"/><circle cx="628" cy="200" r="3.5" class="c4ti-ink"/>
  <line x1="588" y1="200" x2="614" y2="200" style="stroke:var(--fig-accent);stroke-width:1.5;stroke-dasharray:4 3"/>
  <text x="628" y="184" text-anchor="middle" class="c4ti-sm">눈높이</text>
  <text x="628" y="230" text-anchor="middle" class="c4ti-lbl">아랫면</text>
  <text x="628" y="250" text-anchor="middle" class="c4ti-b" style="fill:var(--fig-accent)">8.50 mL</text>
  <text x="591.0" y="80" text-anchor="middle" class="c4ti-sm">위가 0, 아래로 갈수록 커진다</text>
  <text x="591.0" y="350" text-anchor="middle" class="c4ti-lbl">처음 0.50 mL → 나중 8.50 mL</text>
  <text x="591.0" y="372" text-anchor="middle" class="c4ti-b">넣은 부피 = 8.50 − 0.50 = 8.00 mL</text>
</svg>
