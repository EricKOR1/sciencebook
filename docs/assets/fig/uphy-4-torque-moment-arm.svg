<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-uphy-4-torque-moment-arm d-uphy-4-torque-moment-arm">
  <title id="t-uphy-4-torque-moment-arm">그림 일반물리학 4-5 토크와 지레팔</title>
  <desc id="d-uphy-4-torque-moment-arm">기준점 O에서 힘의 작용점 P까지의 위치 벡터 r와 힘 F가 각 φ를 이룬다. 회전에 기여하는 것은 r에 수직인 성분 F⊥ = F sin φ이고, 같은 토크를 O에서 힘의 작용선까지의 수직 거리(지레팔) r⊥ = r sin φ로도 구할 수 있다. 이 그림에서 토크는 종이면에서 나오는 방향이다.</desc>
  <style>
    .uphy4torquemomentarm-t{font-size:14px;fill:var(--fig-ink)} .uphy4torquemomentarm-s{font-size:13px;fill:var(--fig-muted)}
    .uphy4torquemomentarm-b{font-size:15px;fill:var(--fig-ink);font-weight:600} .uphy4torquemomentarm-i{font-size:15px;fill:var(--fig-ink);font-style:italic}
  </style>
