  <text x="520.0" y="250.0" class="uphy4torquemomentarm-b" style="fill:var(--fig-violet)">τ = r × F</text>
  <text x="520.0" y="276.0" class="uphy4torquemomentarm-i">τ = rF sin φ</text>
  <text x="520.0" y="300.0" class="uphy4torquemomentarm-i">  = rF<tspan baseline-shift="sub" font-size="11">⊥</tspan> = r<tspan baseline-shift="sub" font-size="11">⊥</tspan>F</text>
  <text x="520.0" y="330.0" class="uphy4torquemomentarm-s">방향: 오른손 규칙 → 종이면 밖(⊙)</text>
