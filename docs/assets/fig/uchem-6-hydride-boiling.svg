  <line x1="530" y1="118" x2="560" y2="118" class="uchem-6-hydride-boiling-g16"/>
  <text x="568.0" y="122.0" text-anchor="start" class="uchem-6-hydride-boiling-t" >16족 (H₂O…)</text>
