  <circle cx="457.9" cy="185.4" r="4" style="fill:var(--fig-panel)" class="uchem-6-hydride-boiling-g17"/>
  <line x1="530" y1="144" x2="560" y2="144" class="uchem-6-hydride-boiling-g17"/>
  <text x="568.0" y="148.0" text-anchor="start" class="uchem-6-hydride-boiling-t" >17족 (HF…)</text>
