<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uchem-6-hydride-boiling d-uchem-6-hydride-boiling">
  <title id="t-uchem-6-hydride-boiling">그림 일반화학 6-1 14~17족 수소 화합물의 끓는점</title>
  <desc id="d-uchem-6-hydride-boiling">같은 족의 수소 화합물은 아래 주기로 갈수록 전자 수가 많아져 분산력이 커지므로 끓는점이 올라간다. 그런데 2주기의 H₂O, HF, NH₃는 이 경향에서 크게 벗어나 끓는점이 훨씬 높다. 분자 사이에 수소 결합을 이루기 때문이다. 수소 결합을 하지 않는 14족(CH₄ → SnH₄)은 경향을 그대로 따른다. 점선은 16족의 3~5주기 경향을 2주기로 이어 본 것으로, 수소 결합이 없다면 물은 약 −90 °C에서 끓었을 것이다.</desc>
  <style>
    .uchem-6-hydride-boiling-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-6-hydride-boiling-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-6-hydride-boiling-b{font-size:15px;fill:var(--fig-ink);font-weight:bold}
    .uchem-6-hydride-boiling-ax{stroke:var(--fig-ink);stroke-width:1.2;fill:none}
    .uchem-6-hydride-boiling-gr{stroke:var(--fig-line);stroke-width:0.6;fill:none;stroke-dasharray:2 3}

    .uchem-6-hydride-boiling-g14{stroke:var(--fig-muted);stroke-width:2.2;fill:none}
    .uchem-6-hydride-boiling-g15{stroke:var(--fig-green);stroke-width:2.2;fill:none}
    .uchem-6-hydride-boiling-g16{stroke:var(--fig-blue);stroke-width:2.2;fill:none}
    .uchem-6-hydride-boiling-g17{stroke:var(--fig-red);stroke-width:2.2;fill:none}
    .uchem-6-hydride-boiling-ex{stroke:var(--fig-blue);stroke-width:1.6;fill:none;stroke-dasharray:5 4}
    .uchem-6-hydride-boiling-hb{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1;stroke-dasharray:3 3}
  </style>
