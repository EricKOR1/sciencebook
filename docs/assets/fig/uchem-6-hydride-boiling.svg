  <text x="92.0" y="203.1" text-anchor="end" class="uchem-6-hydride-boiling-s" >-50</text>
  <line x1="100" y1="152.1" x2="500" y2="152.1" class="uchem-6-hydride-boiling-gr"/>
  <text x="92.0" y="156.1" text-anchor="end" class="uchem-6-hydride-boiling-s" >0</text>
  <line x1="100" y1="105.2" x2="500" y2="105.2" class="uchem-6-hydride-boiling-gr"/>
  <text x="92.0" y="109.2" text-anchor="end" class="uchem-6-hydride-boiling-s" >50</text>
  <line x1="100" y1="58.2" x2="500" y2="58.2" class="uchem-6-hydride-boiling-gr"/>
  <text x="92.0" y="62.2" text-anchor="end" class="uchem-6-hydride-boiling-s" >100</text>
