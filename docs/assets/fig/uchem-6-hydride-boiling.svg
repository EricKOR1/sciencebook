  <line x1="100" y1="293.0" x2="500" y2="293.0" class="uchem-6-hydride-boiling-gr"/>
  <text x="92.0" y="297.0" text-anchor="end" class="uchem-6-hydride-boiling-s" >-150</text>
  <line x1="100" y1="246.1" x2="500" y2="246.1" class="uchem-6-hydride-boiling-gr"/>
  <text x="92.0" y="250.1" text-anchor="end" class="uchem-6-hydride-boiling-s" >-100</text>
