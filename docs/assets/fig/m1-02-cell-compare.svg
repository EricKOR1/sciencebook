<title id="t-m1-02-cell-compare">그림 중1-2-2 동물 세포와 식물 세포의 구조</title>
<desc id="d-m1-02-cell-compare">핵, 세포막, 미토콘드리아는 동물 세포와 식물 세포에 모두 있다. 세포벽과 엽록체는 식물 세포에만 있다. 모식도(크기 비율은 실제와 다름).</desc>
