<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uchem-7-energy-tail d-uchem-7-energy-tail">
  <title id="t-uchem-7-energy-tail">그림 일반화학 7-6 온도가 조금 올라도 활성화 에너지를 넘는 분자는 크게 는다</title>
  <desc id="d-uchem-7-energy-tail">분자 에너지 분포 곡선(모식도)이다. 온도가 T₁에서 1.2T₁로 오르면 곡선이 조금 낮고 넓어질 뿐이지만, 활성화 에너지 Eₐ보다 큰 꼬리 부분의 넓이는 이 그림의 조건(Eₐ = 4RT₁)에서 약 1.8배가 된다. 실제 반응은 Eₐ/RT가 30 정도라 꼬리가 훨씬 얇고 온도에 더 민감하다.</desc>
  <style>.uchem-7-energy-tail-t{font-size:14px;fill:var(--fig-ink)} .uchem-7-energy-tail-s{font-size:13px;fill:var(--fig-muted)} .uchem-7-energy-tail-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .uchem-7-energy-tail-ax{stroke:var(--fig-ink);stroke-width:1.3;fill:none} .uchem-7-energy-tail-grid{stroke:var(--fig-line);stroke-width:0.7;stroke-dasharray:3 3;fill:none}</style>
  <path d="M70 40 L70 320 L670 320" style="stroke:var(--fig-ink);stroke-width:1.3;fill:none"/>
