  <text x="360" y="388" text-anchor="middle" class="uchem-7-energy-tail-s">모식도 — 전체 넓이(분자 수)는 두 곡선이 같다. 꼬리의 넓이가 e^(−Eₐ/RT)처럼 지수적으로 변한다.</text>
</svg>
