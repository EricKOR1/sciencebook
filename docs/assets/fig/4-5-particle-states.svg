  <text x="360" y="352" text-anchor="middle" class="pst-lbl">입자 사이의 거리: 고체 &lt; 액체 &lt; 기체</text>
  <text x="360" y="378" text-anchor="middle" class="pst-sm">모식도: 입자의 크기는 상태와 관계없이 같다. 기체 입자는 실제로 훨씬 더 멀리 떨어져 있다.</text>
