<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" role="img" aria-labelledby="t-4-5-particle-states d-4-5-particle-states">
  <title id="t-4-5-particle-states">그림 4-5-4 상태 변화와 입자 배열 — 열을 흡수하는 쪽과 방출하는 쪽</title>
  <desc id="d-4-5-particle-states">고체에서 액체, 기체로 갈수록 입자 사이의 거리가 멀어진다. 거리가 멀어지는 융해·기화·승화(고체→기체)는 열을 흡수하고, 거리가 가까워지는 응고·액화·승화(기체→고체)는 열을 방출한다. 입자 모형으로 나타낸 모식도.</desc>
  <style>
    .pst-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}
    .pst-pt{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.5}
    .pst-mv{fill:none;stroke:var(--fig-muted);stroke-width:1.3;stroke-linecap:round}
    .pst-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .pst-sm{font-size:13px;fill:var(--fig-muted)}
    .pst-lbl{font-size:14px;fill:var(--fig-ink)}
    .pst-ab{fill:none;stroke:var(--fig-blue);stroke-width:2.5} .pst-abh{fill:var(--fig-blue)}
    .pst-re{fill:none;stroke:var(--fig-red);stroke-width:2.5} .pst-reh{fill:var(--fig-red)}
    .pst-tab{font-size:14px;font-weight:700;fill:var(--fig-blue)}
    .pst-tre{font-size:14px;font-weight:700;fill:var(--fig-red)}
  </style>
