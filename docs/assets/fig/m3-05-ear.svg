<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 432" role="img" aria-labelledby="t-m3-05-ear d-m3-05-ear">
  <title id="t-m3-05-ear">그림 중3-5-3 귀의 구조와 소리가 전달되는 길</title>
  <desc id="d-m3-05-ear">귓바퀴가 모은 소리는 외이도를 지나 고막을 진동시키고, 귓속뼈 3개가 그 진동을 크게 하여 달팽이관으로 전달한다. 달팽이관의 청각 세포가 만든 신호는 청각 신경을 따라 대뇌로 간다. 달팽이관 위쪽의 반고리관은 회전을, 전정 기관은 기울어짐을 느끼고, 귀인두관은 목과 연결되어 고막 안팎의 압력을 맞춘다.</desc>
  <style>
    .m3-05-ear-l{font-size:14px;fill:var(--fig-ink);font-weight:600} .m3-05-ear-t{font-size:14px;fill:var(--fig-ink)}
    .m3-05-ear-s{font-size:13px;fill:var(--fig-muted)} .m3-05-ear-h{font-size:15px;fill:var(--fig-ink);font-weight:700}
    .m3-05-ear-ld{stroke:var(--fig-muted);stroke-width:1;fill:none}

  </style>
