<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-m3-03-subtropical-gyre d-m3-03-subtropical-gyre">
  <title id="t-m3-03-subtropical-gyre">그림 중3-3-5 대기 대순환의 바람과 북태평양 아열대 순환</title>
  <desc id="d-m3-03-subtropical-gyre">저위도의 무역풍이 북적도 해류를 서쪽으로, 중위도의 편서풍이 북태평양 해류를 동쪽으로 민다. 두 해류가 아시아와 북아메리카 대륙에 막혀 쿠로시오 해류(난류)와 캘리포니아 해류(한류)로 이어지면서 시계 방향의 순환이 된다. 대륙과 해류의 모양을 단순하게 그린 모식도이다.</desc>
  <style>
    .m3-03-subtropical-gyre-l{font-size:14px;fill:var(--fig-ink)}
    .m3-03-subtropical-gyre-t{font-size:13px;fill:var(--fig-muted)}
    .m3-03-subtropical-gyre-n{font-size:14px;font-weight:700}
    .m3-03-subtropical-gyre-w{stroke:var(--fig-muted);stroke-width:2;stroke-dasharray:6 5;fill:none}
  </style>
  <!-- 바다 -->
  <rect x="20" y="20" width="680" height="360" rx="8" style="fill:var(--fig-soft-blue)"/>
  <!-- 위도선: 60°N y=80, 30°N y=220, 0° y=360 -->
  <line x1="20" y1="80" x2="700" y2="80" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 5"/>
  <line x1="20" y1="220" x2="700" y2="220" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 5"/>
  <line x1="20" y1="360" x2="700" y2="360" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 5"/>
  <!-- 대륙 -->
  <path d="M20 20 L150 20 L156 60 L132 96 L140 140 L118 180 L104 236 L84 290 L60 330 L20 340 Z" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <path d="M700 20 L540 20 L560 60 L596 110 L612 170 L630 230 L660 290 L700 320 Z" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <text x="40" y="52" class="m3-03-subtropical-gyre-n" style="fill:var(--fig-amber)">아시아</text>
  <text x="680" y="52" text-anchor="end" class="m3-03-subtropical-gyre-n" style="fill:var(--fig-amber)">북아메리카</text>
  <text x="694" y="76" text-anchor="end" class="m3-03-subtropical-gyre-t">60°N</text>
  <text x="694" y="216" text-anchor="end" class="m3-03-subtropical-gyre-t">30°N</text>
  <text x="694" y="356" text-anchor="end" class="m3-03-subtropical-gyre-t">0° 적도</text>
  <!-- 바람 (점선) -->
  <path d="M520 336 L250 350" class="m3-03-subtropical-gyre-w"/><path d="M238 351 l12 -7 l1 13 z" style="fill:var(--fig-muted)"/>
  <text x="380" y="374" text-anchor="middle" class="m3-03-subtropical-gyre-t">무역풍 (동 → 서)</text>
  <path d="M220 100 L480 92" class="m3-03-subtropical-gyre-w"/><path d="M492 92 l-12 -7 l0 14 z" style="fill:var(--fig-muted)"/>
  <text x="350" y="86" text-anchor="middle" class="m3-03-subtropical-gyre-t">편서풍 (서 → 동)</text>
  <!-- 해류 -->
  <path d="M560 300 C460 304 300 306 200 300" style="fill:none;stroke:var(--fig-red);stroke-width:5;stroke-linecap:round"/>
  <path d="M184 299 l16 -9 l0 18 z" style="fill:var(--fig-red)"/>
  <path d="M170 290 C150 260 150 200 176 150" style="fill:none;stroke:var(--fig-red);stroke-width:5;stroke-linecap:round"/>
  <path d="M182 136 l3 18 l-15 -6 z" style="fill:var(--fig-red)"/>
  <path d="M196 132 C300 124 440 124 548 136" style="fill:none;stroke:var(--fig-violet);stroke-width:5;stroke-linecap:round"/>
  <path d="M564 138 l-16 -8 l-1 18 z" style="fill:var(--fig-violet)"/>
  <path d="M574 152 C590 200 590 250 572 288" style="fill:none;stroke:var(--fig-blue);stroke-width:5;stroke-linecap:round"/>
  <path d="M566 302 l-3 -18 l15 6 z" style="fill:var(--fig-blue)"/>
  <text x="380" y="292" text-anchor="middle" class="m3-03-subtropical-gyre-n" style="fill:var(--fig-red)">북적도 해류</text>
  <text x="166" y="222" class="m3-03-subtropical-gyre-n" style="fill:var(--fig-red)">쿠로시오 해류</text>
  <text x="166" y="240" class="m3-03-subtropical-gyre-t">(난류)</text>
  <text x="370" y="156" text-anchor="middle" class="m3-03-subtropical-gyre-n" style="fill:var(--fig-violet)">북태평양 해류</text>
  <text x="566" y="222" text-anchor="end" class="m3-03-subtropical-gyre-n" style="fill:var(--fig-blue)">캘리포니아 해류</text>
  <text x="566" y="240" text-anchor="end" class="m3-03-subtropical-gyre-t">(한류)</text>
  <!-- 가운데 회전 방향 -->
  <path d="M340 200 A36 26 0 1 1 404 222" style="fill:none;stroke:var(--fig-ink);stroke-width:1.5"/>
  <path d="M408 230 l-2 -14 l-9 9 z" style="fill:var(--fig-ink)"/>
  <text x="372" y="262" text-anchor="middle" class="m3-03-subtropical-gyre-t">시계 방향으로 돈다</text>
  <text x="360" y="404" text-anchor="middle" class="m3-03-subtropical-gyre-t">점선 화살표: 바람, 굵은 화살표: 해류 (빨강 난류 · 파랑 한류) — 모식도</text>
</svg>
