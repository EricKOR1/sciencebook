  <title id="t-matter-1-surface-tension">그림 물질과 에너지 1-7 표면 장력이 생기는 까닭</title>
  <desc id="d-matter-1-surface-tension">액체 내부의 분자는 이웃 분자들에게 사방으로 고르게 당겨져 알짜 힘이 0이지만, 표면의 분자는 위쪽에 당겨 줄 분자가 없어 안쪽으로 알짜 힘을 받는다. 그래서 액체는 표면적을 가장 작게 하려 하고, 물방울은 공 모양이 된다. 분자 간 상호작용이 클수록 표면 장력이 크다. 모식도이다.</desc>
