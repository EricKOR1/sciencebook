<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t-6-1-q-ct-days d-6-1-q-ct-days">
  <title id="t-6-1-q-ct-days">그림 6-1-9 문제 14의 날짜별 Ct 값</title>
  <desc id="d-6-1-q-ct-days">한 환자를 이틀마다 같은 방법으로 실시간 PCR 검사한 Ct 값이다(1일 30, 3일 20, 5일 24, 7일 32). 9일째에는 40사이클까지 기준선을 넘지 않았다. 점선은 음성 판정 기준인 40이다.</desc>
  <style>.f6-1-q-ct-days-t{font-size:14px;fill:var(--fig-ink)} .f6-1-q-ct-days-s{font-size:13px;fill:var(--fig-muted)} .f6-1-q-ct-days-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .f6-1-q-ct-days-ax{stroke:var(--fig-ink);stroke-width:1.4;fill:none} .f6-1-q-ct-days-grid{stroke:var(--fig-line);stroke-width:0.8;fill:none} .f6-1-q-ct-days-w{stroke:var(--fig-ink);stroke-width:2;fill:none} .f6-1-q-ct-days-coil{stroke:var(--fig-amber);stroke-width:2.6;fill:none}</style>
  <line x1="90" y1="270" x2="640" y2="270" class="f6-1-q-ct-days-grid"/>
  <text x="82" y="275" text-anchor="end" class="f6-1-q-ct-days-s">10</text>
  <line x1="90" y1="237.5" x2="640" y2="237.5" class="f6-1-q-ct-days-grid"/>
  <text x="82" y="242.5" text-anchor="end" class="f6-1-q-ct-days-s">15</text>
  <line x1="90" y1="205" x2="640" y2="205" class="f6-1-q-ct-days-grid"/>
  <text x="82" y="210" text-anchor="end" class="f6-1-q-ct-days-s">20</text>
  <line x1="90" y1="172.5" x2="640" y2="172.5" class="f6-1-q-ct-days-grid"/>
  <text x="82" y="177.5" text-anchor="end" class="f6-1-q-ct-days-s">25</text>
  <line x1="90" y1="140" x2="640" y2="140" class="f6-1-q-ct-days-grid"/>
  <text x="82" y="145" text-anchor="end" class="f6-1-q-ct-days-s">30</text>
  <line x1="90" y1="107.5" x2="640" y2="107.5" class="f6-1-q-ct-days-grid"/>
  <text x="82" y="112.5" text-anchor="end" class="f6-1-q-ct-days-s">35</text>
  <line x1="90" y1="75" x2="640" y2="75" class="f6-1-q-ct-days-grid"/>
  <text x="82" y="80" text-anchor="end" class="f6-1-q-ct-days-s">40</text>
  <line x1="90" y1="42.5" x2="640" y2="42.5" class="f6-1-q-ct-days-grid"/>
  <text x="82" y="47.5" text-anchor="end" class="f6-1-q-ct-days-s">45</text>
  <line x1="90" y1="270" x2="650" y2="270" class="f6-1-q-ct-days-ax"/>
  <line x1="90" y1="270" x2="90" y2="32.5" class="f6-1-q-ct-days-ax"/>
  <text x="20" y="26" class="f6-1-q-ct-days-s">Ct 값</text>
  <line x1="145" y1="270" x2="145" y2="275" class="f6-1-q-ct-days-ax"/>
  <text x="145" y="291" text-anchor="middle" class="f6-1-q-ct-days-s">1일</text>
  <line x1="255" y1="270" x2="255" y2="275" class="f6-1-q-ct-days-ax"/>
  <text x="255" y="291" text-anchor="middle" class="f6-1-q-ct-days-s">3일</text>
  <line x1="365" y1="270" x2="365" y2="275" class="f6-1-q-ct-days-ax"/>
  <text x="365" y="291" text-anchor="middle" class="f6-1-q-ct-days-s">5일</text>
  <line x1="475" y1="270" x2="475" y2="275" class="f6-1-q-ct-days-ax"/>
  <text x="475" y="291" text-anchor="middle" class="f6-1-q-ct-days-s">7일</text>
  <line x1="585" y1="270" x2="585" y2="275" class="f6-1-q-ct-days-ax"/>
  <text x="585" y="291" text-anchor="middle" class="f6-1-q-ct-days-s">9일</text>
  <text x="365" y="314" text-anchor="middle" class="f6-1-q-ct-days-s">감염 확인 후 날짜</text>
  <line x1="90" y1="75" x2="640" y2="75" style="stroke:var(--fig-red);stroke-width:1.6;stroke-dasharray:7 5"/>
  <text x="98" y="68" class="f6-1-q-ct-days-t" style="fill:var(--fig-red)">음성 판정 기준(40)</text>
  <polyline points="145,140.0 255,205.0 365,179.0 475,127.0" style="fill:none;stroke:var(--fig-blue);stroke-width:2"/>
  <circle cx="145" cy="140.0" r="6" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <text x="155" y="132" class="f6-1-q-ct-days-t">30</text>
  <circle cx="255" cy="205.0" r="6" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <text x="265" y="197" class="f6-1-q-ct-days-t">20</text>
  <circle cx="365" cy="179.0" r="6" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <text x="375" y="171" class="f6-1-q-ct-days-t">24</text>
  <circle cx="475" cy="127.0" r="6" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <text x="485" y="119" class="f6-1-q-ct-days-t">32</text>
  <path d="M585 50.75 L578 63.75 L592 63.75 Z" style="fill:var(--fig-panel);stroke:var(--fig-blue);stroke-width:2"/>
  <text x="597" y="63.75" class="f6-1-q-ct-days-s">40까지 넘지 않음</text>
</svg>
