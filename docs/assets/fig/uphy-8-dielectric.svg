<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-uphy-8-dielectric d-uphy-8-dielectric">
  <title id="t-uphy-8-dielectric">그림 일반물리학 8-3 유전체가 전기장을 약하게 하는 방법</title>
  <desc id="d-uphy-8-dielectric">전지를 뗀 평행판 축전기(판의 자유 전하 ±Q 일정)에 유전 상수 κ = 3인 유전체를 채우면, 분자들이 분극되어 유전체 위쪽 면에 음의 속박 전하, 아래쪽 면에 양의 속박 전하가 나타난다. 판에서 나온 전기력선 일부가 속박 전하에서 끝나므로 유전체 속 전기장은 E₀/κ로 줄고, 전위차도 V₀/κ로 줄어 전기 용량이 κ배가 된다. 모식도이다.</desc>
