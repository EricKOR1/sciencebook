<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" role="img" aria-labelledby="t-bio-1-competition d-bio-1-competition">
  <title id="t-bio-1-competition">그림 생명과학 1-8 종간 경쟁과 포식·피식에 따른 개체 수 변화</title>
  <desc id="d-bio-1-competition">(가) 애기짚신벌레와 짚신벌레를 따로 배양하면 둘 다 S자형 생장 곡선을 그린다. (나) 함께 배양하면 먹이를 두고 경쟁하여 짚신벌레가 사라지는 경쟁 배타가 일어난다. (다) 포식자와 피식자의 개체 수는 피식자가 먼저, 포식자가 뒤따르며 주기적으로 변동한다. 모식 그래프.</desc>
  <style>
    .b1cmp-lbl{font-size:13.5px;fill:var(--fig-ink)} .b1cmp-b{font-size:14.5px;font-weight:700;fill:var(--fig-ink)}
    .b1cmp-sm{font-size:12.5px;fill:var(--fig-muted)} .b1cmp-lead{fill:none;stroke:var(--fig-muted);stroke-width:1.1}
    .b1cmp-ink{fill:var(--fig-ink)} .b1cmp-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.6}
    
  </style>
  <text x="120.0" y="28.0" text-anchor="middle" class="b1cmp-b">(가) 따로 배양</text>
