  <title id="t-pchem-6-harned-activity-a">그림 물리화학 6-11 활동 A의 결과 예시</title>
  <desc id="d-pchem-6-harned-activity-a">왼쪽: 하네드 전지 7점의 y = E + (2RT/F)ln b를 √b에 대해 그리면 진한 쪽에서 위로 볼록하게 휘고, 묽은 4점으로 그은 직선의 절편은 0.2226 V이다. 오른쪽: 확장 디바이–휘켈 식으로 보정한 y′을 b에 대해 그리면 7점이 완만한 직선에 놓이고 절편은 0.2223 V이다.</desc>
