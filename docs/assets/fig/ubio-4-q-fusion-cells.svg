  <title id="t-ubio-4-q-fusion-cells">그림 일반생명과학 4-9 문제 9의 세포 융합 실험</title>
  <desc id="d-ubio-4-q-fusion-cells">M기 세포와 G₁기 세포를 융합하면, 융합 세포 안에 M기 세포의 염색체와 함께 G₁기 핵에서 응축된 염색체가 보인다. 두 세포 모두 2n = 4로 그린 모식도이다.</desc>
