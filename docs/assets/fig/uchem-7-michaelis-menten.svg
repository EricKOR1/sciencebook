  <title id="t-uchem-7-michaelis-menten">그림 일반화학 7-10 미카엘리스–멘텐 곡선 — 1차에서 0차로</title>
  <desc id="d-uchem-7-michaelis-menten">기질 농도 [S](K_M 단위)에 따른 상대 속도 v/V_max이다. [S] ≪ K_M에서는 원점을 지나는 직선(1차)에 붙어 있고, [S] = K_M에서 V_max의 절반, [S] ≫ K_M에서는 V_max에 다가가 거의 변하지 않는다(0차, 효소 포화). 점은 예제 14의 세 농도이다.</desc>
