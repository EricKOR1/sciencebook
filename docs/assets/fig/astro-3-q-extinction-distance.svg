<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-astro-3-q-extinction-distance d-astro-3-q-extinction-distance">
  <title id="t-astro-3-q-extinction-distance">그림 행성우주과학 3-12 문제 16 네 별의 거리와 소광</title>
  <desc id="d-astro-3-q-extinction-distance">소광을 보정한 거리에 따라 각 별의 소광 A_V를 나타낸 것이다. 약 480 pc까지는 소광이 거의 없다가 약 910 pc의 별부터 약 1.5등급 커지고 그 뒤로는 거의 늘지 않으므로, 티끌 구름은 그 사이(색칠한 구간)에 있다.</desc>
