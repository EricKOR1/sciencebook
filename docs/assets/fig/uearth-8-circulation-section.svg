<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="t-uearth-8-circulation-section d-uearth-8-circulation-section">
  <title id="t-uearth-8-circulation-section">그림 일반지구과학 8-2 북반구 대기 대순환의 남북 단면 — 세 세포, 기압대, 제트류</title>
  <desc id="d-uearth-8-circulation-section">적도에서 상승한 공기는 대류권 위쪽에서 극 쪽으로 가다가 위도 약 30°에서 내려앉는다(해들리 순환). 위도 60° 부근에서 상승한 공기는 극에서 내려앉고(극순환), 그 사이 페렐 순환은 평균으로 나타나는 간접 순환이다. 지상에는 적도 저압대, 아열대 고압대, 한대 전선대, 극 고압대가 생기고, 대류권 계면 바로 아래 위도 약 30°에 아열대 제트, 35°~65°에 한대 전선 제트가 흐른다. 높이를 크게 과장한 모식도이다.</desc>
