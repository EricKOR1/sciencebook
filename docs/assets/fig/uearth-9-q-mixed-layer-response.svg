  <title id="t-uearth-9-q-mixed-layer-response">그림 일반지구과학 9-10 예제 9 풀이 — 강제력이 갑자기 생긴 뒤의 기온 상승</title>
  <desc id="d-uearth-9-q-mixed-layer-response">혼합층 열용량 4.1×10⁸ J/(m²·K), λ = 1.2 W/(m²·K)에서 강제력 3.7 W/m²가 갑자기 생기면 기온 상승은 ΔT = 3.1(1 − e^(−t/11)) K로 평형값 약 3.1 K에 지수적으로 다가간다. 시간 상수 11년에 평형값의 약 63 %, 10년 뒤 약 1.8 K, 30년 뒤 약 2.9 K이다.</desc>
