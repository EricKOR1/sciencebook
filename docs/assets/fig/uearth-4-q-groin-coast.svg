<title id="t-uearth-4-q-groin-coast">그림 일반지구과학 4-13 예제 10의 해빈과 돌제(위에서 본 모습)</title>
<desc id="d-uearth-4-q-groin-coast">해안선이 남북으로 뻗은 동해안의 해빈에 파랑이 북동쪽에서 비스듬히 다가오고, 해빈 가운데에 해안선과 수직한 돌제가 있다. 파란 선은 파랑의 마루이다.</desc>
