<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-uearth-11-hubble-diagram d-uearth-11-hubble-diagram">
  <title id="t-uearth-11-hubble-diagram">그림 일반지구과학 11-10 허블–르메트르 법칙</title>
  <desc id="d-uearth-11-hubble-diagram">가로축은 은하까지의 거리, 세로축은 적색 편이로 구한 후퇴 속도이다. 은하들은 기울기 H₀ ≈ 70 km/(s·Mpc)인 직선 v = H₀d 주위에 놓인다. 기울기가 67과 73인 직선(허블 긴장의 두 값)도 함께 그렸다. 기울기의 역수 1/H₀는 팽창 속도가 일정했다고 할 때의 우주 나이(허블 시간, 약 140억 년)이다. 점은 설명을 위한 가상의 자료.</desc>
  <style>
    .uearth-11-hubble-diagram-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .uearth-11-hubble-diagram-t{font-size:13px;fill:var(--fig-ink)}
    .uearth-11-hubble-diagram-s{font-size:13px;fill:var(--fig-muted)}
    .uearth-11-hubble-diagram-n{font-size:12px;fill:var(--fig-muted)}
    .uearth-11-hubble-diagram-b{font-size:13px;font-weight:600;fill:var(--fig-ink)}
    .uearth-11-hubble-diagram-o{paint-order:stroke;stroke:var(--fig-paper);stroke-width:4px;stroke-linejoin:round}
  </style>
