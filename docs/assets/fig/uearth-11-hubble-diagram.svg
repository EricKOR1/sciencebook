  <line x1="248.0" y1="270.0" x2="248.0" y2="275.0" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="248.0" y="289.0" text-anchor="middle" class="uearth-11-hubble-diagram-n">200</text>
  <line x1="332.0" y1="270.0" x2="332.0" y2="275.0" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="332.0" y="289.0" text-anchor="middle" class="uearth-11-hubble-diagram-n">300</text>
  <line x1="416.0" y1="270.0" x2="416.0" y2="275.0" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="416.0" y="289.0" text-anchor="middle" class="uearth-11-hubble-diagram-n">400</text>
  <line x1="500.0" y1="270.0" x2="500.0" y2="275.0" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="500.0" y="289.0" text-anchor="middle" class="uearth-11-hubble-diagram-n">500</text>
  <text x="290.0" y="308.0" text-anchor="middle" class="uearth-11-hubble-diagram-s">거리 d (Mpc)</text>
  <text x="72.0" y="274.0" text-anchor="end" class="uearth-11-hubble-diagram-n">0</text>
  <text x="72.0" y="214.0" text-anchor="end" class="uearth-11-hubble-diagram-n">10,000</text>
  <text x="72.0" y="154.0" text-anchor="end" class="uearth-11-hubble-diagram-n">20,000</text>
  <text x="72.0" y="94.0" text-anchor="end" class="uearth-11-hubble-diagram-n">30,000</text>
  <text x="72.0" y="34.0" text-anchor="end" class="uearth-11-hubble-diagram-n">40,000</text>
  <text x="20.0" y="150.0" text-anchor="middle" class="uearth-11-hubble-diagram-s" transform="rotate(-90 20 150.0)">후퇴 속도 v (km/s)</text>
  <text x="540.0" y="62.0" class="uearth-11-hubble-diagram-b">기울기 = H₀</text>
  <text x="540.0" y="82.0" class="uearth-11-hubble-diagram-t">≈ 70 km/(s·Mpc)</text>
  <text x="540.0" y="116.0" class="uearth-11-hubble-diagram-b">기울기의 역수 1/H₀</text>
  <text x="540.0" y="136.0" class="uearth-11-hubble-diagram-t">= 허블 시간 ≈ 140억 년</text>
  <text x="540.0" y="152.0" class="uearth-11-hubble-diagram-n">(팽창 속도가 일정했다면</text>
  <text x="540.0" y="168.0" class="uearth-11-hubble-diagram-n"> 우주의 나이)</text>
  <text x="540.0" y="202.0" class="uearth-11-hubble-diagram-n">점선: H₀ = 67, 73</text>
  <text x="540.0" y="218.0" class="uearth-11-hubble-diagram-n">(측정 방법에 따른 차이,</text>
  <text x="540.0" y="234.0" class="uearth-11-hubble-diagram-n"> 허블 긴장)</text>
</svg>
