  <circle cx="98.5" cy="261.1" r="3.6" style="fill:var(--fig-ink);opacity:.75"/>
  <circle cx="166.9" cy="226.1" r="3.6" style="fill:var(--fig-ink);opacity:.75"/>
  <circle cx="273.8" cy="184.0" r="3.6" style="fill:var(--fig-ink);opacity:.75"/>
