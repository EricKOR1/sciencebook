  <line x1="80.0" y1="210.0" x2="500.0" y2="210.0" style="stroke:var(--fig-line);stroke-width:.6;stroke-dasharray:2 4"/>
  <line x1="80.0" y1="150.0" x2="500.0" y2="150.0" style="stroke:var(--fig-line);stroke-width:.6;stroke-dasharray:2 4"/>
  <line x1="80.0" y1="90.0" x2="500.0" y2="90.0" style="stroke:var(--fig-line);stroke-width:.6;stroke-dasharray:2 4"/>
  <line x1="80.0" y1="30.0" x2="500.0" y2="30.0" style="stroke:var(--fig-line);stroke-width:.6;stroke-dasharray:2 4"/>
  <line x1="80.0" y1="270.0" x2="500.0" y2="69.0" style="stroke:var(--fig-muted);stroke-width:1.2;stroke-dasharray:5 4"/>
  <line x1="80.0" y1="270.0" x2="500.0" y2="51.0" style="stroke:var(--fig-muted);stroke-width:1.2;stroke-dasharray:5 4"/>
  <line x1="80.0" y1="270.0" x2="500.0" y2="60.0" style="stroke:var(--fig-blue);stroke-width:2.4"/>
  <circle cx="269.3" cy="190.9" r="3.6" style="fill:var(--fig-ink);opacity:.75"/>
