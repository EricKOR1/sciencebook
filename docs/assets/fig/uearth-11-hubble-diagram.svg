  <text x="506.0" y="64.0" class="uearth-11-hubble-diagram-b" style="fill:var(--fig-blue)">70</text>
  <text x="506.0" y="75.0" class="uearth-11-hubble-diagram-n">67</text>
  <circle cx="140.5" cy="240.0" r="6.0" style="fill:var(--fig-red);stroke:var(--fig-paper);stroke-width:1.5"/>
  <text x="150.5" y="244.0" class="uearth-11-hubble-diagram-b uearth-11-hubble-diagram-o" style="fill:var(--fig-red)">예제 11의 은하</text>
  <circle cx="441.2" cy="90.0" r="6.0" style="fill:var(--fig-red);stroke:var(--fig-paper);stroke-width:1.5"/>
  <text x="431.2" y="108.0" text-anchor="end" class="uearth-11-hubble-diagram-b uearth-11-hubble-diagram-o" style="fill:var(--fig-red)">z = 0.10 은하</text>
  <path d="M248.0 186.0 L332.0 186.0 L332.0 144.0" style="fill:none;stroke:var(--fig-ink);stroke-width:1"/>
  <text x="290.0" y="202.0" text-anchor="middle" class="uearth-11-hubble-diagram-n">Δd = 100 Mpc</text>
