<text x="522" y="168" class="cv-b" style="fill:var(--fig-red)">중력 = 가속도 방향</text>
<text x="522" y="186" class="cv-sm">언제나 지구 중심 쪽</text>
<text x="470" y="236" class="cv-txt">중력이 운동 방향과 수직</text>
<text x="470" y="256" class="cv-txt">→ 속력은 그대로, 방향만 바뀐다</text>
<text x="470" y="276" class="cv-txt">→ 계속 지구 쪽으로 ‘떨어지며’ 돈다</text>
<text x="470" y="400" class="cv-sm">모식도 · 위성의 크기와 화살표 길이는 임의</text>
