<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-3-3-circular-vectors d-3-3-circular-vectors">
<title id="t-3-3-circular-vectors">그림 3-3-3 지구 주위를 도는 위성의 속도와 중력(가속도) 방향</title>
<desc id="d-3-3-circular-vectors">원 궤도를 도는 위성의 속도는 매 순간 원의 접선 방향이고 크기는 같다. 중력과 가속도는 언제나 지구 중심을 향한다. 중력이 사라지면 위성은 그 순간의 접선 방향으로 곧게 나아간다. 지구와 궤도의 크기 비율은 실제와 다른 모식도이다.</desc>
<style>.cv-txt{font-size:13px;fill:var(--fig-ink)}.cv-b{font-size:14px;font-weight:700;fill:var(--fig-ink)}.cv-sm{font-size:12px;fill:var(--fig-muted)}.cv-orb{fill:none;stroke:var(--fig-line);stroke-width:1.5;stroke-dasharray:5 4}.cv-v{fill:none;stroke:var(--fig-blue);stroke-width:3}.cv-vh{fill:var(--fig-blue)}.cv-g{fill:none;stroke:var(--fig-red);stroke-width:3}.cv-gh{fill:var(--fig-red)}.cv-tan{fill:none;stroke:var(--fig-violet);stroke-width:2;stroke-dasharray:7 5}.cv-sat{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2}</style>
