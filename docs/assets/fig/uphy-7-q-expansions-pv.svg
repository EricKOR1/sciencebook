  <title id="t-uphy-7-q-expansions-pv">그림 일반물리학 7-14 문제 17 해설: 두 팽창의 처음과 끝 상태</title>
  <desc id="d-uphy-7-q-expansions-pv">처음 상태 A(400 K, V)에서 (가) 자유 팽창한 끝 상태 B는 같은 400 K 등온선 위의 2V에 있다. 자유 팽창은 중간 상태가 평형이 아니어서 경로를 그릴 수 없으므로 점선 화살표로 처음과 끝만 나타냈고, 엔트로피는 A와 B를 잇는 가역 등온 경로(파선)로 계산한다. (나) 가역 단열 팽창은 등온선보다 가파른 단열선을 따라 C(약 252 K)에 이른다.</desc>
