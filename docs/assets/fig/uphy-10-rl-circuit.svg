<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-uphy-10-rl-circuit d-uphy-10-rl-circuit">
  <title id="t-uphy-10-rl-circuit">그림 일반물리학 10-4 RL 회로 — 회로도와 전류의 시간 변화</title>
  <desc id="d-uphy-10-rl-circuit">기전력 ε인 전지, 스위치 S, 저항 R, 인덕터 L을 직렬로 연결한 회로이다. 스위치를 닫으면 전류는 0에서 시작해 I = (ε/R)(1 − e^(−t/τ))로 늘어나 시간 상수 τ = L/R 뒤에 최종값의 63%가 되고, 5τ쯤이면 사실상 최종값 ε/R에 이른다. 전원을 떼고 저항으로 닫으면 전류는 I₀e^(−t/τ)로 줄어 τ 뒤에 37%가 된다.</desc>
