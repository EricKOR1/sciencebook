<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-ochem-10-q-glucose d-ochem-10-q-glucose">
  <title id="t-ochem-10-q-glucose">그림 유기화학 10-16 문제 10 해설 — 포도당의 고리형 헤미아세탈과 메틸 글루코사이드</title>
  <desc id="d-ochem-10-q-glucose">가운데: 사슬형 D-포도당(피셔 투영식, C1은 CHO). 왼쪽: C5–OH가 C1=O에 첨가해 생긴 고리형 헤미아세탈 β-D-글루코피라노스(하워스 투영식, C1의 OH가 위쪽)와 평형을 이룬다. 오른쪽: CH₃OH와 H⁺로 C1이 아세탈이 된 메틸 β-D-글루코피라노사이드. 아래: 사슬형 포도당은 톨렌스 시약(Ag(NH₃)₂⁺, OH⁻)에 산화되어 글루콘산 음이온과 은(은거울)이 생기지만, 메틸 글루코사이드는 염기에서 아세탈이 열리지 않아 반응하지 않는다.</desc>
