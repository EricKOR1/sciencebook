  <title id="t-ubio-11-q-o2-curve">그림 일반생명과학 11-9 예제 7 풀이 — 산소 해리 곡선에서 읽는 산소 공급량</title>
  <desc id="d-ubio-11-q-o2-curve">힐 식(P₅₀ = 26.8 mmHg, n = 2.7)으로 그린 산소 해리 곡선(실선)과, pH 감소·온도 상승으로 P₅₀이 32 mmHg로 커진 곡선(점선, 오른쪽 이동 = 보어 효과). 동맥혈(100 mmHg) 포화도 97%에서 휴식 조직(40 mmHg, 75%)까지 내려오면 혈액 1 dL당 4.5 mL, 운동 근육(20 mmHg, 31%)까지 내려오면 13.3 mL를 내놓고, 오른쪽 이동한 곡선에서는 20 mmHg의 포화도가 22%로 낮아져 15.1 mL를 내놓는다.</desc>
