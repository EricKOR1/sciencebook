<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-umath-7-exponential-lifetime d-umath-7-exponential-lifetime">
  <title id="t-umath-7-exponential-lifetime">그림 수학 도구 7-2 분자 하나의 수명 — 지수 분포</title>
  <desc id="d-umath-7-exponential-lifetime">1차 반응에서 분자 하나의 수명 분포 p(t) = k e^(−kt). 가로축은 kt, 세로축은 p(t)/k이다. kt = 1(평균 수명) 오른쪽의 칠한 넓이가 e⁻¹ ≈ 0.37이고, 반감기 kt = ln 2 ≈ 0.69 오른쪽 넓이는 1/2이다.</desc>
