<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-pchem-2-carnot-ts d-pchem-2-carnot-ts">
  <title id="t-pchem-2-carnot-ts">그림 물리화학 2-5 예제 2의 카르노 순환을 T–S 도표로 나타낸 모습</title>
  <desc id="d-pchem-2-carnot-ts">예제 2의 카르노 순환은 T–S 도표에서 직사각형이다. A→B는 600 K 수평선(엔트로피 9.13 J/K 증가), B→C는 수직선(가역 단열, 등엔트로피), C→D는 300 K 수평선, D→A는 수직선이다. 직사각형 넓이가 알짜 일 2.74 kJ, 300 K 선 아래 넓이가 버린 열 2.74 kJ이다.</desc>
