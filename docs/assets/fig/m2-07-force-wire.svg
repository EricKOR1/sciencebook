<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-m2-07-force-wire d-m2-07-force-wire">
  <title id="t-m2-07-force-wire">그림 중2-7-7 자기장 속에서 전류가 받는 힘과 오른손 방법</title>
  <desc id="d-m2-07-force-wire">자석의 N극이 위, S극이 아래에 있어 자기장이 아래로 향하고, 그 사이의 도선에 전류가 왼쪽에서 오른쪽으로 흐르면 도선은 뒤쪽(나에게서 멀어지는 쪽)으로 힘을 받는다. 오른손 엄지를 전류, 네 손가락을 자기장 방향으로 맞추면 손바닥이 미는 쪽이 힘의 방향이다.</desc>
