<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 462" role="img" aria-labelledby="t-ubio-12-ear d-ubio-12-ear">
  <title id="t-ubio-12-ear">그림 일반생명과학 12-8 귀의 구조, 기저막의 진동수 지도, 유모 세포</title>
  <desc id="d-ubio-12-ear">왼쪽: 소리는 외이도를 지나 고막을 흔들고, 귓속뼈가 진동을 타원창으로 전해 달팽이관 속 림프액에 압력파를 만든다. 반고리관과 전정 기관은 평형 감각을 맡는다. 오른쪽 위: 달팽이관을 편 모습. 기저막은 입구(기저부) 쪽이 좁고 뻣뻣해 높은 소리에, 꼭대기 쪽이 넓고 유연해 낮은 소리에 가장 크게 진동한다. 오른쪽 아래: 유모 세포의 털이 긴 털 쪽으로 휘면 기계 개폐 통로가 열려 K⁺가 들어와 탈분극되고, 반대로 휘면 과분극된다. 모식도이다.</desc>
