<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img" aria-labelledby="t-2-6-silicon-bonds d-2-6-silicon-bonds">
  <title id="t-2-6-silicon-bonds">그림 2-6-1 순수한 규소 결정 속의 전자</title>
  <desc id="d-2-6-silicon-bonds">규소 원자 하나는 이웃한 규소 원자 4개와 전자쌍을 하나씩 공유한다. 원자가 전자 4개가 모두 결합에 쓰여 묶여 있으므로 움직이는 전자가 매우 적다(왼쪽). 열이나 빛 에너지를 받으면 일부 전자가 결합에서 풀려나 결정 속을 움직일 수 있다(오른쪽). 실제 결정은 입체 구조이며, 이를 평면에 펼쳐 나타낸 모식도이다.</desc>
  <style>
    .sb-lbl{font-size:15px;font-weight:600;fill:var(--fig-ink)} .sb-t{font-size:14px;fill:var(--fig-ink)}
    .sb-sm{font-size:13px;fill:var(--fig-muted)} .sb-at{font-size:13px;font-weight:700;fill:var(--fig-ink)}
    .sb-si{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.6}
    .sb-bd{stroke:var(--fig-line);stroke-width:2;fill:none} .sb-e{fill:var(--fig-blue)}
    .sb-free{fill:var(--fig-red)} .sb-fr{fill:none;stroke:var(--fig-red);stroke-width:1.6}
    .sb-ar{stroke:var(--fig-red);stroke-width:2;fill:none} .sb-ah{fill:var(--fig-red)} .sb-red{font-size:13px;font-weight:600;fill:var(--fig-red)}
    .sb-bolt{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4;stroke-linejoin:round}
    .sb-sep{stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4}
  </style>
