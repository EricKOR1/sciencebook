  <text x="294" y="343.75" text-anchor="end" class="ubio-10-spac-gradient-s">−1.5</text>
  <text x="266" y="217.875" text-anchor="middle" class="ubio-10-spac-gradient-s" transform="rotate(-90 266 217.875)">Ψ (MPa)</text>
  <rect x="316" y="96" width="46" height="48.8" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <text x="339.0" y="162.8" text-anchor="middle" class="ubio-10-spac-gradient-n">−0.3</text>
  <circle cx="339.0" cy="58" r="9" class="ubio-10-spac-gradient-dot"/>
  <text x="339.0" y="62" text-anchor="middle" class="ubio-10-spac-gradient-num">1</text>
  <text x="339.0" y="36" text-anchor="middle" class="ubio-10-spac-gradient-t">토양</text>
  <text x="339.0" y="88" text-anchor="middle" class="ubio-10-spac-gradient-s">젖은 흙</text>
  <rect x="382" y="96" width="46" height="97.5" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
  <text x="405.0" y="211.5" text-anchor="middle" class="ubio-10-spac-gradient-n">−0.6</text>
  <circle cx="405.0" cy="58" r="9" class="ubio-10-spac-gradient-dot"/>
  <text x="405.0" y="62" text-anchor="middle" class="ubio-10-spac-gradient-num">2</text>
  <text x="405.0" y="18" text-anchor="middle" class="ubio-10-spac-gradient-t">뿌리</text>
  <text x="405.0" y="36" text-anchor="middle" class="ubio-10-spac-gradient-t">물관</text>
  <rect x="448" y="96" width="46" height="130.0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
