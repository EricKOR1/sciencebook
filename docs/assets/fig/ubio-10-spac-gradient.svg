  <path d="M646 339.25 L658 347.25 L680 331.25 L692 339.25 L692 359.25 L646 359.25 Z" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5"/>
  <text x="669.0" y="377.2" text-anchor="middle" class="ubio-10-spac-gradient-n">약 −94</text>
  <circle cx="669.0" cy="58" r="9" class="ubio-10-spac-gradient-dot"/>
  <text x="669.0" y="62" text-anchor="middle" class="ubio-10-spac-gradient-num">6</text>
  <text x="669.0" y="18" text-anchor="middle" class="ubio-10-spac-gradient-t">바깥</text>
  <text x="669.0" y="36" text-anchor="middle" class="ubio-10-spac-gradient-t">공기</text>
