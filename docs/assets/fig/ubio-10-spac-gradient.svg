  <text x="471.0" y="36" text-anchor="middle" class="ubio-10-spac-gradient-t">물관</text>
  <text x="471.0" y="88" text-anchor="middle" class="ubio-10-spac-gradient-s">10 m 높이</text>
  <rect x="514" y="96" width="46" height="162.5" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.5"/>
  <text x="537.0" y="276.5" text-anchor="middle" class="ubio-10-spac-gradient-n">−1.0</text>
  <circle cx="537.0" cy="58" r="9" class="ubio-10-spac-gradient-dot"/>
  <text x="537.0" y="62" text-anchor="middle" class="ubio-10-spac-gradient-num">4</text>
  <text x="537.0" y="18" text-anchor="middle" class="ubio-10-spac-gradient-t">잎</text>
  <text x="537.0" y="36" text-anchor="middle" class="ubio-10-spac-gradient-t">세포</text>
  <rect x="580" y="96" width="46" height="227.5" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.5"/>
  <text x="603.0" y="341.5" text-anchor="middle" class="ubio-10-spac-gradient-n">−1.4</text>
  <circle cx="603.0" cy="58" r="9" class="ubio-10-spac-gradient-dot"/>
  <text x="603.0" y="62" text-anchor="middle" class="ubio-10-spac-gradient-num">5</text>
  <text x="603.0" y="18" text-anchor="middle" class="ubio-10-spac-gradient-t">잎 속</text>
  <text x="603.0" y="36" text-anchor="middle" class="ubio-10-spac-gradient-t">공기</text>
  <text x="603.0" y="88" text-anchor="middle" class="ubio-10-spac-gradient-s">RH 99%</text>
