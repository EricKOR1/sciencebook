  <path d="M130 352 L158 384" style="fill:none;stroke:var(--fig-green);stroke-width:3;stroke-linecap:round"/>
  <path d="M130 362 L100 378" style="fill:none;stroke:var(--fig-green);stroke-width:3;stroke-linecap:round"/>
  <path d="M130 372 L146 404" style="fill:none;stroke:var(--fig-green);stroke-width:3;stroke-linecap:round"/>
  <rect x="124" y="100" width="12" height="230" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2"/>
  <path d="M136 112 Q190 60 246 92 Q196 136 136 112 Z" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2"/>
  <path d="M124 170 Q74 140 34 160 Q76 196 124 170 Z" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2"/>
  <path d="M136 112 Q190 104 230 98" style="fill:none;stroke:var(--fig-green);stroke-width:1;stroke-dasharray:3 3"/>
  <path d="M214 70 q6 -8 0 -16 q-6 -8 0 -16" style="fill:none;stroke:var(--fig-blue);stroke-width:2"/>
  <path d="M230 74 q6 -8 0 -16 q-6 -8 0 -16" style="fill:none;stroke:var(--fig-blue);stroke-width:2"/>
  <text x="60" y="44" class="ubio-10-spac-gradient-s">대기</text>
  <circle cx="84" cy="372" r="9" class="ubio-10-spac-gradient-dot"/>
  <text x="84" y="376" text-anchor="middle" class="ubio-10-spac-gradient-num">1</text>
  <circle cx="130" cy="350" r="9" class="ubio-10-spac-gradient-dot"/>
  <text x="130" y="354" text-anchor="middle" class="ubio-10-spac-gradient-num">2</text>
  <circle cx="130" cy="230" r="9" class="ubio-10-spac-gradient-dot"/>
  <text x="130" y="234" text-anchor="middle" class="ubio-10-spac-gradient-num">3</text>
  <circle cx="176" cy="92" r="9" class="ubio-10-spac-gradient-dot"/>
  <text x="176" y="96" text-anchor="middle" class="ubio-10-spac-gradient-num">4</text>
  <circle cx="208" cy="96" r="9" class="ubio-10-spac-gradient-dot"/>
  <text x="208" y="100" text-anchor="middle" class="ubio-10-spac-gradient-num">5</text>
  <circle cx="222" cy="30" r="9" class="ubio-10-spac-gradient-dot"/>
  <text x="222" y="34" text-anchor="middle" class="ubio-10-spac-gradient-num">6</text>
  <line x1="300" y1="96" x2="706" y2="96" style="stroke:var(--fig-ink);stroke-width:1.5"/>
  <text x="294" y="100.0" text-anchor="end" class="ubio-10-spac-gradient-s">0</text>
  <line x1="300" y1="177.25" x2="706" y2="177.25" style="stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4"/>
