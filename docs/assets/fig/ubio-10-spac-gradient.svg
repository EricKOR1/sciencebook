  <path d="M655.0 393.25 l12 6 l-12 6 z" style="fill:var(--fig-accent)"/>
  <text x="438.0" y="419.25" text-anchor="middle" class="ubio-10-spac-gradient-t">물의 이동: Ψ가 높은 곳 → 낮은 곳</text>
  <text x="573.0" y="306" text-anchor="end" class="ubio-10-spac-gradient-b">가장 큰 낙차: 5 → 6</text>
  <text x="573.0" y="324" text-anchor="end" class="ubio-10-spac-gradient-s">= 기공(증산 조절 지점)</text>
  <text x="573.0" y="342" text-anchor="end" class="ubio-10-spac-gradient-s">RH 90%이면 약 −14</text>
  <text x="300" y="450" class="ubio-10-spac-gradient-s">예시 값(20 °C 맑은 낮). 막대 6은 축을 잘라 그렸다.</text>
