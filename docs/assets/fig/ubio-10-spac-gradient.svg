<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 462" role="img" aria-labelledby="t-ubio-10-spac-gradient d-ubio-10-spac-gradient">
  <title id="t-ubio-10-spac-gradient">그림 일반생명과학 10-6 토양–식물–대기의 수분 퍼텐셜 내리막</title>
  <desc id="d-ubio-10-spac-gradient">20 °C 맑은 낮의 예시 값. 토양 −0.3, 뿌리 물관 −0.6, 줄기 물관 −0.8, 잎 세포 −1.0, 잎 속 공기(상대 습도 99%) 약 −1.4, 바깥 공기(상대 습도 50%) 약 −94 MPa. 물은 수분 퍼텐셜이 높은 곳에서 낮은 곳으로 이동하며, 가장 큰 낙차는 잎 속 공기와 바깥 공기 사이, 곧 기공에 있다.</desc>
  <style>.ubio-10-spac-gradient-t{font-size:14px;fill:var(--fig-ink)} .ubio-10-spac-gradient-b{font-size:14px;fill:var(--fig-ink);font-weight:700} .ubio-10-spac-gradient-s{font-size:13px;fill:var(--fig-muted)} .ubio-10-spac-gradient-n{font-size:13px;fill:var(--fig-ink);font-weight:700} .ubio-10-spac-gradient-dot{fill:var(--fig-accent)} .ubio-10-spac-gradient-num{font-size:12px;fill:var(--fig-panel);font-weight:700}</style>
  <rect x="20" y="330" width="240" height="80" rx="6" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
