  <rect x="488.0" y="40.0" width="220.0" height="132.0" rx="8" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <text x="500.0" y="64.0" class="uchem-2-water-collection-t">수면을 맞추면</text>
  <text x="500.0" y="86.0" class="uchem-2-water-collection-b">P(실린더 속) = P(대기)</text>
  <text x="500.0" y="112.0" class="uchem-2-water-collection-t">P(대기) = P(H₂) + P(H₂O)</text>
  <text x="500.0" y="136.0" class="uchem-2-water-collection-s">755.0 = 731.2 + 23.8 torr</text>
  <text x="500.0" y="156.0" class="uchem-2-water-collection-s">(25 °C 물의 증기 압력 23.8 torr)</text>
  <text x="234.0" y="318.0" class="uchem-2-water-collection-s">물이 담긴 수조</text>
</svg>
