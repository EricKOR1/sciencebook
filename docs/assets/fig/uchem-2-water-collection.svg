  <rect x="86.0" y="136.0" width="28.0" height="18.0" rx="2" style="fill:var(--fig-line);stroke:var(--fig-ink);stroke-width:1.2"/>
  <path d="M74 288 l4.2 -8 l9.8 2 l4.2 6 Z" style="fill:var(--fig-muted);stroke:var(--fig-ink);stroke-width:1"/>
