<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-uchem-2-water-collection d-uchem-2-water-collection">
  <title id="t-uchem-2-water-collection">그림 일반화학 2-6 물 위에서 기체 모으기(수상 치환)</title>
  <desc id="d-uchem-2-water-collection">아연과 묽은 염산에서 생긴 수소를 물을 채워 거꾸로 세운 눈금 실린더에 모은다. 실린더를 위아래로 움직여 안팎의 수면 높이를 맞추면 실린더 속 기체의 전체 압력이 대기압과 같아진다. 이 기체는 수소와 수증기의 혼합물이므로 수소의 부분 압력은 대기압에서 그 온도의 물의 증기 압력을 뺀 값이다(예제 4의 수치, 모식도).</desc>
  <style>
    .uchem-2-water-collection-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-2-water-collection-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-2-water-collection-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}

  </style>
  <clipPath id="uchem-2-water-collection-fl"><path d="M90 150 V190 L45 290 H155 L110 190 V150 Z"/></clipPath>
  <rect x="40" y="238" width="120" height="60" clip-path="url(#uchem-2-water-collection-fl)" style="fill:var(--fig-soft-teal)"/>
