    .f3-5-q-dialysis-sm{font-size:13px;fill:var(--fig-muted)} .f3-5-q-dialysis-ink{font-size:13px;fill:var(--fig-ink)}
    .f3-5-q-dialysis-ax{stroke:var(--fig-ink);stroke-width:1.5;fill:none} .f3-5-q-dialysis-grid{stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 4;fill:none}
  </style>
