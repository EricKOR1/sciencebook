<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-3-5-q-dialysis d-3-5-q-dialysis">
  <title id="t-3-5-q-dialysis">그림 3-5-7 문제 8의 혈액 투석기</title>
  <desc id="d-3-5-q-dialysis">반투과성 막을 사이에 두고 한쪽에는 환자의 혈액, 다른 쪽에는 투석액이 흐른다. 투석액에는 포도당과 일부 이온이 혈액과 비슷한 농도로 들어 있다. 입자의 크기와 개수는 실제와 다른 모식도이다.</desc>
