  <text x="170.0" y="410.0" text-anchor="middle" class="pchem-6-daniell-cell-b">산화 전극 (−)</text>
  <text x="170.0" y="430.0" text-anchor="middle" class="pchem-6-daniell-cell-lbl">Zn → Zn²⁺ + 2e⁻</text>
