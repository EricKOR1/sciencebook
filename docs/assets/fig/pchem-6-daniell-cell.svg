<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="t-pchem-6-daniell-cell d-pchem-6-daniell-cell">
  <title id="t-pchem-6-daniell-cell">그림 물리화학 6-6 다니엘 전지의 구성과 전지 표기</title>
  <desc id="d-pchem-6-daniell-cell">왼쪽 비커의 아연판(ZnSO₄ 용액)이 산화 전극(−), 오른쪽 비커의 구리판(CuSO₄ 용액)이 환원 전극(+)이다. 전자는 도선을 따라 Zn에서 Cu로 가고, KNO₃ 염다리에서는 NO₃⁻가 아연 쪽으로, K⁺가 구리 쪽으로 이동해 두 용액의 전기적 중성을 유지한다. 전류가 흐르지 않을 때 고저항 전압계는 1.10 V를 읽는다. 아래는 전지 표기와 기호의 뜻이다.</desc>
