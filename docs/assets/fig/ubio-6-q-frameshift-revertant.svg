  <title id="t-ubio-6-q-frameshift-revertant">그림 일반생명과학 6-15 문제 17 해설: 삽입과 결실에 따른 읽는 틀</title>
  <desc id="d-ubio-6-q-frameshift-revertant">야생형, 둘째 코돈 뒤에 G가 삽입된 돌연변이주 1, 그리고 원래 다섯째 코돈의 C가 결실된 복귀주의 예를 세 염기씩 묶어 나란히 적었다. 삽입 뒤부터 읽는 틀이 밀려 아미노산이 바뀌고 일찍 종결되며, 결실이 일어나면 그 뒤로 원래 틀이 회복된다. 복귀주는 A가 결실되어도 같은 폴리펩타이드가 된다.</desc>
