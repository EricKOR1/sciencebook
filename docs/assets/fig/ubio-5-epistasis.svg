<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-ubio-5-epistasis d-ubio-5-epistasis">
  <title id="t-ubio-5-epistasis">그림 일반생명과학 5-1 같은 16칸, 다른 묶음 — 독립, 열성 상위, 상보 유전자</title>
  <desc id="d-ubio-5-epistasis">두 유전자에 대해 이형 접합인 개체끼리 교배한 4×4 퍼넷 사각형 세 개. 왼쪽은 두 형질이 따로 나타나 9 : 3 : 3 : 1, 가운데는 ee가 털색 유전자를 가려 9 : 3 : 4(래브라도레트리버), 오른쪽은 두 효소가 모두 있어야 색소가 생겨 9 : 7이다. 칸 수 합이 모두 16이므로 두 유전자는 독립적으로 분리한다.</desc>
