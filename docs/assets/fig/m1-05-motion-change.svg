    .mc-redb{font-size:14px;font-weight:700;fill:var(--fig-red)}
    .mc-sred{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.6}
    .mc-blueb{font-size:14px;font-weight:700;fill:var(--fig-blue)}
