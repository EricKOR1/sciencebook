<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-m1-05-motion-change d-m1-05-motion-change">
  <title id="t-m1-05-motion-change">그림 중1-5-8 알짜힘의 방향과 운동 상태의 변화</title>
  <desc id="d-m1-05-motion-change">알짜힘이 운동 방향과 같으면 속력이 빨라지고, 반대이면 느려진다. 일정한 빠르기로 원을 그리며 돌 때 알짜힘은 원의 중심을 향해 운동 방향만 바꾼다. 비스듬히 던진 공에는 아래 방향의 중력이 작용해 속력과 방향이 함께 변한다. 점은 같은 시간 간격의 위치이며 모식적이다.</desc>
  <style>
    .mc-red{fill:none;stroke:var(--fig-red)} .mc-redh{fill:var(--fig-red)}
    .mc-blue{fill:none;stroke:var(--fig-blue)} .mc-blueh{fill:var(--fig-blue)}
    .mc-green{fill:none;stroke:var(--fig-green)} .mc-greenh{fill:var(--fig-green)}
    .mc-amber{fill:none;stroke:var(--fig-amber)} .mc-amberh{fill:var(--fig-amber)}
