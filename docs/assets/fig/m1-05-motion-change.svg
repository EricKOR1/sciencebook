    .mc-amberb{font-size:14px;font-weight:700;fill:var(--fig-amber)}
    .mc-samber{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.6}
    .mc-violetb{font-size:14px;font-weight:700;fill:var(--fig-violet)}
