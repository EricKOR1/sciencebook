    .mc-steal{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.6}
    .mc-panel{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.4}
    .mc-paper{fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1.4}
    .mc-axis{fill:none;stroke:var(--fig-ink);stroke-width:1.6}
    .mc-grid{fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 4}
    .mc-dash{fill:none;stroke:var(--fig-muted);stroke-width:1.4;stroke-dasharray:5 4}
    .mc-ball{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.6} .mc-pos{fill:var(--fig-muted)}
