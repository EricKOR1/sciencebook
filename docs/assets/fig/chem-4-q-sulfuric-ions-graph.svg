  <desc id="d-chem-4-q-sulfuric-ions-graph">0.10 M 황산 10 mL(실선)는 처음 이온이 3.0 mmol이고 중화점(20 mL)까지 일정하다가 그 뒤 늘어 30 mL에서 5.0 mmol이 된다. 같은 농도·부피의 염산(점선)은 처음 이온이 2.0 mmol이고 중화점(10 mL)까지 일정하다가 그 뒤 늘어 30 mL에서 6.0 mmol이 된다. 중화점 뒤에는 두 경우 모두 1 mL마다 Na⁺와 OH⁻가 0.1 mmol씩 늘어 기울기가 같다.</desc>
