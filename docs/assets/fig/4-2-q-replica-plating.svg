  <desc id="d-4-2-q-replica-plating">① 항생제가 없는 처음 배지에서 세균 집락을 기른다. ② 벨벳 천에 집락을 묻혀 ③ 항생제가 있는 배지에 같은 방향으로 찍어 옮긴다. ④ 항생제 배지에서 자란 집락과 같은 위치에 있던 처음 배지의 세균을 덜어 다른 항생제 배지에서 기른다(결과는 묻는 내용이다). 모식도.</desc>
