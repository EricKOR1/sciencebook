  <text x="360" y="368" text-anchor="middle" class="u6re-s">자유단: 마찰 없이 막대를 따라 위아래로 움직이는 가벼운 고리에 줄 끝을 맨다(끝에 가로 힘이 작용하지 않는다)</text>
