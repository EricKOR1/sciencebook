  <title id="t-uphy-6-reflection-ends">그림 일반물리학 6-1 고정단과 자유단에서의 반사</title>
  <desc id="d-uphy-6-reflection-ends">고정단에서는 끝점의 변위가 0이어야 하므로 반사 펄스가 뒤집혀(위상 π 변화) 돌아오고, 자유단(막대를 따라 미끄러지는 고리)에서는 끝의 기울기가 0이어야 하므로 뒤집히지 않고 돌아온다.</desc>
