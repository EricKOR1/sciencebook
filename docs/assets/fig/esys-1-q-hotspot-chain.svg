  <ellipse cx="140" cy="50" rx="12" ry="9" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <text x="160" y="68" class="esys-1-q-hotspot-chain-b">R</text>
