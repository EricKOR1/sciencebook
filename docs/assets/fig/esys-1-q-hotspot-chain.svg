<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" class="fig-small" role="img" aria-labelledby="t-esys-1-q-hotspot-chain d-esys-1-q-hotspot-chain">
  <title id="t-esys-1-q-hotspot-chain">그림 지구시스템과학 1-10 문제 7의 화산섬 배치</title>
  <desc id="d-esys-1-q-hotspot-chain">위에서 내려다본 바다에 놓인 화산섬 P, Q, R의 위치를 나타낸 모식도이다. 섬 사이의 거리는 축척 막대로 읽을 수 있고, 각 섬의 나이는 문제의 표에 주어져 있다.</desc>
  <style>
    .esys-1-q-hotspot-chain-t{font-size:14px;fill:var(--fig-ink)} .esys-1-q-hotspot-chain-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .esys-1-q-hotspot-chain-s{font-size:13px;fill:var(--fig-muted)} .esys-1-q-hotspot-chain-ax{fill:none;stroke:var(--fig-muted);stroke-width:1.4} .esys-1-q-hotspot-chain-gr{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4}
  </style>
  <rect x="10" y="10" width="440" height="280" rx="8" style="fill:var(--fig-soft-blue);stroke:var(--fig-line);stroke-width:1"/>
  <line x1="140" y1="50" x2="300" y2="210" style="stroke:var(--fig-line);stroke-width:1.2;stroke-dasharray:4 4"/>
