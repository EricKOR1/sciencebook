<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-ochem-11-nas-general d-ochem-11-nas-general">
  <title id="t-ochem-11-nas-general">그림 유기화학 11-6 친핵성 아실 치환의 일반 메커니즘</title>
  <desc id="d-ochem-11-nas-general">왼쪽: 평면 삼각형(sp²)인 R–C(=O)–Y에 Nu⁻가 C=O 평면 위쪽에서 C=O 축과 약 105°를 이루며 다가온다(점선). ① 첨가: Nu⁻의 전자쌍이 카보닐 탄소로, C=O π 전자쌍이 O로 간다. 가운데: 탄소가 sp³인 사면체 중간체 R–C(O⁻)(Nu)(Y)(쐐기는 종이 앞, 점선 쐐기는 종이 뒤). ② 제거: O⁻의 전자쌍이 C–O 결합 자리로 돌아와 C=O를 다시 만들고, C–Y 결합 전자쌍이 Y로 가서 Y⁻가 떨어진다. 생성물은 R–C(=O)–Nu + Y⁻이다.</desc>
