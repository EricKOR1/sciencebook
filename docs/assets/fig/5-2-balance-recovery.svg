<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-5-2-balance-recovery d-5-2-balance-recovery">
  <title id="t-5-2-balance-recovery">그림 5-2-4 생태계 평형의 회복과 붕괴</title>
  <desc id="d-5-2-balance-recovery">(가) 평형 상태의 개체 수는 일정한 범위 안에서 오르내린다. 일시적인 변화로 크게 줄어도 음성 되먹임으로 몇 번 오르내린 뒤 원래 범위로 돌아온다. (나) 변화가 너무 크거나 오래 계속되면 원래 범위로 돌아오지 못하고 전혀 다른 상태로 바뀐다. 가상의 값으로 그린 모식 그래프이다.</desc>
  <style>
    .br-ttl{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .br-sm{font-size:13px;fill:var(--fig-muted)}
    .br-tick{font-size:13px;fill:var(--fig-muted)}
    .br-plot{fill:var(--fig-panel);stroke:none}
    .br-band{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1;stroke-dasharray:5 4}
    .br-band-t{font-size:13px;font-weight:600;fill:var(--fig-green)}
    .br-line{fill:none;stroke:var(--fig-blue);stroke-width:2.6;stroke-linejoin:round}
    .br-ev{stroke:var(--fig-red);stroke-width:1.5;stroke-dasharray:4 3}
    .br-ev-t{font-size:13px;font-weight:600;fill:var(--fig-red)}
    .br-axis{fill:none;stroke:var(--fig-ink);stroke-width:1.4}
  </style>
<text x="10" y="34" class="br-ttl">(가) 일시적인 변화 → 회복</text>
