<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-ochem-1-q-acac-resonance d-ochem-1-q-acac-resonance">
  <title id="t-ochem-1-q-acac-resonance">그림 유기화학 1-25 문제 18 펜테인-2,4-다이온 짝염기의 공명</title>
  <desc id="d-ochem-1-q-acac-resonance">가운데 탄소 음이온형에서 C⁻의 전자쌍 → 왼쪽 C–C 결합 자리와 왼쪽 C=O π → O로 왼쪽 산소 음이온형을, 같은 방식으로 오른쪽 C–C·C=O 쪽으로 오른쪽 산소 음이온형을 만든다. 세 구조를 ↔ 로 이었다. 음전하가 동등한 두 O에 있는 양쪽 구조가 주된 기여 구조이다. 아래 혼성체에서 π 전자는 O–C–C–C–O에 걸쳐 퍼지고(점선) 두 O가 δ−를 띤다.</desc>
