<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-uchem-6-phase-diagrams d-uchem-6-phase-diagrams">
  <title id="t-uchem-6-phase-diagrams">그림 일반화학 6-2 물과 이산화 탄소의 상평형 그림</title>
  <desc id="d-uchem-6-phase-diagrams">두 물질의 상평형 그림을 나란히 놓은 모식도(축 눈금은 실제 비율이 아니다). 물은 고체–액체 경계선이 왼쪽으로 기울어 압력을 높이면 녹는점이 내려가고, 1 atm 선이 삼중점(0.006 atm)보다 위에 있어 얼음 → 물 → 수증기로 변한다. 이산화 탄소는 경계선이 오른쪽으로 기울고, 삼중점(5.11 atm)이 1 atm보다 높아 1 atm에서는 고체가 −78.5 °C에서 곧바로 승화한다.</desc>
  <style>
    .uchem-6-pd-ax{stroke:var(--fig-ink);stroke-width:1.2;fill:none}
    .uchem-6-pd-bd{stroke:var(--fig-ink);stroke-width:2.2;fill:none}
    .uchem-6-pd-one{stroke:var(--fig-red);stroke-width:1.2;fill:none;stroke-dasharray:5 4}
    .uchem-6-pd-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-6-pd-h{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .uchem-6-pd-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-6-pd-r{font-size:12px;fill:var(--fig-red)}
    .uchem-6-pd-pt{fill:var(--fig-ink)}
  </style>
  <text x="205.0" y="34" text-anchor="middle" class="uchem-6-pd-h">물 (H₂O)</text>
  <path d="M70 52 L70 320 L348 320" class="uchem-6-pd-ax"/>
  <path d="M70 46 l-5 9 l10 0 z M354 320 l-9 -5 l0 10 z" class="uchem-6-pd-pt"/>
  <text x="205.0" y="360" text-anchor="middle" class="uchem-6-pd-s">온도 →</text>
  <text x="54" y="190.0" text-anchor="middle" transform="rotate(-90 54 190.0)" class="uchem-6-pd-s">압력 →</text>
  <path d="M80 314 Q 130 300, 165 250" class="uchem-6-pd-bd"/>
  <path d="M165 250 Q 260 220, 310 100" class="uchem-6-pd-bd"/>
  <path d="M165 250 L151 64" class="uchem-6-pd-bd"/>
  <line x1="70" y1="200" x2="340" y2="200" class="uchem-6-pd-one"/>
  <text x="340" y="194" text-anchor="end" class="uchem-6-pd-r">1 atm</text>
  <circle cx="161.2" cy="200" r="4" style="fill:var(--fig-red)"/>
  <line x1="161.2" y1="200" x2="161.2" y2="320" style="stroke:var(--fig-red);stroke-width:1;stroke-dasharray:2 3;fill:none"/>
  <text x="161.2" y="338" text-anchor="middle" class="uchem-6-pd-r">0 °C</text>
  <circle cx="246.3" cy="200" r="4" style="fill:var(--fig-red)"/>
  <line x1="246.3" y1="200" x2="246.3" y2="320" style="stroke:var(--fig-red);stroke-width:1;stroke-dasharray:2 3;fill:none"/>
  <text x="246.3" y="338" text-anchor="middle" class="uchem-6-pd-r">100 °C</text>
  <text x="104" y="130" class="uchem-6-pd-t">고체</text>
  <text x="220" y="130" class="uchem-6-pd-t">액체</text>
  <text x="295" y="310" class="uchem-6-pd-t">기체</text>
  <text x="175" y="272" class="uchem-6-pd-s">삼중점</text>
  <text x="175" y="288" class="uchem-6-pd-s">0.01 °C, 0.006 atm</text>
  <text x="110" y="62" class="uchem-6-pd-s" style="font-size:12px">왼쪽으로 기울어짐</text>
  <circle cx="165" cy="250" r="5" class="uchem-6-pd-pt"/>
  <circle cx="310" cy="100" r="5" class="uchem-6-pd-pt"/>
  <text x="306" y="70" text-anchor="middle" class="uchem-6-pd-s">임계점</text>
  <text x="306" y="87" text-anchor="middle" class="uchem-6-pd-s">374 °C, 218 atm</text>
  <text x="555.0" y="34" text-anchor="middle" class="uchem-6-pd-h">이산화 탄소 (CO₂)</text>
  <path d="M420 52 L420 320 L698 320" class="uchem-6-pd-ax"/>
  <path d="M420 46 l-5 9 l10 0 z M704 320 l-9 -5 l0 10 z" class="uchem-6-pd-pt"/>
  <text x="555.0" y="360" text-anchor="middle" class="uchem-6-pd-s">온도 →</text>
  <text x="404" y="190.0" text-anchor="middle" transform="rotate(-90 404 190.0)" class="uchem-6-pd-s">압력 →</text>
  <path d="M430 314 Q 490 280, 530 200" class="uchem-6-pd-bd"/>
  <path d="M530 200 Q 595 175, 640 100" class="uchem-6-pd-bd"/>
  <path d="M530 200 L548 64" class="uchem-6-pd-bd"/>
  <line x1="420" y1="260" x2="690" y2="260" class="uchem-6-pd-one"/>
  <text x="690" y="254" text-anchor="end" class="uchem-6-pd-r">1 atm</text>
  <circle cx="492.1" cy="260" r="4" style="fill:var(--fig-red)"/>
  <line x1="492.1" y1="260" x2="492.1" y2="320" style="stroke:var(--fig-red);stroke-width:1;stroke-dasharray:2 3;fill:none"/>
  <text x="492.1" y="338" text-anchor="middle" class="uchem-6-pd-r">−78.5 °C 승화</text>
  <text x="450" y="130" class="uchem-6-pd-t">고체</text>
  <text x="570" y="136" class="uchem-6-pd-t">액체</text>
  <text x="595" y="294" class="uchem-6-pd-t">기체</text>
  <text x="522" y="222" text-anchor="start" class="uchem-6-pd-s">삼중점</text>
  <text x="522" y="238" text-anchor="start" class="uchem-6-pd-s">−56.6 °C, 5.11 atm</text>
  <text x="556" y="62" class="uchem-6-pd-s" style="font-size:12px">오른쪽으로 기울어짐</text>
  <circle cx="530" cy="200" r="5" class="uchem-6-pd-pt"/>
  <circle cx="640" cy="100" r="5" class="uchem-6-pd-pt"/>
  <text x="636" y="70" text-anchor="middle" class="uchem-6-pd-s">임계점</text>
  <text x="636" y="87" text-anchor="middle" class="uchem-6-pd-s">31.0 °C, 73 atm</text>
  <text x="360" y="394" text-anchor="middle" class="uchem-6-pd-s">모식도: 두 축은 같은 비율이 아니며, 두 물질의 눈금도 서로 다르다</text>
</svg>
