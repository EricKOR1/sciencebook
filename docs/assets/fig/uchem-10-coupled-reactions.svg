<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-uchem-10-coupled-reactions d-uchem-10-coupled-reactions">
  <title id="t-uchem-10-coupled-reactions">그림 일반화학 10-6 짝지은 반응: ATP 가수 분해로 포도당 인산화 끌어올리기</title>
  <desc id="d-uchem-10-coupled-reactions">자유 에너지 준위 도표(37 ℃, pH 7 기준의 ΔG°′). 포도당의 인산화는 혼자서는 +13.8 kJ/mol의 오르막이고, ATP 가수 분해는 −30.5 kJ/mol의 내리막이다. 효소가 ATP의 인산기를 포도당에 직접 옮겨 두 반응을 묶으면 전체는 −16.7 kJ/mol의 내리막이 되어 평형 상수가 약 5×10⁻³에서 약 6×10²로 커진다.</desc>
  <style>.uchem-10-coupled-reactions-t{font-size:14px;fill:var(--fig-ink)} .uchem-10-coupled-reactions-s{font-size:13px;fill:var(--fig-muted)} .uchem-10-coupled-reactions-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}</style>
  <line x1="60.0" y1="11.2" x2="60.0" y2="324.4" style="stroke:var(--fig-muted);stroke-width:1.6;stroke-linecap:round"/>
  <polygon points="60.0,5.2 63.6,13.2 56.4,13.2" style="fill:var(--fig-muted);stroke:none;stroke-width:1;stroke-linejoin:round"/>
  <text x="66.0" y="9.2" class="uchem-10-coupled-reactions-t" style="font-style:italic">G</text>
  <line x1="56.0" y1="130.0" x2="700.0" y2="130.0" style="stroke:var(--fig-line);stroke-width:1;stroke-linecap:round;stroke-dasharray:4 4"/>
  <text x="52.0" y="135.0" text-anchor="end" class="uchem-10-coupled-reactions-s">0</text>
  <text x="185.0" y="30.0" text-anchor="middle" class="uchem-10-coupled-reactions-b">① 포도당 인산화(혼자)</text>
  <line x1="90.0" y1="130.0" x2="160.0" y2="130.0" style="stroke:var(--fig-ink);stroke-width:3.5;stroke-linecap:round"/>
  <line x1="210.0" y1="55.5" x2="280.0" y2="55.5" style="stroke:var(--fig-red);stroke-width:3.5;stroke-linecap:round"/>
  <line x1="160.0" y1="130.0" x2="210.0" y2="55.5" style="stroke:var(--fig-muted);stroke-width:1.2;stroke-linecap:round;stroke-dasharray:3 4"/>
  <line x1="185.0" y1="130.0" x2="185.0" y2="65.5" style="stroke:var(--fig-red);stroke-width:2.4;stroke-linecap:round"/>
  <polygon points="185.0,58.5 188.6,66.5 181.4,66.5" style="fill:var(--fig-red);stroke:none;stroke-width:1;stroke-linejoin:round"/>
  <text x="191.0" y="97.7" class="uchem-10-coupled-reactions-t" style="fill:var(--fig-red);font-weight:600">+13.8 kJ/mol</text>
  <text x="125.0" y="150.0" text-anchor="middle" class="uchem-10-coupled-reactions-s" style="fill:var(--fig-ink)">포도당 + Pᵢ</text>
  <text x="245.0" y="45.5" text-anchor="middle" class="uchem-10-coupled-reactions-s" style="fill:var(--fig-ink)">포도당-6-인산 + H₂O</text>
  <text x="185.0" y="360.0" text-anchor="middle" class="uchem-10-coupled-reactions-t" style="fill:var(--fig-red)">K ≈ 5×10⁻³</text>
  <text x="395.0" y="30.0" text-anchor="middle" class="uchem-10-coupled-reactions-b">② ATP 가수 분해</text>
  <line x1="300.0" y1="130.0" x2="370.0" y2="130.0" style="stroke:var(--fig-ink);stroke-width:3.5;stroke-linecap:round"/>
  <line x1="420.0" y1="294.7" x2="490.0" y2="294.7" style="stroke:var(--fig-green);stroke-width:3.5;stroke-linecap:round"/>
  <line x1="370.0" y1="130.0" x2="420.0" y2="294.7" style="stroke:var(--fig-muted);stroke-width:1.2;stroke-linecap:round;stroke-dasharray:3 4"/>
  <line x1="395.0" y1="130.0" x2="395.0" y2="284.7" style="stroke:var(--fig-green);stroke-width:2.4;stroke-linecap:round"/>
  <polygon points="395.0,291.7 391.4,283.7 398.6,283.7" style="fill:var(--fig-green);stroke:none;stroke-width:1;stroke-linejoin:round"/>
  <text x="401.0" y="217.4" class="uchem-10-coupled-reactions-t" style="fill:var(--fig-green);font-weight:600">−30.5 kJ/mol</text>
  <text x="335.0" y="120.0" text-anchor="middle" class="uchem-10-coupled-reactions-s" style="fill:var(--fig-ink)">ATP + H₂O</text>
  <text x="455.0" y="314.7" text-anchor="middle" class="uchem-10-coupled-reactions-s" style="fill:var(--fig-ink)">ADP + Pᵢ</text>
  <text x="605.0" y="30.0" text-anchor="middle" class="uchem-10-coupled-reactions-b">③ 짝지은 반응 = ① + ②</text>
  <line x1="510.0" y1="130.0" x2="580.0" y2="130.0" style="stroke:var(--fig-ink);stroke-width:3.5;stroke-linecap:round"/>
  <line x1="630.0" y1="220.2" x2="700.0" y2="220.2" style="stroke:var(--fig-blue);stroke-width:3.5;stroke-linecap:round"/>
  <line x1="580.0" y1="130.0" x2="630.0" y2="220.2" style="stroke:var(--fig-muted);stroke-width:1.2;stroke-linecap:round;stroke-dasharray:3 4"/>
  <line x1="605.0" y1="130.0" x2="605.0" y2="210.2" style="stroke:var(--fig-blue);stroke-width:2.4;stroke-linecap:round"/>
  <polygon points="605.0,217.2 601.4,209.2 608.6,209.2" style="fill:var(--fig-blue);stroke:none;stroke-width:1;stroke-linejoin:round"/>
  <text x="611.0" y="180.1" class="uchem-10-coupled-reactions-t" style="fill:var(--fig-blue);font-weight:600">−16.7 kJ/mol</text>
  <text x="545.0" y="120.0" text-anchor="middle" class="uchem-10-coupled-reactions-s" style="fill:var(--fig-ink)">포도당 + ATP</text>
  <text x="665.0" y="240.2" text-anchor="middle" class="uchem-10-coupled-reactions-s" style="fill:var(--fig-ink)">포도당-6-인산 + ADP</text>
  <text x="605.0" y="360.0" text-anchor="middle" class="uchem-10-coupled-reactions-t" style="fill:var(--fig-blue)">K ≈ 6×10²</text>
  <text x="405.0" y="330.0" text-anchor="middle" class="uchem-10-coupled-reactions-s">효소(헥소키네이스)가 인산기를 직접 옮겨야 실제로 짝지어진다</text>
  <text x="20.0" y="360.0" class="uchem-10-coupled-reactions-s">평형 상수</text>
</svg>
