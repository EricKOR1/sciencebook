<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-m3-05-q-knee-reflex d-m3-05-q-knee-reflex">
  <title id="t-m3-05-q-knee-reflex">그림 중3-5-13 문제 13의 무릎 반사와 관련된 신경</title>
  <desc id="d-m3-05-q-knee-reflex">의자에 앉은 사람의 무릎 아래를 칠 때, 무릎에서 척수로 가는 감각 신경, 척수에서 허벅지 근육으로 가는 운동 신경, 척수에서 대뇌로 신호가 올라가는 길을 나타낸 모식도이다.</desc>
  <style>.m3-05-q-knee-reflex-lbl{font-size:15px;fill:var(--fig-ink)} .m3-05-q-knee-reflex-sm{font-size:13px;fill:var(--fig-muted)} .m3-05-q-knee-reflex-ink{fill:var(--fig-ink)} .m3-05-q-knee-reflex-b{font-size:15px;fill:var(--fig-ink);font-weight:600} </style>
  <rect x="40" y="20" width="120" height="44" rx="12" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2"/>
  <text x="100.0" y="48.0" text-anchor="middle" class="m3-05-q-knee-reflex-lbl">대뇌</text>
  <ellipse cx="100" cy="226" rx="46" ry="36" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:2"/>
  <path d="M76 208 Q100 226 76 244 M124 208 Q100 226 124 244" style="fill:none;stroke:var(--fig-teal);stroke-width:1.5"/>
  <text x="100.0" y="284.0" text-anchor="middle" class="m3-05-q-knee-reflex-lbl">척수</text>
  <line x1="100.0" y1="190.0" x2="100.0" y2="79.0" style="stroke:var(--fig-violet);stroke-width:2.5"/>
  <path d="M100.0 68.0 L106.0 79.0 L94.0 79.0 Z" style="fill:var(--fig-violet)"/>
  <text x="112.0" y="106.0" class="m3-05-q-knee-reflex-sm">척수에서 대뇌로 신호가</text>
  <text x="112.0" y="124.0" class="m3-05-q-knee-reflex-sm">올라가는 길</text>
  <path d="M200 196 L480 196 Q522 196 522 238 L522 360 L478 360 L478 246 L200 246 Z" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <path d="M230 198 Q350 182 466 198 L466 212 Q350 222 230 212 Z" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5"/>
  <line x1="420.0" y1="196.0" x2="440.0" y2="170.0" style="stroke:var(--fig-muted);stroke-width:1"/>
  <text x="444.0" y="166.0" class="m3-05-q-knee-reflex-sm">허벅지 근육</text>
  <ellipse cx="518" cy="222" rx="9" ry="14" style="fill:var(--fig-panel);stroke:var(--fig-amber);stroke-width:1.5"/>
  <text x="540.0" y="214.0" class="m3-05-q-knee-reflex-sm">무릎뼈</text>
  <line x1="610.0" y1="318.0" x2="540.0" y2="266.0" style="stroke:var(--fig-ink);stroke-width:4"/>
  <rect x="524" y="252" width="26" height="14" rx="3" transform="rotate(37 537 259)" style="fill:var(--fig-ink)"/>
  <text x="618.0" y="338.0" text-anchor="middle" class="m3-05-q-knee-reflex-sm">무릎 아래를 침</text>
  <path d="M520 260 C 492 262, 470 238, 430 236 L 230 236 C 190 236, 165 236, 144 234" style="fill:none;stroke:var(--fig-blue);stroke-width:2.5"/>
  <text x="330.0" y="274.0" text-anchor="middle" class="m3-05-q-knee-reflex-lbl">감각 신경</text>
  <path d="M142 212 C 175 196, 220 186, 300 204" style="fill:none;stroke:var(--fig-green);stroke-width:2.5"/>
  <text x="196.0" y="176.0" text-anchor="middle" class="m3-05-q-knee-reflex-lbl">운동 신경</text>
  <text x="20.0" y="368.0" class="m3-05-q-knee-reflex-sm">모식도(신경의 실제 위치와 길이는 다르다)</text>
