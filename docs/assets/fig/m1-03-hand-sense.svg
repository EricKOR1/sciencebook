<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-m1-03-hand-sense d-m1-03-hand-sense">
<title id="t-m1-03-hand-sense">그림 중1-3-2 손으로 느끼는 온도는 믿을 수 있을까?</title>
<desc id="d-m1-03-hand-sense">한 손은 찬물, 다른 손은 따뜻한 물에 1분 동안 담갔다가 두 손을 함께 미지근한 물에 넣으면, 찬물에 있던 손은 따뜻하다고, 따뜻한 물에 있던 손은 차갑다고 느낀다. 같은 물인데 느낌이 다르므로 정확한 온도는 온도계로 잰다. 모식도.</desc>
