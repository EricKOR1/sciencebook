<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-m1-03-heat-transfer d-m1-03-heat-transfer">
<title id="t-m1-03-heat-transfer">그림 중1-3-5 열이 이동하는 세 가지 방법 — 전도·대류·복사</title>
<desc id="d-m1-03-heat-transfer">전도는 고체에서 이웃한 입자에 진동이 차례로 전달되고, 대류는 액체·기체에서 데워진 물질이 직접 이동하며 순환하고, 복사는 물질 없이 열이 직접 전달된다. 모식도.</desc>
