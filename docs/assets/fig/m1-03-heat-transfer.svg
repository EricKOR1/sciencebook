<text x="20" y="276" class="m103h-ink">이웃한 입자에 진동이 차례로</text><text x="20" y="296" class="m103h-ink">전달된다(입자는 제자리).</text><text x="20" y="320" class="m103h-sm">예: 프라이팬 손잡이가 뜨거워진다</text>
