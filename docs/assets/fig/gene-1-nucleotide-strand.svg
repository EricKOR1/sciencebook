<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" role="img" aria-labelledby="t-gene-1-nucleotide-strand d-gene-1-nucleotide-strand">
  <title id="t-gene-1-nucleotide-strand">그림 생물의 유전 1-1 뉴클레오타이드의 구조와 역평행 이중 가닥</title>
  <desc id="d-gene-1-nucleotide-strand">왼쪽은 뉴클레오타이드 하나로, 당(디옥시리보스)의 탄소에 1′~5′ 번호를 붙이면 염기는 1′ 탄소에, 인산은 5′ 탄소에 붙고 3′ 탄소에는 -OH가 있다. 오른쪽은 이중 가닥의 일부로, 바깥쪽은 당–인산 골격, 안쪽은 염기쌍이다. A–T는 수소 결합 2개, G–C는 3개이고, 고리 2개인 퓨린(A, G)과 고리 1개인 피리미딘(T, C)이 짝지어 폭이 일정하다. 두 가닥의 5′→3′ 방향은 서로 반대(역평행)이다. 모식도이다.</desc>
