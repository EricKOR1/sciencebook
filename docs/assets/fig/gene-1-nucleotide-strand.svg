    .gene-1-nucleotide-strand-ink{fill:var(--fig-ink)}
    .gene-1-nucleotide-strand-paper{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}
    .gene-1-nucleotide-strand-gray{fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1.5}
    .gene-1-nucleotide-strand-b-blue{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2}
