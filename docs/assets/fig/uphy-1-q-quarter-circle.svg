  <title id="t-uphy-1-q-quarter-circle">그림 일반물리학 1-12 문제 15 해설: 1/4바퀴 동안의 평균 속도와 평균 가속도</title>
  <desc id="d-uphy-1-q-quarter-circle">왼쪽: 반지름 5.0 m인 원의 1/4바퀴에서 변위(현)는 7.07 m, 이동 거리(호)는 7.85 m이다. 속도 v(0) = 7.85 m/s 북쪽, v(1.0 s) = 7.85 m/s 서쪽이다. 오른쪽: 두 속도를 꼬리끼리 맞추면 차 Δv의 크기는 11.1 m/s로, 평균 가속도 11.1 m/s²는 구심 가속도 12.3 m/s²보다 작다. 속도 화살표는 크기에 비례한다.</desc>
