  <desc id="d-ubio-3-q-lineweaver">문제 12의 자료를 1/v와 1/[S]로 다시 그렸다. 두 직선은 세로축의 같은 점(1/Vmax = 1/120)에서 만나고, 가로축 절편(−1/Km)은 저해제가 없을 때 −1/3, Z가 있을 때 −1/9이다. Vmax는 그대로이고 겉보기 Km만 3배가 되었으므로 경쟁적 저해이다.</desc>
