  <title id="t-ochem-3-q-problem17-aldopentoses">그림 유기화학 3-24 문제 17의 네 D-알도펜토스</title>
  <desc id="d-ochem-3-q-problem17-aldopentoses">위: D-리보스, D-아라비노스, D-자일로스, D-릭소스의 피셔 투영식(위 CHO, 아래 CH₂OH, 교점은 C2·C3·C4). 아래: 묽은 질산으로 산화한 생성물을 채워 넣을 빈 피셔 투영식 틀(위아래 COOH).</desc>
