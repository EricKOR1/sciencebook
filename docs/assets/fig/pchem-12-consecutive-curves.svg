<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-pchem-12-consecutive-curves d-pchem-12-consecutive-curves">
  <title id="t-pchem-12-consecutive-curves">그림 물리화학 12-4 연속 반응 A → I → P의 농도–시간 곡선</title>
  <desc id="d-pchem-12-consecutive-curves">k₁ = 0.20 min⁻¹, k₂ = 0.050 min⁻¹, [A]₀ = 1일 때 정확한 해. [A] = e^(−0.20t)는 지수적으로 줄고, [I] = (4/3)(e^(−0.050t) − e^(−0.20t))는 t = 9.24 min에서 최댓값 0.630에 이른 뒤 천천히 줄며, [P]는 기울기 0에서 출발하는 S자 곡선(유도기)이다. 세 농도의 합은 언제나 [A]₀이다.</desc>
