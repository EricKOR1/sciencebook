<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" class="fig-small" role="img" aria-labelledby="t-phy-1-q-ballistic-pendulum d-phy-1-q-ballistic-pendulum">
  <title id="t-phy-1-q-ballistic-pendulum">그림 물리학 1-16 문제 13의 나무 도막과 찰흙 공</title>
  <desc id="d-phy-1-q-ballistic-pendulum">실에 매달려 정지해 있는 질량 0.9 kg인 나무 도막에 질량 0.1 kg인 찰흙 공이 수평으로 10 m/s로 날아와 박힌다. 점선은 그 뒤 도막이 처음 위치보다 높이 h만큼 올라간 모습으로, 높이는 과장해 그렸다.</desc>
