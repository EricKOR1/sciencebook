  <title id="t-pchem-12-stern-volmer">그림 물리화학 12-9 슈테른–폴머 도시</title>
  <desc id="d-pchem-12-stern-volmer">예제 10의 점 (0, 1.00), (0.010, 1.40), (0.020, 1.80), (0.040, 2.60)이 직선 I₀/I = 1 + 40[Q] 위에 놓인다. 세로 절편은 1, 기울기는 K_SV = kq τ₀ = 40 M⁻¹이다. 오른쪽 도식은 들뜬 분자 A*가 사라지는 세 경로(형광 k_f, 비복사 소멸 k_nr, 소광 k_q[Q])이다.</desc>
