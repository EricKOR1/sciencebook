  <title id="t-umath-3-two-paths">그림 수학 도구 3-8 같은 두 점을 잇는 두 경로와 F₂ = (y, −x)의 일</title>
  <desc id="d-umath-3-two-paths">원점 O에서 P(1, 1)까지 경로 A(O → (1, 0) → P)와 경로 B(직선 y = x). 배경 화살표는 시계 방향으로 도는 벡터장 F₂ = (y, −x)이다. F₂가 한 일은 경로 A에서 −1, 경로 B에서 0으로 경로에 따라 다르다.</desc>
