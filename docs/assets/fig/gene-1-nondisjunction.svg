  <text x="185" y="415" text-anchor="middle" class="gene-1-nondisjunction-tx">생식세포 4개 모두 비정상</text>
  <text x="185" y="433" text-anchor="middle" class="gene-1-nondisjunction-sm">n+1에 서로 다른 상동 염색체(파랑+빨강)</text>
