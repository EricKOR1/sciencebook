    .gene-1-nondisjunction-h{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .gene-1-nondisjunction-tx{font-size:14px;fill:var(--fig-ink)}
    .gene-1-nondisjunction-sm{font-size:13px;fill:var(--fig-muted)}
    .gene-1-nondisjunction-bad{font-size:14px;font-weight:600;fill:var(--fig-red)}
    .gene-1-nondisjunction-ok{font-size:14px;font-weight:600;fill:var(--fig-green)}
    .gene-1-nondisjunction-cell{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:2}
    .gene-1-nondisjunction-nd{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2.5}
    .gene-1-nondisjunction-b{fill:var(--fig-blue);stroke:var(--fig-ink);stroke-width:1}
    .gene-1-nondisjunction-r{fill:var(--fig-red);stroke:var(--fig-ink);stroke-width:1}
    .gene-1-nondisjunction-cen{fill:var(--fig-ink)}
    .gene-1-nondisjunction-ar{fill:none;stroke:var(--fig-muted);stroke-width:1.6}
    .gene-1-nondisjunction-ah{fill:var(--fig-muted)}
    .gene-1-nondisjunction-pan{fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1}
  </style>
