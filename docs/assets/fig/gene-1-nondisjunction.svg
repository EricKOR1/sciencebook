<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="t-gene-1-nondisjunction d-gene-1-nondisjunction">
  <title id="t-gene-1-nondisjunction">그림 생물의 유전 1-4 감수 1분열 비분리와 감수 2분열 비분리</title>
  <desc id="d-gene-1-nondisjunction">한 쌍의 상동 염색체만 나타낸 모식도이다. 감수 1분열에서 상동 염색체가 갈라지지 않으면 생식세포 4개가 모두 비정상(n+1 2개, n−1 2개)이 되고, 감수 2분열에서 한 세포의 염색 분체가 갈라지지 않으면 4개 중 2개만 비정상(n+1 1개, n−1 1개)이 된다.</desc>
