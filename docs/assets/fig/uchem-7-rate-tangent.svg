  <title id="t-uchem-7-rate-tangent">그림 일반화학 7-1 평균 속도(할선)와 순간 속도(접선)</title>
  <desc id="d-uchem-7-rate-tangent">예제 2의 자료(점)와 1차 반응 곡선 [A] = 0.800e^(−0.01155t)이다. 0~60 s의 평균 속도는 할선의 기울기, 60 s의 순간 속도는 접선의 기울기, 초기 속도는 t = 0에서 그은 접선의 기울기이다. 반응물이 줄수록 접선이 완만해져 속도가 작아진다.</desc>
