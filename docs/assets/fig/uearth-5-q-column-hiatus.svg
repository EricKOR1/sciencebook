<desc id="d-uearth-5-q-column-hiatus">아래에서 위로 응회암 A(250.0 Ma), 셰일 40 m, 응회암 B(248.0 Ma), 사암 20 m가 있고, 울퉁불퉁한 침식면 위에 석회암이 놓인다. 석회암 속 침식면에서 5 m 위에 응회암 C(200.0 Ma)가 있다. 응회암층의 두께는 과장했다.</desc>
