<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" class="fig-small" role="img" aria-labelledby="t-phy-1-q-ramp-spring d-phy-1-q-ramp-spring">
  <title id="t-phy-1-q-ramp-spring">그림 물리학 1-13 문제 8의 곡면과 용수철</title>
  <desc id="d-phy-1-q-ramp-spring">마찰이 없는 곡면의 높이 0.8 m인 곳에 질량 0.5 kg인 물체를 가만히 놓으면, 물체는 곡면을 따라 내려와 수평면 끝의 벽에 고정된 용수철(용수철 상수 200 N/m)을 압축한다.</desc>
