<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="t-ubio-13-lake d-ubio-13-lake">
  <title id="t-ubio-13-lake">그림 일반생명과학 13-4 여름철 온대 호수의 층 구조와 수온 분포</title>
  <desc id="d-ubio-13-lake">왼쪽: 여름의 온대 호수 단면. 따뜻한 표층과 차가운 심층 사이에 수온이 급히 변하는 수온 약층이 생겨 물이 위아래로 섞이지 않는다. 빛이 광합성에 충분한 유광층 아래는 무광층이며, 얕은 가장자리에는 뿌리 내린 수생 식물이 산다. 오른쪽: 깊이에 따른 수온. 여름(실선)에는 성층, 봄·가을(점선)에는 위아래 수온이 비슷해져 바람에 물 전체가 섞인다(전도). 모식도이다.</desc>
