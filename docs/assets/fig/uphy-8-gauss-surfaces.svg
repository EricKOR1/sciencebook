<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-uphy-8-gauss-surfaces d-uphy-8-gauss-surfaces">
  <title id="t-uphy-8-gauss-surfaces">그림 일반물리학 8-2 대칭에 맞춘 세 가지 가우스 곡면</title>
  <desc id="d-uphy-8-gauss-surfaces">(가) 구 대칭: 같은 중심의 구면 위에서 E는 크기가 같고 바깥쪽 수직이다. (나) 원통 대칭: 무한 직선 전하를 감싼 원통에서 선속은 옆면으로만 나가고 두 밑면은 E와 나란해 선속이 0이다. (다) 평면 대칭: 평면을 관통하는 원통의 두 밑면으로만 선속이 나간다. 곡면 위에서 E가 일정하므로 E를 적분 밖으로 꺼낼 수 있다.</desc>
  <style>.uphy-8-gauss-surfaces-t{font-size:14px;fill:var(--fig-ink)} .uphy-8-gauss-surfaces-b{font-size:14px;fill:var(--fig-ink);font-weight:700} .uphy-8-gauss-surfaces-s{font-size:13px;fill:var(--fig-muted)} .uphy-8-gauss-surfaces-g{fill:var(--fig-soft-teal);fill-opacity:0.45;stroke:var(--fig-teal);stroke-width:2;stroke-dasharray:6 4} .uphy-8-gauss-surfaces-gl{fill:none;stroke:var(--fig-teal);stroke-width:2;stroke-dasharray:6 4}</style>
