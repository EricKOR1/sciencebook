  <text x="420" y="96" text-anchor="start" class="uphy-8-gauss-surfaces-t">h</text>
  <text x="360" y="276" text-anchor="middle" class="uphy-8-gauss-surfaces-s">옆면으로만 선속, 밑면은 0</text>
  <text x="360" y="304" text-anchor="middle" class="uphy-8-gauss-surfaces-t">E · 2πrh = λh / ε₀</text>
