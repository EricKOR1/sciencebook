  <text x="122" y="276" text-anchor="middle" class="uphy-8-gauss-surfaces-s">E ∥ dA, 곡면 위에서 E 일정</text>
  <text x="122" y="304" text-anchor="middle" class="uphy-8-gauss-surfaces-t">E · 4πr² = q<tspan style="baseline-shift:sub;font-size:11px">안</tspan> / ε₀</text>
  <text x="122" y="330" text-anchor="middle" class="uphy-8-gauss-surfaces-t" style="fill:var(--fig-accent);font-weight:700">E = kQ / r²  (r ≥ R)</text>
  <text x="122" y="354" text-anchor="middle" class="uphy-8-gauss-surfaces-s">균일한 구 안: E = kQr/R³</text>
