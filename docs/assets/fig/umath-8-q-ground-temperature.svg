    .u8gt-l3{font-size:13px;fill:var(--fig-green);font-weight:600}
    .u8gt-env{stroke:var(--fig-ink);stroke-width:1.4;stroke-dasharray:5 4;fill:none}
    .u8gt-hz{stroke:var(--fig-violet);stroke-width:1.4;stroke-dasharray:3 3;fill:none}
    .u8gt-v{font-size:13px;fill:var(--fig-violet);font-weight:600}
    .u8gt-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1}

