    .u8gt-b{font-size:14px;fill:var(--fig-ink);font-weight:600}
    .u8gt-tk{stroke:var(--fig-ink);stroke-width:1.2}
    .u8gt-c0{stroke:var(--fig-red);stroke-width:2.4;fill:none}
    .u8gt-l0{font-size:13px;fill:var(--fig-red);font-weight:600}
    .u8gt-c1{stroke:var(--fig-amber);stroke-width:2.4;fill:none}
    .u8gt-l1{font-size:13px;fill:var(--fig-amber);font-weight:600}
    .u8gt-c2{stroke:var(--fig-blue);stroke-width:2.4;fill:none}
    .u8gt-l2{font-size:13px;fill:var(--fig-blue);font-weight:600}
