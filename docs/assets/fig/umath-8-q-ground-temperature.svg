<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-umath-8-q-ground-temperature d-umath-8-q-ground-temperature">
  <title id="t-umath-8-q-ground-temperature">그림 수학 도구 8-12 문제 10 해설: 깊이에 따른 땅속 온도 변화</title>
  <desc id="d-umath-8-q-ground-temperature">1년 중 네 시점(ωt = 0, π/2, π, 3π/2)에 u(z, t) = A e^(−z/d) cos(ωt − z/d)를 깊이 z에 따라 그렸다(d = 3.2 m). 점선은 진폭의 포락선 ±e^(−z/d)이고, z = 9.5 m에서 진폭이 지표의 5 %로 줄어든다. 그 깊이에서는 곡선의 위상이 지표보다 약 반 주기 늦다.</desc>
  <style>
