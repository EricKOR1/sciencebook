<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-ochem-5-ez-assignment d-ochem-5-ez-assignment">
  <title id="t-ochem-5-ez-assignment">그림 유기화학 5-1 E/Z 판정: 이중 결합의 각 탄소에서 CIP 순위를 매긴다</title>
  <desc id="d-ochem-5-ez-assignment">세 칸에 (가) (E)-3-메틸펜트-2-엔, (나) (E)-2-클로로뷰트-2-엔, (다) (Z)-1-클로로-2,3-다이메틸펜트-2-엔을 그렸다. 이중 결합의 양쪽 탄소마다 두 치환기에 CIP 순위 ①, ②를 매기고, 두 ①을 잇는 점선이 이중 결합 축(회색 점선)을 가로지르면 E, 같은 쪽에 있으면 Z이다. (나)에서 두 메틸기는 같은 쪽에 있어 탄화수소 사슬로 보면 시스처럼 보이지만, C2에서 Cl이 CH₃보다 순위가 높으므로 E이다.</desc>
