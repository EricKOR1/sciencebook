    .f2-4-q-cacl2-migration-lbl{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .f2-4-q-cacl2-migration-w{fill:none;stroke:var(--fig-ink);stroke-width:2} .f2-4-q-cacl2-migration-el{fill:var(--fig-muted)}
    .f2-4-q-cacl2-migration-water{fill:var(--fig-soft-blue)} .f2-4-q-cacl2-migration-bk{fill:none;stroke:var(--fig-line);stroke-width:2.5}
    .f2-4-q-cacl2-migration-pos{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.6} .f2-4-q-cacl2-migration-neg{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.6}
    .f2-4-q-cacl2-migration-pt{font-size:13px;font-weight:700;fill:var(--fig-red)} .f2-4-q-cacl2-migration-nt{font-size:13px;font-weight:700;fill:var(--fig-green)}
    .f2-4-q-cacl2-migration-ar-r{stroke:var(--fig-red);stroke-width:2;fill:none} .f2-4-q-cacl2-migration-ah-r{fill:var(--fig-red)}
    .f2-4-q-cacl2-migration-ar-g{stroke:var(--fig-green);stroke-width:2;fill:none} .f2-4-q-cacl2-migration-ah-g{fill:var(--fig-green)}
