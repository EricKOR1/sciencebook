  <title id="t-2-4-q-cacl2-migration">그림 2-4-9 문제 12 염화 칼슘 수용액 속 이온의 이동</title>
  <desc id="d-2-4-q-cacl2-migration">염화 칼슘 수용액에는 Ca²⁺과 Cl⁻이 1 : 2의 개수 비로 들어 있다(그림에서는 3개와 6개). 전원을 연결하면 Ca²⁺은 (−)극 쪽으로, Cl⁻은 (+)극 쪽으로 이동한다. 물 분자는 생략하고 입자를 크게 확대한 모식도이다.</desc>
