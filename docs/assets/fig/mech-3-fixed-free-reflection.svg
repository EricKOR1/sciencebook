  <title id="t-mech-3-fixed-free-reflection">그림 역학과 에너지 3-5 고정단 반사와 자유단 반사</title>
  <desc id="d-mech-3-fixed-free-reflection">줄의 끝이 벽에 묶인 고정단에서는 마루로 들어간 펄스가 골로 뒤집혀 돌아오고, 끝이 막대를 따라 자유롭게 움직이는 자유단에서는 마루가 마루 그대로 돌아온다.</desc>
