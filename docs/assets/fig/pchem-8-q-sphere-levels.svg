<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-pchem-8-q-sphere-levels d-pchem-8-q-sphere-levels">
  <title id="t-pchem-8-q-sphere-levels">그림 물리화학 8-16 문제 19 풀이: 구 위의 자유 전자 모형의 준위 채우기</title>
  <desc id="d-pchem-8-q-sphere-levels">C₆₀의 π 전자 60개를 구 위의 자유 전자로 본 준위 E = l(l + 1)(ħ²/2mR²). l = 0~6의 높이는 0, 2, 6, 12, 20, 30, 42이고 각 준위의 자리는 2(2l + 1) = 2, 6, 10, 14, 18, 22, 26개, 누적 2, 8, 18, 32, 50, 72개이다. l = 0~4가 가득(50개) 차고 l = 5는 22자리 중 10자리만 찬다. l = 5 → 6 들뜸은 ΔE = 12ħ²/2mR² = 3.63 eV.</desc>
