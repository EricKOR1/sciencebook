<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-m3-05-skin d-m3-05-skin">
  <title id="t-m3-05-skin">그림 중3-5-6 피부의 감각점과 분포</title>
  <desc id="d-m3-05-skin">왼쪽은 피부 단면 모식도로, 피부 속 여러 깊이에 통점, 촉점, 냉점, 온점, 압점이 있고 각 감각점의 신호는 감각 신경을 따라 척수를 거쳐 대뇌로 간다. 오른쪽은 같은 간격의 두 점으로 손끝과 등을 누른 모습으로, 감각점이 촘촘한 손끝은 두 점으로, 듬성한 등은 한 점으로 느낀다.</desc>
