<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-pchem-2-q-reservoir-series d-pchem-2-q-reservoir-series">
  <title id="t-pchem-2-q-reservoir-series">그림 물리화학 2-21 문제 19의 열원 줄</title>
  <desc id="d-pchem-2-q-reservoir-series">300 K의 물이 든 비커를 305 K, 310 K, …, 350 K인 열원 10개에 차례로 닿게 하여 350 K까지 데운다. i번째 열원의 온도는 Ti = 300 + 5i K이다. 아래는 열원이 하나(350 K)인 경우와 둘(325 K, 350 K)인 경우이다.</desc>
