<title id="t-m1-03-thermos">그림 중1-3-5 보온병의 구조와 단열</title>
<desc id="d-m1-03-thermos">보온병은 마개로 공기의 출입(대류)을 막고, 두 겹 벽 사이의 진공으로 전도와 대류를 막으며, 벽의 은색 면으로 복사를 반사한다. 단면 모식도.</desc>
