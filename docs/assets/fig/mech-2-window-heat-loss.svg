<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-mech-2-window-heat-loss d-mech-2-window-heat-loss">
  <title id="t-mech-2-window-heat-loss">그림 역학과 에너지 2-5 겨울철 창문을 통한 열손실 — 전도·대류·복사(모식도)</title>
  <desc id="d-mech-2-window-heat-loss">실내의 따뜻한 공기는 차가운 유리에 열을 주고 식어 내려가는 대류를 일으키고, 열은 유리 속을 전도로 지나며, 바깥쪽 유리 표면의 열은 바깥 공기의 대류로 빠져나간다. 따뜻한 실내 물체가 내는 적외선 복사의 일부도 유리를 통해 열을 잃게 한다. 이중창은 유리 사이에 대류가 거의 없는 얇은 기체층을 두어 전도와 대류를 함께 줄인다.</desc>
