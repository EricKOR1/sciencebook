<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" class="fig-small" role="img" aria-labelledby="t-pchem-6-copper-latimer d-pchem-6-copper-latimer">
  <title id="t-pchem-6-copper-latimer">그림 물리화학 6-7 구리의 라티머 도표(산성 용액, 25 ℃)</title>
  <desc id="d-pchem-6-copper-latimer">Cu²⁺ → Cu⁺(+0.153 V, 전자 1개), Cu⁺ → Cu(+0.521 V, 전자 1개), Cu²⁺ → Cu(전자 2개)의 전위는 두 값의 합이 아니라 νE°의 가중 평균 (0.153 + 0.521)/2 = +0.337 V이다. Cu⁺의 오른쪽 전위가 왼쪽 전위보다 크므로 Cu⁺는 불균등화한다.</desc>
  <style>.pchem-6-copper-latimer-lbl{font-size:14px;fill:var(--fig-ink)} .pchem-6-copper-latimer-sm{font-size:13px;fill:var(--fig-muted)} .pchem-6-copper-latimer-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .pchem-6-copper-latimer-tk{font-size:13px;fill:var(--fig-muted)} .pchem-6-copper-latimer-ax{font-size:14px;fill:var(--fig-ink)} .pchem-6-copper-latimer-red{font-size:14px;fill:var(--fig-red)} .pchem-6-copper-latimer-blue{font-size:14px;fill:var(--fig-blue)} .pchem-6-copper-latimer-green{font-size:14px;fill:var(--fig-green)} .pchem-6-copper-latimer-amber{font-size:14px;fill:var(--fig-amber)} .pchem-6-copper-latimer-violet{font-size:14px;fill:var(--fig-violet)} .pchem-6-copper-latimer-teal{font-size:14px;fill:var(--fig-teal)} .pchem-6-copper-latimer-acc{font-size:14px;fill:var(--fig-accent)} .pchem-6-copper-latimer-big{font-size:18px;font-weight:700;fill:var(--fig-ink)}</style>
  <text x="60.0" y="117.0" text-anchor="middle" class="pchem-6-copper-latimer-big">Cu²⁺</text>
  <text x="240.0" y="117.0" text-anchor="middle" class="pchem-6-copper-latimer-big">Cu⁺</text>
  <text x="420.0" y="117.0" text-anchor="middle" class="pchem-6-copper-latimer-big">Cu</text>
  <line x1="92.0" y1="110.0" x2="195.0" y2="110.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <path d="M205.0 110.0 L195.0 115.0 L195.0 105.0 Z" style="fill:var(--fig-ink);stroke:none"/>
  <line x1="272.0" y1="110.0" x2="385.0" y2="110.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <path d="M395.0 110.0 L385.0 115.0 L385.0 105.0 Z" style="fill:var(--fig-ink);stroke:none"/>
  <text x="148.0" y="96.0" text-anchor="middle" class="pchem-6-copper-latimer-b">+0.153 V</text>
  <text x="334.0" y="96.0" text-anchor="middle" class="pchem-6-copper-latimer-b">+0.521 V</text>
  <text x="148.0" y="76.0" text-anchor="middle" class="pchem-6-copper-latimer-sm">e⁻ 1개</text>
  <text x="334.0" y="76.0" text-anchor="middle" class="pchem-6-copper-latimer-sm">e⁻ 1개</text>
  <path d="M60 132 L60 172 L420 172" style="fill:none;stroke:var(--fig-accent);stroke-width:2"/>
  <line x1="400.0" y1="172.0" x2="414.9" y2="146.6" style="stroke:var(--fig-accent);stroke-width:2"/>
  <path d="M420.0 138.0 L419.2 149.2 L410.6 144.1 Z" style="fill:var(--fig-accent);stroke:none"/>
  <text x="240.0" y="166.0" text-anchor="middle" class="pchem-6-copper-latimer-sm">e⁻ 2개</text>
  <text x="240.0" y="194.0" text-anchor="middle" class="pchem-6-copper-latimer-acc">+0.337 V = (1×0.153 + 1×0.521)/2</text>
  <text x="240.0" y="232.0" text-anchor="middle" class="pchem-6-copper-latimer-red">Cu⁺: 오른쪽 전위 0.521 &gt; 왼쪽 전위 0.153</text>
  <text x="240.0" y="252.0" text-anchor="middle" class="pchem-6-copper-latimer-red">→ Cu⁺는 불균등화한다 (2Cu⁺ → Cu²⁺ + Cu)</text>
  <text x="240.0" y="30.0" text-anchor="middle" class="pchem-6-copper-latimer-sm">산화수  +2 → +1 → 0</text>
</svg>
