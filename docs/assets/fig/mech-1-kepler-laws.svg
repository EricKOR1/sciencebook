<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-mech-1-kepler-laws d-mech-1-kepler-laws">
  <title id="t-mech-1-kepler-laws">그림 역학과 에너지 1-8 케플러 제1·2·3법칙</title>
  <desc id="d-mech-1-kepler-laws">(가) 행성은 태양을 한 초점으로 하는 타원 궤도를 돌며, 태양과 행성을 잇는 선이 같은 시간 동안 쓸고 지나가는 넓이가 같다. 그래서 태양에 가까운 근일점에서 빠르고 먼 원일점에서 느리다. 타원의 납작한 정도는 과장한 모식도이다. (나) 수성부터 화성까지 공전 주기의 제곱(년²)과 궤도 긴반지름의 세제곱(AU³)이 한 직선 위에 놓인다.</desc>
