<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-uphy-8-conductor-cavity d-uphy-8-conductor-cavity">
  <title id="t-uphy-8-conductor-cavity">그림 일반물리학 8-7 정전 평형 도체: 공동 속 전하와 표면 바로 바깥의 전기장</title>
  <desc id="d-uphy-8-conductor-cavity">(가) 중성 도체 속 공동의 가운데에 +q를 두면 공동 벽에 −q, 바깥 표면에 +q가 유도된다. 도체 속(색칠한 부분)은 E = 0이므로, 도체 속을 지나며 공동을 감싸는 가우스 곡면(점선)이 품은 알짜 전하는 0이어야 한다. 바깥 표면의 전기장은 표면에 수직이다. (나) 표면을 관통하는 작은 원통에 가우스 법칙을 쓰면 안쪽 밑면은 E = 0, 옆면은 E와 나란하므로 바깥 밑면만 남아 EA = σA/ε₀, E = σ/ε₀이다. 모식도이다.</desc>
