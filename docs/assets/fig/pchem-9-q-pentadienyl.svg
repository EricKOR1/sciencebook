  <title id="t-pchem-9-q-pentadienyl">그림 물리화학 9-19 문제 14의 펜타다이엔일 양이온 π계</title>
  <desc id="d-pchem-9-q-pentadienyl">펜타다이엔일 양이온의 탄소 골격 C1–C5(수소 생략)와 각 탄소의 p 오비탈. 다섯 탄소가 한 평면에 있고 p 오비탈은 그 평면에 수직이다. 엽의 크기와 색은 계수와 무관하게 모두 같게 그렸다.</desc>
