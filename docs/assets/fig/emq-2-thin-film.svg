<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-emq-2-thin-film d-emq-2-thin-film">
  <title id="t-emq-2-thin-film">그림 전자기와 양자 2-1 얇은 막의 간섭 — 두 반사광과 위상 반전</title>
  <desc id="d-emq-2-thin-film">얇은 막의 윗면과 아랫면에서 반사된 두 빛이 겹친다. 경로차는 약 2nt이고, 굴절률이 작은 곳에서 큰 곳으로의 경계에서 반사될 때마다 위상이 반대로 바뀐다. 비누막은 한 번, 유리 위 반사 방지 코팅은 두 번 바뀐다.</desc>
  <style>
    .emq-2-thin-film-t{font-size:15px;fill:var(--fig-ink);font-weight:600}
    .emq-2-thin-film-s{font-size:13px;fill:var(--fig-muted)}
    .emq-2-thin-film-k{font-size:13px;fill:var(--fig-ink)}
    .emq-2-thin-film-r{font-size:13px;fill:var(--fig-red);font-weight:600}
    .emq-2-thin-film-film{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.5}
    .emq-2-thin-film-glass{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5}
    .emq-2-thin-film-ray{fill:none;stroke:var(--fig-amber);stroke-width:2.5}
    .emq-2-thin-film-ray2{fill:none;stroke:var(--fig-violet);stroke-width:2.5}
    .emq-2-thin-film-ah{fill:var(--fig-amber)} .emq-2-thin-film-ah2{fill:var(--fig-violet)}
    .emq-2-thin-film-dim{fill:none;stroke:var(--fig-ink);stroke-width:1.2}
    .emq-2-thin-film-mark{fill:var(--fig-red)}
  </style>
  <!-- (가) 비누막 -->
  <text x="20" y="28" class="emq-2-thin-film-t">(가) 공기 중의 비누막 (n = 1.33)</text>
  <text x="30" y="70" class="emq-2-thin-film-s">공기 (n = 1.00)</text>
  <rect x="20" y="150" width="320" height="50" class="emq-2-thin-film-film"/>
  <text x="330" y="180" text-anchor="end" class="emq-2-thin-film-s">막 (n = 1.33)</text>
  <text x="30" y="226" class="emq-2-thin-film-s">공기 (n = 1.00)</text>
  <!-- 입사광 -->
  <path d="M60 60 L120 150" class="emq-2-thin-film-ray"/>
  <path d="M100 120 l3 -10 l6 8 z" class="emq-2-thin-film-ah" transform="rotate(-24 104 116)"/>
  <!-- 반사 1 -->
  <path d="M120 150 L180 60" class="emq-2-thin-film-ray"/>
  <path d="M180 60 l-1 11 l-8 -5 z" class="emq-2-thin-film-ah"/>
  <text x="186" y="58" class="emq-2-thin-film-k">반사광 ①</text>
  <circle cx="120" cy="150" r="5" class="emq-2-thin-film-mark"/>
  <!-- 굴절-아랫면 반사-나옴 -->
  <path d="M120 150 L150 200 L180 150 L240 60" class="emq-2-thin-film-ray2"/>
  <path d="M240 60 l-1 11 l-8 -5 z" class="emq-2-thin-film-ah2"/>
  <text x="246" y="78" class="emq-2-thin-film-k">반사광 ②</text>
  <!-- 두께 -->
  <path d="M300 150 L300 200 M294 150 L306 150 M294 200 L306 200" class="emq-2-thin-film-dim"/>
  <text x="290" y="168" text-anchor="end" class="emq-2-thin-film-k">t</text>
  <text x="20" y="256" class="emq-2-thin-film-r">● 윗면(공기→막) 반사: 위상 반전</text>
  <text x="20" y="276" class="emq-2-thin-film-k">아랫면(막→공기) 반사: 위상 그대로</text>
  <text x="20" y="300" class="emq-2-thin-film-k">반전 1번 → 보강: 2nt = (m + ½)λ</text>
  <text x="20" y="320" class="emq-2-thin-film-s">t → 0 이면 상쇄되어 검게 보인다</text>
  <line x1="360" y1="20" x2="360" y2="330" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4"/>
  <!-- (나) 반사 방지 코팅 -->
  <text x="380" y="28" class="emq-2-thin-film-t">(나) 유리 위 반사 방지 코팅 (n = 1.38)</text>
  <text x="390" y="70" class="emq-2-thin-film-s">공기 (n = 1.00)</text>
  <rect x="380" y="150" width="320" height="50" class="emq-2-thin-film-film"/>
  <text x="690" y="180" text-anchor="end" class="emq-2-thin-film-s">코팅 (n = 1.38)</text>
  <rect x="380" y="200" width="320" height="34" class="emq-2-thin-film-glass"/>
  <text x="690" y="222" text-anchor="end" class="emq-2-thin-film-s">유리 (n = 1.5)</text>
  <path d="M420 60 L480 150" class="emq-2-thin-film-ray"/>
  <path d="M460 120 l3 -10 l6 8 z" class="emq-2-thin-film-ah" transform="rotate(-24 464 116)"/>
  <path d="M480 150 L540 60" class="emq-2-thin-film-ray"/>
  <path d="M540 60 l-1 11 l-8 -5 z" class="emq-2-thin-film-ah"/>
  <text x="546" y="58" class="emq-2-thin-film-k">반사광 ①</text>
  <circle cx="480" cy="150" r="5" class="emq-2-thin-film-mark"/>
  <path d="M480 150 L510 200 L540 150 L600 60" class="emq-2-thin-film-ray2"/>
  <path d="M600 60 l-1 11 l-8 -5 z" class="emq-2-thin-film-ah2"/>
  <text x="606" y="78" class="emq-2-thin-film-k">반사광 ②</text>
  <circle cx="510" cy="200" r="5" class="emq-2-thin-film-mark"/>
  <text x="380" y="256" class="emq-2-thin-film-r">● 두 경계 모두 작은 n → 큰 n: 둘 다 반전</text>
  <text x="380" y="276" class="emq-2-thin-film-k">반전 효과가 서로 비김</text>
  <text x="380" y="300" class="emq-2-thin-film-k">반전 2번 → 상쇄: 2nt = (m + ½)λ</text>
  <text x="380" y="320" class="emq-2-thin-film-s">빛을 거의 수직으로 비춘다고 보고, 각도를 과장한 모식도</text>
</svg>
