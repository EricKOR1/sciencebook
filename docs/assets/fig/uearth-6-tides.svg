<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t-uearth-6-tides d-uearth-6-tides">
<title id="t-uearth-6-tides">그림 일반지구과학 6-10 기조력과 사리·조금</title>
<desc id="d-uearth-6-tides">(가) 달에 의한 기조력(화살표)은 달을 향한 쪽과 그 반대쪽에서 지표 바깥으로, 그 사이 90° 지점에서는 안쪽으로 작용해 해수를 양쪽으로 부풀린다(실선은 크게 과장한 평형 조석의 모양). (나) 삭과 망에는 태양·지구·달이 일직선이 되어 두 천체의 조석이 겹쳐 조차가 큰 사리가, 상현과 하현에는 두 조석이 직각으로 어긋나 조차가 작은 조금이 된다. 크기와 거리는 실제 비율과 다르다.</desc>
