  <title id="t-umath-8-gaussian-spreading">그림 수학 도구 8-2 확산 방정식의 가우스 해가 퍼지는 모습</title>
  <desc id="d-umath-8-gaussian-spreading">D = 1일 때 c(x, t) = exp(−x²/4Dt)/√(4πDt)를 t = 0.05, 0.2, 1, 4에서 그렸다. 시간이 지날수록 봉우리는 낮아지고 넓어지지만 곡선 아래 넓이는 모두 1이다. t = 1 곡선에는 폭 ±√(2Dt) = ±1.41을 표시했다.</desc>
