  <text x="20" y="30" class="umath-3-triple-product-t"><tspan>부피 </tspan><tspan style="font-style:italic">V</tspan><tspan> = (밑면 넓이)×(높이) = |</tspan><tspan style="font-weight:700;font-style:italic">b</tspan><tspan>×</tspan><tspan style="font-weight:700;font-style:italic">c</tspan><tspan>| </tspan><tspan style="font-style:italic">h</tspan><tspan> = </tspan><tspan style="font-weight:700;font-style:italic">a</tspan><tspan>·(</tspan><tspan style="font-weight:700;font-style:italic">b</tspan><tspan>×</tspan><tspan style="font-weight:700;font-style:italic">c</tspan><tspan>)</tspan></text>
