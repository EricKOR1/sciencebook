<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-umath-3-triple-product d-umath-3-triple-product">
  <title id="t-umath-3-triple-product">그림 수학 도구 3-2 스칼라 삼중곱과 평행육면체</title>
  <desc id="d-umath-3-triple-product">세 벡터 a, b, c가 만드는 평행육면체의 부피는 밑면 넓이 |b×c|와 높이 h의 곱 a·(b×c)이다. 높이는 a를 b×c 방향으로 사영한 길이이다. 결정의 단위 세포도 평행육면체이며, 단사정계는 a⊥b, b⊥c이고 a와 c가 각 β를 이룬다.</desc>
