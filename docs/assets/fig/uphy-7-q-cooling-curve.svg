  <title id="t-uphy-7-q-cooling-curve">그림 일반물리학 7-13 예제 6의 냉각 곡선</title>
  <desc id="d-uphy-7-q-cooling-curve">뉴턴 냉각 법칙에 따른 커피의 온도 T = 20 + 70e^(−t/τ) (°C), 1/τ = 0.0560 min⁻¹. 0분에 90 °C, 10분 뒤 60 °C, 약 22분 뒤 40 °C가 된다. 처음 30 K 내리는 데 10분, 다음 20 K 내리는 데 약 12분이 걸려 온도 차가 작아질수록 천천히 식으며 실온 20 °C에 다가간다.</desc>
