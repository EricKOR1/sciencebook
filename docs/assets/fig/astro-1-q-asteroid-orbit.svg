<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 330" class="fig-small" role="img" aria-labelledby="t-astro-1-q-asteroid-orbit d-astro-1-q-asteroid-orbit">
  <title id="t-astro-1-q-asteroid-orbit">그림 행성우주과학 1-8 문제 14 소행성의 궤도와 지구 궤도</title>
  <desc id="d-astro-1-q-asteroid-orbit">근일점 거리 0.9 AU, 원일점 거리 2.7 AU인 소행성의 타원 궤도(긴반지름 1.8 AU, 이심률 0.5)를 지구 궤도(1 AU)와 같은 축척으로 그린 것이다. 근일점은 지구 궤도 안쪽, 원일점은 바깥쪽에 있어 두 궤도가 겹쳐 지난다.</desc>
  <style>.astro-1-q-asteroid-orbit-t{font-size:14px;fill:var(--fig-ink)} .astro-1-q-asteroid-orbit-s{font-size:13px;fill:var(--fig-muted)} .astro-1-q-asteroid-orbit-b{font-weight:600} .astro-1-q-asteroid-orbit-L{font-size:15px;fill:var(--fig-ink)}</style>
  <ellipse cx="252" cy="175" rx="144" ry="124.7" style="fill:none;stroke:var(--fig-violet);stroke-width:2.2"/>
  <circle cx="180" cy="175" r="80" style="fill:none;stroke:var(--fig-blue);stroke-width:1.8;stroke-dasharray:5 4"/>
  <circle cx="180" cy="175" r="10" style="fill:#f4b400;stroke:var(--fig-amber);stroke-width:1.5"/>
  <text x="184" y="205" text-anchor="middle" class="astro-1-q-asteroid-orbit-t">태양</text>
  <circle cx="108" cy="175" r="4.5" style="fill:var(--fig-violet);stroke:none;stroke-width:1.5"/>
  <circle cx="396" cy="175" r="4.5" style="fill:var(--fig-violet);stroke:none;stroke-width:1.5"/>
  <line x1="108" y1="175" x2="396" y2="175" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:2 3"/>
  <text x="94" y="171" text-anchor="end" class="astro-1-q-asteroid-orbit-s" style="fill:var(--fig-violet)">근일점</text>
  <text x="94" y="189" text-anchor="end" class="astro-1-q-asteroid-orbit-s">0.9 AU</text>
  <text x="388" y="165" text-anchor="end" class="astro-1-q-asteroid-orbit-s" style="fill:var(--fig-violet)">원일점</text>
  <text x="388" y="193" text-anchor="end" class="astro-1-q-asteroid-orbit-s">2.7 AU</text>
  <line x1="120" y1="46" x2="134" y2="110" style="stroke:var(--fig-blue);stroke-width:1"/>
  <text x="120" y="40" text-anchor="middle" class="astro-1-q-asteroid-orbit-s" style="fill:var(--fig-blue)">지구 궤도 (1 AU)</text>
  <line x1="375" y1="66" x2="365" y2="100" style="stroke:var(--fig-violet);stroke-width:1"/>
  <text x="375" y="60" text-anchor="middle" class="astro-1-q-asteroid-orbit-s" style="fill:var(--fig-violet)">소행성 궤도</text>
  <text x="20" y="320" text-anchor="start" class="astro-1-q-asteroid-orbit-s">두 궤도는 같은 축척으로 그렸다</text>
</svg>
