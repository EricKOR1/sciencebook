<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-pchem-1-clement-desormes d-pchem-1-clement-desormes">
  <title id="t-pchem-1-clement-desormes">그림 물리화학 1-13 클레망–데조름 실험 장치와 압력 변화</title>
  <desc id="d-pchem-1-clement-desormes">왼쪽: 큰 용기에 고무마개를 꽂고 ① 손 펌프 연결관(꼭지), ② U자관 물 압력계, ③ 지름이 큰 배출 꼭지를 단다. 오른쪽: 용기 속 압력의 시간 변화(개략). ① 펌프질 뒤 실온에서 p₀ + Δp₁(높이 차 h₁)으로 평형, ② 꼭지를 잠깐 열면 p₀까지 급히 떨어지는 단열 팽창, ③ 닫은 뒤 벽에서 열을 받아 서서히 올라 p₀ + Δp₂(h₂)에서 평형(등적 가열). 모식도.</desc>
