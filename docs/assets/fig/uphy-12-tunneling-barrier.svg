<text x="372.7" y="302.0" text-anchor="middle" class="u12t-sm">L</text>
<text x="194.8" y="36.0" text-anchor="middle" class="u12t-sm">입사파 + 반사파</text>
<text x="372.7" y="36.0" text-anchor="middle" class="u12t-sm">장벽 안: 지수 함수로 감소</text>
<text x="372.7" y="54.0" text-anchor="middle" class="u12t-s">ψ ∝ e^(−κx)</text>
<text x="550.7" y="36.0" text-anchor="middle" class="u12t-sm">투과파(진폭 작음)</text>
<text x="550.7" y="54.0" text-anchor="middle" class="u12t-s">T = |진폭 비|² ≈ 0.12 (L = 0.15 nm)</text>
<text x="40.0" y="318.0" class="u12t-s">κ = √(2m(U₀ − E))/ħ. 이 그림은 κL ≈ 1.5인 얇은 장벽이라 정확한 해의 값이다.</text>
<text x="40.0" y="336.0" class="u12t-s">근사식 T ≈ e^(−2κL)(여기서는 ≈ 0.05)은 κL ≫ 1인 두꺼운 장벽(예제 10)에서 쓴다.</text>
</svg>
