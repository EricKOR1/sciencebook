<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 346" role="img" aria-labelledby="t-uphy-12-tunneling-barrier d-uphy-12-tunneling-barrier">
  <title id="t-uphy-12-tunneling-barrier">그림 일반물리학 12-6 퍼텐셜 장벽과 터널링 — 장벽을 지나는 파동 함수</title>
  <desc id="d-uphy-12-tunneling-barrier">에너지 E = 1.0 eV인 전자가 높이 U₀ = 5.0 eV, 폭 0.15 nm인 장벽에 왼쪽에서 다가올 때 슈뢰딩거 방정식의 해(파동 함수의 실수부)를 에너지 높이에 겹쳐 그렸다. 왼쪽에는 입사파와 반사파가 겹쳐 있고, 장벽 안(고전적으로 갈 수 없는 영역)에서는 파동 함수가 진동하지 않고 지수 함수적으로 줄어들며, 오른쪽에는 진폭이 작은 투과파가 나아간다. 투과 확률은 진폭 비의 제곱으로 약 0.12이며, κL ≈ 1.5로 장벽이 얇아 근사식 e^(−2κL)(약 0.05)보다 크다. 파동 함수의 세로 크기는 임의 단위이다.</desc>
