  <desc id="d-uphy-1-q-train-ball">(가) 기차 안에서는 공이 연직 위로 1.23 m 올라갔다가 같은 자리로 내려온다. (나) 땅에서는 공이 처음부터 수평 속도 20.0 m/s를 가지므로 1.00 s 동안 20.0 m를 나아가며 포물선을 그린다. 점은 0.1 s 간격이며 두 그림에서 같은 순간의 높이가 같다. 가속도는 두 기준틀에서 모두 연직 아래로 g이다.</desc>
