<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 376" role="img" aria-labelledby="t-bio-2-agglutination d-bio-2-agglutination">
  <title id="t-bio-2-agglutination">그림 생명과학 2-8 항원 항체 반응에 의한 응집과 ABO식 혈액형 판정</title>
  <desc id="d-bio-2-agglutination">(가) Y자 모양 항체의 끝부분이 적혈구 막의 응집원 A와 특이적으로 결합하여 여러 적혈구를 이어 붙이므로 적혈구가 엉겨 붙는다. (나) 항 A 혈청과 항 B 혈청에 피를 섞었을 때 A형은 항 A에만, B형은 항 B에만, AB형은 둘 다에 응집하고, O형은 어느 쪽에도 응집하지 않는다. 모식도.</desc>
