<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-ubio-7-enhancer-loop d-ubio-7-enhancer-loop">
<title id="t-ubio-7-enhancer-loop">그림 일반생명과학 7-4 인핸서와 DNA 고리</title>
<desc id="d-ubio-7-enhancer-loop">프로모터에서 수천~수만 염기쌍 떨어진 인핸서에 여러 활성 인자가 결합하고, 그 사이의 DNA가 고리처럼 휘어 활성 인자가 매개 복합체를 통해 프로모터(TATA 상자)에 조립된 일반 전사 인자와 RNA 중합 효소 Ⅱ에 닿는다. 그러면 전사 시작점에서 전사가 크게 늘어난다. 거리와 크기는 축척을 무시한 모식도이다.</desc>
<style>
.ubio-7-enhancer-loop-h{font-size:14px;font-weight:700;fill:var(--fig-ink)} .ubio-7-enhancer-loop-t{font-size:13px;fill:var(--fig-ink)} .ubio-7-enhancer-loop-s{font-size:13px;fill:var(--fig-muted)} .ubio-7-enhancer-loop-b{font-size:13px;font-weight:700;fill:var(--fig-ink)}
.ubio-7-enhancer-loop-dna{stroke:var(--fig-ink);stroke-width:3;fill:none}
</style>
<path d="M20 360 L130 360 C175 360 150 250 140 200 C128 130 170 80 260 78 C360 76 470 100 475 160 C478 195 450 205 420 205 L300 205 C262 205 250 240 262 290 C272 335 300 360 340 360 L700 360" class="ubio-7-enhancer-loop-dna"/>
<rect x="330" y="198" width="25" height="14" style="fill:var(--fig-green);stroke:none"/>
<rect x="360" y="198" width="25" height="14" style="fill:var(--fig-teal);stroke:none"/>
<rect x="390" y="198" width="25" height="14" style="fill:var(--fig-blue);stroke:none"/>
<ellipse cx="342" cy="229" rx="15" ry="11" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.8"/>
<rect x="358" y="218" width="28" height="22" rx="4" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.8"/>
<circle cx="403" cy="229" r="12" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
<path d="M330 252 Q385 238 445 252 L450 296 Q390 306 335 296 Z" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.8"/>
<text x="390.0" y="278.0" text-anchor="middle" class="ubio-7-enhancer-loop-b">매개 복합체</text>
<ellipse cx="400" cy="332" rx="58" ry="22" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
<text x="400.0" y="337.0" text-anchor="middle" class="ubio-7-enhancer-loop-t">RNA 중합 효소 Ⅱ</text>
<rect x="336" y="354" width="34" height="12" style="fill:var(--fig-amber);stroke:none"/>
<ellipse cx="330" cy="345" rx="14" ry="10" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5"/>
<ellipse cx="466" cy="345" rx="14" ry="10" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5"/>
<rect x="490" y="349" width="200" height="22" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
<text x="590.0" y="365.0" text-anchor="middle" class="ubio-7-enhancer-loop-t">유전자</text>
<path d="M490 349 V312 H520" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/>
<path d="M528 312 l-9 -5 v10 z" style="fill:var(--fig-ink)"/>
<text x="534.0" y="317.0" text-anchor="start" class="ubio-7-enhancer-loop-s">전사 시작점</text>
<text x="372.0" y="186.0" text-anchor="middle" class="ubio-7-enhancer-loop-b">인핸서(원거리 조절 요소)</text>
<text x="372.0" y="168.0" text-anchor="middle" class="ubio-7-enhancer-loop-s">조절 서열 3개</text>
<line x1="418" y1="229" x2="486" y2="229" style="stroke:var(--fig-muted);stroke-width:1"/>
<text x="490.0" y="226.0" text-anchor="start" class="ubio-7-enhancer-loop-t">활성 인자(특정 전사 인자)</text>
<text x="490.0" y="243.0" text-anchor="start" class="ubio-7-enhancer-loop-s">— 서열마다 맞는 인자가 붙는다</text>
<text x="353.0" y="386.0" text-anchor="middle" class="ubio-7-enhancer-loop-s">TATA 상자</text>
<line x1="330" y1="356" x2="300" y2="398" style="stroke:var(--fig-muted);stroke-width:1"/>
<text x="296.0" y="404.0" text-anchor="end" class="ubio-7-enhancer-loop-s">일반 전사 인자</text>
<text x="250.0" y="112.0" text-anchor="middle" class="ubio-7-enhancer-loop-s">DNA 고리</text>
<text x="20.0" y="30.0" text-anchor="start" class="ubio-7-enhancer-loop-t">인핸서와 프로모터 사이: 수천~수만 bp</text>
<text x="20.0" y="48.0" text-anchor="start" class="ubio-7-enhancer-loop-s">(축척 무시, 인핸서는 유전자 뒤나 인트론 안에 있어도 된다)</text>
</svg>
