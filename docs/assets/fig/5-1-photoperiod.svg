<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-5-1-photoperiod d-5-1-photoperiod">
  <title id="t-5-1-photoperiod">그림 5-1-4 계절에 따른 낮의 길이와 장일·단일 식물의 개화</title>
  <desc id="d-5-1-photoperiod">서울에서 낮의 길이는 동지 무렵 약 9.6시간에서 하지 무렵 약 14.8시간까지 해마다 같은 모양으로 바뀐다. 낮이 어떤 기준 시간보다 길어지는 봄~초여름에는 장일 식물이, 기준보다 짧아지는 가을에는 단일 식물이 꽃을 피운다. 기준 시간은 식물마다 다르며 그림의 기준선은 예시이다.</desc>
