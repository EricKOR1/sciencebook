<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="t-ochem-2-hexane-isomers d-ochem-2-hexane-isomers">
  <title id="t-ochem-2-hexane-isomers">그림 유기화학 2-2 C₆H₁₄의 구조 이성질체 다섯 가지</title>
  <desc id="d-ochem-2-hexane-isomers">위 줄: 가장 긴 사슬의 길이 순서로 ① 헥세인(사슬 6), ② 2-메틸펜테인, ③ 3-메틸펜테인(사슬 5), ④ 2,2-다이메틸뷰테인, ⑤ 2,3-다이메틸뷰테인(사슬 4). 굵은 선이 가장 긴 사슬이고 작은 숫자가 사슬 번호이다. 아래 줄: 같은 분자를 다르게 그린 예. 2-메틸펜테인을 꺾어 그려도 같은 분자이고, 사슬 끝 탄소에 메틸을 붙인 "1-메틸펜테인"은 실제로는 사슬이 6개인 헥세인이다.</desc>
