<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" class="fig-small" role="img" aria-labelledby="t-ochem-1-q-acetamide-3d d-ochem-1-q-acetamide-3d">
  <title id="t-ochem-1-q-acetamide-3d">그림 유기화학 1-4 예제 7 아세트아마이드의 3차원 모양과 π계</title>
  <desc id="d-ochem-1-q-acetamide-3d">아세트아마이드 CH₃C(=O)NH₂. 카보닐 C, O, N과 N에 붙은 H 두 개가 한 평면(회색)에 놓이고, C·O·N의 p 오비탈이 평면에 수직으로 나란히 서서 세 원자에 걸친 π계를 이룬다. N의 전자쌍이 이 p 오비탈에 들어가 공명에 참여하므로 N은 sp³가 아니라 sp²(평면)이다. 메틸 탄소만 sp³ 사면체이며, 평면 밖의 H 두 개를 쐐기(앞)와 점선(뒤)으로 그렸다. 모식도이다.</desc>
