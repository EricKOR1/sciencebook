<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 448" role="img" aria-labelledby="t-5-5-thermal-nuclear d-5-5-thermal-nuclear">
  <title id="t-5-5-thermal-nuclear">그림 5-5-1 화력 발전소와 원자력 발전소의 구조 비교</title>
  <desc id="d-5-5-thermal-nuclear">두 발전소 모두 열로 물을 끓여 만든 고온·고압의 증기로 터빈을 돌리고, 터빈과 같은 축의 발전기가 전기를 만든다. 다른 것은 열을 얻는 방법(연료의 연소 또는 우라늄의 핵분열)뿐이다. 터빈을 지난 증기는 복수기에서 바닷물로 식혀 다시 물로 되돌린다. 모식도(실제 구조는 더 복잡함).</desc>
