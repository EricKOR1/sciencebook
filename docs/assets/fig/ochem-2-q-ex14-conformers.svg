<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-labelledby="t-ochem-2-q-ex14-conformers d-ochem-2-q-ex14-conformers">
  <title id="t-ochem-2-q-ex14-conformers">그림 유기화학 2-18 예제 14 풀이: cis-1-tert-뷰틸-4-메틸사이클로헥세인의 두 의자 형태</title>
  <desc id="d-ochem-2-q-ex14-conformers">형태 A(C1의 축 결합이 아래인 의자): tert-뷰틸은 C1의 적도(위쪽으로 비스듬히), 메틸은 C4의 축(위). 형태 B(고리 뒤집힘): tert-뷰틸은 C1의 축(위), 메틸은 C4의 적도(위쪽으로 비스듬히)이며, tert-뷰틸의 메틸 하나와 C3·C5의 위쪽 축 H 사이에 큰 반발(굵은 붉은 점선)이 있다. K ≈ 170으로 형태 A가 약 99.4 %이다. 두 형태 모두 두 치환기가 고리의 위쪽(cis)이다.</desc>
