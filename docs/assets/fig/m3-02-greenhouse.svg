<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-m3-02-greenhouse d-m3-02-greenhouse">
  <title id="t-m3-02-greenhouse">그림 중3-2-2 복사 평형과 온실효과</title>
  <desc id="d-m3-02-greenhouse">두 경우 모두 들어오는 태양 복사 100 중 약 30은 반사되고 약 70이 흡수되며, 우주로 나가는 지구 복사도 약 70이어서 복사 평형을 이룬다. 온실 기체가 없으면 지표가 내보낸 적외선이 바로 우주로 빠져나가 지표 평균 기온이 약 −18 °C로 계산된다. 온실 기체가 있으면 지표가 내보낸 적외선을 흡수했다가 일부를 다시 지표로 내보내므로 지표가 더 따뜻한 약 15 °C에서 평형을 이룬다(모식도).</desc>
  <style>.m3-02-greenhouse-l{font-size:14px;fill:var(--fig-ink)} .m3-02-greenhouse-t{font-size:13px;fill:var(--fig-muted)} .m3-02-greenhouse-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .m3-02-greenhouse-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:4px;stroke-linejoin:round}</style>
