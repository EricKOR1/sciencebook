<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-cell-1-q-potato-mass d-cell-1-q-potato-mass">
  <title id="t-cell-1-q-potato-mass">그림 세포와 물질대사 1-12 문제 13 해설: 질량 변화가 0인 농도 어림하기</title>
  <desc id="d-cell-1-q-potato-mass">측정값을 점으로 찍고 이웃한 점을 직선으로 이었다. 0.2 M(+5%)과 0.4 M(−2%)을 잇는 선분이 질량 변화율 0인 가로선과 약 0.34 M에서 만난다. 이 농도보다 묽은 용액에서는 물이 들어와 질량이 늘고, 진한 용액에서는 물이 빠져나가 질량이 준다.</desc>
