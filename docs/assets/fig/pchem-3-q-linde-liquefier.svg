  <title id="t-pchem-3-q-linde-liquefier">그림 물리화학 3-13 문제 12의 기체 액화 장치(린데 방식)</title>
  <desc id="d-pchem-3-q-linde-liquefier">압축기 → 냉각기(실온) → 역류 열교환기의 나선관 → 조절 밸브(팽창 밸브) → 액체가 고이는 용기로 이어진다. 용기 위쪽의 차가운 기체는 열교환기를 거꾸로 지나며 들어오는 고압 기체를 식힌 뒤 압축기로 되돌아간다.</desc>
