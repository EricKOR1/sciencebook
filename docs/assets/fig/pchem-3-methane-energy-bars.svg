<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-pchem-3-methane-energy-bars d-pchem-3-methane-energy-bars">
  <title id="t-pchem-3-methane-energy-bars">그림 물리화학 3-3 메테인 연소(25 ℃)의 네 가지 에너지 변화</title>
  <desc id="d-pchem-3-methane-energy-bars">왼쪽은 ΔH = −890.4, ΔU = −885.4, ΔG = −817.9, ΔA = −812.9 kJ를 0부터 그린 막대이고, 오른쪽은 막대 끝(−800~−910 kJ)을 확대한 것이다. ΔH와 ΔG의 차이 TΔS = −72.4 kJ는 가역으로 진행해도 열로 내놓아야 하는 몫이고, ΔG와 ΔA(또 ΔH와 ΔU)의 차이 Δ(pV) = −4.96 kJ는 기체가 줄어들 때 대기가 계에 해 주는 일이다. 그래서 최대 비팽창 일(817.9 kJ)이 최대 전체 일(812.9 kJ)보다 크다.</desc>
