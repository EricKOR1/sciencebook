<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-chem-2-bond-energy-curve d-chem-2-bond-energy-curve">
  <title id="t-chem-2-bond-energy-curve">그림 화학 2-5 두 수소 원자 사이 거리에 따른 에너지</title>
  <desc id="d-chem-2-bond-energy-curve">두 수소 원자가 멀리서 다가오면 인력 때문에 에너지가 낮아지고, 핵 사이 거리 약 74 pm에서 에너지가 가장 낮아 결합이 이루어진다. 이때 낮아진 에너지 약 436 kJ/mol이 결합 에너지이다. 더 가까워지면 원자핵 사이의 반발력 때문에 에너지가 급격히 높아진다. 곡선의 모양은 모식적이다.</desc>
  <style>
    .c2bc-ink{fill:var(--fig-ink)} .c2bc-mut{fill:var(--fig-muted)}
    .c2bc-lbl{font-size:14px;fill:var(--fig-ink)} .c2bc-b{font-size:15px;font-weight:600;fill:var(--fig-ink)} .c2bc-sm{font-size:13px;fill:var(--fig-muted)}
