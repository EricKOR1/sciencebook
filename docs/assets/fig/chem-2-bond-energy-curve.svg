    .c2bc-Cl{fill:var(--fig-green);stroke:var(--fig-green);stroke-width:1} .c2bc-at{font-size:13px;font-weight:600}
    .c2bc-at{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.2;fill-opacity:0.8}
  </style>
