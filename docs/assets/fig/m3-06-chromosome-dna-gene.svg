  <text x="653" y="232" text-anchor="middle" class="m3-06-chromosome-dna-gene-sm">다른 유전자</text>
  <text x="360" y="320" text-anchor="middle" class="m3-06-chromosome-dna-gene-sm" style="fill:var(--fig-ink)">염색체 안에 DNA가 있고, DNA의 일부 구간이 유전자이다. 염색체 하나에는 수많은 유전자가 있다.</text>
  <text x="360" y="338" text-anchor="middle" class="m3-06-chromosome-dna-gene-sm">모식도: 크기 비율은 실제와 다르다.</text>
