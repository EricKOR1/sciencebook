  <title id="t-m3-06-chromosome-dna-gene">그림 중3-6-1 염색체·DNA·유전자의 관계</title>
  <desc id="d-m3-06-chromosome-dna-gene">세포의 핵 속에 있는 염색체를 확대하면 DNA가 단백질과 함께 뭉쳐 있고, DNA를 풀어 보면 그 일부 구간이 유전자이다. 분열 중인 염색체는 복제된 두 가닥(염색 분체)이 붙어 있다.</desc>
