  <text x="574" y="80" text-anchor="middle" class="m3-06-chromosome-dna-gene-lbl">DNA</text>
  <text x="574" y="100" text-anchor="middle" class="m3-06-chromosome-dna-gene-sm">두 가닥이 꼬인 긴 사슬(유전 정보 저장)</text>
  <text x="559" y="232" text-anchor="middle" class="m3-06-chromosome-dna-gene-lbl" style="fill:var(--fig-amber)">유전자</text>
