  <title id="t-phy-3-pn-junction">그림 물리학 3-10 p-n 접합 다이오드의 순방향·역방향 연결</title>
  <desc id="d-phy-3-pn-junction">(가) p형을 전원의 (+)극에 연결하면 양공과 전자가 접합면 쪽으로 이동해 공핍층이 얇아지고 전류가 잘 흐른다. (나) 반대로 연결하면 양공과 전자가 접합면에서 멀어져 공핍층이 두꺼워지고 전류가 거의 흐르지 않는다(모식도).</desc>
