<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-pchem-9-mo-n2-o2 d-pchem-9-mo-n2-o2">
  <title id="t-pchem-9-mo-n2-o2">그림 물리화학 9-11 N₂와 O₂의 분자 오비탈 준위도 (원자가 전자)</title>
  <desc id="d-pchem-9-mo-n2-o2">양옆은 두 원자의 2s, 2p 원자 오비탈, 가운데는 분자 오비탈이다(준위 간격은 모식적). N₂는 2s와 2p의 에너지 차가 작아 σg(2s)와 σg(2p)가 섞이며 서로 밀어내, σg(2p)가 πu(2p)보다 위에 놓인다. 원자가 전자 10개가 σg(2p)까지 채운다. O₂는 섞임이 작아 σg(2p)가 πu(2p) 아래에 있고, 12번째까지의 전자 중 두 개가 축퇴한 πg* 두 오비탈에 스핀을 나란히 하여 하나씩 들어간다.</desc>
