<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-uchem-12-binding-energy-curve d-uchem-12-binding-energy-curve">
  <title id="t-uchem-12-binding-energy-curve">그림 일반화학 12-5 핵자당 결합 에너지 곡선</title>
  <desc id="d-uchem-12-binding-energy-curve">핵자당 결합 에너지를 질량수에 대해 그렸다. 점은 실제 핵종의 값이고 선은 그 경향이다. 가벼운 핵에서 급격히 커지다가 ⁵⁶Fe·⁶²Ni 근처에서 약 8.8 MeV로 가장 크고, 무거워지면 서서히 줄어 ²³⁸U에서 약 7.6 MeV가 된다. ⁴He, ¹²C, ¹⁶O는 이웃보다 튀어나와 있다. 가벼운 핵은 합쳐서(핵융합), 무거운 핵은 쪼개져서(핵분열) 곡선의 꼭대기 쪽으로 갈 때 에너지를 낸다.</desc>
