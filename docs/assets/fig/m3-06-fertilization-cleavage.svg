  <desc id="d-m3-06-fertilization-cleavage">염색체 23개인 정자와 23개인 난자가 수정하여 염색체 46개인 수정란이 된다. 수정란은 난할을 거듭하여 세포 수가 1, 2, 4, 8, 16개로 늘어나지만, 전체 크기는 수정란과 거의 같고 세포 하나는 점점 작아진다. 모든 세포의 염색체 수는 46개로 같다. 아래는 사람에서 배란, 수정, 난할하며 자궁으로 이동하는 과정을 나타낸 모식도이다.</desc>
