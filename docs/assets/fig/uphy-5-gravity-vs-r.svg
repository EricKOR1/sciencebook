  <title id="t-uphy-5-gravity-vs-r">그림 일반물리학 5-1 지구 중심에서의 거리에 따른 중력 가속도</title>
  <desc id="d-uphy-5-gravity-vs-r">밀도가 균일한 지구를 가정하면 껍질 정리에 따라 지구 안에서는 g가 중심까지 거리에 비례하고, 밖에서는 거리의 제곱에 반비례한다. 국제 우주 정거장, GPS 위성, 정지 궤도 위성의 높이를 함께 표시했다.</desc>
