<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" class="fig-small" role="img" aria-labelledby="t-uearth-4-q-slope-forces d-uearth-4-q-slope-forces">
<title id="t-uearth-4-q-slope-forces">그림 일반지구과학 4-12 예제 2 사면 위 흙덩이에 작용하는 힘</title>
<desc id="d-uearth-4-q-slope-forces">경사 θ = 30°인 사면 위 흙덩이의 무게 W를 사면 방향 성분 W sinθ(구동력)와 사면에 수직한 성분 W cosθ로 나눈다. 저항력(마찰)은 W cosθ tanφ로 사면 위쪽을 향한다. 화살표 길이는 마른 상태(φ = 35°)의 크기에 비례한다.</desc>
<style>
.uearth-4-q-slope-forces-t{font-size:14px;fill:var(--fig-ink)} .uearth-4-q-slope-forces-s{font-size:13px;fill:var(--fig-muted)} .uearth-4-q-slope-forces-b{font-size:15px;fill:var(--fig-ink);font-weight:700} .uearth-4-q-slope-forces-k{font-size:14px;fill:var(--fig-ink);font-weight:700}
</style>
<rect x="0" y="0" width="480" height="330" style="fill:var(--fig-paper)"/>
<path d="M20.0 70.0 L460.0 324.0 L460.0 320.0 L20.0 320.0 Z" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5;stroke-linejoin:round"/>
<line x1="20.0" y1="324.0" x2="460.0" y2="324.0" style="stroke:var(--fig-muted);stroke-width:1;stroke-dasharray:4 4"/>
<line x1="70.0" y1="98.9" x2="180.0" y2="98.9" style="stroke:var(--fig-muted);stroke-width:1;stroke-dasharray:4 4"/>
<path d="M140.0 98.9 A70 70 0 0 1 130.6 133.9" style="fill:none;stroke:var(--fig-ink);stroke-width:1.2;stroke-linejoin:round"/>
<text x="148.0" y="120.9" class="uearth-4-q-slope-forces-t">θ = 30°</text>
<path d="M186.3 166.0 L252.1 204.0 L274.1 165.9 L208.3 127.9 Z" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.5;stroke-linejoin:round"/>
<line x1="230.2" y1="165.9" x2="230.2" y2="277.1" style="stroke:var(--fig-ink);stroke-width:2.5"/>
