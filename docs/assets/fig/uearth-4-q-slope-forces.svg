<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" class="fig-small" role="img" aria-labelledby="t-uearth-4-q-slope-forces d-uearth-4-q-slope-forces">
<title id="t-uearth-4-q-slope-forces">그림 일반지구과학 4-12 예제 2 사면 위 흙덩이에 작용하는 힘</title>
<desc id="d-uearth-4-q-slope-forces">경사 θ = 30°인 사면 위 흙덩이의 무게 W를 사면 방향 성분 W sinθ(구동력)와 사면에 수직한 성분 W cosθ로 나눈다. 저항력(마찰)은 W cosθ tanφ로 사면 위쪽을 향한다. 화살표 길이는 마른 상태(φ = 35°)의 크기에 비례한다.</desc>
<style>
.uearth-4-q-slope-forces-t{font-size:14px;fill:var(--fig-ink)} .uearth-4-q-slope-forces-s{font-size:13px;fill:var(--fig-muted)} .uearth-4-q-slope-forces-b{font-size:15px;fill:var(--fig-ink);font-weight:700} .uearth-4-q-slope-forces-k{font-size:14px;fill:var(--fig-ink);font-weight:700}
</style>
