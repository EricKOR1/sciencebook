<text x="220.9" y="259.9" class="uearth-4-q-slope-forces-b">W</text>
<line x1="212.9" y1="135.9" x2="257.9" y2="161.9" style="stroke:var(--fig-red);stroke-width:2.2;stroke-dasharray:5 3"/>
<path d="M0 0 l-10 -5.0 l0 10.0 z" transform="translate(264.8,165.9) rotate(30.0)" style="fill:var(--fig-red)"/>
<text x="270.8" y="157.9" class="uearth-4-q-slope-forces-t" style="fill:var(--fig-red)">W sinθ (구동력)</text>
<line x1="212.9" y1="135.9" x2="164.9" y2="219.0" style="stroke:var(--fig-blue);stroke-width:2.2;stroke-dasharray:5 3"/>
<path d="M0 0 l-10 -5.0 l0 10.0 z" transform="translate(160.9,225.9) rotate(120.0)" style="fill:var(--fig-blue)"/>
<text x="152.9" y="231.9" text-anchor="end" class="uearth-4-q-slope-forces-t" style="fill:var(--fig-blue)">W cosθ</text>
