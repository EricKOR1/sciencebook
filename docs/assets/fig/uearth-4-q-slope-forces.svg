<text x="238.2" y="289.9" class="uearth-4-q-slope-forces-b">W</text>
<line x1="230.2" y1="165.9" x2="275.2" y2="191.9" style="stroke:var(--fig-red);stroke-width:2.2;stroke-dasharray:5 3"/>
<path d="M0 0 l-10 -5.0 l0 10.0 z" transform="translate(282.1,195.9) rotate(30.0)" style="fill:var(--fig-red)"/>
<text x="288.1" y="187.9" class="uearth-4-q-slope-forces-t" style="fill:var(--fig-red)">W sinθ (구동력)</text>
<line x1="230.2" y1="165.9" x2="182.2" y2="249.0" style="stroke:var(--fig-blue);stroke-width:2.2;stroke-dasharray:5 3"/>
<path d="M0 0 l-10 -5.0 l0 10.0 z" transform="translate(178.2,255.9) rotate(120.0)" style="fill:var(--fig-blue)"/>
<text x="170.2" y="261.9" text-anchor="end" class="uearth-4-q-slope-forces-t" style="fill:var(--fig-blue)">W cosθ</text>
