<path d="M20.0 50.0 L410.0 275.2 L470.0 275.2 L470.0 322.0 L20.0 322.0 Z" style="fill:var(--fig-soft-amber);stroke:none;stroke-width:0;stroke-linejoin:round"/>
<path d="M20.0 50.0 L410.0 275.2 L470.0 275.2" style="fill:none;stroke:var(--fig-amber);stroke-width:2;stroke-linejoin:round"/>
