<path d="M330.0 275.2 A80 80 0 0 1 340.7 235.2" style="fill:none;stroke:var(--fig-ink);stroke-width:1.2;stroke-linejoin:round"/>
<text x="322.0" y="265.2" text-anchor="end" class="uearth-4-q-slope-forces-t">θ = 30°</text>
<path d="M169.0 136.0 L234.8 174.0 L256.8 135.9 L191.0 97.9 Z" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.5;stroke-linejoin:round"/>
