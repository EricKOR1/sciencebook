<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-uearth-10-snow-line d-uearth-10-snow-line">
  <title id="t-uearth-10-snow-line">그림 일반지구과학 10-8 원시 행성 원반의 온도와 설선</title>
  <desc id="d-uearth-10-snow-line">원반 먼지의 평형 온도는 태양에서 멀수록 278 K를 거리의 제곱근으로 나눈 값으로 낮아진다. 물 얼음이 안정한 약 170 K가 되는 약 2.7 AU가 설선이며, 그 안쪽에서는 암석과 금속만 응결해 작은 지구형 행성이, 바깥쪽에서는 얼음까지 응결해 큰 목성형 행성이 자랐다.</desc>
