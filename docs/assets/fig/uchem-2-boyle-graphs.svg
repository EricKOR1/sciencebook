  <title id="t-uchem-2-boyle-graphs">그림 일반화학 2-4 보일 법칙을 두 가지 그래프로</title>
  <desc id="d-uchem-2-boyle-graphs">이상 기체 1.00 mol을 25 °C에서 압축한 자료(PV = 24.5 L·atm)이다. 왼쪽 V–P 그래프는 쌍곡선이라 비례 상수를 바로 읽기 어렵다. 오른쪽처럼 V를 1/P에 대해 그리면 원점을 지나는 직선이 되고, 기울기가 nRT(= 24.5 L·atm)이다.</desc>
