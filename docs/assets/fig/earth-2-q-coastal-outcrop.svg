<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-earth-2-q-coastal-outcrop d-earth-2-q-coastal-outcrop">
  <title id="t-earth-2-q-coastal-outcrop">그림 지구과학 2-16 문제 17의 해안 노두 단면</title>
  <desc id="d-earth-2-q-coastal-outcrop">맨 아래 줄무늬가 뚜렷한 편마암 ①의 울퉁불퉁한 윗면을 역암 ②가 덮고, 그 위에 붉은 사암과 셰일 ③이 번갈아 수평으로 쌓여 있다. 안산암 암맥 ④가 ①~③을 수직으로 뚫고, ③과 ④의 깎인 면을 기둥 모양 절리가 발달한 수평한 현무암층 ⑤가 덮고 있는 모식도이다.</desc>
