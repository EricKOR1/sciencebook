<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uearth-11-milky-way d-uearth-11-milky-way">
  <title id="t-uearth-11-milky-way">그림 일반지구과학 11-7 우리은하의 구조와 태양의 위치</title>
  <desc id="d-uearth-11-milky-way">왼쪽: 위에서 본 우리은하. 중심을 가로지르는 막대 끝에서 나선팔이 뻗어 나가며, 태양은 중심에서 약 8.2 kpc 떨어진 나선팔 사이의 작은 가지(오리온 팔)에 있다. 오른쪽: 옆에서 본 우리은하. 지름 약 30 kpc의 얇은 원반(두께 약 0.3 kpc, 그림에서는 과장) 가운데에 팽대부가 있고, 구상 성단과 늙은 별, 암흑 물질이 퍼져 있는 공 모양의 헤일로가 전체를 감싼다. 나선팔의 모양과 개수는 단순화한 모식도.</desc>
