  <title id="t-m2-03-q-periscope">그림 중2-3-12 문제 10의 잠망경</title>
  <desc id="d-m2-03-q-periscope">평면거울 두 장으로 만든 잠망경이다. 담장 너머 물체에서 수평으로 들어오는 빛이 위쪽 거울과 45°를 이루고, 아래쪽 거울은 위쪽 거울과 나란하다. 눈은 잠망경 아래쪽 입구 옆에 있다. 모식도이다.</desc>
