<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-2-6-superconductor d-2-6-superconductor">
  <title id="t-2-6-superconductor">그림 2-6-4 수은의 저항이 0이 되는 온도</title>
  <desc id="d-2-6-superconductor">수은을 냉각하면 저항이 조금씩 줄다가, 임계 온도(약 −269 °C)에 이르면 갑자기 0이 된다. 그보다 낮은 온도에서는 저항이 0인 초전도 상태를 유지한다. 저항 축의 눈금은 생략한 모식 그래프이다.</desc>
  <style>
    .sc-lbl{font-size:15px;font-weight:600;fill:var(--fig-ink)} .sc-t{font-size:14px;fill:var(--fig-ink)}
    .sc-sm{font-size:13px;fill:var(--fig-muted)} .sc-ax{stroke:var(--fig-ink);stroke-width:1.6;fill:none} .sc-axh{fill:var(--fig-ink)}
    .sc-c{stroke:var(--fig-violet);stroke-width:3;fill:none;stroke-linejoin:round} .sc-tc{stroke:var(--fig-red);stroke-width:1.4;stroke-dasharray:5 4;fill:none}
    .sc-red{font-size:13px;font-weight:600;fill:var(--fig-red)} .sc-vt{font-size:13px;font-weight:600;fill:var(--fig-violet)}
    .sc-tk{stroke:var(--fig-ink);stroke-width:1.2} .sc-zone{fill:var(--fig-soft-violet)}
  </style>
  <rect x="110" y="60" width="195.0" height="190" class="sc-zone"/>
  <path d="M110 54 V250 H636" class="sc-ax"/>
  <path d="M110 46 l-5 9 h10 z" class="sc-axh"/><path d="M644 250 l-9 -5 v10 z" class="sc-axh"/>
  <line x1="110.0" y1="250" x2="110.0" y2="256" class="sc-tk"/><text x="110.0" y="274" text-anchor="middle" class="sc-sm">-272</text>
  <line x1="240.0" y1="250" x2="240.0" y2="256" class="sc-tk"/><text x="240.0" y="274" text-anchor="middle" class="sc-sm">-270</text>
  <line x1="370.0" y1="250" x2="370.0" y2="256" class="sc-tk"/><text x="370.0" y="274" text-anchor="middle" class="sc-sm">-268</text>
  <line x1="500.0" y1="250" x2="500.0" y2="256" class="sc-tk"/><text x="500.0" y="274" text-anchor="middle" class="sc-sm">-266</text>
  <line x1="630.0" y1="250" x2="630.0" y2="256" class="sc-tk"/><text x="630.0" y="274" text-anchor="middle" class="sc-sm">-264</text>
  <text x="630" y="296" text-anchor="end" class="sc-sm">온도(°C) →</text>
  <text x="100" y="66" text-anchor="end" class="sc-sm">저항</text>
  <text x="100" y="255" text-anchor="end" class="sc-sm">0</text>
  <polyline points="630.0,110.0 613.8,111.5 597.5,113.0 581.2,114.5 565.0,116.0 548.8,117.5 532.5,119.0 516.2,120.5 500.0,122.0 483.8,123.5 467.5,125.0 451.2,126.5 435.0,128.0 418.8,129.5 402.5,131.0 386.2,132.5 370.0,134.0 353.8,135.5 337.5,137.0 321.2,138.5 305.0,140.0 305.0,248.0 110.0,248.0" class="sc-c"/>
  <line x1="305.0" y1="60" x2="305.0" y2="250" class="sc-tc"/>
  <text x="313.0" y="76" class="sc-red">임계 온도 약 −269 °C</text>
  <text x="207.5" y="100" text-anchor="middle" class="sc-vt">초전도 상태</text>
  <text x="207.5" y="226" text-anchor="middle" class="sc-vt">저항 = 0</text>
  <text x="467.5" y="111.0" text-anchor="middle" class="sc-t">보통 상태: 저항이 있다</text>
  <text x="360" y="320" text-anchor="middle" class="sc-sm">1911년 카메를링 오너스가 수은을 냉각하며 처음 관찰한 현상</text>
</svg>
