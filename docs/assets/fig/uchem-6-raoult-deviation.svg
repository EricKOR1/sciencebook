    .uchem-6-rl-tot{stroke:var(--fig-accent);stroke-width:2.6;fill:none}
    .uchem-6-rl-pa{stroke:var(--fig-blue);stroke-width:1.8;fill:none}
    .uchem-6-rl-pb{stroke:var(--fig-amber);stroke-width:1.8;fill:none}
    .uchem-6-rl-t{font-size:13px;fill:var(--fig-ink)}
    .uchem-6-rl-h{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .uchem-6-rl-s{font-size:13px;fill:var(--fig-muted)}
  </style>
