<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-uchem-6-raoult-deviation d-uchem-6-raoult-deviation">
  <title id="t-uchem-6-raoult-deviation">그림 일반화학 6-7 라울 법칙과 이상 용액에서 벗어남</title>
  <desc id="d-uchem-6-raoult-deviation">두 휘발성 액체 A, B 혼합물의 증기 압력을 A의 몰 분율에 대해 그린 모식도. 이상 용액은 각 성분의 부분 압력(파랑 A, 주황 B)과 전체 증기 압력(굵은 선)이 모두 직선이다. A–B 사이 힘이 A–A, B–B보다 약하면 증기 압력이 라울 법칙(점선)보다 커지고(양의 벗어남), 더 강하면 작아진다(음의 벗어남).</desc>
