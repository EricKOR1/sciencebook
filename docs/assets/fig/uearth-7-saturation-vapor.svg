<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="t-uearth-7-saturation-vapor d-uearth-7-saturation-vapor">
  <title id="t-uearth-7-saturation-vapor">그림 일반지구과학 7-3 포화 수증기압 곡선 — 물과 얼음, 그리고 이슬점</title>
  <desc id="d-uearth-7-saturation-vapor">왼쪽: 마그누스 식으로 그린 물과 얼음의 포화 수증기압이다. 기온이 1 K 오를 때마다 약 6~7 %씩 지수적으로 커진다. 30 °C, 상대 습도 60 %인 공기(수증기압 25.5 hPa)를 수증기량 그대로 식히면 약 21 °C(이슬점)에서 곡선에 닿아 포화된다. 오른쪽: 같은 온도에서 물과 얼음의 포화 수증기압 차이로, 약 −12 °C에서 가장 크다.</desc>
