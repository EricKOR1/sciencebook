    .uearth-10-planet-interiors-n{font-size:12px;fill:var(--fig-muted)}
    .uearth-10-planet-interiors-b{font-size:13px;font-weight:600;fill:var(--fig-ink)}
    .uearth-10-planet-interiors-o{paint-order:stroke;stroke:var(--fig-paper);stroke-width:4px;stroke-linejoin:round}
  </style>
