<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 446" role="img" aria-labelledby="t-uearth-10-planet-interiors d-uearth-10-planet-interiors">
  <title id="t-uearth-10-planet-interiors">그림 일반지구과학 10-9 지구형 행성과 목성형 행성의 내부 구조</title>
  <desc id="d-uearth-10-planet-interiors">행성의 반쪽 단면. 지구형 행성(지구, 수성)은 철·니켈 핵을 규산염 맨틀과 지각이 둘러싸며, 수성은 핵이 반지름의 약 80~85 %를 차지한다. 목성형 행성 가운데 목성은 암석·얼음 핵 둘레를 금속 수소층과 분자 수소·헬륨층이 감싸고, 천왕성·해왕성은 물·암모니아·메탄의 뜨겁고 밀한 유체(얼음 성분) 맨틀이 두껍고 수소·헬륨 외피가 얇다. 행성마다 반지름을 같게 그렸고(실제 목성 반지름은 지구의 약 11배), 층의 경계는 대략값인 모식도.</desc>
