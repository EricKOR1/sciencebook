<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-astro-2-q-remnant-geometry d-astro-2-q-remnant-geometry">
  <title id="t-astro-2-q-remnant-geometry">그림 행성우주과학 2-10 문제 15 초신성 잔해의 팽창을 재는 두 방향</title>
  <desc id="d-astro-2-q-remnant-geometry">공 모양으로 팽창하는 잔해에서 도플러 효과로는 우리 쪽으로 다가오는 앞면의 시선 방향 속력을 재고, 하늘에서 커지는 각반지름은 가장자리의 시선에 수직인 방향 운동을 잰다. 두 방향의 팽창 속력이 같다고 가정해야 시선속도 값을 접선속도 식에 넣을 수 있다. 거리와 크기의 비율은 모식도이다.</desc>
  <style>.astro-2-q-remnant-geometry-t{font-size:14px;fill:var(--fig-ink)} .astro-2-q-remnant-geometry-s{font-size:13px;fill:var(--fig-muted)} .astro-2-q-remnant-geometry-b{font-weight:600} .astro-2-q-remnant-geometry-L{font-size:15px;fill:var(--fig-ink)}</style>
  <circle cx="60" cy="160" r="8" style="fill:var(--fig-blue);stroke:none;stroke-width:1.5"/>
  <text x="60" y="190" text-anchor="middle" class="astro-2-q-remnant-geometry-t">지구</text>
  <circle cx="520" cy="160" r="90" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2"/>
  <line x1="60" y1="160" x2="520" y2="160" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 4"/>
  <line x1="60" y1="160" x2="520" y2="70" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 4"/>
  <path d="M180 160 A 120 120 0 0 0 177.8 137" style="fill:none;stroke:var(--fig-ink);stroke-width:1.4"/>
  <text x="188" y="150" text-anchor="start" class="astro-2-q-remnant-geometry-s">각반지름 200″</text>
  <line x1="430" y1="160" x2="371" y2="160" style="stroke:var(--fig-red);stroke-width:2.6"/>
  <path d="M360 160 L371 164.9 L371 155.1 Z" style="fill:var(--fig-red)"/>
  <text x="394" y="186" text-anchor="middle" class="astro-2-q-remnant-geometry-s" style="fill:var(--fig-red)">앞면의 시선 방향 팽창</text>
  <text x="394" y="204" text-anchor="middle" class="astro-2-q-remnant-geometry-s" style="fill:var(--fig-red)">(도플러 효과로 1500 km/s)</text>
  <line x1="520" y1="70" x2="520" y2="26" style="stroke:var(--fig-green);stroke-width:2.6"/>
  <path d="M520 15 L515 26 L525 26 Z" style="fill:var(--fig-green)"/>
  <text x="530" y="32" text-anchor="start" class="astro-2-q-remnant-geometry-s" style="fill:var(--fig-green)">가장자리의 하늘 면 방향 팽창</text>
  <text x="530" y="50" text-anchor="start" class="astro-2-q-remnant-geometry-s" style="fill:var(--fig-green)">(각반지름이 1년에 0.20″씩 커짐)</text>
  <text x="520" y="274" text-anchor="middle" class="astro-2-q-remnant-geometry-t">잔해</text>
  <text x="20" y="290" text-anchor="start" class="astro-2-q-remnant-geometry-s">시선 방향과 하늘 면 방향의 팽창 속력이 같아야 두 측정을 묶을 수 있다</text>
</svg>
