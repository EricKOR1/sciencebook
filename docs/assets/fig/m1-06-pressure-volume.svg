<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-m1-06-pressure-volume d-m1-06-pressure-volume">
  <title id="t-m1-06-pressure-volume">그림 중1-6-3 기체의 압력과 부피 관계</title>
  <desc id="d-m1-06-pressure-volume">온도가 일정할 때 주사기 속 공기에 가하는 압력을 높이면 부피가 줄어들어, 실험값이 오른쪽 아래로 내려가는 곡선을 이룬다. 입자 모형으로 보면 입자의 수·크기·빠르기는 같고, 입자 사이가 가까워져 벽에 충돌하는 횟수가 많아진다. 노란 표시는 충돌을 나타낸 모식이다.</desc>
