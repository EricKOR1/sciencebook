<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" role="img" aria-labelledby="t-chem-1-q-ch4-o2-reaction d-chem-1-q-ch4-o2-reaction">
  <title id="t-chem-1-q-ch4-o2-reaction">그림 화학 1-7 문제 13 해설 — 메테인과 산소의 반응 전후 입자 모형</title>
  <desc id="d-chem-1-q-ch4-o2-reaction">분자 모형 1개를 0.05 mol로 나타냈다. 반응 전 메테인 6개(0.3 mol)와 산소 10개(0.5 mol)가 있고, 산소 10개가 모두 쓰이는 동안 메테인은 5개만 반응한다. 반응 후에는 메테인 1개(0.05 mol)와 이산화 탄소 5개(0.25 mol)가 기체로 남고, 물 10개는 액체가 된다. 반응 전후 C 6개, H 24개, O 20개로 원자 수가 같다.</desc>
