  <title id="t-umath-4-euler-geometry">그림 수학 도구 4-11 오일러법의 기하적 의미</title>
  <desc id="d-umath-4-euler-geometry">y′ = −y, y(0) = 1을 계단 h = 0.25로 푼 오일러 꺾은선(점 (0, 1), (0.25, 0.75), (0.5, 0.5625), (0.75, 0.4219), (1.0, 0.3164))과 정확한 해 y = e^(−t). 각 계단은 시작점의 기울기로 직선을 그어 나아간다. 첫 계단의 국소 오차는 0.7788 − 0.75 = 0.029, t = 1의 전체 오차는 0.3679 − 0.3164 = 0.0515이다.</desc>
