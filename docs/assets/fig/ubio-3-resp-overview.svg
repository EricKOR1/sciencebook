<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-ubio-3-resp-overview d-ubio-3-resp-overview">
  <title id="t-ubio-3-resp-overview">그림 일반생명과학 3-6 세포호흡의 단계가 일어나는 장소와 산물</title>
  <desc id="d-ubio-3-resp-overview">포도당 1분자 기준. 세포질의 해당 과정이 포도당(6C)을 피루브산(3C) 2분자로 나누며 ATP 2(알짜)와 NADH 2를 만든다. 피루브산은 미토콘드리아 기질로 들어가 아세틸 CoA(2C)가 되며 CO₂ 2와 NADH 2가 나오고, 시트르산 회로 2회전에서 CO₂ 4, NADH 6, FADH₂ 2, ATP(GTP) 2가 나온다. NADH와 FADH₂의 전자는 내막의 전자 전달계를 거쳐 산소에 전달되어 물이 되고, 그 과정에서 만든 H⁺ 기울기로 ATP 합성 효소가 ATP 약 26~28개를 만든다. 합계 약 30~32 ATP. 모식도이다.</desc>
  <defs><marker id="ubio-3-resp-overview-a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-ink)"/></marker><marker id="ubio-3-resp-overview-a-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-muted)"/></marker><marker id="ubio-3-resp-overview-a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-blue)"/></marker><marker id="ubio-3-resp-overview-a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-red)"/></marker><marker id="ubio-3-resp-overview-a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-green)"/></marker><marker id="ubio-3-resp-overview-a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-amber)"/></marker><marker id="ubio-3-resp-overview-a-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-violet)"/></marker><marker id="ubio-3-resp-overview-a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-teal)"/></marker><marker id="ubio-3-resp-overview-a-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-line)"/></marker></defs>
  <style>.ubio-3-resp-overview-t{font-size:14px;fill:var(--fig-ink)} .ubio-3-resp-overview-s{font-size:13px;fill:var(--fig-muted)} .ubio-3-resp-overview-b{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-3-resp-overview-k{font-size:13px;fill:var(--fig-ink)} .ubio-3-resp-overview-ink{font-size:13px;fill:var(--fig-ink);font-weight:700} .ubio-3-resp-overview-muted{font-size:13px;fill:var(--fig-muted);font-weight:700} .ubio-3-resp-overview-blue{font-size:13px;fill:var(--fig-blue);font-weight:700} .ubio-3-resp-overview-red{font-size:13px;fill:var(--fig-red);font-weight:700} .ubio-3-resp-overview-green{font-size:13px;fill:var(--fig-green);font-weight:700} .ubio-3-resp-overview-amber{font-size:13px;fill:var(--fig-amber);font-weight:700} .ubio-3-resp-overview-violet{font-size:13px;fill:var(--fig-violet);font-weight:700} .ubio-3-resp-overview-teal{font-size:13px;fill:var(--fig-teal);font-weight:700} .ubio-3-resp-overview-line{font-size:13px;fill:var(--fig-line);font-weight:700}</style>
  <rect x="6.0" y="30.0" width="708.0" height="394.0" rx="18" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:2;opacity:0.55"/>
