<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-ochem-7-conjugation-mo d-ochem-7-conjugation-mo">
  <title id="t-ochem-7-conjugation-mo">그림 유기화학 7-18 콘주게이션 길이와 HOMO–LUMO 간격</title>
  <desc id="d-ochem-7-conjugation-mo">에텐, 뷰타-1,3-다이엔, 헥사-1,3,5-트라이엔의 π 분자 오비탈 에너지(휘켈 근사 α + 2β cos(kπ/(N+1)), 같은 척도). 채워진 준위에 전자쌍을 그렸다. HOMO–LUMO 간격은 2|β|, 1.24|β|, 0.89|β|로 줄고, 실측 λmax는 약 171, 217, 258 nm로 길어진다. 오른쪽 아래: 콘주게이션 C=C 수에 따른 λmax(1: 171, 2: 217, 3: 258, 11: 450 nm)와 가시광선 영역(400~700 nm).</desc>
