  <text x="88.0" y="176.0" text-anchor="end" class="f2-5-q-strand-composition-lbl">가닥 Ⅱ</text>
  <rect x="100.0" y="62" width="116.0" height="40" class="f2-5-q-strand-composition-A"/>
  <rect x="100.0" y="150" width="116.0" height="40" class="f2-5-q-strand-composition-T"/>
  <text x="158.0" y="87.0" text-anchor="middle" class="f2-5-q-strand-composition-in">A 20 %</text>
  <text x="158.0" y="175.0" text-anchor="middle" class="f2-5-q-strand-composition-in">T 20 %</text>
  <path d="M158.0 106 V146" class="f2-5-q-strand-composition-pr"/>
