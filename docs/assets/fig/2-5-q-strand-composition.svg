  <text x="303.0" y="175.0" text-anchor="middle" class="f2-5-q-strand-composition-in">A 30 %</text>
  <path d="M303.0 106 V146" class="f2-5-q-strand-composition-pr"/>
  <text x="309.0" y="131.0" text-anchor="start" class="f2-5-q-strand-composition-sm">짝</text>
