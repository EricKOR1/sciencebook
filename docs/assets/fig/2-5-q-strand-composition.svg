  <text x="578.5" y="52.0" text-anchor="middle" class="f2-5-q-strand-composition-sm">C = 100 − (20 + 30 + 15) = 35 %</text>
  <text x="390.0" y="256.0" text-anchor="middle" class="f2-5-q-strand-composition-t">가닥 Ⅱ: A 30 %, T 20 %, G 35 %, C 15 % (각 가닥의 염기는 1000개)</text>
</svg>
