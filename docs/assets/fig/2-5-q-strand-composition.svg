<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 272" role="img" aria-labelledby="t-2-5-q-strand-composition d-2-5-q-strand-composition">
  <title id="t-2-5-q-strand-composition">그림 2-5-9 문제 12 두 가닥의 염기 조성</title>
  <desc id="d-2-5-q-strand-composition">가닥 Ⅰ의 염기 A, T, G, C 바로 맞은편에는 가닥 Ⅱ의 T, A, C, G가 짝을 이룬다. 그래서 가닥 Ⅱ의 A 비율은 가닥 Ⅰ의 T 비율과, G 비율은 가닥 Ⅰ의 C 비율과 같다. 막대 길이는 각 가닥 안에서의 비율이다.</desc>
  <style>
    .f2-5-q-strand-composition-t{font-size:14px;fill:var(--fig-ink)} .f2-5-q-strand-composition-sm{font-size:13px;fill:var(--fig-muted)}
    .f2-5-q-strand-composition-lbl{font-size:15px;font-weight:600;fill:var(--fig-ink)} .f2-5-q-strand-composition-in{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .f2-5-q-strand-composition-A{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.4} .f2-5-q-strand-composition-T{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4}
    .f2-5-q-strand-composition-G{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.4} .f2-5-q-strand-composition-C{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.4}
    .f2-5-q-strand-composition-pr{stroke:var(--fig-muted);stroke-width:1.4;stroke-dasharray:4 3;fill:none} .f2-5-q-strand-composition-ax{stroke:var(--fig-line);stroke-width:1}
  </style>
