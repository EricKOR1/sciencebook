  <title id="t-m1-05-buoyancy-scale">그림 중1-5-6 물에 잠긴 정도에 따른 부력</title>
  <desc id="d-m1-05-buoyancy-scale">용수철저울에 매단 물체를 물에 조금씩 더 담그면 잠긴 부피가 커져 부력이 커지므로 눈금이 줄어든다. 완전히 잠긴 뒤에는 더 깊이 넣어도 잠긴 부피가 같아 눈금이 변하지 않는다. 부력 = 공기 중 무게 − 물속 눈금. 숫자는 예시이다.</desc>
