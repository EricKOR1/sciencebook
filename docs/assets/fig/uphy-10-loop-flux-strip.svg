<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="t-uphy-10-loop-flux-strip d-uphy-10-loop-flux-strip">
  <title id="t-uphy-10-loop-flux-strip">그림 일반물리학 10-2 균일하지 않은 자기장의 선속 — 넓이 띠로 나누어 더하기</title>
  <desc id="d-uphy-10-loop-flux-strip">긴 직선 도선 오른쪽에 직사각형 고리가 있다. 도선이 만드는 자기장은 종이에 들어가는 방향이고 도선에서 멀수록 약하다(B는 r에 반비례). 고리를 폭 dr인 띠로 나누면 띠 하나의 선속은 B·a dr이고, 이를 c에서 b까지 더하면(오른쪽 그래프의 넓이) Φ = (μ₀Ia/2π) ln(b/c)이다. 전류가 늘면 유도 전류는 시계 반대 방향으로 흐른다.</desc>
