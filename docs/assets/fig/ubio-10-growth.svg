<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="t-ubio-10-growth d-ubio-10-growth">
  <title id="t-ubio-10-growth">그림 일반생명과학 10-6 뿌리 끝의 1기 생장과 줄기의 2기 생장</title>
  <desc id="d-ubio-10-growth">(가) 뿌리 끝의 세로 단면 모식도: 끝에서부터 뿌리골무, 작은 세포가 분열하는 분열 구역(정단 분열 조직), 세포가 길게 늘어나는 신장 구역, 뿌리털이 나는 성숙 구역이 차례로 놓인다. (나) 3년 자란 나무줄기의 가로 단면 모식도: 가운데 수와 1기 물관부를 2기 물관부(목재)가 둘러싸고, 해마다 춘재와 추재가 나이테를 만든다. 관다발 형성층은 안쪽으로 2기 물관부, 바깥쪽으로 2기 체관부를 만들며, 그 바깥에 코르크 형성층과 코르크가 있다. 관다발 형성층 바깥 전체가 수피이다.</desc>
  <style>.ubio-10-growth-t{font-size:14px;fill:var(--fig-ink)} .ubio-10-growth-b{font-size:14px;fill:var(--fig-ink);font-weight:700} .ubio-10-growth-s{font-size:13px;fill:var(--fig-muted)} .ubio-10-growth-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-10-growth-lead{stroke:var(--fig-muted);stroke-width:1;fill:none}</style>
  <text x="100.0" y="26.0" text-anchor="middle" class="ubio-10-growth-h">(가) 뿌리 끝</text>
