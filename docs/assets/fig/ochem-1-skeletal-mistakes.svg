  <title id="t-ochem-1-skeletal-mistakes">그림 유기화학 1-7 골격 구조식에서 흔한 실수 네 가지</title>
  <desc id="d-ochem-1-skeletal-mistakes">왼쪽은 틀린 그림(빨간 ×), 오른쪽은 바른 그림이다. ① 프로프-1-아인의 sp 탄소 둘레는 꺾지 않고 일직선으로 그린다. ② 헤테로 원자에 붙은 H는 생략하지 않는다(에탄올은 OH). ③ 탄소 하나에 선이 5개면 결합이 5개인 탄소가 되어 틀린다(4개 이하). ④ 뷰테인을 곧은 선 하나로 그리면 탄소 수를 알 수 없으므로 지그재그로 꼭짓점을 보인다.</desc>
