<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="t-m3-04-energy-height d-m3-04-energy-height">
  <title id="t-m3-04-energy-height">그림 중3-4-3 떨어지는 공의 높이에 따른 에너지와 속력</title>
  <desc id="d-m3-04-energy-height">질량 2 kg인 공을 10 m 높이에서 가만히 떨어뜨릴 때(지면 기준, 공기 저항 무시) 높이에 따른 위치 에너지, 운동 에너지, 역학적 에너지와 속력을 나타낸 그래프이다. 위치 에너지와 운동 에너지는 높이에 따라 직선으로 바뀌고 그 합은 196 J로 일정하지만, 속력은 높이에 따라 일정하게 늘지 않고 곡선을 그린다.</desc>
