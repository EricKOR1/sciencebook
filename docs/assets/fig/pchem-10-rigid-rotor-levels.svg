<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-pchem-10-rigid-rotor-levels d-pchem-10-rigid-rotor-levels">
  <title id="t-pchem-10-rigid-rotor-levels">그림 물리화학 10-2 강체 회전자의 준위와 순수 회전 스펙트럼</title>
  <desc id="d-pchem-10-rigid-rotor-levels">왼쪽: 이원자 분자의 회전 준위 F(J) = BJ(J+1)을 J = 0~5에 대해 실제 비율(0, 2B, 6B, 12B, 20B, 30B)로 그렸고, 축퇴도는 2J+1이다. ΔJ = +1 흡수 전이의 에너지는 2B, 4B, 6B, 8B, 10B로 하나씩 2B만큼 커진다. 오른쪽: 그 전이들이 만드는 스펙트럼 선은 파수 2B, 4B, …, 10B에 간격 2B로 늘어선다(막대 높이는 같게 두었다. 실제 세기는 개체 수 분포를 따른다).</desc>
