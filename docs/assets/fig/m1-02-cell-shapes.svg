<text x="80.0" y="128" text-anchor="middle" class="m102s-sm">위에서</text><text x="160.0" y="128" text-anchor="middle" class="m102s-sm">옆에서</text>
<text x="20" y="154" class="m102s-name">적혈구</text><rect x="182" y="139" width="40" height="20" rx="10" class="m102s-taga"/><text x="202" y="154" text-anchor="middle" class="m102s-tagt">동물</text>
