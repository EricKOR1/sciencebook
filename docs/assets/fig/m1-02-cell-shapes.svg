<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 466" role="img" aria-labelledby="t-m1-02-cell-shapes d-m1-02-cell-shapes">
<title id="t-m1-02-cell-shapes">그림 중1-2-2 여러 가지 세포의 모양과 기능</title>
<desc id="d-m1-02-cell-shapes">적혈구, 신경세포, 상피세포, 근육세포, 뿌리털 세포, 공변세포는 모양이 서로 다르며, 각 모양은 그 세포가 하는 일에 알맞다. 모식도(세포마다 확대 배율이 다름).</desc>
<style>
  .m102s-box{fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1}
  .m102s-name{font-size:15px;font-weight:700;fill:var(--fig-ink)} .m102s-fn{font-size:13px;fill:var(--fig-accent);font-weight:600}
  .m102s-sm{font-size:13px;fill:var(--fig-muted)}
  .m102s-rbc{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2} .m102s-rbcin{fill:none;stroke:var(--fig-red);stroke-width:1.2;stroke-dasharray:3 3}
  .m102s-nrv{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2;stroke-linejoin:round}
  .m102s-nrvl{fill:none;stroke:var(--fig-violet);stroke-width:2.2;stroke-linecap:round} .m102s-nrvl2{fill:none;stroke:var(--fig-violet);stroke-width:4;stroke-linecap:round}
  .m102s-nuc{fill:var(--fig-violet)} .m102s-nuca{fill:var(--fig-amber)} .m102s-nucb{fill:var(--fig-blue)} .m102s-nucg{fill:var(--fig-green)}
  .m102s-epi{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6}
  .m102s-mus{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.8}
  .m102s-arr{fill:none;stroke:var(--fig-ink);stroke-width:1.6} .m102s-arrh{fill:var(--fig-ink)}
  .m102s-pl{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.8;stroke-linejoin:round}
  .m102s-soil{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1}
  .m102s-epi2{fill:var(--fig-panel);stroke:var(--fig-green);stroke-width:1.2}
  .m102s-stoma{fill:var(--fig-paper);stroke:var(--fig-green);stroke-width:1.2}
  .m102s-chl{fill:var(--fig-green)}
  .m102s-taga{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1} .m102s-tagp{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1} .m102s-tagt{font-size:13px;fill:var(--fig-ink)}
</style>
