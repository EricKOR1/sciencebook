<path d="M594.0 260 C550.0 260 550.0 324 594.0 324 C580.0 310 580.0 274 594.0 260 Z" class="m102s-pl"/><circle cx="574.0" cy="280" r="2.8" class="m102s-chl"/><circle cx="570.0" cy="296" r="2.8" class="m102s-chl"/><circle cx="575.0" cy="310" r="2.8" class="m102s-chl"/><path d="M594.0 260 C638.0 260 638.0 324 594.0 324 C608.0 310 608.0 274 594.0 260 Z" class="m102s-pl"/><circle cx="614.0" cy="280" r="2.8" class="m102s-chl"/><circle cx="618.0" cy="296" r="2.8" class="m102s-chl"/><circle cx="613.0" cy="310" r="2.8" class="m102s-chl"/>
<text x="594.0" y="354" text-anchor="middle" class="m102s-sm">가운데 틈 = 기공</text>
<text x="494" y="374" class="m102s-name">공변세포</text><rect x="656" y="359" width="40" height="20" rx="10" class="m102s-tagp"/><text x="676" y="374" text-anchor="middle" class="m102s-tagt">식물</text>
<text x="494" y="394" class="m102s-fn">기공을 열고 닫음</text>
<text x="494" y="414" class="m102s-sm">짝을 이룬 반달 모양이</text>
<text x="494" y="432" class="m102s-sm">변하며 기공을 조절한다</text>
<text x="360" y="456" text-anchor="middle" class="m102s-sm">모식도 — 세포마다 확대한 배율이 다르다</text>
</svg>
