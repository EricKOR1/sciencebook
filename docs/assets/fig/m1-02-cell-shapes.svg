<text x="20" y="194" class="m102s-sm">가운데가 오목한 원반:</text>
<text x="20" y="212" class="m102s-sm">표면이 넓고 잘 휘어진다</text>
<rect x="243" y="6" width="228" height="212" rx="10" class="m102s-box"/>
