<text x="376.0" y="104" text-anchor="middle" class="m102s-sm">매우 긴 돌기 →</text>
<text x="257" y="154" class="m102s-name">신경세포</text><rect x="419" y="139" width="40" height="20" rx="10" class="m102s-taga"/><text x="439" y="154" text-anchor="middle" class="m102s-tagt">동물</text>
<text x="257" y="174" class="m102s-fn">신호 전달</text>
<text x="257" y="194" class="m102s-sm">길게 뻗은 돌기로</text>
<text x="257" y="212" class="m102s-sm">먼 곳까지 신호를 보낸다</text>
<rect x="480" y="6" width="228" height="212" rx="10" class="m102s-box"/>
<rect x="503.0" y="47.0" width="26" height="58" class="m102s-epi"/><circle cx="516.0" cy="84" r="5" class="m102s-nucb"/><rect x="529.0" y="47.0" width="26" height="58" class="m102s-epi"/><circle cx="542.0" cy="84" r="5" class="m102s-nucb"/><rect x="555.0" y="47.0" width="26" height="58" class="m102s-epi"/><circle cx="568.0" cy="84" r="5" class="m102s-nucb"/><rect x="581.0" y="47.0" width="26" height="58" class="m102s-epi"/><circle cx="594.0" cy="84" r="5" class="m102s-nucb"/><rect x="607.0" y="47.0" width="26" height="58" class="m102s-epi"/><circle cx="620.0" cy="84" r="5" class="m102s-nucb"/><rect x="633.0" y="47.0" width="26" height="58" class="m102s-epi"/><circle cx="646.0" cy="84" r="5" class="m102s-nucb"/><rect x="659.0" y="47.0" width="26" height="58" class="m102s-epi"/><circle cx="672.0" cy="84" r="5" class="m102s-nucb"/>
<text x="594.0" y="36" text-anchor="middle" class="m102s-sm">몸의 바깥쪽</text>
<text x="494" y="154" class="m102s-name">상피세포</text><rect x="656" y="139" width="40" height="20" rx="10" class="m102s-taga"/><text x="676" y="154" text-anchor="middle" class="m102s-tagt">동물</text>
<text x="494" y="174" class="m102s-fn">몸의 겉면 보호</text>
<text x="494" y="194" class="m102s-sm">빈틈없이 붙어 있어</text>
<text x="494" y="212" class="m102s-sm">병균이 들어오기 어렵다</text>
<rect x="6" y="226" width="228" height="212" rx="10" class="m102s-box"/>
<path d="M36.0 266 Q120.0 253 204.0 266 Q120.0 279 36.0 266 Z" class="m102s-mus"/><ellipse cx="106.0" cy="266" rx="7" ry="3" class="m102s-nuca"/>
