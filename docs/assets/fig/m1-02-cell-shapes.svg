<text x="120.0" y="344" text-anchor="middle" class="m102s-sm">수축</text>
<text x="20" y="374" class="m102s-name">근육세포</text><rect x="182" y="359" width="40" height="20" rx="10" class="m102s-taga"/><text x="202" y="374" text-anchor="middle" class="m102s-tagt">동물</text>
<text x="20" y="394" class="m102s-fn">수축하여 몸을 움직임</text>
<text x="20" y="414" class="m102s-sm">가늘고 길어 길이 방향으로</text>
<text x="20" y="432" class="m102s-sm">줄어들며 힘을 낸다</text>
<rect x="243" y="226" width="228" height="212" rx="10" class="m102s-box"/>
<circle cx="387.0" cy="256" r="13" class="m102s-soil"/><circle cx="419.0" cy="282" r="15" class="m102s-soil"/><circle cx="391.0" cy="310" r="12" class="m102s-soil"/><circle cx="445.0" cy="314" r="11" class="m102s-soil"/><circle cx="451.0" cy="258" r="12" class="m102s-soil"/><circle cx="349.0" cy="322" r="10" class="m102s-soil"/>
<path d="M261 270 L317 270 L317 284 C351 284 391 286 439 290 C447 292 447 300 439 301 C391 304 351 304 317 304 L317 318 L261 318 Z" class="m102s-pl"/><circle cx="289" cy="294" r="7" class="m102s-nucg"/>
<text x="289" y="260" text-anchor="middle" class="m102s-sm">뿌리 표피</text><text x="407.0" y="348" text-anchor="middle" class="m102s-sm">흙 알갱이</text>
<text x="257" y="374" class="m102s-name">뿌리털 세포</text><rect x="419" y="359" width="40" height="20" rx="10" class="m102s-tagp"/><text x="439" y="374" text-anchor="middle" class="m102s-tagt">식물</text>
<text x="257" y="394" class="m102s-fn">물과 양분 흡수</text>
<text x="257" y="414" class="m102s-sm">털처럼 길게 뻗어</text>
<text x="257" y="432" class="m102s-sm">흙과 닿는 면이 넓다</text>
<rect x="480" y="226" width="228" height="212" rx="10" class="m102s-box"/>
<rect x="498.0" y="244" width="52" height="40" rx="4" class="m102s-epi2"/><rect x="498.0" y="296" width="52" height="44" rx="4" class="m102s-epi2"/><rect x="638.0" y="244" width="52" height="40" rx="4" class="m102s-epi2"/><rect x="638.0" y="296" width="52" height="44" rx="4" class="m102s-epi2"/><rect x="554.0" y="238" width="80" height="18" rx="4" class="m102s-epi2"/>
