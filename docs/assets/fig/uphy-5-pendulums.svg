<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-uphy-5-pendulums d-uphy-5-pendulums">
  <title id="t-uphy-5-pendulums">그림 일반물리학 5-6 단진자와 물리 진자의 복원 토크</title>
  <desc id="d-uphy-5-pendulums">왼쪽: 단진자의 추에 작용하는 중력 mg를 줄 방향(mg cos θ)과 운동 방향(mg sin θ)으로 나누면, 운동 방향 성분이 추를 평형 위치로 되돌린다. 받침점에 대한 토크는 −mgL sin θ이다. 오른쪽: 물리 진자에서는 축 O에서 질량 중심까지 거리 d, 지레팔 d sin θ로 중력의 토크 −Mgd sin θ가 생긴다.</desc>
