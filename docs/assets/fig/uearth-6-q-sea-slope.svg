<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-uearth-6-q-sea-slope d-uearth-6-q-sea-slope">
<title id="t-uearth-6-q-sea-slope">그림 일반지구과학 6-13 문제 7의 해수면 경사(남–북 단면)</title>
<desc id="d-uearth-6-q-sea-slope">북위 40°에서 해류를 남–북으로 가로질러 자른 단면이다. 100 km 사이에서 해수면은 북쪽이 0.5 m 높다. 높이 차는 크게 과장했다.</desc>
<style>
.uearth-6-q-sea-slope-t{font-size:14px;fill:var(--fig-ink)} .uearth-6-q-sea-slope-s{font-size:13px;fill:var(--fig-muted)} .uearth-6-q-sea-slope-b{font-size:15px;fill:var(--fig-ink);font-weight:700} .uearth-6-q-sea-slope-k{font-size:14px;fill:var(--fig-ink);font-weight:700}
</style>
<rect x="0" y="0" width="720" height="300" style="fill:var(--fig-paper)"/>
<path d="M110.0 140.0 L610.0 92.0 L610.0 250.0 L110.0 250.0 Z" style="fill:var(--fig-soft-blue);stroke:none;stroke-width:0;stroke-linejoin:round"/>
<line x1="110.0" y1="140.0" x2="610.0" y2="92.0" style="stroke:var(--fig-blue);stroke-width:2.5"/>
<line x1="80.0" y1="140.0" x2="660.0" y2="140.0" style="stroke:var(--fig-muted);stroke-width:1;stroke-dasharray:5 4"/>
<line x1="600.0" y1="92.0" x2="660.0" y2="92.0" style="stroke:var(--fig-muted);stroke-width:1;stroke-dasharray:5 4"/>
<line x1="650.0" y1="135.1" x2="650.0" y2="96.9" style="stroke:var(--fig-ink);stroke-width:1.3"/>
<path d="M0 0 l-7 -3.5 l0 7.0 z" transform="translate(650.0,92.0) rotate(-90.0)" style="fill:var(--fig-ink)"/>
<path d="M0 0 l-7 -3.5 l0 7.0 z" transform="translate(650.0,140.0) rotate(90.0)" style="fill:var(--fig-ink)"/>
<text x="660.0" y="121.0" class="uearth-6-q-sea-slope-k">0.5 m</text>
<line x1="114.9" y1="270.0" x2="605.1" y2="270.0" style="stroke:var(--fig-ink);stroke-width:1.3"/>
<path d="M0 0 l-7 -3.5 l0 7.0 z" transform="translate(610.0,270.0) rotate(0.0)" style="fill:var(--fig-ink)"/>
<path d="M0 0 l-7 -3.5 l0 7.0 z" transform="translate(110.0,270.0) rotate(180.0)" style="fill:var(--fig-ink)"/>
<text x="360.0" y="264.0" text-anchor="middle" class="uearth-6-q-sea-slope-k">100 km</text>
<line x1="110.0" y1="250.0" x2="110.0" y2="278.0" style="stroke:var(--fig-muted);stroke-width:1;stroke-dasharray:3 3"/>
<line x1="610.0" y1="250.0" x2="610.0" y2="278.0" style="stroke:var(--fig-muted);stroke-width:1;stroke-dasharray:3 3"/>
<text x="96.0" y="200.0" text-anchor="end" class="uearth-6-q-sea-slope-b">남</text>
<text x="624.0" y="200.0" class="uearth-6-q-sea-slope-b">북</text>
<text x="360.0" y="104.0" text-anchor="middle" class="uearth-6-q-sea-slope-t" style="fill:var(--fig-blue)">해수면</text>
<text x="360.0" y="200.0" text-anchor="middle" class="uearth-6-q-sea-slope-s">바다 (북위 40°, 북반구)</text>
<text x="110.0" y="40.0" class="uearth-6-q-sea-slope-s">단면을 동쪽에서 바라본 모습: 왼쪽이 남, 오른쪽이 북</text>
</svg>
