  <title id="t-mech-3-q-tube-modes">그림 역학과 에너지 3-10 문제 7 해설의 닫힌 관과 열린 관의 정상파</title>
  <desc id="d-mech-3-q-tube-modes">길이 0.85 m인 관 속 공기 기둥의 가장 낮은 두 정상파를 공기 분자 변위의 진폭으로 나타냈다. 막힌 끝은 마디, 열린 끝은 배이다. 닫힌 관은 L = λ/4, 3λ/4(100 Hz, 300 Hz), 열린 관은 L = λ/2, λ(200 Hz, 400 Hz)이다.</desc>
