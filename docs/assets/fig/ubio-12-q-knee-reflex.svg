<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-ubio-12-q-knee-reflex d-ubio-12-q-knee-reflex">
  <title id="t-ubio-12-q-knee-reflex">그림 일반생명과학 12-13 문제 13의 무릎 반사 경로</title>
  <desc id="d-ubio-12-q-knee-reflex">무릎 아래 힘줄을 두드리면 넓적다리 앞쪽 근육의 근방추에서 시작한 신호가 감각 뉴런을 따라 척수로 가고, 척수 안의 시냅스 하나를 거쳐 운동 뉴런을 따라 같은 근육의 신경근 접합부에 이른다. 경로 길이, 전도 속도, 지연 시간은 문제에 주어진 값이다. 척수와 다리의 크기 비율은 실제와 다른 모식도이다.</desc>
