  <text x="539.0" y="215.0" text-anchor="end" class="b3hom-b">B</text>
  <text x="581.0" y="215.0" class="b3hom-b">B</text>
  <line x1="447.0" y1="220.0" x2="470.0" y2="300.0" class="b3hom-lead"/>
  <text x="474.0" y="304.0" class="b3hom-b">염색 분체</text>
  <text x="474.0" y="320.0" class="b3hom-sm">복제로 생겨 유전 정보가 같다</text>
  <line x1="566.0" y1="136.5" x2="640.0" y2="120.0" class="b3hom-lead"/>
  <text x="644.0" y="116.0" class="b3hom-b">동원체</text>
  <path d="M418 52 L418 46 L582 46 L582 52" style="fill:none;stroke:var(--fig-muted);stroke-width:1.4"/>
  <text x="660.0" y="196.0" text-anchor="middle" class="b3hom-b">상동 염색체</text>
  <text x="660.0" y="214.0" text-anchor="middle" class="b3hom-sm">= 염색체 2개</text>
  <text x="660.0" y="232.0" text-anchor="middle" class="b3hom-sm">(X자 모양 하나가</text>
  <text x="660.0" y="248.0" text-anchor="middle" class="b3hom-sm">염색체 1개)</text>
  <text x="500.0" y="346.0" text-anchor="middle" class="b3hom-sm">같은 위치의 A와 a는 대립유전자 — 상동 염색체끼리는 다를 수 있다</text>
  <text x="140.0" y="346.0" text-anchor="middle" class="b3hom-sm">가로선: 유전자의 위치</text>

</svg>
