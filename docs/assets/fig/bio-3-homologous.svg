<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 362" role="img" aria-labelledby="t-bio-3-homologous d-bio-3-homologous">
  <title id="t-bio-3-homologous">그림 생명과학 3-4 상동 염색체, 염색 분체, 대립유전자</title>
  <desc id="d-bio-3-homologous">(가) 아버지와 어머니에게서 하나씩 받은 상동 염색체 한 쌍으로, 같은 위치에 대립유전자(A와 a, B와 B)가 있다. (나) S기에 복제되면 각 염색체는 동원체에서 붙은 염색 분체 2개로 이루어진 X자 모양이 되며, 두 염색 분체의 유전 정보는 같다. 모식도.</desc>
  <style>
    .b3hom-lbl{font-size:13.5px;fill:var(--fig-ink)} .b3hom-b{font-size:14.5px;font-weight:700;fill:var(--fig-ink)}
    .b3hom-sm{font-size:12.5px;fill:var(--fig-muted)} .b3hom-lead{fill:none;stroke:var(--fig-muted);stroke-width:1.1}
    .b3hom-ink{fill:var(--fig-ink)} .b3hom-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.6}
    
  </style>
  <text x="140.0" y="30.0" text-anchor="middle" class="b3hom-b">(가) 복제 전 (G₁기)</text>
  <text x="500.0" y="30.0" text-anchor="middle" class="b3hom-b">(나) 복제 후 (G₂기·분열기)</text>
  <line x1="110.0" y1="70.0" x2="110.0" y2="260.0" style="stroke:var(--fig-blue);stroke-width:9;stroke-linecap:round"/>
  <circle cx="110" cy="136.5" r="4" style="fill:var(--fig-ink)"/>
  <line x1="101" y1="100" x2="119" y2="100" style="stroke:var(--fig-ink);stroke-width:2"/>
