  <line x1="101" y1="210" x2="119" y2="210" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="96.0" y="215.0" text-anchor="end" class="b3hom-b">B</text>
  <line x1="170.0" y1="70.0" x2="170.0" y2="260.0" style="stroke:var(--fig-red);stroke-width:9;stroke-linecap:round"/>
  <circle cx="170" cy="136.5" r="4" style="fill:var(--fig-ink)"/>
  <line x1="161" y1="100" x2="179" y2="100" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="184.0" y="105.0" class="b3hom-b">a</text>
  <line x1="161" y1="210" x2="179" y2="210" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="184.0" y="215.0" class="b3hom-b">B</text>
  <text x="110.0" y="286.0" text-anchor="middle" class="b3hom-sm">아버지에게서</text>
  <text x="170.0" y="286.0" text-anchor="middle" class="b3hom-sm">어머니에게서</text>
  <path d="M96 298 L96 306 L184 306 L184 298" style="fill:none;stroke:var(--fig-muted);stroke-width:1.4"/>
  <text x="140.0" y="324.0" text-anchor="middle" class="b3hom-lbl">상동 염색체 한 쌍</text>
  <line x1="240.0" y1="160.0" x2="321.0" y2="160.0" style="fill:none;stroke:var(--fig-ink);stroke-width:2.4"/>
  <path d="M330.0 160.0 L321.0 164.5 L321.0 155.5 Z" style="fill:var(--fig-ink)"/>
