<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 464.8" role="img" aria-labelledby="t-phy-3-hydrogen-levels d-phy-3-hydrogen-levels">
  <title id="t-phy-3-hydrogen-levels">그림 물리학 3-8 수소 원자의 에너지 준위와 선 스펙트럼</title>
  <desc id="d-phy-3-hydrogen-levels">전자가 높은 준위에서 n = 2로 전이하면 656, 486, 434, 410 nm의 가시광선 광자가 나와 수소의 선 스펙트럼을 이룬다. n = 1로 떨어지면 자외선, n = 3으로 떨어지면 적외선이 나온다.</desc>
  <style>
    .phy-3-hydrogen-levels-lbl{font-size:14px;fill:var(--fig-ink)} .phy-3-hydrogen-levels-sm{font-size:13px;fill:var(--fig-muted)} .phy-3-hydrogen-levels-b{font-weight:600}
    .phy-3-hydrogen-levels-ax{stroke:var(--fig-ink);stroke-width:1.5;fill:none} .phy-3-hydrogen-levels-grid{stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 3;fill:none}
  </style>
<line x1="100" y1="46" x2="100" y2="324.8" class="phy-3-hydrogen-levels-ax"/><path d="M92 328.8 l16 -6 M92 336.8 l16 -6" style="stroke:var(--fig-ink);stroke-width:1.5;fill:none"/><line x1="100" y1="340.8" x2="100" y2="434.8" class="phy-3-hydrogen-levels-ax"/><text x="100.0" y="38.0" text-anchor="middle" class="phy-3-hydrogen-levels-sm">에너지 (eV)</text>
<line x1="150" y1="60" x2="420" y2="60" style="stroke:var(--fig-ink);stroke-width:1.5;stroke-dasharray:5 4"/><text x="428.0" y="64.0" text-anchor="start" class="phy-3-hydrogen-levels-sm">n = ∞  0 eV</text>
<line x1="150" y1="424.8" x2="420" y2="424.8" style="stroke:var(--fig-ink);stroke-width:2.2"/><text x="428.0" y="428.8" text-anchor="start" class="phy-3-hydrogen-levels-sm">n = 1  −13.6 eV (바닥상태)</text>
<line x1="150" y1="291.2" x2="420" y2="291.2" style="stroke:var(--fig-ink);stroke-width:2.2"/><text x="428.0" y="295.2" text-anchor="start" class="phy-3-hydrogen-levels-sm">n = 2  −3.40 eV</text>
<line x1="150" y1="162.8" x2="420" y2="162.8" style="stroke:var(--fig-ink);stroke-width:2.2"/><text x="428.0" y="166.8" text-anchor="start" class="phy-3-hydrogen-levels-sm">n = 3  −1.51 eV</text>
<line x1="150" y1="117.8" x2="420" y2="117.8" style="stroke:var(--fig-ink);stroke-width:2.2"/><text x="428.0" y="121.8" text-anchor="start" class="phy-3-hydrogen-levels-sm">n = 4  −0.85 eV</text>
<line x1="150" y1="97.0" x2="420" y2="97.0" style="stroke:var(--fig-ink);stroke-width:1.4"/><text x="428.0" y="103.0" text-anchor="start" class="phy-3-hydrogen-levels-sm">n = 5, 6 …</text>
<line x1="150" y1="85.7" x2="420" y2="85.7" style="stroke:var(--fig-ink);stroke-width:1.4"/><text x="100.0" y="384.8" text-anchor="middle" class="phy-3-hydrogen-levels-sm" transform="rotate(-90 88 384)">(중간 생략)</text>
<line x1="300" y1="162.8" x2="300" y2="282.2" style="stroke:#e8402c;stroke-width:3"/><path d="M300 291.2 l-5 -10 l10 0 z" style="fill:#e8402c"/><text x="300.0" y="309.2" text-anchor="middle" class="phy-3-hydrogen-levels-sm">656</text>
<line x1="326" y1="117.8" x2="326" y2="282.2" style="stroke:#21b5c9;stroke-width:3"/><path d="M326 291.2 l-5 -10 l10 0 z" style="fill:#21b5c9"/><text x="326.0" y="309.2" text-anchor="middle" class="phy-3-hydrogen-levels-sm">486</text>
<line x1="352" y1="97.0" x2="352" y2="282.2" style="stroke:#4a5be8;stroke-width:3"/><path d="M352 291.2 l-5 -10 l10 0 z" style="fill:#4a5be8"/><text x="352.0" y="309.2" text-anchor="middle" class="phy-3-hydrogen-levels-sm">434</text>
<line x1="378" y1="85.7" x2="378" y2="282.2" style="stroke:#8a3fd6;stroke-width:3"/><path d="M378 291.2 l-5 -10 l10 0 z" style="fill:#8a3fd6"/><text x="378.0" y="309.2" text-anchor="middle" class="phy-3-hydrogen-levels-sm">410</text>
<text x="339.0" y="325.2" text-anchor="middle" class="phy-3-hydrogen-levels-lbl phy-3-hydrogen-levels-b">발머 계열: 가시광선 (nm)</text>
<line x1="175" y1="291.2" x2="175" y2="324.8" style="stroke:var(--fig-violet);stroke-width:2"/><line x1="175" y1="340.8" x2="175" y2="415.8" style="stroke:var(--fig-violet);stroke-width:2"/><path d="M175 424.8 l-5 -10 l10 0 z" style="fill:var(--fig-violet)"/><line x1="197" y1="162.8" x2="197" y2="324.8" style="stroke:var(--fig-violet);stroke-width:2"/><line x1="197" y1="340.8" x2="197" y2="415.8" style="stroke:var(--fig-violet);stroke-width:2"/><path d="M197 424.8 l-5 -10 l10 0 z" style="fill:var(--fig-violet)"/><line x1="219" y1="117.8" x2="219" y2="324.8" style="stroke:var(--fig-violet);stroke-width:2"/><line x1="219" y1="340.8" x2="219" y2="415.8" style="stroke:var(--fig-violet);stroke-width:2"/><path d="M219 424.8 l-5 -10 l10 0 z" style="fill:var(--fig-violet)"/><text x="197.0" y="444.8" text-anchor="middle" class="phy-3-hydrogen-levels-lbl phy-3-hydrogen-levels-b" style="fill:var(--fig-violet)">라이먼 계열: 자외선</text>
<line x1="392" y1="117.8" x2="392" y2="154.8" style="stroke:var(--fig-red);stroke-width:2"/><path d="M392 162.8 l-4 -8 l8 0 z" style="fill:var(--fig-red)"/><line x1="408" y1="97.0" x2="408" y2="154.8" style="stroke:var(--fig-red);stroke-width:2"/><path d="M408 162.8 l-4 -8 l8 0 z" style="fill:var(--fig-red)"/><text x="402.0" y="178.8" text-anchor="middle" class="phy-3-hydrogen-levels-sm" style="fill:var(--fig-red)">적외선</text>
<text x="630.0" y="110.0" text-anchor="middle" class="phy-3-hydrogen-levels-lbl phy-3-hydrogen-levels-b">수소의 선 스펙트럼</text>
<text x="630.0" y="128.0" text-anchor="middle" class="phy-3-hydrogen-levels-sm">(가시광선 부분)</text>
