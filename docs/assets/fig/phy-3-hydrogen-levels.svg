<line x1="606.7" y1="210" x2="606.7" y2="216" style="stroke:var(--fig-muted);stroke-width:1"/><text x="606.7" y="230.0" text-anchor="middle" class="phy-3-hydrogen-levels-sm">500</text>
<line x1="653.3" y1="210" x2="653.3" y2="216" style="stroke:var(--fig-muted);stroke-width:1"/><text x="653.3" y="230.0" text-anchor="middle" class="phy-3-hydrogen-levels-sm">600</text>
<line x1="700.0" y1="210" x2="700.0" y2="216" style="stroke:var(--fig-muted);stroke-width:1"/><text x="700.0" y="230.0" text-anchor="middle" class="phy-3-hydrogen-levels-sm">700</text>
<text x="630.0" y="248.0" text-anchor="middle" class="phy-3-hydrogen-levels-sm">파장 (nm)</text>
<text x="630.0" y="280.0" text-anchor="middle" class="phy-3-hydrogen-levels-sm">선 하나 = 두 준위의</text>
<text x="630.0" y="297.0" text-anchor="middle" class="phy-3-hydrogen-levels-sm">에너지 차이만큼의 광자</text>
<text x="623.0" y="335.0" text-anchor="middle" class="phy-3-hydrogen-levels-sm">에너지 간격: n = 2 위쪽은 실제 비율,</text>
<text x="630.0" y="352.0" text-anchor="middle" class="phy-3-hydrogen-levels-sm">n = 1까지는 줄여 그렸다</text>
</svg>
