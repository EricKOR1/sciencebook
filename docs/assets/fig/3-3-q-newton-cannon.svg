<title id="t-3-3-q-newton-cannon">그림 3-3-6 문제 7의 뉴턴의 대포</title>
<desc id="d-3-3-q-newton-cannon">높은 산 위에서 수평으로 쏜 대포알 A, B, C가 지나는 길이다. A와 B는 지면에 떨어지고, C는 지구를 한 바퀴 돌아 제자리로 돌아온다(공기 저항 무시). 산의 높이는 크게 과장했다.</desc>
