<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-uphy-8-coulomb-vectors d-uphy-8-coulomb-vectors">
  <title id="t-uphy-8-coulomb-vectors">그림 일반물리학 8-4 세 전하의 합력을 성분으로 더하기(예제 2)</title>
  <desc id="d-uphy-8-coulomb-vectors">원점의 q₁ = +2.0 μC이 (0.30 m, 0)의 q₂ = −3.0 μC에게서 받는 인력 0.599 N은 +x 방향, (0, 0.40 m)의 q₃ = +4.0 μC에게서 받는 척력 0.450 N은 −y 방향이다. 두 힘을 성분으로 더한 합력은 크기 0.749 N, +x축에서 아래로 36.9°이다. 위치와 힘의 길이는 각각 비율대로 그렸다.</desc>
  <style>.uphy-8-coulomb-vectors-t{font-size:14px;fill:var(--fig-ink)} .uphy-8-coulomb-vectors-b{font-size:14px;fill:var(--fig-ink);font-weight:700} .uphy-8-coulomb-vectors-s{font-size:13px;fill:var(--fig-muted)} .uphy-8-coulomb-vectors-ax{stroke:var(--fig-ink);stroke-width:1.5;fill:none} .uphy-8-coulomb-vectors-grid{stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4;fill:none}</style>
  <line x1="100" y1="280" x2="442" y2="280" style="stroke:var(--fig-muted);stroke-width:1.4"/>
  <path d="M450 280 L441 284.1 L441 275.9 Z" style="fill:var(--fig-muted)"/>
  <line x1="150" y1="410" x2="150" y2="34" style="stroke:var(--fig-muted);stroke-width:1.4"/>
  <path d="M150 26 L154.1 35 L145.9 35 Z" style="fill:var(--fig-muted)"/>
  <text x="450" y="272" text-anchor="end" class="uphy-8-coulomb-vectors-s">x</text>
  <text x="158" y="34" class="uphy-8-coulomb-vectors-s">y</text>
  <line x1="150" y1="40" x2="144" y2="40" style="stroke:var(--fig-muted);stroke-width:1"/>
  <circle cx="150" cy="280" r="15" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2"/>
  <text x="150" y="285" text-anchor="middle" class="uphy-8-coulomb-vectors-b" style="fill:var(--fig-red)">+</text>
  <circle cx="330" cy="280" r="15" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <text x="330" y="285" text-anchor="middle" class="uphy-8-coulomb-vectors-b" style="fill:var(--fig-blue)">−</text>
  <circle cx="150" cy="40" r="15" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2"/>
  <text x="150" y="45" text-anchor="middle" class="uphy-8-coulomb-vectors-b" style="fill:var(--fig-red)">+</text>
  <text x="128" y="266" text-anchor="end" class="uphy-8-coulomb-vectors-t">q₁ +2.0 μC</text>
  <text x="128" y="284" text-anchor="end" class="uphy-8-coulomb-vectors-s">원점</text>
  <text x="330" y="256" text-anchor="middle" class="uphy-8-coulomb-vectors-t">q₂ −3.0 μC</text>
  <text x="330" y="316" text-anchor="middle" class="uphy-8-coulomb-vectors-s">(0.30 m, 0)</text>
  <text x="174" y="45" class="uphy-8-coulomb-vectors-t">q₃ +4.0 μC  (0, 0.40 m)</text>
  <line x1="269.9" y1="280" x2="269.9" y2="369.9" style="stroke:var(--fig-muted);stroke-width:1.2;stroke-dasharray:5 4"/>
  <line x1="150" y1="369.9" x2="269.9" y2="369.9" style="stroke:var(--fig-muted);stroke-width:1.2;stroke-dasharray:5 4"/>
  <line x1="165" y1="280" x2="258.9" y2="280" style="stroke:var(--fig-accent);stroke-width:3"/>
  <path d="M269.9 280 L257.9 285.4 L257.9 274.6 Z" style="fill:var(--fig-accent)"/>
  <line x1="150" y1="295" x2="150" y2="358.9" style="stroke:var(--fig-accent);stroke-width:3"/>
  <path d="M150 369.9 L144.6 357.9 L155.4 357.9 Z" style="fill:var(--fig-accent)"/>
  <line x1="161" y1="288" x2="260.3" y2="362.7" style="stroke:var(--fig-red);stroke-width:3.4"/>
  <path d="M269.9 369.9 L256 366.8 L263 357.4 Z" style="fill:var(--fig-red)"/>
  <text x="267.9" y="270" text-anchor="end" class="uphy-8-coulomb-vectors-t" style="fill:var(--fig-accent)">F₁₂ = 0.599 N</text>
  <text x="142" y="365.9" text-anchor="end" class="uphy-8-coulomb-vectors-t" style="fill:var(--fig-accent)">F₁₃ = 0.450 N</text>
  <text x="277.9" y="375.9" class="uphy-8-coulomb-vectors-b" style="fill:var(--fig-red)">F = 0.749 N</text>
  <path d="M196 280 A46 46 0 0 1 186.8 307.6" style="stroke:var(--fig-ink);stroke-width:1.2;fill:none"/>
  <text x="202" y="306" class="uphy-8-coulomb-vectors-s">36.9°</text>
  <text x="430" y="80" class="uphy-8-coulomb-vectors-t">① 각 쌍의 힘 크기: k|q₁q|/r²</text>
  <text x="430" y="104" class="uphy-8-coulomb-vectors-t">② 방향: q₂는 끌어당김(+x)</text>
  <text x="460" y="124" class="uphy-8-coulomb-vectors-t">q₃는 밀어냄(−y)</text>
  <text x="430" y="148" class="uphy-8-coulomb-vectors-t">③ 성분끼리 더하기</text>
  <text x="460" y="168" class="uphy-8-coulomb-vectors-s">Fₓ = +0.599 N, F_y = −0.450 N</text>
  <text x="430" y="192" class="uphy-8-coulomb-vectors-t">④ 크기와 방향</text>
  <text x="460" y="212" class="uphy-8-coulomb-vectors-s">√(0.599² + 0.450²) ≈ 0.749 N</text>
  <text x="460" y="232" class="uphy-8-coulomb-vectors-s">tan⁻¹(0.450/0.599) ≈ 36.9°</text>
  <text x="430" y="400" class="uphy-8-coulomb-vectors-s">위치 1 m ≈ 600 px, 힘 1 N ≈ 200 px</text>
</svg>
