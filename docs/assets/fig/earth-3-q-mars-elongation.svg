  <line x1="200.0" y1="200.0" x2="367.2" y2="200.0" style="stroke:var(--fig-ink);stroke-width:1.4"/>
  <line x1="367.2" y1="200.0" x2="272.4" y2="117.2" style="stroke:var(--fig-ink);stroke-width:1.4"/>
