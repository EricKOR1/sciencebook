<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" class="fig-small" role="img" aria-labelledby="t-earth-3-q-mars-elongation d-earth-3-q-mars-elongation">
  <title id="t-earth-3-q-mars-elongation">그림 지구과학 3-17 문제 16 해설 — 화성에서 본 지구의 최대 이각</title>
  <desc id="d-earth-3-q-mars-elongation">태양계를 북쪽에서 내려다본 모식도이다. 화성에서 지구 궤도에 그은 접선 방향에 지구가 있을 때 태양–지구–화성이 직각을 이루며, 이때의 각 θ가 최대 이각이다. sin θ = 1/1.52 ≈ 0.66이므로 θ ≈ 41°이다.</desc>
  <style>.earth-3-q-mars-elongation-t{font-size:14px;fill:var(--fig-ink)} .earth-3-q-mars-elongation-s{font-size:13px;fill:var(--fig-muted)} .earth-3-q-mars-elongation-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .earth-3-q-mars-elongation-b{font-size:15px;font-weight:700;fill:var(--fig-ink)} .earth-3-q-mars-elongation-ax{stroke:var(--fig-ink);stroke-width:1.4;fill:none} .earth-3-q-mars-elongation-grid{stroke:var(--fig-line);stroke-width:0.7;fill:none;stroke-dasharray:3 3}</style>
  <circle cx="200.0" cy="200.0" r="110.0" style="fill:none;stroke:var(--fig-blue);stroke-width:1.5;stroke-dasharray:5 4"/>
  <circle cx="200.0" cy="200.0" r="167.2" style="fill:none;stroke:var(--fig-red);stroke-width:1.5;stroke-dasharray:5 4"/>
