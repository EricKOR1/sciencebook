  <text x="365.2" y="226.0" text-anchor="middle" class="earth-3-q-mars-elongation-t">화성</text>
  <text x="218.2" y="160.6" text-anchor="end" class="earth-3-q-mars-elongation-s">1 AU</text>
  <text x="313.6" y="218.0" text-anchor="middle" class="earth-3-q-mars-elongation-s">1.52 AU</text>
  <text x="20.0" y="385.0" class="earth-3-q-mars-elongation-t">sin θ = 1 / 1.52 ≈ 0.66 → θ ≈ 41°</text>
