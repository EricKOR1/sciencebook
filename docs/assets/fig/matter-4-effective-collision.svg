  <text x="242.0" y="231.0" text-anchor="middle" class="matter-4-effective-collision-s">O</text>
  <circle cx="272.0" cy="226.0" r="16" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2"/>
  <text x="272.0" y="231.0" text-anchor="middle" class="matter-4-effective-collision-s">O</text>
  <text x="257.0" y="268.0" text-anchor="middle" class="matter-4-effective-collision-t">O₂</text>
  <text x="182.0" y="296.0" text-anchor="middle" class="matter-4-effective-collision-t">새 결합 생성 → 반응이 일어난다</text>
  <rect x="364" y="12" width="340" height="300" rx="10" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="534.0" y="40.0" text-anchor="middle" class="matter-4-effective-collision-s" style="fill:var(--fig-red)">효과 없는 충돌 — O 원자 쪽이 부딪침</text>
  <circle cx="414.0" cy="104.0" r="17" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <text x="414.0" y="109.0" text-anchor="middle" class="matter-4-effective-collision-s">N</text>
  <circle cx="444.0" cy="104.0" r="16" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2"/>
