<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 346" role="img" aria-labelledby="t-matter-4-effective-collision d-matter-4-effective-collision">
  <title id="t-matter-4-effective-collision">그림 물질과 에너지 4-6 충돌 방향과 유효 충돌(NO + O₃)</title>
  <desc id="d-matter-4-effective-collision">일산화 질소의 N 원자 쪽이 오존의 끝 산소 원자에 부딪치면 NO₂와 O₂가 생기지만, O 원자 쪽으로 부딪치면 에너지가 충분해도 반응하지 않고 튕겨 나간다. 분자 모양은 모식도이다.</desc>
  <style>
    .matter-4-effective-collision-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
    .matter-4-effective-collision-gr{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4}
    .matter-4-effective-collision-g{fill:none;stroke:var(--fig-muted);stroke-width:1.2;stroke-dasharray:4 4}
    .matter-4-effective-collision-lv{fill:none;stroke:var(--fig-ink);stroke-width:3;stroke-linecap:round}
    .matter-4-effective-collision-ink{fill:var(--fig-ink)}
    .matter-4-effective-collision-l{font-size:14px;fill:var(--fig-ink)}
    .matter-4-effective-collision-b{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .matter-4-effective-collision-s{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .matter-4-effective-collision-t{font-size:13px;fill:var(--fig-muted)}
  </style>
