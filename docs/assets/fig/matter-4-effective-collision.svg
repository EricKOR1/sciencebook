  <circle cx="599.6" cy="88.3" r="16" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2"/>
  <text x="599.6" y="93.3" text-anchor="middle" class="matter-4-effective-collision-s">O</text>
  <circle cx="625.2" cy="104.0" r="16" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2"/>
  <text x="625.2" y="109.0" text-anchor="middle" class="matter-4-effective-collision-s">O</text>
  <text x="429.0" y="142.0" text-anchor="middle" class="matter-4-effective-collision-t">NO</text>
  <text x="605.0" y="142.0" text-anchor="middle" class="matter-4-effective-collision-t">O₃</text>
  <line x1="534.0" y1="160.0" x2="534.0" y2="186.0" style="stroke:var(--fig-muted);stroke-width:2;fill:none"/>
  <path d="M534.0 196.0 L529.0 186.0 L539.0 186.0 Z" style="fill:var(--fig-muted)"/>
  <circle cx="414.0" cy="226.0" r="17" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <text x="414.0" y="231.0" text-anchor="middle" class="matter-4-effective-collision-s">N</text>
  <circle cx="444.0" cy="226.0" r="16" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2"/>
  <text x="444.0" y="231.0" text-anchor="middle" class="matter-4-effective-collision-s">O</text>
  <line x1="428.0" y1="196.0" x2="404.0" y2="196.0" style="stroke:var(--fig-ink);stroke-width:2.2;fill:none"/>
  <path d="M394.0 196.0 L404.0 191.0 L404.0 201.0 Z" style="fill:var(--fig-ink)"/>
  <circle cx="584.0" cy="226.0" r="16" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2"/>
  <text x="584.0" y="231.0" text-anchor="middle" class="matter-4-effective-collision-s">O</text>
  <circle cx="609.6" cy="210.3" r="16" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2"/>
  <text x="609.6" y="215.3" text-anchor="middle" class="matter-4-effective-collision-s">O</text>
