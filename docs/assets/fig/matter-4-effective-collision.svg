  <text x="182.0" y="40.0" text-anchor="middle" class="matter-4-effective-collision-s" style="fill:var(--fig-green)">유효 충돌 — N 원자 쪽이 부딪침</text>
  <circle cx="62.0" cy="104.0" r="16" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2"/>
  <text x="62.0" y="109.0" text-anchor="middle" class="matter-4-effective-collision-s">O</text>
  <circle cx="92.0" cy="104.0" r="17" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <text x="92.0" y="109.0" text-anchor="middle" class="matter-4-effective-collision-s">N</text>
  <line x1="116.0" y1="104.0" x2="152.0" y2="104.0" style="stroke:var(--fig-ink);stroke-width:2.2;fill:none"/>
