  <text x="635.2" y="231.0" text-anchor="middle" class="matter-4-effective-collision-s">O</text>
  <line x1="600.0" y1="188.0" x2="630.0" y2="188.0" style="stroke:var(--fig-ink);stroke-width:2.2;fill:none"/>
  <path d="M640.0 188.0 L630.0 193.0 L630.0 183.0 Z" style="fill:var(--fig-ink)"/>
  <text x="534.0" y="232.0" text-anchor="middle" class="matter-4-effective-collision-s">튕겨 나감</text>
  <text x="534.0" y="296.0" text-anchor="middle" class="matter-4-effective-collision-t">에너지가 충분해도 반응하지 않는다</text>
  <text x="360.0" y="336.0" text-anchor="middle" class="matter-4-effective-collision-t">유효 충돌의 두 조건: ① 활성화 에너지 이상의 충분한 에너지 ② 알맞은 방향. 분자 모양은 모식도이다.</text>
</svg>
