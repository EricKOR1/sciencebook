  <text x="540" y="278" text-anchor="middle" class="m2-06-breathing-b">흉강 부피 작아짐 → 폐 속 압력 높아짐</text>
  <text x="540" y="298" text-anchor="middle" class="m2-06-breathing-s">폐 속 압력이 대기압보다 높아 공기가 폐 → 밖으로</text>
