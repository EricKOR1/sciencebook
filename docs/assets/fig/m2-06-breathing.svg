  <title id="t-m2-06-breathing">그림 중2-6-7 호흡 운동의 원리</title>
  <desc id="d-m2-06-breathing">들숨 때는 갈비뼈가 올라가고 가로막이 내려가 흉강이 커지고 폐 속 압력이 낮아져 공기가 들어온다. 날숨 때는 반대로 흉강이 작아져 공기가 나간다.</desc>
