  <line x1="280" y1="100" x2="340" y2="100" style="stroke:var(--fig-blue);stroke-width:2"/>
  <line x1="96" y1="100" x2="364" y2="100" class="matter-2-q-u-tube-gr"/>
  <circle cx="150" cy="150" r="5" class="matter-2-q-u-tube-su"/>
  <circle cx="200" cy="245" r="5" class="matter-2-q-u-tube-su"/>
  <circle cx="296" cy="122" r="5" class="matter-2-q-u-tube-su"/>
  <circle cx="322" cy="150" r="5" class="matter-2-q-u-tube-su"/>
  <circle cx="300" cy="178" r="5" class="matter-2-q-u-tube-su"/>
  <circle cx="324" cy="205" r="5" class="matter-2-q-u-tube-su"/>
  <circle cx="258" cy="238" r="5" class="matter-2-q-u-tube-su"/>
  <circle cx="306" cy="250" r="5" class="matter-2-q-u-tube-su"/>
  <path d="M120 40 L120 230 Q120 270 160 270 L300 270 Q340 270 340 230 L340 40" class="matter-2-q-u-tube-tube"/>
  <path d="M180 40 L180 210 L280 210 L280 40" class="matter-2-q-u-tube-tube"/>
  <line x1="230" y1="210" x2="230" y2="270" style="stroke:var(--fig-green);stroke-width:4;stroke-dasharray:5 3"/>
  <line x1="230" y1="272" x2="230" y2="286" class="matter-2-q-u-tube-lead"/>
