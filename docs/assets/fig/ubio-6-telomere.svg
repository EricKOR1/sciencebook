<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-ubio-6-telomere d-ubio-6-telomere">
  <title id="t-ubio-6-telomere">그림 일반생명과학 6-5 말단 복제 문제와 텔로머레이스</title>
  <desc id="d-ubio-6-telomere">위: 선형 염색체의 오른쪽 끝을 복제할 때, 분기점이 끝으로 다가가는 방향과 반대로 합성되는 지연 가닥은 맨 끝의 RNA 프라이머가 제거되면 그 자리를 채울 3′–OH가 없어 빈 채로 남는다. 그래서 새 가닥의 5′ 끝이 짧아지고 주형 가닥의 3′ 끝이 튀어나온다. 아래: 텔로머레이스는 자신의 RNA 주형(3′-CAAUCCCAAUC-5′)으로 튀어나온 3′ 끝에 TTAGGG 반복을 덧붙인다. 늘어난 가닥을 주형으로 프라이메이스와 DNA 중합 효소가 반대 가닥을 채운다. 모식도.</desc>
  <style>.ubio-6-telomere-t{font-size:14px;fill:var(--fig-ink)} .ubio-6-telomere-s{font-size:13px;fill:var(--fig-muted)} .ubio-6-telomere-b{font-size:14px;fill:var(--fig-ink);font-weight:600} .ubio-6-telomere-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-6-telomere-m{font-size:13px;fill:var(--fig-ink)}</style>
