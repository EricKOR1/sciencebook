<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-ubio-3-q-acid-bath d-ubio-3-q-acid-bath">
  <title id="t-ubio-3-q-acid-bath">그림 일반생명과학 3-16 문제 16 틸라코이드의 산–염기 전이 실험</title>
  <desc id="d-ubio-3-q-acid-bath">① 어두운 곳에서 분리한 틸라코이드를 pH 4 완충 용액에 담가 틸라코이드 내부를 pH 4로 맞춘다. ② ADP와 Pᵢ가 든 pH 8 용액으로 재빨리 옮긴다(역시 어두운 곳). 틸라코이드는 막으로 둘러싸인 주머니로 그렸다(모식도).</desc>
