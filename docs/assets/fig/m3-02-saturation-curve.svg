<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="t-m3-02-saturation-curve d-m3-02-saturation-curve">
  <title id="t-m3-02-saturation-curve">그림 중3-2-8 기온에 따른 포화 수증기량과 이슬점</title>
  <desc id="d-m3-02-saturation-curve">포화 수증기량은 기온이 높을수록 많아지며 곡선 모양으로 늘어난다. 기온 25 °C, 수증기량 10.6 g/kg인 공기 A는 곡선 아래에 있어 불포화 상태이고 상대습도는 약 53 %이다. A를 냉각하면 수증기량은 그대로인 채 왼쪽으로 이동하여 15 °C에서 곡선과 만나 포화된다(이슬점 15 °C). 5 °C까지 냉각하면 포화 수증기량 5.4 g/kg을 넘는 5.2 g이 응결한다.</desc>
  <style>.m3-02-saturation-curve-l{font-size:14px;fill:var(--fig-ink)} .m3-02-saturation-curve-t{font-size:13px;fill:var(--fig-muted)} .m3-02-saturation-curve-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .m3-02-saturation-curve-ax{stroke:var(--fig-ink);stroke-width:1.5;fill:none} .m3-02-saturation-curve-g{stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:2 4;fill:none}</style>
  <line x1="80.0" y1="40" x2="80.0" y2="340" class="m3-02-saturation-curve-g"/>
  <text x="80.0" y="360" text-anchor="middle" class="m3-02-saturation-curve-t">0</text>
  <line x1="153.3" y1="40" x2="153.3" y2="340" class="m3-02-saturation-curve-g"/>
  <text x="153.3" y="360" text-anchor="middle" class="m3-02-saturation-curve-t">5</text>
  <line x1="226.7" y1="40" x2="226.7" y2="340" class="m3-02-saturation-curve-g"/>
  <text x="226.7" y="360" text-anchor="middle" class="m3-02-saturation-curve-t">10</text>
  <line x1="300.0" y1="40" x2="300.0" y2="340" class="m3-02-saturation-curve-g"/>
  <text x="300.0" y="360" text-anchor="middle" class="m3-02-saturation-curve-t">15</text>
  <line x1="373.3" y1="40" x2="373.3" y2="340" class="m3-02-saturation-curve-g"/>
  <text x="373.3" y="360" text-anchor="middle" class="m3-02-saturation-curve-t">20</text>
  <line x1="446.7" y1="40" x2="446.7" y2="340" class="m3-02-saturation-curve-g"/>
  <text x="446.7" y="360" text-anchor="middle" class="m3-02-saturation-curve-t">25</text>
  <line x1="520.0" y1="40" x2="520.0" y2="340" class="m3-02-saturation-curve-g"/>
  <text x="520.0" y="360" text-anchor="middle" class="m3-02-saturation-curve-t">30</text>
  <line x1="80" y1="340" x2="520" y2="340" class="m3-02-saturation-curve-g"/>
  <text x="70" y="345" text-anchor="end" class="m3-02-saturation-curve-t">0</text>
  <line x1="80" y1="290" x2="520" y2="290" class="m3-02-saturation-curve-g"/>
  <text x="70" y="295" text-anchor="end" class="m3-02-saturation-curve-t">5</text>
  <line x1="80" y1="240" x2="520" y2="240" class="m3-02-saturation-curve-g"/>
  <text x="70" y="245" text-anchor="end" class="m3-02-saturation-curve-t">10</text>
  <line x1="80" y1="190" x2="520" y2="190" class="m3-02-saturation-curve-g"/>
  <text x="70" y="195" text-anchor="end" class="m3-02-saturation-curve-t">15</text>
  <line x1="80" y1="140" x2="520" y2="140" class="m3-02-saturation-curve-g"/>
  <text x="70" y="145" text-anchor="end" class="m3-02-saturation-curve-t">20</text>
  <line x1="80" y1="90" x2="520" y2="90" class="m3-02-saturation-curve-g"/>
  <text x="70" y="95" text-anchor="end" class="m3-02-saturation-curve-t">25</text>
  <line x1="80" y1="40" x2="520" y2="40" class="m3-02-saturation-curve-g"/>
  <text x="70" y="45" text-anchor="end" class="m3-02-saturation-curve-t">30</text>
  <path d="M80,40 L80,340 L520,340" class="m3-02-saturation-curve-ax"/>
  <text x="300" y="384" text-anchor="middle" class="m3-02-saturation-curve-l">기온 (°C)</text>
  <text x="24" y="190" text-anchor="middle" class="m3-02-saturation-curve-l" transform="rotate(-90 24 190)">수증기량 (g/kg)</text>
  <path d="M80.0,302.0 C92.2,299.3 128.9,292.3 153.3,286.0 C177.8,279.7 202.2,272.7 226.7,264.0 C251.1,255.3 275.6,245.8 300.0,234.0 C324.4,222.2 348.9,208.7 373.3,193.0 C397.8,177.3 422.2,160.7 446.7,140.0 C471.1,119.3 507.8,80.8 520.0,69.0 L520.0,340 L80,340 Z" style="fill:var(--fig-soft-blue)"/>
  <path d="M80.0,302.0 C92.2,299.3 128.9,292.3 153.3,286.0 C177.8,279.7 202.2,272.7 226.7,264.0 C251.1,255.3 275.6,245.8 300.0,234.0 C324.4,222.2 348.9,208.7 373.3,193.0 C397.8,177.3 422.2,160.7 446.7,140.0 C471.1,119.3 507.8,80.8 520.0,69.0" style="fill:none;stroke:var(--fig-blue);stroke-width:3.5"/>
  <circle cx="80.0" cy="302.0" r="3.5" style="fill:var(--fig-blue)"/>
  <circle cx="153.3" cy="286.0" r="3.5" style="fill:var(--fig-blue)"/>
  <circle cx="226.7" cy="264.0" r="3.5" style="fill:var(--fig-blue)"/>
  <circle cx="300.0" cy="234.0" r="3.5" style="fill:var(--fig-blue)"/>
  <circle cx="373.3" cy="193.0" r="3.5" style="fill:var(--fig-blue)"/>
  <circle cx="446.7" cy="140.0" r="3.5" style="fill:var(--fig-blue)"/>
  <circle cx="520.0" cy="69.0" r="3.5" style="fill:var(--fig-blue)"/>
  <text x="464.3" y="65.0" text-anchor="end" class="m3-02-saturation-curve-h" style="fill:var(--fig-blue)">포화 수증기량 곡선</text>
  <text x="402.7" y="305.0" text-anchor="middle" class="m3-02-saturation-curve-t">곡선 아래: 불포화 상태</text>
  <text x="138.7" y="160.0" class="m3-02-saturation-curve-t">곡선 위: 넘치는 수증기는 응결</text>
  <line x1="446.6675" y1="234.0" x2="300.0" y2="234.0" style="stroke:var(--fig-red);stroke-width:3;stroke-dasharray:7 4"/>
  <path d="M306.0,234.0 L318.0,240.0 L318.0,228.0 Z" style="fill:var(--fig-red)"/>
  <path d="M300.0,234.0 C287.8,239.0 251.1,255.3 226.7,264.0 C202.2,272.7 165.6,282.3 153.3,286.0" style="fill:none;stroke:var(--fig-red);stroke-width:3;stroke-dasharray:7 4"/>
  <path d="M156.3,288.0 L169.7,289.2 L165.3,278.0 Z" style="fill:var(--fig-red)"/>
  <circle cx="446.6675" cy="234.0" r="7" style="fill:var(--fig-red);stroke:var(--fig-paper);stroke-width:2"/>
  <text x="458.6675" y="239.0" class="m3-02-saturation-curve-h" style="fill:var(--fig-red)">A</text>
  <circle cx="300.0" cy="234.0" r="6" style="fill:var(--fig-paper);stroke:var(--fig-red);stroke-width:2.5"/>
  <line x1="300.0" y1="242.0" x2="300.0" y2="340" style="stroke:var(--fig-red);stroke-width:1.5;stroke-dasharray:3 3"/>
  <text x="306.0" y="326.0" class="m3-02-saturation-curve-l" style="fill:var(--fig-red);font-weight:700">이슬점 15 °C</text>
  <line x1="139.3" y1="234.0" x2="139.3" y2="286.0" style="stroke:var(--fig-violet);stroke-width:3"/>
  <line x1="133.3" y1="234.0" x2="145.3" y2="234.0" style="stroke:var(--fig-violet);stroke-width:2"/><line x1="133.3" y1="286.0" x2="145.3" y2="286.0" style="stroke:var(--fig-violet);stroke-width:2"/>
  <line x1="145.3" y1="234.0" x2="300.0" y2="234.0" style="stroke:var(--fig-violet);stroke-width:1;stroke-dasharray:2 3"/>
  <text x="133.3" y="192.0" class="m3-02-saturation-curve-l" style="fill:var(--fig-violet);font-weight:700">5 °C까지 냉각하면</text>
  <text x="133.3" y="211.0" class="m3-02-saturation-curve-l" style="fill:var(--fig-violet);font-weight:700">10.6 − 5.4 = 5.2 g 응결</text>
  <rect x="540" y="40" width="172" height="168" rx="6" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1"/>
  <text x="552" y="64" class="m3-02-saturation-curve-h">공기 A</text>
  <text x="552" y="85" class="m3-02-saturation-curve-l">기온 25 °C</text>
  <text x="552" y="107" class="m3-02-saturation-curve-l">수증기량 10.6 g/kg</text>
  <text x="552" y="129" class="m3-02-saturation-curve-t">포화 수증기량 20.0 g/kg</text>
  <text x="552" y="151" class="m3-02-saturation-curve-h">상대습도</text>
  <text x="552" y="172" class="m3-02-saturation-curve-l">10.6 ÷ 20.0 × 100</text>
  <text x="552" y="194" class="m3-02-saturation-curve-l">≈ 53 %</text>
  <text x="540" y="236" class="m3-02-saturation-curve-t">냉각해도 수증기량은 그대로</text>
  <text x="540" y="256" class="m3-02-saturation-curve-t">→ 그래프에서 왼쪽으로 이동</text>
  <text x="540" y="276" class="m3-02-saturation-curve-t">→ 곡선과 만나는 온도가 이슬점</text>
</svg>
