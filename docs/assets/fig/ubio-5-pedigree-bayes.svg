<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-ubio-5-pedigree-bayes d-ubio-5-pedigree-bayes">
  <title id="t-ubio-5-pedigree-bayes">그림 일반생명과학 5-6 예제 7과 예제 8의 가계도</title>
  <desc id="d-ubio-5-pedigree-bayes">(가) 예제 7: 갑과 을은 각자 상염색체 열성 유전병 환자인 형제자매가 있고 부모는 모두 정상이므로, 정상인 갑과 을이 보인자일 확률은 각각 2/3이다. 첫 아이가 유전병일 확률은 2/3 × 2/3 × 1/4 = 1/9이다. (나) 예제 8: 병의 어머니는 혈우병 보인자이다. 병이 보인자일 사전 확률은 1/2이지만, 병의 아들 세 명이 모두 정상이라는 관찰을 반영하면 사후 확률이 1/9로 줄어든다. 네모는 남자, 동그라미는 여자, 색칠은 환자, 가운데 점은 보인자, 마름모는 성별을 모르는 아이이다.</desc>
  <style>.ubio-5-pedigree-bayes-t{font-size:14px;fill:var(--fig-ink)} .ubio-5-pedigree-bayes-s{font-size:13px;fill:var(--fig-muted)} .ubio-5-pedigree-bayes-b{font-size:14px;fill:var(--fig-ink);font-weight:600} .ubio-5-pedigree-bayes-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-5-pedigree-bayes-m{font-size:13px;fill:var(--fig-ink)}</style>
  <text x="200.0" y="24.0" text-anchor="middle" class="ubio-5-pedigree-bayes-b">(가) 예제 7 — 상염색체 열성</text>
  <text x="560.0" y="24.0" text-anchor="middle" class="ubio-5-pedigree-bayes-b">(나) 예제 8 — X 연관 열성(혈우병)</text>
