<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="t-pchem-4-co2-phase-diagram d-pchem-4-co2-phase-diagram">
  <title id="t-pchem-4-co2-phase-diagram">그림 물리화학 4-4 이산화 탄소의 상 도표</title>
  <desc id="d-pchem-4-co2-phase-diagram">이산화 탄소의 상 도표 개략도(압력은 로그 눈금). 고체–액체 경계는 오른쪽으로 기운 가파른 선이다. 삼중점(216.6 K, 5.18 bar)이 1 atm보다 높아, 1 atm에서는 194.7 K에서 고체가 바로 기체로 승화한다. 298 K에서 증발 곡선의 압력은 약 64 bar이고, 증발 곡선은 임계점(304.1 K, 73.8 bar)에서 끝난다. 승화·증발 곡선은 클라우지우스–클라페이롱 식, 녹는 곡선은 클라페이롱 식으로 계산했다.</desc>
