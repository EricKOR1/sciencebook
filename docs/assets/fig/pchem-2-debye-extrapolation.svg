    .pc2debye-extrapolation-fline{fill:var(--fig-line)}
    .pc2debye-extrapolation-fblue{fill:var(--fig-blue)}
    .pc2debye-extrapolation-fred{fill:var(--fig-red)}
    .pc2debye-extrapolation-fgreen{fill:var(--fig-green)}
    .pc2debye-extrapolation-famber{fill:var(--fig-amber)}
    .pc2debye-extrapolation-fviolet{fill:var(--fig-violet)}
    .pc2debye-extrapolation-fteal{fill:var(--fig-teal)}
    .pc2debye-extrapolation-faccent{fill:var(--fig-accent)}
  </style>
