<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-pchem-2-debye-extrapolation d-pchem-2-debye-extrapolation">
  <title id="t-pchem-2-debye-extrapolation">그림 물리화학 2-12 디바이 T³ 외삽</title>
  <desc id="d-pchem-2-debye-extrapolation">10~20 K에서 잰 몰 열용량(점)은 Cp = aT³ (a = 2.4×10⁻⁴ J mol⁻¹ K⁻⁴)에 맞는다. 측정하지 못한 0~10 K는 같은 식으로 외삽한다(점선). 삽입 그래프: Cp/T를 T²에 대해 그리면 원점을 지나는 직선이다. 10 K까지의 엔트로피는 Cp(10 K)/3 = 0.080 J/(mol·K)이다.</desc>
