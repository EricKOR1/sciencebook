<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" role="img" aria-labelledby="t-m2-07-electroscope d-m2-07-electroscope">
  <title id="t-m2-07-electroscope">그림 중2-7-3 정전기 유도와 검전기</title>
  <desc id="d-m2-07-electroscope">(−)대전체를 검전기의 금속판에 가까이 하면 금속 속 전자가 금속박 쪽으로 밀려나, 금속판은 (+)전하, 금속박은 (−)전하를 띠고 금속박이 벌어진다. 검전기 전체의 전하량은 변하지 않는다.</desc>
