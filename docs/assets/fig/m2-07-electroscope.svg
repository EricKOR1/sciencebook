  <path d="M100 300 L 100 190 C 100 150, 130 136, 152 132 L 188 132 C 210 136, 240 150, 240 190 L 240 300 Z" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5;opacity:0.9"/>
