<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-uearth-7-cloud-types d-uearth-7-cloud-types">
  <title id="t-uearth-7-cloud-types">그림 일반지구과학 7-6 10가지 기본 운형과 높이(중위도)</title>
  <desc id="d-uearth-7-cloud-types">구름 10가지 기본 운형을 높이에 따라 배치한 모식도이다. 6 km 이상의 상층에는 빙정으로 된 권운·권적운·권층운(햇무리), 2~6 km의 중층에는 고적운·고층운, 2 km 이하의 하층에는 층적운·층운이 있다. 난층운은 하층에서 중층까지 두껍게 걸쳐 넓은 지역에 지속적인 비를 내린다. 적운은 밑면이 평평하며 그 높이가 상승 응결 고도이고, 적란운은 대류권 계면까지 솟아 꼭대기가 모루처럼 퍼지며 소나기·뇌우를 일으킨다. 높이는 중위도의 대략값이고 모양과 크기는 모식적이다.</desc>
