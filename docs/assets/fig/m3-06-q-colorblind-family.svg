<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" class="fig-small" role="img" aria-labelledby="t-m3-06-q-colorblind-family d-m3-06-q-colorblind-family">
  <title id="t-m3-06-q-colorblind-family">그림 중3-6-9 예제 7의 가계도</title>
  <desc id="d-m3-06-q-colorblind-family">정상인 아버지 1과 정상인 어머니 2 사이에서 적록 색맹인 아들 3이 태어났다. 네모는 남자, 동그라미는 여자, 색칠한 기호는 적록 색맹인 사람이다.</desc>
  <style>
    .m3-06-q-colorblind-family-lbl{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .m3-06-q-colorblind-family-tx{font-size:14px;fill:var(--fig-ink)}
    .m3-06-q-colorblind-family-sm{font-size:13px;fill:var(--fig-muted)}
    .m3-06-q-colorblind-family-ln{fill:none;stroke:var(--fig-ink);stroke-width:2}
    .m3-06-q-colorblind-family-off{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2}
    .m3-06-q-colorblind-family-on{fill:var(--fig-violet);stroke:var(--fig-ink);stroke-width:2}
  </style>
  <rect x="41.0" y="17.0" width="22" height="22" class="m3-06-q-colorblind-family-off"/>
  <text x="70.0" y="33.0" class="m3-06-q-colorblind-family-sm">정상 남자</text>
  <circle cx="162.0" cy="28.0" r="11" class="m3-06-q-colorblind-family-off"/>
  <text x="180.0" y="33.0" class="m3-06-q-colorblind-family-sm">정상 여자</text>
  <rect x="261.0" y="17.0" width="22" height="22" class="m3-06-q-colorblind-family-on"/>
  <text x="290.0" y="33.0" class="m3-06-q-colorblind-family-sm">적록 색맹 남자</text>
  <line x1="190.0" y1="105.0" x2="270.0" y2="105.0" class="m3-06-q-colorblind-family-ln"/>
  <line x1="230.0" y1="105.0" x2="230.0" y2="160.0" class="m3-06-q-colorblind-family-ln"/>
  <rect x="175.0" y="90.0" width="30" height="30" class="m3-06-q-colorblind-family-off"/>
  <circle cx="270.0" cy="105.0" r="15" class="m3-06-q-colorblind-family-off"/>
  <rect x="215.0" y="160.0" width="30" height="30" class="m3-06-q-colorblind-family-on"/>
  <text x="190.0" y="140.0" text-anchor="middle" class="m3-06-q-colorblind-family-tx">1</text>
  <text x="270.0" y="140.0" text-anchor="middle" class="m3-06-q-colorblind-family-tx">2</text>
  <text x="230.0" y="210.0" text-anchor="middle" class="m3-06-q-colorblind-family-tx">3</text>
  <text x="60.0" y="110.0" class="m3-06-q-colorblind-family-lbl">Ⅰ</text>
  <text x="60.0" y="180.0" class="m3-06-q-colorblind-family-lbl">Ⅱ</text>
  <text x="306.0" y="110.0" class="m3-06-q-colorblind-family-sm">아버지 · 어머니</text>
  <text x="256.0" y="180.0" class="m3-06-q-colorblind-family-sm">아들</text>
</svg>
