  <text x="450.0" y="112.0" class="ubio-12-synapse-k">활동 전위가 말단에 도착하면</text>
  <text x="450.0" y="131.0" class="ubio-12-synapse-k">전압 개폐 Ca²⁺ 통로가 열린다</text>
  <text x="424.0" y="168.0" class="ubio-12-synapse-b">②</text>
  <text x="450.0" y="168.0" class="ubio-12-synapse-k">Ca²⁺가 들어와 소포가 막과 융합,</text>
  <text x="450.0" y="187.0" class="ubio-12-synapse-k">전달 물질을 외포 작용으로 분비</text>
