<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-ubio-12-synapse d-ubio-12-synapse">
  <title id="t-ubio-12-synapse">그림 일반생명과학 12-6 화학적 시냅스의 전달 단계</title>
  <desc id="d-ubio-12-synapse">활동 전위가 축삭 말단에 오면 전압 개폐 Ca²⁺ 통로가 열려 Ca²⁺가 들어오고, 시냅스 소포가 막과 융합해 신경 전달 물질을 시냅스 틈으로 내보낸다. 전달 물질은 확산하여 시냅스 후 막의 이온성 수용체에 결합하고, 열린 통로로 이온이 흘러 시냅스 후 전위가 생긴다. 전달 물질은 분해 효소와 재흡수 수송체로 제거된다. 번호는 본문의 단계와 같다. 모식도이다.</desc>
  <style>.ubio-12-synapse-t{font-size:14px;fill:var(--fig-ink)} .ubio-12-synapse-s{font-size:13px;fill:var(--fig-muted)} .ubio-12-synapse-b{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-12-synapse-k{font-size:13px;fill:var(--fig-ink)}</style>
