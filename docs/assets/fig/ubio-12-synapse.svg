  <text x="450.0" y="243.0" class="ubio-12-synapse-k">시냅스 후 막의 수용체에 결합</text>
  <text x="424.0" y="280.0" class="ubio-12-synapse-b">④</text>
  <text x="450.0" y="280.0" class="ubio-12-synapse-k">이온성 수용체가 열려 이온이 흐름</text>
  <text x="450.0" y="299.0" class="ubio-12-synapse-k">→ 시냅스 후 전위(등급 전위)</text>
  <text x="424.0" y="336.0" class="ubio-12-synapse-b">⑤</text>
  <text x="450.0" y="336.0" class="ubio-12-synapse-k">분해 효소·재흡수 수송체·확산으로</text>
  <text x="450.0" y="355.0" class="ubio-12-synapse-k">전달 물질이 제거되어 신호 종료</text>
