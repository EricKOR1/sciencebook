<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-3-3-free-fall-graph d-3-3-free-fall-graph">
<title id="t-3-3-free-fall-graph">그림 3-3-1 자유 낙하 운동의 속도–시간 그래프와 낙하 거리</title>
<desc id="d-3-3-free-fall-graph">왼쪽 속도–시간 그래프는 기울기가 9.8 m/s²인 직선이고, 1초 구간마다 그래프 아래 넓이(떨어진 거리)가 4.9, 14.7, 24.5, 34.3 m로 1 : 3 : 5 : 7씩 늘어난다. 오른쪽은 처음부터 떨어진 거리를 시간에 따라 나타낸 것으로, 시간의 제곱에 비례하여 늘어나는 곡선이다. 공기 저항은 무시했다.</desc>
