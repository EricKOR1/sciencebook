  <title id="t-uchem-7-catalyst-profile">그림 일반화학 7-8 촉매가 바꾸는 것과 바꾸지 않는 것</title>
  <desc id="d-uchem-7-catalyst-profile">촉매가 없는 경로(회색)와 촉매가 여는 새 경로(파랑, 중간체를 거치는 두 단계)의 에너지 그림 모식도이다. 출발점과 도착점의 높이 차 ΔH는 같고, 가장 높은 고개가 낮아진 만큼 정반응과 역반응의 활성화 에너지가 똑같이 줄어든다.</desc>
