<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-umath-2-stirling-sum d-umath-2-stirling-sum">
  <title id="t-umath-2-stirling-sum">그림 수학 도구 2-12 합 ln N!을 적분 ∫ ln x dx로 바꾸기(N = 10)</title>
  <desc id="d-umath-2-stirling-sum">ln 10! = ln 1 + ln 2 + … + ln 10은 폭 1, 높이 ln k인 막대들의 넓이 합(15.10)이다. 곡선 y = ln x 아래 1부터 10까지의 넓이 10 ln 10 − 10 + 1 = 14.03과 거의 같고, 차이는 막대 윗부분의 작은 조각들이다. N이 커질수록 이 차이의 비율은 0으로 간다.</desc>
