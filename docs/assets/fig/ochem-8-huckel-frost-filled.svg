<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="t-ochem-8-huckel-frost-filled d-ochem-8-huckel-frost-filled">
  <title id="t-ochem-8-huckel-frost-filled">그림 유기화학 8-15 프로스트 원에 π 전자 채우기 — 휘켈 규칙</title>
  <desc id="d-ochem-8-huckel-frost-filled">사이클로프로펜일 양이온(2e): 맨 아래 준위에 전자쌍, 닫힌 껍질 → 방향족. 사이클로뷰타다이엔(4e): α 높이의 축퇴 쌍에 홀전자가 하나씩 → 반방향족. 벤젠(6e): 결합성 세 준위가 꽉 참 → 방향족. 평면 사이클로옥타테트라엔(8e): α 높이 축퇴 쌍에 홀전자 하나씩 → 평면이면 반방향족. 사이클로옥타테트라엔 이가 음이온(10e): α 축퇴 쌍까지 꽉 참 → 방향족. 점선은 각 원의 중심 높이 α. 초록 테두리 = 방향족, 빨간 테두리 = 반방향족.</desc>
