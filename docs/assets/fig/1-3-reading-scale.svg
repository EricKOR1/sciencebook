<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-1-3-reading-scale d-1-3-reading-scale">
  <title id="t-1-3-reading-scale">그림 1-3-2 눈금 읽기: 최소 눈금의 10분의 1까지</title>
  <desc id="d-1-3-reading-scale">최소 눈금이 1 mm인 자에서 연필 끝이 12.3 cm와 12.4 cm 사이의 가운데에 있으면 12.35 cm로 읽는다. 눈금실린더는 눈높이를 액면에 맞추고 오목한 면의 가장 아랫부분을 읽는다. 눈금 부분을 확대한 모식도이다.</desc>
  <style>
    .rd13-lbl{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .rd13-txt{font-size:14px;fill:var(--fig-ink)}
    .rd13-sm{font-size:13px;fill:var(--fig-muted)}
    .rd13-tk{stroke:var(--fig-ink);stroke-width:1.3;fill:none}
    .rd13-big{font-size:26px;font-weight:700;fill:var(--fig-ink)}
    .rd13-est{fill:var(--fig-red)}
  </style>
  <text x="20" y="28" class="rd13-lbl">① 자 (최소 눈금 1 mm)</text>
  <text x="476" y="28" class="rd13-lbl">② 눈금실린더 (최소 눈금 1 mL)</text>
  <rect x="22" y="150" width="414" height="62" rx="4" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <line x1="40" y1="150" x2="40" y2="180" class="rd13-tk"/>
  <line x1="96" y1="150" x2="96" y2="164" class="rd13-tk"/>
  <line x1="152" y1="150" x2="152" y2="164" class="rd13-tk"/>
  <line x1="208" y1="150" x2="208" y2="164" class="rd13-tk"/>
  <line x1="264" y1="150" x2="264" y2="164" class="rd13-tk"/>
  <line x1="320" y1="150" x2="320" y2="172" class="rd13-tk"/>
  <line x1="376" y1="150" x2="376" y2="164" class="rd13-tk"/>
  <line x1="432" y1="150" x2="432" y2="164" class="rd13-tk"/>
  <text x="40" y="198" text-anchor="middle" class="rd13-lbl">12</text>
  <text x="208" y="184" text-anchor="middle" class="rd13-sm">12.3</text>
  <text x="264" y="184" text-anchor="middle" class="rd13-sm">12.4</text>
  <text x="430" y="204" text-anchor="end" class="rd13-sm">(cm)</text>
  <path d="M0 98 H202.0 V132 H0 Z" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.5"/>
  <path d="M202.0 98 L236.0 115 L202.0 132 Z" style="fill:var(--fig-panel);stroke:var(--fig-green);stroke-width:1.5"/>
  <path d="M226.0 110 L236.0 115 L226.0 120 Z" style="fill:var(--fig-ink)"/>
  <line x1="236.0" y1="118" x2="236.0" y2="168" style="stroke:var(--fig-red);stroke-width:1.5;stroke-dasharray:4 3"/>
  <text x="244.0" y="78" class="rd13-txt">연필 끝: 12.3과 12.4의 가운데쯤</text>
  <line x1="240.0" y1="84" x2="236.0" y2="104" style="stroke:var(--fig-line);stroke-width:1"/>
  <text x="132" y="262" class="rd13-big">12.3<tspan class="rd13-est">5</tspan> cm</text>
  <path d="M134 272 v8 h50 v-8" style="stroke:var(--fig-ink);stroke-width:1.3;fill:none"/>
  <text x="159" y="298" text-anchor="middle" class="rd13-sm">확실한 숫자</text>
  <path d="M190 272 v8 h14 v-8" style="stroke:var(--fig-red);stroke-width:1.3;fill:none"/>
  <text x="232" y="298" text-anchor="middle" class="rd13-sm" style="fill:var(--fig-red)">어림한 숫자</text>
  <text x="132" y="320" class="rd13-sm">유효숫자 4개 (마지막 한 자리까지)</text>
  <line x1="456" y1="44" x2="456" y2="320" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 4"/>
  <path d="M516 300 V135.0" style="stroke:none;fill:none"/>
  <path d="M516 133.0 Q564.0 157.0 612 133.0 V300 H516 Z" style="fill:var(--fig-soft-blue);stroke:none"/>
  <path d="M516 133.0 Q564.0 157.0 612 133.0" style="stroke:var(--fig-blue);stroke-width:2;fill:none"/>
  <path d="M516 50 V300 H612 V50" style="stroke:var(--fig-ink);stroke-width:2;fill:none"/>
  <line x1="516" y1="220.0" x2="538" y2="220.0" class="rd13-tk"/>
  <text x="508" y="225.0" text-anchor="end" class="rd13-txt">51</text>
  <line x1="516" y1="195.0" x2="528" y2="195.0" class="rd13-tk"/>
  <line x1="516" y1="170.0" x2="538" y2="170.0" class="rd13-tk"/>
  <text x="508" y="175.0" text-anchor="end" class="rd13-txt">52</text>
  <line x1="516" y1="145.0" x2="528" y2="145.0" class="rd13-tk"/>
  <line x1="516" y1="120.0" x2="538" y2="120.0" class="rd13-tk"/>
  <text x="508" y="125.0" text-anchor="end" class="rd13-txt">53</text>
  <line x1="516" y1="95.0" x2="528" y2="95.0" class="rd13-tk"/>
  <line x1="516" y1="70.0" x2="538" y2="70.0" class="rd13-tk"/>
  <text x="508" y="75.0" text-anchor="end" class="rd13-txt">54</text>
  <text x="508" y="56" text-anchor="end" class="rd13-sm">mL</text>
  <path d="M664 145.0 Q680 134.0 696 145.0 Q680 156.0 664 145.0 Z" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.5"/>
  <circle cx="674" cy="145.0" r="4" style="fill:var(--fig-ink)"/>
  <line x1="660" y1="145.0" x2="568.0" y2="145.0" style="stroke:var(--fig-red);stroke-width:1.5;stroke-dasharray:5 4"/>
  <circle cx="564.0" cy="145.0" r="3.5" style="fill:var(--fig-red)"/>
  <text x="680" y="123.0" text-anchor="middle" class="rd13-sm">눈높이를</text>
  <text x="680" y="167.0" text-anchor="middle" class="rd13-sm">액면과</text>
  <text x="680" y="183.0" text-anchor="middle" class="rd13-sm">맞춘다</text>
  <text x="590" y="318" text-anchor="middle" class="rd13-txt">오목한 면의 가장 아랫부분: <tspan style="font-weight:700">52.5 mL</tspan></text>
</svg>
