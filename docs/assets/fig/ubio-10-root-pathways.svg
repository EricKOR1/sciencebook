  <text x="484" y="68" class="ubio-10-root-pathways-t">내피 세포 사이 세포벽에</text>
  <text x="484" y="90" class="ubio-10-root-pathways-t">수베린(왁스) 띠가 둘러져</text>
  <text x="484" y="112" class="ubio-10-root-pathways-t">세포벽 길(아포플라스트)을 막는다.</text>
  <text x="484" y="134" class="ubio-10-root-pathways-t">→ 중심주로 가려면 누구든</text>
  <text x="484" y="156" class="ubio-10-root-pathways-t">   내피의 세포막을 한 번 통과</text>
  <text x="484" y="178" class="ubio-10-root-pathways-s">→ 막의 운반체가 들일 이온을 고른다</text>
