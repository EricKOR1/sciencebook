<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="t-ubio-10-root-pathways d-ubio-10-root-pathways">
  <title id="t-ubio-10-root-pathways">그림 일반생명과학 10-1 뿌리의 흡수 경로와 카스파리선</title>
  <desc id="d-ubio-10-root-pathways">위: 쌍떡잎식물 뿌리의 가로 단면(표피, 피층, 내피, 내초, 별 모양 물관부와 그 사이 체관부). 아래: 표피에서 물관까지 세포 두 줄을 확대한 모식도. 세포벽과 세포 사이 공간을 따라가는 아포플라스트 경로는 내피 세포 사이 세포벽의 카스파리선에 막혀 내피 세포막을 통과해야 하고, 심플라스트 경로는 처음 세포막을 한 번 건넌 뒤 원형질 연락사로 세포질을 따라 이동한다.</desc>
