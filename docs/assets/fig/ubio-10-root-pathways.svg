  <text x="250" y="174" class="ubio-10-root-pathways-s">중심주 = 내초 + 물관부 + 체관부</text>
  <text x="250" y="196" class="ubio-10-root-pathways-s">빨간 점선 칸 → 아래 확대(모식도)</text>
