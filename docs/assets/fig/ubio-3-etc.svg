  <path d="M214 214 Q234 222 247 210" style="fill:none;stroke:var(--fig-green);stroke-width:2.2;stroke-dasharray:5 4" marker-end="url(#ubio-3-etc-a-green)"/>
  <path d="M277 196 L300 196" style="fill:none;stroke:var(--fig-green);stroke-width:2.2;stroke-dasharray:5 4" marker-end="url(#ubio-3-etc-a-green)"/>
  <path d="M352 162 Q370 138 389 140" style="fill:none;stroke:var(--fig-green);stroke-width:2.2;stroke-dasharray:5 4" marker-end="url(#ubio-3-etc-a-green)"/>
  <path d="M419 140 Q438 138 452 160" style="fill:none;stroke:var(--fig-green);stroke-width:2.2;stroke-dasharray:5 4" marker-end="url(#ubio-3-etc-a-green)"/>
  <path d="M498 252 Q512 282 520 306" style="fill:none;stroke:var(--fig-green);stroke-width:2.2;stroke-dasharray:5 4" marker-end="url(#ubio-3-etc-a-green)"/>
  <text x="520.0" y="324.0" text-anchor="middle" class="ubio-3-etc-k">½O₂ + 2H⁺ → H₂O</text>
  <text x="262.0" y="250.0" text-anchor="middle" class="ubio-3-etc-g">e⁻</text>
  <path d="M112 292 L112 120" style="fill:none;stroke:var(--fig-red);stroke-width:2.6" marker-end="url(#ubio-3-etc-a-red)"/>
  <text x="118.0" y="108.0" text-anchor="start" class="ubio-3-etc-r">4 H⁺</text>
  <path d="M350 292 L350 120" style="fill:none;stroke:var(--fig-red);stroke-width:2.6" marker-end="url(#ubio-3-etc-a-red)"/>
  <text x="344.0" y="108.0" text-anchor="end" class="ubio-3-etc-r">4 H⁺</text>
  <path d="M496 292 L496 120" style="fill:none;stroke:var(--fig-red);stroke-width:2.6" marker-end="url(#ubio-3-etc-a-red)"/>
  <text x="502.0" y="108.0" text-anchor="start" class="ubio-3-etc-r">2 H⁺</text>
  <text x="196.0" y="154.0" text-anchor="middle" class="ubio-3-etc-s">0 H⁺</text>
  <rect x="600" y="162" width="60" height="76" rx="10" style="fill:var(--fig-panel);stroke:var(--fig-blue);stroke-width:2.5"/>
  <rect x="624" y="238" width="12" height="26" style="fill:var(--fig-blue)"/>
  <ellipse cx="630" cy="294" rx="44" ry="30" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2.5"/>
  <path d="M616 112 L616 262" style="fill:none;stroke:var(--fig-red);stroke-width:2.6" marker-end="url(#ubio-3-etc-a-red)"/>
  <text x="608.0" y="108.0" text-anchor="end" class="ubio-3-etc-r">H⁺ 약 4개</text>
  <text x="608.0" y="126.0" text-anchor="end" class="ubio-3-etc-s">(ATP 1개당)</text>
  <text x="642.0" y="206.0" text-anchor="middle" class="ubio-3-etc-k">F₀</text>
  <text x="630.0" y="299.0" text-anchor="middle" class="ubio-3-etc-k">F₁</text>
  <text x="630.0" y="350.0" text-anchor="middle" class="ubio-3-etc-bb">ADP + Pᵢ → ATP</text>
  <text x="630.0" y="48.0" text-anchor="middle" class="ubio-3-etc-bb">ATP 합성 효소</text>
  <text x="632.0" y="66.0" text-anchor="middle" class="ubio-3-etc-s">(c 고리 회전)</text>
  <line x1="300" y1="300" x2="330" y2="300" style="stroke:var(--fig-green);stroke-width:2.2;stroke-dasharray:5 4"/>
  <text x="336.0" y="305.0" text-anchor="start" class="ubio-3-etc-s">전자의 이동</text>
  <line x1="300" y1="324" x2="330" y2="324" style="stroke:var(--fig-red);stroke-width:2.6"/>
  <text x="336.0" y="329.0" text-anchor="start" class="ubio-3-etc-s">H⁺ 이동(전자 2개당)</text>
</svg>
