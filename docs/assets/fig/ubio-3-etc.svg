<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-ubio-3-etc d-ubio-3-etc">
  <title id="t-ubio-3-etc">그림 일반생명과학 3-1 전자 전달계와 ATP 합성 효소</title>
  <desc id="d-ubio-3-etc">미토콘드리아 내막에서 NADH의 전자는 복합체 Ⅰ → 유비퀴논(Q) → 복합체 Ⅲ → 사이토크롬 c → 복합체 Ⅳ → 산소로 전달되고, 전자 2개당 복합체 Ⅰ·Ⅲ·Ⅳ가 H⁺을 각각 4·4·2개 막 사이 공간으로 퍼낸다(합 10개). 숙신산의 FADH₂ 전자는 H⁺을 퍼내지 않는 복합체 Ⅱ를 거쳐 Q로 들어가므로 6개만 퍼낸다. H⁺이 ATP 합성 효소의 F₀를 지나 기질로 돌아오며 F₁에서 ATP가 만들어진다. 모식도이다.</desc>
  <defs>
    <marker id="ubio-3-etc-a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-ink)"/></marker>
    <marker id="ubio-3-etc-a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-green)"/></marker>
    <marker id="ubio-3-etc-a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-red)"/></marker>
  </defs>
  <style>.ubio-3-etc-s{font-size:13px;fill:var(--fig-muted)} .ubio-3-etc-b{font-size:14px;fill:var(--fig-ink);font-weight:600} .ubio-3-etc-bb{font-size:14px;fill:var(--fig-blue);font-weight:700} .ubio-3-etc-k{font-size:13px;fill:var(--fig-ink);font-weight:600} .ubio-3-etc-cb{font-size:18px;fill:var(--fig-ink);font-weight:700} .ubio-3-etc-a{font-size:13px;fill:var(--fig-amber);font-weight:600} .ubio-3-etc-r{font-size:14px;fill:var(--fig-red);font-weight:700} .ubio-3-etc-g{font-size:13px;fill:var(--fig-green);font-weight:700}</style>
  <rect x="8" y="8" width="704" height="160" style="fill:var(--fig-soft-red);stroke:none;opacity:0.55"/>
  <rect x="8" y="232" width="704" height="160" style="fill:var(--fig-soft-blue);stroke:none;opacity:0.55"/>
  <rect x="8" y="168" width="704" height="64" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <text x="18.0" y="30.0" text-anchor="start" class="ubio-3-etc-b">막 사이 공간 — H⁺ 많음(+)</text>
  <text x="18.0" y="384.0" text-anchor="start" class="ubio-3-etc-b">기질 — H⁺ 적음(−)</text>
  <text x="700.0" y="205.0" text-anchor="end" class="ubio-3-etc-a">내막</text>
  <rect x="54.0" y="138" width="76" height="124" rx="14" style="fill:var(--fig-panel);stroke:var(--fig-violet);stroke-width:2.5"/>
  <text x="92.0" y="205.0" text-anchor="middle" class="ubio-3-etc-cb">Ⅰ</text>
  <rect x="170.0" y="176" width="52" height="90" rx="14" style="fill:var(--fig-panel);stroke:var(--fig-teal);stroke-width:2.5"/>
  <text x="196.0" y="226.0" text-anchor="middle" class="ubio-3-etc-cb">Ⅱ</text>
  <rect x="295.0" y="138" width="70" height="124" rx="14" style="fill:var(--fig-panel);stroke:var(--fig-violet);stroke-width:2.5"/>
  <text x="330.0" y="205.0" text-anchor="middle" class="ubio-3-etc-cb">Ⅲ</text>
  <rect x="441.0" y="138" width="70" height="124" rx="14" style="fill:var(--fig-panel);stroke:var(--fig-violet);stroke-width:2.5"/>
  <text x="476.0" y="205.0" text-anchor="middle" class="ubio-3-etc-cb">Ⅳ</text>
  <circle cx="262" cy="200" r="15" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <text x="262.0" y="205.0" text-anchor="middle" class="ubio-3-etc-k">Q</text>
  <circle cx="404" cy="142" r="15" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2"/>
  <text x="404.0" y="147.0" text-anchor="middle" class="ubio-3-etc-k">c</text>
  <text x="404.0" y="118.0" text-anchor="middle" class="ubio-3-etc-s">사이토크롬 c</text>
  <path d="M62 316 Q70 290 80 250" style="fill:none;stroke:var(--fig-ink);stroke-width:1.8" marker-end="url(#ubio-3-etc-a-ink)"/>
  <text x="56.0" y="334.0" text-anchor="middle" class="ubio-3-etc-k">NADH → NAD⁺</text>
  <path d="M178 330 Q186 300 190 270" style="fill:none;stroke:var(--fig-ink);stroke-width:1.8" marker-end="url(#ubio-3-etc-a-ink)"/>
  <text x="196.0" y="350.0" text-anchor="middle" class="ubio-3-etc-k">FADH₂(숙신산)</text>
