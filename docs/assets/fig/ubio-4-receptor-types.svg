<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-ubio-4-receptor-types d-ubio-4-receptor-types">
  <title id="t-ubio-4-receptor-types">그림 일반생명과학 4-4 리간드 개폐 이온 통로와 세포 내 수용체</title>
  <desc id="d-ubio-4-receptor-types">왼쪽: 리간드 개폐 이온 통로는 리간드가 없으면 닫혀 있다가, 리간드가 붙으면 통로가 열려 이온(예: Na⁺)이 농도 기울기를 따라 바로 흘러 들어오므로 반응이 밀리초 수준으로 빠르다. 오른쪽: 작고 소수성인 스테로이드 호르몬은 세포막을 그대로 통과해 세포질(또는 핵)의 수용체에 붙고, 호르몬–수용체 복합체가 핵 안에서 DNA의 호르몬 반응 요소에 결합해 표적 유전자의 전사를 켠다. 단백질을 새로 만들어야 하므로 반응이 느리다. 모식도.</desc>
  <style>.ubio-4-receptor-types-t{font-size:14px;fill:var(--fig-ink)} .ubio-4-receptor-types-s{font-size:13px;fill:var(--fig-muted)} .ubio-4-receptor-types-b{font-size:14px;fill:var(--fig-ink);font-weight:600} .ubio-4-receptor-types-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-4-receptor-types-m{font-size:13px;fill:var(--fig-ink)}</style>
  <defs><marker id="ubio-4-receptor-types-ar0" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-blue)"/></marker><marker id="ubio-4-receptor-types-ar1" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-ink)"/></marker><marker id="ubio-4-receptor-types-ar2" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-amber)"/></marker><marker id="ubio-4-receptor-types-ar3" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-violet)"/></marker></defs>
