  <title id="t-rxn-3-polymer-structure">그림 화학 반응의 세계 3-7 열가소성 고분자와 열경화성 고분자의 구조</title>
  <desc id="d-rxn-3-polymer-structure">열가소성 고분자는 긴 사슬이 서로 얽혀 있을 뿐 사슬 사이에 결합이 없어, 가열하면 사슬이 미끄러지며 물러진다. 열경화성 고분자는 사슬 사이가 공유 결합(빨간 선)으로 그물처럼 이어져 있어 가열해도 녹지 않는다. 사슬은 선으로 줄여 나타낸 모식도이다.</desc>
