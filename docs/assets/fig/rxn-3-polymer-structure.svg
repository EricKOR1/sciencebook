  <text x="180.0" y="32.0" text-anchor="middle" class="rxn-3-polymer-structure-f">열가소성 고분자 (PE, PP, PET, 나일론)</text>
  <text x="540.0" y="32.0" text-anchor="middle" class="rxn-3-polymer-structure-f">열경화성 고분자 (멜라민 수지, 에폭시)</text>
  <text x="180.0" y="242.0" text-anchor="middle" class="rxn-3-polymer-structure-k">사슬끼리 얽혀 있을 뿐 → 가열하면</text>
  <text x="180.0" y="262.0" text-anchor="middle" class="rxn-3-polymer-structure-k">사슬이 미끄러져 물러진다 → 다시 성형</text>
  <text x="540.0" y="242.0" text-anchor="middle" class="rxn-3-polymer-structure-k">사슬 사이가 공유 결합으로 연결 → 가열해도</text>
  <text x="540.0" y="262.0" text-anchor="middle" class="rxn-3-polymer-structure-k">녹지 않고 단단하다</text>
