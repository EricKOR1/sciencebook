<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-ochem-3-duplicate-atoms d-ochem-3-duplicate-atoms">
  <title id="t-ochem-3-duplicate-atoms">그림 유기화학 3-4 다중 결합을 복제 원자로 펼치기</title>
  <desc id="d-ochem-3-duplicate-atoms">(가) 알데하이드 –CH=O의 탄소는 O, 복제 (O), H를 가진 것으로, 산소는 복제 (C)를 가진 것으로 본다. 괄호 원자(회색 원)는 더 이상 치환기가 없다(원자 번호 0). (나) 바이닐 –CH=CH₂의 첫 탄소는 {C, (C), H}, 둘째 탄소는 {(C), H, H}. (다) 아이소프로필 –CH(CH₃)₂의 첫 탄소는 {C, C, H}, 각 메틸은 {H, H, H}. 첫 구에서 둘은 {C, C, H}로 같지만 둘째 구에서 바이닐의 높은 가지 {C, H, H}가 아이소프로필의 {H, H, H}보다 높아 바이닐이 앞선다.</desc>
