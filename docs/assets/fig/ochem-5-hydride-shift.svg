<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-ochem-5-hydride-shift d-ochem-5-hydride-shift">
  <title id="t-ochem-5-hydride-shift">그림 유기화학 5-5 3-메틸뷰트-1-엔과 HCl: 1,2-수소화 이온 이동으로 자리 옮김</title>
  <desc id="d-ochem-5-hydride-shift">1단계에서 π 전자쌍이 HCl의 H로, H–Cl 결합의 전자쌍이 Cl로 가서(화살표 2개) C2에 양전하가 있는 3-메틸뷰탄-2-일 양이온(2°)이 생긴다. (가) Cl⁻가 곧바로 C2⁺를 잡으면 자리 옮기지 않은 2-클로로-3-메틸뷰테인(라세미)이 된다. (나) C3–H 결합의 전자쌍이 H와 함께 C2⁺로 옮겨 가면(1,2-수소화 이온 이동, 화살표 1개) 더 안정한 2-메틸뷰탄-2-일 양이온(3°)이 되고, Cl⁻가 이것을 잡아 2-클로로-2-메틸뷰테인이 된다. 옮겨 가는 H는 초록색으로 강조했다. 두 생성물은 비슷한 양으로 생긴다.</desc>
