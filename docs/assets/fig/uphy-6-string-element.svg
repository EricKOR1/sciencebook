  <text x="360.0" y="26.0" text-anchor="middle" class="uphy6stringelement-t">가로 알짜힘 = T[(∂y/∂x)<tspan baseline-shift="sub" font-size="11">x+dx</tspan> − (∂y/∂x)<tspan baseline-shift="sub" font-size="11">x</tspan>] = T (∂<tspan baseline-shift="super" font-size="11">2</tspan>y/∂x<tspan baseline-shift="super" font-size="11">2</tspan>) dx</text>
  <text x="360.0" y="306.0" text-anchor="middle" class="uphy6stringelement-t">질량 μdx인 조각: T (∂<tspan baseline-shift="super" font-size="11">2</tspan>y/∂x<tspan baseline-shift="super" font-size="11">2</tspan>) dx = μdx (∂<tspan baseline-shift="super" font-size="11">2</tspan>y/∂t<tspan baseline-shift="super" font-size="11">2</tspan>)</text>
