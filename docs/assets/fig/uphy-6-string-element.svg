<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t-uphy-6-string-element d-uphy-6-string-element">
  <title id="t-uphy-6-string-element">그림 일반물리학 6-2 줄의 작은 조각에 작용하는 장력</title>
  <desc id="d-uphy-6-string-element">마루 근처의 줄 조각(x에서 x + dx)은 양 끝에서 크기 T인 장력을 줄의 접선 방향으로 받는다. 기울기가 작으면 장력의 가로(y) 성분은 T × 기울기이고, 양 끝의 기울기가 다르므로 가로 성분의 합 T(∂²y/∂x²)dx가 조각을 평형 위치 쪽으로 가속한다. 기울기는 과장해 그렸다.</desc>
