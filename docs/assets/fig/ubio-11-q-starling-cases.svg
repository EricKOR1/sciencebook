  <title id="t-ubio-11-q-starling-cases">그림 일반생명과학 11-14 문제 12 해설 — 세 경우의 모세혈관 압력</title>
  <desc id="d-ubio-11-q-starling-cases">모세혈관을 따라 혈압(실선)은 세동맥 쪽에서 세정맥 쪽으로 떨어지고, 교질 삼투압(점선)은 일정하다. 혈압이 교질 삼투압보다 높은 구간은 여과, 낮은 구간은 재흡수이다. 정상(35→15, 25)은 +10에서 −10으로, (1) 교질 삼투압 15일 때는 +20에서 0으로, (2) 세정맥 쪽 혈압 25일 때는 +10에서 0으로 재흡수 구간이 사라진다.</desc>
