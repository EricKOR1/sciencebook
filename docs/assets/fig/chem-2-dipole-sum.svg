<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-chem-2-dipole-sum d-chem-2-dipole-sum">
  <title id="t-chem-2-dipole-sum">그림 화학 2-2 결합의 쌍극자를 더해 분자의 극성 정하기</title>
  <desc id="d-chem-2-dipole-sum">이산화 탄소와 삼플루오린화 붕소는 극성 결합을 가지지만 대칭 구조라 결합의 쌍극자가 서로 상쇄되어 무극성 분자이다. 굽은 형인 물은 두 O–H 결합의 쌍극자 합이 O 쪽으로 남아 극성 분자이다.</desc>
  <style>
    .c2dp-ink{fill:var(--fig-ink)} .c2dp-mut{fill:var(--fig-muted)}
    .c2dp-lbl{font-size:14px;fill:var(--fig-ink)} .c2dp-b{font-size:15px;font-weight:600;fill:var(--fig-ink)} .c2dp-sm{font-size:13px;fill:var(--fig-muted)}
    .c2dp-H{fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.2} .c2dp-O{fill:var(--fig-red);stroke:var(--fig-red);stroke-width:1} .c2dp-C{fill:var(--fig-ink);stroke:var(--fig-ink);stroke-width:1} .c2dp-N{fill:var(--fig-blue);stroke:var(--fig-blue);stroke-width:1}
    .c2dp-F{fill:var(--fig-teal);stroke:var(--fig-teal)} .c2dp-B{fill:var(--fig-amber);stroke:var(--fig-amber)} .c2dp-at{font-size:14px;font-weight:600} .c2dp-d{font-size:13px;font-weight:600;fill:var(--fig-red)}
  </style>
  <text x="120" y="30" text-anchor="middle" class="c2dp-b">이산화 탄소 CO₂</text>
  <line x1="50.0" y1="146.0" x2="190.0" y2="146.0" style="stroke:var(--fig-ink);stroke-width:2.5"/><line x1="50.0" y1="154.0" x2="190.0" y2="154.0" style="stroke:var(--fig-ink);stroke-width:2.5"/><circle cx="120.0" cy="150.0" r="18" class="c2dp-C"/><text x="120.0" y="155.0" text-anchor="middle" class="c2dp-at" style="fill:var(--fig-paper)">C</text><circle cx="40.0" cy="150.0" r="18" class="c2dp-O"/><text x="40.0" y="155.0" text-anchor="middle" class="c2dp-at" style="fill:var(--fig-paper)">O</text><circle cx="200.0" cy="150.0" r="18" class="c2dp-O"/><text x="200.0" y="155.0" text-anchor="middle" class="c2dp-at" style="fill:var(--fig-paper)">O</text><line x1="102.0" y1="114.0" x2="67.0" y2="114.0" style="stroke:var(--fig-red);stroke-width:2.5"/><path d="M58.0 114.0 L67.0 109.5 L67.0 118.5 Z" style="fill:var(--fig-red)"/><line x1="102.0" y1="108.0" x2="102.0" y2="120.0" style="stroke:var(--fig-red);stroke-width:2.5"/><line x1="138.0" y1="114.0" x2="173.0" y2="114.0" style="stroke:var(--fig-red);stroke-width:2.5"/><path d="M182.0 114.0 L173.0 118.5 L173.0 109.5 Z" style="fill:var(--fig-red)"/><line x1="138.0" y1="120.0" x2="138.0" y2="108.0" style="stroke:var(--fig-red);stroke-width:2.5"/><text x="40" y="190" text-anchor="middle" class="c2dp-d">δ−</text><text x="120" y="190" text-anchor="middle" class="c2dp-d">δ+</text><text x="200" y="190" text-anchor="middle" class="c2dp-d">δ−</text>
  <text x="120" y="272" text-anchor="middle" class="c2dp-sm">직선형 · 반대 방향으로 상쇄</text>
  <text x="120" y="296" text-anchor="middle" class="c2dp-b" style="fill:var(--fig-blue)">쌍극자의 합 = 0 → 무극성</text>
  <text x="360" y="30" text-anchor="middle" class="c2dp-b">삼플루오린화 붕소 BF₃</text>
  <line x1="360.0" y1="150.0" x2="360.0" y2="75.0" style="stroke:var(--fig-ink);stroke-width:3"/><line x1="360.0" y1="150.0" x2="295.0" y2="187.5" style="stroke:var(--fig-ink);stroke-width:3"/><line x1="360.0" y1="150.0" x2="425.0" y2="187.5" style="stroke:var(--fig-ink);stroke-width:3"/><circle cx="360.0" cy="75.0" r="17" class="c2dp-F"/><text x="360.0" y="80.0" text-anchor="middle" class="c2dp-at" style="fill:var(--fig-paper)">F</text><circle cx="295.0" cy="187.5" r="17" class="c2dp-F"/><text x="295.0" y="192.5" text-anchor="middle" class="c2dp-at" style="fill:var(--fig-paper)">F</text><circle cx="425.0" cy="187.5" r="17" class="c2dp-F"/><text x="425.0" y="192.5" text-anchor="middle" class="c2dp-at" style="fill:var(--fig-paper)">F</text><circle cx="360.0" cy="150.0" r="18" class="c2dp-B"/><text x="360.0" y="155.0" text-anchor="middle" class="c2dp-at" style="fill:var(--fig-paper)">B</text><line x1="374.0" y1="126.0" x2="374.0" y2="101.0" style="stroke:var(--fig-red);stroke-width:2.5"/><path d="M374.0 92.0 L378.5 101.0 L369.5 101.0 Z" style="fill:var(--fig-red)"/><line x1="380.0" y1="126.0" x2="368.0" y2="126.0" style="stroke:var(--fig-red);stroke-width:2.5"/><line x1="332.2" y1="149.9" x2="310.6" y2="162.4" style="stroke:var(--fig-red);stroke-width:2.5"/><path d="M302.8 166.9 L308.3 158.5 L312.8 166.3 Z" style="fill:var(--fig-red)"/><line x1="329.2" y1="144.7" x2="335.2" y2="155.1" style="stroke:var(--fig-red);stroke-width:2.5"/><line x1="373.8" y1="174.1" x2="395.4" y2="186.6" style="stroke:var(--fig-red);stroke-width:2.5"/><path d="M403.2 191.1 L393.2 190.5 L397.7 182.7 Z" style="fill:var(--fig-red)"/><line x1="370.8" y1="179.3" x2="376.8" y2="168.9" style="stroke:var(--fig-red);stroke-width:2.5"/>
  <text x="360" y="272" text-anchor="middle" class="c2dp-sm">평면 삼각형 · 120° 간격으로 상쇄</text>
  <text x="360" y="296" text-anchor="middle" class="c2dp-b" style="fill:var(--fig-blue)">쌍극자의 합 = 0 → 무극성</text>
  <text x="600" y="30" text-anchor="middle" class="c2dp-b">물 H₂O</text>
  <line x1="600.0" y1="120.0" x2="544.7" y2="162.9" style="stroke:var(--fig-ink);stroke-width:3"/><line x1="600.0" y1="120.0" x2="655.3" y2="162.9" style="stroke:var(--fig-ink);stroke-width:3"/><circle cx="544.7" cy="162.9" r="14" class="c2dp-H"/><text x="544.7" y="167.9" text-anchor="middle" class="c2dp-at" style="fill:var(--fig-ink)">H</text><circle cx="655.3" cy="162.9" r="14" class="c2dp-H"/><text x="655.3" y="167.9" text-anchor="middle" class="c2dp-at" style="fill:var(--fig-ink)">H</text><circle cx="600.0" cy="120.0" r="19" class="c2dp-O"/><text x="600.0" y="125.0" text-anchor="middle" class="c2dp-at" style="fill:var(--fig-paper)">O</text><line x1="546.9" y1="139.6" x2="568.2" y2="123.1" style="stroke:var(--fig-red);stroke-width:2.5"/><path d="M575.4 117.6 L571.0 126.6 L565.5 119.5 Z" style="fill:var(--fig-red)"/><line x1="550.6" y1="144.4" x2="543.2" y2="134.9" style="stroke:var(--fig-red);stroke-width:2.5"/><line x1="653.1" y1="139.6" x2="631.8" y2="123.1" style="stroke:var(--fig-red);stroke-width:2.5"/><path d="M624.6 117.6 L634.5 119.5 L629.0 126.6 Z" style="fill:var(--fig-red)"/><line x1="656.8" y1="134.9" x2="649.4" y2="144.4" style="stroke:var(--fig-red);stroke-width:2.5"/><line x1="600" y1="238" x2="600" y2="160" style="stroke:var(--fig-green);stroke-width:4"/><path d="M600 148 l-8 13 l16 0 z" style="fill:var(--fig-green)"/><text x="610" y="230" class="c2dp-sm" style="fill:var(--fig-green);font-weight:600">합</text><text x="630" y="112" class="c2dp-d">δ−</text><text x="514.6517298379309" y="168.85520960241143" class="c2dp-d">δ+</text><text x="671.3482701620691" y="168.85520960241143" class="c2dp-d">δ+</text>
  <text x="600" y="272" text-anchor="middle" class="c2dp-sm">굽은 형 · 합이 O 쪽으로 남음</text>
  <text x="600" y="296" text-anchor="middle" class="c2dp-b" style="fill:var(--fig-red)">쌍극자의 합 ≠ 0 → 극성</text>
  <line x1="240" y1="50" x2="240" y2="300" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4"/><line x1="480" y1="50" x2="480" y2="300" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4"/>
  <text x="360" y="334" text-anchor="middle" class="c2dp-sm">빨간 화살표: 결합의 쌍극자(δ+ 쪽 꼬리에 짧은 세로선, δ− 쪽을 향함) · 초록 화살표: 쌍극자의 합</text>
</svg>
