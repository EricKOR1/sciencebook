  <text x="628.0" y="140.0" text-anchor="start" class="rxn-2-electrolysis-cells-s" style="fill:var(--fig-red)">산화 전극</text>
  <line x1="586.0" y1="250.0" x2="499.6" y2="250.0" style="stroke:var(--fig-blue);stroke-width:2"/>
  <path d="M494.0 250.0 L501.1 246.4 L501.1 253.6 Z" style="fill:var(--fig-blue)"/>
  <text x="540.0" y="240.0" text-anchor="middle" class="rxn-2-electrolysis-cells-k" style="fill:var(--fig-blue);font-weight:700">Cu²⁺</text>
  <text x="545.0" y="314.0" text-anchor="middle" class="rxn-2-electrolysis-cells-s">CuSO₄(aq)</text>
  <text x="545.0" y="350.0" text-anchor="middle" class="rxn-2-electrolysis-cells-k">환원 전극(철 클립): Cu²⁺ + 2e⁻ → Cu</text>
  <text x="545.0" y="370.0" text-anchor="middle" class="rxn-2-electrolysis-cells-k">산화 전극(구리판): Cu → Cu²⁺ + 2e⁻</text>
  <text x="545.0" y="394.0" text-anchor="middle" class="rxn-2-electrolysis-cells-s" style="fill:var(--fig-blue)">녹은 만큼 입혀지므로 Cu²⁺의 양(푸른색)은 거의 그대로</text>
  <line x1="362.0" y1="30.0" x2="362.0" y2="400.0" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4"/>
  <text x="360.0" y="418.0" text-anchor="middle" class="rxn-2-electrolysis-cells-s">전원의 (−)극이 밀어 넣은 전자로 환원이, (+)극이 끌어가는 전자로 산화가 일어난다(모식도).</text>
