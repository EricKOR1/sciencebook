  <line x1="150.0" y1="262.0" x2="196.4" y2="262.0" style="stroke:var(--fig-green);stroke-width:2"/>
  <path d="M202.0 262.0 L194.9 265.6 L194.9 258.4 Z" style="fill:var(--fig-green)"/>
  <text x="176.0" y="284.0" text-anchor="middle" class="rxn-2-electrolysis-cells-k" style="fill:var(--fig-green);font-weight:700">Cl⁻</text>
  <text x="175.0" y="312.0" text-anchor="middle" class="rxn-2-electrolysis-cells-s">NaCl(aq)</text>
  <text x="175.0" y="350.0" text-anchor="middle" class="rxn-2-electrolysis-cells-k">환원 전극: 2H₂O + 2e⁻ → H₂ + 2OH⁻</text>
  <text x="175.0" y="370.0" text-anchor="middle" class="rxn-2-electrolysis-cells-k">산화 전극: 2Cl⁻ → Cl₂ + 2e⁻</text>
  <text x="175.0" y="394.0" text-anchor="middle" class="rxn-2-electrolysis-cells-s" style="fill:var(--fig-violet)">Na⁺는 (−)극 쪽으로 가지만 환원되지 않고 물이 환원된다</text>
