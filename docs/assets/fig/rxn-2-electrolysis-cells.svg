<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" role="img" aria-labelledby="t-rxn-2-electrolysis-cells d-rxn-2-electrolysis-cells">
  <title id="t-rxn-2-electrolysis-cells">그림 화학 반응의 세계 2-5 염화 나트륨 수용액의 전기 분해와 구리 도금</title>
  <desc id="d-rxn-2-electrolysis-cells">(가) 염화 나트륨 수용액을 전기 분해하면 전원의 (−)극에 연결된 전극에서는 Na⁺ 대신 물이 환원되어 수소가, (+)극에 연결된 전극에서는 Cl⁻이 산화되어 염소가 생긴다. (나) 구리 도금에서는 (+)극에 연결한 구리판이 산화되어 녹고, (−)극에 연결한 철 클립 표면에 Cu²⁺가 환원되어 구리가 입혀진다. 장치는 모식도이다.</desc>
  <style>
    .rxn-2-electrolysis-cells-T{font-size:15px;fill:var(--fig-ink);font-weight:700}
    .rxn-2-electrolysis-cells-f{font-size:14px;fill:var(--fig-ink);font-weight:600}
    .rxn-2-electrolysis-cells-k{font-size:13px;fill:var(--fig-ink)}
    .rxn-2-electrolysis-cells-s{font-size:13px;fill:var(--fig-muted)}
    .rxn-2-electrolysis-cells-b{font-size:15px;fill:var(--fig-ink);font-weight:600}
  </style>
  <text x="175.0" y="22.0" text-anchor="middle" class="rxn-2-electrolysis-cells-T">(가) 염화 나트륨 수용액</text>
