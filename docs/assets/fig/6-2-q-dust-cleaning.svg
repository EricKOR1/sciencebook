  <desc id="d-6-2-q-dust-cleaning">(가)는 8개 값을 그대로 그린 것으로, 12시의 이상값 999와 15시의 측정 실패 값 −1 때문에 평균(151.5)이 대부분의 값보다 훨씬 위에 놓인다. (나)는 두 값을 뺀 6개 값으로, 평균(약 35.7)이 자료의 가운데에 놓인다. 두 그래프의 세로축 눈금은 서로 다르다.</desc>
