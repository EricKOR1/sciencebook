<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-chem-1-propane-balance d-chem-1-propane-balance">
  <title id="t-chem-1-propane-balance">그림 화학 1-3 원자 수로 확인하는 프로페인의 연소 반응식</title>
  <desc id="d-chem-1-propane-balance">프로페인 분자 1개와 산소 분자 5개가 반응하여 이산화 탄소 분자 3개와 물 분자 4개가 생긴다. 반응 전후 탄소 3개, 수소 8개, 산소 10개로 원자의 종류와 수가 같다. 분자 모형의 크기와 모양은 모식적으로 나타냈다.</desc>
  <style>
    .c1pb-ink{fill:var(--fig-ink)} .c1pb-mut{fill:var(--fig-muted)}
