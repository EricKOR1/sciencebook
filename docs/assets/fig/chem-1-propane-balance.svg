    .c1pb-H{fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.2} .c1pb-O{fill:var(--fig-red);stroke:var(--fig-red);stroke-width:1} .c1pb-C{fill:var(--fig-ink);stroke:var(--fig-ink);stroke-width:1} .c1pb-N{fill:var(--fig-blue);stroke:var(--fig-blue);stroke-width:1}
    .c1pb-Cl{fill:var(--fig-green);stroke:var(--fig-green);stroke-width:1} .c1pb-at{font-size:13px;font-weight:600}
    .c1pb-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2} .c1pb-cnt{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.2}
  </style>
