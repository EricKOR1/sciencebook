  <text x="365.0" y="292.0" text-anchor="middle" class="c1pb-b">H 원자</text>
  <text x="365.0" y="316.0" text-anchor="middle" class="c1pb-lbl">8  →  4 × 2 = 8</text>
  <rect x="490" y="270" width="210" height="58" rx="6" class="c1pb-cnt"/>
  <text x="595.0" y="292.0" text-anchor="middle" class="c1pb-b">O 원자</text>
  <text x="595.0" y="316.0" text-anchor="middle" class="c1pb-lbl">5 × 2 = 10  →  3 × 2 + 4 × 1 = 10</text>
  <text x="360.0" y="350.0" text-anchor="middle" class="c1pb-sm">C ● 검은색 · O ● 빨간색 · H ○ 흰색 — 계수만 바꾸어 원자 수를 맞추고, 화학식(아래 첨자)은 바꾸지 않는다</text>
