<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-bio-2-brain d-bio-2-brain">
  <title id="t-bio-2-brain">그림 생명과학 2-4 대뇌 겉질의 엽과 뇌의 구조</title>
  <desc id="d-bio-2-brain">(가) 대뇌 겉질은 중심 고랑과 가쪽 고랑을 경계로 전두엽, 두정엽, 측두엽, 후두엽으로 나뉜다. (나) 세로 단면에서 좌우 반구를 잇는 뇌량, 간뇌(시상과 시상하부), 시상하부 아래의 뇌하수체, 중뇌·뇌교·연수로 이루어진 뇌줄기, 그 뒤의 소뇌를 볼 수 있다. 모식도.</desc>
  <style>
    .b2brn-lbl{font-size:13.5px;fill:var(--fig-ink)} .b2brn-b{font-size:14.5px;font-weight:700;fill:var(--fig-ink)}
    .b2brn-sm{font-size:12.5px;fill:var(--fig-muted)} .b2brn-lead{fill:none;stroke:var(--fig-muted);stroke-width:1.1}
    .b2brn-ink{fill:var(--fig-ink)} .b2brn-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.6}
    
  </style>
