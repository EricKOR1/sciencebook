<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-m3-06-segregation-chromosomes d-m3-06-segregation-chromosomes">
  <title id="t-m3-06-segregation-chromosomes">그림 중3-6-6 분리의 법칙과 독립의 법칙을 염색체로 보기</title>
  <desc id="d-m3-06-segregation-chromosomes">왼쪽: 유전자형이 Rr인 세포에서 R와 r는 상동 염색체의 같은 위치에 있다. 생식세포를 만들 때 상동 염색체가 갈라지므로 생식세포는 R 또는 r 하나만 1/2씩 받는다(분리의 법칙). 오른쪽: RrYy인 세포에서 모양 유전자와 색 유전자가 서로 다른 염색체 쌍에 있으면, 첫 번째 분열에서 두 쌍이 늘어서는 방향이 서로 상관없이 정해진다. 그래서 RY, ry, Ry, rY 네 가지 생식세포가 1/4씩 생긴다(독립의 법칙). 복제 과정을 생략한 모식도이다.</desc>
