  <title id="t-ochem-6-q-methylcyclohexanol-chairs">그림 유기화학 6-19 문제 8의 두 이성질체와 의자 형태</title>
  <desc id="d-ochem-6-q-methylcyclohexanol-chairs">위: cis-2-메틸사이클로헥산-1-올(한 거울상), 아래: trans-2-메틸사이클로헥산-1-올(한 거울상). 각각 고리 뒤집힘으로 오가는 두 의자 형태를 나란히 그렸다. OH가 붙은 C1과 이웃 C2·C6에 번호를 붙이고, 이 세 탄소의 H를 축 방향·적도 방향으로 모두 그렸다.</desc>
