  <title id="t-earth-1-q-cyclone-abc">그림 지구과학 1-19 문제 13의 중위도 저기압과 관측소 A, B, C</title>
  <desc id="d-earth-1-q-cyclone-abc">중위도 저기압의 중심(L)에서 동쪽으로 온난 전선, 남서쪽으로 한랭 전선이 뻗어 있고, 관측소 A는 두 전선 사이의 남쪽, B는 온난 전선의 동쪽, C는 한랭 전선의 서쪽에 있다. 회색 곡선은 등압선이며 모식도이다.</desc>
