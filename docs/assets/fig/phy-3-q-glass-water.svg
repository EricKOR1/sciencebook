<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t-phy-3-q-glass-water d-phy-3-q-glass-water">
  <title id="t-phy-3-q-glass-water">그림 물리학 3-14 문제 12의 유리와 물의 경계면에 도달한 빛</title>
  <desc id="d-phy-3-q-glass-water">유리(굴절률 1.5) 속을 진행하던 빛이 물(굴절률 1.33)과의 경계면에 (가) 입사각 60°, (나) 입사각 70°로 도달한다. 경계면을 지난 뒤의 진행은 그리지 않았다.</desc>
  <style>.phy-3-q-glass-water-t{font-size:14px;fill:var(--fig-ink)} .phy-3-q-glass-water-s{font-size:13px;fill:var(--fig-muted)} .phy-3-q-glass-water-b{font-weight:700} .phy-3-q-glass-water-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .phy-3-q-glass-water-r{fill:var(--fig-red)} .phy-3-q-glass-water-bl{fill:var(--fig-blue)} .phy-3-q-glass-water-g{fill:var(--fig-green)}</style>
  <text x="180" y="26" text-anchor="middle" class="phy-3-q-glass-water-h">(가) 입사각 60°</text>
  <rect x="20" y="40" width="320" height="110" rx="0" style="fill:var(--fig-soft-teal);stroke:none"/>
  <rect x="20" y="150" width="320" height="100" rx="0" style="fill:var(--fig-soft-blue);stroke:none"/>
  <line x1="20" y1="150" x2="340" y2="150" style="stroke:var(--fig-ink);stroke-width:2;stroke-linecap:round"/>
  <line x1="180" y1="48" x2="180" y2="244" style="stroke:var(--fig-muted);stroke-width:1.2;stroke-linecap:round;stroke-dasharray:5 4"/>
  <line x1="67.4" y1="85" x2="170.5" y2="144.5" style="stroke:var(--fig-amber);stroke-width:2.8;stroke-linecap:butt"/>
  <path d="M180 150 L166.3 149.7 L172.9 138.3 Z" style="fill:var(--fig-amber);stroke:none"/>
  <path d="M180 108 A 42 42 0 0 0 143.6 129" style="fill:none;stroke:var(--fig-ink);stroke-width:1.4;stroke-linejoin:round"/>
  <text x="150" y="102" text-anchor="middle" class="phy-3-q-glass-water-t">60°</text>
  <text x="330" y="64" text-anchor="end" class="phy-3-q-glass-water-s">유리(굴절률 1.5)</text>
  <text x="330" y="238" text-anchor="end" class="phy-3-q-glass-water-s">물(굴절률 1.33)</text>
  <text x="210" y="196" text-anchor="middle" class="phy-3-q-glass-water-h">?</text>
  <text x="186" y="60" class="phy-3-q-glass-water-s">법선</text>
  <text x="540" y="26" text-anchor="middle" class="phy-3-q-glass-water-h">(나) 입사각 70°</text>
  <rect x="380" y="40" width="320" height="110" rx="0" style="fill:var(--fig-soft-teal);stroke:none"/>
  <rect x="380" y="150" width="320" height="100" rx="0" style="fill:var(--fig-soft-blue);stroke:none"/>
  <line x1="380" y1="150" x2="700" y2="150" style="stroke:var(--fig-ink);stroke-width:2;stroke-linecap:round"/>
  <line x1="540" y1="48" x2="540" y2="244" style="stroke:var(--fig-muted);stroke-width:1.2;stroke-linecap:round;stroke-dasharray:5 4"/>
  <line x1="417.8" y1="105.5" x2="529.7" y2="146.2" style="stroke:var(--fig-amber);stroke-width:2.8;stroke-linecap:butt"/>
  <path d="M540 150 L526.5 152.1 L531 139.7 Z" style="fill:var(--fig-amber);stroke:none"/>
  <path d="M540 108 A 42 42 0 0 0 500.5 135.6" style="fill:none;stroke:var(--fig-ink);stroke-width:1.4;stroke-linejoin:round"/>
  <text x="505.6" y="104.9" text-anchor="middle" class="phy-3-q-glass-water-t">70°</text>
  <text x="690" y="64" text-anchor="end" class="phy-3-q-glass-water-s">유리(굴절률 1.5)</text>
  <text x="690" y="238" text-anchor="end" class="phy-3-q-glass-water-s">물(굴절률 1.33)</text>
  <text x="570" y="196" text-anchor="middle" class="phy-3-q-glass-water-h">?</text>
  <text x="546" y="60" class="phy-3-q-glass-water-s">법선</text>
</svg>
