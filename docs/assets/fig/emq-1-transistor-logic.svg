  <title id="t-emq-1-transistor-logic">그림 전자기와 양자 1-8 트랜지스터의 전류와 스위치로 만든 논리 게이트</title>
  <desc id="d-emq-1-transistor-logic">(가) 트랜지스터는 베이스로 들어가는 작은 전류가 컬렉터에서 이미터로 흐르는 큰 전류를 조절한다(컬렉터 전류 = β × 베이스 전류, 이미터 전류 = 베이스 전류 + 컬렉터 전류). (나) 트랜지스터를 스위치로 쓰면 두 스위치를 직렬로 이어 AND, (다) 병렬로 이어 OR 게이트를 만들 수 있다.</desc>
