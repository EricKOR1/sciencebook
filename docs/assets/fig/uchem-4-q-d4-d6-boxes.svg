  <title id="t-uchem-4-q-d4-d6-boxes">그림 일반화학 4-13 문제 13의 d 전자 배치</title>
  <desc id="d-uchem-4-q-d4-d6-boxes">다섯 개의 3d 오비탈에 훈트 규칙으로 전자를 채운 그림. 홀전자 4개가 되는 경우는 d⁴(Mn³⁺)와 d⁶(Co³⁺) 두 가지이다. 중성 원자로 돌아가면 Mn은 3d⁵ 4s²로 홀전자 5개, Co는 3d⁷ 4s²로 홀전자 3개이다.</desc>
