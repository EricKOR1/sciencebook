<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-ubio-4-q-pathway-steps d-ubio-4-q-pathway-steps">
  <title id="t-ubio-4-q-pathway-steps">그림 일반생명과학 4-14 문제 17 해설: 글리코젠 분해 경로와 각 처리가 작용하는 자리</title>
  <desc id="d-ubio-4-q-pathway-steps">cAMP 유사체는 cAMP 자리에서 경로에 들어오므로 그 앞(수용체, G 단백질, 아데닐산 고리화 효소)의 결함은 건너뛰고, 그 뒤(PKA부터)의 결함은 건너뛰지 못한다. 그래서 돌연변이 M의 결함은 cAMP 앞, N의 결함은 cAMP 뒤에 있다. PKA 억제제는 PKA를, PDE는 cAMP를 분해해 신호를 끈다.</desc>
