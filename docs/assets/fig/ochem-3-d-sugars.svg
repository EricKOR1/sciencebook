<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-ochem-3-d-sugars d-ochem-3-d-sugars">
  <title id="t-ochem-3-d-sugars">그림 유기화학 3-11 D-당의 피셔 투영식</title>
  <desc id="d-ochem-3-d-sugars">(가) D-글리세르알데하이드 (R), (나) D-에리트로스 (2R,3R), (다) D-트레오스 (2S,3R), (라) D-글루코스 사슬형 (2R,3S,4R,5R). 각 입체 중심 옆에 CIP 기호를 적었다. 카보닐에서 가장 먼 입체 중심의 OH(파랑)가 모두 오른쪽에 있어 D-당이다. (나)와 (다)는 C2만 다른 에피머(부분 입체 이성질체)이다.</desc>
