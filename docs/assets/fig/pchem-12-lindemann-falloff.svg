<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-pchem-12-lindemann-falloff d-pchem-12-lindemann-falloff">
  <title id="t-pchem-12-lindemann-falloff">그림 물리화학 12-6 린데만 낙하 곡선</title>
  <desc id="d-pchem-12-lindemann-falloff">k∞ = 2.0×10⁻⁴ s⁻¹, ka = 20 M⁻¹ s⁻¹일 때 k_uni = k∞·ka[M]/(k∞ + ka[M])를 로그–로그로 그렸다. 낮은 농도에서는 기울기 1인 점선 k = ka[M](2차)을, 높은 농도에서는 수평 점선 k = k∞(1차)를 따른다. 전이 농도 [M]1/2 = 1.0×10⁻⁵ M에서 k_uni = k∞/2 = 1.0×10⁻⁴ s⁻¹이다.</desc>
