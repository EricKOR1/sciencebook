<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 370" class="fig-small" role="img" aria-labelledby="t-uphy-5-q-earth-tunnel d-uphy-5-q-earth-tunnel">
  <title id="t-uphy-5-q-earth-tunnel">그림 일반물리학 5-15 문제 16의 지구를 관통하는 터널</title>
  <desc id="d-uphy-5-q-earth-tunnel">밀도가 균일한 지구를 지름 방향으로 관통하는 곧은 터널이 있고, 물체를 한쪽 입구에서 가만히 놓는다. 물체가 중심 O에서 거리 r인 곳에 있는 모습과, 지표 바로 위를 도는 원 궤도 위성을 함께 나타냈다. 모식도이다.</desc>
  <style>.cuphy5qearthtunnel-t{font-size:14px;fill:var(--fig-ink)} .cuphy5qearthtunnel-s{font-size:13px;fill:var(--fig-muted)} .cuphy5qearthtunnel-b{font-size:15px;font-weight:700;fill:var(--fig-ink)} .cuphy5qearthtunnel-i{font-size:15px;font-style:italic;fill:var(--fig-ink)} .cuphy5qearthtunnel-ax{stroke:var(--fig-ink);stroke-width:1.4;fill:none} .cuphy5qearthtunnel-grid{stroke:var(--fig-line);stroke-width:0.7;fill:none}</style>
