<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-earth-2-time-scale d-earth-2-time-scale">
  <title id="t-earth-2-time-scale">그림 지구과학 2-6 지질시대의 구분 — 시간 비율로 본 대와 기</title>
  <desc id="d-earth-2-time-scale">지구 역사 46억 년 가운데 약 88 %가 선캄브리아 시대이다. 아래 막대는 최근 약 5.4억 년을 늘려 고생대(캄브리아기~페름기), 중생대(트라이아스기~백악기), 신생대(팔레오기~제4기)의 기를 시간 비율대로 나타내고, 대표적인 표준 화석과 대규모 멸종 시기를 표시하였다.</desc>
  <style>
    .earth-2-time-scale-t{font-size:14px;fill:var(--fig-ink)}
    .earth-2-time-scale-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .earth-2-time-scale-s{font-size:13px;fill:var(--fig-muted)}
    .earth-2-time-scale-land{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:0.8;fill-rule:evenodd}
    .earth-2-time-scale-sea{fill:var(--fig-soft-blue)}
    .earth-2-time-scale-grat{fill:none;stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3;opacity:0.7}
    .earth-2-time-scale-frame{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .earth-2-time-scale-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
<text x="30" y="28" text-anchor="start" class="earth-2-time-scale-b">지구 역사 전체(약 46억 년)</text><rect x="30" y="40" width="582.4" height="34" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet)"/><rect x="612.4" y="40" width="77.6" height="34" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber)"/><text x="321.2" y="62" text-anchor="middle" class="earth-2-time-scale-b">선캄브리아 시대 (약 88 %)</text><text x="30" y="92" text-anchor="start" class="earth-2-time-scale-s">46억 년 전</text><text x="690" y="92" text-anchor="end" class="earth-2-time-scale-s">현재</text><text x="612.4" y="92" text-anchor="end" class="earth-2-time-scale-s">5.4억 년 전</text><path d="M612.4 74 L30 150 M690 74 L690 150" style="fill:none;stroke:var(--fig-muted);stroke-width:1.2;stroke-dasharray:4 3"/><path d="M612.4 74 L690 74 L690 150 L30 150 Z" style="fill:var(--fig-soft-amber);opacity:0.25"/><rect x="30" y="150" width="352.6" height="30" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue)"/><text x="206.3" y="170" text-anchor="middle" class="earth-2-time-scale-b">고생대</text><text x="206.3" y="142" text-anchor="middle" class="earth-2-time-scale-s">표준 화석: 삼엽충 · 필석</text><rect x="382.6" y="150" width="226.9" height="30" style="fill:var(--fig-soft-green);stroke:var(--fig-green)"/><text x="496" y="170" text-anchor="middle" class="earth-2-time-scale-b">중생대</text><text x="496" y="142" text-anchor="middle" class="earth-2-time-scale-s">암모나이트 · 공룡</text><rect x="609.5" y="150" width="80.5" height="30" style="fill:var(--fig-soft-red);stroke:var(--fig-red)"/><text x="649.7" y="170" text-anchor="middle" class="earth-2-time-scale-b">신생대</text><text x="690" y="142" text-anchor="end" class="earth-2-time-scale-s">화폐석 · 매머드</text><rect x="30" y="180" width="68.3" height="26" style="fill:var(--fig-soft-blue);stroke:var(--fig-ink);stroke-width:0.8"/><line x1="64.2" y1="206" x2="64.2" y2="217" style="stroke:var(--fig-muted);stroke-width:1"/><text x="64.2" y="230" text-anchor="middle" class="earth-2-time-scale-t">캄브리아기</text><rect x="98.3" y="180" width="50" height="26" style="fill:var(--fig-soft-blue);stroke:var(--fig-ink);stroke-width:0.8"/><line x1="123.3" y1="206" x2="123.3" y2="239" style="stroke:var(--fig-muted);stroke-width:1"/><text x="123.3" y="252" text-anchor="middle" class="earth-2-time-scale-t">오르도비스기</text><rect x="148.3" y="180" width="30.5" height="26" style="fill:var(--fig-soft-blue);stroke:var(--fig-ink);stroke-width:0.8"/><line x1="163.6" y1="206" x2="163.6" y2="217" style="stroke:var(--fig-muted);stroke-width:1"/><text x="163.6" y="230" text-anchor="middle" class="earth-2-time-scale-t">실루리아기</text><rect x="178.8" y="180" width="73.2" height="26" style="fill:var(--fig-soft-blue);stroke:var(--fig-ink);stroke-width:0.8"/><line x1="215.4" y1="206" x2="215.4" y2="239" style="stroke:var(--fig-muted);stroke-width:1"/><text x="215.4" y="252" text-anchor="middle" class="earth-2-time-scale-t">데본기</text><rect x="252" y="180" width="73.2" height="26" style="fill:var(--fig-soft-blue);stroke:var(--fig-ink);stroke-width:0.8"/><line x1="288.6" y1="206" x2="288.6" y2="217" style="stroke:var(--fig-muted);stroke-width:1"/><text x="288.6" y="230" text-anchor="middle" class="earth-2-time-scale-t">석탄기</text><rect x="325.2" y="180" width="57.3" height="26" style="fill:var(--fig-soft-blue);stroke:var(--fig-ink);stroke-width:0.8"/><line x1="353.9" y1="206" x2="353.9" y2="239" style="stroke:var(--fig-muted);stroke-width:1"/><text x="353.9" y="252" text-anchor="middle" class="earth-2-time-scale-t">페름기</text><rect x="382.6" y="180" width="62.2" height="26" style="fill:var(--fig-soft-green);stroke:var(--fig-ink);stroke-width:0.8"/><line x1="413.7" y1="206" x2="413.7" y2="217" style="stroke:var(--fig-muted);stroke-width:1"/><text x="413.7" y="230" text-anchor="middle" class="earth-2-time-scale-t">트라이아스기</text><rect x="444.8" y="180" width="68.3" height="26" style="fill:var(--fig-soft-green);stroke:var(--fig-ink);stroke-width:0.8"/><line x1="478.9" y1="206" x2="478.9" y2="239" style="str