;stroke-width:3"/><line x1="444.8" y1="180" x2="444.8" y2="206" style="stroke:var(--fig-red);stroke-width:3"/><line x1="609.5" y1="180" x2="609.5" y2="206" style="stroke:var(--fig-red);stroke-width:3"/><line x1="30" y1="322" x2="54" y2="322" style="stroke:var(--fig-red);stroke-width:3"/><text x="62" y="327" text-anchor="start" class="earth-2-time-scale-s">대규모 멸종 시기(가장 큰 것: 페름기 말)</text><text x="690" y="327" text-anchor="end" class="earth-2-time-scale-s">아래 막대는 위 막대의 5.4억 년 부분을 늘린 것</text>
</svg>
