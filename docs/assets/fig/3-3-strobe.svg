    .stb-dash{stroke:var(--fig-line);stroke-width:1.2;stroke-dasharray:4 4;fill:none}
    .stb-vy{stroke:var(--fig-red);stroke-width:2.5;fill:none}
    .stb-vx{stroke:var(--fig-blue);stroke-width:2.5;fill:none}
  </style>
