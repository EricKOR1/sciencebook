  <title id="t-3-3-strobe">그림 3-3-1 자유 낙하와 수평으로 던진 공의 다중 섬광 사진(모식도)</title>
  <desc id="d-3-3-strobe">0.1초 간격으로 두 공의 위치를 겹쳐 나타냈다. 두 공은 매 순간 같은 높이에 있고, 수평으로 던진 공은 같은 시간 동안 같은 수평 거리를 간다. 공기 저항은 무시했다.</desc>
