  <text x="360" y="318" text-anchor="middle" class="u4rv-s">모든 점의 속도는 접촉점 P까지의 선분(점선)에 수직이고, 크기는 P까지 거리 × ω — P를 순간 회전축으로 보는 것과 같다</text>
