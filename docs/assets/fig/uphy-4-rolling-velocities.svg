  <title id="t-uphy-4-rolling-velocities">그림 일반물리학 4-2 구르는 바퀴 위 점들의 속도</title>
  <desc id="d-uphy-4-rolling-velocities">미끄러지지 않고 구르는 바퀴의 운동은 모든 점이 v로 앞으로 가는 병진과, 둘레의 점이 크기 v로 도는 회전의 합이다. 합치면 꼭대기는 2v, 중심은 v, 땅에 닿은 점은 0이고, 모든 점의 속도는 접촉점 P를 중심으로 도는 것처럼 P까지 거리에 비례한다.</desc>
