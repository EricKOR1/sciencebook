  <title id="t-uchem-12-decay-curve">그림 일반화학 12-4 방사성 붕괴 곡선과 탄소-14 연대 측정</title>
  <desc id="d-uchem-12-decay-curve">왼쪽: 남은 원자 수(또는 방사능)의 비율은 반감기마다 절반이 되는 지수 곡선을 그린다. 아래 눈금은 탄소-14(반감기 5730년)의 경우이며, 방사능이 살아 있는 생물의 80.0 %인 시료는 약 1840년 전의 것이다(예제 4). 오른쪽: 같은 자료의 ln(N/N₀)을 시간에 대해 그리면 기울기가 −λ인 직선이 된다.</desc>
