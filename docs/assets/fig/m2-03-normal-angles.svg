<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-m2-03-normal-angles d-m2-03-normal-angles">
  <title id="t-m2-03-normal-angles">그림 중2-3-3 법선과 입사각·반사각·굴절각</title>
  <desc id="d-m2-03-normal-angles">빛이 닿은 점에 표면과 수직으로 세운 선이 법선이다. 입사각, 반사각, 굴절각은 모두 표면이 아니라 법선과 광선 사이의 각이다. (가) 거울에서는 입사각과 반사각이 같다. 표면과 40°를 이루며 들어온 빛의 입사각은 50°이다. (나) 공기에서 물로 비스듬히 들어간 빛은 법선 쪽으로 꺾여 굴절각이 입사각보다 작다. 꺾이는 정도는 물에 맞춰 그렸다.</desc>
  <style>
    .m2-03-normal-angles-t{font-size:14px;fill:var(--fig-ink)}
    .m2-03-normal-angles-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .m2-03-normal-angles-s{font-size:13px;fill:var(--fig-muted)}

  </style>
