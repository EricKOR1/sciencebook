  <title id="t-matter-4-q-catalyst-energy">그림 물질과 에너지 4-8 문제 7의 반응 경로와 촉매</title>
  <desc id="d-matter-4-q-catalyst-energy">정반응 활성화 에너지 50 kJ/mol, 역반응 활성화 에너지 120 kJ/mol이므로 ΔH = 50 − 120 = −70 kJ/mol이다. 정촉매가 언덕을 20 kJ/mol 낮추면 정반응은 30, 역반응은 100 kJ/mol이 되고 ΔH는 그대로이다. 높이는 값에 비례하게 그렸다.</desc>
