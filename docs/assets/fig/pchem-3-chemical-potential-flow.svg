<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-pchem-3-chemical-potential-flow d-pchem-3-chemical-potential-flow">
  <title id="t-pchem-3-chemical-potential-flow">그림 물리화학 3-10 화학 퍼텐셜의 차가 물질을 흐르게 한다</title>
  <desc id="d-pchem-3-chemical-potential-flow">같은 온도·압력의 두 칸 α, β를 성분 i만 지나가는 칸막이(점선)로 나누었다. 성분 i가 촘촘한 α 쪽의 화학 퍼텐셜이 더 높아(μ_i^α &gt; μ_i^β) i가 α에서 β로 옮겨 가며(dn &gt; 0), 이때 dG = (μ_i^β − μ_i^α) dn &lt; 0이다. 시간이 지나 두 칸의 밀도가 같아지면 μ_i^α = μ_i^β로 평형이다. 오른쪽은 같은 구조의 비유로, 온도 차는 열을, 압력 차는 피스톤(경계)을 움직인다. 입자 수는 두 그림에서 같다(36개).</desc>
