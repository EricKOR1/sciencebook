<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-pchem-3-g-temperature-phases d-pchem-3-g-temperature-phases">
  <title id="t-pchem-3-g-temperature-phases">그림 물리화학 3-9 일정 압력에서 고체·액체·기체의 몰 깁스 에너지와 온도</title>
  <desc id="d-pchem-3-g-temperature-phases">세 상의 G_m은 모두 온도가 오르면 내려가고(기울기 −S_m), 위로 볼록하다(∂²G/∂T² = −C_p/T &lt; 0). 기울기의 크기는 고체 &lt; 액체 &lt; 기체이다. 고체–액체, 액체–기체 곡선이 만나는 두 점은 다음 단원(상평형)에서 다룬다. 눈금 없는 모식도이다.</desc>
