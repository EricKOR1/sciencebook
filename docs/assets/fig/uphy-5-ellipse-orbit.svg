<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-uphy-5-ellipse-orbit d-uphy-5-ellipse-orbit">
  <title id="t-uphy-5-ellipse-orbit">그림 일반물리학 5-4 타원 궤도의 근일점과 원일점</title>
  <desc id="d-uphy-5-ellipse-orbit">태양은 타원의 한 초점에 있다. 근일점 거리 r_p와 원일점 거리 r_a의 합은 긴지름 2a이다. 두 점에서는 속도가 위치 벡터에 수직이므로 각운동량 보존에서 r_p v_p = r_a v_a이고, 같은 시간 동안 쓸고 지나가는 넓이(색칠한 두 부채꼴)는 같다. 이심률 0.7인 모식도이다.</desc>
