<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="t-ochem-3-fischer-rules d-ochem-3-fischer-rules">
  <title id="t-ochem-3-fischer-rules">그림 유기화학 3-10 피셔 투영식 만들기와 허용되는 조작</title>
  <desc id="d-ochem-3-fischer-rules">윗줄: (R)-글리세르알데하이드를 CHO는 위, CH₂OH는 아래로 뒤쪽을 향하게(점선), H는 왼쪽, OH는 오른쪽으로 앞쪽을 향하게(쐐기) 돌려 나비넥타이 모양으로 놓고, 그것을 십자로 그리면 피셔 투영식이 된다. 아랫줄: (가) 종이 면에서 180° 회전 → 같은 분자 (R). (나) 90° 회전 → 거울상 (S). (다) CHO를 고정하고 나머지 셋을 한 칸씩 돌림 → 같은 분자 (R). (라) 두 원자단 맞바꿈 → 거울상 (S).</desc>
