  <circle cx="305.0" cy="88.3" r="8.0" style="fill:none;stroke:var(--fig-violet);stroke-width:2;stroke-dasharray:3 2"/>
  <text x="319.0" y="93.3" style="font-size:12px;fill:var(--fig-violet)">보이는 상</text>
  <line x1="305.0" y1="180.0" x2="500.0" y2="224.0" style="stroke:var(--fig-amber);stroke-width:2.5;fill:none"/>
  <line x1="500.0" y1="224.0" x2="662.3" y2="182.5" style="stroke:var(--fig-amber);stroke-width:2.5;fill:none"/>
  <path d="M672.0 180.0 L663.6 187.3 L661.1 177.6 Z" style="fill:var(--fig-amber);stroke:none"/>
  <line x1="500.0" y1="224.0" x2="305.0" y2="271.7" style="stroke:var(--fig-line);stroke-width:1.5;fill:none;stroke-dasharray:5 4"/>
  <circle cx="305.0" cy="271.7" r="8.0" style="fill:none;stroke:var(--fig-violet);stroke-width:2;stroke-dasharray:3 2"/>
  <text x="319.0" y="276.7" style="font-size:12px;fill:var(--fig-violet)">보이는 상</text>
  <text x="490.0" y="312.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-muted)">빛이 질량 근처에서 휘어, 같은 은하가 여러 곳에 보인다</text>
</svg>
