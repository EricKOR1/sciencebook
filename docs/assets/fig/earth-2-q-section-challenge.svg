  <title id="t-earth-2-q-section-challenge">그림 지구과학 2-15 문제 16의 지질 단면</title>
  <desc id="d-earth-2-q-section-challenge">셰일 A, 사암 B, 암모나이트 화석이 든 석회암 C가 차례로 쌓여 있고, 화강암 G가 A~C를 관입하였다. A~C와 G의 윗부분이 평평하게 깎인 면 위에 G의 자갈을 포함한 역암 D가 있고, 현무암 암맥 E가 G와 D를 뚫고 있는 지질 단면의 모식도이다.</desc>
