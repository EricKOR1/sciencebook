<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" role="img" aria-labelledby="t-2-1-solar-line-matching d-2-1-solar-line-matching">
  <title id="t-2-1-solar-line-matching">그림 2-1-4 실험실 방출선과 태양 흡수선 대조하기</title>
  <desc id="d-2-1-solar-line-matching">실험실에서 측정한 수소·나트륨·칼슘의 방출선 위치를 태양 스펙트럼의 흡수선과 세로로 맞추어 보면 위치가 일치하므로, 태양 대기에 이 원소들이 있음을 알 수 있다. 517 nm와 527 nm 부근의 선은 세 원소의 선과 맞지 않으며 마그네슘·철 등 다른 원소의 선이다. 선의 파장은 실제 값, 색과 굵기는 근사이다.</desc>
