    .slm-ink{fill:var(--fig-ink)} .slm-mut{fill:var(--fig-muted)} .slm-b{font-weight:600}
    .slm-night{fill:var(--fig-ink)}
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .slm-night{fill:var(--fig-paper)} }
    :root[data-theme="dark"] .slm-night{fill:var(--fig-paper)}
    
  </style>
