<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-uearth-1-metamorphic-pt d-uearth-1-metamorphic-pt">
  <title id="t-uearth-1-metamorphic-pt">그림 일반지구과학 1-7 Al₂SiO₅ 동질 이상의 안정 영역과 지온 기울기</title>
  <desc id="d-uearth-1-metamorphic-pt">가로축은 온도, 세로축은 아래로 갈수록 커지는 압력(깊이)이다. 홍주석은 낮은 압력, 남정석은 높은 압력, 규선석은 높은 온도에서 안정하며, 세 경계선은 약 0.4 GPa, 500 °C 부근의 삼중점에서 만난다. 대륙 지각(25 °C/km)과 섭입대(10 °C/km)의 지온 기울기 선을 겹쳐 보면, 같은 온도라도 섭입대에서는 압력이 훨씬 높아 고압·저온 변성이 일어난다. 경계선의 위치는 대략값이다.</desc>
