<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-ubio-2-mito-chloro d-ubio-2-mito-chloro">
  <title id="t-ubio-2-mito-chloro">그림 일반생명과학 2-3 미토콘드리아와 엽록체의 구조, 세포 내 공생</title>
  <desc id="d-ubio-2-mito-chloro">위 왼쪽: 미토콘드리아는 외막과 크리스타로 접힌 내막 사이에 막 사이 공간이 있고, 내막 안쪽 기질에 고리 모양 DNA와 70S형 리보솜이 있다. 위 오른쪽: 엽록체는 2중막 안의 스트로마에 틸라코이드가 쌓인 그라나가 있고, 스트로마에 DNA와 리보솜이 있다. 아래: 숙주 세포가 호기성 세균을 삼켜 미토콘드리아가, 그 뒤 남세균을 삼켜 엽록체가 되었다는 세포 내 공생설. 삼킨 세균의 막이 안쪽 막, 숙주의 막이 바깥 막이 된다. 모식도이다.</desc>
