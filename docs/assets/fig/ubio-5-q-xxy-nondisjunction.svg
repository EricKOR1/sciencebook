<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" role="img" aria-labelledby="t-ubio-5-q-xxy-nondisjunction d-ubio-5-q-xxy-nondisjunction">
  <title id="t-ubio-5-q-xxy-nondisjunction">그림 일반생명과학 5-11 예제 11 풀이: 어머니의 감수 1분열 비분리와 감수 2분열 비분리 비교</title>
  <desc id="d-ubio-5-q-xxy-nondisjunction">어머니(Xᴿ Xʳ)의 X 염색체만 그렸다(파랑 R, 빨강 r, 교차는 없다고 가정). (가) 감수 1분열에서 비분리가 일어나면 Xᴿ와 Xʳ가 함께 든 난자가 생겨 Y를 가진 정자와 수정하면 Xᴿ Xʳ Y(정상 시각)가 된다. (나) 감수 2분열에서 Xʳ의 염색 분체가 갈라지지 않으면 Xʳ Xʳ가 든 난자가 생겨 Xʳ Xʳ Y(적록 색맹)가 된다. 실제 난자 형성에서는 네 세포 중 하나만 난자가 된다.</desc>
