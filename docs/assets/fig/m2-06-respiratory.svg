  <title id="t-m2-06-respiratory">그림 중2-6-8 호흡 기관의 구조와 폐포의 기체 교환</title>
  <desc id="d-m2-06-respiratory">공기는 코, 기관, 기관지를 지나 폐로 들어간다. 기관지는 폐 속에서 계속 갈라져 끝에 작은 공기 주머니인 폐포가 포도송이처럼 모여 있다. 폐포를 둘러싼 모세혈관과 폐포 사이에서 산소는 폐포에서 모세혈관으로, 이산화 탄소는 모세혈관에서 폐포로 확산한다. 모식도이다.</desc>
