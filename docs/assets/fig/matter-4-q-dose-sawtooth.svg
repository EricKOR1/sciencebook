  <title id="t-matter-4-q-dose-sawtooth">그림 물질과 에너지 4-12 문제 16 해설의 몸속 약의 양</title>
  <desc id="d-matter-4-q-dose-sawtooth">1차 반응으로 제거되면 복용 직후의 양이 400, 600, 700, 750 mg으로 800 mg에 가까워질 뿐 넘지 않는다. 0차 반응으로 제거되면 400, 600, 800, 1000 mg으로 계속 쌓여 4번째 복용 직후 800 mg을 넘는다. 값은 문제의 조건으로 계산하였다.</desc>
