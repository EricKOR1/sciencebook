<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 582" role="img" aria-labelledby="t-uearth-1-silicate d-uearth-1-silicate">
  <title id="t-uearth-1-silicate">그림 일반지구과학 1-2 Si–O 사면체가 연결되는 다섯 가지 방식</title>
  <desc id="d-uearth-1-silicate">사면체를 위에서 본 모식도. 삼각형의 꼭짓점은 바닥의 산소, 가운데 점은 위쪽 꼭짓점의 산소(그 아래에 규소)이다. 공유하는 산소가 많아질수록 Si:O 비가 1:4에서 1:2로 줄고 규소 1개당 음전하도 4에서 0으로 줄어든다.</desc>
  <style>
    .uearth-1-silicate-t{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6;stroke-linejoin:round}
    .uearth-1-silicate-o{fill:var(--fig-paper);stroke:var(--fig-red);stroke-width:1.6}
    .uearth-1-silicate-sh{fill:var(--fig-red);stroke:var(--fig-red);stroke-width:1.2}
    .uearth-1-silicate-ap{fill:var(--fig-paper);stroke:var(--fig-ink);stroke-width:1.4}
    .uearth-1-silicate-h{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .uearth-1-silicate-l{font-size:13px;fill:var(--fig-ink)}
    .uearth-1-silicate-s{font-size:13px;fill:var(--fig-muted)}
    .uearth-1-silicate-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1}
  </style>
