<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-matter-2-vp-curves d-matter-2-vp-curves">
  <title id="t-matter-2-vp-curves">그림 물질과 에너지 2-7 증기 압력 곡선으로 보는 끓는점 오름과 어는점 내림</title>
  <desc id="d-matter-2-vp-curves">용액의 증기 압력 곡선은 순수한 물의 곡선보다 아래에 있다. 그래서 증기 압력이 1 atm에 이르는 온도(끓는점)는 높아지고, 얼음의 증기 압력 곡선과 만나는 온도(어는점)는 낮아진다. 차이를 크게 과장한 모식도이다.</desc>
