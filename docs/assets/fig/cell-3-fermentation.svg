<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-cell-3-fermentation d-cell-3-fermentation">
  <title id="t-cell-3-fermentation">그림 세포와 물질대사 3-3 알코올 발효와 젖산 발효</title>
  <desc id="d-cell-3-fermentation">세포질에서 포도당 1분자가 해당 과정을 거쳐 피루브산 2분자가 되며 ATP 2분자(순)와 NADH 2분자가 생긴다. 산소가 없을 때 알코올 발효에서는 피루브산이 이산화 탄소를 내놓고 아세트알데하이드가 된 뒤 NADH의 전자를 받아 에탄올이 되고, 젖산 발효에서는 피루브산이 NADH의 전자를 직접 받아 젖산이 된다. 두 경우 모두 NAD⁺가 재생되어 해당 과정이 계속된다. 포도당 1분자 기준, 모식도.</desc>
  <style>.cell-3-fermentation-t{font-size:14px;fill:var(--fig-ink)} .cell-3-fermentation-s{font-size:13px;fill:var(--fig-muted)} .cell-3-fermentation-b{font-size:15px;fill:var(--fig-ink);font-weight:600} .cell-3-fermentation-bs{font-size:14px;fill:var(--fig-ink);font-weight:600} .cell-3-fermentation-g{font-size:14px;fill:var(--fig-green);font-weight:600} .cell-3-fermentation-r{font-size:14px;fill:var(--fig-red);font-weight:600} .cell-3-fermentation-bl{font-size:14px;fill:var(--fig-blue);font-weight:600} .cell-3-fermentation-am{font-size:14px;fill:var(--fig-amber);font-weight:600} .cell-3-fermentation-vi{font-size:14px;fill:var(--fig-violet);font-weight:600} .cell-3-fermentation-te{font-size:14px;fill:var(--fig-teal);font-weight:600}</style>
  <rect x="10.0" y="10.0" width="700.0" height="380.0" rx="10" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.2;fill-opacity:0.5"/>
  <text x="24.0" y="34.0" class="cell-3-fermentation-bs">세포질(산소 없음)</text>
  <rect x="285.0" y="38.0" width="150.0" height="36.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.8"/>
  <text x="360.0" y="61.0" text-anchor="middle" class="cell-3-fermentation-bs">포도당 <tspan class="cell-3-fermentation-s">(6C)</tspan></text>
  <rect x="265.0" y="154.0" width="190.0" height="36.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.8"/>
  <text x="360.0" y="177.0" text-anchor="middle" class="cell-3-fermentation-bs">피루브산 × 2 <tspan class="cell-3-fermentation-s">(3C)</tspan></text>
  <line x1="360.0" y1="76.0" x2="360.0" y2="145.7" style="stroke:var(--fig-ink);stroke-width:2.2"/>
  <path d="M360.0 152.0 L356.3 143.8 L363.7 143.8 Z" style="fill:var(--fig-ink)"/>
  <text x="372.0" y="116.0" class="cell-3-fermentation-bs">해당 과정</text>
  <text x="372.0" y="136.0" class="cell-3-fermentation-vi">ATP 2(순)</text>
  <text x="348.0" y="116.0" text-anchor="end" class="cell-3-fermentation-te">2NAD⁺</text>
  <text x="348.0" y="136.0" text-anchor="end" class="cell-3-fermentation-te">→ 2NADH</text>
  <rect x="45.0" y="266.0" width="210.0" height="36.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.8"/>
  <text x="150.0" y="289.0" text-anchor="middle" class="cell-3-fermentation-bs">아세트알데하이드 × 2 <tspan class="cell-3-fermentation-s">(2C)</tspan></text>
  <rect x="75.0" y="332.0" width="150.0" height="36.0" rx="8" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.8"/>
  <text x="150.0" y="355.0" text-anchor="middle" class="cell-3-fermentation-bs">에탄올 × 2 <tspan class="cell-3-fermentation-s">(2C)</tspan></text>
  <path d="M270 184 C200 200 160 230 150 262" style="fill:none;stroke:var(--fig-ink);stroke-width:2.2"/>
  <path d="M150.0 264.0 L148.0 255.2 L155.2 256.7 Z" style="fill:var(--fig-ink)"/>
  <line x1="186.0" y1="230.0" x2="228.4" y2="230.0" style="stroke:var(--fig-muted);stroke-width:1.8"/>
  <path d="M234.0 230.0 L226.7 233.3 L226.7 226.7 Z" style="fill:var(--fig-muted)"/>
  <text x="240.0" y="235.0" class="cell-3-fermentation-r">2CO₂</text>
  <line x1="150.0" y1="302.0" x2="150.0" y2="323.7" style="stroke:var(--fig-ink);stroke-width:2.2"/>
  <path d="M150.0 330.0 L146.3 321.8 L153.7 321.8 Z" style="fill:var(--fig-ink)"/>
  <text x="160.0" y="322.0" class="cell-3-fermentation-te">2NADH → 2NAD⁺</text>
  <text x="150.0" y="382.0" text-anchor="middle" class="cell-3-fermentation-b">알코올 발효(효모)</text>
  <rect x="495.0" y="312.0" width="150.0" height="36.0" rx="8" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.8"/>
  <text x="570.0" y="335.0" text-anchor="middle" class="cell-3-fermentation-bs">젖산 × 2 <tspan class="cell-3-fermentation-s">(3C)</tspan></text>
  <path d="M450 184 C520 200 560 250 570 308" style="fill:none;stroke:var(--fig-ink);stroke-width:2.2"/>
  <path d="M570.0 310.0 L565.5 302.2 L572.8 301.5 Z" style="fill:var(--fig-ink)"/>
  <text x="584.0" y="284.0" class="cell-3-fermentation-te">2NADH → 2NAD⁺</text>
  <text x="570.0" y="382.0" text-anchor="middle" class="cell-3-fermentation-b">젖산 발효(젖산균, 근육 세포)</text>
  <path d="M286 316 C340 260 220 110 296 92 L352 92" style="fill:none;stroke:var(--fig-teal);stroke-width:2;stroke-dasharray:6 4"/>
  <path d="M354.0 92.0 L345.8 95.7 L345.8 88.3 Z" style="fill:var(--fig-teal)"/>
  <path d="M700 296 C712 120 540 92 368 92" style="fill:none;stroke:var(--fig-teal);stroke-width:2;stroke-dasharray:6 4"/>
  <path d="M366.0 92.0 L374.2 88.3 L374.2 95.7 Z" style="fill:var(--fig-teal)"/>
  <text x="232.0" y="152.0" text-anchor="middle" class="cell-3-fermentation-te">NAD⁺ 재생</text>
  <text x="620.0" y="120.0" text-anchor="middle" class="cell-3-fermentation-te">NAD⁺ 재생</text>
</svg>
