<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-pchem-12-q-rice-herzfeld-cycle d-pchem-12-q-rice-herzfeld-cycle">
  <title id="t-pchem-12-q-rice-herzfeld-cycle">그림 물리화학 12-15 문제 17 해설: 라이스–헤르츠펠트 연쇄의 순환</title>
  <desc id="d-pchem-12-q-rice-herzfeld-cycle">CH₃·가 CH₃CHO에서 수소를 떼어 CH₄를 내놓고 CH₃CO·가 되며(나), CH₃CO·는 CO를 내놓고 CH₃·로 돌아간다(다). 한 바퀴마다 CH₄와 CO가 하나씩 생긴다. 고리 밖에서 개시 CH₃CHO → CH₃· + CHO·(가)로 CH₃·가 들어오고, 종결 2CH₃· → C₂H₆(라)으로 빠져나간다.</desc>
  <style>.pchem-12-q-rice-herzfeld-cycle-t{font-size:14px;fill:var(--fig-ink)} .pchem-12-q-rice-herzfeld-cycle-s{font-size:13px;fill:var(--fig-muted)} .pchem-12-q-rice-herzfeld-cycle-b{font-size:15px;font-weight:600;fill:var(--fig-ink)} .pchem-12-q-rice-herzfeld-cycle-i{font-size:14px;font-style:italic;fill:var(--fig-ink)} </style>
  <path d="M397.6,96.6 A110,110 0 0 1 397.6,303.4" style="fill:none;stroke:var(--fig-blue);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round"/>
  <polygon points="397.6,303.4 405.7,295.9 408.6,303.9" style="fill:var(--fig-blue);stroke:none"/>
  <path d="M322.4,303.4 A110,110 0 0 1 322.4,96.6" style="fill:none;stroke:var(--fig-green);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round"/>
  <polygon points="322.4,96.6 314.3,104.1 311.4,96.1" style="fill:var(--fig-green);stroke:none"/>
  <circle cx="360.0" cy="90.0" r="34.0" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <text x="360.0" y="96.0" text-anchor="middle" class="pchem-12-q-rice-herzfeld-cycle-b" style="font-size:17px">CH₃·</text>
  <circle cx="360.0" cy="310.0" r="44.0" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:2"/>
  <text x="360.0" y="316.0" text-anchor="middle" class="pchem-12-q-rice-herzfeld-cycle-b" style="font-size:17px">CH₃CO·</text>
  <text x="484.0" y="194.0" text-anchor="start" class="pchem-12-q-rice-herzfeld-cycle-t" style="fill:var(--fig-blue)">+ CH₃CHO → CH₄</text>
  <text x="484.0" y="214.0" text-anchor="start" class="pchem-12-q-rice-herzfeld-cycle-s" style="fill:var(--fig-blue)">(나)</text>
  <text x="236.0" y="194.0" text-anchor="end" class="pchem-12-q-rice-herzfeld-cycle-t" style="fill:var(--fig-green)">→ CO</text>
  <text x="236.0" y="214.0" text-anchor="end" class="pchem-12-q-rice-herzfeld-cycle-s" style="fill:var(--fig-green)">(다)</text>
  <text x="360.0" y="205.0" text-anchor="middle" class="pchem-12-q-rice-herzfeld-cycle-s">연쇄 전파</text>
  <line x1="110.0" y1="70.0" x2="322.0" y2="86.0" style="stroke:var(--fig-violet);stroke-width:2;stroke-linecap:round"/>
  <polygon points="322.0,86.0 314.4,88.6 314.9,82.3" style="fill:var(--fig-violet);stroke:none"/>
  <text x="30.0" y="56.0" text-anchor="start" class="pchem-12-q-rice-herzfeld-cycle-t" style="fill:var(--fig-violet)">CH₃CHO → CH₃· + CHO· (개시, 가)</text>
  <line x1="398.0" y1="86.0" x2="610.0" y2="70.0" style="stroke:var(--fig-accent);stroke-width:2;stroke-linecap:round"/>
  <polygon points="610.0,70.0 602.9,73.7 602.4,67.4" style="fill:var(--fig-accent);stroke:none"/>
  <text x="700.0" y="56.0" text-anchor="end" class="pchem-12-q-rice-herzfeld-cycle-t" style="fill:var(--fig-accent)">2CH₃· → C₂H₆ (종결, 라)</text>
</svg>
