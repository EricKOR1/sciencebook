  <title id="t-uphy-6-wave-snapshot">그림 일반물리학 6-1 진행하는 사인파의 두 순간과 매질의 속도</title>
  <desc id="d-uphy-6-wave-snapshot">+x 방향으로 진행하는 사인파를 시각 t(실선)와 조금 뒤 t + Δt(점선)에 찍은 모습이다. 모양 전체가 vΔt만큼 오른쪽으로 옮겨 간다. 초록 화살표는 시각 t에 줄의 각 점이 움직이는 속도 u = ∂y/∂t로, 진행 방향에 수직이고 크기가 점마다 다르다(마루와 골에서 0, 평형 위치에서 최대).</desc>
