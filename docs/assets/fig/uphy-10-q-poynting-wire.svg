<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-uphy-10-q-poynting-wire d-uphy-10-q-poynting-wire">
  <title id="t-uphy-10-q-poynting-wire">그림 일반물리학 10-13 문제 15 풀이의 도선 둘레의 장과 포인팅 벡터</title>
  <desc id="d-uphy-10-q-poynting-wire">전류 I가 오른쪽으로 흐르는 도선의 옆모습이다. 도선 속 전기장 E는 전류 방향이고, 자기장 B는 도선을 감아 돌아 도선 위쪽에서는 종이에서 나오고 아래쪽에서는 종이로 들어간다. 포인팅 벡터 S = E × B / μ₀는 위아래 모두 옆면을 지나 도선 중심을 향한다. 굵기는 실제보다 크게 그렸다.</desc>
