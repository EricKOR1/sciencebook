<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-earth-2-cross-section d-earth-2-cross-section">
  <title id="t-earth-2-cross-section">그림 지구과학 2-2 예제 1의 지질 단면</title>
  <desc id="d-earth-2-cross-section">동쪽으로 기울어진 셰일 A, 사암 B, 석회암 C를 단층 F가 자르고, 그 위를 경사 부정합으로 수평한 역암 D와 사암 E가 덮으며, 화강암 G가 A부터 E까지 모두 뚫고 관입하여 주변을 구웠다.</desc>
