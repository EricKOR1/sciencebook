    .earth-2-cross-section-e{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1}
    .earth-2-cross-section-lb{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .earth-2-cross-section-s{font-size:13px;fill:var(--fig-muted)}
    .earth-2-cross-section-t{font-size:14px;fill:var(--fig-ink)}
    .earth-2-cross-section-ci{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.2}
