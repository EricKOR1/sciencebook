<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 345" role="img" aria-labelledby="t-m1-04-kettle-steam d-m1-04-kettle-steam">
  <title id="t-m1-04-kettle-steam">그림 중1-4-4 주전자 입구의 수증기와 하얀 김</title>
  <desc id="d-m1-04-kettle-steam">끓는 주전자 입구 바로 앞의 투명한 부분이 기체인 수증기이고, 조금 떨어진 곳의 하얀 김은 수증기가 차가운 공기를 만나 액화한 아주 작은 물방울이다. 김은 더 멀리 가면 다시 증발하여 보이지 않게 된다. 입자는 모식적으로 나타냈다.</desc>
