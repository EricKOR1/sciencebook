<title id="t-m1-03-particle-temperature">그림 중1-3-4 온도에 따른 입자의 움직임</title>
<desc id="d-m1-03-particle-temperature">같은 양의 물이라도 온도가 높을수록 물 입자가 더 빠르게 움직인다. 화살표의 길이는 입자의 빠르기를 나타내며, 입자의 수와 크기는 세 경우 모두 같다. 모식도.</desc>
