<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 535" role="img" aria-labelledby="t-ochem-3-substitution-test d-ochem-3-substitution-test">
  <title id="t-ochem-3-substitution-test">그림 유기화학 3-16 치환 시험으로 두 수소의 관계 판정하기</title>
  <desc id="d-ochem-3-substitution-test">두 수소 Ha(빨강)와 Hb(파랑)를 하나씩 D로 바꾸어 생긴 두 분자를 비교한다. (1) 다이클로로메테인: 두 결과가 C₂ 회전으로 겹치는 같은 분자 → 동등 위치. (2) 에탄올: Ha를 바꾸면 (S)-, Hb를 바꾸면 (R)-에탄-1-올-1-d로 거울상 → 거울상 위치(Ha = 프로-S, Hb = 프로-R). (3) (S)-2-클로로뷰테인의 C3 두 수소: 결과는 (2S,3R)와 (2S,3S)의 3-중수소 화합물로 부분 입체 이성질체 → 부분 입체 위치, NMR에서 다른 신호.</desc>
