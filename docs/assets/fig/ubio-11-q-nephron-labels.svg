  <desc id="d-ubio-11-q-nephron-labels">사람 네프론의 모식도. 겉질에 사구체를 감싼 A가 있고, A에서 이어진 관이 B를 거쳐 수질로 내려가는 C, 꺾여 올라오는 D가 되며, 다시 겉질에서 E를 지나 여러 네프론이 모이는 F로 이어진다. F는 수질을 지나 아래로 내려간다.</desc>
