<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="t-ochem-3-resolution-flow d-ochem-3-resolution-flow">
  <title id="t-ochem-3-resolution-flow">그림 유기화학 3-12 부분 입체 이성질성 염으로 라세미 만델산 분할하기</title>
  <desc id="d-ochem-3-resolution-flow">(±)-만델산((R)·(S)-2-하이드록시-2-페닐아세트산)에 (R)-1-페닐에테인-1-아민을 에탄올에서 넣으면 (R)-산·(R)-아민 염과 (S)-산·(R)-아민 염이 생긴다. 두 염은 부분 입체 이성질체여서 용해도가 다르므로 분별 결정으로 결정(덜 녹는 염)과 거른 액(더 녹는 염)으로 나뉜다. 각각 HCl(aq)로 처리하고 에터로 추출하면 유기층에서 한 거울상의 만델산을, 수용액층에서 아민 염산염을 얻고 아민은 NaOH로 회수한다. 어느 염이 덜 녹는지는 실험으로 정한다.</desc>
