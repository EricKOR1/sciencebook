<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-rxn-1-hydrolysis-particles d-rxn-1-hydrolysis-particles">
  <title id="t-rxn-1-hydrolysis-particles">그림 화학 반응의 세계 1-5 염 수용액의 액성 — 가수 분해의 입자 모형</title>
  <desc id="d-rxn-1-hydrolysis-particles">NaCl 수용액의 이온은 물과 반응하지 않아 중성이다. CH₃COONa 수용액에서는 CH₃COO⁻ 일부가 물에서 양성자를 받아 OH⁻를 만들어 염기성, NH₄Cl 수용액에서는 NH₄⁺ 일부가 물에 양성자를 주어 H₃O⁺를 만들어 산성이다. 가수 분해하는 이온의 비율은 실제보다 크게 그린 모식도이다.</desc>
  <style>
    .rxn-1-hydrolysis-particles-T{font-size:15px;fill:var(--fig-ink);font-weight:700}
    .rxn-1-hydrolysis-particles-f{font-size:14px;fill:var(--fig-ink);font-weight:600}
    .rxn-1-hydrolysis-particles-k{font-size:13px;fill:var(--fig-ink)}
    .rxn-1-hydrolysis-particles-s{font-size:13px;fill:var(--fig-muted)}
    .rxn-1-hydrolysis-particles-b{font-size:15px;fill:var(--fig-ink);font-weight:600}
  </style>
