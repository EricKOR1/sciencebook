  <text x="657.0" y="180.5" text-anchor="middle" class="rxn-1-hydrolysis-particles-k" style="font-size:13px">H₃O⁺</text>
  <circle cx="657.0" cy="176.0" r="22" style="fill:none;stroke:var(--fig-red);stroke-width:1.5;stroke-dasharray:4 3"/>
  <circle cx="564.0" cy="212.0" r="17" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.5"/>
  <text x="564.0" y="216.5" text-anchor="middle" class="rxn-1-hydrolysis-particles-k" style="font-size:13px">Cl⁻</text>
  <text x="595.0" y="262.0" text-anchor="middle" class="rxn-1-hydrolysis-particles-k">NH₄⁺ + H₂O ⇌ NH₃ + H₃O⁺</text>
  <text x="595.0" y="283.0" text-anchor="middle" class="rxn-1-hydrolysis-particles-f">[H₃O⁺] &gt; [OH⁻]</text>
  <text x="360.0" y="316.0" text-anchor="middle" class="rxn-1-hydrolysis-particles-s">A⁻ = CH₃COO⁻, HA = CH₃COOH. 점선 동그라미는 가수 분해로 생긴 입자. 물 분자는 생략했다.</text>
  <text x="360.0" y="338.0" text-anchor="middle" class="rxn-1-hydrolysis-particles-s">실제로 가수 분해하는 이온은 아주 일부이다(0.10 M CH₃COONa에서 약 1만 개 중 1개꼴) — 모식도</text>
