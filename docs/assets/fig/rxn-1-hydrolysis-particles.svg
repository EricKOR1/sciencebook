  <circle cx="422.0" cy="176.0" r="17" style="fill:var(--fig-panel);stroke:var(--fig-blue);stroke-width:1.5"/>
  <text x="422.0" y="180.5" text-anchor="middle" class="rxn-1-hydrolysis-particles-k" style="font-size:13px">OH⁻</text>
  <circle cx="422.0" cy="176.0" r="22" style="fill:none;stroke:var(--fig-red);stroke-width:1.5;stroke-dasharray:4 3"/>
  <circle cx="329.0" cy="212.0" r="17" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5"/>
  <text x="329.0" y="216.5" text-anchor="middle" class="rxn-1-hydrolysis-particles-k" style="font-size:13px">Na⁺</text>
  <text x="360.0" y="262.0" text-anchor="middle" class="rxn-1-hydrolysis-particles-k">A⁻ + H₂O ⇌ HA + OH⁻</text>
  <text x="360.0" y="283.0" text-anchor="middle" class="rxn-1-hydrolysis-particles-f">[OH⁻] &gt; [H₃O⁺]</text>
