  <text x="125.0" y="180.5" text-anchor="middle" class="rxn-1-hydrolysis-particles-k" style="font-size:13px">Na⁺</text>
  <circle cx="187.0" cy="176.0" r="17" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.5"/>
  <text x="187.0" y="180.5" text-anchor="middle" class="rxn-1-hydrolysis-particles-k" style="font-size:13px">Cl⁻</text>
  <circle cx="94.0" cy="212.0" r="17" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5"/>
  <text x="94.0" y="216.5" text-anchor="middle" class="rxn-1-hydrolysis-particles-k" style="font-size:13px">Na⁺</text>
