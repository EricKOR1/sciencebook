<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-uearth-10-eclipse-types d-uearth-10-eclipse-types">
  <title id="t-uearth-10-eclipse-types">그림 일반지구과학 10-7 본영과 반영 — 개기 일식, 금환 일식, 월식</title>
  <desc id="d-uearth-10-eclipse-types">위: 달이 가까울 때(근지점 부근)는 달의 본영 원뿔 끝이 지표에 닿아 그 좁은 지역에서 개기 일식이, 멀 때(원지점 부근)는 본영 끝이 지표에 못 미쳐 그 연장(금환 영역)에서 금환 일식이 보이고, 반영 안에서는 부분 일식이 보인다. 아래: 지구의 본영에 달 전체가 들어가면 개기 월식, 일부만 들어가면 부분 월식, 반영에만 들어가면 반영 월식이다. 크기와 거리는 실제와 다른 모식도.</desc>
  <style>
    .uearth-10-eclipse-types-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .uearth-10-eclipse-types-t{font-size:13px;fill:var(--fig-ink)}
    .uearth-10-eclipse-types-s{font-size:13px;fill:var(--fig-muted)}
