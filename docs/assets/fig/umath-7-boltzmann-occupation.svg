<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-umath-7-boltzmann-occupation d-umath-7-boltzmann-occupation">
  <title id="t-umath-7-boltzmann-occupation">그림 수학 도구 7-5 다섯 준위의 볼츠만 점유와 온도</title>
  <desc id="d-umath-7-boltzmann-occupation">간격이 ε로 일정하고 축퇴가 없는 다섯 준위의 볼츠만 점유 n_j/N(다섯 준위만으로 정규화). k_BT = 0.5ε에서 0.87, 0.12, 0.02, 0.00, 0.00, k_BT = ε에서 0.64, 0.23, 0.09, 0.03, 0.01, k_BT = 3ε에서 0.35, 0.25, 0.18, 0.13, 0.09이다. 막대 끝은 지수 곡선 위에 놓이며, 온도가 높을수록 분포가 납작해진다.</desc>
