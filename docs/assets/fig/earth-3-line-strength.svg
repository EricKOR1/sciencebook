<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-earth-3-line-strength d-earth-3-line-strength">
  <title id="t-earth-3-line-strength">그림 지구과학 3-6 분광형에 따른 흡수선의 세기</title>
  <desc id="d-earth-3-line-strength">흡수선의 세기는 표면 온도에 따라 달라진다. 이온화된 헬륨은 O형, 중성 헬륨은 B형, 수소는 A형(약 1만 K)에서 가장 강하고, 더 낮은 온도로 갈수록 이온화된 칼슘(G·K형), 중성 금속, 분자의 흡수띠(M형)가 강해진다. 대략적인 모양을 나타낸 모식도이다.</desc>
  <style>
    .earth-3-line-strength-t{font-size:14px;fill:var(--fig-ink)}
    .earth-3-line-strength-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .earth-3-line-strength-s{font-size:13px;fill:var(--fig-muted)}
    .earth-3-line-strength-land{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:0.8;fill-rule:evenodd}
    .earth-3-line-strength-sea{fill:var(--fig-soft-blue)}
    .earth-3-line-strength-grat{fill:none;stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3;opacity:0.7}
    .earth-3-line-strength-frame{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .earth-3-line-strength-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
