<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-m1-04-cooling-curve d-m1-04-cooling-curve">
  <title id="t-m1-04-cooling-curve">그림 중1-4-6 팔미트산의 냉각 곡선과 측정 장치</title>
  <desc id="d-m1-04-cooling-curve">녹인 팔미트산이 든 시험관에 온도계를 꽂아 스탠드에 고정하고 식히면서 온도를 잰다. 온도가 내려가다가 굳는 동안(약 63 °C)에는 열에너지를 방출하므로 한동안 일정하게 유지되고, 다 굳은 뒤에 다시 내려간다. 모식도이다.</desc>
