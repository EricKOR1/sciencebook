  <title id="t-mech-2-q-isotherm-adiabat">그림 역학과 에너지 2-10 문제 14 해설의 등온 팽창과 단열 팽창</title>
  <desc id="d-mech-2-q-isotherm-adiabat">같은 처음 상태(P₀, V₀)에서 부피 2V₀까지 팽창하는 등온 곡선(PV = 일정)과 단열 곡선을 계산하여 그렸다(단원자 기체, PV^(5/3) = 일정). 단열 곡선이 더 가팔라 나중 압력이 P₀/2보다 낮고, 그래프 아래 넓이(한 일)는 등온 과정이 더 크다.</desc>
