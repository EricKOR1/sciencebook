<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 170" class="fig-small" role="img" aria-labelledby="t-uphy-2-q-three-blocks d-uphy-2-q-three-blocks">
  <title id="t-uphy-2-q-three-blocks">그림 일반물리학 2-11 문제 15의 줄로 연결된 세 토막</title>
  <desc id="d-uphy-2-q-three-blocks">수평 바닥 위에 토막 C(1.00 kg), B(2.00 kg), A(3.00 kg)가 가벼운 줄로 차례로 연결되어 있고, A를 수평으로 24.0 N으로 당긴다. 두 줄의 장력을 각각 T_BC, T_AB라 한다.</desc>
