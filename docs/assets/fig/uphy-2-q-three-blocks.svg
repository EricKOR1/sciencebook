  <text x="51.0" y="116.0" text-anchor="middle" style="font-size:12px;fill:var(--fig-ink)">1.00 kg</text>
  <rect x="112.0" y="76.0" width="70.0" height="50.0" rx="2" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
