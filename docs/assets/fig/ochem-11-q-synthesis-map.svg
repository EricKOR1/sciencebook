<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="t-ochem-11-q-synthesis-map d-ochem-11-q-synthesis-map">
  <title id="t-ochem-11-q-synthesis-map">그림 유기화학 11-28 문제 18 풀이 지도</title>
  <desc id="d-ochem-11-q-synthesis-map">가운데 헥산산에서 SOCl₂(활성화, 사다리 오르기)로 헥사노일 클로라이드를 만든 뒤 세 갈래: ① (CH₃)₂CuLi, −78 ℃ → 헵탄-2-온, ② LiAlH(OC(CH₃)₃)₃, −78 ℃ → 헥산알, ③ CH₃NH₂ 2 당량 → N-메틸헥산아마이드 → LiAlH₄; H₂O → N-메틸헥산-1-아민. 아래로: LiAlH₄; H₃O⁺ → 헥산-1-올 → PBr₃ → 1-브로모헥세인 → NaCN, DMSO → 헵테인나이트릴 → H₃O⁺, 가열 → 헵탄산. 화살표 색: 활성화 파랑, 친핵성 아실 치환(내려가기)·가수 분해 초록, 환원 주황, SN2 회색.</desc>
