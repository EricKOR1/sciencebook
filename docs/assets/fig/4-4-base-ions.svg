<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img" aria-labelledby="t-4-4-base-ions d-4-4-base-ions">
  <title id="t-4-4-base-ions">그림 4-4-4 염기의 수용액 속 입자 — 공통 입자는 OH⁻</title>
  <desc id="d-4-4-base-ions">수산화 나트륨은 Na⁺와 OH⁻로, 수산화 칼슘은 한 개가 Ca²⁺ 1개와 OH⁻ 2개로 이온화한다. 암모니아는 일부가 물과 반응하여 NH₄⁺와 OH⁻를 만든다. 세 수용액에 공통으로 들어 있는 OH⁻가 염기의 공통 성질을 나타낸다. 물 분자를 생략한 모식도.</desc>
  <style>
    .bas-glass{fill:none;stroke:var(--fig-ink);stroke-width:2;stroke-linejoin:round}
    .bas-liq{fill:var(--fig-soft-blue);fill-opacity:.55}
    .bas-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .bas-c{font-size:14px;fill:var(--fig-ink)}
    .bas-sm{font-size:13px;fill:var(--fig-muted)}
    .bas-key{font-size:15px;font-weight:700}
    .bas-t{font-size:13.5px;font-weight:700;fill:var(--fig-ink)}
    .bas-red{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2} .bas-tred{fill:var(--fig-red)}
    .bas-blue{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2} .bas-tblue{fill:var(--fig-blue)}
    .bas-green{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.5}
    .bas-violet{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5}
    .bas-amber{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5}
    .bas-teal{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.5}
    .bas-mol{fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.5;stroke-dasharray:4 3}
  </style>
  <text x="125" y="36" text-anchor="middle" class="bas-h">수산화 나트륨 수용액</text>
  <rect x="29" y="80" width="192" height="171" class="bas-liq"/>
  <path d="M19 52 L25 58 L25 252 L225 252 L225 58 L231 52" class="bas-glass"/>
  <rect x="52.0" y="90.0" width="46" height="28" rx="14" class="bas-violet"/><text x="75" y="109" text-anchor="middle" class="bas-t">Na⁺</text>
  <rect x="136.0" y="94.0" width="48" height="28" rx="14" class="bas-blue"/><text x="160" y="113" text-anchor="middle" class="bas-t bas-tblue">OH⁻</text>
  <rect x="152.0" y="142.0" width="46" height="28" rx="14" class="bas-violet"/><text x="175" y="161" text-anchor="middle" class="bas-t">Na⁺</text>
  <rect x="66.0" y="140.0" width="48" height="28" rx="14" class="bas-blue"/><text x="90" y="159" text-anchor="middle" class="bas-t bas-tblue">OH⁻</text>
  <rect x="47.0" y="192.0" width="46" height="28" rx="14" class="bas-violet"/><text x="70" y="211" text-anchor="middle" class="bas-t">Na⁺</text>
  <rect x="126.0" y="188.0" width="48" height="28" rx="14" class="bas-blue"/><text x="150" y="207" text-anchor="middle" class="bas-t bas-tblue">OH⁻</text>
  <text x="125" y="280" text-anchor="middle" class="bas-c">NaOH → Na⁺ + OH⁻</text>
  <text x="125" y="302" text-anchor="middle" class="bas-sm">거의 모두 이온화 → 강한 염기</text>
  <text x="360" y="36" text-anchor="middle" class="bas-h">석회수 (수산화 칼슘)</text>
  <rect x="264" y="80" width="192" height="171" class="bas-liq"/>
  <path d="M254 52 L260 58 L260 252 L460 252 L460 58 L466 52" class="bas-glass"/>
  <rect x="286.0" y="90.0" width="48" height="28" rx="14" class="bas-blue"/><text x="310" y="109" text-anchor="middle" class="bas-t bas-tblue">OH⁻</text>
  <rect x="376.0" y="94.0" width="48" height="28" rx="14" class="bas-blue"/><text x="400" y="113" text-anchor="middle" class="bas-t bas-tblue">OH⁻</text>
  <rect x="328.0" y="140.0" width="54" height="28" rx="14" class="bas-teal"/><text x="355" y="159" text-anchor="middle" class="bas-t">Ca²⁺</text>
  <rect x="281.0" y="190.0" width="48" height="28" rx="14" class="bas-blue"/><text x="305" y="209" text-anchor="middle" class="bas-t bas-tblue">OH⁻</text>
  <rect x="383.0" y="186.0" width="54" height="28" rx="14" class="bas-teal"/><text x="410" y="205" text-anchor="middle" class="bas-t">Ca²⁺</text>
  <rect x="336.0" y="222.0" width="48" height="28" rx="14" class="bas-blue"/><text x="360" y="241" text-anchor="middle" class="bas-t bas-tblue">OH⁻</text>
  <text x="360" y="280" text-anchor="middle" class="bas-c">Ca(OH)₂ → Ca²⁺ + 2OH⁻</text>
  <text x="360" y="302" text-anchor="middle" class="bas-sm">한 개가 OH⁻를 2개 내놓는다</text>
  <text x="595" y="36" text-anchor="middle" class="bas-h">암모니아수</text>
  <rect x="499" y="80" width="192" height="171" class="bas-liq"/>
  <path d="M489 52 L495 58 L495 252 L695 252 L695 58 L701 52" class="bas-glass"/>
  <rect x="524.0" y="90.0" width="52" height="28" rx="14" class="bas-mol"/><text x="550" y="109" text-anchor="middle" class="bas-t">NH₃</text>
  <rect x="609.0" y="98.0" width="52" height="28" rx="14" class="bas-mol"/><text x="635" y="117" text-anchor="middle" class="bas-t">NH₃</text>
  <rect x="517.0" y="146.0" width="56" height="28" rx="14" class="bas-green"/><text x="545" y="165" text-anchor="middle" class="bas-t">NH₄⁺</text>
  <rect x="606.0" y="148.0" width="48" height="28" rx="14" class="bas-blue"/><text x="630" y="167" text-anchor="middle" class="bas-t bas-tblue">OH⁻</text>
  <rect x="554.0" y="198.0" width="52" height="28" rx="14" class="bas-mol"/><text x="580" y="217" text-anchor="middle" class="bas-t">NH₃</text>
  <rect x="624.0" y="216.0" width="52" height="28" rx="14" class="bas-mol"/><text x="650" y="235" text-anchor="middle" class="bas-t">NH₃</text>
  <text x="595" y="280" text-anchor="middle" class="bas-c">NH₃ + H₂O → NH₄⁺ + OH⁻</text>
  <text x="595" y="302" text-anchor="middle" class="bas-sm">일부만 반응 → 약한 염기</text>
  <text x="360" y="334" text-anchor="middle" class="bas-c">세 수용액에 공통으로 들어 있는 입자 <tspan class="bas-key bas-tblue">OH⁻</tspan> → 쓴맛, 단백질을 녹임 등 염기의 공통 성질</text>
  <text x="360" y="360" text-anchor="middle" class="bas-sm">모식도: 물 분자는 생략했다. 점선 테두리는 물과 반응하지 않은 암모니아 분자이다.</text>
</svg>
