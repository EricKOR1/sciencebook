  <title id="t-m2-07-water-model">그림 중2-7-5 전기 회로와 물의 흐름 모형</title>
  <desc id="d-m2-07-water-model">물의 흐름 모형에서 펌프는 전지, 물의 높이 차는 전압, 흐르는 물의 양은 전류, 물레방아는 전구(저항)에 해당한다. 물레방아를 지난 물의 양이 줄지 않듯이 전구를 지난 전류도 줄지 않는다.</desc>
