  <title id="t-matter-1-q-water-displacement">그림 물질과 에너지 1-11 문제 15의 수상 치환 장치</title>
  <desc id="d-matter-1-q-water-displacement">수조에 물을 가득 채운 눈금 실린더를 거꾸로 세우고, 물속에서 라이터의 가스를 내보내 실린더 위쪽에 모은다. (가)는 실린더 안과 밖의 수면 높이를 같게 맞춘 경우, (나)는 실린더 안의 수면이 바깥 수면보다 낮은 경우이다. 모식도이다.</desc>
