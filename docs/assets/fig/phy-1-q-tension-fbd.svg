  <path d="M600 278 L593.4 266 L606.6 266 Z" style="fill:var(--fig-blue);stroke:none"/>
  <text x="608" y="274" class="phy-1-q-tension-fbd-t" style="fill:var(--fig-blue)">중력 20 N</text>
  <line x1="538" y1="154" x2="538" y2="185" style="stroke:var(--fig-green);stroke-width:2.5;stroke-linecap:butt"/>
  <path d="M538 194 L532.5 184 L543.5 184 Z" style="fill:var(--fig-green);stroke:none"/>
  <text x="532" y="218" text-anchor="middle" class="phy-1-q-tension-fbd-s" style="fill:var(--fig-green)">a: 아래 2 m/s²</text>
</svg>
