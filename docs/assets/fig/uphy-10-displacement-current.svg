<text x="336" y="30" class="u10c-sm" style="fill:var(--fig-amber);font-weight:600">면 S₂ (판 사이로 부풀린 주머니)</text>
<text x="420" y="206" class="u10c-s">S₂를 지나는 전도 전류 = 0</text>
<text x="420" y="224" class="u10c-s">대신 판 사이 전기 선속 Φ_E가 변한다</text>
<text x="420" y="246" class="u10c-sm">변위 전류 i_d = ε₀ dΦ_E/dt = i</text>
<text x="200" y="84" text-anchor="middle" class="u10c-s">경계(같은 고리)</text>
<text x="360" y="346" text-anchor="middle" class="u10c-sm">∮B·ds = μ₀(i + ε₀ dΦ_E/dt) — 어느 면을 잡아도 μ₀i로 같다</text>
