<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-uphy-10-displacement-current d-uphy-10-displacement-current">
  <title id="t-uphy-10-displacement-current">그림 일반물리학 10-8 충전 중인 축전기와 변위 전류</title>
  <desc id="d-uphy-10-displacement-current">충전 중인 평행판 축전기의 도선을 둘러싼 같은 고리를 경계로 두 면을 잡았다. 평평한 원판 S₁은 전도 전류 i가 뚫고 지나가지만, 판 사이로 부풀린 주머니 S₂에는 전도 전류가 지나가지 않고 대신 커지는 전기장의 선속이 지나간다. 변위 전류 ε₀ dΦ_E/dt가 i와 같아서 앙페르–맥스웰 법칙은 어느 면에서나 같은 값을 준다.</desc>
