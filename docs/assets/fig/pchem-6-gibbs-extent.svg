<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-pchem-6-gibbs-extent d-pchem-6-gibbs-extent">
  <title id="t-pchem-6-gibbs-extent">그림 물리화학 6-1 A ⇌ B 반응의 G(ξ) 곡선</title>
  <desc id="d-pchem-6-gibbs-extent">298.15 K, 1 bar에서 A 1 mol로 출발한 이상 기체 반응 A ⇌ B(ΔrG° = −2.00 kJ/mol). 순수 성분의 직선 ξΔrG°(파란 점선)와 언제나 음수인 혼합 깁스 에너지(주황 점선, ξ = 0.5에서 −1.72 kJ/mol)를 더한 G(ξ)(굵은 선)는 ξ = 0.691에서 바닥 −2.91 kJ/mol을 갖는다. ξ = 0.2와 0.9에서 그은 접선의 기울기가 그 조성의 ΔrG(−5.44, +3.45 kJ/mol)이다.</desc>
