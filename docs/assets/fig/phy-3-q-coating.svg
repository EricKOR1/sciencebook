  <text x="208.5" y="38.4" text-anchor="middle" class="phy-3-q-coating-h" style="fill:var(--fig-red)">①</text>
  <text x="251.6" y="38.4" text-anchor="middle" class="phy-3-q-coating-h" style="fill:var(--fig-violet)">②</text>
