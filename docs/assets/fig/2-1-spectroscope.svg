  <line x1="498" y1="176" x2="504" y2="176" style="stroke:var(--fig-ink);stroke-width:1"/>
  <line x1="498" y1="185" x2="504" y2="185" style="stroke:var(--fig-ink);stroke-width:1"/>
  <line x1="498" y1="194" x2="504" y2="194" style="stroke:var(--fig-ink);stroke-width:1"/>
  <line x1="498" y1="203" x2="504" y2="203" style="stroke:var(--fig-ink);stroke-width:1"/>
  <line x1="498" y1="212" x2="504" y2="212" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="501.0" y="238.0" text-anchor="middle" class="sps-sm">회절 격자(촘촘한 홈)</text>
  <line x1="504" y1="150" x2="680" y2="150" style="stroke:var(--fig-ink);stroke-width:3;opacity:0.6"/>
  <line x1="504" y1="150" x2="680" y2="120" style="stroke:var(--fig-violet);stroke-width:2.5"/>
  <line x1="504" y1="150" x2="680" y2="180" style="stroke:var(--fig-violet);stroke-width:2.5"/>
  <line x1="504" y1="150" x2="680" y2="112" style="stroke:var(--fig-blue);stroke-width:2.5"/>
  <line x1="504" y1="150" x2="680" y2="188" style="stroke:var(--fig-blue);stroke-width:2.5"/>
  <line x1="504" y1="150" x2="680" y2="102" style="stroke:var(--fig-green);stroke-width:2.5"/>
  <line x1="504" y1="150" x2="680" y2="198" style="stroke:var(--fig-green);stroke-width:2.5"/>
  <line x1="504" y1="150" x2="680" y2="92" style="stroke:var(--fig-amber);stroke-width:2.5"/>
  <line x1="504" y1="150" x2="680" y2="208" style="stroke:var(--fig-amber);stroke-width:2.5"/>
  <line x1="504" y1="150" x2="680" y2="80" style="stroke:var(--fig-red);stroke-width:2.5"/>
  <line x1="504" y1="150" x2="680" y2="220" style="stroke:var(--fig-red);stroke-width:2.5"/>
  <rect x="680" y="64" width="10" height="172" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5"/>
  <text x="676.0" y="72.0" text-anchor="end" class="sps-sm">빨강</text>
  <text x="676.0" y="160.0" text-anchor="end" class="sps-sm" dy="-14">가운데: 흰빛</text>
  <text x="540.0" y="266.0" text-anchor="middle" class="sps-lbl">홈에서 퍼진 빛이 겹치며 색이 나뉜다</text>

</svg>
