  <text x="360.0" y="346.0" text-anchor="middle" class="rxn-1-buffer-particles-s">넣은 H₃O⁺·OH⁻는 대부분 소모되고 HA와 A⁻의 비만 조금 바뀐다. 한쪽이 바닥나면 완충 작용이 무너진다.</text>
  <text x="360.0" y="368.0" text-anchor="middle" class="rxn-1-buffer-particles-s">HA = CH₃COOH, A⁻ = CH₃COO⁻. 점선은 새로 생긴 입자. Na⁺와 물 분자는 생략한 모식도이다.</text>
