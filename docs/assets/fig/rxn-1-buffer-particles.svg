<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" role="img" aria-labelledby="t-rxn-1-buffer-particles d-rxn-1-buffer-particles">
  <title id="t-rxn-1-buffer-particles">그림 화학 반응의 세계 1-5 완충 용액에 산과 염기를 넣을 때 — 입자 모형</title>
  <desc id="d-rxn-1-buffer-particles">아세트산(HA)과 아세트산 이온(A⁻)이 넉넉히 들어 있는 완충 용액에 H₃O⁺를 넣으면 A⁻가 받아 HA가 되고, OH⁻를 넣으면 HA가 양성자를 주어 A⁻와 물이 된다. 넣은 이온은 소모되고 HA와 A⁻의 비만 조금 바뀌므로 pH가 거의 변하지 않는다. Na⁺와 물 분자는 생략한 모식도이다.</desc>
