<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-mech-2-q-wall-layers d-mech-2-q-wall-layers">
  <title id="t-mech-2-q-wall-layers">그림 역학과 에너지 2-11 문제 16의 두 벽의 단면</title>
  <desc id="d-mech-2-q-wall-layers">(가)는 두께 0.20 m인 콘크리트만으로 된 벽, (나)는 같은 콘크리트 바깥쪽에 두께 0.05 m인 스티로폼을 붙인 벽의 단면이다. 두께는 같은 축척으로 그렸다. 두 벽 모두 넓이 10 m², 안팎 온도 차이 20 K이고 열은 벽에 수직으로 실내에서 실외로 흐른다.</desc>
  <style>.mech-2-q-wall-layers-t{font-size:14px;fill:var(--fig-ink)} .mech-2-q-wall-layers-s{font-size:13px;fill:var(--fig-muted)} .mech-2-q-wall-layers-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}</style>
  <text x="180.0" y="30.0" text-anchor="middle" class="mech-2-q-wall-layers-h">(가) 콘크리트 벽</text>
  <rect x="130.0" y="60.0" width="80.0" height="160.0" rx="0" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <text x="170.0" y="145.0" text-anchor="middle" class="mech-2-q-wall-layers-s" style="fill:var(--fig-ink)">콘크리트</text>
  <line x1="130.0" y1="236.0" x2="210.0" y2="236.0" style="stroke:var(--fig-muted);stroke-width:1.3;fill:none"/>
  <path d="M210.0 236.0 L202.0 240.0 L202.0 232.0 Z" style="fill:var(--fig-muted)"/>
  <path d="M130.0 236.0 L138.0 232.0 L138.0 240.0 Z" style="fill:var(--fig-muted)"/>
  <text x="170.0" y="262.0" text-anchor="middle" class="mech-2-q-wall-layers-s" style="fill:var(--fig-ink)">0.20 m</text>
  <text x="80.0" y="120.0" text-anchor="middle" class="mech-2-q-wall-layers-h">실내</text>
  <text x="262.0" y="140.0" text-anchor="middle" class="mech-2-q-wall-layers-h">실외</text>
  <line x1="50.0" y1="175.0" x2="269.0" y2="175.0" style="stroke:var(--fig-red);stroke-width:3;fill:none"/>
  <path d="M280.0 175.0 L269.0 180.5 L269.0 169.5 Z" style="fill:var(--fig-red)"/>
  <text x="80.0" y="200.0" text-anchor="middle" class="mech-2-q-wall-layers-s" style="fill:var(--fig-red)">열의 흐름</text>
  <text x="540.0" y="30.0" text-anchor="middle" class="mech-2-q-wall-layers-h">(나) 콘크리트 + 스티로폼 벽</text>
  <rect x="490.0" y="60.0" width="80.0" height="160.0" rx="0" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <text x="530.0" y="145.0" text-anchor="middle" class="mech-2-q-wall-layers-s" style="fill:var(--fig-ink)">콘크리트</text>
  <rect x="570.0" y="60.0" width="20.0" height="160.0" rx="0" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:2"/>
  <line x1="580.0" y1="90.0" x2="616.0" y2="76.0" style="stroke:var(--fig-muted);stroke-width:1.2;fill:none"/>
  <text x="620.0" y="80.0" class="mech-2-q-wall-layers-s" style="fill:var(--fig-ink)">스티로폼</text>
  <line x1="570.0" y1="236.0" x2="590.0" y2="236.0" style="stroke:var(--fig-muted);stroke-width:1.3;fill:none"/>
  <path d="M590.0 236.0 L582.0 240.0 L582.0 232.0 Z" style="fill:var(--fig-muted)"/>
  <path d="M570.0 236.0 L578.0 232.0 L578.0 240.0 Z" style="fill:var(--fig-muted)"/>
  <text x="596.0" y="262.0" class="mech-2-q-wall-layers-s" style="fill:var(--fig-ink)">0.05 m</text>
  <line x1="490.0" y1="236.0" x2="570.0" y2="236.0" style="stroke:var(--fig-muted);stroke-width:1.3;fill:none"/>
  <path d="M570.0 236.0 L562.0 240.0 L562.0 232.0 Z" style="fill:var(--fig-muted)"/>
  <path d="M490.0 236.0 L498.0 232.0 L498.0 240.0 Z" style="fill:var(--fig-muted)"/>
  <text x="530.0" y="262.0" text-anchor="middle" class="mech-2-q-wall-layers-s" style="fill:var(--fig-ink)">0.20 m</text>
