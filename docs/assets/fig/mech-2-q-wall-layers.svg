  <text x="642.0" y="140.0" text-anchor="middle" class="mech-2-q-wall-layers-h">실외</text>
  <line x1="410.0" y1="175.0" x2="649.0" y2="175.0" style="stroke:var(--fig-red);stroke-width:3;fill:none"/>
  <path d="M660.0 175.0 L649.0 180.5 L649.0 169.5 Z" style="fill:var(--fig-red)"/>
  <text x="440.0" y="200.0" text-anchor="middle" class="mech-2-q-wall-layers-s" style="fill:var(--fig-red)">열의 흐름</text>
  <text x="360.0" y="290.0" text-anchor="middle" class="mech-2-q-wall-layers-t">두 벽 모두 넓이 10 m², 안팎 온도 차이 20 K</text>
</svg>
