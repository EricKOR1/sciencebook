<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-m1-06-gas-pressure d-m1-06-gas-pressure">
  <title id="t-m1-06-gas-pressure">그림 중1-6-2 기체의 압력이 생기는 까닭</title>
  <desc id="d-m1-06-gas-pressure">그릇 속 기체 입자는 모든 방향으로 움직이며 벽에 끊임없이 충돌한다. 일정한 면적의 벽에 입자가 더 자주, 더 세게 충돌할수록 기체의 압력이 크다. 입자 크기와 개수는 모식적이다.</desc>
  <style>
    .gp-red{fill:none;stroke:var(--fig-red)} .gp-redh{fill:var(--fig-red)}
    .gp-blue{fill:none;stroke:var(--fig-blue)} .gp-blueh{fill:var(--fig-blue)}
    .gp-green{fill:none;stroke:var(--fig-green)} .gp-greenh{fill:var(--fig-green)}
    .gp-ink{fill:none;stroke:var(--fig-ink)} .gp-inkh{fill:var(--fig-ink)}
    .gp-violet{fill:none;stroke:var(--fig-violet)} .gp-violeth{fill:var(--fig-violet)}
    .gp-muted{fill:none;stroke:var(--fig-muted)} .gp-mutedh{fill:var(--fig-muted)}
    .gp-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .gp-t{font-size:14px;fill:var(--fig-ink)}
    .gp-sm{font-size:13px;fill:var(--fig-muted)}
    .gp-rb{font-size:14px;font-weight:700;fill:var(--fig-red)}
    .gp-bb{font-size:14px;font-weight:700;fill:var(--fig-blue)}
    .gp-ld{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .gp-box{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:3}
    .gp-g{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.4}
    .gp-hit{fill:var(--fig-amber);stroke:none}
    .gp-path{fill:none;stroke:var(--fig-muted);stroke-width:1.5;stroke-dasharray:4 4}
    .gp-zoom{fill:none;stroke:var(--fig-line);stroke-width:1.4;stroke-dasharray:5 4}
    .gp-wall{fill:var(--fig-paper);stroke:var(--fig-ink);stroke-width:2}
    .gp-tag{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.2}
