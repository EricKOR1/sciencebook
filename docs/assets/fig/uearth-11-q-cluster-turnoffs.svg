  <desc id="d-uearth-11-q-cluster-turnoffs">세 성단 (가), (나), (다)의 H–R도. 가로축은 표면 온도(왼쪽이 고온), 세로축은 광도(태양 = 1, 로그 눈금)이다. 점선은 영년 주계열이며, 각 성단에서 주계열이 꺾여 나가는 곳(전향점)을 동그라미로 표시했다. 별의 분포는 모식적이다.</desc>
