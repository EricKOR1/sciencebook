<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-pchem-8-stern-gerlach d-pchem-8-stern-gerlach">
  <title id="t-pchem-8-stern-gerlach">그림 물리화학 8-12 슈테른–게를라흐 실험 장치</title>
  <desc id="d-pchem-8-stern-gerlach">진공 용기(점선) 안에서 가열 오븐(약 1000 ℃)이 낸 은 원자 빔이 슬릿 두 개를 지나 가늘어진 뒤, 위 S극(날)과 아래 N극(홈) 사이의 불균일한 자기장을 지나 검출판에 닿는다. 아래 단면도처럼 자기력선은 N극에서 S극으로(+z 방향) 향하고 위쪽 날 근처에서 촘촘해지므로 Bz &gt; 0, ∂Bz/∂z &gt; 0이다. μz = −g_e m_s μ_B이므로 m_s = −½인 원자는 위로, +½인 원자는 아래로 휜다. 검출판의 결과: 고전적 예상은 세로로 퍼진 연속 띠, 관측은 위아래로 갈라진 두 자국이다. 모식도이며 휜 정도는 과장했다.</desc>
