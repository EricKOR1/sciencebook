<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-m1-05-net-force d-m1-05-net-force">
  <title id="t-m1-05-net-force">그림 중1-5-2 한 직선 위의 두 힘과 알짜힘</title>
  <desc id="d-m1-05-net-force">같은 방향의 두 힘은 크기를 더하고, 반대 방향의 두 힘은 큰 힘에서 작은 힘을 빼며 방향은 큰 힘의 방향이다. 크기가 같고 방향이 반대인 두 힘의 알짜힘은 0이어서 힘의 평형을 이룬다. 화살표의 길이는 힘의 크기에 비례하게 그렸다.</desc>
  <style>
    .nf-red{fill:none;stroke:var(--fig-red)} .nf-redh{fill:var(--fig-red)}
    .nf-blue{fill:none;stroke:var(--fig-blue)} .nf-blueh{fill:var(--fig-blue)}
    .nf-green{fill:none;stroke:var(--fig-green)} .nf-greenh{fill:var(--fig-green)}
    .nf-amber{fill:none;stroke:var(--fig-amber)} .nf-amberh{fill:var(--fig-amber)}
    .nf-violet{fill:none;stroke:var(--fig-violet)} .nf-violeth{fill:var(--fig-violet)}
    .nf-teal{fill:none;stroke:var(--fig-teal)} .nf-tealh{fill:var(--fig-teal)}
    .nf-ink{fill:none;stroke:var(--fig-ink)} .nf-inkh{fill:var(--fig-ink)}
    .nf-muted{fill:none;stroke:var(--fig-muted)} .nf-mutedh{fill:var(--fig-muted)}
    .nf-line{fill:none;stroke:var(--fig-line)} .nf-lineh{fill:var(--fig-line)}
    .nf-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .nf-t{font-size:14px;fill:var(--fig-ink)}
    .nf-sm{font-size:13px;fill:var(--fig-muted)}
    .nf-redb{font-size:14px;font-weight:700;fill:var(--fig-red)}
    .nf-sred{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.6}
    .nf-blueb{font-size:14px;font-weight:700;fill:var(--fig-blue)}
    .nf-sblue{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6}
    .nf-greenb{font-size:14px;font-weight:700;fill:var(--fig-green)}
    .nf-sgreen{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.6}
    .nf-amberb{font-size:14px;font-weight:700;fill:var(--fig-amber)}
    .nf-samber{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.6}
    .nf-violetb{font-size:14px;font-weight:700;fill:var(--fig-violet)}
    .nf-sviolet{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.6}
    .nf-tealb{font-size:14px;font-weight:700;fill:var(--fig-teal)}
    .nf-steal{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.6}
    .nf-panel{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.4}
    .nf-paper{fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1.4}
    .nf-axis{fill:none;stroke:var(--fig-ink);stroke-width:1.6}
    .nf-grid{fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 4}
    .nf-dash{fill:none;stroke:var(--fig-muted);stroke-width:1.4;stroke-dasharray:5 4}
    .nf-box{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2} .nf-ghost{fill:none;stroke:var(--fig-muted);stroke-width:1.5;stroke-dasharray:4 3}
  </style>
  <line x1="330.0" y1="40.0" x2="330.0" y2="330.0" class="nf-dash" style="stroke-width:1.2;stroke-linecap:round"/>
