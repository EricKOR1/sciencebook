  <line x1="180.0" y1="295.0" x2="238.0" y2="295.0" class="nf-red" style="stroke-width:3.5;stroke-linecap:round"/>
  <path d="M252.0 295.0 L238.0 301.7 L238.0 288.3 Z" class="nf-redh"/>
  <text x="258.0" y="300.0" class="nf-redb">4 N</text>
  <line x1="130.0" y1="295.0" x2="72.0" y2="295.0" class="nf-blue" style="stroke-width:3.5;stroke-linecap:round"/>
  <path d="M58.0 295.0 L72.0 288.3 L72.0 301.7 Z" class="nf-blueh"/>
  <text x="52.0" y="300.0" text-anchor="end" class="nf-blueb">4 N</text>
  <rect x="420.0" y="277.0" width="50.0" height="36.0" rx="3" class="nf-ghost"/>
  <text x="445.0" y="335.0" text-anchor="middle" class="nf-violetb">0 → 힘의 평형</text>
  <text x="490.0" y="299.0" class="nf-sm">운동 상태가 변하지 않는다</text>
</svg>
