  <text x="130.0" y="30.0" text-anchor="middle" class="nf-h">물체에 작용하는 힘</text>
  <text x="20.0" y="51.0" class="nf-t">① 같은 방향</text>
  <rect x="130.0" y="67.0" width="50.0" height="36.0" rx="3" class="nf-box"/>
