  <path d="M614.0 85.0 L600.0 91.7 L600.0 78.3 Z" class="nf-violeth"/>
  <text x="475.0" y="125.0" class="nf-violetb">5 + 3 = 8 N, 오른쪽</text>
  <text x="20.0" y="156.0" class="nf-t">② 반대 방향</text>
  <rect x="130.0" y="172.0" width="50.0" height="36.0" rx="3" class="nf-box"/>
  <line x1="180.0" y1="190.0" x2="256.0" y2="190.0" class="nf-red" style="stroke-width:3.5;stroke-linecap:round"/>
  <path d="M270.0 190.0 L256.0 196.7 L256.0 183.3 Z" class="nf-redh"/>
  <text x="276.0" y="195.0" class="nf-redb">5 N</text>
  <line x1="130.0" y1="190.0" x2="90.0" y2="190.0" class="nf-blue" style="stroke-width:3.5;stroke-linecap:round"/>
  <path d="M76.0 190.0 L90.0 183.3 L90.0 196.7 Z" class="nf-blueh"/>
  <text x="70.0" y="195.0" text-anchor="end" class="nf-blueb">3 N</text>
  <rect x="420.0" y="172.0" width="50.0" height="36.0" rx="3" class="nf-ghost"/>
  <line x1="470.0" y1="190.0" x2="492.0" y2="190.0" class="nf-violet" style="stroke-width:4.5;stroke-linecap:round"/>
  <path d="M506.0 190.0 L492.0 196.7 L492.0 183.3 Z" class="nf-violeth"/>
  <text x="475.0" y="230.0" class="nf-violetb">5 − 3 = 2 N, 오른쪽(큰 힘 쪽)</text>
  <text x="20.0" y="261.0" class="nf-t">③ 크기가 같고 반대 방향</text>
