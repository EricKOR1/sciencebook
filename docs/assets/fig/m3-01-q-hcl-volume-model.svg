<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-m3-01-q-hcl-volume-model d-m3-01-q-hcl-volume-model">
  <title id="t-m3-01-q-hcl-volume-model">그림 중3-1-9 문제 17 해설: 입자 모형으로 본 염화 수소 생성 반응의 부피비</title>
  <desc id="d-m3-01-q-hcl-volume-model">(가) 수소와 염소가 원자 하나씩 떨어진 입자라면 H와 Cl이 하나씩 짝을 지어 염화 수소는 1부피만 생겨야 한다. (나) 실제로 2부피가 생기려면 수소와 염소의 입자가 각각 원자 2개로 된 분자여서 둘로 나뉘어 염화 수소 입자 2개씩에 들어가야 한다.</desc>
