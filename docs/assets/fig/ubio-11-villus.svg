<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="t-ubio-11-villus d-ubio-11-villus">
  <title id="t-ubio-11-villus">그림 일반생명과학 11-6 융털과 소장 상피 세포의 흡수</title>
  <desc id="d-ubio-11-villus">왼쪽: 소장 융털 한 개의 모식도. 융털 표면은 미세 융털이 있는 상피 세포가 덮고, 안쪽에는 모세혈관망과 가운데의 암죽관(림프관)이 있다. 오른쪽: 상피 세포 하나를 확대한 모식도. 내강 쪽 막의 Na⁺–포도당 공동 수송체가 Na⁺ 기울기를 이용해 포도당을 들이고(2차 능동 수송), 반대쪽 막의 Na⁺–K⁺ 펌프가 ATP로 Na⁺ 기울기를 유지하며, 포도당은 촉진 확산으로 모세혈관 쪽으로 나간다. 지방산과 모노글리세리드는 미셀에서 확산해 들어와 트라이글리세리드로 재합성되고 킬로미크론으로 포장되어 암죽관으로 나간다.</desc>
