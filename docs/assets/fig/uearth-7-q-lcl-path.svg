  <title id="t-uearth-7-q-lcl-path">그림 일반지구과학 7-11 문제 15 해설 — 상승하는 공기 덩어리의 기온과 이슬점</title>
  <desc id="d-uearth-7-q-lcl-path">30 °C, 이슬점 18.5 °C인 공기 덩어리를 들어 올리면 기온은 건조 단열 감률(9.8 K/km)로, 이슬점은 약 1.8 K/km로 내려가 둘의 차가 1 km에 약 8 K씩 줄어든다. 두 선은 약 1.44 km, 약 16 °C에서 만나며 이 높이가 상승 응결 고도이다. 그 아래에서는 응결이 없어 혼합비(13.5 g/kg)가 보존된다.</desc>
