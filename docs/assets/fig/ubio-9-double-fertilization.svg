<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-ubio-9-double-fertilization d-ubio-9-double-fertilization">
<title id="t-ubio-9-double-fertilization">그림 일반생명과학 9-5 속씨식물의 중복 수정</title>
<desc id="d-ubio-9-double-fertilization">꽃가루가 암술머리에 붙으면 꽃가루관이 암술대를 따라 자라 씨방 속 밑씨의 주공으로 들어가 정핵 2개를 배낭에 넣는다. 정핵 하나는 난세포와 합쳐져 접합자(2n, 배가 됨)가, 다른 하나는 중앙 세포의 극핵 2개와 합쳐져 배젖(3n)이 된다. 수정 뒤 밑씨는 종자, 주피는 종피, 씨방은 열매가 된다. 모식도이다.</desc>
