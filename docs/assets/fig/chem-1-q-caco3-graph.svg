  <title id="t-chem-1-q-caco3-graph">그림 화학 1-8 문제 15 해설 — 탄산 칼슘의 질량과 줄어든 질량</title>
  <desc id="d-chem-1-q-caco3-graph">측정값(점)은 원점을 지나는 직선(기울기 0.44)을 따라 늘다가 탄산 칼슘 2.50 g에서 꺾여 1.10 g으로 일정해진다. 꺾이는 점까지는 탄산 칼슘이, 그 뒤로는 HCl이 한계 반응물이다. 같은 농도의 염산을 2배 부피로 쓰면 꺾이는 점이 5.00 g으로 옮겨 가므로, 4.00 g을 넣으면 직선 위의 1.76 g이 된다.</desc>
