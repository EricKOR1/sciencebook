<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-earth-3-venus-phases d-earth-3-venus-phases">
  <title id="t-earth-3-venus-phases">그림 지구과학 3-7 두 모형으로 예측한 금성의 위상과 크기</title>
  <desc id="d-earth-3-venus-phases">지구 중심 모형에서는 금성이 지구와 태양 사이의 주전원 위에만 있어 초승달이나 그믐달 모양만 보여야 한다. 태양 중심 모형에서는 금성이 태양 너머(외합 부근)에서 작은 보름달 모양, 지구 가까이(내합 부근)에서 큰 초승달 모양으로 보인다. 갈릴레이의 관측은 태양 중심 모형과 맞았다. 크기와 거리는 모식적이다.</desc>
  <style>
    .earth-3-venus-phases-t{font-size:14px;fill:var(--fig-ink)}
    .earth-3-venus-phases-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .earth-3-venus-phases-s{font-size:13px;fill:var(--fig-muted)}
    .earth-3-venus-phases-land{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:0.8;fill-rule:evenodd}
    .earth-3-venus-phases-sea{fill:var(--fig-soft-blue)}
    .earth-3-venus-phases-grat{fill:none;stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3;opacity:0.7}
    .earth-3-venus-phases-frame{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .earth-3-venus-phases-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
<rect x="10" y="4" width="345" height="420" rx="6" style="fill:var(--fig-panel);stroke:var(--fig-line)"/><text x="182" y="28" text-anchor="middle" class="earth-3-venus-phases-b">지구 중심 모형</text><text x="182" y="48" text-anchor="middle" class="earth-3-venus-phases-s">금성이 늘 태양보다 지구 쪽에 있음</text><rect x="365" y="4" width="345" height="420" rx="6" style="fill:var(--fig-panel);stroke:var(--fig-line)"/><text x="537" y="28" text-anchor="middle" class="earth-3-venus-phases-b">태양 중심 모형</text><text x="537" y="48" text-anchor="middle" class="earth-3-venus-phases-s">금성이 태양 너머로도 감</text><circle cx="182" cy="380" r="11" style="fill:var(--fig-blue)"/><text x="198" y="385" text-anchor="start" class="earth-3-venus-phases-b earth-3-venus-phases-halo">지구</text><circle cx="182" cy="90" r="16" style="fill:var(--fig-amber)"/><text x="204" y="95" text-anchor="start" class="earth-3-venus-phases-b earth-3-venus-phases-halo">태양</text><line x1="182" y1="380" x2="182" y2="90" style="stroke:var(--fig-muted);stroke-dasharray:3 4"/><circle cx="182" cy="230" r="60" style="fill:none;stroke:var(--fig-violet);stroke-width:2;stroke-dasharray:5 3"/><text x="92" y="292" text-anchor="end" class="earth-3-venus-phases-s earth-3-venus-phases-halo">주전원</text><circle cx="182" cy="170" r="5" style="fill:var(--fig-violet)"/><circle cx="200.7" cy="170" r="6.7" style="fill:var(--fig-line);stroke:var(--fig-muted);stroke-width:0.8"/><path d="M200.7 163.3 A6.7 6.7 0 0 0 200.7 176.7 A6.7 6.7 0 0 1 200.7 163.3 Z" style="fill:var(--fig-amber)"/><circle cx="234" cy="200" r="5" style="fill:var(--fig-violet)"/><circle cx="253.4" cy="200" r="7.5" style="fill:var(--fig-line);stroke:var(--fig-muted);stroke-width:0.8"/><path d="M253.4 192.5 A7.5 7.5 0 0 0 253.4 207.5 A5.6 7.5 0 0 1 253.4 192.5 Z" style="fill:var(--fig-amber)"/><circle cx="130" cy="200" r="5" style="fill:var(--fig-violet)"/><circle cx="110.6" cy="200" r="7.5" style="fill:var(--fig-line);stroke:var(--fig-muted);stroke-width:0.8"/><path d="M110.6 192.5 A7.5 7.5 0 