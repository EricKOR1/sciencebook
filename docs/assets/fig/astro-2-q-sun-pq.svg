<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-astro-2-q-sun-pq d-astro-2-q-sun-pq">
  <title id="t-astro-2-q-sun-pq">그림 행성우주과학 2-9 문제 13의 가시광선 영상과 X선 영상(모식도)</title>
  <desc id="d-astro-2-q-sun-pq">같은 날 찍은 태양의 (가) 가시광선 영상과 (나) X선 영상을 나타낸 모식도이다. 두 영상에서 같은 자리에 있는 두 영역을 P, Q로 표시하였다.</desc>
  <style>.astro-2-q-sun-pq-t{font-size:14px;fill:var(--fig-ink)} .astro-2-q-sun-pq-s{font-size:13px;fill:var(--fig-muted)} .astro-2-q-sun-pq-b{font-weight:600} .astro-2-q-sun-pq-L{font-size:15px;fill:var(--fig-ink)}</style>
  <text x="190" y="30" text-anchor="middle" class="astro-2-q-sun-pq-t astro-2-q-sun-pq-b">(가) 가시광선 영상</text>
  <circle cx="190" cy="175" r="120" style="fill:#f6c453;stroke:var(--fig-amber);stroke-width:2"/>
  <circle cx="190" cy="175" r="98.4" style="fill:#fad77e;stroke:none;stroke-width:1.5"/>
  <circle cx="190" cy="175" r="66" style="fill:#fde39a;stroke:none;stroke-width:1.5"/>
  <circle cx="141" cy="145" r="8" style="fill:#3a2a10;stroke:#2a1d08;stroke-width:1"/>
  <circle cx="164" cy="148" r="6.5" style="fill:#3a2a10;stroke:#2a1d08;stroke-width:1"/>
  <ellipse cx="212" cy="241" rx="64" ry="36" style="fill:none;stroke:var(--fig-red);stroke-width:1.5;stroke-dasharray:4 3"/>
  <ellipse cx="152" cy="145" rx="34" ry="22" style="fill:none;stroke:var(--fig-blue);stroke-width:1.5;stroke-dasharray:4 3"/>
  <line x1="118" y1="139" x2="62" y2="80" style="stroke:var(--fig-blue);stroke-width:1.2"/>
  <text x="56" y="77" text-anchor="end" class="astro-2-q-sun-pq-L astro-2-q-sun-pq-b" style="fill:var(--fig-blue)">P</text>
  <line x1="276" y1="247" x2="318" y2="300" style="stroke:var(--fig-red);stroke-width:1.2"/>
  <text x="324" y="311" text-anchor="start" class="astro-2-q-sun-pq-L astro-2-q-sun-pq-b" style="fill:var(--fig-red)">Q</text>
  <text x="530" y="30" text-anchor="middle" class="astro-2-q-sun-pq-t astro-2-q-sun-pq-b">(나) X선 영상</text>
  <circle cx="530" cy="175" r="134" style="fill:#2b2b3a;stroke:var(--fig-line);stroke-width:1;opacity:0.55"/>
  <circle cx="530" cy="175" r="120" style="fill:#1c1c28;stroke:var(--fig-line);stroke-width:1.5"/>
  <ellipse cx="492" cy="145" rx="30" ry="18" style="fill:#fff1b8;stroke:#ffd257;stroke-width:1"/>
  <ellipse cx="492" cy="145" rx="52" ry="30" style="fill:#d9b255;stroke:none;stroke-width:1.5;opacity:0.45"/>
  <ellipse cx="552" cy="241" rx="60" ry="32" style="fill:#06060a;stroke:#000000;stroke-width:0.5"/>
  <circle cx="585" cy="130" r="16" style="fill:#8a7a4a;stroke:none;stroke-width:1.5;opacity:0.6"/>
  <circle cx="460" cy="215" r="12" style="fill:#8a7a4a;stroke:none;stroke-width:1.5;opacity:0.6"/>
  <circle cx="610" cy="185" r="10" style="fill:#8a7a4a;stroke:none;stroke-width:1.5;opacity:0.6"/>
  <ellipse cx="552" cy="241" rx="64" ry="36" style="fill:none;stroke:var(--fig-red);stroke-width:1.5;stroke-dasharray:4 3"/>
  <ellipse cx="492" cy="145" rx="34" ry="22" style="fill:none;stroke:var(--fig-blue);stroke-width:1.5;stroke-dasharray:4 3"/>
  <line x1="458" y1="139" x2="402" y2="80" style="stroke:var(--fig-blue);stroke-width:1.2"/>
  <text x="396" y="77" text-anchor="end" class="astro-2-q-sun-pq-L astro-2-q-sun-pq-b" style="fill:var(--fig-blue)">P</text>
  <line x1="616" y1="247" x2="658" y2="300" style="stroke:var(--fig-red);stroke-width:1.2"/>
  <text x="664" y="311" text-anchor="start" class="astro-2-q-sun-pq-L astro-2-q-sun-pq-b" style="fill:var(--fig-red)">Q</text>
