  <title id="t-ochem-4-hammond">그림 유기화학 4-4 해먼드 가설 — 이른 전이 상태와 늦은 전이 상태</title>
  <desc id="d-ochem-4-hammond">왼쪽: 크게 발열인 단계(반응물 0, 생성물 −80 kJ/mol). 꼭대기(+20)가 반응 좌표의 30 % 지점에 있어 반응물에 가깝고 반응물을 닮는다(이른 전이 상태). 오른쪽: 크게 흡열인 단계(생성물 +80). 꼭대기(+95)가 75 % 지점에 있어 생성물을 닮는다(늦은 전이 상태). 점선은 생성물을 +65로 안정하게 한 경우로, 꼭대기도 약 +82로 거의 같은 만큼 내려간다. 높이는 예시 값이다.</desc>
