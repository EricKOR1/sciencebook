  <line x1="455.0" y1="40.0" x2="455.0" y2="280.0" style="stroke:var(--fig-ink);stroke-width:1.3"/>
  <text x="701.0" y="285.0" class="umath-2-triangle-order-t" style="font-style:italic">x</text>
  <text x="451.0" y="34.0" class="umath-2-triangle-order-t" text-anchor="middle" style="font-style:italic">y</text>
  <path d="M455.0 280.0 L686.4 48.6" style="fill:none;stroke:var(--fig-ink);stroke-width:1.6"/>
  <text x="564.9" y="147.1" class="umath-2-triangle-order-t" text-anchor="end" style="font-weight:600">y = x</text>
  <path d="M545.0 190.0 L669.3 190.0 L669.3 175.0 L560.0 175.0 Z" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
