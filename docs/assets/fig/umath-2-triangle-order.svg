  <path d="M665.0 182.5 L656.8 186.2 L656.8 178.8 Z" style="fill:var(--fig-amber);stroke:none"/>
  <text x="626.4" y="167.0" class="umath-2-triangle-order-t" text-anchor="middle" style="fill:var(--fig-amber);font-weight:600">x: y → 1</text>
  <text x="447.0" y="186.5" class="umath-2-triangle-order-tick" text-anchor="end">y</text>
  <text x="575.0" y="316.0" class="umath-2-triangle-order-s" text-anchor="middle">가로 띠 → y 방향으로 쓸기</text>
  <text x="575.0" y="348.0" class="umath-2-triangle-order-b" text-anchor="middle">∫<tspan dy="5" style="font-size:10px">0</tspan><tspan dx="-6" dy="-13" style="font-size:10px">1</tspan><tspan dy="8"> </tspan>∫<tspan dy="5" style="font-size:10px">y</tspan><tspan dx="-6" dy="-13" style="font-size:10px">1</tspan><tspan dy="8"> </tspan>f dx dy</text>
  <text x="360.0" y="175.0" class="umath-2-triangle-order-b" text-anchor="middle" style="font-size:26px">=</text>
</svg>
