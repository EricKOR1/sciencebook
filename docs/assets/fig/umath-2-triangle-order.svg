<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-umath-2-triangle-order d-umath-2-triangle-order">
  <title id="t-umath-2-triangle-order">그림 수학 도구 2-7 삼각형 영역에서 적분 순서 바꾸기</title>
  <desc id="d-umath-2-triangle-order">같은 영역 0 ≤ y ≤ x ≤ 1(꼭짓점 (0, 0), (1, 0), (1, 1)인 삼각형)을 두 방법으로 쓸어 담는다. 왼쪽: x를 고정한 세로 띠(y: 0 → x)를 더한 뒤 x로 쓸기. 오른쪽: y를 고정한 가로 띠(x: y → 1)를 더한 뒤 y로 쓸기.</desc>
  <style>
    .umath-2-triangle-order-t{font-size:14px;fill:var(--fig-ink)}
    .umath-2-triangle-order-s{font-size:13px;fill:var(--fig-muted)}
    .umath-2-triangle-order-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .umath-2-triangle-order-tick{font-size:13px;fill:var(--fig-muted)}
  </style>
  <path d="M95.0 280.0 L309.3 280.0 L309.3 65.7 Z" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.5"/>
  <path d="M95.0 280.0 L309.3 280.0 L309.3 65.7 L95.0 65.7 Z" style="fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4"/>
  <line x1="95.0" y1="280.0" x2="95.0" y2="285.0" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="95.0" y="299.0" class="umath-2-triangle-order-tick" text-anchor="middle">0</text>
  <line x1="309.3" y1="280.0" x2="309.3" y2="285.0" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="309.3" y="299.0" class="umath-2-triangle-order-tick" text-anchor="middle">1</text>
  <line x1="90.0" y1="280.0" x2="95.0" y2="280.0" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="87.0" y="284.5" class="umath-2-triangle-order-tick" text-anchor="end">0</text>
  <line x1="90.0" y1="65.7" x2="95.0" y2="65.7" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="87.0" y="70.2" class="umath-2-triangle-order-tick" text-anchor="end">1</text>
  <line x1="95.0" y1="280.0" x2="335.0" y2="280.0" style="stroke:var(--fig-ink);stroke-width:1.3"/>
  <line x1="95.0" y1="40.0" x2="95.0" y2="280.0" style="stroke:var(--fig-ink);stroke-width:1.3"/>
  <text x="341.0" y="285.0" class="umath-2-triangle-order-t" style="font-style:italic">x</text>
  <text x="91.0" y="34.0" class="umath-2-triangle-order-t" text-anchor="middle" style="font-style:italic">y</text>
  <path d="M95.0 280.0 L326.4 48.6" style="fill:none;stroke:var(--fig-ink);stroke-width:1.6"/>
  <text x="204.9" y="147.1" class="umath-2-triangle-order-t" text-anchor="end" style="font-weight:600">y = x</text>
  <path d="M227.9 280.0 L242.9 280.0 L242.9 132.1 L227.9 147.1 Z" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <line x1="235.4" y1="273.6" x2="235.4" y2="158.6" style="stroke:var(--fig-amber);stroke-width:2"/>
  <path d="M235.4 151.4 L239.0 159.6 L231.7 159.6 Z" style="fill:var(--fig-amber);stroke:none"/>
  <text x="248.9" y="215.7" class="umath-2-triangle-order-t" style="fill:var(--fig-amber);font-weight:600">y: 0 → x</text>
  <text x="235.4" y="299.0" class="umath-2-triangle-order-tick" text-anchor="middle">x</text>
  <text x="215.0" y="316.0" class="umath-2-triangle-order-s" text-anchor="middle">세로 띠 → x 방향으로 쓸기</text>
  <text x="215.0" y="348.0" class="umath-2-triangle-order-b" text-anchor="middle">∫<tspan dy="5" style="font-size:10px">0</tspan><tspan dx="-6" dy="-13" style="font-size:10px">1</tspan><tspan dy="8"> </tspan>∫<tspan dy="5" style="font-size:10px">0</tspan><tspan dx="-6" dy="-13" style="font-size:10px">x</tspan><tspan dy="8"> </tspan>f dy dx</text>
