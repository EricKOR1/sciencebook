  <text x="204" y="162" text-anchor="end" class="m2-06-digestion-b">쓸개</text><text x="204" y="181" text-anchor="end" class="m2-06-digestion-t">쓸개즙 저장 (효소 없음)</text><text x="204" y="199" text-anchor="end" class="m2-06-digestion-s"><tspan class="m2-06-digestion-fa">지방</tspan>을 작은 알갱이로</text>
  <polyline points="254,300 212,300" style="fill:none;stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="204" y="294" text-anchor="end" class="m2-06-digestion-b">대장</text><text x="204" y="313" text-anchor="end" class="m2-06-digestion-t">소화액 없음</text><text x="204" y="331" text-anchor="end" class="m2-06-digestion-s">물을 흡수한다</text>
  <text x="20" y="392" class="m2-06-digestion-s">모식도 · 그림의 왼쪽이 몸의 오른쪽</text>
</svg>
