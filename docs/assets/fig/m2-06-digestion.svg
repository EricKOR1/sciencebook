<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" role="img" aria-labelledby="t-m2-06-digestion d-m2-06-digestion">
  <title id="t-m2-06-digestion">그림 중2-6-2 소화 기관과 소화 효소</title>
  <desc id="d-m2-06-digestion">입, 위, 이자, 소장에서 나오는 소화 효소와 각 효소가 분해하는 영양소를 소화 기관의 위치와 함께 나타냈다. 쓸개즙은 효소가 없지만 지방의 소화를 돕는다.</desc>
