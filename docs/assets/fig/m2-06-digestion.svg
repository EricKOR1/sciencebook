  <polyline points="430,216 492,204" style="fill:none;stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="500" y="198" text-anchor="start" class="m2-06-digestion-b">이자 (이자액 → 소장)</text><text x="500" y="217" text-anchor="start" class="m2-06-digestion-t">아밀레이스·트립신·라이페이스</text><text x="500" y="235" text-anchor="start" class="m2-06-digestion-s"><tspan class="m2-06-digestion-st">녹말</tspan>·<tspan class="m2-06-digestion-pr">단백질</tspan>·<tspan class="m2-06-digestion-fa">지방</tspan>을 분해</text>
