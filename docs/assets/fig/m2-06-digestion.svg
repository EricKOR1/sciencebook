  <text x="500" y="26" text-anchor="start" class="m2-06-digestion-b">입 (침)</text><text x="500" y="45" text-anchor="start" class="m2-06-digestion-t">아밀레이스</text><text x="500" y="63" text-anchor="start" class="m2-06-digestion-s"><tspan class="m2-06-digestion-st">녹말</tspan> → 엿당</text>
