  <text x="500" y="278" text-anchor="start" class="m2-06-digestion-b">소장</text><text x="500" y="297" text-anchor="start" class="m2-06-digestion-t">소장 벽의 효소: 최종 소화</text><text x="500" y="315" text-anchor="start" class="m2-06-digestion-s">포도당·아미노산 등 → 융털로 흡수</text>
