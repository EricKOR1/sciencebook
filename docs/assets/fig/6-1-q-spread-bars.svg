<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t-6-1-q-spread-bars d-6-1-q-spread-bars">
  <title id="t-6-1-q-spread-bars">그림 6-1-7 문제 12 해설: 세대별 새 감염자 수</title>
  <desc id="d-6-1-q-spread-bars">처음 감염자 10명에서 시작하여, 대책이 없으면(감염시키는 수 2) 새 감염자가 10, 20, 40, 80명으로 늘고, 추적·격리를 하면(0.8) 10, 8, 6.4, 5.12명으로 줄어든다. 3세대까지 더하면 각각 150명과 약 30명이다.</desc>
  <style>.f6-1-q-spread-bars-t{font-size:14px;fill:var(--fig-ink)} .f6-1-q-spread-bars-s{font-size:13px;fill:var(--fig-muted)} .f6-1-q-spread-bars-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .f6-1-q-spread-bars-ax{stroke:var(--fig-ink);stroke-width:1.4;fill:none} .f6-1-q-spread-bars-grid{stroke:var(--fig-line);stroke-width:0.8;fill:none} .f6-1-q-spread-bars-w{stroke:var(--fig-ink);stroke-width:2;fill:none} .f6-1-q-spread-bars-coil{stroke:var(--fig-amber);stroke-width:2.6;fill:none}</style>
