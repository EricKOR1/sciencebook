  <text x="82" y="169" text-anchor="end" class="f6-1-q-spread-bars-s">40</text>
  <line x1="90" y1="116" x2="560" y2="116" class="f6-1-q-spread-bars-grid"/>
  <text x="82" y="121" text-anchor="end" class="f6-1-q-spread-bars-s">60</text>
  <line x1="90" y1="68" x2="560" y2="68" class="f6-1-q-spread-bars-grid"/>
  <text x="82" y="73" text-anchor="end" class="f6-1-q-spread-bars-s">80</text>
