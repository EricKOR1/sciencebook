<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-rxn-2-oxnum-assign d-rxn-2-oxnum-assign">
  <title id="t-rxn-2-oxnum-assign">그림 화학 반응의 세계 2-3 산화수를 정하는 방법 — 공유 전자쌍의 장부상 소유</title>
  <desc id="d-rxn-2-oxnum-assign">공유 전자쌍을 전기 음성도가 큰 원자가 모두 가져갔다고 가정하고(점선 안), 장부상 가진 전자 수를 원래의 원자가 전자 수와 비교해 산화수를 정한다. H₂O에서 O는 −2, H는 +1, CO₂에서 C는 +4, O는 −2이고, 같은 원자끼리 결합한 Cl₂에서는 전자쌍을 반씩 나누어 0이다. 분자 모양은 단순하게 그렸다.</desc>
