    .rxn-2-oxnum-assign-f{font-size:14px;fill:var(--fig-ink);font-weight:600}
    .rxn-2-oxnum-assign-k{font-size:13px;fill:var(--fig-ink)}
    .rxn-2-oxnum-assign-s{font-size:13px;fill:var(--fig-muted)}
    .rxn-2-oxnum-assign-b{font-size:15px;fill:var(--fig-ink);font-weight:600}
  </style>
