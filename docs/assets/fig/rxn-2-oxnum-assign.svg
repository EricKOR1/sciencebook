  <text x="196.0" y="208.0" text-anchor="middle" class="rxn-2-oxnum-assign-b" style="fill:var(--fig-blue);font-weight:700">+1</text>
  <text x="120.0" y="244.0" text-anchor="middle" class="rxn-2-oxnum-assign-k">O: 원자가 전자 6 → 장부상 8 → −2</text>
