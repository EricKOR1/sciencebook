  <text x="430.0" y="98.0" text-anchor="middle" class="rxn-2-oxnum-assign-b" style="fill:var(--fig-red);font-weight:700">−2</text>
  <text x="360.0" y="114.0" text-anchor="middle" class="rxn-2-oxnum-assign-b" style="fill:var(--fig-amber);font-weight:700">+4</text>
  <text x="360.0" y="244.0" text-anchor="middle" class="rxn-2-oxnum-assign-k">C: 원자가 전자 4 → 장부상 0 → +4</text>
  <text x="360.0" y="264.0" text-anchor="middle" class="rxn-2-oxnum-assign-k">O: 원자가 전자 6 → 장부상 8 → −2</text>
