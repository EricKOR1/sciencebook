  <text x="600.0" y="264.0" text-anchor="middle" class="rxn-2-oxnum-assign-s">공유 전자쌍을 반씩 나눈다</text>
  <line x1="20.0" y1="286.0" x2="700.0" y2="286.0" style="stroke:var(--fig-line);stroke-width:1"/>
