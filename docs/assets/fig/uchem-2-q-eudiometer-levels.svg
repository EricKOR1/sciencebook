<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-uchem-2-q-eudiometer-levels d-uchem-2-q-eudiometer-levels">
  <title id="t-uchem-2-q-eudiometer-levels">그림 일반화학 2-12 문제 16 (나) 관 안팎의 수면과 기체 압력</title>
  <desc id="d-uchem-2-q-eudiometer-levels">(가) 관 안팎의 수면이 같으면 모은 기체(수소 + 수증기)의 압력은 대기압과 같다. (나) 관 안쪽 수면이 바깥보다 h만큼 높으면 기체 압력은 대기압보다 물기둥 h의 압력만큼 작고, 같은 양의 기체가 더 큰 부피를 차지한다(모식도).</desc>
  <style>.uchem-2-q-eudiometer-levels-t{font-size:14px;fill:var(--fig-ink)} .uchem-2-q-eudiometer-levels-s{font-size:13px;fill:var(--fig-muted)} .uchem-2-q-eudiometer-levels-b{font-size:15px;font-weight:700;fill:var(--fig-ink)} .uchem-2-q-eudiometer-levels-p{font-size:13px;fill:var(--fig-ink)} .uchem-2-q-eudiometer-levels-r{font-size:14px;fill:var(--fig-red)} .uchem-2-q-eudiometer-levels-bl{font-size:14px;fill:var(--fig-blue)} .uchem-2-q-eudiometer-levels-g{font-size:14px;fill:var(--fig-green)}</style>
  <text x="180" y="26" text-anchor="middle" class="uchem-2-q-eudiometer-levels-b">(가) 안팎 수면이 같다</text>
  <rect x="40" y="200" width="280" height="90" rx="0" style="fill:var(--fig-soft-blue);stroke:none;stroke-width:1.5"/>
  <line x1="40" y1="200" x2="320" y2="200" style="stroke:var(--fig-blue);stroke-width:1.3"/>
  <path d="M40 150 L40 290 L320 290 L320 150" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/>
  <rect x="148" y="200" width="64" height="60" rx="0" style="fill:var(--fig-soft-blue);stroke:none;stroke-width:1.5"/>
  <rect x="148" y="60" width="64" height="140" rx="0" style="fill:var(--fig-soft-amber);stroke:none;stroke-width:1.5"/>
  <line x1="148" y1="200" x2="212" y2="200" style="stroke:var(--fig-blue);stroke-width:1.3"/>
  <path d="M148 260 L148 70 Q148 60 158 60 L202 60 Q212 60 212 70 L212 260" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/>
  <text x="180" y="90" text-anchor="middle" class="uchem-2-q-eudiometer-levels-t">H₂</text>
  <text x="180" y="108" text-anchor="middle" class="uchem-2-q-eudiometer-levels-s">+ H₂O(g)</text>
  <text x="540" y="26" text-anchor="middle" class="uchem-2-q-eudiometer-levels-b">(나) 안쪽 수면이 h만큼 높다</text>
  <rect x="400" y="200" width="280" height="90" rx="0" style="fill:var(--fig-soft-blue);stroke:none;stroke-width:1.5"/>
  <line x1="400" y1="200" x2="680" y2="200" style="stroke:var(--fig-blue);stroke-width:1.3"/>
  <path d="M400 150 L400 290 L680 290 L680 150" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/>
  <rect x="508" y="172" width="64" height="88" rx="0" style="fill:var(--fig-soft-blue);stroke:none;stroke-width:1.5"/>
  <rect x="508" y="40" width="64" height="132" rx="0" style="fill:var(--fig-soft-amber);stroke:none;stroke-width:1.5"/>
  <line x1="508" y1="172" x2="572" y2="172" style="stroke:var(--fig-blue);stroke-width:1.3"/>
  <path d="M508 260 L508 50 Q508 40 518 40 L562 40 Q572 40 572 50 L572 260" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/>
  <text x="540" y="70" text-anchor="middle" class="uchem-2-q-eudiometer-levels-t">H₂</text>
  <text x="540" y="88" text-anchor="middle" class="uchem-2-q-eudiometer-levels-s">+ H₂O(g)</text>
  <line x1="124" y1="188" x2="140.9" y2="195.7" style="stroke:var(--fig-muted);stroke-width:1.2"/>
  <polygon points="146,198 138.3,198 140.9,192.2" style="fill:var(--fig-muted);stroke:none;stroke-width:1"/>
  <text x="120" y="186" text-anchor="end" class="uchem-2-q-eudiometer-levels-s">수면 높이 같음</text>
  <text x="180" y="312" text-anchor="middle" class="uchem-2-q-eudiometer-levels-t">P(기체) = P(대기)</text>
  <line x1="522" y1="172" x2="590" y2="172" style="stroke:var(--fig-red);stroke-width:1.2;stroke-dasharray:4 3"/>
  <line x1="572" y1="200" x2="590" y2="200" style="stroke:var(--fig-red);stroke-width:1.2;stroke-dasharray:4 3"/>
  <line x1="582" y1="180.6" x2="582" y2="191.4" style="stroke:var(--fig-red);stroke-width:1.5"/>
  <polygon points="582,197 578.9,190 585.1,190" style="fill:var(--fig-red);stroke:none;stroke-width:1"/>
  <polygon points="582,175 585.1,182 578.9,182" style="fill:var(--fig-red);stroke:none;stroke-width:1"/>
  <text x="596" y="191" class="uchem-2-q-eudiometer-levels-r">h</text>
  <text x="540" y="312" text-anchor="middle" class="uchem-2-q-eudiometer-levels-t">P(기체) = P(대기) − (물기둥 h의 압력)</text>
</svg>
