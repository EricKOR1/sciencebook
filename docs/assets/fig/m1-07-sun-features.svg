<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-m1-07-sun-features d-m1-07-sun-features">
  <title id="t-m1-07-sun-features">그림 중1-7-5 태양의 표면과 대기</title>
  <desc id="d-m1-07-sun-features">태양의 밝은 표면인 광구에는 쌀알 무늬와 어두운 흑점이 보인다. 광구 바로 바깥에 얇은 채층이, 그 바깥에 넓게 퍼진 코로나가 있고, 가장자리에서 홍염이 솟아오르며 흑점 부근에서 플레어가 일어난다. 크기는 과장한 모식도이다.</desc>
