<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-m3-06-pedigree-challenge d-m3-06-pedigree-challenge">
  <title id="t-m3-06-pedigree-challenge">그림 중3-6-7 어느 가상 가계의 가계도</title>
  <desc id="d-m3-06-pedigree-challenge">1세대 정상 남자 1과 정상 여자 2 사이에서 형질이 나타난 딸 3, 정상 아들 4가 태어났다. 아들 4는 형질이 나타난 여자 5와 결혼하여 정상 아들 6과 형질이 나타난 딸 7을 낳았다. 네모는 남자, 동그라미는 여자, 색칠한 기호는 형질이 나타난 사람이다.</desc>
  <style>
    .m3-06-pedigree-challenge-lbl{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .m3-06-pedigree-challenge-tx{font-size:14px;fill:var(--fig-ink)}
    .m3-06-pedigree-challenge-sm{font-size:13px;fill:var(--fig-muted)}
    .m3-06-pedigree-challenge-ln{fill:none;stroke:var(--fig-ink);stroke-width:2}
    .m3-06-pedigree-challenge-off{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2}
    .m3-06-pedigree-challenge-on{fill:var(--fig-violet);stroke:var(--fig-ink);stroke-width:2}
  </style>
