  <circle cx="551" cy="121" r="11" class="m3-06-pedigree-challenge-off"/>
  <text x="572.0" y="126.0" class="m3-06-pedigree-challenge-sm">정상 여자</text>
  <rect x="540" y="148" width="22" height="22" class="m3-06-pedigree-challenge-on"/>
  <text x="572.0" y="165.0" class="m3-06-pedigree-challenge-sm">형질 있는 남자</text>
  <circle cx="551" cy="199" r="11" class="m3-06-pedigree-challenge-on"/>
