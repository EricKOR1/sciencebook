  <rect x="205.0" y="45.0" width="30" height="30" class="m3-06-pedigree-challenge-off"/>
  <text x="220.0" y="95.0" text-anchor="middle" class="m3-06-pedigree-challenge-tx">1</text>
  <circle cx="300.0" cy="60.0" r="15.0" class="m3-06-pedigree-challenge-off"/>
  <text x="300.0" y="95.0" text-anchor="middle" class="m3-06-pedigree-challenge-tx">2</text>
  <line x1="260.0" y1="60.0" x2="260.0" y2="110.0" class="m3-06-pedigree-challenge-ln"/>
  <line x1="200.0" y1="110.0" x2="340.0" y2="110.0" class="m3-06-pedigree-challenge-ln"/>
  <line x1="200.0" y1="110.0" x2="200.0" y2="145.0" class="m3-06-pedigree-challenge-ln"/>
  <line x1="340.0" y1="110.0" x2="340.0" y2="145.0" class="m3-06-pedigree-challenge-ln"/>
  <circle cx="200.0" cy="160.0" r="15.0" class="m3-06-pedigree-challenge-on"/>
  <text x="200.0" y="195.0" text-anchor="middle" class="m3-06-pedigree-challenge-tx">3</text>
  <rect x="325.0" y="145.0" width="30" height="30" class="m3-06-pedigree-challenge-off"/>
  <text x="340.0" y="195.0" text-anchor="middle" class="m3-06-pedigree-challenge-tx">4</text>
  <line x1="355.0" y1="160.0" x2="425.0" y2="160.0" class="m3-06-pedigree-challenge-ln"/>
  <circle cx="440.0" cy="160.0" r="15.0" class="m3-06-pedigree-challenge-on"/>
  <text x="440.0" y="195.0" text-anchor="middle" class="m3-06-pedigree-challenge-tx">5</text>
  <line x1="390.0" y1="160.0" x2="390.0" y2="210.0" class="m3-06-pedigree-challenge-ln"/>
  <line x1="350.0" y1="210.0" x2="430.0" y2="210.0" class="m3-06-pedigree-challenge-ln"/>
  <line x1="350.0" y1="210.0" x2="350.0" y2="245.0" class="m3-06-pedigree-challenge-ln"/>
  <line x1="430.0" y1="210.0" x2="430.0" y2="245.0" class="m3-06-pedigree-challenge-ln"/>
  <rect x="335.0" y="245.0" width="30" height="30" class="m3-06-pedigree-challenge-off"/>
  <text x="350.0" y="295.0" text-anchor="middle" class="m3-06-pedigree-challenge-tx">6</text>
  <circle cx="430.0" cy="260.0" r="15.0" class="m3-06-pedigree-challenge-on"/>
  <text x="430.0" y="295.0" text-anchor="middle" class="m3-06-pedigree-challenge-tx">7</text>
  <text x="110.0" y="65.0" text-anchor="middle" class="m3-06-pedigree-challenge-lbl">Ⅰ</text>
  <text x="110.0" y="165.0" text-anchor="middle" class="m3-06-pedigree-challenge-lbl">Ⅱ</text>
  <text x="110.0" y="265.0" text-anchor="middle" class="m3-06-pedigree-challenge-lbl">Ⅲ</text>
