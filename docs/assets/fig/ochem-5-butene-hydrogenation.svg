<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-ochem-5-butene-hydrogenation d-ochem-5-butene-hydrogenation">
  <title id="t-ochem-5-butene-hydrogenation">그림 유기화학 5-2 뷰텐 이성질체의 수소화 열과 상대 엔탈피</title>
  <desc id="d-ochem-5-butene-hydrogenation">세로축은 엔탈피(kJ/mol)이고 (E)-뷰트-2-엔 + H₂를 0으로 잡았다. 뷰트-1-엔 + H₂는 +11, (Z)-뷰트-2-엔 + H₂는 +4에 있고, 세 알켄 모두 같은 뷰테인(−116)으로 수소화되므로 아래 방향 화살표의 길이(수소화 열 −127, −120, −116 kJ/mol)가 출발 알켄의 에너지 차이를 그대로 보여 준다. (Z)와 (E)의 차이 4 kJ/mol은 시스 메틸기의 입체 무리, 뷰트-1-엔과 (E)의 차이 11 kJ/mol은 치환도(초공액) 차이이다.</desc>
