<line x1="540.7" y1="99.7" x2="552.7" y2="93.7" style="stroke:var(--fig-red);stroke-width:4"/>
<text x="537.7" y="101.7" text-anchor="end" class="ubio-9-vertebrate-cladogram-t" style="fill:var(--fig-red)">털·젖샘</text>
<line x1="632.0" y1="92.4" x2="644.0" y2="86.4" style="stroke:var(--fig-red);stroke-width:4"/>
<text x="647.0" y="94.4" text-anchor="start" class="ubio-9-vertebrate-cladogram-t" style="fill:var(--fig-red)">깃털</text>
<text x="20.0" y="418.0" text-anchor="start" class="ubio-9-vertebrate-cladogram-s">빨간 표시: 그 줄기·가지에서 새로 생긴 형질(공유 파생 형질). 가지 길이는 시간을 뜻하지 않는다.</text>
<text x="20.0" y="438.0" text-anchor="start" class="ubio-9-vertebrate-cladogram-s">먹장어도 척추뼈 흔적이 있어, 먹장어·칠성장어를 한 무리(원구류)로 보는 견해가 널리 받아들여진다.</text>
</svg>
