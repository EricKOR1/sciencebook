<text x="52.0" y="54.0" text-anchor="middle" class="ubio-9-vertebrate-cladogram-b">창고기</text>
<text x="52.0" y="70.0" text-anchor="middle" class="ubio-9-vertebrate-cladogram-s">(두삭류)</text>
<text x="120.0" y="68.0" text-anchor="middle" class="ubio-9-vertebrate-cladogram-b">먹장어</text>
<text x="188.0" y="68.0" text-anchor="middle" class="ubio-9-vertebrate-cladogram-b">칠성장어</text>
<text x="256.0" y="54.0" text-anchor="middle" class="ubio-9-vertebrate-cladogram-b">상어</text>
<text x="256.0" y="70.0" text-anchor="middle" class="ubio-9-vertebrate-cladogram-s">(연골어류)</text>
<text x="324.0" y="54.0" text-anchor="middle" class="ubio-9-vertebrate-cladogram-b">다랑어</text>
<text x="324.0" y="70.0" text-anchor="middle" class="ubio-9-vertebrate-cladogram-s">(조기어류)</text>
<text x="392.0" y="54.0" text-anchor="middle" class="ubio-9-vertebrate-cladogram-b">폐어</text>
<text x="392.0" y="70.0" text-anchor="middle" class="ubio-9-vertebrate-cladogram-s">(육기어류)</text>
<text x="460.0" y="54.0" text-anchor="middle" class="ubio-9-vertebrate-cladogram-b">개구리</text>
<text x="460.0" y="70.0" text-anchor="middle" class="ubio-9-vertebrate-cladogram-s">(양서류)</text>
<text x="528.0" y="54.0" text-anchor="middle" class="ubio-9-vertebrate-cladogram-b">사람</text>
<text x="528.0" y="70.0" text-anchor="middle" class="ubio-9-vertebrate-cladogram-s">(포유류)</text>
<text x="596.0" y="54.0" text-anchor="middle" class="ubio-9-vertebrate-cladogram-b">도마뱀</text>
<text x="596.0" y="70.0" text-anchor="middle" class="ubio-9-vertebrate-cladogram-s">(파충류)</text>
<text x="664.0" y="54.0" text-anchor="middle" class="ubio-9-vertebrate-cladogram-b">새</text>
<text x="664.0" y="70.0" text-anchor="middle" class="ubio-9-vertebrate-cladogram-s">(조류)</text>
