<text x="414.4" y="212.4" text-anchor="start" class="ubio-9-vertebrate-cladogram-t" style="fill:var(--fig-red)">경골, 허파 또는 부레</text>
<line x1="494.8" y1="143.8" x2="502.8" y2="157.8" style="stroke:var(--fig-red);stroke-width:4"/>
