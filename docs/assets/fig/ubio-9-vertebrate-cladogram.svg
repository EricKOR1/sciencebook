<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="t-ubio-9-vertebrate-cladogram d-ubio-9-vertebrate-cladogram">
<title id="t-ubio-9-vertebrate-cladogram">그림 일반생명과학 9-9 척삭동물·척추동물의 분기도와 주요 혁신</title>
<desc id="d-ubio-9-vertebrate-cladogram">왼쪽 아래 뿌리에서 오른쪽 위로 이어지는 줄기에서 차례로 창고기, 먹장어, 칠성장어, 상어, 다랑어, 폐어, 개구리가 갈라지고 마지막에 사람과 도마뱀·새가 갈라진다. 줄기 위의 표시는 그 위쪽 모든 무리가 공유하는 새 형질(머리뼈, 척추, 턱, 경골과 허파·부레, 네 다리, 양막란)이고, 털·젖샘과 깃털은 각각 포유류와 조류의 가지에 생겼다.</desc>
<style>
.ubio-9-vertebrate-cladogram-h{font-size:14px;font-weight:700;fill:var(--fig-ink)} .ubio-9-vertebrate-cladogram-t{font-size:13px;fill:var(--fig-ink)} .ubio-9-vertebrate-cladogram-s{font-size:13px;fill:var(--fig-muted)} .ubio-9-vertebrate-cladogram-b{font-size:13px;font-weight:700;fill:var(--fig-ink)}
</style>
