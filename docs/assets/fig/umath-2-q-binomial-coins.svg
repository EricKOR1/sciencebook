  <title id="t-umath-2-q-binomial-coins">그림 수학 도구 2-19 문제 17 해설: N = 100 동전 던지기의 이항 분포와 가우스 근사</title>
  <desc id="d-umath-2-q-binomial-coins">막대: 앞면이 n개 나올 정확한 확률 P(n)(n = 30 ~ 70, 정점 n = 50에서 0.0796). 빨간 곡선: 스털링 근사로 얻은 √(2/(πN)) exp(−2(n − 50)²/N). 두 값은 0.3 % 이내로 겹친다. 세로 점선은 평균에서 표준 편차 σ = √N/2 = 5만큼 떨어진 n = 45, 55이다.</desc>
