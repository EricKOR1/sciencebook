<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" class="fig-small" role="img" aria-labelledby="t-uearth-9-q-carbon-flows d-uearth-9-q-carbon-flows">
  <title id="t-uearth-9-q-carbon-flows">그림 일반지구과학 9-9 문제 7의 한 해 탄소 출입</title>
  <desc id="d-uearth-9-q-carbon-flows">어느 해 화석 연료(9.6 GtC)와 토지 이용 변화(1.2 GtC)로 대기에 더해진 탄소와, 해양(2.8 GtC)과 육상 생태계(3.2 GtC)가 대기에서 흡수한 탄소를 나타냈다. 물음표는 대기에 남은 양이다.</desc>
  <style>
    .uearth-9-q-carbon-flows-t{font-size:14px;fill:var(--fig-ink)}
    .uearth-9-q-carbon-flows-b{font-size:14px;font-weight:700;fill:var(--fig-ink)}
    .uearth-9-q-carbon-flows-s{font-size:13px;fill:var(--fig-muted)}
    .uearth-9-q-carbon-flows-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .uearth-9-q-carbon-flows-red{font-size:14px;font-weight:600;fill:var(--fig-red)}
    .uearth-9-q-carbon-flows-blue{font-size:14px;font-weight:600;fill:var(--fig-blue)}
    .uearth-9-q-carbon-flows-green{font-size:14px;font-weight:600;fill:var(--fig-green)}
    .uearth-9-q-carbon-flows-amber{font-size:14px;font-weight:600;fill:var(--fig-amber)}
    .uearth-9-q-carbon-flows-violet{font-size:14px;font-weight:600;fill:var(--fig-violet)}
    .uearth-9-q-carbon-flows-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.4}
    .uearth-9-q-carbon-flows-grid{fill:none;stroke:var(--fig-line);stroke-width:0.7;stroke-dasharray:3 3}
  </style>
