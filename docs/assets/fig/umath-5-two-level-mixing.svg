<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-umath-5-two-level-mixing d-umath-5-two-level-mixing">
  <title id="t-umath-5-two-level-mixing">그림 수학 도구 5-8 두 오비탈의 섞임(예제 10)</title>
  <desc id="d-umath-5-two-level-mixing">원자 A 오비탈(−10.0 eV)과 원자 B 오비탈(−14.0 eV)이 β = −2.0 eV로 섞여 반결합 오비탈(−9.17 eV)과 결합 오비탈(−14.83 eV)이 된다. 결합 오비탈의 계수 (0.383, 0.924)로 전자는 B에 85 % 있다.</desc>
