  <title id="t-pchem-6-q-ammonia-pressure">그림 물리화학 6-15 문제 18 풀이: 700 K 암모니아 평형 몰분율과 전체 압력</title>
  <desc id="d-pchem-6-q-ammonia-pressure">700 K, N₂ : H₂ = 1 : 3 공급, 이상 기체, K = 6.7×10⁻⁵일 때 평형 혼합물의 암모니아 몰분율을 전체 압력에 대해 계산한 곡선. 1 bar에서 0.0026, 100 bar에서 0.179, 300 bar에서 0.344이다. 실제 기체는 K_φ &amp;lt; 1이므로 평형 몰분율이 이 곡선보다 위에 놓인다.</desc>
