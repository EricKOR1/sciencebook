<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-ochem-9-eas-energy d-ochem-9-eas-energy">
  <title id="t-ochem-9-eas-energy">그림 유기화학 9-3 벤젠 + E⁺ 반응의 자유 에너지 도표(모식도)</title>
  <desc id="d-ochem-9-eas-energy">세로축은 자유 에너지 G(눈금 없는 상대 높이), 가로축은 반응 좌표이다. 벤젠 + E⁺에서 높은 첫 전이 상태 TS1(아레늄 이온을 닮은 늦은 전이 상태)을 넘어 아레늄 이온에 이른다. 아레늄 이온에서 양성자를 잃는 길(실선)은 낮은 TS2를 지나 반응물보다 낮은 치환 생성물로 가고, 음이온이 붙는 첨가의 길(점선)은 더 높은 장벽을 지나 반응물보다 높은 첨가 생성물에 이른다. 두 생성물의 높이 차는 방향족 안정화의 차이이다. 옅은 회색 곡선은 비교용 알켄 + E⁺의 첫 단계로, 장벽이 훨씬 낮다.</desc>
