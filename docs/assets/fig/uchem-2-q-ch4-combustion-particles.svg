  <title id="t-uchem-2-q-ch4-combustion-particles">그림 일반화학 2-9 문제 12 연소 전후의 분자 모형</title>
  <desc id="d-uchem-2-q-ch4-combustion-particles">분자 1개를 0.050 mol로 나타냈다. 반응 전 용기에는 CH₄ 2개와 O₂ 6개(기체 8개), 반응 후에는 기체 CO₂ 2개와 O₂ 2개, 액체 물 H₂O 4개가 있다. C 2개, H 8개, O 12개로 원자 수는 같고, 기체 분자 수는 절반으로 준다. 25 °C의 수증기는 양이 아주 적어 그리지 않았다.</desc>
