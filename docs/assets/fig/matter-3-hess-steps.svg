<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-matter-3-hess-steps d-matter-3-hess-steps">
  <title id="t-matter-3-hess-steps">그림 물질과 에너지 3-3 탄소가 이산화 탄소가 되는 두 경로의 엔탈피</title>
  <desc id="d-matter-3-hess-steps">흑연과 산소가 한 번에 이산화 탄소가 되는 경로(−393.5 kJ)와 일산화 탄소를 거치는 두 단계 경로(−110.5 kJ, −283.0 kJ)는 출발과 도착이 같으므로 엔탈피 변화의 합도 같다. 층의 높이 차는 실제 값에 비례하게 그렸다.</desc>
  <style>
    .hs-lv{fill:none;stroke:var(--fig-ink);stroke-width:3;stroke-linecap:round}
    .hs-a1{fill:none;stroke:var(--fig-red);stroke-width:3}
    .hs-h1{fill:var(--fig-red)}
    .hs-a2{fill:none;stroke:var(--fig-blue);stroke-width:3}
    .hs-h2{fill:var(--fig-blue)}
    .hs-sp{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .hs-l{font-size:14px;fill:var(--fig-ink)}
    .hs-t{font-size:13px;fill:var(--fig-muted)}
  </style>
  <path d="M40 30 L40 400" style="fill:none;stroke:var(--fig-muted);stroke-width:1.4"/>
  <path d="M40 22 l-5 10 l10 0 z" style="fill:var(--fig-muted)"/>
  <text x="50" y="30" class="hs-t">엔탈피 H</text>
  <!-- 층 -->
  <line x1="70" y1="80" x2="660" y2="80" class="hs-lv"/>
  <text x="660" y="68" text-anchor="end" class="hs-sp">C(s, 흑연) + O₂(g)</text>
  <line x1="380" y1="162.9" x2="660" y2="162.9" class="hs-lv"/>
  <text x="660" y="186" text-anchor="end" class="hs-sp">CO(g) + ½O₂(g)</text>
  <line x1="70" y1="375.1" x2="660" y2="375.1" class="hs-lv"/>
  <text x="660" y="400" text-anchor="end" class="hs-sp">CO₂(g)</text>
  <!-- 경로 1 -->
  <line x1="200" y1="84" x2="200" y2="361" class="hs-a1"/>
  <path d="M200 372 l-8 -14 l16 0 z" class="hs-h1"/>
  <text x="214" y="220" class="hs-l" style="font-weight:700;fill:var(--fig-red)">경로 1 (한 번에)</text>
  <text x="214" y="240" class="hs-l">ΔH = −393.5 kJ</text>
  <!-- 경로 2 -->
  <line x1="450" y1="84" x2="450" y2="149" class="hs-a2"/>
  <path d="M450 160 l-8 -14 l16 0 z" class="hs-h2"/>
  <text x="440" y="118" text-anchor="end" class="hs-l">−110.5 kJ</text>
  <line x1="540" y1="166" x2="540" y2="361" class="hs-a2"/>
  <path d="M540 372 l-8 -14 l16 0 z" class="hs-h2"/>
  <text x="552" y="270" class="hs-l">−283.0 kJ</text>
  <text x="520" y="300" text-anchor="end" class="hs-l" style="font-weight:700;fill:var(--fig-blue)">경로 2 (두 단계)</text>
  <text x="520" y="320" text-anchor="end" class="hs-t">(−110.5) + (−283.0)</text>
  <text x="520" y="338" text-anchor="end" class="hs-t">= −393.5 kJ</text>
  <text x="360" y="424" text-anchor="middle" class="hs-t">출발 층과 도착 층이 같으면 어느 경로로 가도 내려온 높이(ΔH)는 같다 — 헤스 법칙</text>
</svg>
