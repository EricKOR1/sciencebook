<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-gene-3-antigen-test d-gene-3-antigen-test">
  <title id="t-gene-3-antigen-test">그림 생물의 유전 3-4 신속 항원 검사 키트의 원리</title>
  <desc id="d-gene-3-antigen-test">시료는 왼쪽에서 오른쪽으로 흐른다. 색소가 붙은 항체가 바이러스 단백질과 결합하고, 검사선(T)에 고정된 항체가 같은 단백질의 다른 부위에 결합하여 샌드위치를 만들면 T에 색 띠가 생긴다. 대조선(C)에는 색소 항체 자체에 결합하는 물질이 고정되어 있어 시료가 제대로 흐르면 항상 색 띠가 생긴다. 위는 바이러스 단백질이 없는 음성, 아래는 있는 양성이다. 모식도이다.</desc>
