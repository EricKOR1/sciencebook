<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-ochem-5-dissolving-metal d-ochem-5-dissolving-metal">
  <title id="t-ochem-5-dissolving-metal">그림 유기화학 5-18 펜트-2-아인의 Na/NH₃(l) 환원(용해 금속 환원)</title>
  <desc id="d-ochem-5-dissolving-metal">① Na·가 전자 하나를 C≡C의 π*로 준다(낚싯바늘 화살표) → 한 탄소에 홀전자, 다른 탄소에 전자쌍과 ⊖가 있는 라디칼 음이온(두 알킬기가 트랜스로 굽음) + Na⁺. ② 탄소 음이온의 전자쌍이 NH₃의 H로, N–H 결합 전자쌍이 N으로 가서(화살표 2개) 트랜스 바이닐 라디칼(홀전자가 sp² 오비탈에) + NH₂⁻. ③ 두 번째 Na·의 전자 하나로 트랜스 바이닐 음이온이 된다(두 알킬기가 멀리). ④ 음이온의 전자쌍이 NH₃의 H로 가서 (E)-펜트-2-엔 + NH₂⁻. 오른쪽 아래: H₂/린들라 촉매 표면에서는 두 H가 같은 면으로 들어가 (Z)-펜트-2-엔이 된다.</desc>
