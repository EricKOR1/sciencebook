<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-2-4-conductivity-test d-2-4-conductivity-test">
  <title id="t-2-4-conductivity-test">그림 2-4-2 간이 전기 전도성 측정기로 비교하기</title>
  <desc id="d-2-4-conductivity-test">같은 측정기의 두 전극을 염화 나트륨 고체, 염화 나트륨 수용액, 설탕 수용액에 차례로 대면 수용액 속 이온이 이동할 수 있는 염화 나트륨 수용액에서만 LED가 켜진다. 모식도(입자는 크게 확대하여 그림).</desc>
  <style>
    .ct-lbl{font-size:15px;font-weight:600;fill:var(--fig-ink)} .ct-sm{font-size:13px;fill:var(--fig-muted)}
    .ct-on{font-size:13px;font-weight:600;fill:var(--fig-amber)} .ct-off{font-size:13px;font-weight:600;fill:var(--fig-muted)}
    .ct-w{stroke:var(--fig-ink);stroke-width:2;fill:none}
    .ct-bat{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.6}
    .ct-ink{fill:var(--fig-ink)} .ct-el{fill:var(--fig-muted)}
    .ct-glass{fill:none;stroke:var(--fig-ink);stroke-width:2}
    .ct-water{fill:var(--fig-soft-blue)} .ct-dish{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.6}
    .ct-xtal{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.2}
    .ct-na{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.3} .ct-cl{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.3}
    .ct-r{stroke:var(--fig-red);stroke-width:1.4} .ct-g{stroke:var(--fig-green);stroke-width:1.4}
    .ct-su{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.4}
    .ct-ledoff{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.6} .ct-ledon{fill:var(--fig-amber);stroke:var(--fig-amber);stroke-width:1.6}
    .ct-ray{stroke:var(--fig-amber);stroke-width:2}
    .ct-ok{fill:var(--fig-green)} .ct-no{fill:var(--fig-red)}
