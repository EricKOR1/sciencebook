<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-gene-1-genome-packing d-gene-1-genome-packing">
  <title id="t-gene-1-genome-packing">그림 생물의 유전 1-8 원핵세포와 진핵세포의 유전체 구성</title>
  <desc id="d-gene-1-genome-packing">왼쪽 원핵세포(대장균)는 핵막이 없고, 원형 DNA 1개가 세포질의 핵양체 부위에 고리 모양으로 꼬여 응축되어 있으며 작은 원형 DNA인 플라스미드가 따로 있다. 오른쪽 진핵세포의 선형 DNA는 히스톤 단백질에 감겨 뉴클레오솜을 이루고, 이것이 더 감기고 접혀 염색질과 염색체가 된다. 선형 염색체의 끝에는 반복 서열인 텔로미어가 있다. 크기 비율은 실제와 다른 모식도이다.</desc>
