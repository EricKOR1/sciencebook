<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="t-ubio-4-cycle-control d-ubio-4-cycle-control">
  <title id="t-ubio-4-cycle-control">그림 일반생명과학 4-8 세포 주기의 검문 지점과 사이클린–Cdk</title>
  <desc id="d-ubio-4-cycle-control">세포 주기 G1, S, G2, M기를 고리로 나타내고, 각 시기에 작동하는 사이클린–Cdk 복합체(D–Cdk4/6, E–Cdk2, A–Cdk2, B–Cdk1)와 세 검문 지점(G1, G2, M)을 표시했다. 오른쪽은 Cdk가 늘 있지만 사이클린이 붙어야 켜지고, APC/C가 사이클린을 분해하면 꺼지는 원리이다.</desc>
  <style>.ubio-4-cycle-control-t{font-size:14px;fill:var(--fig-ink)} .ubio-4-cycle-control-s{font-size:13px;fill:var(--fig-muted)} .ubio-4-cycle-control-b{font-size:14px;fill:var(--fig-ink);font-weight:600} .ubio-4-cycle-control-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-4-cycle-control-m{font-size:13px;fill:var(--fig-ink)}</style>
  <defs><marker id="ubio-4-cycle-control-ar0" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-muted)"/></marker><marker id="ubio-4-cycle-control-ar1" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-ink)"/></marker><marker id="ubio-4-cycle-control-ar2" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-red)"/></marker></defs>
  <path d="M197.5 80.0 A148 148 0 0 1 271.3 355.4 L242.8 307.2 A92 92 0 0 0 197.0 136.0 Z" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="311.9" y="201.9" text-anchor="middle" class="ubio-4-cycle-control-b">G₁기</text>
  <path d="M268.7 356.9 A148 148 0 0 1 53.5 267.8 L107.4 252.7 A92 92 0 0 0 241.2 308.2 Z" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.8"/>
  <text x="150.1" y="343.9" text-anchor="middle" class="ubio-4-cycle-control-b">S기</text>
  <path d="M52.6 264.8 A148 148 0 0 1 99.7 115.6 L136.1 158.1 A92 92 0 0 0 106.9 250.9 Z" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.8"/>
  <text x="81.6" y="196.9" text-anchor="middle" class="ubio-4-cycle-control-b">G₂기</text>
  <path d="M102.1 113.6 A148 148 0 0 1 194.5 80.0 L195.0 136.0 A92 92 0 0 0 137.6 156.9 Z" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
  <text x="155.0" y="120.2" text-anchor="middle" class="ubio-4-cycle-control-b">M기</text>
  <text x="196.0" y="222.0" text-anchor="middle" class="ubio-4-cycle-control-b">세포 주기</text>
  <text x="196.0" y="242.0" text-anchor="middle" class="ubio-4-cycle-control-s">(배양 세포 약 24시간)</text>
  <path d="M218.5 67.6 A162 162 0 0 1 310.6 113.4" style="fill:none;stroke:var(--fig-muted);stroke-width:1.6" marker-end="url(#ubio-4-cycle-control-ar0)"/>
  <text x="316.6" y="99.4" text-anchor="start" class="ubio-4-cycle-control-s">진행 방향</text>
  <line x1="238.0" y1="300.7" x2="275.0" y2="364.8" style="fill:none;stroke:var(--fig-red);stroke-width:5"/>
  <text x="285.0" y="391.2" text-anchor="start" class="ubio-4-cycle-control-b" style="fill:var(--fig-red)">G₁ 검문 지점(제한점)</text>
  <line x1="142.0" y1="163.7" x2="94.4" y2="107.0" style="fill:none;stroke:var(--fig-red);stroke-width:5"/>
  <text x="76.7" y="97.8" text-anchor="end" class="ubio-4-cycle-control-b" style="fill:var(--fig-red)">G₂ 검문 지점</text>
  <line x1="185.8" y1="144.6" x2="176.7" y2="71.2" style="fill:none;stroke:var(--fig-red);stroke-width:5"/>
  <text x="175.3" y="49.3" text-anchor="middle" class="ubio-4-cycle-control-b" style="fill:var(--fig-red)">M 검문 지점</text>
  <text x="254.3" y="201.0" text-anchor="middle" class="ubio-4-cycle-control-s" style="fill:var(--fig-violet)">D–Cdk4/6</text>
  <text x="238.4" y="282.6" text-anchor="middle" class="ubio-4-cycle-control-s" style="fill:var(--fig-violet)">E–Cdk2</text>
  <text x="168.1" y="291.8" text-anchor="middle" class="ubio-4-cycle-control-s" style="fill:var(--fig-violet)">A–Cdk2</text>
  <text x="138.8" y="199.0" text-anchor="middle" class="ubio-4-cycle-control-s" style="fill:var(--fig-violet)">B–Cdk1</text>
  <line x1="333.2" y1="283.4" x2="367.2" y2="301.4" style="fill:none;stroke:var(--fig-muted);stroke-width:1.6" marker-end="url(#ubio-4-cycle-control-ar0)"/>
  <text x="371.2" y="307.4" text-anchor="start" class="ubio-4-cycle-control-s">G₀기(분열 정지)</text>
  <text x="560.0" y="64.0" text-anchor="middle" class="ubio-4-cycle-control-h">사이클린–Cdk 스위치</text>
  <rect x="430.0" y="92.0" width="50.0" height="36.0" rx="4" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.8"/>
  <text x="455.0" y="115.0" text-anchor="middle" class="ubio-4-cycle-control-m">Cdk</text>
  <text x="496.0" y="116.0" text-anchor="middle" class="ubio-4-cycle-control-b">+</text>
  <ellipse cx="544.0" cy="110.0" rx="36" ry="18" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.8"/>
  <text x="544.0" y="115.0" text-anchor="middle" class="ubio-4-cycle-control-s" style="fill:var(--fig-ink)">사이클린</text>
  <line x1="584.0" y1="110.0" x2="610.0" y2="110.0" style="fill:none;stroke:var(--fig-ink);stroke-width:1.6" marker-end="url(#ubio-4-cycle-control-ar1)"/>
  <rect x="616.0" y="92.0" width="44.0" height="36.0" rx="4" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.8"/>
  <ellipse cx="674.0" cy="110.0" rx="18" ry="16" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.8"/>
  <text x="430.0" y="160.0" text-anchor="start" class="ubio-4-cycle-control-s">• Cdk: 주기 내내 일정, 혼자서는 꺼짐</text>
  <text x="430.0" y="180.0" text-anchor="start" class="ubio-4-cycle-control-s">• 사이클린: 시기마다 합성되었다가 분해</text>
  <text x="430.0" y="200.0" text-anchor="start" class="ubio-4-cycle-control-s" style="fill:var(--fig-green)">• 결합하면 활성 → 표적 단백질 인산화</text>
  <text x="430.0" y="220.0" text-anchor="start" class="ubio-4-cycle-control-s" style="fill:var(--fig-green)">   → 다음 시기로 넘어감</text>
  <rect x="430.0" y="248.0" width="86.0" height="36.0" rx="8" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
  <text x="473.0" y="271.0" text-anchor="middle" class="ubio-4-cycle-control-b">APC/C</text>
  <line x1="518.0" y1="266.0" x2="546.0" y2="266.0" style="fill:none;stroke:var(--fig-red);stroke-width:1.6" marker-end="url(#ubio-4-cycle-control-ar2)"/>
  <text x="552.0" y="262.0" text-anchor="start" class="ubio-4-cycle-control-m">사이클린에 분해 표지</text>
  <text x="552.0" y="280.0" text-anchor="start" class="ubio-4-cycle-control-s" style="fill:var(--fig-red)">→ 분해 → Cdk 꺼짐</text>
  <text x="430.0" y="352.0" text-anchor="start" class="ubio-4-cycle-control-s">분해는 되돌릴 수 없으므로</text>
  <text x="430.0" y="370.0" text-anchor="start" class="ubio-4-cycle-control-s">주기는 한 방향으로만 진행한다.</text>
  <text x="360.0" y="448.0" text-anchor="middle" class="ubio-4-cycle-control-s">시기 길이와 복합체의 위치는 모식적으로 나타냈다.</text>
</svg>
