  <text x="336.2" y="290" text-anchor="middle" class="uchem-8-vant-hoff-s">온도 상승</text>
  <rect x="578" y="60" width="132" height="110" rx="8" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1"/>
  <text x="644" y="84" text-anchor="middle" class="uchem-8-vant-hoff-t" style="fill:var(--fig-red);font-weight:700">발열 ΔH° &lt; 0</text>
  <text x="644" y="106" text-anchor="middle" class="uchem-8-vant-hoff-s">기울기 +</text>
  <text x="644" y="126" text-anchor="middle" class="uchem-8-vant-hoff-t">온도 ↑ → K ↓</text>
  <text x="644" y="148" text-anchor="middle" class="uchem-8-vant-hoff-s">예제 12</text>
  <rect x="578" y="190" width="132" height="110" rx="8" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1"/>
  <text x="644" y="214" text-anchor="middle" class="uchem-8-vant-hoff-t" style="fill:var(--fig-blue);font-weight:700">흡열 ΔH° &gt; 0</text>
  <text x="644" y="236" text-anchor="middle" class="uchem-8-vant-hoff-s">기울기 −</text>
  <text x="644" y="256" text-anchor="middle" class="uchem-8-vant-hoff-t">온도 ↑ → K ↑</text>
  <text x="644" y="278" text-anchor="middle" class="uchem-8-vant-hoff-s">(가정한 예)</text>
  <text x="360" y="394" text-anchor="middle" class="uchem-8-vant-hoff-t" style="font-weight:600">기울기 = −ΔH°/R  (ΔH°가 이 온도 범위에서 일정하다고 가정)</text>
</svg>
