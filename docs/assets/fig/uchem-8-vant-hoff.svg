  <line x1="90" y1="110" x2="560" y2="110" style="stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3"/>
  <text x="82" y="114" text-anchor="end" class="uchem-8-vant-hoff-s">5</text>
  <line x1="90" y1="40" x2="560" y2="40" style="stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3"/>
  <text x="82" y="44" text-anchor="end" class="uchem-8-vant-hoff-s">10</text>
  <text x="134.8" y="338" text-anchor="middle" class="uchem-8-vant-hoff-s">2.50</text>
  <line x1="134.8" y1="320" x2="134.8" y2="325" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="246.7" y="338" text-anchor="middle" class="uchem-8-vant-hoff-s">2.75</text>
  <line x1="246.7" y1="320" x2="246.7" y2="325" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="358.6" y="338" text-anchor="middle" class="uchem-8-vant-hoff-s">3.00</text>
  <line x1="358.6" y1="320" x2="358.6" y2="325" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="470.5" y="338" text-anchor="middle" class="uchem-8-vant-hoff-s">3.25</text>
  <line x1="470.5" y1="320" x2="470.5" y2="325" style="stroke:var(--fig-ink);stroke-width:1"/>
  <path d="M90 36 L90 320 L560 320" class="uchem-8-vant-hoff-ax"/>
  <text x="325" y="360" text-anchor="middle" class="uchem-8-vant-hoff-t">1/T (10⁻³ K⁻¹)</text>
  <text x="36" y="180.0" text-anchor="middle" class="uchem-8-vant-hoff-t" transform="rotate(-90 36 180.0)">ln K</text>
  <line x1="507.8" y1="34" x2="507.8" y2="40" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="507.8" y="30" text-anchor="middle" class="uchem-8-vant-hoff-s">300 K</text>
  <line x1="294.6" y1="34" x2="294.6" y2="40" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="294.6" y="30" text-anchor="middle" class="uchem-8-vant-hoff-s">350 K</text>
  <line x1="134.8" y1="34" x2="134.8" y2="40" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="134.8" y="30" text-anchor="middle" class="uchem-8-vant-hoff-s">400 K</text>
