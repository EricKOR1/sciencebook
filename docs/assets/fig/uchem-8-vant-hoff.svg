<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" role="img" aria-labelledby="t-uchem-8-vant-hoff d-uchem-8-vant-hoff">
  <title id="t-uchem-8-vant-hoff">그림 일반화학 8-7 온도에 따른 K — 판트호프 그래프</title>
  <desc id="d-uchem-8-vant-hoff">ln K를 1/T에 대해 그리면 기울기가 −ΔH°/R인 직선이 된다. 발열 반응(ΔH° = −50.0 kJ/mol, 예제 12)은 오른쪽 위로 올라가 온도를 올리면(왼쪽으로 가면) K가 작아지고, 흡열 반응(ΔH° = +50.0 kJ/mol로 가정)은 반대로 K가 커진다.</desc>
  <style>.uchem-8-vant-hoff-t{font-size:14px;fill:var(--fig-ink)} .uchem-8-vant-hoff-s{font-size:13px;fill:var(--fig-muted)} .uchem-8-vant-hoff-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .uchem-8-vant-hoff-ax{stroke:var(--fig-ink);stroke-width:1.3;fill:none} .uchem-8-vant-hoff-grid{stroke:var(--fig-line);stroke-width:0.7;stroke-dasharray:3 3;fill:none} </style>
  <line x1="90" y1="320" x2="560" y2="320" style="stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3"/>
