  <text x="499.8" y="73.3" text-anchor="end" class="uchem-8-vant-hoff-s" style="fill:var(--fig-ink)">K = 1.0×10³</text>
  <text x="142.8" y="173.5" text-anchor="start" class="uchem-8-vant-hoff-s" style="fill:var(--fig-ink)">K = 6.7 (400 K)</text>
