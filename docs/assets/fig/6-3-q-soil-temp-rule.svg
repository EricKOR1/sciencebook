  <title id="t-6-3-q-soil-temp-rule">그림 6-3-6 문제 10 해설 — 입력을 하나 더하면 달라지는 경계</title>
  <desc id="d-6-3-q-soil-temp-rule">점선은 토양 수분만 보는 경계(30%)로, 기온 30 °C에서 수분 32%와 38%인 두 자료(동그라미 표시)를 잘못 나눈다. 실선은 기온 25 °C 이상에서는 40%, 25 °C 미만에서는 30%를 경계로 삼은 규칙으로, 실선 왼쪽(색칠한 쪽)이 물을 주는 영역이며 8개 자료를 모두 바르게 나눈다.</desc>
