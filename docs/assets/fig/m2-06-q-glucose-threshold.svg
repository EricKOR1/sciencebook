  <title id="t-m2-06-q-glucose-threshold">그림 중2-6-13 문제 17 해설의 포도당 여과·재흡수 그래프</title>
  <desc id="d-m2-06-q-glucose-threshold">원뇨가 1분에 100 mL일 때 혈장의 포도당 농도에 따라 1분 동안 여과되는 양(농도 × 100 mL), 재흡수되는 양(최대 300 mg), 오줌으로 나가는 양을 나타냈다. 농도가 3 mg/mL을 넘으면 재흡수가 한계에 이르러 포도당이 오줌으로 나오기 시작하고, 4 mg/mL에서는 100 mg이 나간다.</desc>
