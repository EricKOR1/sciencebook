<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" role="img" aria-labelledby="t-ubio-2-sglt d-ubio-2-sglt">
  <title id="t-ubio-2-sglt">그림 일반생명과학 2-9 소장 상피세포의 공동 수송 배치</title>
  <desc id="d-ubio-2-sglt">소장 상피세포의 윗면(장 안쪽)에는 Na⁺ 2개와 포도당 1개를 함께 들이는 공동 수송체가, 아랫면(혈관 쪽)에는 포도당 운반체(촉진 확산)와 ATP를 쓰는 Na⁺–K⁺ 펌프(Na⁺ 3개를 밖으로, K⁺ 2개를 안으로)가 있다. 밀착 연접이 두 면의 단백질이 섞이지 않게 막고, 흡수된 용질을 따라 물이 삼투로 이동한다. 모식도이다.</desc>
