<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-umath-4-thermometer-lag d-umath-4-thermometer-lag">
  <title id="t-umath-4-thermometer-lag">그림 수학 도구 4-4 일정 속도로 가열할 때 온도계의 지연</title>
  <desc id="d-umath-4-thermometer-lag">항온조 온도 T조 = 25 + βt(β = 2.0 K/min, 점선)와 시간 상수 τ = 20 s인 온도계의 눈금 T(t) = 25 + β(t − τ) + βτe^(−t/τ)(실선). 처음 약 60 s(3τ)의 과도 구간이 지나면 온도계는 늘 βτ = 0.67 K 아래에서 평행하게 따라간다.</desc>
