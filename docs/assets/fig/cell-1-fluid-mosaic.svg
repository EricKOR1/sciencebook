<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="t-cell-1-fluid-mosaic d-cell-1-fluid-mosaic">
<title id="t-cell-1-fluid-mosaic">그림 세포와 물질대사 1-3 세포막의 유동 모자이크 모형</title>
<desc id="d-cell-1-fluid-mosaic">인지질 이중층의 친수성 머리는 바깥(세포 밖과 세포질)을, 소수성 꼬리는 안쪽을 향한다. 막을 관통하는 단백질과 표면에 붙은 단백질이 모자이크처럼 박혀 있고, 동물세포막의 콜레스테롤은 유동성을 조절한다. 세포 바깥 면에는 당단백질·당지질의 당 사슬이 있으며, 인지질과 단백질은 막의 평면 안에서 옆으로 움직인다. 모식도(크기 비율은 실제와 다름).</desc>
<style>
.c1fm-bg{fill:var(--fig-soft-blue);opacity:0.5}
.c1fm-head{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5}
.c1fm-tail{fill:none;stroke:var(--fig-muted);stroke-width:1.5}
.c1fm-pro{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2}
.c1fm-per{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2}
.c1fm-cho{fill:var(--fig-amber)}
.c1fm-sug{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.5}
.c1fm-lnk{fill:none;stroke:var(--fig-teal);stroke-width:1.5}
.c1fm-lead{fill:none;stroke:var(--fig-muted);stroke-width:1}
.c1fm-arr{fill:none;stroke:var(--fig-ink);stroke-width:2} .c1fm-ah{fill:var(--fig-ink)}
.c1fm-reg{font-size:14px;font-weight:700;fill:var(--fig-blue)}
.c1fm-lbl{font-size:13px;fill:var(--fig-ink)} .c1fm-sm{font-size:12px;fill:var(--fig-muted)}
</style>
