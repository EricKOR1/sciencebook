  <title id="t-ubio-2-q-ion-membrane">그림 일반생명과학 2-13 문제 15 세포막 안팎의 K⁺ 분포와 막전위 측정</title>
  <desc id="d-ubio-2-q-ion-membrane">세포막 바깥의 K⁺ 농도는 5 mM, 안은 140 mM이다(입자 수는 모식적). 전압계는 바깥을 기준으로 한 안쪽의 전위(막전위)를 잰다. 온도는 37 °C이다.</desc>
