<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-emq-3-absorption-spectrum d-emq-3-absorption-spectrum">
  <title id="t-emq-3-absorption-spectrum">그림 전자기와 양자 3-6 별빛의 흡수 스펙트럼으로 원소 찾기</title>
  <desc id="d-emq-3-absorption-spectrum">별의 광구는 연속 스펙트럼의 빛을 내고, 그 빛이 바깥의 상대적으로 차가운 대기를 지나며 원자마다 정해진 파장만 흡수되어 검은 흡수선이 생긴다. 수소 흡수선(656, 486, 434, 410 nm)은 수소 기체의 방출선과 같은 자리에 나타나고, 나트륨(589.0, 589.6 nm)과 칼슘 이온(393, 397 nm)의 선도 보인다. 무지개색은 실제 색을 흉내 낸 것이다.</desc>
  <defs><linearGradient id="emq-3-absorption-spectrum-rb" x1="0" x2="1" y1="0" y2="0"><stop offset="0.000" stop-color="#4a0070"/><stop offset="0.094" stop-color="#7300d6"/><stop offset="0.188" stop-color="#2a1cff"/><stop offset="0.281" stop-color="#0094ff"/><stop offset="0.344" stop-color="#00e5ff"/><stop offset="0.406" stop-color="#00ff5a"/><stop offset="0.531" stop-color="#9cff00"/><stop offset="0.609" stop-color="#ffff00"/><stop offset="0.688" stop-color="#ffb000"/><stop offset="0.766" stop-color="#ff5a00"/><stop offset="0.844" stop-color="#ff1500"/><stop offset="1.000" stop-color="#9a0000"/></linearGradient></defs>
  <circle cx="86.0" cy="84.0" r="64.0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.4;stroke-dasharray:4 3"/>
  <circle cx="86.0" cy="84.0" r="46.0" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <text x="86.0" y="89.0" text-anchor="middle" style="font-size:16px;fill:var(--fig-amber);font-weight:700">①</text>
  <text x="140.0" y="40.0" text-anchor="middle" style="font-size:16px;fill:var(--fig-blue);font-weight:700">②</text>
  <line x1="156.0" y1="84.0" x2="291.2" y2="84.0" style="fill:none;stroke:var(--fig-ink);stroke-width:2.4"/>
  <path d="M300.0 84.0 L289.0 89.0 L289.0 79.0 Z" style="fill:var(--fig-ink)"/>
  <text x="228.0" y="74.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-ink)">별빛</text>
  <rect x="304.0" y="64.0" width="46.0" height="40.0" rx="6" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.6"/>
  <text x="327.0" y="89.0" text-anchor="middle" style="font-size:16px;fill:var(--fig-ink);font-weight:700">③</text>
  <text x="370.0" y="44.0" style="font-size:14px;fill:var(--fig-ink)">① 광구(약 5800 K): 연속 스펙트럼의 빛을 낸다</text>
  <text x="370.0" y="70.0" style="font-size:14px;fill:var(--fig-ink)">② 대기(상대적으로 차가움): 원자가 자기 에너지</text>
  <text x="392.0" y="90.0" style="font-size:14px;fill:var(--fig-ink)">준위 차에 꼭 맞는 파장의 빛만 흡수한다</text>
  <text x="370.0" y="116.0" style="font-size:14px;fill:var(--fig-ink)">③ 분광기: 흡수 스펙트럼(검은 선)이 보인다</text>
  <text x="150.0" y="186.0" text-anchor="end" style="font-size:13px;fill:var(--fig-ink)">연속 스펙트럼</text>
  <text x="150.0" y="246.0" text-anchor="end" style="font-size:13px;fill:var(--fig-ink)">별빛(흡수 스펙트럼)</text>
  <text x="150.0" y="306.0" text-anchor="end" style="font-size:13px;fill:var(--fig-ink)">수소 기체의 방출</text>
