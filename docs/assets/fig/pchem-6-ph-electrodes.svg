<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="t-pchem-6-ph-electrodes d-pchem-6-ph-electrodes">
  <title id="t-pchem-6-ph-electrodes">그림 물리화학 6-9 유리 전극과 기준 전극으로 pH 재기 (단면 모식도)</title>
  <desc id="d-pchem-6-ph-electrodes">시료 비커에 유리 전극(왼쪽: 얇은 유리 구 안에 0.1 M HCl과 Ag/AgCl 내부 전극)과 기준 전극(오른쪽: 포화 KCl 속 Ag/AgCl, 아래 다공성 마개로 시료와 연결되어 액간 접촉이 생기는 자리)이 잠겨 있고, 두 전극은 고임피던스 전압계(pH 미터)에 연결된다. 유리 막 안쪽의 a(H⁺)는 일정하고 바깥쪽은 시료의 값이어서, 막을 가로지르는 전위가 25 ℃에서 pH 1당 59.16 mV씩 변한다.</desc>
  <style>.pchem-6-ph-electrodes-lbl{font-size:14px;fill:var(--fig-ink)} .pchem-6-ph-electrodes-sm{font-size:13px;fill:var(--fig-muted)} .pchem-6-ph-electrodes-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .pchem-6-ph-electrodes-tk{font-size:13px;fill:var(--fig-muted)} .pchem-6-ph-electrodes-ax{font-size:14px;fill:var(--fig-ink)} .pchem-6-ph-electrodes-red{font-size:14px;fill:var(--fig-red)} .pchem-6-ph-electrodes-blue{font-size:14px;fill:var(--fig-blue)} .pchem-6-ph-electrodes-green{font-size:14px;fill:var(--fig-green)} .pchem-6-ph-electrodes-amber{font-size:14px;fill:var(--fig-amber)} .pchem-6-ph-electrodes-violet{font-size:14px;fill:var(--fig-violet)} .pchem-6-ph-electrodes-teal{font-size:14px;fill:var(--fig-teal)} .pchem-6-ph-electrodes-acc{font-size:14px;fill:var(--fig-accent)} .pchem-6-ph-electrodes-big{font-size:18px;font-weight:700;fill:var(--fig-ink)}</style>
