<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-5-1-light-photosynthesis d-5-1-light-photosynthesis">
  <title id="t-5-1-light-photosynthesis">그림 5-1-2 빛의 세기에 따른 양지 식물과 음지 식물의 광합성량</title>
  <desc id="d-5-1-light-photosynthesis">양지 식물은 호흡량이 많아 보상점이 높고, 광포화점도 높아 강한 빛에서 광합성량이 매우 많다. 음지 식물은 보상점이 낮아 약한 빛에서도 살 수 있지만 금방 포화된다. 총광합성량은 순광합성량에 호흡량을 더한 값이다(값은 상대값인 모식 그래프).</desc>
  <style>
    .lp-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.6}
    .lp-grid{fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4}
    .lp-sun{fill:none;stroke:var(--fig-red);stroke-width:3;stroke-linejoin:round}
    .lp-shade{fill:none;stroke:var(--fig-teal);stroke-width:3;stroke-linejoin:round}
    .lp-lead-sun{fill:none;stroke:var(--fig-red);stroke-width:1.2;stroke-dasharray:3 3}
    .lp-lead-shade{fill:none;stroke:var(--fig-teal);stroke-width:1.2;stroke-dasharray:3 3}
    .lp-br{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
    .lp-neg{fill:var(--fig-soft-violet)}
    .lp-lbl{font-size:14px;fill:var(--fig-ink)}
    .lp-sm{font-size:12.5px;fill:var(--fig-muted)}
    .lp-r{font-size:13px;fill:var(--fig-red)} .lp-t{font-size:13px;fill:var(--fig-teal)}
    .lp-dot-sun{fill:var(--fig-red)} .lp-dot-shade{fill:var(--fig-teal)}
    .lp-ink{fill:var(--fig-ink)}
  </style>
  <!-- 0보다 아래(CO2 방출) 영역 -->
  <rect x="90" y="272" width="450" height="58" class="lp-neg"/>
  <text x="530" y="300" text-anchor="end" class="lp-sm">0보다 아래: CO₂를 내보냄 (호흡량 &gt; 광합성량)</text>
  <!-- 축 -->
  <line x1="90" y1="40" x2="90" y2="330" class="lp-ax"/>
  <path d="M90 34 l-5 10 h10 z" class="lp-ink"/>
  <line x1="90" y1="272" x2="548" y2="272" class="lp-ax"/>
  <path d="M554 272 l-10 -5 v10 z" class="lp-ink"/>
  <text x="80" y="277" text-anchor="end" class="lp-sm">0</text>
  <text x="80" y="52" text-anchor="end" class="lp-sm">흡수</text>
  <text x="80" y="326" text-anchor="end" class="lp-sm">방출</text>
  <text transform="translate(34 160) rotate(-90)" text-anchor="middle" class="lp-lbl">CO₂ 흡수량 (순광합성량, 상대값)</text>
  <text x="540" y="262" text-anchor="end" class="lp-lbl">빛의 세기 →</text>
  <!-- 양지 식물 호흡량 수준 -->
  <line x1="90" y1="318.4" x2="552" y2="318.4" class="lp-grid"/>
  <!-- 곡선 -->
  <path class="lp-sun" d="M90.0 318.4 L99.4 312.6 L108.8 306.8 L118.1 301.0 L127.5 295.2 L136.9 289.4 L146.3 283.6 L155.6 277.8 L165.0 272.1 L174.4 266.3 L183.8 260.5 L193.1 254.7 L202.5 249.0 L211.9 243.2 L221.3 237.5 L230.6 231.7 L240.0 226.0 L249.4 220.2 L258.8 214.5 L268.1 208.8 L277.5 203.1 L286.9 197.4 L296.3 191.8 L305.6 186.1 L315.0 180.5 L324.4 175.0 L333.8 169.5 L343.1 164.0 L352.5 158.6 L361.9 153.3 L371.3 148.2 L380.6 143.2 L390.0 138.4 L399.4 134.0 L408.8 129.9 L418.1 126.4 L427.5 123.4 L436.9 121.0 L446.3 119.0 L455.6 117.6 L465.0 116.4 L474.4 115.5 L483.8 114.8 L493.1 114.2 L502.5 113.7 L511.9 113.4 L521.3 113.0 L530.6 112.8 L540.0 112.5"/>
  <path class="lp-shade" d="M90.0 283.6 L99.4 280.4 L108.8 277.2 L118.1 274.0 L127.5 270.9 L136.9 267.7 L146.3 264.5 L155.6 261.3 L165.0 258.2 L174.4 255.0 L183.8 251.9 L193.1 248.8 L202.5 245.7 L211.9 242.6 L221.3 239.6 L230.6 236.7 L240.0 234.0 L249.4 231.6 L258.8 229.7 L268.1 228.4 L277.5 227.6 L286.9 227.1 L296.3 226.8 L305.6 226.6 L315.0 226.4 L324.4 226.3 L333.8 226.2 L343.1 226.2 L352.5 226.1 L361.9 226.1 L371.3 226.0 L380.6 226.0 L390.0 226.0 L399.4 225.9 L408.8 225.9 L418.1 225.9 L427.5 225.9 L436.9 225.9 L446.3 225.9 L455.6 225.9 L465.0 225.8 L474.4 225.8 L483.8 225.8 L493.1 225.8 L502.5 225.8 L511.9 225.8 L521.3 225.8 L530.6 225.8 L540.0 225.8"/>
  <!-- 범례 -->
  <line x1="110" y1="62" x2="140" y2="62" class="lp-sun"/>
  <text x="148" y="67" class="lp-lbl">양지 식물 (예: 소나무, 해바라기)</text>
  <line x1="110" y1="88" x2="140" y2="88" class="lp-shade"/>
  <text x="148" y="93" class="lp-lbl">음지 식물 (예: 고사리, 맥문동)</text>
  <!-- 보상점 -->
  <circle cx="124.1" cy="272" r="5" class="lp-dot-shade"/>
  <circle cx="165" cy="272" r="5" class="lp-dot-sun"/>
  <line x1="124.1" y1="278" x2="124.1" y2="352" class="lp-lead-shade"/>
  <text x="124.1" y="368" text-anchor="middle" class="lp-t">보상점(음지)</text>
  <line x1="165" y1="278" x2="165" y2="380" class="lp-lead-sun"/>
  <text x="165" y="396" text-anchor="middle" class="lp-r">보상점(양지)</text>
  <!-- 광포화점 -->
  <circle cx="277.5" cy="227.6" r="5" class="lp-dot-shade"/>
  <circle cx="446.3" cy="119" r="5" class="lp-dot-sun"/>
  <line x1="277.5" y1="234" x2="277.5" y2="352" class="lp-lead-shade"/>
  <text x="277.5" y="368" text-anchor="middle" class="lp-t">광포화점(음지)</text>
  <line x1="446.3" y1="125" x2="446.3" y2="352" class="lp-lead-sun"/>
  <text x="446.3" y="368" text-anchor="middle" class="lp-r">광포화점(양지)</text>
  <text x="300" y="414" text-anchor="middle" class="lp-sm">보상점: 광합성량 = 호흡량 (겉보기 CO₂ 출입 0) · 광포화점: 빛이 더 세져도 광합성량이 늘지 않기 시작하는 점</text>
  <!-- 순광합성량, 호흡량, 총광합성량 (양지 식물, 강한 빛에서) -->
  <path d="M552 112.5 h-6 M552 112.5 V272 M546 272 h12 M552 272 V318.4 h-6" class="lp-br"/>
  <text x="560" y="196" class="lp-lbl">순광합성량</text>
  <text x="560" y="300" class="lp-lbl">호흡량</text>
  <path d="M646 112.5 h6 V318.4 h-6" class="lp-br"/>
  <text x="644" y="140" text-anchor="end" class="lp-lbl" style="font-weight:600">총광합성량</text>
  <text x="644" y="158" text-anchor="end" class="lp-sm">= 순 + 호흡</text>
  <text x="600" y="346" text-anchor="middle" class="lp-sm">(양지 식물의 예)</text>
</svg>
