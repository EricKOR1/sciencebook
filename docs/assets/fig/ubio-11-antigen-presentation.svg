<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="t-ubio-11-antigen-presentation d-ubio-11-antigen-presentation">
  <title id="t-ubio-11-antigen-presentation">그림 일반생명과학 11-2 MHC에 실린 항원 조각을 알아보는 T 세포</title>
  <desc id="d-ubio-11-antigen-presentation">왼쪽: 수지상 세포가 삼킨 세균의 단백질 조각을 MHC Ⅱ에 실어 보이면, 보조 T 세포가 T 세포 수용체와 CD4로 이를 알아보고 활성화된다. 활성화된 보조 T 세포는 같은 항원 조각을 MHC Ⅱ에 실어 보이는 B 세포에 사이토카인을 주어, B 세포가 형질세포로 분화해 항체를 분비하게 돕는다. 오른쪽: 바이러스에 감염된 세포는 세포 안에서 만들어진 바이러스 단백질 조각을 MHC Ⅰ에 실어 보이고, 세포 독성 T 세포가 T 세포 수용체와 CD8로 이를 알아본 뒤 퍼포린·그랜자임으로 감염 세포의 자살을 유도한다. 모식도이다.</desc>
  <style>.ubio-11-antigen-presentation-t{font-size:14px;fill:var(--fig-ink)} .ubio-11-antigen-presentation-b{font-size:14px;fill:var(--fig-ink);font-weight:700} .ubio-11-antigen-presentation-s{font-size:13px;fill:var(--fig-muted)} .ubio-11-antigen-presentation-lead{stroke:var(--fig-muted);stroke-width:1;fill:none}</style>
