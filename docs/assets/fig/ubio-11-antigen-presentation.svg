  <text x="378" y="32" class="ubio-11-antigen-presentation-b">MHC Ⅰ → 세포 독성 T 세포(CD8)</text>
  <text x="378" y="52" class="ubio-11-antigen-presentation-s">세포 안에서 만든 단백질(바이러스 등)의 조각</text>
