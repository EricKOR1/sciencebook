<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t-rxn-3-soap-micelle d-rxn-3-soap-micelle">
  <title id="t-rxn-3-soap-micelle">그림 화학 반응의 세계 3-7 비누 분자의 구조와 기름때를 둘러싼 미셀</title>
  <desc id="d-rxn-3-soap-micelle">비누 분자는 물과 친한 −COO⁻ 머리와 기름과 친한 긴 탄소 사슬 꼬리로 이루어진다. 물속에서 비누 분자의 꼬리는 기름때 쪽으로, 머리는 물 쪽으로 향해 기름때를 둘러싸고(미셀), 그대로 물에 씻겨 나가게 한다. 분자 크기는 모식적으로 크게 그렸다.</desc>
  <style>
    .rxn-3-soap-micelle-T{font-size:15px;fill:var(--fig-ink);font-weight:700}
