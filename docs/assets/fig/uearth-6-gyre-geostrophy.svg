<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uearth-6-gyre-geostrophy d-uearth-6-gyre-geostrophy">
<title id="t-uearth-6-gyre-geostrophy">그림 일반지구과학 6-6 아열대 환류의 형성 — 에크만 수렴과 지형류</title>
<desc id="d-uearth-6-gyre-geostrophy">(가) 북반구 아열대 해역의 남쪽에는 무역풍(동풍), 북쪽에는 편서풍이 불어 에크만 수송이 모두 바람의 오른쪽 직각, 곧 해역 가운데로 향한다. (나) 남–북 단면: 가운데로 모인 물이 해수면을 볼록하게(약 1 m) 높이고 수온 약층을 아래로 누른다. 수압 경도력은 바깥쪽, 전향력은 안쪽을 향해 균형을 이루어, 북쪽 가장자리에서는 동쪽(⊙, 지면에서 나오는 방향)으로, 남쪽 가장자리에서는 서쪽(⊗, 지면으로 들어가는 방향)으로 지형류가 흐른다. 높이는 크게 과장한 모식도이다.</desc>
