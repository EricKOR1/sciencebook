<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="t-ubio-3-calvin d-ubio-3-calvin">
  <title id="t-ubio-3-calvin">그림 일반생명과학 3-9 캘빈 회로의 세 단계(CO₂ 3분자 기준)</title>
  <desc id="d-ubio-3-calvin">① 탄소 고정: 루비스코가 RuBP(5C) 3분자에 CO₂ 3분자를 붙여 3-인산글리세르산(3PG, 3C) 6분자를 만든다. ② 환원: ATP 6과 NADPH 6을 써서 3PG 6분자를 G3P 6분자로 환원한다. ③ 재생: G3P 5분자(15C)가 ATP 3을 써서 RuBP 3분자(15C)로 돌아가고, G3P 1분자(3C)가 회로 밖으로 나가 포도당·설탕·녹말의 재료가 된다. 탄소 수: 15C + 3C = 18C. 명반응이 ATP와 NADPH를 공급하고 ADP와 NADP⁺를 돌려받는다. 모식도이다.</desc>
  <defs><marker id="ubio-3-calvin-a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-ink)"/></marker><marker id="ubio-3-calvin-a-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-muted)"/></marker><marker id="ubio-3-calvin-a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-blue)"/></marker><marker id="ubio-3-calvin-a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-red)"/></marker><marker id="ubio-3-calvin-a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-green)"/></marker><marker id="ubio-3-calvin-a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-amber)"/></marker><marker id="ubio-3-calvin-a-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-violet)"/></marker><marker id="ubio-3-calvin-a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-teal)"/></marker><marker id="ubio-3-calvin-a-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-line)"/></marker></defs>
  <style>.ubio-3-calvin-t{font-size:14px;fill:var(--fig-ink)} .ubio-3-calvin-s{font-size:13px;fill:var(--fig-muted)} .ubio-3-calvin-b{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-3-calvin-k{font-size:13px;fill:var(--fig-ink)} .ubio-3-calvin-ink{font-size:13px;fill:var(--fig-ink);font-weight:700} .ubio-3-calvin-muted{font-size:13px;fill:var(--fig-muted);font-weight:700} .ubio-3-calvin-blue{font-size:13px;fill:var(--fig-blue);font-weight:700} .ubio-3-calvin-red{font-size:13px;fill:var(--fig-red);font-weight:700} .ubio-3-calvin-green{font-size:13px;fill:var(--fig-green);font-weight:700} .ubio-3-calvin-amber{font-size:13px;fill:var(--fig-amber);font-weight:700} .ubio-3-calvin-violet{font-size:13px;fill:var(--fig-violet);font-weight:700} .ubio-3-calvin-teal{font-size:13px;fill:var(--fig-teal);font-weight:700} .ubio-3-calvin-line{font-size:13px;fill:var(--fig-line);font-weight:700}</style>
  <rect x="318.0" y="70.0" width="124.0" height="44.0" rx="10" style="fill:var(--fig-panel);stroke:var(--fig-green);stroke-width:1.8"/>
  <text x="380.0" y="90.0" text-anchor="middle" class="ubio-3-calvin-b">3 RuBP</text>
  <text x="380.0" y="107.0" text-anchor="middle" class="ubio-3-calvin-s">5C × 3 = 15C</text>
  <rect x="430.6" y="265.0" width="124.0" height="44.0" rx="10" style="fill:var(--fig-panel);stroke:var(--fig-green);stroke-width:1.8"/>
  <text x="492.6" y="285.0" text-anchor="middle" class="ubio-3-calvin-b">6 3PG</text>
  <text x="492.6" y="302.0" text-anchor="middle" class="ubio-3-calvin-s">3C × 6 = 18C</text>
  <rect x="205.4" y="265.0" width="124.0" height="44.0" rx="10" style="fill:var(--fig-panel);stroke:var(--fig-green);stroke-width:1.8"/>
  <text x="267.4" y="285.0" text-anchor="middle" class="ubio-3-calvin-b">6 G3P</text>
  <text x="267.4" y="302.0" text-anchor="middle" class="ubio-3-calvin-s">3C × 6 = 18C</text>
  <path d="M437.0 105.2 A130 130 0 0 1 509.7 231.1" style="fill:none;stroke:var(--fig-green);stroke-width:3" marker-end="url(#ubio-3-calvin-a-green)"/>
  <path d="M452.7 329.8 A130 130 0 0 1 307.3 329.8" style="fill:none;stroke:var(--fig-green);stroke-width:3" marker-end="url(#ubio-3-calvin-a-green)"/>
  <path d="M250.3 231.1 A130 130 0 0 1 323.0 105.2" style="fill:none;stroke:var(--fig-green);stroke-width:3" marker-end="url(#ubio-3-calvin-a-green)"/>
  <text x="380.0" y="218.0" text-anchor="middle" class="ubio-3-calvin-b">캘빈 회로</text>
  <text x="380.0" y="238.0" text-anchor="middle" class="ubio-3-calvin-s">(엽록체 스트로마)</text>
  <text x="470.0" y="62.0" text-anchor="start" class="ubio-3-calvin-green">① 탄소 고정</text>
  <text x="470.0" y="80.0" text-anchor="start" class="ubio-3-calvin-s">효소: 루비스코</text>
  <line x1="591.5" y1="103.0" x2="505.5" y2="149.0" style="stroke:var(--fig-ink);stroke-width:2.2" marker-end="url(#ubio-3-calvin-a-ink)"/>
  <text x="595.5" y="99.0" text-anchor="start" class="ubio-3-calvin-b">3 CO₂</text>
  <line x1="500.0" y1="392.0" x2="392.0" y2="364.0" style="stroke:var(--fig-red);stroke-width:2" marker-end="url(#ubio-3-calvin-a-red)"/>
  <text x="506.0" y="396.0" text-anchor="start" class="ubio-3-calvin-red">6 ATP</text>
  <line x1="500.0" y1="418.0" x2="396.0" y2="370.0" style="stroke:var(--fig-blue);stroke-width:2" marker-end="url(#ubio-3-calvin-a-blue)"/>
  <text x="506.0" y="422.0" text-anchor="start" class="ubio-3-calvin-blue">6 NADPH</text>
  <text x="356.0" y="382.0" text-anchor="end" class="ubio-3-calvin-green">② 환원</text>
  <text x="356.0" y="422.0" text-anchor="end" class="ubio-3-calvin-s">→ 6 ADP, 6 NADP⁺</text>
  <text x="222.0" y="176.0" text-anchor="end" class="ubio-3-calvin-green">③ RuBP 재생</text>
  <line x1="212.3" y1="102.8" x2="290.3" y2="114.8" style="stroke:var(--fig-red);stroke-width:2" marker-end="url(#ubio-3-calvin-a-red)"/>
  <text x="208.3" y="106.8" text-anchor="end" class="ubio-3-calvin-red">3 ATP</text>
  <text x="201.4" y="253.0" text-anchor="end" class="ubio-3-calvin-s">5 G3P(15C)는</text>
  <text x="201.4" y="269.0" text-anchor="end" class="ubio-3-calvin-s">회로에 남음</text>
  <line x1="237.4" y1="311.0" x2="197.4" y2="349.0" style="stroke:var(--fig-amber);stroke-width:2.6" marker-end="url(#ubio-3-calvin-a-amber)"/>
  <rect x="71.4" y="339.0" width="124.0" height="44.0" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.8"/>
  <text x="133.4" y="357.0" text-anchor="middle" class="ubio-3-calvin-b">1 G3P (3C)</text>
  <text x="133.4" y="374.0" text-anchor="middle" class="ubio-3-calvin-s">회로 밖으로</text>
  <text x="133.4" y="401.0" text-anchor="middle" class="ubio-3-calvin-s">→ 포도당·설탕·녹말</text>
  <rect x="8.0" y="12.0" width="156.0" height="118.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.2"/>
  <text x="86.0" y="34.0" text-anchor="middle" class="ubio-3-calvin-b">알짜(CO₂ 3분자)</text>
  <text x="86.0" y="56.0" text-anchor="middle" class="ubio-3-calvin-k">3 CO₂ → 1 G3P</text>
  <text x="86.0" y="76.0" text-anchor="middle" class="ubio-3-calvin-red">ATP 9</text>
  <text x="86.0" y="96.0" text-anchor="middle" class="ubio-3-calvin-blue">NADPH 6</text>
  <text x="86.0" y="120.0" text-anchor="middle" class="ubio-3-calvin-s">포도당 1분자 = ×2</text>
</svg>
