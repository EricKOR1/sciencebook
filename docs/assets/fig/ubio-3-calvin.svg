<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-ubio-3-calvin d-ubio-3-calvin">
  <title id="t-ubio-3-calvin">그림 일반생명과학 3-9 캘빈 회로의 세 단계(CO₂ 3분자 기준)</title>
  <desc id="d-ubio-3-calvin">① 탄소 고정: 루비스코가 RuBP(5C) 3분자에 CO₂ 3분자를 붙여 3-인산글리세르산(3PG, 3C) 6분자를 만든다. ② 환원: ATP 6과 NADPH 6을 써서 3PG 6분자를 G3P 6분자로 환원한다. ③ 재생: G3P 5분자(15C)가 ATP 3을 써서 RuBP 3분자(15C)로 돌아가고, G3P 1분자(3C)가 회로 밖으로 나가 포도당·설탕·녹말의 재료가 된다. 탄소 수: 15C + 3C = 18C. 명반응이 ATP와 NADPH를 공급하고 ADP와 NADP⁺를 돌려받는다. 모식도이다.</desc>
  <defs><marker id="ubio-3-calvin-a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-ink)"/></marker><marker id="ubio-3-calvin-a-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-muted)"/></marker><marker id="ubio-3-calvin-a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-blue)"/></marker><marker id="ubio-3-calvin-a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-red)"/></marker><marker id="ubio-3-calvin-a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-green)"/></marker><marker id="ubio-3-calvin-a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-amber)"/></marker><marker id="ubio-3-calvin-a-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-violet)"/></marker><marker id="ubio-3-calvin-a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-teal)"/></marker><marker id="ubio-3-calvin-a-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-line)"/></marker></defs>
  <style>.ubio-3-calvin-t{font-size:14px;fill:var(--fig-ink)} .ubio-3-calvin-s{font-size:13px;fill:var(--fig-muted)} .ubio-3-calvin-b{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-3-calvin-k{font-size:13px;fill:var(--fig-ink)} .ubio-3-calvin-ink{font-size:13px;fill:var(--fig-ink);font-weight:700} .ubio-3-calvin-muted{font-size:13px;fill:var(--fig-muted);font-weight:700} .ubio-3-calvin-blue{font-size:13px;fill:var(--fig-blue);font-weight:700} .ubio-3-calvin-red{font-size:13px;fill:var(--fig-red);font-weight:700} .ubio-3-calvin-green{font-size:13px;fill:var(--fig-green);font-weight:700} .ubio-3-calvin-amber{font-size:13px;fill:var(--fig-amber);font-weight:700} .ubio-3-calvin-violet{font-size:13px;fill:var(--fig-violet);font-weight:700} .ubio-3-calvin-teal{font-size:13px;fill:var(--fig-teal);font-weight:700} .ubio-3-calvin-line{font-size:13px;fill:var(--fig-line);font-weight:700}</style>
  <rect x="266.0" y="68.0" width="128.0" height="44.0" rx="10" style="fill:var(--fig-panel);stroke:var(--fig-green);stroke-width:1.8"/>
  <text x="330.0" y="88.0" text-anchor="middle" class="ubio-3-calvin-b">3 RuBP</text>
  <text x="330.0" y="105.0" text-anchor="middle" class="ubio-3-calvin-s">5C × 3 = 15C</text>
  <rect x="387.2" y="278.0" width="128.0" height="44.0" rx="10" style="fill:var(--fig-panel);stroke:var(--fig-green);stroke-width:1.8"/>
  <text x="451.2" y="298.0" text-anchor="middle" class="ubio-3-calvin-b">6 3PG</text>
  <text x="451.2" y="315.0" text-anchor="middle" class="ubio-3-calvin-s">3C × 6 = 18C</text>
  <rect x="144.8" y="278.0" width="128.0" height="44.0" rx="10" style="fill:var(--fig-panel);stroke:var(--fig-green);stroke-width:1.8"/>
  <text x="208.8" y="298.0" text-anchor="middle" class="ubio-3-calvin-b">6 G3P</text>
  <text x="208.8" y="315.0" text-anchor="middle" class="ubio-3-calvin-s">3C × 6 = 18C</text>
  <path d="M386.9 102.1 A140 140 0 0 1 469.2 244.6" style="fill:none;stroke:var(--fig-green);stroke-width:3" marker-end="url(#ubio-3-calvin-a-green)"/>
  <path d="M412.3 343.3 A140 140 0 0 1 247.7 343.3" style="fill:none;stroke:var(--fig-green);stroke-width:3" marker-end="url(#ubio-3-calvin-a-green)"/>
  <path d="M190.8 244.6 A140 140 0 0 1 273.1 102.1" style="fill:none;stroke:var(--fig-green);stroke-width:3" marker-end="url(#ubio-3-calvin-a-green)"/>
  <text x="330.0" y="226.0" text-anchor="middle" class="ubio-3-calvin-b">캘빈 회로</text>
  <text x="330.0" y="246.0" text-anchor="middle" class="ubio-3-calvin-s">(엽록체 스트로마)</text>
  <text x="458.0" y="126.0" text-anchor="start" class="ubio-3-calvin-green">① 탄소 고정</text>
  <text x="458.0" y="144.0" text-anchor="start" class="ubio-3-calvin-s">루비스코</text>
  <text x="470.0" y="358.0" text-anchor="start" class="ubio-3-calvin-green">② 환원</text>
  <text x="160.0" y="240.0" text-anchor="end" class="ubio-3-calvin-green">③ RuBP 재생</text>
  <line x1="554.2" y1="100.0" x2="464.2" y2="150.0" style="stroke:var(--fig-ink);stroke-width:2.2" marker-end="url(#ubio-3-calvin-a-ink)"/>
  <text x="558.2" y="94.0" text-anchor="start" class="ubio-3-calvin-b">3 CO₂</text>
  <line x1="450.0" y1="406.0" x2="340.0" y2="380.0" style="stroke:var(--fig-red);stroke-width:2" marker-end="url(#ubio-3-calvin-a-red)"/>
  <text x="456.0" y="404.0" text-anchor="start" class="ubio-3-calvin-red">6 ATP</text>
  <line x1="450.0" y1="428.0" x2="344.0" y2="386.0" style="stroke:var(--fig-blue);stroke-width:2" marker-end="url(#ubio-3-calvin-a-blue)"/>
  <text x="456.0" y="432.0" text-anchor="start" class="ubio-3-calvin-blue">6 NADPH</text>
  <text x="300.0" y="434.0" text-anchor="end" class="ubio-3-calvin-s">→ 6 ADP, 6 NADP⁺</text>
  <line x1="113.6" y1="87.0" x2="195.6" y2="149.0" style="stroke:var(--fig-red);stroke-width:2" marker-end="url(#ubio-3-calvin-a-red)"/>
  <text x="109.6" y="81.0" text-anchor="end" class="ubio-3-calvin-red">3 ATP</text>
  <line x1="142.8" y1="306.0" x2="58.8" y2="360.0" style="stroke:var(--fig-amber);stroke-width:2.6" marker-end="url(#ubio-3-calvin-a-amber)"/>
  <rect x="-51.2" y="354.0" width="118.0" height="44.0" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.8"/>
  <text x="7.8" y="372.0" text-anchor="middle" class="ubio-3-calvin-b">1 G3P (3C)</text>
  <text x="7.8" y="389.0" text-anchor="middle" class="ubio-3-calvin-s">회로 밖으로</text>
  <text x="7.8" y="418.0" text-anchor="middle" class="ubio-3-calvin-s">→ 포도당·설탕·녹말</text>
  <text x="168.8" y="260.0" text-anchor="end" class="ubio-3-calvin-k">5 G3P</text>
  <text x="168.8" y="276.0" text-anchor="end" class="ubio-3-calvin-s">(15C)</text>
  <rect x="560.0" y="300.0" width="154.0" height="130.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.2"/>
  <text x="637.0" y="322.0" text-anchor="middle" class="ubio-3-calvin-b">알짜(CO₂ 3)</text>
  <text x="637.0" y="346.0" text-anchor="middle" class="ubio-3-calvin-k">3 CO₂ → 1 G3P</text>
  <text x="637.0" y="368.0" text-anchor="middle" class="ubio-3-calvin-red">ATP 9</text>
  <text x="637.0" y="388.0" text-anchor="middle" class="ubio-3-calvin-blue">NADPH 6</text>
  <text x="637.0" y="414.0" text-anchor="middle" class="ubio-3-calvin-s">포도당 1 = ×2</text>
</svg>
