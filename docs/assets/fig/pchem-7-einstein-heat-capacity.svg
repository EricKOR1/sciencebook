<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-pchem-7-einstein-heat-capacity d-pchem-7-einstein-heat-capacity">
  <title id="t-pchem-7-einstein-heat-capacity">그림 물리화학 7-2 아인슈타인 모형의 몰 열용량</title>
  <desc id="d-pchem-7-einstein-heat-capacity">C_V,m/3R = (θE/T)² e^(θE/T)/(e^(θE/T) − 1)²를 T/θE에 대해 계산한 곡선. T/θE = 0.2, 0.3354, 0.5, 1.0, 2.0에서 0.171, 0.500, 0.724, 0.921, 0.979이다. 높은 온도에서 뒬롱–프티 값 3R(점선)에 다가가고, 낮은 온도에서 지수적으로 0이 된다. 298 K에서 다이아몬드(θE ≈ 1300 K)는 T/θE = 0.229로 0.25, 구리(θE ≈ 240 K)는 T/θE = 1.24로 0.95이다.</desc>
