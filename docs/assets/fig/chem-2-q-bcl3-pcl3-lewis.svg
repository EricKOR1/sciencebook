  <title id="t-chem-2-q-bcl3-pcl3-lewis">그림 화학 2-11 문제 12 해설 — 삼염화 붕소와 삼염화 인의 루이스 전자점식</title>
  <desc id="d-chem-2-q-bcl3-pcl3-lewis">BCl₃는 원자가 전자 24개(12쌍) 가운데 공유 전자쌍 3개, Cl의 비공유 전자쌍 9개로 B 주위에는 전자가 6개뿐이다. PCl₃는 원자가 전자 26개(13쌍) 가운데 공유 전자쌍 3개, Cl의 비공유 전자쌍 9개와 P의 비공유 전자쌍 1개로 P가 옥텟을 이룬다.</desc>
