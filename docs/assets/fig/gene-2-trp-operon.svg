  <text x="28.0" y="230.0" class="gene-2-trp-operon-h">트립토판이 많을 때 — 전사 꺼짐</text>
  <line x1="30.0" y1="318.0" x2="690.0" y2="318.0" class="gene-2-trp-operon-ln" style="stroke-width:3;stroke:var(--fig-line)"/>
  <rect x="40.0" y="305.0" width="90.0" height="26.0" rx="0" class="gene-2-trp-operon-b-red"/>
  <text x="85.0" y="323.0" text-anchor="middle" class="gene-2-trp-operon-tx" style="font-size:12px">조절 유전자</text>
  <rect x="200.0" y="305.0" width="70.0" height="26.0" rx="0" class="gene-2-trp-operon-b-amber"/>
  <text x="235.0" y="350.0" text-anchor="middle" class="gene-2-trp-operon-sm" style="font-size:12px">프로모터</text>
