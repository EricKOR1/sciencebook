<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-gene-2-trp-operon d-gene-2-trp-operon">
  <title id="t-gene-2-trp-operon">그림 생물의 유전 2-5 트립토판 오페론 — 산물이 많아지면 전사가 꺼진다</title>
  <desc id="d-gene-2-trp-operon">위: 트립토판이 적을 때는 조절 유전자가 만든 억제 단백질이 작동 부위에 붙지 못하므로 RNA 중합 효소가 구조 유전자(트립토판 합성 효소 유전자)를 전사한다. 아래: 트립토판이 많아지면 트립토판이 억제 단백질에 결합하여 억제 단백질이 작동 부위에 붙을 수 있게 되고, RNA 중합 효소가 구조 유전자를 전사하지 못한다. 최종 산물이 자기 합성을 멈추는 억제 방식이다. 모식도이다.</desc>
  <style>
    .gene-2-trp-operon-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .gene-2-trp-operon-tx{font-size:14px;fill:var(--fig-ink)}
    .gene-2-trp-operon-sm{font-size:13px;fill:var(--fig-muted)}
    .gene-2-trp-operon-mono{font-size:14px;font-weight:600;fill:var(--fig-ink);letter-spacing:1px}
    .gene-2-trp-operon-ln{fill:none;stroke:var(--fig-ink);stroke-width:2}
    .gene-2-trp-operon-lnm{fill:none;stroke:var(--fig-line);stroke-width:1.5}
    .gene-2-trp-operon-dash{fill:none;stroke:var(--fig-line);stroke-width:1.5;stroke-dasharray:5 4}
    .gene-2-trp-operon-ink{fill:var(--fig-ink)}
    .gene-2-trp-operon-paper{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}
    .gene-2-trp-operon-gray{fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1.5}
    .gene-2-trp-operon-b-blue{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2}
    .gene-2-trp-operon-f-blue{fill:var(--fig-blue)}
    .gene-2-trp-operon-s-blue{fill:none;stroke:var(--fig-blue);stroke-width:2.5}
    .gene-2-trp-operon-t-blue{fill:var(--fig-blue)}
    .gene-2-trp-operon-b-red{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2}
    .gene-2-trp-operon-f-red{fill:var(--fig-red)}
    .gene-2-trp-operon-s-red{fill:none;stroke:var(--fig-red);stroke-width:2.5}
    .gene-2-trp-operon-t-red{fill:var(--fig-red)}
    .gene-2-trp-operon-b-green{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2}
    .gene-2-trp-operon-f-green{fill:var(--fig-green)}
    .gene-2-trp-operon-s-green{fill:none;stroke:var(--fig-green);stroke-width:2.5}
    .gene-2-trp-operon-t-green{fill:var(--fig-green)}
    .gene-2-trp-operon-b-amber{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2}
    .gene-2-trp-operon-f-amber{fill:var(--fig-amber)}
    .gene-2-trp-operon-s-amber{fill:none;stroke:var(--fig-amber);stroke-width:2.5}
    .gene-2-trp-operon-t-amber{fill:var(--fig-amber)}
    .gene-2-trp-operon-b-violet{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2}
    .gene-2-trp-operon-f-violet{fill:var(--fig-violet)}
    .gene-2-trp-operon-s-violet{fill:none;stroke:var(--fig-violet);stroke-width:2.5}
    .gene-2-trp-operon-t-violet{fill:var(--fig-violet)}
    .gene-2-trp-operon-b-teal{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:2}
    .gene-2-trp-operon-f-teal{fill:var(--fig-teal)}
    .gene-2-trp-operon-s-teal{fill:none;stroke:var(--fig-teal);stroke-width:2.5}
    .gene-2-trp-operon-t-teal{fill:var(--fig-teal)}
