  <title id="t-pchem-1-adiabat-vs-isotherm">그림 물리화학 1-8 가역 단열선과 등온선</title>
  <desc id="d-pchem-1-adiabat-vs-isotherm">단원자 이상 기체 1 mol이 A(2.48 L, 10 bar, 298 K)에서 1 bar까지 팽창할 때, 등온선(298 K, 24.8 L)보다 가역 단열선(γ = 5/3, 9.87 L, 119 K)이 더 가파르다. 빈 원은 외부 압력 1 bar에 맞선 비가역 단열 팽창의 나중 상태(15.9 L, 191 K)이며, 그 사이의 경로는 정의되지 않는다.</desc>
