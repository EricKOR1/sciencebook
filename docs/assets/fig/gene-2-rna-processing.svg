<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" role="img" aria-labelledby="t-gene-2-rna-processing d-gene-2-rna-processing">
  <title id="t-gene-2-rna-processing">그림 생물의 유전 2-4 원핵생물과 진핵생물의 전사·번역 장소와 RNA 가공</title>
  <desc id="d-gene-2-rna-processing">위: 원핵생물은 핵막이 없어 세포질에서 전사가 진행되는 동안 mRNA에 리보솜이 붙어 번역이 함께 일어난다. 오른쪽으로 갈수록 전사가 더 진행되어 mRNA가 길다. 아래: 진핵생물은 핵에서 엑손과 인트론이 모두 담긴 처음 전사체를 만든 뒤, 인트론을 잘라 내고 엑손을 잇고(RNA 스플라이싱) 5′ 끝에 모자, 3′ 끝에 폴리 A 꼬리를 붙인 성숙한 mRNA만 핵공을 지나 세포질에서 번역된다. 모식도이다.</desc>
