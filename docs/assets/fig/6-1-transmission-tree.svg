  <title id="t-6-1-transmission-tree">그림 6-1-4 감염시키는 수가 1보다 큰가 작은가</title>
  <desc id="d-6-1-transmission-tree">왼쪽은 감염자 1명이 평균 2명을 감염시켜 세대마다 1, 2, 4, 8명으로 늘어나는 경우이고, 오른쪽은 추적·격리로 절반의 감염자가 아무도 감염시키지 못해 평균 0.5명이 되어 8, 4, 2, 1명으로 줄어드는 경우이다. 모식도이다.</desc>
