<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 362" role="img" aria-labelledby="t-uphy-8-continuous-charge d-uphy-8-continuous-charge">
  <title id="t-uphy-8-continuous-charge">그림 일반물리학 8-3 연속 전하 분포: 조각 dq가 만드는 dE를 세우고 대칭으로 지우기</title>
  <desc id="d-uphy-8-continuous-charge">(가) 막대의 연장선 위 점 P: x에 있는 조각 dq = λdx까지의 거리는 x + d이고, 모든 조각의 dE가 같은 방향(−x)이라 크기만 적분하면 된다. (나) 고리의 축 위 점 P: 마주 보는 두 조각의 dE는 축에 수직인 성분이 상쇄되고, 축 성분 dE cos θ만 남는다. 모식도이다.</desc>
  <style>.uphy-8-continuous-charge-t{font-size:14px;fill:var(--fig-ink)} .uphy-8-continuous-charge-b{font-size:14px;fill:var(--fig-ink);font-weight:700} .uphy-8-continuous-charge-s{font-size:13px;fill:var(--fig-muted)} .uphy-8-continuous-charge-ax{stroke:var(--fig-line);stroke-width:1.2;fill:none} .uphy-8-continuous-charge-dash{stroke:var(--fig-muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}</style>
  <rect x="8" y="8" width="346" height="346" rx="8" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <rect x="366" y="8" width="346" height="346" rx="8" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <text x="22" y="32" text-anchor="start" class="uphy-8-continuous-charge-b">(가) 막대의 연장선 위</text>
  <text x="380" y="32" text-anchor="start" class="uphy-8-continuous-charge-b">(나) 고리의 축 위</text>
  <line x1="20" y1="150" x2="342" y2="150" class="uphy-8-continuous-charge-ax"/>
  <rect x="140" y="141" width="180" height="18" rx="4" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5"/>
  <text x="152.0" y="155" text-anchor="middle" class="uphy-8-continuous-charge-s" style="fill:var(--fig-red)">+</text>
  <text x="174.3" y="155" text-anchor="middle" class="uphy-8-continuous-charge-s" style="fill:var(--fig-red)">+</text>
  <text x="196.6" y="155" text-anchor="middle" class="uphy-8-continuous-charge-s" style="fill:var(--fig-red)">+</text>
  <text x="218.9" y="155" text-anchor="middle" class="uphy-8-continuous-charge-s" style="fill:var(--fig-red)">+</text>
  <text x="263.4" y="155" text-anchor="middle" class="uphy-8-continuous-charge-s" style="fill:var(--fig-red)">+</text>
  <text x="285.7" y="155" text-anchor="middle" class="uphy-8-continuous-charge-s" style="fill:var(--fig-red)">+</text>
  <text x="308.0" y="155" text-anchor="middle" class="uphy-8-continuous-charge-s" style="fill:var(--fig-red)">+</text>
  <rect x="238.0" y="138" width="14" height="24" rx="2" style="fill:var(--fig-red);stroke:var(--fig-red)"/>
  <text x="245" y="130" text-anchor="middle" class="uphy-8-continuous-charge-b" style="fill:var(--fig-red)">dq = λ dx</text>
  <circle cx="60" cy="150" r="5" style="fill:var(--fig-ink)"/>
  <text x="60" y="176" text-anchor="middle" class="uphy-8-continuous-charge-b">P</text>
  <line x1="60.0" y1="150.0" x2="28.0" y2="150.0" style="stroke:var(--fig-accent);stroke-width:3"/>
  <path d="M20.0 150.0 L29.2 146.1 L29.2 153.9 Z" style="fill:var(--fig-accent)"/>
  <text x="38" y="136" text-anchor="middle" class="uphy-8-continuous-charge-b" style="fill:var(--fig-accent)">dE</text>
  <line x1="60" y1="200" x2="140" y2="200" style="stroke:var(--fig-muted);stroke-width:1.2"/>
  <line x1="60" y1="195" x2="60" y2="205" style="stroke:var(--fig-muted);stroke-width:1.2"/>
  <line x1="140" y1="195" x2="140" y2="205" style="stroke:var(--fig-muted);stroke-width:1.2"/>
  <text x="100.0" y="218" text-anchor="middle" class="uphy-8-continuous-charge-s">d</text>
  <line x1="140" y1="200" x2="245" y2="200" style="stroke:var(--fig-muted);stroke-width:1.2"/>
  <line x1="140" y1="195" x2="140" y2="205" style="stroke:var(--fig-muted);stroke-width:1.2"/>
  <line x1="245" y1="195" x2="245" y2="205" style="stroke:var(--fig-muted);stroke-width:1.2"/>
  <text x="192.5" y="218" text-anchor="middle" class="uphy-8-continuous-charge-s">x</text>
  <line x1="60" y1="240" x2="245" y2="240" style="stroke:var(--fig-muted);stroke-width:1.2"/>
  <line x1="60" y1="235" x2="60" y2="245" style="stroke:var(--fig-muted);stroke-width:1.2"/>
  <line x1="245" y1="235" x2="245" y2="245" style="stroke:var(--fig-muted);stroke-width:1.2"/>
  <text x="152.5" y="258" text-anchor="middle" class="uphy-8-continuous-charge-s">x + d</text>
  <text x="140" y="120" text-anchor="middle" class="uphy-8-continuous-charge-s">x = 0</text>
  <text x="320" y="120" text-anchor="middle" class="uphy-8-continuous-charge-s">x = L</text>
  <text x="22" y="300" text-anchor="start" class="uphy-8-continuous-charge-t">모든 dE가 같은 방향(−x) → 크기만 더한다</text>
  <text x="22" y="330" text-anchor="start" class="uphy-8-continuous-charge-t" style="fill:var(--fig-accent);font-weight:700">E = ∫ kλ dx/(x + d)² = kQ / [d(d + L)]</text>
  <line x1="395" y1="158" x2="700" y2="158" class="uphy-8-continuous-charge-ax"/>
  <text x="397" y="150" text-anchor="start" class="uphy-8-continuous-charge-s">축</text>
  <path d="M455 86 A24 72 0 0 0 455 230" style="fill:none;stroke:var(--fig-red);stroke-width:2;stroke-dasharray:5 4"/>
  <path d="M455 86 A24 72 0 0 1 455 230" style="fill:none;stroke:var(--fig-red);stroke-width:3.5"/>
  <circle cx="455" cy="86" r="7" style="fill:var(--fig-red)"/>
  <text x="443" y="76" text-anchor="end" class="uphy-8-continuous-charge-b" style="fill:var(--fig-red)">dq</text>
  <line x1="455" y1="86" x2="625" y2="158" class="uphy-8-continuous-charge-dash"/>
  <circle cx="455" cy="230" r="7" style="fill:var(--fig-red)"/>
  <text x="443" y="254" text-anchor="end" class="uphy-8-continuous-charge-b" style="fill:var(--fig-red)">dq′</text>
  <line x1="455" y1="230" x2="625" y2="158" class="uphy-8-continuous-charge-dash"/>
  <line x1="455" y1="158" x2="455" y2="86" style="stroke:var(--fig-muted);stroke-width:1.2"/>
  <text x="461" y="122.0" text-anchor="start" class="uphy-8-continuous-charge-t">R</text>
  <line x1="455" y1="244" x2="625" y2="244" style="stroke:var(--fig-muted);stroke-width:1.2"/>
  <line x1="455" y1="239" x2="455" y2="249" style="stroke:var(--fig-muted);stroke-width:1.2"/>
  <line x1="625" y1="239" x2="625" y2="249" style="stroke:var(--fig-muted);stroke-width:1.2"/>
  <text x="540.0" y="262" text-anchor="middle" class="uphy-8-continuous-charge-s">z</text>
  <circle cx="625" cy="158" r="5" style="fill:var(--fig-ink)"/>
  <text x="621" y="180" text-anchor="end" class="uphy-8-continuous-charge-b">P</text>
  <line x1="625.0" y1="158.0" x2="674.7" y2="179.1" style="stroke:var(--fig-accent);stroke-width:2.5"/>
  <path d="M682.1 182.2 L672.1 182.2 L675.1 175.0 Z" style="fill:var(--fig-accent)"/>
  <line x1="625.0" y1="158.0" x2="674.7" y2="136.9" style="stroke:var(--fig-accent);stroke-width:2.5"/>
  <path d="M682.1 133.8 L675.1 141.0 L672.1 133.8 Z" style="fill:var(--fig-accent)"/>
  <text x="704" y="198.17958861466553" text-anchor="end" class="uphy-8-continuous-charge-s">dE (dq에서)</text>
  <text x="704" y="125.82041138533447" text-anchor="end" class="uphy-8-continuous-charge-s">dE′ (dq′에서)</text>
  <line x1="682.1" y1="158.0" x2="682.1" y2="175.8" style="stroke:var(--fig-violet);stroke-width:1.6;stroke-dasharray:4 3"/>
  <path d="M682.1 182.2 L679.0 174.8 L685.2 174.8 Z" style="fill:var(--fig-violet)"/>
  <line x1="682.1" y1="158.0" x2="682.1" y2="140.2" style="stroke:var(--fig-violet);stroke-width:1.6;stroke-dasharray:4 3"/>
  <path d="M682.1 133.8 L685.2 141.2 L679.0 141.2 Z" style="fill:var(--fig-violet)"/>
  <text x="692.0906953401825" y="124" text-anchor="start" class="uphy-8-continuous-charge-s"></text>
  <line x1="625.0" y1="158.0" x2="674.1" y2="158.0" style="stroke:var(--fig-green);stroke-width:4"/>
  <path d="M682.1 158.0 L672.9 161.9 L672.9 154.1 Z" style="fill:var(--fig-green)"/>
  <path d="M595 158 A30 30 0 0 1 597.4 146.3" style="fill:none;stroke:var(--fig-ink);stroke-width:1.2"/>
  <text x="583" y="150" text-anchor="middle" class="uphy-8-continuous-charge-t">θ</text>
  <text x="380" y="300" text-anchor="start" class="uphy-8-continuous-charge-t">수직 성분(보라)은 마주 보는 조각끼리 상쇄,</text>
  <text x="380" y="320" text-anchor="start" class="uphy-8-continuous-charge-t">축 성분(초록) dE cos θ만 남는다</text>
  <text x="380" y="344" text-anchor="start" class="uphy-8-continuous-charge-t" style="fill:var(--fig-accent);font-weight:700">E<tspan style="baseline-shift:sub;font-size:11px">z</tspan> = kQz / (z² + R²)<tspan style="baseline-shift:super;font-size:11px">3/2</tspan></text>
</svg>
