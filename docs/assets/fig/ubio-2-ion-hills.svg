<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-ubio-2-ion-hills d-ubio-2-ion-hills">
  <title id="t-ubio-2-ion-hills">그림 일반생명과학 2-2 이온이 넘는 두 언덕 — 농도 항과 전기 항</title>
  <desc id="d-ubio-2-ion-hills">37 °C, 막전위 −70 mV에서 이온 1 mol이 밖에서 안으로 갈 때의 자유 에너지 변화를 농도 항과 전기 항으로 나누었다. Na⁺은 두 항이 모두 음수(−6.4, −6.8)여서 합 −13.2 kJ/mol로 세게 들어오려 하고, K⁺은 농도 항 +8.6이 전기 항 −6.8보다 커서 합 +1.8 kJ/mol, 즉 약하게 밖으로 나가려 한다(예제 6·7의 값).</desc>
  <defs>
    <marker id="ubio-2-ion-hills-av" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-violet)"/></marker>
    <marker id="ubio-2-ion-hills-at" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-teal)"/></marker>
  </defs>
  <style>.ubio-2-ion-hills-s{font-size:13px;fill:var(--fig-muted)} .ubio-2-ion-hills-b{font-size:15px;fill:var(--fig-ink);font-weight:600} .ubio-2-ion-hills-k{font-size:13px;fill:var(--fig-ink)} .ubio-2-ion-hills-kb{font-size:14px;fill:var(--fig-ink);font-weight:700} .ubio-2-ion-hills-r{font-size:15px;fill:var(--fig-red);font-weight:700} .ubio-2-ion-hills-bl{font-size:15px;fill:var(--fig-blue);font-weight:700} .ubio-2-ion-hills-na{font-size:14px;fill:var(--fig-violet);font-weight:700} .ubio-2-ion-hills-kk{font-size:14px;fill:var(--fig-teal);font-weight:700} .ubio-2-ion-hills-na2{font-size:13px;fill:var(--fig-violet)} .ubio-2-ion-hills-kk2{font-size:13px;fill:var(--fig-teal)}</style>
