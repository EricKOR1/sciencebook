<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" class="fig-small" role="img" aria-labelledby="t-ochem-9-snar-energy d-ochem-9-snar-energy">
  <title id="t-ochem-9-snar-energy">그림 유기화학 9-15 첨가–제거 SNAr의 에너지 도표(모식도)</title>
  <desc id="d-ochem-9-snar-energy">세로축은 자유 에너지 G(눈금 없는 상대 높이), 가로축은 반응 좌표이다. 첫 꼭대기(첨가)가 높아 속도를 정하고, 골짜기가 마이젠하이머 착물, 둘째 꼭대기(제거)는 낮다. 속도 결정 단계가 C–X 결합이 끊어지지 않는 첨가이므로 이탈기 반응성은 F &gt; Cl ≈ Br &gt; I이다.</desc>
