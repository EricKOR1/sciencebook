  <text x="398.0" y="110.0" class="ochem-9-snar-energy-t" text-anchor="middle">F &gt; Cl ≈ Br &gt; I</text>
  <text x="398.0" y="136.0" class="ochem-9-snar-energy-s" text-anchor="middle">(SN2와 반대:</text>
  <text x="398.0" y="154.0" class="ochem-9-snar-energy-s" text-anchor="middle">C–X는 빠른 2단계에서</text>
  <text x="398.0" y="170.0" class="ochem-9-snar-energy-s" text-anchor="middle">끊어진다)</text>
</svg>
