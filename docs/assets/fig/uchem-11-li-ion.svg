<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uchem-11-li-ion d-uchem-11-li-ion">
  <title id="t-uchem-11-li-ion">그림 일반화학 11-6 리튬 이온 전지의 방전 — 흔들의자형 전지</title>
  <desc id="d-uchem-11-li-ion">방전할 때 흑연 층 사이에 끼어 있던 리튬이 Li⁺와 전자로 나뉜다. 전자는 바깥 도선과 기기를 지나 환원 전극으로 가고, Li⁺는 유기 전해질과 분리막을 지나 금속 산화물(LiMO₂) 층 사이로 들어간다. 충전할 때는 외부 전원이 전자와 Li⁺를 모두 반대 방향으로 되돌린다. 층 간격과 이온 크기는 모식도이다.</desc>
