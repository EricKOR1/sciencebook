<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 448" role="img" aria-labelledby="t-2-2-star-life-paths d-2-2-star-life-paths">
  <title id="t-2-2-star-life-paths">그림 2-2-4 질량에 따라 달라지는 별의 일생</title>
  <desc id="d-2-2-star-life-paths">태양 정도 질량의 별은 성운 → 주계열성 → 적색 거성을 거쳐 바깥층은 행성상 성운으로 흩어지고 중심부는 백색 왜성으로 남는다. 태양보다 매우 무거운 별은 주계열성 → 초거성을 거쳐 초신성 폭발을 일으키고 중심부는 중성자별이나 블랙홀로 남는다. 두 경우 모두 별이 만든 원소가 우주로 퍼져 새로운 성운의 재료가 된다. 모식도(크기 비율은 실제와 다름).</desc>
