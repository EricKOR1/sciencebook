<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-m3-05-neuron d-m3-05-neuron">
  <title id="t-m3-05-neuron">그림 중3-5-6 뉴런의 구조와 신호 방향</title>
  <desc id="d-m3-05-neuron">가지돌기가 신호를 받아 신경 세포체를 거쳐 긴 축삭돌기를 따라 전달하고, 축삭돌기 끝은 좁은 틈을 두고 다음 뉴런의 가지돌기에 신호를 넘긴다.</desc>
