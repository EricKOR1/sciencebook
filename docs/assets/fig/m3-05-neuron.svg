  <text x="370" y="40" text-anchor="middle" class="m3-05-neuron-l">축삭돌기</text>
  <text x="370" y="57" text-anchor="middle" class="m3-05-neuron-s">신호를 멀리 전달한다 (길게 뻗음)</text>
