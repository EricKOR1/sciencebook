    .m3-05-neuron-ld{stroke:var(--fig-muted);stroke-width:1;fill:none}
    .m3-05-neuron-den{stroke:var(--fig-violet);stroke-width:4;fill:none;stroke-linecap:round}
    .m3-05-neuron-den2{stroke:var(--fig-violet);stroke-width:2.5;fill:none;stroke-linecap:round}
  </style>
