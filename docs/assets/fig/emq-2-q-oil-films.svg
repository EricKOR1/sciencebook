  <title id="t-emq-2-q-oil-films">그림 전자기와 양자 2-13 문제 17의 두 기름막</title>
  <desc id="d-emq-2-q-oil-films">(가) 물(굴절률 1.33) 위와 (나) 유리판(굴절률 1.52) 위에 굴절률 1.45, 두께 250 nm인 기름막을 만들고 흰빛을 비춘다. ①은 막의 윗면, ②는 아랫면에서 반사된 빛이다. 실제로는 수직으로 비추지만 두 반사광을 구별하려고 비스듬히 그렸고, 두께는 과장했다.</desc>
