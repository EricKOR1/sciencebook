<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-uearth-2-refraction d-uearth-2-refraction">
  <title id="t-uearth-2-refraction">그림 일반지구과학 2-10 굴절파의 경로와 주시 곡선의 절편 시간</title>
  <desc id="d-uearth-2-refraction">위: 지표를 따라 가는 직접파와, 모호면에 임계각으로 내려가 맨틀 쪽을 따라 달린 뒤 다시 올라오는 굴절파의 경로(예제 9의 값: 지각 6.0 km/s, 두께 24 km, 맨틀 8.0 km/s). 아래: 두 파의 주시 곡선. 굴절파 직선을 거리 0까지 연장해 세로축과 만나는 시간이 절편 시간이며, 두 직선이 만나는 교차 거리보다 먼 곳에서는 굴절파가 먼저 도착한다. 깊이와 거리는 같은 비율이다.</desc>
  <style>
    .uearth-2-refraction-h{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .uearth-2-refraction-l{font-size:14px;fill:var(--fig-ink)}
    .uearth-2-refraction-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .uearth-2-refraction-s{font-size:13px;fill:var(--fig-muted)}
    .uearth-2-refraction-n{font-size:13px;fill:var(--fig-ink)}
    .uearth-2-refraction-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
  <rect x="80.0" y="40.0" width="600.0" height="57.6" style="fill:var(--fig-soft-green);stroke:none"/>
  <rect x="80.0" y="97.6" width="600.0" height="50.0" style="fill:var(--fig-soft-amber);stroke:none"/>
