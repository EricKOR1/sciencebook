<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="t-pchem-7-electron-diffraction-tube d-pchem-7-electron-diffraction-tube">
  <title id="t-pchem-7-electron-diffraction-tube">그림 물리화학 7-14 전자 회절관의 구성과 회절 기하</title>
  <desc id="d-pchem-7-electron-diffraction-tube">모식도. 필라멘트에서 나온 전자를 양극 전압 V로 가속해 얇은 다결정 흑연 표적에 쏘면, 거리 D인 형광 화면에 동심원 고리 두 개가 생긴다. 회절 빔은 직진 빔과 2θ의 각을 이루고 화면에서 반지름 r인 고리를 만든다. 브래그 조건 λ = 2d sin θ와 작은 각 근사 2θ ≈ r/D에서 λ ≈ dr/D이다. 아래는 흑연 육각 격자의 두 격자면 간격 d1 = 0.213 nm(안쪽 고리)와 d2 = 0.123 nm(바깥 고리)이다.</desc>
