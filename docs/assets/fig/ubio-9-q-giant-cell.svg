<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" class="fig-small" role="img" aria-labelledby="t-ubio-9-q-giant-cell d-ubio-9-q-giant-cell">
<title id="t-ubio-9-q-giant-cell">그림 일반생명과학 9-12 문제 17의 거대 세균 단면</title>
<desc id="d-ubio-9-q-giant-cell">지름 600 μm인 공 모양 거대 세균의 단면 모식도. 세포 가운데의 대부분은 큰 액포이고, 세포질은 세포막 바로 안쪽 두께 2 μm의 얇은 껍질에만 있다. 그림에서는 세포질 층의 두께를 실제보다 두껍게 그렸다.</desc>
<style>.ubio-9-q-giant-cell-t{font-size:14px;fill:var(--fig-ink)} .ubio-9-q-giant-cell-s{font-size:13px;fill:var(--fig-muted)} .ubio-9-q-giant-cell-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .ubio-9-q-giant-cell-b{font-size:14px;font-weight:700;fill:var(--fig-ink)} .ubio-9-q-giant-cell-sup{font-size:11px;fill:var(--fig-ink)}</style>
<circle cx="190.0" cy="170.0" r="130.0" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2.4;"/>
<circle cx="190.0" cy="170.0" r="118.0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.2;"/>
<text x="190.0" y="175.0" text-anchor="middle" class="ubio-9-q-giant-cell-t">액포</text>
<line x1="60.0" y1="320.0" x2="320.0" y2="320.0" style="stroke:var(--fig-ink);stroke-width:1.2;"/>
<line x1="60.0" y1="314.0" x2="60.0" y2="326.0" style="stroke:var(--fig-ink);stroke-width:1.2;"/>
<line x1="320.0" y1="314.0" x2="320.0" y2="326.0" style="stroke:var(--fig-ink);stroke-width:1.2;"/>
<text x="190.0" y="316.0" text-anchor="middle" class="ubio-9-q-giant-cell-s">지름 600 μm</text>
<line x1="292.3" y1="100.0" x2="350.0" y2="70.0" style="stroke:var(--fig-muted);stroke-width:1;"/>
<text x="354.0" y="66.0" text-anchor="start" class="ubio-9-q-giant-cell-t">세포질</text>
<text x="354.0" y="84.0" text-anchor="start" class="ubio-9-q-giant-cell-s">(두께 2 μm)</text>
<line x1="312.1" y1="214.6" x2="350.0" y2="230.0" style="stroke:var(--fig-muted);stroke-width:1;"/>
<text x="354.0" y="235.0" text-anchor="start" class="ubio-9-q-giant-cell-t">세포막</text>
</svg>
