  <text x="530" y="346" text-anchor="middle" class="matter-3-q-no2-tubes-s">색이 진해졌다</text>
  <text x="360" y="30" text-anchor="middle" class="matter-3-q-no2-tubes-l">NO₂(적갈색)와 N₂O₄(무색)가 섞인 기체를 넣고 봉한 같은 유리관 두 개</text>
