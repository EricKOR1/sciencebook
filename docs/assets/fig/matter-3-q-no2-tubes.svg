<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 362" role="img" aria-labelledby="t-matter-3-q-no2-tubes d-matter-3-q-no2-tubes">
  <title id="t-matter-3-q-no2-tubes">그림 물질과 에너지 3-10 문제 16의 실험</title>
  <desc id="d-matter-3-q-no2-tubes">NO₂와 N₂O₄가 섞인 기체를 봉한 유리관 두 개를 각각 얼음물과 뜨거운 물에 넣었더니, 얼음물 속 관은 색이 옅어지고 뜨거운 물 속 관은 색이 진해졌다. 관 속 기체의 색은 관찰한 색의 차이를 나타낸 모식도이다.</desc>
  <style>
    .matter-3-q-no2-tubes-l{font-size:14px;fill:var(--fig-ink)} .matter-3-q-no2-tubes-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .matter-3-q-no2-tubes-s{font-size:13px;fill:var(--fig-muted)} .matter-3-q-no2-tubes-ax{fill:none;stroke:var(--fig-muted);stroke-width:1.4} .matter-3-q-no2-tubes-gr{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4} .matter-3-q-no2-tubes-lv{fill:none;stroke:var(--fig-ink);stroke-width:3;stroke-linecap:round} .matter-3-q-no2-tubes-dash{fill:none;stroke:var(--fig-muted);stroke-width:1.2;stroke-dasharray:5 4}
  </style>
