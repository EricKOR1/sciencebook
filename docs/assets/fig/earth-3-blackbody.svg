    .earth-3-blackbody-sea{fill:var(--fig-soft-blue)}
    .earth-3-blackbody-grat{fill:none;stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3;opacity:0.7}
    .earth-3-blackbody-frame{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .earth-3-blackbody-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
