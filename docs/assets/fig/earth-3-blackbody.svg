<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" role="img" aria-labelledby="t-earth-3-blackbody d-earth-3-blackbody">
  <title id="t-earth-3-blackbody">그림 지구과학 3-6 온도에 따른 흑체 복사 곡선</title>
  <desc id="d-earth-3-blackbody">표면 온도가 4000 K, 5000 K, 6000 K인 흑체의 복사 곡선이다. 온도가 높을수록 가장 강하게 내는 파장이 짧아지고(빈 법칙), 곡선 아래의 넓이인 단위 면적당 총에너지가 온도의 네제곱에 비례해 커진다(슈테판–볼츠만 법칙). 플랑크 식으로 계산한 곡선이다.</desc>
