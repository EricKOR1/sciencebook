<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-umath-8-q-delta-bound-state d-umath-8-q-delta-bound-state">
  <title id="t-umath-8-q-delta-bound-state">그림 수학 도구 8-15 문제 17 해설: 델타 우물의 속박 상태</title>
  <desc id="d-umath-8-q-delta-bound-state">x = 0에 아래로 뻗은 화살표가 델타 우물 V = −gδ(x)이다. 그 위에 ψ(x) = √κ e^(−κ|x|)를 가로축 κx(−4~4)에 그렸다. x = 0에서 왼쪽 기울기는 +κA, 오른쪽 기울기는 −κA로 꺾이며, 기울기 차 −2κA가 −2mgψ(0)/ħ²와 같다. 초록 점선은 에너지 준위 E = −mg²/2ħ²이다(에너지의 세로 위치는 모식적).</desc>
  <style>
    .u8db-ax{stroke:var(--fig-ink);stroke-width:1.4;fill:none}
    .u8db-grid{stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 4;fill:none}
    .u8db-t{font-size:14px;fill:var(--fig-ink)}
    .u8db-s{font-size:13px;fill:var(--fig-muted)}
    .u8db-b{font-size:14px;fill:var(--fig-ink);font-weight:600}
    .u8db-tk{stroke:var(--fig-ink);stroke-width:1.2}
    .u8db-c{stroke:var(--fig-blue);stroke-width:2.6;fill:none}
    .u8db-tg{stroke:var(--fig-red);stroke-width:2.2;fill:none}
    .u8db-r{font-size:13px;fill:var(--fig-red);font-weight:600}
    .u8db-dl{stroke:var(--fig-violet);stroke-width:2.6;fill:none}
    .u8db-dh{fill:var(--fig-violet)}
    .u8db-v{font-size:14px;fill:var(--fig-violet);font-weight:600}
    .u8db-e{stroke:var(--fig-green);stroke-width:1.6;stroke-dasharray:6 4;fill:none}
    .u8db-g{font-size:14px;fill:var(--fig-green);font-weight:600}
    .u8db-bl{font-size:14px;fill:var(--fig-blue);font-weight:600}

  </style>
  <path d="M110 40 L110 240 L610 240" class="u8db-ax"/>
  <line x1="110" y1="240" x2="110" y2="245" class="u8db-tk"/>
  <text x="110" y="259" text-anchor="middle" class="u8db-s">−4</text>
  <line x1="172.5" y1="240" x2="172.5" y2="245" class="u8db-tk"/>
  <text x="172.5" y="259" text-anchor="middle" class="u8db-s">−3</text>
  <line x1="235" y1="240" x2="235" y2="245" class="u8db-tk"/>
  <text x="235" y="259" text-anchor="middle" class="u8db-s">−2</text>
  <line x1="297.5" y1="240" x2="297.5" y2="245" class="u8db-tk"/>
  <text x="297.5" y="259" text-anchor="middle" class="u8db-s">−1</text>
  <line x1="360" y1="240" x2="360" y2="245" class="u8db-tk"/>
  <text x="360" y="259" text-anchor="middle" class="u8db-s">0</text>
  <line x1="422.5" y1="240" x2="422.5" y2="245" class="u8db-tk"/>
  <text x="422.5" y="259" text-anchor="middle" class="u8db-s">1</text>
  <line x1="485" y1="240" x2="485" y2="245" class="u8db-tk"/>
  <text x="485" y="259" text-anchor="middle" class="u8db-s">2</text>
  <line x1="547.5" y1="240" x2="547.5" y2="245" class="u8db-tk"/>
  <text x="547.5" y="259" text-anchor="middle" class="u8db-s">3</text>
  <line x1="610" y1="240" x2="610" y2="245" class="u8db-tk"/>
  <text x="610" y="259" text-anchor="middle" class="u8db-s">4</text>
  <line x1="105" y1="240" x2="110" y2="240" class="u8db-tk"/>
  <text x="102" y="244.5" text-anchor="end" class="u8db-s">0</text>
  <line x1="105" y1="153" x2="110" y2="153" class="u8db-tk"/>
  <text x="102" y="157.5" text-anchor="end" class="u8db-s">0.5</text>
  <line x1="105" y1="66.1" x2="110" y2="66.1" class="u8db-tk"/>
  <text x="102" y="70.6" text-anchor="end" class="u8db-s">1</text>
  <text x="66" y="140" text-anchor="middle" transform="rotate(-90 66 140)" class="u8db-t">ψ / A</text>
  <text x="618" y="245" text-anchor="start" class="u8db-t">κx</text>
  <path d="M110 236.8 L140 234.9 L165.6 232.2 L188.1 228.9 L208.1 224.7 L226.2 219.5 L235 216.5 L243.1 213.2 L258.1 205.9 L265.6 201.6 L272.5 197.1 L279.4 192.1 L286.2 186.6 L292.5 180.9 L298.8 174.7 L305 167.9 L310.6 161.1 L321.2 146.4 L331.9 129.1 L341.9 109.9 L351.2 88.8 L360 66.1 L368.8 88.8 L378.1 109.9 L388.1 129.1 L398.8 146.4 L409.4 161.1 L415 167.9 L421.2 174.7 L427.5 180.9 L433.8 186.6 L440.6 192.1 L447.5 197.1 L454.4 201.6 L461.9 205.9 L476.9 213.2 L485 216.5 L493.8 219.5 L511.9 224.7 L531.9 228.9 L554.4 232.2 L580 234.9 L610 236.8" class="u8db-c"/>
  <path d="M360 66.1 L313.1 196.5" class="u8db-tg"/>
  <path d="M360 66.1 L406.9 196.5" class="u8db-tg"/>
  <text x="306.9" y="181.8" text-anchor="end" class="u8db-r">왼쪽 기울기 +κA</text>
  <text x="413.1" y="181.8" class="u8db-r">오른쪽 기울기 −κA</text>
  <text x="360" y="26" text-anchor="middle" class="u8db-r">기울기 차 = −2κA = −2mg ψ(0)/ħ²</text>
  <text x="478.8" y="161.7" class="u8db-bl">ψ(x) = √κ e^(−κ|x|)</text>
  <line x1="360" y1="240" x2="360" y2="360" class="u8db-dl"/>
  <path d="M360 370 L355.9 359.8 L364.1 359.8 Z" class="u8db-dh"/>
  <text x="370" y="368" class="u8db-v">V = −gδ(x)</text>
  <line x1="110" y1="312" x2="610" y2="312" class="u8db-e"/>
  <text x="110" y="304" class="u8db-g">E = −mg²/2ħ²</text>
  <text x="104" y="244" text-anchor="end" class="u8db-s">V = 0, E = 0</text>
  <text x="610" y="304" text-anchor="end" class="u8db-s">속박 상태 1개</text>
</svg>
