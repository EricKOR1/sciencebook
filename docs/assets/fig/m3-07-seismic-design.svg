  <title id="t-m3-07-seismic-design">그림 중3-7-7 내진·제진·면진 설계</title>
  <desc id="d-m3-07-seismic-design">내진 설계는 기둥과 벽, 버팀대를 튼튼하게 하여 흔들림을 견딘다. 제진 설계는 건물 안에 흔들림 에너지를 흡수하는 장치(감쇠 장치)를 넣는다. 면진 설계는 땅과 건물 사이에 고무 받침 같은 장치를 넣어 땅의 흔들림이 건물에 덜 전달되게 한다. 구조를 단순하게 나타낸 모식도이다.</desc>
