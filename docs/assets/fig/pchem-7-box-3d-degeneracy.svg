<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="t-pchem-7-box-3d-degeneracy d-pchem-7-box-3d-degeneracy">
  <title id="t-pchem-7-box-3d-degeneracy">그림 물리화학 7-12 정육면체 상자와 늘인 상자의 에너지 준위</title>
  <desc id="d-pchem-7-box-3d-degeneracy">왼쪽은 정육면체(a = b = c) 상자의 준위 n_x² + n_y² + n_z² = 3, 6, 9, 11, 12, 14(짧은 가로선 수가 축퇴도 g), 오른쪽은 z 방향으로 10 % 늘인 상자(c = 1.10a)의 준위 E = n_x² + n_y² + n_z²/1.21(단위 h²/8ma²)로, E ≤ 15인 것을 모두 그렸다. 점선은 대응하는 준위를 잇는다. 6의 삼중 축퇴는 (1,1,2)의 5.31과 (2,1,1)·(1,2,1)의 5.83으로 1 + 2로 갈라지고, 남은 이중 축퇴는 x–y 정사각형 대칭에서 나온다.</desc>
