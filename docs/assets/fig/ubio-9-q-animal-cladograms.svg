<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-ubio-9-q-animal-cladograms d-ubio-9-q-animal-cladograms">
<title id="t-ubio-9-q-animal-cladograms">그림 일반생명과학 9-11 문제 14 해설의 두 분기도</title>
<desc id="d-ubio-9-q-animal-cladograms">(1) 체제 형질만으로 그린 분기도: 각 형질이 한 번씩 생겼다고 보면 ①~④가 차례로 줄기 위에 놓인다. (2) 분자 계통: 플라나리아와 지렁이가 촉수담륜동물로 묶이면, 진체강은 좌우 대칭 동물의 조상에서 생긴 뒤 플라나리아 계통에서 사라졌거나(그림의 ×), 지렁이 계통과 불가사리 계통에서 따로 생겼다고 해석해야 한다.</desc>
<style>.ubio-9-q-animal-cladograms-t{font-size:14px;fill:var(--fig-ink)} .ubio-9-q-animal-cladograms-s{font-size:13px;fill:var(--fig-muted)} .ubio-9-q-animal-cladograms-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .ubio-9-q-animal-cladograms-b{font-size:14px;font-weight:700;fill:var(--fig-ink)} .ubio-9-q-animal-cladograms-sup{font-size:11px;fill:var(--fig-ink)}</style>
<text x="360.0" y="326.0" text-anchor="middle" class="ubio-9-q-animal-cladograms-s">① 진정한 조직  ② 3배엽(좌우 대칭)  ③ 진체강  ④ 원구가 항문이 됨</text>
<text x="20.0" y="30.0" text-anchor="start" class="ubio-9-q-animal-cladograms-h">(1) 형질 행렬로 그린 분기도</text>
