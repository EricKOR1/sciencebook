<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-uchem-1-chlorine-mass-spectrum d-uchem-1-chlorine-mass-spectrum">
  <title id="t-uchem-1-chlorine-mass-spectrum">그림 일반화학 1-3 질량 분석기와 염소의 질량 스펙트럼</title>
  <desc id="d-uchem-1-chlorine-mass-spectrum">왼쪽: 이온화한 염소 원자를 가속해 자기장에 들여보내면 가벼운 ³⁵Cl⁺는 작은 반원, 무거운 ³⁷Cl⁺는 큰 반원을 그려 검출기의 다른 자리에 닿는다(간격은 과장한 모식도). 오른쪽: 검출된 세기를 질량 대 전하 비(m/z)에 대해 그린 스펙트럼. 막대 높이가 존재 비율(75.76 %, 24.24 %)이고, 가중 평균 35.45는 두 막대 사이에서 큰 막대 쪽에 있다.</desc>
