<title id="t-uearth-6-q-bay-dike">그림 일반지구과학 6-17 문제 18의 만과 방조제(세로 단면)</title>
<desc id="d-uearth-6-q-bay-dike">한쪽은 바다로 열리고 한쪽은 막힌 평균 수심 40 m의 긴 만이다. 원래 길이는 220 km이고, 입구에서 150 km 지점에 방조제를 쌓았다. 수심은 크게 과장했다.</desc>
