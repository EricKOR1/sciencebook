<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-mech-3-spring-oscillator d-mech-3-spring-oscillator">
  <title id="t-mech-3-spring-oscillator">그림 역학과 에너지 3-2 용수철 진자의 위치에 따른 속도·가속도와 시간 그래프</title>
  <desc id="d-mech-3-spring-oscillator">(가) 마찰 없는 수평면의 용수철 진자에서 양 끝(x = ±A)에서는 속도가 0이고 가속도(복원력)가 가장 크며 평형 위치를 향한다. 평형 위치(x = 0)에서는 속력이 가장 크고 가속도는 0이다. (나) 변위 x, 속도 v, 가속도 a를 시간에 따라 그리면 a의 그래프는 x의 그래프를 뒤집은 모양(a = −ω²x)이다.</desc>
