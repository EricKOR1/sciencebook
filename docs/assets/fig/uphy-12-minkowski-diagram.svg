<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uphy-12-minkowski-diagram d-uphy-12-minkowski-diagram">
  <title id="t-uphy-12-minkowski-diagram">그림 일반물리학 12-2 시공간 도표 — 움직이는 기준틀의 축과 동시성</title>
  <desc id="d-uphy-12-minkowski-diagram">가로축이 x, 세로축이 ct인 기준틀 S의 시공간 도표에 S에 대해 +x 방향으로 v = 0.5c로 움직이는 기준틀 S′의 축을 겹쳐 그렸다. S′의 원점은 x = βct 위를 움직이므로 이것이 ct′축이고, ct′ = 0인 사건들은 ct = βx 위에 있으므로 이것이 x′축이다. 두 축은 빛의 세계선(x = ct, 45°)을 사이에 두고 같은 각만큼 기울어진다. x′축과 나란한 선 위의 사건 A와 B는 S′에서 동시이지만, S에서는 B가 A보다 늦게 일어난다.</desc>
  <style>
    .u12m-t{font-size:14px;fill:var(--fig-ink)} .u12m-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .u12m-s{font-size:13px;fill:var(--fig-muted)} .u12m-sm{font-size:13px;fill:var(--fig-ink)}
    .u12m-h{font-size:15px;font-weight:600;fill:var(--fig-ink)}
  </style>
