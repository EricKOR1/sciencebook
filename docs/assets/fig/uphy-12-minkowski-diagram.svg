<text x="492.0" y="274.0" class="u12m-sm">β = v/c = 0.5로 그림</text>
<text x="492.0" y="294.0" class="u12m-s">S′의 축은 빛의 선 쪽으로 같은 각만큼</text>
<text x="492.0" y="314.0" class="u12m-s">기울어진다(β → 1이면 빛의 선에 붙음)</text>
<text x="492.0" y="334.0" class="u12m-sm">A, B: S′에서 동시(Δt′ = 0)</text>
<text x="492.0" y="354.0" class="u12m-sm">S에서는 B가 늦다: Δt = γvΔx′/c²</text>
<text x="492.0" y="374.0" class="u12m-s">단위: ct와 x를 같은 길이 단위로</text>
</svg>
