<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" role="img" aria-labelledby="t-ubio-1-nucleotide d-ubio-1-nucleotide">
  <title id="t-ubio-1-nucleotide">그림 일반생명과학 1-11 뉴클레오타이드와 역평행 DNA 이중 가닥</title>
  <desc id="d-ubio-1-nucleotide">왼쪽: 뉴클레오타이드는 5탄당의 1′ 탄소에 염기, 5′ 탄소에 인산기가 붙어 있고, 디옥시리보스는 2′ 탄소에 –OH 대신 –H를 가진다. 오른쪽: 한 뉴클레오타이드의 3′ –OH와 다음 뉴클레오타이드의 5′ 인산이 인산다이에스터 결합을 만들어 당–인산 뼈대가 된다. 두 가닥은 방향이 반대(역평행)이고, 퓨린(A, G, 큰 상자)과 피리미딘(T, C, 작은 상자)이 짝을 지어 폭이 일정하며 A–T는 수소 결합 2개, G–C는 3개(점선)이다. 모식도이다.</desc>
