<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 446" role="img" aria-labelledby="t-matter-3-q-hydrogenation-hess d-matter-3-q-hydrogenation-hess">
  <title id="t-matter-3-q-hydrogenation-hess">그림 물질과 에너지 3-8 문제 12의 엔탈피 경로</title>
  <desc id="d-matter-3-q-hydrogenation-hess">에텐과 수소가 에테인이 되는 반응(목표)은 (가)와 (나)로 내려간 뒤 (다)를 거꾸로 올라오는 경로와 출발·도착 층이 같다. 따라서 ΔH = (−1411) + (−285.8) + 1560 = −136.8 kJ이다. 층의 높이 차는 값에 비례하게 그렸다.</desc>
  <style>
    .matter-3-q-hydrogenation-hess-l{font-size:14px;fill:var(--fig-ink)} .matter-3-q-hydrogenation-hess-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .matter-3-q-hydrogenation-hess-s{font-size:13px;fill:var(--fig-muted)} .matter-3-q-hydrogenation-hess-ax{fill:none;stroke:var(--fig-muted);stroke-width:1.4} .matter-3-q-hydrogenation-hess-gr{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4} .matter-3-q-hydrogenation-hess-lv{fill:none;stroke:var(--fig-ink);stroke-width:3;stroke-linecap:round} .matter-3-q-hydrogenation-hess-dash{fill:none;stroke:var(--fig-muted);stroke-width:1.2;stroke-dasharray:5 4}
  </style>
  <line x1="40" y1="400" x2="40" y2="28" class="matter-3-q-hydrogenation-hess-ax"/>
  <path d="M40 20 l-5 10 l10 0 z" style="fill:var(--fig-muted)"/>
  <text x="50" y="30" class="matter-3-q-hydrogenation-hess-s">엔탈피 H</text>
  <line x1="70" y1="70" x2="470" y2="70" class="matter-3-q-hydrogenation-hess-lv"/>
  <text x="70" y="58" class="matter-3-q-hydrogenation-hess-b">C₂H₄(g) + H₂(g) + 7/2 O₂(g)</text>
  <line x1="440" y1="94.2" x2="700" y2="94.2" class="matter-3-q-hydrogenation-hess-lv"/>
  <text x="700" y="116.2" text-anchor="end" class="matter-3-q-hydrogenation-hess-b">C₂H₆(g) + 7/2 O₂(g)</text>
  <line x1="70" y1="319.5" x2="330" y2="319.5" class="matter-3-q-hydrogenation-hess-lv"/>
  <text x="165" y="309.5" class="matter-3-q-hydrogenation-hess-b">2CO₂(g) + 2H₂O(l) + H₂(g) + ½O₂(g)</text>
  <line x1="70" y1="370" x2="700" y2="370" class="matter-3-q-hydrogenation-hess-lv"/>
  <text x="70" y="394" class="matter-3-q-hydrogenation-hess-b">2CO₂(g) + 3H₂O(l)</text>
  <line x1="150" y1="73" x2="150" y2="306.5" style="stroke:var(--fig-blue);stroke-width:2.6"/>
  <path d="M150 317.5 L144.5 306.5 L155.5 306.5 Z" style="fill:var(--fig-blue)"/>
  <text x="162" y="185" class="matter-3-q-hydrogenation-hess-l" style="font-weight:700;fill:var(--fig-blue)">(가) 그대로</text>
  <text x="162" y="204" class="matter-3-q-hydrogenation-hess-l">−1411 kJ</text>
  <line x1="290" y1="322.5" x2="290" y2="357" style="stroke:var(--fig-blue);stroke-width:2.6"/>
  <path d="M290 368 L284.5 357 L295.5 357 Z" style="fill:var(--fig-blue)"/>
  <text x="302" y="351.5" class="matter-3-q-hydrogenation-hess-l" style="fill:var(--fig-blue)">(나) 그대로  −285.8 kJ</text>
  <line x1="500" y1="367" x2="500" y2="108.2" style="stroke:var(--fig-red);stroke-width:2.6"/>
  <path d="M500 97.2 L505.5 108.2 L494.5 108.2 Z" style="fill:var(--fig-red)"/>
  <text x="512" y="220" class="matter-3-q-hydrogenation-hess-l" style="font-weight:700;fill:var(--fig-red)">(다)를 거꾸로</text>
  <text x="512" y="239" class="matter-3-q-hydrogenation-hess-l">+1560 kJ</text>
  <line x1="455" y1="72" x2="455" y2="84.2" style="stroke:var(--fig-green);stroke-width:2.4"/>
  <path d="M455 93.2 L450.5 84.2 L459.5 84.2 Z" style="fill:var(--fig-green)"/>
  <text x="440" y="114.2" text-anchor="end" class="matter-3-q-hydrogenation-hess-l" style="font-weight:700;fill:var(--fig-green)">목표 반응 ΔH = −136.8 kJ</text>
  <text x="360" y="432" text-anchor="middle" class="matter-3-q-hydrogenation-hess-s">내려온 높이 1411 + 285.8 에서 올라간 높이 1560 을 빼면 목표 반응의 ΔH 가 된다 (높이 차는 값에 비례)</text>
</svg>
