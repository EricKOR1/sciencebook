<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-m3-06-agar-cubes d-m3-06-agar-cubes">
  <title id="t-m3-06-agar-cubes">그림 중3-6-1 한천 조각 모형 — 조각이 클수록 물든 비율이 작다</title>
  <desc id="d-m3-06-agar-cubes">페놀프탈레인을 섞은 한천 정육면체(한 변 1 cm, 2 cm, 3 cm)를 수산화 나트륨 용액에 담그면 모든 조각이 겉에서 0.5 cm 깊이까지 붉게 물든다. 가운데를 자른 단면을 보면 조각이 클수록 물들지 않은 가운데 부분이 커서, 물든 부분의 비율이 100 %, 87.5 %, 약 70.4 %로 작아진다. 부피에 대한 표면적의 비도 6, 3, 2로 작아진다.</desc>
  <style>
    .m3-06-agar-cubes-lbl{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .m3-06-agar-cubes-tx{font-size:14px;fill:var(--fig-ink)}
    .m3-06-agar-cubes-sm{font-size:13px;fill:var(--fig-muted)}
  </style>
  <text x="360.0" y="30.0" text-anchor="middle" class="m3-06-agar-cubes-sm">조각을 가운데로 자른 단면 (물질은 겉에서 안쪽으로 0.5 cm까지 들어갔다)</text>
  <rect x="80.0" y="190.0" width="60.0" height="60.0" style="fill:var(--fig-red);stroke:var(--fig-ink);stroke-width:1.5"/>
  <text x="110.0" y="178.0" text-anchor="middle" class="m3-06-agar-cubes-lbl">한 변 1 cm</text>
  <text x="110.0" y="278.0" text-anchor="middle" class="m3-06-agar-cubes-tx">물든 부분 100 %</text>
  <text x="110.0" y="300.0" text-anchor="middle" class="m3-06-agar-cubes-sm">표면적/부피 = 6</text>
  <rect x="260.0" y="130.0" width="120.0" height="120.0" style="fill:var(--fig-red);stroke:var(--fig-ink);stroke-width:1.5"/>
  <rect x="290.0" y="160.0" width="60.0" height="60.0" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 3"/>
  <text x="320.0" y="195.0" text-anchor="middle" class="m3-06-agar-cubes-sm">물들지 않음</text>
  <text x="320.0" y="118.0" text-anchor="middle" class="m3-06-agar-cubes-lbl">한 변 2 cm</text>
  <text x="320.0" y="278.0" text-anchor="middle" class="m3-06-agar-cubes-tx">물든 부분 87.5 %</text>
  <text x="320.0" y="300.0" text-anchor="middle" class="m3-06-agar-cubes-sm">표면적/부피 = 3</text>
  <rect x="470.0" y="70.0" width="180.0" height="180.0" style="fill:var(--fig-red);stroke:var(--fig-ink);stroke-width:1.5"/>
  <rect x="500.0" y="100.0" width="120.0" height="120.0" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 3"/>
  <text x="560.0" y="165.0" text-anchor="middle" class="m3-06-agar-cubes-sm">물들지 않음</text>
  <text x="560.0" y="58.0" text-anchor="middle" class="m3-06-agar-cubes-lbl">한 변 3 cm</text>
  <line x1="470.0" y1="160.0" x2="500.0" y2="160.0" style="stroke:var(--fig-ink);stroke-width:1.5"/>
  <line x1="470.0" y1="154.0" x2="470.0" y2="166.0" style="stroke:var(--fig-ink);stroke-width:1.5"/>
  <line x1="500.0" y1="154.0" x2="500.0" y2="166.0" style="stroke:var(--fig-ink);stroke-width:1.5"/>
  <line x1="466.0" y1="160.0" x2="468.0" y2="160.0" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="462.0" y="165.0" text-anchor="end" class="m3-06-agar-cubes-sm">0.5 cm</text>
  <text x="560.0" y="278.0" text-anchor="middle" class="m3-06-agar-cubes-tx">물든 부분 약 70.4 %</text>
  <text x="560.0" y="300.0" text-anchor="middle" class="m3-06-agar-cubes-sm">표면적/부피 = 2</text>
  <rect x="150.0" y="310.0" width="16.0" height="16.0" style="fill:var(--fig-red);stroke:var(--fig-ink);stroke-width:1"/>
  <text x="174.0" y="323.0" class="m3-06-agar-cubes-sm">붉게 물든 부분 (물질이 닿은 곳)</text>
  <rect x="420.0" y="310.0" width="16.0" height="16.0" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1"/>
  <text x="444.0" y="323.0" class="m3-06-agar-cubes-sm">물질이 닿지 못한 부분</text>
</svg>
