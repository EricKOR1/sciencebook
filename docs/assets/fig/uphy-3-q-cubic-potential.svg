<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-uphy-3-q-cubic-potential d-uphy-3-q-cubic-potential">
  <title id="t-uphy-3-q-cubic-potential">그림 일반물리학 3-10 문제 6 해설: U(x) = 3x² − x³의 퍼텐셜 에너지 곡선</title>
  <desc id="d-uphy-3-q-cubic-potential">x = 0은 극소(안정 평형, U = 0), x = 2.0 m는 극대(불안정 평형, U = 4.0 J)이다. x = 1.0 m에서 곡선의 기울기는 3.0 J/m이므로 힘은 −3.0 N, 곧 x = 0 쪽을 향한다. x = 0 근처의 입자가 x &gt; 2인 영역으로 빠져나가려면 역학적 에너지가 장벽 높이 4.0 J보다 커야 한다.</desc>
