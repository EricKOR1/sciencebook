<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-ubio-3-thylakoid d-ubio-3-thylakoid">
  <title id="t-ubio-3-thylakoid">그림 일반생명과학 3-8 틸라코이드 막에서 일어나는 명반응의 배치</title>
  <desc id="d-ubio-3-thylakoid">틸라코이드 막에 광계 Ⅱ, 플라스토퀴논(PQ), 사이토크롬 b₆f 복합체, 플라스토사이아닌(PC), 광계 Ⅰ, 페레독신(Fd)과 NADP⁺ 환원 효소, ATP 합성 효소가 놓여 있다. 광계 Ⅱ에서 물이 분해되어 O₂가 나오고 H⁺이 틸라코이드 내부에 남으며, b₆f 복합체가 스트로마의 H⁺을 내부로 옮긴다. 전자는 광계 Ⅰ을 거쳐 스트로마 쪽에서 NADP⁺를 NADPH로 환원한다. 내부(pH 약 5)에 쌓인 H⁺이 ATP 합성 효소를 지나 스트로마(pH 약 8)로 나오며 ATP를 만든다. 점선은 순환 전자 흐름이다. 모식도이다.</desc>
  <defs><marker id="ubio-3-thylakoid-a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-ink)"/></marker><marker id="ubio-3-thylakoid-a-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-muted)"/></marker><marker id="ubio-3-thylakoid-a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-blue)"/></marker><marker id="ubio-3-thylakoid-a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-red)"/></marker><marker id="ubio-3-thylakoid-a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-green)"/></marker><marker id="ubio-3-thylakoid-a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-amber)"/></marker><marker id="ubio-3-thylakoid-a-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-violet)"/></marker><marker id="ubio-3-thylakoid-a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-teal)"/></marker><marker id="ubio-3-thylakoid-a-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-line)"/></marker></defs>
  <style>.ubio-3-thylakoid-t{font-size:14px;fill:var(--fig-ink)} .ubio-3-thylakoid-s{font-size:13px;fill:var(--fig-muted)} .ubio-3-thylakoid-b{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-3-thylakoid-k{font-size:13px;fill:var(--fig-ink)} .ubio-3-thylakoid-ink{font-size:13px;fill:var(--fig-ink);font-weight:700} .ubio-3-thylakoid-muted{font-size:13px;fill:var(--fig-muted);font-weight:700} .ubio-3-thylakoid-blue{font-size:13px;fill:var(--fig-blue);font-weight:700} .ubio-3-thylakoid-red{font-size:13px;fill:var(--fig-red);font-weight:700} .ubio-3-thylakoid-green{font-size:13px;fill:var(--fig-green);font-weight:700} .ubio-3-thylakoid-amber{font-size:13px;fill:var(--fig-amber);font-weight:700} .ubio-3-thylakoid-violet{font-size:13px;fill:var(--fig-violet);font-weight:700} .ubio-3-thylakoid-teal{font-size:13px;fill:var(--fig-teal);font-weight:700} .ubio-3-thylakoid-line{font-size:13px;fill:var(--fig-line);font-weight:700}</style>
