<text x="446.0" y="360.0" class="chem-3-conc-rate-graphs-b">그래프에서 읽을 것</text>
<text x="446.0" y="382.0" class="chem-3-conc-rate-graphs-t">① 평형 전: 정반응 속도는 줄고</text>
