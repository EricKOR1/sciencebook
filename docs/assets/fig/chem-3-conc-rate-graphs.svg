<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 625" role="img" aria-labelledby="t-chem-3-conc-rate-graphs d-chem-3-conc-rate-graphs">
  <title id="t-chem-3-conc-rate-graphs">그림 화학 3-3 평형에 이르는 동안의 농도와 반응 속도 변화</title>
  <desc id="d-chem-3-conc-rate-graphs">1 L 용기에 N₂O₄ 1.0 M을 넣으면 N₂O₄는 줄고 NO₂는 늘다가 각각 0.8 M, 0.4 M에서 일정해진다. 이 동안 정반응 속도는 줄고 역반응 속도는 늘어 두 속도가 같아진다. NO₂ 2.0 M에서 출발해도 같은 평형 농도에 이른다. 시간과 속도는 상대값으로 나타낸 모식도이다.</desc>
