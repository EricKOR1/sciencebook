  <title id="t-uchem-5-q-mo-b2-c2">그림 일반화학 5-12 문제 8 해설 — 두 에너지 순서로 채운 B₂와 C₂</title>
  <desc id="d-uchem-5-q-mo-b2-c2">원자가 분자 오비탈만 나타냈다. (가) s–p 혼합이 없는 순서에서는 B₂(전자 6개)가 홀전자 0개, C₂(전자 8개)가 홀전자 2개이다. (나) s–p 혼합이 있는 순서에서는 B₂가 홀전자 2개, C₂가 홀전자 0개로 실험(B₂ 상자기성, C₂ 반자기성)과 맞는다. 에너지 간격은 모식이다.</desc>
