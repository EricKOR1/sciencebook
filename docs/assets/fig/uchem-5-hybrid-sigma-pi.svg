<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="t-uchem-5-hybrid-sigma-pi d-uchem-5-hybrid-sigma-pi">
  <title id="t-uchem-5-hybrid-sigma-pi">그림 일반화학 5-8 혼성 오비탈의 배치와 에텐의 σ·π 결합</title>
  <desc id="d-uchem-5-hybrid-sigma-pi">위: s 오비탈 하나와 p 오비탈 몇 개를 섞어 만든 sp(직선 180°), sp²(평면 삼각형 120°), sp³(사면체 109.5°) 혼성 오비탈. 혼성에 쓰이지 않은 p 오비탈(주황)은 그대로 남는다. 아래: 에텐에서 sp² 혼성 오비탈끼리, 또는 H의 1s와 머리를 맞대고 겹쳐 σ 결합을 만들고, 남은 2p 오비탈이 분자 평면 위아래에서 옆으로 겹쳐 π 결합을 만든다. 모식도이다.</desc>
  <style>
    .uchem-5-hy-lobe{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6}
    .uchem-5-hy-back{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.2}
    .uchem-5-hy-pp{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4}
    .uchem-5-hy-pn{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.4}
    .uchem-5-hy-pi{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.6;opacity:0.9}
    .uchem-5-hy-nuc{fill:var(--fig-ink)}
    .uchem-5-hy-bd{stroke:var(--fig-ink);stroke-width:2.6;fill:none}
    .uchem-5-hy-h{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.4}
    .uchem-5-hy-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-5-hy-b{font-weight:600}
    .uchem-5-hy-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-5-hy-arc{stroke:var(--fig-muted);stroke-width:1;fill:none;stroke-dasharray:3 3}
  </style>
  <g transform="translate(120 128) rotate(-90)"><path d="M0 0 C 6.6 -11.1, 41.8 -11.1, 44 0 C 41.8 11.1, 6.6 11.1, 0 0 Z" class="uchem-5-hy-pp"/><path d="M0 0 C 6.6 -11.1, 41.8 -11.1, 44 0 C 41.8 11.1, 6.6 11.1, 0 0 Z" class="uchem-5-hy-pn" transform="rotate(180)"/></g>
  <g transform="translate(120 128) rotate(-35)"><path d="M0 0 C 3.3 -10.1, 20.9 -10.1, 22 0 C 20.9 10.1, 3.3 10.1, 0 0 Z" class="uchem-5-hy-pp"/><path d="M0 0 C 3.3 -10.1, 20.9 -10.1, 22 0 C 20.9 10.1, 3.3 10.1, 0 0 Z" class="uchem-5-hy-pn" transform="rotate(180)"/></g>
  <g transform="translate(120 128) rotate(0)"><path d="M0 0 C -5 -8.1, -16.1 -8.7, -17.4 0 C -16.1 8.7, -5 8.1, 0 0 Z" class="uchem-5-hy-back" style="opacity:0.6"/><path d="M0 0 C 12.4 -18.6, 55.8 -22.3, 62 0 C 55.8 22.3, 12.4 18.6, 0 0 Z" class="uchem-5-hy-lobe"/></g>
  <g transform="translate(120 128) rotate(180)"><path d="M0 0 C -5 -8.1, -16.1 -8.7, -17.4 0 C -16.1 8.7, -5 8.1, 0 0 Z" class="uchem-5-hy-back" style="opacity:0.6"/><path d="M0 0 C 12.4 -18.6, 55.8 -22.3, 62 0 C 55.8 22.3, 12.4 18.6, 0 0 Z" class="uchem-5-hy-lobe"/></g>
  <circle cx="120" cy="128" r="3.5" class="uchem-5-hy-nuc"/>
  <text x="120" y="36" text-anchor="middle" class="uchem-5-hy-t uchem-5-hy-b">sp</text>
  <text x="120" y="216" text-anchor="middle" class="uchem-5-hy-t">s 1 + p 1 → 2개, 180°</text>
  <text x="120" y="234" text-anchor="middle" class="uchem-5-hy-s">남는 p 2개(서로 수직)</text>
  <ellipse cx="360" cy="128" rx="92" ry="34" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1;stroke-dasharray:4 3;opacity:0.7"/>
  <g transform="translate(360 128) rotate(0)"><path d="M0 0 C -5.1 -8.3, -16.6 -9, -17.9 0 C -16.6 9, -5.1 8.3, 0 0 Z" class="uchem-5-hy-back" style="opacity:0.6"/><path d="M0 0 C 12.8 -19.2, 57.6 -23, 64 0 C 57.6 23, 12.8 19.2, 0 0 Z" class="uchem-5-hy-lobe"/></g>
  <g transform="translate(360 128) rotate(144)"><path d="M0 0 C -5.1 -8.3, -16.6 -9, -17.9 0 C -16.6 9, -5.1 8.3, 0 0 Z" class="uchem-5-hy-back" style="opacity:0.6"/><path d="M0 0 C 7.9 -19.2, 35.6 -23, 39.6 0 C 35.6 23, 7.9 19.2, 0 0 Z" class="uchem-5-hy-lobe"/></g>
  <g transform="translate(360 128) rotate(-144)"><path d="M0 0 C -5.1 -8.3, -16.6 -9, -17.9 0 C -16.6 9, -5.1 8.3, 0 0 Z" class="uchem-5-hy-back" style="opacity:0.6"/><path d="M0 0 C 7.9 -19.2, 35.6 -23, 39.6 0 C 35.6 23, 7.9 19.2, 0 0 Z" class="uchem-5-hy-lobe"/></g>
  <g transform="translate(360 128) rotate(-90)"><path d="M0 0 C 6.9 -11.6, 43.7 -11.6, 46 0 C 43.7 11.6, 6.9 11.6, 0 0 Z" class="uchem-5-hy-pp"/><path d="M0 0 C 6.9 -11.6, 43.7 -11.6, 46 0 C 43.7 11.6, 6.9 11.6, 0 0 Z" class="uchem-5-hy-pn" transform="rotate(180)"/></g>
  <circle cx="360" cy="128" r="3.5" class="uchem-5-hy-nuc"/>
  <text x="360" y="36" text-anchor="middle" class="uchem-5-hy-t uchem-5-hy-b">sp²</text>
  <text x="360" y="216" text-anchor="middle" class="uchem-5-hy-t">s 1 + p 2 → 3개, 평면 120°</text>
  <text x="360" y="234" text-anchor="middle" class="uchem-5-hy-s">남는 p 1개는 평면에 수직</text>
  <g transform="translate(600 138) rotate(70.5)"><path d="M0 0 C -5.6 -9.1, -18.2 -9.8, -19.6 0 C -18.2 9.8, -5.6 9.1, 0 0 Z" class="uchem-5-hy-back" style="opacity:0.6"/><path d="M0 0 C 7.7 -21, 34.6 -25.2, 38.5 0 C 34.6 25.2, 7.7 21, 0 0 Z" class="uchem-5-hy-lobe"/></g>
  <g transform="translate(600 138) rotate(34.1)"><path d="M0 0 C -5.6 -9.1, -18.2 -9.8, -19.6 0 C -18.2 9.8, -5.6 9.1, 0 0 Z" class="uchem-5-hy-back" style="opacity:0.6"/><path d="M0 0 C 11.2 -21, 50.4 -25.2, 56 0 C 50.4 25.2, 11.2 21, 0 0 Z" class="uchem-5-hy-lobe"/></g>
  <g transform="translate(600 138) rotate(160.7)"><path d="M0 0 C -5.6 -9.1, -18.2 -9.8, -19.6 0 C -18.2 9.8, -5.6 9.1, 0 0 Z" class="uchem-5-hy-back" style="opacity:0.6"/><path d="M0 0 C 12.6 -21, 56.7 -25.2, 63 0 C 56.7 25.2, 12.6 21, 0 0 Z" class="uchem-5-hy-lobe"/></g>
  <g transform="translate(600 138) rotate(-90)"><path d="M0 0 C -5.6 -9.1, -18.2 -9.8, -19.6 0 C -18.2 9.8, -5.6 9.1, 0 0 Z" class="uchem-5-hy-back" style="opacity:0.6"/><path d="M0 0 C 14 -21, 63 -25.2, 70 0 C 63 25.2, 14 21, 0 0 Z" class="uchem-5-hy-lobe"/></g>
  <circle cx="600" cy="138" r="3.5" class="uchem-5-hy-nuc"/>
  <path d="M600 106 A 32 32 0 0 0 570 149" class="uchem-5-hy-arc"/>
  <text x="566" y="114" text-anchor="end" class="uchem-5-hy-s">109.5°</text>
  <text x="600" y="36" text-anchor="middle" class="uchem-5-hy-t uchem-5-hy-b">sp³</text>
  <text x="600" y="216" text-anchor="middle" class="uchem-5-hy-t">s 1 + p 3 → 4개, 사면체 109.5°</text>
  <text x="600" y="234" text-anchor="middle" class="uchem-5-hy-s">남는 p 없음</text>
  <line x1="30" y1="258" x2="690" y2="258" style="stroke:var(--fig-line);stroke-width:1;fill:none"/>
  <text x="40" y="286" class="uchem-5-hy-t uchem-5-hy-b">에텐 C₂H₄: σ 결합 5개 + π 결합 1개</text>
  <ellipse cx="300" cy="388" rx="180" ry="44" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1;stroke-dasharray:4 3;opacity:0.6"/>
  <path d="M228 372 C 226 318, 374 318, 372 372 C 350 358, 250 358, 228 372 Z" class="uchem-5-hy-pi"/>
  <path d="M228 404 C 226 458, 374 458, 372 404 C 350 418, 250 418, 228 404 Z" class="uchem-5-hy-pi" style="fill:var(--fig-soft-red);stroke:var(--fig-red)"/>
  <line x1="250" y1="388" x2="211" y2="416.4" class="uchem-5-hy-bd"/>
  <circle cx="211" cy="416.4" r="11" class="uchem-5-hy-h"/><text x="211" y="421.4" text-anchor="middle" class="uchem-5-hy-t">H</text>
  <line x1="250" y1="388" x2="211" y2="359.6" class="uchem-5-hy-bd"/>
  <circle cx="211" cy="359.6" r="11" class="uchem-5-hy-h"/><text x="211" y="364.6" text-anchor="middle" class="uchem-5-hy-t">H</text>
  <line x1="350" y1="388" x2="389" y2="416.4" class="uchem-5-hy-bd"/>
  <circle cx="389" cy="416.4" r="11" class="uchem-5-hy-h"/><text x="389" y="421.4" text-anchor="middle" class="uchem-5-hy-t">H</text>
  <line x1="350" y1="388" x2="389" y2="359.6" class="uchem-5-hy-bd"/>
  <circle cx="389" cy="359.6" r="11" class="uchem-5-hy-h"/><text x="389" y="364.6" text-anchor="middle" class="uchem-5-hy-t">H</text>
  <line x1="250" y1="388" x2="350" y2="388" class="uchem-5-hy-bd"/>
  <circle cx="250" cy="388" r="13" class="uchem-5-hy-h"/><text x="250" y="393" text-anchor="middle" class="uchem-5-hy-t uchem-5-hy-b">C</text>
  <circle cx="350" cy="388" r="13" class="uchem-5-hy-h"/><text x="350" y="393" text-anchor="middle" class="uchem-5-hy-t uchem-5-hy-b">C</text>
  <line x1="380" y1="340" x2="512" y2="320" style="stroke:var(--fig-amber);stroke-width:1.2;fill:none"/>
  <text x="516" y="316" class="uchem-5-hy-t uchem-5-hy-b" style="fill:var(--fig-amber)">π 결합</text>
  <text x="516" y="334" class="uchem-5-hy-s">남은 2p끼리 옆으로 겹침.</text>
  <text x="516" y="351" class="uchem-5-hy-s">축 위·아래에 전자 밀도, 축 위는 마디</text>
  <line x1="300.0" y1="390" x2="512" y2="398" style="stroke:var(--fig-ink);stroke-width:1.2;fill:none"/>
  <text x="516" y="394" class="uchem-5-hy-t uchem-5-hy-b">σ 결합</text>
  <text x="516" y="412" class="uchem-5-hy-s">sp²–sp², sp²–1s가 결합 축 위에서</text>
  <text x="516" y="429" class="uchem-5-hy-s">머리를 맞대고 겹침</text>
  <text x="516" y="466" class="uchem-5-hy-s">C=C 축을 돌리면 두 p가 어긋나</text>
  <text x="516" y="483" class="uchem-5-hy-s">π 결합이 깨진다 → 회전이 막힘</text>
  <text x="300" y="500" text-anchor="middle" class="uchem-5-hy-s">초록 점선 = 분자 평면(6개 원자가 모두 이 평면 위)</text>
</svg>
