<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 395" role="img" aria-labelledby="t-chem-4-dilution d-chem-4-dilution">
  <title id="t-chem-4-dilution">그림 화학 4-6 희석 전후의 용질 입자 수</title>
  <desc id="d-chem-4-dilution">0.40 M 용액 50 mL에 물을 더해 200 mL로 만들면 용질의 몰수 0.020 mol은 그대로이고 부피만 4배가 되어 몰 농도는 0.10 M이 된다. 입자 수는 모식도이다.</desc>
  <style>
    .chem-4-dilution-t{font-size:14px;fill:var(--fig-ink)} .chem-4-dilution-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .chem-4-dilution-s{font-size:13px;fill:var(--fig-muted)} .chem-4-dilution-ax{stroke:var(--fig-ink);stroke-width:1.4;fill:none}
    .chem-4-dilution-gr{stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4;fill:none;opacity:0.7}
    .chem-4-dilution-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}
    .chem-4-dilution-p{fill:var(--fig-violet)}

  </style>
<rect x="73" y="225" width="164" height="52" style="fill:var(--fig-soft-blue);stroke:none"/><path d="M70 50 L70 280 L240 280 L240 50" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/><circle cx="172.0" cy="257.5" r="7" class="chem-4-dilution-p"/><circle cx="195.7" cy="262.6" r="7" class="chem-4-dilution-p"/><circle cx="90.0" cy="250.6" r="7" class="chem-4-dilution-p"/><circle cx="210.3" cy="241.8" r="7" class="chem-4-dilution-p"/><circle cx="150.7" cy="245.2" r="7" class="chem-4-dilution-p"/><circle cx="124.6" cy="261.9" r="7" class="chem-4-dilution-p"/><circle cx="112.7" cy="239.9" r="7" class="chem-4-dilution-p"/><circle cx="221.1" cy="264.0" r="7" class="chem-4-dilution-p"/><text x="155.0" y="304.0" text-anchor="middle" class="chem-4-dilution-b">희석 전</text><text x="155.0" y="326.0" text-anchor="middle" class="chem-4-dilution-t">0.40 M × 0.050 L</text><text x="155.0" y="348.0" text-anchor="middle" class="chem-4-dilution-s">= 0.020 mol</text>
<rect x="433" y="70" width="214" height="207" style="fill:var(--fig-soft-blue);stroke:none"/><path d="M430 50 L430 280 L650 280 L650 50" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/><circle cx="577.8" cy="92.8" r="7" class="chem-4-dilution-p"/><circle cx="604.3" cy="123.5" r="7" class="chem-4-dilution-p"/><circle cx="567.4" cy="255.4" r="7" class="chem-4-dilution-p"/><circle cx="501.0" cy="249.2" r="7" class="chem-4-dilution-p"/><circle cx="474.1" cy="193.9" r="7" class="chem-4-dilution-p"/><circle cx="523.8" cy="113.0" r="7" class="chem-4-dilution-p"/><circle cx="466.3" cy="152.3" r="7" class="chem-4-dilution-p"/><circle cx="459.5" cy="94.4" r="7" class="chem-4-dilution-p"/><text x="540.0" y="304.0" text-anchor="middle" class="chem-4-dilution-b">희석 후</text><text x="540.0" y="326.0" text-anchor="middle" class="chem-4-dilution-t">0.10 M × 0.200 L</text><text x="540.0" y="348.0" text-anchor="middle" class="chem-4-dilution-s">= 0.020 mol</text>
<line x1="270.0" y1="200.0" x2="388.0" y2="200.0" style="stroke:var(--fig-ink);stroke-width:2.4"/><path d="M400.0 200.0 L388.0 206.6 L388.0 193.4 Z" style="fill:var(--fig-ink)"/>
<text x="335.0" y="185.0" text-anchor="middle" class="chem-4-dilution-s">물을 더해</text>
<text x="335.0" y="222.0" text-anchor="middle" class="chem-4-dilution-s">부피 4배</text>
<text x="360.0" y="30.0" text-anchor="middle" class="chem-4-dilution-b">M₁V₁ = M₂V₂ — 용질 입자 수(몰수)는 그대로, 부피만 커진다</text>
<text x="60.0" y="380.0" class="chem-4-dilution-s">입자 8개는 같은 몰수(0.020 mol)를 뜻하는 모식도. 부피가 4배가 되면 몰 농도는 4분의 1</text>
</svg>
