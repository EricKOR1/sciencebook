<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-ubio-5-q-three-point-map d-ubio-5-q-three-point-map">
  <title id="t-ubio-5-q-three-point-map">그림 일반생명과학 5-14 문제 11 해설: 어버이 염색체와 교차 구간</title>
  <desc id="d-ubio-5-q-three-point-map">어버이 염색체는 x⁺ y⁺ z와 x y z⁺이고 y가 가운데이다. 구간 Ⅰ(x–y)의 교차형은 248 + 242, 구간 Ⅱ(y–z)는 46 + 44, 이중 교차형 6 + 4는 두 구간에 모두 더한다. 그래서 x–y는 25 cM, y–z는 5 cM이다. 염색체 위 유전자 사이 간격은 거리에 비례하게 그렸다.</desc>
  <style>.ubio-5-q-three-point-map-t{font-size:14px;fill:var(--fig-ink)} .ubio-5-q-three-point-map-s{font-size:13px;fill:var(--fig-muted)} .ubio-5-q-three-point-map-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .ubio-5-q-three-point-map-b{font-size:14px;font-weight:700;fill:var(--fig-ink)} .ubio-5-q-three-point-map-r{font-size:14px;font-weight:700;fill:var(--fig-red)} .ubio-5-q-three-point-map-bl{font-size:14px;font-weight:700;fill:var(--fig-blue)} .ubio-5-q-three-point-map-g{font-size:14px;font-weight:700;fill:var(--fig-green)} .ubio-5-q-three-point-map-a{font-size:14px;font-weight:700;fill:var(--fig-amber)} .ubio-5-q-three-point-map-v{font-size:14px;font-weight:700;fill:var(--fig-violet)} .ubio-5-q-three-point-map-sq{font-size:15px;font-weight:600;fill:var(--fig-ink)}</style>
  <rect x="90.0" y="63.0" width="580.0" height="14.0" rx="7" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6"/>
  <line x1="140.0" y1="63.0" x2="140.0" y2="77.0" style="stroke:var(--fig-blue);stroke-width:3"/>
  <text x="140.0" y="56.0" text-anchor="middle" class="ubio-5-q-three-point-map-bl">x⁺</text>
  <line x1="540.0" y1="63.0" x2="540.0" y2="77.0" style="stroke:var(--fig-blue);stroke-width:3"/>
  <text x="540.0" y="56.0" text-anchor="middle" class="ubio-5-q-three-point-map-bl">y⁺</text>
  <line x1="620.0" y1="63.0" x2="620.0" y2="77.0" style="stroke:var(--fig-blue);stroke-width:3"/>
  <text x="620.0" y="56.0" text-anchor="middle" class="ubio-5-q-three-point-map-bl">z</text>
  <rect x="90.0" y="113.0" width="580.0" height="14.0" rx="7" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.6"/>
  <line x1="140.0" y1="113.0" x2="140.0" y2="127.0" style="stroke:var(--fig-red);stroke-width:3"/>
  <text x="140.0" y="106.0" text-anchor="middle" class="ubio-5-q-three-point-map-r">x</text>
  <line x1="540.0" y1="113.0" x2="540.0" y2="127.0" style="stroke:var(--fig-red);stroke-width:3"/>
  <text x="540.0" y="106.0" text-anchor="middle" class="ubio-5-q-three-point-map-r">y</text>
  <line x1="620.0" y1="113.0" x2="620.0" y2="127.0" style="stroke:var(--fig-red);stroke-width:3"/>
  <text x="620.0" y="106.0" text-anchor="middle" class="ubio-5-q-three-point-map-r">z⁺</text>
  <line x1="331.0" y1="75.0" x2="349.0" y2="115.0" style="stroke:var(--fig-amber);stroke-width:2.4"/>
  <line x1="349.0" y1="75.0" x2="331.0" y2="115.0" style="stroke:var(--fig-amber);stroke-width:2.4"/>
  <line x1="571.0" y1="75.0" x2="589.0" y2="115.0" style="stroke:var(--fig-amber);stroke-width:2.4"/>
  <line x1="589.0" y1="75.0" x2="571.0" y2="115.0" style="stroke:var(--fig-amber);stroke-width:2.4"/>
  <text x="340.0" y="150.0" text-anchor="middle" class="ubio-5-q-three-point-map-a">구간 Ⅰ</text>
  <text x="580.0" y="150.0" text-anchor="middle" class="ubio-5-q-three-point-map-a">구간 Ⅱ</text>
  <text x="90.0" y="186.0" text-anchor="start" class="ubio-5-q-three-point-map-t">구간 Ⅰ의 교차형: x⁺ y z⁺ 248 + x y⁺ z 242, 이중 교차형 6 + 4 → (500 ÷ 2000) × 100 = 25 cM</text>
  <text x="90.0" y="210.0" text-anchor="start" class="ubio-5-q-three-point-map-t">구간 Ⅱ의 교차형: x⁺ y⁺ z⁺ 46 + x y z 44, 이중 교차형 6 + 4 → (100 ÷ 2000) × 100 = 5 cM</text>
  <text x="90.0" y="234.0" text-anchor="start" class="ubio-5-q-three-point-map-s">이중 교차형(x⁺ y z, x y⁺ z⁺)은 어버이형과 비교해 가운데 유전자 y만 바뀌어 있다.</text>
  <line x1="140.0" y1="270.0" x2="620.0" y2="270.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <line x1="140.0" y1="262.0" x2="140.0" y2="278.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="140.0" y="296.0" text-anchor="middle" class="ubio-5-q-three-point-map-b">x</text>
  <line x1="540.0" y1="262.0" x2="540.0" y2="278.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="540.0" y="296.0" text-anchor="middle" class="ubio-5-q-three-point-map-b">y</text>
  <line x1="620.0" y1="262.0" x2="620.0" y2="278.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="620.0" y="296.0" text-anchor="middle" class="ubio-5-q-three-point-map-b">z</text>
  <text x="340.0" y="262.0" text-anchor="middle" class="ubio-5-q-three-point-map-b">25 cM</text>
  <text x="580.0" y="262.0" text-anchor="middle" class="ubio-5-q-three-point-map-b">5 cM</text>
</svg>
