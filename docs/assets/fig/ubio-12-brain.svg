<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-ubio-12-brain d-ubio-12-brain">
  <title id="t-ubio-12-brain">그림 일반생명과학 12-6 사람 뇌의 구분과 대뇌 겉질의 기능 영역</title>
  <desc id="d-ubio-12-brain">왼쪽: 뇌의 정중 단면. 배아의 전뇌에서 대뇌와 간뇌(시상, 시상하부)가, 중뇌에서 중뇌가, 후뇌에서 뇌교·연수·소뇌가 생긴다. 중뇌·뇌교·연수를 뇌줄기라 한다. 오른쪽: 왼쪽 대뇌 반구의 옆면. 중심 고랑 앞에 운동 겉질, 뒤에 체감각 겉질이 있고, 앞이마엽의 브로카 영역, 관자엽의 청각 겉질과 베르니케 영역, 뒤통수엽의 시각 겉질을 표시했다. 모식도이다.</desc>
