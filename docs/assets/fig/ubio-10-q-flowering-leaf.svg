  <desc id="d-ubio-10-q-flowering-leaf">위: 명 16시간–암 8시간 조건과, 덮개를 씌운 부분이 겪는 명 13시간–암 11시간. 아래: 단일 식물 네 그루의 처리. (가) 처리 없음, (나) 잎 하나에만 덮개, (다) (나)와 같되 그 잎과 줄기 끝 사이의 줄기를 환상 박피, (라) 줄기 끝에만 덮개. 모식도이다.</desc>
