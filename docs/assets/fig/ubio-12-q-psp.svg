<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-ubio-12-q-psp d-ubio-12-q-psp">
  <title id="t-ubio-12-q-psp">그림 일반생명과학 12-10 문제 8의 EPSP와 IPSP</title>
  <desc id="d-ubio-12-q-psp">축삭 둔덕에서 기록한 막전위. 먼저 흥분성 시냅스 하나만, 시간이 지난 뒤 억제성 시냅스 하나만 따로 자극했을 때의 변화이다. 점선은 휴지 전위(−70 mV)와 역치(−55 mV)이고, 가는 눈금선은 1 mV 간격이다.</desc>
