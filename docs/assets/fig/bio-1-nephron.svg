  <title id="t-bio-1-nephron">그림 생명과학1-1 네프론에서 오줌이 만들어지는 과정</title>
  <desc id="d-bio-1-nephron">사구체의 혈액이 보먼주머니로 여과되고, 세뇨관을 지나며 필요한 물질은 모세혈관으로 재흡수되며, 일부 노폐물은 모세혈관에서 세뇨관으로 분비된다. 모식도(크기와 모양은 실제와 다름).</desc>
