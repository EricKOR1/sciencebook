  <text x="14" y="96" class="b1nep-sm">혈액 들어옴</text>
  <line x1="160" y1="128" x2="230" y2="56" class="b1nep-lead"/>
  <text x="234" y="52" class="b1nep-b">사구체</text>
  <text x="234" y="70" class="b1nep-sm">모세혈관이 실뭉치처럼 뭉친 곳</text>
  <line x1="120" y1="74" x2="104" y2="40" class="b1nep-lead"/>
  <text x="40" y="34" class="b1nep-b">보먼주머니</text>
  <text x="300" y="104" class="b1nep-b">세뇨관</text>
  <text x="626" y="200" class="b1nep-b">집합관</text>
  <text x="575" y="388" text-anchor="middle" class="b1nep-sm">오줌 → 콩팥 깔때기</text>
  <text x="300" y="262" class="b1nep-b">세뇨관을 감싼 모세혈관</text>
  <text x="556" y="362" text-anchor="end" class="b1nep-sm">콩팥 정맥 쪽으로</text>
  <text x="14" y="214" class="b1nep-r">① 여과</text>
  <text x="14" y="232" class="b1nep-sm">혈압으로 작은 물질이</text>
  <text x="14" y="282" class="b1nep-sm">원뇨: 물, 포도당, 아미노산,</text>
  <text x="14" y="300" class="b1nep-sm">요소, 무기염류</text>
  <text x="14" y="322" class="b1nep-sm">혈구·단백질은 여과 안 됨</text>
  <text x="258" y="196" class="b1nep-g">② 재흡수</text>
  <text x="258" y="214" class="b1nep-sm">포도당·아미노산 거의 전부, 물·무기염류 대부분</text>
  <text x="500" y="188" class="b1nep-a">③ 분비</text>
  <text x="500" y="206" class="b1nep-sm">남은 노폐물</text>
  <text x="440" y="296" class="b1nep-g">물 재흡수(집합관)</text>
  <text x="300" y="300" text-anchor="middle" class="b1nep-sm"></text>
