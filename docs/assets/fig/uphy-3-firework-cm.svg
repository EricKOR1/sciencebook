  <text x="510.0" y="78.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-muted)">은 점선으로 이었다</text>
  <text x="475.0" y="256.0" style="font-size:13px;fill:var(--fig-violet);font-weight:600">x<tspan dy="4" style="font-size:11px">cm</tspan><tspan dy="-4">​</tspan> = (200 + 600)/2 = 400</text>
  <text x="30.0" y="310.0" style="font-size:13px;fill:var(--fig-muted)">폭발력은 내력 → 질량 중심의 운동은 그대로 (높이는 모식적)</text>
