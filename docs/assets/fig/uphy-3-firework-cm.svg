<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-uphy-3-firework-cm d-uphy-3-firework-cm">
  <title id="t-uphy-3-firework-cm">그림 일반물리학 3-5 공중에서 터진 불꽃 탄과 질량 중심</title>
  <desc id="d-uphy-3-firework-cm">예제 9에서 수평 도달 거리 400 m로 쏜 불꽃 탄이 최고점(200 m)에서 질량이 같은 두 조각으로 터진다. 한 조각은 연직으로 떨어져 200 m에, 다른 조각은 수평 속도가 2배가 되어 600 m에 떨어진다. 두 조각은 언제나 같은 높이에 있고, 그 중점인 질량 중심(점선)은 폭발과 관계없이 원래 포물선을 따라 400 m에 닿는다. 높이는 모식적으로 그렸다.</desc>
