  <text x="660.0" y="292.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-red);font-weight:600">600 m</text>
  <text x="252.0" y="210.0" text-anchor="end" style="font-size:13px;fill:var(--fig-blue);font-weight:600">조각 1</text>
  <text x="252.0" y="226.0" text-anchor="end" style="font-size:12px;fill:var(--fig-blue)">(정지 후 연직 낙하)</text>
