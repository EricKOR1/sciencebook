<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-umath-2-morse-harmonic d-umath-2-morse-harmonic">
  <title id="t-umath-2-morse-harmonic">그림 수학 도구 2-11 H₂의 모스 퍼텐셜과 조화 근사</title>
  <desc id="d-umath-2-morse-harmonic">모스 퍼텐셜 U = 4.75[1 − e^(−1.94(r − 0.741))]² eV(실선)와 조화 근사 U = ½k(r − r_e)², k = 2D_e a² ≈ 35.8 eV/Å²(점선). 평형 거리 r_e = 0.741 Å 근처에서 두 곡선이 겹친다. 결합을 늘이는 쪽(r &gt; r_e)에서는 모스 곡선이 포물선보다 낮아져 D_e = 4.75 eV로 다가가고(해리), 누르는 쪽에서는 더 가파르다.</desc>
