<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-gene-2-q-bicoid-double d-gene-2-q-bicoid-double">
  <title id="t-gene-2-q-bicoid-double">그림 생물의 유전 2-11 문제 18 해설 — 비코이드 농도가 2배일 때의 경계 이동</title>
  <desc id="d-gene-2-q-bicoid-double">정상 배아와 비코이드 mRNA가 2배인 배아의 비코이드 단백질 농도를 위치에 따라 나타낸 것이다. 기울기 모양은 같고 모든 위치에서 농도만 2배이므로, 기준 농도와 만나는 위치(간극 유전자 발현 구역의 경계)가 뒤쪽으로 옮겨 간다. 기준 농도와 곡선의 모양은 설명을 위한 예시이다.</desc>
