    .m3-05-nervous-system-s{font-size:13px;fill:var(--fig-muted)} .m3-05-nervous-system-h{font-size:15px;fill:var(--fig-ink);font-weight:700}
    .m3-05-nervous-system-ld{stroke:var(--fig-muted);stroke-width:1;fill:none}

  </style>
