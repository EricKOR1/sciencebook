<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="t-m3-05-nervous-system d-m3-05-nervous-system">
  <title id="t-m3-05-nervous-system">그림 중3-5-7 신경계의 구성과 뇌의 구조</title>
  <desc id="d-m3-05-nervous-system">왼쪽은 온몸의 신경계 모식도로, 뇌와 척수가 중추 신경계를 이루고 척수에서 뻗어 나온 말초 신경이 온몸과 연결된다. 오른쪽은 얼굴이 왼쪽을 향하도록 뇌를 가운데로 자른 단면 모식도로, 대뇌, 간뇌, 중간뇌, 연수, 소뇌, 척수의 위치와 하는 일을 나타냈다.</desc>
