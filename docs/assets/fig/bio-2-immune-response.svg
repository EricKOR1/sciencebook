<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-bio-2-immune-response d-bio-2-immune-response">
  <title id="t-bio-2-immune-response">그림 생명과학2-2 1차 면역 반응과 2차 면역 반응</title>
  <desc id="d-bio-2-immune-response">항원 X가 처음 들어오면 항체가 늦게 조금 만들어지고(1차 면역 반응), 같은 항원 X가 다시 들어오면 기억 세포 덕분에 항체가 빠르고 많이 만들어진다(2차 면역 반응). 이때 처음 들어온 항원 Y에는 1차 반응만 일어난다. 곡선 모양은 모식적이다.</desc>
