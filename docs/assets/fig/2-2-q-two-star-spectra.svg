  <desc id="d-2-2-q-two-star-spectra">어떤 별과 태양의 흡수 스펙트럼을 같은 파장 눈금에 나타낸 모식도이다. 선 위의 기호는 그 위치에 흡수선을 만드는 원소이고, 진하고 굵은 선일수록 강한 흡수선이다. 선의 위치는 실제 파장, 세기는 근사이다.</desc>
