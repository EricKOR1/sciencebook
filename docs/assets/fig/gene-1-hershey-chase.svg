<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-gene-1-hershey-chase d-gene-1-hershey-chase">
  <title id="t-gene-1-hershey-chase">그림 생물의 유전 1-2 허시와 체이스의 실험</title>
  <desc id="d-gene-1-hershey-chase">³⁵S로 단백질 껍질을 표지한 파지와 ³²P로 DNA를 표지한 파지를 각각 대장균에 감염시킨 뒤 흔들어 원심 분리하면, ³⁵S는 파지 껍질이 있는 상층액에서, ³²P는 대장균이 있는 침전물에서 주로 검출된다. 대장균 안으로 들어간 것은 DNA이다.</desc>
