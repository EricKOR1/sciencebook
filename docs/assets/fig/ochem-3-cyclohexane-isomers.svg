<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 585" role="img" aria-labelledby="t-ochem-3-cyclohexane-isomers d-ochem-3-cyclohexane-isomers">
  <title id="t-ochem-3-cyclohexane-isomers">그림 유기화학 3-9 이치환 사이클로헥세인의 입체 관계</title>
  <desc id="d-ochem-3-cyclohexane-isomers">윗줄: 시스-1,2-다이메틸사이클로헥세인을 평면 육각형으로 그리면 C1–C2와 C4–C5 결합의 가운데를 지나는 거울면이 있다. 두 의자 형태(왼쪽: C1 메틸 축, C2 메틸 적도 / 오른쪽: C1 적도, C2 축)는 서로 거울상이며 고리 뒤집힘으로 빠르게 바뀐다. 가운데 줄: 트랜스-1,2-다이메틸사이클로헥세인의 두 거울상 (1R,2R)과 (1S,2S). 아랫줄: 시스·트랜스-1,4-다이메틸사이클로헥세인은 둘 다 C1과 C4를 지나는 거울면이 있어 아카이랄하고 서로 부분 입체 이성질체이다.</desc>
  <style>.ochem-3-cyclohexane-isomers-t{font-size:14px;fill:var(--fig-ink)} .ochem-3-cyclohexane-isomers-b{font-size:14px;fill:var(--fig-ink);font-weight:600} .ochem-3-cyclohexane-isomers-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ochem-3-cyclohexane-isomers-s{font-size:13px;fill:var(--fig-muted)} .ochem-3-cyclohexane-isomers-n{font-size:13px;fill:var(--fig-muted)} .ochem-3-cyclohexane-isomers-r{font-size:13px;fill:var(--fig-red);font-weight:600} .ochem-3-cyclohexane-isomers-g{font-size:13px;fill:var(--fig-green);font-weight:600} .ochem-3-cyclohexane-isomers-v{font-size:13px;fill:var(--fig-violet)} .ochem-3-cyclohexane-isomers-pl{font-size:20px;fill:var(--fig-ink)} .ochem-3-cyclohexane-isomers-f{font-size:14px;fill:var(--fig-ink)}</style>
