<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-m1-06-lab-temperature d-m1-06-lab-temperature">
  <title id="t-m1-06-lab-temperature">그림 중1-6-7 온도와 부피 관계 실험 장치</title>
  <desc id="d-m1-06-lab-temperature">입구를 고무마개로 막은 주사기의 공기 부분이 완전히 잠기도록 물에 담그고, 2~3분 뒤 물의 온도와 공기의 부피를 읽는다. 피스톤이 자유롭게 움직이므로 기체의 압력은 바깥 압력과 같게 유지된다. 얼음물에서 뜨거운 물까지 차례로 옮기며 잰다. 모식도이다.</desc>
  <style>
    .lt-red{fill:none;stroke:var(--fig-red)} .lt-redh{fill:var(--fig-red)}
    .lt-blue{fill:none;stroke:var(--fig-blue)} .lt-blueh{fill:var(--fig-blue)}
    .lt-green{fill:none;stroke:var(--fig-green)} .lt-greenh{fill:var(--fig-green)}
    .lt-amber{fill:none;stroke:var(--fig-amber)} .lt-amberh{fill:var(--fig-amber)}
    .lt-violet{fill:none;stroke:var(--fig-violet)} .lt-violeth{fill:var(--fig-violet)}
    .lt-teal{fill:none;stroke:var(--fig-teal)} .lt-tealh{fill:var(--fig-teal)}
    .lt-ink{fill:none;stroke:var(--fig-ink)} .lt-inkh{fill:var(--fig-ink)}
    .lt-muted{fill:none;stroke:var(--fig-muted)} .lt-mutedh{fill:var(--fig-muted)}
    .lt-line{fill:none;stroke:var(--fig-line)} .lt-lineh{fill:var(--fig-line)}
    .lt-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .lt-t{font-size:14px;fill:var(--fig-ink)}
    .lt-sm{font-size:13px;fill:var(--fig-muted)}
    .lt-redb{font-size:14px;font-weight:700;fill:var(--fig-red)}
    .lt-sred{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.6}
    .lt-blueb{font-size:14px;font-weight:700;fill:var(--fig-blue)}
    .lt-sblue{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6}
    .lt-greenb{font-size:14px;font-weight:700;fill:var(--fig-green)}
    .lt-sgreen{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.6}
    .lt-amberb{font-size:14px;font-weight:700;fill:var(--fig-amber)}
    .lt-samber{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.6}
    .lt-violetb{font-size:14px;font-weight:700;fill:var(--fig-violet)}
    .lt-sviolet{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.6}
    .lt-tealb{font-size:14px;font-weight:700;fill:var(--fig-teal)}
    .lt-steal{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.6}
    .lt-panel{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.4}
    .lt-paper{fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1.4}
    .lt-axis{fill:none;stroke:var(--fig-ink);stroke-width:1.6}
    .lt-grid{fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 4}
    .lt-dash{fill:none;stroke:var(--fig-muted);stroke-width:1.4;stroke-dasharray:5 4}
    .lt-barrel{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2} .lt-gas{fill:var(--fig-soft-teal);stroke:none} .lt-pist{fill:var(--fig-line);stroke:var(--fig-ink);stroke-width:1.6} .lt-stop{fill:var(--fig-ink)} .lt-pt{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.4} .lt-hit{fill:var(--fig-amber)} .lt-water{fill:var(--fig-soft-blue);stroke:none} .lt-glass{fill:none;stroke:var(--fig-ink);stroke-width:2} .lt-th{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.4} .lt-hg{fill:var(--fig-red)}
  </style>
  <text x="170.0" y="28.0" text-anchor="middle" class="lt-h">주사기를 물에 담가 재기</text>
