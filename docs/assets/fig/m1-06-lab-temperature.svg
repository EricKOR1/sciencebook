  <path d="M60 110 L60 300 L260 300 L260 110" class="lt-glass"/>
  <rect x="115.0" y="180.0" width="50.0" height="90.0" rx="0" class="lt-gas"/>
  <path d="M115.0 120 L115.0 270 L165.0 270 L165.0 120" class="lt-glass"/>
  <rect x="133.0" y="270.0" width="14.0" height="10.0" rx="0" class="lt-barrel"/>
  <rect x="130.0" y="280.0" width="20.0" height="9.0" rx="2" class="lt-stop"/>
  <rect x="117.0" y="168.0" width="46.0" height="12.0" rx="2" class="lt-pist"/>
  <rect x="136.0" y="120.0" width="8.0" height="48.0" rx="0" class="lt-pist"/>
  <rect x="105.0" y="112.0" width="70.0" height="8.0" rx="2" class="lt-pist"/>
  <rect x="205.0" y="60.0" width="10.0" height="225.0" rx="5" class="lt-th"/>
  <circle cx="210.0" cy="282.0" r="8.0" class="lt-hg"/>
  <rect x="208.0" y="170.0" width="4.0" height="110.0" rx="0" class="lt-hg"/>
  <text x="222.0" y="72.0" class="lt-t">온도계</text>
  <line x1="60.0" y1="150.0" x2="30.0" y2="150.0" class="lt-ink" style="stroke-width:1;stroke-linecap:round"/>
  <text x="14.0" y="140.0" class="lt-sm">물</text>
  <text x="160.0" y="322.0" text-anchor="middle" class="lt-t">공기가 든 부분이 완전히 잠기게</text>
  <text x="82.0" y="60.0" text-anchor="end" class="lt-sm">피스톤은</text>
  <text x="82.0" y="76.0" text-anchor="end" class="lt-sm">자유롭게</text>
  <line x1="330.0" y1="20.0" x2="330.0" y2="320.0" class="lt-dash" style="stroke-width:1.2;stroke-linecap:round"/>
  <text x="525.0" y="28.0" text-anchor="middle" class="lt-h">물의 온도를 바꾸며 차례로</text>
  <rect x="342.0" y="140.0" width="76.0" height="100.0" rx="4" class="lt-sblue"/>
  <text x="380.0" y="266.0" text-anchor="middle" class="lt-t">얼음물</text>
  <text x="380.0" y="286.0" text-anchor="middle" class="lt-sm">약 0 °C</text>
  <line x1="422.0" y1="190.0" x2="429.0" y2="190.0" class="lt-ink" style="stroke-width:2;stroke-linecap:round"/>
  <path d="M436.0 190.0 L429.0 193.4 L429.0 186.6 Z" class="lt-inkh"/>
  <rect x="440.0" y="140.0" width="76.0" height="100.0" rx="4" class="lt-steal"/>
  <text x="478.0" y="266.0" text-anchor="middle" class="lt-t">찬물</text>
  <line x1="520.0" y1="190.0" x2="527.0" y2="190.0" class="lt-ink" style="stroke-width:2;stroke-linecap:round"/>
  <path d="M534.0 190.0 L527.0 193.4 L527.0 186.6 Z" class="lt-inkh"/>
  <rect x="538.0" y="140.0" width="76.0" height="100.0" rx="4" class="lt-samber"/>
  <text x="576.0" y="266.0" text-anchor="middle" class="lt-t">따뜻한 물</text>
  <line x1="618.0" y1="190.0" x2="625.0" y2="190.0" class="lt-ink" style="stroke-width:2;stroke-linecap:round"/>
  <path d="M632.0 190.0 L625.0 193.4 L625.0 186.6 Z" class="lt-inkh"/>
  <rect x="636.0" y="140.0" width="76.0" height="100.0" rx="4" class="lt-sred"/>
  <text x="674.0" y="266.0" text-anchor="middle" class="lt-t">뜨거운 물</text>
  <text x="674.0" y="286.0" text-anchor="middle" class="lt-sm">약 70 °C</text>
  <text x="525.0" y="110.0" text-anchor="middle" class="lt-sm">2~3분 기다린 뒤 온도와 부피 기록</text>
</svg>
