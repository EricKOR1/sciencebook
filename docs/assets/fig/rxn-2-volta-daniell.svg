  <text x="550.0" y="112.0" text-anchor="middle" class="rxn-2-volta-daniell-s">염다리 (KNO₃)</text>
  <line x1="574.0" y1="154.0" x2="533.6" y2="154.0" style="stroke:var(--fig-violet);stroke-width:2"/>
  <path d="M528.0 154.0 L535.1 150.4 L535.1 157.6 Z" style="fill:var(--fig-violet)"/>
