  <text x="180.0" y="370.0" text-anchor="middle" class="rxn-2-volta-daniell-k">(+)극: 2H⁺ + 2e⁻ → H₂ (구리는 반응하지 않음)</text>
  <text x="180.0" y="394.0" text-anchor="middle" class="rxn-2-volta-daniell-s" style="fill:var(--fig-red)">구리판에 붙은 H₂ 기포가 반응을 방해 → 전압이 빨리 떨어짐(분극)</text>
