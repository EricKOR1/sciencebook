  <path d="M574.0 196.0 L566.9 199.6 L566.9 192.4 Z" style="fill:var(--fig-red)"/>
  <text x="552.0" y="214.0" text-anchor="middle" class="rxn-2-volta-daniell-k" style="fill:var(--fig-red);font-weight:700">K⁺</text>
  <rect x="418.0" y="110.0" width="18.0" height="190.0" rx="2" style="fill:var(--fig-line);stroke:var(--fig-ink);stroke-width:1.5"/>
  <rect x="664.0" y="110.0" width="18.0" height="190.0" rx="2" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
