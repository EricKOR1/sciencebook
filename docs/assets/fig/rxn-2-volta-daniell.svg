<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" role="img" aria-labelledby="t-rxn-2-volta-daniell d-rxn-2-volta-daniell">
  <title id="t-rxn-2-volta-daniell">그림 화학 반응의 세계 2-4 볼타 전지와 다니엘 전지의 비교</title>
  <desc id="d-rxn-2-volta-daniell">볼타 전지(교과서에서 흔히 쓰는 단순한 형태)는 아연판과 구리판을 한 용액(묽은 황산)에 담가, 구리판 표면에서 H⁺가 환원되어 생긴 수소 기포가 반응을 방해한다. 다니엘 전지는 아연은 황산 아연 수용액에, 구리는 황산 구리(II) 수용액에 따로 담그고 염다리로 이어 산화와 환원을 공간적으로 분리하였다. 장치는 모식도이다.</desc>
  <style>
    .rxn-2-volta-daniell-T{font-size:15px;fill:var(--fig-ink);font-weight:700}
    .rxn-2-volta-daniell-f{font-size:14px;fill:var(--fig-ink);font-weight:600}
    .rxn-2-volta-daniell-k{font-size:13px;fill:var(--fig-ink)}
    .rxn-2-volta-daniell-s{font-size:13px;fill:var(--fig-muted)}
    .rxn-2-volta-daniell-b{font-size:15px;fill:var(--fig-ink);font-weight:600}
  </style>
