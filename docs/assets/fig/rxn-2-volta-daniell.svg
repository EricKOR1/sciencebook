  <text x="632.0" y="280.0" text-anchor="middle" class="rxn-2-volta-daniell-k">Cu²⁺</text>
  <text x="454.0" y="312.0" text-anchor="middle" class="rxn-2-volta-daniell-s">ZnSO₄(aq)</text>
  <text x="646.0" y="312.0" text-anchor="middle" class="rxn-2-volta-daniell-s">CuSO₄(aq)</text>
  <text x="550.0" y="350.0" text-anchor="middle" class="rxn-2-volta-daniell-k">(−)극: Zn → Zn²⁺ + 2e⁻</text>
  <text x="550.0" y="370.0" text-anchor="middle" class="rxn-2-volta-daniell-k">(+)극: Cu²⁺ + 2e⁻ → Cu</text>
  <text x="550.0" y="394.0" text-anchor="middle" class="rxn-2-volta-daniell-s" style="fill:var(--fig-green)">산화와 환원을 다른 용액에서 — 염다리로는 이온만 이동</text>
  <text x="360.0" y="418.0" text-anchor="middle" class="rxn-2-volta-daniell-s">전자는 도선으로, 이온은 용액과 염다리로 이동한다. 장치의 크기 비율은 모식도이다.</text>
</svg>
