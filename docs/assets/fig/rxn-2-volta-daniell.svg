  <text x="268.0" y="128.0" text-anchor="start" class="rxn-2-volta-daniell-f">Cu</text>
  <text x="92.0" y="146.0" text-anchor="end" class="rxn-2-volta-daniell-s">(−)극</text>
  <text x="268.0" y="146.0" text-anchor="start" class="rxn-2-volta-daniell-s">(+)극</text>
  <circle cx="231.1" cy="198.4" r="3.5" style="fill:var(--fig-panel);stroke:var(--fig-blue);stroke-width:1.2"/>
