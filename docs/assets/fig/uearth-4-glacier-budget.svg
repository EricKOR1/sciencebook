<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="t-uearth-4-glacier-budget d-uearth-4-glacier-budget">
<title id="t-uearth-4-glacier-budget">그림 일반지구과학 4-3 산악 빙하의 질량 수지와 흐름</title>
<desc id="d-uearth-4-glacier-budget">평형선 위의 축적 지역에서는 해마다 쌓이는 눈이 녹는 양보다 많고, 아래의 소모 지역에서는 녹는 양이 더 많다. 얼음은 축적 지역에서 아래로 파고들어 흐르다가 소모 지역에서 표면 쪽으로 올라오며, 말단의 위치는 흘러 내려오는 얼음과 녹는 양의 균형으로 정해진다. 오른쪽 위의 작은 그림은 깊이에 따른 얼음의 흐름 속도이다.</desc>
