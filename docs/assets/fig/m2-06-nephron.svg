  <text x="20" y="360" class="m2-06-nephron-b" style="fill:var(--fig-red)">① 여과</text><text x="96" y="360" class="m2-06-nephron-s">사구체 → 보먼주머니: 물, 포도당, 아미노산, 무기염류, 요소 (혈구·단백질은 크기가 커서 못 나간다)</text>
  <text x="20" y="382" class="m2-06-nephron-b" style="fill:var(--fig-blue)">② 재흡수</text><text x="96" y="382" class="m2-06-nephron-s">세뇨관 → 모세혈관: 포도당·아미노산은 전부, 물·무기염류는 대부분</text>
  <text x="20" y="404" class="m2-06-nephron-b" style="fill:var(--fig-violet)">③ 분비</text><text x="96" y="404" class="m2-06-nephron-s">모세혈관 → 세뇨관: 미처 여과되지 않은 노폐물 일부</text>
