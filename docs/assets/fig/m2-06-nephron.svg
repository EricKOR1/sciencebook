<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-m2-06-nephron d-m2-06-nephron">
  <title id="t-m2-06-nephron">그림 중2-6-3 네프론에서 오줌이 만들어지는 과정</title>
  <desc id="d-m2-06-nephron">사구체에서 보먼주머니로 작은 물질이 여과되고, 세뇨관에서 필요한 물질이 모세혈관으로 재흡수되며, 남은 노폐물 일부가 모세혈관에서 세뇨관으로 분비된다. 모식도이다.</desc>
  <style>.m2-06-nephron-t{font-size:14px;fill:var(--fig-ink)} .m2-06-nephron-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .m2-06-nephron-s{font-size:13px;fill:var(--fig-muted)} .m2-06-nephron-hd{font-size:15px;font-weight:700;fill:var(--fig-ink)} </style>
