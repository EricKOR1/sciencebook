<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" class="fig-small" role="img" aria-labelledby="t-uearth-8-q-danger-semicircle d-uearth-8-q-danger-semicircle">
  <title id="t-uearth-8-q-danger-semicircle">그림 일반지구과학 8-15 예제 10 풀이 — 진행 방향 오른쪽과 왼쪽의 풍속</title>
  <desc id="d-uearth-8-q-danger-semicircle">북쪽으로 10 m/s로 이동하는 태풍(북반구, 반시계 방향 회전)이다. 진행 방향 오른쪽(동쪽)에서는 회전 바람 40 m/s(북쪽)와 이동 속도 10 m/s(북쪽)가 같은 방향이라 50 m/s, 왼쪽(서쪽)에서는 회전 바람 40 m/s(남쪽)와 이동 속도가 반대 방향이라 30 m/s가 된다. 화살표 길이는 속력에 비례한다.</desc>
  <style>
    .uearth-8-q-danger-semicircle-t{font-size:14px;fill:var(--fig-ink)}
    .uearth-8-q-danger-semicircle-b{font-size:14px;font-weight:700;fill:var(--fig-ink)}
    .uearth-8-q-danger-semicircle-s{font-size:13px;fill:var(--fig-muted)}
    .uearth-8-q-danger-semicircle-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .uearth-8-q-danger-semicircle-red{font-size:14px;font-weight:600;fill:var(--fig-red)}
    .uearth-8-q-danger-semicircle-blue{font-size:14px;font-weight:600;fill:var(--fig-blue)}
    .uearth-8-q-danger-semicircle-green{font-size:14px;font-weight:600;fill:var(--fig-green)}
    .uearth-8-q-danger-semicircle-amber{font-size:14px;font-weight:600;fill:var(--fig-amber)}
    .uearth-8-q-danger-semicircle-violet{font-size:14px;font-weight:600;fill:var(--fig-violet)}
    .uearth-8-q-danger-semicircle-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.4}
    .uearth-8-q-danger-semicircle-grid{fill:none;stroke:var(--fig-line);stroke-width:0.7;stroke-dasharray:3 3}
  </style>
