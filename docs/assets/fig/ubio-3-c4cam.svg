<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-ubio-3-c4cam d-ubio-3-c4cam">
  <title id="t-ubio-3-c4cam">그림 일반생명과학 3-9 C4 식물과 CAM 식물의 CO₂ 농축</title>
  <desc id="d-ubio-3-c4cam">C4 식물: 엽육 세포의 PEP 카복실화 효소가 CO₂(HCO₃⁻)를 PEP에 붙여 옥살아세트산을 만들고, 말산이 관다발초 세포로 옮겨 가 CO₂를 내놓아 루비스코 주변 CO₂를 진하게 하며, 남은 피루브산은 엽육 세포로 돌아가 ATP를 써서 PEP로 재생된다. CAM 식물: 밤에 기공을 열어 CO₂를 말산으로 고정해 액포에 저장하고, 낮에는 기공을 닫은 채 말산에서 CO₂를 꺼내 같은 세포에서 캘빈 회로를 돌린다. 모식도이다.</desc>
  <defs>
    <marker id="ubio-3-c4cam-a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-ink)"/></marker>
    <marker id="ubio-3-c4cam-a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-teal)"/></marker>
    <marker id="ubio-3-c4cam-a-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-violet)"/></marker>
  </defs>
  <style>.ubio-3-c4cam-s{font-size:13px;fill:var(--fig-muted)} .ubio-3-c4cam-b{font-size:15px;fill:var(--fig-ink);font-weight:600} .ubio-3-c4cam-k{font-size:13px;fill:var(--fig-ink);font-weight:600} .ubio-3-c4cam-g{font-size:14px;fill:var(--fig-green);font-weight:700} .ubio-3-c4cam-a{font-size:14px;fill:var(--fig-amber);font-weight:700} .ubio-3-c4cam-bl{font-size:14px;fill:var(--fig-blue);font-weight:700} .ubio-3-c4cam-t{font-size:13px;fill:var(--fig-teal);font-weight:600}</style>
  <rect x="8" y="8" width="400" height="404" rx="10" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <text x="208.0" y="34.0" text-anchor="middle" class="ubio-3-c4cam-b">C4 식물 — 공간으로 나눔</text>
  <rect x="24" y="52" width="370" height="128" rx="10" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2"/>
  <text x="36.0" y="72.0" text-anchor="start" class="ubio-3-c4cam-g">엽육 세포</text>
  <rect x="24" y="212" width="370" height="128" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <text x="36.0" y="232.0" text-anchor="start" class="ubio-3-c4cam-a">관다발초 세포</text>
  <rect x="30.0" y="98" width="100.0" height="24" rx="12" style="fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.6"/>
  <text x="80.0" y="115.0" text-anchor="middle" class="ubio-3-c4cam-k">CO₂(HCO₃⁻)</text>
  <rect x="185.6" y="98" width="68.8" height="24" rx="12" style="fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.6"/>
  <text x="220.0" y="115.0" text-anchor="middle" class="ubio-3-c4cam-k">PEP 3C</text>
  <rect x="252.8" y="138" width="126.4" height="24" rx="12" style="fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.6"/>
  <text x="316.0" y="155.0" text-anchor="middle" class="ubio-3-c4cam-k">옥살아세트산 4C</text>
  <path d="M128 110 L182 110" style="fill:none;stroke:var(--fig-ink);stroke-width:2.2" marker-end="url(#ubio-3-c4cam-a-ink)"/>
  <text x="220.0" y="84.0" text-anchor="middle" class="ubio-3-c4cam-s">PEP 카복실화 효소(O₂와 반응 안 함)</text>
  <path d="M244 120 L272 138" style="fill:none;stroke:var(--fig-ink);stroke-width:2.2" marker-end="url(#ubio-3-c4cam-a-ink)"/>
  <rect x="293.8" y="250" width="72.4" height="24" rx="12" style="fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.6"/>
  <text x="330.0" y="267.0" text-anchor="middle" class="ubio-3-c4cam-k">말산 4C</text>
  <path d="M330 162 L330 248" style="fill:none;stroke:var(--fig-ink);stroke-width:2.2" marker-end="url(#ubio-3-c4cam-a-ink)"/>
  <text x="322.0" y="205.0" text-anchor="end" class="ubio-3-c4cam-s">이동</text>
  <rect x="98.0" y="250" width="144.1" height="24" rx="12" style="fill:var(--fig-panel);stroke:var(--fig-red);stroke-width:1.6"/>
  <text x="170.0" y="267.0" text-anchor="middle" class="ubio-3-c4cam-k">CO₂ (진하게 농축)</text>
  <path d="M298 262 L240 262" style="fill:none;stroke:var(--fig-ink);stroke-width:2.2" marker-end="url(#ubio-3-c4cam-a-ink)"/>
  <rect x="89.4" y="304" width="161.2" height="24" rx="12" style="fill:var(--fig-panel);stroke:var(--fig-violet);stroke-width:1.6"/>
  <text x="170.0" y="321.0" text-anchor="middle" class="ubio-3-c4cam-k">루비스코 → 캘빈 회로</text>
  <path d="M170 274 L170 302" style="fill:none;stroke:var(--fig-ink);stroke-width:2.2" marker-end="url(#ubio-3-c4cam-a-ink)"/>
  <rect x="268.3" y="304" width="99.4" height="24" rx="12" style="fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.6"/>
  <text x="318.0" y="321.0" text-anchor="middle" class="ubio-3-c4cam-k">피루브산 3C</text>
  <path d="M330 274 L322 302" style="fill:none;stroke:var(--fig-ink);stroke-width:2.2" marker-end="url(#ubio-3-c4cam-a-ink)"/>
  <path d="M300 304 Q266 200 232 122" style="fill:none;stroke:var(--fig-teal);stroke-width:1.8;stroke-dasharray:5 4" marker-end="url(#ubio-3-c4cam-a-teal)"/>
  <text x="252.0" y="196.0" text-anchor="end" class="ubio-3-c4cam-t">ATP 써서</text>
  <text x="252.0" y="212.0" text-anchor="end" class="ubio-3-c4cam-t">PEP 재생</text>
  <text x="208.0" y="368.0" text-anchor="middle" class="ubio-3-c4cam-s">광호흡 매우 적음, 대신 CO₂ 1분자당 ATP 2개 더</text>
  <text x="208.0" y="388.0" text-anchor="middle" class="ubio-3-c4cam-s">(옥수수, 사탕수수)</text>
  <rect x="420" y="8" width="292" height="404" rx="10" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <text x="566.0" y="34.0" text-anchor="middle" class="ubio-3-c4cam-b">CAM 식물 — 시간으로 나눔</text>
  <rect x="434" y="52" width="264" height="140" rx="10" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <text x="446.0" y="72.0" text-anchor="start" class="ubio-3-c4cam-bl">밤: 기공 열림</text>
  <rect x="434" y="206" width="264" height="150" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <text x="446.0" y="226.0" text-anchor="start" class="ubio-3-c4cam-a">낮: 기공 닫힘</text>
  <rect x="438.6" y="88" width="254.8" height="24" rx="12" style="fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.6"/>
  <text x="566.0" y="105.0" text-anchor="middle" class="ubio-3-c4cam-k">CO₂ → (PEP 카복실화 효소) → 말산</text>
  <path d="M566 112 L566 140" style="fill:none;stroke:var(--fig-ink);stroke-width:2.2" marker-end="url(#ubio-3-c4cam-a-ink)"/>
  <rect x="471.9" y="144" width="188.2" height="24" rx="12" style="fill:var(--fig-panel);stroke:var(--fig-violet);stroke-width:1.6"/>
  <text x="566.0" y="161.0" text-anchor="middle" class="ubio-3-c4cam-k">말산을 액포에 저장(산성)</text>
  <path d="M666 168 Q682 220 640 256" style="fill:none;stroke:var(--fig-violet);stroke-width:1.8;stroke-dasharray:5 4" marker-end="url(#ubio-3-c4cam-a-violet)"/>
  <rect x="518.1" y="256" width="95.8" height="24" rx="12" style="fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.6"/>
  <text x="566.0" y="273.0" text-anchor="middle" class="ubio-3-c4cam-k">말산 → CO₂</text>
  <rect x="485.4" y="306" width="161.2" height="24" rx="12" style="fill:var(--fig-panel);stroke:var(--fig-violet);stroke-width:1.6"/>
  <text x="566.0" y="323.0" text-anchor="middle" class="ubio-3-c4cam-k">루비스코 → 캘빈 회로</text>
  <path d="M566 280 L566 304" style="fill:none;stroke:var(--fig-ink);stroke-width:2.2" marker-end="url(#ubio-3-c4cam-a-ink)"/>
  <text x="566.0" y="380.0" text-anchor="middle" class="ubio-3-c4cam-s">물 손실을 크게 줄임</text>
  <text x="566.0" y="400.0" text-anchor="middle" class="ubio-3-c4cam-s">(선인장, 파인애플)</text>
</svg>
