<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-pchem-10-hcl-fit-activity d-pchem-10-hcl-fit-activity">
  <title id="t-pchem-10-hcl-fit-activity">그림 물리화학 10-17 활동 A의 결과 예시: H³⁵Cl 선 위치의 2차 맞춤</title>
  <desc id="d-pchem-10-hcl-fit-activity">표의 10개 선 위치를 m(P 가지 −J, R 가지 J + 1)에 대해 찍고 2차식으로 최소 제곱 맞춤했다: ν̃ = 2885.98 + 20.54m − 0.30m². m = 0(빈 원)은 관측되지 않는 띠 중심 ν̃₀이다. 오른쪽 아래: 결합 차이 R(J−1) − P(J+1)를 J + ½에 대해 그리면 원점을 지나는 직선이 되고 기울기가 4B₀(약 41.7 cm⁻¹)이다. 점들은 원심력 뒤틀림 때문에 직선보다 아주 조금 아래로 휜다.</desc>
