  <title id="t-2-5-dna-double-helix">그림 2-5-3 DNA의 이중 나선과 염기의 상보적 결합</title>
  <desc id="d-2-5-dna-double-helix">당–인산 뼈대가 바깥쪽에, 염기쌍이 안쪽에 있는 사다리를 비튼 모양이다. 염기는 항상 A–T, G–C로 짝을 짓는다. 모식도(구조식은 생략하였고 크기 비율은 실제와 다름).</desc>
