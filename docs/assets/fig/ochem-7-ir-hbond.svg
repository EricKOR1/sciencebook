<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-ochem-7-ir-hbond d-ochem-7-ir-hbond">
  <title id="t-ochem-7-ir-hbond">그림 유기화학 7-10 수소 결합과 X–H 띠의 모양</title>
  <desc id="d-ochem-7-ir-hbond">4000~2000 cm⁻¹ 영역의 IR 모식도 세 장. 위: 뷰탄-1-올 — 3330 중심의 넓고 강한 O–H 띠(3200~3550)와 그 오른쪽의 날카로운 C–H 띠(2960·2930·2870). 가운데: 뷰탄산 — 2500~3300에 걸친 아주 넓은 O–H 띠 위에 C–H 띠가 작은 톱니처럼 얹힌다. 아래: 뷰탄-1-아민 — 알코올보다 좁은 두 개의 중간 세기 N–H 띠(3370·3290, 비대칭·대칭 신축)와 C–H 띠.</desc>
