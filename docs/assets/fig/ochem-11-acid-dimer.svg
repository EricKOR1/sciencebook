<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-ochem-11-acid-dimer d-ochem-11-acid-dimer">
  <title id="t-ochem-11-acid-dimer">그림 유기화학 11-2 아세트산의 수소 결합 이합체</title>
  <desc id="d-ochem-11-acid-dimer">왼쪽: 아세트산 두 분자가 O–H···O=C 수소 결합 두 개로 맞물려 8원 고리 이합체를 이룬다(O···O 약 2.7 Å). 오른쪽: 몰질량이 같은 프로판-1-올은 분자마다 O–H···O 수소 결합 하나씩으로 사슬처럼 이어진다. 아래 표: 아세트산 60 g/mol, 끓는점 118 ℃, 프로판-1-올 60 g/mol, 끓는점 97 ℃. 거리는 모식도이다.</desc>
  <style>.ochem-11-acid-dimer-t{font-size:14px;fill:var(--fig-ink)} .ochem-11-acid-dimer-b{font-size:14px;fill:var(--fig-ink);font-weight:600} .ochem-11-acid-dimer-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ochem-11-acid-dimer-s{font-size:13px;fill:var(--fig-muted)} .ochem-11-acid-dimer-n{font-size:13px;fill:var(--fig-muted)} .ochem-11-acid-dimer-r{font-size:13px;fill:var(--fig-red);font-weight:600} .ochem-11-acid-dimer-g{font-size:13px;fill:var(--fig-green);font-weight:600} .ochem-11-acid-dimer-v{font-size:13px;fill:var(--fig-violet)} .ochem-11-acid-dimer-pl{font-size:20px;fill:var(--fig-ink)} .ochem-11-acid-dimer-f{font-size:14px;fill:var(--fig-ink)}</style>
