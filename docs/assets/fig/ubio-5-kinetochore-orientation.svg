<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-ubio-5-kinetochore-orientation d-ubio-5-kinetochore-orientation">
  <title id="t-ubio-5-kinetochore-orientation">그림 일반생명과학 5-4 체세포 분열, 감수 1분열, 감수 2분열의 중기와 후기 비교</title>
  <desc id="d-ubio-5-kinetochore-orientation">상동 염색체 한 쌍(파랑, 빨강)만 그렸다. 체세포 분열 중기에는 자매 염색 분체가 서로 반대 극의 방추사에 붙고, 후기에 코헤신이 한꺼번에 잘려 자매 염색 분체가 갈라진다. 감수 1분열 중기에는 2가 염색체의 자매 염색 분체가 같은 극을 향하고, 후기에 팔 부분의 코헤신만 잘려 교차로 이어져 있던 상동 염색체가 갈라지며 동원체 부근의 코헤신은 보호된다. 감수 2분열은 체세포 분열처럼 자매 염색 분체가 반대 극을 향하고, 남은 동원체 코헤신이 잘려 자매 염색 분체가 갈라진다. 모식도.</desc>
