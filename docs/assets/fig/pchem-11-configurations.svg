<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-pchem-11-configurations d-pchem-11-configurations">
  <title id="t-pchem-11-configurations">그림 물리화학 11-1 예제 1의 다섯 배치와 무게</title>
  <desc id="d-pchem-11-configurations">에너지 0, ε, 2ε, 3ε, 4ε인 준위에 구별되는 분자 6개를 전체 에너지 4ε로 놓는 다섯 배치. 각 배치의 무게는 W = 60, 30, 15, 15, 6(합 126)이고, W = 60인 (3, 2, 1, 0, 0)이 전체의 48 %를 차지한다. 오른쪽 막대는 다섯 배치를 무게로 평균한 준위별 평균 점유 수 3.33, 1.67, 0.71, 0.24, 0.05로, 위로 갈수록 대략 절반씩 준다.</desc>
