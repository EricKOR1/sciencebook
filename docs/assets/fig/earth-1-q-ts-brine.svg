<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-earth-1-q-ts-brine d-earth-1-q-ts-brine">
  <title id="t-earth-1-q-ts-brine">그림 지구과학 1-18 문제 12 해설 — 결빙에 따른 해수의 변화(T-S도)</title>
  <desc id="d-earth-1-q-ts-brine">수온이 0 °C로 같은 채 염분이 34 psu에서 약 37.8 psu로 높아지면, T-S도에서 점이 오른쪽으로 이동하며 등밀도선을 여러 개 가로질러 밀도가 약 1027.3 kg/m³에서 약 1030.3 kg/m³로 커진다. 등밀도선은 수압을 무시한 해수 상태식으로 계산하였다.</desc>
