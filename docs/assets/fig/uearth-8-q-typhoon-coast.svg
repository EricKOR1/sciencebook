  <title id="t-uearth-8-q-typhoon-coast">그림 일반지구과학 8-11 문제 10의 태풍과 예상 진로</title>
  <desc id="d-uearth-8-q-typhoon-coast">중심 기압 940 hPa인 태풍의 현재 위치와, 북북동쪽으로 12 m/s로 이동해 만조 시각에 남해안에 상륙할 것으로 예상되는 진로(점선)를 나타낸 지도이다. 작은 섬은 생략하였다.</desc>
