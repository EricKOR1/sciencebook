<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" class="fig-small" role="img" aria-labelledby="t-uearth-8-q-cold-front-3h d-uearth-8-q-cold-front-3h">
  <title id="t-uearth-8-q-cold-front-3h">그림 일반지구과학 8-16 문제 17 해설 — 한랭 전선이 지나고 3시간 뒤의 단면</title>
  <desc id="d-uearth-8-q-cold-front-3h">지상 한랭 전선은 3시간 동안 시속 40 km로 120 km 동쪽으로 이동했다. 전선면은 찬 공기 쪽(뒤쪽, 서쪽)으로 기울기 1/80로 기울어 있으므로 관측소 바로 위의 전선면 높이는 120 km × 1/80 = 1.5 km이다. 세로를 크게 과장한 모식도이다.</desc>
  <style>
    .uearth-8-q-cold-front-3h-t{font-size:14px;fill:var(--fig-ink)}
    .uearth-8-q-cold-front-3h-b{font-size:14px;font-weight:700;fill:var(--fig-ink)}
    .uearth-8-q-cold-front-3h-s{font-size:13px;fill:var(--fig-muted)}
    .uearth-8-q-cold-front-3h-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .uearth-8-q-cold-front-3h-red{font-size:14px;font-weight:600;fill:var(--fig-red)}
    .uearth-8-q-cold-front-3h-blue{font-size:14px;font-weight:600;fill:var(--fig-blue)}
    .uearth-8-q-cold-front-3h-green{font-size:14px;font-weight:600;fill:var(--fig-green)}
    .uearth-8-q-cold-front-3h-amber{font-size:14px;font-weight:600;fill:var(--fig-amber)}
    .uearth-8-q-cold-front-3h-violet{font-size:14px;font-weight:600;fill:var(--fig-violet)}
    .uearth-8-q-cold-front-3h-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.4}
    .uearth-8-q-cold-front-3h-grid{fill:none;stroke:var(--fig-line);stroke-width:0.7;stroke-dasharray:3 3}
  </style>
