<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="t-uphy-9-biot-savart d-uphy-9-biot-savart">
  <title id="t-uphy-9-biot-savart">그림 일반물리학 9-2 비오–사바르 법칙: 전류 요소 I ds가 만드는 dB 세우기</title>
  <desc id="d-uphy-9-biot-savart">(가) 긴 직선 도선: 위치 x의 요소 ds와 점 P를 잇는 r이 ds와 각 φ를 이루고, dB = (μ₀/4π) I ds × r̂/r²는 모든 요소에서 종이 면에서 나오는 같은 방향이라 크기만 적분한다. (나) 원형 고리의 축 위: 위쪽 요소(⊙)와 아래쪽 요소(⊗)가 만드는 dB는 각각 r에 수직이고, 축에 수직인 성분은 상쇄되어 축 성분만 남는다. 모식도이다.</desc>
  <style>.uphy-9-biot-savart-t{font-size:14px;fill:var(--fig-ink)} .uphy-9-biot-savart-b{font-size:14px;fill:var(--fig-ink);font-weight:700} .uphy-9-biot-savart-s{font-size:13px;fill:var(--fig-muted)} .uphy-9-biot-savart-dash{stroke:var(--fig-muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4}</style>
  <rect x="8" y="8" width="348" height="354" rx="8" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <text x="22" y="32" text-anchor="start" class="uphy-9-biot-savart-b">(가) 긴 직선 도선</text>
  <rect x="364" y="8" width="348" height="354" rx="8" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <text x="378" y="32" text-anchor="start" class="uphy-9-biot-savart-b">(나) 원형 고리의 축 위</text>
  <line x1="22" y1="210" x2="342" y2="210" style="stroke:var(--fig-amber);stroke-width:5"/>
  <line x1="300.0" y1="210.0" x2="328.8" y2="210.0" style="stroke:var(--fig-amber);stroke-width:5"/>
  <path d="M340.0 210.0 L327.1 215.5 L327.1 204.5 Z" style="fill:var(--fig-amber)"/>
  <text x="320" y="238" text-anchor="middle" class="uphy-9-biot-savart-b" style="fill:var(--fig-amber)">I</text>
  <line x1="92.0" y1="210.0" x2="122.4" y2="210.0" style="stroke:var(--fig-red);stroke-width:4"/>
  <path d="M132.0 210.0 L120.9 214.7 L120.9 205.3 Z" style="fill:var(--fig-red)"/>
  <text x="112" y="238" text-anchor="middle" class="uphy-9-biot-savart-b" style="fill:var(--fig-red)">I ds</text>
  <line x1="110" y1="210" x2="250" y2="90" style="stroke:var(--fig-violet);stroke-width:2"/>
  <text x="166.0" y="144.0" text-anchor="end" class="uphy-9-biot-savart-b" style="fill:var(--fig-violet)">r</text>
  <line x1="250" y1="90" x2="250" y2="210" class="uphy-9-biot-savart-dash"/>
  <text x="258" y="155.0" text-anchor="start" class="uphy-9-biot-savart-t">R</text>
  <path d="M144 210 A34 34 0 0 0 135.8 187.9" style="fill:none;stroke:var(--fig-ink);stroke-width:1.2"/>
  <text x="154" y="200" text-anchor="start" class="uphy-9-biot-savart-t">φ</text>
  <circle cx="250" cy="90" r="9" style="fill:var(--fig-panel);stroke:var(--fig-accent);stroke-width:2"/>
  <circle cx="250" cy="90" r="3" style="fill:var(--fig-accent)"/>
  <text x="266" y="76" text-anchor="start" class="uphy-9-biot-savart-b">P</text>
  <text x="266" y="96" text-anchor="start" class="uphy-9-biot-savart-s" style="fill:var(--fig-accent)">dB ⊙ (나오는 방향)</text>
  <line x1="110" y1="250" x2="250" y2="250" style="stroke:var(--fig-muted);stroke-width:1.2"/>
  <text x="180.0" y="268" text-anchor="middle" class="uphy-9-biot-savart-s">x</text>
  <text x="22" y="296" text-anchor="start" class="uphy-9-biot-savart-t">|ds × r̂| = ds sin φ = ds · R / r,  r = √(x² + R²)</text>
  <text x="22" y="320" text-anchor="start" class="uphy-9-biot-savart-t">모든 요소의 dB가 같은 방향 → 크기만 적분</text>
  <text x="22" y="346" text-anchor="start" class="uphy-9-biot-savart-t" style="fill:var(--fig-accent);font-weight:700">B = μ₀I / (2πR)</text>
  <line x1="390" y1="175" x2="700" y2="175" style="stroke:var(--fig-line);stroke-width:1.2"/>
  <path d="M440 105 A22 70 0 0 0 440 245" style="fill:none;stroke:var(--fig-amber);stroke-width:2;stroke-dasharray:5 4"/>
  <path d="M440 105 A22 70 0 0 1 440 245" style="fill:none;stroke:var(--fig-amber);stroke-width:4"/>
  <circle cx="440" cy="105" r="9" style="fill:var(--fig-panel);stroke:var(--fig-red);stroke-width:2"/>
  <circle cx="440" cy="105" r="3" style="fill:var(--fig-red)"/>
  <circle cx="440" cy="245" r="9" style="fill:var(--fig-panel);stroke:var(--fig-red);stroke-width:2"/>
  <path d="M435 240 L445 250 M445 240 L435 250" style="stroke:var(--fig-red);stroke-width:2"/>
  <text x="426" y="101" text-anchor="end" class="uphy-9-biot-savart-b" style="fill:var(--fig-red)">I ds ⊙</text>
  <text x="426" y="251" text-anchor="end" class="uphy-9-biot-savart-b" style="fill:var(--fig-red)">I ds′ ⊗</text>
  <line x1="440" y1="105" x2="620" y2="175" class="uphy-9-biot-savart-dash"/>
  <line x1="440" y1="245" x2="620" y2="175" class="uphy-9-biot-savart-dash"/>
  <line x1="440" y1="175" x2="440" y2="105" style="stroke:var(--fig-muted);stroke-width:1.2"/>
  <text x="446" y="160.0" text-anchor="start" class="uphy-9-biot-savart-t">R</text>
  <line x1="440" y1="269" x2="620" y2="269" style="stroke:var(--fig-muted);stroke-width:1.2"/>
  <text x="530.0" y="285" text-anchor="middle" class="uphy-9-biot-savart-s">z</text>
  <line x1="620.0" y1="175.0" x2="639.6" y2="124.7" style="stroke:var(--fig-accent);stroke-width:2.5"/>
  <path d="M642.5 117.2 L642.8 127.2 L635.5 124.4 Z" style="fill:var(--fig-accent)"/>
  <line x1="620.0" y1="175.0" x2="639.6" y2="225.3" style="stroke:var(--fig-accent);stroke-width:2.5"/>
  <path d="M642.5 232.8 L635.5 225.6 L642.8 222.8 Z" style="fill:var(--fig-accent)"/>
  <line x1="642.5" y1="175.0" x2="642.5" y2="123.6" style="stroke:var(--fig-violet);stroke-width:1.6;stroke-dasharray:4 3"/>
  <path d="M642.5 117.2 L645.6 124.6 L639.4 124.6 Z" style="fill:var(--fig-violet)"/>
  <line x1="642.5" y1="175.0" x2="642.5" y2="226.4" style="stroke:var(--fig-violet);stroke-width:1.6;stroke-dasharray:4 3"/>
  <path d="M642.5 232.8 L639.4 225.4 L645.6 225.4 Z" style="fill:var(--fig-violet)"/>
  <line x1="620.0" y1="175.0" x2="660.9" y2="175.0" style="stroke:var(--fig-green);stroke-width:4"/>
  <path d="M668.9 175.0 L659.7 178.9 L659.7 171.1 Z" style="fill:var(--fig-green)"/>
  <circle cx="620" cy="175" r="5" style="fill:var(--fig-ink)"/>
  <text x="614" y="195" text-anchor="end" class="uphy-9-biot-savart-b">P</text>
  <text x="652.4716681916068" y="121.21571036443964" text-anchor="start" class="uphy-9-biot-savart-b" style="fill:var(--fig-accent)">dB</text>
  <text x="652.4716681916068" y="236.78428963556036" text-anchor="start" class="uphy-9-biot-savart-b" style="fill:var(--fig-accent)">dB′</text>
  <text x="378" y="296" text-anchor="start" class="uphy-9-biot-savart-t">dB ⟂ r, 수직 성분(보라)은 상쇄</text>
  <text x="378" y="320" text-anchor="start" class="uphy-9-biot-savart-t">축 성분 dB · R/√(R² + z²)만 남는다</text>
  <text x="378" y="346" text-anchor="start" class="uphy-9-biot-savart-t" style="fill:var(--fig-accent);font-weight:700">B<tspan style="baseline-shift:sub;font-size:11px">z</tspan> = μ₀IR² / [2(R² + z²)<tspan style="baseline-shift:super;font-size:11px">3/2</tspan>]</text>
</svg>
