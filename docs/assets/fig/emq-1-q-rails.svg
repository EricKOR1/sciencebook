  <title id="t-emq-1-q-rails">그림 전자기와 양자 1-14 문제 15의 레일과 도체 막대</title>
  <desc id="d-emq-1-q-rails">위에서 내려다본 모습이다. 0.40 m 간격의 나란한 금속 레일 한쪽 끝이 2.0 Ω 저항으로 연결되어 있고, 도체 막대를 5.0 m/s로 저항에서 멀어지게 끈다. 자기장 0.50 T는 수평면에 수직이며 ⊗로 나타냈다.</desc>
