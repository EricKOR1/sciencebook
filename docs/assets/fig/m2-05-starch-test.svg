  <line x1="273.0" y1="210.0" x2="273.0" y2="234.0" style="stroke:var(--fig-green);stroke-width:3"/>
  <line x1="223.0" y1="60.0" x2="231.4" y2="83.5" style="stroke:var(--fig-amber);stroke-width:2;fill:none"/>
  <polygon points="233.0,88.0 227.5,82.2 233.6,80.0" style="fill:var(--fig-amber)"/>
  <line x1="263.0" y1="60.0" x2="271.4" y2="83.5" style="stroke:var(--fig-amber);stroke-width:2;fill:none"/>
  <polygon points="273.0,88.0 267.5,82.2 273.6,80.0" style="fill:var(--fig-amber)"/>
  <line x1="303.0" y1="60.0" x2="311.4" y2="83.5" style="stroke:var(--fig-amber);stroke-width:2;fill:none"/>
  <polygon points="313.0,88.0 307.5,82.2 313.6,80.0" style="fill:var(--fig-amber)"/>
  <text x="273.0" y="248.0" text-anchor="middle" class="m2-05-starch-test-s">빛을 받은 부분과</text>
  <text x="273.0" y="264.0" text-anchor="middle" class="m2-05-starch-test-s">가린 부분을 비교</text>
