<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-m2-05-starch-test d-m2-05-starch-test">
  <title id="t-m2-05-starch-test">그림 중2-5-3 잎에서 녹말이 만들어지는지 확인하는 실험</title>
  <desc id="d-m2-05-starch-test">① 하루 동안 어둠에 둔 식물의 잎 일부를 알루미늄 포일로 가린다. ② 빛을 4~6시간 쪼인다. ③ 잎을 에탄올에 넣고 물중탕하여 엽록소를 빼낸다. ④ 아이오딘-아이오딘화 칼륨 용액을 떨어뜨리면 빛을 받은 부분만 청람색으로 변하고 포일로 가린 부분은 색이 변하지 않는다. 빛을 받은 곳에서만 광합성으로 녹말이 만들어졌다. 색은 실제 반응 색에 가깝게 나타냈다.</desc>
  <style>
    .m2-05-starch-test-t{font-size:14px;fill:var(--fig-ink)}
    .m2-05-starch-test-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .m2-05-starch-test-s{font-size:13px;fill:var(--fig-muted)}

  </style>
  <rect x="0" y="0" width="720" height="330" style="fill:var(--fig-paper)"/>
  <rect x="14.0" y="14.0" width="166.0" height="268.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="97.0" y="40.0" text-anchor="middle" class="m2-05-starch-test-t" style="font-weight:600">① 일부를 포일로 가림</text>
  <line x1="181.0" y1="150.0" x2="185.8" y2="150.0" style="stroke:var(--fig-muted);stroke-width:1.6;fill:none"/>
  <polygon points="190.0,150.0 183.6,152.9 183.6,147.1" style="fill:var(--fig-muted)"/>
  <rect x="190.0" y="14.0" width="166.0" height="268.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="273.0" y="40.0" text-anchor="middle" class="m2-05-starch-test-t" style="font-weight:600">② 빛을 4~6시간</text>
  <line x1="357.0" y1="150.0" x2="361.8" y2="150.0" style="stroke:var(--fig-muted);stroke-width:1.6;fill:none"/>
  <polygon points="366.0,150.0 359.6,152.9 359.6,147.1" style="fill:var(--fig-muted)"/>
  <rect x="366.0" y="14.0" width="166.0" height="268.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="449.0" y="40.0" text-anchor="middle" class="m2-05-starch-test-t" style="font-weight:600">③ 에탄올 물중탕</text>
  <line x1="533.0" y1="150.0" x2="537.8" y2="150.0" style="stroke:var(--fig-muted);stroke-width:1.6;fill:none"/>
  <polygon points="542.0,150.0 535.6,152.9 535.6,147.1" style="fill:var(--fig-muted)"/>
  <rect x="542.0" y="14.0" width="166.0" height="268.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="625.0" y="40.0" text-anchor="middle" class="m2-05-starch-test-t" style="font-weight:600">④ 아이오딘 반응</text>
  <clipPath id="m2-05-starch-test-clip97"><path d="M97.0 200.0 C57.0 160.0 65.0 110.0 97.0 80.0 C129.0 110.0 137.0 160.0 97.0 200.0 Z"/></clipPath>
  <g clip-path="url(#m2-05-starch-test-clip97)">
