  <rect x="435.0" y="110.0" width="28.0" height="90.0" style="fill:var(--fig-soft-green)"/>
  <path d="M435.0 70 L435.0 190 Q435.0 204 449.0 204 Q463.0 204 463.0 190 L463.0 70" style="fill:none;stroke:var(--fig-ink);stroke-width:1.6"/>
  <path d="M449.0 190.0 C440.0 170.0 441.8 145.0 449.0 130.0 C456.2 145.0 458.0 170.0 449.0 190.0 Z" style="fill:var(--fig-panel);stroke:var(--fig-green);stroke-width:1.4"/>
  <text x="471.0" y="106.0" class="m2-05-starch-test-s">에탄올</text>
  <text x="397.0" y="236.0" class="m2-05-starch-test-s">뜨거운 물</text>
  <text x="449.0" y="256.0" text-anchor="middle" class="m2-05-starch-test-s">엽록소가 녹아 나와</text>
  <text x="449.0" y="272.0" text-anchor="middle" class="m2-05-starch-test-s">잎이 하얘진다</text>
  <clipPath id="m2-05-starch-test-clip625"><path d="M625.0 200.0 C585.0 160.0 593.0 110.0 625.0 80.0 C657.0 110.0 665.0 160.0 625.0 200.0 Z"/></clipPath>
  <g clip-path="url(#m2-05-starch-test-clip625)">
    <rect x="575.0" y="70" width="100" height="140" style="fill:#2f3480"/>
    <rect x="575.0" y="128" width="100" height="30" style="fill:#e9d9a6"/>
  </g>
  <path d="M625.0 200.0 C585.0 160.0 593.0 110.0 625.0 80.0 C657.0 110.0 665.0 160.0 625.0 200.0 Z" style="fill:none;stroke:var(--fig-green);stroke-width:2"/>
  <line x1="625.0" y1="200.0" x2="625.0" y2="224.0" style="stroke:var(--fig-green);stroke-width:3"/>
  <text x="679.0" y="108.0" class="m2-05-starch-test-s">청람색</text>
  <text x="679.0" y="145.0" class="m2-05-starch-test-s">변화</text>
  <text x="679.0" y="161.0" class="m2-05-starch-test-s">없음</text>
  <text x="625.0" y="248.0" text-anchor="middle" class="m2-05-starch-test-s">빛 받은 부분 → 녹말 있음</text>
  <text x="625.0" y="264.0" text-anchor="middle" class="m2-05-starch-test-s">가린 부분 → 녹말 없음</text>
  <text x="360.0" y="312.0" text-anchor="middle" class="m2-05-starch-test-s">결론: 빛을 받은 곳에서 광합성이 일어나 녹말이 생긴다.  주의: 에탄올은 불에 직접 가열하지 않고 물중탕한다.</text>
