    <rect x="47.0" y="128" width="100" height="30" style="fill:var(--fig-line)"/>
  </g>
  <path d="M97.0 200.0 C57.0 160.0 65.0 110.0 97.0 80.0 C129.0 110.0 137.0 160.0 97.0 200.0 Z" style="fill:none;stroke:var(--fig-green);stroke-width:2"/>
  <line x1="97.0" y1="200.0" x2="97.0" y2="224.0" style="stroke:var(--fig-green);stroke-width:3"/>
  <text x="149.0" y="135.0" class="m2-05-starch-test-s">포일</text>
  <text x="97.0" y="248.0" text-anchor="middle" class="m2-05-starch-test-s">어둠에 하루 → 원래</text>
  <text x="97.0" y="264.0" text-anchor="middle" class="m2-05-starch-test-s">있던 녹말을 없앤다</text>
