<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-emq-2-aberration d-emq-2-aberration">
  <title id="t-emq-2-aberration">그림 전자기와 양자 2-5 수차 — 렌즈 면의 모양과 빛의 색 때문에 초점이 퍼진다</title>
  <desc id="d-emq-2-aberration">(가) 둥근 면으로 만든 볼록렌즈에서는 가장자리를 지난 빛이 중심 근처를 지난 빛보다 렌즈에 더 가까운 곳에 모여 초점이 한 점이 되지 못한다. (나) 유리의 굴절률이 색마다 달라 파란빛이 빨간빛보다 크게 꺾이므로 렌즈에 더 가까운 곳에 모인다. 꺾이는 정도를 과장한 모식도이다.</desc>
  <line x1="360.0" y1="20.0" x2="360.0" y2="290.0" style="fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4"/>
  <text x="20.0" y="30.0" style="font-size:15px;fill:var(--fig-ink);font-weight:600">(가) 면의 모양 때문에</text>
  <line x1="24.0" y1="150.0" x2="350.0" y2="150.0" style="fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:5 4"/>
