<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-m2-05-transpiration d-m2-05-transpiration">
  <title id="t-m2-05-transpiration">그림 중2-5-4 증산 작용과 물이 올라가는 길</title>
  <desc id="d-m2-05-transpiration">뿌리털로 흡수한 물은 뿌리, 줄기, 잎의 물관을 따라 위로 올라간다. 잎에서는 물이 기공을 통해 수증기로 빠져나가는데(증산 작용), 빠져나간 만큼 물관 속 물이 위로 끌려 올라간다. 기공은 두 공변세포 사이의 틈으로, 열리면 이산화 탄소가 들어오고 산소와 수증기가 나가며, 덥고 건조할 때 닫히면 물을 덜 잃는 대신 이산화 탄소도 들어오기 어렵다. 모식도이다.</desc>
  <style>
    .m2-05-transpiration-t{font-size:14px;fill:var(--fig-ink)}
    .m2-05-transpiration-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .m2-05-transpiration-s{font-size:13px;fill:var(--fig-muted)}

  </style>
