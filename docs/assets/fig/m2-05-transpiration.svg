  <text x="36.0" y="70.0" class="m2-05-transpiration-t" style="fill:var(--fig-teal);font-weight:600">③ 잎의 기공에서 물이</text>
  <text x="36.0" y="88.0" class="m2-05-transpiration-t" style="fill:var(--fig-teal);font-weight:600">    수증기로 나간다(증산 작용)</text>
  <text x="244.0" y="252.0" class="m2-05-transpiration-t" style="fill:var(--fig-blue);font-weight:600">② 물관을 따라 위로</text>
  <text x="296.0" y="312.0" class="m2-05-transpiration-t" style="fill:var(--fig-ink);font-weight:600">① 뿌리털로</text>
