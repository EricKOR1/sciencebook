<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-uphy-2-accel-pendulum d-uphy-2-accel-pendulum">
  <title id="t-uphy-2-accel-pendulum">그림 일반물리학 2-7 가속하는 자동차 안의 진자 — 두 기준틀의 설명</title>
  <desc id="d-uphy-2-accel-pendulum">예제 11에서 자동차가 3.00 m/s²로 앞(오른쪽)으로 가속하면 천장에 매단 추는 연직에서 뒤쪽으로 17.0° 기운다. (가) 땅에서 보면 추에 작용하는 실제 힘은 장력과 중력뿐이고, 그 합(알짜힘 ma)이 앞쪽을 향해 추를 차와 함께 가속시킨다. (나) 차 안에서 보면 추는 정지해 있으며, 실제 힘에 뒤쪽 관성력 −ma를 더한 합이 0이다. 중력과 관성력의 합이 유효 중력(10.2 m/s²)으로 줄 방향을 향한다.</desc>
  <rect x="10.0" y="10.0" width="345.0" height="340.0" rx="10" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <rect x="365.0" y="10.0" width="345.0" height="340.0" rx="10" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <text x="26.0" y="36.0" style="font-size:15px;fill:var(--fig-ink);font-weight:600">(가) 땅(관성 기준틀)에서</text>
  <text x="381.0" y="36.0" style="font-size:15px;fill:var(--fig-ink);font-weight:600">(나) 차 안(비관성 기준틀)에서</text>
