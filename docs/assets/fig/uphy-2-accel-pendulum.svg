  <text x="385.0" y="300.0" style="font-size:13px;fill:var(--fig-ink);font-weight:600">T + mg + (−ma) = 0 → 추는 정지</text>
  <text x="385.0" y="320.0" style="font-size:13px;fill:var(--fig-ink)">유효 중력 √(g² + a²) = 10.2 m/s²가</text>
  <text x="385.0" y="338.0" style="font-size:13px;fill:var(--fig-ink)">줄 방향(뒤쪽 아래)을 향한다</text>
  <circle cx="555.7" cy="165.6" r="9.0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
