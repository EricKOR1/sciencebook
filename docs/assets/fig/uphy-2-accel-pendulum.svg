  <text x="218.5" y="133.6" style="font-size:14px;fill:var(--fig-teal);font-weight:600">T</text>
  <line x1="200.7" y1="169.6" x2="215.2" y2="169.6" style="stroke:var(--fig-violet);stroke-width:3;fill:none"/>
