  <text x="527.2" y="265.6" text-anchor="middle" style="font-size:13px;fill:var(--fig-red);font-weight:600">관성력 −ma</text>
  <line x1="555.7" y1="165.6" x2="531.2" y2="245.6" style="stroke:var(--fig-amber);stroke-width:2.5;fill:none;stroke-dasharray:2 3"/>
