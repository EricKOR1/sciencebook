<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-m1-03-specific-heat-lab d-m1-03-specific-heat-lab">
<title id="t-m1-03-specific-heat-lab">그림 중1-3-11 물중탕으로 물과 식용유의 비열 비교하기</title>
<desc id="d-m1-03-specific-heat-lab">같은 질량의 물과 식용유를 시험관에 담아 같은 따뜻한 물에 동시에 담그고 온도 센서로 온도를 잰다. 같은 시간 동안 식용유의 온도가 더 많이 올라가므로 식용유의 비열이 물보다 작다. 그래프는 예상 결과를 나타낸 예시 곡선이다.</desc>
