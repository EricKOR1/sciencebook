<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-cell-3-q-jagendorf d-cell-3-q-jagendorf">
  <title id="t-cell-3-q-jagendorf">그림 세포와 물질대사 3-14 문제 15의 실험 과정</title>
  <desc id="d-cell-3-q-jagendorf">어둠 속에서 분리한 틸라코이드를 ① 처음 용액에 충분히 담가 둔 뒤 ② 다른 용액으로 옮기고 ADP와 인산을 넣는다. 각 용액의 pH는 문제의 (가)~(라)에 주어져 있다. 오른쪽은 틸라코이드 막의 일부를 확대한 모식도이다.</desc>
  <style>.cell-3-q-jagendorf-t{font-size:14px;fill:var(--fig-ink)} .cell-3-q-jagendorf-s{font-size:13px;fill:var(--fig-muted)} .cell-3-q-jagendorf-b{font-size:15px;font-weight:700;fill:var(--fig-ink)} .cell-3-q-jagendorf-bs{font-size:14px;font-weight:700;fill:var(--fig-ink)} .cell-3-q-jagendorf-r{font-size:14px;font-weight:700;fill:var(--fig-red)} .cell-3-q-jagendorf-bl{font-size:14px;font-weight:700;fill:var(--fig-blue)} .cell-3-q-jagendorf-am{font-size:14px;font-weight:700;fill:var(--fig-amber)} .cell-3-q-jagendorf-g{font-size:14px;font-weight:700;fill:var(--fig-green)} .cell-3-q-jagendorf-vi{font-size:14px;font-weight:700;fill:var(--fig-violet)} .cell-3-q-jagendorf-te{font-size:14px;font-weight:700;fill:var(--fig-teal)}</style>
  <text x="20.0" y="24.0" class="cell-3-q-jagendorf-s">모든 과정은 어둠 속에서 한다</text>
  <rect x="30" y="96" width="150" height="124" style="fill:var(--fig-soft-blue);stroke:none"/>
  <path d="M30 66 L30 220 L180 220 L180 66" style="fill:none;stroke:var(--fig-ink);stroke-width:2.2;stroke-linejoin:round"/>
  <line x1="30.0" y1="96.0" x2="180.0" y2="96.0" style="stroke:var(--fig-blue);stroke-width:1.5"/>
  <ellipse cx="70" cy="130" rx="20" ry="9" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2"/>
  <ellipse cx="128" cy="150" rx="20" ry="9" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2"/>
  <ellipse cx="88" cy="186" rx="20" ry="9" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2"/>
  <ellipse cx="145" cy="196" rx="20" ry="9" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2"/>
  <text x="105.0" y="246.0" text-anchor="middle" class="cell-3-q-jagendorf-bs">① 처음 용액에 담근다</text>
  <text x="105.0" y="266.0" text-anchor="middle" class="cell-3-q-jagendorf-s">(pH 4 또는 pH 8)</text>
  <rect x="270" y="96" width="150" height="124" style="fill:var(--fig-soft-blue);stroke:none"/>
  <path d="M270 66 L270 220 L420 220 L420 66" style="fill:none;stroke:var(--fig-ink);stroke-width:2.2;stroke-linejoin:round"/>
  <line x1="270.0" y1="96.0" x2="420.0" y2="96.0" style="stroke:var(--fig-blue);stroke-width:1.5"/>
  <ellipse cx="310" cy="130" rx="20" ry="9" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2"/>
  <ellipse cx="368" cy="150" rx="20" ry="9" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2"/>
  <ellipse cx="328" cy="186" rx="20" ry="9" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2"/>
  <ellipse cx="385" cy="196" rx="20" ry="9" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2"/>
  <text x="345.0" y="246.0" text-anchor="middle" class="cell-3-q-jagendorf-bs">② 옮긴 용액</text>
  <text x="345.0" y="266.0" text-anchor="middle" class="cell-3-q-jagendorf-s">(pH 4 또는 pH 8) + ADP, 인산</text>
  <line x1="196.0" y1="140.0" x2="250.0" y2="140.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <path d="M258.0 140.0 L248.9 144.1 L248.9 135.9 Z" style="fill:var(--fig-ink)"/>
  <text x="227.0" y="128.0" text-anchor="middle" class="cell-3-q-jagendorf-s">옮긴다</text>
  <text x="82.0" y="58.0" text-anchor="middle" class="cell-3-q-jagendorf-s">틸라코이드</text>
  <line x1="82.0" y1="62.0" x2="70.0" y2="122.0" style="stroke:var(--fig-muted);stroke-width:1"/>
  <circle cx="385" cy="196" r="26" style="fill:none;stroke:var(--fig-muted);stroke-width:1.2;stroke-dasharray:4 3"/>
  <line x1="409.0" y1="186.0" x2="500.0" y2="72.0" style="stroke:var(--fig-muted);stroke-width:1;stroke-dasharray:4 3"/>
  <line x1="409.0" y1="206.0" x2="500.0" y2="238.0" style="stroke:var(--fig-muted);stroke-width:1;stroke-dasharray:4 3"/>
  <rect x="500" y="56" width="204" height="196" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2"/>
  <rect x="510" y="150" width="184" height="20" style="fill:var(--fig-soft-green);stroke:none"/>
  <line x1="510.0" y1="150.0" x2="694.0" y2="150.0" style="stroke:var(--fig-green);stroke-width:2.2"/>
  <line x1="510.0" y1="170.0" x2="694.0" y2="170.0" style="stroke:var(--fig-green);stroke-width:2.2"/>
  <text x="602.0" y="80.0" text-anchor="middle" class="cell-3-q-jagendorf-t">바깥 용액 쪽</text>
  <text x="602.0" y="236.0" text-anchor="middle" class="cell-3-q-jagendorf-t">틸라코이드 내부</text>
  <rect x="566" y="144" width="28" height="32" rx="5" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.8"/>
  <rect x="576" y="120" width="8" height="26" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5"/>
  <ellipse cx="580" cy="108" rx="24" ry="17" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.8"/>
  <line x1="606.0" y1="112.0" x2="632.0" y2="118.0" style="stroke:var(--fig-muted);stroke-width:1"/>
  <text x="636.0" y="116.0" class="cell-3-q-jagendorf-vi">ATP</text>
  <text x="636.0" y="134.0" class="cell-3-q-jagendorf-vi">합성 효소</text>
  <text x="520.0" y="196.0" class="cell-3-q-jagendorf-s">틸라코이드 막</text>
  <line x1="560.0" y1="186.0" x2="560.0" y2="172.0" style="stroke:var(--fig-muted);stroke-width:1"/>
</svg>
