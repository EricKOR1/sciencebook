<rect x="300" y="334" width="14" height="14" style="fill:var(--fig-soft-red);stroke:none"/><text x="320.0" y="346.0" text-anchor="start" class="phy-1-stopping-distance-sm">제동 거리 (감속 5 m/s², 속력의 제곱에 비례)</text>
<text x="360.0" y="374.0" text-anchor="middle" class="phy-1-stopping-distance-sm">그래프 아래 넓이 = 이동 거리. 속력이 2배이면 공주 거리는 2배, 제동 거리는 4배가 된다</text>
