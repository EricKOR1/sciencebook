<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 388" role="img" aria-labelledby="t-phy-1-stopping-distance d-phy-1-stopping-distance">
  <title id="t-phy-1-stopping-distance">그림 물리학 1-2 속도–시간 그래프로 보는 정지 거리</title>
  <desc id="d-phy-1-stopping-distance">반응 시간 1초, 감속도 5 m/s²인 자동차가 10 m/s와 20 m/s로 달리다 멈출 때의 속도–시간 그래프. 직사각형 넓이가 공주 거리, 삼각형 넓이가 제동 거리이다.</desc>
  <style>
    .phy-1-stopping-distance-lbl{font-size:14px;fill:var(--fig-ink)} .phy-1-stopping-distance-sm{font-size:13px;fill:var(--fig-muted)} .phy-1-stopping-distance-b{font-weight:600}
    .phy-1-stopping-distance-ax{stroke:var(--fig-ink);stroke-width:1.5;fill:none} .phy-1-stopping-distance-grid{stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 3;fill:none}
  </style>
