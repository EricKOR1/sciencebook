<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-m3-02-high-low d-m3-02-high-low">
  <title id="t-m3-02-high-low">그림 중3-2-8 고기압과 저기압 주변의 바람과 공기의 움직임 (북반구)</title>
  <desc id="d-m3-02-high-low">위는 하늘에서 내려다본 모습이다. 고기압에서는 바람이 중심에서 시계 방향으로 불어 나가고, 저기압에서는 바람이 시계 반대 방향으로 중심을 향해 불어 들어온다. 아래는 옆에서 본 단면으로, 고기압 중심에는 하강 기류가 생겨 맑고, 저기압 중심에는 상승 기류가 생겨 구름이 만들어지고 흐리거나 비가 온다(모식도).</desc>
