<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-pchem-4-triple-point-lnp d-pchem-4-triple-point-lnp">
  <title id="t-pchem-4-triple-point-lnp">그림 물리화학 4-6 물의 삼중점 근처 증기 압력 (ln p – 1/T)</title>
  <desc id="d-pchem-4-triple-point-lnp">물의 삼중점 근처에서 ln(p/Pa)를 1/T에 대해 그린 그래프. 얼음의 승화선(기울기 −ΔsubH/R = −6134 K)이 액체의 증발선(기울기 −ΔvapH/R = −5413 K)보다 가파르고, 두 직선은 삼중점(1/273.16 K, ln 611.7 = 6.416)에서 만난다. 삼중점보다 낮은 온도(오른쪽)의 액체선은 과냉각 물(준안정)이며 얼음보다 증기 압력이 크다. 263.15 K에서 얼음은 260 Pa, 과냉각 물은 288 Pa이다.</desc>
