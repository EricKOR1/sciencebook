<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="t-gene-2-enhancer-loop d-gene-2-enhancer-loop">
  <title id="t-gene-2-enhancer-loop">그림 생물의 유전 2-5 진핵생물의 전사 개시와 인핸서</title>
  <desc id="d-gene-2-enhancer-loop">인핸서는 프로모터에서 수천 염기쌍 이상 떨어져 있을 수 있다. 인핸서에 결합한 전사 인자는 DNA가 휘어지면서 프로모터에 모인 전사 인자, RNA 중합 효소와 만나고, 여러 전사 인자가 모여야 전사가 시작된다.</desc>
  <style>
    .gene-2-enhancer-loop-h{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .gene-2-enhancer-loop-tx{font-size:14px;fill:var(--fig-ink)}
    .gene-2-enhancer-loop-sm{font-size:13px;fill:var(--fig-muted)}
    .gene-2-enhancer-loop-dna{fill:none;stroke:var(--fig-ink);stroke-width:5;stroke-linecap:round}
    .gene-2-enhancer-loop-enh{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2}
    .gene-2-enhancer-loop-pro{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2}
    .gene-2-enhancer-loop-gene{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2}
    .gene-2-enhancer-loop-tfa{fill:var(--fig-amber);stroke:var(--fig-ink);stroke-width:1}
    .gene-2-enhancer-loop-tfb{fill:var(--fig-teal);stroke:var(--fig-ink);stroke-width:1}
    .gene-2-enhancer-loop-tfc{fill:var(--fig-violet);stroke:var(--fig-ink);stroke-width:1}
    .gene-2-enhancer-loop-pol{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2}
    .gene-2-enhancer-loop-rna{fill:none;stroke:var(--fig-red);stroke-width:2.5}
    .gene-2-enhancer-loop-ah{fill:var(--fig-red)}
    .gene-2-enhancer-loop-pan{fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1}
    .gene-2-enhancer-loop-ln{fill:none;stroke:var(--fig-muted);stroke-width:1}
    .gene-2-enhancer-loop-brk{fill:var(--fig-paper);stroke:none}
  </style>
  <rect x="10" y="10" width="700" height="110" rx="10" class="gene-2-enhancer-loop-pan"/>
  <text x="24" y="34" class="gene-2-enhancer-loop-h">(가) 조절 부위의 위치</text>
  <line x1="30" y1="80" x2="690" y2="80" class="gene-2-enhancer-loop-dna"/>
  <rect x="250" y="70" width="26" height="20" class="gene-2-enhancer-loop-brk"/>
  <path d="M246 92 l8 -24 M272 92 l8 -24" class="gene-2-enhancer-loop-ln" style="stroke:var(--fig-ink);stroke-width:2"/>
  <rect x="80" y="68" width="90" height="24" rx="4" class="gene-2-enhancer-loop-enh"/>
  <text x="125" y="62" text-anchor="middle" class="gene-2-enhancer-loop-tx">인핸서</text>
  <text x="263" y="112" text-anchor="middle" class="gene-2-enhancer-loop-sm">수천 염기쌍 이상 떨어져 있을 수 있다</text>
  <rect x="400" y="68" width="70" height="24" rx="4" class="gene-2-enhancer-loop-pro"/>
  <text x="435" y="62" text-anchor="middle" class="gene-2-enhancer-loop-tx">프로모터</text>
  <rect x="474" y="68" width="200" height="24" rx="4" class="gene-2-enhancer-loop-gene"/>
  <text x="574" y="62" text-anchor="middle" class="gene-2-enhancer-loop-tx">유전자</text>
  <rect x="10" y="132" width="700" height="268" rx="10" class="gene-2-enhancer-loop-pan"/>
  <text x="24" y="156" class="gene-2-enhancer-loop-h">(나) DNA가 휘어 인핸서의 전사 인자가 프로모터에 닿는다</text>
  <path d="M330 196 L150 196 C70 196 50 250 60 290 C70 330 100 345 160 345 L690 345" class="gene-2-enhancer-loop-dna"/>
  <rect x="170" y="184" width="100" height="24" rx="4" class="gene-2-enhancer-loop-enh"/>
  <text x="220" y="178" text-anchor="middle" class="gene-2-enhancer-loop-tx">인핸서</text>
  <rect x="300" y="333" width="80" height="24" rx="4" class="gene-2-enhancer-loop-pro"/>
  <text x="340" y="375" text-anchor="middle" class="gene-2-enhancer-loop-tx">프로모터</text>
  <rect x="384" y="333" width="290" height="24" rx="4" class="gene-2-enhancer-loop-gene"/>
  <text x="529" y="375" text-anchor="middle" class="gene-2-enhancer-loop-tx">유전자</text>
  <rect x="190" y="210" width="28" height="54" rx="10" class="gene-2-enhancer-loop-tfa"/>
  <rect x="222" y="210" width="28" height="60" rx="10" class="gene-2-enhancer-loop-tfb"/>
  <ellipse cx="255" cy="296" rx="26" ry="34" class="gene-2-enhancer-loop-tfc"/>
  <ellipse cx="296" cy="304" rx="20" ry="26" class="gene-2-enhancer-loop-tfc"/>
  <path d="M300 333 L300 290 Q300 266 330 266 L366 266 Q392 266 392 292 L392 333 Z" class="gene-2-enhancer-loop-pol"/>
  <text x="346" y="300" text-anchor="middle" class="gene-2-enhancer-loop-sm" style="fill:var(--fig-ink)">RNA</text>
  <text x="346" y="316" text-anchor="middle" class="gene-2-enhancer-loop-sm" style="fill:var(--fig-ink)">중합 효소</text>
  <path d="M400 290 Q430 268 470 272 L520 272" class="gene-2-enhancer-loop-rna"/>
  <path d="M530 272 l-11 -6 l0 12 z" class="gene-2-enhancer-loop-ah"/>
  <text x="540" y="277" class="gene-2-enhancer-loop-tx" style="fill:var(--fig-red)">전사 시작</text>
  <line x1="252" y1="230" x2="420" y2="214" class="gene-2-enhancer-loop-ln"/>
  <text x="426" y="210" class="gene-2-enhancer-loop-tx">인핸서에 결합한 전사 인자</text>
  <line x1="250" y1="328" x2="210" y2="364" class="gene-2-enhancer-loop-ln"/>
  <text x="30" y="378" class="gene-2-enhancer-loop-tx">프로모터에 모인 전사 인자</text>
  <text x="426" y="232" class="gene-2-enhancer-loop-sm">여러 전사 인자가 모두 모여야 RNA 중합 효소가</text>
  <text x="426" y="249" class="gene-2-enhancer-loop-sm">결합해 전사를 시작한다(조합 조절)</text>
  <text x="700" y="394" text-anchor="end" class="gene-2-enhancer-loop-sm">모식도: 단백질과 DNA의 크기·간격은 실제와 다르다</text>
</svg>
