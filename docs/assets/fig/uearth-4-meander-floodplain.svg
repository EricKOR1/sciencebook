<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-uearth-4-meander-floodplain d-uearth-4-meander-floodplain">
<title id="t-uearth-4-meander-floodplain">그림 일반지구과학 4-3 곡류 하천과 범람원</title>
<desc id="d-uearth-4-meander-floodplain">위는 곡류 하천을 위에서 본 모습이다. 굽은 곳의 바깥쪽은 흐름이 빨라 깎이는 공격 사면, 안쪽은 흐름이 느려 모래가 쌓이는 포인트 바이며, 곡류의 목이 잘리면 우각호가 남는다. 아래는 A–B를 따라 자른 단면으로, 공격 사면 쪽이 깊고 가파르며, 범람원에는 강가의 자연 제방과 그 뒤의 낮고 습한 배후 습지가 있다. 모식도이다.</desc>
