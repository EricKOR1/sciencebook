<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-ochem-4-q-menthyl-chairs d-ochem-4-q-menthyl-chairs">
  <title id="t-ochem-4-q-menthyl-chairs">그림 유기화학 4-19 문제 13의 멘틸 염화물과 네오멘틸 염화물</title>
  <desc id="d-ochem-4-q-menthyl-chairs">두 염화물의 가장 안정한 의자 형태. 멘틸 염화물은 Cl·아이소프로필·메틸이 모두 적도 방향이고, 네오멘틸 염화물은 아이소프로필·메틸이 적도, Cl이 축 방향이다. Cl이 붙은 탄소를 a, 그 이웃의 아이소프로필이 붙은 탄소를 b, CH₂ 탄소를 c라 하고, 이 세 탄소의 H만 축·적도 방향으로 모두 그렸다.</desc>
