  <title id="t-ubio-5-morgan-cross">그림 일반생명과학 5-7 초파리 흰 눈 유전자의 정역교배</title>
  <desc id="d-ubio-5-morgan-cross">흰 눈 대립유전자 w가 X 염색체에 있고 Y에는 대응 자리가 없다고 하면 모건의 결과가 모두 설명된다. (가) 붉은 눈 암컷 × 흰 눈 수컷: F₁은 모두 붉은 눈이고, F₂는 붉은 눈 : 흰 눈 = 3 : 1인데 흰 눈은 모두 수컷이다. (나) 역교배인 흰 눈 암컷 × 붉은 눈 수컷: F₁ 암컷은 모두 붉은 눈, 수컷은 모두 흰 눈이다. 수컷은 X를 어머니에게서만 받기 때문이다.</desc>
