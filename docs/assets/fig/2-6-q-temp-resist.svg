<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 304" role="img" aria-labelledby="t-2-6-q-temp-resist d-2-6-q-temp-resist">
  <title id="t-2-6-q-temp-resist">그림 2-6-9 문제 10 온도에 따른 막대 A, B의 저항</title>
  <desc id="d-2-6-q-temp-resist">20 °C에서 80 °C로 온도를 올리면 A(구리)의 저항은 1.5 Ω에서 1.875 Ω으로 커지고, B(순수한 규소)의 저항은 1500 Ω에서 60 Ω으로 작아진다. 두 점만 잰 값이므로 막대로 나타냈다.</desc>
  <style>
    .f2-6-q-temp-resist-t{font-size:14px;fill:var(--fig-ink)} .f2-6-q-temp-resist-sm{font-size:13px;fill:var(--fig-muted)}
    .f2-6-q-temp-resist-lbl{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .f2-6-q-temp-resist-ax{stroke:var(--fig-ink);stroke-width:1.4;fill:none} .f2-6-q-temp-resist-gd{stroke:var(--fig-line);stroke-width:0.7;stroke-dasharray:3 3;fill:none}
    .f2-6-q-temp-resist-b1{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5} .f2-6-q-temp-resist-b2{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5}
  </style>
  <text x="180.0" y="30.0" text-anchor="middle" class="f2-6-q-temp-resist-lbl">A (구리)</text>
  <line x1="75" y1="240.0" x2="80" y2="240.0" class="f2-6-q-temp-resist-ax"/>
  <text x="71.0" y="244.5" text-anchor="end" class="f2-6-q-temp-resist-sm">0</text>
  <line x1="80" y1="197.5" x2="280" y2="197.5" class="f2-6-q-temp-resist-gd"/>
  <line x1="75" y1="197.5" x2="80" y2="197.5" class="f2-6-q-temp-resist-ax"/>
  <text x="71.0" y="202.0" text-anchor="end" class="f2-6-q-temp-resist-sm">0.5</text>
  <line x1="80" y1="155.0" x2="280" y2="155.0" class="f2-6-q-temp-resist-gd"/>
  <line x1="75" y1="155.0" x2="80" y2="155.0" class="f2-6-q-temp-resist-ax"/>
  <text x="71.0" y="159.5" text-anchor="end" class="f2-6-q-temp-resist-sm">1</text>
  <line x1="80" y1="112.5" x2="280" y2="112.5" class="f2-6-q-temp-resist-gd"/>
  <line x1="75" y1="112.5" x2="80" y2="112.5" class="f2-6-q-temp-resist-ax"/>
  <text x="71.0" y="117.0" text-anchor="end" class="f2-6-q-temp-resist-sm">1.5</text>
  <line x1="80" y1="70.0" x2="280" y2="70.0" class="f2-6-q-temp-resist-gd"/>
  <line x1="75" y1="70.0" x2="80" y2="70.0" class="f2-6-q-temp-resist-ax"/>
  <text x="71.0" y="74.5" text-anchor="end" class="f2-6-q-temp-resist-sm">2</text>
  <path d="M80 60 V240 H280" class="f2-6-q-temp-resist-ax"/>
  <text x="71.0" y="52.0" text-anchor="start" class="f2-6-q-temp-resist-sm">저항(Ω)</text>
  <rect x="115" y="112.5" width="50" height="127.5" class="f2-6-q-temp-resist-b1"/>
  <text x="140.0" y="105.5" text-anchor="middle" class="f2-6-q-temp-resist-t">1.5 Ω</text>
  <text x="140.0" y="260.0" text-anchor="middle" class="f2-6-q-temp-resist-sm">20 °C</text>
  <rect x="205" y="80.6" width="50" height="159.4" class="f2-6-q-temp-resist-b2"/>
  <text x="230.0" y="73.6" text-anchor="middle" class="f2-6-q-temp-resist-t">1.875 Ω</text>
  <text x="230.0" y="260.0" text-anchor="middle" class="f2-6-q-temp-resist-sm">80 °C</text>
  <text x="550.0" y="30.0" text-anchor="middle" class="f2-6-q-temp-resist-lbl">B (순수한 규소)</text>
  <line x1="445" y1="240.0" x2="450" y2="240.0" class="f2-6-q-temp-resist-ax"/>
  <text x="441.0" y="244.5" text-anchor="end" class="f2-6-q-temp-resist-sm">0</text>
  <line x1="450" y1="197.5" x2="650" y2="197.5" class="f2-6-q-temp-resist-gd"/>
  <line x1="445" y1="197.5" x2="450" y2="197.5" class="f2-6-q-temp-resist-ax"/>
  <text x="441.0" y="202.0" text-anchor="end" class="f2-6-q-temp-resist-sm">400</text>
  <line x1="450" y1="155.0" x2="650" y2="155.0" class="f2-6-q-temp-resist-gd"/>
  <line x1="445" y1="155.0" x2="450" y2="155.0" class="f2-6-q-temp-resist-ax"/>
  <text x="441.0" y="159.5" text-anchor="end" class="f2-6-q-temp-resist-sm">800</text>
  <line x1="450" y1="112.5" x2="650" y2="112.5" class="f2-6-q-temp-resist-gd"/>
  <line x1="445" y1="112.5" x2="450" y2="112.5" class="f2-6-q-temp-resist-ax"/>
  <text x="441.0" y="117.0" text-anchor="end" class="f2-6-q-temp-resist-sm">1200</text>
  <line x1="450" y1="70.0" x2="650" y2="70.0" class="f2-6-q-temp-resist-gd"/>
  <line x1="445" y1="70.0" x2="450" y2="70.0" class="f2-6-q-temp-resist-ax"/>
  <text x="441.0" y="74.5" text-anchor="end" class="f2-6-q-temp-resist-sm">1600</text>
  <path d="M450 60 V240 H650" class="f2-6-q-temp-resist-ax"/>
  <text x="441.0" y="52.0" text-anchor="start" class="f2-6-q-temp-resist-sm">저항(Ω)</text>
  <rect x="485" y="80.6" width="50" height="159.4" class="f2-6-q-temp-resist-b1"/>
  <text x="510.0" y="73.6" text-anchor="middle" class="f2-6-q-temp-resist-t">1500 Ω</text>
  <text x="510.0" y="260.0" text-anchor="middle" class="f2-6-q-temp-resist-sm">20 °C</text>
  <rect x="575" y="233.6" width="50" height="6.4" class="f2-6-q-temp-resist-b2"/>
  <text x="600.0" y="226.6" text-anchor="middle" class="f2-6-q-temp-resist-t">60 Ω</text>
  <text x="600.0" y="260.0" text-anchor="middle" class="f2-6-q-temp-resist-sm">80 °C</text>
  <text x="360.0" y="290.0" text-anchor="middle" class="f2-6-q-temp-resist-sm">두 그래프의 세로 눈금은 서로 다르다 (저항 = 3 V ÷ 전류)</text>
</svg>
