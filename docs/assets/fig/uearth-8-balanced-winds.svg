<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="t-uearth-8-balanced-winds d-uearth-8-balanced-winds">
  <title id="t-uearth-8-balanced-winds">그림 일반지구과학 8-1 지균풍·경도풍·지상풍에 작용하는 힘(북반구)</title>
  <desc id="d-uearth-8-balanced-winds">(가) 곧은 등압선에서는 기압 경도력과 전향력이 같아 바람이 등압선과 나란히 분다. (나) 저기압 둘레에서는 기압 경도력이 전향력과 원심력의 합과 같아 지균풍보다 느리고, (다) 고기압 둘레에서는 전향력이 기압 경도력과 원심력의 합과 같아 지균풍보다 빠르다. (라) 지표 마찰이 있으면 기압 경도력·전향력·마찰력의 합이 0이 되도록 바람이 저기압 쪽으로 기울어 분다. 화살표 길이는 힘의 상대적 크기를 나타낸 모식도이다.</desc>
