  <ellipse cx="601" cy="126" rx="9" ry="6" class="sp-b"/>
  <ellipse cx="649" cy="126" rx="9" ry="6" class="sp-c"/>
  <path d="M617.0 118 L633.0 134 M633.0 118 L617.0 134" class="sp-x"/>
  <text x="625.0" y="64" text-anchor="middle" class="sp-mu">장벽이 사라져도</text>
  <rect x="542" y="44" width="166" height="170" class="sp-frame"/>
  <text x="625.0" y="238" text-anchor="middle" class="sp-t">생식 능력 있는 자손을</text><text x="625.0" y="256" text-anchor="middle" class="sp-t">못 낳음 → 다른 두 종</text>
  <text x="360" y="302" text-anchor="middle" class="sp-mu">②→④에는 매우 오랜 세월(수많은 세대)이 걸린다 · 모식도</text>
</svg>
