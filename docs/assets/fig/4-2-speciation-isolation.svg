  <ellipse cx="316" cy="88" rx="9" ry="6" class="sp-a"/>
  <rect x="186" y="44" width="166" height="170" class="sp-frame"/>
  <text x="269.0" y="238" text-anchor="middle" class="sp-t">강·바다·산맥 등으로</text><text x="269.0" y="256" text-anchor="middle" class="sp-t">집단이 나뉨</text>
  <path d="M353 122.0 L363 129.0 L353 136.0 Z" class="sp-arr"/>
  <text x="447.0" y="30" text-anchor="middle" class="sp-h">③ 서로 다른 자연선택</text>
  <rect x="364" y="44" width="83.0" height="170" class="sp-dry"/><rect x="447.0" y="44" width="83.0" height="170" class="sp-wet"/>
  <path d="M436 44 Q456 104 440 144 T444 214 H464 Q460 174 462 144 T458 44 Z" class="sp-river"/>
  <ellipse cx="405" cy="98" rx="9" ry="6" class="sp-b"/>
