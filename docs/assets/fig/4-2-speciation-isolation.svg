  <text x="400" y="206" text-anchor="middle" class="sp-mu">건조</text><text x="496" y="206" text-anchor="middle" class="sp-mu">습한 숲</text>
  <rect x="364" y="44" width="166" height="170" class="sp-frame"/>
  <text x="447.0" y="238" text-anchor="middle" class="sp-t">환경이 달라 서로 다른</text><text x="447.0" y="256" text-anchor="middle" class="sp-t">변이가 선택·누적됨</text>
  <path d="M531 122.0 L541 129.0 L531 136.0 Z" class="sp-arr"/>
  <text x="625.0" y="30" text-anchor="middle" class="sp-h">④ 생식적 격리</text>
  <rect x="542" y="44" width="166" height="170" class="sp-land"/>
  <ellipse cx="582" cy="84" rx="9" ry="6" class="sp-b"/>
  <ellipse cx="612" cy="164" rx="9" ry="6" class="sp-b"/>
  <ellipse cx="572" cy="184" rx="9" ry="6" class="sp-b"/>
  <ellipse cx="662" cy="84" rx="9" ry="6" class="sp-c"/>
  <ellipse cx="682" cy="174" rx="9" ry="6" class="sp-c"/>
