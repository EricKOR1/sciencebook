  <title id="t-m3-08-book-map">그림 중3-8-2 이 책의 과목·영역 지도</title>
  <desc id="d-m3-08-book-map">이 책은 중학교 과학 23단원, 통합과학1·2 31단원, 일반 선택 4과목 13단원, 진로 선택 8과목 25단원, 그리고 대학 일반 과학 48단원으로 이루어진다. 다섯 영역 가운데 운동과 에너지, 물질, 생명, 지구와 우주는 진로 선택까지 이어지고, 과학의 기초와 사회는 중학교와 통합과학에서 다룬다. 작은 네모 하나가 단원 하나이다.</desc>
