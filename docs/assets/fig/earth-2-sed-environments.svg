<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" role="img" aria-labelledby="t-earth-2-sed-environments d-earth-2-sed-environments">
  <title id="t-earth-2-sed-environments">그림 지구과학 2-4 퇴적 환경 — 산에서 깊은 바다까지</title>
  <desc id="d-earth-2-sed-environments">산지에서 바다 쪽으로 가며 선상지·하천·호수 같은 육상 환경, 삼각주·해빈·조간대 같은 연안 환경, 대륙붕·대륙 사면·심해저 같은 해양 환경이 차례로 나타나고, 각 환경에 쌓이는 대표 퇴적물과 퇴적 구조가 다르다. 비율을 과장한 모식도이다.</desc>
  <style>
    .earth-2-sed-environments-t{font-size:14px;fill:var(--fig-ink)}
    .earth-2-sed-environments-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .earth-2-sed-environments-s{font-size:13px;fill:var(--fig-muted)}
    .earth-2-sed-environments-land{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:0.8;fill-rule:evenodd}
    .earth-2-sed-environments-sea{fill:var(--fig-soft-blue)}
    .earth-2-sed-environments-grat{fill:none;stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3;opacity:0.7}
    .earth-2-sed-environments-frame{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .earth-2-sed-environments-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
