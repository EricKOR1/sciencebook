<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-uphy-2-friction-graph d-uphy-2-friction-graph">
  <title id="t-uphy-2-friction-graph">그림 일반물리학 2-2 미는 힘에 따라 달라지는 마찰력</title>
  <desc id="d-uphy-2-friction-graph">수평 바닥의 상자를 미는 힘 F를 0부터 서서히 키울 때 마찰력의 크기를 나타낸 모식도이다. 상자가 정지해 있는 동안 정지 마찰력은 F와 같은 크기로 필요한 만큼만 생기고(기울기 1인 직선), 최댓값 μsN에 이르면 상자가 미끄러지기 시작한다. 그 뒤에는 운동 마찰력 μkN(μk &lt; μs)이 거의 일정하게 작용한다.</desc>
  <rect x="10.0" y="10.0" width="700.0" height="310.0" rx="10" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <line x1="90.0" y1="270.0" x2="511.0" y2="270.0" style="stroke:var(--fig-muted);stroke-width:1.5;fill:none"/>
  <path d="M520.0 270.0 L511.0 274.5 L511.0 265.5 Z" style="fill:var(--fig-muted);stroke:none"/>
  <text x="520.0" y="292.0" text-anchor="end" style="font-size:13px;fill:var(--fig-muted)">미는 힘 F</text>
  <line x1="90.0" y1="270.0" x2="90.0" y2="49.0" style="stroke:var(--fig-muted);stroke-width:1.5;fill:none"/>
  <path d="M90.0 40.0 L94.5 49.0 L85.5 49.0 Z" style="fill:var(--fig-muted);stroke:none"/>
  <text x="98.0" y="48.0" style="font-size:13px;fill:var(--fig-muted)">마찰력의 크기 f</text>
  <line x1="90.0" y1="270.0" x2="270.0" y2="90.0" style="stroke:var(--fig-green);stroke-width:3.5;fill:none"/>
  <line x1="270.0" y1="90.0" x2="270.0" y2="135.0" style="stroke:var(--fig-muted);stroke-width:1.5;fill:none;stroke-dasharray:4 3"/>
  <line x1="270.0" y1="135.0" x2="505.0" y2="135.0" style="stroke:var(--fig-red);stroke-width:3.5;fill:none"/>
  <circle cx="270.0" cy="90.0" r="5.0" style="fill:var(--fig-green);stroke:none;stroke-width:1.5"/>
  <line x1="90.0" y1="90.0" x2="270.0" y2="90.0" style="stroke:var(--fig-line);stroke-width:1.2;fill:none;stroke-dasharray:5 4"/>
  <text x="82.0" y="95.0" text-anchor="end" style="font-size:14px;fill:var(--fig-green);font-weight:600">μ<tspan dy="4" style="font-size:11px">s</tspan><tspan dy="-4">​</tspan>N</text>
  <line x1="90.0" y1="135.0" x2="270.0" y2="135.0" style="stroke:var(--fig-line);stroke-width:1.2;fill:none;stroke-dasharray:5 4"/>
  <text x="82.0" y="140.0" text-anchor="end" style="font-size:14px;fill:var(--fig-red);font-weight:600">μ<tspan dy="4" style="font-size:11px">k</tspan><tspan dy="-4">​</tspan>N</text>
  <line x1="270.0" y1="270.0" x2="270.0" y2="135.0" style="stroke:var(--fig-line);stroke-width:1.2;fill:none;stroke-dasharray:5 4"/>
  <text x="270.0" y="290.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-ink)">F = μ<tspan dy="4" style="font-size:11px">s</tspan><tspan dy="-4">​</tspan>N</text>
  <text x="160.0" y="230.0" style="font-size:14px;fill:var(--fig-green);font-weight:600">정지 마찰력</text>
  <text x="160.0" y="248.0" style="font-size:13px;fill:var(--fig-green)">f<tspan dy="4" style="font-size:11px">s</tspan><tspan dy="-4">​</tspan> = F (필요한 만큼)</text>
  <text x="282.0" y="96.0" style="font-size:13px;fill:var(--fig-ink)">최대 정지 마찰력 — 미끄러지기 시작</text>
  <text x="320.0" y="159.0" style="font-size:14px;fill:var(--fig-red);font-weight:600">운동 마찰력 f<tspan dy="4" style="font-size:11px">k</tspan><tspan dy="-4">​</tspan> = μ<tspan dy="4" style="font-size:11px">k</tspan><tspan dy="-4">​</tspan>N</text>
  <text x="320.0" y="177.0" style="font-size:13px;fill:var(--fig-red)">(속력과 거의 무관하게 일정)</text>
  <text x="200.0" y="80.0" text-anchor="middle" style="font-size:14px;fill:var(--fig-ink);font-weight:600">정지</text>
  <text x="387.5" y="74.0" text-anchor="middle" style="font-size:14px;fill:var(--fig-ink);font-weight:600">미끄러짐</text>
  <line x1="270.0" y1="62.0" x2="270.0" y2="80.0" style="stroke:var(--fig-line);stroke-width:1.5;fill:none"/>
  <line x1="535.0" y1="230.0" x2="700.0" y2="230.0" style="stroke:var(--fig-line);stroke-width:2;fill:none"/>
  <rect x="580.0" y="190.0" width="70.0" height="40.0" rx="3" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <line x1="535.0" y1="210.0" x2="570.0" y2="210.0" style="stroke:var(--fig-ink);stroke-width:3;fill:none"/>
  <path d="M580.0 210.0 L570.0 215.0 L570.0 205.0 Z" style="fill:var(--fig-ink);stroke:none"/>
  <text x="535.0" y="202.0" style="font-size:14px;fill:var(--fig-ink);font-weight:600">F</text>
  <line x1="615.0" y1="230.0" x2="585.0" y2="230.0" style="stroke:var(--fig-red);stroke-width:3;fill:none"/>
  <path d="M575.0 230.0 L585.0 225.0 L585.0 235.0 Z" style="fill:var(--fig-red);stroke:none"/>
  <text x="590.0" y="250.0" text-anchor="middle" style="font-size:14px;fill:var(--fig-red);font-weight:600">f</text>
  <text x="620.0" y="130.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-ink)">마찰력은 미끄러지려는</text>
  <text x="620.0" y="148.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-ink)">상대 운동의 반대 방향</text>
  <text x="30.0" y="308.0" style="font-size:13px;fill:var(--fig-muted)">모식도 — μs와 μk의 비율은 접촉면에 따라 다르다</text>
</svg>
