<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="t-esys-2-q-tsunami-share d-esys-2-q-tsunami-share">
  <title id="t-esys-2-q-tsunami-share">그림 지구시스템과학 2-13 문제 16 해설의 구간별 거리와 걸린 시간</title>
  <desc id="d-esys-2-q-tsunami-share">세 구간의 거리(위)와 걸린 시간(아래)을 전체에 대한 비율로 나타낸 막대이다. 대륙붕(③)은 거리로는 전체의 약 4 %이지만, 속력이 약 22 m/s로 느려 시간으로는 약 20 %(약 15분)를 차지한다.</desc>
  <style>
    .esys-2-q-tsunami-share-t{font-size:14px;fill:var(--fig-ink)} .esys-2-q-tsunami-share-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .esys-2-q-tsunami-share-s{font-size:13px;fill:var(--fig-muted)} .esys-2-q-tsunami-share-ax{fill:none;stroke:var(--fig-muted);stroke-width:1.4} .esys-2-q-tsunami-share-gr{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4}
  </style>
  <text x="108" y="90" text-anchor="end" class="esys-2-q-tsunami-share-b">거리</text>
  <rect x="120" y="60" width="328.8" height="44" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
  <text x="284.4" y="80" text-anchor="middle" class="esys-2-q-tsunami-share-s" style="fill:var(--fig-ink)">① 대양</text>
  <text x="284.4" y="98" text-anchor="middle" class="esys-2-q-tsunami-share-s" style="fill:var(--fig-ink)">300 km (58 %)</text>
  <rect x="448.8" y="60" width="219.2" height="44" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.5"/>
  <text x="558.5" y="80" text-anchor="middle" class="esys-2-q-tsunami-share-s" style="fill:var(--fig-ink)">② 대륙 사면</text>
  <text x="558.5" y="98" text-anchor="middle" class="esys-2-q-tsunami-share-s" style="fill:var(--fig-ink)">200 km (38 %)</text>
  <rect x="668.1" y="60" width="21.9" height="44" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <line x1="679" y1="104" x2="679" y2="122" style="stroke:var(--fig-muted);stroke-width:1"/>
  <text x="679" y="138" text-anchor="end" class="esys-2-q-tsunami-share-s">③ 대륙붕 20 km (4 %)</text>
  <text x="108" y="190" text-anchor="end" class="esys-2-q-tsunami-share-b">시간</text>
  <rect x="120" y="160" width="194.6" height="44" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
  <text x="217.3" y="180" text-anchor="middle" class="esys-2-q-tsunami-share-s" style="fill:var(--fig-ink)">① 대양</text>
  <text x="217.3" y="198" text-anchor="middle" class="esys-2-q-tsunami-share-s" style="fill:var(--fig-ink)">약 25분 (34 %)</text>
  <rect x="314.6" y="160" width="259.4" height="44" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.5"/>
  <text x="444.3" y="180" text-anchor="middle" class="esys-2-q-tsunami-share-s" style="fill:var(--fig-ink)">② 대륙 사면</text>
  <text x="444.3" y="198" text-anchor="middle" class="esys-2-q-tsunami-share-s" style="fill:var(--fig-ink)">약 34분 (46 %)</text>
  <rect x="574" y="160" width="116" height="44" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <text x="632" y="180" text-anchor="middle" class="esys-2-q-tsunami-share-s" style="fill:var(--fig-ink)">③ 대륙붕</text>
  <text x="632" y="198" text-anchor="middle" class="esys-2-q-tsunami-share-s" style="fill:var(--fig-ink)">약 15분 (20 %)</text>
  <text x="120" y="245" class="esys-2-q-tsunami-share-s">전체 520 km, 약 74분</text>
</svg>
