<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-uchem-12-organic-isomers d-uchem-12-organic-isomers">
  <title id="t-uchem-12-organic-isomers">그림 일반화학 12-6 기하 이성질과 광학 이성질</title>
  <desc id="d-uchem-12-organic-isomers">왼쪽: 2-뷰텐은 C=C 이중 결합이 회전하지 못해, 두 메틸기가 같은 쪽에 있는 시스형과 반대쪽에 있는 트랜스형이 서로 다른 물질이다. 오른쪽: 젖산의 가운데 탄소에는 서로 다른 네 원자단(–H, –OH, –CH₃, –COOH)이 붙어 있어(카이랄 중심), 거울에 비친 두 분자는 아무리 돌려도 겹쳐지지 않는다. 굵은 쐐기는 종이 앞쪽, 점선 쐐기는 뒤쪽을 향한다.</desc>
  <style>.uchem-12-organic-isomers-t{font-size:14px;fill:var(--fig-ink)} .uchem-12-organic-isomers-s{font-size:13px;fill:var(--fig-muted)} .uchem-12-organic-isomers-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}</style>
