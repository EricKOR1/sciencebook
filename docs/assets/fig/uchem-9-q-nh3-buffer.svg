  <title id="t-uchem-9-q-nh3-buffer">그림 일반화학 9-9 문제 13 — 0.200 M NH₃ 50.0 mL에 HCl을 넣을 때의 pH</title>
  <desc id="d-uchem-9-q-nh3-buffer">0.100 M HCl을 넣은 부피에 따른 pH를 전하 균형으로 계산했다(당량점 100 mL). 40.0 mL에서 pH 9.44, 반당량점 50.0 mL에서 pH 9.26(= pKₐ)이다. 곡선이 가장 완만한 반당량점에서 같은 양의 산·염기에 대한 pH 변화가 가장 작아 완충 용량이 가장 크다. 색 띠는 pKₐ ± 1 구간이다.</desc>
