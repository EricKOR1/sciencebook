  <rect x="190.0" y="200" width="165" height="30" rx="4" class="m1-07-diurnal-motion-gnd"/>
  <text x="272.5" y="28" text-anchor="middle" class="m1-07-diurnal-motion-t m1-07-diurnal-motion-b">남쪽 하늘</text>
  <text x="198.0" y="220" class="m1-07-diurnal-motion-s">동</text><text x="347.0" y="220" text-anchor="end" class="m1-07-diurnal-motion-s">서</text>
  <text x="272.5" y="252" text-anchor="middle" class="m1-07-diurnal-motion-s">동 → 서로 지나간다</text>
