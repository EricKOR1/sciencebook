<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-m1-07-diurnal-motion d-m1-07-diurnal-motion">
  <title id="t-m1-07-diurnal-motion">그림 중1-7-3 방향에 따른 별의 일주 운동</title>
  <desc id="d-m1-07-diurnal-motion">우리나라에서 각 방향의 하늘을 바라볼 때 별이 움직이는 모습. 동쪽에서는 비스듬히 떠오르고, 남쪽에서는 동에서 서로 지나가며, 서쪽에서는 비스듬히 지고, 북쪽에서는 북극성을 중심으로 시계 반대 방향으로 돈다.</desc>
  <style>.m1-07-diurnal-motion-t{font-size:14px;fill:var(--fig-ink)} .m1-07-diurnal-motion-b{font-weight:600} .m1-07-diurnal-motion-s{font-size:13px;fill:var(--fig-muted)}
    .m1-07-diurnal-motion-sky{fill:var(--fig-soft-blue)} .m1-07-diurnal-motion-gnd{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.5}
    .m1-07-diurnal-motion-tr{fill:none;stroke:var(--fig-violet);stroke-width:2} .m1-07-diurnal-motion-hd{fill:var(--fig-violet)}</style>
  <rect x="15.0" y="40" width="165" height="160" rx="6" class="m1-07-diurnal-motion-sky"/>
  <rect x="15.0" y="200" width="165" height="30" rx="4" class="m1-07-diurnal-motion-gnd"/>
  <text x="97.5" y="28" text-anchor="middle" class="m1-07-diurnal-motion-t m1-07-diurnal-motion-b">동쪽 하늘</text>
  <text x="23.0" y="220" class="m1-07-diurnal-motion-s">북</text><text x="172.0" y="220" text-anchor="end" class="m1-07-diurnal-motion-s">남</text>
  <text x="97.5" y="252" text-anchor="middle" class="m1-07-diurnal-motion-s">비스듬히 떠오른다</text>
  <path d="M33.0 200 Q53.0 125 103.0 80" class="m1-07-diurnal-motion-tr"/><path d="M109.7 74.0 L106.3 83.7 L99.7 76.3 Z" class="m1-07-diurnal-motion-hd"/>
  <path d="M78.0 200 Q98.0 125 148.0 80" class="m1-07-diurnal-motion-tr"/><path d="M154.7 74.0 L151.3 83.7 L144.7 76.3 Z" class="m1-07-diurnal-motion-hd"/>
