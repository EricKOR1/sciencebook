  <text x="622.5" y="252" text-anchor="middle" class="m1-07-diurnal-motion-s">북극성 중심, 시계 반대 방향</text>
  <circle cx="622.5" cy="102" r="4" style="fill:var(--fig-amber)"/><text x="630.5" y="96" class="m1-07-diurnal-motion-s" style="fill:var(--fig-ink)">북극성</text>
