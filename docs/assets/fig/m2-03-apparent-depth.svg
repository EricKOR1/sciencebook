<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-m2-03-apparent-depth d-m2-03-apparent-depth">
  <title id="t-m2-03-apparent-depth">그림 중2-3-4 물을 부으면 동전이 떠올라 보이는 까닭</title>
  <desc id="d-m2-03-apparent-depth">(가) 물이 없으면 동전에서 눈으로 곧게 가는 빛이 컵 벽에 가로막혀 동전이 보이지 않는다. (나) 물을 부으면 동전에서 나온 빛이 수면에서 법선에서 멀어지는 쪽으로 꺾여 컵 가장자리를 넘어 눈에 들어온다. 눈은 빛이 곧게 왔다고 여기므로 꺾인 빛을 거꾸로 연장한 곳, 곧 실제보다 위쪽에 동전이 있는 것처럼 보인다. 꺾이는 각은 물에 맞춰 계산했다.</desc>
  <style>
    .m2-03-apparent-depth-t{font-size:14px;fill:var(--fig-ink)}
    .m2-03-apparent-depth-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .m2-03-apparent-depth-s{font-size:13px;fill:var(--fig-muted)}

  </style>
  <rect x="0" y="0" width="720" height="330" style="fill:var(--fig-paper)"/>
  <rect x="14.0" y="14.0" width="336.0" height="300.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="28.0" y="40.0" class="m2-03-apparent-depth-b">(가) 물이 없을 때</text>
  <rect x="80.6" y="141.8" width="7.8" height="145.0" style="fill:var(--fig-line)"/>
  <rect x="264.8" y="141.8" width="7.8" height="145.0" style="fill:var(--fig-line)"/>
  <rect x="80.6" y="279.0" width="192.1" height="7.8" style="fill:var(--fig-line)"/>
  <rect x="190.0" y="273.1" width="28.0" height="6.0" rx="2" style="fill:var(--fig-amber)"/>
  <text x="184.0" y="278.1" text-anchor="end" class="m2-03-apparent-depth-s">실제 동전</text>
  <path d="M21.4 102.6 Q39.4 88.6 57.4 102.6 Q39.4 116.6 21.4 102.6 Z" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.8"/>
  <circle cx="44.4" cy="102.6" r="6.0" style="fill:var(--fig-ink)"/>
  <text x="39.4" y="84.6" text-anchor="middle" class="m2-03-apparent-depth-s">눈</text>
  <line x1="204.0" y1="276.1" x2="89.4" y2="155.1" style="stroke:var(--fig-red);stroke-width:2;stroke-dasharray:6 4"/>
  <text x="102.4" y="159.1" class="m2-03-apparent-depth-t" style="fill:var(--fig-red)">✕ 벽에 막힘</text>
  <text x="182.0" y="306.0" text-anchor="middle" class="m2-03-apparent-depth-s">동전에서 눈으로 가는 빛이 컵 벽에 가로막힌다</text>
  <rect x="374.0" y="14.0" width="336.0" height="300.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="388.0" y="40.0" class="m2-03-apparent-depth-b">(나) 물을 부었을 때</text>
  <rect x="448.4" y="156.5" width="176.4" height="122.5" style="fill:var(--fig-soft-blue)"/>
  <line x1="448.4" y1="156.5" x2="624.8" y2="156.5" style="stroke:var(--fig-blue);stroke-width:1.6"/>
  <text x="616.8" y="174.5" text-anchor="end" class="m2-03-apparent-depth-s">물</text>
  <rect x="440.6" y="141.8" width="7.8" height="145.0" style="fill:var(--fig-line)"/>
  <rect x="624.8" y="141.8" width="7.8" height="145.0" style="fill:var(--fig-line)"/>
  <rect x="440.6" y="279.0" width="192.1" height="7.8" style="fill:var(--fig-line)"/>
  <rect x="550.0" y="273.1" width="28.0" height="6.0" rx="2" style="fill:var(--fig-amber)"/>
  <text x="544.0" y="278.1" text-anchor="end" class="m2-03-apparent-depth-s">실제 동전</text>
  <path d="M381.4 102.6 Q399.4 88.6 417.4 102.6 Q399.4 116.6 381.4 102.6 Z" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.8"/>
  <circle cx="404.4" cy="102.6" r="6.0" style="fill:var(--fig-ink)"/>
  <text x="399.4" y="84.6" text-anchor="middle" class="m2-03-apparent-depth-s">눈</text>
  <line x1="471.6" y1="122.5" x2="471.6" y2="190.5" style="stroke:var(--fig-muted);stroke-width:1.2;stroke-dasharray:4 3"/>
  <line x1="564.0" y1="273.1" x2="471.6" y2="156.5" style="stroke:var(--fig-red);stroke-width:2.2;fill:none"/>
  <polygon points="514.7,210.9 523.6,215.5 517.2,220.6" style="fill:var(--fig-red)"/>
  <line x1="471.6" y1="156.5" x2="420.2" y2="118.2" style="stroke:var(--fig-red);stroke-width:2.2;fill:none"/>
  <polygon points="415.4,114.6 425.2,116.8 420.3,123.3" style="fill:var(--fig-red)"/>
  <line x1="471.6" y1="156.5" x2="564.0" y2="225.5" style="stroke:var(--fig-red);stroke-width:1.5;stroke-dasharray:6 4;opacity:.8"/>
  <rect x="550.0" y="222.5" width="28.0" height="6.0" rx="2" style="fill:none;stroke:var(--fig-amber);stroke-width:1.6;stroke-dasharray:3 2"/>
  <text x="564.0" y="247.5" text-anchor="middle" class="m2-03-apparent-depth-t" style="fill:var(--fig-amber);font-weight:600;paint-order:stroke;stroke:var(--fig-soft-blue);stroke-width:4px;stroke-linejoin:round">떠 보이는 동전</text>
  <text x="542.0" y="306.0" text-anchor="middle" class="m2-03-apparent-depth-s">수면에서 꺾인 빛이 가장자리를 넘어 눈에 들어온다</text>
</svg>
