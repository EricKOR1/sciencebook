  <rect x="70" y="214" width="10" height="66" class="f5-1-q-cooling-setup-desk"/><rect x="240" y="214" width="10" height="66" class="f5-1-q-cooling-setup-desk"/>
  <rect x="440" y="200" width="220" height="14" class="f5-1-q-cooling-setup-desk"/>
