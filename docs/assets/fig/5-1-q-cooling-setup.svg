<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-5-1-q-cooling-setup d-5-1-q-cooling-setup">
  <title id="t-5-1-q-cooling-setup">그림 5-1-8 문제 13 한 학생의 실험 장치 배치</title>
  <desc id="d-5-1-q-cooling-setup">작은 컵(약 70 °C의 물)은 열린 창문 옆에, 큰 비커(약 55 °C의 물)는 교실 안쪽 책상에 두고 20분 뒤 온도를 비교하였다. 모식도.</desc>
  <style>
    .f5-1-q-cooling-setup-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
    .f5-1-q-cooling-setup-gd{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 3}
    .f5-1-q-cooling-setup-n{font-size:13px;fill:var(--fig-muted)}
    .f5-1-q-cooling-setup-t{font-size:14px;fill:var(--fig-ink)}
    .f5-1-q-cooling-setup-b{font-size:14px;font-weight:700;fill:var(--fig-ink)}
    .f5-1-q-cooling-setup-lbl{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .f5-1-q-cooling-setup-sm{font-size:13px;fill:var(--fig-muted)}
    .f5-1-q-cooling-setup-ink{fill:var(--fig-ink)}
    .f5-1-q-cooling-setup-l-blue{fill:none;stroke:var(--fig-blue);stroke-width:2.5}
    .f5-1-q-cooling-setup-l-red{fill:none;stroke:var(--fig-red);stroke-width:2.5}
    .f5-1-q-cooling-setup-l-mut{fill:none;stroke:var(--fig-muted);stroke-width:2.2;stroke-dasharray:7 4}
    .f5-1-q-cooling-setup-l-amber{fill:none;stroke:var(--fig-amber);stroke-width:2.5}
    .f5-1-q-cooling-setup-d-blue{fill:var(--fig-blue);stroke:var(--fig-paper);stroke-width:1.5}
    .f5-1-q-cooling-setup-d-red{fill:var(--fig-red);stroke:var(--fig-paper);stroke-width:1.5}
    .f5-1-q-cooling-setup-d-mut{fill:var(--fig-muted);stroke:var(--fig-paper);stroke-width:1.5}
    .f5-1-q-cooling-setup-d-amber{fill:var(--fig-amber);stroke:var(--fig-paper);stroke-width:1.5}
    .f5-1-q-cooling-setup-tb{font-size:14px;font-weight:700;fill:var(--fig-blue)}
    .f5-1-q-cooling-setup-tr{font-size:14px;font-weight:700;fill:var(--fig-red)}
    .f5-1-q-cooling-setup-tm{font-size:14px;font-weight:700;fill:var(--fig-muted)}
    .f5-1-q-cooling-setup-ta{font-size:14px;font-weight:700;fill:var(--fig-amber)}

    .f5-1-q-cooling-setup-wall{fill:var(--fig-paper);stroke:var(--fig-ink);stroke-width:2}
    .f5-1-q-cooling-setup-win{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.8}
    .f5-1-q-cooling-setup-desk{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.8}
    .f5-1-q-cooling-setup-wat{fill:var(--fig-soft-red);stroke:none}
    .f5-1-q-cooling-setup-gl{fill:none;stroke:var(--fig-ink);stroke-width:2}
    .f5-1-q-cooling-setup-th{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.3}
    .f5-1-q-cooling-setup-thr{fill:var(--fig-red)}
  </style>
  <rect x="20" y="30" width="680" height="250" class="f5-1-q-cooling-setup-wall"/>
