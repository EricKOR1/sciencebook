  <path d="M148 144 L152 148 V200 H198 V148 L202 144" class="f5-1-q-cooling-setup-gl"/>
  <rect x="179.3" y="104" width="8" height="82" rx="4" class="f5-1-q-cooling-setup-th"/>
  <circle cx="183.3" cy="188" r="6" class="f5-1-q-cooling-setup-thr"/>
  <text x="175" y="80" text-anchor="middle" class="f5-1-q-cooling-setup-b">작은 컵</text>
  <text x="175" y="98" text-anchor="middle" class="f5-1-q-cooling-setup-t">약 70 °C</text>
  <rect x="497" y="128" width="106" height="70" class="f5-1-q-cooling-setup-wat"/>
  <path d="M491 110 L495 114 V200 H605 V114 L609 110" class="f5-1-q-cooling-setup-gl"/>
  <rect x="565.8" y="70" width="8" height="116" rx="4" class="f5-1-q-cooling-setup-th"/>
  <circle cx="569.8" cy="188" r="6" class="f5-1-q-cooling-setup-thr"/>
  <text x="550" y="46" text-anchor="middle" class="f5-1-q-cooling-setup-b">큰 비커</text>
  <text x="550" y="64" text-anchor="middle" class="f5-1-q-cooling-setup-t">약 55 °C</text>
</svg>
