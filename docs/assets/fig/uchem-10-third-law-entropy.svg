<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-uchem-10-third-law-entropy d-uchem-10-third-law-entropy">
  <title id="t-uchem-10-third-law-entropy">그림 일반화학 10-3 0 K에서 출발해 쌓아 올린 절대 엔트로피</title>
  <desc id="d-uchem-10-third-law-entropy">어떤 물질의 몰 엔트로피를 온도에 따라 그린 모식도(값은 물과 비슷하게 잡았다). 완전한 결정은 0 K에서 S = 0이다. 각 상 안에서는 Cₚ/T를 적분한 만큼 서서히 늘고, 녹는점과 끓는점에서는 ΔH/T만큼 계단처럼 뛰어오른다. 증발의 계단이 융해의 계단보다 훨씬 크다.</desc>
