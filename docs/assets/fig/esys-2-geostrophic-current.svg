<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-esys-2-geostrophic-current d-esys-2-geostrophic-current">
  <title id="t-esys-2-geostrophic-current">그림 지구시스템과학 2-4 지형류의 힘 균형(북반구 아열대 순환)</title>
  <desc id="d-esys-2-geostrophic-current">아열대 해역 중앙의 해수면이 볼록하게 높아 수압 경도력이 바깥쪽으로 작용하고, 전향력이 이와 크기가 같고 방향이 반대가 되면 해수는 해수면 등고선을 따라 시계 방향으로 흐른다. 서쪽 가장자리에서는 북쪽으로, 동쪽 가장자리에서는 남쪽으로 흐른다.</desc>
  <style>
    .esys-2-geostrophic-current-t{font-size:13px;fill:var(--fig-ink)}
    .esys-2-geostrophic-current-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .esys-2-geostrophic-current-s{font-size:13px;fill:var(--fig-muted)}
    .esys-2-geostrophic-current-r{font-size:13px;font-weight:600;fill:var(--fig-red)}
    .esys-2-geostrophic-current-u{font-size:13px;font-weight:600;fill:var(--fig-blue)}
  </style>
  <!-- 왼쪽: 동서 단면 -->
  <text x="190" y="24" text-anchor="middle" class="esys-2-geostrophic-current-b">동서 방향 단면</text>
  <path d="M30 150 C110 148 140 92 190 90 C240 92 270 148 350 150 L350 270 L30 270 Z" style="fill:var(--fig-soft-blue);stroke:none"/>
  <path d="M30 150 C110 148 140 92 190 90 C240 92 270 148 350 150" style="fill:none;stroke:var(--fig-blue);stroke-width:2.5"/>
  <line x1="30" y1="150" x2="350" y2="150" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4"/>
  <path d="M190 92 v54" style="stroke:var(--fig-muted);stroke-width:1;fill:none"/>
  <text x="198" y="138" class="esys-2-geostrophic-current-s">약 1 m 높음</text>
  <text x="190" y="72" text-anchor="middle" class="esys-2-geostrophic-current-t">해수면이 높은 중앙</text>
  <text x="34" y="292" class="esys-2-geostrophic-current-s">← 서</text>
  <text x="346" y="292" text-anchor="end" class="esys-2-geostrophic-current-s">동 →</text>
  <!-- 서쪽 물 덩어리: 수압 경도력(서쪽), 전향력(동쪽), 흐름 북쪽(⊗) -->
  <circle cx="110" cy="200" r="11" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2"/>
  <path d="M103 193 l14 14 M117 193 l-14 14" style="stroke:var(--fig-ink);stroke-width:2;fill:none"/>
  <path d="M97 200 h-38" style="stroke:var(--fig-red);stroke-width:3;fill:none"/><path d="M50 200 l11 -6 v12 z" style="fill:var(--fig-red)"/>
  <path d="M123 200 h38" style="stroke:var(--fig-blue);stroke-width:3;fill:none"/><path d="M170 200 l-11 -6 v12 z" style="fill:var(--fig-blue)"/>
  <text x="110" y="236" text-anchor="middle" class="esys-2-geostrophic-current-t">⊗ 북쪽으로 흐름</text>
  <!-- 동쪽 물 덩어리: 수압 경도력(동쪽), 전향력(서쪽), 흐름 남쪽(⊙) -->
  <circle cx="270" cy="200" r="11" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2"/>
  <circle cx="270" cy="200" r="3" style="fill:var(--fig-ink)"/>
  <path d="M283 200 h38" style="stroke:var(--fig-red);stroke-width:3;fill:none"/><path d="M330 200 l-11 -6 v12 z" style="fill:var(--fig-red)"/>
  <path d="M257 200 h-38" style="stroke:var(--fig-blue);stroke-width:3;fill:none"/><path d="M210 200 l11 -6 v12 z" style="fill:var(--fig-blue)"/>
  <text x="270" y="236" text-anchor="middle" class="esys-2-geostrophic-current-t">⊙ 남쪽으로 흐름</text>
  <text x="190" y="316" text-anchor="middle" class="esys-2-geostrophic-current-s">⊗ 화면 안쪽(북)  ⊙ 화면 바깥쪽(남)</text>
  <!-- 오른쪽: 위에서 본 모습 -->
  <text x="545" y="24" text-anchor="middle" class="esys-2-geostrophic-current-b">위에서 본 모습</text>
  <ellipse cx="545" cy="160" rx="140" ry="105" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
  <ellipse cx="545" cy="160" rx="96" ry="70" style="fill:none;stroke:var(--fig-blue);stroke-width:1.2;stroke-dasharray:5 4"/>
  <ellipse cx="545" cy="160" rx="50" ry="36" style="fill:none;stroke:var(--fig-blue);stroke-width:1.2;stroke-dasharray:5 4"/>
  <text x="545" y="165" text-anchor="middle" class="esys-2-geostrophic-current-b">높음</text>
  <!-- 시계 방향 흐름 화살표 -->
  <g style="fill:none;stroke:var(--fig-ink);stroke-width:2.5">
    <path d="M436 200 C426 160 432 120 456 98"/>
    <path d="M610 84 C640 98 660 122 662 150"/>
    <path d="M654 210 C636 236 600 252 560 256"/>
  </g>
  <g style="fill:var(--fig-ink)">
    <path d="M464 92 l-6 14 l-8 -9 z"/>
    <path d="M663 162 l-7 -13 l12 -2 z"/>
    <path d="M548 256 l13 -7 l1 12 z"/>
  </g>
  <!-- 서쪽 가장자리 힘 균형 -->
  <circle cx="420" cy="140" r="6" style="fill:var(--fig-ink)"/>
  <path d="M414 140 h-20" style="stroke:var(--fig-red);stroke-width:3;fill:none"/><path d="M386 140 l10 -5 v10 z" style="fill:var(--fig-red)"/>
  <path d="M426 140 h20" style="stroke:var(--fig-blue);stroke-width:3;fill:none"/><path d="M454 140 l-10 -5 v10 z" style="fill:var(--fig-blue)"/>
  <!-- 범례 -->
  <path d="M396 296 h26" style="stroke:var(--fig-red);stroke-width:3"/><text x="428" y="300" class="esys-2-geostrophic-current-r">수압 경도력(높은 곳 → 낮은 곳)</text>
  <path d="M396 318 h26" style="stroke:var(--fig-blue);stroke-width:3"/><text x="428" y="322" class="esys-2-geostrophic-current-u">전향력(흐름의 오른쪽 직각)</text>
  <text x="190" y="334" text-anchor="middle" class="esys-2-geostrophic-current-s">모식도 — 해수면 높이 차는 크게 과장</text>
</svg>
