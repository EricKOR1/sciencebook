<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" role="img" aria-labelledby="t-3-2-boundary-sections d-3-2-boundary-sections">
<title id="t-3-2-boundary-sections">그림 3-2-3 판의 경계 종류별 단면과 지진·화산</title>
<desc id="d-3-2-boundary-sections">발산형 경계(해령), 수렴형 경계 중 섭입형과 충돌형은 옆에서 자른 단면으로, 보존형 경계(변환 단층)는 위에서 본 모습으로 나타냈다. 섭입형에서는 진원이 대륙 쪽으로 갈수록 깊어지고, 충돌형과 보존형에는 화산이 거의 없다. 두께와 기울기를 과장한 모식도이다.</desc>
