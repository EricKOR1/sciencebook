<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-pchem-10-h-chemical-shifts d-pchem-10-h-chemical-shifts">
  <title id="t-pchem-10-h-chemical-shifts">그림 물리화학 10-13 ¹H 화학적 이동의 대략적 범위</title>
  <desc id="d-pchem-10-h-chemical-shifts">가로축 δ(ppm)는 관례대로 오른쪽이 0(TMS 기준선), 왼쪽이 큰 값이다. 띠는 대략의 범위: 알케인 C–H 0.9~1.7, C=O 옆 C–H 2.0~2.6, 할로젠·산소에 붙은 C–H 3.0~4.5, 알켄 C–H 4.5~6.5, 방향족 C–H 6.5~8.0, 알데하이드 9~10, 카복실산 10~13. 왼쪽으로 갈수록 가려막기가 줄어든(벗겨진) 양성자이다. 아래 점은 CH₄ 0.2, CH₃Cl 3.1, CH₂Cl₂ 5.3, CHCl₃ 7.3으로, 전기 음성 원자가 늘수록 왼쪽으로 옮겨 간다.</desc>
  <style>.pchem-10-h-chemical-shifts-lbl{font-size:14px;fill:var(--fig-ink)} .pchem-10-h-chemical-shifts-sm{font-size:13px;fill:var(--fig-muted)} .pchem-10-h-chemical-shifts-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .pchem-10-h-chemical-shifts-tk{font-size:13px;fill:var(--fig-muted)} .pchem-10-h-chemical-shifts-ax{font-size:14px;fill:var(--fig-ink)} .pchem-10-h-chemical-shifts-red{font-size:14px;fill:var(--fig-red)} .pchem-10-h-chemical-shifts-blue{font-size:14px;fill:var(--fig-blue)} .pchem-10-h-chemical-shifts-green{font-size:14px;fill:var(--fig-green)} .pchem-10-h-chemical-shifts-amber{font-size:14px;fill:var(--fig-amber)} .pchem-10-h-chemical-shifts-violet{font-size:14px;fill:var(--fig-violet)} .pchem-10-h-chemical-shifts-teal{font-size:14px;fill:var(--fig-teal)} .pchem-10-h-chemical-shifts-acc{font-size:14px;fill:var(--fig-accent)} .pchem-10-h-chemical-shifts-mut{font-size:14px;fill:var(--fig-muted)} .pchem-10-h-chemical-shifts-big{font-size:16px;font-weight:700;fill:var(--fig-ink)}</style>
