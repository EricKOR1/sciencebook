  <text x="540.1" y="226.0" text-anchor="end" class="pchem-10-h-chemical-shifts-teal">C=O 옆 C–H</text>
  <rect x="457.9" y="183.0" width="69.6" height="20.0" rx="4" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.5"/>
  <text x="451.9" y="198.0" text-anchor="end" class="pchem-10-h-chemical-shifts-green">할로젠·O에 붙은 C–H</text>
