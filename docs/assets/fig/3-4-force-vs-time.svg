<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-3-4-force-vs-time d-3-4-force-vs-time">
  <title id="t-3-4-force-vs-time">그림 3-4-4 운동량 변화량이 같을 때 충돌 시간과 평균 힘</title>
  <desc id="d-3-4-force-vs-time">예제 4처럼 운동량 변화량이 900 kg·m/s로 정해져 있으면 평균 힘은 충돌 시간에 반비례한다(F = 900 ÷ Δt). 운전대(0.01 s)와 에어백(0.15 s)의 두 직사각형은 넓이(평균 힘 × 시간 = 충격량)가 900 N·s로 같다.</desc>
  <style>
    .f3-4-force-vs-time-lbl{font-size:15px;fill:var(--fig-ink)} .f3-4-force-vs-time-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .f3-4-force-vs-time-sm{font-size:13px;fill:var(--fig-muted)} .f3-4-force-vs-time-ink{font-size:13px;fill:var(--fig-ink)}
    .f3-4-force-vs-time-ax{stroke:var(--fig-ink);stroke-width:1.5;fill:none} .f3-4-force-vs-time-grid{stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 4;fill:none}
  </style>
