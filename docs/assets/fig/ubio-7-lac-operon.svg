<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="t-ubio-7-lac-operon d-ubio-7-lac-operon">
<title id="t-ubio-7-lac-operon">그림 일반생명과학 7-4 젖당 오페론의 세 가지 상태</title>
<desc id="d-ubio-7-lac-operon">위: 젖당 오페론의 배치(조절 유전자 lacI, CAP 결합 자리, 프로모터, 작동 부위, 구조 유전자 lacZ·lacY·lacA). ① 젖당이 없으면 활성형 억제 단백질이 작동 부위에 붙어 전사가 거의 없다. ② 젖당이 있으면 알로락토스가 억제 단백질에 붙어 떨어지지만, 포도당이 많아 cAMP–CAP이 없으면 전사가 약하다. ③ 젖당이 있고 포도당이 적으면 cAMP–CAP이 프로모터 앞에 붙어 RNA 중합 효소의 결합을 도와 전사가 활발하다. 모식도이다.</desc>
