<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" class="fig-small" role="img" aria-labelledby="t-uphy-1-q-fast-river d-uphy-1-q-fast-river">
  <title id="t-uphy-1-q-fast-river">그림 일반물리학 1-13 문제 16 해설: 물살이 배보다 빠를 때 가장 덜 떠내려가는 방향</title>
  <desc id="d-uphy-1-q-fast-river">물살의 속도 3.00 m/s(오른쪽, 하류) 끝에 반지름 2.00 m/s인 원을 그리면, 물에 대한 배의 속도가 어느 방향이든 땅에 대한 속도는 원 위의 점을 향한다. 땅에 대한 속도가 원에 접할 때 상류 쪽으로 가장 많이 기울고, 이때 뱃머리는 정면에서 상류로 41.8° 돌아가 있다. 점선은 뱃머리를 정면으로 향한 경우이다. 화살표 길이는 속력에 비례한다.</desc>
  <path d="M390.0 262.0 A140.0 140.0 0 0 0 110.0 262.0" style="fill:none;stroke:var(--fig-muted);stroke-width:1.3;stroke-dasharray:5 4"/>
  <line x1="40.0" y1="262.0" x2="238.9" y2="262.0" style="stroke:var(--fig-blue);stroke-width:2.8;fill:none"/>
  <path d="M250.0 262.0 L238.4 267.2 L238.4 256.8 Z" style="fill:var(--fig-blue);stroke:none"/>
  <line x1="250.0" y1="262.0" x2="250.0" y2="131.1" style="stroke:var(--fig-muted);stroke-width:1.8;fill:none;stroke-dasharray:5 3"/>
  <path d="M250.0 122.0 L254.3 131.6 L245.7 131.6 Z" style="fill:var(--fig-muted);stroke:none"/>
  <line x1="40.0" y1="262.0" x2="242.4" y2="127.0" style="stroke:var(--fig-muted);stroke-width:1.8;fill:none;stroke-dasharray:5 3"/>
  <path d="M250.0 122.0 L244.4 130.9 L239.6 123.7 Z" style="fill:var(--fig-muted);stroke:none"/>
  <line x1="250.0" y1="262.0" x2="164.1" y2="165.9" style="stroke:var(--fig-amber);stroke-width:2.8;fill:none"/>
  <path d="M156.7 157.7 L168.3 162.8 L160.5 169.8 Z" style="fill:var(--fig-amber);stroke:none"/>
  <line x1="40.0" y1="262.0" x2="148.1" y2="165.3" style="stroke:var(--fig-violet);stroke-width:3;fill:none"/>
  <path d="M156.7 157.7 L151.3 169.7 L144.1 161.6 Z" style="fill:var(--fig-violet);stroke:none"/>
  <path d="M163.3 165.1 L155.9 171.8 L149.2 164.3" style="fill:none;stroke:var(--fig-ink);stroke-width:1.2"/>
  <path d="M250.0 228.0 A34.0 34.0 0 0 0 227.3 236.7" style="fill:none;stroke:var(--fig-ink);stroke-width:1.3"/>
  <text x="244.0" y="222.0" text-anchor="end" style="font-size:14px;fill:var(--fig-ink)">θ</text>
  <text x="145.0" y="284.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-blue);font-weight:600">v<tspan dy="4" style="font-size:11px">WG</tspan><tspan dy="-4">​</tspan> = 3.00 m/s (물살)</text>
  <text x="150.7" y="147.7" text-anchor="end" style="font-size:12px;fill:var(--fig-muted)">접점</text>
  <text x="233.3" y="231.8" style="font-size:14px;fill:var(--fig-amber);font-weight:600">v<tspan dy="4" style="font-size:11px">BW</tspan><tspan dy="-4">​</tspan></text>
  <text x="88.3" y="205.8" text-anchor="end" style="font-size:14px;fill:var(--fig-violet);font-weight:600">v<tspan dy="4" style="font-size:11px">BG</tspan><tspan dy="-4">​</tspan></text>
  <text x="258.0" y="116.0" style="font-size:12px;fill:var(--fig-muted)">정면으로 향할 때</text>
  <text x="386.0" y="148.0" text-anchor="end" style="font-size:12px;fill:var(--fig-amber)">|v<tspan dy="4" style="font-size:11px">BW</tspan><tspan dy="-4">​</tspan>| = 2.00 m/s</text>
  <text x="16.0" y="30.0" style="font-size:13px;fill:var(--fig-ink);font-weight:600">sin θ = 2.00/3.00 → θ = 41.8°</text>
  <text x="16.0" y="50.0" style="font-size:12px;fill:var(--fig-muted)">건너는 방향 ↑, 하류 →</text>
  <text x="16.0" y="318.0" style="font-size:12px;fill:var(--fig-muted)">원 위의 점 = 뱃머리의 모든 방향</text>
</svg>
