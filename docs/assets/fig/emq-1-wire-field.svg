<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-emq-1-wire-field d-emq-1-wire-field">
  <title id="t-emq-1-wire-field">그림 전자기와 양자 1-4 직선 전류와 솔레노이드의 자기력선</title>
  <desc id="d-emq-1-wire-field">종이면에서 나오는 직선 전류 주위의 자기력선은 도선을 중심으로 하는 동심원이며, 오른손 엄지를 전류 방향으로 하면 네 손가락이 감기는 시계 반대 방향이다. 도선에서 멀어질수록 동심원 간격이 넓어져 자기장이 약해진다(B ∝ I/r). 솔레노이드 내부의 자기력선은 간격이 일정한 평행선이고 바깥은 막대자석과 비슷하다.</desc>
