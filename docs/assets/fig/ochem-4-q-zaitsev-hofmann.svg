<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-ochem-4-q-zaitsev-hofmann d-ochem-4-q-zaitsev-hofmann">
  <title id="t-ochem-4-q-zaitsev-hofmann">그림 유기화학 4-14 예제 12 염기의 크기에 따른 자이체프·호프만 생성물</title>
  <desc id="d-ochem-4-q-zaitsev-hofmann">가운데: 2-브로모-2-메틸뷰테인. 안쪽 C3의 H(주황)와 바깥쪽 C1(CH₃)의 H(파랑)를 구별했다. 왼쪽: 작은 에톡사이드는 안쪽 C3–H에 다가갈 수 있어 더 치환된 2-메틸뷰트-2-엔(자이체프, 약 70 %)이 주생성물이다. 오른쪽: 부피 큰 tert-뷰톡사이드(공간 채움 모형)는 안쪽 C3–H로 가는 길이 에틸·메틸기에 막히고(×) 노출된 CH₃의 H를 떼어 2-메틸뷰트-1-엔(호프만, 약 70 %)이 주생성물이다.</desc>
