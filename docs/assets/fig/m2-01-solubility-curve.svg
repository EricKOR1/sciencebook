  <text x="305.0" y="410" text-anchor="middle" class="m2-01-solubility-curve-t">온도 (°C)</text>
  <text transform="translate(28 200.0) rotate(-90)" text-anchor="middle" class="m2-01-solubility-curve-t">용해도 (g/물 100 g)</text>
