<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-m2-01-solubility-curve d-m2-01-solubility-curve">
  <title id="t-m2-01-solubility-curve">그림 중2-1-1 질산 칼륨과 염화 나트륨의 용해도 곡선</title>
  <desc id="d-m2-01-solubility-curve">물 100 g에 녹을 수 있는 최대 양을 온도에 따라 나타낸 그래프. 질산 칼륨은 온도가 높을수록 용해도가 크게 늘지만 염화 나트륨은 거의 변하지 않는다. 질산 칼륨 80 g을 녹인 60 °C 용액을 20 °C로 식히면, 녹아 있던 양과 20 °C 용해도의 차이(48 g)만큼 결정이 나온다.</desc>
  <style>.m2-01-solubility-curve-t{font-size:14px;fill:var(--fig-ink)} .m2-01-solubility-curve-s{font-size:13px;fill:var(--fig-muted)} .m2-01-solubility-curve-g{stroke:var(--fig-line);stroke-width:0.8;opacity:0.5} .m2-01-solubility-curve-ax{stroke:var(--fig-ink);stroke-width:1.5}</style>
