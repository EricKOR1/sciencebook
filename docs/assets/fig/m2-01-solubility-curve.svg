  <text x="520.0" y="284.0" text-anchor="end" class="m2-01-solubility-curve-t" style="fill:var(--fig-blue);font-weight:600">염화 나트륨</text>
  <line x1="348.0" y1="218.9" x2="182.0" y2="218.9" style="stroke:var(--fig-violet);stroke-width:2;stroke-dasharray:5 4"/>
