  <text x="434.0" y="388" text-anchor="middle" class="m2-01-solubility-curve-s">80</text>
  <line x1="477.0" y1="30" x2="477.0" y2="370" class="m2-01-solubility-curve-g"/>
  <text x="477.0" y="388" text-anchor="middle" class="m2-01-solubility-curve-s">90</text>
