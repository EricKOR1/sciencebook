  <line x1="176.0" y1="218.9" x2="176.0" y2="310.3" style="stroke:var(--fig-violet);stroke-width:5;opacity:0.45"/>
  <circle cx="176.0" cy="310.3" r="4" style="fill:var(--fig-red)"/>
  <text x="545" y="60" class="m2-01-solubility-curve-s" style="fill:var(--fig-violet)">예제 3: 60 °C의 물 100 g에</text>
  <text x="545" y="79" class="m2-01-solubility-curve-s" style="fill:var(--fig-violet)">질산 칼륨 80 g을 녹인 뒤</text>
  <text x="545" y="98" class="m2-01-solubility-curve-s" style="fill:var(--fig-violet)">20 °C로 식히면</text>
  <text x="545" y="140" class="m2-01-solubility-curve-s" style="fill:var(--fig-violet)">80 − 32 = 48 g이</text>
