<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-pchem-11-entropy-contributions d-pchem-11-entropy-contributions">
  <title id="t-pchem-11-entropy-contributions">그림 물리화학 11-10 표준 몰 엔트로피의 운동별 기여(298 K, 1 bar)</title>
  <desc id="d-pchem-11-entropy-contributions">분광 자료로 계산한 표준 몰 엔트로피를 병진·회전·진동·전자 기여로 쌓은 막대(J/(mol·K)). Ar 154.8(병진만), N₂ 150.4 + 41.1 = 191.6, CO 150.4 + 47.2 = 197.6, O₂ 152.1 + 43.8 + 9.1(R ln 3) = 205.1, I₂ 177.9 + 74.2 + 8.4 = 260.5. 검은 점은 열역학 자료표의 값 154.8, 191.6, 197.7, 205.1, 260.7로 계산값과 거의 겹친다. 어느 기체에서나 병진이 가장 크다.</desc>
