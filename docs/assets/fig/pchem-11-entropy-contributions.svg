    .pchem-11-entropy-contributions-t{font-size:14px;fill:var(--fig-ink)}
    .pchem-11-entropy-contributions-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .pchem-11-entropy-contributions-h{font-size:15px;font-weight:600;fill:var(--fig-ink)}
