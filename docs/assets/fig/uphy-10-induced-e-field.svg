<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img" aria-labelledby="t-uphy-10-induced-e-field d-uphy-10-induced-e-field">
  <title id="t-uphy-10-induced-e-field">그림 일반물리학 10-3 솔레노이드 안팎의 유도 전기장</title>
  <desc id="d-uphy-10-induced-e-field">종이에 들어가는 방향의 자기장이 커지는 솔레노이드를 축 방향에서 보았다. 유도 전기장은 축을 중심으로 한 닫힌 원을 따라 시계 반대 방향으로 돈다. 세기는 솔레노이드 안에서 축으로부터의 거리 r에 비례하고, 자기장이 없는 바깥에서도 0이 아니며 r에 반비례하여 줄어든다. 경계 r = R에서 가장 크다.</desc>
