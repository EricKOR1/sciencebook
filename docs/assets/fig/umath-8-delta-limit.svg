    .u8dl-h0{fill:var(--fig-blue)}
    .u8dl-c1{stroke:var(--fig-green);stroke-width:2.4;fill:none}
    .u8dl-l1{font-size:14px;fill:var(--fig-green);font-weight:600}
    .u8dl-h1{fill:var(--fig-green)}
    .u8dl-c2{stroke:var(--fig-amber);stroke-width:2.4;fill:none}
    .u8dl-l2{font-size:14px;fill:var(--fig-amber);font-weight:600}
    .u8dl-h2{fill:var(--fig-amber)}
    .u8dl-c3{stroke:var(--fig-red);stroke-width:2.4;fill:none}
