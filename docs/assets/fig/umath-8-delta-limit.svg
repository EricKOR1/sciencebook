<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-umath-8-delta-limit d-umath-8-delta-limit">
  <title id="t-umath-8-delta-limit">그림 수학 도구 8-9 넓이 1을 유지하며 폭이 줄어드는 가우스 함수와 디랙 델타 함수</title>
  <desc id="d-umath-8-delta-limit">넓이가 1인 가우스 함수 exp(−x²/2σ²)/(σ√(2π))를 σ = 1, 0.5, 0.2, 0.05에서 겹쳐 그렸다. σ = 0.05의 봉우리 높이 약 8은 그래프 위쪽을 벗어나므로 화살표로 나타냈다. 오른쪽 칸은 그 극한인 δ(x)를 x = 0에 세운 넓이 1의 화살표로 나타낸 기호이다.</desc>
