<text x="110" y="185" text-anchor="middle" class="ubio-8-speciation-s">유전자 흐름이 자유롭다</text>
<text x="360" y="168" text-anchor="middle" class="ubio-8-speciation-t">장벽 → 유전자 흐름 끊김</text>
<text x="360" y="185" text-anchor="middle" class="ubio-8-speciation-s">각자 선택·부동·돌연변이</text>
<text x="610" y="168" text-anchor="middle" class="ubio-8-speciation-t">다시 만나도 교배하지 않음</text>
<text x="610" y="185" text-anchor="middle" class="ubio-8-speciation-s">생식적 격리 → 두 종</text>
