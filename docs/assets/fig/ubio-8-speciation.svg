.ubio-8-speciation-hab{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.5}
.ubio-8-speciation-A{fill:var(--fig-blue);stroke:var(--fig-panel);stroke-width:1} .ubio-8-speciation-B{fill:var(--fig-red);stroke:var(--fig-panel);stroke-width:1}
.ubio-8-speciation-arr{stroke:var(--fig-muted);stroke-width:2} .ubio-8-speciation-ah{fill:var(--fig-muted)}
</style>
