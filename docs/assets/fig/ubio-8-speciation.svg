<title id="t-ubio-8-speciation">그림 일반생명과학 8-2 이소적 종 분화와 동소적 종 분화</title>
<desc id="d-ubio-8-speciation">위: 지리적 장벽으로 나뉜 두 집단이 유전자 흐름 없이 따로 변해, 다시 만나도 교배하지 않는 두 종이 된다. 아래: 같은 지역 안에서 배수성이나 새 서식지·짝 선호 때문에 일부 개체 사이의 유전자 흐름이 끊겨 두 종이 된다. 모식도이다.</desc>
