  <text x="462.0" y="168.0" text-anchor="end" class="ubio-11-gas-exchange-b">O₂</text>
  <text x="618.0" y="168.0" class="ubio-11-gas-exchange-b">CO₂</text>
  <text x="550.0" y="274.0" text-anchor="middle" class="ubio-11-gas-exchange-b">조직 세포(세포호흡)</text>
  <text x="550.0" y="294.0" text-anchor="middle" class="ubio-11-gas-exchange-t">PO₂ 40 이하, PCO₂ 46 이상</text>
  <line x1="690.0" y1="130.0" x2="697.0" y2="130.0" style="stroke:var(--fig-blue);stroke-width:2"/>
  <path d="M706.0 130.0 L697.0 134.5 L697.0 125.5 Z" style="fill:var(--fig-blue)"/>
  <text x="700.0" y="324.0" text-anchor="end" class="ubio-11-gas-exchange-t">정맥혈 PO₂ 40, PCO₂ 46</text>
  <polyline points="680.0,146.0 680.0,308.0" class="ubio-11-gas-exchange-lead"/>
  <text x="550.0" y="360.0" text-anchor="middle" class="ubio-11-gas-exchange-s">격렬한 운동 시 근육은 PO₂ 20 이하로 내려가</text>
  <text x="550.0" y="378.0" text-anchor="middle" class="ubio-11-gas-exchange-s">같은 혈액에서 더 많은 O₂를 받는다</text>
  <line x1="365.0" y1="30.0" x2="365.0" y2="380.0" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4"/>
  <text x="360.0" y="396.0" text-anchor="middle" class="ubio-11-gas-exchange-s">기체는 분압이 높은 곳 → 낮은 곳으로 확산 · 단위 mmHg · 모식도</text>
</svg>
