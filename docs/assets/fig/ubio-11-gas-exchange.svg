  <path d="M166,30 L166,104 L194,104 L194,30" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <circle cx="180.0" cy="170.0" r="72.0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <rect x="167.0" y="96.0" width="26.0" height="12.0" style="fill:var(--fig-soft-blue);stroke:none"/>
  <text x="202.0" y="46.0" class="ubio-11-gas-exchange-s">들숨 PO₂ 160</text>
  <text x="180.0" y="152.0" text-anchor="middle" class="ubio-11-gas-exchange-b">폐포</text>
  <text x="180.0" y="174.0" text-anchor="middle" class="ubio-11-gas-exchange-t">PO₂ 100</text>
  <text x="180.0" y="194.0" text-anchor="middle" class="ubio-11-gas-exchange-t">PCO₂ 40</text>
  <path d="M30,272 C80,272 100,250 180,250 C260,250 280,272 330,272" style="fill:none;stroke:url(#ubio-11-gas-exchange-a);stroke-width:22;stroke-opacity:0.45"/>
  <path d="M30,272 C80,272 100,250 180,250 C260,250 280,272 330,272" style="fill:none;stroke:var(--fig-line);stroke-width:1"/>
  <line x1="150.0" y1="238.0" x2="150.0" y2="252.0" style="stroke:var(--fig-teal);stroke-width:2.2"/>
  <path d="M150.0 260.0 L146.0 252.0 L154.0 252.0 Z" style="fill:var(--fig-teal)"/>
  <line x1="210.0" y1="256.0" x2="210.0" y2="242.0" style="stroke:var(--fig-muted);stroke-width:2.2"/>
  <path d="M210.0 234.0 L214.0 242.0 L206.0 242.0 Z" style="fill:var(--fig-muted)"/>
  <text x="144.0" y="232.0" text-anchor="end" class="ubio-11-gas-exchange-b">O₂</text>
  <text x="216.0" y="232.0" class="ubio-11-gas-exchange-b">CO₂</text>
  <line x1="40.0" y1="296.0" x2="101.0" y2="296.0" style="stroke:var(--fig-blue);stroke-width:2"/>
  <path d="M110.0 296.0 L101.0 300.5 L101.0 291.5 Z" style="fill:var(--fig-blue)"/>
  <line x1="250.0" y1="296.0" x2="311.0" y2="296.0" style="stroke:var(--fig-red);stroke-width:2"/>
  <path d="M320.0 296.0 L311.0 300.5 L311.0 291.5 Z" style="fill:var(--fig-red)"/>
  <text x="30.0" y="322.0" class="ubio-11-gas-exchange-s">폐동맥에서 온 혈액</text>
  <text x="30.0" y="340.0" class="ubio-11-gas-exchange-t">PO₂ 40, PCO₂ 46</text>
  <text x="330.0" y="322.0" text-anchor="end" class="ubio-11-gas-exchange-s">폐정맥으로</text>
  <text x="330.0" y="340.0" text-anchor="end" class="ubio-11-gas-exchange-t">PO₂ 100, PCO₂ 40</text>
  <text x="180.0" y="22.0" text-anchor="middle" class="ubio-11-gas-exchange-h">(가) 폐포</text>
  <text x="550.0" y="22.0" text-anchor="middle" class="ubio-11-gas-exchange-h">(나) 조직</text>
