<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-ubio-11-gas-exchange d-ubio-11-gas-exchange">
  <title id="t-ubio-11-gas-exchange">그림 일반생명과학 11-8 폐포와 조직에서의 분압 차와 기체 교환</title>
  <desc id="d-ubio-11-gas-exchange">왼쪽: 폐포. 폐포 공기(PO₂ 약 100, PCO₂ 약 40 mmHg)와 폐동맥에서 온 정맥혈(PO₂ 40, PCO₂ 46) 사이의 분압 차를 따라 산소는 혈액으로, 이산화 탄소는 폐포로 확산하여 혈액은 PO₂ 100, PCO₂ 40이 된다. 오른쪽: 조직. 동맥혈(100, 40)과 세포호흡을 하는 조직 세포(PO₂ 40 이하, PCO₂ 46 이상) 사이에서 산소는 세포로, 이산화 탄소는 혈액으로 확산해 정맥혈(40, 46)이 된다. 단위는 mmHg, 휴식 시 예시 값의 모식도이다.</desc>
  <style>.ubio-11-gas-exchange-t{font-size:14px;fill:var(--fig-ink)} .ubio-11-gas-exchange-b{font-size:14px;fill:var(--fig-ink);font-weight:700} .ubio-11-gas-exchange-s{font-size:13px;fill:var(--fig-muted)} .ubio-11-gas-exchange-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-11-gas-exchange-lead{stroke:var(--fig-muted);stroke-width:1;fill:none}</style>
