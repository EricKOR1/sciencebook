  <text x="400.0" y="100.0" class="ubio-11-gas-exchange-t">동맥혈 PO₂ 100, PCO₂ 40</text>
  <text x="700.0" y="182.0" text-anchor="end" class="ubio-11-gas-exchange-t"></text>
