<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="t-matter-2-q-potato-graph d-matter-2-q-potato-graph">
  <title id="t-matter-2-q-potato-graph">그림 물질과 에너지 2-13 문제 13 해설: 설탕물 농도에 따른 감자 막대의 질량 변화율</title>
  <desc id="d-matter-2-q-potato-graph">측정값 다섯 개를 이은 그래프에서 0.2 M(+2.5 %)과 0.4 M(−2.0 %) 사이를 직선으로 이으면 질량 변화율이 0인 점은 약 0.31 M이다. 이 농도가 감자 세포액과 등장인 농도이다.</desc>
  <style>
    .matter-2-q-potato-graph-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
    .matter-2-q-potato-graph-gr{fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4}
    .matter-2-q-potato-graph-l{font-size:14px;fill:var(--fig-ink)}
    .matter-2-q-potato-graph-t{font-size:13px;fill:var(--fig-muted)}
    .matter-2-q-potato-graph-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .matter-2-q-potato-graph-ink{fill:var(--fig-ink)}
    .matter-2-q-potato-graph-lead{fill:none;stroke:var(--fig-muted);stroke-width:1}
  </style>
  <line x1="110" y1="40" x2="650" y2="40" class="matter-2-q-potato-graph-gr"/>
  <text x="100" y="45" text-anchor="end" class="matter-2-q-potato-graph-t">+10</text>
  <line x1="110" y1="105.9" x2="650" y2="105.9" class="matter-2-q-potato-graph-gr"/>
  <text x="100" y="110.9" text-anchor="end" class="matter-2-q-potato-graph-t">+5</text>
  <line x1="110" y1="237.7" x2="650" y2="237.7" class="matter-2-q-potato-graph-gr"/>
  <text x="100" y="242.7" text-anchor="end" class="matter-2-q-potato-graph-t">−5</text>
  <line x1="110" y1="303.6" x2="650" y2="303.6" class="matter-2-q-potato-graph-gr"/>
  <text x="100" y="308.6" text-anchor="end" class="matter-2-q-potato-graph-t">−10</text>
  <text x="100" y="176.8" text-anchor="end" class="matter-2-q-potato-graph-t">0</text>
  <path d="M110 28 L110 330" class="matter-2-q-potato-graph-ax"/>
  <path d="M110 22 l-5 9 l10 0 z" class="matter-2-q-potato-graph-ink"/>
  <line x1="110" y1="171.8" x2="666" y2="171.8" class="matter-2-q-potato-graph-ax"/>
  <path d="M672 171.8 l-9 -5 l0 10 z" class="matter-2-q-potato-graph-ink"/>
  <text x="110" y="350" text-anchor="middle" class="matter-2-q-potato-graph-t">0</text>
  <line x1="245" y1="40" x2="245" y2="330" class="matter-2-q-potato-graph-gr"/>
  <text x="245" y="350" text-anchor="middle" class="matter-2-q-potato-graph-t">0.2</text>
  <line x1="380" y1="40" x2="380" y2="330" class="matter-2-q-potato-graph-gr"/>
  <text x="380" y="350" text-anchor="middle" class="matter-2-q-potato-graph-t">0.4</text>
  <line x1="515" y1="40" x2="515" y2="330" class="matter-2-q-potato-graph-gr"/>
  <text x="515" y="350" text-anchor="middle" class="matter-2-q-potato-graph-t">0.6</text>
  <line x1="650" y1="40" x2="650" y2="330" class="matter-2-q-potato-graph-gr"/>
  <text x="650" y="350" text-anchor="middle" class="matter-2-q-potato-graph-t">0.8</text>
  <text x="650" y="374" text-anchor="end" class="matter-2-q-potato-graph-l">설탕물의 농도(M)</text>
  <text x="120" y="32" class="matter-2-q-potato-graph-l">질량 변화율(%)</text>
  <path d="M110 66.4 L245 138.9 L380 198.2 L515 257.5 L650 310.2" style="fill:none;stroke:var(--fig-muted);stroke-width:1.5"/>
  <line x1="245" y1="138.9" x2="380" y2="198.2" style="stroke:var(--fig-red);stroke-width:3"/>
  <circle cx="110" cy="66.4" r="5.5" style="fill:var(--fig-blue)"/>
  <circle cx="245" cy="138.9" r="5.5" style="fill:var(--fig-blue)"/>
  <circle cx="380" cy="198.2" r="5.5" style="fill:var(--fig-blue)"/>
  <circle cx="515" cy="257.5" r="5.5" style="fill:var(--fig-blue)"/>
  <circle cx="650" cy="310.2" r="5.5" style="fill:var(--fig-blue)"/>
  <line x1="320" y1="171.8" x2="320" y2="330" style="stroke:var(--fig-red);stroke-width:1.4;stroke-dasharray:5 4"/>
  <circle cx="320" cy="171.8" r="6" style="fill:var(--fig-paper);stroke:var(--fig-red);stroke-width:2.5"/>
  <text x="330" y="159.8" class="matter-2-q-potato-graph-h" style="fill:var(--fig-red)">약 0.31 M (등장)</text>
  <text x="393.5" y="79.5" class="matter-2-q-potato-graph-t">0보다 위: 저장액(물이 감자 속으로 들어감)</text>
  <text x="130.2" y="277.3" class="matter-2-q-potato-graph-t">0보다 아래: 고장액(물이 빠져나감)</text>
</svg>
