<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="t-uchem-11-potential-ladder d-uchem-11-potential-ladder">
  <title id="t-uchem-11-potential-ladder">그림 일반화학 11-4 표준 환원 전위의 사다리</title>
  <desc id="d-uchem-11-potential-ladder">표준 환원 전위(25 ℃)를 세로축에 실제 비율로 놓았다. 위로 갈수록 왼쪽의 산화된 형태가 전자를 강하게 끌어당기는 강한 산화제이고, 아래로 갈수록 오른쪽의 환원된 형태가 전자를 잘 내주는 강한 환원제이다. 전지에서는 아래쪽 반쪽 반응이 산화 전극이 되어 전자가 아래 칸에서 위 칸으로 떨어지며, 떨어지는 높이가 표준 전지 전위이다. 예: 다니엘 전지 0.34 − (−0.76) = 1.10 V, 마그네슘–은 전지 0.80 − (−2.37) = 3.17 V.</desc>
