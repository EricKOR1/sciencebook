  <title id="t-uphy-8-q-cap-reconnect">그림 일반물리학 8-14 문제 14의 두 축전기 연결</title>
  <desc id="d-uphy-8-q-cap-reconnect">(가) 4.0 μF 축전기는 12 V로 충전한 뒤 전지를 떼었고, 2.0 μF 축전기는 충전되지 않았다. (나) 두 축전기의 (+)판은 (+)판끼리, 나머지 판은 나머지 판끼리 도선으로 연결한다.</desc>
  <style>.uphy-8-q-cap-reconnect-t{font-size:14px;fill:var(--fig-ink)} .uphy-8-q-cap-reconnect-b{font-size:14px;fill:var(--fig-ink);font-weight:700} .uphy-8-q-cap-reconnect-s{font-size:13px;fill:var(--fig-muted)} .uphy-8-q-cap-reconnect-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .uphy-8-q-cap-reconnect-w{stroke:var(--fig-ink);stroke-width:2.2;fill:none;stroke-linejoin:round;stroke-linecap:round}</style>
  <text x="180.0" y="30.0" text-anchor="middle" class="uphy-8-q-cap-reconnect-h">(가) 연결 전</text>
