  <text x="296.0" y="123.0" text-anchor="start" class="uphy-8-q-cap-reconnect-b">C₂</text>
  <text x="296.0" y="141.0" text-anchor="start" class="uphy-8-q-cap-reconnect-t">2.0 μF</text>
