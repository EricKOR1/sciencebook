<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" role="img" aria-labelledby="t-uphy-12-energy-bands d-uphy-12-energy-bands">
  <title id="t-uphy-12-energy-bands">그림 일반물리학 12-2 도체·절연체·반도체의 에너지띠와 도핑</title>
  <desc id="d-uphy-12-energy-bands">도체는 전자가 일부만 찬 띠가 있어 작은 전기장에도 전류가 흐른다. 절연체는 꽉 찬 원자가띠와 빈 전도띠 사이의 띠틈이 커서 상온에서 전자가 넘어가지 못한다. 반도체는 띠틈이 작아 일부 전자가 열로 전도띠에 올라가고 원자가띠에 양공을 남긴다. n형은 전도띠 바로 아래의 주개 준위가 전자를 전도띠에 내주고, p형은 원자가띠 바로 위의 받개 준위가 전자를 받아 원자가띠에 양공을 만든다.</desc>
