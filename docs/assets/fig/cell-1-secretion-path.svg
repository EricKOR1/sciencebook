<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-cell-1-secretion-path d-cell-1-secretion-path">
  <title id="t-cell-1-secretion-path">그림 세포와 물질대사 1-6 분비 단백질이 세포 밖으로 나가는 길</title>
  <desc id="d-cell-1-secretion-path">핵에서 전사된 mRNA가 핵공으로 나와 거친면 소포체의 리보솜에서 단백질로 합성되고, 수송 소낭에 담겨 골지체로 가서 변형·분류·포장된 뒤 분비 소낭이 세포막과 융합하여 세포 밖으로 내보내진다(세포 외 배출). 골지체에서는 리소좀도 만들어지며, 미토콘드리아가 ATP를 공급한다. 모식도.</desc>
