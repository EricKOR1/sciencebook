  <title id="t-m2-02-q-granite-exposure">그림 중2-2-9 문제 12 해설: 화강암이 산꼭대기에 드러나는 과정</title>
  <desc id="d-m2-02-q-granite-exposure">(가) 마그마가 지하 깊은 곳에서 천천히 식어 결정이 큰 화강암이 된다. (나) 오랜 시간 동안 땅이 솟아오르고 위를 덮고 있던 암석이 풍화·침식으로 깎여 나가면 화강암이 지표에 드러나 산꼭대기를 이룬다. 모식도이다.</desc>
