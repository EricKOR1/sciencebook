<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-pchem-5-osmosis-u-tube d-pchem-5-osmosis-u-tube">
  <title id="t-pchem-5-osmosis-u-tube">그림 물리화학 5-8 삼투압 장치와 평형 조건</title>
  <desc id="d-pchem-5-osmosis-u-tube">U자관의 가운데를 반투막(점선)이 나눈다. 왼쪽은 순수한 용매(물 분자만), 오른쪽은 용액(물 분자와 큰 용질 입자)이다. 물 분자는 막을 지나 화학 퍼텐셜이 낮은 오른쪽으로 가려 하고, 오른쪽 위 피스톤으로 추가 압력 Π를 걸면 흐름이 멈춘다. 평형에서는 왼쪽 μ_A*(p)와 오른쪽 μ_A*(p+Π) + RT ln x_A가 같다. 모식도이다.</desc>
