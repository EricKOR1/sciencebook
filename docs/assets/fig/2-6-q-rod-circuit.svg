<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 282" class="fig-small" role="img" aria-labelledby="t-2-6-q-rod-circuit d-2-6-q-rod-circuit">
  <title id="t-2-6-q-rod-circuit">그림 2-6-3 예제 1의 측정 회로</title>
  <desc id="d-2-6-q-rod-circuit">전원(3 V), 전류계, 막대를 한 줄로 연결한 회로이다. 같은 모양과 크기의 막대 A, B, C를 차례로 끼워 전류를 측정한다. 측정한 전류는 표에 주어져 있다.</desc>
  <style>
    .f2-6-q-rod-circuit-t{font-size:14px;fill:var(--fig-ink)} .f2-6-q-rod-circuit-sm{font-size:13px;fill:var(--fig-muted)}
    .f2-6-q-rod-circuit-lbl{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .f2-6-q-rod-circuit-w{fill:none;stroke:var(--fig-ink);stroke-width:2} .f2-6-q-rod-circuit-m{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2}
    .f2-6-q-rod-circuit-mt{font-size:16px;font-weight:700;fill:var(--fig-ink)} .f2-6-q-rod-circuit-rod{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.6}
    .f2-6-q-rod-circuit-clip{fill:var(--fig-muted)} .f2-6-q-rod-circuit-cu{fill:none;stroke:var(--fig-amber);stroke-width:1.6} .f2-6-q-rod-circuit-pb{fill:var(--fig-muted);stroke:var(--fig-ink);stroke-width:1}
    .f2-6-q-rod-circuit-dim{stroke:var(--fig-muted);stroke-width:1;fill:none}
  </style>
  <path d="M222 60 H60 V190 H170" class="f2-6-q-rod-circuit-w"/>
  <path d="M238 60 H400 V107 M400 143 V190 H290" class="f2-6-q-rod-circuit-w"/>
  <line x1="222" y1="50" x2="222" y2="70" style="stroke:var(--fig-ink);stroke-width:5"/>
  <line x1="238" y1="43" x2="238" y2="77" style="stroke:var(--fig-ink);stroke-width:2.5"/>
  <text x="212.0" y="46.0" text-anchor="middle" class="f2-6-q-rod-circuit-sm">−</text>
  <text x="249.0" y="40.0" text-anchor="middle" class="f2-6-q-rod-circuit-sm">+</text>
  <text x="230.0" y="26.0" text-anchor="middle" class="f2-6-q-rod-circuit-sm">전원 3 V</text>
  <circle cx="400" cy="125" r="18" class="f2-6-q-rod-circuit-m"/>
  <text x="400.0" y="131.0" text-anchor="middle" class="f2-6-q-rod-circuit-mt">A</text>
  <text x="426.0" y="130.0" text-anchor="start" class="f2-6-q-rod-circuit-sm">전류계</text>
  <rect x="170" y="184" width="10" height="12" class="f2-6-q-rod-circuit-clip"/><rect x="280" y="184" width="10" height="12" class="f2-6-q-rod-circuit-clip"/>
  <rect x="180" y="181" width="100" height="18" rx="3" class="f2-6-q-rod-circuit-rod"/>
  <text x="230.0" y="222.0" text-anchor="middle" class="f2-6-q-rod-circuit-sm">막대(A, B, C를 차례로 바꿔 끼움)</text>
  <rect x="130" y="236" width="60" height="14" rx="3" class="f2-6-q-rod-circuit-rod"/>
  <text x="160.0" y="270.0" text-anchor="middle" class="f2-6-q-rod-circuit-lbl">A</text>
  <rect x="210" y="236" width="60" height="14" rx="3" class="f2-6-q-rod-circuit-rod"/>
  <text x="240.0" y="270.0" text-anchor="middle" class="f2-6-q-rod-circuit-lbl">B</text>
  <rect x="290" y="236" width="60" height="14" rx="3" class="f2-6-q-rod-circuit-rod"/>
  <text x="320.0" y="270.0" text-anchor="middle" class="f2-6-q-rod-circuit-lbl">C</text>
  <text x="370.0" y="247.0" text-anchor="start" class="f2-6-q-rod-circuit-sm">같은 모양·크기</text>
</svg>
