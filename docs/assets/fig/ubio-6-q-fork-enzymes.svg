<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-ubio-6-q-fork-enzymes d-ubio-6-q-fork-enzymes">
  <title id="t-ubio-6-q-fork-enzymes">그림 일반생명과학 6-11 문제 3 해설: 지연 가닥에서 일하는 효소의 순서</title>
  <desc id="d-ubio-6-q-fork-enzymes">분기점은 오른쪽으로 움직인다. 위 주형(3′→5′)에서는 선도 가닥이 분기점 쪽으로 연속 합성되고, 아래 주형(5′→3′)에서는 지연 가닥이 분기점 반대 방향으로 오카자키 절편씩 합성된다. 분기점에 가까운 쪽부터 ① 프라이메이스가 RNA 프라이머를 만들고, ② DNA 중합 효소 Ⅲ이 절편을 늘리며, ③ DNA 중합 효소 Ⅰ이 이웃 절편의 프라이머를 DNA로 바꾸고, ④ DNA 연결 효소가 남은 틈을 잇는다. 이중 나선의 꼬임은 생략한 모식도이다.</desc>
