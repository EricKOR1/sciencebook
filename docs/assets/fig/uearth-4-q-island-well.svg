<title id="t-uearth-4-q-island-well">그림 일반지구과학 4-14 문제 9의 섬 해안 우물</title>
<desc id="d-uearth-4-q-island-well">섬의 해안 근처에서 지하수면은 해수면보다 0.8 m 높고, 우물은 해수면 아래 25 m까지 파여 있다. 담수는 해수 위에 떠 있으며 그 아래에 담수–해수 경계면이 있다. 높이와 깊이의 비율은 실제와 다른 모식도이다.</desc>
