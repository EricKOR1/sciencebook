<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 78 480 265" class="fig-small" role="img" aria-labelledby="t-m1-05-q-box-fbd d-m1-05-q-box-fbd">
  <title id="t-m1-05-q-box-fbd">그림 중1-5-11 문제 8 해설: 상자에 작용하는 힘</title>
  <desc id="d-m1-05-q-box-fbd">밀어도 움직이지 않는 상자에는 세로 방향으로 중력(아래 50 N)과 바닥이 떠받치는 힘(위 50 N)이, 가로 방향으로 미는 힘(오른쪽 20 N)과 마찰력(왼쪽 20 N)이 각각 평형을 이룬다. 화살표의 길이는 힘의 크기에 비례한다.</desc>
  <style>.m1-05-q-box-fbd-t{font-size:14px;fill:var(--fig-ink)} .m1-05-q-box-fbd-s{font-size:13px;fill:var(--fig-muted)} .m1-05-q-box-fbd-h{font-size:15px;fill:var(--fig-ink);font-weight:700}</style>
  <line x1="20.0" y1="220.0" x2="460.0" y2="220.0" style="stroke:var(--fig-line);stroke-width:2"/>
  <rect x="180.0" y="150.0" width="120.0" height="70.0" rx="3" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <line x1="228.0" y1="185.0" x2="228.0" y2="295.0" style="stroke:var(--fig-red);stroke-width:3.5;fill:none"/>
  <polygon points="228.0,305.0 222.7,294.0 233.3,294.0" style="fill:var(--fig-red);stroke:none"/>
  <text x="220.0" y="301.0" text-anchor="end" class="m1-05-q-box-fbd-t">중력 50 N</text>
  <line x1="252.0" y1="220.0" x2="252.0" y2="110.0" style="stroke:var(--fig-green);stroke-width:3.5;fill:none"/>
  <polygon points="252.0,100.0 257.3,111.0 246.7,111.0" style="fill:var(--fig-green);stroke:none"/>
  <text x="260.0" y="110.0" text-anchor="start" class="m1-05-q-box-fbd-t">떠받치는 힘 50 N</text>
  <line x1="300.0" y1="185.0" x2="338.0" y2="185.0" style="stroke:var(--fig-blue);stroke-width:3.5;fill:none"/>
  <polygon points="348.0,185.0 337.0,190.3 337.0,179.7" style="fill:var(--fig-blue);stroke:none"/>
  <text x="354.0" y="190.0" text-anchor="start" class="m1-05-q-box-fbd-t">미는 힘 20 N</text>
  <line x1="180.0" y1="218.0" x2="142.0" y2="218.0" style="stroke:var(--fig-violet);stroke-width:3.5;fill:none"/>
  <polygon points="132.0,218.0 143.0,212.7 143.0,223.3" style="fill:var(--fig-violet);stroke:none"/>
  <text x="128.0" y="242.0" text-anchor="middle" class="m1-05-q-box-fbd-t">마찰력 20 N</text>
  <text x="240.0" y="330.0" text-anchor="middle" class="m1-05-q-box-fbd-s">화살표 길이는 힘의 크기에 비례한다. 알짜힘은 0이다.</text>
</svg>
