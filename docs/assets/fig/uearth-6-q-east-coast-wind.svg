<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" class="fig-small" role="img" aria-labelledby="t-uearth-6-q-east-coast-wind d-uearth-6-q-east-coast-wind">
<title id="t-uearth-6-q-east-coast-wind">그림 일반지구과학 6-15 문제 16의 동해안과 여름철 남풍</title>
<desc id="d-uearth-6-q-east-coast-wind">우리나라 동해안 부근의 지도이다. 해안선은 대략 남북 방향이고 바다는 동쪽에 있다. 빨간 화살표는 해안을 따라 남쪽에서 북쪽으로 부는 바람(남풍)이고, 점선은 북위 36°이다.</desc>
