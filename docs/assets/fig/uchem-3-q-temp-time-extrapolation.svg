  <title id="t-uchem-3-q-temp-time-extrapolation">그림 일반화학 3-13 문제 16 온도–시간 그래프의 외삽</title>
  <desc id="d-uchem-3-q-temp-time-extrapolation">섞은 뒤 온도는 빠르게 올라 최고점(26.5 °C)에 이른 뒤, 열이 새면서 천천히 내려간다. 냉각 구간의 직선을 섞은 순간까지 거꾸로 이으면(점선) 열이 새지 않았을 때의 온도를 어림할 수 있고, 이것으로 구한 ΔT는 최고 온도로 구한 값보다 조금 크다. 냉각 기울기와 시간 눈금은 설명을 위해 가정한 모식도이다.</desc>
