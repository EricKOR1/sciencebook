<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-gene-1-chromosome-structure d-gene-1-chromosome-structure">
  <title id="t-gene-1-chromosome-structure">그림 생물의 유전 1-5 염색체 구조 이상의 네 가지</title>
  <desc id="d-gene-1-chromosome-structure">알파벳은 염색체 위의 구간(유전자 묶음), 검은 점은 동원체이다. 결실은 구간 C가 없어진 것, 중복은 구간 B·C가 한 번 더 들어간 것, 역위는 구간 B·C·D가 끊어졌다가 거꾸로 붙은 것, 전좌는 상동이 아닌 두 염색체가 구간 G·H와 P·Q를 서로 바꾼 것이다. 모식도이다.</desc>
