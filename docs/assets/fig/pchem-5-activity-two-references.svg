<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-pchem-5-activity-two-references d-pchem-5-activity-two-references">
  <title id="t-pchem-5-activity-two-references">그림 물리화학 5-9 같은 용액에서 B의 활동도: 라울 기준과 헨리 기준</title>
  <desc id="d-pchem-5-activity-two-references">음의 벗어남을 보이는 용액에서 성분 B의 부분 증기 압력(실선). 점선은 원점과 (1, p_B*)를 잇는 라울 직선과, x_B = 0에서 곡선에 접하는 헨리 직선(기울기 K_B &lt; p_B*)이다. x_B = 0.6인 점의 높이 p_B를 오른쪽 끝의 두 기준 높이 p_B*, K_B와 비교한 세로 길이의 비가 각각 라울 기준과 헨리 기준의 활동도이다. 곡선은 정규 용액 모형(ξ = −1.10, p_B* = 39.0 kPa)으로 계산했다.</desc>
