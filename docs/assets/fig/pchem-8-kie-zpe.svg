<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-pchem-8-kie-zpe d-pchem-8-kie-zpe">
  <title id="t-pchem-8-kie-zpe">그림 물리화학 8-2 C–H와 C–D의 영점 에너지와 활성화 에너지</title>
  <desc id="d-pchem-8-kie-zpe">같은 퍼텐셜 우물에서 C–H의 v = 0 준위(½hcν̃ = 1450 cm⁻¹, 17.3 kJ/mol)가 C–D(1065 cm⁻¹, 12.7 kJ/mol)보다 385 cm⁻¹(4.6 kJ/mol) 높다. 전이 상태에서 이 진동이 사라진다고 보면 C–D는 4.6 kJ/mol을 더 올라가야 하므로 Ea(D) = Ea(H) + 4.6 kJ/mol이다. 영점 에너지의 높이는 비율대로 그렸고, 전이 상태의 높이와 가로축은 임의로 정한 모식도이다.</desc>
