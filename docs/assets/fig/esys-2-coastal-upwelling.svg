<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-esys-2-coastal-upwelling d-esys-2-coastal-upwelling">
  <title id="t-esys-2-coastal-upwelling">그림 지구시스템과학 2-2 에크만 수송과 용승(북반구)</title>
  <desc id="d-esys-2-coastal-upwelling">(가) 해안을 왼쪽에 두고 해안과 나란히 바람이 불면 에크만 수송이 먼 바다 쪽으로 일어난다. (나) 그 단면: 표층 해수가 빠져나간 자리를 아래의 찬 해수가 올라와 채운다(연안 용승). (다) 적도에서 무역풍(동풍)이 불면 에크만 수송이 적도 북쪽에서는 북쪽, 남쪽에서는 남쪽으로 일어나 해수가 갈라지고 적도 용승이 생긴다. 모식도이다.</desc>
  <style>
    .esys-2-coastal-upwelling-t{font-size:13px;fill:var(--fig-ink)}
    .esys-2-coastal-upwelling-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .esys-2-coastal-upwelling-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .esys-2-coastal-upwelling-s{font-size:13px;fill:var(--fig-muted)}
    .esys-2-coastal-upwelling-r{font-size:13px;font-weight:600;fill:var(--fig-red)}
    .esys-2-coastal-upwelling-u{font-size:13px;font-weight:600;fill:var(--fig-blue)}
    .esys-2-coastal-upwelling-g{font-size:13px;font-weight:600;fill:var(--fig-green)}
    .esys-2-coastal-upwelling-a{font-size:13px;font-weight:600;fill:var(--fig-amber)}
    .esys-2-coastal-upwelling-v{font-size:13px;font-weight:600;fill:var(--fig-violet)}
    .esys-2-coastal-upwelling-e{font-size:13px;font-weight:600;fill:var(--fig-teal)}
    .esys-2-coastal-upwelling-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
