<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-uphy-2-q-loop-top d-uphy-2-q-loop-top">
  <title id="t-uphy-2-q-loop-top">그림 일반물리학 2-10 문제 14 해설: 연직 원형 궤도 꼭대기에서 승객이 받는 힘</title>
  <desc id="d-uphy-2-q-loop-top">반지름 10.0 m인 원형 궤도 꼭대기에서 원의 중심은 아래쪽이다. (가) 속력이 √(rg) = 9.90 m/s이면 수직 항력이 0이고 중력 mg만 구심력이 된다. (나) 속력이 그 1.50배이면 mv²/r = 2.25mg이므로 좌석이 승객을 아래쪽으로 1.25mg로 민다. 힘과 속도 화살표의 길이는 각각 크기에 비례한다.</desc>
  <rect x="10.0" y="10.0" width="345.0" height="330.0" rx="10" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <text x="24.0" y="34.0" style="font-size:15px;fill:var(--fig-ink);font-weight:600">(가) v = √(rg) = 9.90 m/s</text>
  <path d="M312.2 145.7 A170.0 170.0 0 0 0 51.8 145.7" style="fill:none;stroke:var(--fig-line);stroke-width:6"/>
  <path d="M312.2 145.7 A170.0 170.0 0 0 0 51.8 145.7" style="fill:none;stroke:var(--fig-ink);stroke-width:1.5"/>
  <circle cx="182.0" cy="255.0" r="3.5" style="fill:var(--fig-ink);stroke:none;stroke-width:1.5"/>
  <text x="190.0" y="251.0" style="font-size:12px;fill:var(--fig-muted)">원의 중심</text>
  <line x1="182.0" y1="255.0" x2="182.0" y2="115.0" style="stroke:var(--fig-muted);stroke-width:1;fill:none;stroke-dasharray:4 4"/>
  <rect x="160.0" y="89.0" width="44.0" height="18.0" rx="3" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <line x1="172.0" y1="98.0" x2="172.0" y2="147.3" style="stroke:var(--fig-ink);stroke-width:2.6;fill:none"/>
  <path d="M172.0 158.0 L167.0 146.8 L177.0 146.8 Z" style="fill:var(--fig-ink);stroke:none"/>
  <text x="166.0" y="154.0" text-anchor="end" style="font-size:14px;fill:var(--fig-ink);font-weight:600">mg</text>
  <line x1="160.0" y1="98.0" x2="120.3" y2="98.0" style="stroke:var(--fig-violet);stroke-width:2.4;fill:none"/>
  <path d="M110.0 98.0 L120.8 93.1 L120.8 102.9 Z" style="fill:var(--fig-violet);stroke:none"/>
  <text x="106.0" y="90.0" style="font-size:14px;fill:var(--fig-violet);font-weight:700">v</text>
  <text x="24.0" y="290.0" style="font-size:13px;fill:var(--fig-ink)">mg = mv²/r → v = √(rg)</text>
  <text x="24.0" y="310.0" style="font-size:13px;fill:var(--fig-ink)">N = 0: 중력 혼자 구심력</text>
  <text x="24.0" y="330.0" style="font-size:12px;fill:var(--fig-muted)">궤도 아래에 매달려 거꾸로 지나는 승객</text>
  <rect x="365.0" y="10.0" width="345.0" height="330.0" rx="10" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <text x="379.0" y="34.0" style="font-size:15px;fill:var(--fig-ink);font-weight:600">(나) v = 1.50√(rg)</text>
  <path d="M667.2 145.7 A170.0 170.0 0 0 0 406.8 145.7" style="fill:none;stroke:var(--fig-line);stroke-width:6"/>
  <path d="M667.2 145.7 A170.0 170.0 0 0 0 406.8 145.7" style="fill:none;stroke:var(--fig-ink);stroke-width:1.5"/>
  <circle cx="537.0" cy="255.0" r="3.5" style="fill:var(--fig-ink);stroke:none;stroke-width:1.5"/>
  <text x="545.0" y="251.0" style="font-size:12px;fill:var(--fig-muted)">원의 중심</text>
  <line x1="537.0" y1="255.0" x2="537.0" y2="115.0" style="stroke:var(--fig-muted);stroke-width:1;fill:none;stroke-dasharray:4 4"/>
  <rect x="515.0" y="89.0" width="44.0" height="18.0" rx="3" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <line x1="527.0" y1="98.0" x2="527.0" y2="147.3" style="stroke:var(--fig-ink);stroke-width:2.6;fill:none"/>
  <path d="M527.0 158.0 L522.0 146.8 L532.0 146.8 Z" style="fill:var(--fig-ink);stroke:none"/>
  <text x="521.0" y="154.0" text-anchor="end" style="font-size:14px;fill:var(--fig-ink);font-weight:600">mg</text>
  <line x1="547.0" y1="98.0" x2="547.0" y2="162.3" style="stroke:var(--fig-green);stroke-width:2.6;fill:none"/>
  <path d="M547.0 173.0 L542.0 161.8 L552.0 161.8 Z" style="fill:var(--fig-green);stroke:none"/>
  <text x="553.0" y="169.0" style="font-size:13px;fill:var(--fig-green);font-weight:600">N = 1.25mg</text>
  <line x1="515.0" y1="98.0" x2="450.3" y2="98.0" style="stroke:var(--fig-violet);stroke-width:2.4;fill:none"/>
  <path d="M440.0 98.0 L450.8 93.1 L450.8 102.9 Z" style="fill:var(--fig-violet);stroke:none"/>
  <text x="436.0" y="90.0" style="font-size:14px;fill:var(--fig-violet);font-weight:700">v</text>
  <text x="379.0" y="290.0" style="font-size:13px;fill:var(--fig-ink)">N + mg = m(2.25rg)/r = 2.25mg</text>
  <text x="379.0" y="310.0" style="font-size:13px;fill:var(--fig-ink)">→ N = 1.25mg (아래쪽, 중심 쪽)</text>
  <text x="379.0" y="330.0" style="font-size:12px;fill:var(--fig-muted)">궤도 아래에 매달려 거꾸로 지나는 승객</text>
</svg>
