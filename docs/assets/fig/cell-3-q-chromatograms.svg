  <desc id="d-cell-3-q-chromatograms">초록 잎과 노란 잎의 색소를 같은 방법으로 전개한 종이. 용매 전선은 원점에서 10.0 cm이고, 띠 1~4는 원점에서 각각 9.4, 6.4, 4.6, 3.1 cm에 있다. 노란 잎에는 띠 3, 4가 거의 없다. 띠의 색은 실제 색을 흉내 낸 것이다.</desc>
