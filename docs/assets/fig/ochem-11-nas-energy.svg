<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-ochem-11-nas-energy d-ochem-11-nas-energy">
  <title id="t-ochem-11-nas-energy">그림 유기화학 11-7 친핵성 아실 치환의 반응 에너지 도표</title>
  <desc id="d-ochem-11-nas-energy">반응물 RCOY + Nu⁻(0)에서 첫 번째 언덕 TS1(+70, 첨가 장벽)을 넘어 사면체 중간체(+45)의 골짜기에 이르고, 두 번째 언덕 TS2(이탈기가 떨어지는 장벽)를 넘어 생성물 RCONu + Y⁻가 된다. (가) Y = Cl: TS2 +50, 생성물 −60(실선). (나) Y = OR, Nu = OH: TS2 +65, 생성물 −20(점선). (다) Y = NH₂, Nu = OH: TS2 +90, 생성물 −5(파선). 반응물과 TS1은 세 경우를 같게 그린 단순화이며, 값은 설명용 상대값이다.</desc>
