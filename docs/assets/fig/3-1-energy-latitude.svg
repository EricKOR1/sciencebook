<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-3-1-energy-latitude d-3-1-energy-latitude">
<title id="t-3-1-energy-latitude">그림 3-1-5 위도에 따른 에너지의 남고 모자람</title>
<desc id="d-3-1-energy-latitude">위도별로 지구가 1년 동안 흡수하는 태양 복사 에너지와 우주로 방출하는 지구 복사 에너지를 비교한 모식도이다. 저위도는 흡수량이 방출량보다 많아 에너지가 남고, 고위도는 모자란다. 대기와 해수가 남는 열을 고위도로 운반하여 지구 전체는 복사 평형을 이룬다. 값은 상댓값이다.</desc>
