  <desc id="d-uphy-7-q-two-expansions">(가) 단열 용기를 칸막이로 나누어 한쪽에 기체를, 다른 쪽을 진공으로 두었다가 칸막이를 없앤다. (나) 단열된 실린더 속 기체가 피스톤을 천천히 밀며 팽창한다. 두 경우 모두 단원자 이상 기체 1.00 mol이 400 K에서 부피가 2배가 된다.</desc>
