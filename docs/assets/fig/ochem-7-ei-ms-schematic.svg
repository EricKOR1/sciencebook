<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-ochem-7-ei-ms-schematic d-ochem-7-ei-ms-schematic">
  <title id="t-ochem-7-ei-ms-schematic">그림 유기화학 7-1 전자 이온화 질량 분석기의 구성</title>
  <desc id="d-ochem-7-ei-ms-schematic">왼쪽부터 ① 시료 주입구, ② 이온화실(가열 필라멘트의 70 eV 전자선이 시료 분자 흐름과 직각으로 지나며 M•+ 를 만든다), ③ 가속·집속 전극, ④ 질량 분석부(그림은 사중극자), ⑤ 검출기, ⑥ 컴퓨터의 막대 스펙트럼. 파란 선은 검출되는 이온의 경로, 회색 점선은 걸러져 버려지는 이온이다. ②~⑤는 약 10⁻⁵ Pa의 진공 속에 있다. 크기와 거리는 모식도이다.</desc>
