  <desc id="d-gene-3-q-pollen-distance">예제 6의 자료를 그래프로 나타낸 것이다. 세로축은 로그 눈금이다. 검출 비율은 거리가 멀어질수록 급격히 줄어들고, 0.5% 선 아래로 처음 내려가는 조사 거리는 50 m이다. 200 m에서도 0이 아니다.</desc>
