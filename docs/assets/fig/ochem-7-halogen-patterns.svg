  <title id="t-ochem-7-halogen-patterns">그림 유기화학 7-3 할로젠의 동위 원소 무늬</title>
  <desc id="d-ochem-7-halogen-patterns">분자 이온 영역의 M, M+2, M+4, M+6 상대 세기(가장 큰 봉우리 = 100)를 ³⁵Cl 75.8 %, ³⁷Cl 24.2 %, ⁷⁹Br 50.7 %, ⁸¹Br 49.3 %로 이항 분포에서 계산해 그렸다. Cl 100 : 32, Cl₂ 100 : 64 : 10, Cl₃ 100 : 96 : 31 : 3, Br 100 : 97, Br₂ 51 : 100 : 49, BrCl 77 : 100 : 24. 탄소 등의 M+1 봉우리는 빼고 할로젠 무늬만 그렸다.</desc>
