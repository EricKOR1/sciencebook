  <title id="t-uphy-6-q-walk-to-wall">그림 일반물리학 6-15 문제 14의 소리굽쇠를 들고 벽으로 걷는 학생</title>
  <desc id="d-uphy-6-q-walk-to-wall">500 Hz로 울리는 소리굽쇠를 든 학생이 1.5 m/s로 벽을 향해 걸어간다. 학생은 소리굽쇠에서 직접 오는 소리와 벽에서 반사되어 오는 소리를 함께 듣는다.</desc>
