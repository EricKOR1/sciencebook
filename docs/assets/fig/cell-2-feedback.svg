<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-cell-2-feedback d-cell-2-feedback">
  <title id="t-cell-2-feedback">그림 세포와 물질대사 2-6 피드백 저해</title>
  <desc id="d-cell-2-feedback">대사 경로 A → B → C → D에서 최종 생성물 D가 많아지면 D가 경로 첫 단계의 효소 1에서 활성 부위가 아닌 다른 부위에 결합해 효소의 모양을 바꾸고, 기질 A가 활성 부위에 결합하지 못해 경로 전체가 느려진다. D가 줄면 D가 떨어져 나가 효소 1이 다시 작용한다. 모식도.</desc>
  <style>.cell-2-feedback-t{font-size:14px;fill:var(--fig-ink)} .cell-2-feedback-s{font-size:13px;fill:var(--fig-muted)} .cell-2-feedback-b{font-size:15px;fill:var(--fig-ink);font-weight:600} .cell-2-feedback-bs{font-size:14px;fill:var(--fig-ink);font-weight:600} .cell-2-feedback-g{font-size:14px;fill:var(--fig-green);font-weight:600} .cell-2-feedback-r{font-size:14px;fill:var(--fig-red);font-weight:600} .cell-2-feedback-bl{font-size:14px;fill:var(--fig-blue);font-weight:600} .cell-2-feedback-am{font-size:14px;fill:var(--fig-amber);font-weight:600} .cell-2-feedback-vi{font-size:14px;fill:var(--fig-violet);font-weight:600} .cell-2-feedback-te{font-size:14px;fill:var(--fig-teal);font-weight:600}</style>
  <circle cx="70.0" cy="70.0" r="20" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <text x="70.0" y="75.0" text-anchor="middle" class="cell-2-feedback-b">A</text>
  <circle cx="250.0" cy="70.0" r="20" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <text x="250.0" y="75.0" text-anchor="middle" class="cell-2-feedback-b">B</text>
  <circle cx="430.0" cy="70.0" r="20" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <text x="430.0" y="75.0" text-anchor="middle" class="cell-2-feedback-b">C</text>
  <circle cx="610.0" cy="70.0" r="20" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <text x="610.0" y="75.0" text-anchor="middle" class="cell-2-feedback-b">D</text>
  <line x1="94.0" y1="70.0" x2="219.7" y2="70.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <path d="M226.0 70.0 L217.8 73.7 L217.8 66.3 Z" style="fill:var(--fig-ink)"/>
  <text x="160.0" y="54.0" text-anchor="middle" class="cell-2-feedback-bs">효소 1</text>
  <line x1="274.0" y1="70.0" x2="399.7" y2="70.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <path d="M406.0 70.0 L397.8 73.7 L397.8 66.3 Z" style="fill:var(--fig-ink)"/>
  <text x="340.0" y="54.0" text-anchor="middle" class="cell-2-feedback-bs">효소 2</text>
  <line x1="454.0" y1="70.0" x2="579.7" y2="70.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <path d="M586.0 70.0 L577.8 73.7 L577.8 66.3 Z" style="fill:var(--fig-ink)"/>
  <text x="520.0" y="54.0" text-anchor="middle" class="cell-2-feedback-bs">효소 3</text>
  <path d="M610 94 C610 150 160 150 160 92" style="fill:none;stroke:var(--fig-red);stroke-width:2.2;stroke-dasharray:7 5"/>
  <path d="M160.0 90.0 L164.1 99.1 L155.9 99.1 Z" style="fill:var(--fig-red)"/>
  <text x="385.0" y="160.0" text-anchor="middle" class="cell-2-feedback-r">D가 많으면 효소 1을 억제</text>
  <text x="180.0" y="200.0" text-anchor="middle" class="cell-2-feedback-b">D가 적을 때</text>
  <path d="M120 270 C120 230 140 228 154 228 L162 228 L162 248 L190 248 L190 228 L210 228 C232 228 240 240 240 256 L226 256 L226 282 L240 282 C240 308 220 314 180 314 C140 314 120 308 120 270 Z" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2"/>
  <text x="172.0" y="288.0" text-anchor="middle" class="cell-2-feedback-bs">효소 1</text>
  <rect x="164.0" y="228.0" width="26.0" height="20.0" rx="3" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="177.0" y="243.0" text-anchor="middle" class="cell-2-feedback-bs">A</text>
  <text x="260.0" y="236.0" class="cell-2-feedback-s">활성 부위에 A 결합</text>
  <text x="260.0" y="254.0" class="cell-2-feedback-s">→ 반응 진행</text>
  <text x="520.0" y="200.0" text-anchor="middle" class="cell-2-feedback-b">D가 많을 때</text>
  <path d="M460 270 C460 230 480 228 494 228 L506 236 L516 242 L526 236 L534 228 L550 228 C572 228 580 240 580 256 L566 256 L566 282 L580 282 C580 308 560 314 520 314 C480 314 460 308 460 270 Z" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2"/>
  <text x="512.0" y="288.0" text-anchor="middle" class="cell-2-feedback-bs">효소 1</text>
  <rect x="567.0" y="257.0" width="22.0" height="24.0" rx="3" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
  <text x="578.0" y="274.0" text-anchor="middle" class="cell-2-feedback-r">D</text>
  <rect x="498.0" y="210.0" width="26.0" height="20.0" rx="3" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="511.0" y="225.0" text-anchor="middle" class="cell-2-feedback-bs">A</text>
  <path d="M492 206 L530 236 M530 206 L492 236" style="fill:none;stroke:var(--fig-red);stroke-width:2"/>
  <text x="600.0" y="300.0" class="cell-2-feedback-s">D는 활성 부위가 아닌</text>
  <text x="600.0" y="318.0" class="cell-2-feedback-s">다른 부위에 결합</text>
  <text x="400.0" y="262.0" text-anchor="end" class="cell-2-feedback-s">활성 부위 모양이</text>
  <text x="400.0" y="280.0" text-anchor="end" class="cell-2-feedback-s">바뀌어 A가 못 붙음</text>
</svg>
