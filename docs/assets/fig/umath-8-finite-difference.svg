<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-umath-8-finite-difference d-umath-8-finite-difference">
  <title id="t-umath-8-finite-difference">그림 수학 도구 8-10 열 방정식의 유한 차분 격자</title>
  <desc id="d-umath-8-finite-difference">가로는 위치 격자점 x₀~x₁₀, 세로는 시간 단계 n과 n + 1이다. 양 끝 칸은 u = 0으로 고정된다. 새 시각의 값 u_i는 이전 시각의 세 칸 u_(i−1), u_i, u_(i+1)에 가중치 r, 1 − 2r, r을 곱해 더한 것이다(r = αΔt/Δx²).</desc>
  <style>
    .u8fd-ax{stroke:var(--fig-ink);stroke-width:1.4;fill:none}
    .u8fd-grid{stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 4;fill:none}
    .u8fd-t{font-size:14px;fill:var(--fig-ink)}
    .u8fd-s{font-size:13px;fill:var(--fig-muted)}
    .u8fd-b{font-size:14px;fill:var(--fig-ink);font-weight:600}
    .u8fd-tk{stroke:var(--fig-ink);stroke-width:1.2}
    .u8fd-cell{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2}
    .u8fd-fix{fill:var(--fig-line);fill-opacity:0.45;stroke:var(--fig-line);stroke-width:1.2}
    .u8fd-hi{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2}
    .u8fd-new{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2}
    .u8fd-ar{stroke:var(--fig-blue);stroke-width:2;fill:none}
    .u8fd-ah{fill:var(--fig-blue)}
    .u8fd-w{font-size:14px;fill:var(--fig-blue);font-weight:600}
    .u8fd-sm{font-size:13px;fill:var(--fig-ink)}

  </style>
  <rect x="60" y="200" width="50" height="40" class="u8fd-fix"/>
  <text x="85" y="225" text-anchor="middle" class="u8fd-sm">0</text>
  <rect x="110" y="200" width="50" height="40" class="u8fd-cell"/>
  <rect x="160" y="200" width="50" height="40" class="u8fd-cell"/>
