  <rect x="510" y="200" width="50" height="40" class="u8fd-cell"/>
  <rect x="560" y="200" width="50" height="40" class="u8fd-fix"/>
  <text x="585" y="225" text-anchor="middle" class="u8fd-sm">0</text>
  <text x="50" y="225" text-anchor="end" class="u8fd-b">시간 n</text>
  <rect x="60" y="70" width="50" height="40" class="u8fd-fix"/>
  <text x="85" y="95" text-anchor="middle" class="u8fd-sm">0</text>
  <rect x="110" y="70" width="50" height="40" class="u8fd-cell"/>
  <rect x="160" y="70" width="50" height="40" class="u8fd-cell"/>
