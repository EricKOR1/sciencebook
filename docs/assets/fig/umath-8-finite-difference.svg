  <text x="585" y="262" text-anchor="middle" class="u8fd-s">x₁₀</text>
  <text x="85" y="60" text-anchor="middle" class="u8fd-s">u = 0 고정</text>
  <text x="585" y="60" text-anchor="middle" class="u8fd-s">u = 0 고정</text>
  <text x="285" y="225" text-anchor="middle" class="u8fd-sm">u_(i−1)</text>
