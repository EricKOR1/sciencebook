  <text x="585" y="95" text-anchor="middle" class="u8fd-sm">0</text>
  <text x="50" y="95" text-anchor="end" class="u8fd-b">n + 1</text>
  <text x="85" y="262" text-anchor="middle" class="u8fd-s">x₀</text>
  <text x="135" y="262" text-anchor="middle" class="u8fd-s">x₁</text>
