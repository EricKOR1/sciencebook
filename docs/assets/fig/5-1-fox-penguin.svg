<ellipse cx="130" cy="166" rx="6" ry="4.5" class="fp-ink"/>
<text x="130" y="202" text-anchor="middle" class="fp-lbl">북극여우</text>
<text x="130" y="220" text-anchor="middle" class="fp-sm">북극 툰드라</text>
<path d="M318,114 Q302.5,80.0 296.5,70 Q288,98.0 292,126Z" class="fp-red"/>
<path d="M315,114 Q301.5,84.0 297.5,78 Q292,102.0 295,123Z" class="fp-inner"/>
<path d="M342,114 Q357.5,80.0 363.5,70 Q372,98.0 368,126Z" class="fp-red"/>
<path d="M345,114 Q358.5,84.0 362.5,78 Q368,102.0 365,123Z" class="fp-inner"/>
