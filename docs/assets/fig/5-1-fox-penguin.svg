<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 550" role="img" aria-labelledby="t-5-1-fox-penguin d-5-1-fox-penguin">
  <title id="t-5-1-fox-penguin">그림 5-1-5 기온과 동물의 몸 — 알렌 규칙과 베르그만 규칙</title>
  <desc id="d-5-1-fox-penguin">위: 같은 여우 무리라도 북극여우는 귀가 작고, 온대의 붉은여우는 중간, 사막여우는 귀가 매우 크다(얼굴 크기를 같게 맞추어 귀만 비교한 모식도). 아래: 남극의 황제펭귄(키 약 1.1 m)은 적도 부근의 갈라파고스펭귄(키 약 0.5 m)보다 훨씬 크다(같은 비율). 추운 곳일수록 열을 잃는 표면을 줄이는 쪽이 유리하다.</desc>
  <style>
    .fp-ttl{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .fp-lbl{font-size:14px;font-weight:700;fill:var(--fig-ink)}
    .fp-sm{font-size:13px;fill:var(--fig-muted)}
    .fp-blue-t{font-size:14px;font-weight:700;fill:var(--fig-blue)}
    .fp-red-t{font-size:14px;font-weight:700;fill:var(--fig-red)}
    .fp-arctic{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.8}
    .fp-red{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8}
    .fp-fennec{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.8}
    .fp-inner{fill:var(--fig-soft-violet);stroke:none}
    .fp-ink{fill:var(--fig-ink)}
    .fp-arr{stroke:var(--fig-muted);stroke-width:2}
    .fp-arrh{fill:var(--fig-muted)}
    .fp-sep{stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4}
    .fp-ground{stroke:var(--fig-line);stroke-width:2}
    .fp-pg{fill:#1f2937;stroke:var(--fig-line);stroke-width:1.2}
    .fp-belly{fill:#f8fafc}
    .fp-beak{fill:var(--fig-amber)}
  </style>
<text x="16" y="26" class="fp-ttl">알렌 규칙 — 추운 곳일수록 귀(말단 부위)가 작다</text>
