<path d="M115,114 Q106.0,99.6 102.0,102 Q98,110.4 101,123Z" class="fp-inner"/>
<path d="M142,114 Q153.0,98.0 159.0,94 Q166,107.6 162,126Z" class="fp-arctic"/>
<path d="M145,114 Q154.0,99.6 158.0,102 Q162,110.4 159,123Z" class="fp-inner"/>
