<circle cx="315" cy="132" r="4" class="fp-ink"/><circle cx="345" cy="132" r="4" class="fp-ink"/>
<ellipse cx="330" cy="166" rx="6" ry="4.5" class="fp-ink"/>
<text x="330" y="202" text-anchor="middle" class="fp-lbl">붉은여우</text>
<text x="330" y="220" text-anchor="middle" class="fp-sm">온대 지역</text>
<path d="M528,114 Q502.0,41.0 496.0,18 Q484,77.19999999999999 488,126Z" class="fp-fennec"/>
<path d="M525,114 Q501.0,50.199999999999996 497.0,26 Q488,83.80000000000001 491,123Z" class="fp-inner"/>
<path d="M552,114 Q578.0,41.0 584.0,18 Q596,77.19999999999999 592,126Z" class="fp-fennec"/>
<path d="M555,114 Q579.0,50.199999999999996 583.0,26 Q592,83.80000000000001 589,123Z" class="fp-inner"/>
