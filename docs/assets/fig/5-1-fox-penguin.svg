<ellipse cx="460" cy="474.4" rx="9.1" ry="22.3" class="fp-belly"/>
<circle cx="460" cy="441.9" r="9.5" class="fp-pg"/>
<path d="M466.8,440.6 l8.1,2.0 l-8.1,2.0Z" class="fp-beak"/>
<circle cx="463.4" cy="439.9" r="1.5" class="fp-belly"/>
<text x="460" y="520" text-anchor="middle" class="fp-lbl">갈라파고스펭귄</text>
<text x="460" y="538" text-anchor="middle" class="fp-sm">적도 부근</text>
<text x="482.2" y="466.2" class="fp-sm">키 약 0.5 m</text>
<text x="704" y="538" text-anchor="end" class="fp-sm">두 펭귄은 같은 비율로 그림</text>
</svg>
