<circle cx="177.8" cy="361.8" r="2.8" class="fp-belly"/>
<text x="170" y="520" text-anchor="middle" class="fp-lbl">황제펭귄</text>
<text x="170" y="538" text-anchor="middle" class="fp-sm">남극</text>
<text x="210.6" y="422.4" class="fp-sm">키 약 1.1 m</text>
