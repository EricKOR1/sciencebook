<circle cx="525" cy="132" r="4" class="fp-ink"/><circle cx="555" cy="132" r="4" class="fp-ink"/>
<ellipse cx="540" cy="166" rx="6" ry="4.5" class="fp-ink"/>
<text x="540" y="202" text-anchor="middle" class="fp-lbl">사막여우</text>
<text x="540" y="220" text-anchor="middle" class="fp-sm">사하라 사막</text>
<line x1="70" y1="248" x2="640" y2="248" class="fp-arr"/>
<path d="M652,248 l-12,-6 l0,12Z" class="fp-arrh"/>
<text x="70" y="270" class="fp-blue-t">춥다</text>
<text x="652" y="270" text-anchor="end" class="fp-red-t">덥다</text>
<text x="360" y="270" text-anchor="middle" class="fp-sm">사는 곳의 기온 · 귀가 클수록 열을 내보내는 표면이 넓다</text>
<line x1="16" y1="290" x2="704" y2="290" class="fp-sep"/>
<text x="16" y="318" class="fp-ttl">베르그만 규칙 — 추운 곳일수록 몸집이 크다</text>
<line x1="40" y1="500" x2="680" y2="500" class="fp-ground"/>
<ellipse cx="170" cy="434.8" rx="32.6" ry="65.2" class="fp-pg"/>
<ellipse cx="170" cy="441.0" rx="20.9" ry="51.2" class="fp-belly"/>
<circle cx="170" cy="366.5" r="21.7" class="fp-pg"/>
