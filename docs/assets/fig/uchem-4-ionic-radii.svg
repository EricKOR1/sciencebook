<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 418" role="img" aria-labelledby="t-uchem-4-ionic-radii d-uchem-4-ionic-radii">
  <title id="t-uchem-4-ionic-radii">그림 일반화학 4-8 원자와 이온의 크기 비교</title>
  <desc id="d-uchem-4-ionic-radii">원 크기를 반지름(pm)에 비례하게 그렸다. 위: 나트륨 원자(186 pm)가 3s 전자를 잃으면 바깥 껍질이 통째로 사라져 Na⁺(102 pm)로 크게 작아지고, 염소 원자(99 pm)가 전자를 얻으면 전자 사이 반발이 커져 Cl⁻(181 pm)로 커진다. 아래: 전자가 10개로 같은 등전자 계열은 원자핵 전하 Z가 클수록 전자를 세게 끌어당겨 O²⁻ &gt; F⁻ &gt; Na⁺ &gt; Mg²⁺ &gt; Al³⁺ 순으로 작아진다.</desc>
  <style>
    .uchem-4-ionic-radii-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-4-ionic-radii-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-4-ionic-radii-b{font-size:15px;fill:var(--fig-ink);font-weight:bold}
    .uchem-4-ionic-radii-ax{stroke:var(--fig-ink);stroke-width:1.2;fill:none}
    .uchem-4-ionic-radii-gr{stroke:var(--fig-line);stroke-width:0.6;fill:none;stroke-dasharray:2 3}

    .uchem-4-ionic-radii-at{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.4}
    .uchem-4-ionic-radii-cat{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.4}
    .uchem-4-ionic-radii-an{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.4}
    .uchem-4-ionic-radii-arr{stroke:var(--fig-muted);stroke-width:1.6;fill:none}
    .uchem-4-ionic-radii-ah{fill:var(--fig-muted)}
  </style>
  <circle cx="90.0" cy="105.0" r="59.5" class="uchem-4-ionic-radii-at"/>
  <text x="90.0" y="184.5" text-anchor="middle" class="uchem-4-ionic-radii-b" >Na</text>
  <text x="90.0" y="202.5" text-anchor="middle" class="uchem-4-ionic-radii-s" >186 pm</text>
  <line x1="160" y1="105" x2="208" y2="105" class="uchem-4-ionic-radii-arr"/>
  <path d="M210.0 105.0 L202.6 108.1 L202.6 101.9 Z" class="uchem-4-ionic-radii-ah"/>
  <text x="185.0" y="97.0" text-anchor="middle" class="uchem-4-ionic-radii-s" >− e⁻</text>
  <circle cx="244.0" cy="105.0" r="32.6" class="uchem-4-ionic-radii-cat"/>
  <text x="244.0" y="157.6" text-anchor="middle" class="uchem-4-ionic-radii-b" >Na⁺</text>
  <text x="244.0" y="175.6" text-anchor="middle" class="uchem-4-ionic-radii-s" >102 pm</text>
  <circle cx="436.0" cy="105.0" r="31.7" class="uchem-4-ionic-radii-at"/>
  <text x="436.0" y="156.7" text-anchor="middle" class="uchem-4-ionic-radii-b" >Cl</text>
  <text x="436.0" y="174.7" text-anchor="middle" class="uchem-4-ionic-radii-s" >99 pm</text>
  <line x1="472" y1="105" x2="522" y2="105" class="uchem-4-ionic-radii-arr"/>
  <path d="M524.0 105.0 L516.6 108.1 L516.6 101.9 Z" class="uchem-4-ionic-radii-ah"/>
  <text x="498.0" y="97.0" text-anchor="middle" class="uchem-4-ionic-radii-s" >+ e⁻</text>
  <circle cx="590.0" cy="105.0" r="57.9" class="uchem-4-ionic-radii-an"/>
  <text x="590.0" y="182.9" text-anchor="middle" class="uchem-4-ionic-radii-b" >Cl⁻</text>
  <text x="590.0" y="200.9" text-anchor="middle" class="uchem-4-ionic-radii-s" >181 pm</text>
  <text x="167.0" y="28.0" text-anchor="middle" class="uchem-4-ionic-radii-t" >양이온은 원자보다 작다</text>
  <text x="513.0" y="28.0" text-anchor="middle" class="uchem-4-ionic-radii-t" >음이온은 원자보다 크다</text>
  <line x1="20" y1="222" x2="700" y2="222" class="uchem-4-ionic-radii-gr"/>
  <text x="360.0" y="248.0" text-anchor="middle" class="uchem-4-ionic-radii-t" >등전자 계열(전자 10개, [Ne] 배치): Z가 클수록 작다</text>
  <circle cx="94.8" cy="315.0" r="44.8" class="uchem-4-ionic-radii-an"/>
  <text x="94.8" y="379.8" text-anchor="middle" class="uchem-4-ionic-radii-b" >O²⁻</text>
  <text x="94.8" y="397.8" text-anchor="middle" class="uchem-4-ionic-radii-s" >140 pm · Z = 8</text>
  <circle cx="213.6" cy="315.0" r="42.6" class="uchem-4-ionic-radii-an"/>
  <text x="213.6" y="377.6" text-anchor="middle" class="uchem-4-ionic-radii-b" >F⁻</text>
  <text x="213.6" y="395.6" text-anchor="middle" class="uchem-4-ionic-radii-s" >133 pm · Z = 9</text>
  <circle cx="331.6" cy="315.0" r="32.6" class="uchem-4-ionic-radii-cat"/>
  <text x="331.6" y="367.6" text-anchor="middle" class="uchem-4-ionic-radii-b" >Na⁺</text>
  <text x="331.6" y="385.6" text-anchor="middle" class="uchem-4-ionic-radii-s" >102 pm · Z = 11</text>
  <circle cx="449.6" cy="315.0" r="23.0" class="uchem-4-ionic-radii-cat"/>
  <text x="449.6" y="358.0" text-anchor="middle" class="uchem-4-ionic-radii-b" >Mg²⁺</text>
  <text x="449.6" y="376.0" text-anchor="middle" class="uchem-4-ionic-radii-s" >72 pm · Z = 12</text>
  <circle cx="567.6" cy="315.0" r="17.3" class="uchem-4-ionic-radii-cat"/>
  <text x="567.6" y="352.3" text-anchor="middle" class="uchem-4-ionic-radii-b" >Al³⁺</text>
  <text x="567.6" y="370.3" text-anchor="middle" class="uchem-4-ionic-radii-s" >54 pm · Z = 13</text>
</svg>
