  <title id="t-uearth-11-q-planck-290">그림 일반지구과학 11-11 문제 1의 별의 복사 세기 분포</title>
  <desc id="d-uearth-11-q-planck-290">어떤 별이 파장마다 내는 복사의 세기(가장 큰 값을 1로 한 상대값). 세기가 가장 큰 파장(최대 복사 파장)은 290 nm이다. 색 띠는 가시광선 영역이다.</desc>
