  <title id="t-uchem-2-q-speed-he-co2">그림 일반화학 2-8 문제 5 25 °C의 헬륨과 이산화 탄소의 속력 분포</title>
  <desc id="d-uchem-2-q-speed-he-co2">맥스웰–볼츠만 식으로 계산한 25 °C의 He와 CO₂ 속력 분포. CO₂의 꼭대기는 약 336 m/s, He는 약 1113 m/s에 있고, u_rms(점선)는 CO₂ 411 m/s, He 1363 m/s로 비가 √(44.01/4.003) = 3.32이다. 곡선 아래 넓이는 둘 다 1이다.</desc>
