<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-pchem-6-debye-huckel-plot d-pchem-6-debye-huckel-plot">
  <title id="t-pchem-6-debye-huckel-plot">그림 물리화학 6-5 log γ±–√I 그래프와 디바이–휘켈 극한 법칙</title>
  <desc id="d-pchem-6-debye-huckel-plot">25 ℃에서 극한 법칙 log γ± = −0.509|z₊z₋|√I의 직선(1:1 기울기 −0.509, 2:1 기울기 −1.018, 2:2 기울기 −2.036)과 HCl 측정점. 측정점은 √I가 작을 때 1:1 직선에 붙어 있다가 √I가 커지면 직선 위로 벗어난다. 극한 법칙은 √I → 0에서 곡선의 접선이다.</desc>
