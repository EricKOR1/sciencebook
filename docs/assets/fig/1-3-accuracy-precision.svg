<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-1-3-accuracy-precision d-1-3-accuracy-precision">
  <title id="t-1-3-accuracy-precision">그림 1-3-1 정확도와 정밀도</title>
  <desc id="d-1-3-accuracy-precision">과녁 한가운데를 참값, 점을 측정값, ×를 평균이라 하면, 정확도는 평균이 한가운데에 가까운 정도이고 정밀도는 점끼리 모여 있는 정도이다.</desc>
  <style>
    .ap13-lbl{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .ap13-txt{font-size:14px;fill:var(--fig-ink)}
    .ap13-sm{font-size:13px;fill:var(--fig-muted)}
    .ap13-hi{fill:var(--fig-green)} .ap13-lo{fill:var(--fig-red)}
    .ap13-r1{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.2}
    .ap13-r2{fill:var(--fig-panel);stroke:var(--fig-blue);stroke-width:1.2}
    .ap13-dot{fill:var(--fig-red);stroke:var(--fig-panel);stroke-width:1.2}
    .ap13-mean{stroke:var(--fig-violet);stroke-width:3;fill:none;stroke-linecap:round}
  </style>
