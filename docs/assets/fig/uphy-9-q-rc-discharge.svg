<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-uphy-9-q-rc-discharge d-uphy-9-q-rc-discharge">
  <title id="t-uphy-9-q-rc-discharge">그림 일반물리학 9-10 문제 7 해설: 방전하는 축전기의 전압과 에너지</title>
  <desc id="d-uphy-9-q-rc-discharge">RC = 10 s인 회로에서 방전할 때 처음 값에 대한 전압의 비 V/V₀ = e^(−t/10)과 저장 에너지의 비 U/U₀ = e^(−2t/10)을 그렸다. 에너지는 약 3.5 s에 절반이 되고, 전압은 10 s에 약 37 %, 약 21 s에 1/8(37.5 V)이 된다. 에너지는 전압보다 두 배 빨리 준다.</desc>
