  <title id="t-pchem-2-q-he-ar-container">그림 물리화학 2-19 문제 16의 단열 용기</title>
  <desc id="d-pchem-2-q-he-ar-container">단열된 단단한 용기가 칸막이로 나뉘어 왼쪽에 He 1.00 mol(300 K, 1.00 bar, 24.9 L), 오른쪽에 Ar 1.00 mol(400 K, 1.00 bar, 33.3 L)이 들어 있다. 칸막이를 치우면 두 기체가 섞이고 열평형에 이른다. 나중 온도와 압력은 문제에서 구한다.</desc>
