  <title id="t-ochem-1-q-nitromethane-resonance">그림 유기화학 1-2 예제 5 나이트로메테인의 루이스 구조와 공명 구조</title>
  <desc id="d-ochem-1-q-nitromethane-resonance">나이트로메테인 CH₃NO₂의 루이스 구조 두 개를 공명 화살표(↔)로 이었다. 두 구조 모두 N은 결합 4개로 형식 전하 +1(⊕), 단일 결합 O는 전자쌍 3개로 −1(⊖), 이중 결합 O는 전자쌍 2개로 0이다. 두 구조는 이중 결합이 어느 O에 있는지만 다르다.</desc>
