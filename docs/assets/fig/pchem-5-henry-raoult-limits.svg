<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-pchem-5-henry-raoult-limits d-pchem-5-henry-raoult-limits">
  <title id="t-pchem-5-henry-raoult-limits">그림 물리화학 5-6 양의 벗어남을 보이는 용액에서 성분 B의 증기 압력</title>
  <desc id="d-pchem-5-henry-raoult-limits">세로축은 B의 부분 증기 압력을 순수한 B의 증기 압력으로 나눈 값 p_B/p_B*. 실선은 실제 곡선으로 라울 직선보다 위에 있다. x_B → 1에서 곡선은 라울 직선 p_B = x_B p_B*(점선)에 접하고, x_B → 0에서는 더 가파른 헨리 직선 p_B = x_B K_B(점선)에 접한다. 헨리 직선은 x_B = 1에서 K_B(&gt; p_B*)에 닿는다. 곡선은 정규 용액 모형(ξ = 1.0)으로 계산했다.</desc>
