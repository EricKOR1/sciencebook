<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t-gene-1-polygenic d-gene-1-polygenic">
  <title id="t-gene-1-polygenic">그림 생물의 유전 1-3 관여하는 유전자 수에 따른 표현형 분포</title>
  <desc id="d-gene-1-polygenic">대문자 대립유전자 하나마다 형질이 같은 양씩 더해진다고 할 때(누적 효과), 이형 접합 부모 사이 자녀의 표현형 분포이다. 유전자 1쌍이면 1:2:1의 3가지, 3쌍이면 1:6:15:20:15:6:1의 7가지 계단 모양이고, 유전자가 아주 많고 환경의 영향까지 더해지면 매끄러운 종 모양(연속 변이)이 된다. 세로축은 각 그래프에서 가장 큰 값을 같은 높이로 맞춘 상대 비율이다.</desc>
