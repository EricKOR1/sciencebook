<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-pchem-12-q-lh-rate-optimum d-pchem-12-q-lh-rate-optimum">
  <title id="t-pchem-12-q-lh-rate-optimum">그림 물리화학 12-14 문제 12 해설: LH 속도와 CO 압력</title>
  <desc id="d-pchem-12-q-lh-rate-optimum">K_B p_B = 1로 고정하고 x = K_A p_A에 대해 상대 속도 v/vmax = 8x/(2 + x)²를 그렸다. x = 2, 즉 K_A p_A = 1 + K_B p_B에서 최대이다. 그보다 왼쪽은 CO가 부족한 구간, 오른쪽은 CO가 자리를 독차지해 산소가 앉지 못하므로 느려지는 구간(피독)이다.</desc>
