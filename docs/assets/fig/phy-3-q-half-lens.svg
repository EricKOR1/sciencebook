<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-labelledby="t-phy-3-q-half-lens d-phy-3-q-half-lens">
  <title id="t-phy-3-q-half-lens">그림 물리학 3-15 문제 15 (3)에서 렌즈의 위쪽 절반을 가렸을 때</title>
  <desc id="d-phy-3-q-half-lens">초점 거리 10 cm인 볼록렌즈 앞 30 cm에 물체를 두고 렌즈의 위쪽 절반을 검은 종이로 가렸다. 물체 끝에서 나와 아래쪽 절반을 지나는 광선들도 모두 렌즈 뒤 15 cm의 같은 점에 모이므로, 상의 모양·위치·크기는 그대로이고 모이는 빛이 줄어 어두워진다. 가로세로 비율은 맞추어 그렸다.</desc>
  <style>.phy-3-q-half-lens-t{font-size:14px;fill:var(--fig-ink)} .phy-3-q-half-lens-s{font-size:13px;fill:var(--fig-muted)} .phy-3-q-half-lens-b{font-weight:700} .phy-3-q-half-lens-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .phy-3-q-half-lens-r{fill:var(--fig-red)} .phy-3-q-half-lens-bl{fill:var(--fig-blue)} .phy-3-q-half-lens-g{fill:var(--fig-green)}</style>
