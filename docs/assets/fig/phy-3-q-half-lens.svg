  <circle cx="140" cy="175" r="3" style="fill:var(--fig-ink);stroke:none"/>
  <text x="140" y="193" text-anchor="middle" class="phy-3-q-half-lens-s">2F</text>
  <circle cx="220" cy="175" r="3" style="fill:var(--fig-ink);stroke:none"/>
  <text x="220" y="193" text-anchor="middle" class="phy-3-q-half-lens-s" style="paint-order:stroke;stroke:var(--fig-panel);stroke-width:5px;stroke-linejoin:round">F</text>
  <circle cx="380" cy="175" r="3" style="fill:var(--fig-ink);stroke:none"/>
  <text x="380" y="193" text-anchor="middle" class="phy-3-q-half-lens-s">F′</text>
