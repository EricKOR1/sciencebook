<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-uearth-4-glacial-landforms d-uearth-4-glacial-landforms">
<title id="t-uearth-4-glacial-landforms">그림 일반지구과학 4-8 빙하가 만든 지형</title>
<desc id="d-uearth-4-glacial-landforms">위는 V자곡과 빙하가 깎은 U자곡의 단면 비교로, 지류의 얕은 골짜기가 본류 U자곡 위에 걸린 현곡에는 폭포가 생긴다. 아래는 산악 빙하가 흐르는 산지를 위에서 본 모식도로, 산꼭대기의 권곡, 권곡들 사이의 즐릉과 호른, 빙하 양옆의 측퇴석과 두 빙하가 합쳐진 곳의 중앙 퇴석, 말단의 종퇴석과 그 앞의 빙하 유수 평원이 보인다.</desc>
