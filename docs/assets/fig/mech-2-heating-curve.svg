<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-mech-2-heating-curve d-mech-2-heating-curve">
  <title id="t-mech-2-heating-curve">그림 역학과 에너지 2-7 얼음 1 kg을 가열할 때의 온도 변화(가로축은 실제 비율)</title>
  <desc id="d-mech-2-heating-curve">−20 °C 얼음 1 kg에 열을 가하면 얼음의 온도가 오르다가 0 °C에서 녹는 동안(약 334 kJ) 온도가 일정하고, 물이 된 뒤 다시 오르다가 100 °C에서 끓는 동안(약 2260 kJ) 다시 일정하다. 가로축 길이는 실제 열의 양에 비례하므로 기화열이 가장 큰 부분을 차지한다. 얼음의 기울기가 물보다 가파른 것은 얼음의 비열이 물의 절반이기 때문이다.</desc>
  <line x1="80.0" y1="290.0" x2="691.0" y2="290.0" style="stroke:var(--fig-ink);stroke-width:1.5;fill:none"/>
  <path d="M700.0 290.0 L691.0 294.5 L691.0 285.5 Z" style="fill:var(--fig-ink);stroke:none"/>
  <line x1="80.0" y1="290.0" x2="80.0" y2="51.0" style="stroke:var(--fig-ink);stroke-width:1.5;fill:none"/>
  <path d="M80.0 42.0 L84.5 51.0 L75.5 51.0 Z" style="fill:var(--fig-ink);stroke:none"/>
  <text x="696.0" y="280.0" text-anchor="end" style="font-size:13px;fill:var(--fig-muted)">가한 열 Q (kJ)</text>
  <text x="90.0" y="54.0" style="font-size:13px;fill:var(--fig-muted)">온도(°C)</text>
  <line x1="75.0" y1="275.6" x2="80.0" y2="275.6" style="stroke:var(--fig-ink);stroke-width:1;fill:none"/>
  <text x="71.0" y="280.6" text-anchor="end" style="font-size:13px;fill:var(--fig-muted)">-20</text>
  <line x1="75.0" y1="246.9" x2="80.0" y2="246.9" style="stroke:var(--fig-ink);stroke-width:1;fill:none"/>
  <text x="71.0" y="251.9" text-anchor="end" style="font-size:13px;fill:var(--fig-muted)">0</text>
  <line x1="75.0" y1="103.1" x2="80.0" y2="103.1" style="stroke:var(--fig-ink);stroke-width:1;fill:none"/>
  <text x="71.0" y="108.1" text-anchor="end" style="font-size:13px;fill:var(--fig-muted)">100</text>
  <line x1="75.0" y1="74.4" x2="80.0" y2="74.4" style="stroke:var(--fig-ink);stroke-width:1;fill:none"/>
  <text x="71.0" y="79.4" text-anchor="end" style="font-size:13px;fill:var(--fig-muted)">120</text>
  <line x1="80.0" y1="246.9" x2="680.0" y2="246.9" style="stroke:var(--fig-line);stroke-width:1;fill:none;stroke-dasharray:3 4"/>
  <line x1="80.0" y1="103.1" x2="680.0" y2="103.1" style="stroke:var(--fig-line);stroke-width:1;fill:none;stroke-dasharray:3 4"/>
  <line x1="80.0" y1="290.0" x2="80.0" y2="295.0" style="stroke:var(--fig-ink);stroke-width:1;fill:none"/>
  <text x="80.0" y="310.0" text-anchor="middle" style="font-size:12px;fill:var(--fig-muted)">0</text>
  <line x1="267.5" y1="290.0" x2="267.5" y2="295.0" style="stroke:var(--fig-ink);stroke-width:1;fill:none"/>
  <text x="267.5" y="310.0" text-anchor="middle" style="font-size:12px;fill:var(--fig-muted)">1000</text>
  <line x1="455.0" y1="290.0" x2="455.0" y2="295.0" style="stroke:var(--fig-ink);stroke-width:1;fill:none"/>
  <text x="455.0" y="310.0" text-anchor="middle" style="font-size:12px;fill:var(--fig-muted)">2000</text>
  <line x1="642.5" y1="290.0" x2="642.5" y2="295.0" style="stroke:var(--fig-ink);stroke-width:1;fill:none"/>
  <text x="642.5" y="310.0" text-anchor="middle" style="font-size:12px;fill:var(--fig-muted)">3000</text>
  <line x1="80.0" y1="275.6" x2="87.9" y2="246.9" style="stroke:var(--fig-blue);stroke-width:4;fill:none"/>
  <line x1="87.9" y1="246.9" x2="150.5" y2="246.9" style="stroke:var(--fig-teal);stroke-width:4;fill:none"/>
  <line x1="150.5" y1="246.9" x2="229.2" y2="103.1" style="stroke:var(--fig-green);stroke-width:4;fill:none"/>
  <line x1="229.2" y1="103.1" x2="653.0" y2="103.1" style="stroke:var(--fig-violet);stroke-width:4;fill:none"/>
  <line x1="653.0" y1="103.1" x2="660.5" y2="74.4" style="stroke:var(--fig-red);stroke-width:4;fill:none"/>
  <text x="95.9" y="269.2" style="font-size:12px;fill:var(--fig-blue)">← 얼음 가열 42 kJ</text>
  <text x="133.2" y="234.9" text-anchor="middle" style="font-size:13px;fill:var(--fig-teal);font-weight:600">융해 334 kJ</text>
  <text x="211.9" y="183.0" style="font-size:13px;fill:var(--fig-green);font-weight:600">물 가열 420 kJ</text>
  <text x="441.1" y="91.1" text-anchor="middle" style="font-size:13px;fill:var(--fig-violet);font-weight:600">기화 2260 kJ (물+수증기, 온도 일정)</text>
  <text x="654.5" y="64.4" text-anchor="end" style="font-size:12px;fill:var(--fig-red)">수증기</text>
  <rect x="330.0" y="186.0" width="330.0" height="52.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1"/>
  <text x="345.0" y="208.0" style="font-size:13px;fill:var(--fig-ink);font-weight:600">평평한 구간 = 잠열(Q = mL)</text>
  <text x="345.0" y="228.0" style="font-size:13px;fill:var(--fig-ink)">기운 구간 = 온도 변화(Q = cmΔT)</text>
  <text x="380.0" y="345.0" text-anchor="middle" style="font-size:12px;fill:var(--fig-muted)">물의 비열 4200, 얼음 2100, 수증기 약 2000 J/(kg·K)으로 계산</text>
</svg>
