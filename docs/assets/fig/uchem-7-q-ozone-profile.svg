  <title id="t-uchem-7-q-ozone-profile">그림 일반화학 7-11 문제 8의 메커니즘을 에너지 그림으로 보면</title>
  <desc id="d-uchem-7-q-ozone-profile">모식도(높이는 실제 비율이 아니다). 1단계 O₃ ⇌ O₂ + O는 고개가 낮아 정반응과 역반응이 모두 빨라 평형을 이룬다. 중간체 O가 O₃와 반응하는 2단계의 전이 상태가 가장 높아 이 단계가 속도를 결정한다.</desc>
