<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-ochem-2-q-ex6-parent-chains d-ochem-2-q-ex6-parent-chains">
  <title id="t-ochem-2-q-ex6-parent-chains">그림 유기화학 2-4 예제 6의 모체 사슬과 번호</title>
  <desc id="d-ochem-2-q-ex6-parent-chains">(1) 2,4,4-트라이메틸헥세인: 탄소 6개 사슬(굵은 선)의 2번에 메틸 1개, 4번에 메틸 2개. (2) 3-에틸-2-메틸헥세인: 탄소 6개 사슬 후보가 둘이다. 에틸을 사슬에 넣으면 치환기가 아이소프로필 1개뿐(×), 에틸을 가지로 두면 메틸·에틸 2개(○)이므로 오른쪽을 고른다. (3) 4-tert-뷰틸-3-메틸헵테인: 탄소 7개 사슬의 3번에 메틸, 4번에 tert-뷰틸.</desc>
