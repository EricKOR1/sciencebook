<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" role="img" aria-labelledby="t-ubio-1-functional-groups d-ubio-1-functional-groups">
  <title id="t-ubio-1-functional-groups">그림 일반생명과학 1-2 생명의 일곱 가지 주요 작용기</title>
  <desc id="d-ubio-1-functional-groups">하이드록시기(–OH), 카보닐기(>C=O, 사슬 끝이면 알데하이드, 가운데면 케톤), 카복실기(–COOH, 세포 pH에서 –COO⁻), 아미노기(–NH₂, 세포 pH에서 –NH₃⁺), 설프하이드릴기(–SH, 두 개가 이황화 결합), 인산기(–OPO₃²⁻), 메틸기(–CH₃)의 원자 배열과 성질, 들어 있는 분자를 나란히 보인다. R은 나머지 탄소 골격이다.</desc>
