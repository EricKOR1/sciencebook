  <title id="t-m3-02-q-humidity-ab">그림 중3-2-10 문제 11 해설: 포화 수증기량 곡선 위의 공기 A와 B</title>
  <desc id="d-m3-02-q-humidity-ab">B(10 °C, 7.6 g/kg)는 곡선 위에 있어 포화 상태(상대습도 100 %)이고, A(30 °C, 14.7 g/kg)는 곡선 아래에 있어 상대습도가 약 54 %이다. A를 냉각하면 20 °C에서 곡선과 만나므로 이슬점은 20 °C로 B보다 높다. B를 수증기량 그대로 30 °C로 데운 B′의 상대습도는 약 28 %이다. 곡선은 표의 값을 매끄럽게 이은 것이다.</desc>
