<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-uphy-5-fluid-element d-uphy-5-fluid-element">
  <title id="t-uphy-5-fluid-element">그림 일반물리학 5-7 유체 조각의 힘의 평형과 부력의 원인</title>
  <desc id="d-uphy-5-fluid-element">왼쪽: 정지한 액체 속 넓이 A, 두께 dy인 얇은 조각에는 아래 면에서 위로 PA, 위 면에서 아래로 (P + dP)A, 그리고 무게 ρgA dy가 작용하며 이들이 평형을 이루어 dP/dy = −ρg가 된다. 오른쪽: 잠긴 물체의 옆면이 받는 힘은 서로 상쇄되고, 더 깊은 아랫면이 받는 큰 압력과 윗면의 작은 압력의 차이가 위쪽 알짜힘, 즉 부력이 된다.</desc>
