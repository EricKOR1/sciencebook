  <text x="90.0" y="272.0" text-anchor="middle" class="uchem-1-volumetric-flask-t">① 용질의 질량을 잰다</text>
  <text x="90.0" y="292.0" text-anchor="middle" class="uchem-1-volumetric-flask-s">CuSO₄·5H₂O 9.364 g</text>
  <text x="270.0" y="272.0" text-anchor="middle" class="uchem-1-volumetric-flask-t">② 옮기고 물을 조금 넣어</text>
  <text x="270.0" y="292.0" text-anchor="middle" class="uchem-1-volumetric-flask-s">완전히 녹인다</text>
  <text x="450.0" y="272.0" text-anchor="middle" class="uchem-1-volumetric-flask-t">③ 눈금선까지 물을 채운다</text>
  <text x="450.0" y="292.0" text-anchor="middle" class="uchem-1-volumetric-flask-s">마지막은 스포이트로</text>
  <text x="630.0" y="272.0" text-anchor="middle" class="uchem-1-volumetric-flask-t">④ 마개를 막고 뒤집어</text>
  <text x="630.0" y="292.0" text-anchor="middle" class="uchem-1-volumetric-flask-s">여러 번 섞는다</text>
</svg>
