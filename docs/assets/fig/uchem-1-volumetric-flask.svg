<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-labelledby="t-uchem-1-volumetric-flask d-uchem-1-volumetric-flask">
  <title id="t-uchem-1-volumetric-flask">그림 일반화학 1-8 부피 플라스크로 정확한 몰 농도의 용액 만들기</title>
  <desc id="d-uchem-1-volumetric-flask">① 필요한 질량의 용질을 저울로 잰다. ② 부피 플라스크에 옮기고 물을 조금 넣어 완전히 녹인다. ③ 물을 눈금선까지 채우되, 마지막은 스포이트로 넣어 메니스커스 아랫면을 눈금선에 맞춘다. ④ 마개를 막고 여러 번 뒤집어 고르게 섞는다. 몰 농도의 분모는 이렇게 맞춘 용액 전체의 부피이다(예제 9의 250.0 mL 용액, 모식도).</desc>
  <style>
    .uchem-1-volumetric-flask-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-1-volumetric-flask-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-1-volumetric-flask-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}

  </style>
