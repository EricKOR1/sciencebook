  <text x="360" y="26" text-anchor="middle" class="esys-2-q-wave-orbits-b">수심 20 m</text>
  <text x="360" y="46" text-anchor="middle" class="esys-2-q-wave-orbits-s">전이파 (L/20 < h < L/2)</text>
