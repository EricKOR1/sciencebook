  <text x="120" y="46" text-anchor="middle" class="esys-2-q-wave-orbits-s">심해파 (h > L/2)</text>
  <text x="120" y="334" text-anchor="middle" class="esys-2-q-wave-orbits-s">파장 약 156 m</text>
  <ellipse cx="120" cy="110" rx="25" ry="25" style="fill:none;stroke:var(--fig-ink);stroke-width:1.8"/>
