<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-esys-2-q-wave-orbits d-esys-2-q-wave-orbits">
  <title id="t-esys-2-q-wave-orbits">그림 지구시스템과학 2-11 문제 13 해설의 수심에 따른 물 입자 운동</title>
  <desc id="d-esys-2-q-wave-orbits">주기 10초인 해파가 수심 100 m, 20 m, 2 m인 곳을 지날 때 물 입자가 그리는 궤도를 선형 파동 이론으로 계산한 모식도이다. 수심 100 m(심해파)에서는 원 궤도가 깊어질수록 급히 작아지고, 20 m(전이파)에서는 아래로 갈수록 납작한 타원, 2 m(천해파)에서는 납작한 타원이 바닥에서 수평 왕복 운동이 된다. 칸마다 깊이 눈금과 궤도 크기의 배율이 다르다.</desc>
  <style>
    .esys-2-q-wave-orbits-t{font-size:14px;fill:var(--fig-ink)} .esys-2-q-wave-orbits-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .esys-2-q-wave-orbits-s{font-size:13px;fill:var(--fig-muted)} .esys-2-q-wave-orbits-ax{fill:none;stroke:var(--fig-muted);stroke-width:1.4} .esys-2-q-wave-orbits-gr{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4}
  </style>
