<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-4-5-q-fridge-room d-4-5-q-fridge-room">
  <title id="t-4-5-q-fridge-room">그림 4-5-10 문제 14 해설 닫힌 방에서 문을 연 냉장고의 열 이동</title>
  <desc id="d-4-5-q-fridge-room">냉장고 속 증발기에서 냉매가 기화하며 방 공기의 열 Q를 흡수하고, 냉장고 뒤 응축기에서 냉매가 액화하며 Q에 압축기의 전기 에너지 W가 더해진 열을 같은 방으로 방출한다. 방 밖으로 나가는 열이 없으므로 방의 에너지는 W만큼 늘어난다. 화살표 굵기는 열의 크기를 대략 나타낸 모식도.</desc>
  <style>
    .f4-5-q-fridge-room-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
    .f4-5-q-fridge-room-gd{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 3}
    .f4-5-q-fridge-room-n{font-size:13px;fill:var(--fig-muted)}
    .f4-5-q-fridge-room-t{font-size:14px;fill:var(--fig-ink)}
    .f4-5-q-fridge-room-b{font-size:14px;font-weight:700;fill:var(--fig-ink)}
    .f4-5-q-fridge-room-lbl{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .f4-5-q-fridge-room-sm{font-size:13px;fill:var(--fig-muted)}
    .f4-5-q-fridge-room-ink{fill:var(--fig-ink)}
    .f4-5-q-fridge-room-l-blue{fill:none;stroke:var(--fig-blue);stroke-width:2.5}
    .f4-5-q-fridge-room-l-red{fill:none;stroke:var(--fig-red);stroke-width:2.5}
    .f4-5-q-fridge-room-l-mut{fill:none;stroke:var(--fig-muted);stroke-width:2.2;stroke-dasharray:7 4}
    .f4-5-q-fridge-room-l-amber{fill:none;stroke:var(--fig-amber);stroke-width:2.5}
    .f4-5-q-fridge-room-d-blue{fill:var(--fig-blue);stroke:var(--fig-paper);stroke-width:1.5}
    .f4-5-q-fridge-room-d-red{fill:var(--fig-red);stroke:var(--fig-paper);stroke-width:1.5}
    .f4-5-q-fridge-room-d-mut{fill:var(--fig-muted);stroke:var(--fig-paper);stroke-width:1.5}
    .f4-5-q-fridge-room-d-amber{fill:var(--fig-amber);stroke:var(--fig-paper);stroke-width:1.5}
    .f4-5-q-fridge-room-tb{font-size:14px;font-weight:700;fill:var(--fig-blue)}
    .f4-5-q-fridge-room-tr{font-size:14px;font-weight:700;fill:var(--fig-red)}
    .f4-5-q-fridge-room-tm{font-size:14px;font-weight:700;fill:var(--fig-muted)}
    .f4-5-q-fridge-room-ta{font-size:14px;font-weight:700;fill:var(--fig-amber)}

    .f4-5-q-fridge-room-room{fill:var(--fig-paper);stroke:var(--fig-ink);stroke-width:2.5}
    .f4-5-q-fridge-room-fr{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2}
    .f4-5-q-fridge-room-door{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2}
    .f4-5-q-fridge-room-coil{fill:none;stroke:var(--fig-blue);stroke-width:2.5}
    .f4-5-q-fridge-room-coilr{fill:none;stroke:var(--fig-red);stroke-width:2.5}
    .f4-5-q-fridge-room-ab{fill:none;stroke:var(--fig-blue);stroke-width:4}
    .f4-5-q-fridge-room-ar{fill:none;stroke:var(--fig-red);stroke-width:6}
    .f4-5-q-fridge-room-ah{fill:var(--fig-blue)}
    .f4-5-q-fridge-room-arh{fill:var(--fig-red)}
    .f4-5-q-fridge-room-ae{fill:none;stroke:var(--fig-amber);stroke-width:3}
    .f4-5-q-fridge-room-aeh{fill:var(--fig-amber)}
    .f4-5-q-fridge-room-win{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.5}
  </style>
  <rect x="30" y="40" width="660" height="270" class="f4-5-q-fridge-room-room"/>
  <rect x="60" y="70" width="70" height="60" class="f4-5-q-fridge-room-win"/>
  <text x="95" y="150" text-anchor="middle" class="f4-5-q-fridge-room-sm">닫힌 창문</text>
  <text x="360" y="30" text-anchor="middle" class="f4-5-q-fridge-room-b">창문과 문을 닫은 방</text>
  <rect x="360" y="110" width="110" height="190" rx="4" class="f4-5-q-fridge-room-fr"/>
  <path d="M360 110 L326 136 L326 286 L360 300 Z" class="f4-5-q-fridge-room-door"/>
  <path d="M380 140 h70 v12 h-70 v12 h70 v12 h-70" class="f4-5-q-fridge-room-coil"/>
  <text x="415" y="200" text-anchor="middle" class="f4-5-q-fridge-room-tb">증발기</text>
  <text x="415" y="218" text-anchor="middle" class="f4-5-q-fridge-room-sm">냉매 기화</text>
  <path d="M476 140 v140 M476 150 h14 M476 170 h14 M476 190 h14 M476 210 h14 M476 230 h14 M476 250 h14 M476 270 h14" class="f4-5-q-fridge-room-coilr"/>
  <text x="510" y="128" class="f4-5-q-fridge-room-tr">응축기(냉장고 뒤)</text>
  <text x="510" y="146" class="f4-5-q-fridge-room-sm">냉매 액화</text>
  <path d="M150 175 H364" class="f4-5-q-fridge-room-ab"/>
  <path d="M376 175 l-14 -9 v18 z" class="f4-5-q-fridge-room-ah"/>
  <text x="150" y="163" class="f4-5-q-fridge-room-tb">방 공기의 열 Q 흡수</text>
  <path d="M496 220 H640" class="f4-5-q-fridge-room-ar"/>
  <path d="M656 220 l-18 -12 v24 z" class="f4-5-q-fridge-room-arh"/>
  <text x="510" y="250" class="f4-5-q-fridge-room-tr">Q + W 를 같은 방에 방출</text>
  <path d="M450 300 V300 M600 300 V285 H472" class="f4-5-q-fridge-room-ae"/>
  <path d="M472 285 l12 -7 v14 z" class="f4-5-q-fridge-room-aeh"/>
  <text x="545" y="278" class="f4-5-q-fridge-room-ta">전기 에너지 W</text>
  <text x="50" y="262" class="f4-5-q-fridge-room-t">방 전체: Q는 방 안에서 돌고,</text>
  <text x="50" y="284" class="f4-5-q-fridge-room-b">W만큼 에너지가 늘어 온도 상승</text>
  <text x="360" y="340" text-anchor="middle" class="f4-5-q-fridge-room-sm">방 밖으로 나가는 열이 없다 → 냉장고는 방을 식히지 못한다</text>
</svg>
