<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-bio-3-dna-amount d-bio-3-dna-amount">
  <title id="t-bio-3-dna-amount">그림 생명과학3-2 세포 1개당 DNA 상대량의 변화</title>
  <desc id="d-bio-3-dna-amount">(가) 체세포분열에서는 S기에 DNA가 복제되어 2에서 4가 되고 분열 후 2로 돌아온다. (나) 생식세포 형성 과정에서는 한 번 복제된 뒤 감수 1분열 후 2, 감수 2분열 후 1이 되어 처음의 절반이 된다.</desc>
  <style>
    .b3dna-lbl{font-size:13.5px;fill:var(--fig-ink)} .b3dna-b{font-size:14.5px;font-weight:700;fill:var(--fig-ink)}
    .b3dna-sm{font-size:12.5px;fill:var(--fig-muted)} .b3dna-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.6}
    .b3dna-grid{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:2 4}
    .b3dna-c{fill:none;stroke:var(--fig-accent);stroke-width:3.2;stroke-linejoin:round}
    .b3dna-ph{fill:var(--fig-soft-blue);stroke:none} .b3dna-tick{font-size:12px;fill:var(--fig-muted)}
    .b3dna-g{font-size:12.5px;font-weight:700;fill:var(--fig-green)} .b3dna-r{font-size:12.5px;font-weight:700;fill:var(--fig-red)}
  </style>
  <text x="30" y="34" class="b3dna-b">(가) 체세포분열</text>
  <line x1="70" y1="213.0" x2="360" y2="213.0" class="b3dna-grid"/>
  <text x="62" y="217.0" text-anchor="end" class="b3dna-tick">1</text>
  <line x1="70" y1="176.1" x2="360" y2="176.1" class="b3dna-grid"/>
  <text x="62" y="180.1" text-anchor="end" class="b3dna-tick">2</text>
  <line x1="70" y1="139.1" x2="360" y2="139.1" class="b3dna-grid"/>
  <text x="62" y="143.1" text-anchor="end" class="b3dna-tick">3</text>
  <line x1="70" y1="102.2" x2="360" y2="102.2" class="b3dna-grid"/>
  <text x="62" y="106.2" text-anchor="end" class="b3dna-tick">4</text>
  <path d="M70 76 L70 250 L360 250" class="b3dna-ax"/>
  <text x="42" y="165.0" text-anchor="middle" class="b3dna-lbl" transform="rotate(-90 42 165.0)">DNA 상대량</text>
  <path d="M70.0 176.1 L151.2 176.1 L209.2 102.2 L342.6 102.2 L342.6 176.1 L360.0 176.1" class="b3dna-c"/>
  <line x1="151.2" y1="250" x2="151.2" y2="276" style="stroke:var(--fig-line);stroke-width:1"/>
  <text x="110.6" y="270" text-anchor="middle" class="b3dna-tick">G₁기</text>
  <line x1="209.2" y1="250" x2="209.2" y2="276" style="stroke:var(--fig-line);stroke-width:1"/>
  <text x="180.2" y="270" text-anchor="middle" class="b3dna-tick">S기</text>
  <line x1="261.4" y1="250" x2="261.4" y2="276" style="stroke:var(--fig-line);stroke-width:1"/>
  <text x="235.3" y="270" text-anchor="middle" class="b3dna-tick">G₂기</text>
  <rect x="261.4" y="254" width="81.2" height="22" style="fill:var(--fig-soft-blue);stroke:none"/>
  <line x1="342.6" y1="250" x2="342.6" y2="276" style="stroke:var(--fig-line);stroke-width:1"/>
  <text x="302.0" y="270" text-anchor="middle" class="b3dna-tick">M기</text>
  <text x="157.0" y="128.0" text-anchor="middle" class="b3dna-g">복제</text>
  <text x="326.6" y="139.1" text-anchor="middle" class="b3dna-r">분열</text>
  <text x="215.0" y="300" text-anchor="middle" class="b3dna-sm">염색체 수 2n → 2n</text>
  <text x="380" y="34" class="b3dna-b">(나) 생식세포 형성(감수 분열)</text>
  <line x1="420" y1="213.0" x2="710" y2="213.0" class="b3dna-grid"/>
  <text x="412" y="217.0" text-anchor="end" class="b3dna-tick">1</text>
  <line x1="420" y1="176.1" x2="710" y2="176.1" class="b3dna-grid"/>
  <text x="412" y="180.1" text-anchor="end" class="b3dna-tick">2</text>
  <line x1="420" y1="139.1" x2="710" y2="139.1" class="b3dna-grid"/>
  <text x="412" y="143.1" text-anchor="end" class="b3dna-tick">3</text>
  <line x1="420" y1="102.2" x2="710" y2="102.2" class="b3dna-grid"/>
  <text x="412" y="106.2" text-anchor="end" class="b3dna-tick">4</text>
  <path d="M420 76 L420 250 L710 250" class="b3dna-ax"/>
  <text x="392" y="165.0" text-anchor="middle" class="b3dna-lbl" transform="rotate(-90 392 165.0)">DNA 상대량</text>
  <path d="M420.0 176.1 L472.2 176.1 L507.0 102.2 L614.3 102.2 L614.3 176.1 L692.6 176.1 L692.6 213.0 L710.0 213.0" class="b3dna-c"/>
  <line x1="472.2" y1="250" x2="472.2" y2="276" style="stroke:var(--fig-line);stroke-width:1"/>
  <text x="446.1" y="270" text-anchor="middle" class="b3dna-tick">G₁</text>
  <line x1="507.0" y1="250" x2="507.0" y2="276" style="stroke:var(--fig-line);stroke-width:1"/>
  <text x="489.6" y="270" text-anchor="middle" class="b3dna-tick">S</text>
  <line x1="536.0" y1="250" x2="536.0" y2="276" style="stroke:var(--fig-line);stroke-width:1"/>
  <text x="521.5" y="270" text-anchor="middle" class="b3dna-tick">G₂</text>
  <rect x="536.0" y="254" width="78.3" height="22" style="fill:var(--fig-soft-blue);stroke:none"/>
  <line x1="614.3" y1="250" x2="614.3" y2="276" style="stroke:var(--fig-line);stroke-width:1"/>
  <text x="575.1" y="270" text-anchor="middle" class="b3dna-tick">감수 1분열</text>
  <rect x="614.3" y="254" width="78.3" height="22" style="fill:var(--fig-soft-blue);stroke:none"/>
  <line x1="692.6" y1="250" x2="692.6" y2="276" style="stroke:var(--fig-line);stroke-width:1"/>
  <text x="653.5" y="270" text-anchor="middle" class="b3dna-tick">감수 2분열</text>
  <text x="469.3" y="128.0" text-anchor="middle" class="b3dna-g">복제</text>
  <text x="598.4" y="139.1" text-anchor="middle" class="b3dna-r">분열</text>
  <text x="676.6" y="194.6" text-anchor="middle" class="b3dna-r">분열</text>
  <text x="565.0" y="300" text-anchor="middle" class="b3dna-sm">염색체 수 2n → n → n</text>
  <text x="360" y="322" text-anchor="middle" class="b3dna-sm">G₁기 세포 1개의 DNA양을 2로 한 상대량. 세로선은 분열이 끝나 세포가 나뉘는 시점(모식적 시간 축)</text>
</svg>
