<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-cell-3-light-reaction d-cell-3-light-reaction">
  <title id="t-cell-3-light-reaction">그림 세포와 물질대사 3-6 틸라코이드 막에서 일어나는 명반응</title>
  <desc id="d-cell-3-light-reaction">빛을 받은 광계Ⅱ가 내보낸 전자는 물의 분해로 채워지며 이때 산소와 H⁺이 생긴다. 전자는 전자 전달계를 거쳐 광계Ⅰ로 가고, 광계Ⅰ에서 다시 빛에너지를 받아 NADP⁺에 전달되어 NADPH가 된다(비순환적 전자 흐름). 전자 전달계는 H⁺을 스트로마에서 틸라코이드 내부로 퍼내고, 쌓인 H⁺이 ATP 합성 효소를 지나 스트로마로 나갈 때 ATP가 만들어진다. 순환적 전자 흐름(점선)은 광계Ⅰ의 전자가 전자 전달계로 되돌아오며 ATP만 만든다. 모식도.</desc>
