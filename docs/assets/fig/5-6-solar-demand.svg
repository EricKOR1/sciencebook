<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 358" role="img" aria-labelledby="t-5-6-solar-demand d-5-6-solar-demand">
  <title id="t-5-6-solar-demand">그림 5-6-6 태양광 발전의 간헐성</title>
  <desc id="d-5-6-solar-demand">맑은 날 태양광 발전량은 해가 뜨는 6시 무렵부터 늘어 낮 12시 무렵 가장 많고 해가 지면 0이 된다. 전력 수요는 저녁 7시 무렵 가장 많아, 낮에는 전기가 남고 정작 수요가 많은 저녁에는 태양광 전기가 없다. 낮에 남는 전기를 에너지 저장 장치나 양수 발전으로 저장했다가 저녁에 쓰면 이 차이를 메울 수 있다. 상댓값으로 그린 모식도.</desc>
