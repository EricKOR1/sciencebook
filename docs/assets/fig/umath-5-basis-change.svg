  <path d="M80.0 94.4 L76.8 101.4 L83.2 101.4 Z" style="fill:var(--fig-line);stroke:none"/>
  <text x="282.4" y="278.0" text-anchor="end" class="umath-5-basis-change-s">x</text>
  <text x="72.0" y="98.4" text-anchor="end" class="umath-5-basis-change-s">y</text>
  <line x1="218.0" y1="168.0" x2="218.0" y2="260.0" style="stroke:var(--fig-muted);stroke-width:1.3;fill:none;stroke-dasharray:5 4"/>
  <line x1="218.0" y1="168.0" x2="80.0" y2="168.0" style="stroke:var(--fig-muted);stroke-width:1.3;fill:none;stroke-dasharray:5 4"/>
  <text x="218.0" y="280.0" text-anchor="middle" class="umath-5-basis-change-b" style="fill:var(--fig-blue);">3</text>
  <text x="70.0" y="173.0" text-anchor="end" class="umath-5-basis-change-b" style="fill:var(--fig-green);">2</text>
  <line x1="80.0" y1="260.0" x2="118.0" y2="260.0" style="stroke:var(--fig-blue);stroke-width:3;fill:none"/>
  <path d="M126.0 260.0 L116.0 255.5 L116.0 264.5 Z" style="fill:var(--fig-blue);stroke:none"/>
  <line x1="80.0" y1="260.0" x2="80.0" y2="222.0" style="stroke:var(--fig-green);stroke-width:3;fill:none"/>
  <path d="M80.0 214.0 L75.5 224.0 L84.5 224.0 Z" style="fill:var(--fig-green);stroke:none"/>
  <text x="103.0" y="280.0" text-anchor="middle" class="umath-5-basis-change-b" style="fill:var(--fig-blue);">e₁</text>
  <text x="70.0" y="232.4" text-anchor="end" class="umath-5-basis-change-b" style="fill:var(--fig-green);">e₂</text>
  <text x="153.6" y="312.0" text-anchor="start" class="umath-5-basis-change-t">v = 3e₁ + 2e₂</text>
  <line x1="80.0" y1="260.0" x2="210.0" y2="173.3" style="stroke:var(--fig-red);stroke-width:3;fill:none"/>
  <path d="M218.0 168.0 L205.0 170.2 L211.0 179.1 Z" style="fill:var(--fig-red);stroke:none"/>
  <text x="226.0" y="160.0" text-anchor="start" class="umath-5-basis-change-b" style="fill:var(--fig-red);">v</text>
  <text x="520.0" y="34.0" text-anchor="middle" class="umath-5-basis-change-b">(나) 45° 돌린 기저 u₁, u₂</text>
  <line x1="394.8" y1="260.0" x2="646.8" y2="260.0" style="stroke:var(--fig-line);stroke-width:1.2;fill:none"/>
  <path d="M652.4 260.0 L645.4 256.9 L645.4 263.1 Z" style="fill:var(--fig-line);stroke:none"/>
