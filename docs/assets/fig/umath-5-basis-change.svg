  <line x1="407.7" y1="302.3" x2="593.1" y2="116.9" style="stroke:var(--fig-violet);stroke-width:1;fill:none;stroke-dasharray:2 3"/>
  <line x1="495.5" y1="305.5" x2="388.2" y2="198.2" style="stroke:var(--fig-violet);stroke-width:1;fill:none;stroke-dasharray:2 3"/>
  <line x1="588.0" y1="168.0" x2="565.0" y2="145.0" style="stroke:var(--fig-muted);stroke-width:1.3;fill:none;stroke-dasharray:5 4"/>
  <line x1="588.0" y1="168.0" x2="473.0" y2="283.0" style="stroke:var(--fig-muted);stroke-width:1.3;fill:none;stroke-dasharray:5 4"/>
