  <circle cx="473.0" cy="283.0" r="3.0" style="stroke:none;stroke-width:1.5;fill:var(--fig-teal)"/>
  <text x="577.0" y="163.0" text-anchor="start" class="umath-5-basis-change-b" style="fill:var(--fig-violet);">5/√2 ≈ 3.54</text>
  <text x="463.0" y="303.0" text-anchor="end" class="umath-5-basis-change-b" style="fill:var(--fig-teal);">−1/√2 ≈ −0.71</text>
  <line x1="450.0" y1="260.0" x2="476.9" y2="233.1" style="stroke:var(--fig-violet);stroke-width:3;fill:none"/>
  <path d="M482.5 227.5 L472.3 231.4 L478.6 237.7 Z" style="fill:var(--fig-violet);stroke:none"/>
  <line x1="450.0" y1="260.0" x2="423.1" y2="233.1" style="stroke:var(--fig-teal);stroke-width:3;fill:none"/>
  <path d="M417.5 227.5 L421.4 237.7 L427.7 231.4 Z" style="fill:var(--fig-teal);stroke:none"/>
  <text x="478.5" y="215.5" text-anchor="end" class="umath-5-basis-change-b" style="fill:var(--fig-violet);">u₁</text>
  <text x="411.5" y="221.5" text-anchor="end" class="umath-5-basis-change-b" style="fill:var(--fig-teal);">u₂</text>
  <text x="523.6" y="312.0" text-anchor="start" class="umath-5-basis-change-t">v = 3.54u₁ − 0.71u₂</text>
  <line x1="450.0" y1="260.0" x2="580.0" y2="173.3" style="stroke:var(--fig-red);stroke-width:3;fill:none"/>
  <path d="M588.0 168.0 L575.0 170.2 L581.0 179.1 Z" style="fill:var(--fig-red);stroke:none"/>
  <text x="596.0" y="160.0" text-anchor="start" class="umath-5-basis-change-b" style="fill:var(--fig-red);">v</text>
  <text x="360.0" y="345.0" text-anchor="middle" class="umath-5-basis-change-b" style="fill:var(--fig-accent);">벡터는 같고 성분만 다르다 — 기저를 바꾸면 성분이 바뀐다</text>
</svg>
