<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-umath-5-basis-change d-umath-5-basis-change">
  <title id="t-umath-5-basis-change">그림 수학 도구 5-1 같은 벡터, 두 기저</title>
  <desc id="d-umath-5-basis-change">같은 벡터 v = (3, 2)를 왼쪽은 표준 기저 e1, e2로, 오른쪽은 45° 돌린 정규 직교 기저 u1, u2로 나타냈다. 성분은 각각 (3, 2)와 (5/√2, −1/√2) ≈ (3.54, −0.71)이다.</desc>
  <style>.umath-5-basis-change-t{font-size:14px;fill:var(--fig-ink)} .umath-5-basis-change-s{font-size:13px;fill:var(--fig-muted)} .umath-5-basis-change-b{font-size:15px;font-weight:600;fill:var(--fig-ink)} .umath-5-basis-change-i{font-style:italic} .umath-5-basis-change-sub{font-size:70%;baseline-shift:sub} .umath-5-basis-change-sup{font-size:70%;baseline-shift:super}</style>
  <text x="150.0" y="34.0" text-anchor="middle" class="umath-5-basis-change-b">(가) 표준 기저 e₁, e₂</text>
  <line x1="24.8" y1="260.0" x2="276.8" y2="260.0" style="stroke:var(--fig-line);stroke-width:1.2;fill:none"/>
  <path d="M282.4 260.0 L275.4 256.9 L275.4 263.1 Z" style="fill:var(--fig-line);stroke:none"/>
