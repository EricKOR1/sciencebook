<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t-m2-03-specular-diffuse d-m2-03-specular-diffuse">
  <title id="t-m2-03-specular-diffuse">그림 중2-3-5 정반사와 난반사</title>
  <desc id="d-m2-03-specular-diffuse">(가) 매끄러운 면에서는 나란히 들어온 빛이 나란히 한 방향으로 반사된다(정반사). (나) 울퉁불퉁한 면에서는 빛이 닿는 점마다 법선의 방향이 달라 반사된 빛이 여러 방향으로 흩어진다(난반사). 두 경우 모두 각 점에서는 입사각과 반사각이 같다. 표면의 굴곡은 크게 과장한 모식도이다.</desc>
  <style>
    .m2-03-specular-diffuse-t{font-size:14px;fill:var(--fig-ink)}
    .m2-03-specular-diffuse-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .m2-03-specular-diffuse-s{font-size:13px;fill:var(--fig-muted)}

