  <desc id="d-rxn-3-q-xyz-structures">X는 폼일기를 가진 프로판알, Y는 X가 산화된 프로판산(카복실기), Z는 Y와 메탄올이 물 한 분자를 내놓으며 연결된 에스터 CH₃CH₂COOCH₃(C₄H₈O₂)이다. 노란 상자는 작용기, 청록 상자는 −COO− 연결이다.</desc>
