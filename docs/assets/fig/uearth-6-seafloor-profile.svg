<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-uearth-6-seafloor-profile d-uearth-6-seafloor-profile">
<title id="t-uearth-6-seafloor-profile">그림 일반지구과학 6-1 해저 지형의 단면</title>
<desc id="d-uearth-6-seafloor-profile">왼쪽의 비활동형 주변부에서 대륙붕·대륙 사면·대륙대를 지나 심해저 평원, 해산과 기요, 중앙 해령을 거쳐 오른쪽 활동형 주변부의 해구와 화산호로 이어진다. 점선은 탄산염 보상 심도로, 이보다 얕은 해령 사면에는 석회질 연니가, 깊은 심해저에는 원양성 점토가 쌓인다.</desc>
<style>
.uearth-6-seafloor-profile-t{font-size:14px;fill:var(--fig-ink)} .uearth-6-seafloor-profile-s{font-size:13px;fill:var(--fig-muted)} .uearth-6-seafloor-profile-b{font-size:14px;fill:var(--fig-ink);font-weight:600}
</style>
