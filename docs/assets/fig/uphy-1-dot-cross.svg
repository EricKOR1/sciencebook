<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-uphy-1-dot-cross d-uphy-1-dot-cross">
  <title id="t-uphy-1-dot-cross">그림 일반물리학 1-1 스칼라곱은 그림자, 벡터곱은 넓이와 회전축</title>
  <desc id="d-uphy-1-dot-cross">왼쪽: 벡터 B를 벡터 A 위로 수직으로 내린 그림자의 길이는 B cos φ이고, 스칼라곱은 A와 이 그림자 길이의 곱이다. 오른쪽: 두 벡터가 만드는 평행사변형의 넓이가 벡터곱의 크기 AB sin φ이고, 벡터곱은 이 면에 수직이며 오른손 법칙으로 방향이 정해진다.</desc>
  <style>.uphy-1-dot-cross-t{font-size:14px;fill:var(--fig-ink)} .uphy-1-dot-cross-s{font-size:13px;fill:var(--fig-muted)} .uphy-1-dot-cross-b{font-size:15px;font-weight:600;fill:var(--fig-ink)} .uphy-1-dot-cross-f-ink{fill:var(--fig-ink)} .uphy-1-dot-cross-st-ink{stroke:var(--fig-ink);fill:none} .uphy-1-dot-cross-f-muted{fill:var(--fig-muted)} .uphy-1-dot-cross-st-muted{stroke:var(--fig-muted);fill:none} .uphy-1-dot-cross-f-line{fill:var(--fig-line)} .uphy-1-dot-cross-st-line{stroke:var(--fig-line);fill:none} .uphy-1-dot-cross-f-accent{fill:var(--fig-accent)} .uphy-1-dot-cross-st-accent{stroke:var(--fig-accent);fill:none} .uphy-1-dot-cross-f-blue{fill:var(--fig-blue)} .uphy-1-dot-cross-st-blue{stroke:var(--fig-blue);fill:none} .uphy-1-dot-cross-f-red{fill:var(--fig-red)} .uphy-1-dot-cross-st-red{stroke:var(--fig-red);fill:none} .uphy-1-dot-cross-f-green{fill:var(--fig-green)} .uphy-1-dot-cross-st-green{stroke:var(--fig-green);fill:none} .uphy-1-dot-cross-f-amber{fill:var(--fig-amber)} .uphy-1-dot-cross-st-amber{stroke:var(--fig-amber);fill:none} .uphy-1-dot-cross-f-violet{fill:var(--fig-violet)} .uphy-1-dot-cross-st-violet{stroke:var(--fig-violet);fill:none} .uphy-1-dot-cross-f-teal{fill:var(--fig-teal)} .uphy-1-dot-cross-st-teal{stroke:var(--fig-teal);fill:none}</style>
  <rect x="10.0" y="10.0" width="340.0" height="340.0" rx="10" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <rect x="370.0" y="10.0" width="340.0" height="340.0" rx="10" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <text x="30.0" y="40.0" class="uphy-1-dot-cross-b">(가) 스칼라곱 = 그림자</text>
  <text x="390.0" y="40.0" class="uphy-1-dot-cross-b">(나) 벡터곱 = 넓이와 회전축</text>
  <rect x="50.0" y="256.0" width="112.5" height="9.0" rx="0" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.2"/>
  <line x1="162.5" y1="115.9" x2="162.5" y2="265.0" style="stroke:var(--fig-muted);stroke-width:1.3;stroke-linecap:round;stroke-dasharray:5 4"/>
  <line x1="50.0" y1="250.0" x2="290.0" y2="250.0" style="stroke:var(--fig-blue);stroke-width:3;stroke-linecap:butt"/>
  <polygon points="300.0,250.0 289.0,254.9 289.0,245.1" style="fill:var(--fig-blue);stroke:none;stroke-width:1;stroke-linejoin:round"/>
  <line x1="50.0" y1="250.0" x2="156.1" y2="123.6" style="stroke:var(--fig-red);stroke-width:3;stroke-linecap:butt"/>
  <polygon points="162.5,115.9 159.2,127.6 151.6,121.2" style="fill:var(--fig-red);stroke:none;stroke-width:1;stroke-linejoin:round"/>
  <path d="M88.0 250.0 A38 38 0 0 0 74.4 220.9" style="fill:none;stroke:var(--fig-muted);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round"/>
  <text x="94.0" y="236.0" class="uphy-1-dot-cross-t" style="font-style:italic">φ</text>
  <text x="296.0" y="240.0" text-anchor="end" class="uphy-1-dot-cross-b" style="fill:var(--fig-blue)">A</text>
  <text x="170.5" y="111.9" class="uphy-1-dot-cross-b" style="fill:var(--fig-red)">B</text>
  <text x="106.2" y="284.0" text-anchor="middle" class="uphy-1-dot-cross-t" style="fill:var(--fig-amber);font-weight:600">B cos φ</text>
  <text x="106.2" y="300.0" text-anchor="middle" class="uphy-1-dot-cross-s">(B의 그림자)</text>
  <text x="30.0" y="74.0" class="uphy-1-dot-cross-t" style="font-weight:600">A · B = A × (B cos φ)</text>
  <text x="30.0" y="94.0" class="uphy-1-dot-cross-s">= AxBx + AyBy + AzBz  (스칼라)</text>
  <text x="30.0" y="324.0" class="uphy-1-dot-cross-s">φ = 90°이면 그림자 0 → A · B = 0 (수직)</text>
  <text x="30.0" y="342.0" class="uphy-1-dot-cross-s">φ > 90°이면 그림자가 반대쪽 → 음수</text>
  <polygon points="390.0,286.0 635.0,286.0 720.0,182.0 475.0,182.0" style="fill:var(--fig-soft-blue);stroke:none;stroke-width:1;stroke-linejoin:round;fill-opacity:0.45"/>
  <polygon points="420.0,262.0 595.0,262.0 673.0,200.0 498.0,200.0" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5;stroke-linejoin:round"/>
  <text x="540.0" y="240.0" text-anchor="middle" class="uphy-1-dot-cross-t" style="fill:var(--fig-violet);font-weight:600">넓이 = AB sin φ</text>
  <line x1="420.0" y1="262.0" x2="585.0" y2="262.0" style="stroke:var(--fig-blue);stroke-width:3;stroke-linecap:butt"/>
  <polygon points="595.0,262.0 584.0,266.9 584.0,257.1" style="fill:var(--fig-blue);stroke:none;stroke-width:1;stroke-linejoin:round"/>
  <line x1="420.0" y1="262.0" x2="490.2" y2="206.2" style="stroke:var(--fig-red);stroke-width:3;stroke-linecap:butt"/>
  <polygon points="498.0,200.0 492.5,210.7 486.3,203.0" style="fill:var(--fig-red);stroke:none;stroke-width:1;stroke-linejoin:round"/>
  <text x="593.0" y="282.0" text-anchor="end" class="uphy-1-dot-cross-b" style="fill:var(--fig-blue)">A</text>
  <text x="486.0" y="202.0" text-anchor="end" class="uphy-1-dot-cross-b" style="fill:var(--fig-red)">B</text>
  <line x1="420.0" y1="262.0" x2="420.0" y2="104.0" style="stroke:var(--fig-green);stroke-width:3.2;stroke-linecap:butt"/>
  <polygon points="420.0,94.0 424.9,105.0 415.1,105.0" style="fill:var(--fig-green);stroke:none;stroke-width:1;stroke-linejoin:round"/>
  <text x="430.0" y="102.0" class="uphy-1-dot-cross-b" style="fill:var(--fig-green)">C = A × B</text>
  <text x="430.0" y="120.0" class="uphy-1-dot-cross-s">두 벡터에 모두 수직</text>
  <path d="M450.0 188.0 A30 11 0 1 1 394.0 188.0" style="fill:none;stroke:var(--fig-amber);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>
  <polygon points="394.0,188.0 402.0,178.0 405.0,191.0" style="fill:var(--fig-amber);stroke:none;stroke-width:1;stroke-linejoin:round"/>
  <text x="460.0" y="176.0" class="uphy-1-dot-cross-s">오른손 네 손가락: A → B 쪽으로</text>
  <text x="460.0" y="194.0" class="uphy-1-dot-cross-s">엄지가 가리키는 쪽이 A × B</text>
  <line x1="695.0" y1="204.0" x2="695.0" y2="292.0" style="stroke:var(--fig-muted);stroke-width:2;stroke-linecap:butt;stroke-dasharray:5 4"/>
  <polygon points="695.0,302.0 690.0,291.0 700.0,291.0" style="fill:var(--fig-muted);stroke:none;stroke-width:1;stroke-linejoin:round"/>
  <text x="687.0" y="324.0" text-anchor="middle" class="uphy-1-dot-cross-s">B × A = −A × B</text>
  <text x="390.0" y="342.0" class="uphy-1-dot-cross-s">크기: 평행사변형의 넓이  ·  나란하면 0</text>
</svg>
