  <title id="t-4-3-q-al-after">그림 4-3-10 문제 10 해설: Cu²⁺가 모두 반응한 뒤의 모형</title>
  <desc id="d-4-3-q-al-after">Cu²⁺ 12개가 전자 24개를 얻어 구리 원자 12개로 알루미늄 표면에 석출되고, 알루미늄 원자 8개가 전자 24개를 잃어 Al³⁺ 8개가 된다. SO₄²⁻ 12개는 그대로이며, 양이온 전하의 총합은 8 × (+3) = +24로 반응 전 12 × (+2)와 같다. 푸른색을 내는 Cu²⁺가 없어 수용액은 무색에 가깝다. 물 분자는 생략했다.</desc>
