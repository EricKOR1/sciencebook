<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t-phy-3-light-clock d-phy-3-light-clock">
  <title id="t-phy-3-light-clock">그림 물리학 3-9 빛 시계로 보는 시간 팽창</title>
  <desc id="d-phy-3-light-clock">(가) 시계와 함께 움직이는 사람에게 빛은 두 거울 사이를 위아래로 곧게 왕복한다. (나) 시계가 빠르게 지나가는 것을 밖에서 보면 빛은 비스듬한 더 긴 길을 간다. 빛의 속력은 누구에게나 같으므로 밖의 관찰자에게는 한 번 똑딱이는 데 시간이 더 걸린다(모식도).</desc>
  <style>
    .phy-3-light-clock-lbl{font-size:14px;fill:var(--fig-ink)} .phy-3-light-clock-sm{font-size:13px;fill:var(--fig-muted)} .phy-3-light-clock-b{font-weight:600}
  </style>
<text x="130.0" y="30.0" text-anchor="middle" class="phy-3-light-clock-lbl phy-3-light-clock-b">(가) 시계와 함께 탄 사람이 볼 때</text>
<rect x="90.0" y="58.0" width="80.0" height="8.0" rx="0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
<rect x="90.0" y="234.0" width="80.0" height="8.0" rx="0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
<line x1="118.0" y1="230.0" x2="118.0" y2="82.0" style="stroke:var(--fig-amber);stroke-width:2.5;fill:none"/>
<path d="M118.0 72.0 L122.5 82.0 L113.5 82.0 Z" style="fill:var(--fig-amber)"/>
<line x1="142.0" y1="72.0" x2="142.0" y2="220.0" style="stroke:var(--fig-amber);stroke-width:2.5;fill:none"/>
<path d="M142.0 230.0 L137.5 220.0 L146.5 220.0 Z" style="fill:var(--fig-amber)"/>
<text x="130.0" y="270.0" text-anchor="middle" class="phy-3-light-clock-sm">위아래로 곧게 왕복 (짧은 길)</text>
<line x1="270.0" y1="20.0" x2="270.0" y2="300.0" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4;fill:none"/>
<text x="490.0" y="30.0" text-anchor="middle" class="phy-3-light-clock-lbl phy-3-light-clock-b">(나) 밖에 서 있는 사람이 볼 때</text>
<rect x="320.0" y="58.0" width="80.0" height="8.0" rx="0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
<rect x="320.0" y="234.0" width="80.0" height="8.0" rx="0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
<text x="360.0" y="254.0" text-anchor="middle" class="phy-3-light-clock-sm">처음</text>
<rect x="450.0" y="58.0" width="80.0" height="8.0" rx="0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
<rect x="450.0" y="234.0" width="80.0" height="8.0" rx="0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
<text x="490.0" y="254.0" text-anchor="middle" class="phy-3-light-clock-sm">빛이 위 거울에</text>
<rect x="580.0" y="58.0" width="80.0" height="8.0" rx="0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
<rect x="580.0" y="234.0" width="80.0" height="8.0" rx="0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
<text x="620.0" y="254.0" text-anchor="middle" class="phy-3-light-clock-sm">빛이 돌아옴</text>
<line x1="365.0" y1="230.0" x2="479.0" y2="80.0" style="stroke:var(--fig-amber);stroke-width:2.5;fill:none"/>
<path d="M485.0 72.0 L482.5 82.7 L475.4 77.2 Z" style="fill:var(--fig-amber)"/>
<line x1="495.0" y1="72.0" x2="609.0" y2="222.0" style="stroke:var(--fig-amber);stroke-width:2.5;fill:none"/>
<path d="M615.0 230.0 L605.4 224.8 L612.5 219.3 Z" style="fill:var(--fig-amber)"/>
<line x1="560.0" y1="290.0" x2="650.0" y2="290.0" style="stroke:var(--fig-green);stroke-width:2.5;fill:none"/>
<path d="M660.0 290.0 L650.0 294.5 L650.0 285.5 Z" style="fill:var(--fig-green)"/>
<text x="555.0" y="295.0" text-anchor="end" class="phy-3-light-clock-sm" style="fill:var(--fig-green)">시계의 운동 방향</text>
<text x="490.0" y="275.0" text-anchor="middle" class="phy-3-light-clock-sm" style="fill:var(--fig-red)">비스듬한 지그재그 (더 긴 길) → 더 긴 시간</text>
</svg>
