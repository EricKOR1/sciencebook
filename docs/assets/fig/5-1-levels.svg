<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-5-1-levels d-5-1-levels">
  <title id="t-5-1-levels">그림 5-1-2 생태계의 구성 단계</title>
  <desc id="d-5-1-levels">어느 산의 소나무 숲을 예로 든 모식도이다. 소나무 한 그루가 개체, 그 산의 소나무 전체가 개체군(같은 종), 소나무·참나무·다람쥐·새·버섯 등 여러 개체군을 모두 묶은 것이 군집, 군집에 빛·물·흙·공기·온도 같은 비생물적 환경까지 더한 것이 생태계이다.</desc>
  <style>
    .lv-ttl{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .lv-lbl{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .lv-sm{font-size:13px;fill:var(--fig-muted)}
    .lv-tiny{font-size:12px;font-weight:600;fill:var(--fig-ink)}
    .lv-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}
    .lv-eco{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8}
    .lv-soil{fill:var(--fig-soft-amber);stroke:none}
    .lv-trunk{fill:var(--fig-amber)}
    .lv-pine{fill:var(--fig-green);stroke:var(--fig-green);stroke-width:1}
    .lv-oak{fill:var(--fig-soft-green);stroke:var(--fig-teal);stroke-width:1.8}
    .lv-sq{fill:var(--fig-amber)}
    .lv-bird{fill:none;stroke:var(--fig-ink);stroke-width:1.8}
    .lv-stem{fill:var(--fig-line)}
    .lv-cap{fill:var(--fig-red)}
    .lv-sun{fill:var(--fig-amber)}
    .lv-rain{stroke:var(--fig-blue);stroke-width:2}
    .lv-arrh{fill:var(--fig-muted)}
  </style>
