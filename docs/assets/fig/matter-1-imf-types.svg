  <text x="640" y="141" text-anchor="middle" class="matter-1-imf-types-l" style="font-size:13px;font-weight:700">O</text>
  <circle cx="661.3" cy="150.9" r="8" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6"/>
