<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-matter-1-imf-types d-matter-1-imf-types">
  <title id="t-matter-1-imf-types">그림 물질과 에너지 1-5 세 가지 분자 간 상호작용</title>
  <desc id="d-matter-1-imf-types">분산력은 한 분자에 순간적으로 생긴 쌍극자가 이웃 분자에 유발 쌍극자를 만들어 생기는 인력이다. 쌍극자–쌍극자 힘은 극성 분자의 부분 양전하와 부분 음전하가 마주 보며 끄는 힘이다. 수소 결합은 O에 결합한 H와 이웃 분자의 O 사이의 강한 인력이다. 점선은 분자 사이의 힘, 실선은 분자 안의 공유 결합이다. 모식도이다.</desc>
  <style>
    .matter-1-imf-types-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
    .matter-1-imf-types-gr{fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4}
    .matter-1-imf-types-l{font-size:14px;fill:var(--fig-ink)}
    .matter-1-imf-types-t{font-size:13px;fill:var(--fig-muted)}
    .matter-1-imf-types-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .matter-1-imf-types-ink{fill:var(--fig-ink)}
    .matter-1-imf-types-cl{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6}
    .matter-1-imf-types-d{font-size:14px;font-weight:700}
  </style>
  <line x1="240" y1="20" x2="240" y2="280" style="stroke:var(--fig-line);stroke-width:1"/>
  <line x1="480" y1="20" x2="480" y2="280" style="stroke:var(--fig-line);stroke-width:1"/>
  <text x="120" y="28" text-anchor="middle" class="matter-1-imf-types-h">(가) 분산력</text>
  <text x="120" y="47" text-anchor="middle" class="matter-1-imf-types-t">모든 분자 사이</text>
  <ellipse cx="59" cy="150" rx="40" ry="30" class="matter-1-imf-types-cl"/>
  <circle cx="68" cy="150" r="5" class="matter-1-imf-types-ink"/>
  <text x="34" y="113" text-anchor="middle" class="matter-1-imf-types-d" style="fill:var(--fig-blue)">δ−</text>
  <text x="98" y="113" text-anchor="middle" class="matter-1-imf-types-d" style="fill:var(--fig-red)">δ+</text>
  <text x="64" y="205" text-anchor="middle" class="matter-1-imf-types-t">순간 쌍극자</text>
  <ellipse cx="163" cy="150" rx="40" ry="30" class="matter-1-imf-types-cl"/>
  <circle cx="172" cy="150" r="5" class="matter-1-imf-types-ink"/>
  <text x="138" y="113" text-anchor="middle" class="matter-1-imf-types-d" style="fill:var(--fig-blue)">δ−</text>
  <text x="202" y="113" text-anchor="middle" class="matter-1-imf-types-d" style="fill:var(--fig-red)">δ+</text>
  <text x="168" y="205" text-anchor="middle" class="matter-1-imf-types-t">유발 쌍극자</text>
  <line x1="100" y1="150" x2="122" y2="150" style="stroke:var(--fig-violet);stroke-width:2.6;stroke-dasharray:2 5;stroke-linecap:round"/>
  <text x="120" y="236" text-anchor="middle" class="matter-1-imf-types-t">전자 구름이 한쪽으로 쏠림</text>
  <text x="120" y="254" text-anchor="middle" class="matter-1-imf-types-t">→ 이웃 분자의 전자도 쏠림</text>
  <text x="360" y="28" text-anchor="middle" class="matter-1-imf-types-h">(나) 쌍극자–쌍극자 힘</text>
  <text x="360" y="47" text-anchor="middle" class="matter-1-imf-types-t">극성 분자 사이 (예: HCl)</text>
