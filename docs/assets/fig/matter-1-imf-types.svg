  <line x1="282" y1="129" x2="282" y2="170" style="stroke:var(--fig-violet);stroke-width:2.6;stroke-dasharray:2 5;stroke-linecap:round"/>
  <line x1="309" y1="136" x2="309" y2="177" style="stroke:var(--fig-violet);stroke-width:2.6;stroke-dasharray:2 5;stroke-linecap:round"/>
  <text x="282" y="102" text-anchor="middle" class="matter-1-imf-types-d" style="fill:var(--fig-red)">δ+</text>
  <text x="309" y="98" text-anchor="middle" class="matter-1-imf-types-d" style="fill:var(--fig-blue)">δ−</text>
  <text x="360" y="236" text-anchor="middle" class="matter-1-imf-types-t">δ+와 δ−가 마주 보도록</text>
  <text x="360" y="254" text-anchor="middle" class="matter-1-imf-types-t">늘어서며 서로 끈다</text>
  <text x="600" y="28" text-anchor="middle" class="matter-1-imf-types-h">(다) 수소 결합</text>
  <text x="600" y="47" text-anchor="middle" class="matter-1-imf-types-t">F·O·N에 결합한 H ··· 이웃 F·O·N</text>
  <line x1="538" y1="104" x2="562.8" y2="111.8" style="stroke:var(--fig-ink);stroke-width:3"/>
  <line x1="538" y1="104" x2="524.3" y2="126.1" style="stroke:var(--fig-ink);stroke-width:3"/>
