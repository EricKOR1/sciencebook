  <text x="538" y="109" text-anchor="middle" class="matter-1-imf-types-l" style="font-size:13px;font-weight:700">O</text>
  <circle cx="562.8" cy="111.8" r="8" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6"/>
