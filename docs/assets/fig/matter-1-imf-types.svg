  <line x1="614.2" y1="158.1" x2="579.9" y2="187.5" style="stroke:var(--fig-violet);stroke-width:2.6;stroke-dasharray:2 5;stroke-linecap:round"/>
  <text x="652" y="196" class="matter-1-imf-types-t" style="fill:var(--fig-violet);font-weight:700">수소 결합</text>
  <text x="600" y="236" text-anchor="middle" class="matter-1-imf-types-t">분자 사이 힘 중 가장 강하다</text>
  <text x="600" y="254" text-anchor="middle" class="matter-1-imf-types-t">(공유 결합보다는 훨씬 약함)</text>
  <line x1="170" y1="304" x2="210" y2="304" style="stroke:var(--fig-violet);stroke-width:2.6;stroke-dasharray:2 5;stroke-linecap:round"/>
  <text x="218" y="309" class="matter-1-imf-types-t">분자 사이의 힘</text>
  <line x1="350" y1="304" x2="390" y2="304" style="stroke:var(--fig-ink);stroke-width:3"/>
  <text x="398" y="309" class="matter-1-imf-types-t">분자 안의 공유 결합</text>
  <text x="360" y="340" text-anchor="middle" class="matter-1-imf-types-l">분자량이 비슷할 때 대체로 분산력 &lt; 쌍극자–쌍극자 힘 &lt; 수소 결합</text>
</svg>
