  <text x="409" y="125" text-anchor="middle" class="matter-1-imf-types-l" style="font-size:13px;font-weight:700">Cl</text>
  <text x="382" y="124.5" text-anchor="middle" class="matter-1-imf-types-l" style="font-size:12px;font-weight:700">H</text>
  <line x1="325" y1="120" x2="373" y2="120" style="stroke:var(--fig-violet);stroke-width:2.6;stroke-dasharray:2 5;stroke-linecap:round"/>
  <line x1="309" y1="186" x2="282" y2="186" style="stroke:var(--fig-ink);stroke-width:3"/>
  <circle cx="282" cy="186" r="16" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.6"/>
