  <text x="282" y="191" text-anchor="middle" class="matter-1-imf-types-l" style="font-size:13px;font-weight:700">Cl</text>
  <text x="309" y="190.5" text-anchor="middle" class="matter-1-imf-types-l" style="font-size:12px;font-weight:700">H</text>
  <line x1="409" y1="186" x2="382" y2="186" style="stroke:var(--fig-ink);stroke-width:3"/>
  <circle cx="382" cy="186" r="16" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.6"/>
  <circle cx="409" cy="186" r="9" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6"/>
  <text x="382" y="191" text-anchor="middle" class="matter-1-imf-types-l" style="font-size:13px;font-weight:700">Cl</text>
  <text x="409" y="190.5" text-anchor="middle" class="matter-1-imf-types-l" style="font-size:12px;font-weight:700">H</text>
