" style="fill:var(--fig-red)"/>  <text x="89.0" y="118.0" class="mech-2-otto-cycle-lbl" style="fill:var(--fig-red);font-weight:600">Q<tspan dy="4" style="font-size:11px">H</tspan><tspan dy="-4"></tspan> 흡수</text>  <line x1="390.0" y1="284.0" x2="436.0" y2="284.0" style="stroke:var(--fig-blue);stroke-width:3"/><path d="M436.0 284.0 L426.0 289.0 L426.0 279.0 Z" style="fill:var(--fig-blue)"/>  <text x="388.0" y="272.0" class="mech-2-otto-cycle-lbl" style="fill:var(--fig-blue);font-weight:600">Q<tspan dy="4" style="font-size:11px">L</tspan><tspan dy="-4"></tspan> 방출</text>  <text x="237.5" y="247.6" text-anchor="middle" class="mech-2-otto-cycle-lbl" style="fill:var(--fig-green);font-weight:600">넓이 = W</text>  <text x="155.0" y="328" text-anchor="middle" class="mech-2-otto-cycle-sm">최소 부피</text><text x="380.0" y="328" text-anchor="middle" class="mech-2-otto-cycle-sm">최대 부피</text>  <line x1="155.0" y1="193.3" x2="155.0" y2="310" style="stroke:var(--fig-line);stroke-dasharray:3 3;stroke-width:1"/><line x1="380.0" y1="296.7" x2="380.0" y2="310" style="stroke:var(--fig-line);stroke-dasharray:3 3;stroke-width:1"/>  <text x="452" y="50" class="mech-2-otto-cycle-lbl" style="font-weight:600">4행정을 열역학 과정으로 보면</text>  <rect x="452" y="61" width="14" height="14" rx="3" style="fill:var(--fig-blue)"/><text x="474" y="74" class="mech-2-otto-cycle-lbl">1→2 압축 행정</text><text x="474" y="93" class="mech-2-otto-cycle-sm">단열 압축: 온도 상승</text>  <rect x="452" y="113" width="14" height="14" rx="3" style="fill:var(--fig-amber)"/><text x="474" y="126" class="mech-2-otto-cycle-lbl">2→3 점화</text><text x="474" y="145" class="mech-2-otto-cycle-sm">등적 가열: 열 Q<tspan dy="4" style="font-size:11px">H</tspan><tspan dy="-4"></tspan>가 들어옴</text>  <rect x="452" y="165" width="14" height="14" rx="3" style="fill:var(--fig-red)"/><text x="474" y="178" class="mech-2-otto-cycle-lbl">3→4 폭발 행정</text><text x="474" y="197" class="mech-2-otto-cycle-sm">단열 팽창: 피스톤에 큰 일</text>  <rect x="452" y="217" width="14" height="14" rx="3" style="fill:var(--fig-teal)"/><text x="474" y="230" class="mech-2-otto-cycle-lbl">4→1 배기</text><text x="474" y="249" class="mech-2-otto-cycle-sm">열 Q<tspan dy="4" style="font-size:11px">L</tspan><tspan dy="-4"></tspan>을 바깥으로 버림</text>  <text x="452" y="286" class="mech-2-otto-cycle-sm">한 순환: ΔU = 0, W = Q<tspan dy="4" style="font-size:11px">H</tspan><tspan dy="-4"></tspan> − Q<tspan dy="4" style="font-size:11px">L</tspan><tspan dy="-4"></tspan></text>  <text x="452" y="306" class="mech-2-otto-cycle-sm">흡입 행정(공기·연료 들이기)은 생략</text>
</svg>
