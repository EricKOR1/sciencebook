<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-mech-2-otto-cycle d-mech-2-otto-cycle">
  <title id="t-mech-2-otto-cycle">그림 역학과 에너지 2-6 가솔린 기관의 순환 과정(모식도)</title>
  <desc id="d-mech-2-otto-cycle">가솔린 기관의 압축 행정은 단열 압축, 점화는 등적 가열, 폭발 행정은 단열 팽창, 배기는 열 방출에 가깝다. P–V 그래프에서 순환 경로가 둘러싼 넓이가 한 순환 동안 기체가 한 일 W = Q_H − Q_L이다.</desc>
  <style>
    .mech-2-otto-cycle-lbl{font-size:14px;fill:var(--fig-ink)} .mech-2-otto-cycle-sm{font-size:13px;fill:var(--fig-muted)} .mech-2-otto-cycle-ink{fill:var(--fig-ink)}
  </style>
  
