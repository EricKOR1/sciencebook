  <desc id="d-m1-04-heat-in-out">입자 사이가 멀어지는 쪽(고체 → 액체 → 기체)으로 상태가 변할 때는 열에너지를 흡수하고(빨간 화살표), 입자 사이가 가까워지는 쪽으로 변할 때는 열에너지를 방출한다(파란 화살표).</desc>
