    .hio-in{fill:none;stroke:var(--fig-red);stroke-width:2.6;stroke-linecap:round}
    .hio-inh{fill:var(--fig-red)}
    .hio-out{fill:none;stroke:var(--fig-blue);stroke-width:2.6;stroke-linecap:round}
    .hio-outh{fill:var(--fig-blue)}
    .hio-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .hio-ri{font-size:14px;font-weight:700;fill:var(--fig-red)}
    .hio-bo{font-size:14px;font-weight:700;fill:var(--fig-blue)}
    .hio-sm{font-size:13px;fill:var(--fig-muted)}
