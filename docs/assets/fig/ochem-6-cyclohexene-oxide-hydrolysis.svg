<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="t-ochem-6-cyclohexene-oxide-hydrolysis d-ochem-6-cyclohexene-oxide-hydrolysis">
  <title id="t-ochem-6-cyclohexene-oxide-hydrolysis">그림 유기화학 6-16 사이클로헥센 옥사이드의 산 촉매 가수 분해 입체화학</title>
  <desc id="d-ochem-6-cyclohexene-oxide-hydrolysis">위: 양성자화된 사이클로헥센 옥사이드(O–H⁺가 위쪽 면, 쐐기). 경로 a는 H₂O의 O 전자쌍이 C1을 아래쪽(뒤쪽)에서 공격하고 C1–O⁺ 결합 전자쌍이 O로 간다. 경로 b는 같은 꼴로 C2를 공격한다. 가운데: 각 경로의 첫 생성물은 새 OH와 원래 O의 OH가 각각 아래·위로 축 방향인 트랜스 이축 형태이고(H₃O⁺ 재생은 양성자 전달로), 고리가 뒤집혀 이적도 형태가 된다. 아래: 두 경로의 생성물은 거울상 관계인 (1R,2R)-사이클로헥세인-1,2-다이올과 (1S,2S)-다이올이며 같은 양 생겨 라세미가 된다. cis-다이올은 생기지 않는다.</desc>
