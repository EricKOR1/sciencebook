<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="t-ochem-2-chair-drawing d-ochem-2-chair-drawing">
  <title id="t-ochem-2-chair-drawing">그림 유기화학 2-13 의자 형태를 그리는 순서</title>
  <desc id="d-ochem-2-chair-drawing">1단계: 기울기가 같은 평행선 두 개(C2–C3, C5–C6). 2단계: 위로 솟은 꼭짓점 C1(등받이)과 아래로 처진 C4(발판)를 이어 육각형을 닫는다. 맞은편 변끼리 평행하다(같은 색). 3단계: 축 결합 6개를 수직으로, 위(파랑)·아래(빨강)를 번갈아 긋는다(C1·C3·C5 위, C2·C4·C6 아래). 4단계: 적도 결합 6개를 한 칸 건너 고리 결합과 평행하게(같은 색 표시) 바깥쪽으로 긋는다. 완성도에는 탄소마다 축과 적도의 위·아래를 적었다. 오른쪽 아래는 흔한 실수 두 가지(적도 결합을 수평으로, 축 결합을 비스듬히)이다.</desc>
