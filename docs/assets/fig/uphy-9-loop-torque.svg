<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-uphy-9-loop-torque d-uphy-9-loop-torque">
  <title id="t-uphy-9-loop-torque">그림 일반물리학 9-4 균일한 자기장 속 직사각형 전류 고리가 받는 토크</title>
  <desc id="d-uphy-9-loop-torque">(가) 고리 면이 자기장 B와 나란할 때(θ = 90°): B와 나란한 위아래 변(길이 a)은 힘을 받지 않고, 길이 b인 두 옆 변은 크기 IbB인 힘을 종이 면 안쪽(⊗)과 바깥쪽(⊙)으로 반대로 받아 세로축을 중심으로 돈다. (나) 위에서 내려다본 모습: 두 옆 변(⊙, ⊗)이 받는 힘은 크기가 같고 방향이 반대이며 작용선이 a sin θ만큼 떨어져 있어 토크 τ = IabB sin θ가 생긴다. 고리는 법선(자기 쌍극자 모멘트 μ)이 B와 나란해지는 쪽으로 돈다. 모식도이다.</desc>
  <style>.uphy-9-loop-torque-t{font-size:14px;fill:var(--fig-ink)} .uphy-9-loop-torque-b{font-size:14px;fill:var(--fig-ink);font-weight:700} .uphy-9-loop-torque-s{font-size:13px;fill:var(--fig-muted)} .uphy-9-loop-torque-ax{stroke:var(--fig-ink);stroke-width:1.5;fill:none} .uphy-9-loop-torque-grid{stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4;fill:none}</style>
  <rect x="8" y="8" width="344" height="364" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1"/>
  <rect x="368" y="8" width="344" height="364" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1"/>
  <text x="24" y="32" class="uphy-9-loop-torque-b">(가) 정면: θ = 90°</text>
  <text x="384" y="32" class="uphy-9-loop-torque-b">(나) 위에서 본 모습</text>
  <line x1="24" y1="60" x2="328" y2="60" style="stroke:var(--fig-blue);stroke-width:1.6"/>
