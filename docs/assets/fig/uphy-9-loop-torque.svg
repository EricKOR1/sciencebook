  <path d="M587.5 313.2 L582.5 302.2 L592.4 302.2 Z" style="fill:var(--fig-red)"/>
  <circle cx="472.5" cy="146.8" r="10" style="fill:var(--fig-paper);stroke:var(--fig-accent);stroke-width:1.8"/>
