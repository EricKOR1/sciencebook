  <path d="M581.5 237.2 L593.5 249.2 M581.5 249.2 L593.5 237.2" style="stroke:var(--fig-accent);stroke-width:1.8;fill:none"/>
  <text x="464.5" y="90.8" text-anchor="end" class="uphy-9-loop-torque-t" style="fill:var(--fig-red)">IbB</text>
  <text x="595.5" y="307.2" class="uphy-9-loop-torque-t" style="fill:var(--fig-red)">IbB</text>
  <line x1="472.5" y1="160.8" x2="472.5" y2="306" style="stroke:var(--fig-muted);stroke-width:1;stroke-dasharray:3 3"/>
  <line x1="587.5" y1="317.2" x2="587.5" y2="306" style="stroke:var(--fig-muted);stroke-width:1;stroke-dasharray:3 3"/>
  <line x1="530" y1="300" x2="479.5" y2="300" style="stroke:var(--fig-ink);stroke-width:1.3"/>
  <path d="M472.5 300 L480.5 296.4 L480.5 303.6 Z" style="fill:var(--fig-ink)"/>
  <line x1="530" y1="300" x2="580.5" y2="300" style="stroke:var(--fig-ink);stroke-width:1.3"/>
  <path d="M587.5 300 L579.5 303.6 L579.5 296.4 Z" style="fill:var(--fig-ink)"/>
  <text x="530" y="294" text-anchor="middle" class="uphy-9-loop-torque-s">a sin θ</text>
  <text x="384" y="352" class="uphy-9-loop-torque-s">τ = IbB · a sin θ = IAB sin θ, 회전은 μ가 B 쪽으로</text>
</svg>
