  <rect x="100" y="100" width="160" height="190" style="fill:none;stroke:var(--fig-accent);stroke-width:3"/>
  <path d="M100 189 L105.8 202 L94.2 202 Z" style="fill:var(--fig-accent)"/>
  <path d="M186 100 L173 105.8 L173 94.2 Z" style="fill:var(--fig-accent)"/>
  <path d="M260 201 L254.2 188 L265.9 188 Z" style="fill:var(--fig-accent)"/>
  <path d="M174 290 L187 284.1 L187 295.9 Z" style="fill:var(--fig-accent)"/>
  <text x="180" y="90" text-anchor="middle" class="uphy-9-loop-torque-s">a (B와 나란함 → 힘 0)</text>
  <text x="90" y="130" text-anchor="end" class="uphy-9-loop-torque-s">b</text>
  <text x="92" y="235" text-anchor="end" class="uphy-9-loop-torque-b" style="fill:var(--fig-accent)">I</text>
  <line x1="180" y1="98" x2="180" y2="308" style="stroke:var(--fig-muted);stroke-width:1.2;stroke-dasharray:6 4"/>
  <text x="186" y="310" class="uphy-9-loop-torque-s">회전축</text>
  <circle cx="66" cy="195" r="11" style="fill:var(--fig-paper);stroke:var(--fig-red);stroke-width:1.8"/>
  <path d="M59.4 188.4 L72.6 201.6 M59.4 201.6 L72.6 188.4" style="stroke:var(--fig-red);stroke-width:1.8;fill:none"/>
  <circle cx="294" cy="195" r="11" style="fill:var(--fig-paper);stroke:var(--fig-red);stroke-width:1.8"/>
  <circle cx="294" cy="195" r="3.3" style="fill:var(--fig-red)"/>
  <text x="66" y="225" text-anchor="middle" class="uphy-9-loop-torque-s" style="fill:var(--fig-red)">F 안쪽</text>
  <text x="294" y="225" text-anchor="middle" class="uphy-9-loop-torque-s" style="fill:var(--fig-red)">F 바깥쪽</text>
  <text x="294" y="243" text-anchor="middle" class="uphy-9-loop-torque-s">(IbB)</text>
