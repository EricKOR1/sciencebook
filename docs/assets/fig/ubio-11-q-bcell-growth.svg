<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-ubio-11-q-bcell-growth d-ubio-11-q-bcell-growth">
  <title id="t-ubio-11-q-bcell-growth">그림 일반생명과학 11-16 문제 17 해설 — 1차 반응과 2차 반응의 세포 수 증가</title>
  <desc id="d-ubio-11-q-bcell-growth">세로축은 로그 눈금이다. 12시간마다 두 배가 되면 하루에 4배씩 늘어 로그 그래프에서 직선이 된다(연속 근사). 처음 100개에서 출발한 1차 반응은 검출 문턱 10⁵개에 약 5일 만에, 기억 세포 10⁴개에서 출발한 2차 반응은 약 1.7일 만에 닿는다.</desc>
