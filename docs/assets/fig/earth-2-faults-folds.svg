    .earth-2-faults-folds-grat{fill:none;stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3;opacity:0.7}
    .earth-2-faults-folds-frame{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .earth-2-faults-folds-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
