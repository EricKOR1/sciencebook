<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-labelledby="t-earth-2-faults-folds d-earth-2-faults-folds">
  <title id="t-earth-2-faults-folds">그림 지구과학 2-8 단층과 습곡</title>
  <desc id="d-earth-2-faults-folds">정단층은 장력을 받아 상반이 단층면을 따라 아래로 내려가고, 역단층은 횡압력을 받아 상반이 위로 올라간다. 주향 이동 단층은 땅이 수평 방향으로 엇갈려 하천 같은 지형이 어긋난다. 습곡은 횡압력으로 지층이 휘어 위로 볼록한 배사와 아래로 오목한 향사를 이룬다. 모식도이다.</desc>
