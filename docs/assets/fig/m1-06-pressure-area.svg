<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-m1-06-pressure-area d-m1-06-pressure-area">
  <title id="t-m1-06-pressure-area">그림 중1-6-1 같은 힘, 다른 넓이 — 압력 비교</title>
  <desc id="d-m1-06-pressure-area">무게가 같은 벽돌 두 개를 스펀지 위에 놓았다. 바닥을 누르는 힘은 같지만, 좁은 면이 닿게 세운 벽돌은 힘을 받는 면적이 좁아 압력이 크므로 스펀지가 더 깊이 들어간다. 모식도이다.</desc>
  <style>
    .pa-red{fill:none;stroke:var(--fig-red)} .pa-redh{fill:var(--fig-red)}
    .pa-blue{fill:none;stroke:var(--fig-blue)} .pa-blueh{fill:var(--fig-blue)}
    .pa-green{fill:none;stroke:var(--fig-green)} .pa-greenh{fill:var(--fig-green)}
    .pa-ink{fill:none;stroke:var(--fig-ink)} .pa-inkh{fill:var(--fig-ink)}
    .pa-violet{fill:none;stroke:var(--fig-violet)} .pa-violeth{fill:var(--fig-violet)}
    .pa-muted{fill:none;stroke:var(--fig-muted)} .pa-mutedh{fill:var(--fig-muted)}
    .pa-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .pa-t{font-size:14px;fill:var(--fig-ink)}
    .pa-sm{font-size:13px;fill:var(--fig-muted)}
    .pa-rb{font-size:14px;font-weight:700;fill:var(--fig-red)}
    .pa-bb{font-size:14px;font-weight:700;fill:var(--fig-blue)}
    .pa-ld{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .pa-brick{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2}
    .pa-sponge{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.8}
    .pa-hole{fill:var(--fig-amber);stroke:none;opacity:.35}
  </style>
  <text x="180" y="294" text-anchor="middle" class="pa-h">넓은 면이 닿게 눕힘</text>
