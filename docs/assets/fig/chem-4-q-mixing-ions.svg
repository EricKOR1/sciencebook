  <title id="t-chem-4-q-mixing-ions">그림 화학 4-8 문제 6의 두 용액(이온 모형)</title>
  <desc id="d-chem-4-q-mixing-ions">(가)는 0.10 M 염산 20 mL, (나)는 0.10 M 수산화 나트륨 수용액 30 mL 속 이온을 나타낸 것이며, 두 용액을 모두 섞은 것이 (다)이다. 이온 1개는 1.0 mmol을 나타내고, 물 분자는 나타내지 않았다.</desc>
