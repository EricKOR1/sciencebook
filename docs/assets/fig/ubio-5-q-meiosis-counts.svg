  <title id="t-ubio-5-q-meiosis-counts">그림 일반생명과학 5-10 예제 2 풀이: 2n = 6인 세포의 중기 Ⅰ과 중기 Ⅱ</title>
  <desc id="d-ubio-5-q-meiosis-counts">왼쪽 중기 Ⅰ 세포에는 상동 염색체 쌍(2가 염색체) 3개가 적도면에 늘어서 있어 염색체 6개, 염색 분체 12개이다. 오른쪽 중기 Ⅱ 세포에는 염색 분체 2개짜리 염색체 3개가 하나씩 늘어서 있어 염색체 3개, 염색 분체 6개이다. 파랑과 빨강은 서로 다른 부모에게서 받은 상동 염색체이다.</desc>
