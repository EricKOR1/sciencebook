<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-ubio-4-gpcr-camp d-ubio-4-gpcr-camp">
  <title id="t-ubio-4-gpcr-camp">그림 일반생명과학 4-1 G 단백질 연결 수용체 경로</title>
  <desc id="d-ubio-4-gpcr-camp">에피네프린이 세포막의 G 단백질 연결 수용체에 붙으면 G 단백질 α 소단위체가 GDP를 GTP로 바꾸어 켜지고, 아데닐산 고리화 효소를 활성화한다. 효소가 ATP로 cAMP를 많이 만들고, cAMP가 PKA를 켜 인산화 연쇄로 글리코젠이 분해된다. α의 GTP 가수 분해와 PDE의 cAMP 분해가 신호를 끈다.</desc>
