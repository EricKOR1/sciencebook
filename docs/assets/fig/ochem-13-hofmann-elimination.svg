<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" role="img" aria-labelledby="t-ochem-13-hofmann-elimination d-ochem-13-hofmann-elimination">
  <title id="t-ochem-13-hofmann-elimination">그림 유기화학 13-10 호프만 제거의 위치 선택성</title>
  <desc id="d-ochem-13-hofmann-elimination">(뷰탄-2-일)트라이메틸암모늄 이온의 뉴먼 투영식 두 개. 왼쪽: C1–C2 축(앞 C1, 뒤 C2). C1의 H 하나가 N⁺Me₃와 안티이고 방해가 없어, HO⁻ 전자쌍 → H, C1–H → C1–C2 사이, C2–N → N의 화살표 셋으로 뷰트-1-엔(주생성물, 호프만)이 생긴다. 오른쪽: C3–C2 축(앞 C3, 뒤 C2). C3의 H가 N⁺Me₃와 안티인 형태에서는 C3의 CH₃가 N⁺Me₃ 옆(고슈)에 놓여 입체 방해가 생기므로 뷰트-2-엔은 소량이다. 아래: C–H가 많이 끊어지고 C–N은 조금만 늘어난 전이 상태, β 탄소에 δ−(E1cB 쪽 E2). 비교: 2-브로모뷰테인 + EtO⁻는 뷰트-2-엔이 주생성물이다.</desc>
