<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-uchem-4-particle-box d-uchem-4-particle-box">
  <title id="t-uchem-4-particle-box">그림 일반화학 4-3 1차원 상자 속 입자의 에너지 준위와 파동 함수</title>
  <desc id="d-uchem-4-particle-box">길이 L인 상자에 갇힌 입자의 처음 세 상태. 에너지 준위(가로선)의 높이는 n²에 비례하게 그렸다(E₁ : E₂ : E₃ = 1 : 4 : 9). 왼쪽은 파동 함수 ψ로, 벽에서 0이 되는 정상파이며 반파장이 n개 들어간다. 오른쪽은 확률 밀도 |ψ|²로, 마디(흰 점)에서는 입자를 발견할 확률이 0이다. 마디 수는 n − 1개이고, 가장 낮은 에너지 E₁도 0이 아니다(영점 에너지).</desc>
  <style>
    .uchem-4-particle-box-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-4-particle-box-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-4-particle-box-b{font-size:15px;fill:var(--fig-ink);font-weight:bold}
    .uchem-4-particle-box-ax{stroke:var(--fig-ink);stroke-width:1.2;fill:none}
    .uchem-4-particle-box-gr{stroke:var(--fig-line);stroke-width:0.6;fill:none;stroke-dasharray:2 3}

    .uchem-4-particle-box-wall{fill:var(--fig-soft-blue);stroke:var(--fig-accent);stroke-width:1}
    .uchem-4-particle-box-lv{stroke:var(--fig-line);stroke-width:1.2;fill:none}
    .uchem-4-particle-box-psi{stroke:var(--fig-accent);stroke-width:2.2;fill:none}
    .uchem-4-particle-box-p2{stroke:var(--fig-red);stroke-width:2;fill:var(--fig-soft-red);fill-opacity:0.7}
    .uchem-4-particle-box-nd{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.4}
  </style>
