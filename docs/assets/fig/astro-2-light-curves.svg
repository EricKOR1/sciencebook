<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-astro-2-light-curves d-astro-2-light-curves">
  <title id="t-astro-2-light-curves">그림 행성우주과학 2-7 맥동변광성, 식쌍성, 폭발 변광성의 광도곡선</title>
  <desc id="d-astro-2-light-curves">맥동변광성은 빠르게 밝아지고 천천히 어두워지는 모양이 일정한 주기로 반복된다. 식쌍성은 밝기가 일정하다가 한 별이 다른 별을 가리는 동안만 오목하게 어두워지며 깊은 식과 얕은 식이 번갈아 나타난다. 폭발 변광성은 짧은 시간에 크게 밝아진 뒤 오랫동안 서서히 어두워지고 반복되지 않는다. 세로축은 위로 갈수록 밝다(등급 숫자가 작다).</desc>
