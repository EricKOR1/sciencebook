  <rect x="280.0" y="170.0" width="56.0" height="36.0" rx="10" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="308.0" y="193.0" text-anchor="middle" class="ubio-1-condensation-t">4</text>
