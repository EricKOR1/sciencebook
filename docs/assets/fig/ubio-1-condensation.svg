  <text x="108.0" y="251.0" text-anchor="middle" class="ubio-1-condensation-s" style="font-size:11px">w</text>
  <rect x="120.0" y="170.0" width="56.0" height="36.0" rx="10" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="148.0" y="193.0" text-anchor="middle" class="ubio-1-condensation-t">2</text>
