<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-ubio-1-condensation d-ubio-1-condensation">
  <title id="t-ubio-1-condensation">그림 일반생명과학 1-5 축합(탈수 합성)과 가수 분해</title>
  <desc id="d-ubio-1-condensation">위: 한 단위체의 –OH와 다른 단위체의 –H가 물 1분자로 빠져나가며 두 단위체가 공유 결합한다(축합). 거꾸로 물 1분자를 넣으면 결합 하나가 끊어진다(가수 분해). 가운데: 단위체 n개의 사슬에는 결합이 n − 1개 있다. 아래: 다당류·단백질·핵산의 단위체와 결합 이름. 모식도이다.</desc>
  <defs><marker id="ubio-1-condensation-a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-ink)"/></marker><marker id="ubio-1-condensation-a-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-muted)"/></marker><marker id="ubio-1-condensation-a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-blue)"/></marker><marker id="ubio-1-condensation-a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-red)"/></marker><marker id="ubio-1-condensation-a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-green)"/></marker><marker id="ubio-1-condensation-a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-amber)"/></marker><marker id="ubio-1-condensation-a-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-violet)"/></marker><marker id="ubio-1-condensation-a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-teal)"/></marker><marker id="ubio-1-condensation-a-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-line)"/></marker></defs>
  <style>.ubio-1-condensation-t{font-size:14px;fill:var(--fig-ink)} .ubio-1-condensation-s{font-size:13px;fill:var(--fig-muted)} .ubio-1-condensation-b{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-1-condensation-k{font-size:13px;fill:var(--fig-ink)} .ubio-1-condensation-ink{font-size:13px;fill:var(--fig-ink);font-weight:700} .ubio-1-condensation-muted{font-size:13px;fill:var(--fig-muted);font-weight:700} .ubio-1-condensation-blue{font-size:13px;fill:var(--fig-blue);font-weight:700} .ubio-1-condensation-red{font-size:13px;fill:var(--fig-red);font-weight:700} .ubio-1-condensation-green{font-size:13px;fill:var(--fig-green);font-weight:700} .ubio-1-condensation-amber{font-size:13px;fill:var(--fig-amber);font-weight:700} .ubio-1-condensation-violet{font-size:13px;fill:var(--fig-violet);font-weight:700} .ubio-1-condensation-teal{font-size:13px;fill:var(--fig-teal);font-weight:700} .ubio-1-condensation-line{font-size:13px;fill:var(--fig-line);font-weight:700}</style>
  <rect x="30.0" y="46.0" width="64.0" height="40.0" rx="10" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="62.0" y="71.0" text-anchor="middle" class="ubio-1-condensation-t">단위체</text>
  <text x="104.0" y="72.0" text-anchor="start" class="ubio-1-condensation-red">–OH</text>
  <text x="156.0" y="72.0" text-anchor="middle" class="ubio-1-condensation-b">+</text>
  <text x="178.0" y="72.0" text-anchor="start" class="ubio-1-condensation-red">H–</text>
  <rect x="200.0" y="46.0" width="64.0" height="40.0" rx="10" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="232.0" y="71.0" text-anchor="middle" class="ubio-1-condensation-t">단위체</text>
