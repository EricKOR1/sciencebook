  <text x="348.0" y="251.0" text-anchor="middle" class="ubio-1-condensation-s" style="font-size:11px">w</text>
  <rect x="360.0" y="170.0" width="56.0" height="36.0" rx="10" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="388.0" y="193.0" text-anchor="middle" class="ubio-1-condensation-t">5</text>
  <text x="470.0" y="194.0" text-anchor="start" class="ubio-1-condensation-s">← 물(w)은 결합마다 1분자</text>
  <text x="470.0" y="250.0" text-anchor="start" class="ubio-1-condensation-s">w = H₂O</text>
  <rect x="10.0" y="284.0" width="228.0" height="104.0" rx="8" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.4"/>
  <text x="124.0" y="310.0" text-anchor="middle" class="ubio-1-condensation-b">다당류(녹말·셀룰로스)</text>
  <text x="124.0" y="340.0" text-anchor="middle" class="ubio-1-condensation-t">단위체: 단당류</text>
  <text x="124.0" y="368.0" text-anchor="middle" class="ubio-1-condensation-green">결합: 글리코사이드 결합</text>
  <rect x="246.0" y="284.0" width="228.0" height="104.0" rx="8" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.4"/>
  <text x="360.0" y="310.0" text-anchor="middle" class="ubio-1-condensation-b">단백질</text>
  <text x="360.0" y="340.0" text-anchor="middle" class="ubio-1-condensation-t">단위체: 아미노산 20종</text>
  <text x="360.0" y="368.0" text-anchor="middle" class="ubio-1-condensation-violet">결합: 펩타이드 결합</text>
  <rect x="482.0" y="284.0" width="228.0" height="104.0" rx="8" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.4"/>
  <text x="596.0" y="310.0" text-anchor="middle" class="ubio-1-condensation-b">핵산(DNA·RNA)</text>
  <text x="596.0" y="340.0" text-anchor="middle" class="ubio-1-condensation-t">단위체: 뉴클레오타이드</text>
  <text x="596.0" y="368.0" text-anchor="middle" class="ubio-1-condensation-teal">결합: 인산다이에스터 결합</text>
</svg>
