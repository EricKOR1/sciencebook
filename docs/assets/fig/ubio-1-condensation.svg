  <text x="188.0" y="251.0" text-anchor="middle" class="ubio-1-condensation-s" style="font-size:11px">w</text>
  <rect x="200.0" y="170.0" width="56.0" height="36.0" rx="10" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="228.0" y="193.0" text-anchor="middle" class="ubio-1-condensation-t">3</text>
  <line x1="256.0" y1="188.0" x2="280.0" y2="188.0" style="stroke:var(--fig-ink);stroke-width:3"/>
