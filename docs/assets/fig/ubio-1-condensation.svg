  <text x="355.0" y="50.0" text-anchor="middle" class="ubio-1-condensation-green">축합(탈수 합성)</text>
  <line x1="420.0" y1="80.0" x2="290.0" y2="80.0" style="stroke:var(--fig-amber);stroke-width:2.5" marker-end="url(#ubio-1-condensation-a-amber)"/>
  <text x="355.0" y="104.0" text-anchor="middle" class="ubio-1-condensation-amber">가수 분해</text>
  <rect x="440.0" y="46.0" width="64.0" height="40.0" rx="10" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="472.0" y="71.0" text-anchor="middle" class="ubio-1-condensation-t">단위체</text>
  <line x1="504.0" y1="66.0" x2="528.0" y2="66.0" style="stroke:var(--fig-ink);stroke-width:3"/>
  <rect x="528.0" y="46.0" width="64.0" height="40.0" rx="10" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="560.0" y="71.0" text-anchor="middle" class="ubio-1-condensation-t">단위체</text>
  <text x="610.0" y="72.0" text-anchor="start" class="ubio-1-condensation-blue">+ H₂O</text>
  <text x="355.0" y="124.0" text-anchor="middle" class="ubio-1-condensation-s">에너지 필요(세포는 활성화된 단위체 사용)  ·  가수 분해는 에너지 방출, 효소가 빠르게 함</text>
  <text x="536.0" y="36.0" text-anchor="middle" class="ubio-1-condensation-s">공유 결합</text>
  <line x1="516.0" y1="40.0" x2="516.0" y2="60.0" style="stroke:var(--fig-muted);stroke-width:1"/>
  <text x="20.0" y="158.0" text-anchor="start" class="ubio-1-condensation-k">단위체 n개의 사슬 → 결합 n − 1개 (예: n = 5이면 결합 4개, 축합 때 물 4분자가 빠짐)</text>
