<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-umath-8-harmonic-oscillator d-umath-8-harmonic-oscillator">
  <title id="t-umath-8-harmonic-oscillator">그림 수학 도구 8-6 조화 진동자의 퍼텐셜, 에너지 준위와 에르미트 함수</title>
  <desc id="d-umath-8-harmonic-oscillator">포물선 V = ½kx²와 같은 간격 ħω의 에너지 준위 E = ½, 3/2, 5/2, 7/2 ħω를 그리고, 각 준위선을 기준으로 규격화된 에르미트 함수 ψ₀~ψ₃(마디 0~3개)을 그렸다. 짧은 점선은 고전적 전환점 y = ±√(2n + 1)이고, ψ₀이 전환점 바깥으로 스며 나간 부분을 옅게 칠했다. 파동 함수의 세로 크기는 보기 좋게 맞춘 것이다.</desc>
  <style>
    .u8ho-ax{stroke:var(--fig-ink);stroke-width:1.4;fill:none}
    .u8ho-grid{stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 4;fill:none}
    .u8ho-t{font-size:14px;fill:var(--fig-ink)}
    .u8ho-s{font-size:13px;fill:var(--fig-muted)}
    .u8ho-b{font-size:14px;fill:var(--fig-ink);font-weight:600}
    .u8ho-tk{stroke:var(--fig-ink);stroke-width:1.2}
    .u8ho-c0{stroke:var(--fig-blue);stroke-width:2.3;fill:none}
    .u8ho-l0{font-size:14px;fill:var(--fig-blue);font-weight:600}
    .u8ho-c1{stroke:var(--fig-green);stroke-width:2.3;fill:none}
    .u8ho-l1{font-size:14px;fill:var(--fig-green);font-weight:600}
    .u8ho-c2{stroke:var(--fig-amber);stroke-width:2.3;fill:none}
    .u8ho-l2{font-size:14px;fill:var(--fig-amber);font-weight:600}
    .u8ho-c3{stroke:var(--fig-red);stroke-width:2.3;fill:none}
    .u8ho-l3{font-size:14px;fill:var(--fig-red);font-weight:600}
    .u8ho-pot{stroke:var(--fig-ink);stroke-width:2.2;fill:none}
    .u8ho-lev{stroke:var(--fig-muted);stroke-width:1.1;fill:none}
    .u8ho-tp{stroke:var(--fig-ink);stroke-width:1.2;stroke-dasharray:3 3;fill:none}
    .u8ho-leak{fill:var(--fig-blue);fill-opacity:0.25}
    .u8ho-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1}

  </style>
