  <title id="t-ochem-7-q-ex18-spectra">그림 유기화학 7-19 예제 18 미지 시료의 스펙트럼 네 장</title>
  <desc id="d-ochem-7-q-ex18-spectra">(가) EI 질량 스펙트럼: m/z 51(15), 77(45), 105(100), 134(25), 135(2.5). (나) IR 모식도: 3060 약함, 2980·2940 중간, 1686 매우 강함·날카로움, 1597·1449 중간, 1220 강함, 746·690 강함. (다) ¹H NMR(400 MHz): δ 7.97(2H), 7.55(1H), 7.46(2H), 3.00(2H, 사중선, J 7.2 Hz), 1.23(3H, 삼중선, J 7.2 Hz), 적분 2 : 1 : 2 : 2 : 3. (라) ¹³C NMR 넓은 띠 짝풀림 δ 200.8, 136.9, 132.9, 128.6, 128.0, 31.8, 8.3과 DEPT-135(132.9·128.6·128.0·8.3 위, 31.8 아래), 회색은 CDCl₃(77.2). 모두 예제에 주어진 값으로 그린 모식도이다.</desc>
