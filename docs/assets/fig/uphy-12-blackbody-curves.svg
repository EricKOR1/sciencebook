<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 345" role="img" aria-labelledby="t-uphy-12-blackbody-curves d-uphy-12-blackbody-curves">
  <title id="t-uphy-12-blackbody-curves">그림 일반물리학 12-5 흑체 복사 스펙트럼 — 온도에 따른 플랑크 곡선</title>
  <desc id="d-uphy-12-blackbody-curves">절대 온도 4000 K, 5000 K, 6000 K인 흑체의 파장별 복사 세기(플랑크 식)를 같은 세로 눈금으로 그렸다. 온도가 높을수록 곡선 전체가 커지고(전체 넓이 ∝ T⁴, 슈테판–볼츠만 법칙), 세기가 최대인 파장이 짧아진다(λ_max T = 2.898 × 10⁻³ m·K, 빈 법칙). 점선은 6000 K에서 고전 이론이 예측한 곡선으로, 짧은 파장에서 한없이 커지는 자외선 파탄을 보인다. 띠는 가시광선 영역(약 380~750 nm)이다.</desc>
