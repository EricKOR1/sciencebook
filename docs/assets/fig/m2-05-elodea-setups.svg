<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-m2-05-elodea-setups d-m2-05-elodea-setups">
  <title id="t-m2-05-elodea-setups">그림 중2-5-6 검정말로 광합성의 산물과 재료 확인하기</title>
  <desc id="d-m2-05-elodea-setups">(가) 탄산수소 나트륨을 녹인 물에 검정말을 넣고 깔때기와 물을 채운 시험관을 거꾸로 씌운 뒤 빛을 비추면, 검정말에서 나온 기포가 시험관 위쪽에 모인다. 이 기체에 꺼져 가는 향불을 넣으면 다시 살아나므로 산소이다. (나) 날숨을 불어 넣어 노랗게 만든 BTB 용액에 검정말을 넣고 빛을 비춘 A만 파란색 쪽으로 변한다. 검정말이 없는 B와 빛을 가린 C는 노란색 그대로이다. A에서 이산화 탄소가 광합성에 쓰여 줄었기 때문이다. 용액의 색은 실제 BTB 색에 가깝게 나타냈다.</desc>
