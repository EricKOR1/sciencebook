  <text x="186.0" y="98.0" class="m2-05-elodea-setups-s">→ 향불이 다시</text>
  <text x="186.0" y="114.0" class="m2-05-elodea-setups-s">    살아남: 산소</text>
  <text x="164.0" y="302.0" text-anchor="middle" class="m2-05-elodea-setups-s">탄산수소 나트륨 수용액</text>
  <text x="164.0" y="318.0" text-anchor="middle" class="m2-05-elodea-setups-s">(이산화 탄소를 공급한다)</text>
