  <text x="344.0" y="62.0" class="m2-05-elodea-setups-s">처음: 모두 노란색(날숨의 이산화 탄소)</text>
  <text x="344.0" y="78.0" class="m2-05-elodea-setups-s">같은 전등 아래에 함께 둔다</text>
