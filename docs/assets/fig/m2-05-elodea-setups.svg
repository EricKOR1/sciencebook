    .m2-05-elodea-setups-t{font-size:14px;fill:var(--fig-ink)}
    .m2-05-elodea-setups-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .m2-05-elodea-setups-s{font-size:13px;fill:var(--fig-muted)}

  </style>
