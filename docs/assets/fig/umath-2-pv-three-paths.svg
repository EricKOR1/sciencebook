  <title id="t-umath-2-pv-three-paths">그림 수학 도구 2-6 같은 두 상태를 잇는 세 가역 경로와 일</title>
  <desc id="d-umath-2-pv-three-paths">A(6.00 L, 4.00 bar)에서 B(24.0 L, 1.00 bar)로 가는 세 경로. (가) 등온선 P = 24.0/V, (나) 등적 냉각 뒤 등압 팽창, (다) 등압 팽창 뒤 등적 냉각. 경로 아래(V축까지) 넓이가 계가 한 일의 크기 −w이고, 세 넓이는 서로 겹친다: (나) 18.0 ⊂ (가) 33.3 ⊂ (다) 72.0 L·bar. 빗금의 방향과 색으로 경로를 구별했다.</desc>
