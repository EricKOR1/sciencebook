  <text x="195.0" y="272.0" text-anchor="middle" class="ubio-11-starling-t">25 mmHg</text>
  <text x="525.0" y="272.0" text-anchor="middle" class="ubio-11-starling-t">25 mmHg</text>
  <text x="360.0" y="294.0" text-anchor="middle" class="ubio-11-starling-b">알짜 압력</text>
