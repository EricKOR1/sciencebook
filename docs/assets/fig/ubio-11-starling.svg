<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t-ubio-11-starling d-ubio-11-starling">
  <title id="t-ubio-11-starling">그림 일반생명과학 11-7 모세혈관의 여과와 재흡수(스탈링 힘)</title>
  <desc id="d-ubio-11-starling">모세혈관을 따라 혈압(정수압)은 세동맥 쪽 35 mmHg에서 세정맥 쪽 15 mmHg로 떨어지지만 혈장 단백질의 교질 삼투압은 25 mmHg로 거의 일정하다. 그래서 세동맥 쪽에서는 알짜 압력 +10 mmHg로 액체가 밖으로 여과되고, 세정맥 쪽에서는 −10 mmHg로 다시 안으로 재흡수된다. 남은 액체는 림프관이 모아 정맥으로 돌려보낸다. 예시 값의 모식도이다.</desc>
  <style>.ubio-11-starling-t{font-size:14px;fill:var(--fig-ink)} .ubio-11-starling-b{font-size:14px;fill:var(--fig-ink);font-weight:700} .ubio-11-starling-s{font-size:13px;fill:var(--fig-muted)} .ubio-11-starling-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-11-starling-lead{stroke:var(--fig-muted);stroke-width:1;fill:none}</style>
