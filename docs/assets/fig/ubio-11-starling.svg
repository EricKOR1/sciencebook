  <text x="630.0" y="208.0" class="ubio-11-starling-t">림프관</text>
  <text x="630.0" y="226.0" class="ubio-11-starling-s">남은 액체 회수</text>
  <text x="195.0" y="226.0" text-anchor="middle" class="ubio-11-starling-s">세동맥 쪽</text>
  <text x="525.0" y="226.0" text-anchor="middle" class="ubio-11-starling-s">세정맥 쪽</text>
  <text x="360.0" y="312.0" text-anchor="middle" class="ubio-11-starling-s">간질액의 압력은 무시한 예시 값 · 모식도</text>
