<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uchem-3-bomb-calorimeter d-uchem-3-bomb-calorimeter">
  <title id="t-uchem-3-bomb-calorimeter">그림 일반화학 3-3 통 열량계(봄베 열량계)의 단면</title>
  <desc id="d-uchem-3-bomb-calorimeter">두꺼운 강철 통 속에서 고압 산소와 함께 시료를 전기로 점화한다. 통은 부피가 변하지 않으므로 w = 0이고, 반응열은 둘러싼 물과 통 전체의 온도를 올린다. 측정하는 열은 q_V = ΔU이다(모식도).</desc>
  <style>
    .uchem-3-bc-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-3-bc-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-3-bc-h{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .uchem-3-bc-lead{stroke:var(--fig-muted);stroke-width:1.2;fill:none}
    .uchem-3-bc-wire{stroke:var(--fig-amber);stroke-width:2;fill:none}
  </style>
  <!-- 단열 외통 -->
  <rect x="60" y="70" width="330" height="300" rx="14" style="fill:var(--fig-soft-amber);stroke:var(--fig-ink);stroke-width:2"/>
  <!-- 물통 -->
  <rect x="84" y="100" width="282" height="248" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.8"/>
  <rect x="86" y="126" width="278" height="220" rx="6" style="fill:var(--fig-soft-blue)"/>
  <!-- 강철 통(봄베) -->
  <rect x="166" y="170" width="118" height="156" rx="12" style="fill:var(--fig-line);stroke:var(--fig-ink);stroke-width:2"/>
  <rect x="180" y="184" width="90" height="128" rx="8" style="fill:var(--fig-soft-green);stroke:var(--fig-ink);stroke-width:1.2"/>
  <text x="225" y="208" text-anchor="middle" class="uchem-3-bc-s">O₂ 약 30 atm</text>
  <!-- 시료 접시와 점화선 -->
  <path d="M206 284 h38 l-6 14 h-26 z" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5"/>
  <circle cx="225" cy="280" r="6" style="fill:var(--fig-ink)"/>
  <path d="M196 150 V270 Q196 280 214 278 M254 150 V270 Q254 280 236 278" class="uchem-3-bc-wire"/>
  <!-- 뚜껑·밸브 -->
  <rect x="160" y="160" width="130" height="14" rx="4" style="fill:var(--fig-muted);stroke:var(--fig-ink);stroke-width:1.2"/>
  <rect x="216" y="146" width="18" height="16" rx="2" style="fill:var(--fig-muted);stroke:var(--fig-ink);stroke-width:1.2"/>
  <!-- 점화 전원선 -->
  <path d="M196 150 V60 H150 M254 150 V54" class="uchem-3-bc-wire"/>
  <!-- 젓개 -->
  <line x1="122" y1="40" x2="122" y2="300" style="stroke:var(--fig-ink);stroke-width:3"/>
  <path d="M106 300 h32 M106 312 h32" style="stroke:var(--fig-ink);stroke-width:3"/>
  <!-- 온도계 -->
  <rect x="320" y="30" width="12" height="270" rx="6" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.5"/>
  <rect x="323" y="150" width="6" height="146" style="fill:var(--fig-red)"/>
  <circle cx="326" cy="300" r="10" style="fill:var(--fig-red);stroke:var(--fig-ink);stroke-width:1.5"/>
  <!-- 이름표 -->
  <line x1="332" y1="60" x2="420" y2="60" class="uchem-3-bc-lead"/><text x="426" y="65" class="uchem-3-bc-t">온도계(0.001 K까지)</text>
  <text x="68" y="30" class="uchem-3-bc-t">젓개</text>
  <text x="140" y="46" class="uchem-3-bc-s">점화 전원</text>
  <line x1="364" y1="140" x2="420" y2="122" class="uchem-3-bc-lead"/><text x="426" y="127" class="uchem-3-bc-t">정해진 양의 물</text>
  <line x1="284" y1="230" x2="420" y2="186" class="uchem-3-bc-lead"/><text x="426" y="191" class="uchem-3-bc-t">강철 통(봄베): 부피 일정</text>
  <line x1="246" y1="290" x2="420" y2="244" class="uchem-3-bc-lead"/><text x="426" y="249" class="uchem-3-bc-t">시료와 점화선</text>
  <line x1="390" y1="320" x2="420" y2="306" class="uchem-3-bc-lead"/><text x="426" y="311" class="uchem-3-bc-t">단열 외통</text>
  <!-- 요약 -->
  <rect x="420" y="328" width="290" height="62" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1"/>
  <text x="434" y="352" class="uchem-3-bc-h">부피 일정 → w = 0 → q<tspan style="font-size:12px" dy="4">V</tspan><tspan dy="-4"> = ΔU</tspan></text>
  <text x="434" y="378" class="uchem-3-bc-t">q<tspan style="font-size:12px" dy="4">반응</tspan><tspan dy="-4"> = −C</tspan><tspan style="font-size:12px" dy="4">열량계</tspan><tspan dy="-4"> × ΔT</tspan></text>
</svg>
