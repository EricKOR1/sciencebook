<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t-bio-2-q-loewi-hearts d-bio-2-q-loewi-hearts">
  <title id="t-bio-2-q-loewi-hearts">그림 생명과학 2-14 문제 15의 개구리 심장 실험</title>
  <desc id="d-bio-2-q-loewi-hearts">부교감 신경이 연결된 심장 Ⅰ과 신경을 모두 제거한 심장 Ⅱ를 각각 생리 식염수에 넣고, 심장 Ⅰ의 신경을 자극한 뒤 심장 Ⅰ의 용액을 심장 Ⅱ의 용기로 옮긴다.</desc>
  <style>.bio-2-q-loewi-hearts-t{font-size:14px;fill:var(--fig-ink)} .bio-2-q-loewi-hearts-s{font-size:13px;fill:var(--fig-muted)} .bio-2-q-loewi-hearts-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .bio-2-q-loewi-hearts-ax{stroke:var(--fig-ink);stroke-width:1.4;fill:none} .bio-2-q-loewi-hearts-grid{stroke:var(--fig-line);stroke-width:0.7;stroke-dasharray:3 3;fill:none}</style>
  <rect x="90" y="130" width="160" height="80" rx="6" style="fill:var(--fig-soft-blue);stroke:none"/>
