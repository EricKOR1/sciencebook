  <text x="72.0" y="51.0" text-anchor="middle" class="bio-2-q-loewi-hearts-s">자극기</text>
  <text x="142.0" y="74.0" class="bio-2-q-loewi-hearts-t">부교감 신경</text>
  <path d="M236 104 C290 30 410 30 464 102" style="fill:none;stroke:var(--fig-green);stroke-width:2.2;stroke-dasharray:6 4"/>
