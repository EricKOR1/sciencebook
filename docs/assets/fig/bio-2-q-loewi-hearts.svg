  <path d="M444 92 L450 98 L450 204 Q450 210 456 210 L604 210 Q610 210 610 204 L610 98 L616 92" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/>
  <path d="M530 200 C516 190 500 176 502 162 C504 148 522 146 530 158 C538 146 556 148 558 162 C560 176 544 190 530 200 Z" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
  <text x="530.0" y="236.0" text-anchor="middle" class="bio-2-q-loewi-hearts-h">심장 Ⅱ</text>
  <text x="350.0" y="200.0" text-anchor="middle" class="bio-2-q-loewi-hearts-s">생리 식염수</text>
