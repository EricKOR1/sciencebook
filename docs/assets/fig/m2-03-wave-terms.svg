<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t-m2-03-wave-terms d-m2-03-wave-terms">
  <title id="t-m2-03-wave-terms">그림 중2-3-9 파동을 나타내는 말 — 마루, 골, 진폭, 파장</title>
  <desc id="d-m2-03-wave-terms">진동의 중심선에서 가장 높은 곳이 마루, 가장 낮은 곳이 골이다. 진폭은 중심선에서 마루(또는 골)까지의 높이이고, 마루에서 골까지의 높이는 진폭의 2배이다. 파장은 이웃한 마루와 마루, 또는 골과 골 사이의 거리이다.</desc>
