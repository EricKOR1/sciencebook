<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-uchem-9-buffer-particles d-uchem-9-buffer-particles">
  <title id="t-uchem-9-buffer-particles">그림 일반화학 9-2 완충 용액이 강산·강염기를 흡수하는 방법</title>
  <desc id="d-uchem-9-buffer-particles">아세트산(HA)과 아세트산 이온(A⁻)이 같은 양 든 완충 용액의 입자 모형이다. 강산의 H₃O⁺는 A⁻와 반응해 HA가 되고, 강염기의 OH⁻는 HA와 반응해 A⁻가 된다. 넣은 이온이 ‘흡수’되고 A⁻/HA 비만 조금 변하므로 pH 변화가 작다. 물에 넣은 H₃O⁺는 그대로 남아 pH가 크게 변한다. 모식도이다.</desc>
