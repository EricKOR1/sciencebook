  <path d="M508,256 A7,7 0 0,1 522,256 Z" style="fill:var(--fig-violet)"/>
  <path d="M538,256 L552,256 L545,245 Z" style="fill:var(--fig-violet)"/>
  <path d="M568,256 A7,7 0 0,1 582,256 Z" style="fill:var(--fig-violet)"/>
  <text x="602.0" y="260.0" class="uearth-8-station-model-t">폐색 전선</text>
  <line x1="470.0" y1="288.0" x2="500.0" y2="288.0" style="fill:none;stroke:var(--fig-blue);stroke-width:2.6"/>
  <line x1="500.0" y1="288.0" x2="530.0" y2="288.0" style="fill:none;stroke:var(--fig-red);stroke-width:2.6"/>
  <line x1="530.0" y1="288.0" x2="560.0" y2="288.0" style="fill:none;stroke:var(--fig-blue);stroke-width:2.6"/>
  <line x1="560.0" y1="288.0" x2="590.0" y2="288.0" style="fill:none;stroke:var(--fig-red);stroke-width:2.6"/>
  <path d="M478,288 L492,288 L485,277 Z" style="fill:var(--fig-blue)"/>
  <path d="M508,288 A7,7 0 0,0 522,288 Z" style="fill:var(--fig-red)"/>
  <path d="M538,288 L552,288 L545,277 Z" style="fill:var(--fig-blue)"/>
  <path d="M568,288 A7,7 0 0,0 582,288 Z" style="fill:var(--fig-red)"/>
  <text x="602.0" y="292.0" class="uearth-8-station-model-t">정체 전선</text>
  <text x="470.0" y="320.0" class="uearth-8-station-model-s">기호가 향하는 쪽으로 이동</text>
</svg>
