<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-uphy-4-rolling-incline d-uphy-4-rolling-incline">
  <title id="t-uphy-4-rolling-incline">그림 일반물리학 4-6 빗면을 미끄러지지 않고 구르는 물체에 작용하는 힘</title>
  <desc id="d-uphy-4-rolling-incline">경사각 θ인 빗면 위의 원기둥에 중력 Mg(질량 중심), 수직 항력 N과 정지 마찰력 f(접촉점, 빗면 위쪽)가 작용한다. 질량 중심에 대한 토크는 f만 만들며(지레팔 R), 이 토크가 각가속도 α를 만든다. 중력의 빗면 성분 Mg sin θ가 병진 가속도의 원인이다. 화살표 길이는 속이 찬 원기둥(β = 1/2)일 때의 비율이다.</desc>
  <style>
    .uphy4rollingincline-t{font-size:14px;fill:var(--fig-ink)} .uphy4rollingincline-s{font-size:13px;fill:var(--fig-muted)}
    .uphy4rollingincline-b{font-size:15px;fill:var(--fig-ink);font-weight:600} .uphy4rollingincline-i{font-size:15px;fill:var(--fig-ink);font-style:italic}
  </style>
  <path d="M60.0 66.0 L500.0 320.0 L60.0 320.0 Z" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>
  <circle cx="283.2" cy="139.4" r="48.0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2.2"/>
  <line x1="283.2" y1="139.4" x2="266.8" y2="94.3" style="fill:none;stroke:var(--fig-blue);stroke-width:1.2;stroke-linecap:round"/>
  <circle cx="283.2" cy="139.4" r="4.5" style="fill:var(--fig-ink);stroke:none"/>
  <line x1="283.2" y1="139.4" x2="341.2" y2="172.9" style="fill:none;stroke:var(--fig-muted);stroke-width:1.8;stroke-linecap:butt;stroke-dasharray:5 4"/>
  <path d="M348.1 176.9 L338.3 175.9 L342.4 168.9 Z" style="fill:var(--fig-muted);stroke:none"/>
  <text x="354.1" y="170.9" class="uphy4rollingincline-i" style="fill:var(--fig-muted)">Mg sin θ</text>
  <line x1="283.2" y1="139.4" x2="283.2" y2="280.4" style="fill:none;stroke:var(--fig-ink);stroke-width:2.8;stroke-linecap:butt"/>
  <path d="M283.2 289.4 L278.7 279.4 L287.7 279.4 Z" style="fill:var(--fig-ink);stroke:none"/>
  <text x="275.2" y="285.4" text-anchor="end" class="uphy4rollingincline-i" style="font-weight:600">Mg</text>
  <line x1="259.2" y1="181.0" x2="343.6" y2="34.7" style="fill:none;stroke:var(--fig-blue);stroke-width:2.6;stroke-linecap:butt"/>
  <path d="M348.1 26.9 L347.0 37.8 L339.2 33.3 Z" style="fill:var(--fig-blue);stroke:none"/>
  <text x="356.1" y="30.9" class="uphy4rollingincline-i" style="fill:var(--fig-blue);font-weight:600">N</text>
  <line x1="259.2" y1="181.0" x2="244.5" y2="172.5" style="fill:none;stroke:var(--fig-red);stroke-width:3;stroke-linecap:butt"/>
  <path d="M237.5 168.5 L247.4 169.5 L243.3 176.5 Z" style="fill:var(--fig-red);stroke:none"/>
  <text x="233.5" y="188.5" text-anchor="end" class="uphy4rollingincline-i" style="fill:var(--fig-red);font-weight:600">f</text>
  <circle cx="259.2" cy="181.0" r="3.5" style="fill:var(--fig-red);stroke:none"/>
  <line x1="306.9" y1="58.4" x2="355.4" y2="86.4" style="fill:none;stroke:var(--fig-green);stroke-width:2.6;stroke-linecap:butt"/>
  <path d="M363.2 90.9 L352.2 89.8 L356.7 82.0 Z" style="fill:var(--fig-green);stroke:none"/>
  <text x="369.2" y="86.9" class="uphy4rollingincline-i" style="fill:var(--fig-green);font-weight:600">a</text>
  <path d="M229.5 108.4 L230.9 106.0 L232.5 103.7 L234.2 101.5 L235.9 99.3 L237.8 97.2 L239.7 95.2 L241.8 93.3 L243.9 91.5 L246.1 89.8 L248.4 88.1 L250.7 86.6 L253.1 85.2 L255.6 83.9 L258.1 82.7 L260.7 81.6 L263.3 80.7 L266.0 79.9 L268.7 79.1 L271.5 78.6 L274.2 78.1 L277.0 77.7 L279.8 77.5 L282.6 77.4 L285.4 77.5 L288.1 77.6 L290.9 77.9 L293.7 78.3 L296.4 78.9 L299.2 79.5 L301.8 80.3 L304.5 81.2 L307.1 82.2 L309.6 83.4 L312.1 84.6 L314.6 86.0 L317.0 87.4 L319.3 89.0 L321.5 90.7 L323.7 92.5 L325.7 94.3" style="fill:none;stroke:var(--fig-violet);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round"/>
  <path d="M330.7 99.6 L321.8 95.3 L328.0 90.1 Z" style="fill:var(--fig-violet);stroke:none"/>
  <text x="243.2" y="71.4" class="uphy4rollingincline-i" style="fill:var(--fig-violet);font-weight:600">α</text>
  <path d="M440.0 320.0 L440.0 319.0 L440.0 317.9 L440.1 316.9 L440.1 315.8 L440.2 314.8 L440.3 313.8 L440.4 312.7 L440.6 311.7 L440.7 310.6 L440.9 309.6 L441.1 308.6 L441.3 307.6 L441.5 306.5 L441.8 305.5 L442.0 304.5 L442.3 303.5 L442.6 302.5 L442.9 301.5 L443.3 300.5 L443.6 299.5 L444.0 298.5 L444.4 297.6 L444.8 296.6 L445.2 295.6 L445.6 294.7 L446.1 293.7 L446.5 292.8 L447.0 291.9 L447.5 290.9 L448.0 290.0" style="fill:none;stroke:var(--fig-ink);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round"/>
  <text x="418.0" y="310.0" class="uphy4rollingincline-i">θ</text>
  <text x="520.0" y="60.0" class="uphy4rollingincline-s">병진(빗면 아래 +)</text>
  <text x="520.0" y="82.0" class="uphy4rollingincline-i">Mg sin θ − f = Ma</text>
  <text x="520.0" y="116.0" class="uphy4rollingincline-s">회전(질량 중심 기준)</text>
  <text x="520.0" y="138.0" class="uphy4rollingincline-i">fR = I<tspan baseline-shift="sub" font-size="11">cm</tspan>α,  a = Rα</text>
  <text x="520.0" y="172.0" class="uphy4rollingincline-s">N, Mg는 질량 중심을</text>
  <text x="520.0" y="190.0" class="uphy4rollingincline-s">지나므로 토크 0</text>
  <text x="520.0" y="224.0" class="uphy4rollingincline-t" style="fill:var(--fig-violet)">→ a = g sin θ / (1 + β)</text>
</svg>
