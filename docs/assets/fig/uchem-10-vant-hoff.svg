  <text x="479.9" y="93.8" text-anchor="end" class="uchem-10-vant-hoff-s" style="fill:var(--fig-blue)">298 K: K = 5.8×10⁵</text>
  <circle cx="254.6" cy="220.3" r="4.5" style="fill:var(--fig-paper);stroke:var(--fig-blue);stroke-width:2.2"/>
  <text x="264.6" y="240.3" class="uchem-10-vant-hoff-s" style="fill:var(--fig-blue)">700 K: K = 3.2×10⁻⁴</text>
  <circle cx="202.2" cy="188.0" r="4.5" style="fill:var(--fig-paper);stroke:var(--fig-red);stroke-width:2.2"/>
  <text x="212.2" y="192.0" class="uchem-10-vant-hoff-s" style="fill:var(--fig-red)">1000 K: K = 0.12</text>
  <circle cx="181.9" cy="168.5" r="4.5" style="fill:var(--fig-paper);stroke:var(--fig-red);stroke-width:2.2"/>
  <text x="191.9" y="162.5" class="uchem-10-vant-hoff-s" style="fill:var(--fig-red)">1200 K: K = 4.2</text>
  <rect x="540.0" y="40.0" width="168.0" height="300.0" rx="8" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <line x1="554.0" y1="66.0" x2="584.0" y2="66.0" style="stroke:var(--fig-blue);stroke-width:3;stroke-linecap:round"/>
  <text x="592.0" y="71.0" class="uchem-10-vant-hoff-s" style="fill:var(--fig-ink)">N₂ + 3H₂ → 2NH₃</text>
