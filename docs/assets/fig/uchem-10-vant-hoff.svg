<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uchem-10-vant-hoff d-uchem-10-vant-hoff">
  <title id="t-uchem-10-vant-hoff">그림 일반화학 10-5 판트호프 그래프: ln K와 1/T</title>
  <desc id="d-uchem-10-vant-hoff">ΔH°와 ΔS°가 일정하면 ln K는 1/T에 대한 직선이며, 기울기는 −ΔH°/R, 1/T = 0으로 외삽한 절편은 ΔS°/R이다. 발열 반응인 암모니아 합성(ΔH° = −92.2 kJ)은 오른쪽 위로 올라가는 직선이라 온도가 높을수록(왼쪽으로 갈수록) K가 작아지고, 흡열 반응인 탄산 칼슘 분해(ΔH° = +178.3 kJ)는 오른쪽 아래로 내려가는 직선이라 온도가 높을수록 K가 커진다. 점은 본문 예제 11, 12의 값이다.</desc>
