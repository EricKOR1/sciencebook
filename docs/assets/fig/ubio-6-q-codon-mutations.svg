  <title id="t-ubio-6-q-codon-mutations">그림 일반생명과학 6-11 예제 10 풀이: 주형 가닥, mRNA, 코돈과 돌연변이 자리</title>
  <desc id="d-ubio-6-q-codon-mutations">주형 가닥(3′→5′)과 상보적·역평행인 mRNA(5′→3′)를 맞대어 적고, 첫 AUG부터 세 염기씩 묶어 아미노산을 적었다. (2)~(4)는 셋째 코돈 GAA의 첫째·셋째·둘째 염기, (5)는 둘째 코돈의 첫째 염기 U이다. 아래 줄은 (5)의 결실 뒤 읽는 틀이 한 칸 밀려 다시 묶인 코돈이다.</desc>
