  <desc id="d-m1-07-q-moon-sunset-sky">해가 진 직후 남쪽 하늘을 바라본 모습. 왼쪽이 동쪽, 오른쪽이 서쪽이다. 해는 서쪽 지평선 아래로 막 졌고, 남쪽 하늘에 오른쪽 반이 밝은 달이 떠 있다.</desc>
