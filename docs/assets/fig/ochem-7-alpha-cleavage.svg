<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-ochem-7-alpha-cleavage d-ochem-7-alpha-cleavage">
  <title id="t-ochem-7-alpha-cleavage">그림 유기화학 7-5 알코올 분자 이온의 α 절단</title>
  <desc id="d-ochem-7-alpha-cleavage">위: 펜탄-3-올의 분자 이온(산소에 홀전자와 ⊕). 낚싯바늘 화살표 세 개 — C3–C4 결합의 전자 하나와 산소의 홀전자가 C3–O 사이로 가 새 π 결합을 만들고, C3–C4 결합의 다른 전자 하나는 C4로 가서 에틸 라디칼이 된다. 생성물은 옥소늄 이온 CH₃CH₂CH=O⁺H(m/z 59, 모든 원자 옥텟)와 검출되지 않는 중성 에틸 라디칼(29). 아래: 같은 방식으로 펜탄-2-올에서 프로필 라디칼(43)이 떨어져 CH₃CH=O⁺H(m/z 45)가 생긴다.</desc>
