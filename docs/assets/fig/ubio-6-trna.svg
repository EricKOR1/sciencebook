<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-ubio-6-trna d-ubio-6-trna">
  <title id="t-ubio-6-trna">그림 일반생명과학 6-7 tRNA의 구조와 흔들림 짝짓기</title>
  <desc id="d-ubio-6-trna">왼쪽: 페닐알라닌 tRNA를 평면으로 편 클로버잎 모양. 분자 안의 상보적 부위끼리 짝지어 줄기를 이루고, 3′ 끝의 CCA에 아미노산이 붙으며, 반대쪽 고리의 안티코돈(5′-GAA-3′)이 mRNA의 코돈(5′-UUC-3′)과 역평행으로 짝짓는다. 실제 입체 구조는 L자 모양이다. 오른쪽: 코돈 셋째 염기와 안티코돈 첫째(5′) 염기 사이는 규칙이 느슨해서, 안티코돈 5′의 G는 C뿐 아니라 U와도 짝지을 수 있다. 그래서 tRNA 하나가 UUC와 UUU를 모두 읽는다. 모식도.</desc>
  <style>.ubio-6-trna-t{font-size:14px;fill:var(--fig-ink)} .ubio-6-trna-s{font-size:13px;fill:var(--fig-muted)} .ubio-6-trna-b{font-size:14px;fill:var(--fig-ink);font-weight:600} .ubio-6-trna-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-6-trna-m{font-size:13px;fill:var(--fig-ink)}</style>
