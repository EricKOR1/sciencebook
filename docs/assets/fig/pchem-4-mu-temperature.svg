<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-pchem-4-mu-temperature d-pchem-4-mu-temperature">
  <title id="t-pchem-4-mu-temperature">그림 물리화학 4-1 일정한 압력에서 화학 퍼텐셜과 온도</title>
  <desc id="d-pchem-4-mu-temperature">순물질의 고체·액체·기체의 화학 퍼텐셜 μ를 온도에 대해 그린 모식도. 세 선 모두 온도가 오르면 내려가며 기울기는 −S_m이고, 엔트로피가 큰 기체가 가장 가파르다. 각 온도에서 가장 낮은 선(굵은 실선)의 상이 안정하고 나머지(점선)는 준안정이다. 고체와 액체 선의 교점이 녹는점 T_f, 액체와 기체 선의 교점이 끓는점 T_b이다.</desc>
  <style>.pchem-4-mu-temperature-t{font-size:14px;fill:var(--fig-ink)} .pchem-4-mu-temperature-s{font-size:13px;fill:var(--fig-muted)} .pchem-4-mu-temperature-b{font-size:15px;font-weight:600;fill:var(--fig-ink)} .pchem-4-mu-temperature-i{font-size:14px;font-style:italic;fill:var(--fig-ink)} </style>
