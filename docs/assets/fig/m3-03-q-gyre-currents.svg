<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-m3-03-q-gyre-currents d-m3-03-q-gyre-currents">
  <title id="t-m3-03-q-gyre-currents">그림 중3-3-8 문제 15의 북태평양 표층 해류 (가)~(라)의 위치</title>
  <desc id="d-m3-03-q-gyre-currents">북태평양 아열대 순환을 이루는 네 해류 (가)~(라)의 위치를 지도에 나타낸 것이다. (가)와 (다)의 화살표는 문제에 주어진 흐름 방향이고, (나)와 (라)는 위치만 나타냈다. 해안선은 실제 지도이고, 해류의 위치는 대략적인 모식도이다.</desc>
  <style>.m3-03-q-gyre-currents-l{font-size:14px;fill:var(--fig-ink)} .m3-03-q-gyre-currents-s{font-size:13px;fill:var(--fig-muted)} .m3-03-q-gyre-currents-b{font-size:15px;font-weight:700;fill:var(--fig-ink)} .m3-03-q-gyre-currents-a{font-size:11px;font-weight:700} .m3-03-q-gyre-currents-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:4px;stroke-linejoin:round} </style>
