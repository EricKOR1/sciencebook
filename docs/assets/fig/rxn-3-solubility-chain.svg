<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-rxn-3-solubility-chain d-rxn-3-solubility-chain">
  <title id="t-rxn-3-solubility-chain">그림 화학 반응의 세계 3-4 알코올의 탄소 사슬 길이와 물에 녹는 정도</title>
  <desc id="d-rxn-3-solubility-chain">하이드록시기(−OH)는 물 분자와 수소 결합하는 물과 친한 부분이고, 탄소 사슬은 물과 친하지 않은 부분이다. 메탄올에서 헥산올로 사슬이 길어질수록 물과 친하지 않은 부분이 커져 물에 덜 녹는다. 수소 원자는 생략했고 크기는 모식적이다.</desc>
