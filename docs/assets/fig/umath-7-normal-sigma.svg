  <title id="t-umath-7-normal-sigma">그림 수학 도구 7-4 표준 정규 분포와 ±1σ·±2σ·±3σ 구간</title>
  <desc id="d-umath-7-normal-sigma">표준 정규 분포 p(z) = e^(−z²/2)/√(2π). 평균에서 ±1σ, ±2σ, ±3σ 구간(진한 색에서 연한 색 순)에 각각 전체의 68.3 %, 95.4 %, 99.7 %가 들어간다. 곡선의 변곡점은 z = ±1에 있다.</desc>
