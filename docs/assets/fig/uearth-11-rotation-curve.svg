<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-uearth-11-rotation-curve d-uearth-11-rotation-curve">
  <title id="t-uearth-11-rotation-curve">그림 일반지구과학 11-8 나선 은하의 회전 곡선</title>
  <desc id="d-uearth-11-rotation-curve">가로축은 은하 중심으로부터의 거리, 세로축은 회전 속도이다. 보이는 별과 기체만 있다면 바깥쪽에서는 태양계 행성처럼 v ∝ 1/√R로 속도가 줄어야 하지만(점선), 실제로 관측한 회전 속도는 바깥까지 거의 일정하다(실선). 두 곡선의 차이는 빛을 내지 않는 질량, 곧 암흑 물질이 바깥으로 갈수록 늘어난다는 뜻이다(M(R) = v²R/G). 우리은하와 비슷한 값으로 그린 모식도.</desc>
