  <text x="578.0" y="160.0" class="uearth-11-rotation-curve-n">보이지 않는 질량이</text>
  <text x="578.0" y="176.0" class="uearth-11-rotation-curve-n">계속 늘어난다</text>
  <text x="578.0" y="214.0" class="uearth-11-rotation-curve-n">보이는 물질이</text>
  <text x="578.0" y="230.0" class="uearth-11-rotation-curve-n">중심에 모여 있다면</text>
  <text x="578.0" y="246.0" class="uearth-11-rotation-curve-n">M ≈ 일정 → v ∝ 1/√R</text>
</svg>
