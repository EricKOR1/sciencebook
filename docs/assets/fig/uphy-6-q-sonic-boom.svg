  <title id="t-uphy-6-q-sonic-boom">그림 일반물리학 6-13 문제 10 해설 — 소닉 붐이 관찰자에게 닿는 순간</title>
  <desc id="d-uphy-6-q-sonic-boom">높이 6000 m에서 마하 1.5(474 m/s)로 나는 비행기의 마하 원뿔 면(반꼭지각 41.8°)이 관찰자 O에 닿는 순간, 비행기 P는 머리 위 지점 Q에서 수평으로 6.71 km 앞서 있다. 그때까지 약 14 s가 걸린다. 길이 비율대로 그렸다.</desc>
