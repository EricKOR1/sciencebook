<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-ubio-11-q-glucose-titration d-ubio-11-q-glucose-titration">
  <title id="t-ubio-11-q-glucose-titration">그림 일반생명과학 11-13 문제 8 해설 — 혈장 포도당 농도에 따른 여과·재흡수·배설</title>
  <desc id="d-ubio-11-q-glucose-titration">GFR 120 mL/min, 최대 수송량 375 mg/min인 단순 모형. 여과량은 혈장 농도에 비례(1.2 × 농도)하고, 재흡수량은 여과량과 같다가 375 mg/min에서 멈춘다. 여과량이 375가 되는 312.5 mg/dL부터 그 차이만큼 배설된다. 300 mg/dL에서는 여과량 360으로 배설 0, 500 mg/dL에서는 여과량 600, 배설 225 mg/min이다.</desc>
  <style>.ubio-11-q-glucose-titration-t{font-size:14px;fill:var(--fig-ink)} .ubio-11-q-glucose-titration-s{font-size:13px;fill:var(--fig-muted)} .ubio-11-q-glucose-titration-b{font-size:14px;fill:var(--fig-ink);font-weight:700} .ubio-11-q-glucose-titration-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-11-q-glucose-titration-r{font-size:14px;fill:var(--fig-red);font-weight:700} .ubio-11-q-glucose-titration-bl{font-size:14px;fill:var(--fig-blue);font-weight:700} .ubio-11-q-glucose-titration-g{font-size:14px;fill:var(--fig-green);font-weight:700} .ubio-11-q-glucose-titration-a{font-size:14px;fill:var(--fig-amber);font-weight:700} .ubio-11-q-glucose-titration-v{font-size:14px;fill:var(--fig-violet);font-weight:700}</style>
