<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 284" role="img" aria-labelledby="t-bio-3-mitosis d-bio-3-mitosis">
  <title id="t-bio-3-mitosis">그림 생명과학 3-4 체세포분열 과정의 염색체 행동</title>
  <desc id="d-bio-3-mitosis">2n = 4인 동물 세포의 체세포분열이다. 간기에 DNA가 복제된 뒤, 전기에 염색체가 나타나고 핵막이 사라지며, 중기에 염색체가 적도면에 배열되고, 후기에 염색 분체가 분리되어 양극으로 이동하며, 말기에 세포질이 나뉘어 모세포와 같은 염색체를 가진 딸세포 2개가 된다. 모식도.</desc>
