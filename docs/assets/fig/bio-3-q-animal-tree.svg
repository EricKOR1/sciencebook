  <title id="t-bio-3-q-animal-tree">그림 생명과학 3-12 문제 14 해설: 다섯 종의 계통수</title>
  <desc id="d-bio-3-q-animal-tree">해파리가 가장 먼저 갈라지고, 3배엽 동물은 원구가 입이 되는 지렁이·메뚜기 무리와 원구가 항문이 되는 불가사리·개구리 무리로 나뉜다. 탈피와 척삭은 각각 메뚜기와 개구리로 가는 가지에서만 얻은 특징이다.</desc>
