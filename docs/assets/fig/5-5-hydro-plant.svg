<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-5-5-hydro-plant d-5-5-hydro-plant">
  <title id="t-5-5-hydro-plant">그림 5-5-2 수력 발전소의 구조</title>
  <desc id="d-5-5-hydro-plant">댐에 가둔 물이 수압관을 따라 떨어지며 수차를 돌리고, 수차와 같은 축의 발전기가 전기를 만든다. 물의 위치 에너지가 운동 에너지를 거쳐 전기 에너지로 바뀌며, 높이 차(낙차)가 클수록 얻는 에너지가 많다. 모식도(크기 비율은 실제와 다름).</desc>
  <style>
    .hp-lbl{font-size:14px;font-weight:600;fill:var(--fig-ink)} .hp-sm{font-size:12px;fill:var(--fig-muted)} .hp-ink{fill:var(--fig-ink)}
  </style>
  <!-- 물의 순환(태양에서 온 에너지) -->
  <circle cx="44" cy="34" r="14" style="fill:var(--fig-amber)"/>
  <path d="M96,40 a12,12 0 0 1 20,-9 a15,15 0 0 1 27,4 a10,10 0 0 1 2,19 h-46 a8,8 0 0 1 -3,-14 z" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2"/>
  <path d="M106,62 l-4,10 M120,62 l-4,10 M134,62 l-4,10" style="stroke:var(--fig-blue);stroke-width:1.6"/>
  <text x="160" y="40" class="hp-sm">햇빛 → 증발 → 비 → 저수지</text>
  <text x="160" y="56" class="hp-sm">(물의 위치 에너지는 태양 에너지에서 왔다)</text>
  <!-- 땅 -->
  <rect x="0" y="290" width="720" height="18" style="fill:var(--fig-soft-amber)"/>
  <!-- 저수지 -->
  <rect x="0" y="110" width="252" height="180" style="fill:var(--fig-soft-blue)"/>
  <line x1="0" y1="110" x2="252" y2="110" style="stroke:var(--fig-blue);stroke-width:2"/>
  <text x="110" y="160" text-anchor="middle" class="hp-lbl">저수지</text>
  <text x="110" y="178" text-anchor="middle" class="hp-sm">댐에 가둔 높은 곳의 물</text>
  <!-- 댐 -->
  <path d="M250,88 L284,88 L364,290 L250,290 Z" style="fill:var(--fig-line);fill-opacity:0.45;stroke:var(--fig-ink);stroke-width:1.5"/>
  <text x="267" y="80" text-anchor="middle" class="hp-lbl">댐</text>
  <!-- 수압관 -->
  <path d="M236,206 L330,268 L414,268" style="fill:none;stroke:var(--fig-ink);stroke-width:16;stroke-linejoin:round"/>
  <path d="M236,206 L330,268 L414,268" style="fill:none;stroke:var(--fig-soft-blue);stroke-width:11;stroke-linejoin:round"/>
  <path d="M262,224 L300,249" style="stroke:var(--fig-blue);stroke-width:2"/>
  <path d="M304,252 l-11,-2 l5,-8 z" style="fill:var(--fig-blue)"/>
  <text x="250" y="262" text-anchor="end" class="hp-sm" style="fill:var(--fig-ink)">수압관</text>
  <!-- 발전소 건물 -->
  <rect x="384" y="186" width="96" height="104" rx="4" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.5"/>
  <rect x="404" y="198" width="56" height="34" rx="4" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <text x="432" y="220" text-anchor="middle" class="hp-sm" style="fill:var(--fig-ink);font-weight:600">발전기</text>
  <line x1="432" y1="232" x2="432" y2="256" style="stroke:var(--fig-ink);stroke-width:4"/>
  <circle cx="432" cy="270" r="15" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <path d="M432,256 L432,284 M418,270 L446,270 M422,260 L442,280 M442,260 L422,280" style="stroke:var(--fig-amber);stroke-width:1.6"/>
  <text x="456" y="258" class="hp-sm" style="fill:var(--fig-ink);font-weight:600">수차</text>
  <!-- 송전 -->
  <line x1="432" y1="186" x2="432" y2="150" style="stroke:var(--fig-ink);stroke-width:2"/>
  <path d="M432,142 l-5,10 l10,0 z" class="hp-ink"/>
  <text x="442" y="160" class="hp-sm" style="fill:var(--fig-ink)">전기 → 변압기·송전선</text>
  <!-- 하류 -->
  <rect x="446" y="278" width="274" height="12" style="fill:var(--fig-soft-blue)"/>
  <line x1="446" y1="278" x2="720" y2="278" style="stroke:var(--fig-blue);stroke-width:2"/>
  <path d="M600,284 l14,0" style="stroke:var(--fig-blue);stroke-width:2"/>
  <path d="M620,284 l-8,-4 l0,8 z" style="fill:var(--fig-blue)"/>
  <text x="712" y="272" text-anchor="end" class="hp-sm">강 하류로</text>
  <!-- 낙차 -->
  <line x1="252" y1="110" x2="610" y2="110" style="stroke:var(--fig-line);stroke-width:1.2;stroke-dasharray:5 4"/>
  <line x1="560" y1="116" x2="560" y2="272" style="stroke:var(--fig-ink);stroke-width:1.6"/>
  <path d="M560,110 l-5,10 l10,0 z M560,278 l-5,-10 l10,0 z" class="hp-ink"/>
  <text x="572" y="186" class="hp-lbl">낙차</text>
  <text x="572" y="204" class="hp-sm">(높이 차)</text>
  <!-- 에너지 전환 -->
  <text x="360" y="334" text-anchor="middle" class="hp-sm" style="fill:var(--fig-ink)">물의 위치 에너지 → 운동 에너지(떨어지는 물이 수차를 돌림) → 전기 에너지(발전기)</text>
</svg>
