<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-chem-2-lewis-dots d-chem-2-lewis-dots">
  <title id="t-chem-2-lewis-dots">그림 화학 2-6 원자와 분자의 루이스 전자점식</title>
  <desc id="d-chem-2-lewis-dots">위: 2주기 원소의 원자가 전자를 원소 기호의 네 방향에 하나씩 찍고, 다섯 번째부터 짝을 지운다. 짝을 이루지 않은 홀전자의 수가 보통 만드는 공유 결합의 수이다. 아래: 물, 암모니아, 이산화 탄소, 질소 분자의 전자점식에서 두 원자 사이의 공유 전자쌍(파란색)과 한 원자에만 속한 비공유 전자쌍(보라색)을 구분하였다.</desc>
