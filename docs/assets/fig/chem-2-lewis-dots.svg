    .c2ld-ink{fill:var(--fig-ink)} .c2ld-mut{fill:var(--fig-muted)}
    .c2ld-lbl{font-size:14px;fill:var(--fig-ink)} .c2ld-b{font-size:15px;font-weight:600;fill:var(--fig-ink)} .c2ld-sm{font-size:13px;fill:var(--fig-muted)}
    .c2ld-H{fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.2} .c2ld-O{fill:var(--fig-red);stroke:var(--fig-red);stroke-width:1} .c2ld-C{fill:var(--fig-ink);stroke:var(--fig-ink);stroke-width:1} .c2ld-N{fill:var(--fig-blue);stroke:var(--fig-blue);stroke-width:1}
    .c2ld-Cl{fill:var(--fig-green);stroke:var(--fig-green);stroke-width:1} .c2ld-at{font-size:13px;font-weight:600}
    .c2ld-sym{font-size:22px;font-weight:600;fill:var(--fig-ink)} .c2ld-e{fill:var(--fig-ink)} .c2ld-sh{fill:var(--fig-blue)} .c2ld-lp{fill:var(--fig-violet)} .c2ld-shb{fill:var(--fig-soft-blue);stroke:none} .c2ld-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2}
  </style>
