<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-ochem-8-kinetic-thermo-diagram d-ochem-8-kinetic-thermo-diagram">
  <title id="t-ochem-8-kinetic-thermo-diagram">그림 유기화학 8-7 1,2-첨가와 1,4-첨가의 반응 에너지 도표 — 속도론적 지배와 열역학적 지배</title>
  <desc id="d-ochem-8-kinetic-thermo-diagram">다이엔 + HBr이 양성자 첨가 전이 상태를 넘어 알릴 양이온 + Br⁻(공통 중간체)이 된다. 중간체에서 1,2-생성물로 가는 꼭대기 TS(1,2)가 1,4-생성물로 가는 TS(1,4)보다 약 2 kJ/mol 낮고(ΔΔG‡), 1,4-생성물의 골짜기는 1,2-생성물보다 약 3.6 kJ/mol 깊다(ΔG°). 낮은 온도에서는 꼭대기 높이가 비를 정해 1,2-생성물이 많고, 높은 온도에서는 생성물이 양이온으로 되돌아가 골짜기 깊이가 비를 정하므로 1,4-생성물이 많다. 높이 차는 알아보기 쉽게 과장한 모식도이다.</desc>
