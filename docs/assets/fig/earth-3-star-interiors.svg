<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 366" role="img" aria-labelledby="t-earth-3-star-interiors d-earth-3-star-interiors">
  <title id="t-earth-3-star-interiors">그림 지구과학 3-8 질량에 따른 주계열성의 내부 구조</title>
  <desc id="d-earth-3-star-interiors">태양 정도의 별은 중심핵 바깥에 복사층, 그 바깥에 대류층이 있다. 태양의 약 2배 이상인 별은 중심핵에서 대류가 일어나고 바깥은 복사층이다. 질량이 매우 작은 별은 별 전체에서 대류가 일어난다. 크기 비율은 맞추지 않은 모식도이다.</desc>
  <style>
    .earth-3-star-interiors-t{font-size:14px;fill:var(--fig-ink)}
    .earth-3-star-interiors-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .earth-3-star-interiors-s{font-size:13px;fill:var(--fig-muted)}
    .earth-3-star-interiors-land{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:0.8;fill-rule:evenodd}
    .earth-3-star-interiors-sea{fill:var(--fig-soft-blue)}
    .earth-3-star-interiors-grat{fill:none;stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3;opacity:0.7}
    .earth-3-star-interiors-frame{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .earth-3-star-interiors-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
