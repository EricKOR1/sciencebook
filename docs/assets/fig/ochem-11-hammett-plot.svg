  <title id="t-ochem-11-hammett-plot">그림 유기화학 11-4 해멧 도시</title>
  <desc id="d-ochem-11-hammett-plot">가로축은 치환기 상수 σ, 세로축은 log(Kₓ/Kₕ)이다. 벤조산 이온화(25 ℃, 물)의 일곱 점 p-OCH₃(−0.27, −0.27), p-CH₃(−0.17, −0.17), H(0, 0), p-Cl(0.23, 0.22), m-Cl(0.37, 0.37), m-NO₂(0.71, 0.75), p-NO₂(0.78, 0.76)은 기울기 1인 직선(정의상 ρ = 1.00) 위에 놓인다. 같은 σ로 벤조산 에틸의 염기성 가수 분해 속도(log kₓ/kₕ)를 그리면 기울기 약 2.5인 더 가파른 직선이 된다(ρ ≈ +2.5).</desc>
