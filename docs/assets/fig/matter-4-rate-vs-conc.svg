<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 346" role="img" aria-labelledby="t-matter-4-rate-vs-conc d-matter-4-rate-vs-conc">
  <title id="t-matter-4-rate-vs-conc">그림 물질과 에너지 4-5 반응 차수에 따른 초기 속도–농도 그래프</title>
  <desc id="d-matter-4-rate-vs-conc">초기 속도를 [A]에 대해 그리면 0차 반응은 수평선, 1차 반응은 원점을 지나는 직선, 2차 반응은 위로 휘는 곡선이 된다. 2차 반응은 [A]²에 대해 그리면 원점을 지나는 직선이 되고 그 기울기가 속도 상수이다. 값은 모양을 비교하기 위한 모식도이다.</desc>
