<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-ubio-12-embryo d-ubio-12-embryo">
  <title id="t-ubio-12-embryo">그림 일반생명과학 12-3 난할에서 낭배, 신경관 형성까지</title>
  <desc id="d-ubio-12-embryo">위: 수정란은 난할로 2, 4, 8세포를 거쳐 상실배가 되는 동안 전체 크기는 거의 그대로이고 할구만 작아진다. 안에 포배강이 생기면 포배, 표면 세포가 원구로 말려 들어가 원장과 세 배엽이 생기면 낭배이다. 아래: 척추동물 배아의 등쪽 가로 단면. 척삭 위의 외배엽이 두꺼워져 신경판이 되고, 접혀 올라가 신경관이 되며, 경계에서 신경 능선 세포가 떨어져 나온다. 척삭 양옆의 중배엽은 체절이 된다. 모식도이다.</desc>
