    .f2-4-q-ch4-nh3-dot-t{font-size:14px;fill:var(--fig-ink)} .f2-4-q-ch4-nh3-dot-sm{font-size:13px;fill:var(--fig-muted)}
    .f2-4-q-ch4-nh3-dot-lbl{font-size:15px;font-weight:600;fill:var(--fig-ink)} .f2-4-q-ch4-nh3-dot-sym{font-size:28px;font-weight:700;fill:var(--fig-ink)}
    .f2-4-q-ch4-nh3-dot-e1{fill:var(--fig-blue)} .f2-4-q-ch4-nh3-dot-e2{fill:var(--fig-red)}
    .f2-4-q-ch4-nh3-dot-sh{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5}
    .f2-4-q-ch4-nh3-dot-lp{fill:none;stroke:var(--fig-violet);stroke-width:1.5;stroke-dasharray:3 2}
    .f2-4-q-ch4-nh3-dot-ld{stroke:var(--fig-muted);stroke-width:1.1;fill:none} .f2-4-q-ch4-nh3-dot-sep{stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4}
    .f2-4-q-ch4-nh3-dot-r1{fill:none;stroke:var(--fig-blue);stroke-width:1.4;stroke-dasharray:6 4} .f2-4-q-ch4-nh3-dot-r2{fill:none;stroke:var(--fig-red);stroke-width:1.4;stroke-dasharray:6 4}
