<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 294" class="fig-small" role="img" aria-labelledby="t-2-4-q-ch4-nh3-dot d-2-4-q-ch4-nh3-dot">
  <title id="t-2-4-q-ch4-nh3-dot">그림 2-4-8 문제 11 메테인과 암모니아의 전자 점식</title>
  <desc id="d-2-4-q-ch4-nh3-dot">노란 바탕은 공유 전자쌍, 보라 점선은 비공유 전자쌍이다. 파란 점은 가운데 원자(C, N)의, 빨간 점은 수소 원자의 전자이다. 메테인은 공유 전자쌍 4개, 암모니아는 공유 전자쌍 3개와 비공유 전자쌍 1개를 가지며, 가운데 원자 주위의 전자는 모두 8개이다. 연결 관계만 나타낸 것으로 실제 분자 모양은 아니다.</desc>
