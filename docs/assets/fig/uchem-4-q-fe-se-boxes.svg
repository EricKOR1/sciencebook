  <title id="t-uchem-4-q-fe-se-boxes">그림 일반화학 4-9 예제 8의 오비탈 상자 그림</title>
  <desc id="d-uchem-4-q-fe-se-boxes">[Ar] 심부 전자는 생략하고 3d, 4s, 4p 오비탈만 상자로 나타냈다. Fe는 3d 상자 다섯 개에 6개가 들어가 홀전자 4개, Fe²⁺는 4s 전자 2개를 잃어 홀전자 4개, Fe³⁺는 3d⁵로 홀전자 5개, Se는 4p 세 상자에 4개가 들어가 홀전자 2개이다.</desc>
