<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-ochem-3-polarimeter d-ochem-3-polarimeter">
  <title id="t-ochem-3-polarimeter">그림 유기화학 3-3 편광계의 구조</title>
  <desc id="d-ochem-3-polarimeter">모식도. 나트륨 램프(589 nm)의 빛은 모든 방향으로 진동한다. 편광자를 지나면 세로로만 진동하는 평면 편광이 되고, 카이랄 분자 용액이 든 시료관(길이 l, 1 dm = 10 cm)을 지나면서 진동면이 돈다. 검광자를 돌려 빛이 가장 밝게 통과하는 각도로 회전각 α를 읽는다. 아래 원들은 관찰자 쪽에서 본 진동 방향이며, 관찰자가 보기에 시계 방향 회전이 (+), 우선성이다.</desc>
