  <title id="t-ubio-10-q-photoperiod-bars">그림 일반생명과학 10-11 예제 9의 빛 처리 조건</title>
  <desc id="d-ubio-10-q-photoperiod-bars">24시간 주기의 명기(밝은 막대)와 암기(어두운 막대)를 나타낸 것이다. ㄱ은 명 14시간–암 10시간, ㄴ은 명 10시간–암 14시간이다. ㄷ은 ㄴ과 같되 암기 한가운데에 적색광(R) 섬광을, ㄹ은 ㄷ과 같되 적색광 섬광 직후 원적색광(FR) 섬광을 준다.</desc>
