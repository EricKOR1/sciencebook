<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 544" role="img" aria-labelledby="t-bio-3-meiosis d-bio-3-meiosis">
  <title id="t-bio-3-meiosis">그림 생명과학 3-5 생식세포 형성 과정(감수 분열)의 염색체 행동</title>
  <desc id="d-bio-3-meiosis">2n = 4인 세포의 감수 분열이다. 감수 1분열 전기에 상동 염색체끼리 붙어 2가 염색체를 이루고 교차가 일어나며, 중기에 2가 염색체가 적도면에 배열되고, 후기에 상동 염색체가 분리되어 n = 2인 세포 2개가 된다. 감수 2분열에서는 DNA 복제 없이 염색 분체가 분리되어 n = 2인 생식세포 4개가 만들어진다. 모식도.</desc>
