    .b3mei-sm{font-size:12.5px;fill:var(--fig-muted)} .b3mei-lead{fill:none;stroke:var(--fig-muted);stroke-width:1.1}
    .b3mei-ink{fill:var(--fig-ink)} .b3mei-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.6}
    
  </style>
