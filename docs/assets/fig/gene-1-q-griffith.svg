  <title id="t-gene-1-q-griffith">그림 생물의 유전 1-9 문제 3의 그리피스 실험</title>
  <desc id="d-gene-1-q-griffith">쥐에 주사한 네 가지 경우 (가)~(라)이다. (가) 살아 있는 S형 균, (나) 살아 있는 R형 균, (다) 열로 죽인 S형 균, (라) 열로 죽인 S형 균과 살아 있는 R형 균을 함께 주사한다. S형 균은 피막이 있고 R형 균은 피막이 없다. 결과는 나타내지 않았다.</desc>
