  <text x="560" y="256" text-anchor="middle" class="pro-sm">입체 구조가 기능을 정한다</text>
  <text x="360" y="288" text-anchor="middle" class="pro-sm">열을 받아 입체 구조가 풀리면 배열은 그대로여도 기능을 잃는다(예: 삶은 달걀흰자). 모식도.</text>
</svg>
