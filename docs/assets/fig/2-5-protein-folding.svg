<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-2-5-protein-folding d-2-5-protein-folding">
  <title id="t-2-5-protein-folding">그림 2-5-2 아미노산에서 단백질의 입체 구조까지</title>
  <desc id="d-2-5-protein-folding">여러 종류의 아미노산(색이 다른 구슬)이 펩타이드 결합으로 길게 이어지고, 배열 순서에 따라 정해진 모양으로 접혀 고유한 입체 구조를 이룬다. 입체 구조의 홈에 꼭 맞는 물질과 결합하는 것처럼 구조가 기능을 정한다. 모식도.</desc>
  <style>
    .pro-lbl{font-size:15px;font-weight:600;fill:var(--fig-ink)} .pro-t{font-size:14px;fill:var(--fig-ink)}
    .pro-sm{font-size:13px;fill:var(--fig-muted)} .pro-acc{font-size:13px;font-weight:600;fill:var(--fig-accent)}
    .pro-a{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5} .pro-b{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5}
    .pro-c{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.5} .pro-d{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5}
    .pro-e{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5}
    .pro-link{stroke:var(--fig-ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .pro-sub{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.8}
    .pro-ar{stroke:var(--fig-accent);stroke-width:2.2;fill:none} .pro-ah{fill:var(--fig-accent)}
    .pro-pocket{fill:none;stroke:var(--fig-teal);stroke-width:1.5;stroke-dasharray:4 3}
  </style>
  <text x="80" y="30" text-anchor="middle" class="pro-lbl">① 아미노산</text>
