  <title id="t-pchem-5-q-p8-px-blank">그림 물리화학 5-16 문제 8의 압력–조성 도표</title>
  <desc id="d-pchem-5-q-p8-px-blank">어떤 온도에서 이상 용액 A–B의 압력–조성 도표. 거품점 직선은 x_A = 0에서 20.0 kPa, x_A = 1에서 80.0 kPa이고, 아래로 처진 곡선은 이슬점 선이다. 세로 점선은 전체 조성 z_A = 0.500, 가로 점선은 압력 40.0 kPa이다.</desc>
