  <desc id="d-umath-8-q-fd-instability">탐구 활동 A의 조건(처음 60 ℃, 양 끝 0)으로 r = 0.25(파랑)와 r = 0.60(빨강)의 차분식을 같은 시각 t ≈ 171 s까지 계산한 격자점 값이다(r = 0.25는 24단계, r = 0.60은 10단계). 양 끝 점은 모두 0이다.</desc>
