<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-matter-2-vp-lowering d-matter-2-vp-lowering">
  <title id="t-matter-2-vp-lowering">그림 물질과 에너지 2-5 증기 압력 내림의 입자 모형</title>
  <desc id="d-matter-2-vp-lowering">밀폐된 용기에서 순수한 물은 표면 전체에서 물 분자가 증발한다. 설탕물은 표면의 일부를 증발하지 않는 용질 입자가 차지하여 같은 시간 동안 튀어 나가는 물 분자 수가 줄어들므로, 더 적은 증기 분자 수에서 동적 평형에 이르고 증기 압력이 낮아진다. 입자 수는 줄여 나타낸 모식도이다.</desc>
