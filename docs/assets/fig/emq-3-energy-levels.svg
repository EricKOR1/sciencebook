  <text x="288.0" y="331.0" style="font-size:13px;fill:var(--fig-muted)">122 nm(자외선)</text>
  <line x1="316.0" y1="300.0" x2="316.0" y2="162.8" style="fill:none;stroke:var(--fig-red);stroke-width:1.8;stroke-dasharray:5 4"/>
