<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-emq-3-energy-levels d-emq-3-energy-levels">
  <title id="t-emq-3-energy-levels">그림 전자기와 양자 3-4 수소 원자의 에너지 준위와 선스펙트럼(발머 계열)</title>
  <desc id="d-emq-3-energy-levels">수소 원자의 에너지 준위는 E = −13.6/n² eV로 띄엄띄엄하다. 전자가 n = 3, 4, 5, 6에서 n = 2로 내려올 때 각각 656, 486, 434, 410 nm의 가시광선을 내놓고, n = 2에서 1로 내려올 때는 122 nm의 자외선을 낸다. 같은 에너지 차의 빛을 받아들이면 위로 올라간다(흡수). n = 1과 2 사이는 세로축 일부를 생략했다.</desc>
  <line x1="70.0" y1="34.0" x2="70.0" y2="318.0" style="fill:none;stroke:var(--fig-ink);stroke-width:1.4"/>
  <line x1="70.0" y1="334.0" x2="70.0" y2="350.0" style="fill:none;stroke:var(--fig-ink);stroke-width:1.4"/>
  <path d="M64 318 L76 322 L64 328 L76 334" style="fill:none;stroke:var(--fig-ink);stroke-width:1.4"/>
  <text x="62.0" y="30.0" style="font-size:13px;fill:var(--fig-muted)">에너지</text>
  <line x1="84.0" y1="345.0" x2="330.0" y2="345.0" style="fill:none;stroke:var(--fig-ink);stroke-width:2.2"/>
  <line x1="84.0" y1="300.0" x2="330.0" y2="300.0" style="fill:none;stroke:var(--fig-ink);stroke-width:2.2"/>
  <line x1="84.0" y1="155.6" x2="330.0" y2="155.6" style="fill:none;stroke:var(--fig-ink);stroke-width:2.2"/>
  <line x1="84.0" y1="105.0" x2="330.0" y2="105.0" style="fill:none;stroke:var(--fig-ink);stroke-width:2.2"/>
  <line x1="84.0" y1="81.6" x2="330.0" y2="81.6" style="fill:none;stroke:var(--fig-muted);stroke-width:1.2;stroke-dasharray:4 3"/>
  <line x1="84.0" y1="68.9" x2="330.0" y2="68.9" style="fill:none;stroke:var(--fig-muted);stroke-width:1.2;stroke-dasharray:4 3"/>
  <line x1="84.0" y1="40.0" x2="330.0" y2="40.0" style="fill:none;stroke:var(--fig-muted);stroke-width:1.2;stroke-dasharray:4 3"/>
  <text x="336.0" y="350.0" style="font-size:13px;fill:var(--fig-ink)">n = 1</text>
  <text x="384.0" y="350.0" style="font-size:13px;fill:var(--fig-muted)">−13.6 eV</text>
  <text x="336.0" y="305.0" style="font-size:13px;fill:var(--fig-ink)">n = 2</text>
  <text x="384.0" y="305.0" style="font-size:13px;fill:var(--fig-muted)">−3.40 eV</text>
  <text x="336.0" y="160.6" style="font-size:13px;fill:var(--fig-ink)">n = 3</text>
  <text x="384.0" y="160.6" style="font-size:13px;fill:var(--fig-muted)">−1.51 eV</text>
  <text x="336.0" y="110.0" style="font-size:13px;fill:var(--fig-ink)">n = 4</text>
  <text x="384.0" y="110.0" style="font-size:13px;fill:var(--fig-muted)">−0.85 eV</text>
  <text x="336.0" y="86.6" style="font-size:13px;fill:var(--fig-ink)">n = 5</text>
  <text x="384.0" y="86.6" style="font-size:13px;fill:var(--fig-muted)">−0.54 eV</text>
  <text x="336.0" y="45.0" style="font-size:13px;fill:var(--fig-ink)">n = ∞</text>
  <text x="384.0" y="45.0" style="font-size:13px;fill:var(--fig-muted)">0 (전자가 떨어져 나감)</text>
