  <text x="324.0" y="242.0" style="font-size:13px;fill:var(--fig-red)">(656 nm)</text>
  <text x="225.0" y="372.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-ink)">실선 화살표: 방출(빛을 냄)  ·  점선 화살표: 흡수(빛을 받아들임)</text>
  <text x="470.0" y="130.0" style="font-size:15px;fill:var(--fig-ink);font-weight:600">수소의 방출 스펙트럼(가시광선)</text>
