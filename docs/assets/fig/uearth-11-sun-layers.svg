  <circle cx="336.6" cy="280.3" r="2.5" style="fill:var(--fig-ink)"/>
  <text x="426" y="182" class="uearth-11-sun-layers-h">광구</text>
  <text x="426" y="199" class="uearth-11-sun-layers-s">눈에 보이는 표면, 약 5800 K, 쌀알 무늬·흑점</text>
  <line x1="325.0" y1="329.6" x2="420" y2="240" style="stroke:var(--fig-muted);stroke-width:1"/>
  <circle cx="325.0" cy="329.6" r="2.5" style="fill:var(--fig-ink)"/>
  <text x="426" y="244" class="uearth-11-sun-layers-h">대류층 0.7~1.0 R☉</text>
  <text x="426" y="261" class="uearth-11-sun-layers-s">200만 K → 5800 K, 기체의 대류로 전달</text>
  <line x1="193.3" y1="392.4" x2="420" y2="308" style="stroke:var(--fig-muted);stroke-width:1"/>
  <circle cx="193.3" cy="392.4" r="2.5" style="fill:var(--fig-ink)"/>
  <text x="426" y="312" class="uearth-11-sun-layers-h">복사층 0.25~0.7 R☉</text>
  <text x="426" y="329" class="uearth-11-sun-layers-s">700만 → 200만 K, 광자의 흡수·재방출(수만 년 이상)</text>
  <line x1="89.3" y1="420.7" x2="420" y2="378" style="stroke:var(--fig-muted);stroke-width:1"/>
  <circle cx="89.3" cy="420.7" r="2.5" style="fill:var(--fig-ink)"/>
