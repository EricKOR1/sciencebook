  <text x="426" y="399" class="uearth-11-sun-layers-s">중심 1570만 K, 수소 핵융합(p–p 연쇄)</text>
  <text x="706" y="440" text-anchor="end" class="uearth-11-sun-layers-s">내부 층의 반지름 비는 실제, 채층·코로나 두께는 모식적</text>
