  <text x="54" y="401" class="uearth-11-sun-layers-h">중심핵</text>
  <line x1="294.6" y1="170.4" x2="420" y2="58" style="stroke:var(--fig-muted);stroke-width:1"/>
  <circle cx="294.6" cy="170.4" r="2.5" style="fill:var(--fig-ink)"/>
  <text x="426" y="62" class="uearth-11-sun-layers-h">코로나</text>
  <text x="426" y="79" class="uearth-11-sun-layers-s">100만~200만 K, X선·극자외선 → 태양풍</text>
