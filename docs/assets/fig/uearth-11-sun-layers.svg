<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="t-uearth-11-sun-layers d-uearth-11-sun-layers">
  <title id="t-uearth-11-sun-layers">그림 일반지구과학 11-1 태양의 층 구조</title>
  <desc id="d-uearth-11-sun-layers">태양 단면의 4분의 1. 중심핵(반지름의 약 25 %)에서 수소 핵융합으로 생긴 에너지는 복사층(약 0.25~0.7)에서 광자의 흡수·재방출로, 대류층(약 0.7~1.0)에서 기체의 대류로 바깥에 전달되어 광구에서 빛으로 나간다. 광구 위에는 채층과 수백만 K의 코로나가 있다.</desc>
