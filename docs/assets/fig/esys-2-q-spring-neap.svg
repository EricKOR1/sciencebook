<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t-esys-2-q-spring-neap d-esys-2-q-spring-neap">
  <title id="t-esys-2-q-spring-neap">그림 지구시스템과학 2-14 문제 17 해설의 사리와 조금</title>
  <desc id="d-esys-2-q-spring-neap">(가) 사리: 달(삭 또는 망)과 태양이 지구와 일직선에 놓여 기조력이 더해진다(2 + 1 = 3). (나) 조금: 달(상현 또는 하현)과 태양이 지구에서 직각 방향에 놓여 기조력이 서로 약화된다(2 − 1 = 1). 그래서 조차 비는 약 3 : 1이다. 크기와 거리를 무시한 모식도이다.</desc>
  <style>
    .esys-2-q-spring-neap-t{font-size:14px;fill:var(--fig-ink)} .esys-2-q-spring-neap-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .esys-2-q-spring-neap-s{font-size:13px;fill:var(--fig-muted)} .esys-2-q-spring-neap-ax{fill:none;stroke:var(--fig-muted);stroke-width:1.4} .esys-2-q-spring-neap-gr{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4}
  </style>
  <text x="180" y="24" text-anchor="middle" class="esys-2-q-spring-neap-b">(가) 사리</text>
  <text x="500" y="24" text-anchor="middle" class="esys-2-q-spring-neap-b">(나) 조금</text>
  <line x1="368" y1="40" x2="368" y2="225" style="stroke:var(--fig-line);stroke-width:1"/>
  <circle cx="40" cy="130" r="22" style="fill:#f6c343;stroke:var(--fig-amber);stroke-width:2"/>
  <text x="40" y="172" text-anchor="middle" class="esys-2-q-spring-neap-s">태양</text>
  <ellipse cx="210" cy="130" rx="52" ry="36" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5;stroke-dasharray:4 3"/>
  <circle cx="210" cy="130" r="28" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2"/>
  <text x="210" y="135" text-anchor="middle" class="esys-2-q-spring-neap-s" style="fill:var(--fig-ink)">지구</text>
  <circle cx="330" cy="130" r="11" style="fill:var(--fig-line);stroke:var(--fig-ink);stroke-width:1.5"/>
  <text x="330" y="160" text-anchor="middle" class="esys-2-q-spring-neap-s">망</text>
  <circle cx="110" cy="130" r="11" style="fill:none;stroke:var(--fig-ink);stroke-width:1.5;stroke-dasharray:3 3"/>
  <text x="110" y="160" text-anchor="middle" class="esys-2-q-spring-neap-s">삭</text>
  <circle cx="400" cy="130" r="22" style="fill:#f6c343;stroke:var(--fig-amber);stroke-width:2"/>
  <text x="400" y="172" text-anchor="middle" class="esys-2-q-spring-neap-s">태양</text>
  <ellipse cx="560" cy="130" rx="38" ry="44" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5;stroke-dasharray:4 3"/>
  <circle cx="560" cy="130" r="28" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2"/>
  <text x="560" y="135" text-anchor="middle" class="esys-2-q-spring-neap-s" style="fill:var(--fig-ink)">지구</text>
  <circle cx="560" cy="60" r="11" style="fill:var(--fig-line);stroke:var(--fig-ink);stroke-width:1.5"/>
  <text x="560" y="90" text-anchor="middle" class="esys-2-q-spring-neap-s"></text>
  <text x="580" y="65" class="esys-2-q-spring-neap-s">상현 또는 하현</text>
  <circle cx="560" cy="206" r="11" style="fill:none;stroke:var(--fig-ink);stroke-width:1.5;stroke-dasharray:3 3"/>
  <text x="560" y="236" text-anchor="middle" class="esys-2-q-spring-neap-s"></text>
  <rect x="90" y="250" width="80" height="16" style="fill:var(--fig-soft-violet);stroke:var(--fig-ink);stroke-width:1"/>
  <rect x="170" y="250" width="40" height="16" style="fill:var(--fig-soft-amber);stroke:var(--fig-ink);stroke-width:1"/>
  <text x="90" y="290" class="esys-2-q-spring-neap-s">기조력: 달 2 + 태양 1 = 3</text>
  <rect x="450" y="250" width="80" height="16" style="fill:var(--fig-soft-violet);stroke:var(--fig-ink);stroke-width:1"/>
  <rect x="490" y="270" width="40" height="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-ink);stroke-width:1"/>
  <text x="450" y="300" class="esys-2-q-spring-neap-s">기조력: 달 2 − 태양 1 = 1</text>
  <text x="358" y="260" class="esys-2-q-spring-neap-s">달</text>
  <text x="358" y="280" class="esys-2-q-spring-neap-s">태양</text>
  <rect x="340" y="249" width="12" height="12" style="fill:var(--fig-soft-violet);stroke:var(--fig-ink);stroke-width:1"/>
  <rect x="340" y="269" width="12" height="12" style="fill:var(--fig-soft-amber);stroke:var(--fig-ink);stroke-width:1"/>
</svg>
