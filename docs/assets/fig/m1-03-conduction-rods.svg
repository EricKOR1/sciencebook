<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-m1-03-conduction-rods d-m1-03-conduction-rods">
<title id="t-m1-03-conduction-rods">그림 중1-3-9 막대에서 열이 전도되는 빠르기 비교 장치</title>
<desc id="d-m1-03-conduction-rods">길이와 굵기가 같은 구리, 알루미늄, 철, 유리 막대를 뜨거운 물이 담긴 단열 용기에 같은 깊이로 세우고 열화상 카메라로 본다. 따뜻한 색이 올라온 높이로 열이 전도되는 빠르기를 비교한다. 그림은 얼마 뒤의 예상 모습을 나타낸 모식도이다.</desc>
