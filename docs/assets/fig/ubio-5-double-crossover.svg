<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-ubio-5-double-crossover d-ubio-5-double-crossover">
  <title id="t-ubio-5-double-crossover">그림 일반생명과학 5-8 3점 검정 교배 — 교차 위치에 따른 네 부류</title>
  <desc id="d-ubio-5-double-crossover">예제 10의 어버이 염색체 A C b(파랑)와 a c B(빨강)에서, 교차가 일어난 위치에 따라 생식세포가 네 부류로 나뉜다. 교차가 없으면 어버이형, A–C 사이에서 한 번이면 단일 교차 Ⅰ, C–B 사이에서 한 번이면 단일 교차 Ⅱ, 두 구간에서 모두 일어나면 이중 교차형이다. 이중 교차형은 바깥 두 유전자(A, B)의 조합이 어버이형과 같고 가운데 유전자(C)만 바뀌므로, 가장 드문 부류와 어버이형을 비교하면 가운데 유전자를 찾을 수 있다. 오른쪽 수는 1000개체 중 개체 수이다. 모식도.</desc>
