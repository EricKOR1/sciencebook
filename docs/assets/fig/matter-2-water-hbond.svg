<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-matter-2-water-hbond d-matter-2-water-hbond">
  <title id="t-matter-2-water-hbond">그림 물질과 에너지 2-1 물 분자 하나가 이루는 네 개의 수소 결합</title>
  <desc id="d-matter-2-water-hbond">물 분자는 산소에 수소 두 개가 약 104.5°로 결합한 굽은형 극성 분자이다. 자기 수소 두 개로 이웃 분자 둘의 산소와, 자기 산소의 비공유 전자쌍 두 개로 이웃 분자 둘의 수소와 수소 결합하여 최대 네 개의 이웃과 수소 결합한다. 실제로는 입체적으로 배열되며, 평면에 나타낸 모식도이다.</desc>
