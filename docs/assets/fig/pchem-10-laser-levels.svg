<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="t-pchem-10-laser-levels d-pchem-10-laser-levels">
  <title id="t-pchem-10-laser-levels">그림 물리화학 10-11 3준위·4준위 레이저와 공진기</title>
  <desc id="d-pchem-10-laser-levels">왼쪽 3준위 레이저: 바닥 준위 1에서 넓은 펌핑 띠 3으로 올린 분자가 빠른 무복사 전이로 수명이 긴 준안정 준위 2에 모이고, 준위 2의 분자 수가 준위 1보다 많아지면(밀도 반전 N₂ &gt; N₁) 2 → 1 레이저 발진이 일어난다. 바닥 준위의 절반 이상을 비워야 하므로 펌핑이 세야 한다. 오른쪽 4준위 레이저: 0 → 3 펌핑, 3 → 2 빠른 무복사, 2 → 1 발진, 1 → 0 빠른 무복사. 발진의 아래 준위 1이 곧 비워지므로 준위 2에 분자가 조금만 있어도 반전이 된다. 점은 분자 수를 나타내는 모식이다. 아래: 이득 매질 양쪽에 전반사 거울과 부분 투과 거울을 둔 공진기. 빛이 왕복하며 증폭되고 일부가 레이저 빔으로 나간다.</desc>
