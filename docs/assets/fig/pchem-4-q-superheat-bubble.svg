<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-pchem-4-q-superheat-bubble d-pchem-4-q-superheat-bubble">
  <title id="t-pchem-4-q-superheat-bubble">그림 물리화학 4-17 문제 17의 수증기 기포와 끓임쪽</title>
  <desc id="d-pchem-4-q-superheat-bubble">왼쪽: 물속에 있는 반지름 r인 수증기 기포의 단면. 기포 안의 증기 압력은 p, 바깥 물의 압력은 1 atm이며, 기포 경계의 표면 장력 γ가 기포를 안쪽으로 조인다. 오른쪽: 끓임쪽 표면의 작은 구멍을 확대한 모습. 구멍 속에 기체가 갇혀 있고 구멍 입구의 기체–액체 경계는 액체 쪽으로 볼록하다.</desc>
  <style>.pchem-4-q-superheat-bubble-t{font-size:14px;fill:var(--fig-ink)} .pchem-4-q-superheat-bubble-s{font-size:13px;fill:var(--fig-muted)} .pchem-4-q-superheat-bubble-b{font-size:15px;font-weight:600;fill:var(--fig-ink)} .pchem-4-q-superheat-bubble-i{font-size:14px;font-style:italic;fill:var(--fig-ink)} </style>
