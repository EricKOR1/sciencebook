<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="t-uphy-1-xva-graphs d-uphy-1-xva-graphs">
  <title id="t-uphy-1-xva-graphs">그림 일반물리학 1-4 위치·속도·가속도 그래프를 위아래로 맞춰 보기</title>
  <desc id="d-uphy-1-xva-graphs">예제 3의 운동 x(t) = t³ − 6t² + 9t + 2를 위치, 속도, 가속도 그래프로 같은 시간축에 맞추어 그렸다. 위 그래프의 접선 기울기가 아래 그래프의 값이고, 속도 그래프 아래의 부호 있는 넓이가 변위이다. t = 1 s, 3 s에서 속도가 0이 되어 방향을 바꾸고, t = 2 s에서 가속도가 0이다.</desc>
