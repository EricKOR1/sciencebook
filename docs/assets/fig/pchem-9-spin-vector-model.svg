<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-pchem-9-spin-vector-model d-pchem-9-spin-vector-model">
  <title id="t-pchem-9-spin-vector-model">그림 물리화학 9-2 두 스핀 ½의 결합 — 벡터 모형</title>
  <desc id="d-pchem-9-spin-vector-model">각 스핀 벡터의 길이는 √(3/4)ħ = 0.87ħ, z성분은 ±½ħ이고 z축 둘레 원뿔 위에서 세차 운동한다. 삼중항(S = 1)에서는 합 벡터의 길이가 √2ħ = 1.41ħ이 되도록 두 벡터가 70.5°를 이루며, MS = +1, −1에서는 두 벡터의 xy 성분이 서로 90° 어긋나고 MS = 0에서는 같은 방향이다. 일중항(S = 0)에서는 두 벡터가 정반대여서 합이 0이다. 길이는 ħ에 비례하게 그렸다(입체를 비스듬히 본 투영).</desc>
