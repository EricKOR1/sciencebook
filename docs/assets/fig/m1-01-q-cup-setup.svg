<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-m1-01-q-cup-setup d-m1-01-q-cup-setup">
  <title id="t-m1-01-q-cup-setup">그림 중1-1-10 문제 15에서 지호가 한 실험</title>
  <desc id="d-m1-01-q-cup-setup">종이컵은 바람이 드는 창가에, 보온 텀블러는 교실 안쪽 책상에 두었다. 처음 물의 온도와 양은 문제의 표와 같다(모식도).</desc>
