  <title id="t-cell-2-q-inhibitor-curves">그림 세포와 물질대사 2-7 예제 3의 기질 농도에 따른 초기 반응 속도</title>
  <desc id="d-cell-2-q-inhibitor-curves">예제 3의 표에 있는 측정값(점)과 그 경향(선). 저해제가 없을 때, 저해제 A를 넣었을 때, 저해제 B를 넣었을 때의 초기 반응 속도를 기질 농도에 따라 나타냈다. 값은 모두 상대값이다.</desc>
