<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-pchem-5-eutectic-cooling d-pchem-5-eutectic-cooling">
  <title id="t-pchem-5-eutectic-cooling">그림 물리화학 5-14 단순 공융계의 온도–조성 도표와 냉각 곡선</title>
  <desc id="d-pchem-5-eutectic-cooling">왼쪽: A의 녹는점 T_f,A와 B의 녹는점 T_f,B에서 내려오는 두 액상선(이상 용해도 곡선으로 계산)이 공융점 E(x_E ≈ 0.62, T_E)에서 만나 V자 모양을 이룬다. 영역은 액체, 고체 A + 액체, 고체 B + 액체, 고체 A + 고체 B이다. 오른쪽: 조성 a(순수 A), b(x_B = 0.2), c(x_E)의 냉각 곡선. a는 T_f,A에서 수평 정지 하나, b는 액상선 온도에서 꺾임과 T_E에서 짧은 정지, c는 T_E에서 긴 정지 하나만 보인다. 두 그림의 온도 눈높이는 같다.</desc>
