<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-ubio-13-energy-flow d-ubio-13-energy-flow">
  <title id="t-ubio-13-energy-flow">그림 일반생명과학 13-7 생태계의 에너지 흐름과 소비자의 에너지 장부</title>
  <desc id="d-ubio-13-energy-flow">위: 예제 7의 초원(단위 kJ/m², 1년). 햇빛의 약 1%가 총 1차 생산량(GPP)이 되고, 생산자 호흡을 뺀 순 1차 생산량(NPP)의 약 10%가 초식 동물의, 그 약 8%가 육식 동물의 순생산량이 된다. 단계마다 호흡으로 열이 빠져나가고, 사체와 배설물은 분해자에게 간다. 상자 크기는 로그 눈금이다. 아래: 예제 8의 애벌레가 먹은 잎 200 J은 대변 100 J, 호흡 67 J, 몸에 쌓이는 순 2차 생산 33 J으로 나뉜다(띠의 굵기가 에너지에 비례).</desc>
  <style>.ubio-13-energy-flow-t{font-size:14px;fill:var(--fig-ink)} .ubio-13-energy-flow-s{font-size:13px;fill:var(--fig-muted)} .ubio-13-energy-flow-b{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-13-energy-flow-k{font-size:13px;fill:var(--fig-ink)}</style>
  <defs><marker id="ubio-13-energy-flow-ar-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-ink)"/></marker><marker id="ubio-13-energy-flow-ar-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-red)"/></marker><marker id="ubio-13-energy-flow-ar-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-violet)"/></marker></defs>
  <text x="20.0" y="24.0" class="ubio-13-energy-flow-b">① 영양 단계를 따라 줄어드는 에너지 (예제 7, kJ/m²·년)</text>
  <rect x="20.0" y="69.9" width="132.0" height="84.3" rx="6" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.8"/>
  <text x="86.0" y="109.0" text-anchor="middle" class="ubio-13-energy-flow-b">햇빛</text>
  <text x="86.0" y="127.0" text-anchor="middle" class="ubio-13-energy-flow-k">5.0×10⁶</text>
  <rect x="196.0" y="78.9" width="132.0" height="66.3" rx="6" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.8"/>
  <text x="262.0" y="102.0" text-anchor="middle" class="ubio-13-energy-flow-b">생산자</text>
  <text x="262.0" y="120.0" text-anchor="middle" class="ubio-13-energy-flow-k">GPP 5.0×10⁴</text>
  <text x="262.0" y="137.0" text-anchor="middle" class="ubio-13-energy-flow-k">NPP 2.0×10⁴</text>
  <rect x="390.0" y="85.1" width="132.0" height="53.7" rx="6" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.8"/>
  <text x="456.0" y="109.0" text-anchor="middle" class="ubio-13-energy-flow-b">초식 동물</text>
  <text x="456.0" y="127.0" text-anchor="middle" class="ubio-13-energy-flow-k">순생산 2.0×10³</text>
  <rect x="568.0" y="90.1" width="132.0" height="43.8" rx="6" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
  <text x="634.0" y="109.0" text-anchor="middle" class="ubio-13-energy-flow-b">육식 동물</text>
  <text x="634.0" y="127.0" text-anchor="middle" class="ubio-13-energy-flow-k">순생산 1.6×10²</text>
  <line x1="156.0" y1="112.0" x2="190.0" y2="112.0" style="fill:none;stroke:var(--fig-ink);stroke-width:2.2" marker-end="url(#ubio-13-energy-flow-ar-ink)"/>
  <text x="174.0" y="104.0" text-anchor="middle" class="ubio-13-energy-flow-b">1%</text>
  <line x1="332.0" y1="112.0" x2="384.0" y2="112.0" style="fill:none;stroke:var(--fig-ink);stroke-width:2.2" marker-end="url(#ubio-13-energy-flow-ar-ink)"/>
  <text x="359.0" y="104.0" text-anchor="middle" class="ubio-13-energy-flow-b">10%</text>
  <line x1="526.0" y1="112.0" x2="562.0" y2="112.0" style="fill:none;stroke:var(--fig-ink);stroke-width:2.2" marker-end="url(#ubio-13-energy-flow-ar-ink)"/>
  <text x="545.0" y="104.0" text-anchor="middle" class="ubio-13-energy-flow-b">8%</text>
  <path d="M262.0 76.85463498048792 q-6 -7 0 -12 q6 -7 0 -12" style="fill:none;stroke:var(--fig-red);stroke-width:2" marker-end="url(#ubio-13-energy-flow-ar-red)"/>
  <text x="262.0" y="46.9" text-anchor="middle" class="ubio-13-energy-flow-s" style="fill:var(--fig-red)">호흡 3.0×10⁴ → 열</text>
  <path d="M456.0 83.14536501951208 q-6 -7 0 -12 q6 -7 0 -12" style="fill:none;stroke:var(--fig-red);stroke-width:2" marker-end="url(#ubio-13-energy-flow-ar-red)"/>
  <text x="456.0" y="53.1" text-anchor="middle" class="ubio-13-energy-flow-s" style="fill:var(--fig-red)">호흡 → 열</text>
  <path d="M634.0 88.08146007804834 q-6 -7 0 -12 q6 -7 0 -12" style="fill:none;stroke:var(--fig-red);stroke-width:2" marker-end="url(#ubio-13-energy-flow-ar-red)"/>
  <text x="634.0" y="58.1" text-anchor="middle" class="ubio-13-energy-flow-s" style="fill:var(--fig-red)">호흡 → 열</text>
  <rect x="196.0" y="196.0" width="504.0" height="26.0" rx="6" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5"/>
  <text x="448.0" y="214.0" text-anchor="middle" class="ubio-13-energy-flow-k">분해자 — 사체·낙엽·배설물의 에너지를 쓰고 열로 내보냄</text>
  <line x1="222.0" y1="147.1" x2="222.0" y2="194.0" style="fill:none;stroke:var(--fig-violet);stroke-width:1.6;stroke-dasharray:4 3" marker-end="url(#ubio-13-energy-flow-ar-violet)"/>
  <line x1="416.0" y1="140.9" x2="416.0" y2="194.0" style="fill:none;stroke:var(--fig-violet);stroke-width:1.6;stroke-dasharray:4 3" marker-end="url(#ubio-13-energy-flow-ar-violet)"/>
  <line x1="594.0" y1="135.9" x2="594.0" y2="194.0" style="fill:none;stroke:var(--fig-violet);stroke-width:1.6;stroke-dasharray:4 3" marker-end="url(#ubio-13-energy-flow-ar-violet)"/>
  <text x="20.0" y="166.0" class="ubio-13-energy-flow-s">% = 앞 단계에 대한 비율</text>
  <text x="20.0" y="214.0" class="ubio-13-energy-flow-s">에너지는 한 방향,</text>
  <text x="20.0" y="232.0" class="ubio-13-energy-flow-s">결국 모두 열로</text>
  <line x1="20.0" y1="252.0" x2="700.0" y2="252.0" style="fill:none;stroke:var(--fig-line);stroke-width:1"/>
  <text x="20.0" y="278.0" class="ubio-13-energy-flow-b">② 애벌레의 에너지 장부 (예제 8)</text>
  <path d="M40 320 L200 320 L200 420 L40 420 Z" style="fill:var(--fig-soft-green)"/>
  <text x="52.0" y="375.0" class="ubio-13-energy-flow-b">섭취 200 J</text>
  <path d="M200 370 A60 60 0 0 1 260 430 L260 458 L210 458 L210 430 A10 10 0 0 0 200 420 Z" style="fill:var(--fig-soft-amber)"/>
  <text x="270.0" y="452.0" class="ubio-13-energy-flow-k" style="fill:var(--fig-amber)">배출(대변) 100 J → 분해자</text>
  <path d="M200 320 L400 320 L400 370 L200 370 Z" style="fill:var(--fig-soft-teal)"/>
  <text x="214.0" y="350.0" class="ubio-13-energy-flow-b">동화 100 J</text>
  <path d="M400 353.5 A43.5 43.5 0 0 0 443.5 310 L443.5 286 L410 286 L410 310 A10 10 0 0 1 400 320 Z" style="fill:var(--fig-soft-red)"/>
  <text x="452.0" y="302.0" class="ubio-13-energy-flow-k" style="fill:var(--fig-red)">호흡 67 J → 열</text>
  <path d="M400 353.5 L640 353.5 L640 370 L400 370 Z" style="fill:var(--fig-soft-blue)"/>
  <path d="M640 347 L664 361.75 L640 376.5 Z" style="fill:var(--fig-soft-blue)"/>
  <text x="420.0" y="394.0" class="ubio-13-energy-flow-k" style="fill:var(--fig-blue)">순 2차 생산 33 J(몸에 쌓임) → 다음 소비자</text>
  <text x="700.0" y="452.0" text-anchor="end" class="ubio-13-energy-flow-s">동화 효율 50% · 생산 효율 33%</text>
</svg>
