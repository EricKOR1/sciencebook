<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-ubio-13-energy-flow d-ubio-13-energy-flow">
  <title id="t-ubio-13-energy-flow">그림 일반생명과학 13-7 생태계의 에너지 흐름과 소비자의 에너지 장부</title>
  <desc id="d-ubio-13-energy-flow">위: 예제 7의 초원(단위 kJ/m², 1년). 햇빛의 약 1%가 총 1차 생산량(GPP)이 되고, 생산자 호흡을 뺀 순 1차 생산량(NPP)의 약 10%가 초식 동물의, 그 약 8%가 육식 동물의 순생산량이 된다. 단계마다 호흡으로 열이 빠져나가고, 사체와 배설물은 분해자에게 간다. 상자 크기는 로그 눈금이다. 아래: 예제 8의 애벌레가 먹은 잎 200 J은 대변 100 J, 호흡 67 J, 몸에 쌓이는 순 2차 생산 33 J으로 나뉜다(띠의 굵기가 에너지에 비례).</desc>
  <style>.ubio-13-energy-flow-t{font-size:14px;fill:var(--fig-ink)} .ubio-13-energy-flow-s{font-size:13px;fill:var(--fig-muted)} .ubio-13-energy-flow-b{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-13-energy-flow-k{font-size:13px;fill:var(--fig-ink)}</style>
  <defs><marker id="ubio-13-energy-flow-ar-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-ink)"/></marker><marker id="ubio-13-energy-flow-ar-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-red)"/></marker><marker id="ubio-13-energy-flow-ar-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-violet)"/></marker></defs>
  <text x="20.0" y="24.0" class="ubio-13-energy-flow-b">① 영양 단계를 따라 줄어드는 에너지 (예제 7, kJ/m²·년)</text>
  <rect x="20.0" y="68.5" width="132.0" height="87.1" rx="6" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.8"/>
  <text x="86.0" y="109.0" text-anchor="middle" class="ubio-13-energy-flow-b">햇빛</text>
  <text x="86.0" y="127.0" text-anchor="middle" class="ubio-13-energy-flow-k">5.0×10⁶</text>
  <rect x="196.0" y="81.5" width="132.0" height="61.1" rx="6" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.8"/>
  <text x="262.0" y="109.0" text-anchor="middle" class="ubio-13-energy-flow-b">생산자</text>
  <text x="262.0" y="127.0" text-anchor="middle" class="ubio-13-energy-flow-k">GPP 5.0×10⁴</text>
  <rect x="390.0" y="90.5" width="132.0" height="42.9" rx="6" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.8"/>
  <text x="456.0" y="109.0" text-anchor="middle" class="ubio-13-energy-flow-b">초식 동물</text>
  <text x="456.0" y="127.0" text-anchor="middle" class="ubio-13-energy-flow-k">순생산 2.0×10³</text>
  <rect x="568.0" y="97.7" width="132.0" height="28.7" rx="6" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
  <text x="634.0" y="109.0" text-anchor="middle" class="ubio-13-energy-flow-b">육식 동물</text>
  <text x="634.0" y="127.0" text-anchor="middle" class="ubio-13-energy-flow-k">순생산 1.6×10²</text>
  <text x="262.0" y="146.0" text-anchor="middle" class="ubio-13-energy-flow-k">NPP 2.0×10⁴</text>
  <line x1="156.0" y1="112.0" x2="190.0" y2="112.0" style="fill:none;stroke:var(--fig-ink);stroke-width:2.2" marker-end="url(#ubio-13-energy-flow-ar-ink)"/>
  <text x="174.0" y="104.0" text-anchor="middle" class="ubio-13-energy-flow-b">1%</text>
  <line x1="332.0" y1="112.0" x2="384.0" y2="112.0" style="fill:none;stroke:var(--fig-ink);stroke-width:2.2" marker-end="url(#ubio-13-energy-flow-ar-ink)"/>
  <text x="359.0" y="104.0" text-anchor="middle" class="ubio-13-energy-flow-b">10%</text>
  <line x1="526.0" y1="112.0" x2="562.0" y2="112.0" style="fill:none;stroke:var(--fig-ink);stroke-width:2.2" marker-end="url(#ubio-13-energy-flow-ar-ink)"/>
  <text x="545.0" y="104.0" text-anchor="middle" class="ubio-13-energy-flow-b">8%</text>
  <text x="359.0" y="130.0" text-anchor="middle" class="ubio-13-energy-flow-s">NPP의</text>
  <text x="545.0" y="130.0" text-anchor="middle" class="ubio-13-energy-flow-s"></text>
  <path d="M296.0 79.45669497181588 q-6 -8 0 -14 q6 -8 0 -14" style="fill:none;stroke:var(--fig-red);stroke-width:2" marker-end="url(#ubio-13-energy-flow-ar-red)"/>
  <text x="304.0" y="61.5" class="ubio-13-energy-flow-s">호흡 → 열</text>
  <path d="M490.0 88.54330502818412 q-6 -8 0 -14 q6 -8 0 -14" style="fill:none;stroke:var(--fig-red);stroke-width:2" marker-end="url(#ubio-13-energy-flow-ar-red)"/>
  <text x="498.0" y="70.5" class="ubio-13-energy-flow-s">호흡 → 열</text>
  <path d="M668.0 95.67322011273649 q-6 -8 0 -14 q6 -8 0 -14" style="fill:none;stroke:var(--fig-red);stroke-width:2" marker-end="url(#ubio-13-energy-flow-ar-red)"/>
  <text x="676.0" y="77.7" class="ubio-13-energy-flow-s">호흡 → 열</text>
  <text x="198.0" y="55.5" class="ubio-13-energy-flow-s" style="fill:var(--fig-red)">3.0×10⁴</text>
  <rect x="196.0" y="196.0" width="504.0" height="26.0" rx="6" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5"/>
  <text x="448.0" y="214.0" text-anchor="middle" class="ubio-13-energy-flow-k">분해자 — 사체·낙엽·배설물의 에너지를 쓰고 열로 내보냄</text>
  <line x1="222.0" y1="144.5" x2="222.0" y2="194.0" style="fill:none;stroke:var(--fig-violet);stroke-width:1.6;stroke-dasharray:4 3" marker-end="url(#ubio-13-energy-flow-ar-violet)"/>
  <line x1="416.0" y1="135.5" x2="416.0" y2="194.0" style="fill:none;stroke:var(--fig-violet);stroke-width:1.6;stroke-dasharray:4 3" marker-end="url(#ubio-13-energy-flow-ar-violet)"/>
  <line x1="594.0" y1="128.3" x2="594.0" y2="194.0" style="fill:none;stroke:var(--fig-violet);stroke-width:1.6;stroke-dasharray:4 3" marker-end="url(#ubio-13-energy-flow-ar-violet)"/>
  <text x="20.0" y="214.0" class="ubio-13-energy-flow-s">에너지는 한 방향,</text>
  <text x="20.0" y="232.0" class="ubio-13-energy-flow-s">결국 모두 열로</text>
  <line x1="20.0" y1="252.0" x2="700.0" y2="252.0" style="fill:none;stroke:var(--fig-line);stroke-width:1"/>
  <text x="20.0" y="278.0" class="ubio-13-energy-flow-b">② 애벌레의 에너지 장부 (예제 8)</text>
  <path d="M40 330 L180 330 L180 450.0 L40 450.0 Z" style="fill:var(--fig-soft-green)"/>
  <text x="48.0" y="395.0" class="ubio-13-energy-flow-b">섭취 200 J</text>
  <path d="M180 390.0 C230 390.0 236 400.0 240 430.0 L300.0 430.0 C300.0 394.0 296.0 390.0 240.0 390.0 " style="fill:none"/>
  <path d="M180 390.0 C214 390.0 226 410.0 226 484.0 L226.0 484.0 L286 484.0 C286 420.0 210 450.0 180 450.0 Z" style="fill:var(--fig-soft-amber)"/>
  <text x="256.0" y="502.0" text-anchor="middle" class="ubio-13-energy-flow-k" style="fill:var(--fig-amber)">배출(대변) 100 J → 분해자</text>
  <path d="M180 330 L380 330 L380 390.0 L180 390.0 Z" style="fill:var(--fig-soft-teal)"/>
  <text x="196.0" y="365.0" class="ubio-13-energy-flow-b">동화 100 J</text>
  <path d="M380 330 C420 330 430 320 430 290 L470.2 290 C470.2 360.2 420 370.2 380 370.2 Z" style="fill:var(--fig-soft-red)"/>
  <text x="480.2" y="300.0" class="ubio-13-energy-flow-k" style="fill:var(--fig-red)">호흡 67 J → 열</text>
  <path d="M380 370.2 L640 370.2 L640 390.0 L380 390.0 Z" style="fill:var(--fig-soft-blue)"/>
  <path d="M640 364.2 L662 380.09999999999997 L640 396.0 Z" style="fill:var(--fig-soft-blue)"/>
  <text x="520.0" y="410.0" text-anchor="middle" class="ubio-13-energy-flow-k" style="fill:var(--fig-blue)">순 2차 생산 33 J (몸에 쌓임) → 다음 소비자</text>
  <text x="470.0" y="296.0" text-anchor="middle" class="ubio-13-energy-flow-s">동화 효율 = 100/200 = 50%   생산 효율 = 33/100 = 33%</text>
</svg>
