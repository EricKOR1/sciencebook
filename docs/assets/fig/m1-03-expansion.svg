<title id="t-m1-03-expansion">그림 중1-3-7 열팽창 — 입자 사이의 거리가 멀어진다</title>
<desc id="d-m1-03-expansion">고체를 가열하면 입자가 더 활발하게 진동하여 입자 사이의 거리가 멀어지고 부피가 늘어난다. 입자의 수와 크기는 그대로이므로 질량은 변하지 않는다. 철로 레일은 여름에 늘어나므로 레일 사이에 틈을 둔다. 모식도(늘어나는 정도는 과장함).</desc>
