<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 230" class="fig-small" role="img" aria-labelledby="t-ochem-2-q-p6-newman-frame d-ochem-2-q-p6-newman-frame">
  <title id="t-ochem-2-q-p6-newman-frame">그림 유기화학 2-25 문제 6의 2,3-다이메틸뷰테인 뉴먼 투영식 틀</title>
  <desc id="d-ochem-2-q-p6-newman-frame">2,3-다이메틸뷰테인의 C2–C3 결합을 따라 본 뉴먼 투영식의 틀. 앞 탄소 C2(점)에 H(12시), CH₃(4시), CH₃(8시)가 있고, 뒤 탄소 C3(원)의 치환기는 비워 두었다.</desc>
  <style>.ochem-2-q-p6-newman-frame-t{font-size:14px;fill:var(--fig-ink)} .ochem-2-q-p6-newman-frame-b{font-size:14px;fill:var(--fig-ink);font-weight:600} .ochem-2-q-p6-newman-frame-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ochem-2-q-p6-newman-frame-s{font-size:13px;fill:var(--fig-muted)} .ochem-2-q-p6-newman-frame-n{font-size:13px;fill:var(--fig-muted)} .ochem-2-q-p6-newman-frame-r{font-size:13px;fill:var(--fig-red);font-weight:600} .ochem-2-q-p6-newman-frame-g{font-size:13px;fill:var(--fig-green);font-weight:600} .ochem-2-q-p6-newman-frame-v{font-size:13px;fill:var(--fig-violet)} .ochem-2-q-p6-newman-frame-pl{font-size:20px;fill:var(--fig-ink)} .ochem-2-q-p6-newman-frame-f{font-size:14px;fill:var(--fig-ink)}</style>
  <circle cx="220.0" cy="112.0" r="34" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.8"/>
  <line x1="220.0" y1="112.0" x2="220.0" y2="50.0" style="stroke:var(--fig-ink);stroke-width:1.8;stroke-linecap:round"/>
  <text x="220.0" y="46.3" class="ochem-2-q-p6-newman-frame-t" text-anchor="middle" style="font-size:13px">H</text>
  <line x1="220.0" y1="112.0" x2="273.7" y2="143.0" style="stroke:var(--fig-ink);stroke-width:1.8;stroke-linecap:round"/>
  <text x="287.6" y="151.0" class="ochem-2-q-p6-newman-frame-t" text-anchor="middle" style="font-size:13px;font-weight:600">CH₃</text>
  <line x1="220.0" y1="112.0" x2="166.3" y2="143.0" style="stroke:var(--fig-ink);stroke-width:1.8;stroke-linecap:round"/>
  <text x="152.4" y="151.0" class="ochem-2-q-p6-newman-frame-t" text-anchor="middle" style="font-size:13px;font-weight:600">CH₃</text>
  <circle cx="220.0" cy="112.0" r="2.6" style="fill:var(--fig-ink)"/>
  <text x="220.0" y="214.0" class="ochem-2-q-p6-newman-frame-s" text-anchor="middle">앞 C2 = 점, 뒤 C3 = 원(H 1개, CH₃ 2개를 채운다)</text>
</svg>
