  <text x="54" y="263" text-anchor="end" class="esys-2-q-surge-levels-s">2</text>
  <line x1="60" y1="206" x2="320" y2="206" class="esys-2-q-surge-levels-gr"/>
  <text x="54" y="211" text-anchor="end" class="esys-2-q-surge-levels-s">4</text>
  <line x1="60" y1="154" x2="320" y2="154" class="esys-2-q-surge-levels-gr"/>
  <text x="54" y="159" text-anchor="end" class="esys-2-q-surge-levels-s">6</text>
  <line x1="60" y1="102" x2="320" y2="102" class="esys-2-q-surge-levels-gr"/>
  <text x="54" y="107" text-anchor="end" class="esys-2-q-surge-levels-s">8</text>
  <line x1="60" y1="50" x2="320" y2="50" class="esys-2-q-surge-levels-gr"/>
  <text x="54" y="55" text-anchor="end" class="esys-2-q-surge-levels-s">10</text>
  <line x1="60" y1="310" x2="320" y2="310" class="esys-2-q-surge-levels-ax"/>
  <line x1="60" y1="310" x2="60" y2="44" class="esys-2-q-surge-levels-ax"/>
  <text x="54" y="30" class="esys-2-q-surge-levels-s">기준면으로부터 높이(m)</text>
