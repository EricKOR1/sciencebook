  <rect x="94" y="117.6" width="72" height="10.4" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5"/>
  <rect x="94" y="78.6" width="72" height="39" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <text x="130" y="70.6" text-anchor="middle" class="esys-2-q-surge-levels-b">8.9 m</text>
  <text x="130" y="330" text-anchor="middle" class="esys-2-q-surge-levels-t">만조 때</text>
