<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" class="fig-small" role="img" aria-labelledby="t-esys-2-q-surge-levels d-esys-2-q-surge-levels">
  <title id="t-esys-2-q-surge-levels">그림 지구시스템과학 2-12 문제 15 해설의 해수면 높이 비교</title>
  <desc id="d-esys-2-q-surge-levels">예보 조위에 기압 효과(0.4 m)와 바람 효과(1.5 m)를 더한 해수면 높이이다. 만조 때는 7.0 + 0.4 + 1.5 = 8.9 m로 방조제 높이 8.0 m를 넘고, 간조 때는 1.0 + 0.4 + 1.5 = 2.9 m로 넘지 않는다.</desc>
  <style>
    .esys-2-q-surge-levels-t{font-size:14px;fill:var(--fig-ink)} .esys-2-q-surge-levels-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .esys-2-q-surge-levels-s{font-size:13px;fill:var(--fig-muted)} .esys-2-q-surge-levels-ax{fill:none;stroke:var(--fig-muted);stroke-width:1.4} .esys-2-q-surge-levels-gr{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4}
  </style>
  <line x1="60" y1="310" x2="320" y2="310" class="esys-2-q-surge-levels-gr"/>
  <text x="54" y="315" text-anchor="end" class="esys-2-q-surge-levels-s">0</text>
