<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-cell-3-calvin-carbon d-cell-3-calvin-carbon">
<title id="t-cell-3-calvin-carbon">그림 세포와 물질대사 3-2 캘빈 회로의 탄소 수 흐름</title>
<desc id="d-cell-3-calvin-carbon">CO₂ 3분자 기준으로, RuBP 3분자(15C)가 CO₂ 3분자(3C)를 고정해 3PG 6분자(18C)가 되고, ATP 6과 NADPH 6으로 환원되어 G3P 6분자(18C)가 된다. 그중 5분자(15C)는 ATP 3을 써서 RuBP 3분자로 재생되고 1분자(3C)가 회로 밖으로 나간다. 모식도.</desc>
<style>
.c3cv-lbl{font-size:13px;fill:var(--fig-ink)} .c3cv-b{font-size:14px;font-weight:700;fill:var(--fig-ink)} .c3cv-sm{font-size:13px;fill:var(--fig-muted)} .c3cv-arr{fill:none;stroke:var(--fig-ink);stroke-width:2} .c3cv-ah{fill:var(--fig-ink)} .c3cv-lead{fill:none;stroke:var(--fig-muted);stroke-width:1}
.c3cv-node{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2}
.c3cv-cyc{fill:none;stroke:var(--fig-green);stroke-width:3} .c3cv-cych{fill:var(--fig-green)}
.c3cv-in{fill:none;stroke:var(--fig-amber);stroke-width:2.2} .c3cv-inh{fill:var(--fig-amber)}
.c3cv-st{fill:var(--fig-soft-teal);opacity:0.45}
.c3cv-c{font-size:13px;fill:var(--fig-ink);font-weight:600}
.c3cv-am{font-size:13px;fill:var(--fig-amber);font-weight:600}
.c3cv-reg{font-size:14px;font-weight:700;fill:var(--fig-teal)}
</style>
<rect x="0" y="0" width="720" height="420" rx="0" class="c3cv-st"/><text x="16" y="28" class="c3cv-reg">스트로마</text><rect x="280" y="44" width="160" height="52" rx="12" class="c3cv-node"/><text x="360" y="65" text-anchor="middle" class="c3cv-b">RuBP 3분자</text><text x="360" y="85" text-anchor="middle" class="c3cv-lbl">5C × 3 = 15C</text><rect x="460" y="254" width="160" height="52" rx="12" class="c3cv-node"/><text x="540" y="275" text-anchor="middle" class="c3cv-b">3PG 6분자</text><text x="540" y="295" text-anchor="middle" class="c3cv-lbl">3C × 6 = 18C</text><rect x="100" y="254" width="160" height="52" rx="12" class="c3cv-node"/><text x="180" y="275" text-anchor="middle" class="c3cv-b">G3P 6분자</text><text x="180" y="295" text-anchor="middle" class="c3cv-lbl">3C × 6 = 18C</text><path d="M442 75 Q540 90 543 248" class="c3cv-cyc"/><path d="M543.0 253.0 L537.0 242.6 L549.0 242.6 Z" class="c3cv-cych"/><path d="M458 284 L266 284" class="c3cv-cyc"/><path d="M261.0 284.0 L271.4 278.0 L271.4 290.0 Z" class="c3cv-cych"/><path d="M184 252 Q180 90 274 72" class="c3cv-cyc"/><path d="M279.0 71.0 L269.8 78.7 L267.7 66.9 Z" class="c3cv-cych"/><path d="M660 112 L520 112" class="c3cv-in"/><path d="M514.0 112.0 L522.7 107.0 L522.7 117.0 Z" class="c3cv-inh"/><text x="560" y="100" class="c3cv-am">CO₂ 3분자(3C)</text><text x="566" y="166" class="c3cv-b">① 탄소 고정</text><text x="566" y="186" class="c3cv-sm">효소: 루비스코</text><text x="360" y="274" text-anchor="middle" class="c3cv-b">② 환원</text><path d="M360 318 L360 296" class="c3cv-in"/><path d="M360.0 291.0 L365.0 299.7 L355.0 299.7 Z" class="c3cv-inh"/><text x="360" y="336" text-anchor="middle" class="c3cv-am">ATP 6 · NADPH 6 사용</text><text x="360" y="356" text-anchor="middle" class="c3cv-sm">(ADP · Pᵢ · NADP⁺는 명반응으로 돌아간다)</text><text x="40" y="146" class="c3cv-b">③ RuBP 재생</text><text x="40" y="168" class="c3cv-lbl">G3P 5분자(15C)</text><text x="40" y="188" class="c3cv-am">+ ATP 3</text><path d="M130 308 L130 352" class="c3cv-arr"/><path d="M130.0 358.0 L125.0 349.3 L135.0 349.3 Z" class="c3cv-ah"/><text x="40" y="380" class="c3cv-c">G3P 1분자(3C) → 회로 밖으로</text><text x="40" y="400" class="c3cv-sm">포도당 · 설탕 · 녹말 합성에 쓰인다</text><text x="360" y="160" text-anchor="middle" class="c3cv-c">탄소 장부: 15 + 3 = 18 = 15 + 3</text><text x="360" y="184" text-anchor="middle" class="c3cv-lbl">CO₂ 3분자 → G3P 1분자</text><text x="360" y="206" text-anchor="middle" class="c3cv-am">ATP 9 · NADPH 6</text><text x="704" y="400" text-anchor="end" class="c3cv-sm">포도당 1분자(G3P 2분자): CO₂ 6, ATP 18, NADPH 12</text></svg>
