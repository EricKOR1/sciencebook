<rect x="24.0" y="30.0" width="196.0" height="78.0" rx="10" class="m101i-fte"/>
<text x="38.0" y="55.0" class="m101i-b15">① 관찰·문제 인식</text>
<text x="38.0" y="77.0" class="m101i-smi">창가 화분만 시든다.</text>
<text x="38.0" y="95.0" class="m101i-smi">햇빛이 강하면 시들까?</text>
<rect x="262.0" y="30.0" width="196.0" height="78.0" rx="10" class="m101i-fvi"/>
<text x="276.0" y="55.0" class="m101i-b15">② 가설 설정</text>
<text x="276.0" y="77.0" class="m101i-smi">햇빛을 오래 받으면 흙이</text>
<text x="276.0" y="95.0" class="m101i-smi">빨리 말라 시들 것이다.</text>
<rect x="500.0" y="30.0" width="196.0" height="78.0" rx="10" class="m101i-fbl"/>
<text x="514.0" y="55.0" class="m101i-b15">③ 탐구 설계</text>
<text x="514.0" y="77.0" class="m101i-smi">창가와 그늘에 두고</text>
<text x="514.0" y="95.0" class="m101i-smi">물 주는 양은 같게 한다.</text>
<rect x="500.0" y="196.0" width="196.0" height="78.0" rx="10" class="m101i-fbl"/>
<text x="514.0" y="221.0" class="m101i-b15">④ 탐구 수행</text>
<text x="514.0" y="243.0" class="m101i-smi">2주 동안 흙과 잎을</text>
<text x="514.0" y="261.0" class="m101i-smi">관찰해 기록한다.</text>
<rect x="262.0" y="196.0" width="196.0" height="78.0" rx="10" class="m101i-fam"/>
<text x="276.0" y="221.0" class="m101i-b15">⑤ 자료 해석</text>
<text x="276.0" y="243.0" class="m101i-smi">창가 화분의 흙이</text>
<text x="276.0" y="261.0" class="m101i-smi">더 빨리 말랐다.</text>
<rect x="24.0" y="196.0" width="196.0" height="78.0" rx="10" class="m101i-fgr"/>
<text x="38.0" y="221.0" class="m101i-b15">⑥ 결론 도출</text>
<text x="38.0" y="243.0" class="m101i-smi">가설이 맞는지</text>
<text x="38.0" y="261.0" class="m101i-smi">판단한다.</text>
<line x1="224.0" y1="69.0" x2="251.7" y2="69.0" class="m101i-ar"/>
<path d="M258.0 69.0 L249.8 72.7 L249.8 65.3 Z" class="m101i-ah"/>
<line x1="462.0" y1="69.0" x2="489.7" y2="69.0" class="m101i-ar"/>
<path d="M496.0 69.0 L487.8 72.7 L487.8 65.3 Z" class="m101i-ah"/>
<line x1="598.0" y1="112.0" x2="598.0" y2="185.7" class="m101i-ar"/>
<path d="M598.0 192.0 L594.3 183.8 L601.7 183.8 Z" class="m101i-ah"/>
<line x1="496.0" y1="235.0" x2="468.3" y2="235.0" class="m101i-ar"/>
<path d="M462.0 235.0 L470.2 231.3 L470.2 238.7 Z" class="m101i-ah"/>
<line x1="258.0" y1="235.0" x2="230.3" y2="235.0" class="m101i-ar"/>
<path d="M224.0 235.0 L232.2 231.3 L232.2 238.7 Z" class="m101i-ah"/>
<path d="M150.0 194.0 L150.0 152.0 L330.0 152.0 L330.0 118.3" class="m101i-avi"/>
<path d="M330.0 112.0 L333.7 120.2 L326.3 120.2 Z" class="m101i-cvi"/>
<text x="160.0" y="174.0" class="m101i-tvi">결과가 가설과 다르면 → 가설을 고쳐 다시 탐구</text>
<line x1="122.0" y1="278.0" x2="122.0" y2="307.7" class="m101i-ar"/>
<path d="M122.0 314.0 L118.3 305.8 L125.7 305.8 Z" class="m101i-ah"/>
<text x="132.0" y="300.0" class="m101i-sm">가설이 지지되면</text>
<rect x="24.0" y="318.0" width="420.0" height="56.0" rx="10" class="m101i-fre"/>
<text x="38.0" y="343.0" class="m101i-b15">⑦ 의사소통</text>
<text x="38.0" y="363.0" class="m101i-smi">결과를 발표하고, 다른 반에서도 같은 결과가 나오는지 확인한다.</text>
<text x="470.0" y="340.0" class="m101i-sm">탐구 순서는 상황에 따라</text>
<text x="470.0" y="358.0" class="m101i-sm">조금씩 달라질 수 있다.</text>
</svg>
