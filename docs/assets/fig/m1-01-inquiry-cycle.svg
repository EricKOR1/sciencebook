  .m101i-are{fill:none;stroke:var(--fig-red);stroke-width:2.4}
  .m101i-fgr{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2}
  .m101i-sgr{fill:var(--fig-soft-green)}
  .m101i-ogr{fill:none;stroke:var(--fig-green);stroke-width:2}
  .m101i-cgr{fill:var(--fig-green)}
  .m101i-tgr{font-size:14px;font-weight:700;fill:var(--fig-green)}
  .m101i-agr{fill:none;stroke:var(--fig-green);stroke-width:2.4}
  .m101i-fam{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2}
  .m101i-sam{fill:var(--fig-soft-amber)}
  .m101i-oam{fill:none;stroke:var(--fig-amber);stroke-width:2}
  .m101i-cam{fill:var(--fig-amber)}
  .m101i-tam{font-size:14px;font-weight:700;fill:var(--fig-amber)}
  .m101i-aam{fill:none;stroke:var(--fig-amber);stroke-width:2.4}
  .m101i-fvi{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2}
