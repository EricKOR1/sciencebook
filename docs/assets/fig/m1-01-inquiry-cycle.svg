<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-m1-01-inquiry-cycle d-m1-01-inquiry-cycle">
<title id="t-m1-01-inquiry-cycle">그림 중1-1-2 과학적 탐구 과정의 흐름 — 시드는 화분의 예</title>
<desc id="d-m1-01-inquiry-cycle">관찰·문제 인식에서 가설 설정, 탐구 설계, 탐구 수행, 자료 해석을 거쳐 결론을 내린다. 결과가 가설과 다르면 가설을 고쳐 다시 탐구하고, 가설이 지지되면 결과를 발표하여 다른 사람과 확인한다.</desc>
<style>
  .m101i-ttl{font-size:16px;font-weight:700;fill:var(--fig-ink)}
  .m101i-ink{font-size:14px;fill:var(--fig-ink)}
  .m101i-b{font-size:14px;font-weight:700;fill:var(--fig-ink)}
  .m101i-b15{font-size:15px;font-weight:700;fill:var(--fig-ink)}
  .m101i-sm{font-size:13px;fill:var(--fig-muted)}
  .m101i-smi{font-size:13px;fill:var(--fig-ink)}
  .m101i-acc{font-size:14px;font-weight:700;fill:var(--fig-accent)}
  .m101i-box{fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1.2}
  .m101i-panel{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2}
  .m101i-panel0{fill:var(--fig-panel)}
  .m101i-ln{fill:none;stroke:var(--fig-ink);stroke-width:2}
