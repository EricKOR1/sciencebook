  .m101i-grid{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4}
  .m101i-dash{fill:none;stroke:var(--fig-line);stroke-width:1.3;stroke-dasharray:5 5}
  .m101i-ar{fill:none;stroke:var(--fig-ink);stroke-width:2}
  .m101i-ah{fill:var(--fig-ink)}
  .m101i-lead{fill:none;stroke:var(--fig-muted);stroke-width:1}
  .m101i-dot{fill:var(--fig-muted)}
  .m101i-mut{fill:var(--fig-muted)}
