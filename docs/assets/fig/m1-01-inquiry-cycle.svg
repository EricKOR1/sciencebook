  .m101i-sbl{fill:var(--fig-soft-blue)}
  .m101i-obl{fill:none;stroke:var(--fig-blue);stroke-width:2}
  .m101i-cbl{fill:var(--fig-blue)}
  .m101i-tbl{font-size:14px;font-weight:700;fill:var(--fig-blue)}
  .m101i-abl{fill:none;stroke:var(--fig-blue);stroke-width:2.4}
