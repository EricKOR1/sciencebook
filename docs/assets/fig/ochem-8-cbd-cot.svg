<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-ochem-8-cbd-cot d-ochem-8-cbd-cot">
  <title id="t-ochem-8-cbd-cot">그림 유기화학 8-16 사이클로뷰타다이엔과 사이클로옥타테트라엔의 구조</title>
  <desc id="d-ochem-8-cbd-cot">왼쪽: 사이클로뷰타다이엔은 짧은 C=C와 긴 C–C가 번갈아 있는 직사각형이다. 가상의 정사각형(점선)은 축퇴 쌍에 홀전자 2개가 남아 더 불안정하다. 가운데: 사이클로옥타테트라엔은 통 모양으로 접혀 네 C=C가 통의 위 테두리와 아래 테두리에 번갈아 놓이고, 이웃한 C=C의 p 오비탈이 크게 비틀려(C=C–C=C 이면각, RDKit 구조에서 약 55°) 겹침이 크게 줄어든다(C=C 약 133 pm, C–C 약 146 pm, 비방향족). 오른쪽: 칼륨 2당량으로 환원하면 모든 C–C가 같은 평면 정팔각형 C₈H₈²⁻(10 π 전자, 방향족)가 되고 반대이온은 2K⁺이다.</desc>
