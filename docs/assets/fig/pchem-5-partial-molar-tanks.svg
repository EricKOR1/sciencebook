  <text x="233.0" y="312.0" text-anchor="middle" class="pchem-5-partial-molar-tanks-s">55 cm³ &lt; 58.7 cm³</text>
  <text x="540.0" y="28.0" text-anchor="middle" class="pchem-5-partial-molar-tanks-b">(나) 아주 큰 에탄올 탱크에 물 1 mol</text>
