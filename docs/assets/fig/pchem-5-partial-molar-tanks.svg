  <text x="136.0" y="155.2" text-anchor="start" class="pchem-5-partial-molar-tanks-s">나중 수위</text>
  <line x1="312.0" y1="220.0" x2="312.0" y2="163.2" style="stroke:var(--fig-red);stroke-width:1.6;stroke-linecap:round"/>
  <polygon points="312.0,163.2 314.7,169.7 309.3,169.7" style="fill:var(--fig-red);stroke:none"/>
  <polygon points="312.0,220.0 309.3,213.6 314.7,213.6" style="fill:var(--fig-red);stroke:none"/>
  <rect x="222.2" y="137.2" width="106.8" height="19.0" rx="2" style="fill:var(--fig-panel);stroke:none"/>
