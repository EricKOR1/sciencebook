<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-pchem-5-partial-molar-tanks d-pchem-5-partial-molar-tanks">
  <title id="t-pchem-5-partial-molar-tanks">그림 물리화학 5-1 부분 몰 부피의 뜻</title>
  <desc id="d-pchem-5-partial-molar-tanks">왼쪽: 아주 큰 물 탱크에 에탄올 1 mol(순수할 때 58.7 cm³)을 부으면 수위는 약 55 cm³만큼만 오른다. 오른쪽: 아주 큰 에탄올 탱크에 물 1 mol(순수할 때 18.07 cm³)을 부으면 수위는 약 14 cm³만 오른다. 탱크가 아주 커서 조성은 사실상 변하지 않는다. 모식도이며 수위 상승 폭만 부피에 비례하게 그렸다.</desc>
  <style>.pchem-5-partial-molar-tanks-t{font-size:14px;fill:var(--fig-ink)} .pchem-5-partial-molar-tanks-s{font-size:13px;fill:var(--fig-muted)} .pchem-5-partial-molar-tanks-b{font-size:15px;font-weight:600;fill:var(--fig-ink)} .pchem-5-partial-molar-tanks-i{font-size:14px;font-style:italic;fill:var(--fig-ink)} </style>
  <text x="190.0" y="28.0" text-anchor="middle" class="pchem-5-partial-molar-tanks-b">(가) 아주 큰 물 탱크에 에탄올 1 mol</text>
