  <line x1="432.0" y1="130.0" x2="444.0" y2="130.0" style="stroke:var(--fig-muted);stroke-width:1;stroke-linecap:round"/>
  <line x1="432.0" y1="110.0" x2="444.0" y2="110.0" style="stroke:var(--fig-muted);stroke-width:1;stroke-linecap:round"/>
  <line x1="432.0" y1="90.0" x2="444.0" y2="90.0" style="stroke:var(--fig-muted);stroke-width:1;stroke-linecap:round"/>
  <text x="421.0" y="210.0" text-anchor="middle" class="pchem-5-partial-molar-tanks-t">물 1 mol</text>
  <text x="421.0" y="228.0" text-anchor="middle" class="pchem-5-partial-molar-tanks-s">순수: 18.07 cm³</text>
