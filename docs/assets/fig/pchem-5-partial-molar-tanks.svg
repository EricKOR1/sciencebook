  <line x1="472.0" y1="205.3" x2="694.0" y2="205.3" style="stroke:var(--fig-ink);stroke-width:1.6;stroke-linecap:round"/>
  <text x="486.0" y="238.0" text-anchor="start" class="pchem-5-partial-molar-tanks-s">처음 수위</text>
  <text x="486.0" y="198.3" text-anchor="start" class="pchem-5-partial-molar-tanks-s">나중 수위</text>
  <line x1="662.0" y1="220.0" x2="662.0" y2="206.3" style="stroke:var(--fig-red);stroke-width:1.6;stroke-linecap:round"/>
  <polygon points="662.0,206.3 664.7,212.7 659.3,212.7" style="fill:var(--fig-red);stroke:none"/>
  <polygon points="662.0,220.0 659.3,213.6 664.7,213.6" style="fill:var(--fig-red);stroke:none"/>
  <rect x="572.2" y="180.3" width="106.8" height="19.0" rx="2" style="fill:var(--fig-panel);stroke:none"/>
  <text x="676.0" y="193.3" text-anchor="end" class="pchem-5-partial-molar-tanks-t" style="fill:var(--fig-red)">증가량 ≈ 14 cm³</text>
  <text x="583.0" y="312.0" text-anchor="middle" class="pchem-5-partial-molar-tanks-s">14 cm³ &lt; 18.07 cm³</text>
  <rect x="110.0" y="334.0" width="500.0" height="32.0" rx="6" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1"/>
  <text x="360.0" y="355.0" text-anchor="middle" class="pchem-5-partial-molar-tanks-b">부분 몰 부피 = 큰 계에 1 mol 넣을 때의 부피 증가</text>
