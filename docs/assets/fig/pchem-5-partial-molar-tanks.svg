  <line x1="82.0" y1="150.0" x2="94.0" y2="150.0" style="stroke:var(--fig-muted);stroke-width:1;stroke-linecap:round"/>
  <line x1="82.0" y1="130.0" x2="94.0" y2="130.0" style="stroke:var(--fig-muted);stroke-width:1;stroke-linecap:round"/>
  <line x1="82.0" y1="110.0" x2="94.0" y2="110.0" style="stroke:var(--fig-muted);stroke-width:1;stroke-linecap:round"/>
  <line x1="82.0" y1="90.0" x2="94.0" y2="90.0" style="stroke:var(--fig-muted);stroke-width:1;stroke-linecap:round"/>
  <text x="71.0" y="210.0" text-anchor="middle" class="pchem-5-partial-molar-tanks-t">에탄올 1 mol</text>
  <text x="71.0" y="228.0" text-anchor="middle" class="pchem-5-partial-molar-tanks-s">순수: 58.7 cm³</text>
  <path d="M71.0,62 C71.0,36 154,36 172,76" style="fill:none;stroke:var(--fig-ink);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round"/>
  <polygon points="172.0,76.0 164.2,71.5 169.8,67.3" style="fill:var(--fig-ink);stroke:none"/>
  <rect x="128.0" y="162.2" width="210.0" height="127.8" rx="0" style="fill:var(--fig-soft-blue);stroke:none"/>
  <rect x="128.0" y="162.2" width="210.0" height="57.8" rx="0" style="fill:var(--fig-soft-amber);stroke:none;opacity:0.55"/>
