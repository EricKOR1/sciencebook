<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="t-3-6-sickle-cell d-3-6-sickle-cell">
  <title id="t-3-6-sickle-cell">그림 3-6-3 염기 하나의 차이가 적혈구 모양까지 이어지는 과정</title>
  <desc id="d-3-6-sickle-cell">헤모글로빈 유전자의 주형 가닥 CTC가 CAC로 바뀌면 mRNA 코돈이 GAG에서 GUG로, 아미노산이 글루탐산에서 발린으로 바뀐다. 그 결과 헤모글로빈이 서로 달라붙어 긴 섬유를 만들고 적혈구가 낫 모양이 된다. 모식도(크기 비율은 실제와 다름).</desc>
  <style>
    .3-6-sickle-cell-lbl{font-size:15px;fill:var(--fig-ink)} .3-6-sickle-cell-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .3-6-sickle-cell-sm{font-size:13px;fill:var(--fig-muted)} .3-6-sickle-cell-ink{font-size:13px;fill:var(--fig-ink)}
    .3-6-sickle-cell-ax{stroke:var(--fig-ink);stroke-width:1.5;fill:none} .3-6-sickle-cell-grid{stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 4;fill:none}
  </style>
