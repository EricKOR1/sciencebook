<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-cell-2-induced-fit d-cell-2-induced-fit">
<title id="t-cell-2-induced-fit">그림 세포와 물질대사 2-2 효소–기질 복합체와 유도 적합</title>
<desc id="d-cell-2-induced-fit">기질이 효소의 활성 부위에 결합하면 효소의 모양이 기질을 꼭 감싸도록 바뀌어 효소–기질 복합체가 된다(유도 적합). 기질의 결합이 끊어져 생성물이 되면 활성 부위에서 떨어져 나가고, 효소는 원래 모양으로 돌아와 다시 쓰인다. 모식도.</desc>
<style>
.c2if-lbl{font-size:13px;fill:var(--fig-ink)} .c2if-b{font-size:14px;font-weight:700;fill:var(--fig-ink)} .c2if-sm{font-size:13px;fill:var(--fig-muted)} .c2if-arr{fill:none;stroke:var(--fig-ink);stroke-width:2} .c2if-ah{fill:var(--fig-ink)} .c2if-lead{fill:none;stroke:var(--fig-muted);stroke-width:1}
.c2if-enz{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2;stroke-linejoin:round}
.c2if-sub{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2;stroke-linejoin:round}
.c2if-cut{stroke:var(--fig-red);stroke-width:2;stroke-dasharray:3 3;fill:none}
.c2if-num{font-size:14px;font-weight:700;fill:var(--fig-accent)}
</style>
<path d="M33 190 C23 140 39 118 63 118 L71 118 L83 150 L107 150 L119 118 L127 118 C151 118 167 140 157 190 C145 212 45 212 33 190 Z" class="c2if-enz"/><polygon points="80,66 110,66 106,103 84,103" class="c2if-sub"/><path d="M135 90 L115 132" class="c2if-lead"/><text x="115" y="84" class="c2if-sm">활성 부위</text><text x="67" y="86" text-anchor="end" class="c2if-sm">기질</text><path d="M213 190 C203 140 219 118 243 118 L257 108 L263 150 L287 150 L293 108 L307 118 C331 118 347 140 337 190 C325 212 225 212 213 190 Z" class="c2if-enz"/><polygon points="260,112 290,112 286,149 264,149" class="c2if-sub"/><path d="M393 190 C383 140 399 118 423 118 L437 108 L443 150 L467 150 L473 108 L487 118 C511 118 527 140 517 190 C505 212 405 212 393 190 Z" class="c2if-enz"/><polygon points="438,112 452,112 452,149 442,149" class="c2if-sub" transform="rotate(0 445 130)"/><polygon points="458,112 472,112 468,149 458,149" class="c2if-sub" transform="rotate(0 465 130)"/><line x1="455" y1="104" x2="455" y2="156" class="c2if-cut"/><path d="M573 190 C563 140 579 118 603 118 L611 118 L623 150 L647 150 L659 118 L667 118 C691 118 707 140 697 190 C685 212 585 212 573 190 Z" class="c2if-enz"/><polygon points="602,60 616,60 616,97 606,97" class="c2if-sub" transform="rotate(-25 609 78)"/><polygon points="654,60 668,60 664,97 654,97" class="c2if-sub" transform="rotate(25 661 78)"/><text x="95" y="34" text-anchor="middle" class="c2if-num">① 기질이 다가감</text><text x="95" y="232" text-anchor="middle" class="c2if-lbl">효소(E) + 기질(S)</text><path d="M165 160 L201 160" class="c2if-arr"/><path d="M205.0 160.0 L196.3 165.0 L196.3 155.0 Z" class="c2if-ah"/><text x="275" y="34" text-anchor="middle" class="c2if-num">② 결합 · 모양이 맞춰짐</text><text x="275" y="232" text-anchor="middle" class="c2if-lbl">효소–기질 복합체(ES)</text><path d="M345 160 L381 160" class="c2if-arr"/><path d="M385.0 160.0 L376.3 165.0 L376.3 155.0 Z" class="c2if-ah"/><text x="455" y="34" text-anchor="middle" class="c2if-num">③ 결합이 끊어짐</text><text x="455" y="232" text-anchor="middle" class="c2if-lbl">생성물이 만들어짐</text><path d="M525 160 L561 160" class="c2if-arr"/><path d="M565.0 160.0 L556.3 165.0 L556.3 155.0 Z" class="c2if-ah"/><text x="635" y="34" text-anchor="middle" class="c2if-num">④ 생성물이 떨어짐</text><text x="635" y="232" text-anchor="middle" class="c2if-lbl">효소(E) + 생성물(P)</text><text x="275" y="252" text-anchor="middle" class="c2if-sm">유도 적합</text><path d="M635 260 L635 276 L95 276 L95 264" class="c2if-arr"/><path d="M95.0 260.0 L100.0 268.7 L90.0 268.7 Z" class="c2if-ah"/><text x="365" y="294" text-anchor="middle" class="c2if-sm">효소는 반응 뒤에도 변하지 않아 새 기질과 다시 결합한다. 모식도.</text></svg>
