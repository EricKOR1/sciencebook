  <text x="360.0" y="352.0" text-anchor="middle" class="f62ft-t">처음 몇 해는 잘 맞는 듯했지만, 검색량은 환자 수를 직접 잰 값이 아니어서 크게 빗나갔다.</text>
  <text x="360.0" y="374.0" text-anchor="middle" class="f62ft-s">모식도 — 곡선의 모양과 높이는 설명을 위한 것이며 실제 수치가 아니다.</text>

