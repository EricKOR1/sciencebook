<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="t-6-2-flu-trends d-6-2-flu-trends">
  <title id="t-6-2-flu-trends">그림 6-2-4 검색량으로 한 독감 예측과 실제 — 상관과 측정의 차이</title>
  <desc id="d-6-2-flu-trends">검색량으로 한 독감 예측(점선)이 처음 몇 해의 겨울에는 병원 보고로 집계한 실제 값(실선)과 비슷했지만, 2012~2013년 겨울에는 실제의 약 2배로 크게 빗나간 사례를 나타낸 모식도이다. 곡선은 실제 수치가 아니다.</desc>
