<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="t-6-3-robot-vacuum d-6-3-robot-vacuum">
  <title id="t-6-3-robot-vacuum">그림 6-3-1 로봇청소기 속의 감지–판단–동작</title>
  <desc id="d-6-3-robot-vacuum">로봇청소기를 위에서 본 모식도이다. 센서(파랑)가 장애물·바닥·충돌을 감지하면 제어 장치(보라)가 판단하고, 바퀴 모터와 솔 모터(주황)가 동작한다. 점선은 바닥 쪽에 있는 부품이다.</desc>
  <style>
    .f63rv-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .f63rv-tx{font-size:13px;fill:var(--fig-ink)}
    .f63rv-sm{font-size:12px;fill:var(--fig-muted)}
    .f63rv-s{font-size:13px;fill:var(--fig-blue);font-weight:600}
    .f63rv-a{font-size:13px;fill:var(--fig-amber);font-weight:600}
    .f63rv-lead{stroke:var(--fig-muted);stroke-width:1.2}
    .f63rv-arr{fill:var(--fig-ink)}
  </style>
  <!-- 몸체 -->
  <circle cx="215" cy="195" r="115" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:2.5"/>
  <path d="M120 130 A 115 115 0 0 1 310 130" style="fill:none;stroke:var(--fig-blue);stroke-width:7;stroke-linecap:round"/>
  <rect x="195" y="84" width="40" height="12" rx="4" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <!-- 바닥 감지 센서(아래쪽) -->
  <circle cx="148" cy="138" r="8" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2;stroke-dasharray:3 2"/>
  <circle cx="282" cy="138" r="8" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2;stroke-dasharray:3 2"/>
  <circle cx="128" cy="246" r="8" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2;stroke-dasharray:3 2"/>
  <circle cx="302" cy="246" r="8" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2;stroke-dasharray:3 2"/>
  <!-- 바퀴 모터 -->
  <rect x="112" y="168" width="20" height="54" rx="5" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2.5;stroke-dasharray:5 3"/>
  <rect x="298" y="168" width="20" height="54" rx="5" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2.5;stroke-dasharray:5 3"/>
  <!-- 솔 모터 -->
  <rect x="170" y="262" width="90" height="22" rx="8" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2.5;stroke-dasharray:5 3"/>
  <!-- 제어 장치 -->
  <g style="stroke:var(--fig-violet);stroke-width:2">
    <line x1="180" y1="148" x2="180" y2="140"/><line x1="200" y1="148" x2="200" y2="140"/><line x1="220" y1="148" x2="220" y2="140"/><line x1="240" y1="148" x2="240" y2="140"/>
    <line x1="180" y1="188" x2="180" y2="196"/><line x1="200" y1="188" x2="200" y2="196"/><line x1="220" y1="188" x2="220" y2="196"/><line x1="240" y1="188" x2="240" y2="196"/>
  </g>
  <rect x="166" y="148" width="98" height="40" rx="6" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2.5"/>
  <text x="215" y="173" text-anchor="middle" class="f63rv-tx" style="font-weight:600">제어 장치</text>
  <!-- 배터리 -->
  <rect x="180" y="208" width="70" height="30" rx="5" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:2"/>
  <rect x="250" y="217" width="5" height="12" style="fill:var(--fig-teal)"/>
  <text x="215" y="228" text-anchor="middle" class="f63rv-sm" style="fill:var(--fig-ink)">배터리</text>

  <!-- 이름표 -->
  <text x="215" y="40" text-anchor="middle" class="f63rv-s">장애물 감지 센서</text>
  <line x1="215" y1="46" x2="215" y2="83" class="f63rv-lead"/>
  <text x="16" y="70" class="f63rv-s">충돌 센서(앞 범퍼)</text>
  <line x1="80" y1="76" x2="128" y2="120" class="f63rv-lead"/>
  <text x="16" y="186" class="f63rv-a">바퀴 모터</text>
  <text x="16" y="203" class="f63rv-sm">(왼쪽·오른쪽)</text>
  <line x1="84" y1="194" x2="111" y2="194" class="f63rv-lead"/>
  <text x="300" y="70" class="f63rv-s">바닥 감지 센서</text>
  <text x="300" y="86" class="f63rv-sm">(아래쪽, 계단 감지)</text>
  <line x1="318" y1="91" x2="288" y2="130" class="f63rv-lead"/>
  <text x="120" y="340" text-anchor="middle" class="f63rv-a">솔 모터</text>
  <line x1="140" y1="328" x2="178" y2="285" class="f63rv-lead"/>
  <text x="330" y="330" class="f63rv-tx" style="fill:var(--fig-teal);font-weight:600">배터리(전원)</text>
  <text x="330" y="347" class="f63rv-sm">충전량도 측정</text>
  <line x1="330" y1="320" x2="252" y2="236" class="f63rv-lead"/>
  <text x="215" y="364" text-anchor="middle" class="f63rv-sm">위에서 본 모식도 · 점선 = 바닥 쪽 부품</text>

  <!-- 감지–판단–동작 고리 -->
  <text x="474" y="40" class="f63rv-h">의자 다리를 만났을 때</text>
  <rect x="474" y="56" width="206" height="62" rx="10" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <text x="488" y="80" class="f63rv-tx" style="font-weight:600;fill:var(--fig-blue)">감지 — 센서</text>
  <text x="488" y="102" class="f63rv-tx">"앞에 장애물이 있다"</text>
  <rect x="474" y="148" width="206" height="62" rx="10" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2"/>
  <text x="488" y="172" class="f63rv-tx" style="font-weight:600;fill:var(--fig-violet)">판단 — 제어 장치</text>
  <text x="488" y="194" class="f63rv-tx">"멈추고 방향을 바꾸자"</text>
  <rect x="474" y="240" width="206" height="62" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <text x="488" y="264" class="f63rv-tx" style="font-weight:600;fill:var(--fig-amber)">동작 — 구동기</text>
  <text x="488" y="286" class="f63rv-tx">좌우 바퀴를 다르게 돌림</text>
  <line x1="577" y1="118" x2="577" y2="138" style="stroke:var(--fig-ink);stroke-width:2.5"/><path d="M577 147 l-7 -11 h14 z" class="f63rv-arr"/>
  <line x1="577" y1="210" x2="577" y2="230" style="stroke:var(--fig-ink);stroke-width:2.5"/><path d="M577 239 l-7 -11 h14 z" class="f63rv-arr"/>
  <path d="M680 271 H700 V87 H692" style="fill:none;stroke:var(--fig-ink);stroke-width:2;stroke-dasharray:6 4"/>
  <path d="M682 87 l11 -7 v14 z" class="f63rv-arr"/>
  <text x="577" y="326" text-anchor="middle" class="f63rv-sm">움직이면 주변이 바뀌고, 다시 감지한다</text>
  <text x="577" y="344" text-anchor="middle" class="f63rv-sm">(되먹임)</text>
</svg>
