<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-ubio-10-auxin-experiments d-ubio-10-auxin-experiments">
  <title id="t-ubio-10-auxin-experiments">그림 일반생명과학 10-10 옥신을 찾아낸 세 실험</title>
  <desc id="d-ubio-10-auxin-experiments">벼과 식물 자엽초를 이용한 실험 모식도. 다윈 부자: 왼쪽에서 빛을 비추면 끝이 있는 자엽초는 빛 쪽으로 굽지만, 끝을 불투명한 덮개로 가리거나 잘라 내면 굽지 않는다. 보이센–옌센: 끝과 아래 사이에 물질이 통과하는 젤라틴을 끼우면 굽고, 통과하지 못하는 운모 조각을 끼우면 굽지 않는다. 벤트: 자른 끝을 한천 조각에 올려 두었다가 그 한천 조각을 끝이 잘린 자엽초의 한쪽에 올리면 어둠 속에서도 한천 반대쪽으로 굽는다.</desc>
  <style>.ubio-10-auxin-experiments-t{font-size:14px;fill:var(--fig-ink)} .ubio-10-auxin-experiments-b{font-size:14px;fill:var(--fig-ink);font-weight:700} .ubio-10-auxin-experiments-s{font-size:13px;fill:var(--fig-muted)} .ubio-10-auxin-experiments-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-10-auxin-experiments-lead{stroke:var(--fig-muted);stroke-width:1;fill:none}</style>
