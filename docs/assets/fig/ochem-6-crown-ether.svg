<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-ochem-6-crown-ether d-ochem-6-crown-ether">
  <title id="t-ochem-6-crown-ether">그림 유기화학 6-13 18-크라운-6과 K⁺ 착물</title>
  <desc id="d-ochem-6-crown-ether">왼쪽: 위에서 본 18-크라운-6. 산소 6개가 고리 안쪽을 향하고 가운데 K⁺에 이온–쌍극자 인력(점선 6개)으로 배위한다. 구멍 지름은 약 270~320 pm이다. 오른쪽: 비스듬히 본 공간 채움 모식도. 바깥쪽 CH₂ 표면(회색)은 소수성, 안쪽 O(빨강)는 친수성이며, K⁺를 감싼 착물은 유기 용매에 녹는다. 짝음이온 F⁻(초록)는 용매화되지 않은 채 느슨하게 떨어져 있어 친핵성이 크다(벌거벗은 F⁻). 아래 표: 이온 반지름과 맞는 크라운 에터 — Li⁺ 76 pm·12-크라운-4, Na⁺ 102 pm·15-크라운-5, K⁺ 138 pm·18-크라운-6.</desc>
