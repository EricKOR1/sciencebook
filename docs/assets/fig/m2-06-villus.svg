  <title id="t-m2-06-villus">그림 중2-6-3 소장 안쪽 벽의 주름과 융털</title>
  <desc id="d-m2-06-villus">소장 안쪽 벽에는 주름이 있고, 주름 표면에 손가락 모양의 융털이 빽빽하다. 융털 속 모세혈관으로는 포도당·아미노산 같은 물에 잘 녹는 영양소가, 가운데 암죽관으로는 지방산·모노글리세리드가 흡수된다. 모식도이다.</desc>
