  <title id="t-earth-2-q-unconformity-dating">그림 지구과학 2-12 문제 7의 지질 단면</title>
  <desc id="d-earth-2-q-unconformity-dating">현무암 C의 울퉁불퉁한 윗면을 부정합으로 덮고 퇴적층 A가 쌓여 있으며, 화강암 B가 아래에서 올라와 A를 관입한 지질 단면의 모식도이다.</desc>
