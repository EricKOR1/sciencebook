<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-uearth-1-rock-cycle-plates d-uearth-1-rock-cycle-plates">
  <title id="t-uearth-1-rock-cycle-plates">그림 일반지구과학 1-4 판 환경에서 본 암석의 순환</title>
  <desc id="d-uearth-1-rock-cycle-plates">해령에서 감압 용융으로 생긴 현무암질 해양 지각이 판을 따라 이동해 해구에서 섭입하고, 섭입대에서 물이 빠져나와 생긴 마그마가 대륙에 화강암과 화산암을 더한다. 솟아오른 산맥은 풍화·침식되어 퇴적물이 되고, 대륙 깊은 곳의 암석은 열과 압력을 받아 변성암이 된다. 깊이와 두께를 과장한 단면 모식도이다.</desc>
