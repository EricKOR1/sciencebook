<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-ochem-7-alkane-ms d-ochem-7-alkane-ms">
  <title id="t-ochem-7-alkane-ms">그림 유기화학 7-4 곧은 사슬 알케인과 가지 친 알케인의 질량 스펙트럼</title>
  <desc id="d-ochem-7-alkane-ms">위: 헥세인(M = 86) — 14씩 차이 나는 29·43·57·71 묶음과 뚜렷한 분자 이온 86. 아래: 2,2-다이메틸프로페인(M = 72) — tert-뷰틸 양이온(m/z 57)이 기준 봉우리이고 분자 이온 72는 거의 보이지 않는다. 막대 높이는 전형적인 값(모식도)이며, 오른쪽 구조의 물결선은 가장 쉽게 끊어지는 결합이다.</desc>
