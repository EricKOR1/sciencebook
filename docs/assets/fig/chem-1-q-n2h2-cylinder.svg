  <title id="t-chem-1-q-n2h2-cylinder">그림 화학 1-9 문제 17의 실린더</title>
  <desc id="d-chem-1-q-n2h2-cylinder">온도와 압력이 일정한 실린더에 질소 a mol과 수소 6 mol을 넣고 반응을 끝까지 진행시켰더니 기체의 부피가 반응 전의 1/2이 되었다. 실린더의 크기는 모식적이다.</desc>
