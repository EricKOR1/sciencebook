<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 306" role="img" aria-labelledby="t-phy-2-magnetic-domains d-phy-2-magnetic-domains">
  <title id="t-phy-2-magnetic-domains">그림 물리학 2-1 강자성체의 자기 구역</title>
  <desc id="d-phy-2-magnetic-domains">강자성체 속은 원자 자석이 한 방향으로 정렬된 자기 구역으로 나뉜다. 외부 자기장을 걸면 그 방향의 구역이 커지고, 자기장을 없애도 정렬이 대부분 남아 자석이 된다(모식도).</desc>
