<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="t-umath-8-radial-distribution d-umath-8-radial-distribution">
  <title id="t-umath-8-radial-distribution">그림 수학 도구 8-8 수소 원자의 지름 분포 함수 P(r) = r²R²</title>
  <desc id="d-umath-8-radial-distribution">1s, 2s, 2p, 3s 오비탈의 지름 분포 함수를 같은 가로축 r/a₀(0~25)에 위아래 네 칸으로 그렸다. 1s의 최댓값 r = a₀, 2s의 마디 r = 2a₀, 3s의 마디 r = 1.90a₀와 7.10a₀를 점선으로 표시했다. 칸마다 세로 배율은 다르다.</desc>
