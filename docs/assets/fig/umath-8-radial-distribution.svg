    .u8rd-mx{stroke:var(--fig-green);stroke-width:1.4;stroke-dasharray:4 3;fill:none}
    .u8rd-r{font-size:13px;fill:var(--fig-red);font-weight:600}
    .u8rd-g{font-size:13px;fill:var(--fig-green);font-weight:600}

  </style>
