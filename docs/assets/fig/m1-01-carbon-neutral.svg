<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-m1-01-carbon-neutral d-m1-01-carbon-neutral">
<title id="t-m1-01-carbon-neutral">그림 중1-1-7 탄소 중립 — 순배출량을 0으로</title>
<desc id="d-m1-01-carbon-neutral">지금은 배출하는 온실 기체가 흡수·제거하는 양보다 훨씬 많아 순배출량이 크다. 탄소 중립은 배출을 줄이고 흡수·제거를 늘려 배출량과 흡수·제거량을 같게 하는 것으로, 배출이 0이라는 뜻이 아니다. 막대 길이는 설명을 위한 예시이다.</desc>
