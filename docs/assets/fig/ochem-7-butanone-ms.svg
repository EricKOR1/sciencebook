  <title id="t-ochem-7-butanone-ms">그림 유기화학 7-2 뷰탄-2-온의 전자 이온화 질량 스펙트럼</title>
  <desc id="d-ochem-7-butanone-ms">막대 높이는 상대 세기(기준 봉우리 m/z 43 = 100)의 전형적인 값이다(모식도). m/z 72가 분자 이온, 73이 M+1(약 1.1), 43(CH₃C≡O⁺)과 57(CH₃CH₂C≡O⁺)은 카보닐 탄소 양옆의 α 절단으로 생긴 아실륨 이온이다.</desc>
