<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-uphy-1-rain-wind d-uphy-1-rain-wind">
  <title id="t-uphy-1-rain-wind">그림 일반물리학 1-7 빗속의 자동차와 바람 속의 비행기 — 속도 벡터의 덧셈과 뺄셈</title>
  <desc id="d-uphy-1-rain-wind">(가) 땅에서 연직으로 떨어지는 비(8.0 m/s)를 오른쪽으로 6.0 m/s로 달리는 자동차에서 보면, v비,차 = v비,땅 − v차,땅이므로 앞쪽 위에서 연직과 37°를 이루며 10 m/s로 비스듬히 날아온다(수치는 예시). (나) 동쪽으로 부는 바람 속에서 북쪽 공항으로 가려면 기수를 서쪽으로 편류 수정각만큼 돌려, 대기 속도와 바람 속도의 합(대지 속도)이 정북을 향하게 한다.</desc>
