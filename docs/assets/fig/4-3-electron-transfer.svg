  <rect x="40" y="256" width="640" height="62" rx="6" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1"/>
  <text x="60" y="281" class="et-ox">Mg → Mg²⁺ + 2e⁻</text><text x="232" y="281" class="et-t">전자를 잃음 = 산화</text>
  <text x="60" y="306" class="et-rd">O + 2e⁻ → O²⁻</text><text x="232" y="306" class="et-t">전자를 얻음 = 환원</text>
  <circle cx="470" cy="276" r="4.2" class="et-e"/><text x="482" y="281" class="et-mu">원래 있던 전자</text>
