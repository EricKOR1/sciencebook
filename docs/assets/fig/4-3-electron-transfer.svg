<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-4-3-electron-transfer d-4-3-electron-transfer">
  <title id="t-4-3-electron-transfer">그림 4-3-2 마그네슘과 산소 사이의 전자 이동</title>
  <desc id="d-4-3-electron-transfer">마그네슘 원자(전자 배치 2, 8, 2)는 가장 바깥 껍질의 전자 2개를 잃어 마그네슘 이온(Mg²⁺)이 되고(산화), 산소 원자(2, 6)는 그 전자 2개를 얻어 산화 이온(O²⁻)이 된다(환원). 두 이온 모두 바깥 껍질에 전자가 8개인 안정한 배치가 되며, 잃은 전자 수와 얻은 전자 수는 같다. 원자핵 속 숫자는 양성자 수이다. 모식도.</desc>
  <style>
    .et-shell{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .et-e{fill:var(--fig-blue);stroke:none}
    .et-new{fill:var(--fig-red);stroke:none}
    .et-nuc{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5}
    .et-n{font-size:13px;font-weight:700;fill:var(--fig-ink)}
    .et-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .et-t{font-size:14px;fill:var(--fig-ink)}
    .et-mu{font-size:13px;fill:var(--fig-muted)}
    .et-ox{font-size:14px;font-weight:700;fill:var(--fig-red)}
    .et-rd{font-size:14px;font-weight:700;fill:var(--fig-blue)}
    .et-arr{fill:none;stroke:var(--fig-red);stroke-width:2.2}
    .et-arrh{fill:var(--fig-red)}
    .et-big{fill:var(--fig-muted)}
    .et-br{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
  </style>
