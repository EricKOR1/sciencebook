<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-m1-01-variables d-m1-01-variables">
<title id="t-m1-01-variables">그림 중1-1-1 변인 통제 — 물의 온도와 설탕이 녹는 시간</title>
<desc id="d-m1-01-variables">물의 온도(조작 변인)만 10 °C, 30 °C, 50 °C로 다르게 하고, 물의 양·설탕의 양·컵·젓는 방법(통제 변인)은 같게 한 뒤 설탕이 다 녹는 데 걸린 시간(종속 변인)을 잰다.</desc>
<style>
  .m101v-lbl{font-size:15px;font-weight:700} .m101v-sm{font-size:13px;fill:var(--fig-muted)} .m101v-ink{font-size:14px;fill:var(--fig-ink)}
  .m101v-vio{fill:var(--fig-violet)} .m101v-teal{fill:var(--fig-teal)} .m101v-amb{fill:var(--fig-amber)}
  .m101v-div{fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:5 5}
  .m101v-glass{fill:none;stroke:var(--fig-ink);stroke-width:2.2;stroke-linejoin:round}
  .m101v-tick{fill:none;stroke:var(--fig-muted);stroke-width:1.2}
  .m101v-w0{fill:var(--fig-soft-blue)} .m101v-w1{fill:var(--fig-soft-amber)} .m101v-w2{fill:var(--fig-soft-red)}
  .m101v-t0{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2} .m101v-t1{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2} .m101v-t2{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2}
  .m101v-tt{font-size:15px;font-weight:700;fill:var(--fig-ink)}
  .m101v-sugar{fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1}
  .m101v-rod{fill:none;stroke:var(--fig-muted);stroke-width:3;stroke-linecap:round}
  .m101v-lvl{fill:none;stroke:var(--fig-teal);stroke-width:1.5;stroke-dasharray:6 4}
  .m101v-eq{font-size:24px;font-weight:700;fill:var(--fig-teal)}
  .m101v-face{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2.2} .m101v-btn{fill:var(--fig-ink)}
  .m101v-sec{fill:var(--fig-soft-amber);stroke:none} .m101v-hand{fill:none;stroke:var(--fig-amber);stroke-width:2.5;stroke-linecap:round}
  .m101v-hub{fill:var(--fig-amber)}
  .m101v-time{font-size:15px;font-weight:700;fill:var(--fig-amber)}
</style>
<text x="20" y="48" class="m101v-lbl m101v-vio">조작 변인</text>
<text x="20" y="68" class="m101v-sm">일부러 다르게 하는 것</text>
<line x1="20" y1="92" x2="700" y2="92" class="m101v-div"/>
<text x="20" y="140" class="m101v-lbl m101v-teal">통제 변인</text>
<text x="20" y="160" class="m101v-sm">같게 유지하는 것</text>
<text x="20" y="190" class="m101v-ink">· 물의 양 100 mL</text>
<text x="20" y="210" class="m101v-ink">· 설탕 5 g</text>
<text x="20" y="230" class="m101v-ink">· 같은 컵</text>
<text x="20" y="250" class="m101v-ink">· 같은 방법으로 젓기</text>
<line x1="20" y1="272" x2="700" y2="272" class="m101v-div"/>
<text x="20" y="312" class="m101v-lbl m101v-amb">종속 변인</text>
<text x="20" y="332" class="m101v-sm">측정하는 결과</text>
<text x="20" y="350" class="m101v-sm">(다 녹는 시간, 평균)</text>
