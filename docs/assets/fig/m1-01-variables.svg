<text x="622" y="57" text-anchor="middle" class="m101v-tt">50 °C</text>
<rect x="574" y="150" width="96" height="100" class="m101v-w2"/>
<rect x="596" y="242" width="7" height="7" class="m101v-sugar"/><rect x="608" y="242" width="7" height="7" class="m101v-sugar"/><rect x="620" y="242" width="7" height="7" class="m101v-sugar"/><rect x="632" y="242" width="7" height="7" class="m101v-sugar"/><rect x="644" y="242" width="7" height="7" class="m101v-sugar"/><rect x="602" y="235" width="7" height="7" class="m101v-sugar"/><rect x="614" y="235" width="7" height="7" class="m101v-sugar"/><rect x="626" y="235" width="7" height="7" class="m101v-sugar"/><rect x="638" y="235" width="7" height="7" class="m101v-sugar"/>
<path d="M566 112 L572 118 L572 244 Q572 252 580 252 L664 252 Q672 252 672 244 L672 112" class="m101v-glass"/>
