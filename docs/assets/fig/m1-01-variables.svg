<text x="622" y="369" text-anchor="middle" class="m101v-time">22초</text>
<line x1="214" y1="150" x2="680" y2="150" class="m101v-lvl"/>
<text x="359.5" y="142" text-anchor="middle" class="m101v-sm">같은 높이</text><text x="534.5" y="142" text-anchor="middle" class="m101v-sm">같은 높이</text>
<text x="359.5" y="212" text-anchor="middle" class="m101v-eq">=</text>
<text x="534.5" y="212" text-anchor="middle" class="m101v-eq">=</text>
<text x="360" y="410" text-anchor="middle" class="m101v-ink">조작 변인만 다르고 나머지 조건이 같으므로, 시간의 차이는 물의 온도 때문이라고 말할 수 있다.</text>
<text x="360" y="430" text-anchor="middle" class="m101v-sm">물이 따뜻할수록 설탕이 빨리 녹는다 (시간은 예제 3의 평균값)</text>
</svg>
