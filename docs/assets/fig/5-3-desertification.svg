<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-5-3-desertification d-5-3-desertification">
  <title id="t-5-3-desertification">그림 5-3-2 사막화의 자연적 원인과 인위적 원인</title>
  <desc id="d-5-3-desertification">위: 적도에서 상승한 공기가 위도 30° 부근에서 하강하므로 구름이 생기기 어려워 건조하다(대기 대순환을 단순화한 모식도). 아래: 삼림 벌채, 과잉 방목, 과잉 경작, 지나친 관개에 의한 염류화로 식물이 사라지면 흙이 드러나 바람에 날리고(황사) 토양이 침식된다.</desc>
  <style>
    .ds-ttl{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .ds-lbl{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .ds-sm{font-size:12.5px;fill:var(--fig-muted)}
    .ds-red{font-size:13px;font-weight:600;fill:var(--fig-red)}
    .ds-blue{font-size:13px;font-weight:600;fill:var(--fig-blue)}
    .ds-amb{font-size:13px;font-weight:600;fill:var(--fig-amber)}
    .ds-loop{fill:none;stroke:var(--fig-violet);stroke-width:2.2}
    .ds-loop-h{fill:var(--fig-violet)}
    .ds-desert{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1}
    .ds-wet{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1}
    .ds-cloud{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.3}
    .ds-rain{fill:none;stroke:var(--fig-blue);stroke-width:1.6}
    .ds-sun{fill:var(--fig-amber)}
    .ds-axis{fill:none;stroke:var(--fig-line);stroke-width:1.5}
    .ds-panel{fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1}
    .ds-tree{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.5}
    .ds-trunk{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5}
    .ds-sheep{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.4}
    .ds-ink{fill:var(--fig-ink)}
    .ds-grass{fill:none;stroke:var(--fig-green);stroke-width:1.6}
    .ds-furrow{fill:none;stroke:var(--fig-amber);stroke-width:2}
    .ds-crack{fill:none;stroke:var(--fig-amber);stroke-width:1.5}
    .ds-salt{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1}
    .ds-dust{fill:var(--fig-amber)}
    .ds-wind{fill:none;stroke:var(--fig-muted);stroke-width:2}
    .ds-wind-h{fill:var(--fig-muted)}
  </style>
  <defs>
    <linearGradient id="ds-ground-grad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" style="stop-color:var(--fig-soft-green)"/>
      <stop offset="0.45" style="stop-color:var(--fig-soft-amber)"/>
      <stop offset="1" style="stop-color:var(--fig-soft-amber)"/>
    </linearGradient>
  </defs>

  <!-- ① 자연적 원인: 위도 30° 부근의 하강 기류 -->
  <text x="16" y="24" class="ds-ttl">자연적 원인 — 위도 30° 부근의 하강 기류</text>
  <rect x="96" y="166" width="70" height="12" class="ds-desert"/>
  <rect x="554" y="166" width="70" height="12" class="ds-desert"/>
  <rect x="320" y="166" width="80" height="12" class="ds-wet"/>
  <line x1="40" y1="178" x2="680" y2="178" class="ds-axis"/>
  <!-- 왼쪽 순환 -->
  <path d="M344 160 V82 Q344 72 334 72 H142 Q130 72 130 84 V160 Q130 160 140 160 H334" class="ds-loop"/>
  <path d="M344 70 l-6 12 h12 z" class="ds-loop-h"/>
  <path d="M130 162 l-6 -12 h12 z" class="ds-loop-h"/>
  <path d="M236 72 l12 -6 v12 z" class="ds-loop-h"/>
  <path d="M248 160 l-12 -6 v12 z" class="ds-loop-h"/>
  <!-- 오른쪽 순환 -->
  <path d="M376 160 V82 Q376 72 386 72 H578 Q590 72 590 84 V160 Q590 160 580 160 H386" class="ds-loop"/>
  <path d="M376 70 l-6 12 h12 z" class="ds-loop-h"/>
  <path d="M590 162 l-6 -12 h12 z" class="ds-loop-h"/>
  <path d="M484 72 l-12 -6 v12 z" class="ds-loop-h"/>
  <path d="M472 160 l12 -6 v12 z" class="ds-loop-h"/>
  <!-- 적도 구름 -->
  <path d="M332 60 a12 12 0 0 1 8 -20 a17 17 0 0 1 32 -4 a12 12 0 0 1 18 16 a9 9 0 0 1 -6 8 z" class="ds-cloud"/>
  <path d="M348 96 l-3 9 M360 100 l-3 9 M372 96 l-3 9 M354 118 l-3 9 M366 122 l-3 9" class="ds-rain"/>
  <!-- 30° 부근 해 -->
  <circle cx="131" cy="44" r="11" class="ds-sun"/>
  <circle cx="589" cy="44" r="11" class="ds-sun"/>
  <text x="200" y="124" text-anchor="middle" class="ds-amb">← 하강 기류</text>
  <text x="200" y="142" text-anchor="middle" class="ds-sm">구름이 생기기 어렵다</text>
  <text x="520" y="124" text-anchor="middle" class="ds-amb">하강 기류 →</text>
  <text x="520" y="142" text-anchor="middle" class="ds-sm">구름이 생기기 어렵다</text>
  <text x="131" y="196" text-anchor="middle" class="ds-lbl">30°S</text>
  <text x="131" y="212" text-anchor="middle" class="ds-red">건조 · 사막</text>
  <text x="360" y="196" text-anchor="middle" class="ds-lbl">0° (적도)</text>
  <text x="360" y="212" text-anchor="middle" class="ds-blue">상승 기류 · 비가 많다</text>
  <text x="589" y="196" text-anchor="middle" class="ds-lbl">30°N</text>
  <text x="589" y="212" text-anchor="middle" class="ds-red">건조 · 사막</text>
  <text x="704" y="24" text-anchor="end" class="ds-sm">대기 대순환 일부(모식도)</text>

  <!-- ② 인위적 원인 -->
  <text x="16" y="250" class="ds-ttl">인위적 원인 — 식물이 사라지면 흙이 드러난다</text>
  <rect x="16" y="330" width="688" height="58" rx="6" style="fill:url(#ds-ground-grad);stroke:var(--fig-line);stroke-width:1"/>
  <!-- 삼림 벌채 -->
  <rect x="40" y="290" width="10" height="40" class="ds-trunk"/>
  <circle cx="45" cy="282" r="20" class="ds-tree"/>
  <rect x="82" y="316" width="14" height="14" class="ds-trunk"/><ellipse cx="89" cy="316" rx="7" ry="3" class="ds-trunk"/>
  <rect x="112" y="318" width="14" height="12" class="ds-trunk"/><ellipse cx="119" cy="318" rx="7" ry="3" class="ds-trunk"/>
  <rect x="142" y="316" width="14" height="14" class="ds-trunk"/><ellipse cx="149" cy="316" rx="7" ry="3" class="ds-trunk"/>
  <text x="98" y="364" text-anchor="middle" class="ds-lbl">삼림 벌채</text>
  <text x="98" y="381" text-anchor="middle" class="ds-sm">땔감·농지 확보</text>
  <!-- 과잉 방목 -->
  <path d="M196 330 v-6 M232 330 v-5 M300 330 v-6" class="ds-grass"/>
  <g>
    <ellipse cx="214" cy="314" rx="16" ry="10" class="ds-sheep"/><circle cx="232" cy="308" r="6" class="ds-ink"/><path d="M206 323 v7 M222 323 v7" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/>
    <ellipse cx="270" cy="312" rx="16" ry="10" class="ds-sheep"/><circle cx="288" cy="306" r="6" class="ds-ink"/><path d="M262 321 v9 M278 321 v9" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/>
    <ellipse cx="320" cy="314" rx="14" ry="9" class="ds-sheep"/><circle cx="336" cy="309" r="5.5" class="ds-ink"/><path d="M313 322 v8 M327 322 v8" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/>
  </g>
  <text x="268" y="364" text-anchor="middle" class="ds-lbl">과잉 방목</text>
  <text x="268" y="381" text-anchor="middle" class="ds-sm">풀을 뿌리까지 먹음</text>
  <!-- 과잉 경작 -->
  <path d="M372 330 l18 -14 M398 330 l18 -14 M424 330 l18 -14 M450 330 l18 -14 M476 330 l18 -14" class="ds-furrow"/>
  <text x="436" y="364" text-anchor="middle" class="ds-lbl">과잉 경작</text>
  <text x="436" y="381" text-anchor="middle" class="ds-sm">땅을 쉬지 않고 경작</text>
  <!-- 염류화 + 흙먼지 -->
  <ellipse cx="548" cy="327" rx="18" ry="3.5" class="ds-salt"/>
  <ellipse cx="600" cy="328" rx="14" ry="3" class="ds-salt"/>
  <path d="M570 336 l6 8 l-4 6 M630 334 l-5 9 l6 7 M664 336 l4 10" class="ds-crack"/>
  <text x="610" y="364" text-anchor="middle" class="ds-lbl">염류화</text>
  <text x="610" y="381" text-anchor="middle" class="ds-sm">지나친 관개</text>
  <path d="M520 304 Q580 300 640 280" class="ds-wind"/>
  <path d="M648 276 l-12 -1 l5 10 z" class="ds-wind-h"/>
  <g>
    <circle cx="596" cy="292" r="2" class="ds-dust"/><circle cx="612" cy="284" r="2.4" class="ds-dust"/><circle cx="628" cy="296" r="2" class="ds-dust"/>
    <circle cx="644" cy="290" r="2.4" class="ds-dust"/><circle cx="660" cy="280" r="2" class="ds-dust"/><circle cx="672" cy="294" r="2.2" class="ds-dust"/>
    <circle cx="684" cy="284" r="2" class="ds-dust"/><circle cx="652" cy="304" r="1.8" class="ds-dust"/><circle cx="620" cy="306" r="1.8" class="ds-dust"/>
  </g>
  <text x="704" y="270" text-anchor="end" class="ds-red">흙먼지(황사)·토양 침식</text>
</svg>
