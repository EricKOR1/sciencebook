<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-m3-01-gas-volume-model d-m3-01-gas-volume-model">
  <title id="t-m3-01-gas-volume-model">그림 중3-1-4 기체 반응의 부피비와 분자 수</title>
  <desc id="d-m3-01-gas-volume-model">같은 온도와 압력에서 같은 부피의 기체 속에는 같은 수의 분자가 들어 있으므로, 수소 2부피와 산소 1부피가 반응하여 수증기 2부피가 생기는 부피비 2 : 1 : 2는 분자 수의 비와 같다. 상자 하나에 분자 3개씩 넣은 모식도이다.</desc>
  <style>
    .m3-01-gas-volume-model-a{font-size:11px;font-weight:700}
    .m3-01-gas-volume-model-l{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .m3-01-gas-volume-model-s{font-size:13px;fill:var(--fig-muted)}
    .m3-01-gas-volume-model-k{font-size:14px;fill:var(--fig-ink)}
  </style>
  <text x="360" y="28" text-anchor="middle" class="m3-01-gas-volume-model-k">같은 온도·압력에서 같은 부피의 기체에는 종류와 관계없이 같은 수의 분자가 들어 있다</text>
