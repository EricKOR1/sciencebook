<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-pchem-11-q-gibbs-paradox d-pchem-11-q-gibbs-paradox">
  <title id="t-pchem-11-q-gibbs-paradox">그림 물리화학 11-17 문제 19 해설: 깁스의 역설</title>
  <desc id="d-pchem-11-q-gibbs-paradox">위: 칸막이 양쪽의 서로 다른 기체 A(파랑 6개)와 B(빨강 6개)는 칸막이를 치우면 섞이고 ΔS = 2nR ln 2이다. 아래: 양쪽 모두 같은 기체(파랑 6개씩)이면 칸막이를 치워도 거시적으로 달라진 것이 없고, Q = q^N/N!의 1/N! 덕분에 ΔS = 0이 나온다. 1/N!을 빼면 아래 줄도 2nR ln 2가 되어 모순이다.</desc>
