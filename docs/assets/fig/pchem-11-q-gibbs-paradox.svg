    .pchem-11-q-gibbs-paradox-s{font-size:13px;fill:var(--fig-muted)}
    .pchem-11-q-gibbs-paradox-ax{font-size:13px;fill:var(--fig-muted)}
    .pchem-11-q-gibbs-paradox-big{font-size:18px;font-weight:600;fill:var(--fig-ink)}
