  <rect x="374.9" y="239.0" width="8.4" height="5.9" transform="rotate(-16 374.9 239.0)" style="fill:var(--fig-panel);stroke:var(--fig-violet);stroke-width:1.2"/>
  <rect x="351.3" y="244.4" width="7.3" height="5.1" transform="rotate(-2 351.3 244.4)" style="fill:var(--fig-panel);stroke:var(--fig-violet);stroke-width:1.2"/>
  <text x="350.0" y="188.0" text-anchor="middle" class="m2-01-recrystallization-s">녹아 있을 수 있는 양</text>
  <text x="350.0" y="206.0" text-anchor="middle" class="m2-01-recrystallization-t">질산 칼륨 32 g까지</text>
  <line x1="370.0" y1="238.0" x2="420.0" y2="290.0" style="stroke:var(--fig-violet);stroke-width:1.2"/>
  <text x="380.0" y="306.0" text-anchor="middle" class="m2-01-recrystallization-s" style="fill:var(--fig-violet);font-weight:700">질산 칼륨 결정 50 − 32 = 18 g</text>
  <line x1="426.0" y1="185.0" x2="499.0" y2="185.0" style="stroke:var(--fig-ink);stroke-width:2.5"/>
  <path d="M510.0 185.0 L499.0 191.1 L499.0 178.9 Z" style="fill:var(--fig-ink)"/>
  <text x="468.0" y="172.0" text-anchor="middle" class="m2-01-recrystallization-s" style="fill:var(--fig-ink);font-weight:700">거른다</text>
  <text x="620.0" y="30.0" text-anchor="middle" class="m2-01-recrystallization-tb">③ 거르면</text>
