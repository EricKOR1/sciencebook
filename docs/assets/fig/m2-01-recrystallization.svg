  <text x="225.0" y="172.0" text-anchor="middle" class="m2-01-recrystallization-s" style="fill:var(--fig-blue);font-weight:700">식힌다</text>
  <text x="350.0" y="30.0" text-anchor="middle" class="m2-01-recrystallization-tb">② 20 °C로 식히면</text>
