<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-m2-01-recrystallization d-m2-01-recrystallization">
  <title id="t-m2-01-recrystallization">그림 중2-1-6 재결정으로 순수한 질산 칼륨 얻기</title>
  <desc id="d-m2-01-recrystallization">예제 7의 과정. 질산 칼륨 50 g과 염화 나트륨 5 g을 80 °C 물 100 g에 모두 녹인 뒤 20 °C로 식히면, 용해도(32)를 넘는 질산 칼륨 18 g만 결정으로 나온다. 이것을 거르면 거름종이에는 순수한 질산 칼륨 결정이 남고, 거른 용액에는 질산 칼륨 32 g과 염화 나트륨 5 g이 녹아 있다.</desc>
  <style>
    .m2-01-recrystallization-b{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .m2-01-recrystallization-t{font-size:14px;fill:var(--fig-ink)}
    .m2-01-recrystallization-tb{font-size:14px;font-weight:700;fill:var(--fig-ink)}
    .m2-01-recrystallization-s{font-size:13px;fill:var(--fig-muted)}
    .m2-01-recrystallization-ln{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
    .m2-01-recrystallization-lm{fill:none;stroke:var(--fig-muted);stroke-width:1.2}
  </style>
  <text x="100.0" y="30.0" text-anchor="middle" class="m2-01-recrystallization-tb">① 80 °C에서 모두 녹인다</text>
