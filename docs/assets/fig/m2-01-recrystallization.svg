  <path d="M41.5 160 L44 249 L156 249 L158.5 160 Z" style="fill:var(--fig-soft-red)"/>
  <path d="M75 290 q-6 -10 0 -18 q6 -8 0 -16" style="fill:none;stroke:var(--fig-red);stroke-width:2"/>
  <path d="M100 290 q-6 -10 0 -18 q6 -8 0 -16" style="fill:none;stroke:var(--fig-red);stroke-width:2"/>
  <path d="M125 290 q-6 -10 0 -18 q6 -8 0 -16" style="fill:none;stroke:var(--fig-red);stroke-width:2"/>
  <rect x="50" y="262" width="100" height="8" rx="2" style="fill:var(--fig-red);fill-opacity:0.7"/>
  <text x="100.0" y="190.0" text-anchor="middle" class="m2-01-recrystallization-s">80 °C 물 100 g</text>
  <text x="100.0" y="208.0" text-anchor="middle" class="m2-01-recrystallization-t">질산 칼륨 50 g</text>
  <text x="100.0" y="226.0" text-anchor="middle" class="m2-01-recrystallization-t">염화 나트륨 5 g</text>
  <line x1="176.0" y1="185.0" x2="263.0" y2="185.0" style="stroke:var(--fig-blue);stroke-width:2.5"/>
