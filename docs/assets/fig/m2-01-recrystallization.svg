  <text x="682.0" y="66.0" text-anchor="end" class="m2-01-recrystallization-s" style="fill:var(--fig-violet)">거름종이 위:</text>
  <text x="682.0" y="84.0" class="m2-01-recrystallization-s"></text>
  <text x="620.0" y="288.0" text-anchor="middle" class="m2-01-recrystallization-s" style="fill:var(--fig-violet);font-weight:700">거름종이: 순수한 질산 칼륨 18 g</text>
  <text x="620.0" y="306.0" text-anchor="middle" class="m2-01-recrystallization-s">거른 용액: 질산 칼륨 32 g +</text>
  <text x="620.0" y="324.0" text-anchor="middle" class="m2-01-recrystallization-s">염화 나트륨 5 g (모두 녹아 있음)</text>
  <text x="40.0" y="350.0" class="m2-01-recrystallization-s">20 °C 용해도(물 100 g 기준): 질산 칼륨 32, 염화 나트륨 36 → 염화 나트륨 5 g은 결정으로 나오지 않는다</text>
</svg>
