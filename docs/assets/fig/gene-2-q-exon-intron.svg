<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" role="img" aria-labelledby="t-gene-2-q-exon-intron d-gene-2-q-exon-intron">
  <title id="t-gene-2-q-exon-intron">그림 생물의 유전 2-11 문제 15의 유전자 구조</title>
  <desc id="d-gene-2-q-exon-intron">개시 코돈부터 종결 코돈까지의 부위가 엑손1(120 염기쌍), 인트론(200 염기쌍), 엑손2(150 염기쌍), 인트론(300 염기쌍), 엑손3(186 염기쌍) 순서로 놓여 있다. 개시 코돈은 엑손1의 맨 앞, 종결 코돈은 엑손3의 맨 끝에 있다. 길이는 염기쌍 수에 비례하게 그렸다.</desc>
  <style>.gene-2-q-exon-intron-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .gene-2-q-exon-intron-t{font-size:14px;fill:var(--fig-ink)} .gene-2-q-exon-intron-s{font-size:13px;fill:var(--fig-muted)} .gene-2-q-exon-intron-m{font-size:14px;font-weight:600;fill:var(--fig-ink);letter-spacing:1px} .gene-2-q-exon-intron-ln{fill:none;stroke:var(--fig-ink);stroke-width:2} .gene-2-q-exon-intron-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.4} .gene-2-q-exon-intron-gr{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 3}</style>
  <rect x="40.0" y="72.0" width="80.3" height="40.0" rx="0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <text x="80.2" y="97.0" text-anchor="middle" class="gene-2-q-exon-intron-t">엑손1</text>
  <text x="80.2" y="134.0" text-anchor="middle" class="gene-2-q-exon-intron-s">120 염기쌍</text>
  <rect x="120.3" y="85.0" width="133.9" height="14.0" rx="0" style="fill:var(--fig-paper);stroke:var(--fig-muted);stroke-width:1.5"/>
  <text x="187.3" y="76.0" text-anchor="middle" class="gene-2-q-exon-intron-s">인트론</text>
  <text x="187.3" y="134.0" text-anchor="middle" class="gene-2-q-exon-intron-s">200 염기쌍</text>
  <rect x="254.2" y="72.0" width="100.4" height="40.0" rx="0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <text x="304.4" y="97.0" text-anchor="middle" class="gene-2-q-exon-intron-t">엑손2</text>
  <text x="304.4" y="134.0" text-anchor="middle" class="gene-2-q-exon-intron-s">150 염기쌍</text>
  <rect x="354.6" y="85.0" width="200.8" height="14.0" rx="0" style="fill:var(--fig-paper);stroke:var(--fig-muted);stroke-width:1.5"/>
  <text x="455.1" y="76.0" text-anchor="middle" class="gene-2-q-exon-intron-s">인트론</text>
  <text x="455.1" y="134.0" text-anchor="middle" class="gene-2-q-exon-intron-s">300 염기쌍</text>
  <rect x="555.5" y="72.0" width="124.5" height="40.0" rx="0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <text x="617.7" y="97.0" text-anchor="middle" class="gene-2-q-exon-intron-t">엑손3</text>
  <text x="617.7" y="134.0" text-anchor="middle" class="gene-2-q-exon-intron-s">186 염기쌍</text>
  <line x1="40.0" y1="70.0" x2="40.0" y2="46.0" style="stroke:var(--fig-green);stroke-width:1.6"/>
  <text x="40.0" y="40.0" text-anchor="start" class="gene-2-q-exon-intron-s" style="fill:var(--fig-green)">개시 코돈</text>
  <line x1="680.0" y1="70.0" x2="680.0" y2="46.0" style="stroke:var(--fig-red);stroke-width:1.6"/>
  <text x="680.0" y="40.0" text-anchor="end" class="gene-2-q-exon-intron-s" style="fill:var(--fig-red)">종결 코돈</text>
  <line x1="40.0" y1="166.0" x2="106.9" y2="166.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <line x1="40.0" y1="160.0" x2="40.0" y2="172.0" style="stroke:var(--fig-ink);stroke-width:1.5"/>
