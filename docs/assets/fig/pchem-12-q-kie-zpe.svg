<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-pchem-12-q-kie-zpe d-pchem-12-q-kie-zpe">
  <title id="t-pchem-12-q-kie-zpe">그림 물리화학 12-17 문제 19의 반응 좌표와 영점 에너지</title>
  <desc id="d-pchem-12-q-kie-zpe">반응물 골짜기 → 전이 상태 → 생성물로 가는 하나의 장벽 곡선. 반응물 골짜기에 C–H 영점 에너지(1450 cm⁻¹)와 그보다 낮은 C–D 영점 에너지(1050 cm⁻¹)의 수평선이 있고, 두 선에서 장벽 꼭대기까지의 높이를 세로 화살표로 나타냈다. 영점 준위의 높이는 값에 비례하게, 장벽 높이는 임의로 그린 모식도이다.</desc>
