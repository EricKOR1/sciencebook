<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-m3-05-q-reflex-paths d-m3-05-q-reflex-paths">
  <title id="t-m3-05-q-reflex-paths">그림 중3-5-8 예제 1 풀이: 두 반응의 경로</title>
  <desc id="d-m3-05-q-reflex-paths">(1) 모기를 보고 쫓을 때는 눈의 신호가 시각 신경을 따라 대뇌로 가서 판단된 뒤 척수와 운동 신경을 거쳐 팔 근육에 전달된다. (2) 가시에 찔려 손을 움츠릴 때는 피부의 신호가 감각 신경을 따라 척수로 가고, 척수가 바로 운동 신경으로 명령을 보낸다. 대뇌로 가는 신호(점선)는 움츠린 뒤에 따끔함을 느끼게 한다.</desc>
  <style>.m3-05-q-reflex-paths-lbl{font-size:15px;fill:var(--fig-ink)} .m3-05-q-reflex-paths-sm{font-size:13px;fill:var(--fig-muted)} .m3-05-q-reflex-paths-ink{fill:var(--fig-ink)} .m3-05-q-reflex-paths-b{font-size:15px;fill:var(--fig-ink);font-weight:600} </style>
  <text x="180.0" y="26.0" text-anchor="middle" class="m3-05-q-reflex-paths-b">(1) 의식적 반응</text>
  <rect x="130" y="60" width="100" height="40" rx="8" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2"/>
  <text x="180.0" y="86.0" text-anchor="middle" class="m3-05-q-reflex-paths-lbl">대뇌</text>
  <rect x="130" y="180" width="100" height="40" rx="8" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:2"/>
  <text x="180.0" y="206.0" text-anchor="middle" class="m3-05-q-reflex-paths-lbl">척수</text>
  <rect x="40" y="270" width="80" height="36" rx="8" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <text x="80.0" y="294.0" text-anchor="middle" class="m3-05-q-reflex-paths-lbl">눈</text>
  <rect x="260" y="270" width="90" height="36" rx="8" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2"/>
  <text x="305.0" y="294.0" text-anchor="middle" class="m3-05-q-reflex-paths-lbl">팔 근육</text>
  <line x1="70.0" y1="270.0" x2="124.7" y2="98.5" style="stroke:var(--fig-blue);stroke-width:2.5"/>
  <path d="M128.0 88.0 L130.4 100.3 L118.9 96.7 Z" style="fill:var(--fig-blue)"/>
  <text x="36.0" y="160.0" class="m3-05-q-reflex-paths-sm">시각 신경</text>
  <line x1="180.0" y1="102.0" x2="180.0" y2="167.0" style="stroke:var(--fig-blue);stroke-width:2.5"/>
  <path d="M180.0 178.0 L174.0 167.0 L186.0 167.0 Z" style="fill:var(--fig-blue)"/>
  <text x="188.0" y="145.0" class="m3-05-q-reflex-paths-sm">명령</text>
  <line x1="210.0" y1="222.0" x2="290.2" y2="263.0" style="stroke:var(--fig-blue);stroke-width:2.5"/>
  <path d="M300.0 268.0 L287.5 268.3 L292.9 257.7 Z" style="fill:var(--fig-blue)"/>
  <text x="200.0" y="252.0" text-anchor="end" class="m3-05-q-reflex-paths-sm">운동 신경</text>
  <text x="540.0" y="26.0" text-anchor="middle" class="m3-05-q-reflex-paths-b">(2) 무조건 반사</text>
  <rect x="490" y="60" width="100" height="40" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:2"/>
  <text x="540.0" y="86.0" text-anchor="middle" class="m3-05-q-reflex-paths-lbl">대뇌</text>
  <rect x="490" y="180" width="100" height="40" rx="8" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:2"/>
  <text x="540.0" y="206.0" text-anchor="middle" class="m3-05-q-reflex-paths-lbl">척수</text>
  <rect x="400" y="270" width="80" height="36" rx="8" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <text x="440.0" y="294.0" text-anchor="middle" class="m3-05-q-reflex-paths-lbl">피부</text>
  <rect x="620" y="270" width="90" height="36" rx="8" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2"/>
  <text x="665.0" y="294.0" text-anchor="middle" class="m3-05-q-reflex-paths-lbl">팔 근육</text>
  <line x1="440.0" y1="270.0" x2="481.4" y2="214.8" style="stroke:var(--fig-blue);stroke-width:2.5"/>
  <path d="M488.0 206.0 L486.2 218.4 L476.6 211.2 Z" style="fill:var(--fig-blue)"/>
  <text x="396.0" y="222.0" class="m3-05-q-reflex-paths-sm">감각 신경</text>
