  <path d="M560 102 l-5 10 l10 0 z" style="fill:var(--fig-muted)"/>
  <text x="568.0" y="130.0" class="m3-05-q-reflex-paths-sm">뒤에 느낌</text>
  <line x1="570.0" y1="222.0" x2="650.2" y2="263.0" style="stroke:var(--fig-blue);stroke-width:2.5"/>
  <path d="M660.0 268.0 L647.5 268.3 L652.9 257.7 Z" style="fill:var(--fig-blue)"/>
  <text x="560.0" y="252.0" text-anchor="end" class="m3-05-q-reflex-paths-sm">운동 신경</text>
  <line x1="360.0" y1="40.0" x2="360.0" y2="310.0" style="stroke:var(--fig-line);stroke-width:1.5"/>
</svg>
