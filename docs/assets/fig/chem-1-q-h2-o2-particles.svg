  <title id="t-chem-1-q-h2-o2-particles">그림 화학 1-6 문제 4 해설 — 수소와 산소가 반응하여 수증기가 되는 입자 모형</title>
  <desc id="d-chem-1-q-h2-o2-particles">반응 전 수소 분자 2개와 산소 분자 1개(분자 3개)가 반응하여 수증기 분자 2개가 된다. 수소 원자 4개, 산소 원자 2개로 원자의 종류와 수는 같지만 분자 수는 3개에서 2개로 줄어든다. 모형의 크기는 모식적이다.</desc>
