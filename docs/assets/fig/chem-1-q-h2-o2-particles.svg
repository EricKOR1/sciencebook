    .c1qhp-H{fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.2} .c1qhp-O{fill:var(--fig-red);stroke:var(--fig-red);stroke-width:1} .c1qhp-C{fill:var(--fig-ink);stroke:var(--fig-ink);stroke-width:1} .c1qhp-N{fill:var(--fig-blue);stroke:var(--fig-blue);stroke-width:1}
