<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" class="fig-small" role="img" aria-labelledby="t-uchem-6-q-bcc-diagonal d-uchem-6-q-bcc-diagonal">
  <title id="t-uchem-6-q-bcc-diagonal">그림 일반화학 6-13 문제 13 해설 — 체심 입방 구조의 몸 대각선 단면</title>
  <desc id="d-uchem-6-q-bcc-diagonal">체심 입방 단위 세포를 마주 보는 두 모서리를 지나도록 자른 단면(가로 √2 a, 세로 a). 꼭짓점 원자와 중심 원자가 몸 대각선을 따라 닿으므로 √3 a = 4r이다. 세포 하나에는 꼭짓점 8 × ⅛ + 중심 1 = 2개의 원자가 있다.</desc>
  <style>
    .uchem-6-q-bcc-diagonal-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-6-q-bcc-diagonal-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-6-q-bcc-diagonal-b{font-size:15px;fill:var(--fig-ink);font-weight:bold}
    .uchem-6-q-bcc-diagonal-ax{stroke:var(--fig-ink);stroke-width:1.3;fill:none}
    .uchem-6-q-bcc-diagonal-gr{stroke:var(--fig-line);stroke-width:0.7;fill:none;stroke-dasharray:3 3}
    .uchem-6-q-bcc-diagonal-ln{stroke:var(--fig-ink);stroke-width:2;fill:none}
    .uchem-6-q-bcc-diagonal-lv{stroke:var(--fig-ink);stroke-width:2.2;fill:none}
    .uchem-6-q-bcc-diagonal-bl{stroke:var(--fig-blue);stroke-width:2.4;fill:none}
    .uchem-6-q-bcc-diagonal-rd{stroke:var(--fig-red);stroke-width:2.4;fill:none}
    .uchem-6-q-bcc-diagonal-gn{stroke:var(--fig-green);stroke-width:2.4;fill:none}
    .uchem-6-q-bcc-diagonal-am{stroke:var(--fig-amber);stroke-width:2.4;fill:none}
    .uchem-6-q-bcc-diagonal-dash{stroke:var(--fig-muted);stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    .uchem-6-q-bcc-diagonal-fink{fill:var(--fig-ink)} .uchem-6-q-bcc-diagonal-fbl{fill:var(--fig-blue)} .uchem-6-q-bcc-diagonal-frd{fill:var(--fig-red)}
    .uchem-6-q-bcc-diagonal-fgn{fill:var(--fig-green)} .uchem-6-q-bcc-diagonal-fam{fill:var(--fig-amber)} .uchem-6-q-bcc-diagonal-fmu{fill:var(--fig-muted)}
    .uchem-6-q-bcc-diagonal-box{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.4}
    .uchem-6-q-bcc-diagonal-sb{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6}
    .uchem-6-q-bcc-diagonal-sr{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.6}
    .uchem-6-q-bcc-diagonal-sg{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.6}
    .uchem-6-q-bcc-diagonal-sa{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.6}
    .uchem-6-q-bcc-diagonal-sv{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.6}
    .uchem-6-q-bcc-diagonal-st{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.6}
  </style>
  <clipPath id="uchem-6-q-bcc-diagonal-clip"><rect x="50" y="50" width="212.1" height="150"/></clipPath>
  <g clip-path="url(#uchem-6-q-bcc-diagonal-clip)">
  <circle cx="50.0" cy="50.0" r="65.0" class="uchem-6-q-bcc-diagonal-sb"/>
  <circle cx="262.1" cy="50.0" r="65.0" class="uchem-6-q-bcc-diagonal-sb"/>
  <circle cx="50.0" cy="200.0" r="65.0" class="uchem-6-q-bcc-diagonal-sb"/>
  <circle cx="262.1" cy="200.0" r="65.0" class="uchem-6-q-bcc-diagonal-sb"/>
  <circle cx="156.1" cy="125.0" r="65.0" class="uchem-6-q-bcc-diagonal-sb"/>
  </g>
  <rect x="50.0" y="50.0" width="212.1" height="150.0" class="uchem-6-q-bcc-diagonal-ax"/>
  <line x1="50.0" y1="200.0" x2="262.1" y2="50.0" class="uchem-6-q-bcc-diagonal-rd"/>
  <text x="156.1" y="224.0" text-anchor="middle" class="uchem-6-q-bcc-diagonal-t"><tspan dy="0">면 대각선 √2 a</tspan></text>
  <text x="40.0" y="130.0" text-anchor="end" class="uchem-6-q-bcc-diagonal-t"><tspan dy="0">a</tspan></text>
  <text x="276.1" y="100.0" text-anchor="start" class="uchem-6-q-bcc-diagonal-t"><tspan dy="0">몸 대각선</tspan></text>
  <text x="276.1" y="122.0" text-anchor="start" class="uchem-6-q-bcc-diagonal-t"><tspan dy="0">√3 a = 4r</tspan></text>
  <text x="276.1" y="160.0" text-anchor="start" class="uchem-6-q-bcc-diagonal-s"><tspan dy="0">a = 286.6 pm</tspan></text>
</svg>
