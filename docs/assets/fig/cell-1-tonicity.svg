<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-cell-1-tonicity d-cell-1-tonicity">
  <title id="t-cell-1-tonicity">그림 세포와 물질대사 1-9 용액의 농도에 따른 적혈구와 식물세포의 변화</title>
  <desc id="d-cell-1-tonicity">저장액에서는 물이 세포 안으로 들어와 적혈구는 부풀다 터지고(용혈) 식물세포는 팽압이 생겨 탱탱해진다. 등장액에서는 드나드는 물의 양이 같다. 고장액에서는 물이 빠져나가 적혈구는 쭈그러들고 식물세포는 세포막이 세포벽에서 떨어지는 원형질 분리가 일어난다. 파란 화살표는 물의 알짜 이동 방향. 모식도.</desc>
  <style>.cell-1-tonicity-t{font-size:14px;fill:var(--fig-ink)} .cell-1-tonicity-s{font-size:13px;fill:var(--fig-muted)} .cell-1-tonicity-b{font-size:15px;fill:var(--fig-ink);font-weight:600} .cell-1-tonicity-bs{font-size:14px;fill:var(--fig-ink);font-weight:600} .cell-1-tonicity-g{font-size:14px;fill:var(--fig-green);font-weight:600} .cell-1-tonicity-r{font-size:14px;fill:var(--fig-red);font-weight:600} .cell-1-tonicity-bl{font-size:14px;fill:var(--fig-blue);font-weight:600} .cell-1-tonicity-am{font-size:14px;fill:var(--fig-amber);font-weight:600} .cell-1-tonicity-vi{font-size:14px;fill:var(--fig-violet);font-weight:600} .cell-1-tonicity-te{font-size:14px;fill:var(--fig-teal);font-weight:600}</style>
