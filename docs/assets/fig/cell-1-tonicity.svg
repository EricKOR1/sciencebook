  <text x="210.0" y="50.0" text-anchor="middle" class="cell-1-tonicity-s">세포 안보다 용질 농도 낮음</text>
  <text x="410.0" y="30.0" text-anchor="middle" class="cell-1-tonicity-b">등장액</text>
  <text x="410.0" y="50.0" text-anchor="middle" class="cell-1-tonicity-s">세포 안과 용질 농도 같음</text>
