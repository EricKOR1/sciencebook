<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 310" class="fig-small" role="img" aria-labelledby="t-uphy-4-q-merry-go-round d-uphy-4-q-merry-go-round">
  <title id="t-uphy-4-q-merry-go-round">그림 일반물리학 4-8 예제 10의 회전목마와 아이(위에서 본 모습)</title>
  <desc id="d-uphy-4-q-merry-go-round">정지한 원판 모양 회전목마(반지름 2.0 m, 질량 200 kg)의 가장자리에, 질량 40 kg인 아이가 가장자리의 접선 방향으로 3.0 m/s로 달려와 뛰어오른다. 위에서 내려다본 모습이다.</desc>
  <style>.cuphy4qmerrygoround-t{font-size:14px;fill:var(--fig-ink)} .cuphy4qmerrygoround-s{font-size:13px;fill:var(--fig-muted)} .cuphy4qmerrygoround-b{font-size:15px;font-weight:700;fill:var(--fig-ink)} .cuphy4qmerrygoround-i{font-size:15px;font-style:italic;fill:var(--fig-ink)} .cuphy4qmerrygoround-ax{stroke:var(--fig-ink);stroke-width:1.4;fill:none} .cuphy4qmerrygoround-grid{stroke:var(--fig-line);stroke-width:0.7;fill:none}</style>
  <circle cx="250.0" cy="180.0" r="110.0" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2.5"/>
  <circle cx="250.0" cy="180.0" r="5.0" style="fill:var(--fig-ink);stroke:none"/>
  <text x="260.0" y="200.0" class="cuphy4qmerrygoround-s">축</text>
  <line x1="250.0" y1="180.0" x2="250.0" y2="70.0" style="fill:none;stroke:var(--fig-muted);stroke-width:1.4;stroke-linecap:round;stroke-dasharray:5 4"/>
  <text x="258.0" y="130.0" class="cuphy4qmerrygoround-s">2.0 m</text>
  <text x="250.0" y="238.0" text-anchor="middle" class="cuphy4qmerrygoround-t">회전목마 200 kg</text>
  <text x="250.0" y="258.0" text-anchor="middle" class="cuphy4qmerrygoround-s">(처음에 정지)</text>
  <line x1="30.0" y1="70.0" x2="258.0" y2="70.0" style="fill:none;stroke:var(--fig-muted);stroke-width:1.2;stroke-linecap:round;stroke-dasharray:3 4"/>
  <circle cx="250.0" cy="70.0" r="4.0" style="fill:var(--fig-ink);stroke:none"/>
  <circle cx="70.0" cy="70.0" r="11.0" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2"/>
  <line x1="84.0" y1="70.0" x2="158.0" y2="70.0" style="fill:none;stroke:var(--fig-red);stroke-width:2.8;stroke-linecap:butt"/>
  <polygon points="168.0,70.0 157.0,75.5 157.0,64.5" style="fill:var(--fig-red);stroke:none;stroke-linejoin:round"/>
  <text x="70.0" y="100.0" text-anchor="middle" class="cuphy4qmerrygoround-t">아이 40 kg</text>
  <text x="126.0" y="60.0" text-anchor="middle" class="cuphy4qmerrygoround-s">3.0 m/s</text>
  <text x="258.0" y="60.0" class="cuphy4qmerrygoround-s">뛰어오르는 곳</text>
</svg>
