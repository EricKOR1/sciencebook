<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 446" role="img" aria-labelledby="t-matter-3-q-hf-bond d-matter-3-q-hf-bond">
  <title id="t-matter-3-q-hf-bond">그림 물질과 에너지 3-9 문제 13의 결합 에너지 경로</title>
  <desc id="d-matter-3-q-hf-bond">H₂와 F₂의 결합을 모두 끊어 원자로 만들면 594 kJ을 흡수하고, 원자들이 H–F 결합 2 mol을 만들며 방출하는 에너지는 594 + 542 = 1136 kJ이다. 따라서 H–F의 결합 에너지는 약 568 kJ/mol이다. 층의 높이 차는 값에 비례하게 그렸다.</desc>
  <style>
    .matter-3-q-hf-bond-l{font-size:14px;fill:var(--fig-ink)} .matter-3-q-hf-bond-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .matter-3-q-hf-bond-s{font-size:13px;fill:var(--fig-muted)} .matter-3-q-hf-bond-ax{fill:none;stroke:var(--fig-muted);stroke-width:1.4} .matter-3-q-hf-bond-gr{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4} .matter-3-q-hf-bond-lv{fill:none;stroke:var(--fig-ink);stroke-width:3;stroke-linecap:round} .matter-3-q-hf-bond-dash{fill:none;stroke:var(--fig-muted);stroke-width:1.2;stroke-dasharray:5 4}
  </style>
  <line x1="40" y1="400" x2="40" y2="28" class="matter-3-q-hf-bond-ax"/>
  <path d="M40 20 l-5 10 l10 0 z" style="fill:var(--fig-muted)"/>
  <text x="50" y="30" class="matter-3-q-hf-bond-s">엔탈피 H</text>
  <line x1="150" y1="70" x2="520" y2="70" class="matter-3-q-hf-bond-lv"/>
  <text x="150" y="58" class="matter-3-q-hf-bond-b">2H(g) + 2F(g)  (원자 상태)</text>
  <line x1="70" y1="226.9" x2="330" y2="226.9" class="matter-3-q-hf-bond-lv"/>
  <text x="70" y="216.9" class="matter-3-q-hf-bond-b">H₂(g) + F₂(g)</text>
  <line x1="70" y1="370" x2="700" y2="370" class="matter-3-q-hf-bond-lv"/>
  <text x="70" y="394" class="matter-3-q-hf-bond-b">2HF(g)</text>
  <line x1="200" y1="223.9" x2="200" y2="83" style="stroke:var(--fig-red);stroke-width:2.6"/>
  <path d="M200 72 L205.5 83 L194.5 83 Z" style="fill:var(--fig-red)"/>
  <text x="212" y="132" class="matter-3-q-hf-bond-l" style="font-weight:700;fill:var(--fig-red)">결합을 끊는다(흡수)</text>
  <text x="212" y="151" class="matter-3-q-hf-bond-l">H–H 436 + F–F 158 = 594 kJ</text>
  <line x1="450" y1="73" x2="450" y2="357" style="stroke:var(--fig-blue);stroke-width:2.6"/>
  <path d="M450 368 L444.5 357 L455.5 357 Z" style="fill:var(--fig-blue)"/>
  <text x="462" y="250" class="matter-3-q-hf-bond-l" style="font-weight:700;fill:var(--fig-blue)">H–F 2 mol을 만든다(방출)</text>
  <text x="462" y="269" class="matter-3-q-hf-bond-l">2x = 594 + 542 = 1136 kJ</text>
  <text x="462" y="288" class="matter-3-q-hf-bond-l">x ≈ 568 kJ/mol</text>
  <line x1="300" y1="229.9" x2="300" y2="357" style="stroke:var(--fig-green);stroke-width:2.6"/>
  <path d="M300 368 L294.5 357 L305.5 357 Z" style="fill:var(--fig-green)"/>
  <text x="312" y="320" class="matter-3-q-hf-bond-l" style="font-weight:700;fill:var(--fig-green)">ΔH = −542 kJ</text>
  <text x="360" y="432" text-anchor="middle" class="matter-3-q-hf-bond-s">끊는 데 흡수한 에너지 − 만들 때 방출한 에너지 = ΔH  (높이 차는 값에 비례)</text>
</svg>
