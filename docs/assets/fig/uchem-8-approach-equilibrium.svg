  <title id="t-uchem-8-approach-equilibrium">그림 일반화학 8-4 평형에 다가가는 농도와 두 방향의 속도</title>
  <desc id="d-uchem-8-approach-equilibrium">예제 1(A ⇌ B, k정 = 0.030 s⁻¹, k역 = 0.010 s⁻¹, 처음 A만 1.00 M)을 그렸다. 왼쪽: [A]는 0.25 M, [B]는 0.75 M으로 다가간다. 오른쪽: 정반응 속도는 줄고 역반응 속도는 늘어 7.5×10⁻³ M/s에서 같아진다. 평형에서도 두 속도는 0이 아니다.</desc>
