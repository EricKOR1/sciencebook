  <title id="t-uphy-5-venturi">그림 일반물리학 5-3 좁아지는 관 속의 흐름 — 연속 방정식과 베르누이 방정식</title>
  <desc id="d-uphy-5-venturi">수평 관이 좁아지는 곳에서 유선이 촘촘해지고 유체가 빨라진다(A₁v₁ = A₂v₂). 같은 높이에서 빠른 곳의 압력이 낮으므로, 관에 세운 가는 유리관의 액주 높이는 좁은 곳에서 더 낮다. 모식도이다.</desc>
