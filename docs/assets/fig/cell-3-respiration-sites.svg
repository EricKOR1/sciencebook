<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="t-cell-3-respiration-sites d-cell-3-respiration-sites">
<title id="t-cell-3-respiration-sites">그림 세포와 물질대사 3-2 세포호흡의 단계와 일어나는 장소</title>
<desc id="d-cell-3-respiration-sites">포도당은 세포질에서 해당 과정으로 피루브산 2분자가 되고, 미토콘드리아 기질에서 피루브산 산화와 TCA 회로를 거치며 탄소가 모두 이산화 탄소로 나간다. NADH와 FADH₂의 전자는 내막(크리스타)의 전자 전달계를 거쳐 산소에 전달되고, 이때 ATP 대부분이 만들어진다. 포도당 1분자 기준, 모식도.</desc>
<style>
.c3rs-lbl{font-size:13px;fill:var(--fig-ink)} .c3rs-b{font-size:14px;font-weight:700;fill:var(--fig-ink)} .c3rs-sm{font-size:13px;fill:var(--fig-muted)} .c3rs-arr{fill:none;stroke:var(--fig-ink);stroke-width:2} .c3rs-ah{fill:var(--fig-ink)} .c3rs-lead{fill:none;stroke:var(--fig-muted);stroke-width:1}
.c3rs-cyt{fill:var(--fig-soft-blue);opacity:0.55}
.c3rs-om{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2.5}
.c3rs-im{fill:var(--fig-soft-amber);stroke:var(--fig-red);stroke-width:2.5;stroke-linejoin:round}
.c3rs-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}
.c3rs-tca{fill:none;stroke:var(--fig-green);stroke-width:3} .c3rs-tcah{fill:var(--fig-green)}
.c3rs-g{font-size:13px;fill:var(--fig-green);font-weight:700}
.c3rs-reg{font-size:14px;font-weight:700;fill:var(--fig-blue)}
.c3rs-tot{font-size:14px;font-weight:700;fill:var(--fig-accent)}
</style>
<rect x="0" y="0" width="720" height="450" class="c3rs-cyt"/><text x="16" y="30" class="c3rs-reg">세포질</text><text x="20" y="72" class="c3rs-b">① 해당 과정</text><text x="20" y="92" class="c3rs-sm">세포질 · 산소 불필요</text><rect x="30" y="110" width="170" height="34" rx="8" class="c3rs-box"/><text x="115" y="132" text-anchor="middle" class="c3rs-lbl">포도당 (6C)</text><path d="M115 146 L115 186" class="c3rs-arr"/><path d="M115.0 192.0 L110.0 183.3 L120.0 183.3 Z" class="c3rs-ah"/><rect x="30" y="194" width="170" height="34" rx="8" class="c3rs-box"/><text x="115" y="216" text-anchor="middle" class="c3rs-lbl">피루브산 (3C) × 2</text><text x="20" y="252" class="c3rs-lbl">ATP 2(순) · NADH 2</text><rect x="246" y="44" width="460" height="372" rx="56" class="c3rs-om"/><path d="M262 108 Q262 60 310 60 L644 60 Q690 60 690 108 L690 352 Q690 400 644 400 L641 400 L641 336 Q632 326 623 336 L623 400 L593 400 L593 336 Q584 326 575 336 L575 400 L545 400 L545 336 Q536 326 527 336 L527 400 L497 400 L497 336 Q488 326 479 336 L479 400 L449 400 L449 336 Q440 326 431 336 L431 400 L401 400 L401 336 Q392 326 383 336 L383 400 L353 400 L353 336 Q344 326 335 336 L335 400 L305 400 L305 336 Q296 326 287 336 L287 400 L310 400 Q262 400 262 352 Z" class="c3rs-im"/><path d="M202 211 L280 211" class="c3rs-arr"/><path d="M286.0 211.0 L277.3 216.0 L277.3 206.0 Z" class="c3rs-ah"/><text x="640" y="38" class="c3rs-sm">외막</text><text x="652" y="88" class="c3rs-reg" text-anchor="end">기질</text><text x="296" y="90" class="c3rs-b">② 피루브산 산화</text><text x="296" y="112" class="c3rs-lbl">피루브산(3C) × 2 → 아세틸 CoA(2C) × 2</text><text x="296" y="132" class="c3rs-sm">CO₂ 2 · NADH 2</text><path d="M580 154 A46 46 0 1 1 547.8 167.3" class="c3rs-tca"/><path d="M549.8 168.3 L560.4 171.2 L552.6 179.0 Z" class="c3rs-tcah"/><text x="580" y="198" text-anchor="middle" class="c3rs-g">TCA</text><text x="580" y="216" text-anchor="middle" class="c3rs-g">회로</text><path d="M548 118 L566 148" class="c3rs-arr"/><path d="M569.0 153.0 L560.3 148.0 L569.0 143.0 Z" class="c3rs-ah"/><text x="296" y="186" class="c3rs-b">③ TCA 회로</text><text x="296" y="208" class="c3rs-lbl">아세틸 CoA 2분자 → 2회전</text><text x="296" y="230" class="c3rs-sm">CO₂ 4 · NADH 6 · FADH₂ 2 · ATP 2</text><text x="296" y="284" class="c3rs-b">④ 전자 전달계 · 산화적 인산화 (내막)</text><text x="296" y="306" class="c3rs-lbl">NADH 10 · FADH₂ 2의 전자 → O₂ (H₂O 생성) · ATP 약 28</text><path d="M488 330 L528 432" class="c3rs-lead"/><text x="534" y="438" class="c3rs-sm">내막의 주름(크리스타)</text><rect x="20" y="300" width="200" height="96" rx="8" class="c3rs-box"/><text x="120" y="324" text-anchor="middle" class="c3rs-lbl">포도당 1분자 합계</text><text x="120" y="350" text-anchor="middle" class="c3rs-tot">CO₂ 6 · ATP 약 32</text><text x="120" y="374" text-anchor="middle" class="c3rs-sm">NADH 10, FADH₂ 2는</text><text x="120" y="390" text-anchor="middle" class="c3rs-sm">④에서 소모</text><text x="20" y="438" class="c3rs-sm">모식도(크기 비율은 실제와 다름)</text></svg>
