<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-esys-1-q-crossover-range d-esys-1-q-crossover-range">
  <title id="t-esys-1-q-crossover-range">그림 지구시스템과학 1-15 문제 16 해설의 관측 범위와 교차 거리</title>
  <desc id="d-esys-1-q-crossover-range">지각 6.0 km/s, 맨틀 최상부 8.0 km/s, 지각 두께 33 km로 계산한 주시 곡선이다. 교차 거리는 약 175 km이므로, 학생이 관측한 10~120 km 범위(색칠한 부분)에서는 직접파만 먼저 도착하여 원점을 지나는 직선 하나만 나타난다.</desc>
  <style>
    .esys-1-q-crossover-range-t{font-size:14px;fill:var(--fig-ink)} .esys-1-q-crossover-range-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .esys-1-q-crossover-range-s{font-size:13px;fill:var(--fig-muted)} .esys-1-q-crossover-range-ax{fill:none;stroke:var(--fig-muted);stroke-width:1.4} .esys-1-q-crossover-range-gr{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4}
  </style>
