  <line x1="80" y1="190" x2="540" y2="190" class="esys-1-q-crossover-range-gr"/>
  <text x="74" y="195" text-anchor="end" class="esys-1-q-crossover-range-s">20</text>
  <line x1="80" y1="140" x2="540" y2="140" class="esys-1-q-crossover-range-gr"/>
  <text x="74" y="145" text-anchor="end" class="esys-1-q-crossover-range-s">30</text>
