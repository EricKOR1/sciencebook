<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" role="img" aria-labelledby="t-3-5-organization-levels d-3-5-organization-levels">
<title id="t-3-5-organization-levels">그림 3-5-1 동물과 식물의 구성 단계 비교</title>
<desc id="d-3-5-organization-levels">동물은 세포 → 조직 → 기관 → 기관계 → 개체, 식물은 세포 → 조직 → 조직계 → 기관 → 개체로 구성된다. 기관계는 동물에만, 조직계는 식물에만 있다.</desc>
<style>
  .c35org-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}
  .c35org-boxv{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2}
  .c35org-name{font-size:15px;font-weight:600;fill:var(--fig-ink)} .c35org-ex{font-size:12px;fill:var(--fig-muted)}
  .c35org-row{font-size:15px;font-weight:700;fill:var(--fig-accent)} .c35org-note{font-size:12px;fill:var(--fig-muted)}
  .c35org-tagv{font-size:12px;font-weight:600;fill:var(--fig-violet)}
  .c35org-arr{fill:none;stroke:var(--fig-ink);stroke-width:2} .c35org-arrh{fill:var(--fig-ink)}
  .c35org-sep{fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4}
  .c35org-musc{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5} .c35org-nuc{fill:var(--fig-violet)}
  .c35org-stom{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2}
  .c35org-tube{fill:none;stroke:var(--fig-amber);stroke-width:4;stroke-linecap:round}
  .c35org-body{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5}
  .c35org-wall{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2} .c35org-cyto{fill:var(--fig-panel)}
  .c35org-none{fill:none;stroke:none}
  .c35org-leafin{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.5}
  .c35org-epi{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.2}
  .c35org-vein{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.5}
  .c35org-leaf{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2}
