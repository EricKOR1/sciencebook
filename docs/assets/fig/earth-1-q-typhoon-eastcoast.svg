  <title id="t-earth-1-q-typhoon-eastcoast">그림 지구과학 1-17 문제 7의 태풍 진로</title>
  <desc id="d-earth-1-q-typhoon-eastcoast">태풍이 우리나라 동해안을 따라 북상한 진로(빨간 점선)와 서울의 위치를 나타낸 지도이다. 작은 섬은 생략하였다.</desc>
