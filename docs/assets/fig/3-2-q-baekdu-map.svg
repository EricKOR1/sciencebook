<title id="t-3-2-q-baekdu-map">그림 3-2-9 문제 13의 백두산 위치와 상공의 바람</title>
<desc id="d-3-2-q-baekdu-map">한반도 주변 지도에 백두산의 위치와, 이 지역 상공에서 주로 부는 바람의 방향(서쪽에서 동쪽)을 나타냈다. 작은 섬은 생략한 지도이다.</desc>
