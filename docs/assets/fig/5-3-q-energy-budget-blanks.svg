  <title id="t-5-3-q-energy-budget-blanks">그림 5-3-6 문제 5의 지구 열수지</title>
  <desc id="d-5-3-q-energy-budget-blanks">지구에 들어오는 태양 복사를 100으로 둔 지구 열수지이다. 반사 30, 대기 흡수 23, 지표 복사 116, 그중 대기를 그대로 통과하는 12, 증발 23, 전도·대류 5는 주어진 값이고, (가)~(다)는 구할 값이다. 화살표 굵기는 크기와 무관하다.</desc>
