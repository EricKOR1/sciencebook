  <text x="120" y="190" text-anchor="middle" class="ld-lbl">목이 짧은 조상 기린</text>
  <text x="120" y="208" text-anchor="middle" class="ld-sm">높은 곳의 잎을 먹으려 한다</text>
  <text x="360" y="190" text-anchor="middle" class="ld-lbl">애써 목을 늘이다 보니</text>
  <text x="360" y="208" text-anchor="middle" class="ld-sm">살면서 목이 길어졌다고 봄</text>
  <text x="600" y="190" text-anchor="middle" class="ld-lbl">늘어난 목이 자손에게 유전된다고 봄</text>
  <text x="600" y="208" text-anchor="middle" class="ld-red">✗ 살면서 얻은 형질은 유전되지 않는다</text>
