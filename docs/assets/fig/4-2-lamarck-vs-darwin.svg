  <text x="120" y="424" text-anchor="middle" class="ld-sm">유전적 변이가 먼저 있다</text>
  <text x="360" y="406" text-anchor="middle" class="ld-lbl">높은 잎만 남으면</text>
  <text x="360" y="424" text-anchor="middle" class="ld-sm">목이 긴 개체가 더 많이 살아남아 번식</text>
