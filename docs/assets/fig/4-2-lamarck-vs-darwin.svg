<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-4-2-lamarck-vs-darwin d-4-2-lamarck-vs-darwin">
  <title id="t-4-2-lamarck-vs-darwin">그림 4-2-1 기린의 목으로 비교한 용불용설과 자연선택설</title>
  <desc id="d-4-2-lamarck-vs-darwin">라마르크는 기린이 살면서 목을 늘였고 그 형질이 유전되었다고 보았지만, 살면서 얻은 형질은 유전되지 않는다. 자연선택설에서는 목 길이가 다양한 변이가 먼저 있고, 높은 잎만 남은 환경에서 목이 긴 개체가 더 많이 살아남아 자손을 남겨 여러 세대 뒤 목이 긴 개체의 비율이 높아진다. 모식도.</desc>
  <style>
    .ld-lbl{font-size:14px;fill:var(--fig-ink)} .ld-b{font-weight:600} .ld-h{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .ld-sm{font-size:13px;fill:var(--fig-muted)} .ld-red{font-size:13px;fill:var(--fig-red);font-weight:600} .ld-grn{font-size:13px;fill:var(--fig-green);font-weight:600}
    .ld-leg{stroke:var(--fig-amber);stroke-width:3;stroke-linecap:round;fill:none}
    .ld-neck-o{stroke:var(--fig-amber);stroke-width:8;stroke-linecap:round;fill:none}
    .ld-neck-i{stroke:var(--fig-soft-amber);stroke-width:4;stroke-linecap:round;fill:none}
    .ld-body{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.6}
    .ld-trunk{fill:var(--fig-soft-amber);stroke:var(--fig-muted);stroke-width:1.2}
    .ld-leaf{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.5}
    .ld-ground{stroke:var(--fig-line);stroke-width:1.5;fill:none}
    .ld-arr{stroke:var(--fig-muted);stroke-width:2;fill:none} .ld-arrh{fill:var(--fig-muted)}
    .ld-x{stroke:var(--fig-red);stroke-width:3;stroke-linecap:round;fill:none}
    .ld-dead{opacity:0.35}
    .ld-ghost{stroke:var(--fig-amber);stroke-width:1.5;stroke-dasharray:3 3;fill:none}
    .ld-up{stroke:var(--fig-blue);stroke-width:2;fill:none} .ld-uph{fill:var(--fig-blue)}
  </style>
