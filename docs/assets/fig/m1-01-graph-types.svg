<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t-m1-01-graph-types d-m1-01-graph-types">
<title id="t-m1-01-graph-types">그림 중1-1-3 자료에 맞는 그래프 고르기</title>
<desc id="d-m1-01-graph-types">시간에 따라 연속으로 변하는 값은 꺾은선 그래프, 여러 항목의 크기 비교는 막대그래프, 전체에서 각 부분의 비율은 원그래프로 나타낸다. 그래프의 값은 설명을 위한 예시이다.</desc>
<style>
  .m101g-ttl{font-size:16px;font-weight:700;fill:var(--fig-ink)}
  .m101g-ink{font-size:14px;fill:var(--fig-ink)}
