<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="t-uphy-11-q-mirror-rays d-uphy-11-q-mirror-rays">
  <title id="t-uphy-11-q-mirror-rays">그림 일반물리학 11-8 예제 3 풀이의 광선 작도</title>
  <desc id="d-uphy-11-q-mirror-rays">(1) 초점 거리 20 cm인 오목 거울 앞 30 cm의 물체는 거울 앞 60 cm에 거꾸로 선 2배 실상을 만든다. (2) 같은 거울 앞 10 cm의 물체는 거울 뒤 20 cm에 똑바로 선 2배 허상을 만든다. (3) 초점 거리 −30 cm인 볼록 거울 앞 60 cm의 물체는 거울 뒤 20 cm에 똑바로 선 1/3배 허상을 만든다. 광축에 평행하게 들어온 광선, 꼭짓점으로 간 광선, 초점을 향하는(지나는) 광선을 그렸고, 점선은 반사 광선을 거울 뒤로 연장한 선이다. 칸마다 축척이 다르다.</desc>
