<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-cell-3-chloroplast d-cell-3-chloroplast">
  <title id="t-cell-3-chloroplast">그림 세포와 물질대사 3-5 엽록체의 구조</title>
  <desc id="d-cell-3-chloroplast">엽록체는 외막과 내막의 2중막으로 싸여 있다. 내막 안의 액체 부분인 스트로마에는 자체 DNA와 리보솜, 탄소 고정반응의 효소가 있다. 납작한 주머니 모양의 틸라코이드가 동전처럼 쌓여 그라나를 이루고, 그라나 사이는 틸라코이드 막으로 이어진다. 틸라코이드 막에서 명반응이 일어나며 틸라코이드 내부에는 H⁺이 모인다. 모식도(크기 비율은 실제와 다름).</desc>
