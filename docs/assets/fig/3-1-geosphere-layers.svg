<text x="40.0" y="394" text-anchor="middle" class="gl-sm" style="fill:var(--fig-ink)">6400</text>
<text x="372" y="394" class="gl-sm">깊이(km)</text>
<text x="40" y="412" text-anchor="middle" class="gl-sm">지구 중심</text>
<text x="212.5" y="199.5" text-anchor="middle" class="gl-lbl">맨틀</text>
<text x="124.9" y="292.1" text-anchor="middle" class="gl-lbl">외핵</text>
<text x="65.3" y="351.7" text-anchor="middle" class="gl-lbl" style="fill:var(--fig-paper)">내핵</text>
<circle cx="188.8" cy="92.1" r="2.5" style="fill:var(--fig-ink)"/>
<path d="M188.8 92.1L412 61" class="gl-ld"/>
<text x="420" y="66" class="gl-lbl">지각</text>
<text x="478" y="66" class="gl-txt">깊이: 대륙 약 35 km, 해양 약 5~10 km</text>
<text x="478" y="84" class="gl-sm">고체 · 대륙은 화강암질, 해양은 현무암질</text>
<circle cx="241.2" cy="132.2" r="2.5" style="fill:var(--fig-ink)"/>
<path d="M241.2 132.2L412 143" class="gl-ld"/>
<text x="420" y="148" class="gl-lbl">모호면</text>
<text x="478" y="148" class="gl-txt">지각과 맨틀의 경계</text>
<text x="478" y="166" class="gl-sm">지진파 속도가 갑자기 변한다</text>
<circle cx="285.9" cy="218.3" r="2.5" style="fill:var(--fig-ink)"/>
<path d="M285.9 218.3L412 209" class="gl-ld"/>
