<text x="215.0" y="394" text-anchor="middle" class="gl-sm" style="fill:var(--fig-ink)">2900</text>
<path d="M105.0 372v6" class="gl-ax"/>
<text x="105.0" y="394" text-anchor="middle" class="gl-sm" style="fill:var(--fig-ink)">5100</text>
