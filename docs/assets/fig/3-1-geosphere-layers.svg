<text x="478" y="350" class="gl-txt">약 5100 ~ 6400 km(중심)</text>
<text x="478" y="368" class="gl-sm">고체 · 철과 니켈 · 압력이 매우 크다</text>
<text x="40" y="28" class="gl-sm">지구 반지름 약 6400 km · 지각 두께는 과장</text>
