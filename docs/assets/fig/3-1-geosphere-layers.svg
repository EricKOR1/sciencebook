<text x="478" y="286" class="gl-txt">약 2900 ~ 5100 km</text>
<text x="478" y="304" class="gl-sm">액체 · 철과 니켈 · 지구 자기장을 만든다</text>
<circle cx="84.0" cy="362.6" r="2.5" style="fill:var(--fig-ink)"/>
