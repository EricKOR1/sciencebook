<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-3-1-geosphere-layers d-3-1-geosphere-layers">
<title id="t-3-1-geosphere-layers">그림 3-1-3 지권의 층 구조 (지구의 4분의 1 단면)</title>
<desc id="d-3-1-geosphere-layers">지구 중심에서 지표까지를 4분의 1 단면으로 나타냈다. 맨틀, 외핵, 내핵의 두께는 실제 비율대로이고, 지각은 너무 얇아(대륙 약 35 km) 보이도록 두껍게 과장했다. 지권의 층은 구성 물질과 상태로 나누며, 액체인 층은 외핵뿐이다.</desc>
<style>.gl-lbl{font-size:15px;font-weight:700;fill:var(--fig-ink)}.gl-txt{font-size:13px;fill:var(--fig-ink)}.gl-sm{font-size:12px;fill:var(--fig-muted)}.gl-ld{fill:none;stroke:var(--fig-ink);stroke-width:1}.gl-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.5}</style>
<path d="M40 372L360.0 372A320.0 320.0 0 0 0 40 52.0Z" style="fill:var(--fig-amber)"/>
<path d="M40 372L353.0 372A313.0 313.0 0 0 0 40 59.0Z" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1"/>
<path d="M40 372L215.0 372A175.0 175.0 0 0 0 40 197.0Z" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5"/>
<path d="M40 372L105.0 372A65.0 65.0 0 0 0 40 307.0Z" style="fill:var(--fig-red)"/>
