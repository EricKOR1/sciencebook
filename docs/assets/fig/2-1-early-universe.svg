<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img" aria-labelledby="t-2-1-early-universe d-2-1-early-universe">
  <title id="t-2-1-early-universe">그림 2-1-3 우주 초기 — 양성자·중성자에서 원자까지</title>
  <desc id="d-2-1-early-universe">약 1초 이내에 양성자와 중성자(개수비 약 7 : 1)가 만들어지고, 약 3분 무렵 중성자가 거의 모두 헬륨 원자핵에 들어가며, 약 38만 년에 우주가 약 3000 K로 식자 원자핵이 전자를 붙잡아 수소·헬륨 원자가 된다. 그 전에는 빛이 자유로운 전자에 계속 부딪혀 꺾였지만, 원자가 생긴 뒤에는 자유롭게 지나간다. 모식도이며 입자 수는 예제 3의 개수비(양성자 14, 중성자 2)를 따랐다.</desc>
