    .uchem-2-vt-extrapolation-n{font-size:13px;fill:var(--fig-muted)}
    .uchem-2-vt-extrapolation-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-2-vt-extrapolation-k{font-size:14px;font-weight:600;fill:var(--fig-red)}
