<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-uchem-2-vt-extrapolation d-uchem-2-vt-extrapolation">
  <title id="t-uchem-2-vt-extrapolation">그림 일반화학 2-3 V–t 직선을 외삽해 찾은 절대 영도</title>
  <desc id="d-uchem-2-vt-extrapolation">압력이 일정할 때 양이 다른 세 기체 시료의 부피는 섭씨 온도에 대해 직선으로 변한다. 측정한 구간(실선)을 낮은 온도 쪽으로 연장하면(점선) 세 직선이 모두 −273.15 °C에서 부피 0에 모인다. 실제 기체는 그 전에 액화한다.</desc>
