<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uphy-7-adiabat-isotherm d-uphy-7-adiabat-isotherm">
  <title id="t-uphy-7-adiabat-isotherm">그림 일반물리학 7-7 단열선은 등온선보다 가파르다</title>
  <desc id="d-uphy-7-adiabat-isotherm">같은 상태 A에서 출발한 등온선(PV = 일정)과 단열선(PV^γ = 일정, γ = 1.40)을 P–V 그림에 그렸다. 단열 팽창하면 B에 이르러 등온 팽창의 B′보다 압력이 낮다. 단열선은 팽창할 때 더 낮은 온도의 등온선으로, 압축할 때 더 높은 온도의 등온선으로 건너간다. 점선은 다른 온도의 등온선이다.</desc>
