<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-umath-8-laplace-square d-umath-8-laplace-square">
  <title id="t-umath-8-laplace-square">그림 수학 도구 8-5 정사각형 판의 라플라스 방정식 해와 등치선</title>
  <desc id="d-umath-8-laplace-square">한 변 a인 정사각형 판에서 아래·왼쪽·오른쪽 변은 u = 0, 위쪽 변은 u = u₀ sin(πx/a)이다. 해 u = u₀ sin(πx/a) sinh(πy/a)/sinh π의 등치선 0.1u₀부터 0.9u₀까지를 그렸다. 판 가운데의 값은 약 0.20u₀이고, 최댓값 u₀은 내부가 아니라 경계(위쪽 변 가운데)에 있다.</desc>
