<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-labelledby="t-ubio-10-q-cell-water d-ubio-10-q-cell-water">
  <title id="t-ubio-10-q-cell-water">그림 일반생명과학 10-4 예제 3 풀이 — 주위 용액에 따라 달라지는 물의 이동</title>
  <desc id="d-ubio-10-q-cell-water">같은 시든 세포(Ψ = −0.80 MPa)를 (1) 순수한 물(Ψ = 0)에 넣으면 물이 세포로 들어와 원형질이 세포벽을 밀고 팽압이 생기며, 평형에서 Ψp = +0.80 MPa가 된다. (2) 0.40 M 설탕 용액(Ψ = −0.97 MPa)에 넣으면 물이 세포에서 빠져나가 원형질이 세포벽에서 떨어진다(원형질 분리). 화살표는 물의 알짜 이동 방향이다. 모식도이다.</desc>
  <style>.ubio-10-q-cell-water-t{font-size:14px;fill:var(--fig-ink)} .ubio-10-q-cell-water-s{font-size:13px;fill:var(--fig-muted)} .ubio-10-q-cell-water-b{font-size:14px;fill:var(--fig-ink);font-weight:700} .ubio-10-q-cell-water-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-10-q-cell-water-r{font-size:14px;fill:var(--fig-red);font-weight:700} .ubio-10-q-cell-water-bl{font-size:14px;fill:var(--fig-blue);font-weight:700} .ubio-10-q-cell-water-g{font-size:14px;fill:var(--fig-green);font-weight:700} .ubio-10-q-cell-water-a{font-size:14px;fill:var(--fig-amber);font-weight:700} .ubio-10-q-cell-water-v{font-size:14px;fill:var(--fig-violet);font-weight:700}</style>
  <text x="180.0" y="30.0" text-anchor="middle" class="ubio-10-q-cell-water-h">(1) 순수한 물</text>
  <text x="180.0" y="50.0" text-anchor="middle" class="ubio-10-q-cell-water-s">Ψ = 0</text>
  <rect x="40.0" y="66.0" width="280.0" height="196.0" rx="6" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <rect x="118.0" y="112.0" width="124.0" height="104.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-green);stroke-width:5"/>
  <rect x="123.0" y="117.0" width="114.0" height="94.0" rx="5" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.2"/>
  <text x="180.0" y="158.0" text-anchor="middle" class="ubio-10-q-cell-water-b">세포</text>
  <text x="180.0" y="178.0" text-anchor="middle" class="ubio-10-q-cell-water-t">Ψ: −0.80 → 0</text>
  <line x1="55.0" y1="164.0" x2="99.0" y2="164.0" style="stroke:var(--fig-blue);stroke-width:3"/>
  <path d="M110.0 164.0 L99.0 169.5 L99.0 158.5 Z" style="fill:var(--fig-blue);stroke:none"/>
  <line x1="305.0" y1="164.0" x2="261.0" y2="164.0" style="stroke:var(--fig-blue);stroke-width:3"/>
  <path d="M250.0 164.0 L261.0 158.5 L261.0 169.5 Z" style="fill:var(--fig-blue);stroke:none"/>
  <line x1="180.0" y1="72.0" x2="180.0" y2="95.0" style="stroke:var(--fig-blue);stroke-width:3"/>
  <path d="M180.0 106.0 L174.5 95.0 L185.5 95.0 Z" style="fill:var(--fig-blue);stroke:none"/>
  <line x1="180.0" y1="256.0" x2="180.0" y2="233.0" style="stroke:var(--fig-blue);stroke-width:3"/>
  <path d="M180.0 222.0 L185.5 233.0 L174.5 233.0 Z" style="fill:var(--fig-blue);stroke:none"/>
  <text x="180.0" y="290.0" text-anchor="middle" class="ubio-10-q-cell-water-b">물이 들어감 → 평형에서 Ψp = +0.80 MPa</text>
  <text x="540.0" y="30.0" text-anchor="middle" class="ubio-10-q-cell-water-h">(2) 0.40 M 설탕 용액</text>
  <text x="540.0" y="50.0" text-anchor="middle" class="ubio-10-q-cell-water-s">Ψ = −0.97 MPa</text>
  <rect x="400.0" y="66.0" width="280.0" height="196.0" rx="6" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <rect x="478.0" y="112.0" width="124.0" height="104.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-green);stroke-width:5"/>
