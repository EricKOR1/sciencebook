  <text x="540.0" y="178.0" text-anchor="middle" class="ubio-10-q-cell-water-t">−0.80</text>
  <line x1="470.0" y1="164.0" x2="426.0" y2="164.0" style="stroke:var(--fig-blue);stroke-width:3"/>
  <path d="M415.0 164.0 L426.0 158.5 L426.0 169.5 Z" style="fill:var(--fig-blue);stroke:none"/>
