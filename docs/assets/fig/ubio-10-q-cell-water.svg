  <path d="M540.0 72.0 L545.5 83.0 L534.5 83.0 Z" style="fill:var(--fig-blue);stroke:none"/>
  <line x1="540.0" y1="222.0" x2="540.0" y2="245.0" style="stroke:var(--fig-blue);stroke-width:3"/>
  <path d="M540.0 256.0 L534.5 245.0 L545.5 245.0 Z" style="fill:var(--fig-blue);stroke:none"/>
  <text x="540.0" y="290.0" text-anchor="middle" class="ubio-10-q-cell-water-b">물이 빠져나감 → 원형질 분리</text>
</svg>
