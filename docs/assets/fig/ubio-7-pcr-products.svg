<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-ubio-7-pcr-products d-ubio-7-pcr-products">
<title id="t-ubio-7-pcr-products">그림 일반생명과학 7-7 PCR 주기에 따른 산물의 종류</title>
<desc id="d-ubio-7-pcr-products">이중 가닥 주형 1분자에서 시작한 PCR의 0~3주기 산물. 1·2주기에는 한쪽 끝이 주형 끝까지 이어진 긴 산물만 생기고, 양 끝이 모두 프라이머 위치로 정해진 원하는 길이의 이중 가닥은 3주기에 처음 2개 나타난다. n주기 뒤 원하는 길이의 이중 가닥 수는 2ⁿ − 2n이다. 모식도이다.</desc>
