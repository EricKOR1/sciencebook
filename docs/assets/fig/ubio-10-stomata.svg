  <title id="t-ubio-10-stomata">그림 일반생명과학 10-6 기공이 열리고 닫히는 원리</title>
  <desc id="d-ubio-10-stomata">잎 표면에서 본 공변세포 모식도. 공변세포 벽의 셀룰로스 미세 섬유가 구멍을 중심으로 방사상으로 감겨 있어, 부풀면 굵어지지 못하고 길어지며 바깥으로 휜다. 열릴 때: 청색광과 낮은 CO₂에 양성자 펌프가 활성화되어 K⁺와 Cl⁻가 들어오고, 수분 퍼텐셜이 낮아져 물이 들어와 팽압이 커지며 기공이 벌어진다. 닫힐 때: ABA, 어둠, 높은 CO₂에 이온이 빠져나가고 물이 나가 팽압이 줄어 기공이 닫힌다.</desc>
