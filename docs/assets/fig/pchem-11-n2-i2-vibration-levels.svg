<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-pchem-11-n2-i2-vibration-levels d-pchem-11-n2-i2-vibration-levels">
  <title id="t-pchem-11-n2-i2-vibration-levels">그림 물리화학 11-5 298 K에서 N₂와 I₂의 진동 준위와 점유</title>
  <desc id="d-pchem-11-n2-i2-vibration-levels">같은 파수 눈금(0~2600 cm⁻¹)에 그린 두 조화 진동자의 준위(영점 에너지를 0으로). N₂는 간격 2359 cm⁻¹여서 v = 1이 k_BT/hc = 207 cm⁻¹(빨간 점선)보다 훨씬 높고, 점유는 v = 0에 0.99999, v = 1에 1.1×10⁻⁵이다. I₂는 간격 214.5 cm⁻¹여서 v = 0~6의 점유가 0.645, 0.229, 0.081, 0.029, 0.010, 0.004, 0.001로 여러 준위에 퍼져 있다.</desc>
  <style>
    .pchem-11-n2-i2-vibration-levels-t{font-size:14px;fill:var(--fig-ink)}
    .pchem-11-n2-i2-vibration-levels-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .pchem-11-n2-i2-vibration-levels-h{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .pchem-11-n2-i2-vibration-levels-s{font-size:13px;fill:var(--fig-muted)}
    .pchem-11-n2-i2-vibration-levels-ax{font-size:13px;fill:var(--fig-muted)}
    .pchem-11-n2-i2-vibration-levels-big{font-size:18px;font-weight:600;fill:var(--fig-ink)}
  </style>
