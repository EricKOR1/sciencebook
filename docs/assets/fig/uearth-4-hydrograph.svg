<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-uearth-4-hydrograph d-uearth-4-hydrograph">
<title id="t-uearth-4-hydrograph">그림 일반지구과학 4-4 수문 곡선 — 도시화 전과 후</title>
<desc id="d-uearth-4-hydrograph">같은 비(위 막대)가 내려도 도시화된 유역에서는 하천 유량이 더 빨리, 더 크게 늘어 첨두 유량이 커지고 지체 시간이 짧아진다. 맑은 날에 하천을 유지하는 기저 유출은 지하수 함양이 줄어 작아진다. 곡선의 모양은 개념을 보여 주는 모식도이다.</desc>
