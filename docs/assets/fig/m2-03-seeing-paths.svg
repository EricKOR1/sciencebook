  <text x="518.0" y="236.0" text-anchor="middle" class="m2-03-seeing-paths-s">반사된 빛은 사방으로 퍼지고, 일부가 눈에 들어온다</text>
  <text x="360.0" y="280.0" text-anchor="middle" class="m2-03-seeing-paths-t">빛의 경로: 광원 → (물체에서 반사) → 눈.  눈에서 물체 쪽으로 그린 화살표는 틀린 표현이다.</text>
</svg>
