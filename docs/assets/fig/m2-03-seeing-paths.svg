<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-m2-03-seeing-paths d-m2-03-seeing-paths">
  <title id="t-m2-03-seeing-paths">그림 중2-3-4 물체를 보는 과정과 빛의 경로</title>
  <desc id="d-m2-03-seeing-paths">(가) 전등 같은 광원을 볼 때는 광원에서 나온 빛이 곧바로 눈에 들어온다. (나) 사과처럼 스스로 빛을 내지 않는 물체는 광원에서 온 빛이 물체 표면에서 여러 방향으로 반사되고, 그중 일부가 눈에 들어와 보인다. 화살표는 항상 광원에서 출발해 눈 쪽을 향한다.</desc>
  <style>
    .m2-03-seeing-paths-t{font-size:14px;fill:var(--fig-ink)}
    .m2-03-seeing-paths-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .m2-03-seeing-paths-s{font-size:13px;fill:var(--fig-muted)}

  </style>
