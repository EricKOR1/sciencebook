<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img" aria-labelledby="t-pchem-4-kelvin-curvature d-pchem-4-kelvin-curvature">
  <title id="t-pchem-4-kelvin-curvature">그림 물리화학 4-11 켈빈 식: 휘어진 표면의 증기 압력</title>
  <desc id="d-pchem-4-kelvin-curvature">왼쪽: 25 ℃ 물에서 p/p* = exp(±1.05 nm/r)를 반지름 r(로그 눈금)에 대해 그린 그래프. 볼록한 표면(물방울)은 p/p*가 1보다 크고 r = 1 nm에서 2.86, 오목한 표면(메니스커스)은 1보다 작고 r = 1 nm에서 0.35이며, r이 커지면 둘 다 1에 가까워진다. 오른쪽: 작은 물방울은 증발이 쉽고(p &gt; p*), 가는 관 속 오목한 메니스커스에서는 응축이 쉽다(p &lt; p*).</desc>
