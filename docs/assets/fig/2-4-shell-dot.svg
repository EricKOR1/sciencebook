<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-2-4-shell-dot d-2-4-shell-dot">
  <title id="t-2-4-shell-dot">그림 2-4-3 전자껍질 모형과 전자 점식</title>
  <desc id="d-2-4-shell-dot">위 줄은 원자핵 둘레의 전자껍질에 전자가 들어 있는 모습이고, 아래 줄은 그중 가장 바깥 껍질의 전자(원자가 전자)만 원소 기호 둘레에 점으로 나타낸 전자 점식이다. 네 방향에 하나씩 찍은 뒤 다섯 번째부터 짝을 지으며, 짝이 없는 점(노란 테)의 수가 공유 결합의 손 개수이다. 모식도.</desc>
