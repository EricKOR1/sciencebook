    .sd-lbl{font-size:15px;font-weight:600;fill:var(--fig-ink)} .sd-t{font-size:14px;fill:var(--fig-ink)}
    .sd-sm{font-size:13px;fill:var(--fig-muted)} .sd-sym{font-size:28px;font-weight:700;fill:var(--fig-ink)}
    .sd-nuc{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.4} .sd-nt{font-size:12px;font-weight:700;fill:var(--fig-red)}
    .sd-sh{fill:none;stroke:var(--fig-line);stroke-width:1.3} .sd-in{fill:var(--fig-muted)} .sd-val{fill:var(--fig-blue)}
    .sd-dot{fill:var(--fig-blue)} .sd-one{fill:none;stroke:var(--fig-amber);stroke-width:2}
    .sd-sep{stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4} .sd-ar{fill:var(--fig-accent)} .sd-acc{font-size:13px;font-weight:600;fill:var(--fig-accent)}
  </style>
