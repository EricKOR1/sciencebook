<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-3-1-water-cycle d-3-1-water-cycle">
<title id="t-3-1-water-cycle">그림 3-1-5 물의 순환과 숨은열의 이동</title>
<desc id="d-3-1-water-cycle">바다와 지표의 물이 태양 에너지로 증발·증산하여 대기로 가고, 응결하여 구름이 된 뒤 강수로 떨어지며, 하천과 지하수를 따라 다시 바다로 돌아온다. 증발할 때 흡수한 숨은열은 응결할 때 방출된다. 크기와 거리는 실제와 다른 모식도이다.</desc>
<style>.wc-txt{font-size:13px;fill:var(--fig-ink)}.wc-b{font-size:14px;font-weight:700;fill:var(--fig-ink)}.wc-sm{font-size:12px;fill:var(--fig-muted)}.wc-e{font-size:12px;fill:var(--fig-amber);font-weight:700}.wc-ar{fill:none;stroke:var(--fig-blue);stroke-width:3}.wc-ah{fill:var(--fig-blue)}.wc-gw{fill:none;stroke:var(--fig-blue);stroke-width:2.5;stroke-dasharray:6 4}.wc-cloud{fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.5}.wc-rain{fill:none;stroke:var(--fig-blue);stroke-width:1.6;stroke-linecap:round}.wc-sea{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.2}.wc-land{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.5}.wc-soil{fill:var(--fig-soft-amber)}</style>
