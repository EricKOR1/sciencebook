<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-cell-1-fractionation d-cell-1-fractionation">
<title id="t-cell-1-fractionation">그림 세포와 물질대사 1-4 세포 분획법</title>
<desc id="d-cell-1-fractionation">세포를 깨뜨린 균질액을 원심 분리하면 크고 무거운 핵이 먼저 가라앉고, 위에 남은 액체(상층액)를 옮겨 더 빠르게 돌릴 때마다 미토콘드리아·엽록체, 소포체·골지체 조각 같은 막 조각, 리보솜 순서로 가라앉는다. 모식도.</desc>
<style>
.c1fr-tube{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2}
.c1fr-liq{fill:var(--fig-soft-blue)}
.c1fr-pel{fill:var(--fig-amber);stroke:var(--fig-amber);stroke-width:1}
.c1fr-nuc{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5}
.c1fr-mit{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5}
.c1fr-mem{fill:none;stroke:var(--fig-teal);stroke-width:2;stroke-linecap:round}
.c1fr-rib{fill:var(--fig-ink)}
.c1fr-arr{fill:none;stroke:var(--fig-muted);stroke-width:2} .c1fr-ah{fill:var(--fig-muted)}
.c1fr-spd{fill:var(--fig-accent)}
.c1fr-lbl{font-size:14px;fill:var(--fig-ink);font-weight:600} .c1fr-sm{font-size:13px;fill:var(--fig-muted)}
.c1fr-pl{font-size:13px;fill:var(--fig-ink)}
</style>
