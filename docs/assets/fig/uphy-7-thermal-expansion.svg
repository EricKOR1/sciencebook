<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-uphy-7-thermal-expansion d-uphy-7-thermal-expansion">
  <title id="t-uphy-7-thermal-expansion">그림 일반물리학 7-1 비대칭 퍼텐셜 곡선과 열팽창</title>
  <desc id="d-uphy-7-thermal-expansion">이웃 원자 사이의 퍼텐셜 에너지 U를 원자 간 거리 r에 대해 그린 곡선은 가까워질 때 가파르고 멀어질 때 완만하다. 온도가 오르면 진동 에너지(가로선)가 높아져 진동 범위가 넓어지는데, 범위가 오른쪽(먼 쪽)으로 더 많이 넓어지므로 진동 범위의 중심(점)이 r₀보다 점점 오른쪽으로 옮겨 간다. 이것이 열팽창이다. 모식도이다.</desc>
