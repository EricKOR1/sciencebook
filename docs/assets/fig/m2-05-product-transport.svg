<text x="480" y="161" class="m2-05-tr-s">엽록체에 잠시 저장</text>
<line x1="470" y1="140" x2="480" y2="90" style="stroke:var(--fig-muted);stroke-width:1"/>
<rect x="470" y="190" width="236" height="71" rx="6" class="m2-05-tr-card" style="stroke:var(--fig-amber)"/>
<text x="480" y="212" class="m2-05-tr-k">② 이동(주로 밤): 녹말 → 설탕</text>
<text x="480" y="231" class="m2-05-tr-s">설탕이 체관을 따라</text>
