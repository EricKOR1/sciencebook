<line x1="20" y1="66" x2="50" y2="66" style="stroke:var(--fig-amber);stroke-width:4"/><text x="58" y="71" class="m2-05-tr-k">체관: 양분(설탕) (위·아래 모두)</text>
<text x="274" y="262" text-anchor="end" class="m2-05-tr-s">줄기</text>
</svg>