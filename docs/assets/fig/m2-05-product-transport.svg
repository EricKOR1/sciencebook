<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-m2-05-tr d-m2-05-tr">
  <title id="t-m2-05-tr">그림 중2-5-3 광합성 산물의 이동과 저장</title>
  <desc id="d-m2-05-tr">낮에 잎에서 만든 포도당은 녹말로 바뀌어 잎에 잠시 저장되고, 주로 밤에 물에 잘 녹는 설탕으로 바뀌어 체관을 따라 위아래로 이동한다. 열매, 씨, 뿌리 같은 저장 기관에서는 녹말·설탕·단백질·지방 등으로 바뀌어 저장된다. 물과 무기 양분은 물관을 따라 뿌리에서 잎으로 올라간다. 모식도이다.</desc>
  <style>
    .m2-05-tr-t{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .m2-05-tr-k{font-size:14px;fill:var(--fig-ink)}
    .m2-05-tr-s{font-size:13px;fill:var(--fig-muted)}
    .m2-05-tr-leaf{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2}
    .m2-05-tr-card{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2}
  </style>
