<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-uphy-9-lorentz-force d-uphy-9-lorentz-force">
  <title id="t-uphy-9-lorentz-force">그림 일반물리학 9-4 로런츠 힘의 방향(예제 8)</title>
  <desc id="d-uphy-9-lorentz-force">자기장 B = 0.50 T가 종이 면에서 나오는 방향(+z, 점)이고 양성자의 속도 v = (3.0, 4.0)×10⁵ m/s는 종이 면 안에 있다. 힘 F = e v × B = (3.2, −2.4)×10⁻¹⁴ N은 v와 B 모두에 수직이어서 종이 면 안에서 v를 시계 방향으로 90° 돌린 방향이다. 힘이 언제나 속도에 수직이므로 속력은 변하지 않고, 양성자는 시계 방향으로 원을 그린다(점선). 화살표 길이는 비율대로 그렸다.</desc>
