  <text x="448" y="50" class="uphy-9-lorentz-force-b">성분 계산</text>
  <text x="448" y="74" class="uphy-9-lorentz-force-s">v × B = (v_y B_z, −v_x B_z, 0)</text>
  <text x="448" y="94" class="uphy-9-lorentz-force-s">= (2.0, −1.5)×10⁵ T·m/s</text>
  <text x="448" y="114" class="uphy-9-lorentz-force-s">F = e(v × B)</text>
  <text x="448" y="134" class="uphy-9-lorentz-force-s">= (3.2, −2.4)×10⁻¹⁴ N</text>
  <text x="448" y="168" class="uphy-9-lorentz-force-b">오른손 확인</text>
  <text x="448" y="192" class="uphy-9-lorentz-force-s">네 손가락을 v에서 B(+z)로</text>
  <text x="448" y="212" class="uphy-9-lorentz-force-s">감아쥐면 엄지가 F 방향</text>
  <text x="448" y="246" class="uphy-9-lorentz-force-b">F · v = 0</text>
  <text x="448" y="270" class="uphy-9-lorentz-force-s">힘이 속도에 수직 → 일 = 0</text>
  <text x="448" y="290" class="uphy-9-lorentz-force-s">속력은 그대로, 방향만 바뀐다</text>
  <text x="448" y="324" class="uphy-9-lorentz-force-s">(−전하라면 F가 반대 방향)</text>
