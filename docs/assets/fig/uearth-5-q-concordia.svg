<title id="t-uearth-5-q-concordia">그림 일반지구과학 5-13 문제 16 해설 — 두 우라늄 시계의 일치 곡선</title>
<desc id="d-uearth-5-q-concordia">가로축은 방사성 기원 ²⁰⁷Pb/²³⁵U, 세로축은 ²⁰⁶Pb/²³⁸U이다. 닫힌계였던 광물은 두 연령이 같으므로 곡선(일치 곡선) 위에 놓인다. Z1은 곡선 위 약 21.7억 년 자리에 놓이지만, Z2는 곡선에서 벗어나 있어(불일치) ²³⁸U 계열로는 약 16.9억 년, ²³⁵U 계열로는 약 18.2억 년이 나온다.</desc>
