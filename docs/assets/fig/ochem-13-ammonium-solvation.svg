<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-ochem-13-ammonium-solvation d-ochem-13-ammonium-solvation">
  <title id="t-ochem-13-ammonium-solvation">그림 유기화학 13-3 메틸암모늄 이온 세 가지의 용매화와 염기도</title>
  <desc id="d-ochem-13-ammonium-solvation">위: CH₃NH₃⁺, (CH₃)₂NH₂⁺, (CH₃)₃NH⁺의 공–막대 모식도. N–H마다 물 분자 하나가 산소 쪽으로 수소 결합(점선)을 받아 각각 물 3, 2, 1개가 붙고, 큰 회색 메틸기는 물이 다가가지 못하게 가린다. 아래: 기체 양성자 친화도는 899, 930, 949 kJ/mol로 메틸기가 늘수록 커지지만(알킬기의 전자 공여), 물에서 pKaH는 10.64, 10.73, 9.80으로 트라이메틸아민에서 꺾인다(용매화 감소).</desc>
