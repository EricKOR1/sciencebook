<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 414" role="img" aria-labelledby="t-matter-4-rate-tangent d-matter-4-rate-tangent">
  <title id="t-matter-4-rate-tangent">그림 물질과 에너지 4-1 농도–시간 그래프에서 읽는 평균 속도와 순간 속도</title>
  <desc id="d-matter-4-rate-tangent">과산화 수소가 분해될 때 [H₂O₂]는 점점 완만하게 줄고 [O₂]는 그 절반의 빠르기로 는다. 두 시각을 잇는 직선의 기울기가 평균 속도, 한 시각에서 그은 접선의 기울기가 순간 속도이며, t = 0의 접선 기울기가 초기 속도이다. 예제 1(100초에 1.00 → 0.80 M)에 맞춘 곡선이다.</desc>
  <style>
    .matter-4-rate-tangent-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
    .matter-4-rate-tangent-gr{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4}
    .matter-4-rate-tangent-g{fill:none;stroke:var(--fig-muted);stroke-width:1.2;stroke-dasharray:4 4}
    .matter-4-rate-tangent-lv{fill:none;stroke:var(--fig-ink);stroke-width:3;stroke-linecap:round}
    .matter-4-rate-tangent-ink{fill:var(--fig-ink)}
    .matter-4-rate-tangent-l{font-size:14px;fill:var(--fig-ink)}
    .matter-4-rate-tangent-b{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .matter-4-rate-tangent-s{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .matter-4-rate-tangent-t{font-size:13px;fill:var(--fig-muted)}
  </style>
