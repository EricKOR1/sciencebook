  <text x="380.0" y="404.0" text-anchor="middle" class="matter-4-rate-tangent-t">반응물이 줄수록 접선이 완만해진다 → 반응이 느려진다. [O₂]는 [H₂O₂] 감소 빠르기의 ½로 늘어난다.</text>
