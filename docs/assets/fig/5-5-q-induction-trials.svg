  <title id="t-5-5-q-induction-trials">그림 5-5-8 문제 10의 실험 A~D</title>
  <desc id="d-5-5-q-induction-trials">실험 A~D에서 코일의 감은 수(200회, 400회), 자석의 세기(약한 자석, 센 자석), 자석을 넣는 빠르기(천천히, 빠르게)를 다르게 하였다. 자석은 매번 같은 거리만큼 코일 속으로 넣었다. 감은 횟수와 화살표 길이는 실제 값이 아닌 모식도이다.</desc>
