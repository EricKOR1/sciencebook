<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-pchem-8-vector-model-l2 d-pchem-8-vector-model-l2">
  <title id="t-pchem-8-vector-model-l2">그림 물리화학 8-7 l = 2 각운동량의 벡터 모형</title>
  <desc id="d-pchem-8-vector-model-l2">길이 √6ħ = 2.45ħ인 각운동량 벡터는 z 성분이 +2ħ, +ħ, 0, −ħ, −2ħ인 다섯 원뿔 위에 놓인다(z축과의 각 35.3°, 65.9°, 90°, 114.1°, 144.7°). 점선 타원은 각 원뿔의 윗면 원, 실선 화살표는 원뿔 위의 벡터 하나이며, 모든 벡터 끝은 반지름 2.45ħ의 반원(점선) 위에 있다. Lz는 정해지지만 Lx, Ly는 원뿔 둘레에서 정해지지 않는다.</desc>
