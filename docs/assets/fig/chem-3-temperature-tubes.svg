<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 465" role="img" aria-labelledby="t-chem-3-temperature-tubes d-chem-3-temperature-tubes">
  <title id="t-chem-3-temperature-tubes">그림 화학 3-5 온도를 바꿀 때 2NO₂ ⇌ N₂O₄ 평형의 이동</title>
  <desc id="d-chem-3-temperature-tubes">같은 평형 혼합물을 밀봉한 유리관을 얼음물, 실온, 뜨거운 물에 담그면, 얼음물에서는 열을 방출하는 정반응 쪽으로 이동해 무색인 N₂O₄가 늘고 색이 옅어지며, 뜨거운 물에서는 열을 흡수하는 역반응 쪽으로 이동해 적갈색 NO₂가 늘어 색이 진해진다. 정반응이 발열이므로 K는 온도가 낮을수록 크다. 입자 수와 색의 진하기는 모식도이다.</desc>
  <style>
    .chem-3-temperature-tubes-t{font-size:14px;fill:var(--fig-ink)} .chem-3-temperature-tubes-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .chem-3-temperature-tubes-s{font-size:13px;fill:var(--fig-muted)} .chem-3-temperature-tubes-ax{stroke:var(--fig-ink);stroke-width:1.4;fill:none}
    .chem-3-temperature-tubes-gr{stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4;fill:none;opacity:0.7}
    .chem-3-temperature-tubes-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}
    .chem-3-temperature-tubes-O{fill:var(--fig-red)} .chem-3-temperature-tubes-N{fill:var(--fig-blue)}

  </style>
