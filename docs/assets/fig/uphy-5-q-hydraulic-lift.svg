<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" class="fig-small" role="img" aria-labelledby="t-uphy-5-q-hydraulic-lift d-uphy-5-q-hydraulic-lift">
  <title id="t-uphy-5-q-hydraulic-lift">그림 일반물리학 5-8 예제 9의 유압 리프트</title>
  <desc id="d-uphy-5-q-hydraulic-lift">반지름 2.0 cm인 작은 피스톤과 반지름 20 cm인 큰 피스톤이 기름으로 이어져 있고, 큰 피스톤 위에 질량 1500 kg인 자동차가 있다. 피스톤의 폭은 반지름의 비(1 : 10)대로 그렸고, 두 피스톤의 높이 차는 무시한다.</desc>
  <style>.cuphy5qhydrauliclift-t{font-size:14px;fill:var(--fig-ink)} .cuphy5qhydrauliclift-s{font-size:13px;fill:var(--fig-muted)} .cuphy5qhydrauliclift-b{font-size:15px;font-weight:700;fill:var(--fig-ink)} .cuphy5qhydrauliclift-i{font-size:15px;font-style:italic;fill:var(--fig-ink)} .cuphy5qhydrauliclift-ax{stroke:var(--fig-ink);stroke-width:1.4;fill:none} .cuphy5qhydrauliclift-grid{stroke:var(--fig-line);stroke-width:0.7;fill:none}</style>
  <path d="M60,150 L80,150 L80,230 L250,230 L250,150 L450,150 L450,252 L60,252 Z" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>
  <rect x="60.0" y="140.0" width="20.0" height="10.0" rx="0" style="fill:var(--fig-line);stroke:var(--fig-ink);stroke-width:1.5"/>
  <rect x="250.0" y="140.0" width="200.0" height="10.0" rx="0" style="fill:var(--fig-line);stroke:var(--fig-ink);stroke-width:1.5"/>
  <line x1="70.0" y1="76.0" x2="70.0" y2="128.0" style="fill:none;stroke:var(--fig-red);stroke-width:3;stroke-linecap:butt"/>
  <polygon points="70.0,138.0 64.5,127.0 75.5,127.0" style="fill:var(--fig-red);stroke:none;stroke-linejoin:round"/>
  <text x="80.0" y="96.0" style="font-size:15px;fill:var(--fig-red);font-style:italic">F₁</text>
  <path d="M282,128 L282,108 L310,108 L328,88 L376,88 L396,108 L420,108 L420,128 Z" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>
  <circle cx="306.0" cy="131.0" r="9.0" style="fill:var(--fig-ink);stroke:none"/>
  <circle cx="396.0" cy="131.0" r="9.0" style="fill:var(--fig-ink);stroke:none"/>
  <text x="350.0" y="74.0" text-anchor="middle" class="cuphy5qhydrauliclift-t">자동차 1500 kg</text>
