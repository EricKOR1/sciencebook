<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 498" role="img" aria-labelledby="t-ubio-1-lipids d-ubio-1-lipids">
  <title id="t-ubio-1-lipids">그림 일반생명과학 1-5 지방, 지방산, 인지질, 스테로이드의 구조</title>
  <desc id="d-ubio-1-lipids">왼쪽 위: 중성 지방은 글리세롤의 –OH 3개에 지방산 3개가 에스터 결합한 것이다. 오른쪽 위: 포화 지방산과 트랜스 지방산은 곧은 사슬이고, 시스 이중 결합(빨강)은 사슬을 꺾는다. 곧은 사슬은 빽빽이 쌓여 실온에서 고체, 꺾인 사슬은 느슨해 액체가 된다. 왼쪽 아래: 인지질은 친수성 머리와 소수성 꼬리 2개를 가져 물속에서 꼬리를 안쪽으로 한 이중층을 만든다. 오른쪽 아래: 스테로이드는 고리 4개가 붙은 골격이다(콜레스테롤). 모식도이다.</desc>
