<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-ubio-11-heart d-ubio-11-heart">
  <title id="t-ubio-11-heart">그림 일반생명과학 11-7 포유류 심장의 구조와 혈액의 흐름</title>
  <desc id="d-ubio-11-heart">마주 본 방향의 심장 단면 모식도(그림의 왼쪽이 몸의 오른쪽). 대정맥 → 우심방 → 삼첨판 → 우심실 → 폐동맥판 → 폐동맥 → 폐, 폐정맥 → 좌심방 → 이첨판 → 좌심실 → 대동맥판 → 대동맥 → 온몸 순서로 흐른다. 좌심실 벽이 가장 두껍다. 우심방 벽의 동방 결절에서 시작한 흥분은 방실 결절에서 잠시 지연된 뒤 히스 다발과 푸르킨예 섬유를 따라 심첨부터 심실로 퍼진다.</desc>
