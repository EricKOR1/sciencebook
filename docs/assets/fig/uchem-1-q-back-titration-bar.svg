<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-labelledby="t-uchem-1-q-back-titration-bar d-uchem-1-q-back-titration-bar">
  <title id="t-uchem-1-q-back-titration-bar">그림 일반화학 1-9 문제 10 역적정의 몰수 장부</title>
  <desc id="d-uchem-1-q-back-titration-bar">넣은 HCl 25.0 mmol 가운데 21.88 mmol은 탄산 칼슘과 반응하고, 남은 3.12 mmol은 NaOH 3.12 mmol로 적정된다. 탄산 칼슘은 HCl 2 mmol당 1 mmol이 반응하므로 10.94 mmol이다. 막대 길이는 몰수에 비례한다.</desc>
  <style>.uchem-1-q-back-titration-bar-t{font-size:14px;fill:var(--fig-ink)} .uchem-1-q-back-titration-bar-s{font-size:13px;fill:var(--fig-muted)} .uchem-1-q-back-titration-bar-b{font-size:15px;font-weight:700;fill:var(--fig-ink)} .uchem-1-q-back-titration-bar-p{font-size:13px;fill:var(--fig-ink)} .uchem-1-q-back-titration-bar-r{font-size:14px;fill:var(--fig-red)} .uchem-1-q-back-titration-bar-bl{font-size:14px;fill:var(--fig-blue)} .uchem-1-q-back-titration-bar-g{font-size:14px;fill:var(--fig-green)}</style>
  <text x="60" y="34" class="uchem-1-q-back-titration-bar-b">넣은 HCl: 0.500 M × 50.00 mL = 25.0 mmol</text>
  <rect x="60" y="46" width="525.1" height="40" rx="0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
  <rect x="585.1" y="46" width="74.9" height="40" rx="0" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <text x="322.6" y="72" text-anchor="middle" class="uchem-1-q-back-titration-bar-t">CaCO₃와 반응: 25.0 − 3.12 = 21.88 mmol</text>
  <text x="622.6" y="72" text-anchor="middle" class="uchem-1-q-back-titration-bar-t">3.12</text>
  <line x1="622.6" y1="90" x2="622.6" y2="112" style="stroke:var(--fig-amber);stroke-width:1.3"/>
  <text x="660" y="128" text-anchor="end" class="uchem-1-q-back-titration-bar-t">남은 HCl = NaOH 0.200 M × 15.60 mL = 3.12 mmol</text>
  <rect x="60" y="160" width="262.6" height="34" rx="0" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.5"/>
  <text x="191.3" y="182" text-anchor="middle" class="uchem-1-q-back-titration-bar-t">CaCO₃ 10.94 mmol</text>
  <text x="334.6" y="182" class="uchem-1-q-back-titration-bar-s">← HCl 21.88 mmol ÷ 2 (CaCO₃ + 2H⁺)</text>
  <text x="60" y="218" class="uchem-1-q-back-titration-bar-t">× 100.09 g/mol → 1.09 g</text>
</svg>
