  <title id="t-ochem-2-q-isobutane-halogenation">그림 유기화학 2-22 2-메틸프로페인의 염소화와 브로민화 생성물</title>
  <desc id="d-ochem-2-q-isobutane-halogenation">가운데 2-메틸프로페인의 1° H 9개(파란 점)와 3° H 1개(빨간 점). 왼쪽 Cl₂, hν, 25 ℃: 1-클로로-2-메틸프로페인 64 %, 2-클로로-2-메틸프로페인 36 %. 오른쪽 Br₂, hν, 125 ℃: 1-브로모-2-메틸프로페인 0.6 %, 2-브로모-2-메틸프로페인 99.4 %. 막대 길이는 비율에 비례한다.</desc>
