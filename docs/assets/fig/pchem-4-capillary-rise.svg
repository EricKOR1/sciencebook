  <rect x="459.0" y="60.0" width="8.0" height="330.0" rx="0" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.2"/>
  <line x1="351.0" y1="340.0" x2="383.0" y2="340.0" style="stroke:var(--fig-muted);stroke-width:1;stroke-linecap:round;stroke-dasharray:2 3"/>
  <line x1="351.0" y1="410.0" x2="383.0" y2="410.0" style="stroke:var(--fig-muted);stroke-width:1;stroke-linecap:round;stroke-dasharray:2 3"/>
  <line x1="361.0" y1="340.0" x2="361.0" y2="410.0" style="stroke:var(--fig-ink);stroke-width:1.3;stroke-linecap:round"/>
  <polygon points="361.0,410.0 358.7,404.5 363.3,404.5" style="fill:var(--fig-ink);stroke:none"/>
  <polygon points="361.0,340.0 363.3,345.5 358.7,345.5" style="fill:var(--fig-ink);stroke:none"/>
  <text x="355.0" y="400.0" text-anchor="end" class="pchem-4-capillary-rise-i">−h</text>
  <line x1="459.0" y1="425.9" x2="437.1" y2="399.8" style="stroke:var(--fig-red);stroke-width:1.4;stroke-linecap:round"/>
  <path d="M459.0,443.9 A18,18 0 0 1 447.4,412.1" style="fill:none;stroke:var(--fig-red);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round"/>
  <text x="429.0" y="451.9" text-anchor="start" class="pchem-4-capillary-rise-i" style="fill:var(--fig-red)">θ</text>
  <text x="425.0" y="90.0" text-anchor="middle" class="pchem-4-capillary-rise-s">메니스커스가</text>
  <text x="425.0" y="106.0" text-anchor="middle" class="pchem-4-capillary-rise-s">위로 볼록</text>
  <rect x="570.0" y="230.0" width="140.0" height="170.0" rx="4" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1"/>
  <text x="640.0" y="248.0" text-anchor="middle" class="pchem-4-capillary-rise-s" style="fill:var(--fig-ink)">삽도: 영 식</text>
  <rect x="576.0" y="350.0" width="128.0" height="12.0" rx="0" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1"/>
