  <line x1="20.0" y1="340.0" x2="270.0" y2="340.0" style="stroke:var(--fig-blue);stroke-width:2;stroke-linecap:round"/>
  <line x1="20.0" y1="400.0" x2="270.0" y2="400.0" style="stroke:var(--fig-line);stroke-width:1.5;stroke-linecap:round"/>
  <path d="M111,400 L111,126.19294370086988 A36.2,36.2 0 0 0 179,126.19294370086988 L179,400 Z" style="fill:var(--fig-soft-blue);stroke:none;stroke-linejoin:round;stroke-linecap:round"/>
  <path d="M111,126.2 A36.2,36.2 0 0 0 179,126.2" style="fill:none;stroke:var(--fig-blue);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round"/>
  <rect x="103.0" y="60.0" width="8.0" height="330.0" rx="0" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.2"/>
  <rect x="179.0" y="60.0" width="8.0" height="330.0" rx="0" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.2"/>
  <line x1="81.0" y1="340.0" x2="81.0" y2="152.0" style="stroke:var(--fig-ink);stroke-width:1.3;stroke-linecap:round"/>
  <polygon points="81.0,152.0 83.3,157.5 78.7,157.5" style="fill:var(--fig-ink);stroke:none"/>
  <polygon points="81.0,340.0 78.7,334.5 83.3,334.5" style="fill:var(--fig-ink);stroke:none"/>
  <line x1="71.0" y1="150.0" x2="103.0" y2="150.0" style="stroke:var(--fig-muted);stroke-width:1;stroke-linecap:round;stroke-dasharray:2 3"/>
  <text x="75.0" y="250.0" text-anchor="end" class="pchem-4-capillary-rise-i">h</text>
  <circle cx="145.0" cy="113.8" r="3.0" style="fill:var(--fig-ink);stroke:none"/>
  <line x1="145.0" y1="113.8" x2="179.0" y2="126.2" style="stroke:var(--fig-violet);stroke-width:1.4;stroke-linecap:round"/>
  <text x="157.0" y="115.8" text-anchor="start" class="pchem-4-capillary-rise-i" style="fill:var(--fig-violet)">R</text>
  <line x1="145.0" y1="100.2" x2="179.0" y2="100.2" style="stroke:var(--fig-ink);stroke-width:1;stroke-linecap:round"/>
  <line x1="145.0" y1="107.8" x2="145.0" y2="150.0" style="stroke:var(--fig-muted);stroke-width:1;stroke-linecap:round;stroke-dasharray:2 3"/>
  <text x="162.0" y="95.2" text-anchor="middle" class="pchem-4-capillary-rise-i">r</text>
  <text x="193.0" y="91.8" text-anchor="start" class="pchem-4-capillary-rise-s">R = r/cos θ</text>
