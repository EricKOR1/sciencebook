<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-pchem-4-capillary-rise d-pchem-4-capillary-rise">
  <title id="t-pchem-4-capillary-rise">그림 물리화학 4-12 모세관 현상과 접촉각</title>
  <desc id="d-pchem-4-capillary-rise">(가) 물에 꽂은 가는 유리관: 관 속 수면이 바깥보다 h만큼 높고 메니스커스는 아래로 오목하다. 접촉각 θ는 액체 쪽에서 재며, 관 반지름 r과 메니스커스의 곡률 반지름 R = r/cos θ가 보조선으로 표시되어 있다. 메니스커스 바로 아래 액체의 압력은 P_대기 − 2γcos θ/r, 바깥 수면은 P_대기이다. (나) 수은에 꽂은 유리관: 관 속 수은면이 바깥보다 낮고 메니스커스는 위로 볼록하며 접촉각은 약 140°이다. 오른쪽 아래 삽도는 고체 위 방울 가장자리에서 γ_sg, γ_sl, γ_lg가 균형을 이루는 모습(영 식)이다. 관 굵기와 높이는 모식적이다.</desc>
  <style>.pchem-4-capillary-rise-t{font-size:14px;fill:var(--fig-ink)} .pchem-4-capillary-rise-s{font-size:13px;fill:var(--fig-muted)} .pchem-4-capillary-rise-b{font-size:15px;font-weight:600;fill:var(--fig-ink)} .pchem-4-capillary-rise-i{font-size:14px;font-style:italic;fill:var(--fig-ink)} </style>
  <text x="20.0" y="28.0" text-anchor="start" class="pchem-4-capillary-rise-b">(가) 물 – 유리 (θ 작음)</text>
