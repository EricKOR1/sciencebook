  <polygon points="621.0,350.0 626.6,347.7 626.6,352.3" style="fill:var(--fig-ink);stroke:none"/>
  <text x="623.0" y="380.0" text-anchor="start" class="pchem-4-capillary-rise-s" style="fill:var(--fig-ink)">γ<tspan baseline-shift="sub" font-size="10">sl</tspan></text>
  <line x1="655.0" y1="350.0" x2="636.0" y2="317.1" style="stroke:var(--fig-red);stroke-width:1.5;stroke-linecap:round"/>
  <polygon points="636.0,317.1 640.8,320.7 636.8,323.0" style="fill:var(--fig-red);stroke:none"/>
  <text x="634.0" y="311.1" text-anchor="middle" class="pchem-4-capillary-rise-s" style="fill:var(--fig-red)">γ<tspan baseline-shift="sub" font-size="10">lg</tspan></text>
  <path d="M641.0,350 A14,14 0 0 1 648.0,337.9" style="fill:none;stroke:var(--fig-red);stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round"/>
  <text x="633.0" y="342.0" text-anchor="start" class="pchem-4-capillary-rise-i" style="fill:var(--fig-red);font-size:12px">θ</text>
  <text x="640.0" y="380.0" text-anchor="middle" class="pchem-4-capillary-rise-s" style="fill:var(--fig-ink)">γ<tspan baseline-shift="sub" font-size="10">sg</tspan> = γ<tspan baseline-shift="sub" font-size="10">sl</tspan> + γ<tspan baseline-shift="sub" font-size="10">lg</tspan>cos θ</text>
  <text x="360.0" y="432.0" text-anchor="middle" class="pchem-4-capillary-rise-s">모식도: 관의 굵기, 높이, 메니스커스 곡률은 보기 쉽게 과장했다.</text>
</svg>
