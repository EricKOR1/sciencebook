  <text x="121.0" y="172.2" text-anchor="start" class="pchem-4-capillary-rise-i" style="fill:var(--fig-red)">θ</text>
  <circle cx="145.0" cy="160.0" r="3.0" style="fill:var(--fig-ink);stroke:none"/>
  <line x1="145.0" y1="160.0" x2="205.0" y2="190.0" style="stroke:var(--fig-muted);stroke-width:1;stroke-linecap:round"/>
  <rect x="204.0" y="183.0" width="126.9" height="18.0" rx="2" style="fill:var(--fig-panel);stroke:none"/>
  <text x="207.0" y="195.0" text-anchor="start" class="pchem-4-capillary-rise-s" style="fill:var(--fig-ink)">P<tspan baseline-shift="sub" font-size="10">대기</tspan> − 2γcos θ/r</text>
  <text x="265.0" y="332.0" text-anchor="end" class="pchem-4-capillary-rise-s" style="fill:var(--fig-ink)">P<tspan baseline-shift="sub" font-size="10">대기</tspan></text>
  <text x="25.0" y="332.0" text-anchor="start" class="pchem-4-capillary-rise-s" style="fill:var(--fig-ink)">P<tspan baseline-shift="sub" font-size="10">대기</tspan></text>
  <text x="300.0" y="28.0" text-anchor="start" class="pchem-4-capillary-rise-b">(나) 수은 – 유리 (θ ≈ 140°)</text>
  <rect x="300.0" y="340.0" width="250.0" height="60.0" rx="0" style="fill:var(--fig-soft-violet);stroke:none"/>
  <line x1="300.0" y1="340.0" x2="550.0" y2="340.0" style="stroke:var(--fig-violet);stroke-width:2;stroke-linecap:round"/>
  <line x1="300.0" y1="400.0" x2="550.0" y2="400.0" style="stroke:var(--fig-line);stroke-width:1.5;stroke-linecap:round"/>
