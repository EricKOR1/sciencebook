  <title id="t-5-5-q-demand-stack">그림 5-5-11 문제 15 해설: 시각별 발전소 출력 나누기</title>
  <desc id="d-5-5-q-demand-stack">원자력 발전소는 하루 종일 60으로 일정하게 운전하고, 수요에서 60을 뺀 나머지(0, 20, 25, 40, 10)를 천연가스 발전소가 시각에 따라 출력을 바꾸어 맞춘다. 막대 전체 높이가 그 시각의 전력 수요이다.</desc>
