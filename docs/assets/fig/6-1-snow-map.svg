  <title id="t-6-1-snow-map">그림 6-1-4 존 스노의 콜레라 지도 — 데이터로 감염원 찾기</title>
  <desc id="d-6-1-snow-map">사망자가 나온 집을 점으로 찍으면 브로드가의 공용 펌프 주변에 점이 몰리고 다른 펌프 주변에는 드물다. 이 패턴으로 오염된 펌프 물을 원인으로 추론하였다. 거리와 점의 배치는 실제 지도를 단순화한 모식도이다.</desc>
