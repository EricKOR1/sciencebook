<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-m2-04-ion d-m2-04-ion">
  <title id="t-m2-04-ion">그림 중2-4-2 이온이 만들어지는 과정</title>
  <desc id="d-m2-04-ion">나트륨 원자(양성자 11, 전자 11)가 전자 1개를 잃으면 나트륨 이온 Na⁺(양성자 11, 전자 10)이 되고, 염소 원자(양성자 17, 전자 17)가 전자 1개를 얻으면 염화 이온 Cl⁻(양성자 17, 전자 18)이 된다. 원자핵의 양성자 수는 변하지 않는다. 전자의 위치는 모식적으로 나타냈다.</desc>
  <style>
    .m2-04-ion-t{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .m2-04-ion-k{font-size:14px;fill:var(--fig-ink)}
    .m2-04-ion-s{font-size:13px;fill:var(--fig-muted)}
    .m2-04-ion-cloud{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.2;stroke-dasharray:5 4}
    .m2-04-ion-nuc{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2}
    .m2-04-ion-e{fill:var(--fig-blue)}
    .m2-04-ion-hot{fill:var(--fig-amber);stroke:var(--fig-ink);stroke-width:1}
    .m2-04-ion-pt{font-size:14px;font-weight:700;fill:var(--fig-red)}
  </style>
