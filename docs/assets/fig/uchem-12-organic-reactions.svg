<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-uchem-12-organic-reactions d-uchem-12-organic-reactions">
  <title id="t-uchem-12-organic-reactions">그림 일반화학 12-3 작용기를 바꾸는 기본 유기 반응</title>
  <desc id="d-uchem-12-organic-reactions">탄소 2개 화합물을 중심으로 작용기 무리 사이의 기본 반응을 이었다. 화살표 위는 반응 유형, 아래는 시약과 조건이다. 알켄은 첨가 반응으로 알케인·알코올·고분자가 되고, 알코올은 제거 반응으로 알켄이 되거나 산화되어 알데하이드를 거쳐 카복실산이 되며, 카복실산과 알코올은 축합하여 에스터가 된다.</desc>
  <style>.uchem-12-organic-reactions-t{font-size:14px;fill:var(--fig-ink)} .uchem-12-organic-reactions-s{font-size:13px;fill:var(--fig-muted)} .uchem-12-organic-reactions-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}</style>
  <rect x="16.0" y="41.0" width="168.0" height="58.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.8"/>
  <text x="100.0" y="65.0" text-anchor="middle" class="uchem-12-organic-reactions-b">알케인</text>
  <text x="100.0" y="86.0" text-anchor="middle" class="uchem-12-organic-reactions-s" style="fill:var(--fig-ink)">CH₃–CH₃ 에테인</text>
  <rect x="276.0" y="41.0" width="168.0" height="58.0" rx="8" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.8"/>
  <text x="360.0" y="65.0" text-anchor="middle" class="uchem-12-organic-reactions-b">알켄</text>
  <text x="360.0" y="86.0" text-anchor="middle" class="uchem-12-organic-reactions-s" style="fill:var(--fig-ink)">CH₂=CH₂ 에텐</text>
  <rect x="536.0" y="41.0" width="168.0" height="58.0" rx="8" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.8"/>
  <text x="620.0" y="65.0" text-anchor="middle" class="uchem-12-organic-reactions-b">고분자</text>
  <text x="620.0" y="86.0" text-anchor="middle" class="uchem-12-organic-reactions-s" style="fill:var(--fig-ink)">–(CH₂–CH₂)ₙ–</text>
  <rect x="16.0" y="181.0" width="168.0" height="58.0" rx="8" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.8"/>
  <text x="100.0" y="205.0" text-anchor="middle" class="uchem-12-organic-reactions-b">할로젠화 알킬</text>
  <text x="100.0" y="226.0" text-anchor="middle" class="uchem-12-organic-reactions-s" style="fill:var(--fig-ink)">CH₃CH₂–Cl</text>
  <rect x="276.0" y="181.0" width="168.0" height="58.0" rx="8" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="360.0" y="205.0" text-anchor="middle" class="uchem-12-organic-reactions-b">알코올</text>
  <text x="360.0" y="226.0" text-anchor="middle" class="uchem-12-organic-reactions-s" style="fill:var(--fig-ink)">CH₃CH₂–OH 에탄올</text>
  <rect x="536.0" y="181.0" width="168.0" height="58.0" rx="8" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.8"/>
