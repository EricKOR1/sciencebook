  <text x="490.0" y="228.0" text-anchor="middle" class="uchem-12-organic-reactions-s">Cr₂O₇²⁻, H⁺</text>
  <line x1="532.0" y1="350.0" x2="455.6" y2="350.0" style="stroke:var(--fig-ink);stroke-width:2;stroke-linecap:round"/>
  <polygon points="448.0,350.0 456.2,346.3 456.2,353.7" style="fill:var(--fig-ink);stroke:none;stroke-linejoin:round"/>
  <text x="490.0" y="342.0" text-anchor="middle" class="uchem-12-organic-reactions-s" style="fill:var(--fig-ink);font-weight:600">축합</text>
  <text x="490.0" y="368.0" text-anchor="middle" class="uchem-12-organic-reactions-s">+ 알코올</text>
