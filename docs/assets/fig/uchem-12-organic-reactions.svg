  <polygon points="100.0,177.0 96.3,168.8 103.7,168.8" style="fill:var(--fig-ink);stroke:none;stroke-linejoin:round"/>
  <text x="110.0" y="138.0" class="uchem-12-organic-reactions-s" style="fill:var(--fig-ink);font-weight:600">치환</text>
