<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img" aria-labelledby="t-cell-2-atp-cycle d-cell-2-atp-cycle">
<title id="t-cell-2-atp-cycle">그림 세포와 물질대사 2-2 ATP의 구조와 ATP–ADP 순환</title>
<desc id="d-cell-2-atp-cycle">ATP는 아데닌과 리보스(아데노신)에 인산 3개가 붙은 분자이다. 끝의 인산 결합이 끊어져 ADP와 무기 인산이 될 때 에너지가 방출되어 생명 활동에 쓰이고, 세포호흡과 광합성 명반응에서 얻은 에너지로 ADP와 무기 인산이 다시 ATP로 합성된다. 모식도.</desc>
<style>
.c2at-lbl{font-size:13px;fill:var(--fig-ink)} .c2at-b{font-size:14px;font-weight:700;fill:var(--fig-ink)} .c2at-sm{font-size:13px;fill:var(--fig-muted)} .c2at-arr{fill:none;stroke:var(--fig-ink);stroke-width:2} .c2at-ah{fill:var(--fig-ink)} .c2at-lead{fill:none;stroke:var(--fig-muted);stroke-width:1}
.c2at-ade{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2}
.c2at-rib{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2}
.c2at-pho{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2}
.c2at-bond{stroke:var(--fig-ink);stroke-width:2;fill:none}
.c2at-hi{stroke:var(--fig-red);stroke-width:2.5;fill:none}
.c2at-brace{fill:none;stroke:var(--fig-muted);stroke-width:1.5}
.c2at-box{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2}
.c2at-out{fill:none;stroke:var(--fig-red);stroke-width:3} .c2at-outh{fill:var(--fig-red)}
.c2at-in{fill:none;stroke:var(--fig-blue);stroke-width:3} .c2at-inh{fill:var(--fig-blue)}
.c2at-red{font-size:13px;fill:var(--fig-red);font-weight:600} .c2at-blue{font-size:13px;fill:var(--fig-blue);font-weight:600}
.c2at-P{font-size:15px;font-weight:700;fill:var(--fig-ink)}
</style>
<polygon points="40,62 70,44 100,62 100,96 70,114 40,96" class="c2at-ade"/><text x="70" y="84" text-anchor="middle" class="c2at-lbl">아데닌</text><line x1="100" y1="79" x2="140" y2="79" class="c2at-bond"/><polygon points="175,48 208,70 196,108 154,108 142,70" class="c2at-rib"/><text x="175" y="88" text-anchor="middle" class="c2at-lbl">리보스</text><line x1="208" y1="79" x2="248" y2="79" class="c2at-bond"/><circle cx="270" cy="79" r="22" class="c2at-pho"/><text x="270" y="84" text-anchor="middle" class="c2at-P">P</text><path d="M292 79 q6 -8 13 0 t13 0" class="c2at-hi"/><circle cx="340" cy="79" r="22" class="c2at-pho"/><text x="340" y="84" text-anchor="middle" class="c2at-P">P</text><path d="M362 79 q6 -8 13 0 t13 0" class="c2at-hi"/><circle cx="410" cy="79" r="22" class="c2at-pho"/><text x="410" y="84" text-anchor="middle" class="c2at-P">P</text><path d="M40 128 q0 8 8 8 h70 q8 0 12 8 q4 -8 12 -8 h68 q8 0 8 -8" class="c2at-brace"/><text x="129" y="160" text-anchor="middle" class="c2at-sm">아데노신</text><text x="340" y="126" text-anchor="middle" class="c2at-sm">인산 3개</text><path d="M305 70 L470 46 M375 70 L470 46" class="c2at-lead"/><text x="476" y="44" class="c2at-red">고에너지 인산 결합</text><text x="476" y="68" class="c2at-lbl">음전하를 띤 인산기끼리 밀어내므로,</text><text x="476" y="88" class="c2at-lbl">끝의 결합이 끊어지면 에너지가 나온다</text><text x="476" y="108" class="c2at-sm">(약 7.3 kcal/mol, 표준 조건)</text><rect x="115" y="240" width="110" height="44" rx="10" class="c2at-box"/><text x="170" y="268" text-anchor="middle" class="c2at-P">ATP</text><rect x="485" y="240" width="130" height="44" rx="10" class="c2at-box"/><text x="550" y="268" text-anchor="middle" class="c2at-P">ADP + Pᵢ</text><path d="M210 238 Q360 182 500 236" class="c2at-out"/><path d="M500.0 236.0 L488.0 236.0 L494.0 225.6 Z" class="c2at-outh"/><path d="M510 286 Q360 342 220 288" class="c2at-in"/><path d="M220.0 288.0 L232.0 288.0 L226.0 298.4 Z" class="c2at-inh"/><text x="360" y="200" text-anchor="middle" class="c2at-red">ATP 분해(에너지 방출)</text><text x="360" y="174" text-anchor="middle" class="c2at-lbl">→ 근육 수축 · 능동 수송 · 물질 합성 · 신경 신호 · 발광</text><text x="360" y="336" text-anchor="middle" class="c2at-blue">ATP 합성(에너지 흡수)</text><text x="360" y="360" text-anchor="middle" class="c2at-lbl">← 세포호흡(세포질·미토콘드리아) · 광합성 명반응(엽록체)</text></svg>
