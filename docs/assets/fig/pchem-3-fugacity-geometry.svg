  <title id="t-pchem-3-fugacity-geometry">그림 물리화학 3-11 퓨가시티 계수의 기하학적 뜻 (300 K 메테인, 판데르발스 식)</title>
  <desc id="d-pchem-3-fugacity-geometry">왼쪽: (Z − 1)/p를 압력에 대해 그린 곡선(p → 0에서 -1.95×10⁻³, 100 bar에서 -1.84×10⁻³, 200 bar에서 -0.89×10⁻³ bar⁻¹). 0부터 100 bar까지 곡선과 가로축 사이의 넓이가 ln φ(100 bar) = -0.194이다. 오른쪽: 퓨가시티 f = φp(실선)는 이상 기체의 f = p(점선)보다 아래에 있어, 100 bar에서 f = 82.3 bar, 200 bar에서 143 bar이다. 인력이 우세하여 f &lt; p이다.</desc>
