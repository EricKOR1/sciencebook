<circle cx="128.0" cy="127.0" r="5" style="fill:var(--fig-ink);stroke:none;stroke-width:1.5"/>
<circle cx="182.0" cy="127.0" r="5" style="fill:var(--fig-ink);stroke:none;stroke-width:1.5"/>
<text x="155.0" y="113.0" text-anchor="middle" class="phy-1-pulley-fbd-lbl phy-1-pulley-fbd-b">A 3 kg</text>
<circle cx="312.0" cy="120.0" r="12" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2"/>
<line x1="300.0" y1="132.0" x2="300.0" y2="142.0" style="stroke:var(--fig-ink);stroke-width:2;fill:none"/>
