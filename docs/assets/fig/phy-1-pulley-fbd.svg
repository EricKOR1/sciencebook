<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-phy-1-pulley-fbd d-phy-1-pulley-fbd">
  <title id="t-phy-1-pulley-fbd">그림 물리학 1-5 도르래로 연결된 두 물체와 자유 물체 그림</title>
  <desc id="d-phy-1-pulley-fbd">마찰 없는 책상 위의 수레 A(3 kg)와 도르래에 매달린 추 B(2 kg)가 실로 연결되어 있다. 오른쪽은 A와 B를 각각 떼어 내어 그 물체가 받는 힘만 그린 자유 물체 그림이다. 실이 A를 당기는 힘과 B를 당기는 힘의 크기는 같다(T).</desc>
  <style>
    .phy-1-pulley-fbd-lbl{font-size:14px;fill:var(--fig-ink)} .phy-1-pulley-fbd-sm{font-size:13px;fill:var(--fig-muted)} .phy-1-pulley-fbd-b{font-weight:600}
  </style>
<rect x="30.0" y="130.0" width="270.0" height="12.0" rx="0" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
<line x1="50.0" y1="142.0" x2="50.0" y2="300.0" style="stroke:var(--fig-amber);stroke-width:4;fill:none"/>
<line x1="280.0" y1="142.0" x2="280.0" y2="300.0" style="stroke:var(--fig-amber);stroke-width:4;fill:none"/>
