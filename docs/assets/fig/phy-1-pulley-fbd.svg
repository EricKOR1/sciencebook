<text x="324.0" y="265.0" text-anchor="middle" class="phy-1-pulley-fbd-sm">2 kg</text>
<line x1="140.0" y1="70.0" x2="180.0" y2="70.0" style="stroke:var(--fig-green);stroke-width:2.5;fill:none"/>
<path d="M190.0 70.0 L180.0 74.5 L180.0 65.5 Z" style="fill:var(--fig-green)"/>
