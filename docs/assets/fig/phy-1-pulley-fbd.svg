<text x="648.0" y="242.0" text-anchor="start" class="phy-1-pulley-fbd-sm" style="fill:var(--fig-red)">중력 20 N</text>
<text x="560.0" y="305.0" text-anchor="middle" class="phy-1-pulley-fbd-sm">화살표 길이는 힘의 크기에 비례(g = 10 m/s²)</text>
</svg>
