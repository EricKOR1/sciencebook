<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 362" role="img" aria-labelledby="t-uphy-11-thin-film-phase d-uphy-11-thin-film-phase">
  <title id="t-uphy-11-thin-film-phase">그림 일반물리학 11-3 얇은 막의 두 반사광과 반사에서의 위상 반전</title>
  <desc id="d-uphy-11-thin-film-phase">얇은 막의 윗면에서 반사한 빛 ①과 아랫면에서 반사한 빛 ②가 간섭한다. 굴절률이 더 큰 매질의 경계에서 반사하면 위상이 π 뒤집히고, 더 작은 매질의 경계에서는 바뀌지 않는다. 공기 속 비누막은 ①만 뒤집혀 반사 보강 조건이 2n₂L = (m + ½)λ이고, 유리 위 플루오린화 마그네슘 막은 둘 다 뒤집혀 반사 상쇄 조건이 2n₂L = (m + ½)λ이다.</desc>
  <style>
    .u11c-t{font-size:14px;fill:var(--fig-ink)} .u11c-tb{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .u11c-s{font-size:13px;fill:var(--fig-muted)} .u11c-sm{font-size:13px;fill:var(--fig-ink)}
    .u11c-ax{stroke:var(--fig-ink);stroke-width:1.5;fill:none} .u11c-grid{stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4;fill:none}
  </style>
<text x="20" y="30" class="u11c-tb">(가) 공기 속 비누막</text>
<rect x="20" y="150" width="320" height="55" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
<text x="334" y="72" text-anchor="end" class="u11c-s">공기 n = 1.00</text>
<text x="334" y="184" text-anchor="end" class="u11c-sm">비누막 n₂ = 1.33</text>
<text x="334" y="243" text-anchor="end" class="u11c-s">공기 n = 1.00</text>
