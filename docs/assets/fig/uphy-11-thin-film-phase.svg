<text x="155.8" y="69.0" text-anchor="middle" class="u11c-sm" style="fill:var(--fig-blue)">②</text>
<line x1="34.0" y1="150.0" x2="34.0" y2="198.0" style="stroke:var(--fig-muted);stroke-width:1.2"/><path d="M34.0 205.0 L31.0 198.0 L37.0 198.0 Z" style="fill:var(--fig-muted)"/><line x1="34.0" y1="205.0" x2="34.0" y2="157.0" style="stroke:var(--fig-muted);stroke-width:1.2"/><path d="M34.0 150.0 L37.0 157.0 L31.0 157.0 Z" style="fill:var(--fig-muted)"/>
<text x="42" y="182.5" class="u11c-sm">L</text>
<circle cx="90.0" cy="150" r="4" style="fill:var(--fig-red)"/>
<circle cx="105.8" cy="205" r="4" style="fill:var(--fig-green)"/>
<text x="196" y="106" class="u11c-s" style="fill:var(--fig-red)">① 윗면: 큰 n에서 반사</text>
<text x="196" y="124" class="u11c-s" style="fill:var(--fig-red)">→ 위상 π 뒤집힘</text>
<text x="28" y="225" class="u11c-s" style="fill:var(--fig-green)">② 아랫면: 작은 n에서 반사 → 변화 없음</text>
<text x="20" y="300" class="u11c-sm">뒤집힘이 한쪽만 → 경로차 2n₂L에 반파장 추가</text>
<text x="20" y="320" class="u11c-sm">반사 보강: 2n₂L = (m + ½)λ</text>
<text x="380" y="30" class="u11c-tb">(나) 유리 위의 반사 방지막</text>
<rect x="380" y="150" width="320" height="55" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5"/>
<rect x="380" y="205" width="320" height="65" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.5"/>
