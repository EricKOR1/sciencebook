<text x="476.3" y="69.0" text-anchor="middle" class="u11c-sm" style="fill:var(--fig-red)">①</text>
<text x="515.8" y="69.0" text-anchor="middle" class="u11c-sm" style="fill:var(--fig-blue)">②</text>
<line x1="394.0" y1="150.0" x2="394.0" y2="198.0" style="stroke:var(--fig-muted);stroke-width:1.2"/><path d="M394.0 205.0 L391.0 198.0 L397.0 198.0 Z" style="fill:var(--fig-muted)"/><line x1="394.0" y1="205.0" x2="394.0" y2="157.0" style="stroke:var(--fig-muted);stroke-width:1.2"/><path d="M394.0 150.0 L397.0 157.0 L391.0 157.0 Z" style="fill:var(--fig-muted)"/>
<text x="402" y="182.5" class="u11c-sm">L</text>
<circle cx="450.0" cy="150" r="4" style="fill:var(--fig-red)"/>
<circle cx="465.8" cy="205" r="4" style="fill:var(--fig-red)"/>
<text x="556" y="106" class="u11c-s" style="fill:var(--fig-red)">① 윗면: 큰 n에서 반사</text>
<text x="556" y="124" class="u11c-s" style="fill:var(--fig-red)">→ 위상 π 뒤집힘</text>
<text x="388" y="225" class="u11c-s" style="fill:var(--fig-red)">② 아랫면: 큰 n에서 반사 → 위상 π 뒤집힘</text>
<text x="380" y="300" class="u11c-sm">둘 다 뒤집힘 → 위상 효과가 서로 상쇄</text>
<text x="380" y="320" class="u11c-sm">반사 상쇄: 2n₂L = (m + ½)λ, 가장 얇게 L = λ/4n₂</text>
<text x="360" y="352" text-anchor="middle" class="u11c-s">보기 쉽게 광선을 비스듬히 그렸지만 실제로는 거의 수직으로 비친다고 본다(모식도, λ는 진공 파장).</text>
</svg>
