<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-ubio-6-rna-processing d-ubio-6-rna-processing">
  <title id="t-ubio-6-rna-processing">그림 일반생명과학 6-2 진핵세포의 RNA 가공</title>
  <desc id="d-ubio-6-rna-processing">유전자에서 전사된 처음 전사체(pre-mRNA)의 5′ 끝에 7-메틸구아노신 모자가, 3′ 끝에는 폴리 A 신호 뒤에서 잘린 자리에 폴리 A 꼬리가 붙는다. 스플라이스오솜이 GU로 시작해 AG로 끝나는 인트론을 잘라 내고 엑손을 이어 성숙한 mRNA가 된 뒤 핵 밖으로 나간다.</desc>
  <style>.ubio-6-rna-processing-t{font-size:14px;fill:var(--fig-ink)} .ubio-6-rna-processing-s{font-size:13px;fill:var(--fig-muted)} .ubio-6-rna-processing-b{font-size:14px;fill:var(--fig-ink);font-weight:600} .ubio-6-rna-processing-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-6-rna-processing-m{font-size:13px;fill:var(--fig-ink)}</style>
  <defs><marker id="ubio-6-rna-processing-ar0" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-ink)"/></marker></defs>
  <text x="20.0" y="50.0" text-anchor="start" class="ubio-6-rna-processing-b">DNA</text>
  <text x="20.0" y="68.0" text-anchor="start" class="ubio-6-rna-processing-s">(유전자)</text>
  <rect x="96.0" y="42.0" width="54.0" height="20.0" rx="3" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <text x="123.0" y="34.0" text-anchor="middle" class="ubio-6-rna-processing-s">프로모터</text>
  <line x1="90.0" y1="52.0" x2="690.0" y2="52.0" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/>
  <rect x="150.0" y="42.0" width="90.0" height="20.0" rx="3" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="195.0" y="34.0" text-anchor="middle" class="ubio-6-rna-processing-s">엑손 1</text>
  <rect x="330.0" y="42.0" width="80.0" height="20.0" rx="3" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="370.0" y="34.0" text-anchor="middle" class="ubio-6-rna-processing-s">엑손 2</text>
  <rect x="510.0" y="42.0" width="90.0" height="20.0" rx="3" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="555.0" y="34.0" text-anchor="middle" class="ubio-6-rna-processing-s">엑손 3</text>
  <text x="285.0" y="34.0" text-anchor="middle" class="ubio-6-rna-processing-s">인트론 1</text>
  <text x="460.0" y="34.0" text-anchor="middle" class="ubio-6-rna-processing-s">인트론 2</text>
  <line x1="400.0" y1="72.0" x2="400.0" y2="110.0" style="fill:none;stroke:var(--fig-ink);stroke-width:1.8" marker-end="url(#ubio-6-rna-processing-ar0)"/>
  <text x="410.0" y="96.0" text-anchor="start" class="ubio-6-rna-processing-s">전사(RNA 중합 효소 Ⅱ)</text>
  <text x="20.0" y="154.0" text-anchor="start" class="ubio-6-rna-processing-b">처음 전사체</text>
  <text x="20.0" y="172.0" text-anchor="start" class="ubio-6-rna-processing-s">(pre-mRNA)</text>
  <circle cx="140.0" cy="150.0" r="10" style="fill:var(--fig-violet)"/>
  <text x="140.0" y="132.0" text-anchor="middle" class="ubio-6-rna-processing-s" style="fill:var(--fig-violet)">5′ 모자</text>
  <line x1="150.0" y1="150.0" x2="640.0" y2="150.0" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/>
  <rect x="150.0" y="140.0" width="90.0" height="20.0" rx="3" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <rect x="330.0" y="140.0" width="80.0" height="20.0" rx="3" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <rect x="510.0" y="140.0" width="90.0" height="20.0" rx="3" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="254.0" y="134.0" text-anchor="middle" class="ubio-6-rna-processing-s" style="fill:var(--fig-red)">GU</text>
  <text x="316.0" y="134.0" text-anchor="middle" class="ubio-6-rna-processing-s" style="fill:var(--fig-red)">AG</text>
  <text x="285.0" y="176.0" text-anchor="middle" class="ubio-6-rna-processing-s">인트론 1</text>
  <text x="424.0" y="134.0" text-anchor="middle" class="ubio-6-rna-processing-s" style="fill:var(--fig-red)">GU</text>
  <text x="496.0" y="134.0" text-anchor="middle" class="ubio-6-rna-processing-s" style="fill:var(--fig-red)">AG</text>
  <text x="460.0" y="176.0" text-anchor="middle" class="ubio-6-rna-processing-s">인트론 2</text>
  <text x="632.0" y="176.0" text-anchor="end" class="ubio-6-rna-processing-s">AAUAAA</text>
  <rect x="640.0" y="143.0" width="60.0" height="14.0" rx="7" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <text x="670.0" y="134.0" text-anchor="middle" class="ubio-6-rna-processing-s" style="fill:var(--fig-amber)">폴리 A 꼬리</text>
  <text x="670.0" y="194.0" text-anchor="middle" class="ubio-6-rna-processing-s">A 50~250개</text>
  <line x1="400.0" y1="186.0" x2="400.0" y2="232.0" style="fill:none;stroke:var(--fig-ink);stroke-width:1.8" marker-end="url(#ubio-6-rna-processing-ar0)"/>
  <text x="410.0" y="214.0" text-anchor="start" class="ubio-6-rna-processing-s">스플라이싱(스플라이스오솜이 인트론 제거)</text>
  <text x="20.0" y="274.0" text-anchor="start" class="ubio-6-rna-processing-b">성숙한 mRNA</text>
  <circle cx="206.0" cy="270.0" r="10" style="fill:var(--fig-violet)"/>
  <rect x="216.0" y="260.0" width="90.0" height="20.0" rx="3" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="261.0" y="275.0" text-anchor="middle" class="ubio-6-rna-processing-s" style="fill:var(--fig-ink)">엑손 1</text>
  <rect x="306.0" y="260.0" width="80.0" height="20.0" rx="3" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="346.0" y="275.0" text-anchor="middle" class="ubio-6-rna-processing-s" style="fill:var(--fig-ink)">엑손 2</text>
  <rect x="386.0" y="260.0" width="90.0" height="20.0" rx="3" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="431.0" y="275.0" text-anchor="middle" class="ubio-6-rna-processing-s" style="fill:var(--fig-ink)">엑손 3</text>
  <rect x="476.0" y="263.0" width="60.0" height="14.0" rx="7" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <text x="506.0" y="296.0" text-anchor="middle" class="ubio-6-rna-processing-s" style="fill:var(--fig-amber)">폴리 A 꼬리</text>
  <path d="M610 252 c22 -22 60 -22 70 0 c8 18 -20 28 -40 18" style="fill:none;stroke:var(--fig-muted);stroke-width:2;stroke-dasharray:4 3"/>
  <text x="650.0" y="230.0" text-anchor="middle" class="ubio-6-rna-processing-s">잘려 나간 인트론</text>
  <line x1="400.0" y1="300.0" x2="400.0" y2="330.0" style="fill:none;stroke:var(--fig-ink);stroke-width:1.8" marker-end="url(#ubio-6-rna-processing-ar0)"/>
  <text x="410.0" y="322.0" text-anchor="start" class="ubio-6-rna-processing-s">핵공을 지나 세포질로 → 번역</text>
  <rect x="20.0" y="344.0" width="680.0" height="44.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="36.0" y="364.0" text-anchor="start" class="ubio-6-rna-processing-s">모자·꼬리: 분해 효소로부터 보호, 핵 밖 수송, 리보솜 결합(모자)</text>
  <text x="36.0" y="382.0" text-anchor="start" class="ubio-6-rna-processing-s">선택적 스플라이싱: 어떤 엑손을 남길지 다르게 골라 한 유전자에서 여러 단백질</text>
</svg>
