  <title id="t-umath-5-water-symmetry">그림 수학 도구 5-14 물 분자의 대칭 요소</title>
  <desc id="d-umath-5-water-symmetry">O를 원점, C2 축을 z축으로 두고 두 H를 xz 평면 안 아래쪽(z &lt; 0)에 놓았다. 분자 평면 σv(xz)(파랑)와 그에 수직인 σv′(yz)(주황), z축의 C2 축.</desc>
