<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-gene-3-pcr-cycle d-gene-3-pcr-cycle">
  <title id="t-gene-3-pcr-cycle">그림 생물의 유전 3-1 PCR의 한 주기</title>
  <desc id="d-gene-3-pcr-cycle">약 95 °C에서 두 가닥이 떨어지고(변성), 약 50~65 °C에서 프라이머가 증폭할 부위 양 끝에 결합하며, 약 72 °C에서 열에 강한 DNA 중합 효소가 프라이머의 3′ 끝에 뉴클레오타이드를 이어 새 가닥을 5′→3′ 방향으로 합성한다. 한 주기마다 표적 DNA가 2배가 된다.</desc>
  <style>
    .gene-3-pcr-cycle-h{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .gene-3-pcr-cycle-tx{font-size:14px;fill:var(--fig-ink)}
    .gene-3-pcr-cycle-sm{font-size:13px;fill:var(--fig-muted)}
    .gene-3-pcr-cycle-end{font-size:13px;font-weight:600;fill:var(--fig-ink)}
    .gene-3-pcr-cycle-old{fill:var(--fig-blue)}
    .gene-3-pcr-cycle-tgt{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1;stroke-dasharray:3 3}
    .gene-3-pcr-cycle-pri{fill:var(--fig-green)}
    .gene-3-pcr-cycle-new{fill:var(--fig-amber)}
    .gene-3-pcr-cycle-hb{fill:none;stroke:var(--fig-line);stroke-width:1.5;stroke-dasharray:2 3}
    .gene-3-pcr-cycle-pol{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5}
    .gene-3-pcr-cycle-ah{fill:var(--fig-ink)}
    .gene-3-pcr-cycle-ar{fill:none;stroke:var(--fig-ink);stroke-width:1.6}
    .gene-3-pcr-cycle-pan{fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1}
    .gene-3-pcr-cycle-hot{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1}
    .gene-3-pcr-cycle-mid{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1}
    .gene-3-pcr-cycle-warm{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1}
  </style>
  <rect x="8" y="10" width="232" height="236" rx="10" class="gene-3-pcr-cycle-pan"/>
  <text x="22" y="36" class="gene-3-pcr-cycle-h">① 변성</text>
  <rect x="136" y="20" width="92" height="24" rx="12" class="gene-3-pcr-cycle-hot"/>
  <text x="182" y="37" text-anchor="middle" class="gene-3-pcr-cycle-sm" style="fill:var(--fig-ink)">약 95 °C</text>
  <rect x="244" y="10" width="232" height="236" rx="10" class="gene-3-pcr-cycle-pan"/>
  <text x="258" y="36" class="gene-3-pcr-cycle-h">② 결합</text>
  <rect x="372" y="20" width="92" height="24" rx="12" class="gene-3-pcr-cycle-mid"/>
  <text x="418" y="37" text-anchor="middle" class="gene-3-pcr-cycle-sm" style="fill:var(--fig-ink)">약 50~65 °C</text>
  <rect x="480" y="10" width="232" height="236" rx="10" class="gene-3-pcr-cycle-pan"/>
  <text x="494" y="36" class="gene-3-pcr-cycle-h">③ 신장</text>
  <rect x="608" y="20" width="92" height="24" rx="12" class="gene-3-pcr-cycle-warm"/>
  <text x="654" y="37" text-anchor="middle" class="gene-3-pcr-cycle-sm" style="fill:var(--fig-ink)">약 72 °C</text>
  <rect x="82" y="78" width="84" height="126" rx="4" class="gene-3-pcr-cycle-tgt"/>
  <rect x="42" y="88" width="164" height="8" rx="2" class="gene-3-pcr-cycle-old"/>
  <text x="37" y="97" text-anchor="end" class="gene-3-pcr-cycle-end">5′</text>
  <text x="211" y="97" class="gene-3-pcr-cycle-end">3′</text>
  <rect x="42" y="186" width="164" height="8" rx="2" class="gene-3-pcr-cycle-old"/>
  <text x="37" y="195" text-anchor="end" class="gene-3-pcr-cycle-end">3′</text>
  <text x="211" y="195" class="gene-3-pcr-cycle-end">5′</text>
  <line x1="56" y1="102" x2="56" y2="120" class="gene-3-pcr-cycle-hb"/>
  <line x1="56" y1="162" x2="56" y2="180" class="gene-3-pcr-cycle-hb"/>
  <line x1="74" y1="102" x2="74" y2="120" class="gene-3-pcr-cycle-hb"/>
  <line x1="74" y1="162" x2="74" y2="180" class="gene-3-pcr-cycle-hb"/>
  <line x1="92" y1="102" x2="92" y2="120" class="gene-3-pcr-cycle-hb"/>
  <line x1="92" y1="162" x2="92" y2="180" class="gene-3-pcr-cycle-hb"/>
  <line x1="110" y1="102" x2="110" y2="120" class="gene-3-pcr-cycle-hb"/>
  <line x1="110" y1="162" x2="110" y2="180" class="gene-3-pcr-cycle-hb"/>
  <line x1="128" y1="102" x2="128" y2="120" class="gene-3-pcr-cycle-hb"/>
  <line x1="128" y1="162" x2="128" y2="180" class="gene-3-pcr-cycle-hb"/>
  <line x1="146" y1="102" x2="146" y2="120" class="gene-3-pcr-cycle-hb"/>
  <line x1="146" y1="162" x2="146" y2="180" class="gene-3-pcr-cycle-hb"/>
  <line x1="164" y1="102" x2="164" y2="120" class="gene-3-pcr-cycle-hb"/>
  <line x1="164" y1="162" x2="164" y2="180" class="gene-3-pcr-cycle-hb"/>
  <line x1="182" y1="102" x2="182" y2="120" class="gene-3-pcr-cycle-hb"/>
  <line x1="182" y1="162" x2="182" y2="180" class="gene-3-pcr-cycle-hb"/>
  <line x1="200" y1="102" x2="200" y2="120" class="gene-3-pcr-cycle-hb"/>
  <line x1="200" y1="162" x2="200" y2="180" class="gene-3-pcr-cycle-hb"/>
  <text x="124.0" y="146.0" text-anchor="middle" class="gene-3-pcr-cycle-sm">수소 결합이 끊어짐</text>
  <text x="124.0" y="226" text-anchor="middle" class="gene-3-pcr-cycle-sm">점선 상자: 증폭할 부위</text>
  <rect x="318" y="96" width="84" height="90" rx="4" class="gene-3-pcr-cycle-tgt"/>
  <rect x="278" y="106" width="164" height="8" rx="2" class="gene-3-pcr-cycle-old"/>
