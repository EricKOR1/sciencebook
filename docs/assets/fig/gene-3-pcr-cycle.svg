  <text x="447" y="177" class="gene-3-pcr-cycle-end">5′</text>
  <rect x="372" y="118" width="30" height="8" rx="2" class="gene-3-pcr-cycle-pri"/>
  <rect x="318" y="156" width="30" height="8" rx="2" class="gene-3-pcr-cycle-pri"/>
  <text x="368" y="140" text-anchor="end" class="gene-3-pcr-cycle-end" style="fill:var(--fig-green)">3′</text>
  <text x="405" y="140" class="gene-3-pcr-cycle-end" style="fill:var(--fig-green)">5′</text>
  <text x="315" y="154" text-anchor="end" class="gene-3-pcr-cycle-end" style="fill:var(--fig-green)">5′</text>
  <text x="352" y="154" class="gene-3-pcr-cycle-end" style="fill:var(--fig-green)">3′</text>
  <text x="360.0" y="226" text-anchor="middle" class="gene-3-pcr-cycle-sm">초록: 프라이머(짧은 단일 가닥)</text>
  <rect x="554" y="96" width="84" height="90" rx="4" class="gene-3-pcr-cycle-tgt"/>
  <rect x="514" y="106" width="164" height="8" rx="2" class="gene-3-pcr-cycle-old"/>
  <text x="509" y="115" text-anchor="end" class="gene-3-pcr-cycle-end">5′</text>
  <text x="683" y="115" class="gene-3-pcr-cycle-end">3′</text>
  <rect x="514" y="168" width="164" height="8" rx="2" class="gene-3-pcr-cycle-old"/>
  <text x="509" y="177" text-anchor="end" class="gene-3-pcr-cycle-end">3′</text>
  <text x="683" y="177" class="gene-3-pcr-cycle-end">5′</text>
  <rect x="608" y="118" width="30" height="8" rx="2" class="gene-3-pcr-cycle-pri"/>
  <rect x="554" y="156" width="30" height="8" rx="2" class="gene-3-pcr-cycle-pri"/>
  <text x="641" y="140" class="gene-3-pcr-cycle-end" style="fill:var(--fig-green)">5′</text>
  <text x="551" y="154" text-anchor="end" class="gene-3-pcr-cycle-end" style="fill:var(--fig-green)">5′</text>
  <rect x="524" y="118" width="84" height="8" rx="2" class="gene-3-pcr-cycle-new"/>
  <rect x="584" y="156" width="84" height="8" rx="2" class="gene-3-pcr-cycle-new"/>
  <ellipse cx="530" cy="126" rx="14" ry="9" class="gene-3-pcr-cycle-pol"/>
  <ellipse cx="662" cy="156" rx="14" ry="9" class="gene-3-pcr-cycle-pol"/>
  <line x1="626.0" y1="133.0" x2="566.0" y2="133.0" class="gene-3-pcr-cycle-ar"/><path d="M564.0 133.0 l9 -5 l0 10 z" class="gene-3-pcr-cycle-ah"/>
  <line x1="566.0" y1="149.0" x2="626.0" y2="149.0" class="gene-3-pcr-cycle-ar"/><path d="M628.0 149.0 l-9 -5 l0 10 z" class="gene-3-pcr-cycle-ah"/>
  <text x="596.0" y="208" text-anchor="middle" class="gene-3-pcr-cycle-sm">DNA 중합 효소가 프라이머의</text>
  <text x="596.0" y="226" text-anchor="middle" class="gene-3-pcr-cycle-sm">3′ 끝에 이어 붙인다(5′→3′)</text>
  <rect x="8" y="254" width="704" height="98" rx="10" class="gene-3-pcr-cycle-pan"/>
  <text x="24" y="280" class="gene-3-pcr-cycle-h">①~③이 한 주기 → 주기마다 표적 DNA가 2배</text>
  <rect x="24" y="298" width="22" height="4" class="gene-3-pcr-cycle-old"/><rect x="24" y="304" width="22" height="4" class="gene-3-pcr-cycle-old"/>
  <text x="37" y="342" text-anchor="middle" class="gene-3-pcr-cycle-sm">처음 1개</text>
  <path d="M56 306 l14 0" class="gene-3-pcr-cycle-ar"/><path d="M72 306 l-7 -4 l0 8 z" class="gene-3-pcr-cycle-ah"/>
  <rect x="84" y="298" width="22" height="4" class="gene-3-pcr-cycle-old"/><rect x="84" y="304" width="22" height="4" class="gene-3-pcr-cycle-old"/>
  <rect x="110" y="298" width="22" height="4" class="gene-3-pcr-cycle-old"/><rect x="110" y="304" width="22" height="4" class="gene-3-pcr-cycle-old"/>
  <text x="110" y="342" text-anchor="middle" class="gene-3-pcr-cycle-sm">1주기 2개</text>
  <path d="M142 306 l14 0" class="gene-3-pcr-cycle-ar"/><path d="M158 306 l-7 -4 l0 8 z" class="gene-3-pcr-cycle-ah"/>
  <rect x="170" y="298" width="22" height="4" class="gene-3-pcr-cycle-old"/><rect x="170" y="304" width="22" height="4" class="gene-3-pcr-cycle-old"/>
  <rect x="196" y="298" width="22" height="4" class="gene-3-pcr-cycle-old"/><rect x="196" y="304" width="22" height="4" class="gene-3-pcr-cycle-old"/>
  <rect x="222" y="298" width="22" height="4" class="gene-3-pcr-cycle-old"/><rect x="222" y="304" width="22" height="4" class="gene-3-pcr-cycle-old"/>
  <rect x="248" y="298" width="22" height="4" class="gene-3-pcr-cycle-old"/><rect x="248" y="304" width="22" height="4" class="gene-3-pcr-cycle-old"/>
  <text x="222" y="342" text-anchor="middle" class="gene-3-pcr-cycle-sm">2주기 4개</text>
  <path d="M280 306 l14 0" class="gene-3-pcr-cycle-ar"/><path d="M296 306 l-7 -4 l0 8 z" class="gene-3-pcr-cycle-ah"/>
  <rect x="308" y="298" width="22" height="4" class="gene-3-pcr-cycle-old"/><rect x="308" y="304" width="22" height="4" class="gene-3-pcr-cycle-old"/>
  <rect x="334" y="298" width="22" height="4" class="gene-3-pcr-cycle-old"/><rect x="334" y="304" width="22" height="4" class="gene-3-pcr-cycle-old"/>
