  <rect x="386" y="298" width="22" height="4" class="gene-3-pcr-cycle-old"/><rect x="386" y="304" width="22" height="4" class="gene-3-pcr-cycle-old"/>
  <rect x="308" y="314" width="22" height="4" class="gene-3-pcr-cycle-old"/><rect x="308" y="320" width="22" height="4" class="gene-3-pcr-cycle-old"/>
  <rect x="334" y="314" width="22" height="4" class="gene-3-pcr-cycle-old"/><rect x="334" y="320" width="22" height="4" class="gene-3-pcr-cycle-old"/>
  <rect x="360" y="314" width="22" height="4" class="gene-3-pcr-cycle-old"/><rect x="360" y="320" width="22" height="4" class="gene-3-pcr-cycle-old"/>
  <rect x="386" y="314" width="22" height="4" class="gene-3-pcr-cycle-old"/><rect x="386" y="320" width="22" height="4" class="gene-3-pcr-cycle-old"/>
  <text x="360" y="342" text-anchor="middle" class="gene-3-pcr-cycle-sm">3주기 8개</text>
  <text x="456" y="312" class="gene-3-pcr-cycle-tx">…  n주기 뒤 2ⁿ배 (30주기 ≈ 10⁹배)</text>
  <text x="456" y="334" class="gene-3-pcr-cycle-sm">모식도: 새 가닥의 길이와 끝 위치는 단순화했다</text>
</svg>
