    .ps-l{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.4}
    .ps-g{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.4}
    .ps-vib{fill:none;stroke:var(--fig-blue);stroke-width:1.3;stroke-linecap:round}
    .ps-ar{fill:none;stroke:var(--fig-ink);stroke-width:1.5;stroke-linecap:round}
    .ps-ah{fill:var(--fig-ink)}
    .ps-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .ps-t{font-size:13.5px;fill:var(--fig-ink)}
    .ps-k{font-size:13px;fill:var(--fig-muted)}
    .ps-sm{font-size:13px;fill:var(--fig-muted)}
  </style>
