  <title id="t-m1-04-particle-states">그림 중1-4-1 고체·액체·기체의 입자 모형</title>
  <desc id="d-m1-04-particle-states">같은 크기의 그릇에 담긴 물질을 입자로 나타낸 모식도이다. 고체는 입자가 규칙적으로 빽빽하게 늘어서 제자리에서 떨고, 액체는 가깝지만 불규칙하게 놓여 자리를 바꾸며, 기체는 입자 사이가 매우 멀고 빠르게 날아다닌다.</desc>
  <style>
    .ps-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.6}
