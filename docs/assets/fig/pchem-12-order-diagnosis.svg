  <title id="t-pchem-12-order-diagnosis">그림 물리화학 12-2 같은 자료를 세 방식으로 그려 차수 판별하기</title>
  <desc id="d-pchem-12-order-diagnosis">2차 반응([A]₀ = 0.100 M, k = 0.25 M⁻¹ s⁻¹)에서 0, 20, 40, 60, 80, 120 s에 잰 농도(0.100, 0.0667, 0.0500, 0.0400, 0.0333, 0.0250 M)를 (가) [A], (나) ln[A], (다) 1/[A]로 바꾸어 시간에 대해 그렸다. (가)와 (나)는 아래로 볼록하게 휘어 처음과 끝 점을 이은 점선 직선에서 벗어나고, (다)만 절편 10.0 M⁻¹, 기울기 0.25 M⁻¹ s⁻¹인 직선 위에 모든 점이 놓인다.</desc>
