<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-uearth-4-freshwater-lens d-uearth-4-freshwater-lens">
<title id="t-uearth-4-freshwater-lens">그림 일반지구과학 4-7 섬의 담수 렌즈와 해수 침입</title>
<desc id="d-uearth-4-freshwater-lens">섬의 지하에서 가벼운 담수는 무거운 해수 위에 렌즈 모양으로 떠 있다. 지하수면이 해수면보다 h만큼 높으면 담수–해수 경계면은 해수면 아래 약 40h 깊이에 있다. 우물에서 과잉 양수로 지하수면이 조금만 낮아져도 그 아래의 경계면은 약 40배만큼 솟아올라 우물에 해수가 섞인다. 세로 크게 과장한 모식도이다.</desc>
