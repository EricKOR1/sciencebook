  <title id="t-ubio-1-q-lettuce-dots">그림 일반생명과학 1-9 예제 1 상추 모종의 키 — 개체별 값과 평균 ± 표준 편차</title>
  <desc id="d-ubio-1-q-lettuce-dots">점은 모종 한 개체의 키, 굵은 가로선은 집단 평균(수돗물 12.1 cm, 0.1 M NaCl 9.4 cm), 세로 막대는 평균 ± 표준 편차(두 집단 모두 약 0.51 cm)이다.</desc>
