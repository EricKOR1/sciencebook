<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-ubio-5-q-robertsonian d-ubio-5-q-robertsonian">
  <title id="t-ubio-5-q-robertsonian">그림 일반생명과학 5-15 문제 12 해설: 로버트슨 전좌 보인자 어머니의 생식세포</title>
  <desc id="d-ubio-5-q-robertsonian">어머니는 14번(파랑) 1개, 21번(빨강) 1개, 21번의 긴 팔이 14번에 붙은 전좌 염색체 1개를 가진다(45개). 감수 분열에서 세 염색체가 나뉘는 방식에 따라 여섯 가지 생식세포가 생기고, 각각 정상 정자(14번, 21번 각 1개)와 수정한 결과를 적었다. 전좌 염색체와 정상 21번이 함께 들어간 생식세포에서 다운 증후군이 생긴다. 모식도이며 여섯 경우의 빈도는 같지 않다.</desc>
