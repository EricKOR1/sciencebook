  <text x="230.0" y="206.0" text-anchor="middle" class="f2-4-q-co2-dot-t">C 주위: 공유 전자쌍 4개 → 전자 8개</text>
  <text x="230.0" y="230.0" text-anchor="middle" class="f2-4-q-co2-dot-t">O 주위(각각): 공유 2쌍 + 비공유 2쌍 → 전자 8개</text>
