<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 248" class="fig-small" role="img" aria-labelledby="t-2-4-q-co2-dot d-2-4-q-co2-dot">
  <title id="t-2-4-q-co2-dot">그림 2-4-4 예제 3 이산화 탄소의 전자 점식</title>
  <desc id="d-2-4-q-co2-dot">탄소 원자는 양쪽 산소 원자와 공유 전자쌍을 2개씩(이중 결합) 이루어 공유 전자쌍이 모두 4개이고, 산소 원자마다 비공유 전자쌍이 2개씩 있다. 탄소와 산소 모두 주위의 전자가 8개이다. 전자 점식은 연결 관계만 나타낸다.</desc>
  <style>
    .f2-4-q-co2-dot-t{font-size:14px;fill:var(--fig-ink)} .f2-4-q-co2-dot-sm{font-size:13px;fill:var(--fig-muted)}
    .f2-4-q-co2-dot-lbl{font-size:15px;font-weight:600;fill:var(--fig-ink)} .f2-4-q-co2-dot-sym{font-size:28px;font-weight:700;fill:var(--fig-ink)}
    .f2-4-q-co2-dot-e1{fill:var(--fig-blue)} .f2-4-q-co2-dot-e2{fill:var(--fig-red)}
    .f2-4-q-co2-dot-sh{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5}
    .f2-4-q-co2-dot-lp{fill:none;stroke:var(--fig-violet);stroke-width:1.5;stroke-dasharray:3 2}
    .f2-4-q-co2-dot-ld{stroke:var(--fig-muted);stroke-width:1.1;fill:none} .f2-4-q-co2-dot-sep{stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4}
    .f2-4-q-co2-dot-r1{fill:none;stroke:var(--fig-blue);stroke-width:1.4;stroke-dasharray:6 4} .f2-4-q-co2-dot-r2{fill:none;stroke:var(--fig-red);stroke-width:1.4;stroke-dasharray:6 4}
  </style>
  <text x="14.0" y="24.0" text-anchor="start" class="f2-4-q-co2-dot-sm"><tspan class="f2-4-q-co2-dot-e1">●</tspan> 파란 점: C에서 온 전자   <tspan class="f2-4-q-co2-dot-e2">●</tspan> 빨간 점: O에서 온 전자</text>
