<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-rxn-1-titration-setup d-rxn-1-titration-setup">
  <title id="t-rxn-1-titration-setup">그림 화학 반응의 세계 1-3 pH 센서를 이용한 중화 적정 장치</title>
  <desc id="d-rxn-1-titration-setup">뷰렛에 농도를 아는 NaOH 수용액을 넣고, 자석 젓개로 저어 주는 산 수용액에 조금씩 떨어뜨리며 pH 센서로 pH를 연속 측정한다. 데이터 기록 장치에는 가한 부피에 따른 pH, 곧 중화 적정 곡선이 그려진다. 장치의 크기 비율은 모식도이다.</desc>
