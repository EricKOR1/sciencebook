  <title id="t-uchem-7-surface-catalysis">그림 일반화학 7-7 니켈 표면에서 일어나는 에텐의 수소 첨가</title>
  <desc id="d-uchem-7-surface-catalysis">불균일 촉매 반응의 네 단계를 그린 모식도이다. ① H₂와 C₂H₄가 표면의 활성 자리에 흡착하고, ② H–H 결합이 끊어져 H 원자가 표면을 돌아다니며, ③ H 원자가 하나씩 탄소에 결합하고, ④ 생긴 C₂H₆가 탈착해 자리가 다시 비워진다.</desc>
