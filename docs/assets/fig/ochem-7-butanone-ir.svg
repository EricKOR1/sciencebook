<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-ochem-7-butanone-ir d-ochem-7-butanone-ir">
  <title id="t-ochem-7-butanone-ir">그림 유기화학 7-9 뷰탄-2-온의 IR 스펙트럼</title>
  <desc id="d-ochem-7-butanone-ir">액체 막의 IR 모식도(띠 위치와 깊이는 전형적인 값으로 계산해 그렸다). 1715 cm⁻¹의 C=O 신축이 투과율 약 5 %까지 내려가는 가장 강하고 날카로운 띠이고, 2980·2940의 C–H(sp³) 신축, 1460·1365의 C–H 굽힘, 1170의 C–C(=O)–C 띠가 있다. 약 3410의 아주 약한 띠는 C=O의 배음이며, 3200~3600에 넓은 O–H 띠가 없으므로 알코올이 아니다.</desc>
