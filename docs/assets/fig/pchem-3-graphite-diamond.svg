<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-pchem-3-graphite-diamond d-pchem-3-graphite-diamond">
  <title id="t-pchem-3-graphite-diamond">그림 물리화학 3-8 25 ℃에서 흑연과 다이아몬드의 몰 깁스 에너지와 압력</title>
  <desc id="d-pchem-3-graphite-diamond">흑연(기울기 5.315 cm³/mol)과 다이아몬드(절편 2.900 kJ/mol, 기울기 3.417 cm³/mol)의 G_m − G_m(흑연, 1 bar)을 압력에 대해 그린 직선이다. 두 직선은 약 1.53×10⁴ bar에서 만나며, 그보다 낮은 압력에서는 흑연, 높은 압력에서는 다이아몬드의 깁스 에너지가 낮다.</desc>
