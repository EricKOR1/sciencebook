<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 378" role="img" aria-labelledby="t-bio-2-synapse d-bio-2-synapse">
  <title id="t-bio-2-synapse">그림 생명과학 2-2 시냅스의 구조와 신경 전달 물질의 이동</title>
  <desc id="d-bio-2-synapse">축삭 돌기 말단의 시냅스 소포가 세포막과 융합하여 신경 전달 물질을 시냅스 틈으로 분비하고, 신경 전달 물질이 확산하여 시냅스 후 뉴런 막의 수용체에 결합하면 이온 통로가 열려 Na⁺가 들어와 탈분극된다. 남은 신경 전달 물질은 분해 효소로 분해되거나 재흡수된다. 모식도(크기 비율은 실제와 다름).</desc>
