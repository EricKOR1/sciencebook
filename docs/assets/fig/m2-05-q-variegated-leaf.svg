<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" class="fig-small" role="img" aria-labelledby="t-m2-05-q-variegated-leaf d-m2-05-q-variegated-leaf">
  <title id="t-m2-05-q-variegated-leaf">그림 중2-5-11 문제 14의 무늬 잎</title>
  <desc id="d-m2-05-q-variegated-leaf">가장자리가 흰색이고 가운데가 초록색인 무늬 잎의 아래쪽 절반을 알루미늄 포일로 앞뒤 모두 가렸다. (가)는 위쪽 초록 부분, (나)는 위쪽 흰 부분, (다)는 아래쪽 초록 부분, (라)는 아래쪽 흰 부분이다. 잎과 포일의 색은 실제 색에 가깝게 나타냈다.</desc>
  <style>.m2-05-q-variegated-leaf-t{font-size:14px;fill:var(--fig-ink)} .m2-05-q-variegated-leaf-s{font-size:13px;fill:var(--fig-muted)} .m2-05-q-variegated-leaf-b{font-size:15px;font-weight:700;fill:var(--fig-ink)} </style>
