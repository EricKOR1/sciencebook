<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img" aria-labelledby="t-esys-3-stability d-esys-3-stability">
  <title id="t-esys-3-stability">그림 지구시스템과학 3-4 기온 감률과 대기 안정도</title>
  <desc id="d-esys-3-stability">지표에서 같은 기온(20 °C)으로 출발한 공기 덩어리가 건조 단열 감률(10 °C/km, 파란 파선)이나 습윤 단열 감률(약 5 °C/km, 초록 점선)로 식을 때, 주변 기온(빨간 실선)의 감률이 습윤 단열 감률보다 작으면 절대 안정, 두 단열 감률 사이이면 조건부 불안정, 건조 단열 감률보다 크면 절대 불안정이다. 같은 높이에서 공기 덩어리가 주변보다 따뜻하면 계속 올라간다.</desc>
  <style>
    .esys-3-stability-t{font-size:13px;fill:var(--fig-ink)}
    .esys-3-stability-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .esys-3-stability-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .esys-3-stability-s{font-size:13px;fill:var(--fig-muted)}
    .esys-3-stability-r{font-size:13px;font-weight:600;fill:var(--fig-red)}
    .esys-3-stability-u{font-size:13px;font-weight:600;fill:var(--fig-blue)}
    .esys-3-stability-g{font-size:13px;font-weight:600;fill:var(--fig-green)}
    .esys-3-stability-a{font-size:13px;font-weight:600;fill:var(--fig-amber)}
    .esys-3-stability-v{font-size:13px;font-weight:600;fill:var(--fig-violet)}
    .esys-3-stability-e{font-size:13px;font-weight:600;fill:var(--fig-teal)}
    .esys-3-stability-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
<rect x="60" y="60" width="200" height="200" style="fill:var(--fig-panel);stroke:var(--fig-line)"/><line x1="100.0" y1="260" x2="100.0" y2="264" style="stroke:var(--fig-ink)"/><text x="100.0" y="278.0" text-anchor="middle" class="esys-3-stability-s">-10</text><line x1="150.0" y1="260" x2="150.0" y2="264" style="stroke:var(--fig-ink)"/><text x="150.0" y="278.0" text-anchor="middle" class="esys-3-stability-s">0</text><line x1="200.0" y1="260" x2="200.0" y2="264" style="stroke:var(--fig-ink)"/><text x="200.0" y="278.0" text-anchor="middle" class="esys-3-stability-s">10</text><line x1="250.0" y1="260" x2="250.0" y2="264" style="stroke:var(--fig-ink)"/><text x="250.0" y="278.0" text-anchor="middle" class="esys-3-stability-s">20</text><text x="54.0" y="264.0" text-anchor="end" class="esys-3-stability-s">0</text><text x="54.0" y="197.3" text-anchor="end" class="esys-3-stability-s">1</text><text x="54.0" y="130.7" text-anchor="end" class="esys-3-stability-s">2</text><text x="54.0" y="64.0" text-anchor="end" class="esys-3-stability-s">3</text><line x1="250.0" y1="260.0" x2="100.0" y2="60.0" style="stroke:var(--fig-blue);stroke-width:2;stroke-dasharray:7 4"/><line x1="250.0" y1="260.0" x2="175.0" y2="60.0" style="stroke:var(--fig-green);stroke-width:2.2;stroke-dasharray:2 3"/><line x1="250.0" y1="260.0" x2="205.0" y2="60.0" style="stroke:var(--fig-red);stroke-width:2.6"/><text x="160.0" y="34.0" text-anchor="middle" class="esys-3-stability-h">절대 안정</text><text x="160.0" y="52.0" text-anchor="middle" class="esys-3-stability-s">Γ &lt; Γs (주변 3 °C/km)</text><text x="160.0" y="300.0" text-anchor="middle" class="esys-3-stability-t">불포화·포화 모두 주변보다 차가움</text><text x="160.0" y="318.0" text-anchor="middle" class="esys-3-stability-u">→ 되돌아옴</text><rect x="290" y="60" width="200" height="200" style="fill:var(--fig-panel);stroke:var(--fig-line)"/><line x1="330.0" y1="260" x2="330.0" y2="264" style="stroke:var(--fig-ink)"/><text x="330.0" y="278.0" text-anchor="middle" class="esys-3-stability-s">-10</text><line x1="380.0" y1="260" x2="380.0" y2="264" style="stroke:var(--fig-ink)"/><text x="380.0" y="278.0" text-anchor="middle" class="esys-3-stability-s">0</text><line x1="430.0" y1="260" x2="430.0" y2="264" style="stroke:var(--fig-ink)"/><text x="430.0" y="278.0" text-anchor="middle" class="esys-3-stability-s">10</text><line x1="480.0" y1="260" x2="480.0" y2="264" style="stroke:var(--fig-ink)"/><text x="480.0" y="278.0" text-anchor="middle" class="esys-3-stability-s">20</text><line x1="480.0" y1="260.0" x2="330.0" y2="60.0" style="stroke:var(--fig-blue);stroke-width:2;stroke-dasharray:7 4"/><line x1="480.0" y1="260.0" x2="405.0" y2="60.0" style="stroke:var(--fig-green);stroke-width:2.2;stroke-dasharray:2 3"/><line x1="480.0" y1="260.0" x2="375.0" y2="60.0" style="stroke:var(--fig-red);stroke-width:2.6"/><text x="390.0" y="34.0" text-anchor="middle" class="esys-3-stability-h">조건부 불안정</text><text x="390.0" y="52.0" text-anchor="middle" class="esys-3-stability-s">Γs &lt; Γ &lt; Γd (주변 7 °C/km)</text><text x="390.0" y="300.0" text-anchor="middle" class="esys-3-stability-t">포화된 공기만 주변보다 따뜻함</text><text x="390.0" y="318.0" text-anchor="middle" class="esys-3-stability-r">→ 포화되면 계속 상승</text><rect x="520" y="60" width="200" height="200" style="fill:var(--fig-panel);stroke:var(--fig-line)"/><line x1="560.0" y1="260" x2="560.0" y2="264" style="stroke:var(--fig-ink)"/><text x="560.0" y="278.0" text-anchor="middle" class="esys-3-stability-s">-10</text><line x1="610.0" y1="260" x2="610.0" y2="264" style="stroke:var(--fig-ink)"/><text x="610.0" y="278.0" text-anchor="middle" class="esys-3-stability-s">0</text><line x1="660.0" y1="260" x2="660.0" y2="264" style="stroke:var(--fig-ink)"/><text x="660.0" y="278.0" text-anchor="middle" class="esys-3-stability-s">10</text><line x1="710.0" y1="260" x2="710.0" y2="264" style="stroke:var(--fig-ink)"/><text x="710.0" y="278.0" text-anchor="middle" class="esys-3-stability-s">20</text><line x1="710.0" y1="260.0" x2="560.0" y2="60.0" style="stroke:var(--fig-blue);stroke-width:2;stroke-dasharray:7 4"/><line x1="710.0" y1="260.0" x2="635.0" y2="60.0" style="stroke:var(--fig-green);stroke-width:2.2;stroke-dasharray:2 3"/><line x1="710.0" y1="260.0" x2="530.0" y2="60.0" style="stroke:var(--fig-red);stroke-width:2.6"/><text x="620.0" y="34.0" text-anchor="middle" class="esys-3-stability-h">절대 불안정</text><text x="620.0" y="52.0" text-anchor="middle" class="esys-3-stability-s">Γ > Γd (주변 12 °C/km)</text><text x="620.0" y="300.0" text-anchor="middle" class="esys-3-stability-t">불포화·포화 모두 주변보다 따뜻함</text><text x="620.0" y="318.0" text-anchor="middle" class="esys-3-stability-r">→ 계속 상승</text><text x="28.0" y="80.0" text-anchor="middle" class="esys-3-stability-s">높이</text><text x="28.0" y="96.0" text-anchor="middle" class="esys-3-stability-s">(km)</text><text x="60.0" y="360.0" class="esys-3-stability-s">가로축: 기온(°C)</text><line x1="390" y1="356" x2="420" y2="356" style="stroke:var(--fig-red);stroke-width:2.6"/><text x="426.0" y="360.0" class="esys-3-stability-s">주변 기온</text><line x1="500" y1="356" x2="530" y2="356" style="stroke:var(--fig-blue);stroke-width:2;stroke-dasharray:7 4"/><text x="536.0" y="360.0" class="esys-3-stability-s">건조 단열</text><line x1="610" y1="356" x2="640" y2="356" style="stroke:var(--fig-green);stroke-width:2.2;stroke-dasharray:2 3"/><text x="646.0" y="360.0" class="esys-3-stability-s">습윤 단열</text></svg>
