<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t-phy-2-capacitor-charging d-phy-2-capacitor-charging">
  <title id="t-phy-2-capacitor-charging">그림 물리학 2-4 축전기의 충전</title>
  <desc id="d-phy-2-capacitor-charging">(가) 전지가 (+)극 쪽 판의 전자를 끌어와 회로를 따라 반대쪽 판으로 보내면, 두 판은 같은 크기의 반대 전하를 띠고 판 사이에 전기장이 생긴다. 전자는 절연체인 판 사이를 건너가지 못한다. (나) 충전 전류는 처음에 크다가 판 사이 전위차가 전지 전압과 같아지면 0이 된다(모식도).</desc>
