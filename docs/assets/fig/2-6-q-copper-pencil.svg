<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-labelledby="t-2-6-q-copper-pencil d-2-6-q-copper-pencil">
  <title id="t-2-6-q-copper-pencil">그림 2-6-10 문제 14의 회로와 두 시료</title>
  <desc id="d-2-6-q-copper-pencil">건전지와 전류계를 연결한 같은 회로의 시료 자리에 구리선과 연필심을 차례로 끼운다. 구리선은 길이 100 cm로 아주 가늘고, 연필심은 길이 3 cm로 굵다. 길이와 굵기의 비율은 실제와 다르게 그린 모식도이다.</desc>
