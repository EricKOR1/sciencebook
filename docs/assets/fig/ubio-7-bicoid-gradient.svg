<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-ubio-7-bicoid-gradient d-ubio-7-bicoid-gradient">
<title id="t-ubio-7-bicoid-gradient">그림 일반생명과학 7-6 비코이드 농도 기울기와 문턱 농도</title>
<desc id="d-ubio-7-bicoid-gradient">비코이드 농도는 앞쪽 끝에서 C(x) = C₀e^(−x/λ), λ = 0.20L로 줄어든다. 문턱 농도 0.30C₀ 이상인 곳에서만 켜지는 유전자는 앞쪽 24%까지 켜진다. 비코이드 유전자 수를 늘려 C₀가 2배가 되면 같은 문턱에 닿는 지점이 38%로 뒤로 옮겨 간다.</desc>
