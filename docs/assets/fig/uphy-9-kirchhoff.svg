<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-uphy-9-kirchhoff d-uphy-9-kirchhoff">
  <title id="t-uphy-9-kirchhoff">그림 일반물리학 9-1 키르히호프 법칙 적용 — 전원이 두 개인 회로(예제 6)</title>
  <desc id="d-uphy-9-kirchhoff">두 분기점 a, b 사이에 기전력 12 V와 2.0 Ω, 4.0 Ω, 기전력 6.0 V와 3.0 Ω인 세 가지가 병렬로 있다. 가지 전류의 방향을 가정하고(I1, I3은 위로, I2는 아래로), 두 고리를 시계 방향으로 돌며 부호 규칙에 따라 전위 변화를 더한다. 풀어서 음수가 나온 I3은 실제 방향이 가정과 반대이다.</desc>
  <style>.uphy-9-kirchhoff-t{font-size:14px;fill:var(--fig-ink)} .uphy-9-kirchhoff-b{font-size:14px;fill:var(--fig-ink);font-weight:700} .uphy-9-kirchhoff-s{font-size:13px;fill:var(--fig-muted)} .uphy-9-kirchhoff-w{stroke:var(--fig-ink);stroke-width:2.2;fill:none;stroke-linejoin:round}</style>
  <path d="M70 60 L310 60 M70 280 L310 280" class="uphy-9-kirchhoff-w"/>
  <path d="M70 60 L70 110 M70 120 L70 170 M70 236 L70 280" class="uphy-9-kirchhoff-w"/>
  <line x1="54" y1="110" x2="86" y2="110" style="stroke:var(--fig-ink);stroke-width:2.5"/>
  <line x1="62" y1="120" x2="78" y2="120" style="stroke:var(--fig-ink);stroke-width:5"/>
  <text x="92" y="108" text-anchor="start" class="uphy-9-kirchhoff-b" style="fill:var(--fig-red)">+</text>
  <text x="92" y="128" text-anchor="start" class="uphy-9-kirchhoff-b" style="fill:var(--fig-blue)">−</text>
  <text x="104" y="120" text-anchor="start" class="uphy-9-kirchhoff-b">ε₁ = 12 V</text>
  <path d="M70 170 L79 175.5 L61 186.5 L79 197.5 L61 208.5 L79 219.5 L61 230.5 L70 236" class="uphy-9-kirchhoff-w"/>
  <text x="86" y="208.0" text-anchor="start" class="uphy-9-kirchhoff-t">R₁ = 2.0 Ω</text>
  <path d="M190 60 L190 135 M190 205 L190 280" class="uphy-9-kirchhoff-w"/>
  <path d="M190 135 L199 140.8 L181 152.5 L199 164.2 L181 175.8 L199 187.5 L181 199.2 L190 205" class="uphy-9-kirchhoff-w"/>
  <text x="204" y="232" text-anchor="start" class="uphy-9-kirchhoff-t">R₂ = 4.0 Ω</text>
  <path d="M310 60 L310 110 M310 120 L310 170 M310 236 L310 280" class="uphy-9-kirchhoff-w"/>
  <line x1="294" y1="110" x2="326" y2="110" style="stroke:var(--fig-ink);stroke-width:2.5"/>
  <line x1="302" y1="120" x2="318" y2="120" style="stroke:var(--fig-ink);stroke-width:5"/>
  <text x="332" y="108" text-anchor="start" class="uphy-9-kirchhoff-b" style="fill:var(--fig-red)">+</text>
  <text x="332" y="128" text-anchor="start" class="uphy-9-kirchhoff-b" style="fill:var(--fig-blue)">−</text>
  <text x="344" y="120" text-anchor="start" class="uphy-9-kirchhoff-b">ε₂ = 6.0 V</text>
  <path d="M310 170 L319 175.5 L301 186.5 L319 197.5 L301 208.5 L319 219.5 L301 230.5 L310 236" class="uphy-9-kirchhoff-w"/>
  <text x="326" y="208.0" text-anchor="start" class="uphy-9-kirchhoff-t">R₃ = 3.0 Ω</text>
  <circle cx="190" cy="60" r="5" style="fill:var(--fig-ink)"/>
  <text x="190" y="50" text-anchor="middle" class="uphy-9-kirchhoff-b">a</text>
  <circle cx="190" cy="280" r="5" style="fill:var(--fig-ink)"/>
  <text x="190" y="304" text-anchor="middle" class="uphy-9-kirchhoff-b">b</text>
  <path d="M70.0 258.0 L74.9 269.0 L65.1 269.0 Z" style="fill:var(--fig-red)"/>
  <text x="60" y="263" text-anchor="end" class="uphy-9-kirchhoff-b" style="fill:var(--fig-red)">I₁</text>
  <path d="M190.0 250.0 L185.1 239.0 L194.9 239.0 Z" style="fill:var(--fig-red)"/>
  <text x="180" y="255" text-anchor="end" class="uphy-9-kirchhoff-b" style="fill:var(--fig-red)">I₂</text>
  <path d="M310.0 258.0 L314.9 269.0 L305.1 269.0 Z" style="fill:var(--fig-red)"/>
  <text x="300" y="263" text-anchor="end" class="uphy-9-kirchhoff-b" style="fill:var(--fig-red)">I₃</text>
  <path d="M104 163 A26 26 0 1 1 130 189" style="fill:none;stroke:var(--fig-teal);stroke-width:2;stroke-dasharray:5 3"/>
  <path d="M130.0 189.0 L139.1 184.9 L139.1 193.1 Z" style="fill:var(--fig-teal)"/>
  <text x="130" y="168" text-anchor="middle" class="uphy-9-kirchhoff-s" style="fill:var(--fig-teal);font-weight:700">고리 1</text>
  <path d="M224 163 A26 26 0 1 1 250 189" style="fill:none;stroke:var(--fig-teal);stroke-width:2;stroke-dasharray:5 3"/>
  <path d="M250.0 189.0 L259.1 184.9 L259.1 193.1 Z" style="fill:var(--fig-teal)"/>
  <text x="250" y="168" text-anchor="middle" class="uphy-9-kirchhoff-s" style="fill:var(--fig-teal);font-weight:700">고리 2</text>
  <rect x="412" y="14" width="300" height="312" rx="8" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <text x="426" y="40" text-anchor="start" class="uphy-9-kirchhoff-b">부호 규칙 (고리를 도는 방향 기준)</text>
  <text x="426" y="62" text-anchor="start" class="uphy-9-kirchhoff-s">저항: 전류 방향으로 지나면 −IR, 반대면 +IR</text>
  <text x="426" y="84" text-anchor="start" class="uphy-9-kirchhoff-s">전지: −극 → +극으로 지나면 +ε, 반대면 −ε</text>
  <text x="426" y="112" text-anchor="start" class="uphy-9-kirchhoff-b">분기점 a</text>
  <text x="426" y="134" text-anchor="start" class="uphy-9-kirchhoff-t">I₁ + I₃ = I₂</text>
  <text x="426" y="162" text-anchor="start" class="uphy-9-kirchhoff-b">고리 1 (b → 왼쪽 가지 → a → 가운데 → b)</text>
  <text x="426" y="184" text-anchor="start" class="uphy-9-kirchhoff-t">−I₁R₁ + ε₁ − I₂R₂ = 0</text>
  <text x="426" y="212" text-anchor="start" class="uphy-9-kirchhoff-b">고리 2 (a → 오른쪽 가지 → b → 가운데 → a)</text>
  <text x="426" y="234" text-anchor="start" class="uphy-9-kirchhoff-t">+I₃R₃ − ε₂ + I₂R₂ = 0</text>
  <text x="426" y="262" text-anchor="start" class="uphy-9-kirchhoff-b">결과</text>
  <text x="426" y="284" text-anchor="start" class="uphy-9-kirchhoff-t">I₁ = 2.31 A,  I₂ = 1.85 A,  I₃ = −0.46 A</text>
  <text x="426" y="306" text-anchor="start" class="uphy-9-kirchhoff-s">I₃ < 0: 실제로는 아래로 흘러 ε₂를 충전한다</text>
</svg>
