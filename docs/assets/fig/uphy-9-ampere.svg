<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uphy-9-ampere d-uphy-9-ampere">
  <title id="t-uphy-9-ampere">그림 일반물리학 9-3 앙페르 고리: 굵은 도선과 솔레노이드</title>
  <desc id="d-uphy-9-ampere">(가) 전류가 종이 면에서 나오는 굵은 도선(반지름 R)의 단면. 같은 축의 원형 앙페르 고리 위에서 B는 접선 방향으로 크기가 일정하다. 고리가 둘러싼 전류가 안에서는 r²에 비례하므로 B는 r에 비례하고, 바깥에서는 1/r로 준다. (나) 긴 솔레노이드의 단면. 위쪽 도선은 전류가 나오고(⊙) 아래쪽은 들어간다(⊗). 한 변이 내부에 있는 직사각형 고리에서 내부 변만 기여하여 B = μ₀nI가 된다. 모식도이다.</desc>
