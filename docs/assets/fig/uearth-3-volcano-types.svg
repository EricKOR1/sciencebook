    .uearth-3-volcano-types-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .uearth-3-volcano-types-s{font-size:13px;fill:var(--fig-muted)}
    .uearth-3-volcano-types-n{font-size:13px;fill:var(--fig-ink)}
    .uearth-3-volcano-types-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
    .uearth-3-volcano-types-cap{font-size:13px;fill:var(--fig-muted)}
  </style>
