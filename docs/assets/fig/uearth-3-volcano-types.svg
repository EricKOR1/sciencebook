<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" aria-labelledby="t-uearth-3-volcano-types d-uearth-3-volcano-types">
  <title id="t-uearth-3-volcano-types">그림 일반지구과학 3-6 화산체의 종류와 칼데라의 형성</title>
  <desc id="d-uearth-3-volcano-types">(가) 순상 화산: 점성이 작은 현무암질 용암이 얇게 여러 번 흘러 경사 수 °의 넓은 방패 모양을 이룬다. (나) 성층 화산: 용암류와 화산 쇄설물이 번갈아 쌓인 가파른 원뿔. (다) 분석구: 한 번의 분화 기간에 스코리아가 쌓인 작은 원뿔. (라) 용암 돔: 점성이 큰 용암이 화구 위에 쌓인 가파른 돔. (마) 칼데라: 큰 분화로 마그마 방이 비면 꼭대기가 무너져 넓은 함몰지가 생기고 물이 고이기도 한다. 크기는 서로 다르며 각 그림의 축척 막대를 보라(높이는 과장).</desc>
  <style>
    .uearth-3-volcano-types-h{font-size:15px;font-weight:600;fill:var(--fig-ink)}
