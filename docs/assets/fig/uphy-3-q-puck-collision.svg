<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t-uphy-3-q-puck-collision d-uphy-3-q-puck-collision">
  <title id="t-uphy-3-q-puck-collision">그림 일반물리학 3-15 문제 17 해설: 에어 테이블 퍽의 충돌과 운동량 벡터</title>
  <desc id="d-uphy-3-q-puck-collision">왼쪽: 0.200 kg 퍽 A가 동쪽으로 3.00 m/s로 와서 정지한 0.300 kg 퍽 B와 충돌한 뒤, A는 북동 60.0° 방향으로 1.50 m/s, B는 동쪽에서 남쪽으로 30.0° 방향으로 1.73 m/s로 움직인다(속도 화살표는 크기에 비례). 오른쪽: 운동량 0.600 = 0.300(A) + 0.520(B) kg·m/s의 벡터 삼각형으로, 두 퍽은 직각으로 갈라지지만 운동 에너지는 0.900 J에서 0.675 J로 줄었다.</desc>
  <rect x="10.0" y="10.0" width="345.0" height="300.0" rx="10" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <text x="24.0" y="34.0" style="font-size:15px;fill:var(--fig-ink);font-weight:600">속도 (1 m/s = 40 px)</text>
  <rect x="365.0" y="10.0" width="345.0" height="300.0" rx="10" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <text x="379.0" y="34.0" style="font-size:15px;fill:var(--fig-ink);font-weight:600">운동량 벡터 삼각형</text>
  <line x1="70.0" y1="170.0" x2="165.7" y2="170.0" style="stroke:var(--fig-blue);stroke-width:2.4;fill:none"/>
  <path d="M176.0 170.0 L165.2 174.9 L165.2 165.1 Z" style="fill:var(--fig-blue);stroke:none"/>
  <text x="70.0" y="160.0" style="font-size:13px;fill:var(--fig-blue);font-weight:600">A 3.00 m/s</text>
  <circle cx="190.0" cy="170.0" r="12.0" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
  <text x="190.0" y="200.0" text-anchor="middle" style="font-size:12px;fill:var(--fig-red)">B (정지)</text>
  <line x1="190.0" y1="170.0" x2="214.8" y2="127.0" style="stroke:var(--fig-blue);stroke-width:2.4;fill:none;stroke-dasharray:5 3"/>
  <path d="M220.0 118.0 L218.8 129.8 L210.4 125.0 Z" style="fill:var(--fig-blue);stroke:none"/>
  <line x1="190.0" y1="170.0" x2="241.1" y2="199.5" style="stroke:var(--fig-red);stroke-width:2.4;fill:none;stroke-dasharray:5 3"/>
  <path d="M250.0 204.6 L238.2 203.4 L243.1 195.0 Z" style="fill:var(--fig-red);stroke:none"/>
  <text x="226.0" y="114.0" style="font-size:13px;fill:var(--fig-blue);font-weight:600">A' 1.50 m/s</text>
  <text x="256.0" y="218.6" style="font-size:13px;fill:var(--fig-red);font-weight:600">B' 1.73 m/s</text>
  <line x1="190.0" y1="170.0" x2="310.0" y2="170.0" style="stroke:var(--fig-muted);stroke-width:1;fill:none;stroke-dasharray:3 3"/>
  <path d="M220.0 170.0 A30.0 30.0 0 0 0 205.0 144.0" style="fill:none;stroke:var(--fig-blue);stroke-width:1.3"/>
  <path d="M222.9 189.0 A38.0 38.0 0 0 0 228.0 170.0" style="fill:none;stroke:var(--fig-red);stroke-width:1.3"/>
  <text x="224.0" y="152.0" style="font-size:12px;fill:var(--fig-blue)">60.0°</text>
  <text x="236.0" y="186.0" style="font-size:12px;fill:var(--fig-red)">30.0°</text>
  <text x="26.0" y="270.0" style="font-size:12px;fill:var(--fig-muted)">동쪽 →, 북쪽 ↑</text>
  <line x1="395.0" y1="240.0" x2="653.9" y2="240.0" style="stroke:var(--fig-ink);stroke-width:2.8;fill:none"/>
  <path d="M665.0 240.0 L653.4 245.2 L653.4 234.8 Z" style="fill:var(--fig-ink);stroke:none"/>
  <line x1="395.0" y1="240.0" x2="456.9" y2="132.7" style="stroke:var(--fig-blue);stroke-width:2.8;fill:none"/>
  <path d="M462.5 123.1 L461.2 135.7 L452.2 130.5 Z" style="fill:var(--fig-blue);stroke:none"/>
  <line x1="462.5" y1="123.1" x2="655.4" y2="234.4" style="stroke:var(--fig-red);stroke-width:2.8;fill:none"/>
  <path d="M665.0 240.0 L652.3 238.7 L657.6 229.7 Z" style="fill:var(--fig-red);stroke:none"/>
  <path d="M457.5 131.7 L466.2 136.7 L471.2 128.1" style="fill:none;stroke:var(--fig-ink);stroke-width:1.2"/>
  <text x="530.0" y="262.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-ink);font-weight:600">p<tspan dy="4" style="font-size:11px">A</tspan><tspan dy="-4">​</tspan> = 0.600 kg·m/s</text>
  <text x="420.8" y="181.5" text-anchor="end" style="font-size:13px;fill:var(--fig-blue);font-weight:600">p<tspan dy="4" style="font-size:11px">A'</tspan><tspan dy="-4">​</tspan> 0.300</text>
  <text x="571.8" y="171.5" style="font-size:13px;fill:var(--fig-red);font-weight:600">p<tspan dy="4" style="font-size:11px">B'</tspan><tspan dy="-4">​</tspan> 0.520</text>
  <text x="381.0" y="280.0" style="font-size:12px;fill:var(--fig-ink)">운동 에너지 0.900 J → 0.675 J (25 % 감소)</text>
</svg>
