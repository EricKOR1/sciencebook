  <title id="t-ochem-4-sn2-steric">그림 유기화학 4-8 기질의 입체 장애와 SN2 뒤쪽 공격</title>
  <desc id="d-ochem-4-sn2-steric">브로모메테인, 브로모에테인, 2-브로모프로페인, 2-브로모-2-메틸프로페인, 1-브로모-2,2-다이메틸프로페인(네오펜틸 브로마이드)의 공간 채움 모형을 같은 축척으로 그렸다. 모두 C–Br 축을 가로로 놓고 Br(분홍)을 오른쪽에 두었으며, 왼쪽에서 친핵체가 다가오는 화살표의 색은 뒤쪽 길이 열린 정도(초록 열림 → 노랑 → 빨강 막힘)이다. 네오펜틸에서는 β 탄소의 메틸기가 뒤쪽 길을 가린다. 아래 숫자는 SN2 상대 속도(약)이다.</desc>
