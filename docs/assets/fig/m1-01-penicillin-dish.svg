<title id="t-m1-01-penicillin-dish">그림 중1-1-5 플레밍이 관찰한 세균 배양 접시</title>
<desc id="d-m1-01-penicillin-dish">세균을 기르던 접시에 푸른곰팡이가 자랐는데, 곰팡이 둘레에는 세균 무리가 자라지 않은 투명한 부분이 생겼다. 플레밍은 이 관찰에서 가설을 세우고 실험하여 페니실린을 발견하였다. 모식도.</desc>
