<title id="t-uearth-5-q-kpg-profile">그림 일반지구과학 5-11 문제 14의 이리듐 농도와 양치식물 포자 비율</title>
<desc id="d-uearth-5-q-kpg-profile">표의 값을 위치 순서대로 나타낸 것이다. 왼쪽은 이리듐 농도(ppb), 오른쪽은 꽃가루·포자 가운데 양치식물 포자의 비율(%)이고, 색칠한 띠는 두께 1 cm의 경계 점토층이다. 세로 간격은 실제 두께에 비례하지 않는다.</desc>
