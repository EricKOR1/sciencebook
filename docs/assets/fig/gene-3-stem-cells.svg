    .gene-3-stem-cells-dash{fill:none;stroke:var(--fig-line);stroke-width:1.5;stroke-dasharray:5 4}
    .gene-3-stem-cells-ink{fill:var(--fig-ink)}
    .gene-3-stem-cells-paper{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}
    .gene-3-stem-cells-gray{fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1.5}
    .gene-3-stem-cells-b-blue{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2}
    .gene-3-stem-cells-f-blue{fill:var(--fig-blue)}
    .gene-3-stem-cells-s-blue{fill:none;stroke:var(--fig-blue);stroke-width:2.5}
    .gene-3-stem-cells-t-blue{fill:var(--fig-blue)}
    .gene-3-stem-cells-b-red{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2}
    .gene-3-stem-cells-f-red{fill:var(--fig-red)}
