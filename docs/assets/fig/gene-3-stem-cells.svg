<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-gene-3-stem-cells d-gene-3-stem-cells">
  <title id="t-gene-3-stem-cells">그림 생물의 유전 3-5 세 가지 줄기세포를 얻는 곳과 분화 능력</title>
  <desc id="d-gene-3-stem-cells">배아 줄기세포는 착상 전 배아(배반포)의 안쪽 세포 덩어리에서 얻고 다능성이 있다. 성체 줄기세포(예: 골수의 조혈모세포)는 적혈구, 백혈구, 혈소판 같은 특정 계열로만 분화한다. 유도 만능 줄기세포(iPS 세포)는 피부 같은 분화한 세포에 전사 인자 유전자를 넣어 되돌린 것으로 다능성이 있다. 모식도이다.</desc>
  <style>
    .gene-3-stem-cells-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .gene-3-stem-cells-tx{font-size:14px;fill:var(--fig-ink)}
    .gene-3-stem-cells-sm{font-size:13px;fill:var(--fig-muted)}
