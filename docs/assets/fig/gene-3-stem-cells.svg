    .gene-3-stem-cells-t-red{fill:var(--fig-red)}
    .gene-3-stem-cells-b-green{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2}
    .gene-3-stem-cells-f-green{fill:var(--fig-green)}
    .gene-3-stem-cells-s-green{fill:none;stroke:var(--fig-green);stroke-width:2.5}
    .gene-3-stem-cells-t-green{fill:var(--fig-green)}
    .gene-3-stem-cells-b-amber{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2}
    .gene-3-stem-cells-f-amber{fill:var(--fig-amber)}
    .gene-3-stem-cells-s-amber{fill:none;stroke:var(--fig-amber);stroke-width:2.5}
    .gene-3-stem-cells-t-amber{fill:var(--fig-amber)}
    .gene-3-stem-cells-b-violet{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2}
    .gene-3-stem-cells-f-violet{fill:var(--fig-violet)}
    .gene-3-stem-cells-s-violet{fill:none;stroke:var(--fig-violet);stroke-width:2.5}
    .gene-3-stem-cells-t-violet{fill:var(--fig-violet)}
    .gene-3-stem-cells-b-teal{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:2}
    .gene-3-stem-cells-f-teal{fill:var(--fig-teal)}
    .gene-3-stem-cells-s-teal{fill:none;stroke:var(--fig-teal);stroke-width:2.5}
