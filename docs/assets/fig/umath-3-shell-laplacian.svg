<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-umath-3-shell-laplacian d-umath-3-shell-laplacian">
  <title id="t-umath-3-shell-laplacian">그림 수학 도구 3-7 공 껍질로 구하는 구면 좌표 라플라시안의 지름 부분</title>
  <desc id="d-umath-3-shell-laplacian">반지름 r과 r+dr 사이의 얇은 공 껍질(단면). 안쪽 구면을 지나는 ∇f = f′(r) r̂ 의 선속은 Φ(r) = 4πr² f′(r), 바깥 구면으로는 Φ(r+dr)가 나간다. 알짜 유출 (dΦ/dr)dr을 껍질 부피 4πr² dr로 나누면 ∇²f = (1/r²) d/dr (r² df/dr)이다.</desc>
  <style>.umath-3-shell-laplacian-t{font-size:14px;fill:var(--fig-ink)} .umath-3-shell-laplacian-s{font-size:13px;fill:var(--fig-muted)} .umath-3-shell-laplacian-b{font-size:14px;font-weight:700;fill:var(--fig-ink)} .umath-3-shell-laplacian-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .umath-3-shell-laplacian-bl{font-size:14px;fill:var(--fig-blue)} .umath-3-shell-laplacian-rd{font-size:14px;fill:var(--fig-red)} .umath-3-shell-laplacian-gr{font-size:14px;fill:var(--fig-green)} .umath-3-shell-laplacian-am{font-size:14px;fill:var(--fig-amber)} .umath-3-shell-laplacian-vi{font-size:14px;fill:var(--fig-violet)} .umath-3-shell-laplacian-te{font-size:14px;fill:var(--fig-teal)} .umath-3-shell-laplacian-ax{font-size:13px;fill:var(--fig-ink)}</style>
