  <text x="185" y="169" text-anchor="middle" class="umath-3-shell-laplacian-s">O</text>
  <text x="395" y="56" class="umath-3-shell-laplacian-t"><tspan>∇</tspan><tspan style="font-style:italic">f</tspan><tspan> = </tspan><tspan style="font-style:italic">f</tspan><tspan>′(</tspan><tspan style="font-style:italic">r</tspan><tspan>) </tspan><tspan style="font-weight:700;font-style:italic">r̂</tspan><tspan>  (지름 방향)</tspan></text>
  <text x="395" y="90" class="umath-3-shell-laplacian-bl"><tspan>안쪽 구면을 지나는 선속  Φ(</tspan><tspan style="font-style:italic">r</tspan><tspan>) = 4π</tspan><tspan style="font-style:italic">r</tspan><tspan dy="-6" style="font-size:78%">2</tspan><tspan dy="6"> </tspan><tspan style="font-style:italic">f</tspan><tspan>′(</tspan><tspan style="font-style:italic">r</tspan><tspan>)</tspan></text>
  <text x="395" y="116" class="umath-3-shell-laplacian-rd"><tspan>바깥 구면을 지나는 선속  Φ(</tspan><tspan style="font-style:italic">r</tspan><tspan> + </tspan><tspan style="font-style:italic">dr</tspan><tspan>)</tspan></text>
  <text x="395" y="142" class="umath-3-shell-laplacian-am"><tspan>껍질 부피  4π</tspan><tspan style="font-style:italic">r</tspan><tspan dy="-6" style="font-size:78%">2</tspan><tspan dy="6"> </tspan><tspan style="font-style:italic">dr</tspan><tspan>  (색칠한 부분)</tspan></text>
  <text x="395" y="178" class="umath-3-shell-laplacian-t"><tspan>알짜 유출 = Φ(</tspan><tspan style="font-style:italic">r</tspan><tspan>+</tspan><tspan style="font-style:italic">dr</tspan><tspan>) − Φ(</tspan><tspan style="font-style:italic">r</tspan><tspan>) = </tspan><tspan>d</tspan><tspan>Φ</tspan><tspan>/</tspan><tspan style="font-style:italic">dr</tspan><tspan> · </tspan><tspan style="font-style:italic">dr</tspan></text>
  <text x="395" y="212" class="umath-3-shell-laplacian-s">발산 = 알짜 유출 ÷ 부피</text>
  <rect x="387" y="230" width="318" height="46" rx="6" style="fill:var(--fig-paper);stroke:var(--fig-accent);stroke-width:1.5"/>
  <text x="546" y="260" text-anchor="middle" class="umath-3-shell-laplacian-h"><tspan>∇</tspan><tspan dy="-6" style="font-size:78%">2</tspan><tspan dy="6" style="font-style:italic">f</tspan><tspan> = </tspan><tspan>1/</tspan><tspan style="font-style:italic">r</tspan><tspan dy="-6" style="font-size:78%">2</tspan><tspan dy="6"> · </tspan><tspan>d</tspan><tspan>/</tspan><tspan style="font-style:italic">dr</tspan><tspan> (</tspan><tspan style="font-style:italic">r</tspan><tspan dy="-6" style="font-size:78%">2</tspan><tspan dy="6"> </tspan><tspan style="font-style:italic">df</tspan><tspan>/</tspan><tspan style="font-style:italic">dr</tspan><tspan>)</tspan></text>
  <text x="395" y="304" class="umath-3-shell-laplacian-s"><tspan style="font-style:italic">r</tspan><tspan dy="-6" style="font-size:78%">2</tspan><tspan dy="6">이 끼어드는 까닭: 껍질의 넓이가 </tspan><tspan style="font-style:italic">r</tspan><tspan dy="-6" style="font-size:78%">2</tspan><tspan dy="6">에 비례해 커진다</tspan></text>
  <text x="395" y="326" class="umath-3-shell-laplacian-s">(단면 모식도, 두께 dr은 크게 그렸다)</text>
