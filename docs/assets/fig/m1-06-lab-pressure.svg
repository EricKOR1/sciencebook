<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-m1-06-lab-pressure d-m1-06-lab-pressure">
  <title id="t-m1-06-lab-pressure">그림 중1-6-6 압력과 부피 관계 실험 장치</title>
  <desc id="d-m1-06-lab-pressure">왼쪽: 공기 60 mL를 넣은 주사기를 압력 센서에 연결하고, 피스톤을 눌러 부피를 줄이며 압력을 기록한다. 오른쪽: 센서가 없으면 입구를 막은 주사기를 세우고 피스톤 위에 같은 책을 1권, 3권 올리며 부피를 읽는다. 모식도이다.</desc>
  <style>
    .lp-red{fill:none;stroke:var(--fig-red)} .lp-redh{fill:var(--fig-red)}
    .lp-blue{fill:none;stroke:var(--fig-blue)} .lp-blueh{fill:var(--fig-blue)}
    .lp-green{fill:none;stroke:var(--fig-green)} .lp-greenh{fill:var(--fig-green)}
