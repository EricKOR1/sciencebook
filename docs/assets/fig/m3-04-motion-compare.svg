  <title id="t-m3-04-motion-compare">그림 중3-4-2 세 가지 운동의 기록과 그래프 비교</title>
  <desc id="d-m3-04-motion-compare">같은 시간 간격(1초)으로 찍은 다중 섬광 기록과 시간–이동 거리, 시간–속력 그래프를 등속 운동, 속력이 일정하게 증가하는 운동, 속력이 일정하게 감소하는 운동끼리 나란히 비교한 모식도이다. 간격이 같으면 그래프는 직선과 수평선, 간격이 넓어지면 가팔라지는 곡선과 올라가는 직선, 간격이 좁아지면 완만해지는 곡선과 내려가는 직선이 된다.</desc>
