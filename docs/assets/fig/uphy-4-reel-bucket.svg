<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-uphy-4-reel-bucket d-uphy-4-reel-bucket">
  <title id="t-uphy-4-reel-bucket">그림 일반물리학 4-6 감개와 두레박 — 물체마다 따로 그린 힘</title>
  <desc id="d-uphy-4-reel-bucket">왼쪽: 축이 고정된 원기둥 감개(질량 M, 반지름 R)에 감긴 줄 끝에 두레박(질량 m)이 매달려 있다. 가운데: 감개에는 둘레에서 줄의 장력 T가 지레팔 R로 토크를 작용하고, 축의 받침힘과 감개의 무게는 축에 작용하므로 토크가 0이다. 오른쪽: 두레박에는 위로 T, 아래로 mg가 작용한다. 줄이 미끄러지지 않으므로 a = Rα이다.</desc>
  <style>
    .uphy4reelbucket-t{font-size:14px;fill:var(--fig-ink)} .uphy4reelbucket-s{font-size:13px;fill:var(--fig-muted)}
    .uphy4reelbucket-b{font-size:15px;fill:var(--fig-ink);font-weight:600} .uphy4reelbucket-i{font-size:15px;fill:var(--fig-ink);font-style:italic}
  </style>
