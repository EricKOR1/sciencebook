  <path d="M460.6 105.0 L451.7 98.6 L459.5 94.1 Z" style="fill:var(--fig-violet);stroke:none"/>
  <text x="452.0" y="78.0" class="uphy4reelbucket-i" style="fill:var(--fig-violet);font-weight:600">α</text>
  <line x1="400.0" y1="140.0" x2="452.0" y2="140.0" style="fill:none;stroke:var(--fig-ink);stroke-width:1.2;stroke-linecap:round;stroke-dasharray:3 3"/>
  <text x="426.0" y="132.0" text-anchor="middle" class="uphy4reelbucket-i">R</text>
  <text x="400.0" y="272.0" text-anchor="middle" class="uphy4reelbucket-t">감개: TR = Iα</text>
  <text x="400.0" y="294.0" text-anchor="middle" class="uphy4reelbucket-s">(축에 작용하는 힘은 토크 0)</text>
  <line x1="530.0" y1="30.0" x2="530.0" y2="340.0" style="fill:none;stroke:var(--fig-line);stroke-width:1;stroke-linecap:round;stroke-dasharray:3 5"/>
