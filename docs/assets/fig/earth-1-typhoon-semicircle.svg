<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-earth-1-typhoon-semicircle d-earth-1-typhoon-semicircle">
  <title id="t-earth-1-typhoon-semicircle">그림 지구과학 1-10 태풍의 위험 반원과 안전 반원</title>
  <desc id="d-earth-1-typhoon-semicircle">북쪽으로 움직이는 북반구 태풍에서 시계 반대 방향의 회전 바람과 이동 방향이 같은 오른쪽(동쪽) 반원은 바람이 더 강한 위험 반원이고, 왼쪽 반원은 상대적으로 약한 안전 반원이다. 오른쪽에 있는 관측소의 풍향은 시계 방향으로, 왼쪽 관측소는 시계 반대 방향으로 바뀐다.</desc>
  <style>
    .earth-1-typhoon-semicircle-t{font-size:14px;fill:var(--fig-ink)}
    .earth-1-typhoon-semicircle-b{font-size:15px;font-weight:600}
    .earth-1-typhoon-semicircle-s{font-size:13px;fill:var(--fig-muted)}
  </style>
  <!-- 반원 -->
  <path d="M200 70 A130 130 0 0 1 200 330 Z" style="fill:var(--fig-soft-red);stroke:none"/>
  <path d="M200 70 A130 130 0 0 0 200 330 Z" style="fill:var(--fig-soft-blue);stroke:none"/>
  <circle cx="200" cy="200" r="130" style="fill:none;stroke:var(--fig-line);stroke-width:1.5"/>
  <line x1="200" y1="56" x2="200" y2="344" style="stroke:var(--fig-line);stroke-width:1.2;stroke-dasharray:5 5"/>
  <!-- 진행 방향 -->
  <line x1="200" y1="62" x2="200" y2="24" style="stroke:var(--fig-ink);stroke-width:3"/>
  <path d="M200 12 l-8 14 l16 0 z" style="fill:var(--fig-ink)"/>
  <text x="212" y="28" class="earth-1-typhoon-semicircle-t">진행 방향(북쪽)</text>
  <!-- 회전 바람(시계 반대 방향) -->
  <g style="fill:none;stroke:var(--fig-muted);stroke-width:2">
    <path d="M262 150 A80 80 0 0 0 150 138"/><path d="M138 250 A80 80 0 0 0 250 262"/>
  </g>
  <path d="M142 144 l12 -12 l2 12 z" style="fill:var(--fig-muted)"/>
  <path d="M258 256 l-12 12 l-2 -12 z" style="fill:var(--fig-muted)"/>
  <!-- 눈 -->
  <circle cx="200" cy="200" r="13" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2"/>
  <text x="200" y="232" text-anchor="middle" class="earth-1-typhoon-semicircle-s">태풍의 눈</text>
  <!-- 동쪽: 더해짐 -->
  <line x1="300" y1="250" x2="300" y2="200" style="stroke:var(--fig-violet);stroke-width:3"/>
  <path d="M300 190 l-6 12 l12 0 z" style="fill:var(--fig-violet)"/>
  <line x1="300" y1="190" x2="300" y2="150" style="stroke:var(--fig-ink);stroke-width:3"/>
  <path d="M300 140 l-6 12 l12 0 z" style="fill:var(--fig-ink)"/>
  <!-- 서쪽: 상쇄 -->
  <line x1="100" y1="160" x2="100" y2="232" style="stroke:var(--fig-violet);stroke-width:3"/>
  <path d="M100 242 l-6 -12 l12 0 z" style="fill:var(--fig-violet)"/>
  <line x1="92" y1="232" x2="92" y2="200" style="stroke:var(--fig-ink);stroke-width:3"/>
  <path d="M92 190 l-6 12 l12 0 z" style="fill:var(--fig-ink)"/>
  <text x="262" y="300" text-anchor="middle" class="earth-1-typhoon-semicircle-b" style="fill:var(--fig-red)">위험 반원</text>
  <text x="138" y="300" text-anchor="middle" class="earth-1-typhoon-semicircle-b" style="fill:var(--fig-blue)">안전 반원</text>
  <text x="200" y="364" text-anchor="middle" class="earth-1-typhoon-semicircle-s">보라: 회전 바람  검정: 태풍의 이동</text>
  <text x="200" y="384" text-anchor="middle" class="earth-1-typhoon-semicircle-s">오른쪽은 두 방향이 같아 더해지고, 왼쪽은 반대라 약해진다</text>
  <!-- 오른쪽: 관측소 풍향 변화 -->
  <text x="372" y="66" class="earth-1-typhoon-semicircle-t" style="font-weight:600">관측소의 풍향 변화 (태풍이 남→북으로 지날 때)</text>
  <text x="372" y="104" class="earth-1-typhoon-semicircle-t" style="fill:var(--fig-red)">진로의 오른쪽(위험 반원): 시계 방향</text>
  <text x="372" y="244" class="earth-1-typhoon-semicircle-t" style="fill:var(--fig-blue)">진로의 왼쪽(안전 반원): 시계 반대 방향</text>
  <g style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2">
    <circle cx="410" cy="160" r="26"/><circle cx="490" cy="160" r="26"/><circle cx="570" cy="160" r="26"/><circle cx="650" cy="160" r="26"/>
    <circle cx="410" cy="300" r="26"/><circle cx="490" cy="300" r="26"/><circle cx="570" cy="300" r="26"/><circle cx="650" cy="300" r="26"/>
  </g>
  <!-- 바람 화살표: 불어 가는 방향 -->
  <g style="stroke:var(--fig-violet);stroke-width:2.5">
    <line x1="426" y1="160" x2="400" y2="160"/><line x1="501" y1="171" x2="483" y2="153"/><line x1="570" y1="176" x2="570" y2="150"/><line x1="639" y1="171" x2="657" y2="153"/>
    <line x1="426" y1="300" x2="400" y2="300"/><line x1="501" y1="289" x2="483" y2="307"/><line x1="570" y1="284" x2="570" y2="310"/><line x1="639" y1="289" x2="657" y2="307"/>
  </g>
  <g style="fill:var(--fig-violet)">
    <path d="M394 160 l10 -6 l0 12 z"/><path d="M479 149 l11 2 l-9 9 z"/><path d="M570 144 l-6 10 l12 0 z"/><path d="M661 149 l-2 11 l-9 -9 z"/>
    <path d="M394 300 l10 -6 l0 12 z"/><path d="M479 311 l2 -11 l9 9 z"/><path d="M570 316 l-6 -10 l12 0 z"/><path d="M661 311 l-11 -2 l9 -9 z"/>
  </g>
  <g class="earth-1-typhoon-semicircle-t" text-anchor="middle">
    <text x="410" y="206">동풍</text><text x="490" y="206">남동풍</text><text x="570" y="206">남풍</text><text x="650" y="206">남서풍</text>
    <text x="410" y="346">동풍</text><text x="490" y="346">북동풍</text><text x="570" y="346">북풍</text><text x="650" y="346">북서풍</text>
  </g>
  <g class="earth-1-typhoon-semicircle-s" text-anchor="middle">
    <text x="450" y="124">→</text><text x="530" y="124">→</text><text x="610" y="124">→</text>
    <text x="450" y="264">→</text><text x="530" y="264">→</text><text x="610" y="264">→</text>
  </g>
  <text x="530" y="384" text-anchor="middle" class="earth-1-typhoon-semicircle-s">화살표: 바람이 불어 가는 방향(위가 북쪽), 시간 순서 →</text>
</svg>
