  <text x="365.0" y="334.0" text-anchor="middle" class="cell-2-activation-energy-s">효소는 언덕을 낮출 뿐, 출발점(반응물)과 도착점(생성물)의 높이는 바꾸지 않는다. 모식도.</text>
