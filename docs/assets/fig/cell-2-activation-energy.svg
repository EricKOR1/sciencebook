<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" role="img" aria-labelledby="t-cell-2-activation-energy d-cell-2-activation-energy">
  <title id="t-cell-2-activation-energy">그림 세포와 물질대사 2-4 효소는 활성화 에너지를 낮춘다</title>
  <desc id="d-cell-2-activation-energy">효소가 없을 때(빨간 점선)보다 효소가 있을 때(파란 실선) 넘어야 할 언덕의 높이, 즉 활성화 에너지가 낮다. 반응물과 생성물의 에너지는 효소와 관계없이 같으므로 반응열도 변하지 않는다. 발열 반응의 예, 모식도.</desc>
