<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 314" role="img" aria-labelledby="t-5-6-bulb-led d-5-6-bulb-led">
  <title id="t-5-6-bulb-led">그림 5-6-1 백열전구와 LED 전등의 에너지 효율 비교</title>
  <desc id="d-5-6-bulb-led">같은 밝기(1초에 빛에너지 3 J)를 낼 때 백열전구는 1초에 전기 에너지 60 J을 공급받아 57 J을 열로 내보내므로 효율이 5%이고, LED 전등은 10 J을 공급받아 7 J만 열로 내보내므로 효율이 30%이다. 두 경우 모두 공급한 에너지는 빛과 열의 합과 같다. 예제 3의 가정에 따른 값이다.</desc>
  <style>
    .bl-lbl{font-size:15px;font-weight:700;fill:var(--fig-ink)} .bl-sm{font-size:13px;fill:var(--fig-muted)} .bl-ink{font-size:13px;fill:var(--fig-ink)}
    .bl-in{font-size:13px;font-weight:700;fill:var(--fig-ink)}
    .bl-light{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5}
    .bl-heat{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5}
    .bl-ptr{stroke:var(--fig-ink);stroke-width:1}
  </style>
  <text x="20" y="26" class="bl-lbl">같은 밝기, 1초 동안의 에너지</text>
  <text x="20" y="46" class="bl-sm">막대 길이 = 1초 동안 공급한 전기 에너지(J)</text>
  <text x="20" y="92" class="bl-lbl">백열전구</text><text x="20" y="110" class="bl-sm">60 W</text>
  <rect x="120.0" y="70" width="27.0" height="46" class="bl-light"/>
  <rect x="147.0" y="70" width="513.0" height="46" class="bl-heat"/>
  <text x="403.5" y="98.0" text-anchor="middle" class="bl-in">열에너지 57 J</text>
  <line x1="134" y1="70" x2="160" y2="58" class="bl-ptr"/><text x="164" y="60" class="bl-ink">빛에너지 3 J</text>
  <text x="666" y="98" class="bl-ink" style="font-weight:700">60 J</text>
  <text x="120" y="136" class="bl-ink">효율 = 3 ÷ 60 × 100 = <tspan style="font-weight:700;fill:var(--fig-red)">5%</tspan></text>
  <text x="20" y="192" class="bl-lbl">LED 전등</text><text x="20" y="210" class="bl-sm">10 W</text>
  <rect x="120.0" y="170" width="27.0" height="46" class="bl-light"/>
  <rect x="147.0" y="170" width="63.0" height="46" class="bl-heat"/>
  <line x1="180" y1="216" x2="197" y2="230" class="bl-ptr"/><text x="201" y="236" class="bl-ink">열에너지 7 J</text>
  <line x1="134" y1="170" x2="160" y2="158" class="bl-ptr"/><text x="164" y="160" class="bl-ink">빛에너지 3 J</text>
  <text x="216" y="198" class="bl-ink" style="font-weight:700">10 J</text>
  <text x="290" y="198" class="bl-ink">효율 = 3 ÷ 10 × 100 = <tspan style="font-weight:700;fill:var(--fig-green)">30%</tspan></text>
  <rect x="120" y="258" width="16" height="14" class="bl-light"/><text x="142" y="270" class="bl-ink">유용한 에너지(빛)</text>
  <rect x="290" y="258" width="16" height="14" class="bl-heat"/><text x="312" y="270" class="bl-ink">버려지는 에너지(주로 열)</text>
  <text x="20" y="300" class="bl-ink">두 전등 모두 공급한 에너지 = 빛 + 열 (에너지 보존). 같은 빛을 내는 데 LED는 전기를 6분의 1만 쓴다.</text>
</svg>
