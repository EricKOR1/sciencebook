<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-emq-3-polarization-superposition d-emq-3-polarization-superposition">
  <title id="t-emq-3-polarization-superposition">그림 전자기와 양자 3-3 45° 편광 광자 하나의 측정 — 확률적 결과와 상태 변화</title>
  <desc id="d-emq-3-polarization-superposition">45° 편광 광자 하나를 세로 편광판에 보내면 광자는 쪼개지지 않고 통과하거나 막히거나 둘 중 하나이며, 확률은 각각 50%이다. 통과한 광자는 세로 편광 상태로 바뀌므로 다음 세로 편광판은 100% 통과하고, 45° 편광판은 다시 50% 확률로 통과한다.</desc>
