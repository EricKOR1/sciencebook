  <text x="92.0" y="204.0" text-anchor="end" class="pchem-9-na-d-lines-tk">9 000</text>
  <line x1="95.0" y1="145.9" x2="100.0" y2="145.9" style="stroke:var(--fig-muted);stroke-width:1.2"/>
  <text x="92.0" y="150.4" text-anchor="end" class="pchem-9-na-d-lines-tk">12 000</text>
  <line x1="95.0" y1="92.4" x2="100.0" y2="92.4" style="stroke:var(--fig-muted);stroke-width:1.2"/>
