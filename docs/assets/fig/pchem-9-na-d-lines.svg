  <text x="392.0" y="217.3" text-anchor="end" class="pchem-9-na-d-lines-redb">D<tspan baseline-shift="sub" style="font-size:75%">2</tspan></text>
  <text x="392.0" y="235.3" text-anchor="end" class="pchem-9-na-d-lines-red">589.0 nm</text>
