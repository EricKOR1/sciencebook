  <path d="M400.0 357.0 L395.0 347.0 L405.0 347.0 Z" style="fill:var(--fig-red);stroke:none"/>
  <line x1="470.0" y1="112.6" x2="470.0" y2="347.0" style="stroke:var(--fig-amber);stroke-width:2.4"/>
