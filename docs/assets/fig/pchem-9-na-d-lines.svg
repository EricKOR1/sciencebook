  <path d="M338.0 108.6 L335.0 102.6 L341.0 102.6 Z" style="fill:var(--fig-ink);stroke:none"/>
  <text x="300.0" y="147.2" text-anchor="middle" class="pchem-9-na-d-lines-b">17.2 cm<tspan baseline-shift="super" style="font-size:75%">−1</tspan> = (3/2)A</text>
  <text x="300.0" y="165.2" text-anchor="middle" class="pchem-9-na-d-lines-sm">(갈라짐 부분 확대)</text>
