  <text x="528.0" y="63.0" class="pchem-9-na-d-lines-redb">²P<tspan baseline-shift="sub" style="font-size:75%">3/2</tspan> 16 978 cm<tspan baseline-shift="super" style="font-size:75%">−1</tspan> (+A/2)</text>
  <text x="528.0" y="114.6" class="pchem-9-na-d-lines-amberb">²P<tspan baseline-shift="sub" style="font-size:75%">1/2</tspan> 16 961 cm<tspan baseline-shift="super" style="font-size:75%">−1</tspan> (−A)</text>
