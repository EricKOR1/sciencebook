<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-pchem-9-na-d-lines d-pchem-9-na-d-lines">
  <title id="t-pchem-9-na-d-lines">그림 물리화학 9-6 나트륨의 3s·3p 준위와 D선</title>
  <desc id="d-pchem-9-na-d-lines">3s ²S₁/₂를 0으로 둔 파수 눈금. 스핀–궤도 결합이 없으면 하나인 3p 준위(점선, 무게 중심 16 972 cm⁻¹)가 ²P₃/₂(16 978 cm⁻¹, +A/2)와 ²P₁/₂(16 961 cm⁻¹, −A)로 갈라진다. 갈라짐 17.2 cm⁻¹ = (3/2)A는 확대해 그렸으며, 무게 중심은 ²P₃/₂ 쪽에서 1/3 지점에 있다. ²P₃/₂ → ²S₁/₂가 D₂(589.0 nm), ²P₁/₂ → ²S₁/₂가 D₁(589.6 nm)이다.</desc>
