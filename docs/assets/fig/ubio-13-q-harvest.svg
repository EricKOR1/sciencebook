<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-ubio-13-q-harvest d-ubio-13-q-harvest">
  <title id="t-ubio-13-q-harvest">그림 일반생명과학 13-13 문제 16 해설 — 개체군 증가량과 일정 어획량</title>
  <desc id="d-ubio-13-q-harvest">곡선은 로지스트 개체군의 연간 증가량 0.40N(1 − N/10000)이고, 수평선은 일정 어획량 H = 840톤/년이다. 곡선이 수평선보다 위이면 개체군이 늘고 아래이면 준다. 두 교점 3000톤과 7000톤이 평형이며, 화살표가 보이듯 7000톤은 안정, 3000톤은 불안정하다. 2500톤에서는 증가량(750톤)이 어획량보다 작다.</desc>
