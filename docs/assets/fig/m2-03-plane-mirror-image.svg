<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-m2-03-plane-mirror-image d-m2-03-plane-mirror-image">
  <title id="t-m2-03-plane-mirror-image">그림 중2-3-5 평면거울에 상이 생기는 원리</title>
  <desc id="d-m2-03-plane-mirror-image">물체의 끝에서 나온 빛이 거울에서 입사각과 반사각이 같게 반사되어 눈에 들어온다. 눈은 빛이 곧게 왔다고 여기므로 반사 광선을 거울 뒤로 연장한 점선이 만나는 곳에 상이 보인다. 상은 거울 뒤, 물체와 같은 거리에 같은 크기로 생기며, 눈의 위치가 달라도 상의 위치는 같다.</desc>
  <style>
    .m2-03-pmi-t{font-size:14px;fill:var(--fig-ink)}
    .m2-03-pmi-s{font-size:13px;fill:var(--fig-muted)}
    .m2-03-pmi-b{font-size:14px;font-weight:600}
    .m2-03-pmi-ray{fill:none;stroke:var(--fig-red);stroke-width:2.4}
    .m2-03-pmi-ext{fill:none;stroke:var(--fig-red);stroke-width:1.6;stroke-dasharray:6 5;opacity:.8}
    .m2-03-pmi-head{fill:var(--fig-red)}
  </style>
  <rect x="0" y="0" width="720" height="440" style="fill:var(--fig-paper)"/>
  <!-- 거울 -->
  <rect x="360" y="40" width="12" height="380" style="fill:var(--fig-soft-blue)"/>
  <line x1="360" y1="40" x2="360" y2="420" style="stroke:var(--fig-blue);stroke-width:3"/>
  <g style="stroke:var(--fig-blue);stroke-width:1.2">
    <line x1="362" y1="60" x2="374" y2="48"/><line x1="362" y1="100" x2="374" y2="88"/><line x1="362" y1="140" x2="374" y2="128"/>
    <line x1="362" y1="180" x2="374" y2="168"/><line x1="362" y1="220" x2="374" y2="208"/><line x1="362" y1="260" x2="374" y2="248"/>
    <line x1="362" y1="300" x2="374" y2="288"/><line x1="362" y1="340" x2="374" y2="328"/><line x1="362" y1="380" x2="374" y2="368"/>
  </g>
  <text x="380" y="414" class="m2-03-pmi-t m2-03-pmi-b" style="fill:var(--fig-blue)">평면거울</text>

  <!-- 거리 -->
  <g style="stroke:var(--fig-muted);stroke-width:1.2">
    <line x1="200" y1="70" x2="356" y2="70"/><line x1="200" y1="64" x2="200" y2="76"/>
    <line x1="364" y1="70" x2="520" y2="70"/><line x1="520" y1="64" x2="520" y2="76"/>
  </g>
  <text x="280" y="62" text-anchor="middle" class="m2-03-pmi-s">거리 a</text>
  <text x="440" y="62" text-anchor="middle" class="m2-03-pmi-s">같은 거리 a</text>

  <!-- 물체 -->
  <line x1="200" y1="250" x2="200" y2="128" style="stroke:var(--fig-ink);stroke-width:4"/>
  <path d="M200 112 L190 132 L210 132 Z" style="fill:var(--fig-ink)"/>
  <circle cx="200" cy="120" r="4" style="fill:var(--fig-red)"/>
  <text x="200" y="272" text-anchor="middle" class="m2-03-pmi-t m2-03-pmi-b">물체</text>
  <text x="182" y="116" text-anchor="end" class="m2-03-pmi-s">점 P</text>

  <!-- 상 -->
  <line x1="520" y1="250" x2="520" y2="128" style="stroke:var(--fig-muted);stroke-width:3;stroke-dasharray:7 5"/>
  <path d="M520 112 L510 132 L530 132 Z" style="fill:none;stroke:var(--fig-muted);stroke-width:2"/>
  <circle cx="520" cy="120" r="4" style="fill:var(--fig-red)"/>
  <text x="520" y="272" text-anchor="middle" class="m2-03-pmi-t m2-03-pmi-b" style="fill:var(--fig-muted)">상</text>
  <text x="538" y="116" class="m2-03-pmi-s">점 P의 상</text>
  <text x="540" y="300" class="m2-03-pmi-s">빛이 실제로 오지는 않는다.</text>
  <text x="540" y="318" class="m2-03-pmi-s">연장선이 만나는 곳에</text>
  <text x="540" y="336" class="m2-03-pmi-s">물체가 있는 것처럼 보인다.</text>

  <!-- 광선 1: P → (360,160) → 눈 ① -->
  <polyline points="200,120 360,160 80,230" class="m2-03-pmi-ray"/>
  <path d="M285.8 141.5 L274.0 143.5 L276.4 134.1 Z" class="m2-03-pmi-head"/>
  <path d="M214.2 196.5 L223.6 189.1 L226.0 198.5 Z" class="m2-03-pmi-head"/>
  <line x1="360" y1="160" x2="520" y2="120" class="m2-03-pmi-ext"/>
  <!-- 광선 2: P → (360,215) → 눈 ② -->
  <polyline points="200,120 360,215 80,381.2" class="m2-03-pmi-ray"/>
  <path d="M285.2 170.6 L273.2 169.2 L278.2 160.8 Z" class="m2-03-pmi-head"/>
  <path d="M214.8 301.2 L221.8 291.4 L226.8 299.8 Z" class="m2-03-pmi-head"/>
  <line x1="360" y1="215" x2="520" y2="120" class="m2-03-pmi-ext"/>

  <!-- 법선과 각 (반사점 1) -->
  <line x1="280" y1="160" x2="440" y2="160" style="stroke:var(--fig-muted);stroke-width:1.2;stroke-dasharray:4 4"/>
  <text x="398" y="177" class="m2-03-pmi-s">법선</text>
  <path d="M328 152 A33 33 0 0 0 328 168" style="fill:none;stroke:var(--fig-violet);stroke-width:2.4"/>
  <line x1="384" y1="244" x2="336" y2="168" style="stroke:var(--fig-violet);stroke-width:1"/>
  <text x="386" y="258" class="m2-03-pmi-s" style="fill:var(--fig-violet)">입사각 = 반사각</text>

  <!-- 눈 -->
  <g>
    <path d="M58 230 Q80 216 102 230 Q80 244 58 230 Z" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.6"/>
    <circle cx="80" cy="230" r="6" style="fill:var(--fig-ink)"/>
    <text x="40" y="258" class="m2-03-pmi-t">눈 ①</text>
    <path d="M58 381 Q80 367 102 381 Q80 395 58 381 Z" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.6"/>
    <circle cx="80" cy="381" r="6" style="fill:var(--fig-ink)"/>
    <text x="40" y="410" class="m2-03-pmi-t">눈 ②</text>
  </g>

  <!-- 범례 -->
  <line x1="420" y1="372" x2="450" y2="372" class="m2-03-pmi-ray"/>
  <text x="458" y="377" class="m2-03-pmi-s">실제 빛의 경로</text>
  <line x1="580" y1="372" x2="610" y2="372" class="m2-03-pmi-ext"/>
  <text x="618" y="377" class="m2-03-pmi-s">반사 광선의 연장선</text>
  <text x="704" y="30" text-anchor="end" class="m2-03-pmi-s">눈의 위치가 달라도 상은 같은 곳에 보인다</text>
</svg>
