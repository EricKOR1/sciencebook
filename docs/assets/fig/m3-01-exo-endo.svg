  <title id="t-m3-01-exo-endo">그림 중3-1-5 발열 반응과 흡열 반응에서 열에너지가 이동하는 방향</title>
  <desc id="d-m3-01-exo-endo">발열 반응에서는 반응하는 물질이 열에너지를 주변으로 내보내므로 주변(용기, 손, 공기)의 온도가 올라간다. 흡열 반응에서는 반응하는 물질이 주변에서 열에너지를 가져오므로 주변의 온도가 내려간다. 화살표는 열에너지가 이동하는 방향이다(모식도).</desc>
