  <title id="t-pchem-4-q-triple-fit">그림 물리화학 4-16 문제 13의 ln p – 1/T 그래프</title>
  <desc id="d-pchem-4-q-triple-fit">고체의 두 점과 액체의 두 점을 각각 직선으로 잇고 연장하면 1/T = 1/200 K⁻¹, ln(p/Pa) = 7.00에서 만난다. 이 점이 삼중점(200 K, 약 1.10 × 10³ Pa)이다. 고체 직선의 기울기는 −ΔsubH/R = −4000 K, 액체 직선의 기울기는 −ΔvapH/R = −3200 K이다.</desc>
