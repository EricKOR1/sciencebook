<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="t-m3-03-saltwater-intrusion d-m3-03-saltwater-intrusion">
  <title id="t-m3-03-saltwater-intrusion">그림 중3-3-6 해안 지역의 지하수와 바닷물 침투</title>
  <desc id="d-m3-03-saltwater-intrusion">해안 지역의 땅속 단면이다. 지하수(담수)는 지층과 암석의 빈틈을 채우고 있으며, 바닷물은 밀도가 커서 지하수 아래쪽으로 쐐기 모양으로 들어와 있다. 지하수를 알맞게 쓰면 관정(우물)에서 담수가 나오지만, 너무 많이 뽑아 쓰면 지하수면이 낮아지고 바닷물이 육지 쪽으로 밀려 들어와 관정의 물이 짜진다. 높이와 거리의 비율은 실제와 다른 모식도이다.</desc>
