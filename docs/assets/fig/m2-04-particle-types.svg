  <title id="t-m2-04-particle-types">그림 중2-4-5 물질을 이루는 입자 — 원자, 분자, 이온</title>
  <desc id="d-m2-04-particle-types">(가) 헬륨은 원자 하나가 그대로 입자가 되어 흩어져 있고, 구리 같은 금속은 수많은 원자가 규칙적으로 늘어서 있다. (나) 물은 수소 원자 2개와 산소 원자 1개가 결합한 물 분자가 하나하나 떨어져 있다. (다) 염화 나트륨은 나트륨 이온(+)과 염화 이온(−)이 서로 끌어당기며 번갈아 규칙적으로 배열되어 있다. 입자의 크기와 간격은 모식적으로 나타냈다.</desc>
