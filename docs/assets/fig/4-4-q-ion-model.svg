<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-4-4-q-ion-model d-4-4-q-ion-model">
  <title id="t-4-4-q-ion-model">그림 4-4-6 문제 10 해설 혼합 전후의 이온 모형</title>
  <desc id="d-4-4-q-ion-model">묽은 염산 20 mL(H⁺ 4개, Cl⁻ 4개)와 수산화 나트륨 수용액 30 mL(Na⁺ 6개, OH⁻ 6개)를 섞으면 H⁺ 4개와 OH⁻ 4개가 반응하여 물 분자 4개가 생기고, 혼합 용액에는 Cl⁻ 4개, Na⁺ 6개, OH⁻ 2개가 남는다. 입자 1개는 이온(분자) 50개를 나타낸 모형이다.</desc>
