  <title id="t-mech-2-gas-work">그림 역학과 에너지 2-4 기체가 피스톤을 밀며 하는 일과 P–V 그래프의 넓이</title>
  <desc id="d-mech-2-gas-work">(가) 단면적 A인 피스톤을 압력 P인 기체가 F = PA의 힘으로 Δx만큼 밀면 W = FΔx = PΔV의 일을 한다. (나) 압력이 일정하면 P–V 그래프 아래 직사각형 넓이가 PΔV이고, 압력이 변해도 그래프 아래 넓이가 기체가 한 일이다.</desc>
