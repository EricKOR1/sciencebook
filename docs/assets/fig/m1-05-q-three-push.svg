<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 175" class="fig-small" role="img" aria-labelledby="t-m1-05-q-three-push d-m1-05-q-three-push">
  <title id="t-m1-05-q-three-push">그림 중1-5-3 예제 3에서 상자에 작용하는 세 힘</title>
  <desc id="d-m1-05-q-three-push">상자에 철수가 오른쪽으로 20 N, 영희가 오른쪽으로 30 N, 민수가 왼쪽으로 40 N의 힘을 작용한다. 화살표의 길이는 힘의 크기에 비례한다.</desc>
  <style>.m1-05-q-three-push-t{font-size:14px;fill:var(--fig-ink)} .m1-05-q-three-push-s{font-size:13px;fill:var(--fig-muted)} .m1-05-q-three-push-h{font-size:15px;fill:var(--fig-ink);font-weight:700}</style>
  <line x1="20.0" y1="150.0" x2="460.0" y2="150.0" style="stroke:var(--fig-line);stroke-width:2"/>
  <rect x="200.0" y="70.0" width="70.0" height="80.0" rx="3" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <text x="235.0" y="116.0" text-anchor="middle" class="m1-05-q-three-push-t">상자</text>
  <line x1="270.0" y1="92.0" x2="340.0" y2="92.0" style="stroke:var(--fig-blue);stroke-width:3.5;fill:none"/>
  <polygon points="350.0,92.0 339.0,97.3 339.0,86.7" style="fill:var(--fig-blue);stroke:none"/>
  <text x="358.0" y="97.0" text-anchor="start" class="m1-05-q-three-push-t">철수 20 N</text>
  <line x1="270.0" y1="126.0" x2="380.0" y2="126.0" style="stroke:var(--fig-blue);stroke-width:3.5;fill:none"/>
  <polygon points="390.0,126.0 379.0,131.3 379.0,120.7" style="fill:var(--fig-blue);stroke:none"/>
  <text x="398.0" y="131.0" text-anchor="start" class="m1-05-q-three-push-t">영희 30 N</text>
  <line x1="200.0" y1="110.0" x2="50.0" y2="110.0" style="stroke:var(--fig-red);stroke-width:3.5;fill:none"/>
  <polygon points="40.0,110.0 51.0,104.7 51.0,115.3" style="fill:var(--fig-red);stroke:none"/>
  <text x="42.0" y="96.0" text-anchor="start" class="m1-05-q-three-push-t">민수 40 N</text>
  <text x="240.0" y="185.0" text-anchor="middle" class="m1-05-q-three-push-s">화살표 길이는 힘의 크기에 비례한다. 마찰은 생각하지 않는다.</text>
</svg>
