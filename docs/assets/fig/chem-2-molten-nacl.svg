<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t-chem-2-molten-nacl d-chem-2-molten-nacl">
  <title id="t-chem-2-molten-nacl">그림 화학 2-4 용융 염화 나트륨의 전기 분해</title>
  <desc id="d-chem-2-molten-nacl">녹는점(약 801 °C) 이상으로 가열하여 녹인 염화 나트륨에 전류를 흘리면, 양이온인 Na⁺은 (−)극으로 끌려가 전자를 얻어 금속 나트륨이 되고, 음이온인 Cl⁻은 (+)극으로 끌려가 전자를 내놓고 염소 기체가 된다. 이온의 수와 크기는 모식적이다.</desc>
  <style>
    .c2mn-ink{fill:var(--fig-ink)} .c2mn-mut{fill:var(--fig-muted)}
    .c2mn-lbl{font-size:14px;fill:var(--fig-ink)} .c2mn-b{font-size:15px;font-weight:600;fill:var(--fig-ink)} .c2mn-sm{font-size:13px;fill:var(--fig-muted)}
    .c2mn-H{fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.2} .c2mn-O{fill:var(--fig-red);stroke:var(--fig-red);stroke-width:1} .c2mn-C{fill:var(--fig-ink);stroke:var(--fig-ink);stroke-width:1} .c2mn-N{fill:var(--fig-blue);stroke:var(--fig-blue);stroke-width:1}
    .c2mn-Cl{fill:var(--fig-green);stroke:var(--fig-green);stroke-width:1} .c2mn-at{font-size:13px;font-weight:600}
    .c2mn-melt{fill:var(--fig-soft-amber);stroke:var(--fig-ink);stroke-width:2} .c2mn-rod{fill:var(--fig-ink)} .c2mn-wire{fill:none;stroke:var(--fig-ink);stroke-width:2} .c2mn-pw{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.5} .c2mn-na{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5} .c2mn-cl{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.5} .c2mn-g{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1} .c2mn-met{fill:var(--fig-line);stroke:var(--fig-muted);stroke-width:1} .c2mn-ion{font-size:13px;font-weight:600;fill:var(--fig-ink)}
  </style>
  <path d="M190 110 L190 265 Q190 280 205 280 L515 280 Q530 280 530 265 L530 110" class="c2mn-melt"/>
  <rect x="190" y="128" width="340" height="2" style="fill:var(--fig-soft-amber)"/>
  <rect x="246" y="60" width="10" height="180" class="c2mn-rod"/>
  <rect x="464" y="60" width="10" height="180" class="c2mn-rod"/>
  <rect x="310" y="16" width="100" height="34" rx="5" class="c2mn-pw"/>
  <text x="360.0" y="38.0" text-anchor="middle" class="c2mn-lbl">직류 전원</text>
  <path d="M251 60 L251 33 L310 33" class="c2mn-wire"/><path d="M469 60 L469 33 L410 33" class="c2mn-wire"/>
  <text x="300.0" y="28.0" text-anchor="middle" class="c2mn-b">−</text>
  <text x="420.0" y="28.0" text-anchor="middle" class="c2mn-b">+</text>
  <text x="251.0" y="82.0" text-anchor="end" class="c2mn-b">(−)극</text>
  <text x="479.0" y="82.0" text-anchor="start" class="c2mn-b">(+)극</text>
  <rect x="240" y="196" width="22" height="44" rx="6" class="c2mn-met"/>
  <circle cx="482" cy="150" r="6" class="c2mn-g"/>
  <circle cx="486" cy="175" r="5" class="c2mn-g"/>
  <circle cx="480" cy="200" r="6" class="c2mn-g"/>
  <circle cx="488" cy="222" r="4" class="c2mn-g"/>
  <circle cx="330" cy="170" r="11" class="c2mn-na"/><text x="330" y="174.5" text-anchor="middle" class="c2mn-ion">Na⁺</text>
  <line x1="315.0" y1="170.0" x2="297.0" y2="170.0" style="stroke:var(--fig-violet);stroke-width:2"/><path d="M290.0 170.0 L297.0 166.5 L297.0 173.5 Z" style="fill:var(--fig-violet)"/>
  <circle cx="300" cy="225" r="11" class="c2mn-na"/><text x="300" y="229.5" text-anchor="middle" class="c2mn-ion">Na⁺</text>
  <line x1="285.0" y1="225.0" x2="267.0" y2="225.0" style="stroke:var(--fig-violet);stroke-width:2"/><path d="M260.0 225.0 L267.0 221.5 L267.0 228.5 Z" style="fill:var(--fig-violet)"/>
  <circle cx="360" cy="250" r="11" class="c2mn-na"/><text x="360" y="254.5" text-anchor="middle" class="c2mn-ion">Na⁺</text>
  <line x1="345.0" y1="250.0" x2="327.0" y2="250.0" style="stroke:var(--fig-violet);stroke-width:2"/><path d="M320.0 250.0 L327.0 246.5 L327.0 253.5 Z" style="fill:var(--fig-violet)"/>
  <circle cx="390" cy="150" r="11" class="c2mn-na"/><text x="390" y="154.5" text-anchor="middle" class="c2mn-ion">Na⁺</text>
  <line x1="375.0" y1="150.0" x2="357.0" y2="150.0" style="stroke:var(--fig-violet);stroke-width:2"/><path d="M350.0 150.0 L357.0 146.5 L357.0 153.5 Z" style="fill:var(--fig-violet)"/>
  <circle cx="420" cy="210" r="13" class="c2mn-cl"/><text x="420" y="214.5" text-anchor="middle" class="c2mn-ion">Cl⁻</text>
  <line x1="437.0" y1="210.0" x2="453.0" y2="210.0" style="stroke:var(--fig-green);stroke-width:2"/><path d="M460.0 210.0 L453.0 213.5 L453.0 206.5 Z" style="fill:var(--fig-green)"/>
  <circle cx="350" cy="200" r="13" class="c2mn-cl"/><text x="350" y="204.5" text-anchor="middle" class="c2mn-ion">Cl⁻</text>
  <line x1="367.0" y1="200.0" x2="383.0" y2="200.0" style="stroke:var(--fig-green);stroke-width:2"/><path d="M390.0 200.0 L383.0 203.5 L383.0 196.5 Z" style="fill:var(--fig-green)"/>
  <circle cx="400" cy="255" r="13" class="c2mn-cl"/><text x="400" y="259.5" text-anchor="middle" class="c2mn-ion">Cl⁻</text>
  <line x1="417.0" y1="255.0" x2="433.0" y2="255.0" style="stroke:var(--fig-green);stroke-width:2"/><path d="M440.0 255.0 L433.0 258.5 L433.0 251.5 Z" style="fill:var(--fig-green)"/>
  <circle cx="320" cy="140" r="13" class="c2mn-cl"/><text x="320" y="144.5" text-anchor="middle" class="c2mn-ion">Cl⁻</text>
  <line x1="337.0" y1="140.0" x2="353.0" y2="140.0" style="stroke:var(--fig-green);stroke-width:2"/><path d="M360.0 140.0 L353.0 143.5 L353.0 136.5 Z" style="fill:var(--fig-green)"/>
  <text x="360.0" y="300.0" text-anchor="middle" class="c2mn-sm">용융 NaCl(약 801 °C 이상) — 이온이 움직일 수 있다</text>
  <text x="20.0" y="150.0" text-anchor="start" class="c2mn-b">Na⁺ + e⁻ → Na</text>
  <text x="20.0" y="172.0" text-anchor="start" class="c2mn-sm">은백색 금속 나트륨</text>
  <text x="20.0" y="192.0" text-anchor="start" class="c2mn-sm">양이온이 (−)극으로</text>
  <text x="700.0" y="150.0" text-anchor="end" class="c2mn-b">2Cl⁻ → Cl₂ + 2e⁻</text>
  <text x="700.0" y="172.0" text-anchor="end" class="c2mn-sm">황록색 염소 기체</text>
  <text x="700.0" y="192.0" text-anchor="end" class="c2mn-sm">음이온이 (+)극으로</text>
</svg>
