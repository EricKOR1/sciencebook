<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="t-3-5-cell-membrane d-3-5-cell-membrane">
<title id="t-3-5-cell-membrane">그림 3-5-3 세포막의 구조와 물질 출입</title>
<desc id="d-3-5-cell-membrane">세포막은 인지질 이중층에 막단백질이 박혀 있는 구조이다. 산소·이산화 탄소는 인지질 사이로 직접, 이온·포도당·물은 각각에 맞는 막단백질을 통해 이동하고, 큰 분자는 통과하지 못한다. 모식도(크기 비율은 실제와 다름).</desc>
