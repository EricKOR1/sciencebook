<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-ubio-7-crispr d-ubio-7-crispr">
<title id="t-ubio-7-crispr">그림 일반생명과학 7-9 CRISPR–Cas9의 표적 인식과 절단, 그리고 두 가지 수선</title>
<desc id="d-ubio-7-crispr">가이드 RNA의 20 염기가 표적 가닥과 상보적으로 짝을 짓고, 바로 뒤에 PAM(NGG)이 있을 때 Cas9이 PAM 앞 3 염기 위치에서 두 가닥을 모두 자른다. 잘린 DNA는 비상동 말단 연결로 작은 삽입·결실이 생기거나, 넣어 준 주형을 베끼는 상동 의존 수선으로 원하는 서열로 고쳐진다. 서열은 예시이다.</desc>
