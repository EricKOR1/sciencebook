<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="t-m3-06-mitosis-stages d-m3-06-mitosis-stages">
  <title id="t-m3-06-mitosis-stages">그림 중3-6-3 체세포분열의 과정과 세포질 분열</title>
  <desc id="d-m3-06-mitosis-stages">염색체 2쌍(4개)을 가진 동물 세포의 체세포분열 모식도이다. 분열 전(간기)에 DNA가 복제되고, 전기에 두 가닥으로 된 염색체가 나타나며 핵막이 사라진다. 중기에 염색체가 세포 가운데에 한 줄로 늘어서고, 후기에 두 가닥이 갈라져 양쪽 끝으로 끌려가며, 말기에 핵이 다시 생기고 세포질이 나뉘어 염색체 4개를 가진 딸세포 2개가 된다. 아래는 동물 세포와 식물 세포의 세포질 분열 방식을 비교한 것이다.</desc>
