<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" class="fig-small" role="img" aria-labelledby="t-m2-03-q-diver d-m2-03-q-diver">
  <title id="t-m2-03-q-diver">그림 중2-3-13 문제 14 해설: 잠수부가 본 나무 꼭대기</title>
  <desc id="d-m2-03-q-diver">나무 꼭대기에서 나온 빛이 공기에서 물로 들어가며 법선 쪽으로 꺾여 잠수부의 눈에 들어온다. 눈은 빛이 곧게 왔다고 여기므로, 물속 광선을 거꾸로 연장한 점선 위, 실제보다 높은 곳에 나무 꼭대기가 있는 것처럼 보인다. 꺾이는 각은 물에 맞춰 계산했다.</desc>
  <style>.m2-03-q-diver-t{font-size:14px;fill:var(--fig-ink)} .m2-03-q-diver-s{font-size:13px;fill:var(--fig-muted)} .m2-03-q-diver-b{font-size:15px;font-weight:700;fill:var(--fig-ink)} </style>
