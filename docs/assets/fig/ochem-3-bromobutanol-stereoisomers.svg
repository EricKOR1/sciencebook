<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-ochem-3-bromobutanol-stereoisomers d-ochem-3-bromobutanol-stereoisomers">
  <title id="t-ochem-3-bromobutanol-stereoisomers">그림 유기화학 3-7 3-브로모뷰탄-2-올의 네 입체 이성질체</title>
  <desc id="d-ochem-3-bromobutanol-stereoisomers">지그재그 골격(C1–C4)에 C2의 OH와 C3의 Br을 쐐기 또는 점선으로 그린 네 입체 이성질체. 위의 (2R,3R)과 (2S,3S), 아래의 (2R,3S)와 (2S,3R)는 각각 거울상 이성질체이고, 세로와 대각선으로 이은 쌍은 부분 입체 이성질체이다.</desc>
