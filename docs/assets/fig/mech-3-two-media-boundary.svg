<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-mech-3-two-media-boundary d-mech-3-two-media-boundary">
  <title id="t-mech-3-two-media-boundary">그림 역학과 에너지 3-6 두 줄의 경계에서 일어나는 반사와 투과(모식도)</title>
  <desc id="d-mech-3-two-media-boundary">(가) 가벼운 줄에서 무거운 줄로 펄스가 가면, 반사파는 위상이 뒤집혀(골) 돌아오고 투과파는 위상 그대로 진행하되 속력이 느려져 폭(파장)이 좁아진다. (나) 무거운 줄에서 가벼운 줄로 가면, 반사파는 위상이 그대로이고 투과파는 속력이 빨라져 폭이 넓어진다. 두 줄의 단위 길이당 질량이 4배 차이 나는 경우의 진폭 비율로 그린 모식도이다.</desc>
