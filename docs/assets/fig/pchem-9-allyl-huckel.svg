  <title id="t-pchem-9-allyl-huckel">그림 물리화학 9-13 알릴계의 휘켈 π 분자 오비탈과 전자 배치</title>
  <desc id="d-pchem-9-allyl-huckel">세 오비탈 ψ₁(α + 1.414β), ψ₂(α), ψ₃(α − 1.414β)의 에너지(β &amp;lt; 0이므로 ψ₁이 가장 낮다)와 모양. p 오비탈 엽의 크기는 계수의 크기(0.5, 0.707, 0)에 비례하고, 위쪽 엽의 색이 부호이다(파랑 +, 빨강 −). ψ₂는 가운데 탄소에 마디가 있다. 오른쪽은 양이온(전자 2), 라디칼(3), 음이온(4)의 배치와 말단 탄소의 π 전하이다.</desc>
