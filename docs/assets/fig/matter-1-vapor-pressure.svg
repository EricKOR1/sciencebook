<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="t-matter-1-vapor-pressure d-matter-1-vapor-pressure">
  <title id="t-matter-1-vapor-pressure">그림 물질과 에너지 1-6 세 액체의 증기 압력 곡선</title>
  <desc id="d-matter-1-vapor-pressure">다이에틸 에터, 에탄올, 물의 증기 압력은 온도가 높아질수록 커진다. 증기 압력이 760 mmHg(1 atm)에 이르는 온도가 기준 끓는점으로, 각각 약 35 °C, 78 °C, 100 °C이다. 분자 간 상호작용이 클수록 같은 온도에서 증기 압력이 작고 끓는점이 높다. 앙투안 식으로 계산한 대략적인 값이다.</desc>
