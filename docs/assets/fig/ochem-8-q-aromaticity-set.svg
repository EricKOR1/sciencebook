  <title id="t-ochem-8-q-aromaticity-set">그림 유기화학 8-21 문제 2의 여섯 화학종</title>
  <desc id="d-ochem-8-q-aromaticity-set">(1) 피리딘(N의 비공유 전자쌍 표시), (2) 사이클로펜타다이엔일 양이온, (3) 사이클로옥타테트라엔(평면 팔각형 골격으로 그림), (4) 트로필륨 양이온, (5) 사이클로프로펜일 양이온, (6) 사이클로헵타-1,3,5-트라이엔(CH₂의 H 두 개 표시).</desc>
