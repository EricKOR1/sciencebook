<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-gene-2-q-codon-mutation d-gene-2-q-codon-mutation">
  <title id="t-gene-2-q-codon-mutation">그림 생물의 유전 2-10 문제 12 해설 — 주형 가닥, mRNA, 아미노산의 대응</title>
  <desc id="d-gene-2-q-codon-mutation">주형 가닥 3′-TAC GGT CTT ACC ATT-5′에서 mRNA 5′-AUG CCA GAA UGG UAA-3′이 만들어져 Met-Pro-Glu-Trp가 된다. 둘째 코돈 CCA와 결합하는 안티코돈은 3′-GGU-5′이다. 주형 가닥의 3′ 끝에서 일곱째 염기 C가 A로 바뀌면 mRNA의 셋째 코돈이 UAA(종결)가 되어 Met-Pro만 만들어진다.</desc>
  <style>.gene-2-q-codon-mutation-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .gene-2-q-codon-mutation-t{font-size:14px;fill:var(--fig-ink)} .gene-2-q-codon-mutation-s{font-size:13px;fill:var(--fig-muted)} .gene-2-q-codon-mutation-m{font-size:14px;font-weight:600;fill:var(--fig-ink);letter-spacing:1px} .gene-2-q-codon-mutation-ln{fill:none;stroke:var(--fig-ink);stroke-width:2} .gene-2-q-codon-mutation-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.4} .gene-2-q-codon-mutation-gr{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 3}</style>
  <text x="20.0" y="53.0" class="gene-2-q-codon-mutation-t">주형 가닥</text>
  <text x="200.0" y="53.0" text-anchor="end" class="gene-2-q-codon-mutation-m">3′-</text>
  <text x="664.0" y="53.0" text-anchor="start" class="gene-2-q-codon-mutation-m">-5′</text>
  <rect x="212.0" y="33.0" width="76.0" height="30.0" rx="4" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1.4"/>
  <text x="250.0" y="53.0" text-anchor="middle" class="gene-2-q-codon-mutation-m">TAC</text>
  <rect x="304.0" y="33.0" width="76.0" height="30.0" rx="4" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1.4"/>
  <text x="342.0" y="53.0" text-anchor="middle" class="gene-2-q-codon-mutation-m">GGT</text>
  <rect x="396.0" y="33.0" width="76.0" height="30.0" rx="4" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1.4"/>
  <text x="420.0" y="53.0" text-anchor="start" class="gene-2-q-codon-mutation-m"><tspan style="fill:var(--fig-red);font-weight:700">C</tspan>TT</text>
  <rect x="488.0" y="33.0" width="76.0" height="30.0" rx="4" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1.4"/>
  <text x="526.0" y="53.0" text-anchor="middle" class="gene-2-q-codon-mutation-m">ACC</text>
  <rect x="580.0" y="33.0" width="76.0" height="30.0" rx="4" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1.4"/>
  <text x="618.0" y="53.0" text-anchor="middle" class="gene-2-q-codon-mutation-m">ATT</text>
  <text x="20.0" y="101.0" class="gene-2-q-codon-mutation-t">mRNA</text>
  <text x="200.0" y="101.0" text-anchor="end" class="gene-2-q-codon-mutation-m">5′-</text>
  <text x="664.0" y="101.0" text-anchor="start" class="gene-2-q-codon-mutation-m">-3′</text>
  <rect x="212.0" y="81.0" width="76.0" height="30.0" rx="4" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.4"/>
  <text x="250.0" y="101.0" text-anchor="middle" class="gene-2-q-codon-mutation-m">AUG</text>
  <rect x="304.0" y="81.0" width="76.0" height="30.0" rx="4" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.4"/>
  <text x="342.0" y="101.0" text-anchor="middle" class="gene-2-q-codon-mutation-m">CCA</text>
  <rect x="396.0" y="81.0" width="76.0" height="30.0" rx="4" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.4"/>
  <text x="434.0" y="101.0" text-anchor="middle" class="gene-2-q-codon-mutation-m">GAA</text>
  <rect x="488.0" y="81.0" width="76.0" height="30.0" rx="4" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.4"/>
  <text x="526.0" y="101.0" text-anchor="middle" class="gene-2-q-codon-mutation-m">UGG</text>
  <rect x="580.0" y="81.0" width="76.0" height="30.0" rx="4" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.4"/>
  <text x="618.0" y="101.0" text-anchor="middle" class="gene-2-q-codon-mutation-m">UAA</text>
  <text x="20.0" y="141.0" class="gene-2-q-codon-mutation-t">아미노산</text>
  <text x="250.0" y="141.0" text-anchor="middle" class="gene-2-q-codon-mutation-t" style="font-weight:600">Met</text>
  <text x="342.0" y="141.0" text-anchor="middle" class="gene-2-q-codon-mutation-t" style="font-weight:600">Pro</text>
  <text x="434.0" y="141.0" text-anchor="middle" class="gene-2-q-codon-mutation-t" style="font-weight:600">Glu</text>
  <text x="526.0" y="141.0" text-anchor="middle" class="gene-2-q-codon-mutation-t" style="font-weight:600">Trp</text>
  <text x="618.0" y="141.0" text-anchor="middle" class="gene-2-q-codon-mutation-t" style="font-weight:600">종결</text>
  <text x="20.0" y="176.0" class="gene-2-q-codon-mutation-s">둘째 코돈의 안티코돈</text>
  <text x="342.0" y="176.0" text-anchor="middle" class="gene-2-q-codon-mutation-m" style="fill:var(--fig-violet)">3′-GGU-5′</text>
  <line x1="18.0" y1="194.0" x2="702.0" y2="194.0" style="stroke:var(--fig-line);stroke-width:1"/>
  <text x="20.0" y="220.0" class="gene-2-q-codon-mutation-t" style="fill:var(--fig-red)">돌연변이 후 (주형 가닥의 일곱째 염기 C → A)</text>
  <text x="20.0" y="255.0" class="gene-2-q-codon-mutation-t">mRNA</text>
  <text x="200.0" y="255.0" text-anchor="end" class="gene-2-q-codon-mutation-m">5′-</text>
  <text x="664.0" y="255.0" text-anchor="start" class="gene-2-q-codon-mutation-m">-3′</text>
  <rect x="212.0" y="240.0" width="76.0" height="30.0" rx="4" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.4"/>
  <text x="250.0" y="260.0" text-anchor="middle" class="gene-2-q-codon-mutation-m">AUG</text>
  <rect x="304.0" y="240.0" width="76.0" height="30.0" rx="4" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.4"/>
  <text x="342.0" y="260.0" text-anchor="middle" class="gene-2-q-codon-mutation-m">CCA</text>
  <rect x="396.0" y="240.0" width="76.0" height="30.0" rx="4" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
  <text x="434.0" y="260.0" text-anchor="middle" class="gene-2-q-codon-mutation-m">UAA</text>
  <rect x="488.0" y="240.0" width="76.0" height="30.0" rx="4" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.4"/>
  <text x="526.0" y="260.0" text-anchor="middle" class="gene-2-q-codon-mutation-m" style="opacity:0.45">UGG</text>
  <rect x="580.0" y="240.0" width="76.0" height="30.0" rx="4" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.4"/>
  <text x="618.0" y="260.0" text-anchor="middle" class="gene-2-q-codon-mutation-m" style="opacity:0.45">UAA</text>
  <text x="250.0" y="290.0" text-anchor="middle" class="gene-2-q-codon-mutation-t" style="font-weight:600">Met</text>
  <text x="342.0" y="290.0" text-anchor="middle" class="gene-2-q-codon-mutation-t" style="font-weight:600">Pro</text>
  <text x="434.0" y="290.0" text-anchor="middle" class="gene-2-q-codon-mutation-t" style="font-weight:600;fill:var(--fig-red)">종결</text>
</svg>
