<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-uphy-1-vector-components d-uphy-1-vector-components">
  <title id="t-uphy-1-vector-components">그림 일반물리학 1-5 벡터의 성분과 방향각 — Aₓ가 음수일 때</title>
  <desc id="d-uphy-1-vector-components">(가) 크기 5.0, x축과 37°를 이루는 벡터 A의 성분은 Aₓ = A cos θ = 4.0, A_y = A sin θ = 3.0이고, A = 4.0 i + 3.0 j로 쓴다. (나) B = −3.0 i + 4.0 j의 방향을 tan⁻¹(B_y/Bₓ)로 구하면 계산기는 −53.1°(제4사분면)를 주지만, Bₓ가 음수이므로 실제 방향은 180°를 더한 126.9°(제2사분면)이다.</desc>
  <rect x="10.0" y="10.0" width="345.0" height="340.0" rx="10" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <rect x="365.0" y="10.0" width="345.0" height="340.0" rx="10" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <text x="26.0" y="36.0" style="font-size:15px;fill:var(--fig-ink);font-weight:600">(가) 성분으로 나누기</text>
  <text x="381.0" y="36.0" style="font-size:15px;fill:var(--fig-ink);font-weight:600">(나) Bₓ &lt; 0 이면 180°를 더한다</text>
  <line x1="40.0" y1="270.0" x2="326.0" y2="270.0" style="stroke:var(--fig-muted);stroke-width:1.5;fill:none"/>
  <path d="M335.0 270.0 L326.0 274.5 L326.0 265.5 Z" style="fill:var(--fig-muted);stroke:none"/>
  <text x="330.0" y="290.0" text-anchor="end" style="font-size:13px;fill:var(--fig-muted)">x</text>
  <line x1="70.0" y1="300.0" x2="70.0" y2="69.0" style="stroke:var(--fig-muted);stroke-width:1.5;fill:none"/>
  <path d="M70.0 60.0 L74.5 69.0 L65.5 69.0 Z" style="fill:var(--fig-muted);stroke:none"/>
  <text x="78.0" y="70.0" style="font-size:13px;fill:var(--fig-muted)">y</text>
  <line x1="246.0" y1="138.0" x2="246.0" y2="270.0" style="stroke:var(--fig-line);stroke-width:1.5;fill:none;stroke-dasharray:5 4"/>
  <line x1="246.0" y1="138.0" x2="70.0" y2="138.0" style="stroke:var(--fig-line);stroke-width:1.5;fill:none;stroke-dasharray:5 4"/>
  <line x1="70.0" y1="270.0" x2="234.0" y2="270.0" style="stroke:var(--fig-red);stroke-width:4;fill:none"/>
  <path d="M246.0 270.0 L234.0 276.0 L234.0 264.0 Z" style="fill:var(--fig-red);stroke:none"/>
  <line x1="70.0" y1="270.0" x2="70.0" y2="150.0" style="stroke:var(--fig-blue);stroke-width:4;fill:none"/>
  <path d="M70.0 138.0 L76.0 150.0 L64.0 150.0 Z" style="fill:var(--fig-blue);stroke:none"/>
  <line x1="70.0" y1="270.0" x2="235.6" y2="145.8" style="stroke:var(--fig-ink);stroke-width:4;fill:none"/>
  <path d="M246.0 138.0 L239.5 151.0 L231.7 140.6 Z" style="fill:var(--fig-ink);stroke:none"/>
  <path d="M120 270 A50 50 0 0 0 110.0 240.0" style="fill:none;stroke:var(--fig-ink);stroke-width:1.5"/>
  <text x="126.0" y="260.0" style="font-size:13px;fill:var(--fig-ink)">θ = 37°</text>
  <text x="182.0" y="228.0" style="font-size:14px;fill:var(--fig-ink);font-weight:600">A (크기 5.0)</text>
  <text x="158.0" y="292.0" text-anchor="middle" style="font-size:14px;fill:var(--fig-red);font-weight:600">Aₓ = A cos θ = 4.0</text>
  <text x="62.0" y="196.0" text-anchor="end" style="font-size:14px;fill:var(--fig-blue);font-weight:600">A<tspan dy="4" style="font-size:11px">y</tspan><tspan dy="-4">​</tspan></text>
  <text x="62.0" y="216.0" text-anchor="end" style="font-size:14px;fill:var(--fig-blue);font-weight:600">= 3.0</text>
  <line x1="70.0" y1="270.0" x2="92.0" y2="270.0" style="stroke:var(--fig-violet);stroke-width:2.5;fill:none"/>
  <path d="M100.0 270.0 L92.0 274.0 L92.0 266.0 Z" style="fill:var(--fig-violet);stroke:none"/>
