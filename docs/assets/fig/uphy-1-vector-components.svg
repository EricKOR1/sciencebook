  <line x1="540.0" y1="200.0" x2="540.0" y2="99.0" style="stroke:var(--fig-blue);stroke-width:3.5;fill:none"/>
  <path d="M540.0 88.0 L545.5 99.0 L534.5 99.0 Z" style="fill:var(--fig-blue);stroke:none"/>
  <line x1="540.0" y1="200.0" x2="463.8" y2="98.4" style="stroke:var(--fig-ink);stroke-width:4;fill:none"/>
  <path d="M456.0 88.0 L469.0 94.5 L458.6 102.3 Z" style="fill:var(--fig-ink);stroke:none"/>
  <text x="450.0" y="80.0" text-anchor="middle" style="font-size:15px;fill:var(--fig-ink);font-weight:600">B</text>
  <text x="466.0" y="220.0" style="font-size:13px;fill:var(--fig-red);font-weight:600">Bₓ = −3.0</text>
  <text x="548.0" y="106.0" style="font-size:13px;fill:var(--fig-blue);font-weight:600">B<tspan dy="4" style="font-size:11px">y</tspan><tspan dy="-4">​</tspan> = 4.0</text>
  <line x1="540.0" y1="200.0" x2="584.4" y2="259.2" style="stroke:var(--fig-muted);stroke-width:2;fill:none;stroke-dasharray:6 4"/>
  <path d="M590.4 267.2 L580.4 262.2 L588.4 256.2 Z" style="fill:var(--fig-muted);stroke:none"/>
  <text x="594.4" y="271.2" style="font-size:13px;fill:var(--fig-muted)">계산기 값 −53.1°</text>
  <text x="594.4" y="289.2" style="font-size:13px;fill:var(--fig-muted)">(틀린 방향)</text>
  <path d="M576 200 A36 36 0 0 0 518.4 171.2" style="fill:none;stroke:var(--fig-green);stroke-width:2"/>
  <text x="570.0" y="160.0" style="font-size:14px;fill:var(--fig-green);font-weight:600">126.9°</text>
  <text x="560.0" y="178.0" style="font-size:13px;fill:var(--fig-green)">= −53.1° + 180°</text>
  <text x="392.0" y="322.0" style="font-size:13px;fill:var(--fig-muted)">분수 B<tspan dy="4" style="font-size:11px">y</tspan><tspan dy="-4">​</tspan>/Bₓ = 4/(−3)은 (−4)/3과 같아</text>
  <text x="392.0" y="340.0" style="font-size:13px;fill:var(--fig-muted)">계산기가 두 방향을 구별하지 못한다</text>
</svg>
