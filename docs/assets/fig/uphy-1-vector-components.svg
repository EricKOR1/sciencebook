  <path d="M70.0 240.0 L74.0 248.0 L66.0 248.0 Z" style="fill:var(--fig-violet);stroke:none"/>
  <text x="86.0" y="310.0" text-anchor="middle" style="font-size:14px;fill:var(--fig-violet);font-weight:600">î</text>
  <text x="44.0" y="266.0" text-anchor="middle" style="font-size:14px;fill:var(--fig-violet);font-weight:600">ĵ</text>
  <text x="180.0" y="92.0" text-anchor="middle" style="font-size:15px;fill:var(--fig-ink);font-weight:600">A = 4.0 î + 3.0 ĵ</text>
  <text x="180.0" y="112.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-violet)">단위 벡터 î, ĵ는 크기 1</text>
  <line x1="385.0" y1="200.0" x2="691.0" y2="200.0" style="stroke:var(--fig-muted);stroke-width:1.5;fill:none"/>
  <path d="M700.0 200.0 L691.0 204.5 L691.0 195.5 Z" style="fill:var(--fig-muted);stroke:none"/>
  <text x="696.0" y="220.0" text-anchor="end" style="font-size:13px;fill:var(--fig-muted)">x</text>
  <line x1="540.0" y1="315.0" x2="540.0" y2="64.0" style="stroke:var(--fig-muted);stroke-width:1.5;fill:none"/>
  <path d="M540.0 55.0 L544.5 64.0 L535.5 64.0 Z" style="fill:var(--fig-muted);stroke:none"/>
  <text x="548.0" y="65.0" style="font-size:13px;fill:var(--fig-muted)">y</text>
  <line x1="456.0" y1="88.0" x2="456.0" y2="200.0" style="stroke:var(--fig-line);stroke-width:1.5;fill:none;stroke-dasharray:5 4"/>
  <line x1="456.0" y1="88.0" x2="540.0" y2="88.0" style="stroke:var(--fig-line);stroke-width:1.5;fill:none;stroke-dasharray:5 4"/>
  <line x1="540.0" y1="200.0" x2="467.0" y2="200.0" style="stroke:var(--fig-red);stroke-width:3.5;fill:none"/>
