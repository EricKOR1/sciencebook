  <path d="M144.0 76.0 q-4 8 0 16" style="fill:none;stroke:var(--fig-red);stroke-width:1.6"/>
  <path d="M196.0 76.0 q4 8 0 16" style="fill:none;stroke:var(--fig-red);stroke-width:1.6"/>
  <path d="M138.0 76.0 q-4 8 0 16" style="fill:none;stroke:var(--fig-red);stroke-width:1.6"/>
