  <text x="170.0" y="54.0" text-anchor="middle" class="m3-07-magnitude-intensity-lbl">A</text>
  <text x="170.0" y="142.0" text-anchor="middle" class="m3-07-magnitude-intensity-tx">진도 큼</text>
  <rect x="286.0" y="80.0" width="28.0" height="40.0" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.5"/>
  <path d="M282 80 L300 64 L318 80 Z" style="fill:var(--fig-soft-violet);stroke:var(--fig-ink);stroke-width:1.5"/>
  <path d="M280.0 76.0 q-4 8 0 16" style="fill:none;stroke:var(--fig-red);stroke-width:1.6"/>
  <path d="M320.0 76.0 q4 8 0 16" style="fill:none;stroke:var(--fig-red);stroke-width:1.6"/>
