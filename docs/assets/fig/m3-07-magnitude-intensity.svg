<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-m3-07-magnitude-intensity d-m3-07-magnitude-intensity">
  <title id="t-m3-07-magnitude-intensity">그림 중3-7-2 규모와 진도의 차이</title>
  <desc id="d-m3-07-magnitude-intensity">지진이 일어난 땅속의 지점이 진원이고, 그 바로 위 지표의 지점이 진앙이다. 한 지진의 규모는 지진이 내놓은 에너지를 나타내므로 값이 하나이다. 진도는 장소마다 흔들린 정도이므로 같은 지진이라도 진앙에서 가까운 A에서 크고, 먼 C에서 작다. 거리와 흔들림은 모식적으로 나타냈다.</desc>
  <style>
    .m3-07-magnitude-intensity-lbl{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .m3-07-magnitude-intensity-tx{font-size:14px;fill:var(--fig-ink)}
    .m3-07-magnitude-intensity-sm{font-size:13px;fill:var(--fig-muted)}
  </style>
  <rect x="10.0" y="120.0" width="470.0" height="180.0" style="fill:var(--fig-soft-amber);stroke:none"/>
  <line x1="10.0" y1="120.0" x2="480.0" y2="120.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <path d="M90.0 229.0 L92.9 236.0 L100.5 236.6 L94.7 241.5 L96.5 248.9 L90.0 244.9 L83.5 248.9 L85.3 241.5 L79.5 236.6 L87.1 236.0 Z" style="fill:var(--fig-red);stroke:var(--fig-panel);stroke-width:1"/>
  <text x="106.0" y="245.0" class="m3-07-magnitude-intensity-lbl">진원</text>
  <line x1="90.0" y1="228.0" x2="90.0" y2="120.0" style="stroke:var(--fig-muted);stroke-width:1.2;stroke-dasharray:4 3"/>
  <circle cx="90.0" cy="120.0" r="5.0" style="fill:var(--fig-red)"/>
  <text x="90.0" y="54.0" text-anchor="middle" class="m3-07-magnitude-intensity-lbl">진앙</text>
  <line x1="90.0" y1="60.0" x2="90.0" y2="112.0" style="stroke:var(--fig-muted);stroke-width:1"/>
  <path d="M90.0 170.0 A70 70 0 0 1 160.0 240.0" style="fill:none;stroke:var(--fig-red);stroke-width:1.4;opacity:0.71;stroke-dasharray:5 4"/>
