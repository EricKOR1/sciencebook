  <text x="300.0" y="54.0" text-anchor="middle" class="m3-07-magnitude-intensity-lbl">B</text>
  <text x="300.0" y="142.0" text-anchor="middle" class="m3-07-magnitude-intensity-tx">진도 중간</text>
  <rect x="416.0" y="80.0" width="28.0" height="40.0" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.5"/>
  <path d="M412 80 L430 64 L448 80 Z" style="fill:var(--fig-soft-violet);stroke:var(--fig-ink);stroke-width:1.5"/>
  <path d="M410.0 76.0 q-4 8 0 16" style="fill:none;stroke:var(--fig-red);stroke-width:1.6"/>
  <path d="M450.0 76.0 q4 8 0 16" style="fill:none;stroke:var(--fig-red);stroke-width:1.6"/>
  <text x="430.0" y="54.0" text-anchor="middle" class="m3-07-magnitude-intensity-lbl">C</text>
  <text x="430.0" y="142.0" text-anchor="middle" class="m3-07-magnitude-intensity-tx">진도 작음</text>
  <text x="245.0" y="280.0" text-anchor="middle" class="m3-07-magnitude-intensity-sm">땅속 (진원에서 지진파가 사방으로 퍼진다)</text>
  <rect x="500.0" y="20.0" width="210.0" height="130.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1"/>
  <text x="514.0" y="46.0" class="m3-07-magnitude-intensity-lbl">규모</text>
  <text x="514.0" y="70.0" class="m3-07-magnitude-intensity-tx">지진이 내놓은 에너지</text>
  <text x="514.0" y="94.0" class="m3-07-magnitude-intensity-tx">→ 이 지진 하나에 값 하나</text>
  <text x="514.0" y="118.0" class="m3-07-magnitude-intensity-sm">(예: 규모 5.8)</text>
  <text x="514.0" y="138.0" class="m3-07-magnitude-intensity-sm">A, B, C 어디서나 같다</text>
  <rect x="500.0" y="166.0" width="210.0" height="134.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1"/>
  <text x="514.0" y="192.0" class="m3-07-magnitude-intensity-lbl">진도</text>
  <text x="514.0" y="216.0" class="m3-07-magnitude-intensity-tx">그 장소가 흔들린 정도</text>
  <text x="514.0" y="240.0" class="m3-07-magnitude-intensity-tx">→ 장소마다 다르다</text>
  <text x="514.0" y="264.0" class="m3-07-magnitude-intensity-tx">A > B > C</text>
  <text x="514.0" y="286.0" class="m3-07-magnitude-intensity-sm">(진앙에서 멀수록 대체로 작다)</text>
</svg>
