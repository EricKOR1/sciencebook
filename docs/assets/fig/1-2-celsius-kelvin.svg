  <text x="282" y="282.0" text-anchor="end" class="ck12-num">−273.15 °C</text>
  <rect x="476" y="268.0" width="84" height="20" style="fill:var(--fig-paper)"/>
  <text x="478" y="282.0" class="ck12-num">0 K</text>
  <line x1="324" y1="204.2" x2="434" y2="204.2" style="stroke:var(--fig-accent);stroke-width:2"/>
  <path d="M440 204.2 l-10 -6 v12 z" style="fill:var(--fig-accent)"/>
  <text x="380.0" y="196.2" text-anchor="middle" class="ck12-lbl" style="fill:var(--fig-accent)">+ 273.15</text>
  <rect x="572" y="88" width="140" height="150" rx="10" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.2"/>
  <text x="642" y="114" text-anchor="middle" class="ck12-lbl">눈금 한 칸은 같다</text>
  <text x="642" y="140" text-anchor="middle" class="ck12-txt">1 °C 오르면</text>
  <text x="642" y="160" text-anchor="middle" class="ck12-txt">1 K 오른다</text>
  <text x="642" y="190" text-anchor="middle" class="ck12-sm">36.5 → 38.0 °C</text>
  <text x="642" y="208" text-anchor="middle" class="ck12-sm">309.65 → 311.15 K</text>
  <text x="642" y="226" text-anchor="middle" class="ck12-sm">변화량은 둘 다 1.5</text>
  <text x="642" y="282.0" text-anchor="middle" class="ck12-sm">← 켈빈에는 음수가 없다</text>
  <text x="380" y="316" text-anchor="middle" class="ck12-txt">T(K) = t(°C) + 273.15</text>
