  <line x1="289" y1="124.4" x2="311" y2="124.4" style="stroke:var(--fig-ink);stroke-width:2"/>
  <line x1="449" y1="124.4" x2="471" y2="124.4" style="stroke:var(--fig-ink);stroke-width:2"/>
  <rect x="36" y="108.4" width="126" height="20" style="fill:var(--fig-paper)"/>
  <text x="40" y="122.4" class="ck12-txt">물이 어는 온도</text>
  <rect x="200" y="108.4" width="84" height="20" style="fill:var(--fig-paper)"/>
  <text x="282" y="122.4" text-anchor="end" class="ck12-num">0 °C</text>
  <rect x="476" y="108.4" width="84" height="20" style="fill:var(--fig-paper)"/>
  <text x="478" y="122.4" class="ck12-num">273.15 K</text>
