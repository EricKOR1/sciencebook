  <line x1="40" y1="66.0" x2="550" y2="66.0" class="ck12-dash"/>
  <line x1="289" y1="66.0" x2="311" y2="66.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <line x1="449" y1="66.0" x2="471" y2="66.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <rect x="36" y="50.0" width="126" height="20" style="fill:var(--fig-paper)"/>
  <text x="40" y="64.0" class="ck12-txt">물이 끓는 온도</text>
  <rect x="200" y="50.0" width="84" height="20" style="fill:var(--fig-paper)"/>
  <text x="282" y="64.0" text-anchor="end" class="ck12-num">100 °C</text>
  <rect x="476" y="50.0" width="84" height="20" style="fill:var(--fig-paper)"/>
  <text x="478" y="64.0" class="ck12-num">373.15 K</text>
  <line x1="40" y1="103.1" x2="550" y2="103.1" class="ck12-dash"/>
  <line x1="289" y1="103.1" x2="311" y2="103.1" style="stroke:var(--fig-ink);stroke-width:2"/>
  <line x1="449" y1="103.1" x2="471" y2="103.1" style="stroke:var(--fig-ink);stroke-width:2"/>
  <rect x="36" y="87.1" width="42" height="20" style="fill:var(--fig-paper)"/>
  <text x="40" y="101.1" class="ck12-txt">체온</text>
  <rect x="200" y="87.1" width="84" height="20" style="fill:var(--fig-paper)"/>
  <text x="282" y="101.1" text-anchor="end" class="ck12-num">36.5 °C</text>
  <rect x="476" y="87.1" width="84" height="20" style="fill:var(--fig-paper)"/>
  <text x="478" y="101.1" class="ck12-num">309.65 K</text>
