<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 326" role="img" aria-labelledby="t-1-2-celsius-kelvin d-1-2-celsius-kelvin">
  <title id="t-1-2-celsius-kelvin">그림 1-2-1 섭씨온도와 절대 온도(켈빈)</title>
  <desc id="d-1-2-celsius-kelvin">두 눈금은 한 칸의 크기가 같고, 0의 위치만 273.15만큼 다르다. 켈빈 눈금은 절대 영도를 0으로 잡으므로 음수가 없다.</desc>
  <style>
    .ck12-lbl{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .ck12-txt{font-size:14px;fill:var(--fig-ink)}
    .ck12-num{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .ck12-sm{font-size:13px;fill:var(--fig-muted)}
    .ck12-dash{stroke:var(--fig-line);stroke-width:1.2;stroke-dasharray:5 4;fill:none}
    .ck12-col{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.5}
  </style>
  <text x="300" y="30" text-anchor="middle" class="ck12-lbl">섭씨온도 (°C)</text>
  <text x="460" y="30" text-anchor="middle" class="ck12-lbl">절대 온도 (K)</text>
  <rect x="289" y="44" width="22" height="248" rx="11" class="ck12-col"/>
  <rect x="449" y="44" width="22" height="248" rx="11" class="ck12-col"/>
