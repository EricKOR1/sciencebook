<text x="360.0" y="262.0" text-anchor="middle" class="phy-1-torque-wrench-sm">돌림힘 τ = rF  (r: 회전축에서 힘이 작용하는 곳까지의 거리, F: r에 수직인 힘)</text>
<line x1="20.0" y1="280.0" x2="700.0" y2="280.0" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4;fill:none"/>
<text x="200.0" y="306.0" text-anchor="middle" class="phy-1-torque-wrench-lbl phy-1-torque-wrench-b">(라) 연필 양 끝을 엇갈리게 밀기</text>
<rect x="60.0" y="353.0" width="280.0" height="14.0" rx="6" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5"/>
