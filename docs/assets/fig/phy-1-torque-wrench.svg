<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-phy-1-torque-wrench d-phy-1-torque-wrench">
  <title id="t-phy-1-torque-wrench">그림 물리학 1-1 돌림힘 — 회전축까지의 거리와 힘의 방향</title>
  <desc id="d-phy-1-torque-wrench">같은 크기의 힘이라도 회전축에서 멀리, 렌치 자루에 수직으로 작용할수록 돌림힘이 크고, 회전축을 향하는 힘은 돌리지 못한다. 아래는 연필 양 끝을 엇갈리게 미는 경우로, 알짜힘은 0이지만 알짜 돌림힘이 0이 아니어서 회전한다(모식도).</desc>
  <style>
    .phy-1-torque-wrench-lbl{font-size:14px;fill:var(--fig-ink)} .phy-1-torque-wrench-sm{font-size:13px;fill:var(--fig-muted)} .phy-1-torque-wrench-b{font-weight:600}
  </style>
<text x="125.0" y="30.0" text-anchor="middle" class="phy-1-torque-wrench-lbl phy-1-torque-wrench-b">(가) 멀리서 수직으로</text>
<rect x="60.0" y="113.0" width="140.0" height="14.0" rx="4" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
