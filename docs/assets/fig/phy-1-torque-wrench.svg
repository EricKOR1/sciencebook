<text x="390.0" y="336.0" text-anchor="start" class="phy-1-torque-wrench-lbl">두 힘의 크기는 같고 방향이 반대 → 알짜힘 = 0</text>
<text x="390.0" y="360.0" text-anchor="start" class="phy-1-torque-wrench-lbl">두 힘이 모두 시계 방향으로 돌린다</text>
<text x="390.0" y="384.0" text-anchor="start" class="phy-1-torque-wrench-lbl phy-1-torque-wrench-b" style="fill:var(--fig-green)">→ 알짜 돌림힘 ≠ 0 → 제자리에서 회전</text>
</svg>
