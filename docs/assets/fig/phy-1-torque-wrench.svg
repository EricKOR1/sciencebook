<text x="601.0" y="30.0" text-anchor="middle" class="phy-1-torque-wrench-lbl phy-1-torque-wrench-b">(다) 회전축을 향해</text>
<rect x="536.0" y="113.0" width="140.0" height="14.0" rx="4" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
