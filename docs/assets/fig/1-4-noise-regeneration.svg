  <title id="t-1-4-noise-regeneration">그림 1-4-2 디지털 신호가 잡음에 강한 까닭</title>
  <desc id="d-1-4-noise-regeneration">아날로그 신호는 잡음이 섞이면 원래 모양과 구별할 수 없지만, 디지털 신호는 기준선보다 높으면 1, 낮으면 0으로 판단하여 원래 신호를 깨끗하게 되살려(재생) 다시 보낼 수 있다.</desc>
