<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" role="img" aria-labelledby="t-ubio-11-nephron-gradient d-ubio-11-nephron-gradient">
  <title id="t-ubio-11-nephron-gradient">그림 일반생명과학 11-10 네프론 부위별 수송과 수질의 삼투 기울기</title>
  <desc id="d-ubio-11-nephron-gradient">겉질의 간질액은 약 300 mOsm/L, 수질은 깊을수록 진해져 가장 깊은 곳이 약 1200 mOsm/L이다. 근위 세뇨관은 포도당·아미노산 전부와 Na⁺·물의 약 3분의 2를 재흡수하고, 헨레 고리 하행 지에서는 물만, 상행 지에서는 염만 빠져나가 여과액이 300 → 1200 → 약 100 mOsm/L로 변한다. 집합관은 ADH가 있을 때 물이 빠져 오줌이 최대 약 1200 mOsm/L까지 진해진다. 모식도이다.</desc>
  <style>.ubio-11-nephron-gradient-t{font-size:14px;fill:var(--fig-ink)} .ubio-11-nephron-gradient-b{font-size:14px;fill:var(--fig-ink);font-weight:700} .ubio-11-nephron-gradient-s{font-size:13px;fill:var(--fig-muted)} .ubio-11-nephron-gradient-n{font-size:13px;fill:var(--fig-ink);font-weight:700} .ubio-11-nephron-gradient-tube{fill:none;stroke-linecap:round;stroke-linejoin:round}</style>
