  .m103g-linef{fill:var(--fig-line)}
  .m103g-fbl{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2}
  .m103g-sbl{fill:var(--fig-soft-blue)}
  .m103g-obl{fill:none;stroke:var(--fig-blue);stroke-width:2}
