<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-m1-03-specific-heat-graph d-m1-03-specific-heat-graph">
<title id="t-m1-03-specific-heat-graph">그림 중1-3-7 같은 열을 받을 때 물질마다 다른 온도 변화</title>
<desc id="d-m1-03-specific-heat-graph">질량이 1 kg으로 같은 물, 식용유, 모래에 같은 양의 열을 가할 때 온도 변화를 나타낸 그래프이다. 비열이 작은 물질일수록 그래프의 기울기가 커서 온도가 많이 변한다. 비열은 물 1, 식용유 0.5, 모래 0.19 kcal/(kg·°C)로 계산한 값이다.</desc>
<style>
  .m103g-ttl{font-size:16px;font-weight:700;fill:var(--fig-ink)}
  .m103g-ink{font-size:14px;fill:var(--fig-ink)}
  .m103g-b{font-size:14px;font-weight:700;fill:var(--fig-ink)}
  .m103g-b15{font-size:15px;font-weight:700;fill:var(--fig-ink)}
  .m103g-sm{font-size:13px;fill:var(--fig-muted)}
  .m103g-smi{font-size:13px;fill:var(--fig-ink)}
  .m103g-acc{font-size:14px;font-weight:700;fill:var(--fig-accent)}
  .m103g-box{fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1.2}
  .m103g-panel{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2}
  .m103g-panel0{fill:var(--fig-panel)}
  .m103g-ln{fill:none;stroke:var(--fig-ink);stroke-width:2}
  .m103g-thin{fill:none;stroke:var(--fig-ink);stroke-width:1.2}
  .m103g-grid{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4}
  .m103g-dash{fill:none;stroke:var(--fig-line);stroke-width:1.3;stroke-dasharray:5 5}
  .m103g-ar{fill:none;stroke:var(--fig-ink);stroke-width:2}
  .m103g-ah{fill:var(--fig-ink)}
  .m103g-lead{fill:none;stroke:var(--fig-muted);stroke-width:1}
  .m103g-dot{fill:var(--fig-muted)}
