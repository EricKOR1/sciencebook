<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="t-ochem-7-h-shift-chart d-ochem-7-h-shift-chart">
  <title id="t-ochem-7-h-shift-chart">그림 유기화학 7-11 ¹H 화학적 이동 상관 도표</title>
  <desc id="d-ochem-7-h-shift-chart">가로축 δ 13 → 0 ppm(오른쪽 끝 0이 TMS). 수소의 종류별 화학적 이동 범위를 가로 막대로 나타냈다. 왼쪽일수록 벗겨진(낮은 자기장 쪽), 오른쪽일수록 가려진(높은 자기장 쪽) 수소이다. 막대 색: 산소 관련 빨강, 질소 파랑, 할로젠 초록, 탄소 π계 보라, 알케인 회색. ROH·RNH는 농도·용매에 따라 0.5~5 ppm에서 변한다(점선 막대).</desc>
