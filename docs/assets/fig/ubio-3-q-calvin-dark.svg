<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-ubio-3-q-calvin-dark d-ubio-3-q-calvin-dark">
  <title id="t-ubio-3-q-calvin-dark">그림 일반생명과학 3-15 문제 15 해설 조건을 바꾼 뒤 3PG와 RuBP의 양(모식)</title>
  <desc id="d-ubio-3-q-calvin-dark">왼쪽: 시각 0에 빛을 끄면 RuBP는 루비스코에 계속 쓰여 줄고, 3PG는 환원되지 못해 쌓인다. 오른쪽: 빛은 그대로 두고 CO₂ 공급을 끊으면 RuBP는 소비되지 않고 재생만 되어 늘고, 3PG는 계속 환원되어 준다. 처음 양을 기준으로 한 모식적 상댓값이다.</desc>
