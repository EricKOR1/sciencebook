<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" role="img" aria-labelledby="t-ubio-7-phage-cycles d-ubio-7-phage-cycles">
<title id="t-ubio-7-phage-cycles">그림 일반생명과학 7-2 박테리오파지의 용균 주기와 용원 주기</title>
<desc id="d-ubio-7-phage-cycles">파지가 세균에 DNA를 주입한 뒤, 용균 주기에서는 숙주 DNA를 분해하고 파지를 만들어 세포를 터뜨리며 나오고, 용원 주기에서는 파지 DNA가 숙주 염색체에 끼어들어 프로파지로서 세포 분열 때마다 함께 복제된다. 자외선 같은 신호는 프로파지를 용균 주기로 전환시킨다. 모식도이다.</desc>
