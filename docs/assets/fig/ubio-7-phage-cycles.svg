.ubio-7-phage-cycles-h{font-size:14px;font-weight:700;fill:var(--fig-ink)} .ubio-7-phage-cycles-s{font-size:13px;fill:var(--fig-muted)} .ubio-7-phage-cycles-t{font-size:13px;fill:var(--fig-ink)}
.ubio-7-phage-cycles-cell{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2}
.ubio-7-phage-cycles-chr{fill:none;stroke:var(--fig-ink);stroke-width:1.8}
.ubio-7-phage-cycles-pdna{fill:none;stroke:var(--fig-red);stroke-width:3;stroke-linecap:round}
.ubio-7-phage-cycles-ph{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5}
.ubio-7-phage-cycles-tail{stroke:var(--fig-violet);stroke-width:2}
.ubio-7-phage-cycles-arr{fill:none;stroke:var(--fig-muted);stroke-width:2} .ubio-7-phage-cycles-ah{fill:var(--fig-muted)}
.ubio-7-phage-cycles-lyt{font-size:15px;font-weight:700;fill:var(--fig-red)} .ubio-7-phage-cycles-lys{font-size:15px;font-weight:700;fill:var(--fig-blue)}
</style>
