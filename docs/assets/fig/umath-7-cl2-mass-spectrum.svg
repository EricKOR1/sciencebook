<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-umath-7-cl2-mass-spectrum d-umath-7-cl2-mass-spectrum">
  <title id="t-umath-7-cl2-mass-spectrum">그림 수학 도구 7-3 Cl₂의 질량 스펙트럼과 이항 분포</title>
  <desc id="d-umath-7-cl2-mass-spectrum">염소 분자 Cl₂의 막대 질량 스펙트럼. m/z 70(³⁵Cl–³⁵Cl), 72(³⁵Cl–³⁷Cl), 74(³⁷Cl–³⁷Cl)의 상대 세기가 100 : 64 : 10이다. ³⁷Cl 개수가 n = 2인 이항 분포를 따르므로 (a + b)²의 전개 a² : 2ab : b²(계수 1 : 2 : 1에 존재비를 곱한 값)로 계산된다.</desc>
  <style>
    .umath-7-cl2-mass-spectrum-ax{stroke:var(--fig-ink);stroke-width:1.3;fill:none}
    .umath-7-cl2-mass-spectrum-grid{stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:2 4;fill:none;opacity:0.7}
    .umath-7-cl2-mass-spectrum-tk{font-size:13px;fill:var(--fig-muted)}
    .umath-7-cl2-mass-spectrum-lb{font-size:14px;fill:var(--fig-ink)}
    .umath-7-cl2-mass-spectrum-t{font-size:14px;fill:var(--fig-ink)}
    .umath-7-cl2-mass-spectrum-tb{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .umath-7-cl2-mass-spectrum-s{font-size:13px;fill:var(--fig-muted)}
    .umath-7-cl2-mass-spectrum-ink{fill:var(--fig-ink)}
    .umath-7-cl2-mass-spectrum-bar{fill:var(--fig-blue)}
    .umath-7-cl2-mass-spectrum-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2}
    .umath-7-cl2-mass-spectrum-v{font-size:14px;font-weight:600;fill:var(--fig-blue)}
    .umath-7-cl2-mass-spectrum-mono{font-size:14px;fill:var(--fig-ink)}
  </style>
<line x1="70" y1="280.0" x2="410" y2="280.0" class="umath-7-cl2-mass-spectrum-grid"/>
<line x1="70" y1="238.2" x2="410" y2="238.2" class="umath-7-cl2-mass-spectrum-grid"/>
<line x1="70" y1="196.4" x2="410" y2="196.4" class="umath-7-cl2-mass-spectrum-grid"/>
<line x1="70" y1="154.5" x2="410" y2="154.5" class="umath-7-cl2-mass-spectrum-grid"/>
<line x1="70" y1="112.7" x2="410" y2="112.7" class="umath-7-cl2-mass-spectrum-grid"/>
<line x1="70" y1="70.9" x2="410" y2="70.9" class="umath-7-cl2-mass-spectrum-grid"/>
<line x1="70" y1="280" x2="410" y2="280" class="umath-7-cl2-mass-spectrum-ax"/>
<line x1="70" y1="50" x2="70" y2="280" class="umath-7-cl2-mass-spectrum-ax"/>
<line x1="70.0" y1="280" x2="70.0" y2="285" class="umath-7-cl2-mass-spectrum-ax"/>
<text x="70.0" y="300" text-anchor="middle" class="umath-7-cl2-mass-spectrum-tk">68</text>
<line x1="112.5" y1="280" x2="112.5" y2="285" class="umath-7-cl2-mass-spectrum-ax"/>
<text x="112.5" y="300" text-anchor="middle" class="umath-7-cl2-mass-spectrum-tk">69</text>
<line x1="155.0" y1="280" x2="155.0" y2="285" class="umath-7-cl2-mass-spectrum-ax"/>
<text x="155.0" y="300" text-anchor="middle" class="umath-7-cl2-mass-spectrum-tk">70</text>
<line x1="197.5" y1="280" x2="197.5" y2="285" class="umath-7-cl2-mass-spectrum-ax"/>
<text x="197.5" y="300" text-anchor="middle" class="umath-7-cl2-mass-spectrum-tk">71</text>
<line x1="240.0" y1="280" x2="240.0" y2="285" class="umath-7-cl2-mass-spectrum-ax"/>
<text x="240.0" y="300" text-anchor="middle" class="umath-7-cl2-mass-spectrum-tk">72</text>
<line x1="282.5" y1="280" x2="282.5" y2="285" class="umath-7-cl2-mass-spectrum-ax"/>
<text x="282.5" y="300" text-anchor="middle" class="umath-7-cl2-mass-spectrum-tk">73</text>
<line x1="325.0" y1="280" x2="325.0" y2="285" class="umath-7-cl2-mass-spectrum-ax"/>
<text x="325.0" y="300" text-anchor="middle" class="umath-7-cl2-mass-spectrum-tk">74</text>
<line x1="367.5" y1="280" x2="367.5" y2="285" class="umath-7-cl2-mass-spectrum-ax"/>
<text x="367.5" y="300" text-anchor="middle" class="umath-7-cl2-mass-spectrum-tk">75</text>
<line x1="410.0" y1="280" x2="410.0" y2="285" class="umath-7-cl2-mass-spectrum-ax"/>
<text x="410.0" y="300" text-anchor="middle" class="umath-7-cl2-mass-spectrum-tk">76</text>
<line x1="65" y1="280.0" x2="70" y2="280.0" class="umath-7-cl2-mass-spectrum-ax"/>
<text x="62" y="284.5" text-anchor="end" class="umath-7-cl2-mass-spectrum-tk">0</text>
<line x1="65" y1="238.2" x2="70" y2="238.2" class="umath-7-cl2-mass-spectrum-ax"/>
<text x="62" y="242.7" text-anchor="end" class="umath-7-cl2-mass-spectrum-tk">20</text>
<line x1="65" y1="196.4" x2="70" y2="196.4" class="umath-7-cl2-mass-spectrum-ax"/>
<text x="62" y="200.9" text-anchor="end" class="umath-7-cl2-mass-spectrum-tk">40</text>
<line x1="65" y1="154.5" x2="70" y2="154.5" class="umath-7-cl2-mass-spectrum-ax"/>
<text x="62" y="159.0" text-anchor="end" class="umath-7-cl2-mass-spectrum-tk">60</text>
<line x1="65" y1="112.7" x2="70" y2="112.7" class="umath-7-cl2-mass-spectrum-ax"/>
<text x="62" y="117.2" text-anchor="end" class="umath-7-cl2-mass-spectrum-tk">80</text>
<line x1="65" y1="70.9" x2="70" y2="70.9" class="umath-7-cl2-mass-spectrum-ax"/>
<text x="62" y="75.4" text-anchor="end" class="umath-7-cl2-mass-spectrum-tk">100</text>
<text x="240.0" y="320" text-anchor="middle" class="umath-7-cl2-mass-spectrum-lb">m/z</text>
<text x="22" y="165.0" text-anchor="middle" transform="rotate(-90 22 165.0)" class="umath-7-cl2-mass-spectrum-lb">상대 세기</text>
<rect x="148.0" y="70.9" width="14" height="209.1" class="umath-7-cl2-mass-spectrum-bar"/>
<text x="155.0" y="46.9" text-anchor="middle" class="umath-7-cl2-mass-spectrum-v">100</text>
<text x="155.0" y="62.9" text-anchor="middle" class="umath-7-cl2-mass-spectrum-s">³⁵Cl–³⁵Cl</text>
<rect x="233.0" y="146.2" width="14" height="133.8" class="umath-7-cl2-mass-spectrum-bar"/>
<text x="240.0" y="122.2" text-anchor="middle" class="umath-7-cl2-mass-spectrum-v">64</text>
<text x="240.0" y="138.2" text-anchor="middle" class="umath-7-cl2-mass-spectrum-s">³⁵Cl–³⁷Cl</text>
<rect x="318.0" y="258.6" width="14" height="21.4" class="umath-7-cl2-mass-spectrum-bar"/>
<text x="325.0" y="234.6" text-anchor="middle" class="umath-7-cl2-mass-spectrum-v">10</text>
<text x="325.0" y="250.6" text-anchor="middle" class="umath-7-cl2-mass-spectrum-s">³⁷Cl–³⁷Cl</text>
<rect x="450" y="40" width="250" height="250" rx="8" class="umath-7-cl2-mass-spectrum-box"/>
<text x="466" y="68" class="umath-7-cl2-mass-spectrum-tb" style="white-space:pre" xml:space="preserve">이항 분포 n = 2</text>
<text x="466" y="90" class="umath-7-cl2-mass-spectrum-s" style="white-space:pre" xml:space="preserve">a = ³⁵Cl 존재비 0.7576</text>
<text x="466" y="112" class="umath-7-cl2-mass-spectrum-s" style="white-space:pre" xml:space="preserve">b = ³⁷Cl 존재비 0.2424</text>
<text x="466" y="134" class="umath-7-cl2-mass-spectrum-t" style="white-space:pre" xml:space="preserve">(a + b)² = a² + 2ab + b²</text>
<text x="466" y="156" class="umath-7-cl2-mass-spectrum-t" style="white-space:pre" xml:space="preserve">이항 계수   1   :   2   :   1</text>
<text x="466" y="186" class="umath-7-cl2-mass-spectrum-t" style="white-space:pre" xml:space="preserve">a²  = 0.5740  → 100</text>
<text x="466" y="208" class="umath-7-cl2-mass-spectrum-t" style="white-space:pre" xml:space="preserve">2ab = 0.3673  → 64</text>
<text x="466" y="230" class="umath-7-cl2-mass-spectrum-t" style="white-space:pre" xml:space="preserve">b²  = 0.0588  → 10</text>
<text x="466" y="252" class="umath-7-cl2-mass-spectrum-s" style="white-space:pre" xml:space="preserve">가장 큰 값을 100으로 나눈 비</text>
</svg>
