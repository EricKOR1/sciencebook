<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" role="img" aria-labelledby="t-uearth-8-fronts-section d-uearth-8-fronts-section">
  <title id="t-uearth-8-fronts-section">그림 일반지구과학 8-8 한랭 전선과 온난 전선의 연직 단면</title>
  <desc id="d-uearth-8-fronts-section">위는 한랭 전선, 아래는 온난 전선의 연직 단면이다. 한랭 전선에서는 무거운 찬 공기가 따뜻한 공기 밑으로 파고들며 전선면이 가파르게(약 1/50~1/100) 서고, 따뜻한 공기가 급히 들어 올려져 전선 부근 좁은 띠에 적란운과 소나기·뇌우가 생긴다. 온난 전선에서는 따뜻한 공기가 찬 공기 위로 완만하게(약 1/100~1/200) 타고 올라, 지상 전선 앞 수백~1000여 km에 걸쳐 권운, 권층운, 고층운, 난층운이 차례로 낮아지며 나타나고 넓은 지역에 지속적인 비가 내린다. 가로·세로 축척은 같지 않으며 높이를 약 50배 과장한 모식도이다.</desc>
