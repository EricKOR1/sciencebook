  <title id="t-umath-5-det-area">그림 수학 도구 5-4 행렬식은 넓이의 배율</title>
  <desc id="d-umath-5-det-area">단위 정사각형(넓이 1)을 A = [[3, 1], [1, 2]]로 변환하면 두 열 (3, 1)과 (1, 2)가 만드는 평행사변형이 되고 넓이는 det A = 5이다. 아래 작은 그림: 두 열 (2, 1)과 (4, 2)가 한 직선 위에 있으면 평행사변형이 선분으로 납작해져 det = 0이다.</desc>
