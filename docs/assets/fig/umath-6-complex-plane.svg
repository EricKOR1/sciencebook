<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-umath-6-complex-plane d-umath-6-complex-plane">
  <title id="t-umath-6-complex-plane">그림 수학 도구 6-1 복소 평면과 켤레 복소수, 복소수의 덧셈</title>
  <desc id="d-umath-6-complex-plane">왼쪽: z = 3 + 2i 를 원점에서 그은 화살표로 나타내면 길이가 |z| = √13, 실수축과 이루는 각이 arg z 이다. 켤레 복소수 z* = 3 − 2i 는 실수축에 대해 대칭이다. 오른쪽: z₁ = 1 + 2i 와 z₂ = 2 − i 를 더하면 평행사변형의 대각선 z₁ + z₂ = 3 + i 가 된다.</desc>
