<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-emq-1-induction-polarization d-emq-1-induction-polarization">
  <title id="t-emq-1-induction-polarization">그림 전자기와 양자 1-1 정전기 유도(도체)와 유전분극(절연체)</title>
  <desc id="d-emq-1-induction-polarization">(−)로 대전된 막대를 가까이 하면, 금속(도체)에서는 자유 전자가 먼 쪽으로 이동하여 가까운 쪽이 (+), 먼 쪽이 (−)가 되고 내부 전기장은 0이 된다. 플라스틱(절연체)에서는 각 분자 안의 전하가 살짝 치우쳐 (+)쪽이 막대를 향하도록 줄지어, 표면에만 약한 전하가 나타나고 내부 전기장은 약해진다.</desc>
