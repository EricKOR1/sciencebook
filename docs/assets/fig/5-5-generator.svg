  <text x="124" y="128" class="gn-sm" style="fill:var(--fig-green)">회전</text>
  <ellipse cx="330" cy="180" rx="5" ry="13" class="gn-ring"/>
  <ellipse cx="346" cy="180" rx="5" ry="13" class="gn-ring"/>
  <path d="M330,167 L330,140 L390,140 L390,158" class="gn-wire"/>
  <path d="M346,193 L346,222 L390,222 L390,202" class="gn-wire"/>
  <circle cx="390" cy="180" r="18" class="gn-bulb"/>
  <path d="M377.3,167.3 L402.7,192.7 M402.7,167.3 L377.3,192.7" style="fill:none;stroke:var(--fig-ink);stroke-width:1.4"/>
  <text x="390" y="250" text-anchor="middle" class="gn-ink" style="font-weight:700">전구</text>
  <text x="390" y="268" text-anchor="middle" class="gn-ink">전기 에너지</text>
