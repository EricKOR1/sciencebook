  <line x1="570" y1="282" x2="570" y2="300" class="gn-ax"/>
  <text x="520.0" y="312" text-anchor="middle" class="gn-ink">코일 한 바퀴</text>
  <text x="452" y="340" class="gn-ink">방향이 주기적으로 바뀌는 전류 → <tspan style="font-weight:700">교류</tspan></text>
  <text x="20" y="340" class="gn-sm">코일이 돌면 코일을 지나는 자기장이 세졌다 약해졌다 한다</text>
</svg>
