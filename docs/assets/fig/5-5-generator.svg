  <text x="70" y="254" text-anchor="middle" class="gn-sm">물·증기·바람이</text>
  <text x="70" y="270" text-anchor="middle" class="gn-sm">돌림</text>
  <text x="70" y="294" text-anchor="middle" class="gn-ink">운동 에너지</text>
  <text x="70" y="310" text-anchor="middle" class="gn-ink">공급</text>
