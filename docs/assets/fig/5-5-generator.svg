<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" role="img" aria-labelledby="t-5-5-generator d-5-5-generator">
  <title id="t-5-5-generator">그림 5-5-2 발전기의 구조와 만들어지는 교류</title>
  <desc id="d-5-5-generator">(가) 터빈이 회전축을 돌리면 자석의 N극과 S극 사이에서 코일이 회전하고, 코일을 지나는 자기장의 세기가 계속 변해 유도 전류가 흐른다. 전류는 회전축의 고리를 거쳐 바깥의 전구로 나간다. (나) 코일이 한 바퀴 도는 동안 전류는 한 방향으로 흘렀다가 반대 방향으로 흐르며, 이것이 되풀이되는 교류가 만들어진다. 모식도(실제 발전소의 발전기는 전자석을 돌리는 구조가 많음).</desc>
  <style>
    .gn-lbl{font-size:15px;font-weight:700;fill:var(--fig-ink)} .gn-sm{font-size:13px;fill:var(--fig-muted)} .gn-ink{font-size:13px;fill:var(--fig-ink)}
    .gn-n{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2} .gn-s{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2}
    .gn-pole{font-size:20px;font-weight:700}
    .gn-fl{stroke:var(--fig-line);stroke-width:1.3;stroke-dasharray:5 4} .gn-flh{fill:var(--fig-line)}
    .gn-coil{fill:none;stroke:var(--fig-amber);stroke-width:3;stroke-linejoin:round}
    .gn-coil2{fill:none;stroke:var(--fig-amber);stroke-width:1.5;stroke-linejoin:round}
    .gn-axis{stroke:var(--fig-ink);stroke-width:4;stroke-linecap:round}
    .gn-wire{fill:none;stroke:var(--fig-ink);stroke-width:1.6}
    .gn-ring{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5}
    .gn-rot{fill:none;stroke:var(--fig-green);stroke-width:2.2} .gn-roth{fill:var(--fig-green)}
    .gn-turb{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.5}
    .gn-bulb{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.8}
    .gn-ax{stroke:var(--fig-ink);stroke-width:1.4} .gn-axh{fill:var(--fig-ink)}
    .gn-wave{fill:none;stroke:var(--fig-red);stroke-width:2.5}
    .gn-pos{fill:var(--fig-soft-red)} .gn-neg{fill:var(--fig-soft-blue)}
  </style>
  <text x="20" y="26" class="gn-lbl">(가) 발전기의 구조</text>
  <rect x="140" y="44" width="170" height="44" rx="4" class="gn-n"/>
  <text x="225" y="73" text-anchor="middle" class="gn-pole" style="fill:var(--fig-red)">N</text>
  <rect x="140" y="272" width="170" height="44" rx="4" class="gn-s"/>
  <text x="225" y="301" text-anchor="middle" class="gn-pole" style="fill:var(--fig-blue)">S</text>
  <line x1="152" y1="94" x2="152.0" y2="260.4" class="gn-fl"/><path d="M152.0,266.0 L148.0,259.1 L156.0,259.1 Z" class="gn-flh"/>
