<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-emq-3-q-ground-absorption d-emq-3-q-ground-absorption">
  <title id="t-emq-3-q-ground-absorption">그림 전자기와 양자 3-10 문제 14 풀이의 바닥상태 수소 원자와 네 광자</title>
  <desc id="d-emq-3-q-ground-absorption">바닥상태(−13.6 eV)에서 각 광자 에너지만큼 올라간 위치를 화살표로 나타냈다. (나) 12.09 eV는 n = 3에 꼭 맞아 흡수되고, (라) 14.0 eV는 0 eV를 넘어 전자가 떨어져 나간다(이온화). (가) 2.55 eV와 (다) 13.0 eV는 도착하는 곳에 준위가 없어 흡수되지 않는다(점선). 준위의 높이는 에너지에 비례한다.</desc>
  <style>.emq-3-q-ground-absorption-t{font-size:14px;fill:var(--fig-ink)} .emq-3-q-ground-absorption-s{font-size:13px;fill:var(--fig-muted)} .emq-3-q-ground-absorption-b{font-size:15px;font-weight:700;fill:var(--fig-ink)}</style>
  <rect x="110" y="24" width="450" height="58" style="fill:var(--fig-soft-amber);stroke:none"/>
  <text x="120" y="44" class="emq-3-q-ground-absorption-s">0 eV 위: 전자가 원자를 벗어남(이온화)</text>
  <line x1="110" y1="82" x2="560" y2="82" style="stroke:var(--fig-ink);stroke-width:1.6;stroke-dasharray:6 4"/>
  <text x="570" y="87" class="emq-3-q-ground-absorption-s">n = ∞   0 eV</text>
  <line x1="110" y1="435.6" x2="560" y2="435.6" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="570" y="440.6" class="emq-3-q-ground-absorption-s">n = 1   −13.60 eV</text>
  <line x1="110" y1="170.4" x2="560" y2="170.4" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="570" y="175.4" class="emq-3-q-ground-absorption-s">n = 2   −3.40 eV</text>
  <line x1="110" y1="121.3" x2="560" y2="121.3" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="570" y="126.3" class="emq-3-q-ground-absorption-s">n = 3   −1.51 eV</text>
  <line x1="110" y1="104.1" x2="560" y2="104.1" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="570" y="109.1" class="emq-3-q-ground-absorption-s">n = 4   −0.85 eV</text>
  <line x1="170" y1="435.6" x2="170" y2="377.3" style="stroke:var(--fig-red);stroke-width:2.6;stroke-dasharray:6 4"/>
  <path d="M170 369.3 L165.5 379.3 L174.5 379.3 Z" style="fill:var(--fig-red)"/>
  <line x1="156" y1="369.3" x2="184" y2="369.3" style="stroke:var(--fig-red);stroke-width:1.4"/>
  <text x="178" y="409.6" class="emq-3-q-ground-absorption-t" style="fill:var(--fig-red)">(가)</text>
  <text x="178" y="426.6" class="emq-3-q-ground-absorption-s">2.55 eV</text>
  <text x="152" y="374.3" text-anchor="end" class="emq-3-q-ground-absorption-b" style="fill:var(--fig-red)">✗</text>
  <line x1="270" y1="435.6" x2="270" y2="129.3" style="stroke:var(--fig-green);stroke-width:2.6"/>
  <path d="M270 121.3 L265.5 131.3 L274.5 131.3 Z" style="fill:var(--fig-green)"/>
  <line x1="256" y1="121.3" x2="284" y2="121.3" style="stroke:var(--fig-green);stroke-width:1.4"/>
  <text x="278" y="409.6" class="emq-3-q-ground-absorption-t" style="fill:var(--fig-green)">(나)</text>
  <text x="278" y="426.6" class="emq-3-q-ground-absorption-s">12.09 eV</text>
  <line x1="370" y1="435.6" x2="370" y2="105.6" style="stroke:var(--fig-red);stroke-width:2.6;stroke-dasharray:6 4"/>
  <path d="M370 97.6 L365.5 107.6 L374.5 107.6 Z" style="fill:var(--fig-red)"/>
  <line x1="356" y1="97.6" x2="384" y2="97.6" style="stroke:var(--fig-red);stroke-width:1.4"/>
  <text x="378" y="409.6" class="emq-3-q-ground-absorption-t" style="fill:var(--fig-red)">(다)</text>
  <text x="378" y="426.6" class="emq-3-q-ground-absorption-s">13.0 eV</text>
  <text x="352" y="102.6" text-anchor="end" class="emq-3-q-ground-absorption-b" style="fill:var(--fig-red)">✗</text>
  <line x1="470" y1="435.6" x2="470" y2="79.6" style="stroke:var(--fig-green);stroke-width:2.6"/>
  <path d="M470 71.6 L465.5 81.6 L474.5 81.6 Z" style="fill:var(--fig-green)"/>
  <line x1="456" y1="71.6" x2="484" y2="71.6" style="stroke:var(--fig-green);stroke-width:1.4"/>
  <text x="478" y="409.6" class="emq-3-q-ground-absorption-t" style="fill:var(--fig-green)">(라)</text>
  <text x="478" y="426.6" class="emq-3-q-ground-absorption-s">14.0 eV</text>
  <text x="110" y="462" class="emq-3-q-ground-absorption-s">실선: 흡수됨   점선(✗): 도착한 곳에 준위가 없어 흡수되지 않음</text>
</svg>
