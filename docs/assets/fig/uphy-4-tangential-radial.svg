  <text x="535.0" y="318.0" text-anchor="middle" class="uphy4tangentialradial-s">a<tspan baseline-shift="sub" font-size="11">t</tspan>: 속력을 바꾼다 · a<tspan baseline-shift="sub" font-size="11">r</tspan>: 방향을 바꾼다</text>
  <text x="535.0" y="340.0" text-anchor="middle" class="uphy4tangentialradial-t">a = √(a<tspan baseline-shift="sub" font-size="11">t</tspan><tspan baseline-shift="super" font-size="11">2</tspan> + a<tspan baseline-shift="sub" font-size="11">r</tspan><tspan baseline-shift="super" font-size="11">2</tspan>)</text>
