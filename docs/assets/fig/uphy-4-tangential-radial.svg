<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" role="img" aria-labelledby="t-uphy-4-tangential-radial d-uphy-4-tangential-radial">
  <title id="t-uphy-4-tangential-radial">그림 일반물리학 4-4 회전하는 점의 속도와 가속도</title>
  <desc id="d-uphy-4-tangential-radial">왼쪽: 축에서 거리 r인 점 P가 각 θ만큼 돌면 호의 길이 s = rθ만큼 움직이고, 속도 v = rω는 원의 접선 방향이다. 오른쪽: 각속도가 커지는 회전에서 P의 가속도는 접선 성분 a_t = rα(속력 변화)와 중심을 향하는 지름 성분 a_r = rω²(방향 변화)의 벡터합이다.</desc>
  <style>
    .uphy4tangentialradial-t{font-size:14px;fill:var(--fig-ink)} .uphy4tangentialradial-s{font-size:13px;fill:var(--fig-muted)}
    .uphy4tangentialradial-b{font-size:15px;fill:var(--fig-ink);font-weight:600} .uphy4tangentialradial-i{font-size:15px;fill:var(--fig-ink);font-style:italic}
  </style>
  <text x="185.0" y="28.0" text-anchor="middle" class="uphy4tangentialradial-b">속도</text>
