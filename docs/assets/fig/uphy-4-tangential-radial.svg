  <path d="M542.7 185.8 L545.7 175.3 L552.6 181.0 Z" style="fill:var(--fig-amber);stroke:none"/>
  <line x1="599.3" y1="118.4" x2="503.9" y2="143.7" style="fill:none;stroke:var(--fig-violet);stroke-width:3;stroke-linecap:butt"/>
