<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-uphy-6-doppler-wavefronts d-uphy-6-doppler-wavefronts">
  <title id="t-uphy-6-doppler-wavefronts">그림 일반물리학 6-8 움직이는 파원이 만드는 파면</title>
  <desc id="d-uphy-6-doppler-wavefronts">파원이 음속의 절반(v_S = 0.5v)으로 오른쪽으로 움직이며 일정한 시간 간격으로 낸 파면들이다. 각 파면은 그것을 낸 순간의 파원 위치(작은 점)를 중심으로 퍼진다. 그래서 파원 앞쪽은 파장이 (v − v_S)/f로 짧아지고 뒤쪽은 (v + v_S)/f로 길어진다.</desc>
  <style>
    .uphy6dopplerwavefronts-t{font-size:14px;fill:var(--fig-ink)} .uphy6dopplerwavefronts-s{font-size:13px;fill:var(--fig-muted)}
    .uphy6dopplerwavefronts-b{font-size:15px;fill:var(--fig-ink);font-weight:600} .uphy6dopplerwavefronts-i{font-size:15px;fill:var(--fig-ink);font-style:italic}
  </style>
  <circle cx="372.0" cy="170.0" r="36.0" style="fill:none;stroke:var(--fig-blue);stroke-width:1.8"/>
  <circle cx="372.0" cy="170.0" r="2.6" style="fill:var(--fig-muted);stroke:none"/>
  <circle cx="354.0" cy="170.0" r="72.0" style="fill:none;stroke:var(--fig-blue);stroke-width:1.8"/>
  <circle cx="354.0" cy="170.0" r="2.6" style="fill:var(--fig-muted);stroke:none"/>
  <circle cx="336.0" cy="170.0" r="108.0" style="fill:none;stroke:var(--fig-blue);stroke-width:1.8"/>
  <circle cx="336.0" cy="170.0" r="2.6" style="fill:var(--fig-muted);stroke:none"/>
  <circle cx="318.0" cy="170.0" r="144.0" style="fill:none;stroke:var(--fig-blue);stroke-width:1.8"/>
  <circle cx="318.0" cy="170.0" r="2.6" style="fill:var(--fig-muted);stroke:none"/>
  <circle cx="390.0" cy="170.0" r="8.0" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2"/>
  <line x1="400.0" y1="170.0" x2="432.0" y2="170.0" style="fill:none;stroke:var(--fig-red);stroke-width:2.4;stroke-linecap:butt"/>
  <path d="M440.0 170.0 L431.0 174.1 L431.0 165.9 Z" style="fill:var(--fig-red);stroke:none"/>
  <text x="416.0" y="158.0" text-anchor="middle" class="uphy6dopplerwavefronts-i" style="fill:var(--fig-red)">v<tspan baseline-shift="sub" font-size="11">S</tspan></text>
  <circle cx="640.0" cy="170.0" r="10.0" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2"/>
  <text x="640.0" y="200.0" text-anchor="middle" class="uphy6dopplerwavefronts-s" style="fill:var(--fig-green)">앞쪽 관찰자</text>
  <text x="640.0" y="218.0" text-anchor="middle" class="uphy6dopplerwavefronts-s" style="fill:var(--fig-green)">진동수 높게</text>
  <circle cx="40.0" cy="170.0" r="10.0" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2"/>
  <text x="40.0" y="200.0" text-anchor="middle" class="uphy6dopplerwavefronts-s" style="fill:var(--fig-green)">뒤쪽</text>
  <text x="40.0" y="218.0" text-anchor="middle" class="uphy6dopplerwavefronts-s" style="fill:var(--fig-green)">낮게</text>
  <line x1="426.0" y1="320.0" x2="438.0" y2="320.0" style="fill:none;stroke:var(--fig-violet);stroke-width:1.6;stroke-linecap:butt"/>
  <path d="M444.0 320.0 L437.0 323.1 L437.0 316.9 Z" style="fill:var(--fig-violet);stroke:none"/>
  <line x1="444.0" y1="320.0" x2="432.0" y2="320.0" style="fill:none;stroke:var(--fig-violet);stroke-width:1.6;stroke-linecap:butt"/>
  <path d="M426.0 320.0 L433.0 316.9 L433.0 323.1 Z" style="fill:var(--fig-violet);stroke:none"/>
  <line x1="426.0" y1="180.0" x2="426.0" y2="326.0" style="fill:none;stroke:var(--fig-violet);stroke-width:1;stroke-linecap:round;stroke-dasharray:2 3"/>
  <line x1="444.0" y1="180.0" x2="444.0" y2="326.0" style="fill:none;stroke:var(--fig-violet);stroke-width:1;stroke-linecap:round;stroke-dasharray:2 3"/>
  <line x1="228.0" y1="320.0" x2="276.0" y2="320.0" style="fill:none;stroke:var(--fig-violet);stroke-width:1.6;stroke-linecap:butt"/>
  <path d="M282.0 320.0 L275.0 323.1 L275.0 316.9 Z" style="fill:var(--fig-violet);stroke:none"/>
  <line x1="282.0" y1="320.0" x2="234.0" y2="320.0" style="fill:none;stroke:var(--fig-violet);stroke-width:1.6;stroke-linecap:butt"/>
  <path d="M228.0 320.0 L235.0 316.9 L235.0 323.1 Z" style="fill:var(--fig-violet);stroke:none"/>
  <line x1="228.0" y1="180.0" x2="228.0" y2="326.0" style="fill:none;stroke:var(--fig-violet);stroke-width:1;stroke-linecap:round;stroke-dasharray:2 3"/>
  <line x1="282.0" y1="180.0" x2="282.0" y2="326.0" style="fill:none;stroke:var(--fig-violet);stroke-width:1;stroke-linecap:round;stroke-dasharray:2 3"/>
  <text x="455.0" y="342.0" text-anchor="middle" class="uphy6dopplerwavefronts-i" style="fill:var(--fig-violet);font-size:14px">λ' = (v − v<tspan baseline-shift="sub" font-size="11">S</tspan>)/f</text>
  <text x="255.0" y="342.0" text-anchor="middle" class="uphy6dopplerwavefronts-i" style="fill:var(--fig-violet);font-size:14px">λ'' = (v + v<tspan baseline-shift="sub" font-size="11">S</tspan>)/f</text>
  <text x="360.0" y="22.0" text-anchor="middle" class="uphy6dopplerwavefronts-s">파면 사이 간격 = 한 주기 동안의 거리 (모식도, v<tspan baseline-shift="sub" font-size="11">S</tspan> = 0.5v)</text>
</svg>
