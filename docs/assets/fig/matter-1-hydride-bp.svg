<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-matter-1-hydride-bp d-matter-1-hydride-bp">
  <title id="t-matter-1-hydride-bp">그림 물질과 에너지 1-1 14~17족 수소 화합물의 끓는점</title>
  <desc id="d-matter-1-hydride-bp">주기가 커질수록 분자량이 커져 끓는점이 대체로 높아지지만, 2주기의 NH₃, H₂O, HF만은 수소 결합 때문에 경향에서 크게 벗어나 끓는점이 높다. 값은 본문 표의 대략적인 값이다.</desc>
  <style>
    .matter-1-hydride-bp-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.4}
    .matter-1-hydride-bp-gr{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4}
    .matter-1-hydride-bp-t{font-size:13px;fill:var(--fig-muted)}
    .matter-1-hydride-bp-l{font-size:13.5px;fill:var(--fig-ink)}
    .matter-1-hydride-bp-b{font-size:14px;font-weight:700;fill:var(--fig-ink)}
    .matter-1-hydride-bp-blue{fill:none;stroke:var(--fig-blue);stroke-width:2.4;stroke-linejoin:round}
    .matter-1-hydride-bp-dblue{fill:var(--fig-blue);stroke:var(--fig-panel);stroke-width:1.5}
    .matter-1-hydride-bp-xblue{font-size:13px;font-weight:600;fill:var(--fig-blue)}
    .matter-1-hydride-bp-green{fill:none;stroke:var(--fig-green);stroke-width:2.4;stroke-linejoin:round}
    .matter-1-hydride-bp-dgreen{fill:var(--fig-green);stroke:var(--fig-panel);stroke-width:1.5}
    .matter-1-hydride-bp-xgreen{font-size:13px;font-weight:600;fill:var(--fig-green)}
    .matter-1-hydride-bp-red{fill:none;stroke:var(--fig-red);stroke-width:2.4;stroke-linejoin:round}
    .matter-1-hydride-bp-dred{fill:var(--fig-red);stroke:var(--fig-panel);stroke-width:1.5}
    .matter-1-hydride-bp-xred{font-size:13px;font-weight:600;fill:var(--fig-red)}
    .matter-1-hydride-bp-violet{fill:none;stroke:var(--fig-violet);stroke-width:2.4;stroke-linejoin:round}
    .matter-1-hydride-bp-dviolet{fill:var(--fig-violet);stroke:var(--fig-panel);stroke-width:1.5}
    .matter-1-hydride-bp-xviolet{font-size:13px;font-weight:600;fill:var(--fig-violet)}
  </style>
  <rect x="76" y="44" width="128" height="182" rx="14" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4;stroke-dasharray:5 4"/>
  <line x1="70" y1="337.0" x2="600" y2="337.0" class="matter-1-hydride-bp-gr"/>
  <text x="62" y="341.5" text-anchor="end" class="matter-1-hydride-bp-t">−150</text>
  <line x1="70" y1="282.0" x2="600" y2="282.0" class="matter-1-hydride-bp-gr"/>
  <text x="62" y="286.5" text-anchor="end" class="matter-1-hydride-bp-t">−100</text>
  <line x1="70" y1="227.0" x2="600" y2="227.0" class="matter-1-hydride-bp-gr"/>
  <text x="62" y="231.5" text-anchor="end" class="matter-1-hydride-bp-t">−50</text>
  <line x1="70" y1="172.0" x2="600" y2="172.0" class="matter-1-hydride-bp-gr"/>
  <text x="62" y="176.5" text-anchor="end" class="matter-1-hydride-bp-t">0</text>
  <line x1="70" y1="117.0" x2="600" y2="117.0" class="matter-1-hydride-bp-gr"/>
  <text x="62" y="121.5" text-anchor="end" class="matter-1-hydride-bp-t">50</text>
  <line x1="70" y1="62.0" x2="600" y2="62.0" class="matter-1-hydride-bp-gr"/>
  <text x="62" y="66.5" text-anchor="end" class="matter-1-hydride-bp-t">100</text>
  <line x1="70" y1="172.0" x2="600" y2="172.0" style="fill:none;stroke:var(--fig-muted);stroke-width:1"/>
  <path d="M70 34 L70 380 L600 380" class="matter-1-hydride-bp-ax"/>
  <line x1="160" y1="380" x2="160" y2="386" class="matter-1-hydride-bp-ax"/>
  <text x="160" y="402" text-anchor="middle" class="matter-1-hydride-bp-l">2주기</text>
  <line x1="285" y1="380" x2="285" y2="386" class="matter-1-hydride-bp-ax"/>
  <text x="285" y="402" text-anchor="middle" class="matter-1-hydride-bp-l">3주기</text>
  <line x1="410" y1="380" x2="410" y2="386" class="matter-1-hydride-bp-ax"/>
  <text x="410" y="402" text-anchor="middle" class="matter-1-hydride-bp-l">4주기</text>
  <line x1="535" y1="380" x2="535" y2="386" class="matter-1-hydride-bp-ax"/>
  <text x="535" y="402" text-anchor="middle" class="matter-1-hydride-bp-l">5주기</text>
  <text x="335" y="424" text-anchor="middle" class="matter-1-hydride-bp-t">주기 (분자량이 커지는 방향 →)</text>
  <text x="20" y="24" class="matter-1-hydride-bp-b">끓는점 (°C)</text>
  <line x1="285" y1="238.0" x2="160" y2="260.0" style="fill:none;stroke:var(--fig-red);stroke-width:1.6;stroke-dasharray:4 4"/>
  <circle cx="160" cy="260.0" r="4.5" style="fill:var(--fig-panel);stroke:var(--fig-red);stroke-width:1.6"/>
  <text x="148" y="280.0" text-anchor="end" class="matter-1-hydride-bp-t">경향대로라면</text>
  <text x="148" y="296.0" text-anchor="end" class="matter-1-hydride-bp-t">약 −80 °C</text>
  <path d="M160 350.2 L285 295.2 L410 268.8 L535 229.2" class="matter-1-hydride-bp-blue"/>
  <path d="M160 208.3 L285 268.8 L410 240.2 L535 190.7" class="matter-1-hydride-bp-green"/>
  <path d="M160 62.0 L285 238.0 L410 217.1 L535 174.2" class="matter-1-hydride-bp-red"/>
  <path d="M160 150.0 L285 265.5 L410 245.7 L535 210.5" class="matter-1-hydride-bp-violet"/>
  <circle cx="160" cy="350.2" r="5" class="matter-1-hydride-bp-dblue"/>
  <circle cx="285" cy="295.2" r="5" class="matter-1-hydride-bp-dblue"/>
  <circle cx="410" cy="268.8" r="5" class="matter-1-hydride-bp-dblue"/>
  <circle cx="535" cy="229.2" r="5" class="matter-1-hydride-bp-dblue"/>
  <circle cx="160" cy="208.3" r="5" class="matter-1-hydride-bp-dgreen"/>
  <circle cx="285" cy="268.8" r="5" class="matter-1-hydride-bp-dgreen"/>
  <circle cx="410" cy="240.2" r="5" class="matter-1-hydride-bp-dgreen"/>
  <circle cx="535" cy="190.7" r="5" class="matter-1-hydride-bp-dgreen"/>
  <circle cx="160" cy="62.0" r="5" class="matter-1-hydride-bp-dred"/>
  <circle cx="285" cy="238.0" r="5" class="matter-1-hydride-bp-dred"/>
  <circle cx="410" cy="217.1" r="5" class="matter-1-hydride-bp-dred"/>
  <circle cx="535" cy="174.2" r="5" class="matter-1-hydride-bp-dred"/>
  <circle cx="160" cy="150.0" r="5" class="matter-1-hydride-bp-dviolet"/>
  <circle cx="285" cy="265.5" r="5" class="matter-1-hydride-bp-dviolet"/>
  <circle cx="410" cy="245.7" r="5" class="matter-1-hydride-bp-dviolet"/>
  <circle cx="535" cy="210.5" r="5" class="matter-1-hydride-bp-dviolet"/>
  <text x="150" y="354.7" text-anchor="end" class="matter-1-hydride-bp-xblue">CH₄ −162</text>
  <text x="150" y="212.8" text-anchor="end" class="matter-1-hydride-bp-xgreen">NH₃ −33</text>
  <text x="150" y="66.5" text-anchor="end" class="matter-1-hydride-bp-xred">H₂O 100</text>
  <text x="150" y="154.5" text-anchor="end" class="matter-1-hydride-bp-xviolet">HF 20</text>
  <text x="547" y="178.7" class="matter-1-hydride-bp-xred">16족 (H₂Te)</text>
  <text x="547" y="195.2" class="matter-1-hydride-bp-xgreen">15족 (SbH₃)</text>
  <text x="547" y="215.0" class="matter-1-hydride-bp-xviolet">17족 (HI)</text>
  <text x="547" y="233.7" class="matter-1-hydride-bp-xblue">14족 (SnH₄)</text>
  <text x="212" y="62" class="matter-1-hydride-bp-b" style="fill:var(--fig-amber)">수소 결합</text>
  <text x="212" y="80" class="matter-1-hydride-bp-t">2주기의 NH₃·H₂O·HF는</text>
  <text x="212" y="97" class="matter-1-hydride-bp-t">분자량이 가장 작은데도 끓는점이 높다</text>
  <text x="300" y="344" class="matter-1-hydride-bp-t">14족(무극성): 분산력만 → 주기 따라 고르게 ↑</text>
  <text x="300" y="362" class="matter-1-hydride-bp-t">15~17족(극성): 같은 주기의 14족보다 높다</text>
</svg>
