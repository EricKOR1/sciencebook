<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 190" class="fig-small" role="img" aria-labelledby="t-phy-1-q-head-on-collision d-phy-1-q-head-on-collision">
  <title id="t-phy-1-q-head-on-collision">그림 물리학 1-12 문제 7의 충돌 전 두 물체</title>
  <desc id="d-phy-1-q-head-on-collision">마찰이 없는 수평면에서 질량 4 kg인 A는 오른쪽으로 3 m/s, 질량 2 kg인 B는 왼쪽으로 3 m/s로 마주 보고 움직인다. 두 속도 화살표의 길이는 속력에 비례한다(같은 길이).</desc>
  <style>.phy-1-q-head-on-collision-t{font-size:14px;fill:var(--fig-ink)} .phy-1-q-head-on-collision-s{font-size:13px;fill:var(--fig-muted)} .phy-1-q-head-on-collision-b{font-weight:700} .phy-1-q-head-on-collision-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .phy-1-q-head-on-collision-r{fill:var(--fig-red)} .phy-1-q-head-on-collision-bl{fill:var(--fig-blue)} .phy-1-q-head-on-collision-g{fill:var(--fig-green)}</style>
  <line x1="15" y1="140" x2="455" y2="140" style="stroke:var(--fig-line);stroke-width:2;stroke-linecap:round"/>
  <rect x="70" y="84" width="80" height="56" rx="0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <text x="110" y="110" text-anchor="middle" class="phy-1-q-head-on-collision-h">A</text>
  <text x="110" y="128" text-anchor="middle" class="phy-1-q-head-on-collision-s">4 kg</text>
  <rect x="330" y="100" width="56" height="40" rx="0" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2"/>
  <text x="358" y="120" text-anchor="middle" class="phy-1-q-head-on-collision-h">B</text>
  <text x="358" y="135" text-anchor="middle" class="phy-1-q-head-on-collision-s">2 kg</text>
  <line x1="110" y1="64" x2="174" y2="64" style="stroke:var(--fig-red);stroke-width:3;stroke-linecap:butt"/>
  <path d="M185 64 L173 70.6 L173 57.4 Z" style="fill:var(--fig-red);stroke:none"/>
  <text x="147.5" y="54" text-anchor="middle" class="phy-1-q-head-on-collision-t">3 m/s</text>
  <line x1="358" y1="80" x2="294" y2="80" style="stroke:var(--fig-red);stroke-width:3;stroke-linecap:butt"/>
  <path d="M283 80 L295 73.4 L295 86.6 Z" style="fill:var(--fig-red);stroke:none"/>
  <text x="320.5" y="70" text-anchor="middle" class="phy-1-q-head-on-collision-t">3 m/s</text>
  <text x="235" y="166" text-anchor="middle" class="phy-1-q-head-on-collision-s">마찰이 없는 수평면</text>
</svg>
