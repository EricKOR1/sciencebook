<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-3-4-bounce-momentum d-3-4-bounce-momentum">
  <title id="t-3-4-bounce-momentum">그림 3-4-3 벽에 붙어 멈출 때와 튕겨 나올 때의 운동량 변화</title>
  <desc id="d-3-4-bounce-momentum">예제 3의 공(질량 0.5 kg, 속력 4 m/s)이 벽에 붙어 멈추면 운동량 변화량은 왼쪽으로 2 kg·m/s, 같은 속력으로 튕겨 나오면 왼쪽으로 4 kg·m/s이다. 화살표 길이는 운동량의 크기에 비례한다.</desc>
  <style>
    .f3-4-bounce-momentum-lbl{font-size:15px;fill:var(--fig-ink)} .f3-4-bounce-momentum-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .f3-4-bounce-momentum-sm{font-size:13px;fill:var(--fig-muted)} .f3-4-bounce-momentum-ink{font-size:13px;fill:var(--fig-ink)}
    .f3-4-bounce-momentum-ax{stroke:var(--fig-ink);stroke-width:1.5;fill:none} .f3-4-bounce-momentum-grid{stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 4;fill:none}
  </style>
<text x="300" y="36" text-anchor="middle" class="f3-4-bounce-momentum-b">처음 운동량</text><text x="450" y="36" text-anchor="middle" class="f3-4-bounce-momentum-b">나중 운동량</text><text x="615" y="36" text-anchor="middle" class="f3-4-bounce-momentum-b">운동량 변화량 = 충격량</text><line x1="215" y1="50" x2="705" y2="50" style="stroke:var(--fig-line);stroke-width:1"/><text x="18" y="75" class="f3-4-bounce-momentum-lbl" style="font-weight:600">① 벽에 붙어 멈출 때</text><rect x="176" y="91" width="14" height="74" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2"/><circle cx="160" cy="129" r="15" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/><line x1="28.0" y1="111.0" x2="119.0" y2="111.0" style="stroke:var(--fig-blue);stroke-width:2.5;fill:none"/><path d="M130.0 111.0 L119.0 117.0 L119.0 105.0 Z" style="fill:var(--fig-blue)"/><text x="30" y="103" class="f3-4-bounce-momentum-sm">들어올 때</text><text x="30" y="155" class="f3-4-bounce-momentum-sm">벽에 붙어 멈춤</text><line x1="270.0" y1="125.0" x2="319.0" y2="125.0" style="stroke:var(--fig-blue);stroke-width:4;fill:none"/><path d="M330.0 125.0 L319.0 131.0 L319.0 119.0 Z" style="fill:var(--fig-blue)"/><text x="300" y="153" text-anchor="middle" class="f3-4-bounce-momentum-ink">+2 kg·m/s</text><circle cx="450" cy="125" r="5" style="fill:var(--fig-ink)"/><text x="450" y="153" text-anchor="middle" class="f3-4-bounce-momentum-ink">0</text><line x1="645.0" y1="125.0" x2="596.0" y2="125.0" style="stroke:var(--fig-red);stroke-width:5;fill:none"/><path d="M585.0 125.0 L596.0 119.0 L596.0 131.0 Z" style="fill:var(--fig-red)"/><text x="615" y="153" text-anchor="middle" class="f3-4-bounce-momentum-ink">−2 kg·m/s</text><text x="615" y="171" text-anchor="middle" class="f3-4-bounce-momentum-sm">왼쪽으로 2 N·s</text><text x="18" y="185" class="f3-4-bounce-momentum-lbl" style="font-weight:600">② 같은 속력으로 튕겨 나올 때</text><rect x="176" y="201" width="14" height="74" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2"/><circle cx="160" cy="239" r="15" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/><line x1="28.0" y1="221.0" x2="119.0" y2="221.0" style="stroke:var(--fig-blue);stroke-width:2.5;fill:none"/><path d="M130.0 221.0 L119.0 227.0 L119.0 215.0 Z" style="fill:var(--fig-blue)"/><text x="30" y="213" class="f3-4-bounce-momentum-sm">들어올 때</text><line x1="130.0" y1="259.0" x2="39.0" y2="259.0" style="stroke:var(--fig-violet);stroke-width:2.5;fill:none"/><path d="M28.0 259.0 L39.0 253.0 L39.0 265.0 Z" style="fill:var(--fig-violet)"/><text x="30" y="279" class="f3-4-bounce-momentum-sm">나갈 때</text><line x1="270.0" y1="235.0" x2="319.0" y2="235.0" style="stroke:var(--fig-blue);stroke-width:4;fill:none"/><path d="M330.0 235.0 L319.0 241.0 L319.0 229.0 Z" style="fill:var(--fig-blue)"/><text x="300" y="263" text-anchor="middle" class="f3-4-bounce-momentum-ink">+2 kg·m/s</text><line x1="480.0" y1="235.0" x2="431.0" y2="235.0" style="stroke:var(--fig-violet);stroke-width:4;fill:none"/><path d="M420.0 235.0 L431.0 229.0 L431.0 241.0 Z" style="fill:var(--fig-violet)"/><text x="450" y="263" text-anchor="middle" class="f3-4-bounce-momentum-ink">−2 kg·m/s</text><line x1="675.0" y1="235.0" x2="566.0" y2="235.0" style="stroke:var(--fig-red);stroke-width:5;fill:none"/><path d="M555.0 235.0 L566.0 229.0 L566.0 241.0 Z" style="fill:var(--fig-red)"/><text x="615" y="263" text-anchor="middle" class="f3-4-bounce-momentum-ink">−4 kg·m/s</text><text x="615" y="281" text-anchor="middle" class="f3-4-bounce-momentum-sm">왼쪽으로 4 N·s</text><text x="360" y="306" text-anchor="middle" class="f3-4-bounce-momentum-sm">오른쪽을 (+)로 정했다. 튕겨 나오면 멈추는 데 더해 반대로 다시 가속해야 하므로 운동량 변화량이 2배가 된다.</text></svg>
