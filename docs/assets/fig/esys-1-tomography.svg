<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-esys-1-tomography d-esys-1-tomography">
  <title id="t-esys-1-tomography">그림 지구시스템과학 1-9 지진파 단층 촬영으로 본 맨틀</title>
  <desc id="d-esys-1-tomography">지구를 자른 단면에 지진파 속도가 평균보다 빠른 곳(파랑, 차갑고 단단함)과 느린 곳(빨강, 뜨겁고 무름)을 나타낸 모식도이다. 해구에서 섭입한 판은 빠른 영역으로 보이며 아시아 아래의 약 660 km 깊이에 쌓이거나 맨틀–핵 경계까지 가라앉고(차가운 플룸), 남태평양과 아프리카 아래에는 맨틀–핵 경계에서 솟아오르는 거대한 느린 영역(뜨거운 플룸)이 있다. 하와이 아래로 이어지는 좁은 느린 영역은 열점을 만드는 플룸이다.</desc>
  <style>
    .esys-1-tomography-t{font-size:13px;fill:var(--fig-ink)}
    .esys-1-tomography-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .esys-1-tomography-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .esys-1-tomography-s{font-size:13px;fill:var(--fig-muted)}
    .esys-1-tomography-r{font-size:13px;font-weight:600;fill:var(--fig-red)}
    .esys-1-tomography-u{font-size:13px;font-weight:600;fill:var(--fig-blue)}
    .esys-1-tomography-g{font-size:13px;font-weight:600;fill:var(--fig-green)}
    .esys-1-tomography-a{font-size:13px;font-weight:600;fill:var(--fig-amber)}
    .esys-1-tomography-v{font-size:13px;font-weight:600;fill:var(--fig-violet)}
    .esys-1-tomography-e{font-size:13px;font-weight:600;fill:var(--fig-teal)}
    .esys-1-tomography-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
<circle cx="250" cy="205" r="180" style="fill:var(--fig-soft-amber);stroke:var(--fig-ink);stroke-width:1.5"/><circle cx="250" cy="205" r="161.4" style="fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:5 4"/><circle cx="250" cy="205" r="98.3" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5"/><circle cx="250" cy="205" r="34.5" style="fill:var(--fig-panel);stroke:var(--fig-violet);stroke-width:1"/><text x="250.0" y="209.0" text-anchor="middle" class="esys-1-tomography-s">내핵</text><text x="250.0" y="128.7" text-anchor="middle" class="esys-1-tomography-v">외핵</text><polygon points="343.5,235.4 374.5,236.0 396.0,215.2 398.9,184.1 385.4,161.0 385.5,144.7 406.4,128.7 400.7,118.0 373.0,122.1 349.8,115.1 318.3,134.3" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5"/><polygon points="151.7,201.6 117.8,209.6 100.3,242.3 110.2,279.3 139.8,304.2 175.8,307.2 197.9,288.4" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5"/><polygon points="206.5,379.7 220.2,358.1 228.8,355.5 236.4,360.4 243.7,384.9" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5"/><polygon points="408.9,289.5 391.4,270.9 390.9,261.9 397.5,255.8 423.0,254.6" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5"/><polygon points="240.6,25.2 229.8,40.2 210.5,46.5 140.7,83.6 151.4,95.5 221.9,60.4 244.3,43.1 250.0,29.0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/><polygon points="180.8,74.9 191.7,118.5 189.5,127.5 174.7,141.8 171.0,133.9 159.3,88.9" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/><polygon points="348.0,356.0 330.5,350.2 297.3,335.0 273.8,300.4 260.3,302.8 282.0,343.7 315.1,351.2 355.9,345.6" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/><text x="423.1" y="117.0" class="esys-1-tomography-a">하와이(열점)</text><text x="239.7" y="13.3" text-anchor="middle" class="esys-1-tomography-u">일본 해구</text><text x="146.1" y="42.8" text-anchor="end" class="esys-1-tomography-t">아시아</text><text x="76.9" y="301.0" text-anchor="end" class="esys-1-tomography-t">아프리카</text><text x="222.7" y="403.1" text-anchor="middle" class="esys-1-tomography-r">대서양 중앙 해령</text><text x="362.4" y="369.6" class="esys-1-tomography-u">남아메리카 해구</text><text x="431.7" y="282.4" class="esys-1-tomography-r">동태평양 해령</text><text x="348.0" y="39.3" class="esys-1-tomography-t">태평양</text><polygon points="402.9,122.5 414.9,122.5 410.9,111.5" style="fill:var(--fig-red)"/><text x="104.4" y="145.8" class="esys-1-tomography-s">660 km</text><rect x="470" y="40" width="22" height="16" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/><text x="500.0" y="53.0" class="esys-1-tomography-u">지진파가 평균보다 빠름</text><text x="500.0" y="72.0" class="esys-1-tomography-s">→ 차갑고 단단함</text><text x="500.0" y="90.0" class="esys-1-tomography-t">섭입한 판, 차가운 플룸</text><rect x="470" y="112" width="22" height="16" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5"/><text x="500.0" y="125.0" class="esys-1-tomography-r">지진파가 평균보다 느림</text><text x="500.0" y="144.0" class="esys-1-tomography-s">→ 뜨겁고 무름</text><text x="500.0" y="162.0" class="esys-1-tomography-t">해령 아래, 뜨거운 플룸</text><line x1="470" y1="190" x2="492" y2="190" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:5 4"/><text x="500.0" y="194.0" class="esys-1-tomography-s">상부·하부 맨틀 경계(약 660 km)</text><rect x="470" y="208" width="22" height="16" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet)"/><text x="500.0" y="221.0" class="esys-1-tomography-s">핵(맨틀–핵 경계 약 2900 km)</text><text x="470.0" y="262.0" class="esys-1-tomography-t">• 섭입한 판이 660 km 부근에</text><text x="480.0" y="280.0" class="esys-1-tomography-t">수평으로 쌓인 모습</text><text x="470.0" y="302.0" class="esys-1-tomography-t">• 아프리카·남태평양 아래</text><text x="480.0" y="320.0" class="esys-1-tomography-t">거대한 저속도 영역</text><text x="470.0" y="342.0" class="esys-1-tomography-t">• 하와이 아래로 이어지는</text><text x="480.0" y="360.0" class="esys-1-tomography-t">좁은 저속도 기둥</text><text x="250.0" y="394.0" text-anchor="middle" class="esys-1-tomography-s">깊이와 크기는 단순화한 단면 모식도</text></svg>
