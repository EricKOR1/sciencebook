    .esys-1-tomography-v{font-size:13px;font-weight:600;fill:var(--fig-violet)}
    .esys-1-tomography-e{font-size:13px;font-weight:600;fill:var(--fig-teal)}
    .esys-1-tomography-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
