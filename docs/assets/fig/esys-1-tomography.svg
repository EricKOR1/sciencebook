<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" role="img" aria-labelledby="t-esys-1-tomography d-esys-1-tomography">
  <title id="t-esys-1-tomography">그림 지구시스템과학 1-9 지진파 단층 촬영으로 본 맨틀</title>
  <desc id="d-esys-1-tomography">지구를 자른 단면에 지진파 속도가 평균보다 빠른 곳(파랑, 차갑고 단단함)과 느린 곳(빨강, 뜨겁고 무름)을 나타낸 모식도이다. 해구에서 섭입한 판은 빠른 영역으로 보이며 아시아 아래의 약 660 km 깊이에 쌓이거나 맨틀–핵 경계까지 가라앉고(차가운 플룸), 남태평양과 아프리카 아래에는 맨틀–핵 경계에서 솟아오르는 거대한 느린 영역(뜨거운 플룸)이 있다. 하와이 아래로 이어지는 좁은 느린 영역은 열점을 만드는 플룸이다.</desc>
