<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-pchem-9-h2-d2-potential d-pchem-9-h2-d2-potential">
  <title id="t-pchem-9-h2-d2-potential">그림 물리화학 9-7 H₂와 D₂가 공유하는 퍼텐셜 에너지 곡선</title>
  <desc id="d-pchem-9-h2-d2-potential">모스 곡선 U = 4.748[(1 − e^(−a(R − 74.1)))² − 1] eV, a = 0.0194 pm⁻¹ (해리 극한 H + H를 0으로). 곡선의 깊이 De = 4.748 eV는 두 분자에 공통이지만, 영점 에너지는 H₂ 0.273 eV, D₂ 0.193 eV로 달라 D₀가 H₂ 4.475 eV, D₂ 4.555 eV가 된다(예제 10, 실험 4.478, 4.556 eV).</desc>
