<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-uearth-5-unconformities d-uearth-5-unconformities">
<title id="t-uearth-5-unconformities">그림 일반지구과학 5-4 부정합의 세 종류</title>
<desc id="d-uearth-5-unconformities">경사 부정합은 기울거나 습곡된 지층 위에 수평한 지층이, 평행 부정합은 나란한 지층 사이에 울퉁불퉁한 침식면과 기저 역암이, 난정합은 화성암이나 변성암 위에 퇴적층이 놓인다. 빨간 선이 부정합면으로, 퇴적이 멈추고 침식된 시간의 공백을 뜻한다. 모식도이다.</desc>
