<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-4-4-q-xy-curves d-4-4-q-xy-curves">
  <title id="t-4-4-q-xy-curves">그림 4-4-9 문제 14 해설 X, Y를 넣을 때의 온도 변화</title>
  <desc id="d-4-4-q-xy-curves">염산 20 mL에 X를 넣으면 10 mL에서, Y를 넣으면 40 mL에서 온도가 가장 높다. 발생한 중화열은 같지만 혼합 용액의 양이 30 mL와 60 mL이므로 오른 온도는 약 2 : 1이다. 중화점 이후에는 같은 열을 더 많은 용액이 나누므로 두 곡선이 같은 선을 따라 내려간다. 열 손실 없음, 비열·밀도는 물과 같다고 가정한 모식 그래프.</desc>
