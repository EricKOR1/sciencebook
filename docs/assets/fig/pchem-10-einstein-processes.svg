<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-pchem-10-einstein-processes d-pchem-10-einstein-processes">
  <title id="t-pchem-10-einstein-processes">그림 물리화학 10-1 흡수, 유도 방출, 자발 방출</title>
  <desc id="d-pchem-10-einstein-processes">두 준위 E₁ &lt; E₂ 사이의 세 과정. 흡수는 광자 hν 하나를 받아 분자가 E₁에서 E₂로 올라가고(속도 B₁₂ρN₁), 유도 방출은 들어온 광자가 E₂의 분자를 E₁로 내려보내며 같은 방향·같은 위상의 광자 두 개가 나가고(B₂₁ρN₂), 자발 방출은 빛이 없어도 E₂의 분자가 내려오며 임의의 방향으로 광자 하나를 낸다(A₂₁N₂). 속이 빈 점선 원은 전이 전의 자리이다.</desc>
