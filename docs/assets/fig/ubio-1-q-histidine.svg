<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="t-ubio-1-q-histidine d-ubio-1-q-histidine">
  <title id="t-ubio-1-q-histidine">그림 일반생명과학 1-9 예제 6 히스티딘 곁사슬의 양성자화</title>
  <desc id="d-ubio-1-q-histidine">히스티딘 곁사슬의 고리(이미다졸)에서 질소 하나에 H⁺이 붙은 형 (가)는 양전하를 띠고, H⁺이 떨어진 형 (나)는 전하가 없다. 두 형은 평형을 이루며 이 곁사슬의 pKa는 약 6.0이다. 선 하나는 단일 결합, 두 줄은 이중 결합이다.</desc>
