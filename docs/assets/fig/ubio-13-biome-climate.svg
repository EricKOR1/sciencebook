<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" role="img" aria-labelledby="t-ubio-13-biome-climate d-ubio-13-biome-climate">
  <title id="t-ubio-13-biome-climate">그림 일반생명과학 13-2 연평균 기온과 연 강수량에 따른 육상 생물 군계</title>
  <desc id="d-ubio-13-biome-climate">가로축은 연평균 기온, 세로축은 연 강수량이다. 추운 곳에서 따뜻한 곳으로 가며 툰드라, 북방 침엽수림, 온대, 열대 군계가 나타나고, 같은 기온에서도 강수량이 적으면 사막·초원, 많으면 숲이 된다. 예제 1의 세 지역 (가)(나)(다)를 점으로 표시했다. 경계는 대략적인 모식도이다.</desc>
