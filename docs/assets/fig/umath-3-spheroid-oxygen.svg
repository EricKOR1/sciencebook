<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="t-umath-3-spheroid-oxygen d-umath-3-spheroid-oxygen">
  <title id="t-umath-3-spheroid-oxygen">그림 수학 도구 3-11 세포 덩어리 속 산소 농도 분포</title>
  <desc id="d-umath-3-spheroid-oxygen">c(r) = c_s − Q(R² − r²)/(6D)를 c_s = 0.20 mol/m³, Q = 0.020 mol/(m³·s), D = 2.0×10⁻⁹ m²/s로 계산한 곡선. 반지름 R = 100, 200, 346 μm일 때 중심 농도는 약 0.183, 0.133, 0 mol/m³이다. R = 346 μm(R_max)이면 중심의 산소가 막 바닥난다. 오른쪽은 세포 덩어리 단면 모식도이다.</desc>
