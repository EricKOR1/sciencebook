<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uchem-6-solubility-temperature d-uchem-6-solubility-temperature">
  <title id="t-uchem-6-solubility-temperature">그림 일반화학 6-7 온도에 따른 고체와 기체의 용해도</title>
  <desc id="d-uchem-6-solubility-temperature">왼쪽: 물 100 g에 녹는 고체의 최대 질량. 질산 칼륨은 온도가 오를수록 용해도가 크게 늘지만 염화 나트륨은 거의 변하지 않는다. 오른쪽: 공기(산소 부분 압력 약 0.21 atm)와 평형을 이룬 물에 녹은 산소의 양. 기체의 용해도는 온도가 오를수록 줄어든다. 자료는 대표적인 문헌값을 어림한 것이다.</desc>
  <style>
    .uchem-6-solubility-temperature-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-6-solubility-temperature-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-6-solubility-temperature-b{font-size:15px;fill:var(--fig-ink);font-weight:bold}
    .uchem-6-solubility-temperature-ax{stroke:var(--fig-ink);stroke-width:1.2;fill:none}
    .uchem-6-solubility-temperature-gr{stroke:var(--fig-line);stroke-width:0.6;fill:none;stroke-dasharray:2 3}

    .uchem-6-solubility-temperature-k{stroke:var(--fig-red);stroke-width:2.4;fill:none}
    .uchem-6-solubility-temperature-n{stroke:var(--fig-blue);stroke-width:2.4;fill:none}
    .uchem-6-solubility-temperature-o{stroke:var(--fig-teal);stroke-width:2.4;fill:none}
  </style>
