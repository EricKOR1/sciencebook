<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-ochem-8-benzene-mo d-ochem-8-benzene-mo">
  <title id="t-ochem-8-benzene-mo">그림 유기화학 8-13 벤젠의 π 분자 오비탈</title>
  <desc id="d-ochem-8-benzene-mo">왼쪽: 프로스트 원(육각형, 꼭짓점 하나가 아래)에서 읽은 여섯 준위 α + 2β, α + β(2겹), α − β(2겹), α − 2β. π 전자 6개가 결합성 오비탈 셋을 채운다. 오른쪽: 고리를 위에서 본 각 오비탈의 p 오비탈 위쪽 엽(파랑 +, 호박색 −, 원의 크기 ∝ |계수|)과 마디면(점선). ψ1은 모두 같은 부호, ψ2 = (2, 1, −1, −2, −1, 1)/√12와 ψ3 = (0, 1, 1, 0, −1, −1)/2는 마디면 1개(ψ3의 계수 0인 탄소는 엽 없음), ψ4·ψ5는 마디면 2개, ψ6은 부호가 번갈아 마디면 3개.</desc>
