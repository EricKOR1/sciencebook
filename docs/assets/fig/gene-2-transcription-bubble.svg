<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-gene-2-transcription-bubble d-gene-2-transcription-bubble">
  <title id="t-gene-2-transcription-bubble">그림 생물의 유전 2-3 전사 — RNA 중합 효소가 주형 가닥을 읽는 모습</title>
  <desc id="d-gene-2-transcription-bubble">RNA 중합 효소가 프로모터에 결합한 뒤 DNA 이중 나선을 풀고 오른쪽으로 이동하며 전사한다. 아래쪽 주형 가닥(3′-TACAAGCCGG…-5′)을 3′→5′ 방향으로 읽어 상보적인 리보뉴클레오타이드를 RNA의 3′ 끝에 이어 붙이므로, RNA는 5′-AUGUUCGGC…-3′처럼 5′→3′ 방향으로 길어진다. 위쪽 암호 가닥의 서열은 RNA와 같고 T 대신 U인 것만 다르다. 모식도이다.</desc>
