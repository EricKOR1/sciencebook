<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-pchem-10-combination-differences d-pchem-10-combination-differences">
  <title id="t-pchem-10-combination-differences">그림 물리화학 10-8 결합 차이법</title>
  <desc id="d-pchem-10-combination-differences">아래는 v = 0, 위는 v = 1의 회전 준위 J = 0~3(B₁ &amp;lt; B₀이라 위쪽 간격이 조금 좁다. 간격 차이와 진동 간격은 모식적으로 그렸다). 파란 묶음: R(0)과 P(2)는 같은 위 준위 (v = 1, J = 1)로 가므로 두 선의 차는 아래 준위 J = 0과 J = 2의 간격 6B₀이다. 빨간 묶음: R(1)과 P(1)은 같은 아래 준위 (v = 0, J = 1)에서 출발하므로 두 선의 차는 위 준위 J = 2와 J = 0의 간격 6B₁이다.</desc>
