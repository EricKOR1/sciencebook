<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="t-1-1-eratosthenes d-1-1-eratosthenes">
  <title id="t-1-1-eratosthenes">그림 1-1-3 에라토스테네스의 지구 둘레 측정</title>
  <desc id="d-1-1-eratosthenes">햇빛은 나란하게 들어오므로, 알렉산드리아의 막대와 햇빛이 이루는 각은 두 도시가 지구 중심에서 벌어진 각과 같다. 이 각이 7.2°(360°의 50분의 1)이므로 지구 둘레는 두 도시 사이 거리의 50배이다. 모식도(각과 크기는 알아보기 쉽게 과장함).</desc>
  <style>
    .er11-lbl{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .er11-txt{font-size:14px;fill:var(--fig-ink)}
    .er11-sm{font-size:13px;fill:var(--fig-muted)}
    .er11-ray{stroke:var(--fig-amber);stroke-width:2;fill:none}
    .er11-rad{stroke:var(--fig-muted);stroke-width:1.5;fill:none;stroke-dasharray:6 4}
    .er11-ang{stroke:var(--fig-red);stroke-width:2;fill:none}
    .er11-angt{font-size:14px;font-weight:600;fill:var(--fig-red)}
  </style>
  <circle cx="220" cy="250" r="160" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <text x="160" y="320" class="er11-lbl">지구</text>
  <line x1="220" y1="250" x2="380" y2="250" class="er11-rad"/>
  <line x1="220" y1="250" x2="363.8" y2="179.9" class="er11-rad"/>
  <circle cx="220" cy="250" r="3.5" style="fill:var(--fig-ink)"/>
  <text x="208" y="270" class="er11-sm" text-anchor="middle">중심</text>
  <path d="M266 250 A46 46 0 0 0 261.3 229.8" class="er11-ang"/>
  <text x="272" y="242" class="er11-angt">7.2°</text>
  <line x1="363.8" y1="179.9" x2="405.2" y2="159.7" style="stroke:var(--fig-ink);stroke-width:4;stroke-linecap:round"/>
  <path d="M363.8 179.9 A160 160 0 0 0 352.1 159.7" style="stroke:var(--fig-ink);stroke-width:6;fill:none;opacity:0.55"/>
  <line x1="700" y1="159.7" x2="352.1" y2="159.7" class="er11-ray"/>
  <path d="M354.1 159.7 l10 -5 v10 z" style="fill:var(--fig-amber)"/>
  <path d="M375.2 159.7 A30 30 0 0 0 378.2 172.8" class="er11-ang"/>
  <text x="351.2" y="151.7" class="er11-angt">7.2°</text>
  <rect x="358" y="243" width="22" height="14" style="fill:var(--fig-paper);stroke:var(--fig-ink);stroke-width:1.5"/>
  <line x1="700" y1="250" x2="360" y2="250" class="er11-ray"/>
  <path d="M360 250 l10 -5 v10 z" style="fill:var(--fig-amber)"/>
  <line x1="700" y1="110" x2="301.5" y2="110" class="er11-ray" style="opacity:0.5"/>
  <text x="690" y="100" text-anchor="end" class="er11-lbl" style="fill:var(--fig-amber)">햇빛 (나란하게 들어옴) ←</text>
  <circle cx="363.8" cy="179.9" r="4" style="fill:var(--fig-red)"/>
  <circle cx="380" cy="250" r="4" style="fill:var(--fig-red)"/>
  <text x="413.2" y="131.7" class="er11-lbl">알렉산드리아</text>
  <text x="413.2" y="148.7" class="er11-sm">막대에 그림자가 생긴다</text>
  <text x="394" y="276" class="er11-lbl">시에네</text>
  <text x="394" y="293" class="er11-sm">해가 우물 바닥까지 비친다</text>
  <path d="M396 250 A176 176 0 0 0 378.2 172.8" style="stroke:var(--fig-green);stroke-width:2.5;fill:none"/>
  <text x="401.2" y="213.2" class="er11-txt" style="fill:var(--fig-green);font-weight:600">두 도시 사이 거리</text>
  <rect x="420" y="318" width="290" height="116" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <text x="565" y="346" text-anchor="middle" class="er11-txt">햇빛이 나란하므로 두 7.2°는 같은 각</text>
  <text x="565" y="371" text-anchor="middle" class="er11-txt">7.2° = 360° ÷ 50</text>
  <text x="565" y="396" text-anchor="middle" class="er11-lbl">지구 둘레 = 두 도시 사이 거리 × 50</text>
  <text x="565" y="421" text-anchor="middle" class="er11-sm">각과 크기는 과장한 모식도</text>
</svg>
