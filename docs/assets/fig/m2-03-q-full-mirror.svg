  <title id="t-m2-03-q-full-mirror">그림 중2-3-14 문제 15 해설: 전신을 보는 데 필요한 거울</title>
  <desc id="d-m2-03-q-full-mirror">발끝(빨강)과 정수리(파랑)에서 나온 빛이 거울에서 반사되어 눈(높이 150 cm)에 들어온다. 반사점은 눈과 거울 뒤 상의 각 점을 이은 선이 거울면과 만나는 곳으로, 높이 75 cm와 155 cm이다. 거울은 그 사이 80 cm만 있으면 된다. 높이(cm)는 비율에 맞게 그렸다.</desc>
