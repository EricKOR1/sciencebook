<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-5-4-q-hydro-vs-tidal d-5-4-q-hydro-vs-tidal">
  <title id="t-5-4-q-hydro-vs-tidal">그림 5-4-7 문제 13 해설: 물을 높은 곳으로 올려놓는 것의 차이</title>
  <desc id="d-5-4-q-hydro-vs-tidal">왼쪽 수력 발전에서는 태양 복사 에너지가 바닷물을 증발시키고, 수증기가 구름이 되어 산 위에 비로 내려 저수지에 물이 고인다. 오른쪽 조력 발전에서는 달(과 태양)의 인력으로 밀물 때 바닷물이 높아져 저수지(만)에 물이 들어오고, 썰물 때 높이 차로 물이 빠져나가며 수차를 돌린다. 모식도이다.</desc>
  <style>.f5-4-q-hydro-vs-tidal-sea{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.2} .f5-4-q-hydro-vs-tidal-land{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.2} .f5-4-q-hydro-vs-tidal-dam{fill:var(--fig-muted);stroke:var(--fig-ink);stroke-width:1.2} .f5-4-q-hydro-vs-tidal-cloud{fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.3} .f5-4-q-hydro-vs-tidal-sun{fill:#ffc83d;stroke:var(--fig-ink);stroke-width:1} .f5-4-q-hydro-vs-tidal-moon{fill:#d9d9d9;stroke:var(--fig-ink);stroke-width:1} .f5-4-q-hydro-vs-tidal-ev{stroke:var(--fig-red);stroke-width:2;fill:none} .f5-4-q-hydro-vs-tidal-evh{fill:var(--fig-red)} .f5-4-q-hydro-vs-tidal-rn{stroke:var(--fig-blue);stroke-width:1.6} .f5-4-q-hydro-vs-tidal-fl{stroke:var(--fig-blue);stroke-width:2.4;fill:none} .f5-4-q-hydro-vs-tidal-flh{fill:var(--fig-blue)} .f5-4-q-hydro-vs-tidal-gv{stroke:var(--fig-violet);stroke-width:2;fill:none;stroke-dasharray:6 4} .f5-4-q-hydro-vs-tidal-gvh{fill:var(--fig-violet)} .f5-4-q-hydro-vs-tidal-tu{fill:var(--fig-paper);stroke:var(--fig-ink);stroke-width:1.4} .f5-4-q-hydro-vs-tidal-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .f5-4-q-hydro-vs-tidal-t{font-size:13px;fill:var(--fig-ink)} .f5-4-q-hydro-vs-tidal-k{font-size:14px;font-weight:700} .f5-4-q-hydro-vs-tidal-s{font-size:13px;fill:var(--fig-muted)}</style>
  <text x="180" y="24" text-anchor="middle" class="f5-4-q-hydro-vs-tidal-h">(가) 수력 발전</text>
