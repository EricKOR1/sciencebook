  <text x="563" y="326" text-anchor="middle" class="f5-4-q-hydro-vs-tidal-s">방조제·수차</text>
  <path d="M630 84 Q560 110 490 186" class="f5-4-q-hydro-vs-tidal-gv"/><path d="M486 190 L496.6 186.5 L489.5 179.4 Z" class="f5-4-q-hydro-vs-tidal-gvh"/>
