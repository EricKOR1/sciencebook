<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" role="img" aria-labelledby="t-phy-1-q-two-boxes-fbd d-phy-1-q-two-boxes-fbd">
  <title id="t-phy-1-q-two-boxes-fbd">그림 물리학 1-5 예제 4에서 A와 B가 받는 수평 방향의 힘</title>
  <desc id="d-phy-1-q-two-boxes-fbd">A만 떼어 보면 손이 미는 힘 10 N(오른쪽)과 B가 미는 힘 6 N(왼쪽)을 받아 알짜힘이 오른쪽으로 4 N이다. B만 떼어 보면 A가 미는 힘 6 N(오른쪽)만 받는다. 화살표 길이는 힘의 크기에 비례하며, 연직 방향의 중력과 바닥이 떠받치는 힘은 생략했다.</desc>
  <style>.phy-1-q-two-boxes-fbd-t{font-size:14px;fill:var(--fig-ink)} .phy-1-q-two-boxes-fbd-s{font-size:13px;fill:var(--fig-muted)} .phy-1-q-two-boxes-fbd-b{font-weight:700} .phy-1-q-two-boxes-fbd-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .phy-1-q-two-boxes-fbd-r{fill:var(--fig-red)} .phy-1-q-two-boxes-fbd-bl{fill:var(--fig-blue)} .phy-1-q-two-boxes-fbd-g{fill:var(--fig-green)}</style>
  <text x="180" y="30" text-anchor="middle" class="phy-1-q-two-boxes-fbd-h">A만 떼어 본 힘</text>
  <rect x="175" y="80" width="70" height="60" rx="0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <text x="210" y="116" text-anchor="middle" class="phy-1-q-two-boxes-fbd-h">A</text>
  <line x1="35" y1="110" x2="164" y2="110" style="stroke:var(--fig-red);stroke-width:3;stroke-linecap:butt"/>
  <path d="M175 110 L163 116.6 L163 103.4 Z" style="fill:var(--fig-red);stroke:none"/>
  <text x="105" y="100" text-anchor="middle" class="phy-1-q-two-boxes-fbd-t">손 → A 10 N</text>
  <line x1="329" y1="110" x2="256" y2="110" style="stroke:var(--fig-amber);stroke-width:3;stroke-linecap:butt"/>
  <path d="M245 110 L257 103.4 L257 116.6 Z" style="fill:var(--fig-amber);stroke:none"/>
  <text x="287" y="100" text-anchor="middle" class="phy-1-q-two-boxes-fbd-t">B → A 6 N</text>
  <text x="180" y="172" text-anchor="middle" class="phy-1-q-two-boxes-fbd-t">알짜힘: 10 − 6 = 4 N (오른쪽)</text>
  <text x="180" y="192" text-anchor="middle" class="phy-1-q-two-boxes-fbd-s">→ a = 4 ÷ 2 = 2 m/s²</text>
  <line x1="400" y1="20" x2="400" y2="195" style="stroke:var(--fig-line);stroke-width:1;stroke-linecap:round;stroke-dasharray:4 4"/>
  <text x="560" y="30" text-anchor="middle" class="phy-1-q-two-boxes-fbd-h">B만 떼어 본 힘</text>
  <rect x="560" y="80" width="70" height="60" rx="0" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2"/>
  <text x="595" y="116" text-anchor="middle" class="phy-1-q-two-boxes-fbd-h">B</text>
  <line x1="476" y1="110" x2="549" y2="110" style="stroke:var(--fig-amber);stroke-width:3;stroke-linecap:butt"/>
  <path d="M560 110 L548 116.6 L548 103.4 Z" style="fill:var(--fig-amber);stroke:none"/>
  <text x="518" y="100" text-anchor="middle" class="phy-1-q-two-boxes-fbd-t">A → B 6 N</text>
  <text x="560" y="172" text-anchor="middle" class="phy-1-q-two-boxes-fbd-t">알짜힘: 6 N (오른쪽)</text>
  <text x="560" y="192" text-anchor="middle" class="phy-1-q-two-boxes-fbd-s">→ a = 6 ÷ 3 = 2 m/s²</text>
</svg>
