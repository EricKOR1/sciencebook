<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-uchem-7-q-catalyst-energies d-uchem-7-q-catalyst-energies">
  <title id="t-uchem-7-q-catalyst-energies">그림 일반화학 7-12 문제 12의 에너지 그림(눈금은 실제 비율)</title>
  <desc id="d-uchem-7-q-catalyst-energies">반응물을 0으로 잡은 에너지 그림이다. 촉매가 없을 때 전이 상태는 120 kJ/mol, 촉매가 있을 때 80 kJ/mol이고 생성물은 −40 kJ/mol이다. 고개가 40 kJ/mol 낮아지면 정반응과 역반응의 활성화 에너지가 똑같이 40 kJ/mol 줄어든다.</desc>
