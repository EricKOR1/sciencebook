<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 636" role="img" aria-labelledby="t-uearth-3-orogen d-uearth-3-orogen">
  <title id="t-uearth-3-orogen">그림 일반지구과학 3-10 조산대의 세 가지 유형</title>
  <desc id="d-uearth-3-orogen">(가) 해양판이 대륙 아래로 섭입하는 안데스형: 해구, 화산호와 화강암 저반, 대륙 쪽 습곡·충상 단층대. (나) 부가형: 섭입대로 실려 온 해산·호상 열도·지괴가 대륙 가장자리에 차례로 덧붙는다. (다) 대륙–대륙 충돌형: 대양이 닫히고 두 대륙이 충돌하여 충상 단층으로 겹쳐 쌓이고 지각이 두꺼워지며, 사라진 바다의 흔적인 봉합대와 오피올라이트가 남는다.</desc>
  <defs><marker id="uearth-3-orogen-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-ink)"/></marker>
  <marker id="uearth-3-orogen-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-red)"/></marker></defs>
  <style>
    .uearth-3-orogen-h{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .uearth-3-orogen-l{font-size:13px;fill:var(--fig-ink)}
    .uearth-3-orogen-s{font-size:13px;fill:var(--fig-muted)}
    .uearth-3-orogen-w{fill:var(--fig-soft-blue);stroke:none}
    .uearth-3-orogen-oc{fill:var(--fig-teal);stroke:var(--fig-teal);stroke-width:1}
    .uearth-3-orogen-ml{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1}
    .uearth-3-orogen-cc{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5}
    .uearth-3-orogen-cc2{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5}
    .uearth-3-orogen-bt{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5}
    .uearth-3-orogen-v{fill:var(--fig-red);stroke:none}
    .uearth-3-orogen-t{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
    .uearth-3-orogen-k{stroke:var(--fig-ink);stroke-width:2;fill:none}
    .uearth-3-orogen-mg{stroke:var(--fig-red);stroke-width:1.8;stroke-dasharray:4 3;fill:none}
    .uearth-3-orogen-ter1{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.5}
    .uearth-3-orogen-op{fill:var(--fig-green);stroke:none}
  </style>
<g transform="translate(0 0)">
<text x="16" y="24" class="uearth-3-orogen-h">(가) 해양판–대륙판 섭입형 · 안데스산맥</text>
<rect x="16" y="62" width="250" height="16" class="uearth-3-orogen-w"/>
<path d="M16 78 L230 78 Q262 80 290 100 L450 190 L430 196 L282 112 Q258 98 230 96 L16 96 Z" class="uearth-3-orogen-oc"/>
<path d="M16 96 L230 96 Q258 98 282 112 L430 196 L400 196 L276 124 Q252 112 230 112 L16 112 Z" class="uearth-3-orogen-ml"/>
<path d="M266 66 L300 62 L360 56 L392 40 L410 52 L430 36 L450 50 L520 44 L560 50 L580 42 L600 50 L704 54 L704 140 L560 146 L470 150 L380 128 L300 98 Z" class="uearth-3-orogen-cc"/>
<path d="M392 38 l-10 14 l20 0 z" class="uearth-3-orogen-v"/>
<path d="M430 34 l-10 14 l20 0 z" class="uearth-3-orogen-v"/>
<path d="M386 104 q20 -26 50 -8 q16 12 2 30 q-26 12 -52 -22 z" class="uearth-3-orogen-bt"/>
<path d="M420 172 L410 118" class="uearth-3-orogen-mg" marker-end="url(#uearth-3-orogen-r)"/>
<path d="M540 74 l12 -14 l12 14 l12 -14 l12 14 l12 -14 l12 14" class="uearth-3-orogen-t"/>
<path d="M552 92 l40 -30 M576 100 l40 -30 M600 104 l40 -30" class="uearth-3-orogen-t"/>
<line x1="80" y1="88" x2="150" y2="88" class="uearth-3-orogen-k" style="stroke:var(--fig-panel)" marker-end="url(#uearth-3-orogen-k)"/>
<text x="100" y="56" class="uearth-3-orogen-s">해양판</text>
<text x="250" y="132" text-anchor="end" class="uearth-3-orogen-s">섭입</text>
<text x="250" y="58" text-anchor="middle" class="uearth-3-orogen-l">해구</text>
<text x="412" y="24" text-anchor="middle" class="uearth-3-orogen-l">화산호</text>
<text x="470" y="118" class="uearth-3-orogen-l">저반(화강암)</text>
<text x="610" y="36" text-anchor="middle" class="uearth-3-orogen-l">습곡·충상 단층대</text>
<text x="640" y="124" text-anchor="middle" class="uearth-3-orogen-s">대륙 지각</text>
<text x="440" y="176" class="uearth-3-orogen-s">물이 빠져나와 맨틀이 녹음</text>
</g>
<g transform="translate(0 205)">
<text x="16" y="24" class="uearth-3-orogen-h">(나) 부가형 · 북아메리카 서부 산계</text>
<rect x="16" y="62" width="300" height="16" class="uearth-3-orogen-w"/>
<path d="M16 78 L280 78 Q312 80 340 100 L470 180 L450 186 L332 112 Q308 98 280 96 L16 96 Z" class="uearth-3-orogen-oc"/>
<path d="M70 78 L92 50 L114 78 Z" class="uearth-3-orogen-oc"/>
<path d="M160 78 L180 44 L200 60 L214 46 L236 78 Z" class="uearth-3-orogen-ter1" style="fill:var(--fig-soft-green)"/>
<line x1="40" y1="88" x2="110" y2="88" style="stroke:var(--fig-panel)" class="uearth-3-orogen-k" marker-end="url(#uearth-3-orogen-k)"/>
<text x="92" y="44" text-anchor="middle" class="uearth-3-orogen-s">해산</text>
<text x="242" y="58" class="uearth-3-orogen-s">호상 열도·지괴</text>
<path d="M316 70 L360 58 L380 60 L400 108 L352 104 Z" class="uearth-3-orogen-ter1"/>
<path d="M380 60 L440 52 L470 120 L400 108 Z" class="uearth-3-orogen-cc2"/>
<path d="M440 52 L500 46 L520 130 L470 120 Z" class="uearth-3-orogen-ter1" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal)"/>
<path d="M500 46 L704 50 L704 140 L520 130 Z" class="uearth-3-orogen-cc"/>
<line x1="380" y1="60" x2="400" y2="108" style="stroke:var(--fig-ink);stroke-width:2"/>
<line x1="440" y1="52" x2="470" y2="120" style="stroke:var(--fig-ink);stroke-width:2"/>
<line x1="500" y1="46" x2="520" y2="130" style="stroke:var(--fig-ink);stroke-width:2"/>
<text x="358" y="90" text-anchor="middle" class="uearth-3-orogen-s">지괴 3</text>
<text x="425" y="90" text-anchor="middle" class="uearth-3-orogen-s">지괴 2</text>
<text x="480" y="96" text-anchor="middle" class="uearth-3-orogen-s">지괴 1</text>
<text x="610" y="100" text-anchor="middle" class="uearth-3-orogen-s">원래 대륙</text>
<text x="430" y="38" text-anchor="middle" class="uearth-3-orogen-l">단층으로 이어 붙은 모자이크(바깥쪽일수록 나중에 붙음)</text>
</g>
<g transform="translate(0 400)">
<text x="16" y="24" class="uearth-3-orogen-h">(다) 대륙–대륙 충돌형 · 히말라야–티베트</text>
<path d="M16 70 L250 66 L300 64 L300 120 L16 118 Z" class="uearth-3-orogen-cc2"/>
<path d="M250 120 L300 120 L440 200 L410 204 Z" class="uearth-3-orogen-oc"/>
<path d="M290 64 L330 50 L380 28 L420 36 L440 46 L440 186 L380 176 L300 120 Z" class="uearth-3-orogen-cc2"/>
<path d="M330 50 L380 70 M350 42 L410 74 M380 28 L438 62" class="uearth-3-orogen-t"/>
<path d="M440 46 L470 40 L520 42 L704 46 L704 112 L600 116 L520 140 L470 188 L440 186 Z" class="uearth-3-orogen-cc"/>
<path d="M436 46 L446 46 L452 190 L440 190 Z" class="uearth-3-orogen-op"/>
<line x1="160" y1="92" x2="240" y2="92" class="uearth-3-orogen-k" marker-end="url(#uearth-3-orogen-k)"/>
<text x="200" y="84" text-anchor="middle" class="uearth-3-orogen-s">인도</text>
<text x="620" y="84" text-anchor="middle" class="uearth-3-orogen-s">아시아</text>
<text x="380" y="20" text-anchor="middle" class="uearth-3-orogen-l">히말라야(충상 단층으로 겹쳐 쌓임)</text>
<text x="560" y="32" class="uearth-3-orogen-l">티베트 고원</text>
<line x1="470" y1="170" x2="520" y2="190" style="stroke:var(--fig-green);stroke-width:1.4"/>
<text x="524" y="194" class="uearth-3-orogen-l">봉합대·오피올라이트</text>
<text x="372" y="140" text-anchor="middle" class="uearth-3-orogen-l">두꺼워진 지각</text>
<text x="372" y="158" text-anchor="middle" class="uearth-3-orogen-s">(60~70 km)</text>
<text x="16" y="192" class="uearth-3-orogen-s">화산은 거의 없다</text>
</g>
<text x="360" y="628" text-anchor="middle" class="uearth-3-orogen-s">모식도: 크기와 깊이 비율은 실제와 다르다.</text>
</svg>
