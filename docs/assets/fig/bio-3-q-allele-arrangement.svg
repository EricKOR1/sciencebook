<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="t-bio-3-q-allele-arrangement d-bio-3-q-allele-arrangement">
  <title id="t-bio-3-q-allele-arrangement">그림 생명과학 3-10 문제 13의 대립유전자 배치</title>
  <desc id="d-bio-3-q-allele-arrangement">2n = 4인 개체의 염색체와 대립유전자 위치. (가)는 A와 a가 한 쌍의 상동 염색체에, B와 b가 다른 쌍에 있는 경우이고, (나)는 A와 B가 한 염색체에, a와 b가 그 상동 염색체에 있는 경우이다.</desc>
  <style>.bio-3-q-allele-arrangement-t{font-size:14px;fill:var(--fig-ink)} .bio-3-q-allele-arrangement-s{font-size:13px;fill:var(--fig-muted)} .bio-3-q-allele-arrangement-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .bio-3-q-allele-arrangement-ax{stroke:var(--fig-ink);stroke-width:1.4;fill:none} .bio-3-q-allele-arrangement-grid{stroke:var(--fig-line);stroke-width:0.7;stroke-dasharray:3 3;fill:none}</style>
  <rect x="84.0" y="50.0" width="12" height="140.0" rx="6.0" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.4"/>
