<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-ubio-3-inhibition d-ubio-3-inhibition">
  <title id="t-ubio-3-inhibition">그림 일반생명과학 3-5 경쟁적 저해와 비경쟁적 저해</title>
  <desc id="d-ubio-3-inhibition">왼쪽: 경쟁적 저해제는 기질과 닮아 활성 부위를 차지하고, 비경쟁적 저해제는 활성 부위 밖에 결합해 효소 모양을 바꾼다. 오른쪽: 미카엘리스–멘텐 곡선(V_max = 100, K_m = 2.0 mM, 저해제에 의한 배율 1 + [I]/K_i = 3, 예제 4의 값). 경쟁적 저해는 V_max가 그대로이고 겉보기 K_m이 6.0 mM로 커져 기질을 늘리면 극복되며, 비경쟁적 저해는 K_m은 그대로이고 V_max가 33으로 줄어 기질을 늘려도 극복되지 않는다.</desc>
