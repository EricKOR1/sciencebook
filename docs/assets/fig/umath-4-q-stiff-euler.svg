  <title id="t-umath-4-q-stiff-euler">그림 수학 도구 4-16 문제 18 해설: 강성 연속 반응의 수치 해 비교</title>
  <desc id="d-umath-4-q-stiff-euler">k₁ = 0.10 s⁻¹, k₂ = 5.0 s⁻¹, [A]₀ = 1.0 M. 정확한 해(실선)는 0.018 M 근처에서 거의 평평하다. 오일러법(h = 0.50 s, hk₂ = 2.5)은 계단마다 −1.5를 곱하는 셈이어서 부호가 바뀌며 커지고, 역방향 오일러법(같은 h)은 정확한 해 가까이에서 안정하다.</desc>
