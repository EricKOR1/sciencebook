  <desc id="d-umath-1-q-refraction">공기 중의 점 A(경계면 위 h₁ = 1.00 m)에서 경계면의 점 O를 거쳐 물속의 점 B(경계면 아래 h₂ = 1.00 m)로 가는 빛. A와 B의 수평 거리는 1.50 m = x₁ + x₂이다. O의 위치는 임의로 그린 모식도이다.</desc>
