  <title id="t-m3-04-q-coaster-14">그림 중3-4-8 문제 14의 롤러코스터 레일</title>
  <desc id="d-m3-04-q-coaster-14">질량 400 kg인 롤러코스터가 A점에서 거의 정지 상태로 출발하여 가장 낮은 B점을 지나 C점으로 향하는 레일의 모식도. 높이는 B점을 기준으로 한 값이다.</desc>
