<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-uearth-6-overturning d-uearth-6-overturning">
<title id="t-uearth-6-overturning">그림 일반지구과학 6-3 대서양의 자오면 단면으로 본 열염 순환</title>
<desc id="d-uearth-6-overturning">따뜻한 표층수가 대서양을 따라 북쪽으로 가서 그린란드 주변에서 냉각되어 가라앉아 북대서양 심층수가 되고, 수심 약 1.5~4 km에서 남쪽으로 흐른다. 남극 주변에서 결빙 때 짜진 매우 찬 물은 가라앉아 남극 저층수로 바닥을 따라 북쪽으로 가고, 남극 중층수는 약 1 km 깊이로 북쪽에 퍼진다. 심층수는 남극해에서 편서풍에 의해 끌어 올려진다.</desc>
<style>
.uearth-6-overturning-t{font-size:14px;fill:var(--fig-ink)} .uearth-6-overturning-s{font-size:13px;fill:var(--fig-muted)} .uearth-6-overturning-b{font-size:14px;fill:var(--fig-ink);font-weight:600}
</style>
<rect x="0" y="0" width="720" height="380" style="fill:var(--fig-paper)"/>
<polygon points="40.0,64 40.0,64.0 62.1,90.0 79.7,251.2 106.2,313.6 547.6,313.6 591.7,282.4 627.0,209.6 644.7,95.2 653.5,110.8 671.2,188.8 680.0,64.0 680.0,64" style="fill:var(--fig-soft-blue)"/>
<polygon points="40.0,64.0 62.1,90.0 79.7,251.2 106.2,313.6 547.6,313.6 591.7,282.4 627.0,209.6 644.7,95.2 653.5,110.8 671.2,188.8 680.0,64.0 680.0,344.8 40.0,344.8" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
<line x1="40.0" y1="64" x2="680.0" y2="64" style="stroke:var(--fig-blue);stroke-width:1.5"/>
<text x="106.2" y="56" text-anchor="middle" class="uearth-6-overturning-s">60°S</text>
<text x="238.6" y="56" text-anchor="middle" class="uearth-6-overturning-s">30°S</text>
<text x="371.0" y="56" text-anchor="middle" class="uearth-6-overturning-s">적도</text>
<text x="503.4" y="56" text-anchor="middle" class="uearth-6-overturning-s">30°N</text>
<text x="635.9" y="56" text-anchor="middle" class="uearth-6-overturning-s">60°N</text>
<text x="53.2" y="38" class="uearth-6-overturning-t">남극</text><text x="662.3" y="38" text-anchor="middle" class="uearth-6-overturning-t">그린란드 주변</text>
<text x="36.0" y="120" text-anchor="end" class="uearth-6-overturning-s">1 km</text>
<text x="36.0" y="172" text-anchor="end" class="uearth-6-overturning-s">2 km</text>
<text x="36.0" y="224" text-anchor="end" class="uearth-6-overturning-s">3 km</text>
<text x="36.0" y="276" text-anchor="end" class="uearth-6-overturning-s">4 km</text>
<path d="M203.3 73.4 L459.3 73.4 L600.6 73.4 L627.0 82.2" style="fill:none;stroke:var(--fig-red);stroke-width:3.2;stroke-linejoin:round"/><path d="M0 0 l-12 -6.0 l0 12 z" transform="translate(627.0,82.2) rotate(18.5)" style="fill:var(--fig-red)"/>
<path d="M635.9 84.8 L640.3 116.0 L618.2 178.4 L547.6 199.2 L282.8 204.4 L185.7 204.4" style="fill:none;stroke:var(--fig-violet);stroke-width:4;stroke-linejoin:round"/><path d="M0 0 l-12 -6.0 l0 12 z" transform="translate(185.7,204.4) rotate(180.0)" style="fill:var(--fig-violet)"/>
<path d="M176.8 194.0 L141.5 147.2 L115.0 100.4 L101.8 74.4" style="fill:none;stroke:var(--fig-violet);stroke-width:2.4;stroke-linejoin:round"/><path d="M0 0 l-12 -6.0 l0 12 z" transform="translate(101.8,74.4) rotate(-117.0)" style="fill:var(--fig-violet)"/>
<path d="M62.1 84.8 L75.3 194.0 L97.4 292.8 L194.5 300.6 L459.3 300.6 L538.8 298.0" style="fill:none;stroke:var(--fig-blue);stroke-width:4;stroke-linejoin:round"/><path d="M0 0 l-12 -6.0 l0 12 z" transform="translate(538.8,298.0) rotate(-1.9)" style="fill:var(--fig-blue)"/>
<path d="M132.7 77.0 L159.2 105.6 L216.6 116.0 L349.0 116.0 L437.2 116.0" style="fill:none;stroke:var(--fig-teal);stroke-width:2.6;stroke-linejoin:round"/><path d="M0 0 l-12 -6.0 l0 12 z" transform="translate(437.2,116.0) rotate(0.0)" style="fill:var(--fig-teal)"/>
<text x="393.1" y="91.4" text-anchor="middle" class="uearth-6-overturning-t" style="fill:var(--fig-red)">따뜻한 표층수 → 북쪽으로</text>
<text x="415.2" y="194.4" text-anchor="middle" class="uearth-6-overturning-b" style="fill:var(--fig-violet)">북대서양 심층수 → 남쪽으로</text>
<text x="326.9" y="290.6" text-anchor="middle" class="uearth-6-overturning-b" style="fill:var(--fig-blue)">남극 저층수 → 북쪽으로(가장 무거움)</text>
<text x="282.8" y="108.0" text-anchor="middle" class="uearth-6-overturning-t" style="fill:var(--fig-teal)">남극 중층수</text>
<text x="653.5" y="240.8" text-anchor="middle" class="uearth-6-overturning-s">겨울 냉각</text><text x="653.5" y="256.8" text-anchor="middle" class="uearth-6-overturning-s">→ 침강</text>
<text x="168.0" y="65.4" text-anchor="middle" class="uearth-6-overturning-s"></text>
<text x="141.5" y="168.0" class="uearth-6-overturning-s">편서풍에 의한 용승</text>
<text x="53.2" y="343.6" class="uearth-6-overturning-s">결빙 시 염분 배출로 짜고 찬 물이 침강</text>
<line x1="485.8" y1="66" x2="485.8" y2="313.6" style="stroke:var(--fig-ink);stroke-width:1;stroke-dasharray:3 3"/>
<text x="489.8" y="147.2" class="uearth-6-overturning-s">26°N: 뒤집힘 흐름 약 17 Sv</text>
<text x="20" y="370" class="uearth-6-overturning-s">모식도(세로 크게 과장) · 실제 흐름은 서안 경계를 따라 집중되고 해저 지형에 따라 갈라진다</text>
</svg>