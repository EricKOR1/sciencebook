<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 345" role="img" aria-labelledby="t-uphy-10-lenz-magnet-coil d-uphy-10-lenz-magnet-coil">
  <title id="t-uphy-10-lenz-magnet-coil">그림 일반물리학 10-4 렌츠 법칙 — 자석이 다가올 때와 멀어질 때의 유도 전류</title>
  <desc id="d-uphy-10-lenz-magnet-coil">막대자석의 N극이 아래를 향해 수평 고리 위에 있다. 고리를 지나는 자기장은 아래 방향이다. (가) 자석이 다가오면 아래 방향 선속이 늘어나므로 유도 전류는 위 방향 자기장을 만들도록 위에서 보아 시계 반대 방향으로 흐르고, 고리는 자석을 밀어낸다. (나) 자석이 멀어지면 선속이 줄어들므로 유도 전류는 아래 방향 자기장을 만들도록 위에서 보아 시계 방향으로 흐르고, 고리는 자석을 끌어당긴다.</desc>
