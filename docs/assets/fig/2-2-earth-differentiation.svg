  <title id="t-2-2-earth-differentiation">그림 2-2-6 원시 지구에서 핵·맨틀·지각이 나뉘는 과정</title>
  <desc id="d-2-2-earth-differentiation">미행성이 충돌하며 생긴 열로 원시 지구 표면이 녹아 마그마 바다가 되자, 밀도가 큰 철·니켈은 중심으로 가라앉아 핵이 되고 가벼운 규산염 물질(규소·산소·마그네슘 등)은 바깥쪽에서 맨틀과 지각이 되었다. 모식도(크기와 층 두께의 비율은 실제와 다름).</desc>
