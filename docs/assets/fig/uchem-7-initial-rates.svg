<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-uchem-7-initial-rates d-uchem-7-initial-rates">
  <title id="t-uchem-7-initial-rates">그림 일반화학 7-2 초기 속도법 — 처음 기울기를 재고, 비의 로그로 차수를 읽는다</title>
  <desc id="d-uchem-7-initial-rates">왼쪽: 처음 농도만 다른 두 실험에서 생성물 농도–시간 곡선의 t = 0 접선 기울기가 초기 속도이다(모식도). 오른쪽: 예제 3·4의 자료로 ln(속도 비)를 ln(농도 비)에 대해 찍으면 원점을 지나는 직선의 기울기가 그 물질에 대한 반응 차수이다.</desc>
