  <title id="t-uphy-9-q-parallel-wires">그림 일반물리학 9-10 문제 9의 평행한 두 도선(단면)</title>
  <desc id="d-uphy-9-q-parallel-wires">0.10 m 떨어진 두 평행 도선을 단면으로 본 모습. 두 전류는 모두 종이 면에서 나오는 방향(⊙)으로, 도선 1에 20 A, 도선 2에 10 A가 흐른다. 점 M은 두 도선의 한가운데이다.</desc>
