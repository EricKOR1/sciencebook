<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 624" role="img" aria-labelledby="t-earth-1-enso-sections d-earth-1-enso-sections">
  <title id="t-earth-1-enso-sections">그림 지구과학 1-12 평상시·엘니뇨·라니냐 때의 적도 태평양 단면</title>
  <desc id="d-earth-1-enso-sections">평상시에는 무역풍이 따뜻한 물을 서쪽으로 밀어 서쪽 수온 약층이 깊고 동쪽에서는 용승이 일어나며, 서쪽에서 상승하고 동쪽에서 하강하는 워커 순환이 생긴다. 엘니뇨 때는 무역풍과 용승이 약해져 따뜻한 물과 상승 기류가 동쪽으로 옮겨 가고 수온 약층이 평평해진다. 라니냐 때는 그 반대로 더 강해진다. 모식도이다.</desc>
  <style>
    .earth-1-enso-sections-t{font-size:14px;fill:var(--fig-ink)}
    .earth-1-enso-sections-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .earth-1-enso-sections-s{font-size:13px;fill:var(--fig-muted)}
    .earth-1-enso-sections-land{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:0.8;fill-rule:evenodd}
    .earth-1-enso-sections-sea{fill:var(--fig-soft-blue)}
    .earth-1-enso-sections-grat{fill:none;stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3;opacity:0.7}
    .earth-1-enso-sections-frame{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .earth-1-enso-sections-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
