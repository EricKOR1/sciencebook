<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="t-ochem-14-glucose-cyclization d-ochem-14-glucose-cyclization">
  <title id="t-ochem-14-glucose-cyclization">그림 유기화학 14-2 D-글루코스의 고리화 — 피셔 투영식에서 하워스 투영식으로</title>
  <desc id="d-ochem-14-glucose-cyclization">(가) 사슬형 D-글루코스의 피셔 투영식(C2 오른쪽, C3 왼쪽, C4·C5 오른쪽 OH). (나) 사슬을 오른쪽으로 눕히면 피셔의 오른쪽 원자단이 아래로 가고, C4–C5 결합을 돌려 C5의 OH를 C1 쪽으로 향하게 하면 CH₂OH(C6)가 위로 간다. C5 O의 비공유 전자쌍이 C1(카보닐 탄소)을 공격하고, C=O의 π 전자쌍이 O로 간다(그 O에 양성자가 붙어 OH). (다) C1이 새 입체 중심이 되어 α-D-글루코피라노스(C1 OH 아래, CH₂OH와 트랜스)와 β-D-글루코피라노스(C1 OH 위, CH₂OH와 시스)가 생긴다.</desc>
