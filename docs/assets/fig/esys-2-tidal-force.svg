<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-esys-2-tidal-force d-esys-2-tidal-force">
  <title id="t-esys-2-tidal-force">그림 지구시스템과학 2-7 기조력 — 인력의 차이</title>
  <desc id="d-esys-2-tidal-force">(가) 달이 지구 각 지점을 당기는 인력은 달에 가까운 쪽일수록 크다. (나) 지구 중심이 받는 인력은 지구 전체에 같은 크기·방향으로 작용한다고 볼 수 있다. (다) 각 지점의 인력에서 지구 중심의 인력을 빼면 기조력이 되어, 달 쪽과 그 반대쪽은 바깥으로, 그 사이(90°)는 지구 중심 쪽으로 향하므로 두 곳이 부푼다. 달까지의 거리를 크게 줄이고 화살표 길이를 과장한 모식도이다.</desc>
  <style>
    .esys-2-tidal-force-t{font-size:13px;fill:var(--fig-ink)}
    .esys-2-tidal-force-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .esys-2-tidal-force-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .esys-2-tidal-force-s{font-size:13px;fill:var(--fig-muted)}
    .esys-2-tidal-force-r{font-size:13px;font-weight:600;fill:var(--fig-red)}
    .esys-2-tidal-force-u{font-size:13px;font-weight:600;fill:var(--fig-blue)}
    .esys-2-tidal-force-g{font-size:13px;font-weight:600;fill:var(--fig-green)}
    .esys-2-tidal-force-a{font-size:13px;font-weight:600;fill:var(--fig-amber)}
    .esys-2-tidal-force-v{font-size:13px;font-weight:600;fill:var(--fig-violet)}
    .esys-2-tidal-force-e{font-size:13px;font-weight:600;fill:var(--fig-teal)}
    .esys-2-tidal-force-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
