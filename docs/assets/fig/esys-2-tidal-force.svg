dth:1.5"/><text x="682.0" y="178.0" text-anchor="middle" class="esys-2-tidal-force-t">달</text><text x="120.0" y="32.0" text-anchor="middle" class="esys-2-tidal-force-v">(가) 각 지점의 달의 인력</text><text x="360.0" y="32.0" text-anchor="middle" class="esys-2-tidal-force-b">(나) 지구 중심의 인력(모두 같음)</text><text x="600.0" y="32.0" text-anchor="middle" class="esys-2-tidal-force-r">(다) (가) − (나) = 기조력</text><text x="256.0" y="156.0" text-anchor="middle" class="esys-2-tidal-force-h">−</text><text x="468.0" y="156.0" text-anchor="middle" class="esys-2-tidal-force-h">=</text><text x="570.0" y="78.0" text-anchor="middle" class="esys-2-tidal-force-s">간조</text><text x="570.0" y="230.0" text-anchor="middle" class="esys-2-tidal-force-s">간조</text><text x="506.0" y="136.0" text-anchor="end" class="esys-2-tidal-force-u">만조</text><text x="648.0" y="124.0" text-anchor="middle" class="esys-2-tidal-force-u">만조</text><text x="360.0" y="260.0" text-anchor="middle" class="esys-2-tidal-force-t">달 쪽 해수는 지구 중심보다 더 세게, 반대쪽 해수는 더 약하게 당겨진다.</text><text x="360.0" y="282.0" text-anchor="middle" class="esys-2-tidal-force-t">→ 달을 향한 쪽과 그 반대쪽이 동시에 부푼다(점선: 부푼 해수면, 과장).</text></svg>
