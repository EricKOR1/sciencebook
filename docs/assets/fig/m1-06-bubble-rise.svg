  <title id="t-m1-06-bubble-rise">그림 중1-6-4 바깥 압력이 작아지면 기체의 부피가 커진다</title>
  <desc id="d-m1-06-bubble-rise">잠수부가 내뱉은 공기 방울은 수면에 가까워질수록 물의 압력이 작아져 점점 커진다. 높은 산 위에서는 대기압이 작아 밀봉된 과자 봉지가 부푼다. 화살표는 바깥에서 누르는 압력의 크기를 나타낸 모식이며, 크기와 비율은 실제와 다르다.</desc>
