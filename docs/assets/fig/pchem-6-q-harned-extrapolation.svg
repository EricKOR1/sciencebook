<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="t-pchem-6-q-harned-extrapolation d-pchem-6-q-harned-extrapolation">
  <title id="t-pchem-6-q-harned-extrapolation">그림 물리화학 6-8 예제 12의 외삽 그래프</title>
  <desc id="d-pchem-6-q-harned-extrapolation">하네드 전지의 네 측정점에서 계산한 y = E + (2RT/F)ln(b/b°)를 √(b/b°)에 대해 그렸다. 최소 제곱 직선 y = 0.2226 + 0.0498√b(실선)를 √b = 0까지 늘리면(점선) 절편 E° ≈ 0.2226 V를 얻는다. 회색 점선은 정밀값 E° = 0.2223 V를 지나고 극한 법칙의 이론 기울기 0.0602 V를 갖는 직선이다.</desc>
