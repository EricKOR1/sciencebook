<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="t-umath-6-rotating-phasor d-umath-6-rotating-phasor">
  <title id="t-umath-6-rotating-phasor">그림 수학 도구 6-2 회전하는 화살표 e^(iωt) 와 그 그림자</title>
  <desc id="d-umath-6-rotating-phasor">단위원 위를 시계 반대 방향으로 도는 화살표 e^(iωt) 의 끝을 허수축에 비추면 sin ωt(오른쪽, 시간은 오른쪽으로), 실수축에 비추면 cos ωt(아래쪽, 시간은 아래로)가 된다. ωt = 0, π/2, π, 3π/2 의 위치(점 A~D)가 두 곡선 위의 점과 대응한다.</desc>
