<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-ubio-13-survivorship d-ubio-13-survivorship">
  <title id="t-ubio-13-survivorship">그림 일반생명과학 13-2 생존 곡선의 세 유형</title>
  <desc id="d-ubio-13-survivorship">가로축은 최대 수명에 대한 상대 나이, 세로축은 출생 1000개체 가운데 살아남은 수(로그 눈금)이다. Ⅰ형은 어릴 때 사망률이 낮다가 늙어서 급히 줄고, Ⅱ형은 매 기간 같은 비율이 죽어 로그 눈금에서 직선이며, Ⅲ형은 어릴 때 대부분 죽고 살아남은 소수는 오래 산다. 곡선 모양은 모식적이다.</desc>
  <style>.ubio-13-survivorship-t{font-size:14px;fill:var(--fig-ink)} .ubio-13-survivorship-s{font-size:13px;fill:var(--fig-muted)} .ubio-13-survivorship-b{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-13-survivorship-k{font-size:13px;fill:var(--fig-ink)}</style>
  <rect x="90.0" y="50.0" width="380.0" height="280.0" rx="0" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <line x1="85.0" y1="330.0" x2="470.0" y2="330.0" style="fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:2 4"/>
  <text x="81.0" y="335.0" text-anchor="end" class="ubio-13-survivorship-s">1</text>
  <line x1="85.0" y1="236.7" x2="470.0" y2="236.7" style="fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:2 4"/>
  <text x="81.0" y="241.7" text-anchor="end" class="ubio-13-survivorship-s">10</text>
  <line x1="85.0" y1="143.3" x2="470.0" y2="143.3" style="fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:2 4"/>
  <text x="81.0" y="148.3" text-anchor="end" class="ubio-13-survivorship-s">100</text>
  <line x1="85.0" y1="50.0" x2="470.0" y2="50.0" style="fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:2 4"/>
  <text x="81.0" y="55.0" text-anchor="end" class="ubio-13-survivorship-s">1000</text>
  <line x1="90.0" y1="330.0" x2="90.0" y2="335.0" style="fill:none;stroke:var(--fig-ink);stroke-width:1"/>
  <text x="90.0" y="350.0" text-anchor="middle" class="ubio-13-survivorship-s">0</text>
  <line x1="185.0" y1="330.0" x2="185.0" y2="335.0" style="fill:none;stroke:var(--fig-ink);stroke-width:1"/>
  <text x="185.0" y="350.0" text-anchor="middle" class="ubio-13-survivorship-s">25</text>
  <line x1="280.0" y1="330.0" x2="280.0" y2="335.0" style="fill:none;stroke:var(--fig-ink);stroke-width:1"/>
  <text x="280.0" y="350.0" text-anchor="middle" class="ubio-13-survivorship-s">50</text>
  <line x1="375.0" y1="330.0" x2="375.0" y2="335.0" style="fill:none;stroke:var(--fig-ink);stroke-width:1"/>
  <text x="375.0" y="350.0" text-anchor="middle" class="ubio-13-survivorship-s">75</text>
  <line x1="470.0" y1="330.0" x2="470.0" y2="335.0" style="fill:none;stroke:var(--fig-ink);stroke-width:1"/>
  <text x="470.0" y="350.0" text-anchor="middle" class="ubio-13-survivorship-s">100</text>
  <text x="280.0" y="370.0" text-anchor="middle" class="ubio-13-survivorship-s">상대 나이 (최대 수명에 대한 %)</text>
  <text x="20.0" y="32.0" class="ubio-13-survivorship-s">생존 개체 수 (출생 1000 기준, 로그 눈금)</text>
  <path d="M90.0 50.0 C102.7 50.1 140.7 50.3 166.0 50.6 C191.3 50.9 216.7 51.0 242.0 51.7 C267.3 52.3 295.8 52.5 318.0 54.3 C340.2 56.0 359.2 57.5 375.0 62.2 C390.8 66.9 402.2 70.6 413.0 82.4 C423.8 94.1 432.0 109.7 439.6 132.7 C447.2 155.7 453.5 188.6 458.6 220.2 C463.7 251.9 468.1 305.5 470.0 322.6" style="fill:none;stroke:var(--fig-blue);stroke-width:3"/>
  <line x1="90.0" y1="50.0" x2="470.0" y2="330.0" style="fill:none;stroke:var(--fig-green);stroke-width:3"/>
  <path d="M90.0 50.0 C92.5 59.4 99.5 88.2 105.2 106.2 C110.9 124.2 115.3 142.2 124.2 157.8 C133.1 173.3 141.9 187.6 158.4 199.5 C174.9 211.4 199.6 220.7 223.0 229.3 C246.4 237.9 273.7 242.8 299.0 251.1 C324.3 259.4 346.5 267.3 375.0 279.2 C403.5 291.1 454.2 315.4 470.0 322.6" style="fill:none;stroke:var(--fig-red);stroke-width:3"/>
  <text x="242.0" y="76.0" class="ubio-13-survivorship-b" style="fill:var(--fig-blue)">Ⅰ형</text>
  <text x="302.8" y="164.0" class="ubio-13-survivorship-b" style="fill:var(--fig-green)">Ⅱ형</text>
  <text x="204.0" y="247.0" class="ubio-13-survivorship-b" style="fill:var(--fig-red)">Ⅲ형</text>
  <rect x="495.0" y="61.0" width="26.0" height="6.0" rx="0" style="fill:var(--fig-blue)"/>
  <text x="529.0" y="70.0" class="ubio-13-survivorship-b" style="fill:var(--fig-blue)">Ⅰ형</text>
  <text x="495.0" y="92.0" class="ubio-13-survivorship-k">어릴 때 사망률 낮음, 노년에 급감</text>
  <text x="495.0" y="111.0" class="ubio-13-survivorship-s">사람, 대형 포유류</text>
  <text x="495.0" y="129.0" class="ubio-13-survivorship-s">자손 적고 보살핌 많음</text>
  <rect x="495.0" y="143.0" width="26.0" height="6.0" rx="0" style="fill:var(--fig-green)"/>
  <text x="529.0" y="152.0" class="ubio-13-survivorship-b" style="fill:var(--fig-green)">Ⅱ형</text>
  <text x="495.0" y="174.0" class="ubio-13-survivorship-k">나이에 관계없이 사망 비율 일정</text>
  <text x="495.0" y="193.0" class="ubio-13-survivorship-s">많은 조류, 일부 도마뱀</text>
  <rect x="495.0" y="225.0" width="26.0" height="6.0" rx="0" style="fill:var(--fig-red)"/>
  <text x="529.0" y="234.0" class="ubio-13-survivorship-b" style="fill:var(--fig-red)">Ⅲ형</text>
  <text x="495.0" y="256.0" class="ubio-13-survivorship-k">어릴 때 대부분 사망</text>
  <text x="495.0" y="275.0" class="ubio-13-survivorship-s">굴, 많은 어류·식물</text>
  <text x="495.0" y="293.0" class="ubio-13-survivorship-s">자손 많고 보살핌 없음</text>
  <rect x="489.0" y="316.0" width="222.0" height="48.0" rx="6" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1"/>
  <text x="499.0" y="336.0" class="ubio-13-survivorship-k">로그 눈금: 같은 간격 = 같은 비율</text>
  <text x="499.0" y="354.0" class="ubio-13-survivorship-k">일정 비율로 죽으면 직선(Ⅱ형)</text>
</svg>
