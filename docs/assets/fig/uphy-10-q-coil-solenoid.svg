  <desc id="d-uphy-10-q-coil-solenoid">단위 길이당 2000회 감은 긴 솔레노이드(반지름 2.0 cm)의 가운데 바깥을 50회 감은 작은 코일이 둘러싸고 있다. 솔레노이드에는 전류 i₁이 흐른다. 길이는 실제 비율과 다른 모식도이다.</desc>
