  <title id="t-ochem-7-butanol-dept">그림 유기화학 7-17 뷰탄-2-올의 ¹³C 스펙트럼과 DEPT</title>
  <desc id="d-ochem-7-butanol-dept">가로축 δ 80 → 0 ppm 공통. 위: 넓은 띠 짝풀림 스펙트럼 — 69.3(C2, CH), 32.1(C3, CH₂), 22.9(C1, CH₃), 10.0(C4, CH₃)의 단일선 네 개. 가운데: DEPT-90 — CH인 69.3만 위로. 아래: DEPT-135 — CH와 CH₃(69.3, 22.9, 10.0)는 위로, CH₂(32.1)는 아래로. 세로 점선은 같은 δ를 잇는다(모식도).</desc>
