  <title id="t-ubio-4-q-flow-drug">그림 일반생명과학 4-10 문제 7 해설: DNA 복제 억제제 처리 전후의 DNA 양 분포</title>
  <desc id="d-ubio-4-q-flow-drug">왼쪽: 처리 전(2C 50%, 2C와 4C 사이 30%, 4C 20%). 오른쪽: DNA 복제를 막는 약물을 처리하고 하루 뒤의 예상. 세포가 S기 입구(2C 근처)에 몰려 4C 봉우리가 거의 사라진다. 봉우리 모양은 모식도이다.</desc>
