    .earth-2-metamorphism-s{font-size:13px;fill:var(--fig-muted)}
    .earth-2-metamorphism-land{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:0.8;fill-rule:evenodd}
    .earth-2-metamorphism-sea{fill:var(--fig-soft-blue)}
    .earth-2-metamorphism-grat{fill:none;stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3;opacity:0.7}
    .earth-2-metamorphism-frame{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .earth-2-metamorphism-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
