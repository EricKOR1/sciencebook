<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-labelledby="t-earth-2-metamorphism d-earth-2-metamorphism">
  <title id="t-earth-2-metamorphism">그림 지구과학 2-9 접촉 변성작용과 광역 변성작용</title>
  <desc id="d-earth-2-metamorphism">왼쪽: 화강암이 관입하면 마그마의 열로 주변 암석의 좁은 띠가 변성되어 혼펠스, 규암, 대리암이 된다. 오른쪽: 넓은 지역에서 높은 압력을 받으면 납작한 광물이 누르는 힘에 수직인 방향으로 배열되어 엽리가 생긴다. 모식도이다.</desc>
  <style>
    .earth-2-metamorphism-t{font-size:14px;fill:var(--fig-ink)}
