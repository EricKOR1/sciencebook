<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 508" role="img" aria-labelledby="t-m3-08-job-map d-m3-08-job-map">
  <title id="t-m3-08-job-map">그림 중3-8-1 과학 관련 직업 분야와 과학 영역</title>
  <desc id="d-m3-08-job-map">과학 관련 직업을 연구, 기술·공학, 의료·보건, 환경·에너지, 지구·안전, 농업·식품, 정보·데이터, 소통·교육·정책의 여덟 갈래로 나누고, 각 갈래에서 주로 쓰이는 과학을 이 책의 다섯 영역에 점으로 표시했다. 대부분의 갈래가 둘 이상의 영역을 함께 쓴다.</desc>
  <style>
    .m3-08-job-map-lbl{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .m3-08-job-map-hd{font-size:13px;font-weight:600;fill:var(--fig-ink)}
    .m3-08-job-map-sm{font-size:13px;fill:var(--fig-muted)}
  </style>
  <rect x="304.0" y="16" width="72.8" height="428" rx="8" style="fill:var(--fig-soft-blue)"/>
  <text x="340.4" y="38" text-anchor="middle" class="m3-08-job-map-hd" style="fill:var(--fig-blue)">운동과</text>
  <text x="340.4" y="56" text-anchor="middle" class="m3-08-job-map-hd" style="fill:var(--fig-blue)">에너지</text>
  <rect x="384.8" y="16" width="72.8" height="428" rx="8" style="fill:var(--fig-soft-amber)"/>
  <text x="421.2" y="47" text-anchor="middle" class="m3-08-job-map-hd" style="fill:var(--fig-amber)">물질</text>
  <rect x="465.6" y="16" width="72.8" height="428" rx="8" style="fill:var(--fig-soft-green)"/>
  <text x="502.0" y="47" text-anchor="middle" class="m3-08-job-map-hd" style="fill:var(--fig-green)">생명</text>
  <rect x="546.4" y="16" width="72.8" height="428" rx="8" style="fill:var(--fig-soft-teal)"/>
  <text x="582.8" y="38" text-anchor="middle" class="m3-08-job-map-hd" style="fill:var(--fig-teal)">지구와</text>
  <text x="582.8" y="56" text-anchor="middle" class="m3-08-job-map-hd" style="fill:var(--fig-teal)">우주</text>
  <rect x="627.2" y="16" width="72.8" height="428" rx="8" style="fill:var(--fig-soft-violet)"/>
  <text x="663.6" y="38" text-anchor="middle" class="m3-08-job-map-hd" style="fill:var(--fig-violet)">과학의 기초</text>
  <text x="663.6" y="56" text-anchor="middle" class="m3-08-job-map-hd" style="fill:var(--fig-violet)">와 사회</text>
  <text x="20" y="47" class="m3-08-job-map-hd">직업의 갈래와 예</text>
  <text x="292" y="47" text-anchor="end" class="m3-08-job-map-sm" style="font-size:12px">이 책의 영역 →</text>
  <line x1="16" y1="72" x2="704" y2="72" style="stroke:var(--fig-line);stroke-width:0.8"/>
  <text x="20" y="91" class="m3-08-job-map-lbl">연구</text>
  <text x="20" y="109" class="m3-08-job-map-sm">물리학자, 화학자, 생명과학자, 천문학자</text>
  <circle cx="340.4" cy="95" r="9" style="fill:var(--fig-blue)"/>
  <circle cx="421.2" cy="95" r="9" style="fill:var(--fig-amber)"/>
  <circle cx="502.0" cy="95" r="9" style="fill:var(--fig-green)"/>
  <circle cx="582.8" cy="95" r="9" style="fill:var(--fig-teal)"/>
  <circle cx="663.6" cy="95" r="3" style="fill:var(--fig-line)"/>
  <line x1="16" y1="118" x2="704" y2="118" style="stroke:var(--fig-line);stroke-width:0.8"/>
  <text x="20" y="137" class="m3-08-job-map-lbl">기술·공학</text>
  <text x="20" y="155" class="m3-08-job-map-sm">반도체·기계·로봇 엔지니어, 건축가</text>
  <circle cx="340.4" cy="141" r="9" style="fill:var(--fig-blue)"/>
  <circle cx="421.2" cy="141" r="9" style="fill:var(--fig-amber)"/>
  <circle cx="502.0" cy="141" r="3" style="fill:var(--fig-line)"/>
  <circle cx="582.8" cy="141" r="3" style="fill:var(--fig-line)"/>
  <circle cx="663.6" cy="141" r="3" style="fill:var(--fig-line)"/>
  <line x1="16" y1="164" x2="704" y2="164" style="stroke:var(--fig-line);stroke-width:0.8"/>
  <text x="20" y="183" class="m3-08-job-map-lbl">의료·보건</text>
  <text x="20" y="201" class="m3-08-job-map-sm">의사, 간호사, 약사, 임상병리사</text>
  <circle cx="340.4" cy="187" r="3" style="fill:var(--fig-line)"/>
  <circle cx="421.2" cy="187" r="9" style="fill:var(--fig-amber)"/>
  <circle cx="502.0" cy="187" r="9" style="fill:var(--fig-green)"/>
  <circle cx="582.8" cy="187" r="3" style="fill:var(--fig-line)"/>
  <circle cx="663.6" cy="187" r="3" style="fill:var(--fig-line)"/>
  <line x1="16" y1="210" x2="704" y2="210" style="stroke:var(--fig-line);stroke-width:0.8"/>
  <text x="20" y="229" class="m3-08-job-map-lbl">환경·에너지</text>
  <text x="20" y="247" class="m3-08-job-map-sm">환경 연구원, 신재생 에너지 기술자</text>
  <circle cx="340.4" cy="233" r="9" style="fill:var(--fig-blue)"/>
  <circle cx="421.2" cy="233" r="3" style="fill:var(--fig-line)"/>
  <circle cx="502.0" cy="233" r="9" style="fill:var(--fig-green)"/>
  <circle cx="582.8" cy="233" r="9" style="fill:var(--fig-teal)"/>
  <circle cx="663.6" cy="233" r="3" style="fill:var(--fig-line)"/>
  <line x1="16" y1="256" x2="704" y2="256" style="stroke:var(--fig-line);stroke-width:0.8"/>
  <text x="20" y="275" class="m3-08-job-map-lbl">지구·안전</text>
  <text x="20" y="293" class="m3-08-job-map-sm">기상 예보관, 지진 연구원, 소방관</text>
  <circle cx="340.4" cy="279" r="3" style="fill:var(--fig-line)"/>
  <circle cx="421.2" cy="279" r="9" style="fill:var(--fig-amber)"/>
  <circle cx="502.0" cy="279" r="3" style="fill:var(--fig-line)"/>
  <circle cx="582.8" cy="279" r="9" style="fill:var(--fig-teal)"/>
  <circle cx="663.6" cy="279" r="3" style="fill:var(--fig-line)"/>
  <line x1="16" y1="302" x2="704" y2="302" style="stroke:var(--fig-line);stroke-width:0.8"/>
  <text x="20" y="321" class="m3-08-job-map-lbl">농업·식품</text>
  <text x="20" y="339" class="m3-08-job-map-sm">스마트팜 농업인, 육종 연구원</text>
  <circle cx="340.4" cy="325" r="3" style="fill:var(--fig-line)"/>
  <circle cx="421.2" cy="325" r="9" style="fill:var(--fig-amber)"/>
  <circle cx="502.0" cy="325" r="9" style="fill:var(--fig-green)"/>
  <circle cx="582.8" cy="325" r="3" style="fill:var(--fig-line)"/>
  <circle cx="663.6" cy="325" r="3" style="fill:var(--fig-line)"/>
  <line x1="16" y1="348" x2="704" y2="348" style="stroke:var(--fig-line);stroke-width:0.8"/>
  <text x="20" y="367" class="m3-08-job-map-lbl">정보·데이터</text>
  <text x="20" y="385" class="m3-08-job-map-sm">데이터 과학자, 인공지능 개발자</text>
  <circle cx="340.4" cy="371" r="3" style="fill:var(--fig-line)"/>
  <circle cx="421.2" cy="371" r="3" style="fill:var(--fig-line)"/>
  <circle cx="502.0" cy="371" r="3" style="fill:var(--fig-line)"/>
  <circle cx="582.8" cy="371" r="3" style="fill:var(--fig-line)"/>
  <circle cx="663.6" cy="371" r="9" style="fill:var(--fig-violet)"/>
  <line x1="16" y1="394" x2="704" y2="394" style="stroke:var(--fig-line);stroke-width:0.8"/>
  <text x="20" y="413" class="m3-08-job-map-lbl">소통·교육·정책</text>
  <text x="20" y="431" class="m3-08-job-map-sm">과학 교사, 과학 기자, 변리사</text>
  <circle cx="340.4" cy="417" r="9" style="fill:var(--fig-blue)"/>
  <circle cx="421.2" cy="417" r="9" style="fill:var(--fig-amber)"/>
  <circle cx="502.0" cy="417" r="9" style="fill:var(--fig-green)"/>
  <circle cx="582.8" cy="417" r="9" style="fill:var(--fig-teal)"/>
  <circle cx="663.6" cy="417" r="9" style="fill:var(--fig-violet)"/>
  <line x1="16" y1="440" x2="704" y2="440" style="stroke:var(--fig-line);stroke-width:0.8"/>
  <circle cx="26" cy="466" r="8" style="fill:var(--fig-ink)"/><text x="40" y="471" class="m3-08-job-map-sm">그 갈래에서 주로 쓰이는 과학 영역 (본문 표의 ‘주로 쓰이는 과학’ 기준)</text>
  <text x="20" y="496" class="m3-08-job-map-sm">한 갈래가 여러 영역을 함께 쓰는 경우가 대부분이다. 영역 사이의 경계는 엄격하지 않다.</text>
</svg>
