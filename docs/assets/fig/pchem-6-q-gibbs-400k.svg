  <title id="t-pchem-6-q-gibbs-400k">그림 물리화학 6-13 문제 12 풀이의 G(ξ) 곡선</title>
  <desc id="d-pchem-6-q-gibbs-400k">400 K, 1 bar에서 A 1 mol로 출발한 A ⇌ B(ΔrG° = +3.11 kJ/mol, RT = 3.326 kJ/mol)의 G − μ°A를 x_B에 대해 그렸다. 바닥(평형)은 x_B = 0.282에 있고, x_B = 0.20인 점의 접선 기울기는 ΔrG = −1.50 kJ/mol이므로 이 점은 바닥의 왼쪽이며 정반응이 자발적이다.</desc>
