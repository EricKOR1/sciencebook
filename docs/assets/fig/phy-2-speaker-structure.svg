  <title id="t-phy-2-speaker-structure">그림 물리학 2-2 스피커의 구조</title>
  <desc id="d-phy-2-speaker-structure">영구 자석이 만든 자기장 속에 보이스 코일이 놓여 있다. 음성 신호 전류가 흐르면 코일이 앞뒤로 힘을 받아 진동판과 함께 떨리고, 진동판이 공기를 밀고 당겨 소리를 만든다.</desc>
