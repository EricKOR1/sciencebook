<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="t-uearth-3-q-geomap-strip d-uearth-3-q-geomap-strip">
<title id="t-uearth-3-q-geomap-strip">그림 일반지구과학 3-13 문제 14의 지표 지층 분포</title>
<desc id="d-uearth-3-q-geomap-strip">동서로 걸으며 기록한 지표의 지층 분포를 위에서 본 모식도. 숫자는 지층 번호(1이 가장 오래됨)이며, 서쪽부터 4, 3, 2, 1, 2, 3, 4, 5, 6, 5, 4 순서로 나타난다.</desc>
<style>.uearth-3-q-geomap-strip-t{font-size:14px;fill:var(--fig-ink)} .uearth-3-q-geomap-strip-s{font-size:13px;fill:var(--fig-muted)} .uearth-3-q-geomap-strip-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .uearth-3-q-geomap-strip-b{font-size:14px;font-weight:700;fill:var(--fig-ink)}</style>
