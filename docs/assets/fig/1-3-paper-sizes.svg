<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 408" role="img" aria-labelledby="t-1-3-paper-sizes d-1-3-paper-sizes">
  <title id="t-1-3-paper-sizes">그림 1-3-4 A4 용지를 반으로 접어도 같은 모양</title>
  <desc id="d-1-3-paper-sizes">A4 용지(210 mm × 297 mm)를 반으로 자르면 A5(148 mm × 210 mm), 다시 반으로 자르면 A6(105 mm × 148 mm)가 된다. 긴 변과 짧은 변의 비가 1 : √2(약 1.41)이므로 반으로 접어도 가로세로 비율이 그대로이다.</desc>
  <style>
    .pap13-lbl{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .pap13-txt{font-size:14px;fill:var(--fig-ink)}
    .pap13-sm{font-size:13px;fill:var(--fig-muted)}
  </style>
  <rect x="40" y="30" width="231.0" height="326.7" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2.5"/>
  <line x1="40" y1="193.4" x2="271.0" y2="193.4" style="stroke:var(--fig-violet);stroke-width:2;stroke-dasharray:7 4"/>
  <line x1="155.5" y1="30" x2="155.5" y2="193.4" style="stroke:var(--fig-teal);stroke-width:2;stroke-dasharray:4 4"/>
  <text x="97.8" y="111.7" text-anchor="middle" class="pap13-lbl" style="fill:var(--fig-teal)">A6</text>
  <text x="97.8" y="129.7" text-anchor="middle" class="pap13-sm">105×148</text>
  <text x="213.3" y="111.7" text-anchor="middle" class="pap13-lbl" style="fill:var(--fig-teal)">A6</text>
  <text x="213.3" y="129.7" text-anchor="middle" class="pap13-sm">105×148</text>
  <text x="155.5" y="275.0" text-anchor="middle" class="pap13-lbl" style="fill:var(--fig-violet)">A5</text>
  <text x="155.5" y="293.0" text-anchor="middle" class="pap13-sm">148×210</text>
  <path d="M40 368.7 V376.7 H271.0 V368.7" style="fill:none;stroke:var(--fig-ink);stroke-width:1.2"/>
  <text x="155.5" y="394.7" text-anchor="middle" class="pap13-txt">210 mm</text>
  <path d="M283.0 30 H291.0 V356.7 H283.0" style="fill:none;stroke:var(--fig-ink);stroke-width:1.2"/>
  <text x="297.0" y="198.4" text-anchor="start" class="pap13-txt">297 mm</text>
  <text x="155.5" y="20.0" text-anchor="middle" class="pap13-lbl" style="fill:var(--fig-blue)">A4 (단위: mm)</text>
  <text x="380.0" y="60.0" text-anchor="start" class="pap13-lbl">긴 변 ÷ 짧은 변</text>
  <text x="380.0" y="96.0" text-anchor="start" class="pap13-lbl" style="fill:var(--fig-blue)">A4</text>
  <text x="430.0" y="96.0" text-anchor="start" class="pap13-txt">297 ÷ 210</text>
  <text x="540.0" y="96.0" text-anchor="start" class="pap13-txt" style="font-weight:600">≈ 1.41</text>
  <text x="380.0" y="128.0" text-anchor="start" class="pap13-lbl" style="fill:var(--fig-violet)">A5</text>
  <text x="430.0" y="128.0" text-anchor="start" class="pap13-txt">210 ÷ 148</text>
  <text x="540.0" y="128.0" text-anchor="start" class="pap13-txt" style="font-weight:600">≈ 1.42</text>
  <text x="380.0" y="160.0" text-anchor="start" class="pap13-lbl" style="fill:var(--fig-teal)">A6</text>
  <text x="430.0" y="160.0" text-anchor="start" class="pap13-txt">148 ÷ 105</text>
  <text x="540.0" y="160.0" text-anchor="start" class="pap13-txt" style="font-weight:600">≈ 1.41</text>
  <rect x="370" y="205" width="330" height="100" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <text x="535.0" y="233.0" text-anchor="middle" class="pap13-lbl">비율이 1 : √2 (√2 ≈ 1.414)</text>
  <text x="535.0" y="258.0" text-anchor="middle" class="pap13-txt">반으로 접으면 짧은 변이 긴 변이 되고</text>
  <text x="535.0" y="280.0" text-anchor="middle" class="pap13-txt">가로세로 비율은 그대로 남는다</text>
  <text x="535.0" y="335.0" text-anchor="middle" class="pap13-sm">치수는 표준에서 mm 단위로 반올림해 정한 값</text>
</svg>
