<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="t-gene-2-nuclear-transfer d-gene-2-nuclear-transfer">
  <title id="t-gene-2-nuclear-transfer">그림 생물의 유전 2-6 거던의 핵이식 실험</title>
  <desc id="d-gene-2-nuclear-transfer">개구리 난자의 핵을 자외선으로 파괴하고, 올챙이의 분화한 창자 세포에서 꺼낸 핵을 넣었더니 일부가 정상 올챙이를 거쳐 개구리로 발생하였다. 분화한 세포의 핵에도 개체 전체를 만드는 유전 정보가 모두 남아 있다는 증거이다. 모식도이다.</desc>
  <style>
    .gene-2-nuclear-transfer-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .gene-2-nuclear-transfer-tx{font-size:14px;fill:var(--fig-ink)}
    .gene-2-nuclear-transfer-sm{font-size:13px;fill:var(--fig-muted)}
    .gene-2-nuclear-transfer-mono{font-size:14px;font-weight:600;fill:var(--fig-ink);letter-spacing:1px}
    .gene-2-nuclear-transfer-ln{fill:none;stroke:var(--fig-ink);stroke-width:2}
    .gene-2-nuclear-transfer-lnm{fill:none;stroke:var(--fig-line);stroke-width:1.5}
    .gene-2-nuclear-transfer-dash{fill:none;stroke:var(--fig-line);stroke-width:1.5;stroke-dasharray:5 4}
    .gene-2-nuclear-transfer-ink{fill:var(--fig-ink)}
    .gene-2-nuclear-transfer-paper{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}
    .gene-2-nuclear-transfer-gray{fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1.5}
    .gene-2-nuclear-transfer-b-blue{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2}
    .gene-2-nuclear-transfer-f-blue{fill:var(--fig-blue)}
    .gene-2-nuclear-transfer-s-blue{fill:none;stroke:var(--fig-blue);stroke-width:2.5}
    .gene-2-nuclear-transfer-t-blue{fill:var(--fig-blue)}
    .gene-2-nuclear-transfer-b-red{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2}
    .gene-2-nuclear-transfer-f-red{fill:var(--fig-red)}
    .gene-2-nuclear-transfer-s-red{fill:none;stroke:var(--fig-red);stroke-width:2.5}
    .gene-2-nuclear-transfer-t-red{fill:var(--fig-red)}
    .gene-2-nuclear-transfer-b-green{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2}
    .gene-2-nuclear-transfer-f-green{fill:var(--fig-green)}
    .gene-2-nuclear-transfer-s-green{fill:none;stroke:var(--fig-green);stroke-width:2.5}
    .gene-2-nuclear-transfer-t-green{fill:var(--fig-green)}
    .gene-2-nuclear-transfer-b-amber{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2}
    .gene-2-nuclear-transfer-f-amber{fill:var(--fig-amber)}
    .gene-2-nuclear-transfer-s-amber{fill:none;stroke:var(--fig-amber);stroke-width:2.5}
    .gene-2-nuclear-transfer-t-amber{fill:var(--fig-amber)}
    .gene-2-nuclear-transfer-b-violet{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2}
    .gene-2-nuclear-transfer-f-violet{fill:var(--fig-violet)}
    .gene-2-nuclear-transfer-s-violet{fill:none;stroke:var(--fig-violet);stroke-width:2.5}
    .gene-2-nuclear-transfer-t-violet{fill:var(--fig-violet)}
    .gene-2-nuclear-transfer-b-teal{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:2}
    .gene-2-nuclear-transfer-f-teal{fill:var(--fig-teal)}
    .gene-2-nuclear-transfer-s-teal{fill:none;stroke:var(--fig-teal);stroke-width:2.5}
    .gene-2-nuclear-transfer-t-teal{fill:var(--fig-teal)}
