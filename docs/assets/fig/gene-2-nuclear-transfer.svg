  <text x="30.0" y="34.0" class="gene-2-nuclear-transfer-h" style="font-size:14px">① 난자의 핵 파괴</text>
  <circle cx="90.0" cy="120.0" r="40.0" class="gene-2-nuclear-transfer-b-amber"/>
