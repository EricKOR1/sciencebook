  <circle cx="216.0" cy="86.4" r="2.2" class="gene-2-nuclear-transfer-ink"/>
  <text x="260.0" y="128.0" text-anchor="middle" class="gene-2-nuclear-transfer-sm" style="font-size:12px">올챙이</text>
  <line x1="250.0" y1="140.0" x2="250.0" y2="155.1" style="fill:none;stroke:var(--fig-ink);stroke-width:1.5"/>
  <polygon points="250.0,160.0 246.5,153.9 253.5,153.9" class="gene-2-nuclear-transfer-ink" style="fill:var(--fig-ink)"/>
  <rect x="206.0" y="166.0" width="30.0" height="34.0" rx="0" class="gene-2-nuclear-transfer-b-teal"/>
  <circle cx="221.0" cy="183.0" r="6.0" class="gene-2-nuclear-transfer-b-blue"/>
  <rect x="236.0" y="166.0" width="30.0" height="34.0" rx="0" class="gene-2-nuclear-transfer-b-teal"/>
  <circle cx="251.0" cy="183.0" r="6.0" class="gene-2-nuclear-transfer-b-blue"/>
  <rect x="266.0" y="166.0" width="30.0" height="34.0" rx="0" class="gene-2-nuclear-transfer-b-teal"/>
  <circle cx="281.0" cy="183.0" r="6.0" class="gene-2-nuclear-transfer-b-blue"/>
  <text x="251.0" y="222.0" text-anchor="middle" class="gene-2-nuclear-transfer-sm" style="font-size:12px">창자 세포(분화 완료)</text>
  <text x="380.0" y="34.0" class="gene-2-nuclear-transfer-h" style="font-size:14px">③ 핵 이식</text>
  <circle cx="420.0" cy="130.0" r="40.0" class="gene-2-nuclear-transfer-b-amber"/>
  <circle cx="420.0" cy="130.0" r="8.0" class="gene-2-nuclear-transfer-b-blue"/>
  <path d="M 470 76 L 432 120 L 428 116 L 466 72 Z" class="gene-2-nuclear-transfer-gray"/>
  <line x1="330.0" y1="183.0" x2="399.9" y2="138.6" style="fill:none;stroke:var(--fig-blue);stroke-width:1.5;stroke-dasharray:5 4"/>
  <polygon points="404.0,136.0 400.8,142.2 397.0,136.3" class="gene-2-nuclear-transfer-ink" style="fill:var(--fig-blue)"/>
  <text x="420.0" y="196.0" text-anchor="middle" class="gene-2-nuclear-transfer-sm" style="font-size:12px">창자 세포 핵을 넣은 난자</text>
  <text x="530.0" y="34.0" class="gene-2-nuclear-transfer-h" style="font-size:14px">④ 발생</text>
  <line x1="470.0" y1="130.0" x2="513.7" y2="130.0" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/>
  <polygon points="520.0,130.0 512.2,134.5 512.2,125.5" class="gene-2-nuclear-transfer-ink" style="fill:var(--fig-ink)"/>
  <ellipse cx="560.0" cy="110.0" rx="17.6" ry="12.0" class="gene-2-nuclear-transfer-b-green"/>
  <path d="M 576.0 106.8 Q 596.0 98.8 609.6 110 Q 596.0 118.0 576.0 114.0 Z" class="gene-2-nuclear-transfer-b-green"/>
  <circle cx="552.0" cy="106.8" r="2.0" class="gene-2-nuclear-transfer-ink"/>
  <line x1="590.0" y1="132.0" x2="606.4" y2="146.7" style="fill:none;stroke:var(--fig-ink);stroke-width:1.5"/>
  <polygon points="610.0,150.0 603.2,148.5 607.8,143.3" class="gene-2-nuclear-transfer-ink" style="fill:var(--fig-ink)"/>
  <ellipse cx="640.0" cy="176.0" rx="30.0" ry="20.0" class="gene-2-nuclear-transfer-b-green"/>
  <circle cx="628.0" cy="158.0" r="6.0" class="gene-2-nuclear-transfer-b-green"/>
  <circle cx="652.0" cy="158.0" r="6.0" class="gene-2-nuclear-transfer-b-green"/>
  <path d="M 614 184 Q 594 200 610 204" class="gene-2-nuclear-transfer-s-green"/>
  <path d="M 666 184 Q 686 200 670 204" class="gene-2-nuclear-transfer-s-green"/>
  <text x="590.0" y="226.0" text-anchor="middle" class="gene-2-nuclear-transfer-sm" style="font-size:12px">일부가 정상 올챙이와 개구리로</text>
  <text x="360.0" y="258.0" text-anchor="middle" class="gene-2-nuclear-transfer-tx" style="font-size:13px;font-weight:600">→ 분화한 세포의 핵에도 개체 전체를 만드는 유전 정보가 남아 있다</text>
