<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-ubio-11-q-o2-content d-ubio-11-q-o2-content">
  <title id="t-ubio-11-q-o2-content">그림 일반생명과학 11-15 문제 15 해설 — 정상·빈혈·CO 중독의 혈액 산소 함량</title>
  <desc id="d-ubio-11-q-o2-content">혈액 1 dL당 산소 함량을 산소 분압에 따라 나타낸 모식도. (가) 정상(헤모글로빈 15 g/dL)은 최대 약 20 mL, (나) 빈혈(7.5 g/dL)은 같은 S자 곡선의 절반 높이이다. (다) CO 중독은 산소를 실을 수 있는 헤모글로빈이 (나)와 비슷하지만 곡선이 왼쪽으로 이동하고 S자가 덜 뚜렷해, 동맥혈(100 mmHg)에서 휴식 조직(40 mmHg)으로 갈 때 내놓는 산소가 (나)보다 적다. (다)의 곡선 모양은 설명용 근사이다.</desc>
