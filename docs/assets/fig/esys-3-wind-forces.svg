3-wind-forces-v esys-3-wind-forces-halo">원심력</text><line x1="485.0" y1="160.0" x2="438.0" y2="160.0" style="stroke:var(--fig-blue);stroke-width:3"/><polygon points="430.0,160.0 440.0,154.0 440.0,166.0" style="fill:var(--fig-blue);stroke:none"/><text x="440.0" y="180.0" text-anchor="middle" class="esys-3-wind-forces-b esys-3-wind-forces-halo">전향력</text><line x1="485.0" y1="160.0" x2="485.0" y2="207.0" style="stroke:var(--fig-ink);stroke-width:3"/><polygon points="485.0,215.0 479.0,205.0 491.0,205.0" style="fill:var(--fig-ink);stroke:none"/><text x="485.0" y="233.0" text-anchor="middle" class="esys-3-wind-forces-i esys-3-wind-forces-halo">바람</text><line x1="555" y1="90" x2="715" y2="90" style="stroke:var(--fig-line);stroke-width:1.5"/><text x="553.0" y="86.0" class="esys-3-wind-forces-s">996</text><line x1="555" y1="160" x2="715" y2="160" style="stroke:var(--fig-line);stroke-width:1.5"/><text x="553.0" y="156.0" class="esys-3-wind-forces-s">1000</text><line x1="555" y1="230" x2="715" y2="230" style="stroke:var(--fig-line);stroke-width:1.5"/><text x="553.0" y="226.0" class="esys-3-wind-forces-s">1004</text><text x="635.0" y="80.0" text-anchor="middle" class="esys-3-wind-forces-s">저기압 쪽</text><text x="635.0" y="250.0" text-anchor="middle" class="esys-3-wind-forces-s">고기압 쪽</text><circle cx="635" cy="160" r="4" style="fill:var(--fig-ink)"/><line x1="635.0" y1="160.0" x2="635.0" y2="113.0" style="stroke:var(--fig-red);stroke-width:3"/><polygon points="635.0,105.0 641.0,115.0 629.0,115.0" style="fill:var(--fig-red);stroke:none"/><text x="635.0" y="97.0" text-anchor="middle" class="esys-3-wind-forces-r esys-3-wind-forces-halo">기압 경도력</text><line x1="635.0" y1="160.0" x2="654.8" y2="194.3" style="stroke:var(--fig-blue);stroke-width:3"/><polygon points="658.8,201.2 648.6,195.6 659.0,189.6" style="fill:var(--fig-blue);stroke:none"/><text x="672.8" y="215.2" class="esys-3-wind-forces-b esys-3-wind-forces-halo">전향력</text><line x1="635.0" y1="160.0" x2="618.1" y2="169.8" style="s