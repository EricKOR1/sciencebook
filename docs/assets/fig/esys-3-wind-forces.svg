<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-esys-3-wind-forces d-esys-3-wind-forces">
  <title id="t-esys-3-wind-forces">그림 지구시스템과학 3-7 바람에 작용하는 힘의 균형(북반구)</title>
  <desc id="d-esys-3-wind-forces">(가) 지균풍: 직선 등압선에서 기압 경도력과 전향력이 균형을 이루어 등압선과 나란히 분다. (나) 저기압 둘레의 경도풍: 기압 경도력(안쪽) = 전향력 + 원심력(바깥쪽), 반시계 방향. (다) 고기압 둘레의 경도풍: 전향력(안쪽) = 기압 경도력 + 원심력(바깥쪽), 시계 방향. (라) 지상풍: 마찰력이 더해져 바람이 등압선을 비스듬히 가로질러 저기압 쪽으로 분다.</desc>
  <style>
    .esys-3-wind-forces-t{font-size:13px;fill:var(--fig-ink)}
    .esys-3-wind-forces-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .esys-3-wind-forces-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .esys-3-wind-forces-s{font-size:13px;fill:var(--fig-muted)}
    .esys-3-wind-forces-r{font-size:13px;font-weight:600;fill:var(--fig-red)}
    .esys-3-wind-forces-u{font-size:13px;font-weight:600;fill:var(--fig-blue)}
    .esys-3-wind-forces-g{font-size:13px;font-weight:600;fill:var(--fig-green)}
    .esys-3-wind-forces-a{font-size:13px;font-weight:600;fill:var(--fig-amber)}
    .esys-3-wind-forces-v{font-size:13px;font-weight:600;fill:var(--fig-violet)}
    .esys-3-wind-forces-e{font-size:13px;font-weight:600;fill:var(--fig-teal)}
    .esys-3-wind-forces-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
