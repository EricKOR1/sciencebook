<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 555" role="img" aria-labelledby="t-chem-4-neutralization-ions d-chem-4-neutralization-ions">
  <title id="t-chem-4-neutralization-ions">그림 화학 4-5 중화 반응이 진행될 때 이온 수의 변화</title>
  <desc id="d-chem-4-neutralization-ions">0.10 M 염산 20 mL에 0.10 M 수산화 나트륨 수용액을 넣으면 H⁺는 OH⁻와 만나 물이 되어 줄어들다 중화점(20 mL)에서 0이 되고, 그 뒤로는 OH⁻가 늘어난다. 구경꾼 이온인 Cl⁻는 일정하고 Na⁺는 넣은 만큼 늘며, 전체 이온 수는 중화점까지 일정하다가 그 뒤 증가한다. 생성된 물의 양은 중화점까지 늘고 그 뒤 일정하다.</desc>
  <style>
    .chem-4-neutralization-ions-t{font-size:14px;fill:var(--fig-ink)} .chem-4-neutralization-ions-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .chem-4-neutralization-ions-s{font-size:13px;fill:var(--fig-muted)} .chem-4-neutralization-ions-ax{stroke:var(--fig-ink);stroke-width:1.4;fill:none}
    .chem-4-neutralization-ions-gr{stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4;fill:none;opacity:0.7}
    .chem-4-neutralization-ions-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}
    .chem-4-neutralization-ions-H{fill:var(--fig-red)} .chem-4-neutralization-ions-Cl{fill:var(--fig-green)} .chem-4-neutralization-ions-Na{fill:var(--fig-violet)} .chem-4-neutralization-ions-OH{fill:var(--fig-blue)}
    .chem-4-neutralization-ions-W{fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.5}

  </style>
