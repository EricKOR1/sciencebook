<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="t-uearth-11-hr-diagram d-uearth-11-hr-diagram">
  <title id="t-uearth-11-hr-diagram">그림 일반지구과학 11-4 H–R도와 같은 반지름 선</title>
  <desc id="d-uearth-11-hr-diagram">가로축은 표면 온도(왼쪽이 뜨거움, 로그 눈금)와 분광형, 세로축은 광도(태양 = 1, 로그 눈금)와 절대등급이다. 주계열은 왼쪽 위에서 오른쪽 아래로 이어지는 띠이고, 거성·초거성은 오른쪽 위, 백색 왜성은 왼쪽 아래에 있다. 점선은 L = R²T⁴로 그린 같은 반지름 선으로, 오른쪽 위로 갈수록 반지름이 크다. 태양, 시리우스 A·B, 리겔, 베텔게우스, 프록시마 센타우리와 예제 6의 별을 표시했다. 별의 값은 어림값.</desc>
