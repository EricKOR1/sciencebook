  <text x="180.0" y="368.0" text-anchor="middle" class="ubio-6-translation-m" style="font-family:var(--font-mono)">UGG</text>
  <text x="224.0" y="368.0" text-anchor="middle" class="ubio-6-translation-m" style="font-family:var(--font-mono)">CUU</text>
