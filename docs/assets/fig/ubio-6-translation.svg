  <text x="440.0" y="58.0" text-anchor="start" class="ubio-6-translation-s">• 작은 소단위체가 5′ 모자에 붙어</text>
  <text x="440.0" y="76.0" text-anchor="start" class="ubio-6-translation-s">   mRNA를 따라 첫 AUG를 찾는다</text>
  <text x="440.0" y="98.0" text-anchor="start" class="ubio-6-translation-s">• 개시 tRNA(Met)가 P 자리 AUG에 결합</text>
  <text x="440.0" y="120.0" text-anchor="start" class="ubio-6-translation-s">• 큰 소단위체가 결합(GTP 사용)</text>
  <text x="20.0" y="196.0" text-anchor="start" class="ubio-6-translation-h">② 신장</text>
  <line x1="40.0" y1="300.0" x2="266.0" y2="300.0" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/>
  <text x="34.0" y="305.0" text-anchor="end" class="ubio-6-translation-s">5′</text>
  <text x="272.0" y="305.0" text-anchor="start" class="ubio-6-translation-s">3′</text>
  <text x="92.0" y="320.0" text-anchor="middle" class="ubio-6-translation-m" style="font-family:var(--font-mono)">UCA</text>
  <text x="136.0" y="320.0" text-anchor="middle" class="ubio-6-translation-m" style="font-family:var(--font-mono)">GAA</text>
