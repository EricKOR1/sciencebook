  <text x="432.0" y="489.0" text-anchor="middle" class="ubio-6-translation-s" style="fill:var(--fig-ink)">Met</text>
  <text x="337.0" y="454.0" text-anchor="middle" class="ubio-6-translation-s">떨어져 나온 폴리펩타이드</text>
  <text x="440.0" y="514.0" text-anchor="start" class="ubio-6-translation-s">• A 자리에 종결 코돈(UAA, UAG, UGA)</text>
  <text x="440.0" y="534.0" text-anchor="start" class="ubio-6-translation-s" style="fill:var(--fig-amber)">• tRNA 대신 방출 인자(RF, 단백질)가 결합</text>
  <text x="440.0" y="554.0" text-anchor="start" class="ubio-6-translation-s">• 사슬에 물이 더해져 끊어지고</text>
  <text x="440.0" y="574.0" text-anchor="start" class="ubio-6-translation-s">   리보솜 소단위체가 분리된다</text>
  <text x="360.0" y="656.0" text-anchor="middle" class="ubio-6-translation-s">E·P·A 자리, tRNA, 리보솜의 크기와 모양은 모식적이다. 아미노산 사슬은 N 말단(Met)부터 자란다.</text>
</svg>
