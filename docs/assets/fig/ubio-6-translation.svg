<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 665" role="img" aria-labelledby="t-ubio-6-translation d-ubio-6-translation">
  <title id="t-ubio-6-translation">그림 일반생명과학 6-7 번역의 개시, 신장, 종결</title>
  <desc id="d-ubio-6-translation">개시: 작은 소단위체가 5′ 모자에 붙어 첫 AUG를 찾고 개시 tRNA(Met)가 P 자리에 놓인 뒤 큰 소단위체가 결합한다. 신장: 아미노아실 tRNA가 A 자리에 들어오고, P 자리의 사슬이 A 자리 아미노산으로 옮겨지며 펩타이드 결합이 생기고, 리보솜이 코돈 하나만큼 3′ 쪽으로 이동해 빈 tRNA는 E 자리로 나간다. 종결: A 자리의 종결 코돈에 방출 인자가 붙어 폴리펩타이드가 떨어지고 리보솜이 분리된다.</desc>
  <style>.ubio-6-translation-t{font-size:14px;fill:var(--fig-ink)} .ubio-6-translation-s{font-size:13px;fill:var(--fig-muted)} .ubio-6-translation-b{font-size:14px;fill:var(--fig-ink);font-weight:600} .ubio-6-translation-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-6-translation-m{font-size:13px;fill:var(--fig-ink)}</style>
