  <rect x="404.0" y="358.0" width="36.0" height="20.0" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4"/>
  <text x="422.0" y="373.0" text-anchor="middle" class="ubio-6-translation-s" style="fill:var(--fig-ink)">Met</text>
  <text x="332.0" y="338.0" text-anchor="middle" class="ubio-6-translation-s">떨어져 나온 폴리펩타이드</text>
  <text x="440.0" y="400.0" text-anchor="start" class="ubio-6-translation-s">• A 자리에 종결 코돈(UAA, UAG, UGA)</text>
  <text x="440.0" y="422.0" text-anchor="start" class="ubio-6-translation-s" style="fill:var(--fig-amber)">• tRNA 대신 방출 인자(RF, 단백질)가 결합</text>
  <text x="440.0" y="444.0" text-anchor="start" class="ubio-6-translation-s">• 사슬에 물이 더해져 끊어지고</text>
  <text x="440.0" y="462.0" text-anchor="start" class="ubio-6-translation-s">   리보솜 소단위체가 분리된다</text>
  <text x="360.0" y="520.0" text-anchor="middle" class="ubio-6-translation-s">E·P·A 자리, tRNA, 리보솜의 크기와 모양은 모식적이다. 아미노산 사슬은 N 말단(Met)부터 자란다.</text>
</svg>
