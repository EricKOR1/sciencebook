  <text x="180.0" y="72.0" text-anchor="middle" class="ubio-6-translation-s">A</text>
  <rect x="119.0" y="84.0" width="34.0" height="40.0" rx="4" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6"/>
  <text x="136.0" y="119.0" text-anchor="middle" class="ubio-6-translation-s" style="fill:var(--fig-ink)">UAC</text>
  <rect x="118.0" y="60.0" width="36.0" height="20.0" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4"/>
  <text x="136.0" y="75.0" text-anchor="middle" class="ubio-6-translation-s" style="fill:var(--fig-ink)">Met</text>
