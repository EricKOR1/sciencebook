  <text x="92.0" y="341.0" text-anchor="middle" class="ubio-6-translation-s" style="fill:var(--fig-ink)">AGU</text>
  <rect x="119.0" y="306.0" width="34.0" height="40.0" rx="4" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6"/>
  <text x="136.0" y="341.0" text-anchor="middle" class="ubio-6-translation-s" style="fill:var(--fig-ink)">CUU</text>
  <rect x="118.0" y="282.0" width="36.0" height="20.0" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4"/>
  <text x="136.0" y="297.0" text-anchor="middle" class="ubio-6-translation-s" style="fill:var(--fig-ink)">Glu</text>
  <rect x="118.0" y="260.0" width="36.0" height="20.0" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4"/>
  <text x="136.0" y="275.0" text-anchor="middle" class="ubio-6-translation-s" style="fill:var(--fig-ink)">Ser</text>
  <rect x="118.0" y="238.0" width="36.0" height="20.0" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4"/>
  <text x="136.0" y="253.0" text-anchor="middle" class="ubio-6-translation-s" style="fill:var(--fig-ink)">Met</text>
  <rect x="163.0" y="306.0" width="34.0" height="40.0" rx="4" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.6"/>
  <text x="180.0" y="341.0" text-anchor="middle" class="ubio-6-translation-s" style="fill:var(--fig-ink)">ACC</text>
  <rect x="162.0" y="282.0" width="36.0" height="20.0" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4"/>
  <text x="180.0" y="297.0" text-anchor="middle" class="ubio-6-translation-s" style="fill:var(--fig-ink)">Trp</text>
  <path d="M154.0 292 C158 276 164 276 162.0 290" style="fill:none;stroke:var(--fig-red);stroke-width:1.8" marker-end="url(#ubio-6-translation-ar0)"/>
  <text x="40.0" y="416.0" text-anchor="start" class="ubio-6-translation-s">E: 빈 tRNA가 나감</text>
  <line x1="214.0" y1="387.0" x2="248.0" y2="387.0" style="fill:none;stroke:var(--fig-accent);stroke-width:2" marker-end="url(#ubio-6-translation-ar1)"/>
  <text x="252.0" y="392.0" text-anchor="start" class="ubio-6-translation-s" style="fill:var(--fig-accent)">자리 옮김(3′ 쪽으로)</text>
  <text x="440.0" y="240.0" text-anchor="start" class="ubio-6-translation-s">1. 아미노아실 tRNA가 A 자리에 들어옴</text>
  <text x="440.0" y="260.0" text-anchor="start" class="ubio-6-translation-s">   (코돈–안티코돈 짝 확인)</text>
  <text x="440.0" y="280.0" text-anchor="start" class="ubio-6-translation-s" style="fill:var(--fig-red)">2. P 자리 사슬이 A 자리 아미노산으로</text>
  <text x="440.0" y="300.0" text-anchor="start" class="ubio-6-translation-s" style="fill:var(--fig-red)">   옮겨지며 펩타이드 결합(rRNA가 촉매)</text>
  <text x="440.0" y="320.0" text-anchor="start" class="ubio-6-translation-s" style="fill:var(--fig-accent)">3. 리보솜이 코돈 하나만큼 3′ 쪽으로</text>
  <text x="440.0" y="340.0" text-anchor="start" class="ubio-6-translation-s" style="fill:var(--fig-accent)">   이동, 빈 tRNA는 E 자리를 거쳐 나감</text>
  <text x="20.0" y="440.0" text-anchor="start" class="ubio-6-translation-h">③ 종결</text>
