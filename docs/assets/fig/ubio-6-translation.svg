  <text x="180.0" y="548.0" text-anchor="middle" class="ubio-6-translation-s" style="fill:var(--fig-ink)">RF</text>
  <text x="180.0" y="636.0" text-anchor="middle" class="ubio-6-translation-s" style="fill:var(--fig-red)">종결 코돈</text>
  <rect x="224.0" y="464.0" width="36.0" height="20.0" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4"/>
  <text x="242.0" y="479.0" text-anchor="middle" class="ubio-6-translation-s" style="fill:var(--fig-ink)">Arg</text>
  <rect x="262.0" y="474.0" width="36.0" height="20.0" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4"/>
  <text x="280.0" y="489.0" text-anchor="middle" class="ubio-6-translation-s" style="fill:var(--fig-ink)">Leu</text>
  <rect x="300.0" y="464.0" width="36.0" height="20.0" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4"/>
