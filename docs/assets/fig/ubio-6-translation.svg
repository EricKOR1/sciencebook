  <text x="180.0" y="516.0" text-anchor="middle" class="ubio-6-translation-s" style="fill:var(--fig-red)">종결 코돈</text>
  <rect x="224.0" y="350.0" width="36.0" height="20.0" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4"/>
