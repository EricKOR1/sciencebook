  <text x="48.0" y="200.0" text-anchor="start" class="ubio-6-translation-s">빈 tRNA가 나감</text>
  <rect x="119.0" y="256.0" width="34.0" height="40.0" rx="4" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6"/>
  <text x="136.0" y="291.0" text-anchor="middle" class="ubio-6-translation-s" style="fill:var(--fig-ink)">CUU</text>
  <rect x="118.0" y="232.0" width="36.0" height="20.0" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4"/>
  <text x="136.0" y="247.0" text-anchor="middle" class="ubio-6-translation-s" style="fill:var(--fig-ink)">Glu</text>
  <rect x="118.0" y="210.0" width="36.0" height="20.0" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4"/>
  <text x="136.0" y="225.0" text-anchor="middle" class="ubio-6-translation-s" style="fill:var(--fig-ink)">Ser</text>
  <rect x="118.0" y="188.0" width="36.0" height="20.0" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4"/>
