  <text x="264.0" y="345.0" text-anchor="start" class="ubio-6-translation-s" style="fill:var(--fig-accent)">자리 옮김</text>
  <text x="440.0" y="220.0" text-anchor="start" class="ubio-6-translation-s">1. 아미노아실 tRNA가 A 자리에 들어옴</text>
  <text x="440.0" y="238.0" text-anchor="start" class="ubio-6-translation-s">   (코돈–안티코돈 짝 확인)</text>
  <text x="440.0" y="260.0" text-anchor="start" class="ubio-6-translation-s" style="fill:var(--fig-red)">2. P 자리 사슬이 A 자리 아미노산으로</text>
  <text x="440.0" y="278.0" text-anchor="start" class="ubio-6-translation-s" style="fill:var(--fig-red)">   옮겨지며 펩타이드 결합(rRNA가 촉매)</text>
  <text x="440.0" y="300.0" text-anchor="start" class="ubio-6-translation-s" style="fill:var(--fig-accent)">3. 리보솜이 코돈 하나만큼 3′ 쪽으로</text>
  <text x="440.0" y="318.0" text-anchor="start" class="ubio-6-translation-s" style="fill:var(--fig-accent)">   이동, 빈 tRNA는 E 자리를 거쳐 나감</text>
  <text x="20.0" y="366.0" text-anchor="start" class="ubio-6-translation-h">③ 종결</text>
