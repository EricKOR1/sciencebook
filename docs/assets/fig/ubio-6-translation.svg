  <text x="34.0" y="145.0" text-anchor="end" class="ubio-6-translation-s">5′</text>
  <text x="272.0" y="145.0" text-anchor="start" class="ubio-6-translation-s">3′</text>
  <circle cx="40.0" cy="140.0" r="7" style="fill:var(--fig-violet)"/>
  <text x="92.0" y="158.0" text-anchor="middle" class="ubio-6-translation-m" style="font-family:var(--font-mono)">GGC</text>
  <text x="136.0" y="158.0" text-anchor="middle" class="ubio-6-translation-m" style="font-family:var(--font-mono)">AUG</text>
  <text x="180.0" y="158.0" text-anchor="middle" class="ubio-6-translation-m" style="font-family:var(--font-mono)">UCA</text>
  <text x="224.0" y="158.0" text-anchor="middle" class="ubio-6-translation-m" style="font-family:var(--font-mono)">GAA</text>
  <rect x="119.0" y="96.0" width="34.0" height="40.0" rx="4" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6"/>
  <text x="136.0" y="131.0" text-anchor="middle" class="ubio-6-translation-s" style="fill:var(--fig-ink)">UAC</text>
  <rect x="118.0" y="72.0" width="36.0" height="20.0" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4"/>
  <text x="136.0" y="87.0" text-anchor="middle" class="ubio-6-translation-s" style="fill:var(--fig-ink)">Met</text>
  <text x="136.0" y="206.0" text-anchor="middle" class="ubio-6-translation-s" style="fill:var(--fig-green)">개시 코돈</text>
  <text x="218.0" y="90.0" text-anchor="start" class="ubio-6-translation-s" style="fill:var(--fig-teal)">큰 소단위체</text>
  <text x="218.0" y="108.0" text-anchor="start" class="ubio-6-translation-s" style="fill:var(--fig-teal)">결합</text>
  <text x="218.0" y="182.0" text-anchor="start" class="ubio-6-translation-s" style="fill:var(--fig-teal)">작은 소단위체</text>
  <text x="440.0" y="64.0" text-anchor="start" class="ubio-6-translation-s">• 작은 소단위체가 5′ 모자에 붙어</text>
  <text x="440.0" y="84.0" text-anchor="start" class="ubio-6-translation-s">   mRNA를 따라 첫 AUG를 찾는다</text>
  <text x="440.0" y="104.0" text-anchor="start" class="ubio-6-translation-s">• 개시 tRNA(Met)가 P 자리 AUG에 결합</text>
  <text x="440.0" y="124.0" text-anchor="start" class="ubio-6-translation-s">• 큰 소단위체가 결합(GTP 사용)</text>
  <text x="20.0" y="224.0" text-anchor="start" class="ubio-6-translation-h">② 신장</text>
  <rect x="62.0" y="376.0" width="148.0" height="22.0" rx="10" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.8"/>
  <rect x="62.0" y="274.0" width="148.0" height="70.0" rx="16" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.8"/>
  <text x="92.0" y="290.0" text-anchor="middle" class="ubio-6-translation-s">E</text>
  <text x="136.0" y="290.0" text-anchor="middle" class="ubio-6-translation-s">P</text>
  <text x="180.0" y="290.0" text-anchor="middle" class="ubio-6-translation-s">A</text>
