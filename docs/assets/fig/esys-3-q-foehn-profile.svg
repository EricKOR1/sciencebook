  <text x="52" y="265" text-anchor="end" class="esys-3-q-foehn-profile-s">0</text>
  <line x1="56" y1="200" x2="64" y2="200" class="esys-3-q-foehn-profile-ax"/>
  <text x="52" y="205" text-anchor="end" class="esys-3-q-foehn-profile-s">500</text>
  <line x1="64" y1="200" x2="700" y2="200" class="esys-3-q-foehn-profile-gr"/>
  <line x1="56" y1="140" x2="64" y2="140" class="esys-3-q-foehn-profile-ax"/>
