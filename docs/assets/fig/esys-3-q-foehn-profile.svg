  <text x="380" y="50" text-anchor="middle" class="esys-3-q-foehn-profile-s">5 °C / 5 °C</text>
  <text x="660" y="286" text-anchor="middle" class="esys-3-q-foehn-profile-b">반대편 0 m</text>
  <text x="660" y="304" text-anchor="middle" class="esys-3-q-foehn-profile-s">20 °C / 8 °C</text>
