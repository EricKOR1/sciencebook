<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-esys-3-q-foehn-profile d-esys-3-q-foehn-profile">
  <title id="t-esys-3-q-foehn-profile">그림 지구시스템과학 3-11 문제 6 해설의 산을 넘는 공기의 기온과 이슬점</title>
  <desc id="d-esys-3-q-foehn-profile">해발 0 m에서 기온 15 °C, 이슬점 11 °C인 공기는 건조 단열 감률로 식다가 500 m에서 포화되어(구름 밑면, 10 °C) 산꼭대기 1500 m까지 습윤 단열 감률로 식어 5 °C가 된다. 비를 내린 뒤 건조 단열 감률로 1500 m를 내려가 반대편 해발 0 m에서 기온 20 °C, 이슬점 8 °C가 된다. 높이를 과장한 모식도이다.</desc>
  <style>
    .esys-3-q-foehn-profile-t{font-size:14px;fill:var(--fig-ink)} .esys-3-q-foehn-profile-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .esys-3-q-foehn-profile-s{font-size:13px;fill:var(--fig-muted)} .esys-3-q-foehn-profile-ax{fill:none;stroke:var(--fig-muted);stroke-width:1.4} .esys-3-q-foehn-profile-gr{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4}
  </style>
