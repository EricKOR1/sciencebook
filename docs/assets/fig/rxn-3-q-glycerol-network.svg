  <desc id="d-rxn-3-q-glycerol-network">(가) 작용기가 2개인 단위체만 쓰면 사슬이 한 줄로만 자란다. (나) 하이드록시기가 3개인 글리세롤이 들어가면 셋째 하이드록시기가 다른 사슬의 카복실기 쪽과 에스터 결합으로 이어져 사슬 사이가 연결된 그물 구조가 된다. 단위체는 도형으로 줄여 나타낸 모식도이다.</desc>
