<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="t-pchem-8-hydrogen-levels d-pchem-8-hydrogen-levels">
  <title id="t-pchem-8-hydrogen-levels">그림 물리화학 8-9 수소 원자의 에너지 준위도(그로트리안 도표)</title>
  <desc id="d-pchem-8-hydrogen-levels">l = 0(s), 1(p), 2(d), 3(f) 네 열에 n = 1~5 준위를 E = −13.60, −3.40, −1.51, −0.85, −0.54 eV 높이에 그었다(l ≤ n − 1인 열에만). 같은 n의 준위는 l과 무관하게 같은 높이이다(우연 축퇴, gn = n²). E = 0은 이온화(13.60 eV). 전이 화살표는 Δl = ±1을 지킨다: 라이먼 α(2p → 1s, 121.6 nm), 발머 α(3s → 2p, 3d → 2p, 656.5 nm), 발머 β(4d → 2p, 486.3 nm). 세로축은 에너지에 비례한다.</desc>
