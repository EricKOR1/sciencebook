    .earth-3-eclipse-nodes-frame{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .earth-3-eclipse-nodes-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
