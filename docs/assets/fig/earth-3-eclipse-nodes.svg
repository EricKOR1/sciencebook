<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-earth-3-eclipse-nodes d-earth-3-eclipse-nodes">
  <title id="t-earth-3-eclipse-nodes">그림 지구과학 3-3 달 궤도의 기울기와 식이 일어나는 시기</title>
  <desc id="d-earth-3-eclipse-nodes">달의 공전 궤도면은 지구 공전 궤도면에 약 5° 기울어 있어, 대부분의 삭과 망에서 달은 지구 공전 궤도면의 위나 아래를 지난다. 두 궤도면이 만나는 교점이 태양 방향을 향하는 시기(1년에 두 번 정도)에만 삭이나 망 때 태양–지구–달이 일직선이 되어 식이 일어난다. 기울기와 크기를 과장한 모식도이다.</desc>
