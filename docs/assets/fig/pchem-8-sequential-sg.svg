<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="t-pchem-8-sequential-sg d-pchem-8-sequential-sg">
  <title id="t-pchem-8-sequential-sg">그림 물리화학 8-13 연속 슈테른–게를라흐 실험</title>
  <desc id="d-pchem-8-sequential-sg">SG-z 장치에서 +z 빔(1/2)만 남기고 −z 빔은 막는다. 이 빔을 SG-x 장치에 넣으면 +x와 −x로 반반(각 1/4) 갈라지고, −x는 막는다. +x 빔을 다시 SG-z 장치에 넣으면 +z와 −z가 각각 1/8로 다시 반반 나온다. Sx를 측정하면 앞서 정한 Sz 정보가 지워진다. 세기는 처음 빔에 대한 비이다.</desc>
  <style>.pchem-8-sequential-sg-lbl{font-size:14px;fill:var(--fig-ink)} .pchem-8-sequential-sg-sm{font-size:13px;fill:var(--fig-muted)} .pchem-8-sequential-sg-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .pchem-8-sequential-sg-tk{font-size:13px;fill:var(--fig-muted)} .pchem-8-sequential-sg-ax{font-size:14px;fill:var(--fig-ink)} .pchem-8-sequential-sg-big{font-size:16px;font-weight:700;fill:var(--fig-ink)} .pchem-8-sequential-sg-red{font-size:14px;fill:var(--fig-red)} .pchem-8-sequential-sg-redb{font-size:14px;font-weight:600;fill:var(--fig-red)} .pchem-8-sequential-sg-blue{font-size:14px;fill:var(--fig-blue)} .pchem-8-sequential-sg-blueb{font-size:14px;font-weight:600;fill:var(--fig-blue)} .pchem-8-sequential-sg-green{font-size:14px;fill:var(--fig-green)} .pchem-8-sequential-sg-greenb{font-size:14px;font-weight:600;fill:var(--fig-green)} .pchem-8-sequential-sg-amber{font-size:14px;fill:var(--fig-amber)} .pchem-8-sequential-sg-amberb{font-size:14px;font-weight:600;fill:var(--fig-amber)} .pchem-8-sequential-sg-violet{font-size:14px;fill:var(--fig-violet)} .pchem-8-sequential-sg-violetb{font-size:14px;font-weight:600;fill:var(--fig-violet)} .pchem-8-sequential-sg-teal{font-size:14px;fill:var(--fig-teal)} .pchem-8-sequential-sg-tealb{font-size:14px;font-weight:600;fill:var(--fig-teal)} .pchem-8-sequential-sg-accent{font-size:14px;fill:var(--fig-accent)} .pchem-8-sequential-sg-accentb{font-size:14px;font-weight:600;fill:var(--fig-accent)}</style>
  <line x1="14.0" y1="86.0" x2="56.0" y2="86.0" style="stroke:var(--fig-ink);stroke-width:2.4"/>
  <path d="M66.0 86.0 L56.0 91.0 L56.0 81.0 Z" style="fill:var(--fig-ink);stroke:none"/>
  <text x="14.0" y="76.0" class="pchem-8-sequential-sg-sm">입력 빔 1</text>
  <rect x="68.0" y="46.0" width="110.0" height="80.0" rx="8" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2"/>
  <text x="123.0" y="92.0" text-anchor="middle" class="pchem-8-sequential-sg-big">SG-z</text>
  <line x1="178.0" y1="68.0" x2="238.0" y2="68.0" style="stroke:var(--fig-red);stroke-width:2.4"/>
  <path d="M248.0 68.0 L238.0 73.0 L238.0 63.0 Z" style="fill:var(--fig-red);stroke:none"/>
  <text x="196.0" y="58.0" class="pchem-8-sequential-sg-redb">+z  1/2</text>
  <line x1="178.0" y1="104.0" x2="214.0" y2="120.0" style="stroke:var(--fig-blue);stroke-width:2.4"/>
  <rect x="214.0" y="110.0" width="8.0" height="24.0" style="fill:var(--fig-ink);stroke:none"/>
  <text x="178.0" y="148.0" class="pchem-8-sequential-sg-blue">−z 막음</text>
  <rect x="250.0" y="46.0" width="110.0" height="80.0" rx="8" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2"/>
  <text x="305.0" y="92.0" text-anchor="middle" class="pchem-8-sequential-sg-big">SG-x</text>
  <line x1="360.0" y1="68.0" x2="420.0" y2="68.0" style="stroke:var(--fig-red);stroke-width:2.4"/>
  <path d="M430.0 68.0 L420.0 73.0 L420.0 63.0 Z" style="fill:var(--fig-red);stroke:none"/>
  <text x="372.0" y="58.0" class="pchem-8-sequential-sg-redb">+x  1/4</text>
  <line x1="360.0" y1="104.0" x2="396.0" y2="120.0" style="stroke:var(--fig-blue);stroke-width:2.4"/>
  <rect x="396.0" y="110.0" width="8.0" height="24.0" style="fill:var(--fig-ink);stroke:none"/>
  <text x="360.0" y="148.0" class="pchem-8-sequential-sg-blue">−x 막음</text>
  <rect x="432.0" y="46.0" width="110.0" height="80.0" rx="8" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2"/>
  <text x="487.0" y="92.0" text-anchor="middle" class="pchem-8-sequential-sg-big">SG-z</text>
  <line x1="542.0" y1="68.0" x2="600.5" y2="49.1" style="stroke:var(--fig-red);stroke-width:2.4"/>
  <path d="M610.0 46.0 L602.0 53.8 L598.9 44.3 Z" style="fill:var(--fig-red);stroke:none"/>
  <text x="614.0" y="48.0" class="pchem-8-sequential-sg-redb">+z  1/8</text>
  <line x1="542.0" y1="104.0" x2="600.5" y2="122.9" style="stroke:var(--fig-blue);stroke-width:2.4"/>
  <path d="M610.0 126.0 L598.9 127.7 L602.0 118.2 Z" style="fill:var(--fig-blue);stroke:none"/>
  <text x="614.0" y="132.0" class="pchem-8-sequential-sg-blueb">−z  1/8</text>
  <text x="360.0" y="196.0" text-anchor="middle" class="pchem-8-sequential-sg-violetb">−z가 다시 나타남 → S<tspan baseline-shift="sub" style="font-size:75%">x</tspan> 측정이 S<tspan baseline-shift="sub" style="font-size:75%">z</tspan> 정보를 지움</text>
  <text x="360.0" y="220.0" text-anchor="middle" class="pchem-8-sequential-sg-sm">(+x 상태는 +z와 −z를 반반 섞은 상태: [Ŝ<tspan baseline-shift="sub" style="font-size:75%">z</tspan>, Ŝ<tspan baseline-shift="sub" style="font-size:75%">x</tspan>] = iħŜ<tspan baseline-shift="sub" style="font-size:75%">y</tspan> ≠ 0)</text>
</svg>
