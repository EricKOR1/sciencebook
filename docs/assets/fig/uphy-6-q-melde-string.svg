  <title id="t-uphy-6-q-melde-string">그림 일반물리학 6-5 예제 5의 진동자로 만든 줄의 정상파</title>
  <desc id="d-uphy-6-q-melde-string">진동자와 도르래 사이 길이 1.20 m인 줄(양 끝 고정)을 120 Hz로 흔들어 배가 4개인 정상파가 생겼다. 줄의 다른 쪽은 도르래를 지나 추에 매달려 있다. 실선과 점선은 반주기 차이의 두 순간 모습이다.</desc>
