  <title id="t-emq-2-lcd-pixel">그림 전자기와 양자 2-6 액정 디스플레이(LCD) 화소가 빛을 켜고 끄는 원리</title>
  <desc id="d-emq-2-lcd-pixel">백라이트의 비편광 빛이 편광판 1(투과축 세로)을 지나 세로 선편광이 된다. 전압을 걸지 않으면 액정이 편광 방향을 90° 돌려 가로가 되므로 투과축이 가로인 편광판 2를 통과해 밝다. 전압을 걸면 액정 분자가 전기장 방향으로 늘어서 편광을 돌리지 못하므로 세로 편광이 편광판 2에서 막혀 어둡다.</desc>
