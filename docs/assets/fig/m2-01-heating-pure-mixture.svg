  <title id="t-m2-01-heating-pure-mixture">그림 중2-1-4 물과 소금물의 가열 곡선</title>
  <desc id="d-m2-01-heating-pure-mixture">본문 표의 값을 그린 그래프. 순물질인 물은 100 °C에서 온도가 일정하게 유지되며 끓지만, 혼합물인 소금물은 100 °C보다 높은 온도에서 끓기 시작하고 끓는 동안에도 온도가 조금씩 올라간다.</desc>
