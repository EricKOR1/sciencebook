<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 416" role="img" aria-labelledby="t-2-3-three-ways-octet d-2-3-three-ways-octet">
  <title id="t-2-3-three-ways-octet">그림 2-3-5 18족과 같은 전자 배치가 되는 세 가지 방법</title>
  <desc id="d-2-3-three-ways-octet">나트륨은 원자가 전자 1개를 잃어 네온과, 염소는 전자 1개를 얻어 아르곤과 같은 전자 배치가 된다. 수소 원자 2개는 전자를 1개씩 내놓아 함께 나누어(공유하여) 각각 헬륨처럼 전자 2개를 가진 것과 같아진다. 이온이 되어도 양성자 수는 그대로이므로 원소의 종류는 바뀌지 않는다. 모식도.</desc>
