<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-m2-05-gas d-m2-05-gas">
  <title id="t-m2-05-gas">그림 중2-5-2 낮과 밤, 식물의 기체 출입</title>
  <desc id="d-m2-05-gas">호흡은 밤낮없이 일어나고 광합성은 빛이 있을 때만 일어난다. 빛이 강한 낮에는 광합성량이 호흡량보다 많아 이산화 탄소를 흡수하고 산소를 내보낸다. 빛이 약한 아침·저녁에는 두 양이 비슷해 드러나는 출입이 거의 없고, 밤에는 호흡만 하므로 산소를 흡수하고 이산화 탄소를 내보낸다. 막대 길이는 크기를 비교하기 위한 모식도이다.</desc>
  <style>
    .m2-05-gas-t{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .m2-05-gas-k{font-size:13px;fill:var(--fig-ink)}
    .m2-05-gas-s{font-size:13px;fill:var(--fig-muted)}
    .m2-05-gas-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2}
    .m2-05-gas-leaf{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.6}
  </style>
