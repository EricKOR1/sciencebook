<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="t-bio-1-organ-systems d-bio-1-organ-systems">
  <title id="t-bio-1-organ-systems">그림 생명과학 1-1 소화계·호흡계·순환계·배설계를 이루는 기관의 위치</title>
  <desc id="d-bio-1-organ-systems">사람 몸통에서 소화계(간, 위, 소장, 대장), 호흡계(기관, 폐), 순환계(심장, 혈관), 배설계(콩팥, 오줌관, 방광)를 이루는 기관의 위치를 색으로 구분해 나타냈다. 콩팥은 등 쪽에 있다. 모식도(크기와 모양은 단순화함).</desc>
