<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-cell-1-nucleotide-dna d-cell-1-nucleotide-dna">
  <title id="t-cell-1-nucleotide-dna">그림 세포와 물질대사 1-2 뉴클레오타이드와 DNA·RNA의 구조</title>
  <desc id="d-cell-1-nucleotide-dna">뉴클레오타이드는 인산, 5탄당, 염기로 이루어진다. 한 뉴클레오타이드의 당과 다음 뉴클레오타이드의 인산이 결합해 당–인산 뼈대를 만들고 염기는 옆으로 튀어나온다. DNA는 두 가닥의 염기가 A–T, G–C로 상보 결합한 이중 가닥이고, RNA는 T 대신 U를 가진 단일 가닥이다. 화학식 대신 모양으로 나타낸 모식도.</desc>
