<title id="t-m1-02-biodiversity-levels">그림 중1-2-5 생물다양성의 세 가지 의미</title>
<desc id="d-m1-02-biodiversity-levels">유전적 다양성은 같은 종 안에서 개체마다 특징이 다른 정도, 종 다양성은 종의 수와 각 종이 고르게 분포하는 정도, 생태계 다양성은 숲·하천·갯벌·바다 같은 생태계의 다양한 정도이다. 모식도.</desc>
