<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-uphy-6-phase-sum d-uphy-6-phase-sum">
  <title id="t-uphy-6-phase-sum">그림 일반물리학 6-6 위상차가 있는 두 파동의 합성과 위상자</title>
  <desc id="d-uphy-6-phase-sum">왼쪽: 진폭이 같고 위상차가 π/2인 두 사인파(파랑, 주황)를 더하면 같은 파장의 사인파(보라)가 되고 진폭은 2y_m cos(φ/2) = √2 y_m이다. 오른쪽: 각 파동을 길이 y_m, 각 φ인 화살표(위상자)로 나타내 이어 붙이면 합성 화살표의 길이가 합성 진폭이다.</desc>
