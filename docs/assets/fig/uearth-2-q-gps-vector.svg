<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" class="fig-small" role="img" aria-labelledby="t-uearth-2-q-gps-vector d-uearth-2-q-gps-vector">
<title id="t-uearth-2-q-gps-vector">그림 일반지구과학 2-11 예제 6 풀이 — GPS 속도의 합성</title>
<desc id="d-uearth-2-q-gps-vector">동쪽 성분 3.0 cm/년과 북쪽 성분 4.0 cm/년을 합성하면 북쪽에서 동쪽으로 약 37° 기운 5.0 cm/년의 속도가 된다. 화살표 길이는 속력에 비례한다.</desc>
<style>.uearth-2-q-gps-vector-t{font-size:14px;fill:var(--fig-ink)} .uearth-2-q-gps-vector-s{font-size:13px;fill:var(--fig-muted)} .uearth-2-q-gps-vector-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .uearth-2-q-gps-vector-b{font-size:14px;font-weight:700;fill:var(--fig-ink)}</style>
