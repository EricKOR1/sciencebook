<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" class="fig-small" role="img" aria-labelledby="t-uphy-10-q-rlc-phasor d-uphy-10-q-rlc-phasor">
  <title id="t-uphy-10-q-rlc-phasor">그림 일반물리학 10-7 예제 8 풀이의 페이저</title>
  <desc id="d-uphy-10-q-rlc-phasor">전류를 기준(가로)으로 그린 예제 8의 전압 페이저이다. V_R = 176 V는 가로, V_L = 443 V는 위, V_C = 312 V는 아래를 향한다. V_L과 V_C를 먼저 더하면 위로 131 V가 남고, 이것과 V_R의 합이 전원 전압 220 V이며 전류보다 약 36.7° 앞선다. 화살표 길이는 전압의 크기에 비례한다.</desc>
  <style>.u10qb-t{font-size:14px;fill:var(--fig-ink)} .u10qb-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .u10qb-s{font-size:13px;fill:var(--fig-muted)} .u10qb-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}</style>
<line x1="40.0" y1="235.0" x2="450.0" y2="235.0" style="stroke:var(--fig-line);stroke-width:1.2;stroke-dasharray:4 4;fill:none"/>
<text x="450.0" y="255.0" text-anchor="end" class="u10qb-s">I (기준)</text>
<line x1="110.0" y1="235.0" x2="110.0" y2="23.5" style="stroke:var(--fig-red);stroke-width:2.6;fill:none"/>
<path d="M110.0 13.5 L115.0 23.5 L105.0 23.5 Z" style="fill:var(--fig-red);stroke:none"/>
<text x="102.0" y="25.5" text-anchor="end" class="u10qb-t" style="fill:var(--fig-red)">V_L = 443 V</text>
<line x1="110.0" y1="235.0" x2="110.0" y2="381.0" style="stroke:var(--fig-blue);stroke-width:2.6;fill:none"/>
<path d="M110.0 391.0 L105.0 381.0 L115.0 381.0 Z" style="fill:var(--fig-blue);stroke:none"/>
<text x="102.0" y="387.0" text-anchor="end" class="u10qb-t" style="fill:var(--fig-blue)">V_C = 312 V</text>
<line x1="110.0" y1="235.0" x2="188.0" y2="235.0" style="stroke:var(--fig-green);stroke-width:2.8;fill:none"/>
<path d="M198.0 235.0 L188.0 240.0 L188.0 230.0 Z" style="fill:var(--fig-green);stroke:none"/>
<text x="118.0" y="257.0" class="u10qb-t" style="fill:var(--fig-green)">V_R = 176 V</text>
<line x1="198.0" y1="235.0" x2="198.0" y2="179.5" style="stroke:var(--fig-violet);stroke-width:2.2;stroke-dasharray:6 4;fill:none"/>
<path d="M198.0 169.5 L203.0 179.5 L193.0 179.5 Z" style="fill:var(--fig-violet);stroke:none"/>
<text x="208.0" y="214.2" class="u10qb-t" style="fill:var(--fig-violet)">V_L − V_C = 131 V</text>
<line x1="110.0" y1="235.0" x2="190.0" y2="175.5" style="stroke:var(--fig-ink);stroke-width:3.2;fill:none"/>
<path d="M198.0 169.5 L193.0 179.5 L187.0 171.5 Z" style="fill:var(--fig-ink);stroke:none"/>
<text x="206.0" y="161.5" class="u10qb-b">V = 220 V</text>
<path d="M140.0 235.0 A30 30 0 0 0 134.1 217.1" style="fill:none;stroke:var(--fig-muted);stroke-width:1.5"/>
<text x="143.0" y="230.0" class="u10qb-s">φ</text>
<text x="240.0" y="425.0" text-anchor="middle" class="u10qb-s">실횻값 페이저, φ ≈ 36.7° (길이는 크기에 비례)</text>
</svg>
