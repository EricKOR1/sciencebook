<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-astro-3-extinction-reddening d-astro-3-extinction-reddening">
  <title id="t-astro-3-extinction-reddening">그림 행성우주과학 3-5 성간 티끌에 의한 소광과 적색화</title>
  <desc id="d-astro-3-extinction-reddening">별빛이 성간 티끌 구름을 지나면 파란빛이 붉은빛보다 더 많이 산란·흡수되어 별이 어둡고 붉게 보인다. 아래 막대는 티끌이 없을 때의 밝기를 1로 할 때 소광 A_V = 2.0등급, 색 초과 E(B−V) = 0.65인 경우의 B·V 밝기로, B가 더 많이 줄어 색지수가 커진다. 흡수선의 파장 위치는 바뀌지 않으므로 적색 편이와 다르다.</desc>
