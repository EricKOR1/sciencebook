<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 378" role="img" aria-labelledby="t-esys-1-volcano-types d-esys-1-volcano-types">
  <title id="t-esys-1-volcano-types">그림 지구시스템과학 1-4 마그마의 성질과 화산체의 모양</title>
  <desc id="d-esys-1-volcano-types">점성이 작은 현무암질 마그마는 용암이 얇고 넓게 흘러 경사가 완만한 순상 화산을, 안산암질 마그마는 용암과 화산 쇄설물이 번갈아 쌓인 원뿔 모양의 성층 화산을, 점성이 큰 유문암질 마그마는 멀리 흐르지 못하고 화구 위에 쌓여 종 모양의 용암 돔(종상 화산)을 만든다. 높이를 과장한 단면 모식도이다.</desc>
