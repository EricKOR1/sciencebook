  <title id="t-umath-2-maxwell-n2">그림 수학 도구 2-4 질소의 맥스웰–볼츠만 속력 분포</title>
  <desc id="d-umath-2-maxwell-n2">298 K 질소의 속력 분포 f(v)(실선)에 가장 확률 높은 속력 421 m/s, 평균 속력 475 m/s, 제곱 평균 제곱근 속력 515 m/s를 세로 점선으로 표시했다. 800 K(점선)에서는 분포가 더 낮고 넓어지며 정점이 689 m/s로 옮겨 간다. 두 곡선 아래 넓이는 모두 1이다.</desc>
