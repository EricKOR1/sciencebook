<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-uphy-9-parallel-wires d-uphy-9-parallel-wires">
  <title id="t-uphy-9-parallel-wires">그림 일반물리학 9-7 평행한 두 도선 사이의 힘</title>
  <desc id="d-uphy-9-parallel-wires">두 도선을 단면으로 본 모습. 도선 1(왼쪽)의 전류가 만드는 자기장 B₁은 도선 1을 중심으로 한 원을 따라 돌고, 도선 2의 자리에서 위쪽을 향한다. (가) 두 전류가 같은 방향(⊙⊙)이면 도선 2가 받는 힘 I₂L × B₁은 도선 1 쪽을 향해 서로 끌어당긴다. (나) 반대 방향(⊙⊗)이면 밀어낸다. 도선 1이 받는 힘은 크기가 같고 방향이 반대이다(작용 반작용). 크기는 F/L = μ₀I₁I₂/(2πd). 모식도이다.</desc>
