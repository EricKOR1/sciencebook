  <title id="t-1-4-analog-digital">그림 1-4-1 아날로그 신호와 디지털 신호</title>
  <desc id="d-1-4-analog-digital">아날로그 신호는 값이 끊김 없이 연속적으로 변하고(미끄럼틀), 디지털 신호는 정해진 몇 개의 값(여기서는 0과 1)만 띄엄띄엄 가진다(계단).</desc>
