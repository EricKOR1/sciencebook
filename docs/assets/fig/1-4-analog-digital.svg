  <text x="32" y="232" class="ad14-txt">값이 끊김 없이 연속적으로 변한다</text>
  <text x="32" y="252" class="ad14-sm">(미끄럼틀: 어느 높이에서나 멈출 수 있다)</text>
  <text x="32" y="276" class="ad14-sm">예: 바늘 시계, 수은 온도계, 목소리</text>
  <text x="388" y="232" class="ad14-txt">정해진 몇 개의 값(0과 1)만 가진다</text>
  <text x="388" y="252" class="ad14-sm">(계단: 정해진 칸에만 설 수 있다)</text>
  <text x="388" y="276" class="ad14-sm">예: 숫자 시계, 디지털 온도계, 음원 파일</text>
</svg>
