<text x="84" y="200" text-anchor="middle" class="ubio-9-endosymbiosis-s">(미토콘드리아를 이미 가짐)</text>
<text x="166" y="125" text-anchor="middle" class="ubio-9-endosymbiosis-h" style="font-size:22px">+</text>
<ellipse cx="220" cy="118" rx="34" ry="20" class="ubio-9-endosymbiosis-cy"/>
<ellipse cx="220" cy="118" rx="29" ry="15" class="ubio-9-endosymbiosis-cy2"/>
