<line x1="203.0" y1="124" x2="237.0" y2="124" style="stroke:var(--fig-green);stroke-width:1.5"/>
<text x="220" y="162" text-anchor="middle" class="ubio-9-endosymbiosis-t">남세균</text>
<text x="220" y="178" text-anchor="middle" class="ubio-9-endosymbiosis-s">(막 2겹)</text>
