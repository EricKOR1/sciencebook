<text x="84" y="402" text-anchor="middle" class="ubio-9-endosymbiosis-t">다른 진핵세포</text>
<text x="166" y="343" text-anchor="middle" class="ubio-9-endosymbiosis-h" style="font-size:22px">+</text>
<ellipse cx="230" cy="336" rx="46" ry="34" class="ubio-9-endosymbiosis-alg"/>
