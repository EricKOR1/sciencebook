<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 462" role="img" aria-labelledby="t-ubio-9-endosymbiosis d-ubio-9-endosymbiosis">
<title id="t-ubio-9-endosymbiosis">그림 일반생명과학 9-2 1차·2차 세포 내 공생과 엽록체를 싼 막의 수</title>
<desc id="d-ubio-9-endosymbiosis">1차 공생에서는 진핵세포가 남세균을 삼켜 막 2겹의 엽록체를 얻었다. 2차 공생에서는 다른 진핵세포가 엽록체를 가진 조류를 통째로 삼켜, 남세균에서 온 막 2겹 바깥에 조류의 세포막과 숙주의 식포 막이 더해진 막 4겹의 엽록체가 생겼고, 그 사이에 조류 핵의 흔적이 남기도 한다. 모식도이다.</desc>
<style>
.ubio-9-endosymbiosis-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .ubio-9-endosymbiosis-s{font-size:13px;fill:var(--fig-muted)} .ubio-9-endosymbiosis-t{font-size:13px;fill:var(--fig-ink)}
.ubio-9-endosymbiosis-host{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.8}
.ubio-9-endosymbiosis-cy{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2}
.ubio-9-endosymbiosis-cy2{fill:none;stroke:var(--fig-green);stroke-width:2}
.ubio-9-endosymbiosis-alg{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2}
.ubio-9-endosymbiosis-vac{fill:none;stroke:var(--fig-violet);stroke-width:2.2;stroke-dasharray:6 3}
</style>
<text x="16" y="28" text-anchor="start" class="ubio-9-endosymbiosis-h">1차 세포 내 공생</text>
