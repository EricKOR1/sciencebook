<circle cx="70" cy="112" r="16" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.3"/>
<ellipse cx="104" cy="140" rx="14" ry="8" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.3"/>
