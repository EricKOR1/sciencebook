<text x="430" y="274" text-anchor="middle" class="ubio-9-endosymbiosis-s">조류 핵의 흔적</text>
<text x="450" y="416" text-anchor="middle" class="ubio-9-endosymbiosis-t">엽록체: 막 4겹(일부 3겹)</text>
<text x="570" y="326" text-anchor="start" class="ubio-9-endosymbiosis-t">→ 규조류, 갈조류,</text>
<text x="570" y="344" text-anchor="start" class="ubio-9-endosymbiosis-t">와편모조류 등</text>
