<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-cell-3-chromatography d-cell-3-chromatography">
  <title id="t-cell-3-chromatography">그림 세포와 물질대사 3-12 종이 크로마토그래피로 분리한 광합성 색소</title>
  <desc id="d-cell-3-chromatography">원점에 찍은 잎 추출액이 전개 용매를 따라 올라가며 색소마다 다른 거리만큼 이동한다. 위에서부터 카로틴(주황), 잔토필(노랑), 엽록소 a(청록), 엽록소 b(황록) 순서로 분리되며, 전개율은 원점에서 색소 띠 중심까지 거리를 원점에서 용매 전선까지 거리로 나눈 값이다. 예시 계산의 수치를 쓴 모식도(색은 실제 색소의 색).</desc>
  <style>.cell-3-chromatography-t{font-size:14px;fill:var(--fig-ink)} .cell-3-chromatography-s{font-size:13px;fill:var(--fig-muted)} .cell-3-chromatography-b{font-size:15px;fill:var(--fig-ink);font-weight:600} .cell-3-chromatography-bs{font-size:14px;fill:var(--fig-ink);font-weight:600} .cell-3-chromatography-g{font-size:14px;fill:var(--fig-green);font-weight:600} .cell-3-chromatography-r{font-size:14px;fill:var(--fig-red);font-weight:600} .cell-3-chromatography-bl{font-size:14px;fill:var(--fig-blue);font-weight:600} .cell-3-chromatography-am{font-size:14px;fill:var(--fig-amber);font-weight:600} .cell-3-chromatography-vi{font-size:14px;fill:var(--fig-violet);font-weight:600} .cell-3-chromatography-te{font-size:14px;fill:var(--fig-teal);font-weight:600}</style>
  <rect x="150.0" y="20.0" width="150.0" height="304.0" rx="8" style="fill:none;stroke:var(--fig-line);stroke-width:2"/>
  <rect x="152.0" y="296.0" width="146.0" height="26.0" rx="0" style="fill:var(--fig-soft-blue)"/>
  <text x="225.0" y="315.0" text-anchor="middle" class="cell-3-chromatography-s">전개 용매</text>
  <rect x="200.0" y="32.0" width="50.0" height="284.0" rx="0" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.4"/>
  <line x1="196.0" y1="284.0" x2="254.0" y2="284.0" style="stroke:var(--fig-muted);stroke-width:1.6;stroke-dasharray:4 3"/>
  <text x="144.0" y="289.0" text-anchor="end" class="cell-3-chromatography-s">원점(연필)</text>
  <line x1="196.0" y1="56.0" x2="254.0" y2="56.0" style="stroke:var(--fig-blue);stroke-width:1.6;stroke-dasharray:6 3"/>
  <text x="144.0" y="61.0" text-anchor="end" class="cell-3-chromatography-bl">용매 전선</text>
  <rect x="203" y="62.4" width="44" height="10" rx="4" style="fill:#f08a00"/>
  <line x1="256.0" y1="67.4" x2="330.0" y2="67.4" style="stroke:var(--fig-line);stroke-width:1.1"/>
  <text x="338.0" y="72.4" class="cell-3-chromatography-t">카로틴(주황)  7.6 cm  →  R<tspan baseline-shift="sub" style="font-size:10px">f</tspan> = 0.95</text>
  <rect x="203" y="130.8" width="44" height="10" rx="4" style="fill:#e3c400"/>
  <line x1="256.0" y1="135.8" x2="330.0" y2="135.8" style="stroke:var(--fig-line);stroke-width:1.1"/>
  <text x="338.0" y="140.8" class="cell-3-chromatography-t">잔토필(노랑)  5.2 cm  →  R<tspan baseline-shift="sub" style="font-size:10px">f</tspan> = 0.65</text>
  <rect x="203" y="176.4" width="44" height="10" rx="4" style="fill:#1f8f6e"/>
  <line x1="256.0" y1="181.4" x2="330.0" y2="181.4" style="stroke:var(--fig-line);stroke-width:1.1"/>
  <text x="338.0" y="186.4" class="cell-3-chromatography-t">엽록소 a(청록)  3.6 cm  →  R<tspan baseline-shift="sub" style="font-size:10px">f</tspan> = 0.45</text>
  <rect x="203" y="210.6" width="44" height="10" rx="4" style="fill:#8db52a"/>
  <line x1="256.0" y1="215.6" x2="330.0" y2="215.6" style="stroke:var(--fig-line);stroke-width:1.1"/>
  <text x="338.0" y="220.6" class="cell-3-chromatography-t">엽록소 b(황록)  2.4 cm  →  R<tspan baseline-shift="sub" style="font-size:10px">f</tspan> = 0.30</text>
  <line x1="180.0" y1="284.0" x2="180.0" y2="62.6" style="stroke:var(--fig-blue);stroke-width:1.8"/>
  <path d="M180.0 57.0 L183.3 64.3 L176.7 64.3 Z" style="fill:var(--fig-blue)"/>
  <text x="176.0" y="150.0" text-anchor="end" class="cell-3-chromatography-bl">8.0</text>
  <text x="176.0" y="168.0" text-anchor="end" class="cell-3-chromatography-bl">cm</text>
  <text x="338.0" y="290.0" class="cell-3-chromatography-s">R<tspan baseline-shift="sub" style="font-size:10px">f</tspan> = (원점 → 띠 중심) ÷ (원점 → 용매 전선)</text>
  <text x="338.0" y="310.0" class="cell-3-chromatography-s">용매에 잘 녹고 종이에 덜 붙는 색소일수록 멀리 이동</text>
</svg>
