<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-ubio-6-replication-bubble d-ubio-6-replication-bubble">
  <title id="t-ubio-6-replication-bubble">그림 일반생명과학 6-2 복제 거품과 양방향 복제</title>
  <desc id="d-ubio-6-replication-bubble">복제 원점에서 이중 나선이 열려 생긴 복제 거품의 양 끝에서 두 복제 분기점이 반대 방향으로 움직인다. 새 가닥은 5′→3′ 방향으로만 자라므로, 같은 주형 가닥 위에서도 원점의 한쪽은 연속적인 선도 가닥, 다른 쪽은 오카자키 절편으로 된 지연 가닥이 된다. 각 절편의 5′ 끝에는 RNA 프라이머가 있다.</desc>
