<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-labelledby="t-earth-3-q-redshift-spectrum d-earth-3-q-redshift-spectrum">
  <title id="t-earth-3-q-redshift-spectrum">그림 지구과학 3-16 문제 15의 수소 흡수선</title>
  <desc id="d-earth-3-q-redshift-spectrum">정지 상태(실험실)에서 656.3 nm에 나타나는 수소 흡수선과, 은하 X의 스펙트럼에서 663.0 nm에 나타난 같은 흡수선을 나란히 나타낸 것이다.</desc>
  <style>.earth-3-q-redshift-spectrum-t{font-size:14px;fill:var(--fig-ink)} .earth-3-q-redshift-spectrum-s{font-size:13px;fill:var(--fig-muted)} .earth-3-q-redshift-spectrum-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .earth-3-q-redshift-spectrum-b{font-size:15px;font-weight:700;fill:var(--fig-ink)} .earth-3-q-redshift-spectrum-ax{stroke:var(--fig-ink);stroke-width:1.4;fill:none} .earth-3-q-redshift-spectrum-grid{stroke:var(--fig-line);stroke-width:0.7;fill:none;stroke-dasharray:3 3}</style>
