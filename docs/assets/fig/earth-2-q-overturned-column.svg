  <desc id="d-earth-2-q-overturned-column">노두의 지층을 아래부터 A층(셰일), B층(석회암), C층(사암)으로 나타낸 주상도이다. A층의 다각형 틈은 아래쪽으로 벌어진 V자 모양이고, C층은 한 층 안에서 위쪽 입자가 굵고 아래쪽 입자가 가늘다. B층에는 산호 화석이 있다.</desc>
