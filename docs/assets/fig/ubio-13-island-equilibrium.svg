  <text x="268.1" y="400" text-anchor="middle" class="ubio-13-island-equilibrium-t">Ŝ₁</text>
  <line x1="350.9" y1="333.6" x2="350.9" y2="380" style="stroke:var(--fig-ink);stroke-width:1.2;stroke-dasharray:3 3;fill:none"/>
  <circle cx="350.9" cy="333.6" r="5" style="fill:var(--fig-ink)"/>
  <text x="350.9" y="400" text-anchor="middle" class="ubio-13-island-equilibrium-t">Ŝ₂</text>
  <text x="548" y="80" class="ubio-13-island-equilibrium-b" style="fill:var(--fig-ink)">평형 종 수 Ŝ</text>
  <text x="548" y="100" class="ubio-13-island-equilibrium-s">이입률 = 멸종률인 곳</text>
  <text x="548" y="140" class="ubio-13-island-equilibrium-t">Ŝ₁ 작고 먼 섬: 적다</text>
  <text x="548" y="160" class="ubio-13-island-equilibrium-t">Ŝ₂ 크고 가까운 섬: 많다</text>
  <text x="548" y="200" class="ubio-13-island-equilibrium-s">가까울수록 이입률 ↑</text>
  <text x="548" y="220" class="ubio-13-island-equilibrium-s">클수록 멸종률 ↓</text>
  <text x="548" y="260" class="ubio-13-island-equilibrium-s">평형에서도 종의</text>
  <text x="548" y="280" class="ubio-13-island-equilibrium-s">구성은 계속 바뀐다</text>
  <text x="548" y="300" class="ubio-13-island-equilibrium-s">(종 교체)</text>
