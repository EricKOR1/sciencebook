<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="t-ubio-13-island-equilibrium d-ubio-13-island-equilibrium">
  <title id="t-ubio-13-island-equilibrium">그림 일반생명과학 13-2 섬 생물지리학의 평형 모형</title>
  <desc id="d-ubio-13-island-equilibrium">가로축은 섬에 사는 종 수, 세로축은 이입률과 멸종률이다. 종이 많을수록 새로 들어올 종은 줄어 이입률이 떨어지고, 멸종할 종은 많아져 멸종률이 오른다. 두 곡선이 만나는 곳이 평형 종 수이며, 본토에 가깝고 큰 섬일수록 평형 종 수가 크다. 곡선 모양은 모식적이다.</desc>
  <style>.ubio-13-island-equilibrium-t{font-size:14px;fill:var(--fig-ink)} .ubio-13-island-equilibrium-s{font-size:13px;fill:var(--fig-muted)} .ubio-13-island-equilibrium-b{font-size:14px;font-weight:700}</style>
  <line x1="90" y1="380" x2="530" y2="380" style="stroke:var(--fig-ink);stroke-width:1.3;fill:none"/>
  <line x1="90" y1="380" x2="90" y2="40" style="stroke:var(--fig-ink);stroke-width:1.3;fill:none"/>
  <text x="305" y="424" text-anchor="middle" class="ubio-13-island-equilibrium-t">섬에 사는 종 수</text>
  <text x="530" y="400" text-anchor="end" class="ubio-13-island-equilibrium-s">본토의 종 수</text>
  <text x="90" y="398" text-anchor="middle" class="ubio-13-island-equilibrium-s">0</text>
  <text x="40" y="215" text-anchor="middle" class="ubio-13-island-equilibrium-t" transform="rotate(-90 40 215)">이입률 · 멸종률 (종/년)</text>
