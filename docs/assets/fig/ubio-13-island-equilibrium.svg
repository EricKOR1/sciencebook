  <text x="98.6" y="220.0" class="ubio-13-island-equilibrium-b" style="fill:var(--fig-blue)">먼 섬</text>
  <text x="506.0" y="84.0" text-anchor="end" class="ubio-13-island-equilibrium-b" style="fill:var(--fig-red)">멸종률: 작은 섬</text>
