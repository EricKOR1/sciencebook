<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" class="fig-small" role="img" aria-labelledby="t-uearth-10-q-noon-altitude d-uearth-10-q-noon-altitude">
  <title id="t-uearth-10-q-noon-altitude">그림 일반지구과학 10-12 문제 13 풀이 — 자오선 단면의 남중 고도</title>
  <desc id="d-uearth-10-q-noon-altitude">관측지의 자오선 단면. 천구 적도의 남중 고도는 90° − φ이고, 하지와 동지의 태양은 그보다 각각 ε만큼 높고 낮다. 따라서 80.0° − 33.2° = 2ε, 80.0° + 33.2° = 2(90° − φ)이다. 천구 북극의 고도는 위도 φ와 같다. 모식도.</desc>
  <style>.uearth-10-q-noon-altitude-lbl{font-size:14px;fill:var(--fig-ink)} .uearth-10-q-noon-altitude-sm{font-size:13px;fill:var(--fig-muted)} .uearth-10-q-noon-altitude-b{font-weight:600} .uearth-10-q-noon-altitude-ax{stroke:var(--fig-ink);stroke-width:1.2;fill:none} .uearth-10-q-noon-altitude-grid{stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3;fill:none} </style>
