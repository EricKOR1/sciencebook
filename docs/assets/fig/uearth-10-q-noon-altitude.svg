  <line x1="230.0" y1="225.0" x2="201.3" y2="62.5" style="stroke:var(--fig-red);stroke-width:2"/>
  <circle cx="201.3" cy="62.5" r="8" style="fill:#f4b400;stroke:var(--fig-amber);stroke-width:1.4"/>
  <text x="194.6" y="49.7" text-anchor="end" class="uearth-10-q-noon-altitude-sm uearth-10-q-noon-altitude-b" style="fill:var(--fig-red)">하지 태양 80.0°</text>
  <line x1="230.0" y1="225.0" x2="139.2" y2="87.3" style="stroke:var(--fig-blue);stroke-width:2"/>
