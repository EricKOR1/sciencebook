    .b3pak-chr{fill:none;stroke:var(--fig-violet);stroke-width:24;stroke-linecap:round}
    .b3pak-chr2{fill:none;stroke:var(--fig-soft-violet);stroke-width:18;stroke-linecap:round}
  </style>
