<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-bio-3-chromosome-packing d-bio-3-chromosome-packing">
  <title id="t-bio-3-chromosome-packing">그림 생명과학 3-1 DNA가 염색체로 응축되는 단계</title>
  <desc id="d-bio-3-chromosome-packing">DNA 이중 나선이 히스톤 단백질을 감아 뉴클레오솜을 이루고, 뉴클레오솜이 이어진 염색사가 분열기에 여러 번 꼬이고 응축되어 염색체가 된다. 분열 중인 염색체는 동원체에서 붙은 염색 분체 2개로 이루어진다. 모식도(크기 비율은 실제와 다름).</desc>
