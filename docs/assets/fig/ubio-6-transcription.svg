  <text x="490.0" y="310.0" text-anchor="middle" class="ubio-6-transcription-s" style="fill:var(--fig-ink)">TBP</text>
  <ellipse cx="440.0" cy="302.0" rx="22" ry="14" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.4"/>
