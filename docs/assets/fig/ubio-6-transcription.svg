  <text x="226.0" y="356.0" text-anchor="middle" class="ubio-6-transcription-m">+1</text>
  <text x="180.0" y="382.0" text-anchor="middle" class="ubio-6-transcription-s">시그마 인자(σ)를 가진 중합 효소가 직접 결합</text>
  <rect x="470.0" y="316.0" width="40.0" height="18.0" rx="3" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4"/>
