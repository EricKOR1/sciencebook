  <ellipse cx="560.0" cy="266.0" rx="74" ry="28" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6"/>
  <text x="560.0" y="270.0" text-anchor="middle" class="ubio-6-transcription-m">RNA 중합 효소 Ⅱ</text>
  <text x="420.0" y="276.0" text-anchor="end" class="ubio-6-transcription-s" style="fill:var(--fig-teal)">전사 인자</text>
