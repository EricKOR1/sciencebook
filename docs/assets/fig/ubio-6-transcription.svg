  <line x1="380.0" y1="320.0" x2="700.0" y2="320.0" style="fill:none;stroke:var(--fig-ink);stroke-width:3"/>
  <line x1="380.0" y1="330.0" x2="700.0" y2="330.0" style="fill:none;stroke:var(--fig-ink);stroke-width:3"/>
