  <rect x="160.0" y="316.0" width="40.0" height="18.0" rx="3" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4"/>
  <text x="90.0" y="356.0" text-anchor="middle" class="ubio-6-transcription-m">−35</text>
  <text x="180.0" y="356.0" text-anchor="middle" class="ubio-6-transcription-m">−10</text>
  <ellipse cx="170.0" cy="286.0" rx="82" ry="30" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6"/>
  <text x="180.0" y="282.0" text-anchor="middle" class="ubio-6-transcription-m">RNA 중합 효소</text>
  <ellipse cx="110.0" cy="310.0" rx="30" ry="13" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.6"/>
  <text x="110.0" y="314.0" text-anchor="middle" class="ubio-6-transcription-b" style="fill:var(--fig-violet)">σ</text>
