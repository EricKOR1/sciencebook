<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-matter-1-gas-law-graphs d-matter-1-gas-law-graphs">
  <title id="t-matter-1-gas-law-graphs">그림 물질과 에너지 1-3 보일·샤를·아보가드로 법칙의 그래프</title>
  <desc id="d-matter-1-gas-law-graphs">보일 법칙은 압력과 부피가 반비례하는 곡선, 샤를 법칙은 부피가 섭씨 온도에 대해 직선으로 늘고 연장하면 −273 °C에서 부피가 0이 되는 그래프, 아보가드로 법칙은 부피가 몰수에 비례하는 원점을 지나는 직선이다. 눈금 없는 모식도이다.</desc>
  <style>
    .matter-1-gas-law-graphs-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
    .matter-1-gas-law-graphs-gr{fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4}
    .matter-1-gas-law-graphs-l{font-size:14px;fill:var(--fig-ink)}
    .matter-1-gas-law-graphs-t{font-size:13px;fill:var(--fig-muted)}
    .matter-1-gas-law-graphs-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .matter-1-gas-law-graphs-ink{fill:var(--fig-ink)}
    .matter-1-gas-law-graphs-cv{fill:none;stroke:var(--fig-blue);stroke-width:3;stroke-linecap:round}
    .matter-1-gas-law-graphs-cvd{fill:none;stroke:var(--fig-blue);stroke-width:2.2;stroke-dasharray:6 5}
  </style>
