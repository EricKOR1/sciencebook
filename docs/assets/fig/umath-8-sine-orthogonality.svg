<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-labelledby="t-umath-8-sine-orthogonality d-umath-8-sine-orthogonality">
  <title id="t-umath-8-sine-orthogonality">그림 수학 도구 8-1 사인 함수의 직교성: 곱의 넓이 합은 0</title>
  <desc id="d-umath-8-sine-orthogonality">구간 0부터 L까지 sin(πx/L)(파랑), sin(2πx/L)(주황)과 두 함수의 곱(검은 선, 회색 칠)을 그렸다. 곱은 x &lt; L/2에서 양(빗금 /), x &gt; L/2에서 음(빗금 \)이고 두 넓이의 크기가 같아 적분이 0이다.</desc>
