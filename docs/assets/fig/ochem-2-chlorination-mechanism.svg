<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-ochem-2-chlorination-mechanism d-ochem-2-chlorination-mechanism">
  <title id="t-ochem-2-chlorination-mechanism">그림 유기화학 2-19 메테인 염소화의 라디칼 연쇄 메커니즘</title>
  <desc id="d-ochem-2-chlorination-mechanism">개시: 빛(hν)을 받은 Cl–Cl 결합의 전자쌍이 두 Cl에 하나씩 나뉘어(낚싯바늘 화살표 2개) Cl· 두 개가 생긴다. 전파 ①: Cl·의 홀전자와 CH₃–H 결합 전자 하나가 새 H–Cl 결합을 만들고, C–H 결합의 다른 전자 하나는 C에 남아(화살표 3개) HCl과 평면 메틸 라디칼 ·CH₃(홀전자가 p 오비탈에)가 생긴다. 전파 ②: ·CH₃의 홀전자와 Cl–Cl 결합 전자 하나가 새 C–Cl 결합을 만들고 다른 전자는 바깥 Cl에 남아(화살표 3개) CH₃Cl과 Cl·가 생긴다. 되살아난 Cl·가 다시 전파 ①을 시작하는 것이 연쇄 고리이다. 아래 상자는 라디칼 두 개가 만나 사라지는 종결 단계 세 가지이다.</desc>
