<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-cell-1-protein-levels d-cell-1-protein-levels">
  <title id="t-cell-1-protein-levels">그림 세포와 물질대사 1-3 아미노산과 단백질의 구조 단계</title>
  <desc id="d-cell-1-protein-levels">아미노산은 가운데 탄소에 아미노기, 카복실기, 수소, 곁사슬(R)이 붙어 있다. 아미노산이 펩타이드 결합으로 순서대로 이어진 것이 1차 구조, 사슬 일부가 α 나선이나 β 병풍으로 접힌 것이 2차 구조, 사슬 전체가 접힌 입체 모양이 3차 구조, 여러 폴리펩타이드가 모인 것이 4차 구조이다. 모식도.</desc>
