<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="t-ochem-12-enolate-energy d-ochem-12-enolate-energy">
  <title id="t-ochem-12-enolate-energy">그림 유기화학 12-6 속도론적·열역학적 엔올레이트의 에너지 도표</title>
  <desc id="d-ochem-12-enolate-energy">가운데 2-메틸사이클로헥산온 + 염기(0)에서 왼쪽으로는 낮은 꼭대기(TS_k, +40)를 넘어 속도론적 엔올레이트(−10)로, 오른쪽으로는 7.5 kJ/mol 더 높은 꼭대기(TS_t, +47.5)를 넘어 5 kJ/mol 더 낮은 열역학적 엔올레이트(−15)로 간다. 두 엔올레이트 모두 출발 물질보다 낮다. LDA, −78 ℃(되돌아가지 않음)에서는 꼭대기 차가, ROH, 실온(평형)에서는 골짜기 차가 생성물 비를 정한다. 세로축 값은 모식적이다.</desc>
