  <title id="t-umath-7-q-arrhenius-fit">그림 수학 도구 7-10 예제 17의 아레니우스 도시와 잔차</title>
  <desc id="d-umath-7-q-arrhenius-fit">예제 17의 아레니우스 도시. 위: x = 1000/T, y = ln k인 다섯 측정점과 최소 제곱 직선 y = −9.0306x + 26.05, 무게중심(별표). 아래: 각 점의 잔차(−0.011, +0.019, −0.010, +0.010, −0.007)가 0 기준선 둘레 ±s_y(0.0155) 안팎에 무작위로 흩어져 있다.</desc>
