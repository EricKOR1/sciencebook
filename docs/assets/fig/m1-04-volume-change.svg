<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-m1-04-volume-change d-m1-04-volume-change">
  <title id="t-m1-04-volume-change">그림 중1-4-7 굳을 때의 부피 변화: 양초와 물</title>
  <desc id="d-m1-04-volume-change">녹인 양초(파라핀)는 굳으면서 부피가 줄어 가운데가 오목해지고, 물은 얼면서 부피가 늘어나 위로 볼록해진다. 점선은 굳기 전 액체의 높이이다. 두 경우 모두 밀봉하여 물질이 드나들지 않으면 질량은 그대로이다. 모식도이다.</desc>
  <style>
    .vc-red{fill:none;stroke:var(--fig-red)} .vc-redh{fill:var(--fig-red)}
    .vc-blue{fill:none;stroke:var(--fig-blue)} .vc-blueh{fill:var(--fig-blue)}
    .vc-green{fill:none;stroke:var(--fig-green)} .vc-greenh{fill:var(--fig-green)}
    .vc-amber{fill:none;stroke:var(--fig-amber)} .vc-amberh{fill:var(--fig-amber)}
    .vc-violet{fill:none;stroke:var(--fig-violet)} .vc-violeth{fill:var(--fig-violet)}
    .vc-teal{fill:none;stroke:var(--fig-teal)} .vc-tealh{fill:var(--fig-teal)}
    .vc-ink{fill:none;stroke:var(--fig-ink)} .vc-inkh{fill:var(--fig-ink)}
    .vc-muted{fill:none;stroke:var(--fig-muted)} .vc-mutedh{fill:var(--fig-muted)}
    .vc-line{fill:none;stroke:var(--fig-line)} .vc-lineh{fill:var(--fig-line)}
    .vc-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .vc-t{font-size:14px;fill:var(--fig-ink)}
    .vc-sm{font-size:13px;fill:var(--fig-muted)}
    .vc-redb{font-size:14px;font-weight:700;fill:var(--fig-red)}
    .vc-sred{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.6}
    .vc-blueb{font-size:14px;font-weight:700;fill:var(--fig-blue)}
    .vc-sblue{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6}
    .vc-greenb{font-size:14px;font-weight:700;fill:var(--fig-green)}
    .vc-sgreen{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.6}
    .vc-amberb{font-size:14px;font-weight:700;fill:var(--fig-amber)}
    .vc-samber{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.6}
    .vc-violetb{font-size:14px;font-weight:700;fill:var(--fig-violet)}
