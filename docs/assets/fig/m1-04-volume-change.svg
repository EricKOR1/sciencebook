  <line x1="505.0" y1="140.0" x2="565.0" y2="140.0" class="vc-blue" style="stroke-width:2.5;stroke-linecap:round"/>
  <path d="M575.0 140.0 L565.0 144.8 L565.0 135.2 Z" class="vc-blueh"/>
  <text x="540.0" y="128.0" text-anchor="middle" class="vc-sm">식힌다</text>
  <text x="540.0" y="252.0" text-anchor="middle" class="vc-greenb">질량은 그대로</text>
  <text x="540.0" y="275.0" text-anchor="middle" class="vc-t">부피가 늘어난다(약 9%)</text>
  <text x="540.0" y="295.0" text-anchor="middle" class="vc-t">→ 위로 볼록해진다</text>
  <text x="360.0" y="330.0" text-anchor="middle" class="vc-sm">점선: 굳기 전 액체의 높이 · 아래 숫자: 밀봉한 그릇을 함께 잰 질량(예)</text>
