    .vc-panel{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.4}
    .vc-paper{fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1.4}
    .vc-axis{fill:none;stroke:var(--fig-ink);stroke-width:1.6}
    .vc-grid{fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 4}
    .vc-dash{fill:none;stroke:var(--fig-muted);stroke-width:1.4;stroke-dasharray:5 4}
    .vc-cup{fill:none;stroke:var(--fig-ink);stroke-width:2} .vc-wax{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4} .vc-waxs{fill:var(--fig-amber);fill-opacity:0.45;stroke:var(--fig-amber);stroke-width:1.4} .vc-wat{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.4} .vc-ice{fill:var(--fig-blue);fill-opacity:0.35;stroke:var(--fig-blue);stroke-width:1.4} .vc-scale{fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.4}
