<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-uchem-5-q-water-dipole d-uchem-5-q-water-dipole">
  <title id="t-uchem-5-q-water-dipole">그림 일반화학 5-10 예제 5 풀이 — O–H 결합 쌍극자의 합성</title>
  <desc id="d-uchem-5-q-water-dipole">왼쪽은 물 분자의 결합 쌍극자(H에서 O 쪽으로, 결합각 104.5°). 오른쪽은 두 결합 쌍극자 1.51 D를 꼬리를 맞대어 더한 평행사변형으로, 합은 각의 이등분선 방향 1.85 D이다. 화살표 길이는 크기에 비례한다.</desc>
  <style>
    .uchem-5-q-water-dipole-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-5-q-water-dipole-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-5-q-water-dipole-b{font-size:15px;fill:var(--fig-ink);font-weight:bold}
    .uchem-5-q-water-dipole-ax{stroke:var(--fig-ink);stroke-width:1.3;fill:none}
    .uchem-5-q-water-dipole-gr{stroke:var(--fig-line);stroke-width:0.7;fill:none;stroke-dasharray:3 3}
    .uchem-5-q-water-dipole-ln{stroke:var(--fig-ink);stroke-width:2;fill:none}
    .uchem-5-q-water-dipole-lv{stroke:var(--fig-ink);stroke-width:2.2;fill:none}
    .uchem-5-q-water-dipole-bl{stroke:var(--fig-blue);stroke-width:2.4;fill:none}
    .uchem-5-q-water-dipole-rd{stroke:var(--fig-red);stroke-width:2.4;fill:none}
    .uchem-5-q-water-dipole-gn{stroke:var(--fig-green);stroke-width:2.4;fill:none}
    .uchem-5-q-water-dipole-am{stroke:var(--fig-amber);stroke-width:2.4;fill:none}
    .uchem-5-q-water-dipole-dash{stroke:var(--fig-muted);stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    .uchem-5-q-water-dipole-fink{fill:var(--fig-ink)} .uchem-5-q-water-dipole-fbl{fill:var(--fig-blue)} .uchem-5-q-water-dipole-frd{fill:var(--fig-red)}
    .uchem-5-q-water-dipole-fgn{fill:var(--fig-green)} .uchem-5-q-water-dipole-fam{fill:var(--fig-amber)} .uchem-5-q-water-dipole-fmu{fill:var(--fig-muted)}
    .uchem-5-q-water-dipole-box{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.4}
    .uchem-5-q-water-dipole-sb{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6}
    .uchem-5-q-water-dipole-sr{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.6}
    .uchem-5-q-water-dipole-sg{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.6}
    .uchem-5-q-water-dipole-sa{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.6}
    .uchem-5-q-water-dipole-sv{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.6}
    .uchem-5-q-water-dipole-st{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.6}
    .uchem-5-q-water-dipole-A{font-size:20px;fill:var(--fig-ink)}
  </style>
