<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-m2-03-color-mixing d-m2-03-color-mixing">
  <title id="t-m2-03-color-mixing">그림 중2-3-7 빛의 합성과 물체의 색</title>
  <desc id="d-m2-03-color-mixing">(가) 어두운 곳에서 빨강, 초록, 파랑 빛을 겹쳐 비추면 빨강과 초록이 겹친 곳은 노랑, 초록과 파랑은 청록, 빨강과 파랑은 자홍, 세 빛이 모두 겹친 곳은 흰색으로 보인다. (나) 백색광 속 빨강, 초록, 파랑 빛이 사과에 닿으면 사과는 빨간빛만 반사하고 나머지는 흡수한다. 눈에 들어오는 것은 반사된 빨간빛이므로 사과는 빨갛게 보인다. 왼쪽 그림의 색은 실제 빛의 색을 나타낸다.</desc>
  <style>
    .m2-03-color-mixing-t{font-size:14px;fill:var(--fig-ink)}
    .m2-03-color-mixing-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .m2-03-color-mixing-s{font-size:13px;fill:var(--fig-muted)}

  </style>
  <rect x="0" y="0" width="720" height="340" style="fill:var(--fig-paper)"/>
  <rect x="14.0" y="14.0" width="320.0" height="312.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2"/>
  <rect x="350.0" y="14.0" width="356.0" height="312.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="28.0" y="40.0" class="m2-03-color-mixing-b">(가) 빛의 삼원색의 합성</text>
  <text x="364.0" y="40.0" class="m2-03-color-mixing-b">(나) 빨간 사과가 빨갛게 보이는 까닭</text>
  <rect x="30.0" y="52.0" width="288.0" height="260.0" rx="6" style="fill:#111"/>
  <g style="isolation:isolate">
    <circle cx="174" cy="140" r="70" style="fill:#ff2a2a;mix-blend-mode:screen"/>
    <circle cx="134" cy="210" r="70" style="fill:#22ff22;mix-blend-mode:screen"/>
    <circle cx="214" cy="210" r="70" style="fill:#2a4bff;mix-blend-mode:screen"/>
  </g>
  <text x="174.0" y="104.0" text-anchor="middle" class="m2-03-color-mixing-t" style="fill:#fff;font-weight:600">빨강</text>
  <text x="100.0" y="244.0" text-anchor="middle" class="m2-03-color-mixing-t" style="fill:#000;font-weight:600">초록</text>
  <text x="248.0" y="244.0" text-anchor="middle" class="m2-03-color-mixing-t" style="fill:#fff;font-weight:600">파랑</text>
  <text x="128.0" y="158.0" text-anchor="middle" class="m2-03-color-mixing-t" style="fill:#000;font-weight:600">노랑</text>
  <text x="174.0" y="246.0" text-anchor="middle" class="m2-03-color-mixing-t" style="fill:#000;font-weight:600">청록</text>
  <text x="220.0" y="158.0" text-anchor="middle" class="m2-03-color-mixing-t" style="fill:#000;font-weight:600">자홍</text>
  <text x="174.0" y="192.0" text-anchor="middle" class="m2-03-color-mixing-t" style="fill:#000;font-weight:600">흰색</text>
  <text x="392.0" y="72.0" class="m2-03-color-mixing-t">백색광(빨강+초록+파랑)</text>
  <line x1="384.0" y1="88.8" x2="480.2" y2="189.3" style="stroke:var(--fig-red);stroke-width:2.4;fill:none"/>
  <polygon points="484.4,193.6 475.1,189.8 481.0,184.2" style="fill:var(--fig-red)"/>
  <line x1="400.0" y1="92.0" x2="490.2" y2="203.3" style="stroke:var(--fig-green);stroke-width:2.4;fill:none"/>
  <polygon points="494.0,208.0 485.1,203.5 491.4,198.3" style="fill:var(--fig-green)"/>
  <line x1="416.0" y1="95.2" x2="500.2" y2="217.5" style="stroke:var(--fig-blue);stroke-width:2.4;fill:none"/>
  <polygon points="503.6,222.4 495.1,217.2 501.8,212.6" style="fill:var(--fig-blue)"/>
  <circle cx="520.0" cy="230.0" r="30.0" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2.2"/>
  <path d="M520 200 q3 -12 10 -14" style="fill:none;stroke:var(--fig-green);stroke-width:2.5"/>
  <text x="520.0" y="280.0" text-anchor="middle" class="m2-03-color-mixing-s">사과</text>
  <line x1="544.0" y1="212.0" x2="637.4" y2="116.7" style="stroke:var(--fig-red);stroke-width:2.6;fill:none"/>
  <polygon points="642.0,112.0 638.2,122.3 631.8,116.0" style="fill:var(--fig-red)"/>
  <text x="612.0" y="182.0" class="m2-03-color-mixing-t" style="fill:var(--fig-red);font-weight:600">빨간빛만 반사</text>
  <text x="430.0" y="214.0" text-anchor="end" class="m2-03-color-mixing-t" style="fill:var(--fig-muted)">초록·파랑은</text>
  <text x="430.0" y="230.0" text-anchor="end" class="m2-03-color-mixing-t" style="fill:var(--fig-muted);font-weight:600">흡수</text>
  <path d="M678.0 100.0 Q660.0 86.0 642.0 100.0 Q660.0 114.0 678.0 100.0 Z" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.8"/>
  <circle cx="655.0" cy="100.0" r="6.0" style="fill:var(--fig-ink)"/>
  <text x="660.0" y="80.0" text-anchor="middle" class="m2-03-color-mixing-s">눈</text>
  <text x="528.0" y="298.0" text-anchor="middle" class="m2-03-color-mixing-t" style="font-weight:600">물체의 색 = 물체가 반사하는 빛의 색</text>
  <text x="528.0" y="316.0" text-anchor="middle" class="m2-03-color-mixing-s">초록빛만 비추면 반사할 빛이 없어 검게 보인다</text>
</svg>
