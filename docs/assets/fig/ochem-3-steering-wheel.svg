<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="t-ochem-3-steering-wheel d-ochem-3-steering-wheel">
  <title id="t-ochem-3-steering-wheel">그림 유기화학 3-5 R/S 판정 — 순위 4를 운전대의 축처럼 뒤로</title>
  <desc id="d-ochem-3-steering-wheel">(R)-뷰탄-2-올의 쐐기·점선 구조에 CIP 순위 ①OH ②CH₂CH₃ ③CH₃ ④H를 붙였다. 가운데는 H가 관찰자 반대쪽(운전대의 축)으로 가도록 돌려 본 모습으로, ①→②→③이 시계 방향이므로 R이다. 오른쪽 상자는 ④가 관찰자 쪽을 향할 때 보이는 방향을 뒤집어 읽는 요령이다.</desc>
  <style>.ochem-3-steering-wheel-t{font-size:14px;fill:var(--fig-ink)} .ochem-3-steering-wheel-b{font-size:14px;fill:var(--fig-ink);font-weight:600} .ochem-3-steering-wheel-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ochem-3-steering-wheel-s{font-size:13px;fill:var(--fig-muted)} .ochem-3-steering-wheel-n{font-size:13px;fill:var(--fig-muted)} .ochem-3-steering-wheel-r{font-size:13px;fill:var(--fig-red);font-weight:600} .ochem-3-steering-wheel-g{font-size:13px;fill:var(--fig-green);font-weight:600} .ochem-3-steering-wheel-v{font-size:13px;fill:var(--fig-violet)} .ochem-3-steering-wheel-pl{font-size:20px;fill:var(--fig-ink)} .ochem-3-steering-wheel-f{font-size:14px;fill:var(--fig-ink)}</style>
  <line x1="120.0" y1="130.0" x2="120.0" y2="91.0" style="stroke:var(--fig-ink);stroke-width:2.0;stroke-linecap:round"/>
  <text x="115.0" y="85.0" class="ochem-3-steering-wheel-t" text-anchor="start" style="fill:var(--fig-red)">OH</text>
  <line x1="120.0" y1="130.0" x2="153.8" y2="149.5" style="stroke:var(--fig-ink);stroke-width:2.0;stroke-linecap:round"/>
  <text x="158.3" y="160.0" class="ochem-3-steering-wheel-t" text-anchor="start" style="fill:var(--fig-ink)">CH₂CH₃</text>
  <path d="M 120.0 130.0 L 94.4 159.7 L 100.9 164.2 Z" style="fill:var(--fig-ink);stroke:var(--fig-ink);stroke-width:0.8;stroke-linejoin:round"/>
  <text x="96.3" y="176.0" class="ochem-3-steering-wheel-t" text-anchor="end" style="fill:var(--fig-ink)">H₃C</text>
  <line x1="114.7" y1="127.4" x2="114.3" y2="128.6" style="stroke:var(--fig-ink);stroke-width:1.5"/>
  <line x1="109.5" y1="124.8" x2="108.6" y2="127.3" style="stroke:var(--fig-ink);stroke-width:1.5"/>
  <line x1="104.2" y1="122.1" x2="102.9" y2="125.9" style="stroke:var(--fig-ink);stroke-width:1.5"/>
  <line x1="99.0" y1="119.5" x2="97.2" y2="124.5" style="stroke:var(--fig-ink);stroke-width:1.5"/>
  <line x1="93.7" y1="116.9" x2="91.5" y2="123.2" style="stroke:var(--fig-ink);stroke-width:1.5"/>
  <line x1="88.5" y1="114.3" x2="85.7" y2="121.8" style="stroke:var(--fig-ink);stroke-width:1.5"/>
  <text x="78.7" y="120.0" class="ochem-3-steering-wheel-t" text-anchor="middle" style="fill:var(--fig-ink)">H</text>
  <circle cx="150.0" cy="81.0" r="8" style="fill:var(--fig-panel);stroke:var(--fig-violet);stroke-width:1.3"/>
  <text x="150.0" y="85.5" class="ochem-3-steering-wheel-v" text-anchor="middle" style="font-size:12px;font-weight:700">1</text>
  <circle cx="191.3" cy="177.0" r="8" style="fill:var(--fig-panel);stroke:var(--fig-violet);stroke-width:1.3"/>
  <text x="191.3" y="181.5" class="ochem-3-steering-wheel-v" text-anchor="middle" style="font-size:12px;font-weight:700">2</text>
  <circle cx="77.3" cy="195.0" r="8" style="fill:var(--fig-panel);stroke:var(--fig-violet);stroke-width:1.3"/>
  <text x="77.3" y="199.5" class="ochem-3-steering-wheel-v" text-anchor="middle" style="font-size:12px;font-weight:700">3</text>
  <circle cx="64.7" cy="116.0" r="8" style="fill:var(--fig-panel);stroke:var(--fig-violet);stroke-width:1.3"/>
  <text x="64.7" y="120.5" class="ochem-3-steering-wheel-v" text-anchor="middle" style="font-size:12px;font-weight:700">4</text>
  <text x="120.0" y="250.0" class="ochem-3-steering-wheel-s" text-anchor="middle">(R)-뷰탄-2-올과 CIP 순위</text>
  <line x1="225.0" y1="130.0" x2="267.0" y2="130.0" style="stroke:var(--fig-ink);stroke-width:1.8"/>
  <path d="M 275.0 130.0 L 265.0 134.5 L 267.5 130.0 L 265.0 125.5 Z" style="fill:var(--fig-ink);stroke:var(--fig-ink);stroke-width:0.8;stroke-linejoin:round"/>
  <text x="250.0" y="121.0" class="ochem-3-steering-wheel-s" text-anchor="middle">H를 뒤로</text>
  <circle cx="370" cy="130" r="70" style="fill:none;stroke:var(--fig-line);stroke-width:6"/>
  <line x1="370.0" y1="130.0" x2="370.0" y2="72.6" style="stroke:var(--fig-ink);stroke-width:2;stroke-linecap:round"/>
  <line x1="370.0" y1="130.0" x2="419.7" y2="158.7" style="stroke:var(--fig-ink);stroke-width:2;stroke-linecap:round"/>
  <line x1="370.0" y1="130.0" x2="320.3" y2="158.7" style="stroke:var(--fig-ink);stroke-width:2;stroke-linecap:round"/>
  <text x="370.0" y="49.0" class="ochem-3-steering-wheel-t" text-anchor="middle" style="fill:var(--fig-red)">OH</text>
  <text x="456.6" y="185.0" class="ochem-3-steering-wheel-t" text-anchor="middle" style="fill:var(--fig-ink)">CH₂CH₃</text>
  <text x="288.6" y="182.0" class="ochem-3-steering-wheel-t" text-anchor="middle" style="fill:var(--fig-ink)">H₃C</text>
  <circle cx="370.0" cy="60.0" r="8" style="fill:var(--fig-panel);stroke:var(--fig-violet);stroke-width:1.3"/>
  <text x="370.0" y="64.5" class="ochem-3-steering-wheel-v" text-anchor="middle" style="font-size:12px;font-weight:700">1</text>
  <circle cx="430.6" cy="165.0" r="8" style="fill:var(--fig-panel);stroke:var(--fig-violet);stroke-width:1.3"/>
  <text x="430.6" y="169.5" class="ochem-3-steering-wheel-v" text-anchor="middle" style="font-size:12px;font-weight:700">2</text>
  <circle cx="309.4" cy="165.0" r="8" style="fill:var(--fig-panel);stroke:var(--fig-violet);stroke-width:1.3"/>
  <text x="309.4" y="169.5" class="ochem-3-steering-wheel-v" text-anchor="middle" style="font-size:12px;font-weight:700">3</text>
  <circle cx="370" cy="130" r="11" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.2;stroke-dasharray:3 2"/>
  <text x="370.0" y="135.0" class="ochem-3-steering-wheel-t" text-anchor="middle">C</text>
  <path d="M 385.7 86.8 L 390.2 88.7 L 394.4 91.0 L 398.3 93.8 L 402.0 96.9 L 405.2 100.4 L 408.1 104.3 L 410.6 108.4 L 412.7 112.8 L 414.2 117.3 L 415.3 122.0 L 415.9 126.8 L 416.0 131.6 L 415.6 136.4 L 414.6 141.1 L 413.2 145.7 L 411.3 150.2 L 409.0 154.4 L 406.2 158.3 L 403.1 162.0 L 399.6 165.2 L 395.7 168.1 L 391.6 170.6 L 387.2 172.7 L 382.7 174.2 L 378.0 175.3 L 373.2 175.9 L 368.4 176.0 L 363.6 175.6 L 358.9 174.6 L 354.3 173.2 L 349.8 171.3 L 345.6 169.0 L 341.7 166.2 L 338.0 163.1 L 334.8 159.6 L 331.9 155.7" style="fill:none;stroke:var(--fig-violet);stroke-width:2"/>
  <path d="M 328.3 149.4 L 337.3 153.9 L 332.4 154.8 L 330.1 159.3 Z" style="fill:var(--fig-violet);stroke:var(--fig-violet);stroke-width:0.8;stroke-linejoin:round"/>
  <text x="288.0" y="78.0" class="ochem-3-steering-wheel-h" text-anchor="middle" style="fill:var(--fig-violet);font-size:24px">R</text>
  <text x="370.0" y="250.0" class="ochem-3-steering-wheel-s" text-anchor="middle">H(점선 원)는 C 바로 뒤: ①→②→③ 시계 방향</text>
  <rect x="490.0" y="40.0" width="218.0" height="180.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="599.0" y="64.0" class="ochem-3-steering-wheel-b" text-anchor="middle">④가 앞(쐐기)을 향하면</text>
  <text x="504.0" y="90.0" class="ochem-3-steering-wheel-t" text-anchor="start" style="font-size:13px">보이는 그대로 방향을 읽은 뒤</text>
  <text x="504.0" y="107.0" class="ochem-3-steering-wheel-t" text-anchor="start" style="font-size:13px">R과 S를 뒤집는다.</text>
  <text x="504.0" y="141.0" class="ochem-3-steering-wheel-r" text-anchor="start" style="font-size:13px">시계 방향으로 보이면 → S</text>
  <text x="504.0" y="158.0" class="ochem-3-steering-wheel-r" text-anchor="start" style="font-size:13px">반시계 방향으로 보이면 → R</text>
  <text x="504.0" y="192.0" class="ochem-3-steering-wheel-t" text-anchor="start" style="font-size:13px">운전대를 뒤에서 보면 도는</text>
  <text x="504.0" y="209.0" class="ochem-3-steering-wheel-t" text-anchor="start" style="font-size:13px">방향이 반대로 보이는 것과 같다.</text>
</svg>
