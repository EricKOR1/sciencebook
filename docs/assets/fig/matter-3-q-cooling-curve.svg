  <title id="t-matter-3-q-cooling-curve">그림 물질과 에너지 3-11 문제 11의 온도–시간 그래프</title>
  <desc id="d-matter-3-q-cooling-curve">질산 암모늄이 녹으며 열을 흡수하면 용액의 온도가 내려간다. 바깥과 열을 주고받지 않는다면 약 18.8 °C까지 내려가 머물지만(점선), 실제로는 차가워진 용액으로 공기와 컵의 열이 흘러 들어와 19.5 °C까지만 내려간 뒤 다시 오른다(실선). 시간 축과 곡선의 모양은 모식도이다.</desc>
