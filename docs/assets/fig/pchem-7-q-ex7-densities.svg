<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-pchem-7-q-ex7-densities d-pchem-7-q-ex7-densities">
  <title id="t-pchem-7-q-ex7-densities">그림 물리화학 7-6 예제 7의 두 확률 밀도 비교</title>
  <desc id="d-pchem-7-q-ex7-densities">상자 바닥 상태의 L|ψ1|² = 2 sin²(πx/L)(실선, 최댓값 2.00)과 포물선 함수의 L|ψ|² = 30(x/L)²(1 − x/L)²(점선, 최댓값 1.875). 칠한 가운데 3분의 1 구간에서 발견될 확률은 실선 0.609, 점선 0.580이고, 고르게 퍼진 고전 입자(회색 가로 점선 L|ψ|² = 1)는 0.333이다.</desc>
