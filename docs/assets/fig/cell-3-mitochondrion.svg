  <circle cx="112.0" cy="162.0" r="2" style="fill:var(--fig-muted)"/>
  <text x="476.0" y="82.0" class="cell-3-mitochondrion-bs">외막</text>
  <text x="476.0" y="102.0" class="cell-3-mitochondrion-s">매끈함, 투과성이 비교적 큼</text>
  <text x="476.0" y="134.0" class="cell-3-mitochondrion-bs">막 사이 공간</text>
  <text x="476.0" y="154.0" class="cell-3-mitochondrion-s">퍼내진 H⁺이 모여 농도 높음</text>
  <text x="476.0" y="186.0" class="cell-3-mitochondrion-bs">내막(크리스타)</text>
  <text x="476.0" y="206.0" class="cell-3-mitochondrion-s">전자 전달계 · ATP 합성 효소</text>
  <text x="476.0" y="226.0" class="cell-3-mitochondrion-s">주름 → 표면적 넓힘, 투과성 낮음</text>
  <text x="476.0" y="258.0" class="cell-3-mitochondrion-bs">기질</text>
  <text x="476.0" y="278.0" class="cell-3-mitochondrion-s">피루브산 산화 · TCA 회로</text>
  <text x="476.0" y="298.0" class="cell-3-mitochondrion-s">자체 DNA · 리보솜 · 효소</text>
  <text x="360.0" y="352.0" text-anchor="middle" class="cell-3-mitochondrion-s">모식도(크기 비율은 실제와 다름). 전자 전달계와 ATP 합성 효소의 작용은 ③의 시뮬레이션에서 본다.</text>
