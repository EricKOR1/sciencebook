<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-cell-3-mitochondrion d-cell-3-mitochondrion">
  <title id="t-cell-3-mitochondrion">그림 세포와 물질대사 3-1 미토콘드리아의 구조</title>
  <desc id="d-cell-3-mitochondrion">미토콘드리아는 매끈한 외막과 안쪽으로 주름진 내막(크리스타)으로 된 2중막 구조이다. 외막과 내막 사이가 막 사이 공간이고, 내막 안쪽의 액체 부분인 기질에는 자체 DNA와 리보솜, 피루브산 산화와 TCA 회로의 효소가 있다. 내막에는 전자 전달계와 ATP 합성 효소가 박혀 있다. 모식도(크기 비율은 실제와 다름).</desc>
