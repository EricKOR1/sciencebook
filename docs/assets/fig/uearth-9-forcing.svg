    .uearth-9-forcing-c-green{font-size:13px;font-weight:600;fill:var(--fig-green)}
    .uearth-9-forcing-c-amber{font-size:13px;font-weight:600;fill:var(--fig-amber)}
    .uearth-9-forcing-c-violet{font-size:13px;font-weight:600;fill:var(--fig-violet)}
    .uearth-9-forcing-c-teal{font-size:13px;font-weight:600;fill:var(--fig-teal)}
  </style>
