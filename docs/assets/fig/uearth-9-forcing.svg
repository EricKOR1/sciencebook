    .uearth-9-forcing-panel{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1}
    .uearth-9-forcing-sea{fill:var(--fig-soft-blue);stroke:none}
    .uearth-9-forcing-land{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:0.7;fill-rule:evenodd}
    .uearth-9-forcing-grat{fill:none;stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 4}
    .uearth-9-forcing-frame{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .uearth-9-forcing-c-ink{font-size:13px;font-weight:600;fill:var(--fig-ink)}
    .uearth-9-forcing-c-muted{font-size:13px;font-weight:600;fill:var(--fig-muted)}
    .uearth-9-forcing-c-line{font-size:13px;font-weight:600;fill:var(--fig-line)}
