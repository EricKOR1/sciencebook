<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-uearth-9-forcing d-uearth-9-forcing">
  <title id="t-uearth-9-forcing">그림 일반지구과학 9-5 CO₂ 농도와 복사 강제력, 그리고 여러 요인의 강제력 비교</title>
  <desc id="d-uearth-9-forcing">왼쪽은 산업화 이전 280 ppm을 기준으로 한 이산화 탄소의 복사 강제력 ΔF = 5.35 ln(C/280) W/m²의 그래프이다. 농도가 2배가 될 때마다(280→560→1120 ppm) 강제력이 같은 양(약 3.7 W/m²)씩 늘어나는 로그 관계이며, 빙기의 약 180 ppm은 약 −2.4, 현재 약 420 ppm은 약 +2.2 W/m²에 해당한다. 오른쪽은 본문에 나온 여러 요인의 강제력 크기를 비교한 막대그래프로, 태양 흑점 주기의 변동(약 0.18)은 작고, 반사율이 0.01만 커져도(약 −3.4) CO₂ 2배(+3.7)와 맞먹으며, 큰 화산 분화는 1~3년 동안 수 W/m²의 냉각을 일으킨다.</desc>
  <style>
    .uearth-9-forcing-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
