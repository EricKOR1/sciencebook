<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t-umath-3-blood-vessel d-umath-3-blood-vessel">
  <title id="t-umath-3-blood-vessel">그림 수학 도구 3-9 혈관 속 포물선 유속 분포와 단면의 면적분</title>
  <desc id="d-umath-3-blood-vessel">왼쪽: 혈관을 길이 방향으로 자른 단면. 속도는 축에서 최대(v_max), 벽에서 0인 포물선 분포 v = v_max(1 − s²/R²)이다. 오른쪽: 원형 단면에서 반지름 s와 s+ds 사이의 얇은 고리(넓이 2πs ds)를 지나는 유량 dQ = v(s)·2πs ds를 모두 더하면 Q이다.</desc>
