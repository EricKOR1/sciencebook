<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-5-3-co2-curve d-5-3-co2-curve">
  <title id="t-5-3-co2-curve">그림 5-3-5 하와이 마우나로아에서 측정한 대기 중 이산화 탄소 농도</title>
  <desc id="d-5-3-co2-curve">왼쪽은 1958년부터 2023년까지의 이산화 탄소 농도로, 약 315 ppm에서 약 421 ppm으로 꾸준히 늘었고 증가 속도도 점점 빨라졌다. 오른쪽은 최근 3년을 확대한 것으로, 북반구 식물의 광합성 때문에 해마다 늦봄에 가장 높고 가을에 가장 낮은 톱니 모양의 계절 변동이 겹쳐 있다. 연평균값(미국 해양대기청 자료를 반올림)에 폭 약 6 ppm의 계절 변동을 더해 그린 모식 그래프이다.</desc>
