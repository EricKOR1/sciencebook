<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-4-3-blast-furnace d-4-3-blast-furnace">
  <title id="t-4-3-blast-furnace">그림 4-3-3 용광로(고로) 단면 모식도</title>
  <desc id="d-4-3-blast-furnace">위에서 철광석·코크스·석회석을 넣고 아래에서 뜨거운 공기를 불어 넣는다. 코크스가 타서 생긴 일산화 탄소가 올라가며 철광석에서 산소를 빼앗아 철을 환원하고, 녹은 철은 바닥에, 슬래그는 그 위에 모인다. 모식도(크기 비율은 실제와 다름).</desc>
  <defs>
    <clipPath id="bf-inside"><path d="M225 72 L185 250 L205 330 L205 410 L335 410 L335 330 L355 250 L315 72 Z"/></clipPath>
  </defs>
  <style>
    .bf-ore{fill:var(--fig-soft-red)}
    .bf-coke{fill:var(--fig-line);fill-opacity:.45}
    .bf-hot{fill:var(--fig-soft-amber)}
    .bf-slag{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1}
    .bf-iron{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5}
    .bf-wall{fill:none;stroke:var(--fig-ink);stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
    .bf-lbl{font-size:14px;fill:var(--fig-ink)}
    .bf-b{font-size:14px;font-weight:700;fill:var(--fig-ink)}
    .bf-sm{font-size:12.5px;fill:var(--fig-muted)}
    .bf-eq{font-size:14px;fill:var(--fig-ink)}
    .bf-gas{stroke:var(--fig-blue);stroke-width:2;stroke-dasharray:6 4;fill:none}
    .bf-gas-h{fill:var(--fig-blue)}
    .bf-air{stroke:var(--fig-red);stroke-width:3;fill:none}
    .bf-air-h{fill:var(--fig-red)}
    .bf-in{stroke:var(--fig-ink);stroke-width:2.5;fill:none}
    .bf-in-h{fill:var(--fig-ink)}
    .bf-lead{stroke:var(--fig-muted);stroke-width:1.2;fill:none;stroke-dasharray:3 3}
    .bf-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2}
    .bf-box-key{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5}
    .bf-drop{fill:var(--fig-amber)}
    .bf-gaslbl{font-size:13px;font-weight:600;fill:var(--fig-blue)}
  </style>

  <!-- 장입물 투입 -->
  <text x="270" y="22" text-anchor="middle" class="bf-b">철광석 · 코크스 · 석회석 투입</text>
  <line x1="270" y1="30" x2="270" y2="58" class="bf-in"/><path d="M270 66 l-7 -11 h14 z" class="bf-in-h"/>

  <!-- 노 내부 층 -->
  <g clip-path="url(#bf-inside)">
    <rect x="170" y="72" width="200" height="22" class="bf-ore"/>
    <rect x="170" y="94" width="200" height="16" class="bf-coke"/>
    <rect x="170" y="110" width="200" height="22" class="bf-ore"/>
    <rect x="170" y="132" width="200" height="16" class="bf-coke"/>
    <rect x="170" y="148" width="200" height="22" class="bf-ore"/>
    <rect x="170" y="170" width="200" height="16" class="bf-coke"/>
    <rect x="170" y="186" width="200" height="22" class="bf-ore"/>
    <rect x="170" y="208" width="200" height="16" class="bf-coke"/>
    <rect x="170" y="224" width="200" height="26" class="bf-ore"/>
    <rect x="170" y="250" width="200" height="104" class="bf-coke"/>
    <rect x="170" y="354" width="200" height="22" class="bf-slag"/>
    <rect x="170" y="376" width="200" height="40" class="bf-iron"/>
  </g>
  <!-- 녹아 떨어지는 철 방울 -->
  <circle cx="232" cy="276" r="3.5" class="bf-drop"/><circle cx="262" cy="296" r="3.5" class="bf-drop"/>
  <circle cx="300" cy="282" r="3.5" class="bf-drop"/><circle cx="318" cy="306" r="3.5" class="bf-drop"/>
  <circle cx="246" cy="318" r="3.5" class="bf-drop"/><circle cx="284" cy="330" r="3.5" class="bf-drop"/>
  <text x="270" y="371" text-anchor="middle" class="bf-sm" style="fill:var(--fig-ink)">슬래그</text>
  <text x="270" y="399" text-anchor="middle" class="bf-lbl" style="font-weight:600">녹은 철(선철)</text>

  <!-- 벽 -->
  <path d="M225 72 L185 250 L205 330 L205 410 L335 410 L335 330 L355 250 L315 72" class="bf-wall"/>

  <!-- CO 기체 상승 -->
  <path d="M244 322 L244 92" class="bf-gas"/><path d="M244 82 l-6 11 h12 z" class="bf-gas-h"/>
  <path d="M296 322 L296 92" class="bf-gas"/><path d="M296 82 l-6 11 h12 z" class="bf-gas-h"/>

  <!-- 배출 가스 -->
  <path d="M318 70 Q 340 50 372 48" class="bf-gas" style="stroke-dasharray:none"/><path d="M380 48 l-10 -6 v12 z" class="bf-gas-h"/>
  <text x="386" y="44" class="bf-sm">배출 가스</text>
  <text x="386" y="60" class="bf-sm">(CO₂ 등)</text>

  <!-- 뜨거운 공기 (송풍구) -->
  <line x1="140" y1="340" x2="192" y2="340" class="bf-air"/><path d="M202 340 l-11 -7 v14 z" class="bf-air-h"/>
  <line x1="400" y1="340" x2="348" y2="340" class="bf-air"/><path d="M338 340 l11 -7 v14 z" class="bf-air-h"/>
  <text x="120" y="336" text-anchor="end" class="bf-lbl">뜨거운</text>
  <text x="120" y="353" text-anchor="end" class="bf-lbl">공기</text>

  <!-- 배출구 -->
  <line x1="205" y1="398" x2="140" y2="398" class="bf-in" style="stroke:var(--fig-amber)"/><path d="M130 398 l11 -7 v14 z" style="fill:var(--fig-amber)"/>
  <text x="122" y="394" text-anchor="end" class="bf-lbl">쇳물</text>
  <text x="122" y="411" text-anchor="end" class="bf-sm">→ 강철로</text>

  <!-- 왼쪽 설명: 기체 -->
  <text x="20" y="150" class="bf-gaslbl">일산화 탄소(CO)가</text>
  <text x="20" y="168" class="bf-gaslbl">위로 올라가며</text>
  <text x="20" y="186" class="bf-gaslbl">철광석과 만난다</text>
  <line x1="150" y1="170" x2="240" y2="170" class="bf-lead"/>

  <!-- 범례 -->
  <rect x="20" y="236" width="16" height="12" class="bf-ore"/><text x="42" y="247" class="bf-sm">철광석·석회석</text>
  <rect x="20" y="258" width="16" height="12" class="bf-coke"/><text x="42" y="269" class="bf-sm">코크스</text>

  <!-- 오른쪽 반응 설명 -->
  <rect x="420" y="96" width="290" height="70" rx="8" class="bf-box-key"/>
  <text x="432" y="118" class="bf-b">③ 철광석의 환원 (위쪽)</text>
  <text x="432" y="138" class="bf-eq">Fe₂O₃ + 3CO → 2Fe + 3CO₂</text>
  <text x="432" y="156" class="bf-sm">일산화 탄소가 산화 철에서 산소를 빼앗는다</text>
  <line x1="420" y1="140" x2="340" y2="160" class="bf-lead"/>

  <rect x="420" y="214" width="290" height="54" rx="8" class="bf-box"/>
  <text x="432" y="236" class="bf-eq"><tspan style="font-weight:700">②</tspan> CO₂ + C → 2CO</text>
  <text x="432" y="256" class="bf-sm">이산화 탄소가 뜨거운 코크스와 다시 반응</text>
  <line x1="420" y1="250" x2="352" y2="282" class="bf-lead"/>

  <rect x="420" y="280" width="290" height="54" rx="8" class="bf-box"/>
  <text x="432" y="302" class="bf-eq"><tspan style="font-weight:700">①</tspan> C + O₂ → CO₂</text>
  <text x="432" y="322" class="bf-sm">송풍구 근처에서 코크스가 타며 많은 열을 낸다</text>
  <line x1="420" y1="318" x2="404" y2="334" class="bf-lead"/>

  <rect x="420" y="346" width="290" height="54" rx="8" class="bf-box"/>
  <text x="432" y="368" class="bf-b">④ 슬래그</text>
  <text x="432" y="388" class="bf-sm">석회석이 불순물과 반응해 쇳물 위에 뜬다</text>
  <line x1="420" y1="372" x2="336" y2="366" class="bf-lead"/>

  <text x="360" y="452" text-anchor="middle" class="bf-sm">① → ② → ③ 순서로 일어난다. 모식도(크기 비율은 실제와 다름)</text>
</svg>
