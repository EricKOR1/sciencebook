<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-pchem-11-q-hcl-ir-spectrum d-pchem-11-q-hcl-ir-spectrum">
  <title id="t-pchem-11-q-hcl-ir-spectrum">그림 물리화학 11-13 문제 10의 HCl 진동–회전 흡수 스펙트럼(모식도)</title>
  <desc id="d-pchem-11-q-hcl-ir-spectrum">298 K HCl 기체의 진동–회전 흡수 스펙트럼 모식도. 띠 중심(약 2886 cm⁻¹)에는 선이 없고, 왼쪽에 P 가지 P(1)~P(9), 오른쪽에 R 가지 R(0)~R(9)가 약 21 cm⁻¹ 간격으로 늘어서 있다. 선의 높이는 상대적인 세기이다.</desc>
