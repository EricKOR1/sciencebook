    .m2-03-ml-k{font-size:13px;fill:var(--fig-ink)}
    .m2-03-ml-ray{fill:none;stroke:var(--fig-red);stroke-width:2}
    .m2-03-ml-ext{fill:none;stroke:var(--fig-red);stroke-width:1.4;stroke-dasharray:5 4;opacity:.75}
    .m2-03-ml-hd{fill:var(--fig-red)}
    .m2-03-ml-ax{stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 4}
    .m2-03-ml-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2}
  </style>
