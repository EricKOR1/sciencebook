<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="t-m2-03-ml d-m2-03-ml">
  <title id="t-m2-03-ml">그림 중2-3-6 거울과 렌즈가 빛을 바꾸는 방식</title>
  <desc id="d-m2-03-ml">나란히 들어온 빛을 오목거울과 볼록렌즈는 한 점(초점)으로 모으고, 볼록거울과 오목렌즈는 퍼지게 한다. 퍼지는 빛을 거꾸로 연장한 점선은 한 점에서 만난다. 각 칸 아래에 물체를 가까이·멀리 두었을 때 보이는 모습과 쓰임을 적었다. 모식도이다.</desc>
