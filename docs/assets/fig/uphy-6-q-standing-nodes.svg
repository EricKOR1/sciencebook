  <title id="t-uphy-6-q-standing-nodes">그림 일반물리학 6-12 문제 6 해설 — 정상파의 마디와 배</title>
  <desc id="d-uphy-6-q-standing-nodes">y = (0.040 m) sin(5πx) cos(40πt)를 cos(40πt) = 1, 0.5, −0.5, −1인 순간에 그렸다. 0 ≤ x ≤ 0.40 m에서 마디(N)는 x = 0, 0.20, 0.40 m로 반 파장(0.20 m) 간격이고, 그 사이 x = 0.10, 0.30 m가 진폭 0.040 m인 배(A)이다.</desc>
