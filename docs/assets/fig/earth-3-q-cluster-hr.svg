  <title id="t-earth-3-q-cluster-hr">그림 지구과학 3-15 문제 14의 성단의 H-R도</title>
  <desc id="d-earth-3-q-cluster-hr">어느 성단의 별들을 H-R도에 찍은 모습이다. 주계열에는 태양 질량의 약 2배인 별의 위치보다 아래쪽(가벼운 쪽)에만 별이 있고, 그보다 무거운 별들은 거성 영역과 백색 왜성 영역에 있다. 점의 위치는 모식적이다.</desc>
