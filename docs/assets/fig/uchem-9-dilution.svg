  <title id="t-uchem-9-dilution">그림 일반화학 9-4 묽힐 때 강산과 약산의 pH, 약산의 이온화도</title>
  <desc id="d-uchem-9-dilution">왼쪽: 농도를 10배씩 묽힐 때 강산(HCl)의 pH는 1씩, 약산(아세트산, Kₐ = 1.8×10⁻⁵)의 pH는 약 0.5씩 오른다. 오른쪽: 아세트산의 이온화도는 묽을수록 커진다(근의 공식과 물의 이온화를 넣어 계산).</desc>
