<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-pchem-2-mixing d-pchem-2-mixing">
  <title id="t-pchem-2-mixing">그림 물리화학 2-9 이상 기체의 혼합 엔트로피</title>
  <desc id="d-pchem-2-mixing">(가) 같은 온도·압력의 기체 A(6개)와 B(4개)를 나눈 칸막이를 치우면 두 기체가 상자 전체에 고르게 섞인다. 각 기체가 VA → V, VB → V로 등온 팽창한 것과 같다. (나) 2성분 혼합 엔트로피 ΔmixS/(nR) = −[x ln x + (1−x) ln(1−x)]는 xB = 0.5에서 최댓값 ln 2 = 0.693이고, 양 끝에서 기울기가 무한대로 커진다.</desc>
