<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-m2-03-wave-medium d-m2-03-wave-medium">
  <title id="t-m2-03-wave-medium">그림 중2-3-8 파동이 전달될 때 매질의 움직임</title>
  <desc id="d-m2-03-wave-medium">줄의 왼쪽 끝을 흔들어 만든 파동을 시간 순서대로 나타냈다. 마루(주황 표시)는 시간이 지나며 오른쪽으로 이동하지만, 줄 위의 한 점(빨간 점)은 점선 위에서 위아래로만 움직이고 오른쪽으로 따라가지 않는다. 파동을 따라 전달되는 것은 매질이 아니라 진동과 에너지이다.</desc>
