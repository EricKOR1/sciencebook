<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" class="fig-small" role="img" aria-labelledby="t-m3-06-q-colorblind-three-gen d-m3-06-q-colorblind-three-gen">
  <title id="t-m3-06-q-colorblind-three-gen">그림 중3-6-9 문제 9의 가계도</title>
  <desc id="d-m3-06-q-colorblind-three-gen">정상인 부부 1, 2 사이에 적록 색맹인 아들 3과 정상인 딸 4가 있다. 딸 4는 정상인 남자 5와 결혼하였고, 6은 두 사람이 낳을 아들이다. 네모는 남자, 동그라미는 여자, 색칠한 기호는 적록 색맹인 사람이다.</desc>
  <style>
    .m3-06-q-colorblind-three-gen-lbl{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .m3-06-q-colorblind-three-gen-tx{font-size:14px;fill:var(--fig-ink)}
    .m3-06-q-colorblind-three-gen-sm{font-size:13px;fill:var(--fig-muted)}
    .m3-06-q-colorblind-three-gen-ln{fill:none;stroke:var(--fig-ink);stroke-width:2}
    .m3-06-q-colorblind-three-gen-off{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2}
    .m3-06-q-colorblind-three-gen-on{fill:var(--fig-violet);stroke:var(--fig-ink);stroke-width:2}
  </style>
  <rect x="41.0" y="17.0" width="22" height="22" class="m3-06-q-colorblind-three-gen-off"/>
  <text x="70.0" y="33.0" class="m3-06-q-colorblind-three-gen-sm">정상 남자</text>
