<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-4-1-strata-correlation d-4-1-strata-correlation">
  <title id="t-4-1-strata-correlation">그림 4-1-1 지층 누중과 표준 화석으로 두 지역의 지층 순서 맞추기</title>
  <desc id="d-4-1-strata-correlation">멀리 떨어진 두 지역의 지층에서 같은 표준 화석(삼엽충, 암모나이트)이 나오는 층을 이으면 같은 시대의 지층임을 알 수 있다(지층 대비). 각 지역에서는 아래 지층이 먼저 쌓였다. 고사리와 산호 같은 시상 화석은 시대보다 당시 환경을 알려 준다. 모식도(두께와 크기 비율은 실제와 다름).</desc>
  <style>
    .sc-lbl{font-size:14px;fill:var(--fig-ink)} .sc-b{font-weight:600}
    .sc-sm{font-size:13px;fill:var(--fig-muted)} .sc-h{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .sc-pz{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5}
    .sc-mz{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.5}
    .sc-cz{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5}
    .sc-plain{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}
    .sc-ico{fill:none;stroke:var(--fig-ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
    .sc-dot{fill:var(--fig-line)}
    .sc-tie{fill:none;stroke:var(--fig-ink);stroke-width:1.2;stroke-dasharray:5 4}
  </style>

  <text x="225" y="44" text-anchor="middle" class="sc-h">지역 A</text>
  <text x="495" y="44" text-anchor="middle" class="sc-h">지역 B</text>

  <!-- 대비 띠 -->
  <path d="M290 110 L430 100 L430 172 L290 160 Z" style="fill:var(--fig-soft-green);opacity:0.6;stroke:none"/>
  <path d="M290 210 L430 212 L430 262 L290 262 Z" style="fill:var(--fig-soft-blue);opacity:0.6;stroke:none"/>
  <path d="M290 110 L430 100 M290 160 L430 172 M290 210 L430 212" class="sc-tie"/>
  <text x="360" y="133" text-anchor="middle" class="sc-lbl sc-b">암모나이트층</text>
  <text x="360" y="151" text-anchor="middle" class="sc-lbl">= 중생대</text>
  <text x="360" y="191" text-anchor="middle" class="sc-sm">같은 표준 화석</text>
  <text x="360" y="232" text-anchor="middle" class="sc-lbl sc-b">삼엽충층</text>
  <text x="360" y="250" text-anchor="middle" class="sc-lbl">= 고생대</text>

  <!-- 지역 A 지층 -->
  <rect x="160" y="70" width="130" height="40" class="sc-plain"/>
  <g class="sc-dot"><circle cx="180" cy="82" r="1.6"/><circle cx="204" cy="96" r="1.6"/><circle cx="230" cy="84" r="1.6"/><circle cx="254" cy="98" r="1.6"/><circle cx="276" cy="86" r="1.6"/><circle cx="192" cy="100" r="1.6"/><circle cx="242" cy="78" r="1.6"/><circle cx="266" cy="102" r="1.6"/></g>
  <rect x="160" y="110" width="130" height="50" class="sc-mz"/>
  <rect x="160" y="160" width="130" height="50" class="sc-plain"/>
  <rect x="160" y="210" width="130" height="52" class="sc-pz"/>

  <!-- 지역 B 지층 -->
  <rect x="430" y="56" width="130" height="44" class="sc-cz"/>
  <rect x="430" y="100" width="130" height="72" class="sc-mz"/>
  <rect x="430" y="172" width="130" height="40" class="sc-plain"/>
  <path d="M430 186 H560 M430 199 H560" style="stroke:var(--fig-line);stroke-width:1;fill:none"/>
  <rect x="430" y="212" width="130" height="50" class="sc-pz"/>

  <!-- 화석 아이콘: 암모나이트 -->
  <path d="M225 135 a2 2 0 0 1 4 0 a4 4 0 0 1 -8 0 a6 6 0 0 1 12 0 a8 8 0 0 1 -16 0 a10 10 0 0 1 20 0 a12 12 0 0 1 -24 0" class="sc-ico"/>
  <path d="M495 136 a2 2 0 0 1 4 0 a4 4 0 0 1 -8 0 a6 6 0 0 1 12 0 a8 8 0 0 1 -16 0 a10 10 0 0 1 20 0 a12 12 0 0 1 -24 0" class="sc-ico"/>
  <!-- 삼엽충 -->
  <g class="sc-ico">
    <path d="M213 230 q12 -12 24 0 v13 q-12 14 -24 0 z"/><path d="M221 227 v22 M229 227 v22 M213 234 h24 M213 239 h24 M214 244 h22"/>
    <path d="M483 231 q12 -12 24 0 v13 q-12 14 -24 0 z"/><path d="M491 228 v22 M499 228 v22 M483 235 h24 M483 240 h24 M484 245 h22"/>
  </g>
  <!-- 고사리 -->
  <g class="sc-ico">
    <path d="M214 202 q8 -14 20 -28"/>
    <path d="M218 195 l-7 -3 M218 195 l3 -7 M223 188 l-7 -3 M223 188 l4 -7 M228 181 l-6 -3 M228 181 l4 -6"/>
  </g>
  <!-- 화폐석 -->
  <g class="sc-ico">
    <ellipse cx="495" cy="78" rx="14" ry="9"/><ellipse cx="495" cy="78" rx="9" ry="5.5"/><ellipse cx="495" cy="78" rx="4" ry="2.4"/>
  </g>
  <!-- 산호 -->
  <g class="sc-ico">
    <path d="M495 206 v-10 M495 196 l-8 -8 M495 196 l8 -8 M487 188 v-6 M503 188 l-4 -6 M503 188 l5 -5"/>
  </g>

  <!-- 지역 A 라벨 -->
  <g text-anchor="end">
    <text x="150" y="88" class="sc-lbl">사암</text><text x="150" y="104" class="sc-sm">화석 없음</text>
    <text x="150" y="132" class="sc-lbl">암모나이트</text><text x="150" y="148" class="sc-sm">표준 화석: 중생대</text>
    <text x="150" y="182" class="sc-lbl">고사리</text><text x="150" y="198" class="sc-sm">시상 화석: 습한 육지</text>
    <text x="150" y="233" class="sc-lbl">삼엽충</text><text x="150" y="249" class="sc-sm">표준 화석: 고생대</text>
  </g>
  <!-- 지역 B 라벨 -->
  <g>
    <text x="570" y="75" class="sc-lbl">화폐석</text><text x="570" y="91" class="sc-sm">표준 화석: 신생대</text>
    <text x="570" y="133" class="sc-lbl">암모나이트</text><text x="570" y="149" class="sc-sm">표준 화석: 중생대</text>
    <text x="570" y="189" class="sc-lbl">산호</text><text x="570" y="205" class="sc-sm">시상 화석: 얕은 바다</text>
    <text x="570" y="234" class="sc-lbl">삼엽충</text><text x="570" y="250" class="sc-sm">표준 화석: 고생대</text>
  </g>

  <!-- 결론 -->
  <text x="360" y="288" text-anchor="middle" class="sc-sm">각 지역에서 아래 지층이 먼저 쌓였다(지층 누중의 법칙)</text>
  <text x="360" y="314" text-anchor="middle" class="sc-lbl">오래된 순서: <tspan class="sc-b">삼엽충층(고생대) → 암모나이트층(중생대) → 화폐석층(신생대)</tspan></text>
  <text x="360" y="336" text-anchor="middle" class="sc-sm">고사리·산호 화석은 지층이 쌓인 시대보다 그때의 환경(육지·바다)을 알려 준다</text>
</svg>
