<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-uearth-3-anderson d-uearth-3-anderson">
  <title id="t-uearth-3-anderson">그림 일반지구과학 3-8 세 가지 응력 상태와 단층 유형(앤더슨 이론)</title>
  <desc id="d-uearth-3-anderson">위: 지표 부근 암석에 작용하는 최대 주응력 σ1(굵은 빨간 화살표)과 최소 주응력 σ3(가는 파란 화살표). 아래: 그때 생기는 단층. 최대 압축이 연직이면 경사 약 60°의 정단층, 최소 압축이 연직이면 경사 약 30°의 역단층, 중간 주응력이 연직이면 거의 수직인 주향 이동 단층이 생기며, 단층면은 σ1과 약 30°를 이룬다.</desc>
