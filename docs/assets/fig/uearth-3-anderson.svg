    .uearth-3-anderson-L1{fill:var(--fig-soft-amber)} .uearth-3-anderson-L2{fill:var(--fig-soft-green)} .uearth-3-anderson-L3{fill:var(--fig-soft-violet)}
    .uearth-3-anderson-ol{fill:none;stroke:var(--fig-line);stroke-width:1.2}
