<text x="600" y="414" text-anchor="middle" class="uearth-3-anderson-s">거의 수직 · 변환 단층</text>
<text x="360" y="450" text-anchor="middle" class="uearth-3-anderson-s">단층면은 σ₁과 약 30°를 이룬다. 정단층·역단층은 단면, 주향 이동 단층은 지도로 그린 모식도.</text>
