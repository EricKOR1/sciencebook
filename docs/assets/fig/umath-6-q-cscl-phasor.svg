  <title id="t-umath-6-q-cscl-phasor">그림 수학 도구 6-15 예제 14의 CsCl 구조 인자 위상자</title>
  <desc id="d-umath-6-q-cscl-phasor">위: CsCl 단위 세포(꼭짓점 Cs⁺, 몸 중심 Cl⁻). 왼쪽은 (100) 면(x = 0, 1, 파랑)으로, Cl⁻ 은 그 한가운데(x = 1/2) 면에 있다. 오른쪽은 Cs⁺ 와 Cl⁻ 을 함께 지나는 (110) 면(x + y = 1). 아래: (100) 반사에서 Cs⁺ 위상자(54)와 Cl⁻ 위상자(18, 위상 π)는 반대 방향이라 합이 36, (110) 반사에서는 같은 방향(위상 0 과 2π)이라 합이 72 이다.</desc>
