<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-ochem-8-ring-current d-ochem-8-ring-current">
  <title id="t-ochem-8-ring-current">그림 유기화학 8-14 벤젠의 고리 전류와 [18]아눌렌의 화학적 이동</title>
  <desc id="d-ochem-8-ring-current">왼쪽: 자기장 B₀ 안의 벤젠에서 π 전자가 고리를 따라 도는 고리 전류가 생긴다. 유도 자기장(닫힌 곡선)은 고리 중심과 고리 면의 위아래에서 B₀와 반대(가림), 고리 바깥의 H 자리에서는 B₀와 같은 방향(벗김)이어서 벤젠 H는 약 7.3 ppm에 나타난다(모식도). 오른쪽: [18]아눌렌은 바깥 H 12개가 벗겨져 약 9.3 ppm, 고리 안쪽 H 6개가 강하게 가려져 약 −3 ppm에 나타난다.</desc>
