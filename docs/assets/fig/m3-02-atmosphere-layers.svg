<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-m3-02-atmosphere-layers d-m3-02-atmosphere-layers">
  <title id="t-m3-02-atmosphere-layers">그림 중3-2-1 높이에 따른 기온 변화와 대기권의 4개 층</title>
  <desc id="d-m3-02-atmosphere-layers">지표에서 약 11 km까지(대류권)와 약 50~80 km(중간권)는 올라갈수록 기온이 낮아지고, 약 11~50 km(성층권)와 약 80 km 위(열권)는 올라갈수록 기온이 높아진다. 기온 값은 대략적인 모식도이다.</desc>
  <style>
    .m3-02-atmosphere-layers-t{font-size:13px;fill:var(--fig-muted)}
    .m3-02-atmosphere-layers-l{font-size:14px;fill:var(--fig-ink)}
    .m3-02-atmosphere-layers-n{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .m3-02-atmosphere-layers-b{stroke:var(--fig-line);stroke-width:1;stroke-dasharray:5 4}
  </style>
  <!-- 층 띠 (높이 0~110 km, y = 420 - 3.4545 z) -->
  <rect x="100" y="381.9" width="360" height="38.1" style="fill:var(--fig-soft-amber)"/>
  <rect x="100" y="247.3" width="360" height="134.6" style="fill:var(--fig-soft-blue)"/>
  <rect x="100" y="143.6" width="360" height="103.7" style="fill:var(--fig-soft-violet)"/>
  <rect x="100" y="40" width="360" height="103.6" style="fill:var(--fig-soft-red)"/>
  <!-- 오존층 20~30 km -->
  <rect x="100" y="316.4" width="360" height="34.5" style="fill:var(--fig-soft-green);opacity:0.9"/>
  <text x="108" y="338" class="m3-02-atmosphere-layers-t" style="fill:var(--fig-green);font-weight:600">오존층 (약 20~30 km)</text>
  <!-- 경계 -->
  <line x1="100" y1="381.9" x2="700" y2="381.9" class="m3-02-atmosphere-layers-b"/>
  <line x1="100" y1="247.3" x2="700" y2="247.3" class="m3-02-atmosphere-layers-b"/>
  <line x1="100" y1="143.6" x2="700" y2="143.6" class="m3-02-atmosphere-layers-b"/>
  <!-- 축 -->
  <line x1="100" y1="420" x2="460" y2="420" style="stroke:var(--fig-ink);stroke-width:1.5"/>
  <line x1="100" y1="420" x2="100" y2="34" style="stroke:var(--fig-ink);stroke-width:1.5"/>
  <text x="94" y="424" text-anchor="end" class="m3-02-atmosphere-layers-t">0</text>
  <text x="94" y="386" text-anchor="end" class="m3-02-atmosphere-layers-t">11</text>
  <text x="94" y="286" text-anchor="end" class="m3-02-atmosphere-layers-t">40</text>
  <text x="94" y="251" text-anchor="end" class="m3-02-atmosphere-layers-t">50</text>
  <text x="94" y="182" text-anchor="end" class="m3-02-atmosphere-layers-t">70</text>
  <text x="94" y="148" text-anchor="end" class="m3-02-atmosphere-layers-t">80</text>
  <text x="94" y="79" text-anchor="end" class="m3-02-atmosphere-layers-t">100</text>
  <text x="30" y="230" text-anchor="middle" transform="rotate(-90 30 230)" class="m3-02-atmosphere-layers-l">높이 (km)</text>
  <text x="100" y="438" text-anchor="middle" class="m3-02-atmosphere-layers-t">−100</text>
  <text x="160" y="438" text-anchor="middle" class="m3-02-atmosphere-layers-t">−80</text>
  <text x="220" y="438" text-anchor="middle" class="m3-02-atmosphere-layers-t">−60</text>
  <text x="280" y="438" text-anchor="middle" class="m3-02-atmosphere-layers-t">−40</text>
  <text x="340" y="438" text-anchor="middle" class="m3-02-atmosphere-layers-t">−20</text>
  <text x="400" y="438" text-anchor="middle" class="m3-02-atmosphere-layers-t">0</text>
  <text x="460" y="438" text-anchor="middle" class="m3-02-atmosphere-layers-t">20</text>
  <text x="280" y="460" text-anchor="middle" class="m3-02-atmosphere-layers-l">기온 (°C)</text>
  <line x1="400" y1="420" x2="400" y2="40" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:2 4"/>
  <!-- 기온 곡선 -->
  <polyline points="445,420 232,382 232,350.9 268,309.5 391,257.6 394,247.3 220,178.2 130,143.6 136,109.1 184,74.5 310,40"
    style="fill:none;stroke:var(--fig-accent);stroke-width:3;stroke-linejoin:round"/>
  <circle cx="445" cy="420" r="4" style="fill:var(--fig-accent)"/>
  <text x="440" y="408" text-anchor="end" class="m3-02-atmosphere-layers-t">지표 약 15 °C</text>
  <text x="138" y="160" class="m3-02-atmosphere-layers-t">약 −90 °C (가장 추움)</text>
  <!-- 층 이름과 특징 -->
  <text x="476" y="84" class="m3-02-atmosphere-layers-n">열권</text>
  <text x="476" y="104" class="m3-02-atmosphere-layers-l">올라갈수록 기온 ↑</text>
  <text x="476" y="122" class="m3-02-atmosphere-layers-t">공기가 매우 희박, 오로라</text>
  <text x="476" y="182" class="m3-02-atmosphere-layers-n">중간권</text>
  <text x="476" y="202" class="m3-02-atmosphere-layers-l">올라갈수록 기온 ↓</text>
  <text x="476" y="220" class="m3-02-atmosphere-layers-t">기상 현상 없음, 유성</text>
  <text x="476" y="288" class="m3-02-atmosphere-layers-n">성층권</text>
  <text x="476" y="308" class="m3-02-atmosphere-layers-l">올라갈수록 기온 ↑</text>
  <text x="476" y="326" class="m3-02-atmosphere-layers-t">오존층이 자외선 흡수, 안정</text>
  <text x="476" y="398" class="m3-02-atmosphere-layers-n">대류권</text>
  <text x="538" y="398" class="m3-02-atmosphere-layers-l">올라갈수록 기온 ↓</text>
  <text x="476" y="414" class="m3-02-atmosphere-layers-t">대류 활발, 구름·비·눈</text>
</svg>
