<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-uearth-5-section-example d-uearth-5-section-example">
<title id="t-uearth-5-section-example">그림 일반지구과학 5-5 예제 1의 지질 단면</title>
<desc id="d-uearth-5-section-example">맨 아래 편마암 G 위에 역암 1, 사암 2, 셰일 3이 놓이고 이들은 서쪽으로 30° 기울어 있다. 단층 F가 G와 1~3을 자르며, 기울어진 지층과 F는 평탄한 침식면에 잘려 있고 그 위에 수평한 석회암 4가 있다. 4의 맨 아래에는 셰일 조각이 든 얇은 역암이 있고, 현무암 암맥 D가 모든 암석을 뚫고 4의 위쪽까지 올라가 주변을 구웠다. 빨간 선은 부정합면이다. 모식도이다.</desc>
