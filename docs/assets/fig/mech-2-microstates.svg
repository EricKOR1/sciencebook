<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-mech-2-microstates d-mech-2-microstates">
  <title id="t-mech-2-microstates">그림 역학과 에너지 2-7 분자 4개가 상자 양쪽에 놓이는 16가지 배치</title>
  <desc id="d-mech-2-microstates">분자 4개가 칸막이 없는 상자의 왼쪽과 오른쪽에 놓이는 배치는 모두 16가지이다. 왼쪽 4개, 오른쪽 0개인 배치는 1가지뿐이고, 양쪽에 2개씩 고르게 퍼진 배치는 6가지로 가장 많다.</desc>
  <style>
    .mech-2-microstates-lbl{font-size:14px;fill:var(--fig-ink)} .mech-2-microstates-sm{font-size:13px;fill:var(--fig-muted)} .mech-2-microstates-xs{font-size:11px;fill:var(--fig-ink)}
    .mech-2-microstates-dot{fill:var(--fig-accent);font-size:14px;font-weight:700}
  </style>
