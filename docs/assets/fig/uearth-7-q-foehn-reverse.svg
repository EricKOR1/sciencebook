<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-uearth-7-q-foehn-reverse d-uearth-7-q-foehn-reverse">
  <title id="t-uearth-7-q-foehn-reverse">그림 일반지구과학 7-10 문제 18의 산을 넘는 공기</title>
  <desc id="d-uearth-7-q-foehn-reverse">높이 2000 m 산을 왼쪽에서 오른쪽으로 넘는 공기의 단면이다. 바람의지 쪽 해발 0 m에서 기온 34 °C, 이슬점 18 °C, 바람받이 쪽 해발 0 m에서 이슬점 20 °C이며, 물음표는 구해야 할 값이다. 산의 모양과 크기는 모식도이다.</desc>
  <style>
    .uearth-7-q-foehn-reverse-t{font-size:14px;fill:var(--fig-ink)}
