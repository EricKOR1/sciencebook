    .uearth-7-q-foehn-reverse-blue{font-size:14px;font-weight:600;fill:var(--fig-blue)}
    .uearth-7-q-foehn-reverse-green{font-size:14px;font-weight:600;fill:var(--fig-green)}
    .uearth-7-q-foehn-reverse-amber{font-size:14px;font-weight:600;fill:var(--fig-amber)}
    .uearth-7-q-foehn-reverse-violet{font-size:14px;font-weight:600;fill:var(--fig-violet)}
    .uearth-7-q-foehn-reverse-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.4}
    .uearth-7-q-foehn-reverse-grid{fill:none;stroke:var(--fig-line);stroke-width:0.7;stroke-dasharray:3 3}
  </style>
