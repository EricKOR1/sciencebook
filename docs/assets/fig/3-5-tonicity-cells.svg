<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="t-3-5-tonicity-cells d-3-5-tonicity-cells">
  <title id="t-3-5-tonicity-cells">그림 3-5-4 농도가 다른 용액에 넣은 적혈구와 식물 세포</title>
  <desc id="d-3-5-tonicity-cells">세포 안보다 농도가 낮은 용액에서는 물이 세포 안으로 들어와 적혈구는 터지고 식물 세포는 팽팽해진다. 농도가 같으면 모양이 유지되고, 농도가 높은 용액에서는 물이 빠져나가 적혈구는 쭈그러들고 식물 세포는 원형질 분리가 일어난다. 파란 화살표는 물의 알짜 이동 방향이다. 모식도.</desc>
  <style>
    .3-5-tonicity-cells-lbl{font-size:15px;fill:var(--fig-ink)} .3-5-tonicity-cells-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .3-5-tonicity-cells-sm{font-size:13px;fill:var(--fig-muted)} .3-5-tonicity-cells-ink{font-size:13px;fill:var(--fig-ink)}
    .3-5-tonicity-cells-ax{stroke:var(--fig-ink);stroke-width:1.5;fill:none} .3-5-tonicity-cells-grid{stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 4;fill:none}
  </style>
