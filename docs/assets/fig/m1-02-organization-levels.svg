<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="t-m1-02-organization-levels d-m1-02-organization-levels">
<title id="t-m1-02-organization-levels">그림 중1-2-4 동물과 식물의 구성 단계</title>
<desc id="d-m1-02-organization-levels">동물은 세포, 조직, 기관, 기관계, 개체의 단계로, 식물은 세포, 조직, 조직계, 기관, 개체의 단계로 구성된다. 기관계는 동물에만, 조직계는 식물에만 있다. 모식도(단계마다 확대 배율이 다름).</desc>
