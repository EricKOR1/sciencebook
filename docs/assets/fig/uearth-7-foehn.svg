<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uearth-7-foehn d-uearth-7-foehn">
  <title id="t-uearth-7-foehn">그림 일반지구과학 7-5 산을 넘는 공기의 단열 변화(푄) — 예제 11의 경우</title>
  <desc id="d-uearth-7-foehn">왼쪽은 기온 26 °C, 이슬점 18 °C인 공기가 높이 2500 m 산을 넘는 단면이고, 오른쪽은 같은 공기 덩어리의 기온을 높이에 따라 그린 그래프이다. 바람받이 쪽에서 공기는 건조 단열 감률(10 °C/km)로 식다가 1000 m(16 °C)에서 포화되어 구름이 생기고, 그 위로는 습윤 단열 감률(5 °C/km)로 식어 산꼭대기에서 8.5 °C가 된다. 응결한 물이 비로 내린 뒤 바람의지 쪽에서는 건조 단열 감률로 데워져 해발 0 m에서 33.5 °C가 되고 이슬점은 13.5 °C로 낮아져 고온 건조해진다. 산의 모양과 크기는 모식도이다.</desc>
