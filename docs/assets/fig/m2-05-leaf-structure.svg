<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-m2-05-leaf d-m2-05-leaf">
  <title id="t-m2-05-leaf">그림 중2-5-1 잎의 단면 구조와 기공</title>
  <desc id="d-m2-05-leaf">잎은 위아래 표피로 싸여 있고, 그 사이의 잎살 세포에는 엽록체가 많아 광합성이 활발하다. 잎맥에는 물관과 체관이 있다. 주로 잎 뒷면에 있는 기공은 두 개의 공변세포가 둘러싸고 있으며, 이산화 탄소가 들어오고 산소와 수증기가 나간다. 모식도이다.</desc>
