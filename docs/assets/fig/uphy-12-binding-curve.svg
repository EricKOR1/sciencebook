<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 354" role="img" aria-labelledby="t-uphy-12-binding-curve d-uphy-12-binding-curve">
  <title id="t-uphy-12-binding-curve">그림 일반물리학 12-11 질량수에 따른 핵자당 결합 에너지</title>
  <desc id="d-uphy-12-binding-curve">핵자당 결합 에너지는 가벼운 핵에서 질량수와 함께 빠르게 커지고(헬륨-4는 주변보다 특히 크다), 질량수 60 근처의 철·니켈에서 약 8.8 MeV로 가장 크며, 그보다 무거운 핵에서는 천천히 줄어 우라늄에서 약 7.6 MeV가 된다. 그래서 가벼운 핵은 합쳐질 때(핵융합), 무거운 핵은 중간 질량의 핵 둘로 쪼개질 때(핵분열) 핵자당 결합 에너지가 커지며 에너지가 나온다. 점은 대표적인 핵종의 실제 값이다.</desc>
