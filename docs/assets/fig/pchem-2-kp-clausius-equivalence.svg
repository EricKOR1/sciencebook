<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-pchem-2-kp-clausius-equivalence d-pchem-2-kp-clausius-equivalence">
  <title id="t-pchem-2-kp-clausius-equivalence">그림 물리화학 2-2 켈빈–플랑크 표현과 클라우지우스 표현의 동치</title>
  <desc id="d-pchem-2-kp-clausius-equivalence">왼쪽: 열을 모두 일로 바꾸는 가상 기관 X의 일로 냉동기를 돌리면, 합친 장치는 일 없이 저온에서 고온으로 열 q′을 옮긴다. 오른쪽: 일 없이 열을 옮기는 가상 장치 Y와 보통의 열기관을 합치면, 고온에서 받은 알짜 열 qh − qc가 모두 일이 된다. 한쪽을 어기면 다른 쪽도 어기게 된다.</desc>
