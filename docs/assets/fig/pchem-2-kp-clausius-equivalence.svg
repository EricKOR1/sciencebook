    .pc2kp-clausius-equivalence-famber{fill:var(--fig-amber)}
    .pc2kp-clausius-equivalence-fviolet{fill:var(--fig-violet)}
    .pc2kp-clausius-equivalence-fteal{fill:var(--fig-teal)}
    .pc2kp-clausius-equivalence-faccent{fill:var(--fig-accent)}
  </style>
