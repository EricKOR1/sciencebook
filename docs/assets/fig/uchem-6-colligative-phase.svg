<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-uchem-6-colligative-phase d-uchem-6-colligative-phase">
  <title id="t-uchem-6-colligative-phase">그림 일반화학 6-8 용액의 상평형 그림 — 어는점 내림과 끓는점 오름</title>
  <desc id="d-uchem-6-colligative-phase">물(실선)과 비휘발성 용질을 녹인 수용액(빨간 점선)의 상평형 그림 모식도(축 비율은 과장). 용질 때문에 용액의 증기 압력 곡선이 아래로 내려가(증기 압력 내림), 1 atm 선과 만나는 끓는점은 높은 온도 쪽으로(ΔTb), 어는점은 낮은 온도 쪽으로(ΔTf) 옮겨 간다. 얼어 나오는 고체는 순수한 얼음이므로 고체–기체 곡선은 그대로이고, 용액의 삼중점은 그 곡선을 따라 아래로 내려간다.</desc>
