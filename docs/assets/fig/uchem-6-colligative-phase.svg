    .uchem-6-colligative-phase-atm{stroke:var(--fig-muted);stroke-width:1.2;fill:none;stroke-dasharray:3 3}
    .uchem-6-colligative-phase-br{stroke:var(--fig-accent);stroke-width:1.8;fill:none}
    .uchem-6-colligative-phase-bh{fill:var(--fig-accent)}
    .uchem-6-colligative-phase-vr{stroke:var(--fig-violet);stroke-width:1.8;fill:none}
