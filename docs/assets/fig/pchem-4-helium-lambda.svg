<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-pchem-4-helium-lambda d-pchem-4-helium-lambda">
  <title id="t-pchem-4-helium-lambda">그림 물리화학 4-8 액체 헬륨-4의 열용량과 λ 전이</title>
  <desc id="d-pchem-4-helium-lambda">액체 헬륨-4의 정압 열용량 C_p를 온도에 대해 그린 모식도(세로축은 상대 눈금). 낮은 온도 쪽에서 점점 가파르게 올라가 T_λ ≈ 2.17 K에서 날카롭게 솟고, 높은 온도 쪽에서는 급히 떨어진 뒤 완만하게 이어진다. 그 모양이 그리스 문자 λ를 닮았다. T_λ 아래가 초유체 He-Ⅱ, 위가 보통 액체 He-Ⅰ이다.</desc>
