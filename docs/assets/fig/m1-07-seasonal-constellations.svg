  <text x="360" y="255" text-anchor="middle" class="m1-07-seasonal-constellations-t m1-07-seasonal-constellations-b" style="fill:var(--fig-paper)">태양</text>
  <circle cx="242.0" cy="250.0" r="13" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
  <path d="M242.0 237.0 A13 13 0 0 1 242.0 263.0 Z" style="fill:var(--fig-blue)"/>
