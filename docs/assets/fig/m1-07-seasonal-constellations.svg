  <line x1="496.0" y1="250.0" x2="534.0" y2="250.0" style="stroke:var(--fig-violet);stroke-width:1.8;stroke-dasharray:5 4"/>
  <path d="M542.0 250.0 L533.0 255.0 L533.0 245.0 Z" style="fill:var(--fig-violet)"/>
