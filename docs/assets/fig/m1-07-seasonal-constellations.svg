  <text x="360" y="55" text-anchor="middle" class="m1-07-seasonal-constellations-con">오리온자리 · 쌍둥이자리</text>
  <text x="360" y="455" text-anchor="middle" class="m1-07-seasonal-constellations-con">전갈자리 · 궁수자리</text>
  <text x="160" y="244" text-anchor="middle" class="m1-07-seasonal-constellations-con">사자자리</text><text x="160" y="262" text-anchor="middle" class="m1-07-seasonal-constellations-con">처녀자리</text>
  <text x="560" y="244" text-anchor="middle" class="m1-07-seasonal-constellations-con">페가수스자리</text><text x="560" y="262" text-anchor="middle" class="m1-07-seasonal-constellations-con">물병자리</text>
  <circle cx="34" cy="36" r="9" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/><path d="M34 27 A9 9 0 0 0 34 45 Z" style="fill:var(--fig-blue)"/>
  <text x="50" y="41" class="m1-07-seasonal-constellations-s">지구 (진한 쪽이 밤)</text>
  <line x1="24" y1="66" x2="46" y2="66" style="stroke:var(--fig-violet);stroke-width:1.8;stroke-dasharray:5 4"/>
  <text x="50" y="71" class="m1-07-seasonal-constellations-s">한밤중에 보이는 방향</text>
  <text x="704" y="36" text-anchor="end" class="m1-07-seasonal-constellations-s">북극 쪽에서 내려다본 모식도</text>
  <text x="704" y="56" text-anchor="end" class="m1-07-seasonal-constellations-s">(크기·거리는 실제와 다름)</text>
  <text x="360" y="488" text-anchor="middle" class="m1-07-seasonal-constellations-s">태양과 같은 쪽에 있는 별자리는 낮에 떠 있어 보이지 않는다 (예: 겨울철의 전갈자리)</text>
</svg>
