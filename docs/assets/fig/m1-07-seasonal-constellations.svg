  <text x="242.0" y="225.99999999999997" text-anchor="middle" class="m1-07-seasonal-constellations-t m1-07-seasonal-constellations-b">봄</text><text x="242.0" y="284.0" text-anchor="middle" class="m1-07-seasonal-constellations-s">3월 무렵</text>
  <circle cx="360.0" cy="368.0" r="13" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
  <path d="M347.0 368.0 A13 13 0 0 1 373.0 368.0 Z" style="fill:var(--fig-blue)"/>
  <line x1="360.0" y1="386.0" x2="360.0" y2="424.0" style="stroke:var(--fig-violet);stroke-width:1.8;stroke-dasharray:5 4"/>
  <path d="M360.0 432.0 L355.0 423.0 L365.0 423.0 Z" style="fill:var(--fig-violet)"/>
  <text x="382.0" y="372.0" class="m1-07-seasonal-constellations-t m1-07-seasonal-constellations-b">여름</text><text x="382.0" y="390.0" class="m1-07-seasonal-constellations-s">6월 무렵</text>
