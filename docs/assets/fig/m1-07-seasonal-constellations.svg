  <path d="M460.1 187.5 A118 118 0 0 0 432.6 157.0" style="fill:none;stroke:var(--fig-ink);stroke-width:2.5"/>
  <path d="M426.3 152.1 L436.3 152.3 L429.0 161.7 Z" style="fill:var(--fig-ink)"/>
  <text x="462" y="159" class="m1-07-seasonal-constellations-s">공전 방향</text>
