  <title id="t-m1-07-seasonal-constellations">그림 중1-7-2 지구의 공전과 계절별 별자리</title>
  <desc id="d-m1-07-seasonal-constellations">북극 쪽에서 내려다본 모식도. 한밤중에는 태양 반대쪽 하늘을 보게 되므로, 지구가 공전하여 위치가 바뀌면 한밤중 남쪽 하늘에 보이는 별자리도 계절마다 달라진다.</desc>
