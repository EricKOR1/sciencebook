<text x="360.0" y="316.0" text-anchor="middle" class="phy-3-refraction-sm">클래딩 (굴절률 작음)</text>
<text x="280.0" y="362.0" text-anchor="middle" class="phy-3-refraction-sm">코어 (굴절률 큼)</text>
