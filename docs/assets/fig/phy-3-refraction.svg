<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-phy-3-refraction d-phy-3-refraction">
  <title id="t-phy-3-refraction">그림 물리학 3-2 빛의 굴절과 전반사, 광섬유</title>
  <desc id="d-phy-3-refraction">(가) 공기에서 물로 들어가는 빛은 법선 쪽으로 꺾이고, (나) 유리에서 공기로 나가는 빛은 법선에서 멀어지는 쪽으로 꺾인다. (다) 유리에서 공기로 나갈 때 입사각이 임계각(약 42°)보다 크면 빛이 모두 반사된다. 아래 광섬유는 코어 안에서 전반사를 되풀이하며 빛을 보낸다(각은 굴절 법칙으로 계산).</desc>
  <style>
    .phy-3-refraction-lbl{font-size:14px;fill:var(--fig-ink)} .phy-3-refraction-sm{font-size:13px;fill:var(--fig-muted)} .phy-3-refraction-b{font-weight:600}
  </style>
<text x="123.0" y="26.0" text-anchor="middle" class="phy-3-refraction-lbl phy-3-refraction-b">(가) 공기 → 물</text>
