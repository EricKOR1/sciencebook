<text x="589.0" y="175.0" text-anchor="end" class="phy-3-refraction-sm">공기로 나가지 못함</text>
<text x="589.0" y="195.0" text-anchor="end" class="phy-3-refraction-sm" style="fill:var(--fig-red)">→ 모두 반사(전반사)</text>
<text x="360.0" y="252.0" text-anchor="middle" class="phy-3-refraction-sm">각은 모두 법선(점선)에서 잰다.  (가) 법선 쪽으로 꺾임   (나) 법선에서 멀어짐   (다) 임계각 약 42°보다 크면 전반사</text>
<text x="360.0" y="285.0" text-anchor="middle" class="phy-3-refraction-lbl phy-3-refraction-b">광섬유 — 코어 안에서 전반사를 되풀이한다</text>
<rect x="40.0" y="300.0" width="640.0" height="90.0" rx="10" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.5"/>
<rect x="40.0" y="322.0" width="640.0" height="46.0" rx="0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
