<text x="360.0" y="26.0" text-anchor="middle" class="phy-3-refraction-lbl phy-3-refraction-b">(나) 유리 → 공기</text>
<rect x="250.0" y="45.0" width="220.0" height="90.0" rx="0" style="fill:var(--fig-soft-blue);stroke:none;stroke-width:0"/>
<rect x="250.0" y="135.0" width="220.0" height="95.0" rx="0" style="fill:var(--fig-paper);stroke:none;stroke-width:0"/>
