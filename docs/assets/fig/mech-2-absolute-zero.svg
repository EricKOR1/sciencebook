  <title id="t-mech-2-absolute-zero">그림 역학과 에너지 2-3 기체의 부피–온도 그래프와 절대 온도</title>
  <desc id="d-mech-2-absolute-zero">압력이 일정할 때 기체의 양이 서로 다른 세 경우 모두 부피가 섭씨 온도에 대해 직선으로 변한다. 측정한 구간(0~100 °C)의 직선을 연장하면 세 직선이 모두 약 −273 °C에서 부피 0을 가리킨다. 이 온도를 0 K로 잡은 것이 절대 온도이다.</desc>
