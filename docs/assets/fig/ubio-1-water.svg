<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-ubio-1-water d-ubio-1-water">
  <title id="t-ubio-1-water">그림 일반생명과학 1-2 물 분자의 수소 결합과 이온의 수화</title>
  <desc id="d-ubio-1-water">왼쪽: 가운데 물 분자는 두 수소(δ+)로 아래 두 분자의 산소에, 산소의 비공유 전자쌍(δ−)으로 위 두 분자의 수소에 수소 결합(점선)하여 최대 4개의 이웃과 연결된다. 오른쪽: 물 분자는 Na⁺에는 산소 쪽을, Cl⁻에는 수소 쪽을 향해 둘러싸 수화 껍질을 만든다. 평면에 그린 모식도이다.</desc>
  <style>.ubio-1-water-t{font-size:14px;fill:var(--fig-ink)} .ubio-1-water-s{font-size:13px;fill:var(--fig-muted)} .ubio-1-water-b{font-size:14px;fill:var(--fig-ink);font-weight:600} .ubio-1-water-d{font-size:13px;fill:var(--fig-red);font-weight:600} .ubio-1-water-p{font-size:13px;fill:var(--fig-blue);font-weight:600}</style>
