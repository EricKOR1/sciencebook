<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-gene-3-crispr d-gene-3-crispr">
  <title id="t-gene-3-crispr">그림 생물의 유전 3-5 크리스퍼 유전자 가위(CRISPR-Cas9)가 DNA를 편집하는 과정</title>
  <desc id="d-gene-3-crispr">가이드 RNA가 표적 DNA의 약 20개 염기와 상보적으로 결합하여 위치를 찾고, Cas9 단백질이 그 자리에서 DNA 두 가닥을 모두 자른다. 잘린 DNA를 세포가 이어 붙일 때 염기가 조금 없어지거나 끼어들면 틀 이동이 일어나 유전자 기능이 사라지고, 고친 서열의 주형 DNA를 함께 넣어 주면 그 주형대로 고쳐질 수 있다. 모식도이다.</desc>
