<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-uchem-9-carbonate-titration d-uchem-9-carbonate-titration">
  <title id="t-uchem-9-carbonate-titration">그림 일반화학 9-5 탄산 나트륨을 염산으로 적정할 때 — 당량점이 둘</title>
  <desc id="d-uchem-9-carbonate-titration">0.100 M Na₂CO₃ 25.0 mL를 0.100 M HCl로 적정한 곡선이다(Kₐ₁ = 4.3×10⁻⁷, Kₐ₂ = 4.7×10⁻¹¹, 생긴 CO₂는 날아가지 않고 H₂CO₃로 남는다고 가정). 첫 당량점(25.0 mL, pH 8.35)은 페놀프탈레인, 둘째 당량점(50.0 mL, pH 약 3.9)은 메틸 오렌지로 찾는다. 두 당량점 사이 부피가 같다.</desc>
