<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 474" role="img" aria-labelledby="t-ochem-1-pka-ruler d-ochem-1-pka-ruler">
  <title id="t-ochem-1-pka-ruler">그림 유기화학 1-18 pKa 자</title>
  <desc id="d-ochem-1-pka-ruler">pKa −10부터 50까지의 눈금자 위쪽에 산, 아래쪽에 짝염기를 적고 지시선으로 각 pKa 자리에 이었다: HI −10, HCl −7, H₃O⁺ −1.7, CF₃COOH 0.2, CH₃COOH 4.76, 피리디늄 이온 5.2, NH₄⁺ 9.25, 페놀 10.0, H₂O 15.7, 에탄올 16, 아세톤의 α-H 19(떼어지는 H를 빨갛게), 에타인 25, H₂ 35, NH₃ 36, 에텐 44, 메테인 50. 왼쪽으로 갈수록 강한 산·약한 짝염기, 오른쪽으로 갈수록 약한 산·강한 짝염기이다. 옅은 파란 띠(약 −2~16)는 수용액에서 직접 잴 수 있는 범위이다.</desc>
