<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 240" class="fig-small" role="img" aria-labelledby="t-ubio-2-q-two-cells d-ubio-2-q-two-cells">
  <title id="t-ubio-2-q-two-cells">그림 일반생명과학 2-10 문제 7 이웃한 두 식물 세포</title>
  <desc id="d-ubio-2-q-two-cells">세포벽을 사이에 두고 맞닿은 식물 세포 A와 B의 용질 퍼텐셜(Ψs)과 압력 퍼텐셜(Ψp). 값은 문제에 주어진 것이다(20 °C).</desc>
  <defs><marker id="ubio-2-q-two-cells-a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-ink)"/></marker><marker id="ubio-2-q-two-cells-a-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-muted)"/></marker><marker id="ubio-2-q-two-cells-a-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-line)"/></marker><marker id="ubio-2-q-two-cells-a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-blue)"/></marker><marker id="ubio-2-q-two-cells-a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-red)"/></marker><marker id="ubio-2-q-two-cells-a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-green)"/></marker><marker id="ubio-2-q-two-cells-a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-amber)"/></marker><marker id="ubio-2-q-two-cells-a-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-violet)"/></marker><marker id="ubio-2-q-two-cells-a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-teal)"/></marker></defs>
  <style>.ubio-2-q-two-cells-t{font-size:14px;fill:var(--fig-ink)} .ubio-2-q-two-cells-s{font-size:13px;fill:var(--fig-muted)} .ubio-2-q-two-cells-b{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-2-q-two-cells-ink{font-size:14px;fill:var(--fig-ink);font-weight:700} .ubio-2-q-two-cells-muted{font-size:14px;fill:var(--fig-muted);font-weight:700} .ubio-2-q-two-cells-line{font-size:14px;fill:var(--fig-line);font-weight:700} .ubio-2-q-two-cells-blue{font-size:14px;fill:var(--fig-blue);font-weight:700} .ubio-2-q-two-cells-red{font-size:14px;fill:var(--fig-red);font-weight:700} .ubio-2-q-two-cells-green{font-size:14px;fill:var(--fig-green);font-weight:700} .ubio-2-q-two-cells-amber{font-size:14px;fill:var(--fig-amber);font-weight:700} .ubio-2-q-two-cells-violet{font-size:14px;fill:var(--fig-violet);font-weight:700} .ubio-2-q-two-cells-teal{font-size:14px;fill:var(--fig-teal);font-weight:700}</style>
  <rect x="30" y="40" width="200" height="160" rx="6" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:4"/>
  <rect x="42" y="52" width="176" height="136" rx="14" style="fill:var(--fig-panel);stroke:var(--fig-green);stroke-width:1.5"/>
  <text x="130" y="92" text-anchor="middle" class="ubio-2-q-two-cells-b">세포 A</text>
  <text x="130" y="130" text-anchor="middle" class="ubio-2-q-two-cells-t">Ψs = −0.90 MPa</text>
  <text x="130" y="156" text-anchor="middle" class="ubio-2-q-two-cells-t">Ψp = +0.40 MPa</text>
  <rect x="230" y="40" width="200" height="160" rx="6" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:4"/>
  <rect x="242" y="52" width="176" height="136" rx="14" style="fill:var(--fig-panel);stroke:var(--fig-green);stroke-width:1.5"/>
  <text x="330" y="92" text-anchor="middle" class="ubio-2-q-two-cells-b">세포 B</text>
  <text x="330" y="130" text-anchor="middle" class="ubio-2-q-two-cells-t">Ψs = −0.70 MPa</text>
  <text x="330" y="156" text-anchor="middle" class="ubio-2-q-two-cells-t">Ψp = +0.10 MPa</text>
  <text x="230" y="26" text-anchor="middle" class="ubio-2-q-two-cells-s">세포벽</text>
  <line x1="230" y1="30" x2="230" y2="38" style="stroke:var(--fig-muted);stroke-width:1.2;fill:none"/>
  <text x="230" y="222" text-anchor="middle" class="ubio-2-q-two-cells-s">두 세포는 세포벽을 사이에 두고 맞닿아 있다</text>
</svg>
