<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-uchem-11-corrosion d-uchem-11-corrosion">
  <title id="t-uchem-11-corrosion">그림 일반화학 11-6 철의 부식과 희생 양극법</title>
  <desc id="d-uchem-11-corrosion">왼쪽: 철 표면의 물방울 속에 작은 갈바니 전지가 생긴다. 산소가 적은 물방울 가운데에서 철이 산화되어 녹아 나가고, 전자는 철 속을 지나 산소가 많은 가장자리로 가서 산소를 환원한다. Fe²⁺와 OH⁻가 만나는 곳에 녹이 고리 모양으로 쌓인다. 오른쪽: 마그네슘 덩어리를 도선으로 배관에 이으면 마그네슘이 대신 산화되고, 전자를 받은 배관은 환원 전극이 되어 녹슬지 않는다(모식도).</desc>
  <style>.uchem-11-corrosion-t{font-size:14px;fill:var(--fig-ink)} .uchem-11-corrosion-s{font-size:13px;fill:var(--fig-muted)} .uchem-11-corrosion-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}</style>
  <rect x="6.0" y="6.0" width="372.0" height="348.0" rx="8" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <text x="192.0" y="30.0" text-anchor="middle" class="uchem-11-corrosion-b">물방울 속의 작은 전지</text>
  <rect x="20.0" y="220.0" width="344.0" height="46.0" rx="0" style="fill:var(--fig-line);stroke:var(--fig-muted);stroke-width:1.4"/>
  <text x="30.0" y="290.0" class="uchem-11-corrosion-s">철(Fe) — 전자가 지나는 도선 역할</text>
  <path d="M44 220 C 70 110, 314 110, 340 220 Z" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round"/>
  <path d="M168 220 Q192 236 216 220" style="fill:var(--fig-paper);stroke:var(--fig-muted);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round"/>
  <path d="M86 196 Q96 186 110 182" style="fill:none;stroke:var(--fig-red);stroke-width:6;stroke-linejoin:round;stroke-linecap:round"/>
  <path d="M274 182 Q288 186 298 196" style="fill:none;stroke:var(--fig-red);stroke-width:6;stroke-linejoin:round;stroke-linecap:round"/>
  <text x="100.0" y="170.0" text-anchor="middle" class="uchem-11-corrosion-s" style="fill:var(--fig-red)">녹</text>
  <text x="284.0" y="170.0" text-anchor="middle" class="uchem-11-corrosion-s" style="fill:var(--fig-red)">녹</text>
  <text x="192.0" y="204.0" text-anchor="middle" class="uchem-11-corrosion-s" style="fill:var(--fig-ink)">Fe → Fe²⁺ + 2e⁻</text>
  <text x="192.0" y="160.0" text-anchor="middle" class="uchem-11-corrosion-s" style="fill:var(--fig-blue)">산화 (산소 적음)</text>
  <line x1="170.0" y1="184.0" x2="127.9" y2="189.3" style="stroke:var(--fig-teal);stroke-width:1.6;stroke-linecap:round"/>
  <polygon points="122.0,190.0 128.0,186.4 128.7,192.0" style="fill:var(--fig-teal);stroke:none;stroke-linejoin:round"/>
  <line x1="214.0" y1="184.0" x2="256.1" y2="189.3" style="stroke:var(--fig-teal);stroke-width:1.6;stroke-linecap:round"/>
  <polygon points="262.0,190.0 255.3,192.0 256.0,186.4" style="fill:var(--fig-teal);stroke:none;stroke-linejoin:round"/>
  <text x="146.0" y="178.0" text-anchor="middle" class="uchem-11-corrosion-s" style="fill:var(--fig-teal);font-size:12px">Fe²⁺</text>
  <text x="238.0" y="178.0" text-anchor="middle" class="uchem-11-corrosion-s" style="fill:var(--fig-teal);font-size:12px">Fe²⁺</text>
  <line x1="40.0" y1="150.0" x2="60.7" y2="181.0" style="stroke:var(--fig-green);stroke-width:1.8;stroke-linecap:round"/>
  <polygon points="64.0,186.0 58.1,182.3 62.8,179.1" style="fill:var(--fig-green);stroke:none;stroke-linejoin:round"/>
  <line x1="344.0" y1="150.0" x2="323.3" y2="181.0" style="stroke:var(--fig-green);stroke-width:1.8;stroke-linecap:round"/>
  <polygon points="320.0,186.0 321.2,179.1 325.9,182.3" style="fill:var(--fig-green);stroke:none;stroke-linejoin:round"/>
  <text x="36.0" y="142.0" text-anchor="middle" class="uchem-11-corrosion-t" style="fill:var(--fig-green);font-weight:600">O₂</text>
  <text x="348.0" y="142.0" text-anchor="middle" class="uchem-11-corrosion-t" style="fill:var(--fig-green);font-weight:600">O₂</text>
  <line x1="172.0" y1="244.0" x2="76.8" y2="244.0" style="stroke:var(--fig-violet);stroke-width:2;stroke-linecap:round"/>
  <polygon points="70.0,244.0 77.3,240.7 77.3,247.3" style="fill:var(--fig-violet);stroke:none;stroke-linejoin:round"/>
  <line x1="212.0" y1="244.0" x2="307.2" y2="244.0" style="stroke:var(--fig-violet);stroke-width:2;stroke-linecap:round"/>
  <polygon points="314.0,244.0 306.7,247.3 306.7,240.7" style="fill:var(--fig-violet);stroke:none;stroke-linejoin:round"/>
  <text x="122.0" y="260.0" text-anchor="middle" class="uchem-11-corrosion-s" style="fill:var(--fig-violet);font-size:12px">e⁻</text>
  <text x="262.0" y="260.0" text-anchor="middle" class="uchem-11-corrosion-s" style="fill:var(--fig-violet);font-size:12px">e⁻</text>
  <text x="192.0" y="314.0" text-anchor="middle" class="uchem-11-corrosion-t" style="fill:var(--fig-red)">가장자리(산소 많음): 환원</text>
  <text x="192.0" y="334.0" text-anchor="middle" class="uchem-11-corrosion-s">O₂ + 2H₂O + 4e⁻ → 4OH⁻</text>
  <rect x="384.0" y="6.0" width="330.0" height="348.0" rx="8" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <text x="549.0" y="30.0" text-anchor="middle" class="uchem-11-corrosion-b">희생 양극법</text>
  <rect x="396.0" y="110.0" width="306.0" height="200.0" rx="0" style="fill:var(--fig-soft-amber);stroke:none"/>
  <line x1="396.0" y1="110.0" x2="702.0" y2="110.0" style="stroke:var(--fig-amber);stroke-width:2;stroke-linecap:round"/>
  <text x="408.0" y="134.0" class="uchem-11-corrosion-s" style="fill:var(--fig-amber)">젖은 흙(전해질)</text>
  <rect x="408.0" y="220.0" width="170.0" height="44.0" rx="6" style="fill:var(--fig-line);stroke:var(--fig-muted);stroke-width:1.6"/>
  <text x="493.0" y="247.0" text-anchor="middle" class="uchem-11-corrosion-t" style="font-weight:600">강철 배관</text>
  <rect x="628.0" y="200.0" width="50.0" height="64.0" rx="4" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.6"/>
  <text x="653.0" y="237.0" text-anchor="middle" class="uchem-11-corrosion-b" style="fill:var(--fig-violet)">Mg</text>
  <line x1="653.0" y1="200.0" x2="653.0" y2="80.0" style="stroke:var(--fig-ink);stroke-width:2;stroke-linecap:round"/>
  <line x1="653.0" y1="80.0" x2="493.0" y2="80.0" style="stroke:var(--fig-ink);stroke-width:2;stroke-linecap:round"/>
  <line x1="493.0" y1="80.0" x2="493.0" y2="220.0" style="stroke:var(--fig-ink);stroke-width:2;stroke-linecap:round"/>
  <line x1="624.0" y1="66.0" x2="530.8" y2="66.0" style="stroke:var(--fig-violet);stroke-width:2;stroke-linecap:round"/>
  <polygon points="524.0,66.0 531.3,62.7 531.3,69.3" style="fill:var(--fig-violet);stroke:none;stroke-linejoin:round"/>
  <text x="574.0" y="58.0" text-anchor="middle" class="uchem-11-corrosion-t" style="fill:var(--fig-violet);font-weight:600">e⁻</text>
  <text x="653.0" y="286.0" text-anchor="middle" class="uchem-11-corrosion-s" style="fill:var(--fig-violet)">Mg → Mg²⁺ + 2e⁻</text>
  <text x="653.0" y="302.0" text-anchor="middle" class="uchem-11-corrosion-s" style="fill:var(--fig-violet)">대신 산화(희생)</text>
  <text x="493.0" y="286.0" text-anchor="middle" class="uchem-11-corrosion-s">전자를 받아 환원 전극</text>
  <text x="493.0" y="302.0" text-anchor="middle" class="uchem-11-corrosion-s">→ 철이 산화되지 않음</text>
  <text x="549.0" y="334.0" text-anchor="middle" class="uchem-11-corrosion-s">E°(Mg²⁺/Mg) −2.37 V &lt; E°(Fe²⁺/Fe) −0.44 V</text>
</svg>
