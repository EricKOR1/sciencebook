<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-3-4-q-bat-momentum d-3-4-q-bat-momentum">
  <title id="t-3-4-q-bat-momentum">그림 3-4-8 문제 14 해설: 충격량의 쓰임</title>
  <desc id="d-3-4-q-bat-momentum">처음 운동량 −6에 충격량 +9를 더하면 나중 운동량 +3, 충격량 +12를 더하면 +6이 된다. 충격량 중 6은 날아오던 공을 멈추는 데 쓰이고, 나머지(3 또는 6)가 공을 되돌려 보낸다. 화살표 길이는 크기에 비례한다.</desc>
