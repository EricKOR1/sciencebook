    .f3-4-q-bat-momentum-lbl{font-size:15px;fill:var(--fig-ink)} .f3-4-q-bat-momentum-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .f3-4-q-bat-momentum-sm{font-size:13px;fill:var(--fig-muted)} .f3-4-q-bat-momentum-ink{font-size:13px;fill:var(--fig-ink)}
    .f3-4-q-bat-momentum-ax{stroke:var(--fig-ink);stroke-width:1.5;fill:none} .f3-4-q-bat-momentum-grid{stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 4;fill:none}
  </style>
