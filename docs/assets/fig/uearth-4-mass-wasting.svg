<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-uearth-4-mass-wasting d-uearth-4-mass-wasting">
<title id="t-uearth-4-mass-wasting">그림 일반지구과학 4-2 사면 이동의 주요 유형</title>
<desc id="d-uearth-4-mass-wasting">낙석은 절벽에서 암석이 떨어져 아래에 애추를 쌓고, 암석 미끄러짐은 사면 쪽으로 기운 층리면을 따라 덩어리가 평면으로 미끄러진다. 슬럼프는 오목한 곡면을 따라 덩어리가 뒤로 기울며 회전하고, 토석류는 물에 포화된 흙·자갈이 계곡을 따라 흘러 출구에 부채꼴로 쌓인다. 포행은 토양이 해마다 아주 조금씩 내려가 전봇대와 나무를 기울게 하며, 지표에 가까울수록 많이 움직인다. 모식도이다.</desc>
