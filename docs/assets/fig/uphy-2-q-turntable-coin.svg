<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-uphy-2-q-turntable-coin d-uphy-2-q-turntable-coin">
  <title id="t-uphy-2-q-turntable-coin">그림 일반물리학 2-14 문제 9 해설: 회전판 위 동전 — 두 기준틀의 설명</title>
  <desc id="d-uphy-2-q-turntable-coin">회전축에서 2.00 m 떨어진 동전이 미끄러지기 직전의 힘을 옆에서 본 모식도이다. (가) 땅에서 보면 중력과 수직 항력이 상쇄되고, 중심을 향한 정지 마찰력 μs mg가 구심 가속도 rω²를 만든다. (나) 회전판에서 보면 동전은 정지해 있고, 바깥쪽 원심력 mrω²와 안쪽 정지 마찰력이 평형을 이룬다. 힘 화살표의 길이는 크기에 비례한다(μs = 0.500).</desc>
