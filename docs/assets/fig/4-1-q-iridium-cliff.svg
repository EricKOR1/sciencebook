  <desc id="d-4-1-q-iridium-cliff">중생대와 신생대 경계의 이리듐 층과, 그 아래 5 m 지점에서 마지막으로 발견된 암모나이트 화석. 그 위로 이리듐 층까지는 암모나이트 화석이 발견되지 않았다. 모식도.</desc>
