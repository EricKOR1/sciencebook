  <text x="500.0" y="60.0" text-anchor="start" class="pchem-3-legendre-tangent-b">르장드르 변환</text>
  <text x="500.0" y="92.0" text-anchor="start" class="pchem-3-legendre-tangent-t">곡선 f(x)의 각 점 대신</text>
  <text x="500.0" y="113.0" text-anchor="start" class="pchem-3-legendre-tangent-t">접선의 (기울기 s, 절편 g)로 쓴다.</text>
  <text x="500.0" y="155.0" text-anchor="start" class="pchem-3-legendre-tangent-b">g(s) = f − s x</text>
  <text x="500.0" y="176.0" text-anchor="start" class="pchem-3-legendre-tangent-t">dg = −x ds  →  dg/ds = −x</text>
  <text x="500.0" y="218.0" text-anchor="start" class="pchem-3-legendre-tangent-s">옅은 선: 기울기가 다른 접선들.</text>
  <text x="500.0" y="239.0" text-anchor="start" class="pchem-3-legendre-tangent-s">이 접선들의 포락선이 곧 원래</text>
  <text x="500.0" y="260.0" text-anchor="start" class="pchem-3-legendre-tangent-s">곡선이므로 g(s)만 알아도</text>
  <text x="500.0" y="281.0" text-anchor="start" class="pchem-3-legendre-tangent-s">f(x)를 다시 그릴 수 있다.</text>
  <text x="500.0" y="323.0" text-anchor="start" class="pchem-3-legendre-tangent-s">열역학: U(S, V)에서 기울기</text>
  <text x="500.0" y="344.0" text-anchor="start" class="pchem-3-legendre-tangent-s">T = (∂U/∂S)<tspan baseline-shift="sub" font-size="10">V</tspan>를 새 변수로</text>
  <text x="500.0" y="365.0" text-anchor="start" class="pchem-3-legendre-tangent-s">→ A = U − TS</text>
