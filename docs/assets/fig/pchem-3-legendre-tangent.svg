  <title id="t-pchem-3-legendre-tangent">그림 물리화학 3-1 르장드르 변환의 기하학적 뜻</title>
  <desc id="d-pchem-3-legendre-tangent">아래로 볼록한 곡선 f(x) = x² + 1 위의 점 x₀ = 1.5에서 그은 접선(기울기 s = 3)은 세로축을 g = f − s x = 3.25 − 4.5 = −1.25에서 자른다. 기울기가 다른 접선들(옅은 선)을 모으면 그 포락선이 원래 곡선이 되므로, 절편 g를 기울기 s의 함수로 주어도 정보가 사라지지 않는다.</desc>
