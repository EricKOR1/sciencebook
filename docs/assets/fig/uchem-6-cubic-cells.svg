  <text x="593" y="34" text-anchor="middle" class="uchem-6-cc-h">면심 입방</text>
  <text x="593" y="262" text-anchor="middle" class="uchem-6-cc-t">원자 수 8 × 1/8 + 6 × 1/2 = 4</text>
  <text x="593" y="284" text-anchor="middle" class="uchem-6-cc-t">배위수 12 · 쌓임 효율 74 %</text>
  <text x="593" y="306" text-anchor="middle" class="uchem-6-cc-t" style="fill:var(--fig-red)">√2 a = 4r</text>
