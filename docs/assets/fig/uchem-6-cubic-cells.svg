  <text x="121" y="34" text-anchor="middle" class="uchem-6-cc-h">단순 입방</text>
  <text x="121" y="262" text-anchor="middle" class="uchem-6-cc-t">원자 수 8 × 1/8 = 1</text>
  <text x="121" y="284" text-anchor="middle" class="uchem-6-cc-t">배위수 6 · 쌓임 효율 52 %</text>
  <text x="121" y="306" text-anchor="middle" class="uchem-6-cc-t" style="fill:var(--fig-red)">a = 2r</text>
