  <text x="357" y="262" text-anchor="middle" class="uchem-6-cc-t">원자 수 8 × 1/8 + 1 = 2</text>
  <text x="357" y="284" text-anchor="middle" class="uchem-6-cc-t">배위수 8 · 쌓임 효율 68 %</text>
  <text x="357" y="306" text-anchor="middle" class="uchem-6-cc-t" style="fill:var(--fig-red)">√3 a = 4r</text>
