<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uchem-6-cubic-cells d-uchem-6-cubic-cells">
  <title id="t-uchem-6-cubic-cells">그림 일반화학 6-1 세 가지 입방 단위 세포</title>
  <desc id="d-uchem-6-cubic-cells">단순 입방은 꼭짓점에만, 체심 입방은 꼭짓점과 중심에, 면심 입방은 꼭짓점과 여섯 면의 중심에 원자가 있다. 꼭짓점 원자는 8개 세포가, 면의 원자는 2개 세포가 나누어 가지므로 세포당 원자 수는 1, 2, 4개이다. 빨간 선은 원자가 서로 닿는 방향이다. 원자 크기는 위치가 보이도록 줄여 그린 모식도이다.</desc>
  <style>
    .uchem-6-cc-e{stroke:var(--fig-ink);stroke-width:1.4;fill:none}
    .uchem-6-cc-eh{stroke:var(--fig-line);stroke-width:1.2;fill:none;stroke-dasharray:4 3}
    .uchem-6-cc-c{fill:var(--fig-blue);stroke:var(--fig-ink);stroke-width:1}
    .uchem-6-cc-f{fill:var(--fig-green);stroke:var(--fig-ink);stroke-width:1}
    .uchem-6-cc-b{fill:var(--fig-amber);stroke:var(--fig-ink);stroke-width:1}
    .uchem-6-cc-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-6-cc-h{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .uchem-6-cc-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-6-cc-k{stroke:var(--fig-red);stroke-width:2.4;fill:none}
  </style>
