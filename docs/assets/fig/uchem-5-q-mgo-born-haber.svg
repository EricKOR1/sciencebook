  <text x="530.0" y="79.8" text-anchor="middle" class="uchem-5-q-mgo-born-haber-t"><tspan dy="0">Mg</tspan><tspan dy="-6" style="font-size:0.72em">2+</tspan><tspan dy="6">(g) + O</tspan><tspan dy="-6" style="font-size:0.72em">2−</tspan><tspan dy="6">(g)</tspan></text>
  <line x1="450.0" y1="208.8" x2="450.0" y2="99.8" class="uchem-5-q-mgo-born-haber-rd"/>
