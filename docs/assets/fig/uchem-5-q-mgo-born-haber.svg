    .uchem-5-q-mgo-born-haber-gr{stroke:var(--fig-line);stroke-width:0.7;fill:none;stroke-dasharray:3 3}
    .uchem-5-q-mgo-born-haber-ln{stroke:var(--fig-ink);stroke-width:2;fill:none}
    .uchem-5-q-mgo-born-haber-lv{stroke:var(--fig-ink);stroke-width:2.2;fill:none}
    .uchem-5-q-mgo-born-haber-bl{stroke:var(--fig-blue);stroke-width:2.4;fill:none}
    .uchem-5-q-mgo-born-haber-rd{stroke:var(--fig-red);stroke-width:2.4;fill:none}
    .uchem-5-q-mgo-born-haber-gn{stroke:var(--fig-green);stroke-width:2.4;fill:none}
    .uchem-5-q-mgo-born-haber-am{stroke:var(--fig-amber);stroke-width:2.4;fill:none}
    .uchem-5-q-mgo-born-haber-dash{stroke:var(--fig-muted);stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    .uchem-5-q-mgo-born-haber-fink{fill:var(--fig-ink)} .uchem-5-q-mgo-born-haber-fbl{fill:var(--fig-blue)} .uchem-5-q-mgo-born-haber-frd{fill:var(--fig-red)}
    .uchem-5-q-mgo-born-haber-fgn{fill:var(--fig-green)} .uchem-5-q-mgo-born-haber-fam{fill:var(--fig-amber)} .uchem-5-q-mgo-born-haber-fmu{fill:var(--fig-muted)}
    .uchem-5-q-mgo-born-haber-box{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.4}
    .uchem-5-q-mgo-born-haber-sb{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6}
