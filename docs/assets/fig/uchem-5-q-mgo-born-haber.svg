    .uchem-5-q-mgo-born-haber-sg{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.6}
    .uchem-5-q-mgo-born-haber-sa{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.6}
    .uchem-5-q-mgo-born-haber-sv{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.6}
    .uchem-5-q-mgo-born-haber-st{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.6}
