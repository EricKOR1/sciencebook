<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 740" role="img" aria-labelledby="t-uchem-5-q-mgo-born-haber d-uchem-5-q-mgo-born-haber">
  <title id="t-uchem-5-q-mgo-born-haber">그림 일반화학 5-13 문제 12 해설 — 산화 마그네슘의 본–하버 순환</title>
  <desc id="d-uchem-5-q-mgo-born-haber">높이는 엔탈피(kJ/mol)에 비례한다. 원소 상태에서 기체 이온 Mg²⁺(g) + O²⁻(g)까지 올라가는 데 모두 +3189 kJ/mol이 들지만, 기체 이온이 결정 MgO(s)가 될 때 격자 에너지 3791 kJ/mol을 내놓아 생성 엔탈피가 −602 kJ/mol이 된다.</desc>
