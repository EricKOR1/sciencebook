  <text x="488.0" y="213.8" text-anchor="start" class="uchem-5-q-mgo-born-haber-t"><tspan dy="0">Mg</tspan><tspan dy="-6" style="font-size:0.72em">2+</tspan><tspan dy="6">(g) + e</tspan><tspan dy="-6" style="font-size:0.72em">−</tspan><tspan dy="6"> + O</tspan><tspan dy="-6" style="font-size:0.72em">−</tspan><tspan dy="6">(g)</tspan></text>
  <line x1="330.0" y1="186.2" x2="330.0" y2="200.8" class="uchem-5-q-mgo-born-haber-bl"/>
