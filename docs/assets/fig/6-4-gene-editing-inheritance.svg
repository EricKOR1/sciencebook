  <rect x="368" y="14" width="336" height="330" rx="8" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="536.0" y="40.0" text-anchor="middle" class="f64ge-h">② 생식세포·배아 편집</text>
  <circle cx="184" cy="73.0" r="16.8" style="fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:2"/>
