<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="t-6-4-gene-editing-inheritance d-6-4-gene-editing-inheritance">
  <title id="t-6-4-gene-editing-inheritance">그림 6-4-4 체세포 편집과 배아 편집 — 유전되는가</title>
  <desc id="d-6-4-gene-editing-inheritance">체세포 편집은 환자 몸의 일부 세포만 바꾸므로 자녀에게 전해지지 않는다. 생식세포·배아를 편집하면 몸의 모든 세포와 정자·난자까지 바뀌어 자녀와 그 자손에게 대대로 유전된다. 모식도이다.</desc>
  <defs>
    <marker id="f64ge-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--fig-ink)"/></marker>
  </defs>
