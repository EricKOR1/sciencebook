    .f64ge-ln{fill:none;stroke:var(--fig-line);stroke-width:1.5}
    .f64ge-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
    .f64ge-ar{fill:none;stroke:var(--fig-ink);stroke-width:1.6}
    .f64ge-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2}
  </style>
