  <desc id="d-uphy-2-fbd-connected">왼쪽: 애트우드 기계(예제 2)에서 3.00 kg 추는 장력 36.8 N과 중력 29.4 N을 받아 위로, 5.00 kg 추는 장력 36.8 N과 중력 49.0 N을 받아 아래로 2.45 m/s²로 가속한다. 오른쪽: 책상 위 토막과 매달린 추(예제 4)에서 토막은 수직 항력, 중력, 장력, 운동 마찰력을, 추는 장력과 중력을 받는다. 화살표 길이는 힘의 크기에 비례한다.</desc>
