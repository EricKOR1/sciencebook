  <text x="612" y="270" text-anchor="middle" class="m3-07-gas-evacuation-sm" style="fill:var(--fig-red)">지하</text>
  <rect x="482" y="80" width="60" height="150" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.5"/>
  <rect x="492" y="92" width="16" height="14" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1"/>
  <rect x="516" y="92" width="16" height="14" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1"/>
  <rect x="492" y="120" width="16" height="14" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1"/>
  <rect x="516" y="120" width="16" height="14" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1"/>
  <rect x="492" y="148" width="16" height="14" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1"/>
  <rect x="516" y="148" width="16" height="14" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1"/>
  <rect x="492" y="176" width="16" height="14" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1"/>
  <rect x="516" y="176" width="16" height="14" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1"/>
  <rect x="492" y="204" width="16" height="14" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1"/>
  <rect x="516" y="204" width="16" height="14" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1"/>
  <text x="556" y="102" class="m3-07-gas-evacuation-sm">실내에서는</text>
  <text x="556" y="120" class="m3-07-gas-evacuation-sm">창문을 닫고</text>
  <text x="556" y="138" class="m3-07-gas-evacuation-sm">틈을 막는다</text>
  <text x="556" y="172" class="m3-07-gas-evacuation-sm" style="fill:var(--fig-red)">무거운 기체는</text>
  <text x="556" y="190" class="m3-07-gas-evacuation-sm" style="fill:var(--fig-red)">낮은 곳·지하에</text>
  <text x="556" y="208" class="m3-07-gas-evacuation-sm" style="fill:var(--fig-red)">고인다</text>
  <text x="360" y="338" text-anchor="middle" class="m3-07-gas-evacuation-sm" style="fill:var(--fig-ink)">기체는 확산하며 바람을 타고 퍼진다. 공기보다 무거운 기체(예: 염소)는 낮은 곳과 지하에 고인다.</text>
  <text x="360" y="358" text-anchor="middle" class="m3-07-gas-evacuation-sm">모식도: 실제로는 유출된 물질의 종류와 안내 방송에 따라 대피한다.</text>
</svg>
