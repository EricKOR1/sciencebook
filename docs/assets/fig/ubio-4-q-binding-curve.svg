<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-ubio-4-q-binding-curve d-ubio-4-q-binding-curve">
  <title id="t-ubio-4-q-binding-curve">그림 일반생명과학 4-12 문제 13 해설: Kd = 2 nM인 수용체의 점유율 곡선</title>
  <desc id="d-ubio-4-q-binding-curve">가로축은 호르몬 농도(로그 눈금), 세로축은 점유율이다. (가) 1 nM → 4 nM에서는 점유율이 약 33%에서 67%로 크게 오르지만, (나) 20 nM → 80 nM에서는 이미 포화에 가까워 약 91%에서 98%로 조금만 오른다. 곡선이 가장 가파른 곳은 농도가 Kd 부근일 때이다.</desc>
