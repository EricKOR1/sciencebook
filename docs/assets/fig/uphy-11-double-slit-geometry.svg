<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 345" role="img" aria-labelledby="t-uphy-11-double-slit-geometry d-uphy-11-double-slit-geometry">
  <title id="t-uphy-11-double-slit-geometry">그림 일반물리학 11-4 이중 슬릿 간섭의 기하 — 경로차 d sinθ와 무늬 위치 y</title>
  <desc id="d-uphy-11-double-slit-geometry">간격 d인 두 슬릿 S₁, S₂에서 거리 L만큼 떨어진 스크린의 점 P로 가는 두 빛을 그렸다. L이 d보다 훨씬 크면 두 빛은 거의 나란하므로, 아래 확대 그림처럼 S₁에서 S₂의 빛에 수선을 내리면 경로차가 d sinθ이다. 경로차가 파장의 정수배이면 밝은 무늬가 생기고, 위치는 작은 각에서 y ≈ Lθ이다. 오른쪽은 스크린 위의 세기 분포 4I₀cos²(πd sinθ/λ)이다. d와 θ를 실제보다 크게 그린 모식도이다.</desc>
