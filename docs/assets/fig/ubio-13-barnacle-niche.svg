<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 362" role="img" aria-labelledby="t-ubio-13-barnacle-niche d-ubio-13-barnacle-niche">
  <title id="t-ubio-13-barnacle-niche">그림 일반생명과학 13-6 바위 해안 따개비의 기본 지위와 실현 지위</title>
  <desc id="d-ubio-13-barnacle-niche">왼쪽: 바위 해안의 조간대. 위쪽 따개비 종은 높은 곳에, 아래쪽 종은 낮은 곳에 산다. 오른쪽: 위쪽 종은 아래쪽 종을 제거하면 낮은 곳까지 살 수 있으므로 기본 지위가 실현 지위보다 넓다. 아래쪽 종은 높은 곳의 건조를 견디지 못해 기본 지위와 실현 지위가 거의 같다. 모식도이다.</desc>
