    .esys-3-q-parcel-sounding-t{font-size:14px;fill:var(--fig-ink)} .esys-3-q-parcel-sounding-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .esys-3-q-parcel-sounding-s{font-size:13px;fill:var(--fig-muted)} .esys-3-q-parcel-sounding-ax{fill:none;stroke:var(--fig-muted);stroke-width:1.4} .esys-3-q-parcel-sounding-gr{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4}
  </style>
