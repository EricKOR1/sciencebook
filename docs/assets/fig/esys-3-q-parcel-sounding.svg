<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-esys-3-q-parcel-sounding d-esys-3-q-parcel-sounding">
  <title id="t-esys-3-q-parcel-sounding">그림 지구시스템과학 3-12 문제 13 해설의 상태 곡선과 공기 덩어리의 기온</title>
  <desc id="d-esys-3-q-parcel-sounding">주변 기온(빨간 실선, 7 °C/km)과 지표 공기를 들어 올릴 때의 기온(파란 선: 1 km까지 건조 단열 10 °C/km, 그 위 습윤 단열 5 °C/km)을 함께 나타냈다. 상승 응결 고도는 1 km이고, 두 선은 약 2.5 km(12.5 °C)에서 만나 그 위에서는 공기 덩어리가 주변보다 따뜻하다(색칠한 부분). 이슬점(점선)은 2 °C/km로 내려간다.</desc>
