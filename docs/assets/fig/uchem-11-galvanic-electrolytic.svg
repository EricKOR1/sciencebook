<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-uchem-11-galvanic-electrolytic d-uchem-11-galvanic-electrolytic">
  <title id="t-uchem-11-galvanic-electrolytic">그림 일반화학 11-2 갈바니 전지와 전해 전지</title>
  <desc id="d-uchem-11-galvanic-electrolytic">왼쪽 다니엘 전지(갈바니 전지)는 자발적 반응(ΔG < 0)으로 전구를 켠다. 아연이 산화되는 산화 전극이 (−)극, 구리 이온이 환원되는 환원 전극이 (+)극이다. 오른쪽 염화 구리(II) 수용액의 전기 분해(전해 전지)는 전원으로 비자발적 반응(ΔG > 0)을 일으킨다. 전원의 (+)극에 연결된 산화 전극에서 염소가, (−)극에 연결된 환원 전극에서 구리가 생긴다. 두 장치 모두 전자는 도선을 따라 산화 전극에서 환원 전극으로 흐른다.</desc>
