  <text x="190" y="45" text-anchor="middle" class="matter-2-tonicity-t">바깥이 더 진하다</text>
  <text x="405" y="26" text-anchor="middle" class="matter-2-tonicity-h">등장액</text>
  <text x="405" y="45" text-anchor="middle" class="matter-2-tonicity-t">안팎 농도가 같다</text>
