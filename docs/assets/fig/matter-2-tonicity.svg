    .matter-2-tonicity-rbc{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2}
    .matter-2-tonicity-wall{fill:var(--fig-panel);stroke:var(--fig-green);stroke-width:5}
    .matter-2-tonicity-cyt{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.6}
    .matter-2-tonicity-vac{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.2}
  </style>
