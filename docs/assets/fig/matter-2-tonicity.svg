<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-matter-2-tonicity d-matter-2-tonicity">
  <title id="t-matter-2-tonicity">그림 물질과 에너지 2-8 바깥 용액의 농도에 따른 적혈구와 식물 세포의 변화</title>
  <desc id="d-matter-2-tonicity">고장액에서는 물이 세포 밖으로 빠져나가 적혈구가 쭈그러들고 식물 세포는 세포막이 세포벽에서 떨어진다(원형질 분리). 등장액에서는 알짜 이동이 없다. 저장액에서는 물이 세포 안으로 들어가 적혈구가 부풀다가 터질 수 있고, 식물 세포는 세포벽 덕분에 터지지 않고 팽팽해진다. 모식도이다.</desc>
  <style>
    .matter-2-tonicity-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
    .matter-2-tonicity-gr{fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4}
    .matter-2-tonicity-l{font-size:14px;fill:var(--fig-ink)}
    .matter-2-tonicity-t{font-size:13px;fill:var(--fig-muted)}
    .matter-2-tonicity-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
