<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-ochem-14-glucose-chairs d-ochem-14-glucose-chairs">
  <title id="t-ochem-14-glucose-chairs">그림 유기화학 14-3 β-D-글루코피라노스와 α-D-글루코피라노스의 의자 형태(⁴C₁)</title>
  <desc id="d-ochem-14-glucose-chairs">고리 O5는 오른쪽 뒤, C1은 오른쪽 끝(아래로 처진 발판), C4는 왼쪽 끝(위로 솟은 머리받이), C2·C3은 앞, C5는 뒤에 있다. 축 결합은 회색 세로선, 적도 결합은 초록. (가) β-아노머: C1·C3·C5의 OH·CH₂OH는 적도(위로 비스듬히), C2·C4의 OH는 적도(아래로 비스듬히)이고 축 자리는 모두 H이다. (나) α-아노머: C1의 OH만 축(아래로 곧게)이고 나머지는 β와 같다.</desc>
