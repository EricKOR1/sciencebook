<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-uearth-2-transform d-uearth-2-transform">
  <title id="t-uearth-2-transform">그림 일반지구과학 2-8 변환 단층과 단열대(위에서 본 모습)</title>
  <desc id="d-uearth-2-transform">어긋난 두 해령 끝 사이(변환 단층)에서는 양쪽 판이 반대 방향으로 움직여 지진이 일어난다. 그 바깥(단열대)에서는 양쪽이 같은 판이라 같은 방향으로 움직이므로 지진이 거의 없고, 나이가 다른 해양 지각이 맞닿아 생긴 높이 차만 흉터처럼 남는다. 별은 지진이 일어나는 곳이다.</desc>
