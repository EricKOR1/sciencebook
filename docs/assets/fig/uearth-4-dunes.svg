<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-uearth-4-dunes d-uearth-4-dunes">
<title id="t-uearth-4-dunes">그림 일반지구과학 4-9 사구의 단면과 모양</title>
<desc id="d-uearth-4-dunes">(가) 사구의 단면: 바람이 불어오는 풍상 측은 완만하고 모래가 깎여 넘어가며, 풍하 측 활락면은 모래의 안식각(약 30~34°)으로 가팔라 그 경사면에 쌓인 층이 사층리로 남는다. 사구 전체는 바람 방향으로 이동한다. (나) 위에서 본 사구의 종류: 바르한은 뿔이 바람이 불어 가는 쪽을 향하는 초승달, 횡사구는 바람에 수직한 능선, 종사구는 바람과 나란한 능선, 성사구는 여러 방향 바람이 만든 별 모양이다.</desc>
