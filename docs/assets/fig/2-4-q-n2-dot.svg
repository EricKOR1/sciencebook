<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 246" class="fig-small" role="img" aria-labelledby="t-2-4-q-n2-dot d-2-4-q-n2-dot">
  <title id="t-2-4-q-n2-dot">그림 2-4-7 문제 7 질소 분자의 전자 점식</title>
  <desc id="d-2-4-q-n2-dot">두 질소 원자 사이에 공유 전자쌍 3개가 있고, 질소 원자마다 비공유 전자쌍이 1개 있다. 점선 고리는 질소 원자 하나의 주위에 있는 것으로 세는 전자로, 공유 전자쌍 3개와 비공유 전자쌍 1개를 합쳐 8개이다.</desc>
  <style>
    .f2-4-q-n2-dot-t{font-size:14px;fill:var(--fig-ink)} .f2-4-q-n2-dot-sm{font-size:13px;fill:var(--fig-muted)}
    .f2-4-q-n2-dot-lbl{font-size:15px;font-weight:600;fill:var(--fig-ink)} .f2-4-q-n2-dot-sym{font-size:28px;font-weight:700;fill:var(--fig-ink)}
    .f2-4-q-n2-dot-e1{fill:var(--fig-blue)} .f2-4-q-n2-dot-e2{fill:var(--fig-red)}
    .f2-4-q-n2-dot-sh{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5}
    .f2-4-q-n2-dot-lp{fill:none;stroke:var(--fig-violet);stroke-width:1.5;stroke-dasharray:3 2}
    .f2-4-q-n2-dot-ld{stroke:var(--fig-muted);stroke-width:1.1;fill:none} .f2-4-q-n2-dot-sep{stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4}
    .f2-4-q-n2-dot-r1{fill:none;stroke:var(--fig-blue);stroke-width:1.4;stroke-dasharray:6 4} .f2-4-q-n2-dot-r2{fill:none;stroke:var(--fig-red);stroke-width:1.4;stroke-dasharray:6 4}
  </style>
  <text x="14.0" y="24.0" text-anchor="start" class="f2-4-q-n2-dot-sm">● 빨간 점: 왼쪽 N의 전자   ● 파란 점: 오른쪽 N의 전자</text>
  <ellipse cx="190" cy="122" rx="60" ry="42" class="f2-4-q-n2-dot-r2"/>
  <ellipse cx="270" cy="122" rx="60" ry="42" class="f2-4-q-n2-dot-r1"/>
  <rect x="218" y="99" width="24" height="46" rx="10" class="f2-4-q-n2-dot-sh"/>
  <circle cx="224.5" cy="110.0" r="3.6" class="f2-4-q-n2-dot-e2"/>
  <circle cx="235.5" cy="110.0" r="3.6" class="f2-4-q-n2-dot-e1"/>
  <circle cx="224.5" cy="122.0" r="3.6" class="f2-4-q-n2-dot-e2"/>
  <circle cx="235.5" cy="122.0" r="3.6" class="f2-4-q-n2-dot-e1"/>
  <circle cx="224.5" cy="134.0" r="3.6" class="f2-4-q-n2-dot-e2"/>
  <circle cx="235.5" cy="134.0" r="3.6" class="f2-4-q-n2-dot-e1"/>
  <ellipse cx="144" cy="122" rx="8" ry="14" class="f2-4-q-n2-dot-lp"/>
  <circle cx="144.0" cy="116.5" r="3.6" class="f2-4-q-n2-dot-e2"/>
  <circle cx="144.0" cy="127.5" r="3.6" class="f2-4-q-n2-dot-e2"/>
  <ellipse cx="316" cy="122" rx="8" ry="14" class="f2-4-q-n2-dot-lp"/>
  <circle cx="316.0" cy="116.5" r="3.6" class="f2-4-q-n2-dot-e1"/>
  <circle cx="316.0" cy="127.5" r="3.6" class="f2-4-q-n2-dot-e1"/>
  <text x="176" y="132" text-anchor="middle" class="f2-4-q-n2-dot-sym">N</text>
  <text x="284" y="132" text-anchor="middle" class="f2-4-q-n2-dot-sym">N</text>
  <path d="M230 98 L230 58" class="f2-4-q-n2-dot-ld"/>
  <text x="230.0" y="52.0" text-anchor="middle" class="f2-4-q-n2-dot-sm">공유 전자쌍 3개(삼중 결합)</text>
  <path d="M138 134 L106 178" class="f2-4-q-n2-dot-ld"/>
  <text x="100.0" y="194.0" text-anchor="middle" class="f2-4-q-n2-dot-sm">비공유 전자쌍 1개</text>
  <text x="230.0" y="228.0" text-anchor="middle" class="f2-4-q-n2-dot-t">점선 안(N 하나 주위): 공유 3쌍(6개) + 비공유 1쌍(2개) = 8개</text>
</svg>
