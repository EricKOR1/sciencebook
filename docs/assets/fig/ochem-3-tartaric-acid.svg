<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 500" role="img" aria-labelledby="t-ochem-3-tartaric-acid d-ochem-3-tartaric-acid">
  <title id="t-ochem-3-tartaric-acid">그림 유기화학 3-8 타타르산의 세 입체 이성질체</title>
  <desc id="d-ochem-3-tartaric-acid">각 이성질체를 C2–C3 결합을 세로로 둔 겹친 형태(위: 쐐기·점선 그림, 아래: C2를 앞에 둔 뉴먼 투영식)로 그렸다. (가) (2R,3R)과 (나) (2S,3S)는 거울상이다. (다) 메조 (2R,3S)형은 겹친 형태에서 위 탄소의 COOH·OH·H가 아래 탄소의 것과 정확히 포개져 C2–C3 결합 가운데에 수평 거울면(옅은 파란 면)이 있다. 오른쪽은 메조형의 엇갈린(안티) 형태로, C2–C3 결합의 가운데에 반전 중심 i가 있다.</desc>
