<text x="360" y="282" class="m103b-sm"></text>
<text x="40" y="290" class="m103b-ink">식으면 원래대로 곧게 돌아온다.</text>
<text x="40" y="312" class="m103b-sm">이 성질로 전기 주전자·다리미의 온도 조절 장치를 만든다.</text>
<text x="700" y="322" text-anchor="end" class="m103b-sm">휘는 정도는 과장한 모식도</text>
</svg>
