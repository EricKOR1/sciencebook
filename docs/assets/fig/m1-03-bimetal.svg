<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-m1-03-bimetal d-m1-03-bimetal">
<title id="t-m1-03-bimetal">그림 중1-3-3 가열한 바이메탈이 휘는 방향</title>
<desc id="d-m1-03-bimetal">알루미늄(열팽창이 큼)과 철(열팽창이 작음)을 붙인 바이메탈을 가열하면, 더 많이 늘어난 알루미늄이 바깥쪽이 되어 철 쪽으로 휜다. 휘는 정도는 과장한 모식도이다.</desc>
<style>
  .m103b-al{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8} .m103b-fe{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8}
  .m103b-clamp{fill:var(--fig-line);stroke:var(--fig-ink);stroke-width:1.5}
  .m103b-ttl{font-size:16px;font-weight:700;fill:var(--fig-ink)} .m103b-ink{font-size:14px;fill:var(--fig-ink)} .m103b-sm{font-size:13px;fill:var(--fig-muted)}
  .m103b-lb{font-size:14px;font-weight:700;fill:var(--fig-blue)} .m103b-lr{font-size:14px;font-weight:700;fill:var(--fig-red)}
  .m103b-ghost{fill:none;stroke:var(--fig-line);stroke-width:1.5;stroke-dasharray:5 4}
  .m103b-arr{fill:none;stroke:var(--fig-ink);stroke-width:2.2} .m103b-arrh{fill:var(--fig-ink)}
  .m103b-bend{fill:none;stroke:var(--fig-amber);stroke-width:2.4} .m103b-bendh{fill:var(--fig-amber)}
  .m103b-fl{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.8} .m103b-fl2{fill:var(--fig-amber)}
  .m103b-div{fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:5 5}
</style>
<text x="40" y="36" class="m103b-ttl">가열 전</text>
<rect x="28" y="90" width="22" height="60" class="m103b-clamp"/>
<rect x="50" y="108" width="240" height="12" class="m103b-al"/><rect x="50" y="120" width="240" height="12" class="m103b-fe"/>
<text x="60" y="98" class="m103b-lb">알루미늄</text><text x="132" y="98" class="m103b-sm">열팽창이 크다</text>
<text x="60" y="154" class="m103b-lr">철</text><text x="82" y="154" class="m103b-sm">열팽창이 작다</text>
<text x="40" y="200" class="m103b-ink">두 금속의 길이가 같아</text><text x="40" y="220" class="m103b-ink">곧게 펴져 있다.</text>
<line x1="330" y1="20" x2="330" y2="250" class="m103b-div"/>
