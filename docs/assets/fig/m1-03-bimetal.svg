<text x="420" y="100" class="m103b-lb">알루미늄</text><text x="490" y="100" class="m103b-sm">더 많이 늘어나 바깥쪽</text>
<text x="481.1" y="190.6" text-anchor="end" class="m103b-lr">철 — 안쪽</text>
