  <text x="477" y="160" text-anchor="middle" class="matter-1-partial-pressure-op">=</text>
  <circle cx="60" cy="290" r="7" class="matter-1-partial-pressure-n"/>
  <text x="74" y="295" class="matter-1-partial-pressure-t">질소 분자</text>
  <circle cx="160" cy="290" r="7" class="matter-1-partial-pressure-o"/>
  <text x="174" y="295" class="matter-1-partial-pressure-t">산소 분자</text>
  <text x="595" y="278" text-anchor="middle" class="matter-1-partial-pressure-t">X(N₂) = 8/12 = 2/3</text>
  <text x="595" y="297" text-anchor="middle" class="matter-1-partial-pressure-t">P(N₂) = 2/3 × 3.0 = 2.0 atm</text>
  <text x="360" y="322" text-anchor="middle" class="matter-1-partial-pressure-t">분자 사이에 힘이 없으므로 각 기체는 혼자 있을 때와 같은 압력을 낸다</text>
</svg>
