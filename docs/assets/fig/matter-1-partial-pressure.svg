<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-matter-1-partial-pressure d-matter-1-partial-pressure">
  <title id="t-matter-1-partial-pressure">그림 물질과 에너지 1-4 혼합 기체의 부분 압력</title>
  <desc id="d-matter-1-partial-pressure">같은 부피, 같은 온도의 용기에 질소 분자 8개만 넣으면 2.0 atm, 산소 분자 4개만 넣으면 1.0 atm일 때, 두 기체를 한 용기에 섞으면 전체 압력은 두 부분 압력의 합인 3.0 atm이다. 각 기체의 부분 압력은 분자 수의 비율(몰 분율)에 비례한다. 분자 수는 줄여 나타낸 모식도이다.</desc>
  <style>
    .matter-1-partial-pressure-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
    .matter-1-partial-pressure-gr{fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4}
    .matter-1-partial-pressure-l{font-size:14px;fill:var(--fig-ink)}
    .matter-1-partial-pressure-t{font-size:13px;fill:var(--fig-muted)}
    .matter-1-partial-pressure-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .matter-1-partial-pressure-ink{fill:var(--fig-ink)}
    .matter-1-partial-pressure-box{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2}
    .matter-1-partial-pressure-n{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6}
    .matter-1-partial-pressure-o{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.6}
    .matter-1-partial-pressure-op{font-size:30px;font-weight:700;fill:var(--fig-muted)}
  </style>
  <text x="360" y="24" text-anchor="middle" class="matter-1-partial-pressure-t">같은 부피 V, 같은 온도 T</text>
  <rect x="40" y="74" width="170" height="150" rx="6" class="matter-1-partial-pressure-box"/>
  <text x="125" y="60" text-anchor="middle" class="matter-1-partial-pressure-h">질소만</text>
  <text x="125" y="250" text-anchor="middle" class="matter-1-partial-pressure-l" style="font-weight:700">P(N₂) = 2.0 atm</text>
