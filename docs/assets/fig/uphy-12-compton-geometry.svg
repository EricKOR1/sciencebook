<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-uphy-12-compton-geometry d-uphy-12-compton-geometry">
  <title id="t-uphy-12-compton-geometry">그림 일반물리학 12-6 콤프턴 산란 — 충돌 모습과 운동량 보존</title>
  <desc id="d-uphy-12-compton-geometry">(가) 파장 λ인 X선 광자가 정지한 전자와 충돌해 각 φ로 산란되며 파장이 λ′로 길어지고, 전자는 비스듬히 튀어 나간다. (나) 운동량 보존: 입사 광자의 운동량 p = h/λ는 산란 광자의 운동량 p′ = h/λ′과 전자의 운동량 p_e의 벡터 합이다. 이 삼각형에 코사인 법칙을 쓰면 p_e² = p² + p′² − 2pp′cosφ이다. 파장 변화를 실제보다 크게 그린 모식도이다.</desc>
