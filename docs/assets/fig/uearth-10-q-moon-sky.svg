<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" class="fig-small" role="img" aria-labelledby="t-uearth-10-q-moon-sky d-uearth-10-q-moon-sky">
  <title id="t-uearth-10-q-moon-sky">그림 일반지구과학 10-13 문제 14의 해 질 무렵 남쪽 하늘</title>
  <desc id="d-uearth-10-q-moon-sky">해 질 무렵(약 18시) 남쪽을 바라본 하늘. 왼쪽이 동쪽, 오른쪽이 서쪽이다. 태양은 서쪽 지평선에, 달은 남쪽 하늘 가장 높은 곳에 있다. 점선은 하늘에서 천체가 하루 동안 움직이는 길이며, 달의 모양은 나타내지 않았다. 모식도.</desc>
  <style>.uearth-10-q-moon-sky-lbl{font-size:14px;fill:var(--fig-ink)} .uearth-10-q-moon-sky-sm{font-size:13px;fill:var(--fig-muted)} .uearth-10-q-moon-sky-b{font-weight:600} .uearth-10-q-moon-sky-ax{stroke:var(--fig-ink);stroke-width:1.2;fill:none} .uearth-10-q-moon-sky-grid{stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3;fill:none} </style>
  <rect x="10" y="240" width="440" height="50" style="fill:var(--fig-soft-green);stroke:none"/>
  <line x1="10.0" y1="240.0" x2="450.0" y2="240.0" style="stroke:var(--fig-ink);stroke-width:1.6"/>
  <path d="M40 240 A190 150 0 0 1 420 240" style="fill:none;stroke:var(--fig-muted);stroke-width:1.4;stroke-dasharray:5 4"/>
  <path d="M385.6 154.0 L375.2 150.5 L383.4 143.2 Z" style="fill:var(--fig-muted)"/>
  <path d="M74.4 154.0 L72.2 164.7 L63.9 157.4 Z" style="fill:var(--fig-muted)"/>
  <line x1="230.0" y1="240.0" x2="230.0" y2="60.0" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:2 3"/>
  <circle cx="230" cy="90" r="17" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.6"/>
  <text x="230.0" y="95.0" text-anchor="middle" class="uearth-10-q-moon-sky-lbl uearth-10-q-moon-sky-b">?</text>
  <text x="256.0" y="84.0" class="uearth-10-q-moon-sky-lbl uearth-10-q-moon-sky-b">달</text>
  <text x="256.0" y="102.0" class="uearth-10-q-moon-sky-sm">(가장 높이 뜸)</text>
  <path d="M404 240 A16 16 0 0 1 436 240 Z" style="fill:#f4b400;stroke:var(--fig-amber);stroke-width:1.6"/>
  <text x="420.0" y="216.0" text-anchor="middle" class="uearth-10-q-moon-sky-lbl uearth-10-q-moon-sky-b">태양</text>
  <text x="412.0" y="198.0" text-anchor="middle" class="uearth-10-q-moon-sky-sm">(지는 중)</text>
  <text x="40.0" y="262.0" text-anchor="middle" class="uearth-10-q-moon-sky-lbl uearth-10-q-moon-sky-b">동</text>
  <text x="230.0" y="262.0" text-anchor="middle" class="uearth-10-q-moon-sky-lbl uearth-10-q-moon-sky-b">남</text>
  <text x="420.0" y="262.0" text-anchor="middle" class="uearth-10-q-moon-sky-lbl uearth-10-q-moon-sky-b">서</text>
  <text x="20.0" y="26.0" class="uearth-10-q-moon-sky-lbl uearth-10-q-moon-sky-b">약 18시</text>
