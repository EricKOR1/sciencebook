<text x="125" y="280" text-anchor="middle" class="f3-1-q-carbon-flux-s">생물의 몸(유기물)</text>
<rect x="500" y="230" width="190" height="64" rx="8" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:2;"/>
<text x="595" y="258" text-anchor="middle" class="f3-1-q-carbon-flux-b">수권(바다)</text>
<text x="595" y="280" text-anchor="middle" class="f3-1-q-carbon-flux-s">녹아 있는 탄소</text>
<rect x="270" y="290" width="180" height="64" rx="8" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2;"/>
