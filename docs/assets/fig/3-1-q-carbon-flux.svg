<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-3-1-q-carbon-flux d-3-1-q-carbon-flux">
<title id="t-3-1-q-carbon-flux">그림 3-1-8 문제 12의 대기 탄소가 드나드는 양</title>
<desc id="d-3-1-q-carbon-flux">대기(기권)와 생물권, 수권(바다), 지권(화석 연료) 사이에서 1년 동안 오가는 탄소의 양을 상댓값으로 나타냈다(문제의 표와 같은 값). 화살표의 굵기는 양과 관계없다.</desc>
<style>.f3-1-q-carbon-flux-t{font-size:14px;fill:var(--fig-ink)} .f3-1-q-carbon-flux-s{font-size:13px;fill:var(--fig-muted)} .f3-1-q-carbon-flux-b{font-size:15px;font-weight:700;fill:var(--fig-ink)} .f3-1-q-carbon-flux-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.5} .f3-1-q-carbon-flux-grid{fill:none;stroke:var(--fig-line);stroke-width:1} .f3-1-q-carbon-flux-ink{fill:var(--fig-ink)}</style>
<rect x="250" y="30" width="220" height="64" rx="8" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2;"/>
<text x="360" y="58" text-anchor="middle" class="f3-1-q-carbon-flux-b">기권(대기)</text>
<text x="360" y="80" text-anchor="middle" class="f3-1-q-carbon-flux-s">이산화 탄소</text>
