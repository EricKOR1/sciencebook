<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 314" role="img" aria-labelledby="t-5-6-chp d-5-6-chp">
  <title id="t-5-6-chp">그림 5-6-4 일반 화력 발전과 열병합 발전의 에너지 이용 비교</title>
  <desc id="d-5-6-chp">연료 에너지 100을 넣을 때 전기만 만드는 화력 발전은 전기 35를 얻고 나머지 65를 바다와 대기로 버린다. 열병합 발전은 같은 전기 35에 더해 버리던 열 가운데 45를 지역 난방에 쓰므로 총 이용 효율이 80%가 되고 버리는 열은 20으로 줄어든다. 막대의 길이는 에너지의 양에 비례하며 값은 가정한 예이다.</desc>
  <style>
    .ch-lbl{font-size:15px;font-weight:700;fill:var(--fig-ink)} .ch-sm{font-size:13px;fill:var(--fig-muted)} .ch-ink{font-size:13px;fill:var(--fig-ink)}
    .ch-in{font-size:13px;font-weight:700;fill:var(--fig-ink)}
    .ch-el{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5}
    .ch-hot{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5}
    .ch-waste{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5}
    .ch-br{fill:none;stroke:var(--fig-ink);stroke-width:1.3}
  </style>
  <text x="20" y="26" class="ch-lbl">연료 에너지 100을 넣었을 때</text>
  <line x1="150.0" y1="40" x2="150.0" y2="236" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:2 4"/>
  <text x="150.0" y="252" text-anchor="middle" class="ch-sm">0</text>
  <line x1="285.0" y1="40" x2="285.0" y2="236" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:2 4"/>
  <text x="285.0" y="252" text-anchor="middle" class="ch-sm">25</text>
  <line x1="420.0" y1="40" x2="420.0" y2="236" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:2 4"/>
  <text x="420.0" y="252" text-anchor="middle" class="ch-sm">50</text>
  <line x1="555.0" y1="40" x2="555.0" y2="236" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:2 4"/>
  <text x="555.0" y="252" text-anchor="middle" class="ch-sm">75</text>
  <line x1="690.0" y1="40" x2="690.0" y2="236" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:2 4"/>
  <text x="690.0" y="252" text-anchor="middle" class="ch-sm">100</text>
  <text x="20" y="84" class="ch-lbl">전기만 만드는</text><text x="20" y="102" class="ch-lbl">화력 발전</text>
  <rect x="150.0" y="60" width="189.0" height="50" class="ch-el"/>
  <text x="244.5" y="90.0" text-anchor="middle" class="ch-in">전기 35</text>
  <rect x="339.0" y="60" width="351.0" height="50" class="ch-waste"/>
  <text x="514.5" y="90.0" text-anchor="middle" class="ch-in">바다·대기로 버리는 열 65</text>
  <text x="20" y="174" class="ch-lbl">열병합 발전</text>
  <rect x="150.0" y="150" width="189.0" height="50" class="ch-el"/>
  <text x="244.5" y="180.0" text-anchor="middle" class="ch-in">전기 35</text>
  <rect x="339.0" y="150" width="243.0" height="50" class="ch-hot"/>
  <text x="460.5" y="180.0" text-anchor="middle" class="ch-in">지역 난방열 45</text>
  <rect x="582.0" y="150" width="108.0" height="50" class="ch-waste"/>
  <text x="636.0" y="180.0" text-anchor="middle" class="ch-in">버림 20</text>
  <path d="M150,212 L150,220 L582.0,220 L582.0,212" class="ch-br"/>
  <text x="366.0" y="238" text-anchor="middle" class="ch-ink" style="font-weight:700">총 이용 효율 80%</text>
  <path d="M150,122 L150,130 L339.0,130 L339.0,122" class="ch-br"/>
  <text x="244.5" y="144" text-anchor="middle" class="ch-ink" style="font-weight:700">발전 효율 35%</text>
  <text x="20" y="282" class="ch-ink">전기를 만드는 양은 같아도, 버리던 열을 난방에 다시 쓰면 같은 연료의 쓸모가 크게 늘어난다.</text>
  <text x="20" y="302" class="ch-sm">(값은 예제 4의 가정을 100 기준으로 나타낸 예)</text>
</svg>
