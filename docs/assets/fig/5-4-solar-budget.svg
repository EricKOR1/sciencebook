<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-5-4-solar-budget d-5-4-solar-budget">
  <title id="t-5-4-solar-budget">그림 5-4-2 지구에 도착한 태양 에너지의 행방</title>
  <desc id="d-5-4-solar-budget">들어오는 태양 에너지를 100으로 두면 약 30은 구름·대기·지표에서 반사되어 우주로 돌아가고, 약 23은 대기가, 약 47은 지표가 흡수한다. 흡수된 약 70은 지구의 에너지 흐름을 일으킨 뒤 결국 적외선으로 우주로 나간다. 띠의 굵기는 에너지의 양에 비례한다.</desc>
  <style>
    .sb-lbl{font-size:15px;font-weight:700} .sb-sm{font-size:13px;fill:var(--fig-muted)} .sb-ink{fill:var(--fig-ink)}
    .sb-zone{font-size:13px;font-weight:600;fill:var(--fig-muted)}
  </style>
  <!-- 영역 -->
  <rect x="0" y="95" width="720" height="140" style="fill:var(--fig-soft-blue)"/>
  <rect x="0" y="285" width="720" height="60" style="fill:var(--fig-soft-green)"/>
  <line x1="0" y1="285" x2="720" y2="285" style="stroke:var(--fig-green);stroke-width:1.5"/>
  <text x="712" y="20" text-anchor="end" class="sb-zone">우주</text>
  <text x="712" y="114" text-anchor="end" class="sb-zone">대기</text>
  <text x="712" y="304" text-anchor="end" class="sb-zone">지표</text>
  <!-- 구름 -->
  <path d="M440,140 a14,14 0 0 1 24,-10 a18,18 0 0 1 32,4 a12,12 0 0 1 4,22 h-56 a10,10 0 0 1 -4,-16 z" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2"/>
  <!-- 들어오는 태양 에너지 100 -->
  <line x1="270" y1="12" x2="270" y2="151" style="stroke:var(--fig-amber);stroke-width:120;stroke-opacity:0.8"/>
  <text x="340" y="30" class="sb-lbl sb-ink">들어오는 태양 에너지</text>
  <text x="340" y="48" class="sb-sm">100으로 두면</text>
  <!-- 반사 30 -->
  <path d="M228,150 L228,170 C228,224 150,224 150,170 L150,46" style="fill:none;stroke:var(--fig-amber);stroke-width:36;stroke-opacity:0.45"/>
  <path d="M124,48 L150,14 L176,48 Z" style="fill:var(--fig-amber);fill-opacity:0.45"/>
  <text x="18" y="56" class="sb-lbl" style="fill:var(--fig-amber)">반사 약 30</text>
  <text x="18" y="74" class="sb-sm">구름·대기·지표에서</text>
  <text x="18" y="90" class="sb-sm">우주로 되돌아감</text>
  <!-- 지표 흡수 47 -->
  <line x1="274.2" y1="150" x2="274.2" y2="262" style="stroke:var(--fig-green);stroke-width:56.4;stroke-opacity:0.8"/>
  <path d="M238,262 L274.2,286 L310.4,262 Z" style="fill:var(--fig-green);fill-opacity:0.8"/>
  <text x="328" y="314" class="sb-lbl" style="fill:var(--fig-green)">지표 흡수 약 47</text>
  <text x="328" y="333" class="sb-sm">땅과 바다를 데우고 물을 증발시킨다</text>
  <!-- 대기 흡수 23 -->
  <path d="M316.2,150 C316.2,186 330,195 362,195 L404,195" style="fill:none;stroke:var(--fig-teal);stroke-width:27.6;stroke-opacity:0.85"/>
  <path d="M404,178 L428,195 L404,212 Z" style="fill:var(--fig-teal);fill-opacity:0.85"/>
  <text x="438" y="192" class="sb-lbl" style="fill:var(--fig-teal)">대기 흡수 약 23</text>
  <text x="438" y="210" class="sb-sm">대기를 데운다</text>
  <!-- 적외선 방출 -->
  <path d="M664,272 q-8,-10 0,-20 t0,-20 t0,-20 t0,-20 t0,-20 t0,-20 t0,-20 t0,-20 t0,-20 t0,-20 t0,-20" style="fill:none;stroke:var(--fig-red);stroke-width:2.5"/>
  <path d="M664,32 l-8,14 l16,0 z" style="fill:var(--fig-red)"/>
  <text x="648" y="62" text-anchor="end" class="sb-lbl" style="fill:var(--fig-red)">적외선으로 방출 약 70</text>
  <text x="648" y="80" text-anchor="end" class="sb-sm">바람·해류·물의 순환·광합성을</text>
  <text x="648" y="96" text-anchor="end" class="sb-sm" style="fill:var(--fig-ink)">일으킨 뒤 결국 우주로 (복사 평형)</text>
</svg>
