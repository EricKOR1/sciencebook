  <text x="230.0" y="330.0" text-anchor="middle" class="pc2clausius-cycle-b">⇒ Δ<tspan style="font-style:italic">S</tspan> = <tspan style="font-style:italic">S</tspan><tspan baseline-shift="sub" style="font-size:10px">B</tspan> − <tspan style="font-style:italic">S</tspan><tspan baseline-shift="sub" style="font-size:10px">A</tspan> ≥ ∫d<tspan style="font-style:italic">q</tspan>/<tspan style="font-style:italic">T</tspan><tspan baseline-shift="sub" style="font-size:10px">열원</tspan></text>
