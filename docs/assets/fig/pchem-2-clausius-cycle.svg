    .pc2clausius-cycle-ax{font-size:13px;fill:var(--fig-muted)}
    .pc2clausius-cycle-fink{fill:var(--fig-ink)}
    .pc2clausius-cycle-fmuted{fill:var(--fig-muted)}
    .pc2clausius-cycle-fline{fill:var(--fig-line)}
    .pc2clausius-cycle-fblue{fill:var(--fig-blue)}
    .pc2clausius-cycle-fred{fill:var(--fig-red)}
    .pc2clausius-cycle-fgreen{fill:var(--fig-green)}
    .pc2clausius-cycle-famber{fill:var(--fig-amber)}
    .pc2clausius-cycle-fviolet{fill:var(--fig-violet)}
    .pc2clausius-cycle-fteal{fill:var(--fig-teal)}
    .pc2clausius-cycle-faccent{fill:var(--fig-accent)}
  </style>
