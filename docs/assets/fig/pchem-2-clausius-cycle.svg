<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 350" class="fig-small" role="img" aria-labelledby="t-pchem-2-clausius-cycle d-pchem-2-clausius-cycle">
  <title id="t-pchem-2-clausius-cycle">그림 물리화학 2-6 비가역 과정 I와 가역 과정 R로 만든 순환</title>
  <desc id="d-pchem-2-clausius-cycle">상태 A에서 B로 가는 비가역 과정 I는 중간 상태가 정의되지 않으므로 물결 모양 점선으로, B에서 A로 돌아오는 가역 과정 R은 실선으로 나타냈다. 두 과정을 이은 순환에 클라우지우스 부등식을 쓰면 ΔS ≥ ∫dq/T열원을 얻는다.</desc>
