  <text x="430.0" y="36.0" text-anchor="end" class="pc2clausius-cycle-t">I (비가역): ∫d<tspan style="font-style:italic">q</tspan>/<tspan style="font-style:italic">T</tspan><tspan baseline-shift="sub" style="font-size:10px">열원</tspan></text>
  <text x="430.0" y="54.0" text-anchor="end" class="pc2clausius-cycle-s">중간 상태가 정의되지 않음</text>
  <text x="65.2" y="216.0" class="pc2clausius-cycle-t">R (가역): ∫d<tspan style="font-style:italic">q</tspan><tspan baseline-shift="sub" style="font-size:10px">가역</tspan>/<tspan style="font-style:italic">T</tspan> = <tspan style="font-style:italic">S</tspan><tspan baseline-shift="sub" style="font-size:10px">A</tspan> − <tspan style="font-style:italic">S</tspan><tspan baseline-shift="sub" style="font-size:10px">B</tspan></text>
