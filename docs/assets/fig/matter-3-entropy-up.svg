  <title id="t-matter-3-entropy-up">그림 물질과 에너지 3-2 계의 엔트로피가 커지는 변화</title>
  <desc id="d-matter-3-entropy-up">고체가 액체·기체로 될 때, 고체가 물에 녹아 이온이 퍼질 때, 고체에서 기체가 생기는 반응이 일어날 때 입자가 움직이고 배열될 수 있는 방법이 많아져 엔트로피가 커진다. 입자 모식도이다.</desc>
