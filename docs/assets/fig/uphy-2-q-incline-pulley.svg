<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" class="fig-small" role="img" aria-labelledby="t-uphy-2-q-incline-pulley d-uphy-2-q-incline-pulley">
  <title id="t-uphy-2-q-incline-pulley">그림 일반물리학 2-8 문제 6의 빗면 위 토막과 매달린 추</title>
  <desc id="d-uphy-2-q-incline-pulley">경사각 30.0°인 빗면 위의 토막(5.00 kg)이 빗면 꼭대기의 도르래를 거친 줄로 연직으로 매달린 추(4.00 kg)와 연결되어 있다. 토막은 빗면 위쪽으로 움직이고 있으며, 토막과 빗면 사이의 운동 마찰 계수는 0.200이다.</desc>
