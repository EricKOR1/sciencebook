  <line x1="195.9" y1="145.4" x2="325.8" y2="70.4" style="stroke:var(--fig-ink);stroke-width:1.6;fill:none"/>
  <line x1="331.8" y1="80.8" x2="289.8" y2="112.0" style="stroke:var(--fig-muted);stroke-width:3;fill:none"/>
