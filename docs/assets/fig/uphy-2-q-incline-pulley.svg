  <circle cx="331.8" cy="80.8" r="2.5" style="fill:var(--fig-ink);stroke:none;stroke-width:1.5"/>
  <line x1="343.8" y1="80.8" x2="343.8" y2="196.0" style="stroke:var(--fig-ink);stroke-width:1.6;fill:none"/>
  <rect x="325.8" y="196.0" width="36.0" height="36.0" rx="0" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2"/>
