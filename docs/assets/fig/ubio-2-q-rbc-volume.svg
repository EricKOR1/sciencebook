<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-ubio-2-q-rbc-volume d-ubio-2-q-rbc-volume">
  <title id="t-ubio-2-q-rbc-volume">그림 일반생명과학 2-12 문제 14 해설 평형에서 적혈구의 부피</title>
  <desc id="d-ubio-2-q-rbc-volume">점선 원은 처음 적혈구, 실선 원은 평형에 이른 적혈구이다(원의 지름은 부피의 세제곱근에 비례). 막을 통과하지 못하는 용질의 농도가 세포 안(0.30 Osm)과 같은 (가)는 부피가 그대로이고, 더 낮은 (나)는 물이 들어와 1.5배, 더 높은 (다)는 물이 빠져나가 0.5배가 된다. 요소는 안팎 농도가 같아질 때까지 들어갈 뿐 부피를 바꾸지 않는다.</desc>
  <defs><marker id="ubio-2-q-rbc-volume-a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-ink)"/></marker><marker id="ubio-2-q-rbc-volume-a-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-muted)"/></marker><marker id="ubio-2-q-rbc-volume-a-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-line)"/></marker><marker id="ubio-2-q-rbc-volume-a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-blue)"/></marker><marker id="ubio-2-q-rbc-volume-a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-red)"/></marker><marker id="ubio-2-q-rbc-volume-a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-green)"/></marker><marker id="ubio-2-q-rbc-volume-a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-amber)"/></marker><marker id="ubio-2-q-rbc-volume-a-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-violet)"/></marker><marker id="ubio-2-q-rbc-volume-a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-teal)"/></marker></defs>
  <style>.ubio-2-q-rbc-volume-t{font-size:14px;fill:var(--fig-ink)} .ubio-2-q-rbc-volume-s{font-size:13px;fill:var(--fig-muted)} .ubio-2-q-rbc-volume-b{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-2-q-rbc-volume-ink{font-size:14px;fill:var(--fig-ink);font-weight:700} .ubio-2-q-rbc-volume-muted{font-size:14px;fill:var(--fig-muted);font-weight:700} .ubio-2-q-rbc-volume-line{font-size:14px;fill:var(--fig-line);font-weight:700} .ubio-2-q-rbc-volume-blue{font-size:14px;fill:var(--fig-blue);font-weight:700} .ubio-2-q-rbc-volume-red{font-size:14px;fill:var(--fig-red);font-weight:700} .ubio-2-q-rbc-volume-green{font-size:14px;fill:var(--fig-green);font-weight:700} .ubio-2-q-rbc-volume-amber{font-size:14px;fill:var(--fig-amber);font-weight:700} .ubio-2-q-rbc-volume-violet{font-size:14px;fill:var(--fig-violet);font-weight:700} .ubio-2-q-rbc-volume-teal{font-size:14px;fill:var(--fig-teal);font-weight:700}</style>
  <text x="120" y="28" text-anchor="middle" class="ubio-2-q-rbc-volume-t">(가) 0.15 M NaCl + 0.10 M 요소</text>
  <circle cx="120" cy="130" r="52" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2.2"/>
  <circle cx="120" cy="130" r="52" style="fill:none;stroke:var(--fig-muted);stroke-width:1.5;stroke-dasharray:5 4"/>
  <text x="120" y="135" text-anchor="middle" class="ubio-2-q-rbc-volume-b">×1</text>
  <text x="120" y="228" text-anchor="middle" class="ubio-2-q-rbc-volume-t">통과 못 하는 용질 0.30 Osm</text>
  <text x="120" y="250" text-anchor="middle" class="ubio-2-q-rbc-volume-green">등장 → 부피 그대로</text>
  <text x="360" y="28" text-anchor="middle" class="ubio-2-q-rbc-volume-t">(나) 0.10 M NaCl + 0.20 M 요소</text>
  <circle cx="360" cy="130" r="59.5" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2.2"/>
  <circle cx="360" cy="130" r="52" style="fill:none;stroke:var(--fig-muted);stroke-width:1.5;stroke-dasharray:5 4"/>
  <text x="360" y="135" text-anchor="middle" class="ubio-2-q-rbc-volume-b">×1.5</text>
  <line x1="442.7" y1="99.9" x2="421.6" y2="107.6" style="stroke:var(--fig-blue);stroke-width:2;fill:none" marker-end="url(#ubio-2-q-rbc-volume-a-blue)"/>
  <line x1="277.3" y1="99.9" x2="298.4" y2="107.6" style="stroke:var(--fig-blue);stroke-width:2;fill:none" marker-end="url(#ubio-2-q-rbc-volume-a-blue)"/>
  <text x="442" y="90" text-anchor="middle" class="ubio-2-q-rbc-volume-blue">H₂O</text>
  <text x="360" y="228" text-anchor="middle" class="ubio-2-q-rbc-volume-t">통과 못 하는 용질 0.20 Osm</text>
  <text x="360" y="250" text-anchor="middle" class="ubio-2-q-rbc-volume-blue">저장 → 부피 1.5배</text>
  <text x="600" y="28" text-anchor="middle" class="ubio-2-q-rbc-volume-t">(다) 0.20 M CaCl₂</text>
  <circle cx="600" cy="130" r="41.3" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2.2"/>
  <circle cx="600" cy="130" r="52" style="fill:none;stroke:var(--fig-muted);stroke-width:1.5;stroke-dasharray:5 4"/>
  <text x="600" y="135" text-anchor="middle" class="ubio-2-q-rbc-volume-b">×0.5</text>
  <line x1="642.5" y1="114.5" x2="678.9" y2="101.3" style="stroke:var(--fig-blue);stroke-width:2;fill:none" marker-end="url(#ubio-2-q-rbc-volume-a-blue)"/>
  <line x1="557.5" y1="114.5" x2="521.1" y2="101.3" style="stroke:var(--fig-blue);stroke-width:2;fill:none" marker-end="url(#ubio-2-q-rbc-volume-a-blue)"/>
  <text x="682" y="90" text-anchor="middle" class="ubio-2-q-rbc-volume-blue">H₂O</text>
  <text x="600" y="228" text-anchor="middle" class="ubio-2-q-rbc-volume-t">통과 못 하는 용질 0.60 Osm</text>
  <text x="600" y="250" text-anchor="middle" class="ubio-2-q-rbc-volume-red">고장 → 부피 0.5배</text>
  <text x="360" y="286" text-anchor="middle" class="ubio-2-q-rbc-volume-s">점선 원: 처음 세포(세포 안 0.30 Osm)   실선 원: 평형의 세포</text>
</svg>
