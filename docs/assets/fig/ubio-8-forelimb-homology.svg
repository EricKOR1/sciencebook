<title id="t-ubio-8-forelimb-homology">그림 일반생명과학 8-4 척추동물 앞다리의 상동</title>
<desc id="d-ubio-8-forelimb-homology">사람의 팔, 고양이의 앞다리, 고래의 가슴지느러미, 박쥐의 날개는 쓰임새가 다르지만 위팔뼈, 노뼈와 자뼈, 손목뼈, 손허리뼈와 손가락뼈가 같은 순서로 이어진 같은 구성이다. 같은 색은 같은 뼈를 뜻한다. 고래는 손가락뼈 마디가 많고, 박쥐는 손가락뼈가 매우 길어 날개막을 받친다. 모식도이다.</desc>
