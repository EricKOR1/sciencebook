  <title id="t-matter-4-q-mg-volume">그림 물질과 에너지 4-10 문제 14의 수소 부피–시간 그래프</title>
  <desc id="d-matter-4-q-mg-volume">염산의 농도가 크거나(나) 마그네슘의 표면적이 넓으면(다) 처음 기울기가 (가)보다 크지만, 마그네슘의 질량이 같으므로 반응이 끝났을 때 수소의 총부피는 같다. 곡선의 기울기 크기는 모식적이다.</desc>
