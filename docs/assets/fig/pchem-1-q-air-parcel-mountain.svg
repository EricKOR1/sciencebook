  <desc id="d-pchem-1-q-air-parcel-mountain">건조한 공기 덩어리가 고도 0 m(기온 20 ℃)의 산기슭에서 산비탈을 따라 고도 2000 m의 꼭대기까지 올라간다. 올라갈수록 덩어리가 팽창한다. 꼭대기의 온도는 문제에서 구한다. 모식도.</desc>
