  <title id="t-pchem-1-joule-thomson-apparatus">그림 물리화학 1-10 줄–톰슨 실험 장치</title>
  <desc id="d-pchem-1-joule-thomson-apparatus">단열재로 감싼 관 가운데에 다공성 마개가 있다. 왼쪽 피스톤이 일정 압력 p₁으로 기체 덩어리(부피 V₁)를 마개 속으로 밀어 넣고, 오른쪽 피스톤은 일정 압력 p₂(&lt; p₁)로 물러나며 부피 V₂를 받는다. 마개 양쪽의 온도 T₁, T₂를 잰다. 기체 덩어리가 받은 일은 p₁V₁ − p₂V₂이고 q = 0이므로 H₁ = H₂이다. 모식도.</desc>
