<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" role="img" aria-labelledby="t-ochem-3-butanol-enantiomers d-ochem-3-butanol-enantiomers">
  <title id="t-ochem-3-butanol-enantiomers">그림 유기화학 3-1 뷰탄-2-올의 두 거울상 이성질체</title>
  <desc id="d-ochem-3-butanol-enantiomers">가운데 거울을 사이에 두고 왼쪽에 (R)-뷰탄-2-올, 오른쪽에 (S)-뷰탄-2-올을 쐐기·점선 구조와 공-막대 모형으로 그렸다. 아래 줄은 오른쪽 분자를 세로축 둘레로 180° 돌려 왼쪽 분자와 견준 것으로, OH와 CH₃은 겹치지만 CH₂CH₃과 H는 앞뒤가 바뀌어 겹치지 않는다.</desc>
