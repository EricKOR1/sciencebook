<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-matter-2-cooling-curve d-matter-2-cooling-curve">
  <title id="t-matter-2-cooling-curve">그림 물질과 에너지 2-10 순수한 물과 설탕물의 냉각 곡선</title>
  <desc id="d-matter-2-cooling-curve">한제에 넣은 순수한 물은 잠시 과냉각되었다가 0 °C로 올라가 다 얼 때까지 온도가 일정하다. 1.00 m 설탕물은 과냉각 뒤 약 −1.87 °C로 올라가고, 얼음이 생길수록 남은 용액이 진해져 온도가 서서히 내려간다. 과냉각 직후 다시 올라간 온도를 어는점으로 읽는다. 모식도이다.</desc>
