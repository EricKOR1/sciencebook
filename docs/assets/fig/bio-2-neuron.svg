<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-bio-2-neuron d-bio-2-neuron">
  <title id="t-bio-2-neuron">그림 생명과학 2-1 뉴런의 구조와 도약 전도</title>
  <desc id="d-bio-2-neuron">뉴런은 가지 돌기, 신경 세포체, 축삭 돌기로 이루어진다. 말이집 신경에서는 말이집 사이의 랑비에 결절에서만 활동 전위가 생겨 흥분이 건너뛰듯 빠르게 전도된다. 모식도(길이 비율은 실제와 다름).</desc>
  <style>
    .b2neu-lbl{font-size:13.5px;fill:var(--fig-ink)} .b2neu-b{font-size:14px;font-weight:700;fill:var(--fig-ink)}
    .b2neu-sm{font-size:12.5px;fill:var(--fig-muted)} .b2neu-lead{fill:none;stroke:var(--fig-muted);stroke-width:1.1}
    .b2neu-den{fill:none;stroke:var(--fig-blue);stroke-width:4;stroke-linecap:round}
    .b2neu-ax{fill:none;stroke:var(--fig-blue);stroke-width:5;stroke-linecap:round}
    .b2neu-my{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2}
    .b2neu-jump{fill:none;stroke:var(--fig-red);stroke-width:2;stroke-dasharray:5 4}
    .b2neu-rt{font-size:13.5px;font-weight:700;fill:var(--fig-red)}
  </style>
