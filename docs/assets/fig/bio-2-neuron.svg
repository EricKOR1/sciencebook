  <text x="430" y="267" text-anchor="middle" class="b2neu-sm">활동 전위가 생기는 곳</text>
  <text x="370" y="196" text-anchor="middle" class="b2neu-lbl">축삭 돌기</text>
  <line x1="660" y1="204" x2="660" y2="240" class="b2neu-lead"/>
