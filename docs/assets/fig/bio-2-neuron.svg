  <text x="706" y="273" text-anchor="end" class="b2neu-sm">다음 뉴런으로 전달</text>
  <text x="410" y="70" text-anchor="middle" class="b2neu-rt">도약 전도</text>
  <text x="410" y="88" text-anchor="middle" class="b2neu-sm">결절에서 결절로 건너뛰며 빠르게</text>
