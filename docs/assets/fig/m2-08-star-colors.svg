<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="t-m2-08-star-colors d-m2-08-star-colors">
  <title id="t-m2-08-star-colors">그림 중2-8-3 별의 색과 표면 온도</title>
  <desc id="d-m2-08-star-colors">별의 색은 파란색, 청백색, 흰색, 황백색, 노란색, 주황색, 붉은색 순서로 표면 온도가 낮아진다. 리겔은 청백색, 시리우스는 흰색, 태양은 노란색, 베텔게우스는 붉은색 별이다. 별의 색은 실제 사진의 색을 단순화했다.</desc>
  <style>.m2-08-star-colors-t{font-size:14px;fill:var(--fig-ink)} .m2-08-star-colors-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .m2-08-star-colors-s{font-size:13px;fill:var(--fig-muted)} .m2-08-star-colors-hd{font-size:15px;font-weight:700;fill:var(--fig-ink)} </style>
  <circle cx="60" cy="96" r="26" style="fill:#5b7cff;stroke:var(--fig-line);stroke-width:1.5"/>
  <text x="60.0" y="146.0" text-anchor="middle" class="m2-08-star-colors-b">파란색</text>
  <circle cx="160" cy="96" r="26" style="fill:#9db6ff;stroke:var(--fig-line);stroke-width:1.5"/>
  <text x="160.0" y="146.0" text-anchor="middle" class="m2-08-star-colors-b">청백색</text>
  <text x="160.0" y="168.0" text-anchor="middle" class="m2-08-star-colors-s">리겔</text>
  <text x="160.0" y="185.0" text-anchor="middle" class="m2-08-star-colors-s">스피카</text>
  <circle cx="260" cy="96" r="26" style="fill:#eef2ff;stroke:var(--fig-line);stroke-width:1.5"/>
  <text x="260.0" y="146.0" text-anchor="middle" class="m2-08-star-colors-b">흰색</text>
  <text x="260.0" y="168.0" text-anchor="middle" class="m2-08-star-colors-s">시리우스</text>
  <text x="260.0" y="185.0" text-anchor="middle" class="m2-08-star-colors-s">직녀성</text>
  <circle cx="360" cy="96" r="26" style="fill:#fff2d6;stroke:var(--fig-line);stroke-width:1.5"/>
  <text x="360.0" y="146.0" text-anchor="middle" class="m2-08-star-colors-b">황백색</text>
  <text x="360.0" y="168.0" text-anchor="middle" class="m2-08-star-colors-s">프로키온</text>
  <circle cx="460" cy="96" r="26" style="fill:#ffd76a;stroke:var(--fig-line);stroke-width:1.5"/>
  <text x="460.0" y="146.0" text-anchor="middle" class="m2-08-star-colors-b">노란색</text>
  <text x="460.0" y="168.0" text-anchor="middle" class="m2-08-star-colors-s">태양</text>
  <circle cx="560" cy="96" r="26" style="fill:#ffa95c;stroke:var(--fig-line);stroke-width:1.5"/>
  <text x="560.0" y="146.0" text-anchor="middle" class="m2-08-star-colors-b">주황색</text>
  <text x="560.0" y="168.0" text-anchor="middle" class="m2-08-star-colors-s">아크투루스</text>
  <circle cx="660" cy="96" r="26" style="fill:#ff6a4a;stroke:var(--fig-line);stroke-width:1.5"/>
  <text x="660.0" y="146.0" text-anchor="middle" class="m2-08-star-colors-b">붉은색</text>
  <text x="660.0" y="168.0" text-anchor="middle" class="m2-08-star-colors-s">베텔게우스</text>
  <text x="660.0" y="185.0" text-anchor="middle" class="m2-08-star-colors-s">안타레스</text>
  <line x1="170.0" y1="25.0" x2="553.0" y2="25.0" style="stroke:var(--fig-line);stroke-width:2;fill:none"/>
  <path d="M560.0 25.0 L550.9 29.1 L550.9 20.9 Z" style="fill:var(--fig-line);stroke:none"/>
  <text x="40.0" y="30.0" class="m2-08-star-colors-b" style="fill:var(--fig-blue)">표면 온도 높다</text>
  <text x="690.0" y="30.0" text-anchor="end" class="m2-08-star-colors-b" style="fill:var(--fig-red)">표면 온도 낮다</text>
  <text x="360.0" y="236.0" text-anchor="middle" class="m2-08-star-colors-s">별에서는 파랄수록 뜨겁고, 붉을수록 덜 뜨겁다 (일상의 빨강=뜨거움 표시와 반대)</text>
</svg>
