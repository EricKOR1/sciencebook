  <path d="M40 70 L40 184 Q40 210 68 210 Q96 210 96 184 Z L96 70" style="fill:none;stroke:var(--fig-ink);stroke-width:1.8;stroke-linejoin:round"/>
  <text x="68" y="60" text-anchor="middle" class="ubio-2-q-fractionation-s">균질액</text>
