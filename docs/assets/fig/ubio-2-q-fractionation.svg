  <text x="153" y="106" text-anchor="middle" class="ubio-2-q-fractionation-b">600 ×g</text>
  <text x="153" y="146" text-anchor="middle" class="ubio-2-q-fractionation-s">원심 분리</text>
  <path d="M380 100 L380 184 Q380 210 408 210 Q436 210 436 184 L436 100 Z" style="fill:var(--fig-soft-amber);stroke:none;stroke-width:0;stroke-linejoin:round"/>
  <path d="M386 196 Q388 208 408 208 Q428 208 430 196 Z" style="fill:var(--fig-violet);stroke:none;stroke-width:0;stroke-linejoin:round"/>
  <text x="408" y="232" text-anchor="middle" class="ubio-2-q-fractionation-b">P2</text>
  <path d="M380 70 L380 184 Q380 210 408 210 Q436 210 436 184 Z L436 70" style="fill:none;stroke:var(--fig-ink);stroke-width:1.8;stroke-linejoin:round"/>
  <line x1="274" y1="120" x2="370" y2="120" style="stroke:var(--fig-ink);stroke-width:2;fill:none" marker-end="url(#ubio-2-q-fractionation-a-ink)"/>
  <text x="323" y="106" text-anchor="middle" class="ubio-2-q-fractionation-b">15 000 ×g</text>
  <text x="323" y="146" text-anchor="middle" class="ubio-2-q-fractionation-s">상층액을</text>
  <text x="323" y="164" text-anchor="middle" class="ubio-2-q-fractionation-s">원심 분리</text>
  <path d="M550 100 L550 184 Q550 210 578 210 Q606 210 606 184 L606 100 Z" style="fill:var(--fig-soft-amber);stroke:none;stroke-width:0;stroke-linejoin:round"/>
  <path d="M556 196 Q558 208 578 208 Q598 208 600 196 Z" style="fill:var(--fig-violet);stroke:none;stroke-width:0;stroke-linejoin:round"/>
  <text x="578" y="232" text-anchor="middle" class="ubio-2-q-fractionation-b">P3</text>
  <path d="M550 70 L550 184 Q550 210 578 210 Q606 210 606 184 Z L606 70" style="fill:none;stroke:var(--fig-ink);stroke-width:1.8;stroke-linejoin:round"/>
  <line x1="444" y1="120" x2="540" y2="120" style="stroke:var(--fig-ink);stroke-width:2;fill:none" marker-end="url(#ubio-2-q-fractionation-a-ink)"/>
  <text x="493" y="106" text-anchor="middle" class="ubio-2-q-fractionation-b">100 000 ×g</text>
  <text x="493" y="146" text-anchor="middle" class="ubio-2-q-fractionation-s">상층액을</text>
  <text x="493" y="164" text-anchor="middle" class="ubio-2-q-fractionation-s">원심 분리</text>
  <line x1="614" y1="120" x2="668" y2="120" style="stroke:var(--fig-ink);stroke-width:2;fill:none" marker-end="url(#ubio-2-q-fractionation-a-ink)"/>
  <text x="686" y="125" text-anchor="middle" class="ubio-2-q-fractionation-b">S</text>
  <text x="686" y="146" text-anchor="middle" class="ubio-2-q-fractionation-s">상층액</text>
  <text x="360" y="282" text-anchor="middle" class="ubio-2-q-fractionation-s">침전물(보라)은 그 단계에서 가라앉은 것, 위의 액체는 다음 단계로 옮기는 상층액</text>
</svg>
