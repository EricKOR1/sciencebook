<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-ubio-2-q-fractionation d-ubio-2-q-fractionation">
  <title id="t-ubio-2-q-fractionation">그림 일반생명과학 2-11 문제 12 간 균질액의 차등 원심 분리</title>
  <desc id="d-ubio-2-q-fractionation">균질액을 600 ×g로 원심 분리해 침전물 P1을 얻고, 상층액을 15 000 ×g로 돌려 P2, 다시 그 상층액을 100 000 ×g로 돌려 P3을 얻는다. 마지막 상층액이 S이다. 원심력이 커지는 순서로 단계가 이어진다.</desc>
  <defs><marker id="ubio-2-q-fractionation-a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-ink)"/></marker><marker id="ubio-2-q-fractionation-a-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-muted)"/></marker><marker id="ubio-2-q-fractionation-a-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-line)"/></marker><marker id="ubio-2-q-fractionation-a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-blue)"/></marker><marker id="ubio-2-q-fractionation-a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-red)"/></marker><marker id="ubio-2-q-fractionation-a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-green)"/></marker><marker id="ubio-2-q-fractionation-a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-amber)"/></marker><marker id="ubio-2-q-fractionation-a-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-violet)"/></marker><marker id="ubio-2-q-fractionation-a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-teal)"/></marker></defs>
  <style>.ubio-2-q-fractionation-t{font-size:14px;fill:var(--fig-ink)} .ubio-2-q-fractionation-s{font-size:13px;fill:var(--fig-muted)} .ubio-2-q-fractionation-b{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-2-q-fractionation-ink{font-size:14px;fill:var(--fig-ink);font-weight:700} .ubio-2-q-fractionation-muted{font-size:14px;fill:var(--fig-muted);font-weight:700} .ubio-2-q-fractionation-line{font-size:14px;fill:var(--fig-line);font-weight:700} .ubio-2-q-fractionation-blue{font-size:14px;fill:var(--fig-blue);font-weight:700} .ubio-2-q-fractionation-red{font-size:14px;fill:var(--fig-red);font-weight:700} .ubio-2-q-fractionation-green{font-size:14px;fill:var(--fig-green);font-weight:700} .ubio-2-q-fractionation-amber{font-size:14px;fill:var(--fig-amber);font-weight:700} .ubio-2-q-fractionation-violet{font-size:14px;fill:var(--fig-violet);font-weight:700} .ubio-2-q-fractionation-teal{font-size:14px;fill:var(--fig-teal);font-weight:700}</style>
