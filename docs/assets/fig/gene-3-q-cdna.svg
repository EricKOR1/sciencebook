  <rect x="490.0" y="270.0" width="60.0" height="20.0" rx="0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <rect x="550.0" y="270.0" width="50.0" height="20.0" rx="0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="422.0" y="310.0" text-anchor="middle" class="gene-3-q-cdna-s">프로모터</text>
  <text x="610.0" y="285.0" class="gene-3-q-cdna-t" style="fill:var(--fig-green);font-weight:600">→ 정상 인슐린</text>
</svg>
