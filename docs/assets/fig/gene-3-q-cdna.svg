  <text x="265.0" y="84.0" text-anchor="middle" class="gene-3-q-cdna-s">엑손</text>
  <text x="310.0" y="84.0" text-anchor="middle" class="gene-3-q-cdna-s">인트론</text>
  <line x1="250.0" y1="92.0" x2="158.2" y2="132.4" style="stroke:var(--fig-red);stroke-width:1.8"/>
  <path d="M150.0 136.0 L156.4 128.3 L160.1 136.5 Z" style="fill:var(--fig-red)"/>
