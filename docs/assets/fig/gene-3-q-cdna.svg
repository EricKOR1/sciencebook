  <rect x="30.0" y="140.0" width="50.0" height="20.0" rx="0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <rect x="80.0" y="145.0" width="40.0" height="10.0" rx="0" style="fill:var(--fig-paper);stroke:var(--fig-muted);stroke-width:1.4"/>
  <rect x="120.0" y="140.0" width="60.0" height="20.0" rx="0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
