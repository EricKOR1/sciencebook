<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-gene-3-q-cdna d-gene-3-q-cdna">
  <title id="t-gene-3-q-cdna">그림 생물의 유전 3-11 문제 17 해설 — 유전체 DNA와 인트론 없는 DNA</title>
  <desc id="d-gene-3-q-cdna">사람 유전체 DNA의 인슐린 유전자에는 인트론이 있다. 이것을 그대로 대장균에 넣으면 스플라이싱이 일어나지 않아 인트론까지 번역된다. 사람 세포에서 가공이 끝난 성숙한 mRNA를 역전사 효소로 역전사하면 엑손만 이어진 DNA를 얻고, 이것을 원핵생물의 프로모터 뒤에 연결해 넣으면 정상 인슐린을 얻을 수 있다. 길이 비율은 모식도이다.</desc>
  <style>.gene-3-q-cdna-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .gene-3-q-cdna-t{font-size:14px;fill:var(--fig-ink)} .gene-3-q-cdna-s{font-size:13px;fill:var(--fig-muted)} .gene-3-q-cdna-m{font-size:14px;font-weight:600;fill:var(--fig-ink);letter-spacing:1px} .gene-3-q-cdna-ln{fill:none;stroke:var(--fig-ink);stroke-width:2} .gene-3-q-cdna-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.4} .gene-3-q-cdna-gr{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 3}</style>
  <text x="360.0" y="24.0" text-anchor="middle" class="gene-3-q-cdna-t">사람 유전체 DNA의 인슐린 유전자</text>
