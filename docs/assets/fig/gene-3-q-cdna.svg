  <text x="30.0" y="184.0" class="gene-3-q-cdna-s">전사 → 스플라이싱 없음</text>
  <text x="30.0" y="204.0" class="gene-3-q-cdna-s">→ 인트론까지 번역</text>
  <text x="30.0" y="228.0" class="gene-3-q-cdna-t" style="fill:var(--fig-red);font-weight:600">→ 비정상 단백질</text>
