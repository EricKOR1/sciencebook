  <text x="265.0" y="57.0" text-anchor="middle" class="gene-3-q-cdna-s">엑손</text>
  <text x="310.0" y="40.0" text-anchor="middle" class="gene-3-q-cdna-s">인트론</text>
  <line x1="270.0" y1="70.0" x2="158.0" y2="126.0" style="stroke:var(--fig-red);stroke-width:1.8"/>
  <path d="M150.0 130.0 L156.0 122.0 L160.1 130.0 Z" style="fill:var(--fig-red)"/>
