<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-uphy-11-q-grating-orders d-uphy-11-q-grating-orders">
  <title id="t-uphy-11-q-grating-orders">그림 일반물리학 11-10 문제 8 풀이의 차수별 스펙트럼 범위</title>
  <desc id="d-uphy-11-q-grating-orders">1 mm당 500줄인 격자(d = 2.0 μm)에서 파장 400~700 nm의 빛이 각 차수에서 차지하는 sinθ 범위이다. 1차는 0.20~0.35, 2차는 0.40~0.70, 3차는 0.60~1.05인데 sinθ는 1을 넘을 수 없으므로 3차는 약 667 nm까지만 나타난다. 1차와 2차 사이에는 틈이 있고, 2차의 빨간 끝(0.70)과 3차의 보라 끝(0.60)은 겹친다. 색은 파장을 나타낸다.</desc>
