<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-uchem-1-limiting-reactant d-uchem-1-limiting-reactant">
  <title id="t-uchem-1-limiting-reactant">그림 일반화학 1-6 입자 모형으로 본 한계 반응물</title>
  <desc id="d-uchem-1-limiting-reactant">2H₂ + O₂ → 2H₂O 반응에 H₂ 분자 6개와 O₂ 분자 4개를 넣었다. 개수는 H₂가 더 많지만 몰수(개수) ÷ 계수는 H₂가 6 ÷ 2 = 3, O₂가 4 ÷ 1 = 4로 H₂가 작다. 그래서 H₂가 먼저 모두 소모되어(한계 반응물) H₂O 6개가 생기고 O₂ 1개가 남는다(과잉 반응물).</desc>
