<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-rxn-2-q-series-electrolysis d-rxn-2-q-series-electrolysis">
  <title id="t-rxn-2-q-series-electrolysis">그림 화학 반응의 세계 2-9 문제 13의 직렬로 연결한 두 전해조</title>
  <desc id="d-rxn-2-q-series-electrolysis">직류 전원에 질산 은 수용액 전해조와 황산 구리(II) 수용액 전해조를 직렬로 연결하였다. 전극은 모두 백금이고, 장치는 모식도이다.</desc>
  <style>
    .rxn-2-q-series-electrolysis-t{font-size:14px;fill:var(--fig-ink)}
    .rxn-2-q-series-electrolysis-b{font-size:15px;fill:var(--fig-ink);font-weight:700}
    .rxn-2-q-series-electrolysis-s{font-size:13px;fill:var(--fig-muted)}
    .rxn-2-q-series-electrolysis-a{font-size:15px;fill:var(--fig-ink);font-weight:600}
  </style>
