  <title id="t-6-3-greenhouse-hysteresis">그림 6-3-4 스마트 비닐하우스 천창의 되먹임 제어</title>
  <desc id="d-6-3-greenhouse-hysteresis">예제 5의 실내 온도 기록을 그래프로 나타냈다. 온도가 여는 기준 28 °C에 도달한 11시에 천창이 열리고, 닫는 기준 24 °C 이하로 내려갈 때까지는 25 °C인 16시에도 열린 상태를 유지하다가 18시(22 °C)에 닫힌다. 두 기준 사이에서는 이전 상태를 유지하여 창이 너무 자주 열리고 닫히지 않는다.</desc>
