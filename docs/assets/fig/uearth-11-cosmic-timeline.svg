  <text x="48.0" y="121" text-anchor="start" class="uearth-11-cosmic-timeline-s">10⁻³⁵ 초 무렵</text>
  <rect x="401.1" y="140" width="72.2" height="20" style="fill:var(--fig-amber);opacity:0.75"/>
  <line x1="437.2" y1="140" x2="437.2" y2="82" style="stroke:var(--fig-amber);stroke-width:1.5"/>
  <text x="437.2" y="62" text-anchor="middle" class="uearth-11-cosmic-timeline-h" style="fill:var(--fig-amber)">양성자·중성자</text>
