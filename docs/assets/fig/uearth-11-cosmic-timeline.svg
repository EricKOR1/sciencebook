  <text x="40.0" y="294.0" text-anchor="start" class="uearth-11-cosmic-timeline-h" style="fill:var(--fig-blue)">재결합(38만 년)</text>
  <circle cx="40.0" cy="330" r="4" style="fill:var(--fig-blue)"/>
  <line x1="58.8" y1="340" x2="58.8" y2="374.0" style="stroke:var(--fig-amber);stroke-width:1.5"/>
  <text x="58.8" y="389.0" text-anchor="start" class="uearth-11-cosmic-timeline-h" style="fill:var(--fig-amber)">첫 별과 은하(수억 년)</text>
  <circle cx="58.8" cy="330" r="4" style="fill:var(--fig-amber)"/>
  <line x1="430.9" y1="320" x2="430.9" y2="298.0" style="stroke:var(--fig-green);stroke-width:1.5"/>
  <text x="430.9" y="294.0" text-anchor="middle" class="uearth-11-cosmic-timeline-h" style="fill:var(--fig-green)">가속 시작(약 50억~60억 년 전)</text>
  <circle cx="430.9" cy="330" r="4" style="fill:var(--fig-green)"/>
  <line x1="473.3" y1="340" x2="473.3" y2="374.0" style="stroke:var(--fig-teal);stroke-width:1.5"/>
  <text x="473.3" y="389.0" text-anchor="middle" class="uearth-11-cosmic-timeline-h" style="fill:var(--fig-teal)">태양계 형성(92억 년)</text>
  <circle cx="473.3" cy="330" r="4" style="fill:var(--fig-teal)"/>
  <line x1="690.0" y1="320" x2="690.0" y2="298.0" style="stroke:var(--fig-red);stroke-width:1.5"/>
  <text x="690.0" y="294.0" text-anchor="end" class="uearth-11-cosmic-timeline-h" style="fill:var(--fig-red)">현재(138억 년, CMB 2.7 K)</text>
  <circle cx="690.0" cy="330" r="4" style="fill:var(--fig-red)"/>
  <text x="690" y="432" text-anchor="end" class="uearth-11-cosmic-timeline-s">시기는 어림값. 우주가 식으며 온도는 1 + z에 비례해 낮아졌다.</text>
</svg>
