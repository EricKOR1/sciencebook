  <line x1="40.0" y1="160" x2="40.0" y2="166" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="40.0" y="180" text-anchor="middle" class="uearth-11-cosmic-timeline-s">10<tspan dy="-5" style="font-size:10px">−36</tspan></text>
  <line x1="112.2" y1="160" x2="112.2" y2="166" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="112.2" y="180" text-anchor="middle" class="uearth-11-cosmic-timeline-s">10<tspan dy="-5" style="font-size:10px">−30</tspan></text>
  <line x1="184.4" y1="160" x2="184.4" y2="166" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="184.4" y="180" text-anchor="middle" class="uearth-11-cosmic-timeline-s">10<tspan dy="-5" style="font-size:10px">−24</tspan></text>
  <line x1="256.7" y1="160" x2="256.7" y2="166" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="256.7" y="180" text-anchor="middle" class="uearth-11-cosmic-timeline-s">10<tspan dy="-5" style="font-size:10px">−18</tspan></text>
