  <text x="134.2" y="360" text-anchor="middle" class="uearth-11-cosmic-timeline-s">2</text>
  <line x1="228.4" y1="340" x2="228.4" y2="346" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="228.4" y="360" text-anchor="middle" class="uearth-11-cosmic-timeline-s">4</text>
