<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-uearth-11-cosmic-timeline d-uearth-11-cosmic-timeline">
  <title id="t-uearth-11-cosmic-timeline">그림 일반지구과학 11-3 우주의 연대표</title>
  <desc id="d-uearth-11-cosmic-timeline">위: 빅뱅 후 시간을 로그 눈금으로 펼친 초기 우주(급팽창, 양성자·중성자 생성, 빅뱅 핵합성, 재결합)와 그때의 온도. 아래: 마지막 부분을 보통 눈금으로 확대한 138억 년의 역사(첫 별과 은하, 가속 팽창의 시작, 태양계 형성, 현재).</desc>
  <style>
    .uearth-11-cosmic-timeline-h{font-size:13px;font-weight:600;fill:var(--fig-ink)}
    .uearth-11-cosmic-timeline-t{font-size:13px;fill:var(--fig-ink)}
    .uearth-11-cosmic-timeline-s{font-size:12px;fill:var(--fig-muted)}
  </style>
  <text x="40" y="22" class="uearth-11-cosmic-timeline-h">① 빅뱅 후 시간 (초, 로그 눈금)</text>
