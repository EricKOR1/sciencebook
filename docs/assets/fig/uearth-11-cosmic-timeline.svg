  <text x="322.6" y="360" text-anchor="middle" class="uearth-11-cosmic-timeline-s">6</text>
  <line x1="416.8" y1="340" x2="416.8" y2="346" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="416.8" y="360" text-anchor="middle" class="uearth-11-cosmic-timeline-s">8</text>
  <line x1="511.0" y1="340" x2="511.0" y2="346" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="511.0" y="360" text-anchor="middle" class="uearth-11-cosmic-timeline-s">10</text>
  <line x1="605.2" y1="340" x2="605.2" y2="346" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="605.2" y="360" text-anchor="middle" class="uearth-11-cosmic-timeline-s">12</text>
  <line x1="690.0" y1="340" x2="690.0" y2="346" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="690.0" y="360" text-anchor="middle" class="uearth-11-cosmic-timeline-s">13.8</text>
