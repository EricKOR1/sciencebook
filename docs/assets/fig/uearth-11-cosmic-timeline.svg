  <rect x="430.9" y="320" width="259.1" height="20" style="fill:var(--fig-soft-green)"/>
  <text x="235.5" y="335" text-anchor="middle" class="uearth-11-cosmic-timeline-s" style="fill:var(--fig-violet)">감속 팽창(물질의 중력이 우세)</text>
  <text x="560.5" y="335" text-anchor="middle" class="uearth-11-cosmic-timeline-s" style="fill:var(--fig-green)">가속 팽창(암흑 에너지)</text>
  <line x1="40" y1="340" x2="690" y2="340" style="stroke:var(--fig-ink);stroke-width:1.2"/>
  <line x1="40.0" y1="340" x2="40.0" y2="346" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="40.0" y="360" text-anchor="middle" class="uearth-11-cosmic-timeline-s">0</text>
