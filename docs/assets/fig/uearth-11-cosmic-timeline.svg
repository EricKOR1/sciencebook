  <text x="545.6" y="180" text-anchor="middle" class="uearth-11-cosmic-timeline-s">10<tspan dy="-5" style="font-size:10px">6</tspan></text>
  <line x1="617.8" y1="160" x2="617.8" y2="166" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="617.8" y="180" text-anchor="middle" class="uearth-11-cosmic-timeline-s">10<tspan dy="-5" style="font-size:10px">12</tspan></text>
