<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="t-pchem-12-arrhenius-curvature d-pchem-12-arrhenius-curvature">
  <title id="t-pchem-12-arrhenius-curvature">그림 물리화학 12-10 직선인 아레니우스 그래프와 휘는 아레니우스 그래프</title>
  <desc id="d-pchem-12-arrhenius-curvature">실선은 Ea = 71.5 kJ/mol, ln A = 21.76인 반응의 ln k = 21.76 − 8600 K/T로, 300 K(−6.91)와 320 K(−5.12)의 두 점이 기울기 −Ea/R = −8600 K인 직선 위에 있다. 점선은 두 경로가 병행하는 k = 10¹²e^(−80 kJ/RT) + 10⁵e^(−40 kJ/RT)로, 두 항이 같아지는 약 298 K(1000/T = 3.35) 근처에서 휜다. 높은 온도(왼쪽)에서는 Ea가 큰 경로가 우세해 기울기가 가파르고, 낮은 온도(오른쪽)에서는 Ea가 작은 경로가 우세해 완만하다.</desc>
