  <title id="t-pchem-1-joule-experiment">그림 물리화학 1-9 줄의 자유 팽창 실험</title>
  <desc id="d-pchem-1-joule-experiment">단열한 물통 속에 압축 기체(약 20 bar)가 든 용기와 진공 용기를 꼭지 달린 관으로 잇고, 꼭지를 열어 기체를 진공으로 팽창시키며 물의 온도 변화를 잰다. 아래는 꼭지를 열기 전과 연 뒤의 분자 분포. 자유 팽창이므로 w = 0이고, 물의 온도 변화가 없으면 q ≈ 0, 따라서 ΔU ≈ 0이다. 모식도.</desc>
