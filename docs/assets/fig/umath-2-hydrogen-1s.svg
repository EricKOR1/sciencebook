<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="t-umath-2-hydrogen-1s d-umath-2-hydrogen-1s">
  <title id="t-umath-2-hydrogen-1s">그림 수학 도구 2-9 수소 1s 오비탈의 확률 밀도와 지름 분포</title>
  <desc id="d-umath-2-hydrogen-1s">위: 확률 밀도 |ψ|²(πa₀³를 곱한 값 e^(−2r/a₀))는 핵(r = 0)에서 가장 크고 단조롭게 줄어든다. 아래: 지름 분포 a₀P(r) = 4(r/a₀)² e^(−2r/a₀)는 껍질 부피 4πr²dr 때문에 0에서 시작해 r = a₀에서 최대(약 0.541)가 된다. 평균 반지름 ⟨r⟩ = 1.5a₀은 꼬리 때문에 최댓값보다 바깥에 있고, 0 ~ a₀ 구간의 넓이(확률)는 0.323이다.</desc>
