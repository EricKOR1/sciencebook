  <title id="t-uchem-8-compression-particles">그림 일반화학 8-7 N₂O₄ ⇌ 2NO₂ 평형을 압축하면</title>
  <desc id="d-uchem-8-compression-particles">입자 모형(모식도, K_p = 0.150)이다. (가) 1.00 bar 평형에서 해리도 0.190. (나) 부피를 절반으로 줄인 직후 조성은 같고 모든 분압이 2배가 되어 Q = 0.300 > K_p. (다) 역반응이 진행해 NO₂ 일부가 N₂O₄로 돌아가 해리도 0.139, 전체 압력 1.91 bar가 된다. 그래도 NO₂의 분압(0.466 bar)은 처음(0.319 bar)보다 크다.</desc>
