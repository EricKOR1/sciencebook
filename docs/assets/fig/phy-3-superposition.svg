<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-phy-3-superposition d-phy-3-superposition">
  <title id="t-phy-3-superposition">그림 물리학 3-1 파동의 중첩 — 보강 간섭과 상쇄 간섭</title>
  <desc id="d-phy-3-superposition">줄을 따라 마주 보고 다가오는 두 펄스가 만나는 순간 변위는 두 펄스의 변위를 더한 것이 된다. 마루와 마루가 만나면 진폭이 커지고(보강 간섭), 마루와 골이 만나면 0이 된다(상쇄 간섭). 만난 뒤 두 펄스는 원래 모양 그대로 지나간다.</desc>
  <style>
    .phy-3-superposition-lbl{font-size:14px;fill:var(--fig-ink)} .phy-3-superposition-sm{font-size:13px;fill:var(--fig-muted)} .phy-3-superposition-b{font-weight:600}
  </style>
