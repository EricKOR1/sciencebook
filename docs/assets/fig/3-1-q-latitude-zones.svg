<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="t-3-1-q-latitude-zones d-3-1-q-latitude-zones">
<title id="t-3-1-q-latitude-zones">그림 3-1-10 문제 14의 위도별 세 구역</title>
<desc id="d-3-1-q-latitude-zones">북반구를 옆에서 본 단면에 위도 30°선과 60°선으로 나눈 세 구역과, 각 구역이 1년 동안 흡수하는 태양 복사 에너지와 방출하는 지구 복사 에너지(상댓값)를 나타냈다. 굵은 화살표는 위도선을 넘어 고위도 쪽으로 운반되는 에너지이고 그 양은 묻는 값이다. 구역의 크기는 실제 넓이 비율과 다른 모식도이다.</desc>
<style>.f3-1-q-latitude-zones-t{font-size:14px;fill:var(--fig-ink)} .f3-1-q-latitude-zones-s{font-size:13px;fill:var(--fig-muted)} .f3-1-q-latitude-zones-b{font-size:15px;font-weight:700;fill:var(--fig-ink)} .f3-1-q-latitude-zones-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.5} .f3-1-q-latitude-zones-grid{fill:none;stroke:var(--fig-line);stroke-width:1} .f3-1-q-latitude-zones-ink{fill:var(--fig-ink)}</style>
