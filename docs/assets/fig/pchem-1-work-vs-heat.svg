  <desc id="d-pchem-1-work-vs-heat">왼쪽(일): 기체가 피스톤을 밀어 올리면 피스톤 위 주위의 원자들이 모두 같은 방향으로 가지런히 움직인다. 오른쪽(열): 뜨거운 계와 닿은 벽 너머 주위의 원자들이 제각각 다른 방향으로 무질서하게 더 세게 흔들린다. 모식도.</desc>
