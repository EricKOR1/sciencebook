<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-uchem-8-q-vs-k d-uchem-8-q-vs-k">
  <title id="t-uchem-8-q-vs-k">그림 일반화학 8-1 Q와 K의 비교로 정하는 반응 방향</title>
  <desc id="d-uchem-8-q-vs-k">로그 눈금 수직선 위에 수성 가스 전환 반응의 K = 4.0을 표시했다. 지금의 반응 지수 Q가 K보다 작으면 정반응이, 크면 역반응이 진행해 Q가 K로 다가간다. 예제 6의 혼합물(Q = 3.3)과 예제 10에서 수증기를 더 넣은 직후(Q = 2.35)는 모두 K의 왼쪽에 있어 정반응이 진행한다.</desc>
