  <text x="660" y="230" text-anchor="end" class="uchem-8-q-vs-k-t">반응 지수 Q (로그 눈금)</text>
  <line x1="450.3" y1="102" x2="450.3" y2="194" style="stroke:var(--fig-ink);stroke-width:2.5"/>
  <text x="450.3" y="96" text-anchor="middle" class="uchem-8-q-vs-k-t" style="font-weight:700">K = 4.0 (평형, Q = K)</text>
  <text x="255.2" y="34" text-anchor="middle" class="uchem-8-q-vs-k-h" style="fill:var(--fig-blue)">Q &lt; K : 정반응 진행</text>
  <text x="255.2" y="52" text-anchor="middle" class="uchem-8-q-vs-k-s">생성물이 늘어 Q가 커진다</text>
  <text x="565.2" y="34" text-anchor="middle" class="uchem-8-q-vs-k-h" style="fill:var(--fig-red)">Q &gt; K : 역반응 진행</text>
  <text x="565.2" y="52" text-anchor="middle" class="uchem-8-q-vs-k-s">반응물이 늘어 Q가 작아진다</text>
  <circle cx="437.8" cy="150" r="6" style="fill:var(--fig-blue);stroke:var(--fig-panel);stroke-width:1.5"/>
  <circle cx="415.7" cy="150" r="6" style="fill:var(--fig-blue);stroke:var(--fig-panel);stroke-width:1.5"/>
