  <text x="360" y="256" text-anchor="middle" class="uchem-8-q-vs-k-t" style="font-weight:600">속도론으로 보면  v정 / v역 = K / Q</text>
  <text x="360" y="278" text-anchor="middle" class="uchem-8-q-vs-k-s">Q &lt; K이면 정반응이 더 빠르고, Q &gt; K이면 역반응이 더 빠르다. 어느 쪽이든 Q는 K로 다가간다.</text>
