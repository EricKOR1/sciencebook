<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" class="fig-small" role="img" aria-labelledby="t-uchem-4-q-h-absorption d-uchem-4-q-h-absorption">
  <title id="t-uchem-4-q-h-absorption">그림 일반화학 4-12 문제 10 해설 — 656.3 nm 흡수선과 방출선</title>
  <desc id="d-uchem-4-q-h-absorption">수소 원자의 에너지 준위(세로축은 에너지에 비례). 656.3 nm의 흡수(위로)와 방출(아래로)은 모두 n = 2와 n = 3 사이의 전이이고 간격은 1.89 eV이다. 바닥상태(n = 1)에서 n = 2로 올라가려면 10.2 eV(121.5 nm 자외선)가 필요하다.</desc>
  <style>
    .uchem-4-q-h-absorption-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-4-q-h-absorption-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-4-q-h-absorption-b{font-size:15px;fill:var(--fig-ink);font-weight:bold}
    .uchem-4-q-h-absorption-ax{stroke:var(--fig-ink);stroke-width:1.3;fill:none}
    .uchem-4-q-h-absorption-gr{stroke:var(--fig-line);stroke-width:0.7;fill:none;stroke-dasharray:3 3}
    .uchem-4-q-h-absorption-ln{stroke:var(--fig-ink);stroke-width:2;fill:none}
    .uchem-4-q-h-absorption-lv{stroke:var(--fig-ink);stroke-width:2.2;fill:none}
    .uchem-4-q-h-absorption-bl{stroke:var(--fig-blue);stroke-width:2.4;fill:none}
    .uchem-4-q-h-absorption-rd{stroke:var(--fig-red);stroke-width:2.4;fill:none}
    .uchem-4-q-h-absorption-gn{stroke:var(--fig-green);stroke-width:2.4;fill:none}
    .uchem-4-q-h-absorption-am{stroke:var(--fig-amber);stroke-width:2.4;fill:none}
    .uchem-4-q-h-absorption-dash{stroke:var(--fig-muted);stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    .uchem-4-q-h-absorption-fink{fill:var(--fig-ink)} .uchem-4-q-h-absorption-fbl{fill:var(--fig-blue)} .uchem-4-q-h-absorption-frd{fill:var(--fig-red)}
    .uchem-4-q-h-absorption-fgn{fill:var(--fig-green)} .uchem-4-q-h-absorption-fam{fill:var(--fig-amber)} .uchem-4-q-h-absorption-fmu{fill:var(--fig-muted)}
    .uchem-4-q-h-absorption-box{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.4}
    .uchem-4-q-h-absorption-sb{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6}
    .uchem-4-q-h-absorption-sr{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.6}
    .uchem-4-q-h-absorption-sg{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.6}
    .uchem-4-q-h-absorption-sa{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.6}
    .uchem-4-q-h-absorption-sv{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.6}
    .uchem-4-q-h-absorption-st{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.6}
  </style>
  <line x1="70.0" y1="360.0" x2="330.0" y2="360.0" class="uchem-4-q-h-absorption-lv"/>
  <text x="340.0" y="365.0" text-anchor="start" class="uchem-4-q-h-absorption-t"><tspan dy="0">n = 1</tspan></text>
  <text x="62.0" y="365.0" text-anchor="end" class="uchem-4-q-h-absorption-s"><tspan dy="0">−13.60</tspan></text>
  <line x1="70.0" y1="127.5" x2="330.0" y2="127.5" class="uchem-4-q-h-absorption-lv"/>
  <text x="340.0" y="132.5" text-anchor="start" class="uchem-4-q-h-absorption-t"><tspan dy="0">n = 2</tspan></text>
  <text x="62.0" y="132.5" text-anchor="end" class="uchem-4-q-h-absorption-s"><tspan dy="0">−3.40</tspan></text>
  <line x1="70.0" y1="84.4" x2="330.0" y2="84.4" class="uchem-4-q-h-absorption-lv"/>
  <text x="340.0" y="89.4" text-anchor="start" class="uchem-4-q-h-absorption-t"><tspan dy="0">n = 3</tspan></text>
  <text x="62.0" y="89.4" text-anchor="end" class="uchem-4-q-h-absorption-s"><tspan dy="0">−1.51</tspan></text>
  <line x1="70.0" y1="69.4" x2="330.0" y2="69.4" class="uchem-4-q-h-absorption-lv"/>
  <text x="340.0" y="74.4" text-anchor="start" class="uchem-4-q-h-absorption-t"><tspan dy="0">n = 4</tspan></text>
  <text x="62.0" y="74.4" text-anchor="end" class="uchem-4-q-h-absorption-s"><tspan dy="0">−0.85</tspan></text>
  <line x1="70.0" y1="50.0" x2="330.0" y2="50.0" class="uchem-4-q-h-absorption-dash"/>
  <text x="340.0" y="55.0" text-anchor="start" class="uchem-4-q-h-absorption-t"><tspan dy="0">n = ∞</tspan></text>
  <text x="62.0" y="55.0" text-anchor="end" class="uchem-4-q-h-absorption-s"><tspan dy="0">0</tspan></text>
  <text x="20.0" y="30.0" text-anchor="start" class="uchem-4-q-h-absorption-s"><tspan dy="0">E(eV)</tspan></text>
  <line x1="110.0" y1="358.0" x2="110.0" y2="139.5" class="uchem-4-q-h-absorption-dash"/>
  <path d="M110.0 129.5 L115.0 139.5 L105.0 139.5 Z" class="uchem-4-q-h-absorption-fmu"/>
  <text x="120.0" y="250.0" text-anchor="start" class="uchem-4-q-h-absorption-s"><tspan dy="0">10.2 eV</tspan></text>
  <text x="120.0" y="268.0" text-anchor="start" class="uchem-4-q-h-absorption-s"><tspan dy="0">(121.5 nm, 자외선)</tspan></text>
  <line x1="230.0" y1="125.5" x2="230.0" y2="95.4" class="uchem-4-q-h-absorption-bl"/>
  <path d="M230.0 86.4 L235.0 95.4 L225.0 95.4 Z" class="uchem-4-q-h-absorption-fbl"/>
  <line x1="290.0" y1="86.4" x2="290.0" y2="116.5" class="uchem-4-q-h-absorption-rd"/>
  <path d="M290.0 125.5 L285.0 116.5 L295.0 116.5 Z" class="uchem-4-q-h-absorption-frd"/>
  <text x="230.0" y="128.0" text-anchor="middle" class="uchem-4-q-h-absorption-t"><tspan dy="0">흡수</tspan></text>
  <text x="290.0" y="128.0" text-anchor="middle" class="uchem-4-q-h-absorption-t"><tspan dy="0">방출</tspan></text>
  <text x="260.0" y="112.0" text-anchor="middle" class="uchem-4-q-h-absorption-s"><tspan dy="0">656.3 nm (1.89 eV)</tspan></text>
</svg>
