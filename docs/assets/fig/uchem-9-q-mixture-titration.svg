  <title id="t-uchem-9-q-mixture-titration">그림 일반화학 9-11 문제 16 — NaOH와 Na₂CO₃ 혼합물의 적정</title>
  <desc id="d-uchem-9-q-mixture-titration">시료(NaOH 1.80 mmol, Na₂CO₃ 1.20 mmol) 25.0 mL를 0.100 M HCl로 적정한 곡선을 전하 균형으로 계산했다(생긴 CO₂는 H₂CO₃로 남는다고 가정). 0~18.0 mL에서 OH⁻, 18.0~30.0 mL에서 CO₃²⁻ → HCO₃⁻가 중화되어 30.0 mL에서 페놀프탈레인이 무색이 되고, 30.0~42.0 mL에서 HCO₃⁻ → H₂CO₃가 되어 42.0 mL에서 메틸 오렌지가 변색한다. 18.0 mL에는 뚜렷한 꺾임이 없다.</desc>
