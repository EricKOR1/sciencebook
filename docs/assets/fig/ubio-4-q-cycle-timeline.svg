<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-labelledby="t-ubio-4-q-cycle-timeline d-ubio-4-q-cycle-timeline">
  <title id="t-ubio-4-q-cycle-timeline">그림 일반생명과학 4-13 문제 16 해설: 5시간 동안 M기에 들어와 쌓이는 세포</title>
  <desc id="d-ubio-4-q-cycle-timeline">20시간 세포 주기를 띠로 편 모식도(G₁ 9, S 6, G₂ 4, M 1시간). 세포가 시간에 고르게 흩어져 있으므로 띠의 길이가 세포 비율이다. 약물을 넣은 뒤 5시간 동안 M기 바로 앞 5시간 구간(25%)의 세포가 M기로 들어와 멈추고, 처음부터 M기에 있던 5%와 더해 분열 지수가 30%가 된다.</desc>
  <style>.ubio-4-q-cycle-timeline-t{font-size:14px;fill:var(--fig-ink)} .ubio-4-q-cycle-timeline-s{font-size:13px;fill:var(--fig-muted)} .ubio-4-q-cycle-timeline-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .ubio-4-q-cycle-timeline-b{font-size:14px;font-weight:700;fill:var(--fig-ink)} .ubio-4-q-cycle-timeline-r{font-size:14px;font-weight:700;fill:var(--fig-red)} .ubio-4-q-cycle-timeline-bl{font-size:14px;font-weight:700;fill:var(--fig-blue)} .ubio-4-q-cycle-timeline-g{font-size:14px;font-weight:700;fill:var(--fig-green)} .ubio-4-q-cycle-timeline-a{font-size:14px;font-weight:700;fill:var(--fig-amber)} .ubio-4-q-cycle-timeline-v{font-size:14px;font-weight:700;fill:var(--fig-violet)} .ubio-4-q-cycle-timeline-sq{font-size:15px;font-weight:600;fill:var(--fig-ink)}</style>
  <rect x="40.0" y="90.0" width="288.0" height="36.0" rx="0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6"/>
  <text x="184.0" y="114.0" text-anchor="middle" class="ubio-4-q-cycle-timeline-b">G₁ 9 h</text>
  <rect x="328.0" y="90.0" width="192.0" height="36.0" rx="0" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.6"/>
  <text x="424.0" y="114.0" text-anchor="middle" class="ubio-4-q-cycle-timeline-b">S 6 h</text>
  <rect x="520.0" y="90.0" width="128.0" height="36.0" rx="0" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.6"/>
  <text x="584.0" y="114.0" text-anchor="middle" class="ubio-4-q-cycle-timeline-b">G₂ 4 h</text>
  <rect x="648.0" y="90.0" width="32.0" height="36.0" rx="0" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.6"/>
  <text x="664.0" y="114.0" text-anchor="middle" class="ubio-4-q-cycle-timeline-b">M</text>
  <line x1="40.0" y1="126.0" x2="40.0" y2="132.0" style="stroke:var(--fig-ink);stroke-width:1.2"/>
  <text x="40.0" y="148.0" text-anchor="middle" class="ubio-4-q-cycle-timeline-s">0 h</text>
  <line x1="200.0" y1="126.0" x2="200.0" y2="132.0" style="stroke:var(--fig-ink);stroke-width:1.2"/>
  <text x="200.0" y="148.0" text-anchor="middle" class="ubio-4-q-cycle-timeline-s">5 h</text>
  <line x1="360.0" y1="126.0" x2="360.0" y2="132.0" style="stroke:var(--fig-ink);stroke-width:1.2"/>
  <text x="360.0" y="148.0" text-anchor="middle" class="ubio-4-q-cycle-timeline-s">10 h</text>
  <line x1="520.0" y1="126.0" x2="520.0" y2="132.0" style="stroke:var(--fig-ink);stroke-width:1.2"/>
  <text x="520.0" y="148.0" text-anchor="middle" class="ubio-4-q-cycle-timeline-s">15 h</text>
  <line x1="680.0" y1="126.0" x2="680.0" y2="132.0" style="stroke:var(--fig-ink);stroke-width:1.2"/>
  <text x="680.0" y="148.0" text-anchor="middle" class="ubio-4-q-cycle-timeline-s">20 h</text>
  <path d="M488.0,82 L488.0,72 L648.0,72 L648.0,82" style="fill:none;stroke:var(--fig-amber);stroke-width:2"/>
  <text x="568.0" y="64.0" text-anchor="middle" class="ubio-4-q-cycle-timeline-a">5시간 안에 M기로 들어오는 세포: 5/20 = 25%</text>
  <text x="664.0" y="172.0" text-anchor="end" class="ubio-4-q-cycle-timeline-r">처음 M기 5%</text>
  <line x1="664.0" y1="156.0" x2="664.0" y2="128.0" style="stroke:var(--fig-red);stroke-width:1.2"/>
  <text x="680.0" y="206.0" text-anchor="end" class="ubio-4-q-cycle-timeline-b">5시간 뒤 분열 지수 = 5% + 25% = 30%</text>
  <text x="40.0" y="206.0" text-anchor="start" class="ubio-4-q-cycle-timeline-s">세포는 띠를 따라 오른쪽으로 진행 →</text>
</svg>
