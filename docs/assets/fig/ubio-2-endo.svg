<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" role="img" aria-labelledby="t-ubio-2-endo d-ubio-2-endo">
  <title id="t-ubio-2-endo">그림 일반생명과학 2-1 내막계를 따라가는 단백질의 경로</title>
  <desc id="d-ubio-2-endo">핵막과 이어진 거친면 소포체의 리보솜에서 단백질이 합성되어 접히고 당 사슬이 붙는다. 수송 소낭이 골지체 시스면으로 옮기고, 단백질은 트랜스면 쪽으로 가며 가공된 뒤 분비 소낭(외포 작용), 세포막의 막 단백질, 리소좀으로 분류되어 배송된다. 내포 작용으로 들어온 물질은 리소좀으로 가서 분해된다. 크기 비율은 모식적이다.</desc>
