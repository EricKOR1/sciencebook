<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-labelledby="t-ubio-9-chordate-traits d-ubio-9-chordate-traits">
<title id="t-ubio-9-chordate-traits">그림 일반생명과학 9-7 척삭동물의 네 가지 공유 파생 형질</title>
<desc id="d-ubio-9-chordate-traits">창고기와 비슷한 척삭동물의 옆모습. 등 쪽을 따라 속이 빈 신경관이 있고, 그 아래에 몸을 지탱하는 척삭이 있다. 인두 벽에는 인두 틈이 줄지어 있고, 꼬리는 항문보다 뒤로 뻗어 있다(항문 뒤 꼬리). 근육은 마디로 반복된다. 모식도이다.</desc>
