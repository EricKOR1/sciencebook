<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-ochem-2-ring-flip-exchange d-ochem-2-ring-flip-exchange">
  <title id="t-ochem-2-ring-flip-exchange">그림 유기화학 2-15 고리 뒤집힘에서 축 결합과 적도 결합의 교환</title>
  <desc id="d-ochem-2-ring-flip-exchange">왼쪽 의자 형태에서 C1의 축 결합(위, 파란 Hₐ)과 적도 결합(약간 아래, 빨간 Hₑ). 고리 뒤집힘(장벽 약 45 kJ/mol, 25 ℃에서 1초에 약 10⁵번) 뒤 오른쪽 의자에서는 같은 C1의 파란 H가 적도(약간 위)로, 빨간 H가 축(아래)으로 바뀐다. 파란 H는 뒤집힌 뒤에도 위쪽을 향한다(위는 위로 남는다).</desc>
