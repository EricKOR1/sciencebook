  <title id="t-uphy-5-q-t2-vs-l">그림 일반물리학 5-13 문제 14 해설 — T²–L 그래프</title>
  <desc id="d-uphy-5-q-t2-vs-l">측정한 네 점의 T²을 L에 대해 그리면 직선 T² = 4.03(L + 0.020)에 놓인다. 기울기 4.03 s²/m에서 g = 4π²/기울기 = 9.80 m/s²이고, 직선은 L축과 L ≈ −0.020 m에서 만난다(추의 반지름만큼 길이를 짧게 잰 계통 오차).</desc>
