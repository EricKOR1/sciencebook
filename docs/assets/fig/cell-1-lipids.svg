<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-cell-1-lipids d-cell-1-lipids">
  <title id="t-cell-1-lipids">그림 세포와 물질대사 1-1 지질의 기본 구조(간단한 형태)</title>
  <desc id="d-cell-1-lipids">중성 지방은 글리세롤 1분자에 지방산 3분자가 결합하며, 지방산 사슬에 이중 결합이 있으면 사슬이 꺾여 불포화 지방산이 된다. 인지질은 인산이 포함된 친수성 머리와 지방산 2개로 된 소수성 꼬리를 가진다. 스테로이드는 탄소 고리 4개가 붙은 구조이다. 화학식 대신 모양으로 나타낸 모식도.</desc>
  <style>.cell-1-lipids-t{font-size:14px;fill:var(--fig-ink)} .cell-1-lipids-s{font-size:13px;fill:var(--fig-muted)} .cell-1-lipids-b{font-size:15px;fill:var(--fig-ink);font-weight:600} .cell-1-lipids-bs{font-size:14px;fill:var(--fig-ink);font-weight:600} .cell-1-lipids-g{font-size:14px;fill:var(--fig-green);font-weight:600} .cell-1-lipids-r{font-size:14px;fill:var(--fig-red);font-weight:600} .cell-1-lipids-bl{font-size:14px;fill:var(--fig-blue);font-weight:600} .cell-1-lipids-am{font-size:14px;fill:var(--fig-amber);font-weight:600} .cell-1-lipids-vi{font-size:14px;fill:var(--fig-violet);font-weight:600} .cell-1-lipids-te{font-size:14px;fill:var(--fig-teal);font-weight:600}</style>
