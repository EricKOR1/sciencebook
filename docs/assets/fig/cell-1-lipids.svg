  <text x="120.0" y="290.0" text-anchor="middle" class="cell-1-lipids-s">에너지 저장</text>
  <text x="360.0" y="290.0" text-anchor="middle" class="cell-1-lipids-s">세포막</text>
  <text x="600.0" y="290.0" text-anchor="middle" class="cell-1-lipids-s">막 유동성 조절 · 호르몬</text>
