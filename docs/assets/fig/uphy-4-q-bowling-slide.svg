  <title id="t-uphy-4-q-bowling-slide">그림 일반물리학 4-16 문제 18 해설 — 미끄러지는 볼링공에 작용하는 힘</title>
  <desc id="d-uphy-4-q-bowling-slide">(가) 던진 직후 공은 회전 없이 8.0 m/s로 미끄러진다. 접촉점에서 뒤쪽으로 작용하는 운동 마찰력 f가 병진 운동을 늦추고, 질량 중심에 대해 시계 방향 토크를 만들어 각가속도 α를 준다. (나) v = Rω가 되는 약 2.3 s 뒤부터는 5.7 m/s로 미끄러짐 없이 구르고 마찰력이 사라진다. 속도 화살표의 길이는 속력에 비례하고, 힘 화살표의 길이는 크기와 무관하다(f는 Mg의 0.10배).</desc>
