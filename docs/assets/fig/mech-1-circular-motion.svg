  <circle cx="150.0" cy="200.0" r="3.5" style="fill:var(--fig-ink);stroke:none;stroke-width:1.5"/>
  <text x="156.0" y="218.0" style="font-size:13px;fill:var(--fig-muted)">중심</text>
