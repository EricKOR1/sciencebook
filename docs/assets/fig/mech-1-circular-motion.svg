<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-mech-1-circular-motion d-mech-1-circular-motion">
  <title id="t-mech-1-circular-motion">그림 역학과 에너지 1-7 등속 원운동의 속도·가속도와 줄이 끊어진 뒤의 운동</title>
  <desc id="d-mech-1-circular-motion">(가) 등속 원운동에서 속도는 늘 원의 접선 방향, 가속도는 늘 원의 중심 방향이다. (나) 이웃한 두 순간의 속도 v₁, v₂의 꼬리를 모으면 속도 변화 Δv가 원의 중심 쪽을 향한다. (다) 줄이 끊어지면 공은 바깥쪽이 아니라 끊어진 순간의 속도 방향인 접선 방향으로 곧게 날아간다.</desc>
  <text x="20.0" y="34.0" style="font-size:15px;fill:var(--fig-ink);font-weight:600">(가) 속도와 가속도</text>
