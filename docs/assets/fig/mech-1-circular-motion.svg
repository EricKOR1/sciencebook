  <circle cx="653.0" cy="141.0" r="6.0" style="fill:none;stroke:var(--fig-amber);stroke-width:1.5;stroke-dasharray:3 2"/>
  <circle cx="653.0" cy="99.0" r="6.0" style="fill:none;stroke:var(--fig-amber);stroke-width:1.5;stroke-dasharray:3 2"/>
  <line x1="653.0" y1="225.0" x2="653.0" y2="77.0" style="stroke:var(--fig-blue);stroke-width:3;fill:none"/>
  <path d="M653.0 66.0 L658.5 77.0 L647.5 77.0 Z" style="fill:var(--fig-blue);stroke:none"/>
  <circle cx="653.0" cy="225.0" r="7.0" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <text x="645.0" y="70.0" text-anchor="end" style="font-size:14px;fill:var(--fig-green);font-weight:600">접선 방향 ○</text>
  <line x1="661.0" y1="247.0" x2="683.0" y2="247.0" style="stroke:var(--fig-line);stroke-width:2;fill:none;stroke-dasharray:4 3"/>
  <path d="M691.0 247.0 L683.0 251.0 L683.0 243.0 Z" style="fill:var(--fig-line);stroke:none"/>
  <text x="676.0" y="273.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-red)">바깥쪽 ✕</text>
