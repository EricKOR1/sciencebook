  <text x="365.0" y="130.0" style="font-size:15px;fill:var(--fig-blue);font-weight:600">v₁</text>
  <text x="386.4" y="181.5" style="font-size:15px;fill:var(--fig-violet);font-weight:600">v₂</text>
  <text x="317.0" y="174.8" text-anchor="end" style="font-size:15px;fill:var(--fig-red);font-weight:600">Δv</text>
  <text x="375.0" y="230.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-muted)">두 속도의 꼬리를 모으면</text>
  <text x="375.0" y="248.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-muted)">Δv = v₂ − v₁ 은 그 사이 순간에</text>
  <text x="375.0" y="266.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-muted)">원의 중심을 향한다</text>
  <text x="500.0" y="34.0" style="font-size:15px;fill:var(--fig-ink);font-weight:600">(다) 줄이 끊어지면</text>
