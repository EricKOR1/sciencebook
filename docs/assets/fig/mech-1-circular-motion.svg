  <text x="212.0" y="87.0" style="font-size:14px;fill:var(--fig-blue);font-weight:600">v (접선 방향)</text>
  <text x="164.0" y="145.0" style="font-size:14px;fill:var(--fig-red);font-weight:600">a (중심 방향)</text>
  <text x="150.0" y="340.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-muted)">속력 일정, 방향만 변함 · a = v²/r</text>
  <text x="300.0" y="34.0" style="font-size:15px;fill:var(--fig-ink);font-weight:600">(나) 속도 변화 Δv</text>
