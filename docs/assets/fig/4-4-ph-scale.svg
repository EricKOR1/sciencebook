<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" role="img" aria-labelledby="t-4-4-ph-scale d-4-4-ph-scale">
  <title id="t-4-4-ph-scale">그림 4-4-2 pH 눈금과 생활 속 물질의 pH</title>
  <desc id="d-4-4-ph-scale">pH 7은 중성, 7보다 작으면 산성, 크면 염기성이다. 위액·레몬즙·식초는 산성, 혈액·바닷물·비눗물·하수구 세정제는 염기성 쪽에 있다(대략적인 값).</desc>
  <style>
    .ph-a1{fill:var(--fig-soft-red)} .ph-a2{fill:var(--fig-soft-amber)} .ph-n{fill:var(--fig-soft-green)} .ph-b1{fill:var(--fig-soft-blue)} .ph-b2{fill:var(--fig-soft-violet)}
    .ph-frame{fill:none;stroke:var(--fig-line);stroke-width:1.5}
    .ph-num{font-size:13px;fill:var(--fig-ink)}
    .ph-name{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .ph-val{font-size:12.5px;fill:var(--fig-muted)}
    .ph-lead{stroke:var(--fig-muted);stroke-width:1.2}
    .ph-dot{fill:var(--fig-ink)}
    .ph-rng{stroke:var(--fig-ink);stroke-width:3;stroke-linecap:round}
    .ph-acid{font-size:14px;font-weight:700;fill:var(--fig-red)}
    .ph-base{font-size:14px;font-weight:700;fill:var(--fig-blue)}
    .ph-neu{font-size:14px;font-weight:700;fill:var(--fig-green)}
    .ph-arrow-r{stroke:var(--fig-red);stroke-width:2;fill:none} .ph-arrow-rh{fill:var(--fig-red)}
    .ph-arrow-b{stroke:var(--fig-blue);stroke-width:2;fill:none} .ph-arrow-bh{fill:var(--fig-blue)}
    .ph-note{font-size:13px;fill:var(--fig-muted)}
  </style>
  <rect x="45" y="170" width="135" height="34" class="ph-a1"/>
  <rect x="180" y="170" width="157.5" height="34" class="ph-a2"/>
  <rect x="337.5" y="170" width="45.0" height="34" class="ph-n"/>
  <rect x="382.5" y="170" width="157.5" height="34" class="ph-b1"/>
  <rect x="540" y="170" width="135" height="34" class="ph-b2"/>
  <rect x="45" y="170" width="630" height="34" rx="4" class="ph-frame"/>
  <line x1="45" y1="196" x2="45" y2="204" class="ph-lead"/>
  <text x="45" y="189" text-anchor="middle" class="ph-num">0</text>
  <line x1="90" y1="196" x2="90" y2="204" class="ph-lead"/>
  <text x="90" y="189" text-anchor="middle" class="ph-num">1</text>
  <line x1="135" y1="196" x2="135" y2="204" class="ph-lead"/>
  <text x="135" y="189" text-anchor="middle" class="ph-num">2</text>
  <line x1="180" y1="196" x2="180" y2="204" class="ph-lead"/>
  <text x="180" y="189" text-anchor="middle" class="ph-num">3</text>
  <line x1="225" y1="196" x2="225" y2="204" class="ph-lead"/>
  <text x="225" y="189" text-anchor="middle" class="ph-num">4</text>
  <line x1="270" y1="196" x2="270" y2="204" class="ph-lead"/>
  <text x="270" y="189" text-anchor="middle" class="ph-num">5</text>
  <line x1="315" y1="196" x2="315" y2="204" class="ph-lead"/>
  <text x="315" y="189" text-anchor="middle" class="ph-num">6</text>
  <line x1="360" y1="196" x2="360" y2="204" class="ph-lead"/>
  <text x="360" y="189" text-anchor="middle" class="ph-num">7</text>
  <line x1="405" y1="196" x2="405" y2="204" class="ph-lead"/>
  <text x="405" y="189" text-anchor="middle" class="ph-num">8</text>
  <line x1="450" y1="196" x2="450" y2="204" class="ph-lead"/>
  <text x="450" y="189" text-anchor="middle" class="ph-num">9</text>
  <line x1="495" y1="196" x2="495" y2="204" class="ph-lead"/>
  <text x="495" y="189" text-anchor="middle" class="ph-num">10</text>
  <line x1="540" y1="196" x2="540" y2="204" class="ph-lead"/>
  <text x="540" y="189" text-anchor="middle" class="ph-num">11</text>
  <line x1="585" y1="196" x2="585" y2="204" class="ph-lead"/>
  <text x="585" y="189" text-anchor="middle" class="ph-num">12</text>
  <line x1="630" y1="196" x2="630" y2="204" class="ph-lead"/>
  <text x="630" y="189" text-anchor="middle" class="ph-num">13</text>
  <line x1="675" y1="196" x2="675" y2="204" class="ph-lead"/>
  <text x="675" y="189" text-anchor="middle" class="ph-num">14</text>
  <line x1="112.5" y1="156" x2="112.5" y2="170" class="ph-lead"/>
  <text x="112.5" y="132" text-anchor="middle" class="ph-name">위액</text>
  <text x="112.5" y="149" text-anchor="middle" class="ph-val">pH 약 1~2</text>
  <line x1="93" y1="166" x2="132" y2="166" class="ph-rng"/>
  <line x1="180" y1="112" x2="180" y2="170" class="ph-lead"/>
  <text x="180" y="88" text-anchor="middle" class="ph-name">식초·탄산음료</text>
  <text x="180" y="105" text-anchor="middle" class="ph-val">pH 약 3</text>
  <circle cx="180" cy="166" r="3.5" class="ph-dot"/>
  <line x1="297.0" y1="156" x2="297.0" y2="170" class="ph-lead"/>
  <text x="297.0" y="132" text-anchor="middle" class="ph-name">오염되지 않은 빗물</text>
  <text x="297.0" y="149" text-anchor="middle" class="ph-val">pH 약 5.6</text>
  <circle cx="297.0" cy="166" r="3.5" class="ph-dot"/>
  <line x1="378.0" y1="112" x2="378.0" y2="170" class="ph-lead"/>
  <text x="378.0" y="88" text-anchor="middle" class="ph-name">사람의 혈액</text>
  <text x="378.0" y="105" text-anchor="middle" class="ph-val">pH 약 7.4</text>
  <circle cx="378.0" cy="166" r="3.5" class="ph-dot"/>
  <line x1="427.5" y1="68" x2="427.5" y2="170" class="ph-lead"/>
  <text x="427.5" y="44" text-anchor="middle" class="ph-name">베이킹 소다 수용액</text>
  <text x="427.5" y="61" text-anchor="middle" class="ph-val">pH 약 8~9</text>
  <line x1="408" y1="166" x2="447" y2="166" class="ph-rng"/>
  <line x1="472.5" y1="156" x2="472.5" y2="170" class="ph-lead"/>
  <text x="472.5" y="132" text-anchor="middle" class="ph-name">비눗물</text>
  <text x="472.5" y="149" text-anchor="middle" class="ph-val">pH 약 9~10</text>
  <line x1="453" y1="166" x2="492" y2="166" class="ph-rng"/>
  <line x1="652.5" y1="156" x2="652.5" y2="170" class="ph-lead"/>
  <text x="652.5" y="132" text-anchor="middle" class="ph-name">하수구 세정제</text>
  <text x="652.5" y="149" text-anchor="middle" class="ph-val">pH 약 13~14</text>
  <line x1="633" y1="166" x2="672" y2="166" class="ph-rng"/>
  <line x1="135" y1="204" x2="135" y2="220" class="ph-lead"/>
  <text x="135" y="236" text-anchor="middle" class="ph-name">레몬즙</text>
  <text x="135" y="253" text-anchor="middle" class="ph-val">pH 약 2</text>
  <circle cx="135" cy="208" r="3.5" class="ph-dot"/>
  <line x1="270" y1="204" x2="270" y2="220" class="ph-lead"/>
  <text x="270" y="236" text-anchor="middle" class="ph-name">커피</text>
  <text x="270" y="253" text-anchor="middle" class="ph-val">pH 약 5</text>
  <circle cx="270" cy="208" r="3.5" class="ph-dot"/>
  <line x1="360" y1="204" x2="360" y2="220" class="ph-lead"/>
  <text x="360" y="236" text-anchor="middle" class="ph-name">순수한 물</text>
  <text x="360" y="253" text-anchor="middle" class="ph-val">pH 7</text>
  <circle cx="360" cy="208" r="3.5" class="ph-dot"/>
  <line x1="405" y1="204" x2="405" y2="264" class="ph-lead"/>
  <text x="405" y="280" text-anchor="middle" class="ph-name">바닷물</text>
  <text x="405" y="297" text-anchor="middle" class="ph-val">pH 약 8</text>
  <circle cx="405" cy="208" r="3.5" class="ph-dot"/>
  <line x1="315" y1="332" x2="53" y2="332" class="ph-arrow-r"/><path d="M45 332 l10 -6 v12 z" class="ph-arrow-rh"/>
  <text x="180" y="324" text-anchor="middle" class="ph-acid">산성 (H⁺가 많을수록 pH 작음)</text>
  <text x="360" y="337" text-anchor="middle" class="ph-neu">중성</text>
  <line x1="405" y1="332" x2="667" y2="332" class="ph-arrow-b"/><path d="M675 332 l-10 -6 v12 z" class="ph-arrow-bh"/>
  <text x="540" y="324" text-anchor="middle" class="ph-base">염기성</text>
  <text x="360" y="370" text-anchor="middle" class="ph-note">pH가 1 작아지면 H⁺의 농도는 10배 커진다 · 25 °C 기준, 물질의 pH는 대략적인 값</text>
</svg>
