<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="t-ubio-13-cycles d-ubio-13-cycles">
  <title id="t-ubio-13-cycles">그림 일반생명과학 13-3 탄소·질소·인 순환의 비교</title>
  <desc id="d-ubio-13-cycles">탄소는 대기 CO₂를 광합성으로 직접 얻고 호흡·분해·연소로 돌려준다. 질소는 대기 N₂가 가장 큰 저장고이지만 세균의 질소 고정을 거쳐야 생물이 쓰며, 암모니아화·질산화·탈질소화로 형태가 바뀐다. 인은 기체 단계가 거의 없어 암석의 풍화에서 나오고 바다 퇴적물이 되면 지질학적 융기로만 육지에 돌아온다. 모식도이다.</desc>
  <style>.ubio-13-cycles-t{font-size:14px;fill:var(--fig-ink)} .ubio-13-cycles-s{font-size:13px;fill:var(--fig-muted)} .ubio-13-cycles-h{font-size:16px;fill:var(--fig-ink);font-weight:700} .ubio-13-cycles-a{font-size:13px;fill:var(--fig-ink)}</style>
  <rect x="12" y="10" width="224" height="384" rx="10" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1"/>
