  <text x="124" y="55" text-anchor="middle" class="ubio-13-cycles-s">대기가 바로 쓰이는 저장고</text>
  <rect x="248" y="10" width="224" height="384" rx="10" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1"/>
  <text x="360" y="36" text-anchor="middle" class="ubio-13-cycles-h">질소 순환</text>
  <text x="360" y="55" text-anchor="middle" class="ubio-13-cycles-s">대기에 많지만 세균을 거쳐야</text>
  <rect x="484" y="10" width="224" height="384" rx="10" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1"/>
