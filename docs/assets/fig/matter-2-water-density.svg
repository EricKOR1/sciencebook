  <path d="M471 96 L669 96 L666.5 150 L473.5 150 Z" style="fill:var(--fig-blue);opacity:0.10"/>
  <path d="M473.5 150 L666.5 150 L663.5 210 L476.5 210 Z" style="fill:var(--fig-blue);opacity:0.25"/>
