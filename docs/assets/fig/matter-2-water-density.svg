  <path d="M440 80 L470 80 L480 280 L660 280 L670 80 L700 80" style="fill:none;stroke:var(--fig-muted);stroke-width:2.5"/>
  <text x="570" y="93" text-anchor="middle" class="matter-2-water-density-t" style="font-weight:700;fill:var(--fig-teal)">얼음 0 °C</text>
  <text x="570" y="128" text-anchor="middle" class="matter-2-water-density-l">약 0 °C 물</text>
  <text x="570" y="186" text-anchor="middle" class="matter-2-water-density-l">0~4 °C 물</text>
  <text x="570" y="246" text-anchor="middle" class="matter-2-water-density-l" style="font-weight:700">약 4 °C 물 (가장 무거움)</text>
  <path d="M520 266 q14 -9 28 0 q-14 9 -28 0 Z M548 266 l9 -6 l0 12 Z" style="fill:var(--fig-amber)"/>
  <text x="570" y="304" text-anchor="middle" class="matter-2-water-density-t">얼음이 떠서 덮개 역할 → 물속 생물이 겨울을 난다</text>
</svg>
