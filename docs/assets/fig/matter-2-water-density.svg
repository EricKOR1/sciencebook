<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 362" role="img" aria-labelledby="t-matter-2-water-density d-matter-2-water-density">
  <title id="t-matter-2-water-density">그림 물질과 에너지 2-2 온도에 따른 물의 밀도와 겨울 호수</title>
  <desc id="d-matter-2-water-density">액체 물의 밀도는 약 4 °C에서 가장 크고, 그보다 차갑거나 따뜻하면 작아진다. 그래서 겨울 호수에서는 0 °C의 얼음이 수면에 뜨고 바로 아래는 0 °C에 가까운 물, 바닥에는 가장 무거운 약 4 °C의 물이 머물러 물고기가 겨울을 난다. 그래프 값은 대략적인 측정값이고, 호수 그림은 모식도이다.</desc>
  <style>
    .matter-2-water-density-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
    .matter-2-water-density-gr{fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4}
    .matter-2-water-density-l{font-size:14px;fill:var(--fig-ink)}
    .matter-2-water-density-t{font-size:13px;fill:var(--fig-muted)}
    .matter-2-water-density-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .matter-2-water-density-ink{fill:var(--fig-ink)}
  </style>
  <text x="230" y="26" text-anchor="middle" class="matter-2-water-density-h">(가) 물의 밀도(0~12 °C)</text>
  <line x1="92" y1="200" x2="370" y2="200" style="stroke:var(--fig-line);stroke-width:0.6;opacity:0.6"/>
  <line x1="92" y1="130" x2="370" y2="130" style="stroke:var(--fig-line);stroke-width:0.6;opacity:0.6"/>
  <line x1="92" y1="60" x2="370" y2="60" style="stroke:var(--fig-line);stroke-width:0.6;opacity:0.6"/>
  <path d="M92 46 L92 270 L382 270" class="matter-2-water-density-ax"/>
  <path d="M92 40 l-5 9 l10 0 z" class="matter-2-water-density-ink"/>
  <path d="M388 270 l-9 -5 l0 10 z" class="matter-2-water-density-ink"/>
  <text x="86" y="275" text-anchor="end" class="matter-2-water-density-t">0.9994</text>
  <text x="86" y="205" text-anchor="end" class="matter-2-water-density-t">0.9996</text>
  <text x="86" y="135" text-anchor="end" class="matter-2-water-density-t">0.9998</text>
  <text x="86" y="65" text-anchor="end" class="matter-2-water-density-t">1.0000</text>
  <text x="92" y="289" text-anchor="middle" class="matter-2-water-density-t">0</text>
  <text x="184.7" y="289" text-anchor="middle" class="matter-2-water-density-t">4</text>
  <text x="277.3" y="289" text-anchor="middle" class="matter-2-water-density-t">8</text>
  <text x="370" y="289" text-anchor="middle" class="matter-2-water-density-t">12</text>
  <text x="388" y="308" text-anchor="end" class="matter-2-water-density-l">온도(°C)</text>
  <text x="100" y="42" class="matter-2-water-density-l">밀도(g/cm³)</text>
