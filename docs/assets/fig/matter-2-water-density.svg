  <line x1="184.7" y1="69.8" x2="184.7" y2="270" style="stroke:var(--fig-red);stroke-width:1.4;stroke-dasharray:4 4"/>
  <circle cx="184.7" cy="69.8" r="5" style="fill:var(--fig-red)"/>
  <text x="192.7" y="59.8" class="matter-2-water-density-l" style="fill:var(--fig-red);font-weight:700">최대(약 4 °C)</text>
  <text x="230" y="334" text-anchor="middle" class="matter-2-water-density-t">얼음(0 °C)의 밀도는 약 0.917 g/cm³로</text>
  <text x="230" y="352" text-anchor="middle" class="matter-2-water-density-t">이 그래프의 범위보다 훨씬 작다</text>
  <text x="570" y="26" text-anchor="middle" class="matter-2-water-density-h">(나) 겨울 호수의 단면</text>
  <text x="570" y="54" text-anchor="middle" class="matter-2-water-density-t">찬 공기(영하)</text>
