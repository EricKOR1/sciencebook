<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-uphy-1-derivative-integral d-uphy-1-derivative-integral">
  <title id="t-uphy-1-derivative-integral">그림 일반물리학 1-4 도함수는 접선의 기울기, 정적분은 부호 있는 넓이</title>
  <desc id="d-uphy-1-derivative-integral">(가) x–t 그래프에서 점 P와 Q를 잇는 할선의 기울기 Δx/Δt는 Δt를 줄일수록 P에서의 접선 기울기 dx/dt에 다가간다. (나) v–t 그래프 아래를 폭 Δt인 띠로 나누어 v Δt를 모두 더하면 변위가 된다. 속도가 음수인 구간의 띠는 음수로 더해지므로 정적분은 이동 거리가 아니라 변위이다.</desc>
  <rect x="10.0" y="10.0" width="345.0" height="320.0" rx="10" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <rect x="365.0" y="10.0" width="345.0" height="320.0" rx="10" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
