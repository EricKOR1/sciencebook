  <text x="64.0" y="118.0" style="font-size:13px;fill:var(--fig-red);font-weight:600">접선 기울기 dx/dt</text>
  <text x="64.0" y="136.0" style="font-size:13px;fill:var(--fig-muted)">(그 순간의 속도)</text>
