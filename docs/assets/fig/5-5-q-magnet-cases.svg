  <title id="t-5-5-q-magnet-cases">그림 5-5-6 예제 1의 네 가지 실험</title>
  <desc id="d-5-5-q-magnet-cases">코일의 양 끝에 검류계를 연결하고 ㄱ~ㄹ처럼 자석과 코일을 놓거나 움직였다. 화살표는 운동 방향이며, ㄷ의 두 화살표는 자석과 코일이 같은 속도로 움직임을 뜻한다. 모식도.</desc>
