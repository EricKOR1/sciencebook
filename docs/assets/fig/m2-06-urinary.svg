<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-m2-06-urinary d-m2-06-urinary">
  <title id="t-m2-06-urinary">그림 중2-6-9 배설 기관의 위치</title>
  <desc id="d-m2-06-urinary">콩팥은 허리 뒤쪽 좌우에 하나씩 있다. 콩팥 동맥으로 들어온 혈액이 콩팥에서 걸러지고, 걸러진 혈액은 콩팥 정맥으로 나간다. 만들어진 오줌은 오줌관을 지나 방광에 모였다가 요도로 나간다. 몸을 앞에서 본 모식도이다.</desc>
  <style>.m2-06-urinary-t{font-size:14px;fill:var(--fig-ink)} .m2-06-urinary-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .m2-06-urinary-s{font-size:13px;fill:var(--fig-muted)} .m2-06-urinary-hd{font-size:15px;font-weight:700;fill:var(--fig-ink)} </style>
