  <title id="t-m3-04-q-coaster-ex5">그림 중3-4-7 예제 5의 롤러코스터 레일</title>
  <desc id="d-m3-04-q-coaster-ex5">마찰이 없는 롤러코스터 레일에서 A, B, C, D점의 위치와 높이를 나타낸 모식도. 각 점의 높이는 문제에 주어진 값이며 그림의 비율은 높이에 맞추었다.</desc>
