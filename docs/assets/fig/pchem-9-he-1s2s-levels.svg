  <title id="t-pchem-9-he-1s2s-levels">그림 물리화학 9-4 헬륨 1s¹2s¹ 배치의 에너지 갈라짐</title>
  <desc id="d-pchem-9-he-1s2s-levels">0차 에너지 E(1s) + E(2s) = −2.500 Eh에 쿨롱 적분 J = 0.420 Eh를 더하고, 교환 적분 K = 0.044 Eh만큼 위(¹S, 공간 대칭)와 아래(³S, 공간 반대칭)로 갈라진다. 세로 눈금은 실제 비율이다. 1차 섭동의 간격 2K = 2.39 eV는 실험값 0.80 eV의 약 3배이다.</desc>
