  <circle cx="620.0" cy="127.0" r="9.0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <circle cx="665.0" cy="172.0" r="9.0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <circle cx="570.0" cy="207.0" r="9.0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <circle cx="635.0" cy="222.0" r="9.0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <circle cx="675.0" cy="127.0" r="9.0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <circle cx="595.0" cy="172.0" r="10.0" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
