  <text x="110.0" y="294.0" text-anchor="middle" class="uchem-2-partial-pressures-t">N₂만 6개</text>
  <text x="110.0" y="312.0" text-anchor="middle" class="uchem-2-partial-pressures-s" style="font-size:13px">P(N₂) = 0.60 atm</text>
  <rect x="270.0" y="92.0" width="180.0" height="180.0" rx="6" style="fill:var(--fig-paper);stroke:var(--fig-ink);stroke-width:2"/>
  <circle cx="330.0" cy="48.0" r="22.0" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.8"/>
  <path d="M313 56 A18 18 0 1 1 347 56" style="fill:none;stroke:var(--fig-line);stroke-width:1.5"/>
  <line x1="330.0" y1="48.0" x2="318.9" y2="36.5" style="stroke:var(--fig-red);stroke-width:2.5"/>
  <circle cx="330.0" cy="48.0" r="3.0" style="fill:var(--fig-ink);stroke:none"/>
  <line x1="330.0" y1="70.0" x2="330.0" y2="82.0" style="stroke:var(--fig-ink);stroke-width:3"/>
  <text x="360.0" y="54.0" class="uchem-2-partial-pressures-b">0.30 atm</text>
  <circle cx="345.0" cy="172.0" r="10.0" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
  <circle cx="300.0" cy="247.0" r="10.0" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
  <circle cx="405.0" cy="257.0" r="10.0" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
  <text x="360.0" y="294.0" text-anchor="middle" class="uchem-2-partial-pressures-t">O₂만 3개</text>
  <text x="360.0" y="312.0" text-anchor="middle" class="uchem-2-partial-pressures-s" style="font-size:13px">P(O₂) = 0.30 atm</text>
