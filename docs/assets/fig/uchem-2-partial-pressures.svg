  <text x="610.0" y="294.0" text-anchor="middle" class="uchem-2-partial-pressures-t">섞으면 9개</text>
  <text x="610.0" y="312.0" text-anchor="middle" class="uchem-2-partial-pressures-s" style="font-size:13px">P = 0.60 + 0.30 = 0.90 atm</text>
  <text x="235.0" y="190.0" text-anchor="middle" class="uchem-2-partial-pressures-b" style="font-size:30px">+</text>
  <text x="485.0" y="190.0" text-anchor="middle" class="uchem-2-partial-pressures-b" style="font-size:30px">=</text>
  <text x="20.0" y="22.0" class="uchem-2-partial-pressures-s">세 용기 모두 같은 V, 같은 T</text>
</svg>
