  <title id="t-matter-4-order-halflife">그림 물질과 에너지 4-5 반응 차수에 따른 농도–시간 그래프와 반감기</title>
  <desc id="d-matter-4-order-halflife">처음 농도 0.80 M에서 출발한 0차·1차·2차 반응의 농도–시간 그래프이다. 농도가 절반이 되는 시각을 점으로 찍으면 1차 반응만 간격(반감기)이 10분으로 일정하고, 0차는 짧아지며 2차는 길어진다. 본문 표의 값이다.</desc>
