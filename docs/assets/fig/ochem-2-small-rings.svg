<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="t-ochem-2-small-rings d-ochem-2-small-rings">
  <title id="t-ochem-2-small-rings">그림 유기화학 2-11 작은 고리의 3차원 모양</title>
  <desc id="d-ochem-2-small-rings">(가) 사이클로프로페인: 세 탄소가 한 평면에 있는 삼각형이고, C–C 결합 하나를 따라 본 뉴먼 투영식에서 C–H가 모두 가려 있다. 핵 사이의 각은 60°이지만 sp³ 오비탈 사이의 각은 약 104°라서 오비탈이 결합 축 바깥쪽에서 겹친다(굽은 결합). (나) 사이클로뷰테인: 고리가 약 25° 접힌 주름진 형태이고 C–C–C 결합각은 약 88°이다. (다) 사이클로펜테인: 봉투 형태로, 네 탄소(옅은 사각형)가 한 평면에 있고 C1이 그 평면 위로 들려 있다. 모식도.</desc>
