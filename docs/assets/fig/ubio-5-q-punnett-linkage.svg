  <title id="t-ubio-5-q-punnett-linkage">그림 일반생명과학 5-12 문제 7 해설: 연관된 두 유전자의 교배표</title>
  <desc id="d-ubio-5-q-punnett-linkage">암컷(AB/ab, 20 cM)의 생식세포는 AB 0.4, ab 0.4, Ab 0.1, aB 0.1이고, 교차가 없는 수컷(AB/ab)의 생식세포는 AB 0.5, ab 0.5이다. 각 칸의 수는 두 생식세포 비율의 곱이며, aabb는 암컷 ab와 수컷 ab가 만난 칸 하나뿐이므로 0.4 × 0.5 = 0.20이다.</desc>
