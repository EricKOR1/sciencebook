  <title id="t-3-4-q-tennis-racket">그림 3-4-6 문제 10의 테니스공과 라켓</title>
  <desc id="d-3-4-q-tennis-racket">질량 0.06 kg인 테니스공이 오른쪽으로 20 m/s로 날아와 라켓에 맞은 뒤 왼쪽으로 30 m/s로 날아간다. 화살표 길이는 속력에 비례한다.</desc>
