<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-umath-7-diffusion-spread d-umath-7-diffusion-spread">
  <title id="t-umath-7-diffusion-spread">그림 수학 도구 7-7 확산하는 농도 분포 — 폭은 √t에 비례</title>
  <desc id="d-umath-7-diffusion-spread">원점에 모여 있던 물질이 D = 1.0×10⁻⁹ m²/s로 1차원 확산할 때 t = 100 s, 400 s, 1600 s의 농도 분포(정규 분포). 표준 편차 σ = √(2Dt)는 0.45, 0.89, 1.79 mm로 시간이 4배가 될 때마다 2배가 되고, 봉우리 높이는 절반이 된다. 곡선 아래 넓이는 모두 같다.</desc>
