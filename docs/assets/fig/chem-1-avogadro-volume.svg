  <text x="455.0" y="236" text-anchor="middle" class="c1av-lbl">분자 1 mol = 6.02×10²³개</text>
  <text x="455.0" y="258" text-anchor="middle" class="c1av-b" style="fill:var(--fig-amber)">질량 44 g</text>
  <text x="620" y="36" text-anchor="middle" class="c1av-b">물 H₂O (액체)</text>
  <text x="620" y="54" text-anchor="middle" class="c1av-sm">약 18 mL</text>
  <rect x="545" y="62" width="150" height="150" rx="6" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5;stroke-dasharray:5 4"/>
  <rect x="607" y="178" width="26" height="26" rx="2" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.5"/>
  <line x1="635" y1="182" x2="657" y2="142" style="stroke:var(--fig-teal);stroke-width:1.2"/>
  <text x="620" y="96" text-anchor="middle" class="c1av-sm">분자 사이가 가까워</text>
  <text x="620" y="114" text-anchor="middle" class="c1av-sm">부피가 훨씬 작다</text>
  <text x="620" y="132" text-anchor="middle" class="c1av-sm">(기체의 약 1240분의 1)</text>
  <text x="620" y="236" text-anchor="middle" class="c1av-lbl">분자 1 mol</text>
  <text x="620" y="258" text-anchor="middle" class="c1av-b" style="fill:var(--fig-amber)">질량 18 g</text>
  <text x="360" y="292" text-anchor="middle" class="c1av-lbl">같은 온도·압력(0 °C, 1 atm)에서 기체의 부피는 분자의 종류가 아니라 분자 수(몰수)로 정해진다</text>
  <text x="360" y="314" text-anchor="middle" class="c1av-sm">모식도: 상자 속 분자 8개는 1몰을 대신 나타낸 것이며, 분자 크기와 간격은 실제 비율이 아니다</text>
</svg>
