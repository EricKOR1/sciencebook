  <text x="105.0" y="54" text-anchor="middle" class="c1av-sm">22.4 L</text>
  <rect x="30" y="62" width="150" height="150" rx="6" class="c1av-box"/>
  <circle cx="65.6" cy="99.2" r="5.0" class="c1av-H"/><circle cx="71.2" cy="104.3" r="5.0" class="c1av-H"/><circle cx="120.2" cy="93.0" r="5.0" class="c1av-H"/><circle cx="119.1" cy="100.4" r="5.0" class="c1av-H"/><circle cx="146.2" cy="123.5" r="5.0" class="c1av-H"/><circle cx="149.2" cy="130.4" r="5.0" class="c1av-H"/><circle cx="94.0" cy="127.1" r="5.0" class="c1av-H"/><circle cx="91.6" cy="134.3" r="5.0" class="c1av-H"/><circle cx="63.7" cy="156.2" r="5.0" class="c1av-H"/><circle cx="60.9" cy="163.1" r="5.0" class="c1av-H"/><circle cx="111.1" cy="164.0" r="5.0" class="c1av-H"/><circle cx="118.4" cy="165.5" r="5.0" class="c1av-H"/><circle cx="142.7" cy="177.2" r="5.0" class="c1av-H"/><circle cx="150.2" cy="177.5" r="5.0" class="c1av-H"/><circle cx="86.3" cy="183.0" r="5.0" class="c1av-H"/><circle cx="79.8" cy="186.7" r="5.0" class="c1av-H"/>
