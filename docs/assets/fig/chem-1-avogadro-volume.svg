<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-chem-1-avogadro-volume d-chem-1-avogadro-volume">
  <title id="t-chem-1-avogadro-volume">그림 화학 1-1 같은 온도·압력, 같은 부피 속의 기체 분자 수</title>
  <desc id="d-chem-1-avogadro-volume">0 °C, 1 atm에서 22.4 L 속에는 수소, 산소, 이산화 탄소 모두 분자 1몰(6.02×10²³개)이 들어 있지만 질량은 몰질량에 따라 다르다. 같은 1몰이라도 액체인 물은 약 18 mL에 불과하다. 분자의 크기와 개수는 모식적으로 나타냈다.</desc>
  <style>
    .c1av-ink{fill:var(--fig-ink)} .c1av-mut{fill:var(--fig-muted)}
    .c1av-lbl{font-size:14px;fill:var(--fig-ink)} .c1av-b{font-size:15px;font-weight:600;fill:var(--fig-ink)} .c1av-sm{font-size:13px;fill:var(--fig-muted)}
    .c1av-H{fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.2} .c1av-O{fill:var(--fig-red);stroke:var(--fig-red);stroke-width:1} .c1av-C{fill:var(--fig-ink);stroke:var(--fig-ink);stroke-width:1} .c1av-N{fill:var(--fig-blue);stroke:var(--fig-blue);stroke-width:1}
    .c1av-box{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2}
  </style>
