<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" class="fig-small" role="img" aria-labelledby="t-uearth-7-q-warm-cold-columns d-uearth-7-q-warm-cold-columns">
  <title id="t-uearth-7-q-warm-cold-columns">그림 일반지구과학 7-10 문제 13의 두 공기 기둥</title>
  <desc id="d-uearth-7-q-warm-cold-columns">해발 0 m의 기압이 1000 hPa로 같고, 지면에서 2000 m까지의 평균 기온이 270 K인 공기 기둥 (1)과 300 K인 공기 기둥 (2)이다. 물음표는 해발 2000 m에서 구할 기압이다. 모식도이다.</desc>
  <style>
    .uearth-7-q-warm-cold-columns-t{font-size:14px;fill:var(--fig-ink)}
    .uearth-7-q-warm-cold-columns-b{font-size:14px;font-weight:700;fill:var(--fig-ink)}
    .uearth-7-q-warm-cold-columns-s{font-size:13px;fill:var(--fig-muted)}
    .uearth-7-q-warm-cold-columns-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .uearth-7-q-warm-cold-columns-red{font-size:14px;font-weight:600;fill:var(--fig-red)}
    .uearth-7-q-warm-cold-columns-blue{font-size:14px;font-weight:600;fill:var(--fig-blue)}
    .uearth-7-q-warm-cold-columns-green{font-size:14px;font-weight:600;fill:var(--fig-green)}
    .uearth-7-q-warm-cold-columns-amber{font-size:14px;font-weight:600;fill:var(--fig-amber)}
    .uearth-7-q-warm-cold-columns-violet{font-size:14px;font-weight:600;fill:var(--fig-violet)}
    .uearth-7-q-warm-cold-columns-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.4}
    .uearth-7-q-warm-cold-columns-grid{fill:none;stroke:var(--fig-line);stroke-width:0.7;stroke-dasharray:3 3}
  </style>
  <rect x="80" y="80" width="120" height="190" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="140.0" y="170.0" class="uearth-7-q-warm-cold-columns-b" text-anchor="middle">(1) 평균 270 K</text>
  <text x="140.0" y="70.0" class="uearth-7-q-warm-cold-columns-b" text-anchor="middle">P = ?</text>
  <text x="140.0" y="292.0" class="uearth-7-q-warm-cold-columns-t" text-anchor="middle">1000 hPa</text>
  <rect x="260" y="80" width="120" height="190" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
  <text x="320.0" y="170.0" class="uearth-7-q-warm-cold-columns-b" text-anchor="middle">(2) 평균 300 K</text>
  <text x="320.0" y="70.0" class="uearth-7-q-warm-cold-columns-b" text-anchor="middle">P = ?</text>
  <text x="320.0" y="292.0" class="uearth-7-q-warm-cold-columns-t" text-anchor="middle">1000 hPa</text>
  <line x1="20.0" y1="270.0" x2="440.0" y2="270.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <line x1="20.0" y1="80.0" x2="440.0" y2="80.0" style="stroke:var(--fig-muted);stroke-width:1.4;stroke-dasharray:6 4"/>
  <text x="20.0" y="70.0" class="uearth-7-q-warm-cold-columns-s">2000 m</text>
  <text x="20.0" y="292.0" class="uearth-7-q-warm-cold-columns-s">0 m</text>
  <text x="230.0" y="310.0" class="uearth-7-q-warm-cold-columns-s" text-anchor="middle">기둥 크기는 모식</text>
</svg>
