<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="t-ochem-1-wedge-dash d-ochem-1-wedge-dash">
  <title id="t-ochem-1-wedge-dash">그림 유기화학 1-8 사면체 탄소를 쐐기와 점선으로 그리기</title>
  <desc id="d-ochem-1-wedge-dash">(R)-브로모클로로플루오로메테인. 왼쪽: 보통 선 두 개(F, Cl)를 종이 평면에 V 자로 놓고, 그 반대쪽에 쐐기(Br, 종이 앞으로)와 점선 쐐기(H, 종이 뒤로)를 그렸다. 오른쪽: 같은 방향으로 놓은 공-막대 모형(F 연두, Cl 초록, Br 적갈색, H 흰색). 가장 낮은 순위의 H가 뒤에 있고 Br → Cl → F 가 시계 방향이므로 R이다.</desc>
  <style>.ochem-1-wedge-dash-t{font-size:14px;fill:var(--fig-ink)} .ochem-1-wedge-dash-b{font-size:14px;fill:var(--fig-ink);font-weight:600} .ochem-1-wedge-dash-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ochem-1-wedge-dash-s{font-size:13px;fill:var(--fig-muted)} .ochem-1-wedge-dash-n{font-size:13px;fill:var(--fig-muted)} .ochem-1-wedge-dash-r{font-size:13px;fill:var(--fig-red);font-weight:600} .ochem-1-wedge-dash-g{font-size:13px;fill:var(--fig-green);font-weight:600} .ochem-1-wedge-dash-v{font-size:13px;fill:var(--fig-violet)} .ochem-1-wedge-dash-pl{font-size:20px;fill:var(--fig-ink)} .ochem-1-wedge-dash-f{font-size:14px;fill:var(--fig-ink)}</style>
  <text x="180.0" y="28.0" class="ochem-1-wedge-dash-h" text-anchor="middle">쐐기·점선 구조식</text>
  <text x="520.0" y="28.0" class="ochem-1-wedge-dash-h" text-anchor="middle">공-막대 모형(같은 방향)</text>
