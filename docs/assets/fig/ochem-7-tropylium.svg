<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-ochem-7-tropylium d-ochem-7-tropylium">
  <title id="t-ochem-7-tropylium">그림 유기화학 7-7 톨루엔의 질량 스펙트럼과 트로필륨 이온</title>
  <desc id="d-ochem-7-tropylium">왼쪽: 톨루엔(M = 92)의 EI 막대 스펙트럼(전형적인 값, 모식도). 기준 봉우리는 m/z 91, 분자 이온 92, M+1 93. 91 이온이 에타인(C₂H₂, 26)을 잃어 65가 된다. 오른쪽: 분자 이온이 수소 원자를 잃어 벤질 양이온이 되고, 고리 확장 자리 옮김으로 7원자 고리의 트로필륨 이온 C₇H₇⁺(m/z 91, π 전자 6개의 방향족 양이온)이 된다.</desc>
