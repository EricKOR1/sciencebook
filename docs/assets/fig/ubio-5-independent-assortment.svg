<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-ubio-5-independent-assortment d-ubio-5-independent-assortment">
  <title id="t-ubio-5-independent-assortment">그림 일반생명과학 5-5 중기 Ⅰ의 무작위 배열과 독립 분리</title>
  <desc id="d-ubio-5-independent-assortment">두 유전자가 서로 다른 상동 염색체 쌍에 있는 AaBb 개체(파랑은 어머니, 빨강은 아버지에게서 받은 염색체)이다. 중기 Ⅰ에 두 2가 염색체가 중기판에 늘어설 때 각 쌍이 어느 쪽을 어느 극으로 보낼지는 서로 독립적이므로 두 가지 배열이 같은 확률로 일어난다. 배열 ①에서는 AB와 ab, 배열 ②에서는 Ab와 aB 생식세포가 만들어져, 전체적으로 AB : Ab : aB : ab = 1 : 1 : 1 : 1이 된다. 모식도.</desc>
