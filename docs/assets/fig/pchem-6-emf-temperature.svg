<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-pchem-6-emf-temperature d-pchem-6-emf-temperature">
  <title id="t-pchem-6-emf-temperature">그림 물리화학 6-10 전지 전위의 온도 의존에서 ΔrS°, ΔrH°, ΔrCp° 읽기</title>
  <desc id="d-pchem-6-emf-temperature">하네드 전지(은–염화 은 전극)의 E°를 온도에 대해 그린 그래프(실측 맞춤식). 왼쪽: 298.15 K에서 그은 접선의 기울기 (∂E/∂T)p = −0.65 mV/K가 ΔrS°/νF이고, 접선을 T = 0까지 늘린 절편 E − T(∂E/∂T)p = 0.415 V가 −ΔrH°/νF이다(ΔrS° ≈ −62 J/(mol·K), ΔrH° ≈ −40.0 kJ/mol, 예제 14와 같은 값). 오른쪽: 접선에서 벗어난 정도를 확대하면 아래로 휜 곡률이 보이며, ∂²E/∂T²가 ΔrCp°를 준다.</desc>
