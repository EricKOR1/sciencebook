  <title id="t-uchem-10-microstates">그림 일반화학 10-1 미시 상태 수와 볼츠만 식</title>
  <desc id="d-uchem-10-microstates">서로 구별되는 분자 4개(색으로 구별)를 상자의 왼쪽·오른쪽 절반에 놓는 방법 16가지를 거시 상태(왼쪽 : 오른쪽 분자 수)별로 모았다. 고르게 나뉜 2 : 2 상태의 미시 상태 수 W가 6으로 가장 크고, 한쪽에 모두 모인 상태는 W = 1이다. 엔트로피 S = k ln W(k: 볼츠만 상수)는 W가 큰 거시 상태일수록 크다.</desc>
