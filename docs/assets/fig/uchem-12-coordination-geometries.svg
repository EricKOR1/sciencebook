<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-uchem-12-coordination-geometries d-uchem-12-coordination-geometries">
  <title id="t-uchem-12-coordination-geometries">그림 일반화학 12-6 배위수에 따른 착물의 구조</title>
  <desc id="d-uchem-12-coordination-geometries">중심 금속 이온(가운데 큰 공)과 리간드 주개 원자(작은 공)의 배치. 배위수 2는 선형(180°), 배위수 4는 사면체(109.5°) 또는 평면 사각형(90°), 배위수 6은 팔면체(90°)이다. 굵은 쐐기는 보는 사람 쪽으로, 점선은 뒤쪽으로 향한 결합이다.</desc>
