<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 458" role="img" aria-labelledby="t-6-3-artificial-neuron d-6-3-artificial-neuron">
  <title id="t-6-3-artificial-neuron">그림 6-3-3 뉴런과 인공 뉴런, 그리고 인공 신경망</title>
  <desc id="d-6-3-artificial-neuron">뉴런은 여러 신호를 받아 기준을 넘으면 다음 뉴런으로 전달한다. 인공 뉴런은 입력값에 가중치를 곱해 더한 값(예: 0.6+0+0.5=1.1)을 기준(1.0)과 비교해 다음 단계로 값을 넘긴다. 이런 계산 단위를 층층이 연결한 것이 인공 신경망이며, 층을 깊게 쌓아 학습하면 딥러닝이다. 모식도이다.</desc>
