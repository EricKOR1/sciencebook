<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-ochem-4-sn2-mechanism d-ochem-4-sn2-mechanism">
  <title id="t-ochem-4-sn2-mechanism">그림 유기화학 4-7 (R)-2-브로모뷰테인과 사이안화 이온의 SN2 반응</title>
  <desc id="d-ochem-4-sn2-mechanism">왼쪽: (R)-2-브로모뷰테인(Br은 오른쪽, CH₃·C₂H₅·H는 탄소 왼쪽에 우산처럼 펼쳐짐). 사이안화 이온 탄소의 전자쌍이 C2의 뒤쪽(Br 반대편)으로, C–Br 결합의 전자쌍이 Br로 간다(굽은 화살표 2개). 가운데: 삼각쌍뿔 전이 상태. NC···C···Br이 일직선(점선은 부분 결합)이고 CH₃·C₂H₅·H는 그 축에 수직인 평면에 놓이며, NC와 Br에 δ−가 있다. 오른쪽: 세 원자단이 반대쪽으로 넘어간(우산 뒤집힘) (S)-2-메틸뷰테인나이트릴과 Br⁻. 공간 배치가 반전되었고 기호도 R에서 S로 바뀐다.</desc>
