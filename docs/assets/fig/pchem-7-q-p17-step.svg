  <text x="536.0" y="72.9" text-anchor="middle" class="pchem-7-q-p17-step-red">k<tspan baseline-shift="sub" style="font-size:75%">2</tspan> = 0.707 k<tspan baseline-shift="sub" style="font-size:75%">1</tspan> (파장 1.41배)</text>
