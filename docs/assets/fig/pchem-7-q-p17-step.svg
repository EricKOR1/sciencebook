<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-pchem-7-q-p17-step d-pchem-7-q-p17-step">
  <title id="t-pchem-7-q-p17-step">그림 물리화학 7-17 문제 17 풀이: 퍼텐셜 계단 위의 확률 밀도</title>
  <desc id="d-pchem-7-q-p17-step">x &amp;lt; 0에서 V = 0, x &gt; 0에서 V = V0 = 0.50 eV인 계단에 E = 1.0 eV인 전자가 왼쪽에서 다가온다. 왼쪽의 |ψ_I|² = 1 + B² + 2B cos(2k1x)(B = 0.172)는 들어오는 파와 반사파의 간섭으로 0.69와 1.37 사이를 반파장 주기로 출렁이고, 오른쪽의 |ψ_II|² = C² = 1.37(C = 1.172)은 일정하다. x = 0에서 두 값이 1.37로 이어진다. 오른쪽에서는 k2 = 0.707k1이라 파장이 1.41배 길고, R = 0.029, T = 0.971이다.</desc>
