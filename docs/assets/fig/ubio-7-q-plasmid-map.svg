<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" class="fig-small" role="img" aria-labelledby="t-ubio-7-q-plasmid-map d-ubio-7-q-plasmid-map">
<title id="t-ubio-7-q-plasmid-map">그림 일반생명과학 7-13 문제 7 해설의 제한 효소 지도</title>
<desc id="d-ubio-7-q-plasmid-map">5.0 kb 고리형 플라스미드에서 두 PstI 자리는 3.5 kb와 1.5 kb 조각을 남기는 위치에 있고, HindIII 자리는 1.5 kb 구간 안에서 한 PstI 자리로부터 1.0 kb, 다른 PstI 자리로부터 0.5 kb 떨어져 있다. 이중 절단에서 3.5 kb 조각이 그대로 남는 것이 근거이다.</desc>
