  <text x="297.8" y="194.1" class="uchem-3-fuel-scatter-t">프로페인</text>
  <circle cx="278.4" cy="175.1" r="6.0" style="fill:var(--fig-blue);stroke:var(--fig-panel);stroke-width:1.5"/>
  <text x="288.4" y="169.1" class="uchem-3-fuel-scatter-t">옥테인</text>
  <circle cx="206.8" cy="175.1" r="6.0" style="fill:var(--fig-amber);stroke:var(--fig-panel);stroke-width:1.5"/>
  <text x="196.8" y="180.1" text-anchor="end" class="uchem-3-fuel-scatter-t">에탄올</text>
  <circle cx="219.0" cy="68.0" r="6.0" style="fill:var(--fig-red);stroke:var(--fig-panel);stroke-width:1.5"/>
  <text x="229.0" y="73.0" class="uchem-3-fuel-scatter-t">탄소(석탄)</text>
  <circle cx="151.4" cy="108.0" r="6.0" style="fill:var(--fig-amber);stroke:var(--fig-panel);stroke-width:1.5"/>
  <text x="161.4" y="113.0" class="uchem-3-fuel-scatter-t">포도당</text>
  <rect x="400.0" y="56.0" width="270.0" height="104.0" rx="8" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <text x="414.0" y="80.0" class="uchem-3-fuel-scatter-t">알케인(파랑): H/C 비가 클수록</text>
  <text x="414.0" y="100.0" class="uchem-3-fuel-scatter-t">오른쪽 아래 — 메테인이 가장 유리</text>
