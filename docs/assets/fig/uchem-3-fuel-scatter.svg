<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-uchem-3-fuel-scatter d-uchem-3-fuel-scatter">
  <title id="t-uchem-3-fuel-scatter">그림 일반화학 3-7 연료 값과 같은 에너지당 CO₂ 배출</title>
  <desc id="d-uchem-3-fuel-scatter">STEP 3 ⑩ 표의 연료를 연료 값(kJ/g, 가로)과 1 MJ당 CO₂ 배출(g, 세로)로 찍었다. 오른쪽일수록 질량당 열이 크고 아래일수록 같은 열을 얻을 때 CO₂가 적다. 알케인은 H/C 비가 클수록(옥테인 → 프로페인 → 메테인) 오른쪽 아래로 가고, 산소를 포함한 에탄올·포도당은 연료 값이 작아 왼쪽에 있다. 수소는 탄소가 없어 배출이 0이다(물은 액체로 생성된다고 본 값).</desc>
  <style>
    .uchem-3-fuel-scatter-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-3-fuel-scatter-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-3-fuel-scatter-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}

  </style>
