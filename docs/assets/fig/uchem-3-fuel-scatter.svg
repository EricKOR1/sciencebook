  <line x1="90.0" y1="320.0" x2="90.0" y2="325.0" style="stroke:var(--fig-ink);stroke-width:1.2"/>
  <text x="90.0" y="340.0" text-anchor="middle" class="uchem-3-fuel-scatter-s">0</text>
  <line x1="188.3" y1="320.0" x2="188.3" y2="325.0" style="stroke:var(--fig-ink);stroke-width:1.2"/>
  <text x="188.3" y="340.0" text-anchor="middle" class="uchem-3-fuel-scatter-s">25</text>
