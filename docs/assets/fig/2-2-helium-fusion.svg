  <title id="t-2-2-helium-fusion">그림 2-2-4 헬륨 핵융합으로 탄소와 산소가 만들어지는 과정</title>
  <desc id="d-2-2-helium-fusion">적색 거성의 중심부(약 1억 K)에서 헬륨 원자핵 3개가 합쳐지면 양성자 6개인 탄소 원자핵이, 탄소 원자핵과 헬륨 원자핵이 합쳐지면 양성자 8개인 산소 원자핵이 된다. 양성자 수(원자 번호)를 더하면 새 원소를 알 수 있으며, 반응 뒤 질량이 조금 줄어든 만큼 에너지가 나온다. 모식도.</desc>
