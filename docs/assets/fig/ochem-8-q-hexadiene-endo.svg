<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-ochem-8-q-hexadiene-endo d-ochem-8-q-hexadiene-endo">
  <title id="t-ochem-8-q-hexadiene-endo">그림 유기화학 8-23 문제 17의 두 엔도 생성물</title>
  <desc id="d-ochem-8-q-hexadiene-endo">왼쪽: (E,E) 다이엔에서 온 생성물. C4·C7의 메틸 두 개와 무수물 고리가 모두 같은 면(메틸은 쐐기, 고리 접합 H는 점선)이고, C5=C6의 가운데와 무수물 O를 지나는 거울면이 있어 메조이다. 오른쪽: (E,Z) 다이엔에서 온 생성물. 무수물 고리와 한 메틸은 같은 면, 다른 메틸은 반대 면이다(라세미체). 아래: s-시스 다이엔에서 바깥쪽 메틸(초록)은 생성물에서 무수물 고리와 같은 쪽, 안쪽 메틸(빨강)은 반대쪽으로 간다.</desc>
