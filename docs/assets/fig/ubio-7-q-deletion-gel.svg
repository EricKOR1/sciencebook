<title id="t-ubio-7-q-deletion-gel">그림 일반생명과학 7-16 문제 18 해설의 예상 전기 영동 결과</title>
<desc id="d-ubio-7-q-deletion-gel">결실 바깥쪽 프라이머로 증폭한 산물의 예상 띠. 정상 대립유전자는 1000 bp, 300 bp가 잘려 나간 대립유전자는 700 bp 산물을 만들므로, 정상은 1000 bp 한 띠, 이형 접합은 1000 bp와 700 bp 두 띠, 동형 접합 결실은 더 멀리 이동한 700 bp 한 띠를 보인다.</desc>
