<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uchem-4-q-photoelectric-line d-uchem-4-q-photoelectric-line">
  <title id="t-uchem-4-q-photoelectric-line">그림 일반화학 4-13 문제 12 해설 — 최대 운동 에너지와 진동수</title>
  <desc id="d-uchem-4-q-photoelectric-line">두 측정점(7.495 × 10¹⁴ s⁻¹, 0.80 eV)과 (1.199 × 10¹⁵ s⁻¹, 2.66 eV)을 지나는 직선. 기울기가 플랑크 상수 h이고, 가로축 절편이 문턱 진동수(약 5.56 × 10¹⁴ s⁻¹), 세로축 절편을 연장한 값이 −Φ(−2.30 eV)이다.</desc>
  <style>
    .uchem-4-q-photoelectric-line-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-4-q-photoelectric-line-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-4-q-photoelectric-line-b{font-size:15px;fill:var(--fig-ink);font-weight:bold}
    .uchem-4-q-photoelectric-line-ax{stroke:var(--fig-ink);stroke-width:1.3;fill:none}
    .uchem-4-q-photoelectric-line-gr{stroke:var(--fig-line);stroke-width:0.7;fill:none;stroke-dasharray:3 3}
    .uchem-4-q-photoelectric-line-ln{stroke:var(--fig-ink);stroke-width:2;fill:none}
    .uchem-4-q-photoelectric-line-lv{stroke:var(--fig-ink);stroke-width:2.2;fill:none}
    .uchem-4-q-photoelectric-line-bl{stroke:var(--fig-blue);stroke-width:2.4;fill:none}
    .uchem-4-q-photoelectric-line-rd{stroke:var(--fig-red);stroke-width:2.4;fill:none}
    .uchem-4-q-photoelectric-line-gn{stroke:var(--fig-green);stroke-width:2.4;fill:none}
    .uchem-4-q-photoelectric-line-am{stroke:var(--fig-amber);stroke-width:2.4;fill:none}
    .uchem-4-q-photoelectric-line-dash{stroke:var(--fig-muted);stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    .uchem-4-q-photoelectric-line-fink{fill:var(--fig-ink)} .uchem-4-q-photoelectric-line-fbl{fill:var(--fig-blue)} .uchem-4-q-photoelectric-line-frd{fill:var(--fig-red)}
    .uchem-4-q-photoelectric-line-fgn{fill:var(--fig-green)} .uchem-4-q-photoelectric-line-fam{fill:var(--fig-amber)} .uchem-4-q-photoelectric-line-fmu{fill:var(--fig-muted)}
    .uchem-4-q-photoelectric-line-box{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.4}
    .uchem-4-q-photoelectric-line-sb{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6}
    .uchem-4-q-photoelectric-line-sr{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.6}
    .uchem-4-q-photoelectric-line-sg{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.6}
    .uchem-4-q-photoelectric-line-sa{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.6}
    .uchem-4-q-photoelectric-line-sv{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.6}
    .uchem-4-q-photoelectric-line-st{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.6}
  </style>
  <line x1="90.0" y1="30.0" x2="90.0" y2="350.0" class="uchem-4-q-photoelectric-line-gr"/>
  <text x="90.0" y="370.0" text-anchor="middle" class="uchem-4-q-photoelectric-line-s"><tspan dy="0">0</tspan></text>
  <line x1="182.3" y1="30.0" x2="182.3" y2="350.0" class="uchem-4-q-photoelectric-line-gr"/>
  <text x="182.3" y="370.0" text-anchor="middle" class="uchem-4-q-photoelectric-line-s"><tspan dy="0">2</tspan></text>
  <line x1="274.6" y1="30.0" x2="274.6" y2="350.0" class="uchem-4-q-photoelectric-line-gr"/>
  <text x="274.6" y="370.0" text-anchor="middle" class="uchem-4-q-photoelectric-line-s"><tspan dy="0">4</tspan></text>
  <line x1="366.9" y1="30.0" x2="366.9" y2="350.0" class="uchem-4-q-photoelectric-line-gr"/>
  <text x="366.9" y="370.0" text-anchor="middle" class="uchem-4-q-photoelectric-line-s"><tspan dy="0">6</tspan></text>
  <line x1="459.2" y1="30.0" x2="459.2" y2="350.0" class="uchem-4-q-photoelectric-line-gr"/>
  <text x="459.2" y="370.0" text-anchor="middle" class="uchem-4-q-photoelectric-line-s"><tspan dy="0">8</tspan></text>
  <line x1="551.5" y1="30.0" x2="551.5" y2="350.0" class="uchem-4-q-photoelectric-line-gr"/>
  <text x="551.5" y="370.0" text-anchor="middle" class="uchem-4-q-photoelectric-line-s"><tspan dy="0">10</tspan></text>
  <line x1="643.8" y1="30.0" x2="643.8" y2="350.0" class="uchem-4-q-photoelectric-line-gr"/>
  <text x="643.8" y="370.0" text-anchor="middle" class="uchem-4-q-photoelectric-line-s"><tspan dy="0">12</tspan></text>
  <line x1="90.0" y1="316.9" x2="690.0" y2="316.9" class="uchem-4-q-photoelectric-line-gr"/>
  <text x="82.0" y="321.9" text-anchor="end" class="uchem-4-q-photoelectric-line-s"><tspan dy="0">−2</tspan></text>
  <line x1="90.0" y1="261.7" x2="690.0" y2="261.7" class="uchem-4-q-photoelectric-line-gr"/>
  <text x="82.0" y="266.7" text-anchor="end" class="uchem-4-q-photoelectric-line-s"><tspan dy="0">−1</tspan></text>
  <line x1="90.0" y1="206.6" x2="690.0" y2="206.6" class="uchem-4-q-photoelectric-line-gr"/>
  <text x="82.0" y="211.6" text-anchor="end" class="uchem-4-q-photoelectric-line-s"><tspan dy="0">0</tspan></text>
  <line x1="90.0" y1="151.4" x2="690.0" y2="151.4" class="uchem-4-q-photoelectric-line-gr"/>
  <text x="82.0" y="156.4" text-anchor="end" class="uchem-4-q-photoelectric-line-s"><tspan dy="0">1</tspan></text>
  <line x1="90.0" y1="96.2" x2="690.0" y2="96.2" class="uchem-4-q-photoelectric-line-gr"/>
  <text x="82.0" y="101.2" text-anchor="end" class="uchem-4-q-photoelectric-line-s"><tspan dy="0">2</tspan></text>
  <line x1="90.0" y1="41.0" x2="690.0" y2="41.0" class="uchem-4-q-photoelectric-line-gr"/>
  <text x="82.0" y="46.0" text-anchor="end" class="uchem-4-q-photoelectric-line-s"><tspan dy="0">3</tspan></text>
  <line x1="90.0" y1="206.6" x2="690.0" y2="206.6" class="uchem-4-q-photoelectric-line-ax"/>
  <line x1="90.0" y1="350.0" x2="90.0" y2="30.0" class="uchem-4-q-photoelectric-line-ax"/>
  <line x1="90.0" y1="333.5" x2="346.7" y2="206.6" class="uchem-4-q-photoelectric-line-dash"/>
  <line x1="346.7" y1="206.6" x2="680.8" y2="41.3" class="uchem-4-q-photoelectric-line-bl"/>
  <circle cx="435.9" cy="162.4" r="5.5" class="uchem-4-q-photoelectric-line-sr"/>
  <circle cx="643.4" cy="59.8" r="5.5" class="uchem-4-q-photoelectric-line-sr"/>
  <text x="445.9" y="182.4" text-anchor="start" class="uchem-4-q-photoelectric-line-t"><tspan dy="0">(7.495, 0.80)</tspan></text>
  <text x="633.4" y="47.8" text-anchor="end" class="uchem-4-q-photoelectric-line-t"><tspan dy="0">(11.99, 2.66)</tspan></text>
  <circle cx="346.7" cy="206.6" r="4.0" class="uchem-4-q-photoelectric-line-sb"/>
  <text x="350.7" y="196.6" text-anchor="end" class="uchem-4-q-photoelectric-line-t"><tspan dy="0">ν</tspan><tspan dy="4" style="font-size:0.72em">0</tspan><tspan dy="-4"> ≈ 5.56</tspan></text>
  <circle cx="90.0" cy="333.5" r="4.0" class="uchem-4-q-photoelectric-line-sb"/>
  <text x="100.0" y="338.5" text-anchor="start" class="uchem-4-q-photoelectric-line-t"><tspan dy="0">−Φ = −2.30 eV</tspan></text>
  <text x="533.1" y="168.8" text-anchor="start" class="uchem-4-q-photoelectric-line-t"><tspan dy="0">기울기 = h</tspan></text>
  <text x="690.0" y="390.0" text-anchor="end" class="uchem-4-q-photoelectric-line-s"><tspan dy="0">진동수 ν (10</tspan><tspan dy="-6" style="font-size:0.72em">14</tspan><tspan dy="6"> s</tspan><tspan dy="-6" style="font-size:0.72em">-1</tspan><tspan dy="6">)</tspan></text>
  <text x="20.0" y="20.0" text-anchor="start" class="uchem-4-q-photoelectric-line-s"><tspan dy="0">E</tspan><tspan dy="4" style="font-size:0.72em">k</tspan><tspan dy="-4">(eV)</tspan></text>
</svg>
