<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uearth-7-precip-processes d-uearth-7-precip-processes">
  <title id="t-uearth-7-precip-processes">그림 일반지구과학 7-7 강수 과정 — 병합설과 빙정설</title>
  <desc id="d-uearth-7-precip-processes">왼쪽은 병합설(충돌–병합 과정)이다. 0 °C보다 따뜻한 구름에서 조금 큰 물방울이 작은 구름 방울보다 빨리 떨어지며 따라잡아 충돌·병합하고, 커질수록 더 빨리 떨어져 더 많이 쓸어 담아 빗방울이 된다. 오른쪽은 빙정설(베르게론 과정)이다. 0 °C보다 찬 구름에서 빙정과 과냉각 물방울이 섞여 있으면 얼음의 포화 수증기압이 물보다 작으므로 수증기가 물방울에서 빙정으로 옮겨 가, 물방울은 증발해 작아지고 빙정은 빠르게 자란다. 자란 빙정은 눈송이가 되어 떨어지고 0 °C 층 아래에서 녹으면 비가 된다. 크기는 과장한 모식도이다.</desc>
