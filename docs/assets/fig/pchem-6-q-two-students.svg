  <title id="t-pchem-6-q-two-students">그림 물리화학 6-14 문제 17의 두 학생 그래프</title>
  <desc id="d-pchem-6-q-two-students">왼쪽(학생 갑): y = E + (2RT/F)ln b를 b에 대해 그린 7개 점과 맞춤 직선. 오른쪽(학생 을): y₁ = E + (RT/F)ln b를 √b에 대해 그린 묽은 4개 점과 맞춤 직선. 점선은 각 직선을 가로축 0까지 늘린 것이고, 절편 값은 문제에 주어진 것이다.</desc>
