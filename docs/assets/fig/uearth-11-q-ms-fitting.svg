  <title id="t-uearth-11-q-ms-fitting">그림 일반지구과학 11-14 문제 13 풀이 — 주계열 맞추기</title>
  <desc id="d-uearth-11-q-ms-fitting">같은 분광형의 주계열성은 절대등급이 같으므로, 성단 별들의 겉보기 등급으로 그린 주계열은 표준 주계열(절대등급)을 거리 지수만큼 아래(어두운 쪽)로 옮긴 모양이다. G2형에서 m − M = 14.83 − 4.83 = 10.0이며, 소광이 1.0등급이면 그중 9.0등급만 거리 때문이다. 주계열의 모양은 어림값.</desc>
