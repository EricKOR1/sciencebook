<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="t-phy-3-convex-lens-rays d-phy-3-convex-lens-rays">
  <title id="t-phy-3-convex-lens-rays">그림 물리학 3-1 볼록렌즈의 광선 추적</title>
  <desc id="d-phy-3-convex-lens-rays">초점 거리 10 cm인 볼록렌즈 앞 30 cm에 놓인 물체에서 나온 세 광선이 렌즈 뒤 15 cm에서 만나, 거꾸로 선 축소된 실상이 생긴다.</desc>
  <style>
    .phy-3-convex-lens-rays-lbl{font-size:14px;fill:var(--fig-ink)} .phy-3-convex-lens-rays-sm{font-size:13px;fill:var(--fig-muted)} .phy-3-convex-lens-rays-b{font-weight:600}
    .phy-3-convex-lens-rays-ax{stroke:var(--fig-ink);stroke-width:1.5;fill:none} .phy-3-convex-lens-rays-grid{stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 3;fill:none}
  </style>
<line x1="20" y1="180" x2="705" y2="180" style="stroke:var(--fig-line);stroke-width:1.5;stroke-dasharray:6 4"/><text x="705.0" y="172.0" text-anchor="end" class="phy-3-convex-lens-rays-sm">광축</text>
<path d="M440 85 Q460 180 440 275 Q420 180 440 85 Z" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/><text x="440.0" y="76.0" text-anchor="middle" class="phy-3-convex-lens-rays-lbl phy-3-convex-lens-rays-b">볼록렌즈</text>
<circle cx="180" cy="180" r="3.5" style="fill:var(--fig-ink)"/><text x="180.0" y="200.0" text-anchor="middle" class="phy-3-convex-lens-rays-lbl">2F</text>
<circle cx="310" cy="180" r="3.5" style="fill:var(--fig-ink)"/><text x="310.0" y="200.0" text-anchor="middle" class="phy-3-convex-lens-rays-lbl">F</text>
<circle cx="570" cy="180" r="3.5" style="fill:var(--fig-ink)"/><text x="570.0" y="200.0" text-anchor="middle" class="phy-3-convex-lens-rays-lbl">F′</text>
<circle cx="700" cy="180" r="3.5" style="fill:var(--fig-ink)"/><text x="700.0" y="200.0" text-anchor="middle" class="phy-3-convex-lens-rays-lbl">2F′</text>
<line x1="50.0" y1="180.0" x2="50.0" y2="139.0" style="stroke:var(--fig-green);stroke-width:3"/><path d="M50.0 128.0 L45.0 139.0 L55.0 139.0 Z" style="fill:var(--fig-green)"/>
<text x="50.0" y="200.0" text-anchor="middle" class="phy-3-convex-lens-rays-lbl phy-3-convex-lens-rays-b">물체</text>
<text x="50.0" y="217.0" text-anchor="middle" class="phy-3-convex-lens-rays-sm">(렌즈 앞 30 cm)</text>
<line x1="635.0" y1="180.0" x2="635.0" y2="195.0" style="stroke:var(--fig-red);stroke-width:3"/><path d="M635.0 206.0 L640.0 195.0 L630.0 195.0 Z" style="fill:var(--fig-red)"/>
<text x="708.0" y="242.0" text-anchor="end" class="phy-3-convex-lens-rays-lbl phy-3-convex-lens-rays-b">상: 실상, 거꾸로, 축소</text>
<text x="708.0" y="259.0" text-anchor="end" class="phy-3-convex-lens-rays-sm">(렌즈 뒤 15 cm)</text>
<path d="M50.0 128.0 L440.0 128.0 L700.0 232.0" style="fill:none;stroke:var(--fig-blue);stroke-width:2"/><line x1="239.0" y1="128.0" x2="242.0" y2="128.0" style="stroke:var(--fig-blue);stroke-width:2"/><path d="M251.0 128.0 L242.0 124.0 L242.0 132.1 Z" style="fill:var(--fig-blue)"/>
<line x1="564.4" y1="177.8" x2="567.2" y2="178.9" style="stroke:var(--fig-blue);stroke-width:2"/><path d="M575.6 182.2 L568.7 175.1 L565.7 182.6 Z" style="fill:var(--fig-blue)"/>
<text x="250.0" y="120.0" text-anchor="start" class="phy-3-convex-lens-rays-lbl phy-3-convex-lens-rays-b" style="fill:var(--fig-blue)">①</text>
<path d="M50.0 128.0 L700.0 214.7" style="fill:none;stroke:var(--fig-violet);stroke-width:2"/><line x1="369.1" y1="170.5" x2="372.0" y2="170.9" style="stroke:var(--fig-violet);stroke-width:2"/><path d="M380.9 172.1 L372.6 166.9 L371.5 175.0 Z" style="fill:var(--fig-violet)"/>
<text x="330.0" y="157.3" text-anchor="start" class="phy-3-convex-lens-rays-lbl phy-3-convex-lens-rays-b" style="fill:var(--fig-violet)">②</text>
<path d="M50.0 128.0 L440.0 206.0 L700.0 206.0" style="fill:none;stroke:var(--fig-amber);stroke-width:2"/><line x1="239.1" y1="165.8" x2="242.1" y2="166.4" style="stroke:var(--fig-amber);stroke-width:2"/><path d="M250.9 168.2 L242.9 162.4 L241.3 170.4 Z" style="fill:var(--fig-amber)"/>
<line x1="564.0" y1="206.0" x2="567.0" y2="206.0" style="stroke:var(--fig-amber);stroke-width:2"/><path d="M576.0 206.0 L567.0 201.9 L567.0 210.1 Z" style="fill:var(--fig-amber)"/>
<text x="160.0" y="167.0" text-anchor="start" class="phy-3-convex-lens-rays-lbl phy-3-convex-lens-rays-b" style="fill:var(--fig-amber)">③</text>
<line x1="310" y1="228" x2="440" y2="228" style="stroke:var(--fig-muted);stroke-width:1"/><text x="375.0" y="244.0" text-anchor="middle" class="phy-3-convex-lens-rays-sm">초점 거리 10 cm</text>
<line x1="30" y1="296" x2="56" y2="296" style="stroke:var(--fig-blue);stroke-width:2.5"/><text x="64.0" y="300.0" text-anchor="start" class="phy-3-convex-lens-rays-sm">① 광축에 나란히 들어와 → 반대쪽 초점 F′을 지난다</text>
<line x1="30" y1="316" x2="56" y2="316" style="stroke:var(--fig-violet);stroke-width:2.5"/><text x="64.0" y="320.0" text-anchor="start" class="phy-3-convex-lens-rays-sm">② 렌즈 중심을 지나 → 꺾이지 않고 곧게 간다</text>
<line x1="30" y1="336" x2="56" y2="336" style="stroke:var(--fig-amber);stroke-width:2.5"/><text x="64.0" y="340.0" text-anchor="start" class="phy-3-convex-lens-rays-sm">③ 앞쪽 초점 F를 지나 들어와 → 광축에 나란히 나간다</text>
<text x="30.0" y="28.0" text-anchor="start" class="phy-3-convex-lens-rays-sm">예제 5 상황: 초점 거리 10 cm, 물체는 2f보다 먼 30 cm에 있다. 세 광선이 한 점에서 만나는 곳에 상이 맺힌다.</text>
</svg>
