  <title id="t-uphy-9-q-wire-loop">그림 일반물리학 9-13 문제 15의 직선 도선과 정사각형 고리</title>
  <desc id="d-uphy-9-q-wire-loop">20 A가 위쪽으로 흐르는 긴 직선 도선 오른쪽 같은 평면에 한 변이 0.10 m인 정사각형 고리가 있다. 고리의 가까운 변은 도선에서 0.050 m 떨어져 있고 도선과 같은 방향(위쪽)으로 5.0 A가 흐르므로, 고리의 전류는 시계 방향으로 돈다.</desc>
