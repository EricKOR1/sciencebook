<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-umath-2-riemann-sums d-umath-2-riemann-sums">
  <title id="t-umath-2-riemann-sums">그림 수학 도구 2-1 y = x²의 왼쪽 끝 리만 합</title>
  <desc id="d-umath-2-riemann-sums">0 ≤ x ≤ 2 에서 y = x² 아래 넓이를 왼쪽 끝 높이의 직사각형으로 어림한다. 폭 0.5인 4개(합 1.75)보다 폭 0.1인 20개(합 2.47)가 참값 8/3 ≈ 2.667에 더 가깝다. 증가 함수이므로 왼쪽 끝 합은 언제나 참값보다 작다.</desc>
