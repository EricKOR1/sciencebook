  <title id="t-pchem-9-q-hminus-variation">그림 물리화학 9-18 문제 13 풀이: H⁻의 변분 에너지 곡선</title>
  <desc id="d-pchem-9-q-hminus-variation">E(ζ) = ζ² − 2ζ + 5ζ/8 (Z = 1)의 최솟값은 ζ = 0.6875에서 −0.4727 Eh로, 수소 원자 + 자유 전자(−0.500 Eh)보다 높다. 실제 H⁻의 에너지 −0.5277 Eh는 그보다 낮으므로, 이 시험 함수가 너무 단순해 결합을 예측하지 못한 것이다.</desc>
