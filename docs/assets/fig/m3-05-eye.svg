<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-m3-05-eye d-m3-05-eye">
  <title id="t-m3-05-eye">그림 중3-5-1 눈의 구조와 빛의 경로</title>
  <desc id="d-m3-05-eye">빛은 각막과 동공을 지나 수정체에서 굴절되어 망막에 거꾸로 선 상을 맺는다. 망막의 시각 세포가 만든 신호는 시각 신경을 따라 대뇌로 간다. 시각 신경이 나가는 맹점에는 시각 세포가 없다.</desc>
