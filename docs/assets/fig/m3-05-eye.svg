  <line x1="326" y1="234" x2="330" y2="352" class="m3-05-eye-ld"/>
  <text x="330" y="346" text-anchor="middle" class="m3-05-eye-l">수정체</text>
  <text x="330" y="363" text-anchor="middle" class="m3-05-eye-s">볼록 렌즈 역할</text>
