<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 328" role="img" aria-labelledby="t-2-2-solar-system-formation d-2-2-solar-system-formation">
  <title id="t-2-2-solar-system-formation">그림 2-2-3 원시 태양계 원반에서 행성까지</title>
  <desc id="d-2-2-solar-system-formation">약 46억 년 전 성운이 수축·회전하며 납작한 원반이 되고, 중심에 원시 태양이 생겼다. 원반의 티끌이 뭉쳐 미행성이 되고, 미행성이 충돌·합체해 행성이 되었다. 태양 가까이에서는 암석·금속만 뭉쳐 지구형 행성이, 멀리에서는 얼음까지 뭉쳐 목성형 행성이 되었다.</desc>
