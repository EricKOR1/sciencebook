  <title id="t-chem-2-q-bf3-nh3-adduct">그림 화학 2-12 문제 10 해설 — BF₃와 NH₃가 결합하는 과정의 전자점식</title>
  <desc id="d-chem-2-q-bf3-nh3-adduct">BF₃의 B는 공유 전자쌍 3개(전자 6개)만 가져 한 방향이 비어 있고, NH₃의 N에는 비공유 전자쌍이 1개 있다. N의 비공유 전자쌍이 B의 빈자리로 들어가 B와 N이 공유하면, F₃B–NH₃에서 B와 N이 모두 전자 8개를 갖는다.</desc>
