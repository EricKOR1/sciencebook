<rect x="360.0" y="305.0" width="330.0" height="10.0" rx="3" style="fill:var(--fig-red);fill-opacity:0.8"/>
<text x="84.0" y="336.0" class="uearth-5-oxygen-history-s">황 동위 원소 특이 분별</text>
<rect x="90.0" y="325.0" width="240.0" height="10.0" rx="3" style="fill:var(--fig-violet);fill-opacity:0.8"/>
