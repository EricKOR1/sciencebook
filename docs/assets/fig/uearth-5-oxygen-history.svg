<text x="232.0" y="175.0" text-anchor="end" class="uearth-5-oxygen-history-s">1/10⁴</text>
<line x1="240.0" y1="110.0" x2="690.0" y2="110.0" style="stroke:var(--fig-line);stroke-width:1"/>
