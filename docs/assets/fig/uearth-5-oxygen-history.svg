<rect x="582.0" y="365.0" width="12.8" height="10.0" rx="3" style="fill:var(--fig-teal);fill-opacity:0.8"/>
<rect x="603.8" y="365.0" width="5.4" height="10.0" rx="3" style="fill:var(--fig-green);fill-opacity:0.8"/>
</svg>