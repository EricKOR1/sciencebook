<text x="615.0" y="124.0" text-anchor="middle" class="uearth-5-oxygen-history-s" style="fill:var(--fig-blue)">원생누대 말 증가</text>
<text x="84.0" y="296.0" class="uearth-5-oxygen-history-s">호상 철광층</text>
<rect x="315.0" y="285.0" width="105.0" height="10.0" rx="3" style="fill:var(--fig-amber);fill-opacity:0.8"/>
