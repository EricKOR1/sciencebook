<line x1="90.0" y1="230.0" x2="90.0" y2="50.0" style="stroke:var(--fig-ink);stroke-width:1.5"/>
<path d="M90.0 200.0 L322.5 200.0 L345.0 80.0 L390.0 68.0 L420.0 80.0 L562.5 80.0 L607.5 50.0 L690.0 50.0 L690.0 51.5 L630.0 65.0 L607.5 80.0 L562.5 140.0 L420.0 140.0 L345.0 140.0 L322.5 230.0 L90.0 230.0 Z" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
