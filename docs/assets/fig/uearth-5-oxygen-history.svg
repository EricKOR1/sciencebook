<path d="M240.0 200.0 L414.4 200.0 L431.2 80.0 L594.4 80.0 L628.1 50.0 L690.0 50.0 L690.0 51.5 L645.0 65.0 L628.1 80.0 L594.4 140.0 L431.2 140.0 L414.4 230.0 L240.0 230.0 Z" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
