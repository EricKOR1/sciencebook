<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uearth-5-oxygen-history d-uearth-5-oxygen-history">
<title id="t-uearth-5-oxygen-history">그림 일반지구과학 5-8 대기 산소의 역사와 그 증거</title>
<desc id="d-uearth-5-oxygen-history">대기 산소는 시생누대에 현재의 10만 분의 1 이하로 거의 없다가, 약 24억~23억 년 전 대산화 사건 때 처음 크게 늘었고, 원생누대 동안 낮은 수준에 머물다가 원생누대 말(약 8억~5.4억 년 전)에 다시 늘어 현재 수준에 가까워졌다. 아래 막대는 호상 철광층, 적색층, 황 동위 원소의 특이 분별, 진핵생물, 눈덩이 지구, 에디아카라 생물군의 시기이다. 산소 농도는 불확실성이 큰 추정 범위(띠)로 나타낸 모식도이다.</desc>
<style>
.uearth-5-oxygen-history-t{font-size:14px;fill:var(--fig-ink)} .uearth-5-oxygen-history-s{font-size:13px;fill:var(--fig-muted)} .uearth-5-oxygen-history-b{font-size:14px;fill:var(--fig-ink);font-weight:600} .uearth-5-oxygen-history-h{font-size:15px;fill:var(--fig-ink);font-weight:600}
</style>
