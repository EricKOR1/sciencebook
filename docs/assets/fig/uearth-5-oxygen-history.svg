<line x1="90.0" y1="230.0" x2="690.0" y2="230.0" style="stroke:var(--fig-line);stroke-width:1"/>
<text x="82.0" y="235.0" text-anchor="end" class="uearth-5-oxygen-history-s">1/10⁶</text>
<line x1="90.0" y1="170.0" x2="690.0" y2="170.0" style="stroke:var(--fig-line);stroke-width:1"/>
<text x="82.0" y="175.0" text-anchor="end" class="uearth-5-oxygen-history-s">1/10⁴</text>
<line x1="90.0" y1="110.0" x2="690.0" y2="110.0" style="stroke:var(--fig-line);stroke-width:1"/>
<text x="82.0" y="115.0" text-anchor="end" class="uearth-5-oxygen-history-s">1/100</text>
<line x1="90.0" y1="50.0" x2="690.0" y2="50.0" style="stroke:var(--fig-line);stroke-width:1"/>
<text x="82.0" y="55.0" text-anchor="end" class="uearth-5-oxygen-history-s">현재(1)</text>
<text x="10.0" y="28.0" class="uearth-5-oxygen-history-s">대기 산소(현재에 대한 비, 로그 눈금)</text>
<line x1="90.0" y1="230.0" x2="90.0" y2="236.0" style="stroke:var(--fig-ink);stroke-width:1.2"/>
<text x="90.0" y="252.0" text-anchor="middle" class="uearth-5-oxygen-history-s">4</text>
<line x1="240.0" y1="230.0" x2="240.0" y2="236.0" style="stroke:var(--fig-ink);stroke-width:1.2"/>
<text x="240.0" y="252.0" text-anchor="middle" class="uearth-5-oxygen-history-s">3</text>
<line x1="390.0" y1="230.0" x2="390.0" y2="236.0" style="stroke:var(--fig-ink);stroke-width:1.2"/>
<text x="390.0" y="252.0" text-anchor="middle" class="uearth-5-oxygen-history-s">2</text>
<line x1="540.0" y1="230.0" x2="540.0" y2="236.0" style="stroke:var(--fig-ink);stroke-width:1.2"/>
<text x="540.0" y="252.0" text-anchor="middle" class="uearth-5-oxygen-history-s">1</text>
<line x1="690.0" y1="230.0" x2="690.0" y2="236.0" style="stroke:var(--fig-ink);stroke-width:1.2"/>
<text x="690.0" y="252.0" text-anchor="middle" class="uearth-5-oxygen-history-s">0</text>
<text x="690.0" y="252.0" class="uearth-5-oxygen-history-s"></text>
<text x="390.0" y="270.0" text-anchor="middle" class="uearth-5-oxygen-history-s">시간(10억 년 전)</text>
