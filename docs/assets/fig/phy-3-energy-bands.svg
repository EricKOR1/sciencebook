<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-phy-3-energy-bands d-phy-3-energy-bands">
  <title id="t-phy-3-energy-bands">그림 물리학 3-7 도체, 반도체, 부도체의 에너지띠</title>
  <desc id="d-phy-3-energy-bands">도체는 띠가 일부만 채워져 있어 전자가 작은 에너지로 옮겨 다닌다. 반도체는 원자가 띠와 전도띠 사이의 띠틈이 작아 열이나 빛을 받은 일부 전자가 전도띠로 올라가고 원자가 띠에 양공이 남는다. 부도체는 띠틈이 커서 전자가 거의 올라가지 못한다(모식도).</desc>
  <style>
    .phy-3-energy-bands-lbl{font-size:14px;fill:var(--fig-ink)} .phy-3-energy-bands-sm{font-size:13px;fill:var(--fig-muted)} .phy-3-energy-bands-b{font-weight:600}
  </style>
