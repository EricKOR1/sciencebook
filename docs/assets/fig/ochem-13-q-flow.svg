  <title id="t-ochem-13-q-flow">그림 유기화학 13-19 문제 15의 반응 순서</title>
  <desc id="d-ochem-13-q-flow">4-나이트로톨루엔에서 시작해 Fe, HCl 뒤 NaOH → A(C₇H₉N) → NaNO₂, HCl, 0 ℃ → B → CuCN, KCN → C(C₈H₇N) → H₃O⁺, 가열 → D(C₈H₈O₂) → 1) SOCl₂ 2) NH₃ 3) Br₂, NaOH → E. 생성물 자리는 빈 상자이다.</desc>
