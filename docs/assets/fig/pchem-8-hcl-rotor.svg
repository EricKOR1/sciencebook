<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-pchem-8-hcl-rotor d-pchem-8-hcl-rotor">
  <title id="t-pchem-8-hcl-rotor">그림 물리화학 8-6 HCl 강체 회전자의 회전 준위와 25 ℃ 분포</title>
  <desc id="d-pchem-8-hcl-rotor">왼쪽: ¹H³⁵Cl(B̃ = 10.59 cm⁻¹)의 회전 준위 E = hcB̃J(J + 1), J = 0~5는 0, 21.2, 63.5, 127.1, 211.8, 317.7 cm⁻¹이고 축퇴도 2J + 1 = 1, 3, 5, 7, 9, 11이다. 이웃 간격 2B̃(J + 1)은 21.2, 42.4, 63.5, 84.7, 105.9 cm⁻¹로 벌어진다. 점선은 25 ℃의 kT/hc = 207 cm⁻¹. 오른쪽: 상대 분포 N_J/N_0 = (2J + 1)e^(−E_J/kT), J = 3에서 최대(3.79).</desc>
