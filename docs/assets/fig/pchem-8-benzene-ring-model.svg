<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-pchem-8-benzene-ring-model d-pchem-8-benzene-ring-model">
  <title id="t-pchem-8-benzene-ring-model">그림 물리화학 8-5 벤젠의 자유 전자 고리 모형과 준위 채우기</title>
  <desc id="d-pchem-8-benzene-ring-model">왼쪽: 벤젠의 탄소 6개와 그 위에 겹친 반지름 139 pm의 원(점선). 정육각형의 꼭짓점이 원 위에 놓인다. 오른쪽: 고리 위의 입자 준위 E = m_l²ħ²/2m_eR², m_l = 0(0 eV, 상자 1개), ±1(1.97 eV), ±2(7.89 eV), ±3(17.7 eV, 각각 상자 2개). π 전자 6개가 m_l = 0과 ±1을 채우고, ±1 → ±2 들뜸이 ΔE = 5.92 eV, λ ≈ 210 nm이다. 세로축은 에너지에 비례한다.</desc>
