  <title id="t-umath-5-q-stress-element">그림 수학 도구 5-16 문제 11의 암석 요소에 작용하는 응력</title>
  <desc id="d-umath-5-q-stress-element">수평면의 정사각형 암석 요소. 동·서쪽 면에 σxx = −50 MPa, 남·북쪽 면에 σyy = −20 MPa의 압축(안쪽 화살표), 네 면에 σxy = +20 MPa의 전단 응력(동쪽 면은 북쪽, 서쪽 면은 남쪽, 북쪽 면은 동쪽, 남쪽 면은 서쪽). 화살표 길이는 응력 크기에 비례한다.</desc>
