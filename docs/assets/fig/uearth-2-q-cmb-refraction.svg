<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 310" class="fig-small" role="img" aria-labelledby="t-uearth-2-q-cmb-refraction d-uearth-2-q-cmb-refraction">
<title id="t-uearth-2-q-cmb-refraction">그림 일반지구과학 2-15 문제 16 풀이 — 맨틀–핵 경계에서 P파의 굴절</title>
<desc id="d-uearth-2-q-cmb-refraction">맨틀(13.7 km/s)에서 입사각 60°로 맨틀–핵 경계에 닿은 P파가 느린 외핵(8.06 km/s)으로 들어가며 법선 쪽으로 꺾여 굴절각이 약 31°가 된다. 경계를 평면으로 그린 모식도이다.</desc>
<style>.uearth-2-q-cmb-refraction-t{font-size:14px;fill:var(--fig-ink)} .uearth-2-q-cmb-refraction-s{font-size:13px;fill:var(--fig-muted)} .uearth-2-q-cmb-refraction-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .uearth-2-q-cmb-refraction-b{font-size:14px;font-weight:700;fill:var(--fig-ink)}</style>
<rect x="20" y="20" width="420" height="130" style="fill:var(--fig-soft-amber);stroke:none"/>
<rect x="20" y="150" width="420" height="130" style="fill:var(--fig-soft-red);stroke:none"/>
<line x1="20" y1="150" x2="440" y2="150" style="stroke:var(--fig-ink);stroke-width:1.8;fill:none"/>
<line x1="230" y1="28" x2="230" y2="272" style="stroke:var(--fig-muted);stroke-width:1.2;fill:none;stroke-dasharray:5 4"/>
<text x="236" y="40" class="uearth-2-q-cmb-refraction-s">법선</text>
<line x1="100.1" y1="75" x2="219.6" y2="144" style="stroke:var(--fig-blue);stroke-width:2.6"/>
<polygon points="230,150 222.6,138.8 216.6,149.2" style="fill:var(--fig-blue)"/>
<line x1="230" y1="150" x2="290.1" y2="251.5" style="stroke:var(--fig-blue);stroke-width:2.6"/>
<polygon points="296.2,261.9 295.3,248.5 285,254.6" style="fill:var(--fig-blue)"/>
<line x1="230" y1="150" x2="325.3" y2="205" style="stroke:var(--fig-blue);stroke-width:1.2;fill:none;stroke-dasharray:3 4;opacity:0.7"/>
<path d="M230 104 A46 46 0 0 0 190.2 127" style="stroke:var(--fig-ink);stroke-width:1.4;fill:none"/>
<text x="198" y="98" text-anchor="end" class="uearth-2-q-cmb-refraction-b">60°</text>
<path d="M230 206 A56 56 0 0 0 258.5 198.2" style="stroke:var(--fig-ink);stroke-width:1.4;fill:none"/>
<text x="242" y="224" class="uearth-2-q-cmb-refraction-b">31°</text>
<text x="30" y="44" class="uearth-2-q-cmb-refraction-b">맨틀 바닥</text>
<text x="30" y="62" class="uearth-2-q-cmb-refraction-s">v = 13.7 km/s</text>
<text x="30" y="260" class="uearth-2-q-cmb-refraction-b">외핵 맨 위</text>
<text x="30" y="278" class="uearth-2-q-cmb-refraction-s">v = 8.06 km/s</text>
<text x="300" y="262" class="uearth-2-q-cmb-refraction-s">꺾이지 않았다면</text>
<text x="300" y="302" class="uearth-2-q-cmb-refraction-s"></text>
<text x="440" y="142" text-anchor="end" class="uearth-2-q-cmb-refraction-s">맨틀–핵 경계</text>
</svg>
