<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-uphy-3-collision-2d d-uphy-3-collision-2d">
  <title id="t-uphy-3-collision-2d">그림 일반물리학 3-8 2차원 충돌의 운동량 벡터 삼각형</title>
  <desc id="d-uphy-3-collision-2d">왼쪽: 교차로의 완전 비탄성 충돌(예제 13)에서 두 차의 운동량을 더한 벡터가 충돌 후 한 덩어리의 운동량이다. 오른쪽: 질량이 같은 당구공의 비스듬한 탄성 충돌(예제 14)에서는 충돌 전 운동량이 충돌 후 두 운동량의 합과 같고, 두 공이 직각으로 갈라진다.</desc>
  <style>.uphy-3-collision-2d-t{font-size:14px;fill:var(--fig-ink)} .uphy-3-collision-2d-s{font-size:13px;fill:var(--fig-muted)} .uphy-3-collision-2d-b{font-size:15px;font-weight:600;fill:var(--fig-ink)} .uphy-3-collision-2d-f-ink{fill:var(--fig-ink)} .uphy-3-collision-2d-st-ink{stroke:var(--fig-ink);fill:none} .uphy-3-collision-2d-f-muted{fill:var(--fig-muted)} .uphy-3-collision-2d-st-muted{stroke:var(--fig-muted);fill:none} .uphy-3-collision-2d-f-line{fill:var(--fig-line)} .uphy-3-collision-2d-st-line{stroke:var(--fig-line);fill:none} .uphy-3-collision-2d-f-accent{fill:var(--fig-accent)} .uphy-3-collision-2d-st-accent{stroke:var(--fig-accent);fill:none} .uphy-3-collision-2d-f-blue{fill:var(--fig-blue)} .uphy-3-collision-2d-st-blue{stroke:var(--fig-blue);fill:none} .uphy-3-collision-2d-f-red{fill:var(--fig-red)} .uphy-3-collision-2d-st-red{stroke:var(--fig-red);fill:none} .uphy-3-collision-2d-f-green{fill:var(--fig-green)} .uphy-3-collision-2d-st-green{stroke:var(--fig-green);fill:none} .uphy-3-collision-2d-f-amber{fill:var(--fig-amber)} .uphy-3-collision-2d-st-amber{stroke:var(--fig-amber);fill:none} .uphy-3-collision-2d-f-violet{fill:var(--fig-violet)} .uphy-3-collision-2d-st-violet{stroke:var(--fig-violet);fill:none} .uphy-3-collision-2d-f-teal{fill:var(--fig-teal)} .uphy-3-collision-2d-st-teal{stroke:var(--fig-teal);fill:none}</style>
