  <circle cx="486.0" cy="166.0" r="9.0" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
  <line x1="477.0" y1="150.4" x2="537.0" y2="150.4" style="stroke:var(--fig-line);stroke-width:1;stroke-linecap:round;stroke-dasharray:3 3"/>
  <text x="559.0" y="99.4" class="uphy-3-collision-2d-s" style="fill:var(--fig-blue)">수구 1.73 m/s</text>
  <text x="518.0" y="225.0" class="uphy-3-collision-2d-s" style="fill:var(--fig-red)">맞은 공 1.00 m/s</text>
  <text x="521.0" y="142.4" class="uphy-3-collision-2d-s">30°</text>
