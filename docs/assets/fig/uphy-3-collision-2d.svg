  <text x="133.0" y="292.0" text-anchor="middle" class="uphy-3-collision-2d-s" style="fill:var(--fig-blue)">p_A = 1500 × 20.0</text>
  <text x="133.0" y="308.0" text-anchor="middle" class="uphy-3-collision-2d-s" style="fill:var(--fig-blue)">= 3.00 × 10⁴ (동쪽)</text>
  <text x="206.0" y="201.0" class="uphy-3-collision-2d-s" style="fill:var(--fig-red)">p_B = 2000 × 15.0</text>
  <text x="206.0" y="217.0" class="uphy-3-collision-2d-s" style="fill:var(--fig-red)">= 3.00 × 10⁴ (북쪽)</text>
  <text x="30.0" y="150.0" class="uphy-3-collision-2d-t" style="fill:var(--fig-violet);font-weight:600">P = p_A + p_B</text>
  <text x="30.0" y="168.0" class="uphy-3-collision-2d-s" style="fill:var(--fig-violet)">= 4.24 × 10⁴</text>
  <text x="30.0" y="330.0" class="uphy-3-collision-2d-s">충돌 후 V = P / 3500 kg = 12.1 m/s (북동 45.0°)</text>
  <text x="30.0" y="68.0" class="uphy-3-collision-2d-s">단위: kg·m/s</text>
