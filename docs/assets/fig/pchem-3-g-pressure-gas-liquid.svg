<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-pchem-3-g-pressure-gas-liquid d-pchem-3-g-pressure-gas-liquid">
  <title id="t-pchem-3-g-pressure-gas-liquid">그림 물리화학 3-7 25 ℃에서 몰 깁스 에너지의 압력 의존: 이상 기체와 액체 물</title>
  <desc id="d-pchem-3-g-pressure-gas-liquid">G_m(p) − G_m(1 bar)를 압력에 대해 그렸다. 이상 기체는 RT ln(p/1 bar)로 10 bar에서 5.7, 100 bar에서 11.4, 1000 bar에서 17.1 kJ/mol이고 낮은 압력에서 가파르게 오른다. 액체 물은 V_m(p − 1)로 거의 평평한 직선이며 1000 bar에서 1.8 kJ/mol이다. 곡선의 기울기는 그 압력에서의 몰 부피 V_m이다.</desc>
