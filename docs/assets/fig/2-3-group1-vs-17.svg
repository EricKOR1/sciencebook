  <title id="t-2-3-group1-vs-17">그림 2-3-2 1족과 17족 원소의 전자 배치와 반응성</title>
  <desc id="d-2-3-group1-vs-17">1족은 원자가 전자가 1개이고 아래로 갈수록 전자껍질이 늘어 원자가 전자가 핵에서 멀어지므로 전자를 잃기 쉬워 반응성이 커진다. 17족은 원자가 전자가 7개로 전자 1개를 얻으면 안정해지며, 위쪽 원소일수록 원자가 작아 전자를 세게 끌어당겨 반응성이 크다.</desc>
