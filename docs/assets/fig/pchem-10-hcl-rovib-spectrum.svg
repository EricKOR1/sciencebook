<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-pchem-10-hcl-rovib-spectrum d-pchem-10-hcl-rovib-spectrum">
  <title id="t-pchem-10-hcl-rovib-spectrum">그림 물리화학 10-7 H³⁵Cl 기본음의 진동–회전 스펙트럼(300 K, 모식도)</title>
  <desc id="d-pchem-10-hcl-rovib-spectrum">선 위치는 H³⁵Cl 관측값(P(5)~R(4)는 활동 A의 표와 같은 값이고 R(5), R(6), P(6), P(7)을 더했다. R(0) = 2906.25 ~ R(6) = 3014.37, P(1) = 2865.10 ~ P(7) = 2727.77 cm⁻¹)이고, 막대 높이는 아래 준위 J의 개체 수 (2J+1)exp(−10.44·J(J+1)/208.5)에 비례하게 계산했다(최대 J = 3). 띠 중심 2885.98 cm⁻¹에는 ΔJ = 0이 금지되어 선이 없고 R(0)과 P(1) 사이가 약 4B로 벌어진다. B₁ &lt; B₀이므로 R 가지는 높은 J로 갈수록 간격이 좁아지고 P 가지는 넓어진다. 각 선 바로 왼쪽(약 2 cm⁻¹ 낮은 파수)의 1/3 높이 막대는 존재비가 약 1/3인 H³⁷Cl의 선이다.</desc>
