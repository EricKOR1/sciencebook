<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="t-uearth-5-decay-curve d-uearth-5-decay-curve">
<title id="t-uearth-5-decay-curve">그림 일반지구과학 5-5 방사성 붕괴 — 모원소는 줄고 자원소는 쌓인다</title>
<desc id="d-uearth-5-decay-curve">가로축은 반감기 단위의 시간이다. 모원소의 양(파랑)은 반감기마다 절반으로 줄어 1/2, 1/4, 1/8로 지수적으로 감소하고, 붕괴한 만큼 방사성 기원 자원소(빨강)가 쌓인다. 두 곡선은 반감기 1회에서 만나며, 이때 자원소/모원소 비는 1, 2회에서 3, 3회에서 7이다.</desc>
