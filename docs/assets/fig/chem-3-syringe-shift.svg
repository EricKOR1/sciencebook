<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-chem-3-syringe-shift d-chem-3-syringe-shift">
  <title id="t-chem-3-syringe-shift">그림 화학 3-5 주사기를 눌러 압력을 높일 때 2NO₂ ⇌ N₂O₄ 평형의 이동</title>
  <desc id="d-chem-3-syringe-shift">평형 혼합물이 든 주사기를 눌러 부피를 절반으로 줄이면 NO₂의 농도가 순간 2배가 되어 색이 진해진다. 이어서 기체 분자 수가 줄어드는 정반응 쪽으로 평형이 이동해 색이 조금 옅어지지만, 새 평형의 색은 처음보다 진하다. 입자 수와 색의 진하기는 모식적으로 나타냈다.</desc>
  <style>
    .c3sy-ink{fill:var(--fig-ink)} .c3sy-mut{fill:var(--fig-muted)}
    .c3sy-lbl{font-size:14px;fill:var(--fig-ink)} .c3sy-b{font-size:15px;font-weight:600;fill:var(--fig-ink)} .c3sy-sm{font-size:13px;fill:var(--fig-muted)}
    .c3sy-H{fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.2} .c3sy-O{fill:var(--fig-red);stroke:var(--fig-red);stroke-width:1} .c3sy-C{fill:var(--fig-ink);stroke:var(--fig-ink);stroke-width:1} .c3sy-N{fill:var(--fig-blue);stroke:var(--fig-blue);stroke-width:1}
    .c3sy-gl{fill:none;stroke:var(--fig-ink);stroke-width:2}
  </style>
  <text x="20" y="84" class="c3sy-b">① 처음 평형</text>
  <rect x="150" y="58" width="220" height="44" style="fill:rgba(160,70,20,0.3);stroke:none"/>
  <path d="M520 58 L150 58 L150 102 L520 102" class="c3sy-gl"/>
