  <text x="290" y="224" class="c3sy-sm" style="font-weight:600;fill:var(--fig-ink)">정반응 쪽 이동 → 조금 옅어짐</text>
  <text x="20" y="28" class="c3sy-lbl">2NO₂(g, 적갈색) ⇌ N₂O₄(g, 무색) — 기체 2몰 → 1몰</text>
  <text x="20" y="318" class="c3sy-sm">색의 진하기: ② &gt; ③ &gt; ① · 르샤틀리에 원리는 변화를 줄일 뿐 완전히 없애지는 못한다 · 모식도</text>
</svg>
