<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-ubio-6-q-density-bands d-ubio-6-q-density-bands">
  <title id="t-ubio-6-q-density-bands">그림 일반생명과학 6-13 문제 13 해설: 밀도 기울기 원심 분리 띠의 예측</title>
  <desc id="d-ubio-6-q-density-bands">왼쪽은 반보존적 복제에서 ¹⁴N 배지로 옮긴 뒤 0~3세대의 띠, 가운데는 복제가 보존적이라고 가정했을 때 1, 2세대의 띠, 오른쪽은 ¹⁴N에서 2세대 뒤 ¹⁵N으로 옮겨 1세대를 더 키운 경우이다. 띠의 굵기는 그 밀도의 DNA 분자 비율에 비례하게 그렸다.</desc>
  <style>.ubio-6-q-density-bands-t{font-size:14px;fill:var(--fig-ink)} .ubio-6-q-density-bands-s{font-size:13px;fill:var(--fig-muted)} .ubio-6-q-density-bands-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .ubio-6-q-density-bands-b{font-size:14px;font-weight:700;fill:var(--fig-ink)} .ubio-6-q-density-bands-r{font-size:14px;font-weight:700;fill:var(--fig-red)} .ubio-6-q-density-bands-bl{font-size:14px;font-weight:700;fill:var(--fig-blue)} .ubio-6-q-density-bands-g{font-size:14px;font-weight:700;fill:var(--fig-green)} .ubio-6-q-density-bands-a{font-size:14px;font-weight:700;fill:var(--fig-amber)} .ubio-6-q-density-bands-v{font-size:14px;font-weight:700;fill:var(--fig-violet)} .ubio-6-q-density-bands-sq{font-size:15px;font-weight:600;fill:var(--fig-ink)}</style>
