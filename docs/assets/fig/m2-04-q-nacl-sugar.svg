  <title id="t-m2-04-q-nacl-sugar">그림 중2-4-11 문제 14 해설: 고체와 수용액 속의 입자</title>
  <desc id="d-m2-04-q-nacl-sugar">(가) 염화 나트륨 고체에서는 나트륨 이온(+)과 염화 이온(−)이 서로 끌어당기며 제자리에 배열되어 움직이지 못한다. (나) 물에 녹으면 이온이 떨어져 자유롭게 움직이므로 전기가 통한다. (다) 설탕은 전하를 띠지 않는 분자로 녹아 있어 전기가 거의 통하지 않는다. 물 분자는 생략한 모식도이다.</desc>
