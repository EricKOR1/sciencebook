  <title id="t-uchem-1-q-agcl-ion-model">그림 일반화학 1-10 문제 14 혼합 전후의 이온 모형</title>
  <desc id="d-uchem-1-q-agcl-ion-model">입자 1개를 1.00 mmol로 나타냈다. 섞기 전 질산 은 수용액에는 Ag⁺ 10개와 NO₃⁻ 10개, 염화 칼슘 수용액에는 Ca²⁺ 4개와 Cl⁻ 8개가 있다. 섞은 뒤 Cl⁻ 8개가 모두 Ag⁺ 8개와 AgCl 앙금이 되고, 용액에는 Ag⁺ 2개, Ca²⁺ 4개, NO₃⁻ 10개가 남아 양전하 합(+10)과 음전하 합(−10)이 같다. 물 분자는 생략했다.</desc>
