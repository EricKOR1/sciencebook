<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-3-2-hotspot d-3-2-hotspot">
<title id="t-3-2-hotspot">그림 3-2-5 열점과 화산섬의 배열 (하와이)</title>
<desc id="d-3-2-hotspot">맨틀 깊은 곳에서 올라오는 열점은 거의 제자리에 있고, 판이 그 위를 지나간다. 열점 바로 위의 섬에서만 화산 활동이 활발하고, 판의 이동 방향으로 갈수록 섬의 나이가 많아지며 침식되어 낮아진다. 섬의 크기와 높이, 판의 두께는 과장한 모식도이고 나이는 대략값이다.</desc>
<style>.hs-lbl{font-size:14px;font-weight:700;fill:var(--fig-ink)}.hs-txt{font-size:13px;fill:var(--fig-ink)}.hs-sm{font-size:12px;fill:var(--fig-muted)}.hs-sea{fill:var(--fig-soft-blue)}.hs-lith{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.2}.hs-asth{fill:var(--fig-soft-red)}.hs-isl{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5}.hs-mag{fill:var(--fig-red);opacity:0.75}.hs-ar{fill:none;stroke:var(--fig-ink);stroke-width:2.5}.hs-ah{fill:var(--fig-ink)}.hs-ln{fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 3}</style>
