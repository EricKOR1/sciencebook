  <title id="t-chem-3-q-piston-compress">그림 화학 3-8 문제 15의 실린더</title>
  <desc id="d-chem-3-q-piston-compress">피스톤이 달린 실린더 속에서 A(g) ⇌ 2B(g)가 [A] = [B] = 1.0 M인 평형을 이루고 있다(가). 온도를 일정하게 유지하며 피스톤을 눌러 부피를 절반으로 줄인 직후가 (나)이다. A는 무색, B는 색이 있으며, 입자 수는 모식적이다.</desc>
