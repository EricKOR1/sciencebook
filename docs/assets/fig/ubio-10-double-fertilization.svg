<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-ubio-10-double-fertilization d-ubio-10-double-fertilization">
  <title id="t-ubio-10-double-fertilization">그림 일반생명과학 10-3 배낭(7세포 8핵)과 중복 수정</title>
  <desc id="d-ubio-10-double-fertilization">밑씨 속 배낭에는 주공 쪽에 난세포 1개와 조세포 2개, 반대쪽(합점 쪽)에 반족세포 3개, 가운데에 극핵 2개를 가진 중앙 세포 1개가 있다(7세포 8핵). 꽃가루관이 주공으로 들어와 정핵 2개를 내놓으면, 정핵 하나는 난세포와 합쳐 접합자(2n)가 되고, 다른 하나는 극핵 2개와 합쳐 배젖 핵(3n)이 된다. 모식도이다.</desc>
  <style>.ubio-10-double-fertilization-t{font-size:14px;fill:var(--fig-ink)} .ubio-10-double-fertilization-b{font-size:14px;fill:var(--fig-ink);font-weight:700} .ubio-10-double-fertilization-s{font-size:13px;fill:var(--fig-muted)} .ubio-10-double-fertilization-lead{stroke:var(--fig-muted);stroke-width:1;fill:none} .ubio-10-double-fertilization-nuc{fill:var(--fig-ink)} .ubio-10-double-fertilization-sp{fill:var(--fig-red)}</style>
  <path d="M30 70 Q14 250 34 392 Q160 474 286 392 Q306 250 290 70 Q160 20 30 70 Z" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2.5"/>
  <path d="M146 368 Q64 350 62 220 Q68 82 160 80 Q252 82 258 220 Q256 350 174 368" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <path d="M146 368 Q80 340 78 220 Q82 98 160 96 Q238 98 242 220 Q240 340 174 368" style="fill:var(--fig-panel);stroke:var(--fig-amber);stroke-width:1.5"/>
  <ellipse cx="160" cy="228" rx="60" ry="118" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
