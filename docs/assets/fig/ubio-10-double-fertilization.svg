  <polyline points="196,312 314,264" class="ubio-10-double-fertilization-lead"/>
  <text x="318" y="269" text-anchor="start" class="ubio-10-double-fertilization-t">조세포 2</text>
  <polyline points="174,294 314,232" class="ubio-10-double-fertilization-lead"/>
  <text x="318" y="237" text-anchor="start" class="ubio-10-double-fertilization-t">난세포 1</text>
  <polyline points="165,372 314,350" class="ubio-10-double-fertilization-lead"/>
  <text x="318" y="355" text-anchor="start" class="ubio-10-double-fertilization-t">정핵 2개(n)</text>
  <polyline points="274,300 314,296" class="ubio-10-double-fertilization-lead"/>
  <text x="318" y="301" text-anchor="start" class="ubio-10-double-fertilization-t">꽃가루관</text>
  <polyline points="256,170 314,136" class="ubio-10-double-fertilization-lead"/>
  <text x="318" y="141" text-anchor="start" class="ubio-10-double-fertilization-t">주피</text>
  <polyline points="296,110 314,72" class="ubio-10-double-fertilization-lead"/>
  <text x="318" y="77" text-anchor="start" class="ubio-10-double-fertilization-t">씨방 벽</text>
  <polyline points="148,372 120,392" class="ubio-10-double-fertilization-lead"/>
  <text x="116" y="398" text-anchor="end" class="ubio-10-double-fertilization-s">주공</text>
  <rect x="478" y="40" width="232" height="66" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1"/>
  <text x="490" y="64" class="ubio-10-double-fertilization-b">7세포 8핵</text>
  <text x="490" y="86" class="ubio-10-double-fertilization-s">반족 3 + 중앙 1(핵 2) + 난 1 + 조 2</text>
  <rect x="478" y="130" width="232" height="62" rx="8" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5"/>
  <text x="490" y="154" class="ubio-10-double-fertilization-t">정핵(n) + 난세포(n)</text>
  <text x="490" y="178" class="ubio-10-double-fertilization-b">→ 접합자(2n) → 배</text>
  <rect x="478" y="212" width="232" height="78" rx="8" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
  <text x="490" y="236" class="ubio-10-double-fertilization-t">정핵(n) + 극핵 2개(n + n)</text>
  <text x="490" y="260" class="ubio-10-double-fertilization-b">→ 배젖 핵(3n) → 배젖</text>
  <text x="490" y="280" class="ubio-10-double-fertilization-s">양분 저장 조직</text>
  <text x="478" y="336" class="ubio-10-double-fertilization-b">어미 식물의 조직(2n)</text>
  <text x="478" y="360" class="ubio-10-double-fertilization-t">주피 → 종피(씨껍질)</text>
  <text x="478" y="382" class="ubio-10-double-fertilization-t">씨방 벽 → 열매껍질</text>
  <text x="478" y="408" class="ubio-10-double-fertilization-s">밑씨 전체 → 종자, 씨방 → 열매</text>
</svg>
