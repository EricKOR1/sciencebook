  <circle cx="182" cy="128" r="16" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <circle cx="182" cy="128" r="4" class="ubio-10-double-fertilization-nuc"/>
  <circle cx="160" cy="150" r="16" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <circle cx="160" cy="150" r="4" class="ubio-10-double-fertilization-nuc"/>
  <circle cx="148" cy="226" r="9" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2"/>
  <circle cx="148" cy="226" r="3" class="ubio-10-double-fertilization-nuc"/>
  <circle cx="172" cy="226" r="9" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2"/>
  <circle cx="172" cy="226" r="3" class="ubio-10-double-fertilization-nuc"/>
  <ellipse cx="136" cy="318" rx="15" ry="24" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.5"/>
  <ellipse cx="184" cy="318" rx="15" ry="24" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.5"/>
  <circle cx="136" cy="324" r="4" class="ubio-10-double-fertilization-nuc"/><circle cx="184" cy="324" r="4" class="ubio-10-double-fertilization-nuc"/>
  <ellipse cx="160" cy="294" rx="18" ry="22" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2"/>
  <circle cx="160" cy="288" r="5" class="ubio-10-double-fertilization-nuc"/>
  <rect x="144" y="4" width="32" height="44" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2"/>
  <path d="M164 6 L164 50 Q164 62 190 64 Q272 72 274 200 L274 380 Q272 414 200 414 Q163 414 163 392 L163 350" style="fill:none;stroke:var(--fig-red);stroke-width:3"/>
  <text x="184" y="22" class="ubio-10-double-fertilization-s">암술대</text>
  <ellipse cx="162" cy="364" rx="4" ry="6" class="ubio-10-double-fertilization-sp"/><ellipse cx="159" cy="381" rx="4" ry="6" class="ubio-10-double-fertilization-sp"/>
  <polyline points="190,128 314,104" class="ubio-10-double-fertilization-lead"/>
  <text x="318" y="109" text-anchor="start" class="ubio-10-double-fertilization-t">반족세포 3</text>
  <polyline points="182,226 314,168" class="ubio-10-double-fertilization-lead"/>
  <text x="318" y="173" text-anchor="start" class="ubio-10-double-fertilization-t">중앙 세포 1(극핵 2개)</text>
  <polyline points="220,228 314,200" class="ubio-10-double-fertilization-lead"/>
