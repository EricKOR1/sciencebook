<circle cx="262" cy="98" r="18.5" style="fill:var(--fig-panel)"/><circle cx="290" cy="92" r="20.5" style="fill:var(--fig-panel)"/><circle cx="318" cy="98" r="16.5" style="fill:var(--fig-panel)"/><circle cx="276" cy="70" r="18.5" style="fill:var(--fig-panel)"/><circle cx="304" cy="66" r="18.5" style="fill:var(--fig-panel)"/><circle cx="290" cy="44" r="16.5" style="fill:var(--fig-panel)"/><circle cx="312" cy="40" r="12.5" style="fill:var(--fig-panel)"/><circle cx="270" cy="46" r="11.5" style="fill:var(--fig-panel)"/>
<line x1="258" y1="118" x2="252" y2="196" style="stroke:var(--fig-blue);stroke-width:1.5;stroke-dasharray:6 6"/><line x1="269" y1="118" x2="263" y2="196" style="stroke:var(--fig-blue);stroke-width:1.5;stroke-dasharray:6 6"/><line x1="280" y1="118" x2="274" y2="196" style="stroke:var(--fig-blue);stroke-width:1.5;stroke-dasharray:6 6"/><line x1="291" y1="118" x2="285" y2="196" style="stroke:var(--fig-blue);stroke-width:1.5;stroke-dasharray:6 6"/><line x1="302" y1="118" x2="296" y2="196" style="stroke:var(--fig-blue);stroke-width:1.5;stroke-dasharray:6 6"/><line x1="313" y1="118" x2="307" y2="196" style="stroke:var(--fig-blue);stroke-width:1.5;stroke-dasharray:6 6"/>
