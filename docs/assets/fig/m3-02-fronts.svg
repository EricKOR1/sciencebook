<ellipse cx="190" cy="402" rx="56" ry="11" style="fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.2"/><ellipse cx="286" cy="369" rx="62" ry="11" style="fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.2"/><ellipse cx="378" cy="333" rx="58" ry="10" style="fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.2"/><ellipse cx="446" cy="303" rx="34" ry="8" style="fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.2"/>
  <path d="M40 420 C130 404 230 374 300 352" style="fill:none;stroke:var(--fig-red);stroke-width:3"/>
  <path d="M312 348 l-14 -3 l5 12 z" style="fill:var(--fig-red)"/>
  <text x="34" y="290" class="m3-02-fronts-l" style="fill:var(--fig-red);font-weight:600">따뜻한 공기</text>
  <text x="34" y="308" class="m3-02-fronts-t">완만하게 타고 오름</text>
  <text x="472" y="436" text-anchor="end" class="m3-02-fronts-l" style="fill:var(--fig-blue);font-weight:600">찬 공기</text>
  <line x1="20" y1="450" x2="480" y2="450" style="stroke:var(--fig-ink);stroke-width:2"/>
  <path d="M112 450 a8 8 0 0 1 16 0 z" style="fill:var(--fig-red)"/>
  <text x="120" y="472" text-anchor="middle" class="m3-02-fronts-t">전선 (이동 →)</text>
  <text x="240" y="472" text-anchor="middle" class="m3-02-fronts-t" style="fill:var(--fig-blue)">넓은 지역에 약한 비</text>
  <text x="500" y="290" class="m3-02-fronts-h">온난 전선</text>
  <text x="500" y="316" class="m3-02-fronts-l">따뜻한 공기가 위로 타고 오른다</text>
  <text x="500" y="340" class="m3-02-fronts-l">전선면 기울기: 완만함</text>
  <text x="500" y="364" class="m3-02-fronts-l">구름: 층운형 (옆으로 퍼짐)</text>
  <text x="500" y="388" class="m3-02-fronts-l">비: 전선 앞쪽 넓은 지역,</text>
  <text x="514" y="408" class="m3-02-fronts-l">약한 비가 오래</text>
  <text x="500" y="432" class="m3-02-fronts-l">통과 후: 기온 상승</text>
  <text x="360" y="494" text-anchor="middle" class="m3-02-fronts-t">두 그림 모두 전선은 오른쪽으로 이동한다. 높이와 거리의 비율은 실제와 다른 모식도이다.</text>
</svg>
