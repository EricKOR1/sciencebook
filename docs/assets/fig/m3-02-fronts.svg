  <path d="M345 60 l-7 14 l13 0 z" style="fill:var(--fig-red)"/>
  <text x="472" y="40" text-anchor="end" class="m3-02-fronts-l" style="fill:var(--fig-red);font-weight:600">따뜻한 공기</text>
  <text x="472" y="58" text-anchor="end" class="m3-02-fronts-t">밀려 올라감</text>
  <line x1="56" y1="150" x2="166" y2="150" style="stroke:var(--fig-blue);stroke-width:3"/><path d="M178 150 l-13 -7 l0 14 z" style="fill:var(--fig-blue)"/>
  <text x="56" y="176" class="m3-02-fronts-l" style="fill:var(--fig-blue);font-weight:600">찬 공기</text>
  <line x1="20" y1="200" x2="480" y2="200" style="stroke:var(--fig-ink);stroke-width:2"/>
  <path d="M322 200 l8 -12 l8 12 z" style="fill:var(--fig-blue)"/>
  <text x="330" y="222" text-anchor="middle" class="m3-02-fronts-t">전선 (이동 →)</text>
  <text x="248" y="222" text-anchor="middle" class="m3-02-fronts-t" style="fill:var(--fig-blue)">소나기</text>
  <text x="500" y="40" class="m3-02-fronts-h">한랭 전선</text>
  <text x="500" y="66" class="m3-02-fronts-l">찬 공기가 밑으로 파고든다</text>
  <text x="500" y="90" class="m3-02-fronts-l">전선면 기울기: 급함</text>
  <text x="500" y="114" class="m3-02-fronts-l">구름: 적운형 (위로 솟음)</text>
  <text x="500" y="138" class="m3-02-fronts-l">비: 전선 뒤쪽 좁은 지역,</text>
  <text x="514" y="158" class="m3-02-fronts-l">소나기·천둥·번개</text>
  <text x="500" y="182" class="m3-02-fronts-l">통과 후: 기온 하강</text>
  <line x1="20" y1="245" x2="700" y2="245" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4"/>
  <!-- ② 온난 전선 -->
