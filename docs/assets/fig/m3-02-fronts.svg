<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="t-m3-02-fronts d-m3-02-fronts">
  <title id="t-m3-02-fronts">그림 중3-2-3 한랭 전선과 온난 전선의 단면</title>
  <desc id="d-m3-02-fronts">한랭 전선에서는 찬 공기가 따뜻한 공기 밑을 파고들어 전선면이 급하고, 적운형 구름이 생겨 전선 뒤쪽 좁은 지역에 소나기가 내린다. 온난 전선에서는 따뜻한 공기가 찬 공기 위로 완만하게 타고 올라 층운형 구름이 넓게 생기고, 전선 앞쪽 넓은 지역에 약한 비가 오래 내린다. 두 전선 모두 오른쪽으로 이동한다(모식도).</desc>
  <style>
    .m3-02-fronts-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .m3-02-fronts-l{font-size:14px;fill:var(--fig-ink)}
    .m3-02-fronts-t{font-size:13px;fill:var(--fig-muted)}
  </style>
  <defs><clipPath id="m3-02-fronts-c1"><rect x="20" y="10" width="460" height="190"/></clipPath><clipPath id="m3-02-fronts-c2"><rect x="20" y="260" width="460" height="190"/></clipPath></defs>
  <!-- ① 한랭 전선 -->
