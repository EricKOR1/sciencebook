<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 270" class="fig-small" role="img" aria-labelledby="t-umath-7-q-two-level d-umath-7-q-two-level">
  <title id="t-umath-7-q-two-level">그림 수학 도구 7-14 문제 16의 두 준위 계</title>
  <desc id="d-umath-7-q-two-level">두 준위 계의 에너지 준위 도표. 아래 준위(ε₀ = 0)에는 상태가 1개, 위 준위에는 같은 에너지의 상태가 3개 있고(축퇴도 3), 두 준위의 간격은 k_B × 500 K이다.</desc>
  <style>
    .umath-7-q-two-level-ax{stroke:var(--fig-ink);stroke-width:1.3;fill:none}
    .umath-7-q-two-level-grid{stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:2 4;fill:none;opacity:0.7}
    .umath-7-q-two-level-tk{font-size:13px;fill:var(--fig-muted)}
    .umath-7-q-two-level-lb{font-size:14px;fill:var(--fig-ink)}
    .umath-7-q-two-level-t{font-size:14px;fill:var(--fig-ink)}
    .umath-7-q-two-level-tb{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .umath-7-q-two-level-s{font-size:13px;fill:var(--fig-muted)}
    .umath-7-q-two-level-ink{fill:var(--fig-ink)}
    .umath-7-q-two-level-lv{stroke:var(--fig-violet);stroke-width:4;stroke-linecap:round;fill:none}
    .umath-7-q-two-level-ar{stroke:var(--fig-ink);stroke-width:1.6;fill:none}
    .umath-7-q-two-level-ax2{stroke:var(--fig-muted);stroke-width:1.2;fill:none}
    .umath-7-q-two-level-vi{font-size:14px;fill:var(--fig-violet)}
  </style>
  <defs>
    <marker id="umath-7-q-two-level-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-ink)"/></marker>
    <marker id="umath-7-q-two-level-ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-muted)"/></marker>
  </defs>
<line x1="50" y1="250" x2="50" y2="30" class="umath-7-q-two-level-ax2" marker-end="url(#umath-7-q-two-level-ah-muted)"/>
<text x="38" y="140" text-anchor="middle" transform="rotate(-90 38 140)" class="umath-7-q-two-level-s">에너지</text>
<line x1="170" y1="220" x2="230" y2="220" class="umath-7-q-two-level-lv"/>
<line x1="110" y1="80" x2="156" y2="80" class="umath-7-q-two-level-lv"/>
<line x1="170" y1="80" x2="216" y2="80" class="umath-7-q-two-level-lv"/>
<line x1="230" y1="80" x2="276" y2="80" class="umath-7-q-two-level-lv"/>
<text x="70" y="225" class="umath-7-q-two-level-t">ε₀ = 0</text>
<text x="70" y="62" class="umath-7-q-two-level-t">ε₁</text>
<text x="200" y="246" text-anchor="middle" class="umath-7-q-two-level-vi">상태 1개 (g₀ = 1)</text>
<text x="200" y="64" text-anchor="middle" class="umath-7-q-two-level-vi">상태 3개 (g₁ = 3)</text>
<line x1="320" y1="220" x2="320" y2="82" class="umath-7-q-two-level-ar" marker-end="url(#umath-7-q-two-level-ah-ink)"/>
<line x1="312" y1="220" x2="328" y2="220" class="umath-7-q-two-level-ar"/>
<text x="332" y="146.0" class="umath-7-q-two-level-t">ε₁ − ε₀</text>
<text x="332" y="166.0" class="umath-7-q-two-level-t">= k_B × 500 K</text>
</svg>
