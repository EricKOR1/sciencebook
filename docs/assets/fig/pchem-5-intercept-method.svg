<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-pchem-5-intercept-method d-pchem-5-intercept-method">
  <title id="t-pchem-5-intercept-method">그림 물리화학 5-3 절편법: 평균 몰 부피 곡선의 접선과 부분 몰 부피</title>
  <desc id="d-pchem-5-intercept-method">평균 몰 부피 V_m을 x_B에 대해 그린 모식도. 점선은 두 순수 성분의 몰 부피 V_A*와 V_B*를 잇는 이상 혼합 직선이고, 실선은 그보다 아래로 처진 실제 V_m이다. x_B = 0.4에서 그은 접선이 x_B = 0 축과 만나는 높이가 V_A(0.4), x_B = 1 축과 만나는 높이가 V_B(0.4)이다. 벗어남은 보기 쉽게 과장했다.</desc>
