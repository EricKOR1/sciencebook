<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-labelledby="t-phy-2-wire-force d-phy-2-wire-force">
  <title id="t-phy-2-wire-force">그림 물리학 2-4 자기장 속의 전류가 받는 힘</title>
  <desc id="d-phy-2-wire-force">자석의 N극에서 S극으로 향하는 자기장 속에 도선이 종이면에 수직으로 놓여 있다. ⊙는 종이면에서 나오는 전류, ⊗는 들어가는 전류이다. 힘은 전류와 자기장 모두에 수직이며, 전류 방향을 바꾸면 힘의 방향도 반대가 된다.</desc>
