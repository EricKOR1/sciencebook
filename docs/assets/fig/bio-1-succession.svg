  <title id="t-bio-1-succession">그림 생명과학 1-7 군집의 천이 과정</title>
  <desc id="d-bio-1-succession">1차 천이는 토양이 없는 용암 대지에서 지의류, 이끼, 초원, 관목림, 양수림, 혼합림을 거쳐 음수림(극상)에 이른다. 2차 천이는 토양이 남아 있는 곳에서 초원 단계부터 시작한다. 단계가 진행될수록 토양이 두꺼워진다. 모식도.</desc>
