  <text x="360.0" y="300.0" text-anchor="middle" class="b1suc-sm">아래 갈색 층 = 토양. 지의류와 이끼가 바위를 풍화시키고 유기물을 보태 토양이 점점 두꺼워진다</text>
  <text x="360.0" y="318.0" text-anchor="middle" class="b1suc-sm">숲이 우거지면 바닥이 어두워져 그늘에서도 잘 자라는 음수의 어린나무가 양수를 대신한다</text>

