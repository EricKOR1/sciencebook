  <title id="t-pchem-2-q-carnot-shape">그림 물리화학 2-17 문제 13의 카르노 순환</title>
  <desc id="d-pchem-2-q-carnot-shape">p–V 도표에 나타낸 카르노 순환. A→B는 500 K 등온 팽창, B→C는 단열 팽창, C→D는 300 K 등온 압축, D→A는 단열 압축이다. 가로축에는 VA = 2.00 L, VB = 5.00 L만 표시했고 VC, VD는 문제에서 구한다.</desc>
