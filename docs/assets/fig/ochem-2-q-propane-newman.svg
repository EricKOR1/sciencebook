<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" class="fig-small" role="img" aria-labelledby="t-ochem-2-q-propane-newman d-ochem-2-q-propane-newman">
  <title id="t-ochem-2-q-propane-newman">그림 유기화학 2-8 프로페인 C1–C2 결합의 뉴먼 투영식</title>
  <desc id="d-ochem-2-q-propane-newman">앞 탄소 C1(점)에는 H 3개, 뒤 탄소 C2(원)에는 CH₃ 1개와 H 2개가 있다. (가) 엇갈린 형태(에너지 0). (나) 가린 형태: 뒤 CH₃가 앞 H와 겹치고, 나머지 두 쌍은 H/H로 겹친다. 겹친 쌍마다 4.0, 4.0, 6.0 kJ/mol을 더해 약 14 kJ/mol이다.</desc>
