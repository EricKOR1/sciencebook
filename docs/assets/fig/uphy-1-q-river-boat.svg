  <desc id="d-uphy-1-q-river-boat">(1) 뱃머리를 정북으로 향하면 물에 대한 속도 2.00 m/s(북)와 물의 속도 1.20 m/s(동)가 더해져 땅에 대한 속도는 2.33 m/s가 되고, 40.0 s 동안 하류로 48.0 m 떠내려간다. (2) 뱃머리를 상류 쪽으로 36.9° 돌리면 두 속도의 합이 정북을 향하고 크기는 1.60 m/s이며, 건너는 데 50.0 s가 걸린다. 강의 거리와 속도 화살표는 각각 같은 비율로 그렸다.</desc>
