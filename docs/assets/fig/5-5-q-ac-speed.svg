<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-labelledby="t-5-5-q-ac-speed d-5-5-q-ac-speed">
  <title id="t-5-5-q-ac-speed">그림 5-5-10 문제 13 해설: 돌리는 빠르기에 따른 전류의 변화</title>
  <desc id="d-5-5-q-ac-speed">같은 시간 동안의 전류를 같은 눈금으로 비교하였다. 돌리는 빠르기를 2배로 하면 전류의 최대 크기가 커지고(그래프가 높아짐), 같은 시간 동안 방향이 바뀌는 횟수가 2배가 된다(물결이 촘촘해짐). 최대 크기는 대략적인 모식도이다.</desc>
