<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" class="fig-small" role="img" aria-labelledby="t-uchem-11-q-ni-plating d-uchem-11-q-ni-plating">
  <title id="t-uchem-11-q-ni-plating">그림 일반화학 11-9 예제 13의 니켈 도금 장치</title>
  <desc id="d-uchem-11-q-ni-plating">직류 전원의 (−)극에 강철판(도금할 넓이 50.0 cm²)을, (+)극에 니켈판을 연결하고 Ni²⁺ 수용액에 담가 2.50 A로 30.0분 동안 전류를 흘린다.</desc>
  <style>.uchem-11-q-ni-plating-t{font-size:14px;fill:var(--fig-ink)} .uchem-11-q-ni-plating-s{font-size:13px;fill:var(--fig-muted)} .uchem-11-q-ni-plating-b{font-size:15px;font-weight:600;fill:var(--fig-ink)} .uchem-11-q-ni-plating-x{font-size:13px;fill:var(--fig-ink)}</style>
  <rect x="0" y="0" width="480" height="300" style="fill:none;stroke:none"/>
  <rect x="185.0" y="20.0" width="110.0" height="46.0" rx="6" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2"/>
  <text x="240.0" y="48.0" text-anchor="middle" class="uchem-11-q-ni-plating-t">직류 전원</text>
  <text x="198.0" y="86.0" text-anchor="middle" class="uchem-11-q-ni-plating-b">−</text>
  <text x="282.0" y="86.0" text-anchor="middle" class="uchem-11-q-ni-plating-b">+</text>
  <circle cx="198.0" cy="66.0" r="4" style="fill:var(--fig-ink);stroke:none"/>
  <circle cx="282.0" cy="66.0" r="4" style="fill:var(--fig-ink);stroke:none"/>
  <path d="M198 66 L198 72 L130 72 L130 104" style="fill:none;stroke:var(--fig-ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>
  <path d="M282 66 L282 72 L350 72 L350 104" style="fill:none;stroke:var(--fig-ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>
  <text x="240.0" y="102.0" text-anchor="middle" class="uchem-11-q-ni-plating-x">2.50 A, 30.0분</text>
  <rect x="61.0" y="146.0" width="358.0" height="123.0" rx="0" style="fill:var(--fig-soft-green);fill-opacity:0.7;stroke:none"/>
  <path d="M60 125 L60 270 L420 270 L420 125" style="fill:none;stroke:var(--fig-muted);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>
  <rect x="121.0" y="104.0" width="18.0" height="140.0" rx="0" style="fill:var(--fig-muted);stroke:var(--fig-ink);stroke-width:1.4"/>
  <rect x="341.0" y="104.0" width="18.0" height="140.0" rx="0" style="fill:var(--fig-line);stroke:var(--fig-ink);stroke-width:1.4"/>
  <text x="114.0" y="128.0" text-anchor="end" class="uchem-11-q-ni-plating-b">강철판</text>
  <text x="114.0" y="146.0" text-anchor="end" class="uchem-11-q-ni-plating-s">50.0 cm²</text>
  <text x="366.0" y="128.0" class="uchem-11-q-ni-plating-b">니켈판</text>
  <text x="240.0" y="225.0" text-anchor="middle" class="uchem-11-q-ni-plating-x">Ni²⁺ 수용액(NiSO₄)</text>
  <text x="240.0" y="292.0" text-anchor="middle" class="uchem-11-q-ni-plating-s">전류 효율 100 %로 가정</text>
