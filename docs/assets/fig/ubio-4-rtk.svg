  <title id="t-ubio-4-rtk">그림 일반생명과학 4-2 수용체 타이로신 인산화 효소의 활성화</title>
  <desc id="d-ubio-4-rtk">리간드가 없으면 수용체 타이로신 인산화 효소는 단량체로 흩어져 있다. 리간드가 붙으면 두 수용체가 모여 이량체가 되고 서로의 타이로신을 인산화한다. 인산화된 타이로신마다 서로 다른 중계 단백질이 붙어 여러 경로가 동시에 켜진다.</desc>
