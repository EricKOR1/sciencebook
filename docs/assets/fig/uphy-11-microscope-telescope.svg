<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-uphy-11-microscope-telescope d-uphy-11-microscope-telescope">
  <title id="t-uphy-11-microscope-telescope">그림 일반물리학 11-3 복합 현미경과 굴절 망원경의 광선 경로</title>
  <desc id="d-uphy-11-microscope-telescope">(가) 복합 현미경: 물체를 대물렌즈의 초점 F_ob 바로 바깥에 두면 거꾸로 선 확대 실상이 생기고, 그 실상이 접안렌즈의 초점 F_e에 오도록 하면 접안렌즈를 나온 빛이 나란해져 눈은 무한대에 있는 큰 허상을 본다. 대물렌즈의 뒤 초점과 접안렌즈의 앞 초점 사이가 경통 길이 s이다. (나) 굴절 망원경: 먼 별에서 각 θ로 들어온 나란한 빛이 대물렌즈의 초점면에 실상을 맺고, 두 렌즈 사이는 f_ob + f_e이다. 접안렌즈를 나온 빛은 더 큰 각 θ′로 나아가며 각배율은 θ′/θ = f_ob/f_e이고 상은 거꾸로 선다. 크기와 각을 과장한 모식도이다.</desc>
