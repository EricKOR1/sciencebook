    .uchem-5-dipole-sums-nh{fill:var(--fig-accent)}
    .uchem-5-dipole-sums-el{font-size:13px;fill:var(--fig-ink);font-weight:bold}
    .uchem-5-dipole-sums-sep{stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 3}
  </style>
