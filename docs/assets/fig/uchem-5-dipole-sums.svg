<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-uchem-5-dipole-sums d-uchem-5-dipole-sums">
  <title id="t-uchem-5-dipole-sums">그림 일반화학 5-6 결합 쌍극자의 벡터 합과 분자의 극성</title>
  <desc id="d-uchem-5-dipole-sums">빨간 화살표는 결합 쌍극자(δ+ 쪽 꼬리의 + 표시에서 δ− 쪽으로), 파란 굵은 화살표는 분자 전체의 쌍극자이다. NH₃는 세 N–H 쌍극자가 모두 N 쪽(위)을 향하고 비공유 전자쌍도 같은 쪽에 있어 1.47 D로 크다. NF₃는 N–F 쌍극자가 F 쪽(아래)을 향해 위쪽의 비공유 전자쌍 효과와 거의 상쇄되어 0.23 D에 그친다. 1,2-다이클로로에텐은 두 C–Cl 쌍극자가 같은 쪽에 있는 cis형은 극성(약 1.9 D), 정반대인 trans형은 상쇄되어 무극성(0 D)이다. 모식도이다.</desc>
