    .uchem-5-dipole-sums-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-5-dipole-sums-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-5-dipole-sums-b{font-size:15px;fill:var(--fig-ink);font-weight:bold}
    .uchem-5-dipole-sums-ax{stroke:var(--fig-ink);stroke-width:1.2;fill:none}
    .uchem-5-dipole-sums-gr{stroke:var(--fig-line);stroke-width:0.6;fill:none;stroke-dasharray:2 3}

    .uchem-5-dipole-sums-bd{stroke:var(--fig-ink);stroke-width:2.2;fill:none}
    .uchem-5-dipole-sums-N{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.4}
    .uchem-5-dipole-sums-H{fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.4}
    .uchem-5-dipole-sums-F{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.4}
    .uchem-5-dipole-sums-C{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4}
    .uchem-5-dipole-sums-lp{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.2}
