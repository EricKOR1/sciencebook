<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-astro-1-differentiation d-astro-1-differentiation">
  <title id="t-astro-1-differentiation">그림 행성우주과학 1-5 원시 물질 천체와 분화된 천체의 단면, 그리고 운석의 출신</title>
  <desc id="d-astro-1-differentiation">녹은 적이 없는 작은 천체는 콘드룰과 먼지, 얼음이 층 없이 뒤섞여 있어 콘드라이트의 고향이 된다. 내부가 녹은 천체는 무거운 철·니켈이 가라앉아 핵이, 가벼운 규산염이 맨틀과 지각이 된다. 이런 천체가 깨지면 핵에서 철 운석, 핵–맨틀 경계에서 석철 운석, 지각·맨틀에서 무구조 운석이 나온다. 크기 비율은 실제와 다른 모식도이다.</desc>
