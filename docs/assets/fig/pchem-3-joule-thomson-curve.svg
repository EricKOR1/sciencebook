<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-pchem-3-joule-thomson-curve d-pchem-3-joule-thomson-curve">
  <title id="t-pchem-3-joule-thomson-curve">그림 물리화학 3-5 판데르발스 기체(N₂)의 낮은 압력 줄–톰슨 계수</title>
  <desc id="d-pchem-3-joule-thomson-curve">질소의 판데르발스 상수로 계산한 μ_JT = (2a/RT − b)/C_p,m 을 온도에 대해 그렸다. 100 K에서 약 1.00 K/bar, 298 K에서 0.25 K/bar이고, 역전 온도 2a/Rb ≈ 852 K에서 0이 된다. 그보다 낮으면 팽창할 때 식고(인력 우세), 높으면 데워진다(배제 부피 우세).</desc>
