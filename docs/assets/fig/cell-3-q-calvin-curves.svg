  <title id="t-cell-3-q-calvin-curves">그림 세포와 물질대사 3-12 예제 7 풀이: 조건을 바꾼 직후 3PG와 RuBP의 양</title>
  <desc id="d-cell-3-q-calvin-curves">(가) 빛을 끄면 3PG는 늘고 RuBP는 줄어든다. (나) 빛은 그대로 두고 CO₂ 공급을 끊으면 3PG는 줄고 RuBP는 늘어난다. 경향을 나타낸 모식도이다.</desc>
