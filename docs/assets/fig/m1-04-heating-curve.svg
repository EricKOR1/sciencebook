<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="t-m1-04-heating-curve d-m1-04-heating-curve">
  <title id="t-m1-04-heating-curve">그림 중1-4-5 얼음의 가열 곡선</title>
  <desc id="d-m1-04-heating-curve">−20 °C 얼음을 1기압에서 일정한 세기로 가열할 때 시간에 따른 온도 변화이다. 녹는 동안(B–C, 0 °C)과 끓는 동안(D–E, 100 °C)에는 열을 계속 받는데도 온도가 일정하며, 기화 구간이 융해 구간보다 훨씬 길다. 구간의 길이는 모식적이다.</desc>
  <style>
    .hc-red{fill:none;stroke:var(--fig-red)} .hc-redh{fill:var(--fig-red)}
    .hc-blue{fill:none;stroke:var(--fig-blue)} .hc-blueh{fill:var(--fig-blue)}
    .hc-green{fill:none;stroke:var(--fig-green)} .hc-greenh{fill:var(--fig-green)}
    .hc-amber{fill:none;stroke:var(--fig-amber)} .hc-amberh{fill:var(--fig-amber)}
    .hc-violet{fill:none;stroke:var(--fig-violet)} .hc-violeth{fill:var(--fig-violet)}
    .hc-teal{fill:none;stroke:var(--fig-teal)} .hc-tealh{fill:var(--fig-teal)}
    .hc-ink{fill:none;stroke:var(--fig-ink)} .hc-inkh{fill:var(--fig-ink)}
    .hc-muted{fill:none;stroke:var(--fig-muted)} .hc-mutedh{fill:var(--fig-muted)}
    .hc-line{fill:none;stroke:var(--fig-line)} .hc-lineh{fill:var(--fig-line)}
    .hc-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .hc-t{font-size:14px;fill:var(--fig-ink)}
    .hc-sm{font-size:13px;fill:var(--fig-muted)}
    .hc-redb{font-size:14px;font-weight:700;fill:var(--fig-red)}
    .hc-sred{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.6}
    .hc-blueb{font-size:14px;font-weight:700;fill:var(--fig-blue)}
    .hc-sblue{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6}
    .hc-greenb{font-size:14px;font-weight:700;fill:var(--fig-green)}
    .hc-sgreen{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.6}
    .hc-amberb{font-size:14px;font-weight:700;fill:var(--fig-amber)}
    .hc-samber{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.6}
    .hc-violetb{font-size:14px;font-weight:700;fill:var(--fig-violet)}
    .hc-sviolet{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.6}
    .hc-tealb{font-size:14px;font-weight:700;fill:var(--fig-teal)}
    .hc-steal{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.6}
    .hc-panel{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.4}
    .hc-paper{fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1.4}
    .hc-axis{fill:none;stroke:var(--fig-ink);stroke-width:1.6}
    .hc-grid{fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 4}
    .hc-dash{fill:none;stroke:var(--fig-muted);stroke-width:1.4;stroke-dasharray:5 4}
  </style>
