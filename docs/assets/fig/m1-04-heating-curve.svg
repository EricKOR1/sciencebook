  <circle cx="108.0" cy="250.0" r="4.5" class="hc-inkh"/>
  <circle cx="213.0" cy="250.0" r="4.5" class="hc-inkh"/>
  <circle cx="360.0" cy="83.3" r="4.5" class="hc-inkh"/>
  <circle cx="620.0" cy="83.3" r="4.5" class="hc-inkh"/>
  <text x="102.0" y="287.3" class="hc-h">A</text>
  <text x="104.0" y="238.0" text-anchor="middle" class="hc-h">B</text>
  <text x="217.0" y="238.0" text-anchor="middle" class="hc-h">C</text>
  <text x="356.0" y="71.3" text-anchor="middle" class="hc-h">D</text>
  <text x="624.0" y="71.3" text-anchor="middle" class="hc-h">E</text>
  <text x="118.0" y="294.0" class="hc-sm">고체</text>
  <text x="160.0" y="222.0" text-anchor="middle" class="hc-t">고체 + 액체</text>
  <text x="162.0" y="272.0" text-anchor="middle" class="hc-violetb">융해 · 0 °C 일정</text>
  <text x="305.0" y="185.0" class="hc-sm">액체</text>
  <text x="490.0" y="60.0" text-anchor="middle" class="hc-t">액체 + 기체</text>
  <text x="490.0" y="112.0" text-anchor="middle" class="hc-violetb">기화(끓음) · 100 °C 일정</text>
  <text x="490.0" y="132.0" text-anchor="middle" class="hc-sm">B–C보다 훨씬 길다</text>
  <line x1="110.0" y1="340.0" x2="631.0" y2="340.0" class="hc-amber" style="stroke-width:2;stroke-linecap:round"/>
  <path d="M640.0 340.0 L631.0 344.3 L631.0 335.7 Z" class="hc-amberh"/>
  <text x="375.0" y="362.0" text-anchor="middle" class="hc-sm">열에너지를 일정한 세기로 계속 흡수한다 (구간 길이는 모식적)</text>
</svg>
