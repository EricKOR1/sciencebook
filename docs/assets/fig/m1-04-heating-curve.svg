  <line x1="90.0" y1="83.3" x2="650.0" y2="83.3" class="hc-grid" style="stroke-width:1;stroke-linecap:round"/>
  <line x1="90.0" y1="300.0" x2="661.0" y2="300.0" class="hc-ink" style="stroke-width:1.6;stroke-linecap:round"/>
