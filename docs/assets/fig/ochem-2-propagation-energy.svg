<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-ochem-2-propagation-energy d-ochem-2-propagation-energy">
  <title id="t-ochem-2-propagation-energy">그림 유기화학 2-20 메테인 염소화의 두 전파 단계 에너지 도표</title>
  <desc id="d-ochem-2-propagation-energy">세로축은 엔탈피(kJ/mol, CH₄ + Cl· = 0). CH₄ + Cl·에서 첫 전이 상태 [Cl···H···CH₃]‡(약 +16, Ea ≈ 16)를 넘어 HCl + ·CH₃(+7)가 되고, 작은 장벽의 두 번째 전이 상태를 지나 CH₃Cl + Cl·(−101)이 된다. 점선은 같은 축척의 브로민화 첫 단계(0 → 약 +78 → +73)로 장벽이 훨씬 높다. 곡선 모양은 모식도이다.</desc>
