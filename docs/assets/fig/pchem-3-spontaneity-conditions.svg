<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-pchem-3-spontaneity-conditions d-pchem-3-spontaneity-conditions">
  <title id="t-pchem-3-spontaneity-conditions">그림 물리화학 3-2 자발성 기준을 쓰는 두 가지 실험 조건</title>
  <desc id="d-pchem-3-spontaneity-conditions">같은 클라우지우스 부등식 T dS ≥ dq에서 출발한다. 왼쪽: 온도 T인 항온조에 잠긴 단단한 강철 용기(부피 고정)는 벽을 통해 열 dq만 주고받으므로 일정 T, V에서 dA ≤ 0이 기준이다. 오른쪽: 같은 항온조 속 마찰 없는 피스톤 실린더는 일정한 외부 압력 p 아래에서 열 dq를 주고받으며 부피가 dV만큼 바뀌므로 일정 T, p에서 dG ≤ 0이 기준이다.</desc>
