<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="t-m1-05-friction-test d-m1-05-friction-test">
  <title id="t-m1-05-friction-test">그림 중1-5-7 마찰력의 크기 비교 실험</title>
  <desc id="d-m1-05-friction-test">나무 도막을 용수철저울로 수평으로 천천히 끌어 일정한 빠르기로 움직일 때, 끄는 힘과 마찰력이 평형을 이루므로 저울의 눈금이 마찰력의 크기이다. 접촉면이 거칠수록, 누르는 힘이 클수록(도막을 포갤수록) 마찰력이 크다. 화살표 길이는 모식적이다.</desc>
