<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-phy-2-wireless-charging d-phy-2-wireless-charging">
  <title id="t-phy-2-wireless-charging">그림 물리학 2-6 무선 충전 — 송신 코일과 수신 코일</title>
  <desc id="d-phy-2-wireless-charging">충전 패드의 송신 코일에 교류가 흐르면 방향과 세기가 계속 바뀌는 자기장이 생기고, 이 자기장이 위에 놓인 스마트폰의 수신 코일을 지나며 유도 전류를 만든다. 수신 코일이 멀어지면 그 코일을 지나는 자기장(자기력선)이 줄어 유도 전류가 약해진다(모식도, 단면).</desc>
  <style>
    .phy-2-wireless-charging-lbl{font-size:14px;fill:var(--fig-ink)} .phy-2-wireless-charging-sm{font-size:13px;fill:var(--fig-muted)} .phy-2-wireless-charging-b{font-weight:600}
  </style>
