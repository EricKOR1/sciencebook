<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-uchem-8-ice-graph d-uchem-8-ice-graph">
  <title id="t-uchem-8-ice-graph">그림 일반화학 8-4 ICE 표와 Q(x) 그래프로 본 평형 계산</title>
  <desc id="d-uchem-8-ice-graph">예제 7(PCl₅ ⇌ PCl₃ + Cl₂, K = 0.0420, 처음 0.100 M)의 ICE 표를 세운 뒤, 변화량 x에 따른 Q(x) = x²/(0.100 − x)를 그렸다. 곡선이 K 선과 만나는 x = 0.0471이 평형이다. 분모의 x를 무시한 작은 K 근사(점선)는 x = 0.0648을 주어 크게 틀린다.</desc>
  <style>.uchem-8-ice-graph-t{font-size:14px;fill:var(--fig-ink)} .uchem-8-ice-graph-s{font-size:13px;fill:var(--fig-muted)} .uchem-8-ice-graph-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .uchem-8-ice-graph-ax{stroke:var(--fig-ink);stroke-width:1.3;fill:none} .uchem-8-ice-graph-grid{stroke:var(--fig-line);stroke-width:0.7;stroke-dasharray:3 3;fill:none} </style>
  <text x="20" y="26" text-anchor="start" class="uchem-8-ice-graph-h">① ICE 표 (단위 M)</text>
  <rect x="20" y="40" width="250" height="136" rx="6" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1"/>
  <rect x="20" y="142" width="250" height="34" rx="0" style="fill:var(--fig-soft-green);stroke:none"/>
  <line x1="20" y1="74" x2="270" y2="74" style="stroke:var(--fig-line);stroke-width:1"/>
  <line x1="20" y1="108" x2="270" y2="108" style="stroke:var(--fig-line);stroke-width:1"/>
  <line x1="20" y1="142" x2="270" y2="142" style="stroke:var(--fig-line);stroke-width:1"/>
  <text x="42" y="62" text-anchor="middle" class="uchem-8-ice-graph-t" style="font-weight:600"></text>
  <text x="42" y="96" text-anchor="middle" class="uchem-8-ice-graph-t" style="font-weight:600">I</text>
  <text x="42" y="130" text-anchor="middle" class="uchem-8-ice-graph-t" style="font-weight:600">C</text>
  <text x="42" y="164" text-anchor="middle" class="uchem-8-ice-graph-t" style="font-weight:600">E</text>
  <line x1="64" y1="40" x2="64" y2="176" style="stroke:var(--fig-line);stroke-width:1"/>
  <text x="101" y="62" text-anchor="middle" class="uchem-8-ice-graph-t" style="font-weight:600">PCl₅</text>
  <text x="101" y="96" text-anchor="middle" class="uchem-8-ice-graph-t">0.100</text>
  <text x="101" y="130" text-anchor="middle" class="uchem-8-ice-graph-t">−x</text>
  <text x="101" y="164" text-anchor="middle" class="uchem-8-ice-graph-t">0.100 − x</text>
  <line x1="138" y1="40" x2="138" y2="176" style="stroke:var(--fig-line);stroke-width:1"/>
  <text x="171" y="62" text-anchor="middle" class="uchem-8-ice-graph-t" style="font-weight:600">PCl₃</text>
  <text x="171" y="96" text-anchor="middle" class="uchem-8-ice-graph-t">0</text>
  <text x="171" y="130" text-anchor="middle" class="uchem-8-ice-graph-t">+x</text>
  <text x="171" y="164" text-anchor="middle" class="uchem-8-ice-graph-t">x</text>
  <line x1="204" y1="40" x2="204" y2="176" style="stroke:var(--fig-line);stroke-width:1"/>
  <text x="237" y="62" text-anchor="middle" class="uchem-8-ice-graph-t" style="font-weight:600">Cl₂</text>
  <text x="237" y="96" text-anchor="middle" class="uchem-8-ice-graph-t">0</text>
  <text x="237" y="130" text-anchor="middle" class="uchem-8-ice-graph-t">+x</text>
  <text x="237" y="164" text-anchor="middle" class="uchem-8-ice-graph-t">x</text>
  <text x="20" y="202" text-anchor="start" class="uchem-8-ice-graph-h">② E 줄을 K 식에 넣는다</text>
  <text x="20" y="226" text-anchor="start" class="uchem-8-ice-graph-t">Q(x) = x² / (0.100 − x) = K</text>
  <text x="20" y="250" text-anchor="start" class="uchem-8-ice-graph-h">③ 근의 공식: x = 0.0471 M</text>
  <text x="20" y="274" text-anchor="start" class="uchem-8-ice-graph-t">PCl₅ 0.0529, PCl₃ = Cl₂ = 0.0471 M</text>
  <text x="20" y="298" text-anchor="start" class="uchem-8-ice-graph-h">④ 검산: 0.0471² / 0.0529 = 0.0419</text>
  <text x="20" y="322" text-anchor="start" class="uchem-8-ice-graph-s">x가 처음 농도의 47 %라 근사는 쓸 수 없다</text>
  <line x1="402" y1="30" x2="402" y2="300" style="stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3"/>
  <text x="402" y="316" text-anchor="middle" class="uchem-8-ice-graph-s">0.02</text>
  <line x1="474" y1="30" x2="474" y2="300" style="stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3"/>
  <text x="474" y="316" text-anchor="middle" class="uchem-8-ice-graph-s">0.04</text>
  <line x1="546" y1="30" x2="546" y2="300" style="stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3"/>
  <text x="546" y="316" text-anchor="middle" class="uchem-8-ice-graph-s">0.06</text>
  <line x1="618" y1="30" x2="618" y2="300" style="stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3"/>
  <text x="618" y="316" text-anchor="middle" class="uchem-8-ice-graph-s">0.08</text>
  <line x1="690" y1="30" x2="690" y2="300" style="stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3"/>
  <text x="690" y="316" text-anchor="middle" class="uchem-8-ice-graph-s">0.10</text>
  <text x="324" y="250" text-anchor="end" class="uchem-8-ice-graph-s">0.02</text>
  <text x="324" y="196" text-anchor="end" class="uchem-8-ice-graph-s">0.04</text>
  <text x="324" y="142" text-anchor="end" class="uchem-8-ice-graph-s">0.06</text>
  <text x="324" y="88" text-anchor="end" class="uchem-8-ice-graph-s">0.08</text>
  <text x="324" y="34" text-anchor="end" class="uchem-8-ice-graph-s">0.10</text>
  <text x="324" y="304" text-anchor="end" class="uchem-8-ice-graph-s">0</text>
  <path d="M330 26 L330 300 L690 300" class="uchem-8-ice-graph-ax"/>
  <text x="690" y="334" text-anchor="end" class="uchem-8-ice-graph-t">변화량 x (M)</text>
  <text x="338" y="40" text-anchor="start" class="uchem-8-ice-graph-t" style="font-weight:600">Q(x)</text>
  <line x1="330" y1="186.6" x2="690" y2="186.6" style="stroke:var(--fig-red);stroke-width:2"/>
  <text x="686" y="178.6" text-anchor="end" class="uchem-8-ice-graph-t" style="fill:var(--fig-red);font-weight:600">K = 0.0420</text>
