  <circle cx="499.6" cy="186.6" r="5.5" style="fill:var(--fig-accent);stroke:var(--fig-panel);stroke-width:1.5"/>
  <text x="493.6" y="146.6" text-anchor="end" class="uchem-8-ice-graph-t" style="fill:var(--fig-accent);font-weight:700">평형 x = 0.0471</text>
  <line x1="495.6" y1="150.6" x2="499.6" y2="179.6" style="stroke:var(--fig-accent);stroke-width:1"/>
  <circle cx="563.3" cy="186.6" r="4.5" style="fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:2"/>
  <text x="569.3" y="208.6" text-anchor="start" class="uchem-8-ice-graph-s">근사 x = 0.0648 (틀림)</text>
  <text x="628.8" y="97.5" text-anchor="end" class="uchem-8-ice-graph-t" style="fill:var(--fig-accent)">정확한 Q(x)</text>
  <text x="686" y="46" text-anchor="end" class="uchem-8-ice-graph-s">x²/0.100 (근사)</text>
  <text x="373.2" y="254" text-anchor="middle" class="uchem-8-ice-graph-s" style="fill:var(--fig-blue)">Q &lt; K</text>
  <text x="373.2" y="270" text-anchor="middle" class="uchem-8-ice-graph-s" style="fill:var(--fig-blue)">→ 정반응</text>
</svg>
