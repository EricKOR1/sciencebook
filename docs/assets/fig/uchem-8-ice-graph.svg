  <path d="M330 300 L333.6 300 L337.2 299.9 L340.8 299.8 L344.4 299.6 L348 299.3 L351.6 299 L355.2 298.7 L358.8 298.3 L362.4 297.8 L366 297.3 L369.6 296.7 L373.2 296.1 L376.8 295.4 L380.4 294.7 L384 293.9 L387.6 293.1 L391.2 292.2 L394.8 291.3 L398.4 290.3 L402 289.2 L405.6 288.1 L409.2 286.9 L412.8 285.7 L416.4 284.4 L420 283.1 L423.6 281.7 L427.2 280.3 L430.8 278.8 L434.4 277.3 L438 275.7 L441.6 274.1 L445.2 272.4 L448.8 270.6 L452.4 268.8 L456 266.9 L459.6 265 L463.2 263 L466.8 261 L470.4 258.9 L474 256.8 L477.6 254.6 L481.2 252.4 L484.8 250.1 L488.4 247.7 L492 245.3 L495.6 242.9 L499.2 240.4 L502.8 237.8 L506.4 235.2 L510 232.5 L513.6 229.8 L517.2 227 L520.8 224.2 L524.4 221.3 L528 218.3 L531.6 215.3 L535.2 212.3 L538.8 209.2 L542.4 206 L546 202.8 L549.6 199.5 L553.2 196.2 L556.8 192.8 L560.4 189.4 L564 185.9 L567.6 182.4 L571.2 178.8 L574.8 175.2 L578.4 171.5 L582 167.7 L585.6 163.9 L589.2 160 L592.8 156.1 L596.4 152.1 L600 148.1 L603.6 144 L607.2 139.9 L610.8 135.7 L614.4 131.5 L618 127.2 L621.6 122.9 L625.2 118.5 L628.8 114 L632.4 109.5 L636 104.9 L639.6 100.3 L643.2 95.6 L646.8 90.9 L650.4 86.1 L654 81.3 L657.6 76.4 L661.2 71.5 L664.8 66.5 L668.4 61.4 L672 56.3 L675.6 51.2 L679.2 46 L682.8 40.7 L686.4 35.4 L690 30" style="fill:none;stroke:var(--fig-muted);stroke-width:2;stroke-dasharray:6 4"/>
