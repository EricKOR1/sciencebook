<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-pchem-12-q-viscosity-plot d-pchem-12-q-viscosity-plot">
  <title id="t-pchem-12-q-viscosity-plot">그림 물리화학 12-16 문제 18 해설: 1/k 대 점성도</title>
  <desc id="d-pchem-12-q-viscosity-plot">물(0.890 mPa s, 1/k = 3.34)과 글리세롤 혼합 용매(4.45 mPa s, 1/k = 8.70)의 두 점(단위 10⁻¹⁰ M s)을 잇는 직선 1/k = 2.00 + 1.51η. 세로 절편 2.00이 1/k_a, 기울기 1.51이 3/(8RT)로 확산의 기여이다. 점선은 원점을 지나는 기울기 1.51의 직선으로, 순수 확산 지배일 때의 1/k이다.</desc>
