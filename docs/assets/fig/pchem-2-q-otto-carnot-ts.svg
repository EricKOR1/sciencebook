<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-pchem-2-q-otto-carnot-ts d-pchem-2-q-otto-carnot-ts">
  <title id="t-pchem-2-q-otto-carnot-ts">그림 물리화학 2-20 문제 17 해설: 오토 순환과 카르노 순환의 T–S 도표</title>
  <desc id="d-pchem-2-q-otto-carnot-ts">오토 순환(r = 8, 300~1800 K, 칠한 도형)은 두 수직선(가역 단열)과 두 등적 곡선으로 둘러싸이며 엔트로피 폭은 20.0 J/K, 넓이(일)는 13.0 kJ이다. 비교용 카르노 순환(점선 직사각형)은 같은 받은 열 23.1 kJ를 1800 K에서 받으므로 폭이 12.8 J/K이고 넓이(일)는 19.2 kJ이다. 두 넓이의 차 6.2 kJ가 잃어버린 일 300 K × 20.7 J/K와 같다.</desc>
