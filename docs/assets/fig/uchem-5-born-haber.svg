<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="t-uchem-5-born-haber d-uchem-5-born-haber">
  <title id="t-uchem-5-born-haber">그림 일반화학 5-1 염화 나트륨의 본–하버 순환</title>
  <desc id="d-uchem-5-born-haber">원소 상태 Na(s) + ½Cl₂(g)를 0으로 놓고 각 단계의 엔탈피 변화(kJ/mol)를 실제 비율대로 쌓은 에너지 사다리. 승화(+107), Cl–Cl 결합 절반 끊기(+121), 이온화(+496), 전자 친화(−349)를 거친 기체 이온이 결정을 이루며 786 kJ/mol을 내놓아(격자 에너지), 전체적으로 생성 엔탈피 −411 kJ/mol이 된다.</desc>
  <style>
    .uchem-5-bh-lv{stroke:var(--fig-ink);stroke-width:2;fill:none}
    .uchem-5-bh-ax{stroke:var(--fig-muted);stroke-width:1;fill:none}
    .uchem-5-bh-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-5-bh-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-5-bh-b{font-weight:600}
  </style>
  <line x1="44" y1="42.6" x2="44" y2="496.2" class="uchem-5-bh-ax"/>
  <line x1="40" y1="474.6" x2="44" y2="474.6" class="uchem-5-bh-ax"/><text x="36" y="478.6" text-anchor="end" class="uchem-5-bh-s" style="font-size:12px">−400</text>
  <line x1="40" y1="402.6" x2="44" y2="402.6" class="uchem-5-bh-ax"/><text x="36" y="406.6" text-anchor="end" class="uchem-5-bh-s" style="font-size:12px">−200</text>
  <line x1="40" y1="330.6" x2="44" y2="330.6" class="uchem-5-bh-ax"/><text x="36" y="334.6" text-anchor="end" class="uchem-5-bh-s" style="font-size:12px">0</text>
  <line x1="40" y1="258.6" x2="44" y2="258.6" class="uchem-5-bh-ax"/><text x="36" y="262.6" text-anchor="end" class="uchem-5-bh-s" style="font-size:12px">200</text>
  <line x1="40" y1="186.6" x2="44" y2="186.6" class="uchem-5-bh-ax"/><text x="36" y="190.6" text-anchor="end" class="uchem-5-bh-s" style="font-size:12px">400</text>
  <line x1="40" y1="114.6" x2="44" y2="114.6" class="uchem-5-bh-ax"/><text x="36" y="118.6" text-anchor="end" class="uchem-5-bh-s" style="font-size:12px">600</text>
  <line x1="40" y1="42.6" x2="44" y2="42.6" class="uchem-5-bh-ax"/><text x="36" y="46.6" text-anchor="end" class="uchem-5-bh-s" style="font-size:12px">800</text>
  <text x="14" y="273" text-anchor="middle" transform="rotate(-90 14 273)" class="uchem-5-bh-s">엔탈피 (kJ/mol)</text>
  <line x1="64" y1="330.6" x2="300" y2="330.6" class="uchem-5-bh-lv"/>
  <text x="296" y="323.6" text-anchor="end" class="uchem-5-bh-t">Na(s) + ½Cl₂(g)</text>
  <line x1="150" y1="292.1" x2="390" y2="292.1" class="uchem-5-bh-lv"/>
  <text x="386" y="285.1" text-anchor="end" class="uchem-5-bh-t">Na(g) + ½Cl₂(g)</text>
  <line x1="240" y1="248.6" x2="480" y2="248.6" class="uchem-5-bh-lv"/>
  <text x="476" y="241.6" text-anchor="end" class="uchem-5-bh-t">Na(g) + Cl(g)</text>
  <line x1="330" y1="70" x2="650" y2="70" class="uchem-5-bh-lv"/>
  <text x="646" y="63" text-anchor="end" class="uchem-5-bh-t">Na⁺(g) + e⁻ + Cl(g)</text>
  <line x1="450" y1="195.6" x2="700" y2="195.6" class="uchem-5-bh-lv"/>
  <text x="696" y="188.6" text-anchor="end" class="uchem-5-bh-t">Na⁺(g) + Cl⁻(g)</text>
  <line x1="64" y1="478.6" x2="700" y2="478.6" class="uchem-5-bh-lv"/>
  <text x="696" y="471.6" text-anchor="end" class="uchem-5-bh-t">NaCl(s)</text>
  <line x1="166" y1="330.6" x2="166" y2="300.1" style="stroke:var(--fig-red);stroke-width:2.6;fill:none"/>
  <path d="M166 292.1 l-6 11 l12 0 z" style="fill:var(--fig-red)"/>
  <text x="175" y="309.4" text-anchor="start" class="uchem-5-bh-t uchem-5-bh-b" style="fill:var(--fig-red)">① +107</text>
  <text x="175" y="326.4" text-anchor="start" class="uchem-5-bh-s">승화</text>
  <line x1="256" y1="292.1" x2="256" y2="256.6" style="stroke:var(--fig-red);stroke-width:2.6;fill:none"/>
  <path d="M256 248.6 l-6 11 l12 0 z" style="fill:var(--fig-red)"/>
  <text x="265" y="268.3" text-anchor="start" class="uchem-5-bh-t uchem-5-bh-b" style="fill:var(--fig-red)">② +121</text>
  <text x="265" y="285.3" text-anchor="start" class="uchem-5-bh-s">½ Cl–Cl</text>
  <line x1="346" y1="248.6" x2="346" y2="78" style="stroke:var(--fig-red);stroke-width:2.6;fill:none"/>
  <path d="M346 70 l-6 11 l12 0 z" style="fill:var(--fig-red)"/>
  <text x="355" y="157.3" text-anchor="start" class="uchem-5-bh-t uchem-5-bh-b" style="fill:var(--fig-red)">③ +496</text>
  <text x="355" y="174.3" text-anchor="start" class="uchem-5-bh-s">이온화 에너지</text>
  <line x1="612" y1="70" x2="612" y2="187.6" style="stroke:var(--fig-blue);stroke-width:2.6;fill:none"/>
  <path d="M612 195.6 l-6 -11 l12 0 z" style="fill:var(--fig-blue)"/>
  <text x="603" y="130.8" text-anchor="end" class="uchem-5-bh-t uchem-5-bh-b" style="fill:var(--fig-blue)">④ −349</text>
  <text x="603" y="147.8" text-anchor="end" class="uchem-5-bh-s">전자 친화</text>
  <line x1="672" y1="195.6" x2="672" y2="470.6" style="stroke:var(--fig-blue);stroke-width:2.6;fill:none"/>
  <path d="M672 478.6 l-6 -11 l12 0 z" style="fill:var(--fig-blue)"/>
  <text x="663" y="335.1" text-anchor="end" class="uchem-5-bh-t uchem-5-bh-b" style="fill:var(--fig-blue)">⑤ −786</text>
  <text x="663" y="352.1" text-anchor="end" class="uchem-5-bh-s">격자 에너지 U의</text>
  <text x="663" y="369.1" text-anchor="end" class="uchem-5-bh-s">역과정(−U)</text>
  <line x1="84" y1="330.6" x2="84" y2="470.6" style="stroke:var(--fig-green);stroke-width:2.6;fill:none"/>
  <path d="M84 478.6 l-6 -11 l12 0 z" style="fill:var(--fig-green)"/>
  <text x="93" y="402.6" text-anchor="start" class="uchem-5-bh-t uchem-5-bh-b" style="fill:var(--fig-green)">ΔH°f = −411</text>
  <text x="93" y="419.6" text-anchor="start" class="uchem-5-bh-s">생성 엔탈피</text>
  <text x="360" y="512.6" text-anchor="middle" class="uchem-5-bh-t">헤스 법칙: −411 = 107 + 121 + 496 − 349 − U  →  U = 786 kJ/mol</text>
  <text x="360" y="532.6" text-anchor="middle" class="uchem-5-bh-s">빨강: 에너지가 드는 단계, 파랑: 에너지가 나오는 단계. 이온을 만드는 비용(③ + ④ = +147)을 ⑤가 갚고 남는다</text>
</svg>
