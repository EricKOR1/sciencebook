<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-astro-2-parallax d-astro-2-parallax">
  <title id="t-astro-2-parallax">그림 행성우주과학 2-1 연주시차의 기하</title>
  <desc id="d-astro-2-parallax">6개월 간격으로 지구 공전 궤도의 양 끝에서 가까운 별을 보면 먼 배경 별에 대해 위치가 달라 보인다. 그 각도의 절반이 연주시차 p이고, 거리 d(pc)는 1/p(″)이다.</desc>
  <style>
    .astro-2-parallax-ink{fill:var(--fig-ink)} .astro-2-parallax-mut{fill:var(--fig-muted)}
    .astro-2-parallax-lbl{font-size:14px;fill:var(--fig-ink)} .astro-2-parallax-sm{font-size:13px;fill:var(--fig-muted)} .astro-2-parallax-b{font-weight:600}
    .astro-2-parallax-ax{stroke:var(--fig-line);stroke-width:1.5;fill:none}
    
  </style>
  <text x="20" y="28" class="astro-2-parallax-lbl astro-2-parallax-b">지구 공전 궤도를 밑변으로 한 삼각 측량</text>
  <!-- 배경 별 -->
  <rect x="630" y="50" width="80" height="260" rx="8" style="fill:var(--fig-soft-violet)"/>
  <text x="670" y="70" text-anchor="middle" class="astro-2-parallax-sm">먼 배경 별</text>
  <circle cx="654.3" cy="201.6" r="2.1" style="fill:var(--fig-violet)"/>
  <circle cx="676.2" cy="219.2" r="1.6" style="fill:var(--fig-violet)"/>
  <circle cx="640.8" cy="264.9" r="1.9" style="fill:var(--fig-violet)"/>
  <circle cx="654.1" cy="299.1" r="2.2" style="fill:var(--fig-violet)"/>
  <circle cx="690.2" cy="186.9" r="2.5" style="fill:var(--fig-violet)"/>
  <circle cx="649.0" cy="221.1" r="2.8" style="fill:var(--fig-violet)"/>
  <circle cx="671.4" cy="244.1" r="2.5" style="fill:var(--fig-violet)"/>
  <circle cx="643.8" cy="247.8" r="2.4" style="fill:var(--fig-violet)"/>
  <circle cx="658.1" cy="90.7" r="2.8" style="fill:var(--fig-violet)"/>
  <circle cx="668.4" cy="239.3" r="2.8" style="fill:var(--fig-violet)"/>
  <circle cx="682.8" cy="283.0" r="2.1" style="fill:var(--fig-violet)"/>
  <circle cx="688.1" cy="180.0" r="2.9" style="fill:var(--fig-violet)"/>
  <circle cx="692.7" cy="105.1" r="1.7" style="fill:var(--fig-violet)"/>
  <circle cx="653.0" cy="292.5" r="2.2" style="fill:var(--fig-violet)"/>
  <circle cx="677.6" cy="149.0" r="2.3" style="fill:var(--fig-violet)"/>
  <circle cx="663.2" cy="159.8" r="2.4" style="fill:var(--fig-violet)"/>
  <!-- 공전 궤도 -->
  <ellipse cx="130" cy="200" rx="34" ry="70" style="fill:none;stroke:var(--fig-line);stroke-width:1.5;stroke-dasharray:5 4"/>
  <circle cx="130" cy="200" r="13" style="fill:var(--fig-amber)"/>
  <text x="104" y="204" text-anchor="end" class="astro-2-parallax-lbl">태양</text>
  <circle cx="130" cy="130" r="7" style="fill:var(--fig-blue)"/>
  <circle cx="130" cy="270" r="7" style="fill:var(--fig-blue)"/>
  <text x="118" y="124" text-anchor="end" class="astro-2-parallax-sm">지구(1월)</text>
  <text x="118" y="290" text-anchor="end" class="astro-2-parallax-sm">지구(7월)</text>
  <line x1="144" y1="132" x2="144" y2="198" style="stroke:var(--fig-ink);stroke-width:1.2"/>
  <text x="150" y="170" class="astro-2-parallax-sm">1 AU</text>
  <!-- 시선 -->
  <line x1="130" y1="130" x2="690" y2="230.5" style="stroke:var(--fig-blue);stroke-width:1.6"/>
  <line x1="130" y1="270" x2="690" y2="169.5" style="stroke:var(--fig-red);stroke-width:1.6"/>
  <line x1="130" y1="200" x2="520" y2="200" style="stroke:var(--fig-muted);stroke-width:1.4;stroke-dasharray:6 4"/>
  <text x="300" y="218" text-anchor="middle" class="astro-2-parallax-lbl">거리 d</text>
  <!-- 가까운 별 -->
  <circle cx="520" cy="200" r="9" style="fill:var(--fig-amber);stroke:var(--fig-ink);stroke-width:1.2"/>
  <text x="530" y="180" class="astro-2-parallax-lbl astro-2-parallax-b">가까운 별</text>
  <path d="M470 191 A50 50 0 0 1 470.6 200" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/>
  <text x="452" y="186" text-anchor="end" class="astro-2-parallax-lbl astro-2-parallax-b" style="fill:var(--fig-accent)">p</text>
  <circle cx="690" cy="230.5" r="5" style="fill:none;stroke:var(--fig-blue);stroke-width:2"/>
  <circle cx="690" cy="169.5" r="5" style="fill:none;stroke:var(--fig-red);stroke-width:2"/>
  <text x="626" y="248" text-anchor="end" class="astro-2-parallax-sm" style="fill:var(--fig-blue)">1월에 보이는 위치</text>
  <text x="626" y="160" text-anchor="end" class="astro-2-parallax-sm" style="fill:var(--fig-red)">7월에 보이는 위치</text>
  <!-- 식 -->
  <rect x="200" y="56" width="300" height="66" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1"/>
  <text x="350" y="82" text-anchor="middle" class="astro-2-parallax-lbl astro-2-parallax-b">d (pc) = 1 / p (″)</text>
  <text x="350" y="106" text-anchor="middle" class="astro-2-parallax-sm">p = 1″이면 d = 1 pc ≈ 3.26광년</text>
  <text x="360" y="328" text-anchor="middle" class="astro-2-parallax-sm">모식도: 실제 연주시차는 1″보다 작아, 각도를 매우 크게 과장해 그렸다</text>
</svg>
