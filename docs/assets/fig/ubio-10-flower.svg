<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-ubio-10-flower d-ubio-10-flower">
  <title id="t-ubio-10-flower">그림 일반생명과학 10-7 꽃의 구조와 수분·수정 후의 변화</title>
  <desc id="d-ubio-10-flower">속씨식물 꽃의 세로 단면 모식도. 바깥에서부터 꽃받침, 꽃잎, 수술(꽃밥과 수술대), 가운데 암술(암술머리, 암술대, 씨방)이 꽃턱 위에 붙어 있다. 씨방 속에는 밑씨가 있다. 암술머리에 붙은 꽃가루가 꽃가루관을 뻗어 암술대를 지나 밑씨의 주공으로 들어간다. 수정 후 밑씨는 종자, 씨방 벽은 열매껍질이 된다.</desc>
