  <desc id="d-earth-1-q-tank-experiment">긴 수조에 미지근한 물을 채우고, 왼쪽 끝에는 얼음주머니를 담그고 그 근처에 색소를 탄 진한 소금물을 떨어뜨렸으며, 오른쪽 끝에는 전등을 비추었다. 색소를 탄 물이 바닥으로 가라앉아 반대편으로 퍼져 나갔다.</desc>
