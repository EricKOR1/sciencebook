<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 425" role="img" aria-labelledby="t-ochem-3-three-point-binding d-ochem-3-three-point-binding">
  <title id="t-ochem-3-three-point-binding">그림 유기화학 3-20 세 점 결합 모형</title>
  <desc id="d-ochem-3-three-point-binding">모형. 단백질 결합 자리(회색 판)에 세 홈 A(+ 전하), B(수소 결합 주개), C(소수성 주머니)가 삼각형으로 있다. 왼쪽 (R)-만델산 이온은 a(−COO⁻)가 A에, b(−OH)가 B에, c(−C₆H₅)가 C에 꽂히고 H는 위를 향해 세 점이 모두 맞는다. 오른쪽 (S)-형(거울상)은 a를 A에, b를 B에 맞추면 c가 위로 향하고 H가 C 쪽에 와서 두 점까지만 맞는다.</desc>
