  <text x="129" y="438.7" class="kf-sm kf-halo">제주도</text>
  <text x="328.4" y="235.4" text-anchor="middle" class="kf-sea-t kf-halo">동해</text>
  <text x="51.4" y="243.1" text-anchor="middle" class="kf-sea-t kf-halo">황해(서해)</text>
  <text x="179" y="394.9" text-anchor="middle" class="kf-sea-t kf-halo">남해</text>
