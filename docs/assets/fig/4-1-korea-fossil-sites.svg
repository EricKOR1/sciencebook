  <circle cx="99.3" cy="341.4" r="7" class="kf-mz"/><text x="111.3" y="346.4" text-anchor="start" class="kf-lbl kf-halo">해남</text>
  <rect x="484" y="8" width="228" height="454" rx="6" class="kf-box"/>
  <text x="498" y="34" class="kf-h">고생대 지층</text>
  <circle cx="506" cy="56" r="7" class="kf-pz"/>
  <text x="520" y="61" class="kf-sm">강원 태백·영월 일대</text>
  <text x="520" y="81" class="kf-sm">삼엽충 등 바다 생물 화석</text>
  <text x="520" y="101" class="kf-mu">→ 당시 이곳은 바다였다</text>
  <text x="498" y="146" class="kf-h">중생대(백악기) 지층</text>
  <circle cx="506" cy="168" r="7" class="kf-mz"/>
  <text x="520" y="173" class="kf-sm">경남 고성: 공룡 발자국</text>
  <circle cx="506" cy="196" r="7" class="kf-mz"/>
  <text x="520" y="201" class="kf-sm">경기 화성: 공룡알</text>
  <circle cx="506" cy="224" r="7" class="kf-mz"/>
  <text x="520" y="229" class="kf-sm">전남 해남 우항리:</text>
  <text x="520" y="249" class="kf-sm">공룡·익룡·새 발자국</text>
  <text x="520" y="269" class="kf-mu">→ 당시 이곳은 호숫가·물가</text>
  <text x="520" y="289" class="kf-mu">(육지)였다</text>
  <text x="498" y="330" class="kf-sm">경상도 일대에는 백악기</text>
  <text x="498" y="350" class="kf-sm">지층이 넓게 퍼져 있어</text>
  <text x="498" y="370" class="kf-sm">공룡 화석 산지가 많다.</text>
  <text x="498" y="410" class="kf-mu">점의 위치는 대략적이다.</text>
  <text x="498" y="430" class="kf-mu">작은 섬은 생략한 모식 지도.</text>
</svg>
