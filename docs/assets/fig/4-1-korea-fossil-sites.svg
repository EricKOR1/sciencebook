<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-4-1-korea-fossil-sites d-4-1-korea-fossil-sites">
  <title id="t-4-1-korea-fossil-sites">그림 4-1-6 우리나라의 대표적인 고생대·중생대 화석 산지</title>
  <desc id="d-4-1-korea-fossil-sites">강원도 태백·영월 일대에는 삼엽충 화석이 나오는 고생대 지층이 있고, 경남 고성, 경기 화성, 전남 해남 등에는 공룡 발자국·공룡알 화석이 나오는 중생대 백악기 지층이 있다. 위치는 대략적으로 표시한 모식 지도이며 작은 섬은 생략했다.</desc>
  <style>
    .kf-sea{fill:var(--fig-soft-blue);stroke:var(--fig-line);stroke-width:1}
    .kf-land{fill:var(--fig-soft-green);stroke:var(--fig-line);stroke-width:0.8;fill-rule:evenodd}
    .kf-grat{fill:none;stroke:var(--fig-line);stroke-width:0.5;stroke-dasharray:2 3;opacity:0.7}
    .kf-pz{fill:var(--fig-blue);stroke:var(--fig-paper);stroke-width:2}
    .kf-mz{fill:var(--fig-red);stroke:var(--fig-paper);stroke-width:2}
    .kf-city{fill:var(--fig-ink)}
    .kf-lbl{font-size:14px;font-weight:700;fill:var(--fig-ink)}
    .kf-sm{font-size:13px;fill:var(--fig-ink)}
    .kf-mu{font-size:13px;fill:var(--fig-muted)}
    .kf-sea-t{font-size:14px;fill:var(--fig-blue);font-style:italic}
    .kf-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:4px;stroke-linejoin:round}
    .kf-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1}
    .kf-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
  </style>
