<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-earth-1-oxygen-profile d-earth-1-oxygen-profile">
  <title id="t-earth-1-oxygen-profile">그림 지구과학 1-4 용존 산소량의 연직 분포</title>
  <desc id="d-earth-1-oxygen-profile">용존 산소량은 표층에서 많고, 수백 m에서 약 1000 m 사이에서 가장 적은 산소 최소층이 나타나며, 더 깊은 곳에서는 고위도에서 가라앉은 물이 흘러들어 다시 많아진다. 모식도이다.</desc>
  <style>
    .earth-1-oxygen-profile-t{font-size:14px;fill:var(--fig-ink)}
    .earth-1-oxygen-profile-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .earth-1-oxygen-profile-s{font-size:13px;fill:var(--fig-muted)}
    .earth-1-oxygen-profile-land{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:0.8;fill-rule:evenodd}
    .earth-1-oxygen-profile-sea{fill:var(--fig-soft-blue)}
    .earth-1-oxygen-profile-grat{fill:none;stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3;opacity:0.7}
    .earth-1-oxygen-profile-frame{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .earth-1-oxygen-profile-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
<rect x="100" y="50" width="320" height="330" style="fill:var(--fig-panel);stroke:var(--fig-line)"/><line x1="100" y1="50" x2="420" y2="50" style="stroke:var(--fig-line);stroke-width:0.5;stroke-dasharray:3 3"/><text x="92" y="55" text-anchor="end" class="earth-1-oxygen-profile-s">0</text><line x1="100" y1="132.5" x2="420" y2="132.5" style="stroke:var(--fig-line);stroke-width:0.5;stroke-dasharray:3 3"/><text x="92" y="137.5" text-anchor="end" class="earth-1-oxygen-profile-s">1000</text><line x1="100" y1="215" x2="420" y2="215" style="stroke:var(--fig-line);stroke-width:0.5;stroke-dasharray:3 3"/><text x="92" y="220" text-anchor="end" class="earth-1-oxygen-profile-s">2000</text><line x1="100" y1="297.5" x2="420" y2="297.5" style="stroke:var(--fig-line);stroke-width:0.5;stroke-dasharray:3 3"/><text x="92" y="302.5" text-anchor="end" class="earth-1-oxygen-profile-s">3000</text><line x1="100" y1="380" x2="420" y2="380" style="stroke:var(--fig-line);stroke-width:0.5;stroke-dasharray:3 3"/><text x="92" y="385" text-anchor="end" class="earth-1-oxygen-profile-s">4000</text><text x="40" y="22" text-anchor="start" class="earth-1-oxygen-profile-b">깊이(m)</text><text x="260" y="22" text-anchor="middle" class="earth-1-oxygen-profile-b">용존 산소량 →  많음</text><text x="104" y="42" text-anchor="start" class="earth-1-oxygen-profile-s">적음</text><path d="M374.3 50 C372.8 50.8 372.8 52.9 365.1 55 C357.5 57 346.1 59.1 328.6 62.4 C311 65.7 282.9 69.2 260 74.8 C237.1 80.2 207.4 88.5 191.4 95.4 C175.4 102.2 165.5 108.4 164 116 C162.5 123.6 172.4 129.8 182.3 140.8 C192.2 151.8 209.7 165.5 223.4 182 C237.1 198.5 253.1 217.7 264.6 239.7 C276 261.8 285.9 290.6 292 314 C298.1 337.4 299.6 369 301.1 380" style="fill:none;stroke:var(--fig-teal);stroke-width:3.5"/><rect x="101" y="91.2" width="318" height="49.5" style="fill:var(--fig-soft-violet);opacity:0.6"/><path d="M374.3 50 C372.8 50.8 372.8 52.9 365.1 55 C357.5 57 346.1 59.1 328.6 62.4 C311 65.7 282.9 69.2 260 74.8 C237.1 80.2 207.4 88.5 191.4 95.4 C175.4 102.2 165.5 108.4 164 116 C162.5 123.6 172.4 129.8 182.3 140.8 C192.2 151.8 209.7 165.5 223.4 182 C237.1 198.5 253.1 217.7 264.6 239.7 C276 261.8 285.9 290.6 292 314 C298.1 337.4 299.6 369 301.1 380" style="fill:none;stroke:var(--fig-teal);stroke-width:3.5"/><line x1="420" y1="55" x2="436" y2="55" style="stroke:var(--fig-ink);stroke-width:1"/><text x="440" y="60" text-anchor="start" class="earth-1-oxygen-profile-b">표층</text><text x="440" y="78" text-anchor="start" class="earth-1-oxygen-profile-s">대기에서 녹아 들고 광합성 → 많다</text><line x1="420" y1="116" x2="436" y2="116" style="stroke:var(--fig-ink);stroke-width:1"/><text x="440" y="121" text-anchor="start" class="earth-1-oxygen-profile-b">산소 최소층</text><text x="440" y="139" text-anchor="start" class="earth-1-oxygen-profile-s">호흡·분해로 소비</text><line x1="420" y1="297.5" x2="436" y2="297.5" style="stroke:var(--fig-ink);stroke-width:1"/><text x="440" y="302.5" text-anchor="start" class="earth-1-oxygen-profile-b">심층</text><text x="440" y="320.5" text-anchor="start" class="earth-1-oxygen-profile-s">고위도 표층에서 산소를 품고</text><text x="440" y="338.5" text-anchor="start" class="earth-1-oxygen-profile-s">가라앉은 물이 흘러듦 → 다시 증가</text><text x="100" y="410" text-anchor="start" class="earth-1-oxygen-profile-s">대표적인 모양(모식도). 산소 최소층의 깊이는 해역마다 다르다.</text>
</svg>
