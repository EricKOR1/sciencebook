<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-matter-2-osmosis-ro d-matter-2-osmosis-ro">
  <title id="t-matter-2-osmosis-ro">그림 물질과 에너지 2-9 삼투와 역삼투</title>
  <desc id="d-matter-2-osmosis-ro">반투과성 막으로 나눈 U자관의 한쪽에 물, 다른 쪽에 설탕물을 넣으면 물이 설탕물 쪽으로 옮겨 가 수면 차가 생기고, 이 차이에 해당하는 압력이 삼투압이다. 용액 쪽에 삼투압보다 큰 압력을 가하면 물이 거꾸로 밀려 나간다(역삼투). 모식도이다.</desc>
  <style>
    .matter-2-osmosis-ro-tube{fill:none;stroke:var(--fig-ink);stroke-width:2.4;stroke-linejoin:round}
    .matter-2-osmosis-ro-w{fill:var(--fig-soft-blue)}
    .matter-2-osmosis-ro-s{fill:var(--fig-soft-amber)}
    .matter-2-osmosis-ro-dot{fill:var(--fig-amber)}
    .matter-2-osmosis-ro-mem{fill:none;stroke:var(--fig-violet);stroke-width:3;stroke-dasharray:4 3}
    .matter-2-osmosis-ro-ar{fill:none;stroke:var(--fig-blue);stroke-width:2.6;stroke-linecap:round}
    .matter-2-osmosis-ro-ah{fill:var(--fig-blue)}
    .matter-2-osmosis-ro-rd{fill:none;stroke:var(--fig-red);stroke-width:2;stroke-linecap:round}
    .matter-2-osmosis-ro-h1{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .matter-2-osmosis-ro-l{font-size:13.5px;fill:var(--fig-ink)}
    .matter-2-osmosis-ro-t{font-size:13px;fill:var(--fig-muted)}
  </style>
