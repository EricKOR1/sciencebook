<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-uphy-9-hall-effect d-uphy-9-hall-effect">
  <title id="t-uphy-9-hall-effect">그림 일반물리학 9-3 홀 효과: 운반자의 부호에 따라 홀 전압의 극성이 바뀐다</title>
  <desc id="d-uphy-9-hall-effect">폭 w인 띠에 전류 I가 오른쪽으로 흐르고 자기장 B가 종이 면에서 나온다. (가) 운반자가 전자이면 전자는 왼쪽으로 움직이고 로런츠 힘 q v_d × B는 아래쪽을 향해 아래 옆면에 음전하가 쌓이므로 위쪽 옆면의 전위가 높다. (나) 운반자가 양공이면 오른쪽으로 움직이고 힘은 역시 아래쪽이라 아래 옆면에 양전하가 쌓여 극성이 반대가 된다. 옆 방향 전기장 E_H의 힘이 자기력과 같아지면 정상 상태가 된다. 띠의 두께 t는 종이 면 방향이다. 모식도이다.</desc>
