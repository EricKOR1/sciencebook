<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-mech-3-shm-shadow d-mech-3-shm-shadow">
  <title id="t-mech-3-shm-shadow">그림 역학과 에너지 3-1 등속 원운동의 그림자는 단진동한다</title>
  <desc id="d-mech-3-shm-shadow">반지름 A인 원을 각속도 ω로 도는 점에 위에서 빛을 비추면 바닥의 그림자는 −A와 +A 사이를 왕복한다. 원운동의 중심 방향 가속도 Aω²의 한 성분이 그림자의 가속도 −ω²x가 되어, 가속도가 변위에 비례하고 방향이 반대인 단진동이 된다.</desc>
  <style>
    .mech-3-shm-shadow-lbl{font-size:14px;fill:var(--fig-ink)} .mech-3-shm-shadow-sm{font-size:13px;fill:var(--fig-muted)} .mech-3-shm-shadow-ink{fill:var(--fig-ink)}
  </style>
  
<line x1="125" y1="38" x2="125" y2="52" style="stroke:var(--fig-amber);stroke-width:2"/>  <line x1="155" y1="38" x2="155" y2="52" style="stroke:var(--fig-amber);stroke-width:2"/>  <line x1="185" y1="38" x2="185" y2="52" style="stroke:var(--fig-amber);stroke-width:2"/>  <line x1="215" y1="38" x2="215" y2="52" style="stroke:var(--fig-amber);stroke-width:2"/>  <line x1="245" y1="38" x2="245" y2="52" style="stroke:var(--fig-amber);stroke-width:2"/>  <line x1="275" y1="38" x2="275" y2="52" style="stroke:var(--fig-amber);stroke-width:2"/>  <line x1="305" y1="38" x2="305" y2="52" style="stroke:var(--fig-amber);stroke-width:2"/>  <line x1="335" y1="38" x2="335" y2="52" style="stroke:var(--fig-amber);stroke-width:2"/>  <line x1="95.0" y1="30.0" x2="95.0" y2="52.0" style="stroke:var(--fig-amber);stroke-width:2.2"/><path d="M95.0 62.0 L90.0 52.0 L100.0 52.0 Z" style="fill:var(--fig-amber)"/>  <text x="87" y="24" class="mech-3-shm-shadow-sm" style="fill:var(--fig-amber)">위에서 비추는 빛</text>  <circle cx="240" cy="160" r="105" style="fill:none;stroke:var(--fig-line);stroke-width:2"/>  <circle cx="240" cy="160" r="3" class="mech-3-shm-shadow-ink"/>  <line x1="240" y1="160" x2="320.4" y2="92.5" style="stroke:var(--fig-muted);stroke-width:1.5"/>  <path d="M270 160 A30 30 0 0 0 263.0 140.7" style="fill:none;stroke:var(--fig-ink);stroke-width:1.3"/><text x="276" y="154" class="mech-3-shm-shadow-sm" style="fill:var(--fig-ink)">ωt</text>  <text x="260.2" y="123.6" class="mech-3-shm-shadow-sm" style="fill:var(--fig-ink)">A</text>  <line x1="320.4" y1="92.5" x2="283.9" y2="123.2" style="stroke:var(--fig-red);stroke-width:2.8"/><path d="M276.2 129.6 L280.6 119.4 L287.1 127.0 Z" style="fill:var(--fig-red)"/>  <text x="270.2" y="121.6" class="mech-3-shm-shadow-sm" style="fill:var(--fig-red)" text-anchor="end">가속도 Aω²</text>  <circle cx="320.4" cy="92.5" r="8" style="fill:var(--fig-blue);stroke:var(--fig-ink);stroke-width:1.5"/>  <text x="332.4" y="84.5" class="mech-3-shm-shadow-lbl" style="fill:var(--fig-blue);font-weight:600">원운동하는 점</text>  <line x1="320.4" y1="100.5" x2="320.4" y2="292" style="stroke:var(--fig-blue);stroke-width:1.3;stroke-dasharray:5 4"/>  <rect x="95" y="308" width="290" height="10" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.5"/>  <text x="391" y="318" class="mech-3-shm-shadow-sm" style="fill:var(--fig-teal)">바닥(화면)</text>  <line x1="135" y1="294" x2="135" y2="306" style="stroke:var(--fig-ink);stroke-width:1.5"/><text x="135" y="338" text-anchor="middle" class="mech-3-shm-shadow-sm" style="fill:var(--fig-ink)">−A</text>  <line x1="240" y1="294" x2="240" y2="306" style="stroke:var(--fig-ink);stroke-width:1.5"/><text x="240" y="338" text-anchor="middle" class="mech-3-shm-shadow-sm" style="fill:var(--fig-ink)">0</text>  <line x1="345" y1="294" x2="345" y2="306" style="stroke:var(--fig-ink);stroke-width:1.5"/><text x="345" y="338" text-anchor="middle" class="mech-3-shm-shadow-sm" style="fill:var(--fig-ink)">+A</text>  <line x1="135" y1="300" x2="345" y2="300" style="stroke:var(--fig-ink);stroke-width:1.2"/>  <circle cx="320.4" cy="300" r="7" class="mech-3-shm-shadow-ink"/>  <line x1="320.4" y1="284.0" x2="286.2" y2="284.0" style="stroke:var(--fig-red);stroke-width:2.8"/><path d="M276.2 284.0 L286.2 279.0 L286.2 289.0 Z" style="fill:var(--fig-red)"/>  <text x="246" y="274" class="mech-3-shm-shadow-sm" style="fill:var(--fig-red)">그림자의 가속도 −ω²x</text>  <path d="M240 346 L240 352 L320.4 352 L320.4 346" style="fill:none;stroke:var(--fig-violet);stroke-width:1.5"/><text x="280.2" y="368" text-anchor="middle" class="mech-3-shm-shadow-sm" style="fill:var(--fig-violet)">x = A cos ωt</text>  <rect x="500" y="70" width="204" height="210" rx="10" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1"/>  <text x="516" y="98" class="mech-3-shm-shadow-lbl" style="font-weight:600">그림자(한 성분)의 운동</text>  <text x="516" y="132" class="mech-3-shm-shadow-sm">변위</text><text x="516" y="151" class="mech-3-shm-shadow-lbl">x = A cos ωt</text>  <text x="516" y="176" class="mech-3-shm-shadow-sm">속도</text><text x="516" y="195" class="mech-3-shm-shadow-lbl">v = −Aω sin ωt</text>  <text x="516" y="220" class="mech-3-shm-shadow-sm">가속도</text><text x="516" y="239" class="mech-3-shm-shadow-lbl">a = −ω²x</text>  <text x="516" y="266" class="mech-3-shm-shadow-sm" style="fill:var(--fig-red)">가속도 ∝ 변위, 방향은 반대</text>
</svg>
