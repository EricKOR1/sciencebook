<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-umath-2-stirling-peak d-umath-2-stirling-peak">
  <title id="t-umath-2-stirling-peak">그림 수학 도구 2-13 x²⁰e⁻ˣ의 봉우리와 가우스 근사(N = 20)</title>
  <desc id="d-umath-2-stirling-peak">감마 함수의 피적분 함수 x^N e^(−x)(N = 20, 최댓값으로 나눔, 실선)는 x = N에서 봉우리를 이루고, 같은 정점과 폭 √N ≈ 4.47을 갖는 가우스 함수 exp(−(x − 20)²/40)(점선)와 거의 겹친다. 원래 곡선은 오른쪽 꼬리가 조금 더 긴 비대칭이며, N이 클수록 가우스 함수에 더 가까워진다.</desc>
