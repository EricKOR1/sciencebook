<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-esys-3-absorption-spectrum d-esys-3-absorption-spectrum">
  <title id="t-esys-3-absorption-spectrum">그림 지구시스템과학 3-1 태양 복사·지구 복사와 대기의 선택적 흡수</title>
  <desc id="d-esys-3-absorption-spectrum">위: 태양(약 5800 K)과 지표(약 288 K)가 내는 복사의 세기를 각각 최댓값이 같도록 맞춘 곡선으로, 태양 복사는 약 0.5 μm(가시광선), 지구 복사는 약 10 μm(적외선) 부근에서 가장 강하다. 아래: 파장별 대기의 흡수 정도를 단순화한 모식도로, 자외선은 산소·오존이, 적외선은 수증기·이산화 탄소가 대부분 흡수하고 가시광선과 약 8~12 μm(대기의 창)는 잘 통과한다.</desc>
