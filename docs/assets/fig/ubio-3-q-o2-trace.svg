<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-ubio-3-q-o2-trace d-ubio-3-q-o2-trace">
  <title id="t-ubio-3-q-o2-trace">그림 일반생명과학 3-10 문제 4 해설 저해제와 짝풀림 물질에 따른 산소 소비와 ATP 합성(모식)</title>
  <desc id="d-ubio-3-q-o2-trace">위: NADH를 만드는 기질이 든 용기에 미토콘드리아를 넣고 ADP, 올리고마이신, 짝풀림 물질(DNP), 시안화물을 차례로 넣을 때 용기 속 산소량의 변화. 기울기가 가파를수록 산소 소비가 빠르다(속도 10, 50, 8, 80, 0 nmol O₂/분으로 그린 모식도). 아래: 같은 구간의 ATP 합성 속도(상댓값). 올리고마이신 뒤에는 ATP 합성이 멈추고 산소 소비도 줄며, DNP를 넣으면 산소 소비는 가장 빨라지지만 ATP는 만들어지지 않고, 시안화물을 넣으면 둘 다 멈춘다.</desc>
