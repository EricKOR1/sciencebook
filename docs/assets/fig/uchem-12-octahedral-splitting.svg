<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 445" role="img" aria-labelledby="t-uchem-12-octahedral-splitting d-uchem-12-octahedral-splitting">
  <title id="t-uchem-12-octahedral-splitting">그림 일반화학 12-5 팔면체 결정장에서 d 오비탈의 갈라짐</title>
  <desc id="d-uchem-12-octahedral-splitting">고립된 금속 이온의 d 오비탈 다섯 개는 에너지가 같다. 리간드 여섯 개가 ±x, ±y, ±z 축에서 다가오면 축을 향한 eg 두 개(dx²−y², dz²)는 리간드와 정면으로 마주쳐 올라가고, 축 사이를 향한 t2g 세 개(dxy, dyz, dxz)는 덜 올라가 상대적으로 내려간다. 두 무리의 차이가 Δo이며, 평균 에너지를 기준으로 eg는 +0.6Δo, t2g는 −0.4Δo에 놓인다.</desc>
