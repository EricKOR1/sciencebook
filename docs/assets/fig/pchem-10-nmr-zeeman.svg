<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-pchem-10-nmr-zeeman d-pchem-10-nmr-zeeman">
  <title id="t-pchem-10-nmr-zeeman">그림 물리화학 10-12 자기장 속 ¹H 핵(I = ½)의 두 준위</title>
  <desc id="d-pchem-10-nmr-zeeman">¹H(γ = 2.675×10⁸ rad s⁻¹ T⁻¹)의 에너지를 진동수 단위 E/h로 그렸다. B₀ = 0에서 하나이던 준위가 기울기 ∓γ/4π인 두 직선으로 갈라져 α(m_I = +½)는 내려가고 β(m_I = −½)는 올라간다. 간격 ΔE = hν_L = γħB₀는 B₀에 비례하여 9.40 T에서 400 MHz, 14.1 T에서 600 MHz이다. 오른쪽: 자기 모멘트는 자기장 B₀ 둘레를 원뿔 모양으로 라모르 진동수 ν_L = γB₀/2π로 세차 운동한다.</desc>
