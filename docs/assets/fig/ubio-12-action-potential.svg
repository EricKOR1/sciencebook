<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 630" role="img" aria-labelledby="t-ubio-12-action-potential d-ubio-12-action-potential">
  <title id="t-ubio-12-action-potential">그림 일반생명과학 12-5 활동 전위와 전압 개폐 이온 통로의 상태</title>
  <desc id="d-ubio-12-action-potential">위: 축삭 한 지점의 막전위 변화(모식 그래프). 역치(약 −55 mV)를 넘으면 Na⁺ 유입으로 막전위가 E_Na 쪽으로 치솟고, Na⁺ 통로의 불활성화와 K⁺ 유출로 재분극된 뒤 E_K 쪽으로 잠시 과분극된다. 아래 막대는 절대 불응기와 상대 불응기. 아래: 각 단계의 전압 개폐 Na⁺ 통로(위쪽 활성화 문, 아래쪽 불활성화 문)와 K⁺ 통로의 상태. 모식도이다.</desc>
  <style>.ubio-12-action-potential-t{font-size:14px;fill:var(--fig-ink)} .ubio-12-action-potential-s{font-size:13px;fill:var(--fig-muted)} .ubio-12-action-potential-b{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-12-action-potential-k{font-size:13px;fill:var(--fig-ink)}</style>
