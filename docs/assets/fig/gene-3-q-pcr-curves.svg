  <title id="t-gene-3-q-pcr-curves">그림 생물의 유전 3-8 문제 12의 증폭 곡선</title>
  <desc id="d-gene-3-q-pcr-curves">두 시료 A와 B를 같은 조건으로 증폭할 때 주기에 따른 증폭 산물의 양이다. 점선은 검출 가능한 양이며, A는 20주기, B는 26주기에 이 양에 도달한다. 곡선 모양은 설명을 위한 모식도이다.</desc>
