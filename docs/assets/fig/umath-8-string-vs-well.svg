    .u8sw-nd{fill:var(--fig-ink)}
    .u8sw-pin{fill:var(--fig-muted)}
    .u8sw-wall{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5}
    .u8sw-lev{stroke:var(--fig-muted);stroke-width:1.2;stroke-dasharray:5 3;fill:none}
    .u8sw-band{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5}
