<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-umath-8-string-vs-well d-umath-8-string-vs-well">
  <title id="t-umath-8-string-vs-well">그림 수학 도구 8-3 양 끝 고정 줄의 정상파와 무한 우물 속 입자: 같은 고유값 문제</title>
  <desc id="d-umath-8-string-vs-well">왼쪽은 양 끝이 고정된 줄의 n = 1, 2, 3 정상파(반파장 1, 2, 3개, 검은 점은 마디)로 진동수는 f₁, 2f₁, 3f₁이다. 오른쪽은 폭 L인 무한 우물의 ψ₁, ψ₂, ψ₃을 에너지 준위 E₁, 4E₁, 9E₁ 높이에 그린 것으로 준위 간격이 위로 갈수록 벌어진다. 두 경우 모두 k_n = nπ/L이다.</desc>
