    .u8sw-l1{font-size:14px;fill:var(--fig-green);font-weight:600}
    .u8sw-c2{stroke:var(--fig-red);stroke-width:2.4;fill:none}
    .u8sw-l2{font-size:14px;fill:var(--fig-red);font-weight:600}
