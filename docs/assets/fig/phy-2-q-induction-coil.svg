  <desc id="d-phy-2-q-induction-coil">코일의 두 끝에 검류계를 연결하고, 막대자석의 N극을 코일 쪽으로 향하게 하여 코일 안에 넣거나 빼거나 넣은 채 둔다. 실험 (가)~(마)는 이 장치에서 자석의 움직임과 코일의 감은 수를 바꾼 것이다.</desc>
