<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="t-uchem-2-nh3-hcl-tube d-uchem-2-nh3-hcl-tube">
  <title id="t-uchem-2-nh3-hcl-tube">그림 일반화학 2-7 암모니아와 염화 수소가 만나는 자리</title>
  <desc id="d-uchem-2-nh3-hcl-tube">길이 1.00 m인 유리관 양 끝에서 NH₃와 HCl이 동시에 퍼져 나가면 흰 연기(NH₄Cl) 고리가 생긴다. 그레이엄 법칙으로 예측하면 가벼운 NH₃가 1.46배 빠르므로 고리는 NH₃ 쪽 끝에서 약 59 cm, HCl 쪽 끝에서 약 41 cm 떨어진 곳에 생긴다(예제 6).</desc>
  <style>
    .uchem-2-nh3-hcl-tube-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-2-nh3-hcl-tube-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-2-nh3-hcl-tube-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}

  </style>
  <rect x="50.0" y="60.0" width="620.0" height="44.0" rx="22" style="fill:var(--fig-paper);stroke:var(--fig-ink);stroke-width:2"/>
  <rect x="54.0" y="64.0" width="34.0" height="36.0" rx="14" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
