  <line x1="413.4" y1="63.0" x2="413.4" y2="101.0" style="stroke:var(--fig-muted);stroke-width:1.6"/>
  <line x1="416.4" y1="63.0" x2="416.4" y2="101.0" style="stroke:var(--fig-muted);stroke-width:1.6"/>
  <line x1="419.4" y1="63.0" x2="419.4" y2="101.0" style="stroke:var(--fig-muted);stroke-width:1.6"/>
  <line x1="422.4" y1="63.0" x2="422.4" y2="101.0" style="stroke:var(--fig-muted);stroke-width:1.6"/>
