  <path d="M430.4 82.0 L442.4 76.0 L442.4 88.0 Z" style="fill:var(--fig-red)"/>
  <text x="54.0" y="40.0" class="uchem-2-nh3-hcl-tube-t" style="fill:var(--fig-blue);font-weight:600">NH₃ (M = 17.03)</text>
  <text x="666.0" y="40.0" text-anchor="end" class="uchem-2-nh3-hcl-tube-t" style="fill:var(--fig-red);font-weight:600">HCl (M = 36.46)</text>
