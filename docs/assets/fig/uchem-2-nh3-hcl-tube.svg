  <text x="540.0" y="154.0" text-anchor="middle" class="uchem-2-nh3-hcl-tube-s">80</text>
  <line x1="600.0" y1="128.0" x2="600.0" y2="136.0" style="stroke:var(--fig-ink);stroke-width:1.2"/>
  <text x="600.0" y="154.0" text-anchor="middle" class="uchem-2-nh3-hcl-tube-s">90</text>
  <line x1="660.0" y1="128.0" x2="660.0" y2="140.0" style="stroke:var(--fig-ink);stroke-width:1.2"/>
  <text x="660.0" y="154.0" text-anchor="middle" class="uchem-2-nh3-hcl-tube-s">100</text>
  <text x="670.0" y="172.0" text-anchor="end" class="uchem-2-nh3-hcl-tube-s">(cm)</text>
  <line x1="416.4" y1="104.0" x2="416.4" y2="128.0" style="stroke:var(--fig-accent);stroke-width:1.5;stroke-dasharray:3 3"/>
  <text x="238.2" y="178.0" text-anchor="middle" class="uchem-2-nh3-hcl-tube-t" style="fill:var(--fig-blue)">59.4 cm (빠름)</text>
  <text x="538.2" y="178.0" text-anchor="middle" class="uchem-2-nh3-hcl-tube-t" style="fill:var(--fig-red)">40.6 cm</text>
  <text x="360.0" y="206.0" text-anchor="middle" class="uchem-2-nh3-hcl-tube-s">이동 거리의 비 = 속도의 비 = √(36.46 / 17.03) = 1.46</text>
</svg>
