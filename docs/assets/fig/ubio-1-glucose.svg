<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="t-ubio-1-glucose d-ubio-1-glucose">
  <title id="t-ubio-1-glucose">그림 일반생명과학 1-4 α/β-포도당과 녹말·셀룰로스 사슬</title>
  <desc id="d-ubio-1-glucose">위: 고리 모양 포도당에서 1번 탄소의 –OH가 고리 아래쪽이면 α, 위쪽이면 β이다. 아래: α(1→4) 결합으로 이어진 아밀로스는 모든 단위가 같은 방향이어서 사슬이 굽어 나선을 이루고, β(1→4) 결합으로 이어진 셀룰로스는 이웃 단위가 하나씩 뒤집혀 곧은 사슬이 되며 사슬끼리 수소 결합으로 묶인다. 사슬 그림은 모식도이다.</desc>
