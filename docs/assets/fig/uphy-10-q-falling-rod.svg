  <desc id="d-uphy-10-q-falling-rod">연직으로 세운 두 레일의 위쪽 끝을 저항 R로 잇고, 질량 m인 막대를 두 레일에 걸쳐 정지 상태에서 놓는다. 레일 간격은 L이고, 균일한 자기장 B는 레일 평면에 수직(종이에 들어가는 방향)이다. 수치는 문제에 주어진 값이다.</desc>
