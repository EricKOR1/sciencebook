<title id="t-m1-02-slide-prep">그림 중1-2-8 프레파라트 만들기 — 덮개 유리 덮는 방법</title>
<desc id="d-m1-02-slide-prep">받침 유리 위에 표본을 펴고 염색액을 한 방울 떨어뜨린 뒤, 덮개 유리를 한쪽 끝부터 비스듬히 천천히 내리면 공기 방울이 생기지 않는다. 덮개 유리를 한꺼번에 떨어뜨리면 공기 방울이 갇힌다. 옆에서 본 모식도.</desc>
