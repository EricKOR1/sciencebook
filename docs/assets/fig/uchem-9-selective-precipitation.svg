<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-uchem-9-selective-precipitation d-uchem-9-selective-precipitation">
  <title id="t-uchem-9-selective-precipitation">그림 일반화학 9-7 Ag⁺를 넣을 때 I⁻와 Cl⁻의 선택적 침전</title>
  <desc id="d-uchem-9-selective-precipitation">예제 15(I⁻, Cl⁻ 각 0.010 M)에서 [Ag⁺](가로, 로그 눈금)에 따라 용액에 남은 음이온 농도(세로, 로그 눈금)이다. [Ag⁺]가 8.3×10⁻¹⁵ M에 이르면 AgI가 침전하기 시작해 [I⁻] = Kₛₚ/[Ag⁺]로 줄고, 1.8×10⁻⁸ M에서 AgCl이 침전하기 시작한다. 그때 [I⁻]는 4.6×10⁻⁹ M뿐이다.</desc>
