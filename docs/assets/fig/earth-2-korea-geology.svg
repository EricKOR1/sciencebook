<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="t-earth-2-korea-geology d-earth-2-korea-geology">
  <title id="t-earth-2-korea-geology">그림 지구과학 2-6 남한의 시대별 주요 암석 분포(모식도)</title>
  <desc id="d-earth-2-korea-geology">선캄브리아 시대의 편마암·편암은 경기도와 영남 북부 일대에, 고생대 석회암·석탄층은 강원 남부에, 중생대 쥐라기 화강암은 서울과 충청 일대에 북동–남서 방향으로, 백악기 경상 누층군은 경상도 일대에, 신생대 화산암은 제주도·울릉도·독도·한탄강 일대에 분포한다. 국가지질공원 몇 곳을 함께 표시하였다. 주요 분포만 나타낸 매우 대략적인 모식도이다.</desc>
  <style>
    .earth-2-korea-geology-t{font-size:14px;fill:var(--fig-ink)}
    .earth-2-korea-geology-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .earth-2-korea-geology-s{font-size:13px;fill:var(--fig-muted)}
    .earth-2-korea-geology-land{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:0.8;fill-rule:evenodd}
    .earth-2-korea-geology-sea{fill:var(--fig-soft-blue)}
    .earth-2-korea-geology-grat{fill:none;stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3;opacity:0.7}
    .earth-2-korea-geology-frame{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .earth-2-korea-geology-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
