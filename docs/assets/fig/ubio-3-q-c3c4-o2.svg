<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" class="fig-small" role="img" aria-labelledby="t-ubio-3-q-c3c4-o2 d-ubio-3-q-c3c4-o2">
  <title id="t-ubio-3-q-c3c4-o2">그림 일반생명과학 3-11 문제 11 해설 산소 농도에 따른 C3·C4 식물의 광합성 속도(예상)</title>
  <desc id="d-ubio-3-q-c3c4-o2">빛·온도·CO₂ 농도를 같게 하고 공기 중 O₂를 21%에서 2%로 낮추면, C3 식물은 광호흡이 줄어 광합성 속도가 크게 늘고 C4 식물은 거의 변하지 않는다. 각 식물의 21% 값을 100으로 둔 모식적 상댓값이다.</desc>
  <defs><marker id="ubio-3-q-c3c4-o2-a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-ink)"/></marker><marker id="ubio-3-q-c3c4-o2-a-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-muted)"/></marker><marker id="ubio-3-q-c3c4-o2-a-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-line)"/></marker><marker id="ubio-3-q-c3c4-o2-a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-blue)"/></marker><marker id="ubio-3-q-c3c4-o2-a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-red)"/></marker><marker id="ubio-3-q-c3c4-o2-a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-green)"/></marker><marker id="ubio-3-q-c3c4-o2-a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-amber)"/></marker><marker id="ubio-3-q-c3c4-o2-a-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-violet)"/></marker><marker id="ubio-3-q-c3c4-o2-a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-teal)"/></marker></defs>
  <style>.ubio-3-q-c3c4-o2-t{font-size:14px;fill:var(--fig-ink)} .ubio-3-q-c3c4-o2-s{font-size:13px;fill:var(--fig-muted)} .ubio-3-q-c3c4-o2-b{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-3-q-c3c4-o2-ink{font-size:14px;fill:var(--fig-ink);font-weight:700} .ubio-3-q-c3c4-o2-muted{font-size:14px;fill:var(--fig-muted);font-weight:700} .ubio-3-q-c3c4-o2-line{font-size:14px;fill:var(--fig-line);font-weight:700} .ubio-3-q-c3c4-o2-blue{font-size:14px;fill:var(--fig-blue);font-weight:700} .ubio-3-q-c3c4-o2-red{font-size:14px;fill:var(--fig-red);font-weight:700} .ubio-3-q-c3c4-o2-green{font-size:14px;fill:var(--fig-green);font-weight:700} .ubio-3-q-c3c4-o2-amber{font-size:14px;fill:var(--fig-amber);font-weight:700} .ubio-3-q-c3c4-o2-violet{font-size:14px;fill:var(--fig-violet);font-weight:700} .ubio-3-q-c3c4-o2-teal{font-size:14px;fill:var(--fig-teal);font-weight:700}</style>
