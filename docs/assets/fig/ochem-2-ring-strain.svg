<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-ochem-2-ring-strain d-ochem-2-ring-strain">
  <title id="t-ochem-2-ring-strain">그림 유기화학 2-10 고리 크기에 따른 고리 무리 에너지</title>
  <desc id="d-ochem-2-ring-strain">막대는 사이클로알케인 (CH₂)ₙ의 고리 무리(kJ/mol, 약): 3원 115, 4원 110, 5원 27, 6원 0, 7원 27, 8원 41, 9원 52, 10원 50, 11원 47, 12원 17, 13원 22, 14원 8. 6원 고리는 의자 형태로 무리가 없고, 8~11원(중간 고리)은 고리 건너편 수소끼리의 입체 무리 때문에 무리가 다시 커진다. 오른쪽 위 작은 그래프는 고리가 평면이라고 가정했을 때의 각 어긋남 |109.5° − 내각|으로, 고리가 클수록 계속 커져 실제 무리와 전혀 다르다(바이어 가설의 한계).</desc>
