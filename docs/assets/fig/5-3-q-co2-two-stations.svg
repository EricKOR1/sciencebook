<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-5-3-q-co2-two-stations d-5-3-q-co2-two-stations">
  <title id="t-5-3-q-co2-two-stations">그림 5-3-8 문제 12의 두 관측소 이산화 탄소 농도</title>
  <desc id="d-5-3-q-co2-two-stations">하와이 마우나로아와 남극 관측소의 이산화 탄소 농도를 4년 동안 나타낸 모식 그래프이다. 두 곳 모두 해마다 비슷한 빠르기로 늘어나며, 1년 안의 오르내림 폭은 마우나로아가 약 6 ppm, 남극이 약 1 ppm이 되도록 그렸다.</desc>
