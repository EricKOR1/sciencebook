  <title id="t-umath-5-relaxation-modes">그림 수학 도구 5-7 A ⇌ B의 이완 = 두 모드의 합</title>
  <desc id="d-umath-5-relaxation-modes">예제 9의 [A](t) = 0.25 + 0.75e^(−0.40t), [B](t) = 0.75(1 − e^(−0.40t)) 곡선. 고유값 0의 모드가 평형 농도 0.25 M, 0.75 M을 정하고, 고유값 −0.40 s⁻¹의 모드 (1, −1)이 지수적으로 사라진다. t = 5.0 s에서 0.352 M, 0.648 M.</desc>
