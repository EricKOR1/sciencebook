<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-ubio-4-cytokinesis d-ubio-4-cytokinesis">
  <title id="t-ubio-4-cytokinesis">그림 일반생명과학 4-7 동물 세포와 식물 세포의 세포질 분열</title>
  <desc id="d-ubio-4-cytokinesis">왼쪽: 동물 세포에서는 세포막 바로 안쪽에 액틴 미세섬유와 미오신으로 된 수축환이 생겨 조이면서 분열구가 바깥에서 안으로 파고든다. 오른쪽: 식물 세포는 단단한 세포벽 때문에 조일 수 없으므로, 골지체에서 온 소낭이 세포 가운데에 모여 융합한 세포판이 안에서 바깥으로 자라 기존 세포벽에 닿고, 새 세포막과 세포벽이 된다. 모식도.</desc>
  <style>.ubio-4-cytokinesis-t{font-size:14px;fill:var(--fig-ink)} .ubio-4-cytokinesis-s{font-size:13px;fill:var(--fig-muted)} .ubio-4-cytokinesis-b{font-size:14px;fill:var(--fig-ink);font-weight:600} .ubio-4-cytokinesis-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-4-cytokinesis-m{font-size:13px;fill:var(--fig-ink)}</style>
  <defs><marker id="ubio-4-cytokinesis-ar0" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-red)"/></marker><marker id="ubio-4-cytokinesis-ar1" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-amber)"/></marker></defs>
  <text x="180.0" y="26.0" text-anchor="middle" class="ubio-4-cytokinesis-b">① 동물 세포: 분열구(바깥 → 안)</text>
  <text x="540.0" y="26.0" text-anchor="middle" class="ubio-4-cytokinesis-b">② 식물 세포: 세포판(안 → 바깥)</text>
  <path d="M180 110 C204 66 296 70 296 140 C296 210 204 214 180 170 C156 214 64 210 64 140 C64 70 156 66 180 110 Z" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2"/>
  <circle cx="118.0" cy="140.0" r="24" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.4"/>
  <circle cx="242.0" cy="140.0" r="24" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.4"/>
  <ellipse cx="180.0" cy="109.0" rx="9" ry="5" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2"/>
  <ellipse cx="180.0" cy="171.0" rx="9" ry="5" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2"/>
  <line x1="180.0" y1="56.0" x2="180.0" y2="96.0" style="fill:none;stroke:var(--fig-red);stroke-width:2" marker-end="url(#ubio-4-cytokinesis-ar0)"/>
  <line x1="180.0" y1="224.0" x2="180.0" y2="184.0" style="fill:none;stroke:var(--fig-red);stroke-width:2" marker-end="url(#ubio-4-cytokinesis-ar0)"/>
  <text x="196.0" y="68.0" text-anchor="start" class="ubio-4-cytokinesis-s" style="fill:var(--fig-red)">분열구</text>
  <text x="180.0" y="248.0" text-anchor="middle" class="ubio-4-cytokinesis-s">수축환(액틴 미세섬유 + 미오신)이 조임</text>
  <text x="180.0" y="270.0" text-anchor="middle" class="ubio-4-cytokinesis-s">세포벽이 없어 세포막을 조일 수 있다</text>
  <rect x="402.0" y="50.0" width="276.0" height="182.0" rx="6" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2"/>
  <rect x="410.0" y="58.0" width="260.0" height="166.0" rx="3" style="fill:var(--fig-panel);stroke:var(--fig-green);stroke-width:1.2"/>
