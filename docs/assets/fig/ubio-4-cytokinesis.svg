  <line x1="524.0" y1="118.0" x2="533.0" y2="118.0" style="fill:none;stroke:var(--fig-amber);stroke-width:1.2" marker-end="url(#ubio-4-cytokinesis-ar1)"/>
  <circle cx="518.0" cy="164.0" r="5" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4"/>
  <line x1="524.0" y1="164.0" x2="533.0" y2="164.0" style="fill:none;stroke:var(--fig-amber);stroke-width:1.2" marker-end="url(#ubio-4-cytokinesis-ar1)"/>
  <line x1="558.0" y1="108.0" x2="558.0" y2="72.0" style="fill:none;stroke:var(--fig-amber);stroke-width:2" marker-end="url(#ubio-4-cytokinesis-ar1)"/>
  <line x1="558.0" y1="174.0" x2="558.0" y2="210.0" style="fill:none;stroke:var(--fig-amber);stroke-width:2" marker-end="url(#ubio-4-cytokinesis-ar1)"/>
  <text x="566.0" y="92.0" text-anchor="start" class="ubio-4-cytokinesis-s" style="fill:var(--fig-amber)">자람</text>
  <text x="518.0" y="108.0" text-anchor="middle" class="ubio-4-cytokinesis-s" style="fill:var(--fig-amber)">소낭</text>
  <text x="678.0" y="44.0" text-anchor="end" class="ubio-4-cytokinesis-s" style="fill:var(--fig-green)">세포벽</text>
  <text x="540.0" y="248.0" text-anchor="middle" class="ubio-4-cytokinesis-s">골지체 소낭이 모여 융합한 세포판(주황)</text>
  <text x="540.0" y="270.0" text-anchor="middle" class="ubio-4-cytokinesis-s">→ 기존 세포벽에 닿아 새 세포막·세포벽이 된다</text>
</svg>
