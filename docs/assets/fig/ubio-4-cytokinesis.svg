  <circle cx="612.0" cy="141.0" r="24" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.4"/>
  <rect x="536.0" y="104.0" width="8.0" height="74.0" rx="3" style="fill:var(--fig-amber)"/>
  <circle cx="540.0" cy="80.0" r="5" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4"/>
  <circle cx="540.0" cy="92.0" r="5" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4"/>
  <circle cx="540.0" cy="190.0" r="5" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4"/>
