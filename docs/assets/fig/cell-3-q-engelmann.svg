  <title id="t-cell-3-q-engelmann">그림 세포와 물질대사 3-6 예제 5의 엥겔만의 실험 장치</title>
  <desc id="d-cell-3-q-engelmann">프리즘으로 나눈 빛을 실 모양의 해캄에 비추어, 해캄의 부분마다 다른 파장의 빛이 닿게 하였다. 산소를 좋아하는 세균은 처음에 해캄 주변에 고르게 퍼져 있다. 색 띠는 빛의 파장을 나타낸다.</desc>
