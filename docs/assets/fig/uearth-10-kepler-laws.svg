  <text x="540.0" y="310.0" text-anchor="middle" class="uearth-10-kepler-laws-b">두 부채꼴: 같은 시간 Δt, 같은 넓이 ΔA</text>
  <text x="540.0" y="328.0" text-anchor="middle" class="uearth-10-kepler-laws-n">dA/dt = L/2m = 일정 (각운동량 보존)  →  q·v근 = Q·v원</text>
  <text x="360.0" y="344.0" text-anchor="middle" class="uearth-10-kepler-laws-n">이심률 e = 0.6으로 과장한 모식도(지구 궤도는 e ≈ 0.017로 원과 거의 구별되지 않는다)</text>
