<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" role="img" aria-labelledby="t-uearth-10-kepler-laws d-uearth-10-kepler-laws">
  <title id="t-uearth-10-kepler-laws">그림 일반지구과학 10-5 케플러 제1법칙과 제2법칙</title>
  <desc id="d-uearth-10-kepler-laws">왼쪽: 행성은 태양을 한 초점으로 하는 타원 궤도를 돈다. 긴반지름 a, 짧은반지름 b, 중심에서 초점까지 ae, 근일점 거리 q = a(1 − e), 원일점 거리 Q = a(1 + e)를 나타냈다. 오른쪽: 같은 시간 동안 태양–행성 선분이 쓸고 지나가는 두 부채꼴의 넓이가 같다. 근일점 부근에서는 짧고 넓게, 원일점 부근에서는 길고 좁게 쓸므로 근일점에서 더 빠르다. 이심률 0.6으로 과장한 모식도.</desc>
  <style>
    .uearth-10-kepler-laws-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .uearth-10-kepler-laws-t{font-size:13px;fill:var(--fig-ink)}
    .uearth-10-kepler-laws-s{font-size:13px;fill:var(--fig-muted)}
