<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-labelledby="t-ubio-12-q-organizer-filter d-ubio-12-q-organizer-filter">
  <title id="t-ubio-12-q-organizer-filter">그림 일반생명과학 12-15 문제 16 해설 — 형성체 필터 실험의 설계</title>
  <desc id="d-ubio-12-q-organizer-filter">세 배양 조건. 처리군은 원구 등쪽 입술 조직과 미분화 외배엽 조직 사이에 단백질은 통과하고 세포는 통과하지 못하는 필터를 끼운다. 대조군 ①은 두 조직을 직접 붙이고(양성 대조), 대조군 ②는 형성체 없이 외배엽 조직과 필터만 둔다(음성 대조). 배양 뒤 외배엽 쪽에 신경 조직이 생기는지 비교한다. 모식도이다.</desc>
  <defs><marker id="ubio-12-q-organizer-filter-a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-ink)"/></marker><marker id="ubio-12-q-organizer-filter-a-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-muted)"/></marker><marker id="ubio-12-q-organizer-filter-a-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-line)"/></marker><marker id="ubio-12-q-organizer-filter-a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-blue)"/></marker><marker id="ubio-12-q-organizer-filter-a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-red)"/></marker><marker id="ubio-12-q-organizer-filter-a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-green)"/></marker><marker id="ubio-12-q-organizer-filter-a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-amber)"/></marker><marker id="ubio-12-q-organizer-filter-a-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-violet)"/></marker><marker id="ubio-12-q-organizer-filter-a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-teal)"/></marker></defs>
  <style>.ubio-12-q-organizer-filter-t{font-size:14px;fill:var(--fig-ink)} .ubio-12-q-organizer-filter-s{font-size:13px;fill:var(--fig-muted)} .ubio-12-q-organizer-filter-b{font-size:15px;fill:var(--fig-ink);font-weight:700}</style>
  <text x="125" y="30" text-anchor="middle" class="ubio-12-q-organizer-filter-b">처리군</text>
  <text x="125" y="50" text-anchor="middle" class="ubio-12-q-organizer-filter-s">필터를 사이에 둠</text>
  <ellipse cx="125" cy="140" rx="100" ry="62" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.6"/>
  <ellipse cx="125" cy="140" rx="92" ry="55" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:0.8;opacity:0.7"/>
  <ellipse cx="91" cy="140" rx="26" ry="20" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.6"/>
  <rect x="121" y="108" width="8" height="64" rx="0" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4;stroke-dasharray:3 2"/>
  <ellipse cx="159" cy="140" rx="26" ry="20" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6"/>
  <text x="360" y="30" text-anchor="middle" class="ubio-12-q-organizer-filter-b">대조군 ①</text>
  <text x="360" y="50" text-anchor="middle" class="ubio-12-q-organizer-filter-s">두 조직을 직접 붙임</text>
  <ellipse cx="360" cy="140" rx="100" ry="62" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.6"/>
  <ellipse cx="360" cy="140" rx="92" ry="55" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:0.8;opacity:0.7"/>
  <ellipse cx="336" cy="140" rx="26" ry="20" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.6"/>
  <ellipse cx="386" cy="140" rx="26" ry="20" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6"/>
  <text x="595" y="30" text-anchor="middle" class="ubio-12-q-organizer-filter-b">대조군 ②</text>
  <text x="595" y="50" text-anchor="middle" class="ubio-12-q-organizer-filter-s">외배엽 + 필터만</text>
  <ellipse cx="595" cy="140" rx="100" ry="62" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.6"/>
  <ellipse cx="595" cy="140" rx="92" ry="55" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:0.8;opacity:0.7"/>
  <rect x="591" y="108" width="8" height="64" rx="0" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4;stroke-dasharray:3 2"/>
  <ellipse cx="629" cy="140" rx="26" ry="20" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6"/>
  <ellipse cx="60" cy="236" rx="14" ry="10" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.4"/>
  <text x="80" y="241" text-anchor="start" class="ubio-12-q-organizer-filter-s">원구 등쪽 입술(형성체)</text>
  <ellipse cx="270" cy="236" rx="14" ry="10" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.4"/>
  <text x="290" y="241" text-anchor="start" class="ubio-12-q-organizer-filter-s">미분화 외배엽 조직</text>
  <rect x="466" y="224" width="8" height="24" rx="0" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4;stroke-dasharray:3 2"/>
  <text x="484" y="241" text-anchor="start" class="ubio-12-q-organizer-filter-s">필터(단백질만 통과)</text>
  <text x="360" y="274" text-anchor="middle" class="ubio-12-q-organizer-filter-t">배양 뒤 외배엽 조직에 신경 조직(신경판 표지)이 생기는지 비교한다</text>
</svg>
