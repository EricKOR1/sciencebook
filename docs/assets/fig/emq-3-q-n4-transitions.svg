<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-emq-3-q-n4-transitions d-emq-3-q-n4-transitions">
  <title id="t-emq-3-q-n4-transitions">그림 전자기와 양자 3-8 문제 13 풀이의 n = 4에서 가능한 전이</title>
  <desc id="d-emq-3-q-n4-transitions">n = 4에서 내려올 수 있는 전이는 4→3(약 1876 nm, 적외선), 4→2(486 nm), 3→2(656 nm), 4→1(97 nm), 3→1(103 nm), 2→1(122 nm)의 6가지이다. 가시광선은 n = 2로 끝나는 4→2와 3→2이고, n = 1로 끝나는 전이는 자외선이다. 준위의 높이는 에너지에 비례한다.</desc>
  <style>.emq-3-q-n4-transitions-t{font-size:14px;fill:var(--fig-ink)} .emq-3-q-n4-transitions-s{font-size:13px;fill:var(--fig-muted)} .emq-3-q-n4-transitions-b{font-size:15px;font-weight:700;fill:var(--fig-ink)}</style>
  <line x1="200" y1="40" x2="590" y2="40" style="stroke:var(--fig-line);stroke-width:1.4;stroke-dasharray:6 4"/>
  <text x="598" y="45" class="emq-3-q-n4-transitions-s">n = ∞   0 eV</text>
  <line x1="200" y1="393.6" x2="588" y2="393.6" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="598" y="398.6" class="emq-3-q-n4-transitions-s">n = 1   −13.60 eV</text>
  <line x1="200" y1="128.4" x2="588" y2="128.4" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="598" y="133.4" class="emq-3-q-n4-transitions-s">n = 2   −3.40 eV</text>
  <line x1="200" y1="79.3" x2="588" y2="79.3" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="598" y="84.3" class="emq-3-q-n4-transitions-s">n = 3   −1.51 eV</text>
  <line x1="200" y1="62.1" x2="588" y2="62.1" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="598" y="67.1" class="emq-3-q-n4-transitions-s">n = 4   −0.85 eV</text>
  <line x1="230" y1="62.1" x2="230" y2="72.1" style="stroke:var(--fig-amber);stroke-width:2.6"/>
  <path d="M230 79.3 L234.1 70.3 L225.9 70.3 Z" style="fill:var(--fig-amber)"/>
  <text x="192" y="74.1" text-anchor="end" class="emq-3-q-n4-transitions-t" style="fill:var(--fig-amber)">4→3</text>
  <text x="192" y="92.1" text-anchor="end" class="emq-3-q-n4-transitions-s">1876 nm (적외선)</text>
  <line x1="300" y1="62.1" x2="300" y2="121.2" style="stroke:var(--fig-teal);stroke-width:2.6"/>
  <path d="M300 128.4 L304.1 119.4 L295.9 119.4 Z" style="fill:var(--fig-teal)"/>
  <text x="308" y="107.6" class="emq-3-q-n4-transitions-t" style="fill:var(--fig-teal)">4→2</text>
  <text x="308" y="124.6" class="emq-3-q-n4-transitions-s">486 nm</text>
  <line x1="370" y1="79.3" x2="370" y2="121.2" style="stroke:var(--fig-red);stroke-width:2.6"/>
  <path d="M370 128.4 L374.1 119.4 L365.9 119.4 Z" style="fill:var(--fig-red)"/>
  <text x="378" y="107.6" class="emq-3-q-n4-transitions-t" style="fill:var(--fig-red)">3→2</text>
  <text x="378" y="124.6" class="emq-3-q-n4-transitions-s">656 nm</text>
  <line x1="440" y1="62.1" x2="440" y2="386.4" style="stroke:var(--fig-violet);stroke-width:2.6"/>
  <path d="M440 393.6 L444.1 384.6 L435.9 384.6 Z" style="fill:var(--fig-violet)"/>
  <text x="447" y="248" class="emq-3-q-n4-transitions-t" style="fill:var(--fig-violet)">4→1</text>
  <text x="447" y="265" class="emq-3-q-n4-transitions-s">97 nm</text>
  <line x1="500" y1="79.3" x2="500" y2="386.4" style="stroke:var(--fig-violet);stroke-width:2.6"/>
  <path d="M500 393.6 L504.1 384.6 L495.9 384.6 Z" style="fill:var(--fig-violet)"/>
  <text x="507" y="248" class="emq-3-q-n4-transitions-t" style="fill:var(--fig-violet)">3→1</text>
  <text x="507" y="265" class="emq-3-q-n4-transitions-s">103 nm</text>
  <line x1="560" y1="128.4" x2="560" y2="386.4" style="stroke:var(--fig-violet);stroke-width:2.6"/>
  <path d="M560 393.6 L564 384.6 L556 384.6 Z" style="fill:var(--fig-violet)"/>
  <text x="567" y="248" class="emq-3-q-n4-transitions-t" style="fill:var(--fig-violet)">2→1</text>
  <text x="567" y="265" class="emq-3-q-n4-transitions-s">122 nm</text>
  <text x="345" y="156.4" text-anchor="middle" class="emq-3-q-n4-transitions-s" style="fill:var(--fig-ink)">가시광선</text>
  <text x="500" y="419.6" text-anchor="middle" class="emq-3-q-n4-transitions-s" style="fill:var(--fig-ink)">자외선 (n = 1로 끝나는 전이)</text>
</svg>
