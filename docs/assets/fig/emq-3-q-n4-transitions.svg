<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-emq-3-q-n4-transitions d-emq-3-q-n4-transitions">
  <title id="t-emq-3-q-n4-transitions">그림 전자기와 양자 3-9 문제 13 풀이의 n = 4에서 가능한 전이</title>
  <desc id="d-emq-3-q-n4-transitions">n = 4에서 내려올 수 있는 전이는 4→3(약 1876 nm, 적외선), 4→2(486 nm), 3→2(656 nm), 4→1(97 nm), 3→1(103 nm), 2→1(122 nm)의 6가지이다. 가시광선은 n = 2로 끝나는 4→2와 3→2이고, n = 1로 끝나는 전이는 자외선이다. 준위의 높이는 에너지에 비례한다.</desc>
  <style>.emq-3-q-n4-transitions-t{font-size:14px;fill:var(--fig-ink)} .emq-3-q-n4-transitions-s{font-size:13px;fill:var(--fig-muted)} .emq-3-q-n4-transitions-b{font-size:15px;font-weight:700;fill:var(--fig-ink)}</style>
  <line x1="110" y1="40" x2="560" y2="40" style="stroke:var(--fig-line);stroke-width:1.4;stroke-dasharray:6 4"/>
  <text x="570" y="45" class="emq-3-q-n4-transitions-s">n = ∞   0 eV</text>
  <line x1="110" y1="393.6" x2="560" y2="393.6" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="570" y="398.6" class="emq-3-q-n4-transitions-s">n = 1   −13.60 eV</text>
  <line x1="110" y1="128.4" x2="560" y2="128.4" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="570" y="133.4" class="emq-3-q-n4-transitions-s">n = 2   −3.40 eV</text>
  <line x1="110" y1="79.3" x2="560" y2="79.3" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="570" y="84.3" class="emq-3-q-n4-transitions-s">n = 3   −1.51 eV</text>
  <line x1="110" y1="62.1" x2="560" y2="62.1" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="570" y="67.1" class="emq-3-q-n4-transitions-s">n = 4   −0.85 eV</text>
  <line x1="150" y1="62.1" x2="150" y2="72.1" style="stroke:var(--fig-amber);stroke-width:2.6"/>
  <path d="M150 79.3 L154.1 70.3 L145.9 70.3 Z" style="fill:var(--fig-amber)"/>
  <text x="142" y="54.1" class="emq-3-q-n4-transitions-t" style="fill:var(--fig-amber)">4→3  1876 nm (적외선)</text>
  <line x1="230" y1="62.1" x2="230" y2="121.2" style="stroke:var(--fig-teal);stroke-width:2.6"/>
  <path d="M230 128.4 L234.1 119.4 L225.9 119.4 Z" style="fill:var(--fig-teal)"/>
  <text x="238" y="107.6" class="emq-3-q-n4-transitions-t" style="fill:var(--fig-teal)">4→2</text>
  <text x="238" y="124.6" class="emq-3-q-n4-transitions-s">486 nm</text>
  <line x1="310" y1="79.3" x2="310" y2="121.2" style="stroke:var(--fig-red);stroke-width:2.6"/>
  <path d="M310 128.4 L314.1 119.4 L305.9 119.4 Z" style="fill:var(--fig-red)"/>
  <text x="318" y="107.6" class="emq-3-q-n4-transitions-t" style="fill:var(--fig-red)">3→2</text>
  <text x="318" y="124.6" class="emq-3-q-n4-transitions-s">656 nm</text>
  <line x1="380" y1="62.1" x2="380" y2="386.4" style="stroke:var(--fig-violet);stroke-width:2.6"/>
  <path d="M380 393.6 L384.1 384.6 L375.9 384.6 Z" style="fill:var(--fig-violet)"/>
  <text x="387" y="248" class="emq-3-q-n4-transitions-t" style="fill:var(--fig-violet)">4→1</text>
  <text x="387" y="265" class="emq-3-q-n4-transitions-s">97 nm</text>
  <line x1="445" y1="79.3" x2="445" y2="386.4" style="stroke:var(--fig-violet);stroke-width:2.6"/>
  <path d="M445 393.6 L449.1 384.6 L440.9 384.6 Z" style="fill:var(--fig-violet)"/>
  <text x="452" y="248" class="emq-3-q-n4-transitions-t" style="fill:var(--fig-violet)">3→1</text>
  <text x="452" y="265" class="emq-3-q-n4-transitions-s">103 nm</text>
  <line x1="510" y1="128.4" x2="510" y2="386.4" style="stroke:var(--fig-violet);stroke-width:2.6"/>
  <path d="M510 393.6 L514 384.6 L505.9 384.6 Z" style="fill:var(--fig-violet)"/>
  <text x="517" y="248" class="emq-3-q-n4-transitions-t" style="fill:var(--fig-violet)">2→1</text>
  <text x="517" y="265" class="emq-3-q-n4-transitions-s">122 nm</text>
  <text x="278" y="156.4" text-anchor="middle" class="emq-3-q-n4-transitions-s" style="fill:var(--fig-ink)">가시광선</text>
  <text x="445" y="419.6" text-anchor="middle" class="emq-3-q-n4-transitions-s" style="fill:var(--fig-ink)">자외선 (n = 1로 끝나는 전이)</text>
</svg>
