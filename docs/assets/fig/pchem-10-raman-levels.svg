<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="t-pchem-10-raman-levels d-pchem-10-raman-levels">
  <title id="t-pchem-10-raman-levels">그림 물리화학 10-6 적외선 흡수, 레일리 산란, 라만 산란</title>
  <desc id="d-pchem-10-raman-levels">위: 진동 준위 v = 0, 1과 가상 상태(점선). 적외선 흡수는 v = 0 → 1의 짧은 화살표 하나이다. 산란에서 위로 가는 화살표는 모두 레이저 광자 hν₀로 길이가 같다. 레일리 산란은 같은 준위로 돌아와 진동수가 그대로이고, 스토크스 선은 v = 1로 내려와 hν_vib만큼 작은 광자를, 반스토크스 선은 v = 1에서 출발해 v = 0으로 내려와 hν_vib만큼 큰 광자를 낸다(반스토크스의 가상 상태는 hν_vib만큼 높다). 아래: 산란광 스펙트럼 모식도. 가운데 ν̃₀에 센 레일리 선, 낮은 파수 ν̃₀ − ν̃_vib에 스토크스 선, 높은 파수 ν̃₀ + ν̃_vib에 더 약한 반스토크스 선이 있다(세기 비는 모식적이며, 실제 레일리 선은 훨씬 세다).</desc>
