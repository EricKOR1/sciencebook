<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-pchem-2-three-devices d-pchem-2-three-devices">
  <title id="t-pchem-2-three-devices">그림 물리화학 2-14 열기관·냉동기·열펌프의 에너지 흐름</title>
  <desc id="d-pchem-2-three-devices">세 장치는 같은 순환을 다른 목적으로 쓴다. (가) 열기관은 고온에서 qh를 받아 일 −w를 내고 |qc|를 버린다. (나) 냉동기는 일 w로 저온에서 qc를 빼내고(원하는 것) 고온에 |qh| = qc + w를 넣는다. (다) 열펌프는 흐름이 냉동기와 같지만 고온에 넣는 |qh|가 원하는 것이다. 화살표 굵기는 에너지 크기에 비례한다(qh : qc : w = 10 : 6 : 4로 그림).</desc>
