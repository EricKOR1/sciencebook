<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-2-6-wafer-to-chip d-2-6-wafer-to-chip">
  <title id="t-2-6-wafer-to-chip">그림 2-6-1 고순도 규소에서 반도체 칩까지 — 모양의 변화</title>
  <desc id="d-2-6-wafer-to-chip">고순도 규소를 녹인 뒤 씨앗 결정을 돌리며 끌어올려 원기둥 모양의 단결정(잉곳)을 만들고, 이를 얇게 잘라 연마한 웨이퍼 위에 수많은 칩을 만든 뒤 하나씩 잘라 낸다. 모식도(크기 비율은 실제와 다름).</desc>
  <style>
    .waf-lbl{font-size:15px;font-weight:600;fill:var(--fig-ink)} .waf-t{font-size:14px;fill:var(--fig-ink)}
    .waf-sm{font-size:13px;fill:var(--fig-muted)} .waf-acc{font-size:13px;font-weight:600;fill:var(--fig-accent)}
    .waf-si{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.6}
    .waf-si2{fill:var(--fig-violet);stroke:var(--fig-violet);stroke-width:1.2}
    .waf-cru{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.8} .waf-melt{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4}
    .waf-rod{fill:var(--fig-muted)} .waf-ln{stroke:var(--fig-ink);stroke-width:1.4;fill:none}
    .waf-rot{stroke:var(--fig-accent);stroke-width:1.8;fill:none} .waf-rh{fill:var(--fig-accent)}
    .waf-cut{stroke:var(--fig-red);stroke-width:1.6;stroke-dasharray:4 3}
    .waf-chip{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1}
    .waf-chipb{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2}
    .waf-wire{stroke:var(--fig-amber);stroke-width:1.6;fill:none}
    .waf-ar{stroke:var(--fig-ink);stroke-width:2;fill:none} .waf-ah{fill:var(--fig-ink)}
  </style>
