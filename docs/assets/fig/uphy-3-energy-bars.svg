<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-uphy-3-energy-bars d-uphy-3-energy-bars">
  <title id="t-uphy-3-energy-bars">그림 일반물리학 3-5 에너지 막대그래프로 본 예제 6 — 용수철과 마찰</title>
  <desc id="d-uphy-3-energy-bars">마찰 있는 바닥에서 3.00 m/s로 용수철에 부딪친 1.50 kg 토막(k = 500 N/m, μk = 0.200)의 운동 에너지 K, 용수철의 퍼텐셜 에너지 U, 열에너지 증가량 ΔE_th를 세 순간에 나타냈다. 닿는 순간 6.75 J이던 K가 압축 0.080 m에서는 K 4.92 J, U 1.60 J, 열 0.24 J로, 최대 압축 0.159 m에서는 U 6.28 J, 열 0.47 J로 나뉜다. 세 막대의 합은 언제나 6.75 J이다.</desc>
