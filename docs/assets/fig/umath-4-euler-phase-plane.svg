<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-umath-4-euler-phase-plane d-umath-4-euler-phase-plane">
  <title id="t-umath-4-euler-phase-plane">그림 수학 도구 4-12 진동자에 대한 오일러법의 상평면 자취</title>
  <desc id="d-umath-4-euler-phase-plane">ẋ = v, v̇ = −x를 (1, 0)에서 출발해 h = 0.10으로 t = 10까지 푼 자취. 정확한 해는 반지름 1인 원을 시계 방향으로 돈다. 오일러법(점선)은 계단마다 반지름이 √(1 + h²)배가 되어 반지름 약 1.64까지 바깥으로 감기고, 속도를 먼저 고친 뒤 새 속도로 위치를 옮기는 방법(초록)은 원 근처의 약간 찌그러진 고리에 머문다.</desc>
