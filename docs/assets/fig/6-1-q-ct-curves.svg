  <title id="t-6-1-q-ct-curves">그림 6-1-6 문제 6의 실시간 PCR 결과</title>
  <desc id="d-6-1-q-ct-curves">갑, 을, 병의 검체를 같은 장비와 방법으로 40사이클까지 증폭하며 형광 세기를 측정한 그래프이다. 점선은 기준선이며, 갑은 18사이클, 을은 23사이클에 기준선을 처음 넘었고 병은 40사이클까지 넘지 않았다.</desc>
