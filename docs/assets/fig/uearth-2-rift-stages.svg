<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-uearth-2-rift-stages d-uearth-2-rift-stages">
  <title id="t-uearth-2-rift-stages">그림 일반지구과학 2-4 대륙이 갈라져 대양이 되기까지</title>
  <desc id="d-uearth-2-rift-stages">(가) 대륙 열곡: 대륙 암석권이 늘어나 얇아지고 정단층을 따라 가운데가 내려앉는다(동아프리카 열곡대). (나) 좁은 바다: 대륙이 완전히 갈라져 바닷물이 들어오고 가운데에서 해양 지각이 생기기 시작한다(홍해). (다) 대양: 해저 확장이 계속되어 해령을 가운데 둔 넓은 대양이 되고, 양쪽 대륙 가장자리는 판 경계에서 멀어진 조용한 대륙 주변부가 된다(대서양). 모식도이다.</desc>
