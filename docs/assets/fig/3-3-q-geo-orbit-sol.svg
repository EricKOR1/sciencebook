<text x="222" y="132.7" text-anchor="end" class="f3-3-q-geo-orbit-sol-b" style="fill:var(--fig-red)">O′</text>
<line x1="381.7" y1="115.7" x2="332.9" y2="152.5" style="stroke:var(--fig-ink);stroke-width:2.5"/>
<path d="M325.8 157.8 L330.5 147.8 L336.7 156.1 Z" style="fill:var(--fig-ink)"/>
<line x1="381.7" y1="115.7" x2="319.7" y2="115.7" style="stroke:var(--fig-red);stroke-width:2;stroke-dasharray:5 4"/>
<path d="M311.7 115.7 L320.6 111 L320.6 120.3 Z" style="fill:var(--fig-red)"/>
<rect x="374.7" y="108.7" width="14" height="14" rx="2" style="fill:var(--fig-amber);stroke:var(--fig-ink);stroke-width:1.2"/>
<text x="393.7" y="105.7" class="f3-3-q-geo-orbit-sol-t">위성</text>
<text x="450" y="60" class="f3-3-q-geo-orbit-sol-t" style="fill:var(--fig-red)">빨간 점선 궤도: 중심이 O′</text>
<text x="450" y="80" class="f3-3-q-geo-orbit-sol-s">(북위 37° 상공에 머무르는 원)</text>
<text x="450" y="108" class="f3-3-q-geo-orbit-sol-s" style="fill:var(--fig-red)">빨간 화살표: 필요한 힘(O′ 쪽)</text>
<text x="450" y="128" class="f3-3-q-geo-orbit-sol-s">검은 화살표: 실제 중력(O 쪽)</text>
<text x="450" y="154" class="f3-3-q-geo-orbit-sol-t">→ 두 방향이 달라 불가능</text>
<text x="450" y="300" class="f3-3-q-geo-orbit-sol-t" style="fill:var(--fig-blue)">파란 궤도: 중심이 O</text>
<text x="450" y="320" class="f3-3-q-geo-orbit-sol-s">(적도 상공) → 정지 궤도 가능</text>
