<ellipse cx="230" cy="230" rx="80" ry="16" style="fill:none;stroke:var(--fig-green);stroke-width:1.2;stroke-dasharray:4 3"/>
<line x1="230" y1="110" x2="230" y2="340" style="stroke:var(--fig-ink);stroke-width:1.5;stroke-dasharray:8 4"/>
<text x="236" y="336" class="f3-3-q-geo-orbit-sol-s">자전축</text>
<ellipse cx="230" cy="230" rx="190" ry="34" style="fill:none;stroke:var(--fig-blue);stroke-width:2.5"/>
<ellipse cx="230" cy="115.7" rx="151.7" ry="22" style="fill:none;stroke:var(--fig-red);stroke-width:2.5;stroke-dasharray:8 5"/>
<line x1="230" y1="230" x2="381.7" y2="115.7" style="stroke:var(--fig-muted);stroke-width:1"/>
<line x1="230" y1="230" x2="420" y2="230" style="stroke:var(--fig-muted);stroke-width:1"/>
<path d="M270 230 A40 40 0 0 0 261.9 205.9" style="fill:none;stroke:var(--fig-ink);stroke-width:1.2"/>
<text x="357.8" y="151.7" class="f3-3-q-geo-orbit-sol-s">북위 37°</text>
<circle cx="230" cy="230" r="3.5" style="fill:var(--fig-ink)"/>
<text x="222" y="248" text-anchor="end" class="f3-3-q-geo-orbit-sol-b">O</text>
