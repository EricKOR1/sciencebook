<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-3-3-q-geo-orbit-sol d-3-3-q-geo-orbit-sol">
<title id="t-3-3-q-geo-orbit-sol">그림 3-3-9 문제 16 해설: 위성 궤도의 중심과 중력의 방향</title>
<desc id="d-3-3-q-geo-orbit-sol">북위 37° 상공의 한 점에 늘 머무르려면 위성은 자전축 위의 점 O′을 중심으로 원을 그려야 한다. 그러나 위성에 작용하는 중력은 지구 중심 O를 향하므로 이런 원운동을 만들 수 없다. 지구 중심을 중심으로 하면서 지구와 함께 돌 수 있는 궤도는 적도 상공 궤도뿐이다. 궤도의 크기는 실제와 다른 모식도이다.</desc>
<style>.f3-3-q-geo-orbit-sol-t{font-size:14px;fill:var(--fig-ink)} .f3-3-q-geo-orbit-sol-s{font-size:13px;fill:var(--fig-muted)} .f3-3-q-geo-orbit-sol-b{font-size:15px;font-weight:700;fill:var(--fig-ink)} .f3-3-q-geo-orbit-sol-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.5} .f3-3-q-geo-orbit-sol-grid{fill:none;stroke:var(--fig-line);stroke-width:1} .f3-3-q-geo-orbit-sol-ink{fill:var(--fig-ink)}</style>
