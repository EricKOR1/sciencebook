<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-umath-2-q-pendulum-period d-umath-2-q-pendulum-period">
  <title id="t-umath-2-q-pendulum-period">그림 수학 도구 2-17 문제 12 해설: 진폭에 따른 단진자 주기 보정</title>
  <desc id="d-umath-2-q-pendulum-period">정확한 주기 비 T/T₀ = (2/π)K(sin²(θ₀/2))(실선)와 근사 1 + θ₀²/16(점선, θ₀는 라디안). 30°까지는 두 곡선이 거의 겹치고(30°에서 1.0174와 1.0171), 진폭이 커질수록 근사가 작게 어림한다(90°에서 1.1803과 1.1542). T/T₀ = 1은 주기가 진폭과 무관하다는 작은 각 근사이다.</desc>
