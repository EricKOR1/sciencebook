<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-earth-1-temp-profiles d-earth-1-temp-profiles">
  <title id="t-earth-1-temp-profiles">그림 지구과학 1-2 위도에 따른 수온의 연직 분포</title>
  <desc id="d-earth-1-temp-profiles">저위도는 표층이 따뜻하고 얇은 혼합층 아래에 뚜렷한 수온 약층이 있으며, 중위도는 바람이 강해 혼합층이 두껍고, 고위도는 표층도 차가워 깊이에 따른 수온 차가 거의 없다. 대표적인 모양을 나타낸 모식도이다.</desc>
  <style>
    .earth-1-temp-profiles-t{font-size:14px;fill:var(--fig-ink)}
    .earth-1-temp-profiles-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .earth-1-temp-profiles-s{font-size:13px;fill:var(--fig-muted)}
    .earth-1-temp-profiles-land{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:0.8;fill-rule:evenodd}
    .earth-1-temp-profiles-sea{fill:var(--fig-soft-blue)}
    .earth-1-temp-profiles-grat{fill:none;stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3;opacity:0.7}
    .earth-1-temp-profiles-frame{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .earth-1-temp-profiles-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
<rect x="90" y="50" width="380" height="330" style="fill:var(--fig-panel);stroke:var(--fig-line)"/><line x1="90" y1="50" x2="90" y2="380" style="stroke:var(--fig-line);stroke-width:0.5;stroke-dasharray:3 3"/><text x="90" y="42" text-anchor="middle" class="earth-1-temp-profiles-s">0</text><line x1="153.3" y1="50" x2="153.3" y2="380" style="stroke:var(--fig-line);stroke-width:0.5;stroke-dasharray:3 3"/><text x="153.3" y="42" text-anchor="middle" class="earth-1-temp-profiles-s">5</text><line x1="216.7" y1="50" x2="216.7" y2="380" style="stroke:var(--fig-line);stroke-width:0.5;stroke-dasharray:3 3"/><text x="216.7" y="42" text-anchor="middle" class="earth-1-temp-profiles-s">10</text><line x1="280" y1="50" x2="280" y2="380" style="stroke:var(--fig-line);stroke-width:0.5;stroke-dasharray:3 3"/><text x="280" y="42" text-anchor="middle" class="earth-1-temp-profiles-s">15</text><line x1="343.3" y1="50" x2="343.3" y2="380" style="stroke:var(--fig-line);stroke-width:0.5;stroke-dasharray:3 3"/><text x="343.3" y="42" text-anchor="middle" class="earth-1-temp-profiles-s">20</text><line x1="406.7" y1="50" x2="406.7" y2="380" style="stroke:var(--fig-line);stroke-width:0.5;stroke-dasharray:3 3"/><text x="406.7" y="42" text-anchor="middle" class="earth-1-temp-profiles-s">25</text><line x1="470" y1="50" x2="470" y2="380" style="stroke:var(--fig-line);stroke-width:0.5;stroke-dasharray:3 3"/><text x="470" y="42" text-anchor="middle" class="earth-1-temp-profiles-s">30</text><line x1="90" y1="50" x2="470" y2="50" style="stroke:var(--fig-line);stroke-width:0.5;stroke-dasharray:3 3"/><text x="82" y="55" text-anchor="end" class="earth-1-temp-profiles-s">0</text><line x1="90" y1="116" x2="470" y2="116" style="stroke:var(--fig-line);stroke-width:0.5;stroke-dasharray:3 3"/><text x="82" y="121" text-anchor="end" class="earth-1-temp-profiles-s">300</text><line x1="90" y1="182" x2="470" y2="182" style="stroke:var(--fig-line);stroke-width:0.5;stroke-dasharray:3 3"/><text x="82" y="187" text-anchor="end" class="earth-1-temp-profiles-s">600</text><line x1="90" y1="248" x2="470" y2="248" style="stroke:var(--fig-line);stroke-width:0.5;stroke-dasharray:3 3"/><text x="82" y="253" text-anchor="end" class="earth-1-temp-profiles-s">900</text><line x1="90" y1="314" x2="470" y2="314" style="stroke:var(--fig-line);stroke-width:0.5;stroke-dasharray:3 3"/><text x="82" y="319" text-anchor="end" class="earth-1-temp-profiles-s">1200</text><line x1="90" y1="380" x2="470" y2="380" style="stroke:var(--fig-line);stroke-width:0.5;stroke-dasharray:3 3"/><text x="82" y="385" text-anchor="end" class="earth-1-temp-profiles-s">1500</text><text x="280" y="22" text-anchor="middle" class="earth-1-temp-profiles-b">수온(°C)</text><text x="40" y="22" text-anchor="start" class="earth-1-temp-profiles-b">깊이(m)</text><path d="M444.7 50 C444.7 51.5 445.7 56.2 444.7 58.8 C443.6 61.4 451 61.4 438.3 65.4 C425.7 69.4 395.1 75.3 368.7 83 C342.3 90.7 305.3 100.6 280 111.6 C254.7 122.6 233.6 135.4 216.7 149 C199.8 162.6 189.2 176.5 178.7 193 C168.1 209.5 159.7 227.8 153.3 248 C147 268.2 143.8 292 140.7 314 C137.5 336 135.4 369 134.3 380" style="fill:none;stroke:var(--fig-red);stroke-width:3.5"/><text x="438.7" y="69.5" text-anchor="end" class="earth-1-temp-profiles-b earth-1-temp-profiles-halo">저위도</text><path d="M305.3 50 C305.3 54.8 306.4 72.4 305.3 78.6 C304.3 84.8 307.4 81.9 299 87.4 C290.6 92.9 270.5 101.3 254.7 111.6 C238.8 121.9 218.8 133.6 204 149 C189.2 164.4 175.5 183.8 166 204 C156.5 224.2 152.1 240.7 147 270 C141.9 299.3 137.5 361.7 135.6 380" style="fill:none;stroke:var(--fig-amber);stroke-width:3.5"/><text x="311.3" y="69.5" text-anchor="start" class="earth-1-temp-profiles-b earth-1-temp-profiles-halo">중위도</text><path d="M134.3 50 C134.1 57.3 133.7 75.7 133.1 94 C132.4 112.3 131.4 134.3 130.5 160 C129.7 185.7 128.8 211.3 128 248 C127.2 284.7 125.9 358 125.5 380" style="fill:none;stroke:var(--fig-blue);stroke-width:3.5"/><text x="140.3" y="69.5" text-anchor="start" class="earth-1-temp-profiles-b earth-1-temp-profiles-halo">고위도</text><path d="M490 52 L498 52 L498 61.2 L490 61.2" style="fill:none;stroke:var(--fig-ink);stroke-width:1.5"/><text x="506" y="56.6" text-anchor="start" class="earth-1-temp-profiles-b">혼합층</text><text x="506" y="74.6" text-anchor="start" class="earth-1-temp-profiles-s">바람이 섞어 수온 일정</text><path d="M490 67.4 L498 67.4 L498 224 L490 224" style="fill:none;stroke:var(--fig-ink);stroke-width:1.5"/><text x="506" y="145.7" text-anchor="start" class="earth-1-temp-profiles-b">수온 약층</text><text x="506" y="163.7" text-anchor="start" class="earth-1-temp-profiles-s">깊을수록 수온 급감, 매우 안정</text><path d="M490 232.4 L498 232.4 L498 378 L490 378" style="fill:none;stroke:var(--fig-ink);stroke-width:1.5"/><text x="506" y="305.2" text-anchor="start" class="earth-1-temp-profiles-b">심해층</text><text x="506" y="323.2" text-anchor="start" class="earth-1-temp-profiles-s">약 0~4 °C, 거의 일정</text><text x="490" y="410" text-anchor="start" class="earth-1-temp-profiles-s">(저위도 곡선 기준)</text><text x="90" y="410" text-anchor="start" class="earth-1-temp-profiles-s">곡선은 대표적인 모양(모식도)</text>
</svg>
