<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-mech-3-pendulum d-mech-3-pendulum">
  <title id="t-mech-3-pendulum">그림 역학과 에너지 3-3 단진자에서 복원력이 되는 중력의 성분</title>
  <desc id="d-mech-3-pendulum">길이 L인 줄에 매달린 추가 연직선과 각 θ를 이루면, 중력 mg는 줄 방향 성분 mg cosθ와 원호의 접선 방향 성분 mg sinθ로 나뉜다. 줄 방향 성분은 장력과 함께 원운동 쪽을 담당하고, 접선 방향 성분 mg sinθ가 추를 늘 평형 위치(가장 낮은 점) 쪽으로 되돌리는 복원력이 된다. 각이 작으면 이 힘이 변위에 거의 비례하여 단진동한다.</desc>
  <rect x="10.0" y="10.0" width="420.0" height="310.0" rx="10" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <rect x="150.0" y="32.0" width="100.0" height="8.0" rx="0" style="fill:var(--fig-line);stroke:none;stroke-width:1.5"/>
  <line x1="200.0" y1="40.0" x2="200.0" y2="245.0" style="stroke:var(--fig-line);stroke-width:1.3;fill:none;stroke-dasharray:5 4"/>
  <path d="M113.1 203.3 A185 185 0 0 0 286.9 203.3" style="fill:none;stroke:var(--fig-line);stroke-width:1.5;stroke-dasharray:6 5"/>
  <line x1="200.0" y1="40.0" x2="286.9" y2="203.3" style="stroke:var(--fig-muted);stroke-width:2;fill:none"/>
  <path d="M200 90 A50 50 0 0 0 223.5 84.1" style="fill:none;stroke:var(--fig-ink);stroke-width:1.3"/>
  <text x="210.0" y="110.0" style="font-size:15px;fill:var(--fig-ink)">θ</text>
  <text x="253.4" y="121.7" style="font-size:15px;fill:var(--fig-muted)">L</text>
  <line x1="319.2" y1="264.2" x2="286.9" y2="281.3" style="stroke:var(--fig-line);stroke-width:1.2;fill:none;stroke-dasharray:4 3"/>
  <line x1="254.5" y1="220.5" x2="286.9" y2="281.3" style="stroke:var(--fig-line);stroke-width:1.2;fill:none;stroke-dasharray:4 3"/>
  <line x1="286.9" y1="203.3" x2="259.6" y2="152.1" style="stroke:var(--fig-blue);stroke-width:3.5;fill:none"/>
  <path d="M254.0 141.5 L264.9 149.3 L254.3 155.0 Z" style="fill:var(--fig-blue);stroke:none"/>
  <line x1="286.9" y1="203.3" x2="314.5" y2="255.3" style="stroke:var(--fig-violet);stroke-width:3;fill:none"/>
  <path d="M319.2 264.2 L310.1 257.7 L318.9 253.0 Z" style="fill:var(--fig-violet);stroke:none"/>
  <line x1="286.9" y1="203.3" x2="265.1" y2="214.9" style="stroke:var(--fig-red);stroke-width:3.5;fill:none"/>
  <path d="M254.5 220.5 L262.3 209.6 L267.9 220.2 Z" style="fill:var(--fig-red);stroke:none"/>
  <line x1="286.9" y1="203.3" x2="286.9" y2="269.3" style="stroke:var(--fig-ink);stroke-width:3.5;fill:none"/>
  <path d="M286.9 281.3 L280.9 269.3 L292.9 269.3 Z" style="fill:var(--fig-ink);stroke:none"/>
  <circle cx="286.9" cy="203.3" r="11.0" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <text x="244.0" y="145.5" text-anchor="end" style="font-size:15px;fill:var(--fig-blue);font-weight:600">T</text>
  <text x="292.9" y="297.3" style="font-size:15px;fill:var(--fig-ink);font-weight:600">mg</text>
  <text x="327.2" y="268.2" style="font-size:14px;fill:var(--fig-violet);font-weight:600">mg cosθ</text>
  <text x="248.5" y="240.5" text-anchor="end" style="font-size:14px;fill:var(--fig-red);font-weight:600">mg sinθ</text>
  <text x="200.0" y="312.0" text-anchor="middle" style="font-size:12px;fill:var(--fig-muted)">평형 위치</text>
  <rect x="445.0" y="40.0" width="265.0" height="250.0" rx="10" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1"/>
  <text x="462.0" y="68.0" style="font-size:14px;fill:var(--fig-red);font-weight:600">복원력 = mg sinθ</text>
  <text x="462.0" y="93.0" style="font-size:14px;fill:var(--fig-muted)">(늘 평형 위치 쪽)</text>
  <text x="462.0" y="118.0" style="font-size:14px;fill:var(--fig-ink)"></text>
  <text x="462.0" y="143.0" style="font-size:14px;fill:var(--fig-ink)">θ가 작으면 sinθ ≈ x/L 이므로</text>
  <text x="462.0" y="168.0" style="font-size:14px;fill:var(--fig-ink);font-weight:600">복원력 ≈ (mg/L)·x</text>
  <text x="462.0" y="193.0" style="font-size:14px;fill:var(--fig-ink)">→ 변위에 비례: 단진동</text>
  <text x="462.0" y="218.0" style="font-size:14px;fill:var(--fig-ink)"></text>
  <text x="462.0" y="243.0" style="font-size:14px;fill:var(--fig-ink);font-weight:600">T = 2π√(L/g)</text>
  <text x="462.0" y="268.0" style="font-size:14px;fill:var(--fig-muted)">추의 질량, (작은) 진폭과 무관</text>
</svg>
