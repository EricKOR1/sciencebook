  <desc id="d-pchem-6-q-ag-concentration-cell">두 비커에 은선 전극을 꽂고, 왼쪽 비커에는 AgNO₃ 0.0010 mol/kg, 오른쪽 비커에는 AgNO₃ 0.100 mol/kg 용액을 담았다. 두 비커는 KNO₃ 염다리로 잇고 두 은선은 고임피던스 전압계에 연결했다.</desc>
