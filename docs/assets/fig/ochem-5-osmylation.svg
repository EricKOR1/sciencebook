<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-ochem-5-osmylation d-ochem-5-osmylation">
  <title id="t-ochem-5-osmylation">그림 유기화학 5-13 사이클로헥센의 OsO₄ 신 다이하이드록시화</title>
  <desc id="d-ochem-5-osmylation">1단계: OsO₄가 고리의 한 면(그림에서 위쪽)에서 다가와 화살표 3개가 한꺼번에 움직인다: C=C π → O_a와 C1 사이, Os=O_a π → Os, Os=O_b π → O_b와 C2 사이. 같은 면에 붙은 5원자 고리 오스뮴산 에스터(C1–O_a–Os–O_b–C2, Os에 =O 두 개)가 생기고 Os는 +8에서 +6으로 환원된다. 2단계: NaHSO₃ 수용액으로 가수 분해하면 두 OH가 같은 면에 있는 cis-사이클로헥세인-1,2-다이올((1R,2S), 메조)이 남는다. 오른쪽: Os(VI)는 NMO에 의해 Os(VIII)로 되돌아가 촉매로 돈다.</desc>
