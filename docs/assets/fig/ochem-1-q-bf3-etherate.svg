  <title id="t-ochem-1-q-bf3-etherate">그림 유기화학 1-21 예제 20 삼플루오린화 붕소와 다이에틸 에터의 루이스 산–염기 반응</title>
  <desc id="d-ochem-1-q-bf3-etherate">왼쪽: 평면 삼각형 BF₃(B는 옥텟 6)와 분자 평면에 수직인 B의 빈 2p 오비탈(점선). 에터 O의 비공유 전자쌍 하나에서 B로 굽은 화살표 1개. 오른쪽: 사면체에 가까운 F₃B–O(CH₂CH₃)₂ 착물. B는 결합 4개로 형식 전하 −1(⊖), O는 결합 3개·전자쌍 1개로 +1(⊕), 전체 0. B의 혼성은 sp²에서 sp³로 바뀐다.</desc>
