<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="t-ochem-4-q-cyclohexyl-e2 d-ochem-4-q-cyclohexyl-e2">
  <title id="t-ochem-4-q-cyclohexyl-e2">그림 유기화학 4-15 예제 13 시스·트랜스 1-브로모-2-메틸사이클로헥세인의 E2</title>
  <desc id="d-ochem-4-q-cyclohexyl-e2">위: cis 이성질체는 메틸이 적도, Br이 축 방향(아래)인 의자 형태가 안정하다. C2와 C6의 축 방향 H(위, 빨강)가 모두 Br과 트랜스 이축이므로 두 알켄이 생기며, 1-메틸사이클로헥센이 주생성물, 3-메틸사이클로헥센이 부생성물이다. 아래: trans 이성질체는 이적도 형태가 안정하지만 Br이 적도라 E2가 불가능하다. 고리를 뒤집은 이축 형태(Br·CH₃ 모두 축)에서도 C2의 H는 적도 방향(회색)이라 Br과 안티가 아니고, C6의 축 방향 H만 안티이므로 (R)-3-메틸사이클로헥센만 생긴다(그림은 (1R,2R) 기질).</desc>
