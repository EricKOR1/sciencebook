<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-ochem-2-ethane-representations d-ochem-2-ethane-representations">
  <title id="t-ochem-2-ethane-representations">그림 유기화학 2-6 에테인의 엇갈린 형태와 가린 형태를 나타내는 세 가지 방법</title>
  <desc id="d-ochem-2-ethane-representations">위 줄은 엇갈린 형태, 아래 줄은 가린 형태이다. 왼쪽부터 쐐기–점선 그림(쐐기 = 종이 앞, 점선 = 종이 뒤), 톱질대 그림(앞 탄소가 왼쪽 아래, 뒤 탄소가 오른쪽 위), 뉴먼 투영식(앞 탄소 = 가운데 점에서 뻗는 세 결합, 뒤 탄소 = 원 둘레에서 뻗는 세 결합). 엇갈린 형태에서 가까운 앞뒤 H의 이면각은 φ = 60°, 가린 형태는 φ = 0°이다(가린 형태의 뒤 결합은 보이도록 조금 비켜 그렸다).</desc>
