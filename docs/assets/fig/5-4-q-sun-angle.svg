  <text x="660" y="264" class="f5-4-q-sun-angle-s">고도 25°</text>
  <text x="540" y="310" text-anchor="middle" class="f5-4-q-sun-angle-k">윗면에 닿는 햇살 2줄기</text>
  <text x="360" y="324" text-anchor="middle" class="f5-4-q-sun-angle-s">햇살 사이 간격(빛에 수직 방향)은 같고, 용기 윗면의 넓이도 같다.</text>
</svg>
