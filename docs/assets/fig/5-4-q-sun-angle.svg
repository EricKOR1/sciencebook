  <text x="300" y="264" class="f5-4-q-sun-angle-s">고도 65°</text>
  <text x="180" y="310" text-anchor="middle" class="f5-4-q-sun-angle-k">윗면에 닿는 햇살 7줄기</text>
  <text x="540" y="24" text-anchor="middle" class="f5-4-q-sun-angle-h">B  오후 4시 무렵</text>
  <rect x="370" y="270" width="340" height="18" class="f5-4-q-sun-angle-gr"/>
  <rect x="480.0" y="254" width="120" height="16" class="f5-4-q-sun-angle-box"/>
  <line x1="480.0" y1="254" x2="600.0" y2="254" class="f5-4-q-sun-angle-lid"/>
  <line x1="584.4" y1="189.7" x2="412.2" y2="270" class="f5-4-q-sun-angle-miss"/>
