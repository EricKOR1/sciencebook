  <line x1="101.4" y1="97.8" x2="21.1" y2="270" class="f5-4-q-sun-angle-miss"/>
  <line x1="121.3" y1="97.8" x2="41" y2="270" class="f5-4-q-sun-angle-miss"/>
  <line x1="141.1" y1="97.8" x2="60.8" y2="270" class="f5-4-q-sun-angle-miss"/>
  <line x1="161" y1="97.8" x2="80.7" y2="270" class="f5-4-q-sun-angle-miss"/>
  <line x1="180.9" y1="97.8" x2="100.6" y2="270" class="f5-4-q-sun-angle-miss"/>
  <line x1="200.7" y1="81.8" x2="123.8" y2="246.7" class="f5-4-q-sun-angle-ray"/>
  <path d="M120.4 254 L128.3 247.7 L120.1 243.9 Z" class="f5-4-q-sun-angle-rayh"/>
  <line x1="220.6" y1="81.8" x2="143.7" y2="246.7" class="f5-4-q-sun-angle-ray"/>
  <path d="M140.3 254 L148.2 247.7 L140 243.9 Z" class="f5-4-q-sun-angle-rayh"/>
  <line x1="240.4" y1="81.8" x2="163.5" y2="246.7" class="f5-4-q-sun-angle-ray"/>
  <path d="M160.1 254 L168 247.7 L159.9 243.9 Z" class="f5-4-q-sun-angle-rayh"/>
