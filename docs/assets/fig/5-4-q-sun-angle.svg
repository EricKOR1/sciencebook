<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-5-4-q-sun-angle d-5-4-q-sun-angle">
  <title id="t-5-4-q-sun-angle">그림 5-4-6 문제 14 해설: 햇빛이 비치는 각도와 용기가 받는 에너지</title>
  <desc id="d-5-4-q-sun-angle">같은 간격의 햇살이 수평으로 놓인 용기 윗면에 비친다. 낮 12시 무렵(태양 고도가 높음)에는 햇살이 수직에 가깝게 비쳐 윗면에 많은 햇살이 닿고, 오후 4시 무렵(태양 고도가 낮음)에는 비스듬히 비쳐 같은 햇살이 더 넓게 퍼지므로 같은 넓이의 윗면에 닿는 햇살이 줄어든다. 태양 고도 65°와 25°는 예로 든 값이며 모식도이다.</desc>
  <style>.f5-4-q-sun-angle-gr{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.2} .f5-4-q-sun-angle-box{fill:#333;stroke:var(--fig-ink);stroke-width:1.4} .f5-4-q-sun-angle-lid{stroke:var(--fig-blue);stroke-width:3;fill:none} .f5-4-q-sun-angle-ray{stroke:var(--fig-amber);stroke-width:2;fill:none} .f5-4-q-sun-angle-rayh{fill:var(--fig-amber)} .f5-4-q-sun-angle-miss{stroke:var(--fig-amber);stroke-width:1.4;fill:none;stroke-dasharray:3 4;opacity:0.7} .f5-4-q-sun-angle-sun{fill:#ffc83d;stroke:var(--fig-ink);stroke-width:1} .f5-4-q-sun-angle-arc{stroke:var(--fig-ink);stroke-width:1.2;fill:none} .f5-4-q-sun-angle-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .f5-4-q-sun-angle-t{font-size:14px;fill:var(--fig-ink)} .f5-4-q-sun-angle-s{font-size:13px;fill:var(--fig-muted)} .f5-4-q-sun-angle-k{font-size:14px;font-weight:700;fill:var(--fig-red)}</style>
  <text x="180" y="24" text-anchor="middle" class="f5-4-q-sun-angle-h">A  낮 12시 무렵</text>
