  <line x1="700" y1="198.9" x2="589" y2="250.6" class="f5-4-q-sun-angle-ray"/>
  <path d="M581.8 254 L591.8 254.3 L588 246.1 Z" class="f5-4-q-sun-angle-rayh"/>
