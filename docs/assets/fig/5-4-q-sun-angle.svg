  <path d="M219.7 254 L227.6 247.7 L219.4 243.9 Z" class="f5-4-q-sun-angle-rayh"/>
  <line x1="319.9" y1="81.8" x2="243" y2="246.7" class="f5-4-q-sun-angle-ray"/>
  <path d="M239.6 254 L247.5 247.7 L239.3 243.9 Z" class="f5-4-q-sun-angle-rayh"/>
  <line x1="339.7" y1="97.8" x2="259.4" y2="270" class="f5-4-q-sun-angle-miss"/>
