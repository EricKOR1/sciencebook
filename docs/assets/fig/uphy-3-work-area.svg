  <title id="t-uphy-3-work-area">그림 일반물리학 3-1 힘–위치 그래프 아래 넓이로 본 일</title>
  <desc id="d-uphy-3-work-area">왼쪽: 변하는 힘 F(x) = 6.0x − 1.5x²가 x = 0에서 4.0 m까지 한 일은 구간을 잘게 나눈 F dx 조각들의 합, 곧 그래프 아래 넓이 16 J이다. 오른쪽: 용수철을 천천히 늘이는 손의 힘 kx(k = 200 N/m)의 그래프에서 0 → 0.100 m 구간의 넓이는 1.00 J, 0.100 → 0.300 m 구간의 넓이는 8.00 J이다.</desc>
