  <title id="t-uearth-11-q-hubble-extinction">그림 일반지구과학 11-16 문제 16 풀이 — 소광 보정과 허블 상수</title>
  <desc id="d-uearth-11-q-hubble-extinction">후퇴 속도 cz ≈ 7495 km/s인 은하의 거리를 소광을 무시하고 구하면 약 126 Mpc(빈 점), 소광 0.30등급을 보정하면 약 110 Mpc(찬 점)이다. 원점과 이은 직선의 기울기가 허블 상수이므로, 거리가 짧아지면 H₀는 커지고(약 60 → 68 km/(s·Mpc)) 허블 시간은 짧아진다.</desc>
