    .f5-1-q-boxes-d-red{fill:var(--fig-red);stroke:var(--fig-paper);stroke-width:1.5}
    .f5-1-q-boxes-d-mut{fill:var(--fig-muted);stroke:var(--fig-paper);stroke-width:1.5}
    .f5-1-q-boxes-d-amber{fill:var(--fig-amber);stroke:var(--fig-paper);stroke-width:1.5}
    .f5-1-q-boxes-tb{font-size:14px;font-weight:700;fill:var(--fig-blue)}
    .f5-1-q-boxes-tr{font-size:14px;font-weight:700;fill:var(--fig-red)}
