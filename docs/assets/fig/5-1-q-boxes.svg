<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="t-5-1-q-boxes d-5-1-q-boxes">
  <title id="t-5-1-q-boxes">그림 5-1-6 문제 12 부피가 같은 두 물체</title>
  <desc id="d-5-1-q-boxes">(가)는 한 변이 1 cm인 정육면체, (나)는 가로 4 cm, 세로 0.5 cm, 높이 0.5 cm인 직육면체이다. 두 물체의 부피는 모두 1 cm³이다(같은 비율).</desc>
  <style>
    .f5-1-q-boxes-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
