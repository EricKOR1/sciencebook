  <title id="t-mech-1-q-building-throw">그림 역학과 에너지 1-13 문제 11의 건물 옥상에서 수평으로 던진 공</title>
  <desc id="d-mech-1-q-building-throw">높이 45 m인 건물 옥상 끝에서 공을 수평으로 던져 건물 벽에서 60 m 떨어진 곳에 떨어진 모습이다. 궤적은 문제 조건으로 계산한 포물선이고, θ는 바닥에 닿기 직전 속도가 수평면과 이루는 각이다. v₀ 화살표는 방향만 나타낸다.</desc>
