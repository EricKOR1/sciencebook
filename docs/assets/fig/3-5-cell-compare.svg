<title id="t-3-5-cell-compare">그림 3-5-2 동물 세포와 식물 세포의 세포 소기관</title>
<desc id="d-3-5-cell-compare">가운데 이름의 소기관(세포막, 핵, 리보솜, 소포체, 골지체, 미토콘드리아)은 두 세포에 모두 있다. 세포벽·엽록체와 큰 액포는 식물 세포에, 리소좀은 주로 동물 세포에 있다. 모식도(크기 비율은 실제와 다름).</desc>
