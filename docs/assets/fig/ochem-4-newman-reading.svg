  <text x="90.0" y="92.0" class="ochem-4-newman-reading-b" text-anchor="middle" style="fill:var(--fig-red)">CH₃</text>
  <line x1="112.4" y1="163.2" x2="133.0" y2="175.5" style="stroke:var(--fig-ink);stroke-width:2.0;stroke-linecap:butt"/>
  <text x="144.2" y="187.1" class="ochem-4-newman-reading-t" text-anchor="middle">Hᵃ</text>
  <line x1="68.1" y1="163.9" x2="47.8" y2="176.8" style="stroke:var(--fig-ink);stroke-width:2.0;stroke-linecap:butt"/>
  <text x="36.8" y="188.8" class="ochem-4-newman-reading-t" text-anchor="middle">Hᵇ</text>
  <line x1="90.0" y1="150.0" x2="90.0" y2="200.0" style="stroke:var(--fig-ink);stroke-width:2.0;stroke-linecap:butt"/>
  <text x="90.0" y="218.0" class="ochem-4-newman-reading-b" text-anchor="middle" style="fill:var(--fig-green)">Br</text>
  <line x1="90.0" y1="150.0" x2="46.8" y2="124.8" style="stroke:var(--fig-ink);stroke-width:2.0;stroke-linecap:butt"/>
  <text x="35.6" y="123.3" class="ochem-4-newman-reading-t" text-anchor="middle">CH₃</text>
  <line x1="90.0" y1="150.0" x2="135.5" y2="129.2" style="stroke:var(--fig-ink);stroke-width:2.0;stroke-linecap:butt"/>
  <text x="147.3" y="128.8" class="ochem-4-newman-reading-t" text-anchor="middle">H</text>
  <circle cx="90.0" cy="150.0" r="2.6" style="fill:var(--fig-ink)"/>
  <text x="90.0" y="40.0" class="ochem-4-newman-reading-b" text-anchor="middle">(가) Br과 CH₃가 안티</text>
  <text x="90.0" y="262.0" class="ochem-4-newman-reading-s" text-anchor="middle">이면각 Br–C–C–CH₃ = 180°</text>
  <circle cx="250.0" cy="150.0" r="26" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2.0"/>
  <line x1="227.6" y1="163.2" x2="207.0" y2="175.5" style="stroke:var(--fig-ink);stroke-width:2.0;stroke-linecap:butt"/>
  <text x="195.8" y="187.1" class="ochem-4-newman-reading-t" text-anchor="middle">CH₃</text>
