  <line x1="606.0" y1="130.3" x2="603.7" y2="131.6" style="stroke:var(--fig-ink);stroke-width:1.5"/>
  <line x1="604.6" y1="126.3" x2="601.2" y2="128.1" style="stroke:var(--fig-ink);stroke-width:1.5"/>
  <line x1="603.1" y1="122.2" x2="598.6" y2="124.6" style="stroke:var(--fig-ink);stroke-width:1.5"/>
