<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-ochem-4-newman-reading d-ochem-4-newman-reading">
  <title id="t-ochem-4-newman-reading">그림 유기화학 4-1 (R)-2-브로모뷰테인의 C2–C3 뉴먼 투영식 읽기</title>
  <desc id="d-ochem-4-newman-reading">(R)-2-브로모뷰테인을 C2(앞, 가운데 점)에서 C3(뒤, 원) 쪽으로 내려다본 엇갈린 형태 세 가지. 세 그림 모두 앞 탄소의 Br을 아래(6시)에 두었다. (가)에서는 Br이 뒤 탄소의 CH₃와 이면각 180°이고, (나)·(다)에서는 Br이 뒤 탄소의 서로 다른 H와 180°(H–C–C–Br 안티 준평면)이다. 오른쪽은 같은 분자의 쐐기·점선 그림(CH₃ 왼쪽 아래, CH₂CH₃ 오른쪽 아래, Br 위쪽 쐐기, H 위쪽 점선)으로 R 배치이다. 회전은 형태만 바꾸고 C2의 배치(R)는 바꾸지 않는다.</desc>
  <style>.ochem-4-newman-reading-t{font-size:14px;fill:var(--fig-ink)} .ochem-4-newman-reading-b{font-size:14px;fill:var(--fig-ink);font-weight:600} .ochem-4-newman-reading-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ochem-4-newman-reading-s{font-size:13px;fill:var(--fig-muted)} .ochem-4-newman-reading-n{font-size:13px;fill:var(--fig-muted)} .ochem-4-newman-reading-r{font-size:13px;fill:var(--fig-red);font-weight:600} .ochem-4-newman-reading-g{font-size:13px;fill:var(--fig-green);font-weight:600} .ochem-4-newman-reading-v{font-size:13px;fill:var(--fig-violet)} .ochem-4-newman-reading-pl{font-size:20px;fill:var(--fig-ink)} .ochem-4-newman-reading-f{font-size:14px;fill:var(--fig-ink)}</style>
  <circle cx="90.0" cy="150.0" r="26" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2.0"/>
