  <line x1="598.8" y1="109.9" x2="590.8" y2="114.1" style="stroke:var(--fig-ink);stroke-width:1.5"/>
  <text x="615.0" y="155.0" class="ochem-4-newman-reading-t" text-anchor="middle">C2</text>
  <text x="560.0" y="188.0" class="ochem-4-newman-reading-t" text-anchor="middle">CH₃</text>
  <text x="676.0" y="188.0" class="ochem-4-newman-reading-t" text-anchor="middle">CH₂CH₃</text>
  <text x="645.4" y="101.1" class="ochem-4-newman-reading-t" text-anchor="middle" style="fill:var(--fig-green)">Br</text>
  <text x="586.6" y="101.1" class="ochem-4-newman-reading-t" text-anchor="middle">H</text>
  <text x="615.0" y="40.0" class="ochem-4-newman-reading-b" text-anchor="middle">같은 분자(쐐기·점선)</text>
  <text x="615.0" y="236.0" class="ochem-4-newman-reading-s" text-anchor="middle">Br(쐐기) → CH₂CH₃ → CH₃</text>
  <text x="615.0" y="254.0" class="ochem-4-newman-reading-s" text-anchor="middle">시계 방향, H는 뒤 → (R)</text>
  <text x="615.0" y="284.0" class="ochem-4-newman-reading-t" text-anchor="middle">C2–C3 결합을 회전해도</text>
  <text x="615.0" y="304.0" class="ochem-4-newman-reading-t" text-anchor="middle">C2의 배치는 R 그대로</text>
</svg>
