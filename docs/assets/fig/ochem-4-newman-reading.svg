  <text x="306.2" y="183.5" class="ochem-4-newman-reading-t" text-anchor="middle">Hᵇ</text>
  <line x1="250.0" y1="150.0" x2="250.0" y2="200.0" style="stroke:var(--fig-ink);stroke-width:2.0;stroke-linecap:butt"/>
  <text x="250.0" y="218.0" class="ochem-4-newman-reading-b" text-anchor="middle" style="fill:var(--fig-red)">Br</text>
  <line x1="250.0" y1="150.0" x2="206.8" y2="124.8" style="stroke:var(--fig-ink);stroke-width:2.0;stroke-linecap:butt"/>
  <text x="195.6" y="123.3" class="ochem-4-newman-reading-t" text-anchor="middle">CH₃</text>
  <line x1="250.0" y1="150.0" x2="295.5" y2="129.2" style="stroke:var(--fig-ink);stroke-width:2.0;stroke-linecap:butt"/>
  <text x="307.3" y="128.8" class="ochem-4-newman-reading-t" text-anchor="middle">H</text>
  <circle cx="250.0" cy="150.0" r="2.6" style="fill:var(--fig-ink)"/>
  <text x="250.0" y="40.0" class="ochem-4-newman-reading-b" text-anchor="middle">(나) Br과 Hᵃ가 안티</text>
  <line x1="250.0" y1="104.0" x2="250.0" y2="196.0" style="stroke:var(--fig-red);stroke-width:1;stroke-linecap:round;stroke-dasharray:3 3;opacity:0.7"/>
  <text x="250.0" y="262.0" class="ochem-4-newman-reading-r" text-anchor="middle">H–C–C–Br 안티 준평면</text>
  <circle cx="410.0" cy="150.0" r="26" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2.0"/>
  <line x1="431.9" y1="163.9" x2="452.2" y2="176.8" style="stroke:var(--fig-ink);stroke-width:2.0;stroke-linecap:butt"/>
  <text x="463.2" y="188.8" class="ochem-4-newman-reading-t" text-anchor="middle">CH₃</text>
  <line x1="386.8" y1="161.8" x2="365.4" y2="172.6" style="stroke:var(--fig-ink);stroke-width:2.0;stroke-linecap:butt"/>
  <text x="353.8" y="183.5" class="ochem-4-newman-reading-t" text-anchor="middle">Hᵃ</text>
  <line x1="410.0" y1="124.0" x2="410.0" y2="100.0" style="stroke:var(--fig-ink);stroke-width:2.0;stroke-linecap:butt"/>
  <text x="410.0" y="92.0" class="ochem-4-newman-reading-b" text-anchor="middle" style="fill:var(--fig-red)">Hᵇ</text>
  <line x1="410.0" y1="150.0" x2="410.0" y2="200.0" style="stroke:var(--fig-ink);stroke-width:2.0;stroke-linecap:butt"/>
  <text x="410.0" y="218.0" class="ochem-4-newman-reading-b" text-anchor="middle" style="fill:var(--fig-red)">Br</text>
  <line x1="410.0" y1="150.0" x2="366.8" y2="124.8" style="stroke:var(--fig-ink);stroke-width:2.0;stroke-linecap:butt"/>
  <text x="355.6" y="123.3" class="ochem-4-newman-reading-t" text-anchor="middle">CH₃</text>
  <line x1="410.0" y1="150.0" x2="455.5" y2="129.2" style="stroke:var(--fig-ink);stroke-width:2.0;stroke-linecap:butt"/>
  <text x="467.3" y="128.8" class="ochem-4-newman-reading-t" text-anchor="middle">H</text>
  <circle cx="410.0" cy="150.0" r="2.6" style="fill:var(--fig-ink)"/>
  <text x="410.0" y="40.0" class="ochem-4-newman-reading-b" text-anchor="middle">(다) Br과 Hᵇ가 안티</text>
  <line x1="410.0" y1="104.0" x2="410.0" y2="196.0" style="stroke:var(--fig-red);stroke-width:1;stroke-linecap:round;stroke-dasharray:3 3;opacity:0.7"/>
  <text x="410.0" y="262.0" class="ochem-4-newman-reading-r" text-anchor="middle">H–C–C–Br 안티 준평면</text>
  <text x="250.0" y="292.0" class="ochem-4-newman-reading-s" text-anchor="middle">앞 탄소 C2(점): Br, CH₃, H   ·   뒤 탄소 C3(원): CH₃, Hᵃ, Hᵇ</text>
  <text x="250.0" y="312.0" class="ochem-4-newman-reading-s" text-anchor="middle">세 형태는 C2–C3 결합을 120°씩 돌린 것 — 형태(conformation)만 다르다</text>
  <line x1="505.0" y1="30.0" x2="505.0" y2="310.0" style="stroke:var(--fig-line);stroke-width:0.8;stroke-linecap:round"/>
  <line x1="603.7" y1="156.5" x2="577.8" y2="171.5" style="stroke:var(--fig-ink);stroke-width:2;stroke-linecap:butt"/>
  <line x1="626.3" y1="156.5" x2="652.2" y2="171.5" style="stroke:var(--fig-ink);stroke-width:2;stroke-linecap:butt"/>
