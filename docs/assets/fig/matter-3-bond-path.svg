<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 416" role="img" aria-labelledby="t-matter-3-bond-path d-matter-3-bond-path">
  <title id="t-matter-3-bond-path">그림 물질과 에너지 3-6 결합 에너지로 반응 엔탈피 어림하기</title>
  <desc id="d-matter-3-bond-path">수소와 염소가 염화 수소가 되는 반응을, 모든 결합을 끊어 원자로 만드는 단계(679 kJ 흡수)와 원자들이 H–Cl 결합을 만드는 단계(862 kJ 방출)로 나누면 반응 엔탈피는 약 −183 kJ이다. 층의 높이 차는 값에 비례하게 그렸고 분자 모양은 모식도이다.</desc>
  <style>
    .matter-3-bond-path-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
    .matter-3-bond-path-gr{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4}
    .matter-3-bond-path-g{fill:none;stroke:var(--fig-muted);stroke-width:1.2;stroke-dasharray:4 4}
    .matter-3-bond-path-lv{fill:none;stroke:var(--fig-ink);stroke-width:3;stroke-linecap:round}
    .matter-3-bond-path-ink{fill:var(--fig-ink)}
    .matter-3-bond-path-l{font-size:14px;fill:var(--fig-ink)}
    .matter-3-bond-path-b{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .matter-3-bond-path-s{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .matter-3-bond-path-t{font-size:13px;fill:var(--fig-muted)}
  </style>
  <path d="M40 30 L40 370" style="fill:none;stroke:var(--fig-muted);stroke-width:1.4"/>
  <path d="M40 22 l-5 10 l10 0 z" style="fill:var(--fig-muted)"/>
  <text x="50.0" y="30.0" class="matter-3-bond-path-t">엔탈피 H</text>
  <line x1="150" y1="90.0" x2="600" y2="90.0" class="matter-3-bond-path-lv"/>
  <circle cx="250.0" cy="68.0" r="12" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="250.0" y="73.0" text-anchor="middle" class="matter-3-bond-path-s">H</text>
  <circle cx="290.0" cy="68.0" r="12" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="290.0" y="73.0" text-anchor="middle" class="matter-3-bond-path-s">H</text>
  <circle cx="345.0" cy="68.0" r="16" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.8"/>
  <text x="345.0" y="73.0" text-anchor="middle" class="matter-3-bond-path-s">Cl</text>
  <circle cx="395.0" cy="68.0" r="16" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.8"/>
  <text x="395.0" y="73.0" text-anchor="middle" class="matter-3-bond-path-s">Cl</text>
  <text x="600.0" y="76.0" text-anchor="end" class="matter-3-bond-path-s">2H(g) + 2Cl(g)</text>
  <text x="600.0" y="112.0" text-anchor="end" class="matter-3-bond-path-t">낱개의 원자</text>
  <line x1="60" y1="294.8" x2="300" y2="294.8" class="matter-3-bond-path-lv"/>
  <circle cx="160.0" cy="272.8" r="12" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="160.0" y="277.8" text-anchor="middle" class="matter-3-bond-path-s">H</text>
  <circle cx="181.0" cy="272.8" r="12" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="181.0" y="277.8" text-anchor="middle" class="matter-3-bond-path-s">H</text>
  <circle cx="235.0" cy="272.8" r="16" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.8"/>
  <text x="235.0" y="277.8" text-anchor="middle" class="matter-3-bond-path-s">Cl</text>
  <circle cx="262.0" cy="272.8" r="16" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.8"/>
  <text x="262.0" y="277.8" text-anchor="middle" class="matter-3-bond-path-s">Cl</text>
  <text x="70.0" y="244.8" class="matter-3-bond-path-s">H₂(g) + Cl₂(g)</text>
  <line x1="60" y1="350.0" x2="330" y2="350.0" class="matter-3-bond-path-g"/>
  <line x1="330" y1="350.0" x2="690" y2="350.0" class="matter-3-bond-path-lv"/>
  <circle cx="530.0" cy="328.0" r="12" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="530.0" y="333.0" text-anchor="middle" class="matter-3-bond-path-s">H</text>
  <circle cx="553.0" cy="328.0" r="16" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.8"/>
  <text x="553.0" y="333.0" text-anchor="middle" class="matter-3-bond-path-s">Cl</text>
  <circle cx="610.0" cy="328.0" r="12" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <text x="610.0" y="333.0" text-anchor="middle" class="matter-3-bond-path-s">H</text>
  <circle cx="633.0" cy="328.0" r="16" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.8"/>
  <text x="633.0" y="333.0" text-anchor="middle" class="matter-3-bond-path-s">Cl</text>
  <text x="690.0" y="374.0" text-anchor="end" class="matter-3-bond-path-s">2HCl(g)</text>
  <line x1="200.0" y1="252.8" x2="200.0" y2="105.0" style="stroke:var(--fig-amber);stroke-width:3;fill:none"/>
  <path d="M200.0 93.0 L206.0 105.0 L194.0 105.0 Z" style="fill:var(--fig-amber)"/>
  <text x="212.0" y="150.0" class="matter-3-bond-path-s" style="fill:var(--fig-amber)">① 결합 끊기(흡수)</text>
  <text x="212.0" y="170.0" class="matter-3-bond-path-b" style="fill:var(--fig-amber)">+679 kJ</text>
  <text x="212.0" y="189.0" class="matter-3-bond-path-t">H–H 436 + Cl–Cl 243</text>
  <line x1="450.0" y1="94.0" x2="450.0" y2="335.0" style="stroke:var(--fig-blue);stroke-width:3;fill:none"/>
  <path d="M450.0 347.0 L444.0 335.0 L456.0 335.0 Z" style="fill:var(--fig-blue)"/>
  <text x="462.0" y="190.0" class="matter-3-bond-path-s" style="fill:var(--fig-blue)">② 결합 생성(방출)</text>
  <text x="462.0" y="210.0" class="matter-3-bond-path-b" style="fill:var(--fig-blue)">−862 kJ</text>
  <text x="462.0" y="229.0" class="matter-3-bond-path-t">H–Cl 2 × 431</text>
  <line x1="85.0" y1="298.8" x2="85.0" y2="337.0" style="stroke:var(--fig-red);stroke-width:3;fill:none"/>
  <path d="M85.0 347.0 L80.0 337.0 L90.0 337.0 Z" style="fill:var(--fig-red)"/>
  <text x="97.0" y="338.0" class="matter-3-bond-path-b" style="fill:var(--fig-red)">ΔH ≈ −183 kJ</text>
  <text x="360.0" y="404.0" text-anchor="middle" class="matter-3-bond-path-t">ΔH ≈ Σ(끊어지는 결합의 에너지) − Σ(생성되는 결합의 에너지) = 679 − 862</text>
</svg>
