<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uchem-9-q-fe-mg-window d-uchem-9-q-fe-mg-window">
  <title id="t-uchem-9-q-fe-mg-window">그림 일반화학 9-8 문제 9 — pH로 Fe³⁺만 침전시키는 범위</title>
  <desc id="d-uchem-9-q-fe-mg-window">용액에 녹아 있을 수 있는 금속 이온 농도의 최댓값(로그)을 pH에 대해 그렸다. Fe³⁺는 log[Fe³⁺] = log Kₛₚ − 3 log[OH⁻]로 pH가 1 오를 때마다 1000분의 1이 되어 pH 2.82에서 1.0×10⁻⁵ M에 이른다. Mg²⁺(0.10 M)는 pH 8.87에서 Mg(OH)₂가 침전하기 시작한다. 그 사이(색 띠)가 가능한 pH 범위이다.</desc>
