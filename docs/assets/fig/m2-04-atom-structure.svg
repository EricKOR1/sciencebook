<text x="610" y="332" text-anchor="middle" class="m2-04-atom-k">산소 O · 전자 8개</text>
<text x="510" y="370" text-anchor="middle" class="m2-04-atom-s">양성자 수 = 전자 수 → (+)와 (−)가 같아 원자는 중성</text>
