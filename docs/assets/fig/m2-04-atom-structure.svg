<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" role="img" aria-labelledby="t-m2-04-atom d-m2-04-atom">
  <title id="t-m2-04-atom">그림 중2-4-1 원자의 구조와 원자 모형</title>
  <desc id="d-m2-04-atom">원자의 중심에는 양성자와 중성자로 이루어진 원자핵이 있고, 그 주위를 전자가 움직인다. 원자 모형에서는 원자핵에 양성자 수만큼 (+)를 쓰고 전자를 양성자 수만큼 그린다. 양성자 수와 전자 수가 같아 원자는 전기적으로 중성이다. 크기 비율은 실제와 다른 모식도이다.</desc>
  <style>
    .m2-04-atom-t{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .m2-04-atom-k{font-size:14px;fill:var(--fig-ink)}
    .m2-04-atom-s{font-size:13px;fill:var(--fig-muted)}
    .m2-04-atom-cloud{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.2;stroke-dasharray:5 4}
    .m2-04-atom-nuc{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2}
    .m2-04-atom-e{fill:var(--fig-blue)}
    .m2-04-atom-et{font-size:13px;font-weight:700;fill:var(--fig-panel)}
    .m2-04-atom-pt{font-size:15px;font-weight:700;fill:var(--fig-red)}
  </style>
<circle cx="165" cy="190" r="105" class="m2-04-atom-cloud"/>
<circle cx="165" cy="190" r="30" class="m2-04-atom-nuc"/>
<circle cx="155" cy="181" r="11" style="fill:var(--fig-red)"/>
<text x="155" y="186" text-anchor="middle" class="m2-04-atom-et">+</text>
<circle cx="175" cy="199" r="11" style="fill:var(--fig-red)"/>
<text x="175" y="204" text-anchor="middle" class="m2-04-atom-et">+</text>
<circle cx="175" cy="181" r="11" style="fill:var(--fig-line)"/>
<circle cx="155" cy="199" r="11" style="fill:var(--fig-line)"/>
<circle cx="93.0" cy="132.0" r="9" class="m2-04-atom-e"/>
<text x="93.0" y="136.5" text-anchor="middle" class="m2-04-atom-et">−</text>
<circle cx="243.0" cy="236.0" r="9" class="m2-04-atom-e"/>
<text x="243.0" y="240.5" text-anchor="middle" class="m2-04-atom-et">−</text>
<line x1="85" y1="124" x2="53" y2="88" style="stroke:var(--fig-muted);stroke-width:1"/>
<text x="20" y="62" class="m2-04-atom-k">전자 (−): 원자핵 주위를 움직인다</text>
<line x1="187" y1="212" x2="225" y2="310" style="stroke:var(--fig-muted);stroke-width:1"/>
<text x="20" y="322" class="m2-04-atom-k">원자핵 = 양성자(+) + 중성자</text>
<circle cx="28" cy="341" r="7" style="fill:var(--fig-red)"/><text x="40" y="346" class="m2-04-atom-s">양성자 (+)</text>
<circle cx="130" cy="341" r="7" style="fill:var(--fig-line)"/><text x="142" y="346" class="m2-04-atom-s">중성자 (전하 없음)</text>
<text x="165" y="36" text-anchor="middle" class="m2-04-atom-t">헬륨 원자의 구조</text>
<text x="20" y="370" class="m2-04-atom-s">원자핵은 실제로 원자의 약 10만분의 1 크기이다</text>
<text x="530" y="38" text-anchor="middle" class="m2-04-atom-t">원자 모형으로 나타내기</text>
