  <path d="M388 264 L400 270 L388 276 Z" style="fill:var(--fig-green)"/>
  <text x="386.0" y="292.0" text-anchor="end" class="b2aut-sm">아세틸콜린</text>
  <circle cx="424" cy="270" r="8" style="fill:var(--fig-green)"/>
  <line x1="432" y1="270" x2="520" y2="270" style="stroke:var(--fig-green);stroke-width:3.5"/>
  <path d="M520 264 L532 270 L520 276 Z" style="fill:var(--fig-green)"/>
  <text x="518.0" y="292.0" text-anchor="end" class="b2aut-sm">아세틸콜린</text>
