  <text x="400.0" y="240.0" text-anchor="middle" class="b2aut-sm">신경절</text>
  <text x="242.0" y="262.0" text-anchor="middle" class="b2aut-sm">신경절 이전 뉴런</text>
  <text x="476.0" y="262.0" text-anchor="middle" class="b2aut-sm">신경절 이후 뉴런</text>
  <rect x="540" y="248" width="110" height="44" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-line);stroke-width:1.6"/>
  <text x="595.0" y="275.0" text-anchor="middle" class="b2aut-b">내장 기관</text>
  <text x="672.0" y="215.0" class="b2aut-sm">길항</text>
  <text x="672.0" y="231.0" class="b2aut-sm">작용</text>
  <path d="M656 158 Q676 220 656 282" style="fill:none;stroke:var(--fig-muted);stroke-width:1.5"/>
  <text x="360.0" y="336.0" text-anchor="middle" class="b2aut-sm">교감: 신경절 이전 뉴런이 짧고 이후 뉴런이 길다 · 부교감: 신경절 이전 뉴런이 길고 이후 뉴런이 짧다</text>

