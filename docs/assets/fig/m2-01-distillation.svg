<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="t-m2-01-distillation d-m2-01-distillation">
  <title id="t-m2-01-distillation">그림 중2-1-6 증류 장치</title>
  <desc id="d-m2-01-distillation">가지 달린 플라스크에서 액체 혼합물을 가열하면 끓는점이 낮은 물질이 먼저 기체가 되어 나오고, 냉각기에서 식어 액체로 모인다. 온도계의 끝은 가지 높이에 두고, 냉각수는 아래쪽으로 넣어 위쪽으로 뺀다.</desc>
  <style>.m2-01-distillation-t{font-size:14px;fill:var(--fig-ink)} .m2-01-distillation-b{font-weight:600} .m2-01-distillation-s{font-size:13px;fill:var(--fig-muted)}
    .m2-01-distillation-gl{fill:none;stroke:var(--fig-ink);stroke-width:2;stroke-linejoin:round} .m2-01-distillation-lq{fill:var(--fig-soft-blue)} .m2-01-distillation-ld{stroke:var(--fig-muted);stroke-width:1}</style>
  <path d="M150 92 L150 186 A60 60 0 1 0 190 186 L190 92" class="m2-01-distillation-gl"/>
  <path d="M110.5 250 A60 60 0 0 0 229.5 250 Z" class="m2-01-distillation-lq"/>
  <rect x="142" y="80" width="56" height="14" rx="3" style="fill:var(--fig-muted)"/>
  <line x1="170" y1="66" x2="170" y2="128" style="stroke:var(--fig-red);stroke-width:3"/>
  <rect x="165" y="40" width="10" height="34" rx="4" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.5"/>
  <circle cx="170" cy="131" r="5" style="fill:var(--fig-red)"/>
  <circle cx="150" cy="272" r="4" style="fill:var(--fig-muted)"/>
  <circle cx="170" cy="280" r="4" style="fill:var(--fig-muted)"/>
  <circle cx="190" cy="272" r="4" style="fill:var(--fig-muted)"/>
  <line x1="100" y1="318" x2="240" y2="318" style="stroke:var(--fig-line);stroke-width:2.5"/>
  <path d="M160 352 Q170 324 180 352 Z" style="fill:var(--fig-amber)"/>
  <rect x="150" y="352" width="40" height="22" rx="3" style="fill:var(--fig-muted)"/>
  <path d="M299.6 156.3 L476.0 226.8 L461.1 264.0 L284.7 193.4 Z" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:2"/>
  <line x1="192.2" y1="128.4" x2="498.6" y2="251.0" class="m2-01-distillation-gl"/><line x1="187.8" y1="139.6" x2="494.2" y2="262.1" class="m2-01-distillation-gl"/>
  <line x1="437.9" y1="254.7" x2="437.9" y2="298.7" style="stroke:var(--fig-teal);stroke-width:6"/>
  <path d="M437.9 256.7 l-7 12 l14 0 z" style="fill:var(--fig-teal)"/>
  <text x="427.9" y="294.7" text-anchor="end" class="m2-01-distillation-s" style="fill:var(--fig-teal)">찬물 들어감 (아래쪽)</text>
  <line x1="322.8" y1="165.6" x2="322.8" y2="125.6" style="stroke:var(--fig-teal);stroke-width:6"/>
  <path d="M322.8 117.6 l-7 12 l14 0 z" style="fill:var(--fig-teal)"/>
  <text x="312.8" y="135.6" text-anchor="end" class="m2-01-distillation-s" style="fill:var(--fig-teal)">물 나감 (위쪽)</text>
  <path d="M488 265 L488 297 L460 357 L532 357 L504 297 L504 265" class="m2-01-distillation-gl"/>
  <path d="M468 339 L524 339 L532 357 L460 357 Z" class="m2-01-distillation-lq"/>
  <circle cx="496" cy="283" r="3" style="fill:var(--fig-blue)"/><circle cx="496" cy="309" r="3" style="fill:var(--fig-blue)"/>
  <text x="240" y="40" class="m2-01-distillation-t m2-01-distillation-b">온도계: 끝을 가지 높이에</text>
  <text x="240" y="59" class="m2-01-distillation-s">(나오는 기체의 온도를 잰다)</text>
  <text x="20" y="150" class="m2-01-distillation-t m2-01-distillation-b">가지 달린 플라스크</text>
  <text x="20" y="169" class="m2-01-distillation-s">액체 혼합물</text>
  <text x="20" y="300" class="m2-01-distillation-t m2-01-distillation-b">끓임쪽</text>
  <text x="20" y="319" class="m2-01-distillation-s">(갑자기 끓어오름 방지)</text>
  <text x="205" y="368" class="m2-01-distillation-t m2-01-distillation-b">가열</text>
  <text x="400" y="150" class="m2-01-distillation-t m2-01-distillation-b">냉각기</text>
  <text x="400" y="169" class="m2-01-distillation-s">기체가 식어 액체가 된다</text>
  <text x="542" y="297" class="m2-01-distillation-t m2-01-distillation-b">받는 그릇</text>
  <text x="542" y="316" class="m2-01-distillation-s">끓는점이 낮은 물질이</text>
  <text x="542" y="334" class="m2-01-distillation-s">먼저 모인다</text>
  <line x1="238.0" y1="48.0" x2="178.0" y2="72.0" class="m2-01-distillation-ld"/>
  <line x1="90.0" y1="170.0" x2="118.0" y2="205.0" class="m2-01-distillation-ld"/>
  <line x1="60.0" y1="306.0" x2="146.0" y2="276.0" class="m2-01-distillation-ld"/>
  <line x1="399.8" y1="171.6" x2="387.8" y2="191.6" class="m2-01-distillation-ld"/>
</svg>
