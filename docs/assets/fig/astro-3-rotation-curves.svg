<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-astro-3-rotation-curves d-astro-3-rotation-curves">
  <title id="t-astro-3-rotation-curves">그림 행성우주과학 3-6 은하의 회전 속도를 재는 방법과 질량 분포에 따른 회전 곡선</title>
  <desc id="d-astro-3-rotation-curves">옆에서 본 나선 은하는 한쪽 끝이 다가오고 반대쪽 끝이 멀어지므로, 스펙트럼선이 한쪽은 청색 편이, 다른 쪽은 적색 편이를 보인다. 오른쪽 그래프에서 질량이 중심에 몰려 있으면 회전 속도가 멀수록 줄고(케플러 회전), 균일한 공처럼 퍼져 있으면 거리에 비례하며(강체 회전), 관측된 나선 은하는 중심부에서 빠르게 증가한 뒤 바깥까지 거의 평탄하다.</desc>
  <style>.astro-3-rotation-curves-ink{fill:var(--fig-ink)} .astro-3-rotation-curves-mut{fill:var(--fig-muted)} .astro-3-rotation-curves-t{font-size:14px;fill:var(--fig-ink)} .astro-3-rotation-curves-s{font-size:13px;fill:var(--fig-muted)} .astro-3-rotation-curves-b{font-weight:600} .astro-3-rotation-curves-ax{stroke:var(--fig-line);stroke-width:1.5;fill:none}</style>
