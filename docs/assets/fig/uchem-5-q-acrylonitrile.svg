  <text x="280.0" y="180.0" text-anchor="middle" class="uchem-5-q-acrylonitrile-s"><tspan dy="0">sp</tspan><tspan dy="-6" style="font-size:0.72em">2</tspan></text>
  <text x="307.0" y="223.5" text-anchor="middle" class="uchem-5-q-acrylonitrile-s"><tspan dy="0">sp</tspan></text>
  <text x="470.0" y="70.0" text-anchor="start" class="uchem-5-q-acrylonitrile-t"><tspan dy="0">σ 결합 6개</tspan></text>
  <text x="470.0" y="94.0" text-anchor="start" class="uchem-5-q-acrylonitrile-t"><tspan dy="0">π 결합 3개</tspan></text>
  <text x="470.0" y="118.0" text-anchor="start" class="uchem-5-q-acrylonitrile-t"><tspan dy="0">원자 7개가 한 평면 위</tspan></text>
