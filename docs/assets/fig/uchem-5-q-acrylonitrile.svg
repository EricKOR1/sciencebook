<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-uchem-5-q-acrylonitrile d-uchem-5-q-acrylonitrile">
  <title id="t-uchem-5-q-acrylonitrile">그림 일반화학 5-11 예제 6 풀이 — 아크릴로나이트릴의 σ·π 결합</title>
  <desc id="d-uchem-5-q-acrylonitrile">아크릴로나이트릴의 모든 결합에는 σ 결합이 하나씩(모두 6개) 있고, C=C에 π 결합 1개, C≡N에 π 결합 2개(모두 3개)가 더해진다. 두 sp² 탄소 주위는 약 120°, sp 탄소 주위는 180°이며 원자 7개가 한 평면에 놓인다.</desc>
  <style>
    .uchem-5-q-acrylonitrile-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-5-q-acrylonitrile-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-5-q-acrylonitrile-b{font-size:15px;fill:var(--fig-ink);font-weight:bold}
    .uchem-5-q-acrylonitrile-ax{stroke:var(--fig-ink);stroke-width:1.3;fill:none}
    .uchem-5-q-acrylonitrile-gr{stroke:var(--fig-line);stroke-width:0.7;fill:none;stroke-dasharray:3 3}
    .uchem-5-q-acrylonitrile-ln{stroke:var(--fig-ink);stroke-width:2;fill:none}
    .uchem-5-q-acrylonitrile-lv{stroke:var(--fig-ink);stroke-width:2.2;fill:none}
    .uchem-5-q-acrylonitrile-bl{stroke:var(--fig-blue);stroke-width:2.4;fill:none}
    .uchem-5-q-acrylonitrile-rd{stroke:var(--fig-red);stroke-width:2.4;fill:none}
    .uchem-5-q-acrylonitrile-gn{stroke:var(--fig-green);stroke-width:2.4;fill:none}
    .uchem-5-q-acrylonitrile-am{stroke:var(--fig-amber);stroke-width:2.4;fill:none}
    .uchem-5-q-acrylonitrile-dash{stroke:var(--fig-muted);stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    .uchem-5-q-acrylonitrile-fink{fill:var(--fig-ink)} .uchem-5-q-acrylonitrile-fbl{fill:var(--fig-blue)} .uchem-5-q-acrylonitrile-frd{fill:var(--fig-red)}
    .uchem-5-q-acrylonitrile-fgn{fill:var(--fig-green)} .uchem-5-q-acrylonitrile-fam{fill:var(--fig-amber)} .uchem-5-q-acrylonitrile-fmu{fill:var(--fig-muted)}
    .uchem-5-q-acrylonitrile-box{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.4}
    .uchem-5-q-acrylonitrile-sb{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6}
    .uchem-5-q-acrylonitrile-sr{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.6}
    .uchem-5-q-acrylonitrile-sg{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.6}
    .uchem-5-q-acrylonitrile-sa{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.6}
    .uchem-5-q-acrylonitrile-sv{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.6}
    .uchem-5-q-acrylonitrile-st{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.6}
    .uchem-5-q-acrylonitrile-A{font-size:20px;fill:var(--fig-ink)}
  </style>
