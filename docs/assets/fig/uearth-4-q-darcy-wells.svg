<title id="t-uearth-4-q-darcy-wells">그림 일반지구과학 4-13 문제 6의 관측정과 우물</title>
<desc id="d-uearth-4-q-darcy-wells">자유면 대수층에 600 m 떨어진 두 관측정이 있고, 두 관측정의 지하수위 차는 3.0 m이다. 상류 관측정 자리의 누출 지점에서 300 m 하류에 우물이 있다. 세로 방향은 크게 과장한 모식도이다.</desc>
