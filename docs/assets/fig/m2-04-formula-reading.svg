<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-m2-04-formula-reading d-m2-04-formula-reading">
  <title id="t-m2-04-formula-reading">그림 중2-4-2 화학식 읽기 — 앞의 큰 숫자와 오른쪽 아래 작은 숫자</title>
  <desc id="d-m2-04-formula-reading">3CO₂에서 원소 기호 C와 O는 원자의 종류를, O 오른쪽 아래의 작은 숫자 2는 분자 1개 속 산소 원자의 개수를, 앞의 큰 숫자 3은 분자의 개수를 나타낸다. 2H는 떨어져 있는 수소 원자 2개, H₂는 수소 원자 2개가 결합한 수소 분자 1개, 2H₂는 수소 분자 2개이다. 원자의 크기와 모양은 모식적으로 나타냈다.</desc>
  <style>
    .m2-04-formula-reading-t{font-size:14px;fill:var(--fig-ink)}
    .m2-04-formula-reading-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .m2-04-formula-reading-s{font-size:13px;fill:var(--fig-muted)}

  </style>
