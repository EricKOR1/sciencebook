  <title id="t-ochem-8-frost-circles">그림 유기화학 8-1 프로스트 원으로 읽는 고리의 π 준위(C3~C8)</title>
  <desc id="d-ochem-8-frost-circles">반지름 2|β|인 원에 꼭짓점 하나가 맨 아래로 오게 정다각형을 넣으면 꼭짓점의 높이가 π 준위 α + xβ이다. 원의 중심 높이(점선)가 α이다. x 값: C3 2, −1, −1 / C4 2, 0, 0, −2 / C5 2, 0.618(2), −1.618(2) / C6 2, 1(2), −1(2), −2 / C7 2, 1.247(2), −0.445(2), −1.802(2) / C8 2, 1.414(2), 0(2), −1.414(2), −2. β &lt; 0이므로 아래 꼭짓점일수록 에너지가 낮다. 맨 아래 하나를 빼면 준위는 두 개씩 축퇴한다.</desc>
