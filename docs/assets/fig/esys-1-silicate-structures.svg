<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-esys-1-silicate-structures d-esys-1-silicate-structures">
  <title id="t-esys-1-silicate-structures">그림 지구시스템과학 1-6 Si–O 사면체의 연결 방식과 규산염 광물</title>
  <desc id="d-esys-1-silicate-structures">Si–O 사면체(위에서 본 삼각형, 가운데 점은 규소)가 독립형(감람석), 단사슬(휘석), 복사슬(각섬석), 판상(운모), 망상(장석·석영) 구조로 연결되는 모습을 위에서 본 모식도이다. 오른쪽으로 갈수록 사면체끼리 공유하는 산소가 많아지고, 결정이 생기는 온도가 낮아지며 색이 밝고 밀도가 작아진다.</desc>
