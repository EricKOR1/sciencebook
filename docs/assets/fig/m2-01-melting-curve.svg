    .m2-01-melting-curve-s{font-size:13px;fill:var(--fig-muted)}
    .m2-01-melting-curve-ln{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
    .m2-01-melting-curve-lm{fill:none;stroke:var(--fig-muted);stroke-width:1.2}
