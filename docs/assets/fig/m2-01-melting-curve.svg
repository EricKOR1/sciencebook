<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-m2-01-melting-curve d-m2-01-melting-curve">
  <title id="t-m2-01-melting-curve">그림 중2-1-3 팔미트산을 가열할 때의 온도 변화</title>
  <desc id="d-m2-01-melting-curve">팔미트산을 가열하면 약 63 °C에서 온도가 한동안 일정하게 유지되며 녹는다(실선, 본문의 측정값). 양을 2배로 늘리면 녹는 데 걸리는 시간(평평한 구간)은 길어지지만 그 온도는 약 63 °C로 같다(점선, 모식).</desc>
