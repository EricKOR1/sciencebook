<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-uchem-1-electrolytes d-uchem-1-electrolytes">
  <title id="t-uchem-1-electrolytes">그림 일반화학 1-6 강전해질·약전해질·비전해질의 입자 모형</title>
  <desc id="d-uchem-1-electrolytes">같은 농도의 세 수용액에 전극을 넣고 전구를 연결했다. NaCl은 거의 전부 Na⁺와 Cl⁻로 해리해 전구가 밝고, 아세트산은 대부분 분자로 있고 일부만 이온화해 전구가 흐리며, 설탕은 분자 그대로 녹아 이온이 없어 전구가 켜지지 않는다. 물 분자는 생략한 모식도이다.</desc>
