<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="t-uearth-1-layers d-uearth-1-layers">
  <title id="t-uearth-1-layers">그림 일반지구과학 1-1 화학 조성에 따른 구분과 역학적 성질에 따른 구분</title>
  <desc id="d-uearth-1-layers">같은 지구 내부를 조성(지각·맨틀·핵)과 강도(암석권·연약권·중간권·외핵·내핵)로 나누어 나란히 놓았다. 암석권의 아랫부분은 맨틀 암석이므로 모호면과 암석권 바닥은 일치하지 않는다.</desc>
  <style>
    .uearth-1-layers-h{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .uearth-1-layers-l{font-size:14px;fill:var(--fig-ink)}
    .uearth-1-layers-s{font-size:13px;fill:var(--fig-muted)}
    .uearth-1-layers-n{font-size:13px;fill:var(--fig-ink)}
    .uearth-1-layers-g{stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4;fill:none}
  </style>
  <text x="170" y="34" text-anchor="middle" class="uearth-1-layers-h">화학 조성에 따른 구분</text>
  <text x="550" y="34" text-anchor="middle" class="uearth-1-layers-h">역학적 성질에 따른 구분</text>

  <!-- 왼쪽: 화학 조성 -->
  <rect x="70" y="95" width="110" height="234.5" style="fill:var(--fig-soft-green);stroke:none"/>
  <rect x="180" y="67" width="90" height="262.5" style="fill:var(--fig-soft-green);stroke:none"/>
  <rect x="70" y="60" width="110" height="35" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <rect x="180" y="60" width="90" height="7" style="fill:var(--fig-amber);stroke:var(--fig-amber);stroke-width:1"/>
  <!-- 암석권에 속하는 최상부 맨틀 -->
  <rect x="70" y="95" width="200" height="65" style="fill:var(--fig-soft-blue);opacity:0.75;stroke:none"/>
  <line x1="70" y1="160" x2="270" y2="160" style="stroke:var(--fig-blue);stroke-width:1.5;stroke-dasharray:6 4"/>
  <rect x="70" y="329.5" width="200" height="110.5" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5"/>
  <rect x="70" y="60" width="200" height="380" style="fill:none;stroke:var(--fig-line);stroke-width:1.5"/>
  <line x1="70" y1="329.5" x2="270" y2="329.5" style="stroke:var(--fig-red);stroke-width:1.5"/>
  <text x="125" y="82" text-anchor="middle" class="uearth-1-layers-l">대륙 지각</text>
  <text x="225" y="53" text-anchor="middle" class="uearth-1-layers-s">해양 지각(약 7 km)</text>
  <text x="170" y="124" text-anchor="middle" class="uearth-1-layers-n">최상부 맨틀</text>
  <text x="170" y="143" text-anchor="middle" class="uearth-1-layers-s">(암석권에 속함)</text>
  <text x="170" y="252" text-anchor="middle" class="uearth-1-layers-l" style="font-weight:600">맨틀</text>
  <text x="170" y="272" text-anchor="middle" class="uearth-1-layers-s">감람암(감람석·휘석)</text>
  <text x="170" y="378" text-anchor="middle" class="uearth-1-layers-l" style="font-weight:600">핵</text>
  <text x="170" y="398" text-anchor="middle" class="uearth-1-layers-s">철–니켈 합금</text>
  <text x="170" y="416" text-anchor="middle" class="uearth-1-layers-s">(조성으로는 하나의 층)</text>

  <!-- 오른쪽: 역학적 성질 -->
  <rect x="450" y="60" width="200" height="100" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
  <line x1="450" y1="95" x2="650" y2="95" style="stroke:var(--fig-blue);stroke-width:1;stroke-dasharray:3 3"/>
  <text x="644" y="90" text-anchor="end" class="uearth-1-layers-s">모호면</text>
  <rect x="450" y="160" width="200" height="41.7" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <rect x="450" y="201.7" width="200" height="127.8" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.5"/>
  <rect x="450" y="329.5" width="200" height="71.7" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5"/>
  <rect x="450" y="401.2" width="200" height="38.8" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5"/>
  <text x="550" y="122" text-anchor="middle" class="uearth-1-layers-l" style="font-weight:600">암석권 = 판</text>
  <text x="550" y="142" text-anchor="middle" class="uearth-1-layers-s">지각 + 최상부 맨틀, 단단함</text>
  <text x="550" y="178" text-anchor="middle" class="uearth-1-layers-l" style="font-weight:600">연약권</text>
  <text x="550" y="195" text-anchor="middle" class="uearth-1-layers-s">고체지만 약해 천천히 흐름</text>
  <text x="550" y="258" text-anchor="middle" class="uearth-1-layers-l" style="font-weight:600">중간권</text>
  <text x="550" y="278" text-anchor="middle" class="uearth-1-layers-s">다시 단단해짐, 긴 시간에 대류</text>
  <text x="550" y="362" text-anchor="middle" class="uearth-1-layers-l" style="font-weight:600">외핵 · 액체</text>
  <text x="550" y="381" text-anchor="middle" class="uearth-1-layers-s">대류하며 자기장 생성</text>
  <text x="550" y="425" text-anchor="middle" class="uearth-1-layers-l" style="font-weight:600">내핵 · 고체</text>

  <!-- 가운데 깊이 눈금과 안내선 -->
  <line x1="270" y1="95" x2="450" y2="95" class="uearth-1-layers-g"/>
  <line x1="270" y1="160" x2="450" y2="160" class="uearth-1-layers-g"/>
  <line x1="270" y1="201.7" x2="450" y2="201.7" class="uearth-1-layers-g"/>
  <line x1="270" y1="329.5" x2="450" y2="329.5" class="uearth-1-layers-g"/>
  <line x1="270" y1="401.2" x2="450" y2="401.2" class="uearth-1-layers-g"/>
  <text x="360" y="64" text-anchor="middle" class="uearth-1-layers-s">0 km</text>
  <text x="360" y="90" text-anchor="middle" class="uearth-1-layers-n">35 km</text>
  <text x="360" y="155" text-anchor="middle" class="uearth-1-layers-n">약 100 km</text>
  <text x="360" y="196.7" text-anchor="middle" class="uearth-1-layers-n">약 350 km</text>
  <text x="360" y="324.5" text-anchor="middle" class="uearth-1-layers-n">2891 km</text>
  <text x="360" y="396.2" text-anchor="middle" class="uearth-1-layers-n">5150 km</text>
  <text x="360" y="444" text-anchor="middle" class="uearth-1-layers-n">6371 km</text>
  <text x="360" y="120" text-anchor="middle" class="uearth-1-layers-s">경계가</text>
  <text x="360" y="137" text-anchor="middle" class="uearth-1-layers-s">일치하지 않는다</text>

  <text x="360" y="472" text-anchor="middle" class="uearth-1-layers-s">깊이 눈금: 0–100 km는 크게, 100–700 km는 덜, 700 km 아래는 많이 줄여 그린 모식도</text>
  <text x="360" y="492" text-anchor="middle" class="uearth-1-layers-s">판과 연약권을 나누는 것은 조성이 아니라 온도에 따른 강도 차이이다</text>
</svg>
