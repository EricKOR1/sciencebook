<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="t-umath-2-volume-elements d-umath-2-volume-elements">
  <title id="t-umath-2-volume-elements">그림 수학 도구 2-8 세 좌표계의 넓이·부피 요소</title>
  <desc id="d-umath-2-volume-elements">(가) 극좌표: r과 θ를 조금씩 바꾸면 변의 길이가 dr과 r dθ인 거의 직사각형 조각이 생긴다(dA = r dr dθ). (나) 원통 좌표: 변이 dr, r dφ, dz인 휘어진 상자(dV = r dr dφ dz). (다) 구면 좌표: θ는 z축에서 잰 천정각, φ는 xy 평면의 방위각이다. 조각의 세 변은 dr, r dθ, r sinθ dφ이고, φ 방향 변은 반지름 r sinθ인 위도 원(점선) 위에 있다(dV = r² sinθ dr dθ dφ). 조각은 크게 과장한 모식도이다.</desc>
