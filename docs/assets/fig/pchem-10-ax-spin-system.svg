<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-pchem-10-ax-spin-system d-pchem-10-ax-spin-system">
  <title id="t-pchem-10-ax-spin-system">그림 물리화학 10-14 AX 스핀계의 준위와 스펙트럼</title>
  <desc id="d-pchem-10-ax-spin-system">왼쪽: 두 스핀 ½ 핵 A, X의 네 준위(A의 스핀을 앞에 쓴다, ν_A &gt; ν_X). 짝지음이 없으면(가운데 열의 왼쪽) A 전이 두 개의 에너지가 같고 X 전이 두 개도 같다. 짝지음 에너지 hJm_Am_X를 넣으면 αα와 ββ는 J/4만큼 올라가고 αβ와 βα는 J/4만큼 내려가, A 전이(αα→βα, αβ→ββ)는 ν_A ∓ J/2, X 전이(αα→αβ, βα→ββ)는 ν_X ∓ J/2가 된다. 오른쪽: 그래서 스펙트럼은 ν_A를 중심으로 간격 J인 이중선과 ν_X를 중심으로 간격 J인 이중선이며, 두 중심 사이 Δν = ν_A − ν_X는 J보다 훨씬 크다(모식도, J를 과장해 그렸다).</desc>
