<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="t-ochem-4-cation-shifts d-ochem-4-cation-shifts">
  <title id="t-ochem-4-cation-shifts">그림 유기화학 4-10 탄소 양이온의 1,2-수소화 이온 이동과 1,2-메틸 이동</title>
  <desc id="d-ochem-4-cation-shifts">위: 3-메틸뷰탄-2-일 양이온(2°, C2에 ⊕)에서 C3–H 결합의 전자쌍이 C2⁺로 옮겨 간다(굽은 화살표 1개). 전이 상태에서는 H가 C2와 C3 사이에 다리처럼 걸치고(점선), 생성물은 2-메틸뷰탄-2-일 양이온(3°)이다. 아래: 3,3-다이메틸뷰탄-2-일 양이온(2°)에서 C3–CH₃ 결합의 전자쌍이 C2⁺로 옮겨 가 2,3-다이메틸뷰탄-2-일 양이온(3°)이 된다. 두 경우 모두 양전하는 원자단이 떠난 탄소로 넘어가고 더 안정한 3차 양이온이 된다.</desc>
