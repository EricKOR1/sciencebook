<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="t-ochem-1-q-acetylide-formation d-ochem-1-q-acetylide-formation">
  <title id="t-ochem-1-q-acetylide-formation">그림 유기화학 1-19 예제 16 에타인과 아마이드 이온의 양성자 전달</title>
  <desc id="d-ochem-1-q-acetylide-formation">NH₂⁻의 N 전자쌍이 에타인의 H 쪽으로, C–H 결합의 전자쌍이 C로 간다(화살표 2개). 생성물은 아세틸라이드 이온 HC≡C⁻(전자쌍이 s 성격 50 %인 sp 오비탈에 있다, 작은 엽)과 NH₃이다. 왼쪽의 산 에타인은 pKa 25, 오른쪽의 산 암모니아는 pKa 36이므로 K = 10³⁶⁻²⁵ = 10¹¹로 평형은 오른쪽으로 크게 기운다.</desc>
