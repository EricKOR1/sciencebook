<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-ochem-3-amine-inversion d-ochem-3-amine-inversion">
  <title id="t-ochem-3-amine-inversion">그림 유기화학 3-14 아민의 피라미드 반전</title>
  <desc id="d-ochem-3-amine-inversion">에틸메틸프로필아민의 두 피라미드형 거울상(N 위에 비공유 전자쌍)은 평면 sp² 전이 상태(N에 p 오비탈)를 거쳐 서로 바뀐다. 아래 에너지 도표: 높이가 같은 두 바닥 사이의 장벽 ΔG‡ ≈ 25 kJ/mol, 25 ℃에서 k ≈ 3×10⁸ s⁻¹. 오른쪽: 네 원자단이 다른 4차 암모늄 이온 (S)-N-벤질-N-에틸-N-메틸프로판-1-아미늄은 전자쌍이 없어 반전할 수 없다.</desc>
