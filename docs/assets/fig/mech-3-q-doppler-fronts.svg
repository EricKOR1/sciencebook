<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-mech-3-q-doppler-fronts d-mech-3-q-doppler-fronts">
  <title id="t-mech-3-q-doppler-fronts">그림 역학과 에너지 3-9 문제 5 해설의 움직이는 음원과 파면</title>
  <desc id="d-mech-3-q-doppler-fronts">500 Hz 음원이 34 m/s(음속의 0.1배)로 오른쪽 관찰자를 향해 움직일 때, 한 주기 간격으로 낸 마루(원)를 계산하여 그렸다. 원의 중심은 마루를 낸 순간 음원의 위치이다. 앞쪽 파장은 0.612 m로 짧아지고 뒤쪽 파장은 0.748 m로 길어진다.</desc>
  <style>.mech-3-q-doppler-fronts-t{font-size:14px;fill:var(--fig-ink)} .mech-3-q-doppler-fronts-s{font-size:13px;fill:var(--fig-muted)} .mech-3-q-doppler-fronts-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}</style>
  <circle cx="326.0" cy="200.0" r="40.0" style="fill:none;stroke:var(--fig-blue);stroke-width:1.8"/>
  <circle cx="326.0" cy="200.0" r="2.2" style="fill:var(--fig-blue);stroke:none;stroke-width:2"/>
  <circle cx="322.0" cy="200.0" r="80.0" style="fill:none;stroke:var(--fig-blue);stroke-width:1.8"/>
  <circle cx="322.0" cy="200.0" r="2.2" style="fill:var(--fig-blue);stroke:none;stroke-width:2"/>
  <circle cx="318.0" cy="200.0" r="120.0" style="fill:none;stroke:var(--fig-blue);stroke-width:1.8"/>
  <circle cx="318.0" cy="200.0" r="2.2" style="fill:var(--fig-blue);stroke:none;stroke-width:2"/>
  <circle cx="314.0" cy="200.0" r="160.0" style="fill:none;stroke:var(--fig-blue);stroke-width:1.8"/>
  <circle cx="314.0" cy="200.0" r="2.2" style="fill:var(--fig-blue);stroke:none;stroke-width:2"/>
  <line x1="120.0" y1="200.0" x2="650.0" y2="200.0" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 3;fill:none"/>
  <circle cx="330.0" cy="200.0" r="5.0" style="fill:var(--fig-red);stroke:none;stroke-width:2"/>
  <text x="326.0" y="226.0" text-anchor="middle" class="mech-3-q-doppler-fronts-s" style="fill:var(--fig-ink)">음원</text>
  <line x1="280.0" y1="22.0" x2="369.0" y2="22.0" style="stroke:var(--fig-red);stroke-width:2.5;fill:none"/>
  <path d="M380.0 22.0 L369.0 27.5 L369.0 16.5 Z" style="fill:var(--fig-red)"/>
  <text x="390.0" y="27.0" class="mech-3-q-doppler-fronts-t">음원의 운동 방향 (34 m/s)</text>
  <line x1="366.0" y1="192.0" x2="402.0" y2="192.0" style="stroke:var(--fig-red);stroke-width:1.5;fill:none"/>
  <path d="M402.0 192.0 L394.0 196.0 L394.0 188.0 Z" style="fill:var(--fig-red)"/>
  <path d="M366.0 192.0 L374.0 188.0 L374.0 196.0 Z" style="fill:var(--fig-red)"/>
  <line x1="384.0" y1="192.0" x2="505.0" y2="166.0" style="stroke:var(--fig-red);stroke-width:1;fill:none"/>
  <text x="508.0" y="166.0" class="mech-3-q-doppler-fronts-t" style="fill:var(--fig-red)">앞쪽 파장 λ′ = 0.612 m</text>
  <line x1="242.0" y1="208.0" x2="286.0" y2="208.0" style="stroke:var(--fig-blue);stroke-width:1.5;fill:none"/>
  <path d="M286.0 208.0 L278.0 212.0 L278.0 204.0 Z" style="fill:var(--fig-blue)"/>
  <path d="M242.0 208.0 L250.0 204.0 L250.0 212.0 Z" style="fill:var(--fig-blue)"/>
  <line x1="264.0" y1="208.0" x2="152.0" y2="240.0" style="stroke:var(--fig-blue);stroke-width:1;fill:none"/>
  <text x="148.0" y="256.0" text-anchor="middle" class="mech-3-q-doppler-fronts-t" style="fill:var(--fig-blue)">뒤쪽 파장 0.748 m</text>
  <circle cx="680.0" cy="200.0" r="9.0" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2"/>
  <text x="680.0" y="182.0" text-anchor="middle" class="mech-3-q-doppler-fronts-t">관찰자</text>
  <text x="360.0" y="370.0" text-anchor="middle" class="mech-3-q-doppler-fronts-s">파장 0.68 m를 40 px로 그린 축척(음원의 이동 거리도 같은 축척)</text>
</svg>
