<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-ubio-3-tca d-ubio-3-tca">
  <title id="t-ubio-3-tca">그림 일반생명과학 3-7 시트르산 회로의 중간 물질과 산물</title>
  <desc id="d-ubio-3-tca">아세틸 CoA(2C)가 옥살아세트산(4C)과 합쳐 시트르산(6C)이 되고, 아이소시트르산(6C) → α-케토글루타르산(5C) → 숙시닐 CoA(4C)로 가며 CO₂가 두 번 나가고 NADH가 2개 생긴다. 숙시닐 CoA → 숙신산에서 GTP(ATP), 숙신산 → 퓨마르산에서 FADH₂, 퓨마르산 → 말산에서 물 첨가, 말산 → 옥살아세트산에서 NADH가 생겨 처음 물질이 재생된다. 1회전 산물: CO₂ 2, NADH 3, FADH₂ 1, ATP(GTP) 1. 모식도이다.</desc>
