<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-m2-02-frost-wedging d-m2-02-frost-wedging">
  <title id="t-m2-02-frost-wedging">그림 중2-2-4 물이 얼고 녹기를 되풀이하며 바위가 쪼개지는 과정</title>
  <desc id="d-m2-02-frost-wedging">바위 틈에 물이 스며든 뒤 얼면 부피가 늘어나 틈을 벌린다. 녹으면 넓어진 틈에 물이 더 깊이 들어가고, 얼고 녹기를 되풀이하면 결국 바위가 쪼개진다. 틈의 크기는 과장한 모식도이다.</desc>
  <style>
    .m2-02-frost-wedging-b{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .m2-02-frost-wedging-t{font-size:14px;fill:var(--fig-ink)}
    .m2-02-frost-wedging-tb{font-size:14px;font-weight:700;fill:var(--fig-ink)}
    .m2-02-frost-wedging-s{font-size:13px;fill:var(--fig-muted)}
    .m2-02-frost-wedging-ln{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
    .m2-02-frost-wedging-lm{fill:none;stroke:var(--fig-muted);stroke-width:1.2}
  </style>
  <path d="M22 230 L22 110 Q30 100 44 100 L85.0 100 L92.0 160 L99.0 100 L140 100 Q154 100 162 110 L162 230 Z" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5;stroke-linejoin:round"/>
