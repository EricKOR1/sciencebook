  <rect x="84" y="256" width="18" height="12" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.2"/>
  <text x="108.0" y="267.0" class="m2-02-frost-wedging-s">얼음 (물보다 부피가 약 9% 크다)</text>
  <text x="700.0" y="267.0" text-anchor="end" class="m2-02-frost-wedging-s">틈의 크기는 과장한 모식도</text>
  <text x="360.0" y="290.0" text-anchor="middle" class="m2-02-frost-wedging-s">겨울철 산에서 바위 조각이 떨어져 쌓이는 까닭이다</text>
