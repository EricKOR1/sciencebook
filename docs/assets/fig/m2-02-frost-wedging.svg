  <text x="92.0" y="60.0" text-anchor="middle" class="m2-02-frost-wedging-tb">물이 스며든다</text>
  <path d="M200 230 L200 110 Q208 100 222 100 L259.0 100 L270.0 162 L281.0 100 L318 100 Q332 100 340 110 L340 230 Z" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5;stroke-linejoin:round"/>
  <path d="M261.75 115.5 L270.0 162 L278.25 115.5 Z" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.5"/>
  <line x1="266.0" y1="127.9" x2="249.0" y2="127.9" style="stroke:var(--fig-red);stroke-width:2.2"/>
  <path d="M241.0 127.9 L249.0 123.5 L249.0 132.3 Z" style="fill:var(--fig-red)"/>
  <line x1="274.0" y1="127.9" x2="291.0" y2="127.9" style="stroke:var(--fig-red);stroke-width:2.2"/>
  <path d="M299.0 127.9 L291.0 132.3 L291.0 123.5 Z" style="fill:var(--fig-red)"/>
  <text x="270.0" y="40.0" text-anchor="middle" class="m2-02-frost-wedging-tb">② 물이 얼면 부피가</text>
  <text x="270.0" y="60.0" text-anchor="middle" class="m2-02-frost-wedging-tb">늘어 틈을 벌린다</text>
  <path d="M378 230 L378 110 Q386 100 400 100 L435.0 100 L448.0 195 L461.0 100 L496 100 Q510 100 518 110 L518 230 Z" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5;stroke-linejoin:round"/>
