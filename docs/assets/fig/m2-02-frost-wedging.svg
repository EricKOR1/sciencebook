  <text x="626.0" y="40.0" text-anchor="middle" class="m2-02-frost-wedging-tb">④ 되풀이하면</text>
  <text x="626.0" y="60.0" text-anchor="middle" class="m2-02-frost-wedging-tb">바위가 쪼개진다</text>
