  <path d="M548.0 165.0 L539.0 169.9 L539.0 160.1 Z" style="fill:var(--fig-muted)"/>
  <rect x="24" y="256" width="18" height="12" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.2"/>
