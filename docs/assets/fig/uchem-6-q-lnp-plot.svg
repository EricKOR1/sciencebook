  <line x1="90.0" y1="110.5" x2="690.0" y2="110.5" class="uchem-6-q-lnp-plot-gr"/>
  <text x="82.0" y="115.5" text-anchor="end" class="uchem-6-q-lnp-plot-s"><tspan dy="0">6</tspan></text>
  <line x1="90.0" y1="34.0" x2="690.0" y2="34.0" class="uchem-6-q-lnp-plot-gr"/>
  <text x="82.0" y="39.0" text-anchor="end" class="uchem-6-q-lnp-plot-s"><tspan dy="0">7</tspan></text>
  <rect x="90.0" y="34.0" width="600.0" height="306.0" class="uchem-6-q-lnp-plot-ax"/>
  <line x1="659.3" y1="327.0" x2="486.4" y2="223.2" class="uchem-6-q-lnp-plot-bl"/>
  <line x1="486.4" y1="223.2" x2="218.0" y2="62.1" class="uchem-6-q-lnp-plot-dash"/>
  <line x1="90.0" y1="62.1" x2="218.0" y2="62.1" class="uchem-6-q-lnp-plot-gr"/>
  <text x="96.0" y="82.1" text-anchor="start" class="uchem-6-q-lnp-plot-s"><tspan dy="0">ln 760 = 6.63</tspan></text>
  <circle cx="659.3" cy="327.0" r="5.5" class="uchem-6-q-lnp-plot-sr"/>
  <text x="639.3" y="331.0" text-anchor="end" class="uchem-6-q-lnp-plot-t"><tspan dy="0">25.0 °C, 23.8 mmHg</tspan></text>
  <circle cx="486.4" cy="223.2" r="5.5" class="uchem-6-q-lnp-plot-sr"/>
  <text x="498.4" y="213.2" text-anchor="start" class="uchem-6-q-lnp-plot-t"><tspan dy="0">50.0 °C, 92.5 mmHg</tspan></text>
  <circle cx="218.0" cy="62.1" r="5.0" class="uchem-6-q-lnp-plot-sb"/>
  <text x="268.0" y="88.1" text-anchor="start" class="uchem-6-q-lnp-plot-t"><tspan dy="0">예측 371.5 K (약 98 °C)</tspan></text>
  <circle cx="209.9" cy="62.1" r="5" class="uchem-6-q-lnp-plot-box"/>
  <text x="205.9" y="50.1" text-anchor="start" class="uchem-6-q-lnp-plot-t"><tspan dy="0">실제 373.15 K (1 atm 끓는점)</tspan></text>
  <text x="456.7" y="141.1" text-anchor="start" class="uchem-6-q-lnp-plot-t"><tspan dy="0">기울기 = −ΔH</tspan><tspan dy="4" style="font-size:0.72em">기화</tspan><tspan dy="-4">/R</tspan></text>
  <text x="690.0" y="382.0" text-anchor="end" class="uchem-6-q-lnp-plot-s"><tspan dy="0">1/T (10</tspan><tspan dy="-6" style="font-size:0.72em">−3</tspan><tspan dy="6"> K</tspan><tspan dy="-6" style="font-size:0.72em">−1</tspan><tspan dy="6">)</tspan></text>
  <text x="20.0" y="16.0" text-anchor="start" class="uchem-6-q-lnp-plot-s"><tspan dy="0">ln(P/mmHg)</tspan></text>
