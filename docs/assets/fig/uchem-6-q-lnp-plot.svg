<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uchem-6-q-lnp-plot d-uchem-6-q-lnp-plot">
  <title id="t-uchem-6-q-lnp-plot">그림 일반화학 6-13 문제 12 해설 — ln P 대 1/T 직선의 연장</title>
  <desc id="d-uchem-6-q-lnp-plot">25.0 °C와 50.0 °C의 두 측정점을 잇는 직선(기울기 −ΔH기화/R = −5.23 × 10³ K)을 ln 760 = 6.63까지 연장하면 1/T = 2.692 × 10⁻³ K⁻¹(371.5 K, 약 98 °C)에서 만난다. 실제 기준 끓는점(373.15 K, 1/T = 2.680 × 10⁻³ K⁻¹)은 예측점보다 조금 왼쪽에 있다.</desc>
  <style>
    .uchem-6-q-lnp-plot-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-6-q-lnp-plot-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-6-q-lnp-plot-b{font-size:15px;fill:var(--fig-ink);font-weight:bold}
    .uchem-6-q-lnp-plot-ax{stroke:var(--fig-ink);stroke-width:1.3;fill:none}
    .uchem-6-q-lnp-plot-gr{stroke:var(--fig-line);stroke-width:0.7;fill:none;stroke-dasharray:3 3}
    .uchem-6-q-lnp-plot-ln{stroke:var(--fig-ink);stroke-width:2;fill:none}
    .uchem-6-q-lnp-plot-lv{stroke:var(--fig-ink);stroke-width:2.2;fill:none}
    .uchem-6-q-lnp-plot-bl{stroke:var(--fig-blue);stroke-width:2.4;fill:none}
    .uchem-6-q-lnp-plot-rd{stroke:var(--fig-red);stroke-width:2.4;fill:none}
    .uchem-6-q-lnp-plot-gn{stroke:var(--fig-green);stroke-width:2.4;fill:none}
    .uchem-6-q-lnp-plot-am{stroke:var(--fig-amber);stroke-width:2.4;fill:none}
    .uchem-6-q-lnp-plot-dash{stroke:var(--fig-muted);stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    .uchem-6-q-lnp-plot-fink{fill:var(--fig-ink)} .uchem-6-q-lnp-plot-fbl{fill:var(--fig-blue)} .uchem-6-q-lnp-plot-frd{fill:var(--fig-red)}
    .uchem-6-q-lnp-plot-fgn{fill:var(--fig-green)} .uchem-6-q-lnp-plot-fam{fill:var(--fig-amber)} .uchem-6-q-lnp-plot-fmu{fill:var(--fig-muted)}
    .uchem-6-q-lnp-plot-box{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.4}
    .uchem-6-q-lnp-plot-sb{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6}
    .uchem-6-q-lnp-plot-sr{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.6}
    .uchem-6-q-lnp-plot-sg{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.6}
    .uchem-6-q-lnp-plot-sa{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.6}
    .uchem-6-q-lnp-plot-sv{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.6}
    .uchem-6-q-lnp-plot-st{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.6}
  </style>
  <line x1="90.0" y1="30.0" x2="90.0" y2="340.0" class="uchem-6-q-lnp-plot-gr"/>
  <text x="90.0" y="360.0" text-anchor="middle" class="uchem-6-q-lnp-plot-s"><tspan dy="0">2.6</tspan></text>
  <line x1="165.0" y1="30.0" x2="165.0" y2="340.0" class="uchem-6-q-lnp-plot-gr"/>
  <text x="165.0" y="360.0" text-anchor="middle" class="uchem-6-q-lnp-plot-s"><tspan dy="0">2.7</tspan></text>
