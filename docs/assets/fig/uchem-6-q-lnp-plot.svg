  <text x="315.0" y="360.0" text-anchor="middle" class="uchem-6-q-lnp-plot-s"><tspan dy="0">2.9</tspan></text>
  <line x1="390.0" y1="30.0" x2="390.0" y2="340.0" class="uchem-6-q-lnp-plot-gr"/>
  <text x="390.0" y="360.0" text-anchor="middle" class="uchem-6-q-lnp-plot-s"><tspan dy="0">3.0</tspan></text>
  <line x1="465.0" y1="30.0" x2="465.0" y2="340.0" class="uchem-6-q-lnp-plot-gr"/>
  <text x="465.0" y="360.0" text-anchor="middle" class="uchem-6-q-lnp-plot-s"><tspan dy="0">3.1</tspan></text>
  <line x1="540.0" y1="30.0" x2="540.0" y2="340.0" class="uchem-6-q-lnp-plot-gr"/>
  <text x="540.0" y="360.0" text-anchor="middle" class="uchem-6-q-lnp-plot-s"><tspan dy="0">3.2</tspan></text>
  <line x1="615.0" y1="30.0" x2="615.0" y2="340.0" class="uchem-6-q-lnp-plot-gr"/>
  <text x="615.0" y="360.0" text-anchor="middle" class="uchem-6-q-lnp-plot-s"><tspan dy="0">3.3</tspan></text>
  <line x1="690.0" y1="30.0" x2="690.0" y2="340.0" class="uchem-6-q-lnp-plot-gr"/>
  <text x="690.0" y="360.0" text-anchor="middle" class="uchem-6-q-lnp-plot-s"><tspan dy="0">3.4</tspan></text>
  <line x1="90.0" y1="340.0" x2="690.0" y2="340.0" class="uchem-6-q-lnp-plot-gr"/>
  <text x="82.0" y="345.0" text-anchor="end" class="uchem-6-q-lnp-plot-s"><tspan dy="0">3</tspan></text>
  <line x1="90.0" y1="262.5" x2="690.0" y2="262.5" class="uchem-6-q-lnp-plot-gr"/>
  <text x="82.0" y="267.5" text-anchor="end" class="uchem-6-q-lnp-plot-s"><tspan dy="0">4</tspan></text>
  <line x1="90.0" y1="185.0" x2="690.0" y2="185.0" class="uchem-6-q-lnp-plot-gr"/>
  <text x="82.0" y="190.0" text-anchor="end" class="uchem-6-q-lnp-plot-s"><tspan dy="0">5</tspan></text>
  <line x1="90.0" y1="107.5" x2="690.0" y2="107.5" class="uchem-6-q-lnp-plot-gr"/>
  <text x="82.0" y="112.5" text-anchor="end" class="uchem-6-q-lnp-plot-s"><tspan dy="0">6</tspan></text>
  <line x1="90.0" y1="30.0" x2="690.0" y2="30.0" class="uchem-6-q-lnp-plot-gr"/>
  <text x="82.0" y="35.0" text-anchor="end" class="uchem-6-q-lnp-plot-s"><tspan dy="0">7</tspan></text>
  <rect x="90.0" y="30.0" width="600.0" height="310.0" class="uchem-6-q-lnp-plot-ax"/>
  <line x1="655.5" y1="326.8" x2="460.9" y2="221.6" class="uchem-6-q-lnp-plot-bl"/>
  <line x1="460.9" y1="221.6" x2="159.0" y2="58.4" class="uchem-6-q-lnp-plot-dash"/>
  <line x1="90.0" y1="58.4" x2="159.0" y2="58.4" class="uchem-6-q-lnp-plot-gr"/>
  <text x="96.0" y="52.4" text-anchor="start" class="uchem-6-q-lnp-plot-s"><tspan dy="0">ln 760 = 6.63</tspan></text>
  <circle cx="655.5" cy="326.8" r="5.5" class="uchem-6-q-lnp-plot-sr"/>
  <text x="665.5" y="346.8" text-anchor="start" class="uchem-6-q-lnp-plot-t"><tspan dy="0">25.0 °C, 23.8 mmHg</tspan></text>
  <circle cx="460.9" cy="221.6" r="5.5" class="uchem-6-q-lnp-plot-sr"/>
  <text x="470.9" y="241.6" text-anchor="start" class="uchem-6-q-lnp-plot-t"><tspan dy="0">50.0 °C, 92.5 mmHg</tspan></text>
  <circle cx="159.0" cy="58.4" r="5.0" class="uchem-6-q-lnp-plot-sb"/>
  <text x="169.0" y="80.4" text-anchor="start" class="uchem-6-q-lnp-plot-t"><tspan dy="0">예측 371.5 K (약 98 °C)</tspan></text>
  <circle cx="149.9" cy="58.4" r="5" class="uchem-6-q-lnp-plot-box"/>
  <text x="145.9" y="46.4" text-anchor="start" class="uchem-6-q-lnp-plot-t"><tspan dy="0">실제 373.15 K</tspan></text>
  <text x="427.5" y="138.5" text-anchor="start" class="uchem-6-q-lnp-plot-t"><tspan dy="0">기울기 = −ΔH</tspan><tspan dy="4" style="font-size:0.72em">기화</tspan><tspan dy="-4">/R</tspan></text>
  <text x="690.0" y="382.0" text-anchor="end" class="uchem-6-q-lnp-plot-s"><tspan dy="0">1/T (10</tspan><tspan dy="-6" style="font-size:0.72em">−3</tspan><tspan dy="6"> K</tspan><tspan dy="-6" style="font-size:0.72em">−1</tspan><tspan dy="6">)</tspan></text>
  <text x="20.0" y="22.0" text-anchor="start" class="uchem-6-q-lnp-plot-s"><tspan dy="0">ln(P/mmHg)</tspan></text>
