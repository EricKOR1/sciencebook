  <text x="423.3" y="360.0" text-anchor="middle" class="uchem-6-q-lnp-plot-s"><tspan dy="0">3.0</tspan></text>
  <line x1="490.0" y1="34.0" x2="490.0" y2="340.0" class="uchem-6-q-lnp-plot-gr"/>
  <text x="490.0" y="360.0" text-anchor="middle" class="uchem-6-q-lnp-plot-s"><tspan dy="0">3.1</tspan></text>
  <line x1="556.7" y1="34.0" x2="556.7" y2="340.0" class="uchem-6-q-lnp-plot-gr"/>
  <text x="556.7" y="360.0" text-anchor="middle" class="uchem-6-q-lnp-plot-s"><tspan dy="0">3.2</tspan></text>
  <line x1="623.3" y1="34.0" x2="623.3" y2="340.0" class="uchem-6-q-lnp-plot-gr"/>
  <text x="623.3" y="360.0" text-anchor="middle" class="uchem-6-q-lnp-plot-s"><tspan dy="0">3.3</tspan></text>
  <line x1="690.0" y1="34.0" x2="690.0" y2="340.0" class="uchem-6-q-lnp-plot-gr"/>
  <text x="690.0" y="360.0" text-anchor="middle" class="uchem-6-q-lnp-plot-s"><tspan dy="0">3.4</tspan></text>
  <line x1="90.0" y1="340.0" x2="690.0" y2="340.0" class="uchem-6-q-lnp-plot-gr"/>
  <text x="82.0" y="345.0" text-anchor="end" class="uchem-6-q-lnp-plot-s"><tspan dy="0">3</tspan></text>
  <line x1="90.0" y1="263.5" x2="690.0" y2="263.5" class="uchem-6-q-lnp-plot-gr"/>
