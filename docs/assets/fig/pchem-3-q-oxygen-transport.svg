<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 334" role="img" aria-labelledby="t-pchem-3-q-oxygen-transport d-pchem-3-q-oxygen-transport">
  <title id="t-pchem-3-q-oxygen-transport">그림 물리화학 3-12 문제 10의 산소 이동 경로</title>
  <desc id="d-pchem-3-q-oxygen-transport">왼쪽 폐포(산소 분압 약 100 mmHg)에서 모세 혈관의 혈액(적혈구)을 거쳐 오른쪽 조직 세포(산소 분압 약 40 mmHg)로 산소가 이동하는 경로의 모식도이다. 조직 세포의 미토콘드리아는 산소를 소비한다.</desc>
  <style>.pchem-3-q-oxygen-transport-t{font-size:14px;fill:var(--fig-ink)} .pchem-3-q-oxygen-transport-s{font-size:13px;fill:var(--fig-muted)} .pchem-3-q-oxygen-transport-b{font-size:15px;font-weight:600;fill:var(--fig-ink)} .pchem-3-q-oxygen-transport-i{font-size:14px;font-style:italic;fill:var(--fig-ink)} </style>
  <circle cx="130.0" cy="160.0" r="88.0" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:2.5"/>
  <text x="130.0" y="146.0" text-anchor="middle" class="pchem-3-q-oxygen-transport-b" style="fill:var(--fig-teal)">폐포</text>
  <text x="130.0" y="168.0" text-anchor="middle" class="pchem-3-q-oxygen-transport-s">(공기 주머니)</text>
  <text x="130.0" y="192.0" text-anchor="middle" class="pchem-3-q-oxygen-transport-t">p<tspan baseline-shift="sub" font-size="10">O₂</tspan> ≈ 100 mmHg</text>
  <rect x="214.0" y="148.0" width="256.0" height="40.0" rx="4" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
  <ellipse cx="250" cy="168" rx="14" ry="9" style="fill:var(--fig-red);stroke:var(--fig-ink);stroke-width:0.8;fill-opacity:0.85"/>
  <ellipse cx="300" cy="168" rx="14" ry="9" style="fill:var(--fig-red);stroke:var(--fig-ink);stroke-width:0.8;fill-opacity:0.85"/>
  <ellipse cx="350" cy="168" rx="14" ry="9" style="fill:var(--fig-red);stroke:var(--fig-ink);stroke-width:0.8;fill-opacity:0.85"/>
  <ellipse cx="400" cy="168" rx="14" ry="9" style="fill:var(--fig-red);stroke:var(--fig-ink);stroke-width:0.8;fill-opacity:0.85"/>
  <ellipse cx="445" cy="168" rx="14" ry="9" style="fill:var(--fig-red);stroke:var(--fig-ink);stroke-width:0.8;fill-opacity:0.85"/>
  <text x="346.0" y="136.0" text-anchor="middle" class="pchem-3-q-oxygen-transport-s" style="fill:var(--fig-red)">모세 혈관(적혈구)</text>
  <line x1="300.0" y1="210.0" x2="400.0" y2="210.0" style="stroke:var(--fig-red);stroke-width:1.6;stroke-linecap:round"/>
  <polygon points="400.0,210.0 393.6,212.7 393.6,207.3" style="fill:var(--fig-red);stroke:none"/>
  <text x="350.0" y="228.0" text-anchor="middle" class="pchem-3-q-oxygen-transport-s" style="fill:var(--fig-red)">혈류</text>
  <rect x="480.0" y="80.0" width="210.0" height="170.0" rx="30" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:2.5"/>
  <text x="585.0" y="106.0" text-anchor="middle" class="pchem-3-q-oxygen-transport-b" style="fill:var(--fig-green)">조직 세포</text>
  <text x="585.0" y="128.0" text-anchor="middle" class="pchem-3-q-oxygen-transport-t">p<tspan baseline-shift="sub" font-size="10">O₂</tspan> ≈ 40 mmHg</text>
  <ellipse cx="585" cy="186" rx="52" ry="26" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <path d="M545,186 q8,-16 16,0 t16,0 t16,0 t16,0 t16,0" style="fill:none;stroke:var(--fig-amber);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round"/>
  <text x="585.0" y="230.0" text-anchor="middle" class="pchem-3-q-oxygen-transport-s" style="fill:var(--fig-amber)">미토콘드리아: O₂ 소비</text>
  <line x1="196.0" y1="128.0" x2="236.0" y2="158.0" style="stroke:var(--fig-ink);stroke-width:2.4;stroke-linecap:round"/>
  <polygon points="236.0,158.0 226.3,155.6 231.0,149.4" style="fill:var(--fig-ink);stroke:none"/>
  <line x1="452.0" y1="160.0" x2="520.0" y2="160.0" style="stroke:var(--fig-ink);stroke-width:2.4;stroke-linecap:round"/>
  <polygon points="520.0,160.0 510.8,163.9 510.8,156.1" style="fill:var(--fig-ink);stroke:none"/>
  <rect x="130.0" y="262.0" width="470.0" height="14.0" rx="2" style="fill:var(--fig-soft-amber);stroke:none"/>
  <polygon points="600,252 626,269 600,286" style="fill:var(--fig-amber);stroke:none"/>
  <text x="370.0" y="300.0" text-anchor="middle" class="pchem-3-q-oxygen-transport-b">O₂ 이동: 폐포 → 혈액 → 조직</text>
  <text x="370.0" y="322.0" text-anchor="middle" class="pchem-3-q-oxygen-transport-s">모식도(크기 비율은 실제와 다르다)</text>
</svg>
