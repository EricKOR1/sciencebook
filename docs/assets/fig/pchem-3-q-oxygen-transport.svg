  <polygon points="522.0,180.0 511.2,181.9 513.1,173.5" style="fill:var(--fig-ink);stroke:none"/>
  <rect x="122.6" y="267.0" width="54.9" height="19.0" rx="2" style="fill:var(--fig-panel);stroke:none"/>
  <text x="150.0" y="280.0" text-anchor="middle" class="pchem-3-q-oxygen-transport-b">O₂ 이동</text>
  <rect x="472.6" y="201.0" width="54.9" height="19.0" rx="2" style="fill:var(--fig-panel);stroke:none"/>
  <text x="500.0" y="214.0" text-anchor="middle" class="pchem-3-q-oxygen-transport-b">O₂ 이동</text>
  <text x="360.0" y="318.0" text-anchor="middle" class="pchem-3-q-oxygen-transport-s">모식도(크기 비율은 실제와 다르다)</text>
</svg>
