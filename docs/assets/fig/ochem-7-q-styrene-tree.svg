  <title id="t-ochem-7-q-styrene-tree">그림 유기화학 7-15 예제 15 스타이렌 Ha 신호의 갈라짐 나무</title>
  <desc id="d-ochem-7-q-styrene-tree">δ 6.72의 Ha 신호. 갈라지지 않은 가상의 선이 먼저 J_ab = 17.6 Hz(trans)로 ±8.8 Hz의 두 줄로, 각 줄이 다시 J_ac = 10.9 Hz(cis)로 갈라져 −14.25, −3.35, +3.35, +14.25 Hz의 같은 세기 네 줄(이중선의 이중선, dd)이 된다. 아래는 선 너비 0.8 Hz로 계산한 dd 모양, 오른쪽은 Ha·Hb·Hc의 위치이다.</desc>
