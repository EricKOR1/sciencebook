<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 310" class="fig-small" role="img" aria-labelledby="t-uearth-11-q-binary-cm d-uearth-11-q-binary-cm">
  <title id="t-uearth-11-q-binary-cm">그림 일반지구과학 11-12 문제 7의 쌍성과 질량 중심</title>
  <desc id="d-uearth-11-q-binary-cm">두 별이 공통 질량 중심을 같은 주기로 돌며 늘 질량 중심의 반대쪽에 있다. 질량 중심에서 두 별까지의 거리는 a₁ : a₂ = 2 : 3이고 두 별 사이의 거리(상대 궤도 긴반지름)는 20 AU이다. 궤도를 원으로 단순화했고, 별의 크기는 질량과 무관하다. 모식도.</desc>
  <style>.uearth-11-q-binary-cm-lbl{font-size:14px;fill:var(--fig-ink)} .uearth-11-q-binary-cm-sm{font-size:13px;fill:var(--fig-muted)} .uearth-11-q-binary-cm-b{font-weight:600} .uearth-11-q-binary-cm-ax{stroke:var(--fig-ink);stroke-width:1.2;fill:none} .uearth-11-q-binary-cm-grid{stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3;fill:none} </style>
  <circle cx="230.0" cy="150.0" r="80.0" style="fill:none;stroke:var(--fig-red);stroke-width:1.3;stroke-dasharray:5 4"/>
  <circle cx="230.0" cy="150.0" r="120.0" style="fill:none;stroke:var(--fig-blue);stroke-width:1.3;stroke-dasharray:5 4"/>
  <line x1="150.0" y1="150.0" x2="350.0" y2="150.0" style="stroke:var(--fig-ink);stroke-width:1.2"/>
  <path d="M168.7 201.4 L177.2 204.5 L170.3 210.3 Z" style="fill:var(--fig-red)"/>
  <path d="M321.9 72.9 L330.4 75.9 L323.5 81.7 Z" style="fill:var(--fig-blue)"/>
  <circle cx="150.0" cy="150.0" r="9" style="fill:var(--fig-red);stroke:var(--fig-ink);stroke-width:1"/>
  <circle cx="350.0" cy="150.0" r="9" style="fill:var(--fig-blue);stroke:var(--fig-ink);stroke-width:1"/>
  <path d="M224.0 150.0 L236.0 150.0 M230.0 144.0 L230.0 156.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="230.0" y="174.0" text-anchor="middle" class="uearth-11-q-binary-cm-sm">질량 중심</text>
  <text x="130.0" y="136.0" text-anchor="middle" class="uearth-11-q-binary-cm-lbl uearth-11-q-binary-cm-b">별 1</text>
  <text x="364.0" y="155.0" class="uearth-11-q-binary-cm-lbl uearth-11-q-binary-cm-b">별 2</text>
  <text x="190.0" y="142.0" text-anchor="middle" class="uearth-11-q-binary-cm-lbl uearth-11-q-binary-cm-b" style="fill:var(--fig-red)">a₁</text>
  <text x="290.0" y="142.0" text-anchor="middle" class="uearth-11-q-binary-cm-lbl uearth-11-q-binary-cm-b" style="fill:var(--fig-blue)">a₂</text>
  <line x1="150.0" y1="164.0" x2="150.0" y2="291.0" style="stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:2 3"/>
  <line x1="350.0" y1="164.0" x2="350.0" y2="291.0" style="stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:2 3"/>
  <line x1="152.0" y1="285.0" x2="348.0" y2="285.0" style="stroke:var(--fig-ink);stroke-width:1.2"/>
