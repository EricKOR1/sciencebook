  <text x="18.0" y="24.0" class="uearth-11-q-binary-cm-lbl uearth-11-q-binary-cm-b">a₁ : a₂ = 2 : 3</text>
  <text x="442.0" y="24.0" text-anchor="end" class="uearth-11-q-binary-cm-sm">공전 주기 40년</text>
