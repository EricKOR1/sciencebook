<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-m1-06-temperature-volume d-m1-06-temperature-volume">
  <title id="t-m1-06-temperature-volume">그림 중1-6-5 기체의 온도와 부피 관계</title>
  <desc id="d-m1-06-temperature-volume">압력이 일정할 때 주사기를 담근 물의 온도를 높이면 공기의 부피가 커져, 실험값이 오른쪽 위로 올라가는 직선을 이룬다. 입자 모형으로 보면 입자의 수와 크기는 같고, 입자가 빨라져(화살표가 길어져) 피스톤을 밀어내므로 입자 사이가 멀어진다. 모식도이다.</desc>
