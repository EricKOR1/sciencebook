<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-labelledby="t-ochem-7-mclafferty d-ochem-7-mclafferty">
  <title id="t-ochem-7-mclafferty">그림 유기화학 7-6 헥산-2-온의 맥라퍼티 자리 옮김</title>
  <desc id="d-ochem-7-mclafferty">분자 이온(산소에 홀전자와 ⊕)을 6원자 고리(O, C2, C3, C4, C5, γ-H) 모양으로 휘어 그렸다. 낚싯바늘 화살표 여섯 개는 전자 6개의 이동이다: 산소의 홀전자와 γ C–H 결합의 전자 하나가 새 O–H 결합을, γ C–H 결합의 다른 전자와 C3–C4 결합의 전자 하나가 C4=C5 π 결합(프로펜)을, C3–C4 결합의 남은 전자와 C=O π 전자 하나가 엔올의 C2=C3 결합을 만든다. C=O π의 남은 전자는 산소에 홀전자로 남는다. 생성물은 엔올 양이온 라디칼(m/z 58, 짝수 질량)과 중성 프로펜(42). 아래는 전형적인 막대 스펙트럼(모식도)이다.</desc>
