  <title id="t-uchem-8-concentration-jump">그림 일반화학 8-5 평형 혼합물에 수증기를 더 넣으면</title>
  <desc id="d-uchem-8-concentration-jump">예제 10의 농도 변화 모식도(시간 눈금은 임의)이다. 평형에서 H₂O를 0.200 M 더 넣으면 Q가 4.0에서 2.35로 작아져 정반응이 진행한다. CO와 H₂O는 줄고 CO₂와 H₂는 늘어 Q가 다시 K = 4.0이 된다. 넣은 0.200 M 가운데 0.043 M만 소모된다.</desc>
