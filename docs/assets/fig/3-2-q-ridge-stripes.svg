<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-3-2-q-ridge-stripes d-3-2-q-ridge-stripes">
<title id="t-3-2-q-ridge-stripes">그림 3-2-7 문제 10의 해령 동쪽 고지자기 줄무늬</title>
<desc id="d-3-2-q-ridge-stripes">해령 부근 해저를 위에서 본 모습이다. 해령 동쪽에는 고지자기 줄무늬와 줄무늬 경계까지의 거리, 경계의 나이(문제의 표의 값)를 나타냈고, 해령 서쪽은 줄무늬를 그리지 않았다.</desc>
