<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-5-2-q-food-web d-5-2-q-food-web">
  <title id="t-5-2-q-food-web">그림 5-2-6 문제 10 해설: 표를 먹이 그물로 나타내기</title>
  <desc id="d-5-2-q-food-web">문제 10의 표를 먹이 그물로 그린 것이다(화살표는 먹히는 생물에서 먹는 생물 쪽). 파란 실선은 풀 → 메뚜기 → 개구리(개구리가 2차 소비자), 빨간 점선은 메뚜기 → 거미 → 개구리(개구리가 3차 소비자)인 경로이다. 거미로 들어오는 화살표는 메뚜기에서 오는 하나뿐이고, 여우로는 토끼와 뱀 두 곳에서 들어온다.</desc>
  <style>.f5-2-q-food-web-box{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.4} .f5-2-q-food-web-pro{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.6} .f5-2-q-food-web-key{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2} .f5-2-q-food-web-t{font-size:15px;font-weight:600;fill:var(--fig-ink)} .f5-2-q-food-web-s{font-size:13px;fill:var(--fig-muted)} .f5-2-q-food-web-e{stroke:var(--fig-muted);stroke-width:1.8;fill:none} .f5-2-q-food-web-eh{fill:var(--fig-muted)} .f5-2-q-food-web-e2{stroke:var(--fig-blue);stroke-width:3;fill:none} .f5-2-q-food-web-e2h{fill:var(--fig-blue)} .f5-2-q-food-web-e3{stroke:var(--fig-red);stroke-width:3;fill:none;stroke-dasharray:7 4} .f5-2-q-food-web-e3h{fill:var(--fig-red)} .f5-2-q-food-web-c2{font-size:13px;font-weight:600;fill:var(--fig-blue)} .f5-2-q-food-web-c3{font-size:13px;font-weight:600;fill:var(--fig-red)}</style>
