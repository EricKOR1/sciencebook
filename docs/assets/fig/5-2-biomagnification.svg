    <ellipse cx="114" cy="92" rx="8" ry="4.5" class="bm-pl"/><path d="M106 90 l-8 -7 M106 93 l-8 5" class="bm-leg" style="stroke:var(--fig-teal);stroke-width:1.2"/>
