<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 324" role="img" aria-labelledby="t-5-2-biomagnification d-5-2-biomagnification">
  <title id="t-5-2-biomagnification">그림 5-2-2 먹이 관계를 따라 쌓이는 물질 — 생물 농축</title>
  <desc id="d-5-2-biomagnification">잘 분해·배출되지 않는 물질 X는 먹이 관계를 따라 위 영양 단계로 갈수록 몸속 농도가 높아진다. 농도 값은 예제 4의 가상 자료이고, 점의 수는 농도가 커지는 경향만 나타낸 모식이다(비율은 실제와 다름).</desc>
  <style>
    .bm-ttl{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .bm-lbl{font-size:14px;fill:var(--fig-ink)}
    .bm-val{font-size:15px;font-weight:700;fill:var(--fig-red)}
    .bm-sm{font-size:12.5px;fill:var(--fig-muted)}
    .bm-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2}
    .bm-dot{fill:var(--fig-red)}
    .bm-arr{fill:none;stroke:var(--fig-ink);stroke-width:2}
    .bm-head{fill:var(--fig-ink)}
    .bm-pl{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.5}
    .bm-fish{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8;stroke-linejoin:round}
    .bm-bird{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.8;stroke-linejoin:round}
    .bm-leg{fill:none;stroke:var(--fig-violet);stroke-width:2}
    .bm-eye{fill:var(--fig-ink)}
  </style>
  <text x="360" y="28" text-anchor="middle" class="bm-ttl">잘 분해·배출되지 않는 물질 X의 몸속 농도</text>
