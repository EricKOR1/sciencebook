  <circle cx="392.0" cy="126.9" r="4.5" style="fill:var(--fig-green);stroke:var(--fig-paper);stroke-width:1.2"/>
  <text x="402.0" y="202.0" text-anchor="start" class="f6-4-q-wt-s">x = 0.6일 때 A 2.2</text>
