<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-6-4-q-weight-sensitivity d-6-4-q-weight-sensitivity">
  <title id="t-6-4-q-weight-sensitivity">그림 6-4-5 문제 13 해설 — 개인정보 가중치 x에 따른 세 대안의 총점</title>
  <desc id="d-6-4-q-weight-sensitivity">가로축은 개인정보 보호의 가중치 x, 세로축은 총점이다. A = 4 − 3x, B = 11/3 + x/3, C = 7/3 + 8x/3은 모두 직선이며, B와 C는 x = 4/7(약 0.57)에서 만나고 그보다 x가 크면 C의 총점이 가장 높다. x = 0.6에서 A 2.2, B 약 3.87, C 약 3.93이다.</desc>
