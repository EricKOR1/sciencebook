    .f6-4-q-wt-s{font-size:13px;fill:var(--fig-muted)}
    .f6-4-q-wt-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
    .f6-4-q-wt-gr{fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 4}
  </style>
