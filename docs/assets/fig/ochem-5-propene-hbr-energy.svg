<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-ochem-5-propene-hbr-energy d-ochem-5-propene-hbr-energy">
  <title id="t-ochem-5-propene-hbr-energy">그림 유기화학 5-4 프로펜 + HBr 두 경로의 자유 에너지 도표(모식도)</title>
  <desc id="d-ochem-5-propene-hbr-energy">세로축은 자유 에너지 G, 가로축은 반응 좌표이다(눈금 없는 정성적 모식도). 공통 출발점 프로펜 + HBr에서 두 곡선이 갈라진다. 실선(2° 경로)은 첫 전이 상태가 낮고 2° 양이온을 거쳐 2-브로모프로페인으로 내려가며, 점선(1° 경로)은 첫 전이 상태와 1° 양이온이 훨씬 높다. 두 첫 전이 상태의 높이 차가 ΔΔG‡이고, 흡열인 1단계의 전이 상태는 반응 좌표에서 양이온 쪽에 치우쳐 양이온을 닮는다(해먼드 가설).</desc>
  <style>.ochem-5-propene-hbr-energy-t{font-size:14px;fill:var(--fig-ink)} .ochem-5-propene-hbr-energy-b{font-size:14px;fill:var(--fig-ink);font-weight:600} .ochem-5-propene-hbr-energy-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ochem-5-propene-hbr-energy-s{font-size:13px;fill:var(--fig-muted)} .ochem-5-propene-hbr-energy-n{font-size:13px;fill:var(--fig-muted)} .ochem-5-propene-hbr-energy-r{font-size:13px;fill:var(--fig-red);font-weight:600} .ochem-5-propene-hbr-energy-g{font-size:13px;fill:var(--fig-green);font-weight:600} .ochem-5-propene-hbr-energy-v{font-size:13px;fill:var(--fig-violet)} .ochem-5-propene-hbr-energy-pl{font-size:20px;fill:var(--fig-ink)} .ochem-5-propene-hbr-energy-f{font-size:14px;fill:var(--fig-ink)}</style>
