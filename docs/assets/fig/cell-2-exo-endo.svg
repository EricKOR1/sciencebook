  <title id="t-cell-2-exo-endo">그림 세포와 물질대사 2-3 발열 반응과 흡열 반응의 에너지 변화</title>
  <desc id="d-cell-2-exo-endo">발열 반응은 반응물의 에너지가 생성물보다 높아 반응 후 에너지를 방출하고, 흡열 반응은 생성물의 에너지가 더 높아 에너지를 흡수한다. 두 반응 모두 시작하려면 활성화 에너지라는 문턱을 넘어야 한다. 모식도.</desc>
