<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-uchem-4-pes-spectra d-uchem-4-pes-spectra">
  <title id="t-uchem-4-pes-spectra">그림 일반화학 4-7 네온과 나트륨의 광전자 스펙트럼</title>
  <desc id="d-uchem-4-pes-spectra">가로축은 전자의 결합 에너지(MJ/mol, 로그 눈금으로 왼쪽이 크다), 봉우리 높이는 그 부껍질의 전자 수에 비례한다. 네온(위)은 1s, 2s, 2p의 세 봉우리가 2 : 2 : 6의 높이로 나타난다. 나트륨(아래)은 같은 세 봉우리가 원자핵 전하가 커진 만큼 더 왼쪽(큰 결합 에너지)으로 옮겨 가고, 오른쪽 끝에 3s 전자 1개의 작은 봉우리가 새로 생긴다. 봉우리 모양은 모식이다.</desc>
