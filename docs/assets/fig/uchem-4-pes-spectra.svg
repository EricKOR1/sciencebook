    .uchem-4-pes-spectra-b{font-size:15px;fill:var(--fig-ink);font-weight:bold}
    .uchem-4-pes-spectra-ax{stroke:var(--fig-ink);stroke-width:1.2;fill:none}
    .uchem-4-pes-spectra-gr{stroke:var(--fig-line);stroke-width:0.6;fill:none;stroke-dasharray:2 3}

    .uchem-4-pes-spectra-pk{fill:var(--fig-soft-blue);stroke:var(--fig-accent);stroke-width:1.6}
    .uchem-4-pes-spectra-pk2{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.6}
  </style>
