  <text x="452.0" y="196.7" class="uearth-7-vertical-structure-t">CO₂의 적외선 방출로 냉각</text>
  <text x="452.0" y="213.7" class="uearth-7-vertical-structure-t">중간권 계면 약 −90 °C</text>
  <text x="452.0" y="287.7" class="uearth-7-vertical-structure-b" style="fill:var(--fig-violet)">성층권 (계면 ~ 약 50 km)</text>
  <text x="452.0" y="305.7" class="uearth-7-vertical-structure-t">오존의 자외선 흡수로 가열</text>
  <text x="452.0" y="322.7" class="uearth-7-vertical-structure-t">단위 질량당 가열이 큰 위쪽이</text>
  <text x="452.0" y="339.7" class="uearth-7-vertical-structure-t">더 따뜻 → 계면 약 50 km에서 최고</text>
  <text x="452.0" y="387.8" class="uearth-7-vertical-structure-b" style="fill:var(--fig-amber)">대류권 (0 ~ 약 12 km)</text>
