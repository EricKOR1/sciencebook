<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="t-uearth-7-vertical-structure d-uearth-7-vertical-structure">
  <title id="t-uearth-7-vertical-structure">그림 일반지구과학 7-1 기온과 기압의 연직 분포, 그리고 각 층의 가열원</title>
  <desc id="d-uearth-7-vertical-structure">왼쪽 선은 중위도 평균 대기의 기온 분포이고, 오른쪽 눈금은 같은 높이의 기압이다. 기압은 높이에 따라 지수적으로 줄어 약 5.5 km 아래에 대기 질량의 절반이 있다. 대류권은 지표 가열과 대류·잠열, 성층권은 오존의 자외선 흡수, 열권은 산소·질소의 극자외선·X선 흡수로 데워지고, 중간권은 가열원이 약해 기온이 낮아진다.</desc>
