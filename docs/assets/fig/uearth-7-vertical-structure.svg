  <text x="452.0" y="50.1" class="uearth-7-vertical-structure-b" style="fill:var(--fig-red)">열권 (약 85 km 위)</text>
  <text x="452.0" y="68.1" class="uearth-7-vertical-structure-t">O₂·N₂가 극자외선·X선 흡수</text>
  <text x="452.0" y="85.1" class="uearth-7-vertical-structure-t">기온 수백~1000 °C 이상(위 화살표)</text>
