<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-rxn-2-reduction-ladder d-rxn-2-reduction-ladder">
  <title id="t-rxn-2-reduction-ladder">그림 화학 반응의 세계 2-3 표준 수소 전극과 표준 환원 전위</title>
  <desc id="d-rxn-2-reduction-ladder">왼쪽: 표준 수소 전극(0 V)과 Cu²⁺/Cu 반쪽 전지를 연결하면 전압계가 0.34 V를 가리키고, 구리 쪽에서 환원이 일어난다. 오른쪽: 이렇게 잰 값을 늘어놓은 표준 환원 전위 사다리. 장치는 모식도이다.</desc>
  <style>
    .rxn-2-reduction-ladder-f{font-size:14px;fill:var(--fig-ink);font-weight:600}
    .rxn-2-reduction-ladder-s{font-size:13px;fill:var(--fig-muted)}
    .rxn-2-reduction-ladder-k{font-size:13px;fill:var(--fig-ink)}
  </style>
  <!-- 도선과 전압계 -->
  <path d="M95 112 V40 H160 M240 40 H305 V112" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/>
  <rect x="160" y="22" width="80" height="36" rx="6" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2"/>
  <text x="200" y="46" text-anchor="middle" class="rxn-2-reduction-ladder-f">0.34 V</text>
  <path d="M112 30 H146" style="stroke:var(--fig-amber);stroke-width:2.5"/><path d="M152 30 l-10 -5 v10 z" style="fill:var(--fig-amber)"/>
  <text x="129" y="22" text-anchor="middle" class="rxn-2-reduction-ladder-k" style="fill:var(--fig-amber);font-weight:600">e⁻</text>
  <!-- 비커 -->
  <path d="M30 150 V280 H160 V150" style="fill:none;stroke:var(--fig-line);stroke-width:2"/>
  <rect x="31" y="180" width="128" height="99" style="fill:var(--fig-soft-amber)"/>
  <path d="M240 150 V280 H370 V150" style="fill:none;stroke:var(--fig-line);stroke-width:2"/>
  <rect x="241" y="180" width="128" height="99" style="fill:var(--fig-soft-blue)"/>
  <!-- 수소 전극: 유리관, 백금 -->
  <path d="M72 112 H118 V230 H72 Z" style="fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.5;fill-opacity:0.6"/>
  <line x1="95" y1="112" x2="95" y2="236" style="stroke:var(--fig-ink);stroke-width:1.5"/>
  <rect x="85" y="236" width="20" height="18" style="fill:var(--fig-muted);stroke:var(--fig-ink);stroke-width:1"/>
  <text x="95" y="268" text-anchor="middle" class="rxn-2-reduction-ladder-s">Pt</text>
  <path d="M118 128 H140" style="stroke:var(--fig-muted);stroke-width:2"/>
  <text x="144" y="132" class="rxn-2-reduction-ladder-s">H₂ 1 atm</text>
  <g style="fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1">
    <circle cx="80" cy="244" r="3"/><circle cx="112" cy="240" r="3"/><circle cx="78" cy="226" r="2.5"/><circle cx="114" cy="222" r="2.5"/>
  </g>
  <text x="138" y="250" text-anchor="middle" class="rxn-2-reduction-ladder-k">1 M H⁺</text>
  <!-- 구리 전극 -->
  <rect x="294" y="112" width="22" height="150" style="fill:var(--fig-amber);stroke:var(--fig-ink);stroke-width:1"/>
  <text x="305" y="132" text-anchor="middle" class="rxn-2-reduction-ladder-f" style="font-size:12px">Cu</text>
  <text x="342" y="205" text-anchor="middle" class="rxn-2-reduction-ladder-k">1 M</text>
  <text x="342" y="222" text-anchor="middle" class="rxn-2-reduction-ladder-k">Cu²⁺</text>
  <!-- 염다리 -->
  <path d="M140 196 V140 H262 V196" style="fill:none;stroke:var(--fig-line);stroke-width:15"/>
  <path d="M140 196 V140 H262 V196" style="fill:none;stroke:var(--fig-soft-violet);stroke-width:12"/>
  <text x="201" y="162" text-anchor="middle" class="rxn-2-reduction-ladder-s">염다리</text>
  <!-- 설명 -->
  <text x="95" y="300" text-anchor="middle" class="rxn-2-reduction-ladder-f">표준 수소 전극</text>
  <text x="95" y="318" text-anchor="middle" class="rxn-2-reduction-ladder-s">H₂ → 2H⁺ + 2e⁻ (기준 0 V)</text>
  <text x="305" y="300" text-anchor="middle" class="rxn-2-reduction-ladder-f">Cu²⁺/Cu 반쪽 전지</text>
  <text x="305" y="318" text-anchor="middle" class="rxn-2-reduction-ladder-s">Cu²⁺ + 2e⁻ → Cu (환원)</text>
  <text x="200" y="346" text-anchor="middle" class="rxn-2-reduction-ladder-k">→ Cu²⁺/Cu의 표준 환원 전위 E° = +0.34 V</text>
  <!-- 사다리 -->
  <line x1="500" y1="40" x2="500" y2="320" style="stroke:var(--fig-line);stroke-width:3"/>
  <text x="500" y="26" text-anchor="middle" class="rxn-2-reduction-ladder-f">E° (V)</text>
  <g class="rxn-2-reduction-ladder-k">
    <line x1="492" y1="70" x2="508" y2="70" style="stroke:var(--fig-ink);stroke-width:2"/><text x="518" y="75">Ag⁺ + e⁻ → Ag   +0.80</text>
    <line x1="492" y1="133" x2="508" y2="133" style="stroke:var(--fig-red);stroke-width:3"/><text x="518" y="138" style="fill:var(--fig-red);font-weight:600">Cu²⁺ + 2e⁻ → Cu   +0.34</text>
    <line x1="492" y1="180" x2="508" y2="180" style="stroke:var(--fig-ink);stroke-width:2"/><text x="518" y="185" style="font-weight:600">2H⁺ + 2e⁻ → H₂   0 (기준)</text>
    <line x1="492" y1="240" x2="508" y2="240" style="stroke:var(--fig-ink);stroke-width:2"/><text x="518" y="245">Fe²⁺ + 2e⁻ → Fe   −0.44</text>
    <line x1="492" y1="284" x2="508" y2="284" style="stroke:var(--fig-ink);stroke-width:2"/><text x="518" y="289">Zn²⁺ + 2e⁻ → Zn   −0.76</text>
  </g>
  <path d="M470 175 V60" style="stroke:var(--fig-red);stroke-width:2.5"/><path d="M470 52 l-6 11 h12 z" style="fill:var(--fig-red)"/>
  <text x="458" y="100" text-anchor="end" class="rxn-2-reduction-ladder-k" style="fill:var(--fig-red)">환원되기</text>
  <text x="458" y="118" text-anchor="end" class="rxn-2-reduction-ladder-k" style="fill:var(--fig-red)">쉽다</text>
  <text x="458" y="136" text-anchor="end" class="rxn-2-reduction-ladder-s">(강한 산화제)</text>
  <path d="M470 186 V300" style="stroke:var(--fig-blue);stroke-width:2.5"/><path d="M470 308 l-6 -11 h12 z" style="fill:var(--fig-blue)"/>
  <text x="458" y="240" text-anchor="end" class="rxn-2-reduction-ladder-k" style="fill:var(--fig-blue)">산화되기</text>
  <text x="458" y="258" text-anchor="end" class="rxn-2-reduction-ladder-k" style="fill:var(--fig-blue)">쉽다</text>
  <text x="458" y="276" text-anchor="end" class="rxn-2-reduction-ladder-s">(강한 환원제)</text>
  <text x="600" y="346" text-anchor="middle" class="rxn-2-reduction-ladder-s">눈금 위치는 실제 전위 비율대로 그렸다</text>
</svg>
