<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uphy-6-displacement-pressure d-uphy-6-displacement-pressure">
  <title id="t-uphy-6-displacement-pressure">그림 일반물리학 6-6 음파의 변위파와 압력파</title>
  <desc id="d-uphy-6-displacement-pressure">공기 조각들의 평형 위치(회색 점선)와 한 순간의 위치(파란 선). 변위 s가 0이면서 양옆 조각이 몰려드는 곳이 압축(압력 최대), 흩어지는 곳이 팽창(압력 최소)이다. 그래서 압력 변화 Δp = −B ∂s/∂x는 변위파와 위상이 π/2 다르다. 변위는 과장해 그렸다.</desc>
