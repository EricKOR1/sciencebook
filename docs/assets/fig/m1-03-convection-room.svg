<title id="t-m1-03-convection-room">그림 중1-3-3 난로는 아래에, 에어컨은 위에 두는 까닭</title>
<desc id="d-m1-03-convection-room">난로를 바닥에 두면 데워진 공기가 위로 올라가고 차가운 공기가 내려와 방 전체에 대류가 일어난다. 에어컨을 위쪽에 두면 차가운 공기가 아래로 내려가고 따뜻한 공기가 올라가 대류가 일어난다. 빨간 화살표는 따뜻한 공기, 파란 화살표는 차가운 공기이다. 단면 모식도.</desc>
