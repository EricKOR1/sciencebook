<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-phy-3-photolithography d-phy-3-photolithography">
  <title id="t-phy-3-photolithography">그림 물리학 3-5 포토리소그래피 — 빛으로 회로 무늬를 새기는 과정</title>
  <desc id="d-phy-3-photolithography">왼쪽: 마스크의 회로 무늬를 투영 렌즈가 축소한 실상으로 웨이퍼 위 감광액에 맺는다. 오른쪽: 빛을 받은 감광액을 녹여 내고(현상), 드러난 막을 깎은 뒤(식각) 감광액을 벗기면 마스크 무늬가 막에 남는다(모식도, 빛 받은 부분이 녹는 감광액의 경우).</desc>
  <style>
    .phy-3-photolithography-lbl{font-size:14px;fill:var(--fig-ink)} .phy-3-photolithography-sm{font-size:13px;fill:var(--fig-muted)} .phy-3-photolithography-b{font-weight:600}
  </style>
