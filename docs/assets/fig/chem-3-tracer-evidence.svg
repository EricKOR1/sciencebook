<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 365" role="img" aria-labelledby="t-chem-3-tracer-evidence d-chem-3-tracer-evidence">
  <title id="t-chem-3-tracer-evidence">그림 화학 3-6 동적 평형의 증거 — 방사성 아이오딘 추적</title>
  <desc id="d-chem-3-tracer-evidence">포화된 아이오딘화 납 수용액에 방사성 아이오딘으로 표지한 결정을 넣으면, 결정의 질량과 용액의 농도는 변하지 않는데도 시간이 지나면 용액 속에서 방사성 아이오딘 이온이 발견된다. 용해와 석출이 같은 속도로 계속 일어나고 있다는 증거이다. 입자 수는 모식도이다.</desc>
  <style>
    .chem-3-tracer-evidence-t{font-size:14px;fill:var(--fig-ink)} .chem-3-tracer-evidence-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .chem-3-tracer-evidence-s{font-size:13px;fill:var(--fig-muted)} .chem-3-tracer-evidence-ax{stroke:var(--fig-ink);stroke-width:1.4;fill:none}
    .chem-3-tracer-evidence-gr{stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4;fill:none;opacity:0.7}
    .chem-3-tracer-evidence-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}
    .chem-3-tracer-evidence-I{fill:var(--fig-violet)} .chem-3-tracer-evidence-Pb{fill:var(--fig-muted)} .chem-3-tracer-evidence-hot{fill:var(--fig-amber);stroke:var(--fig-red);stroke-width:2}
    .chem-3-tracer-evidence-sol{fill:var(--fig-soft-amber);stroke:none}

  </style>
