<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-labelledby="t-earth-1-milankovitch d-earth-1-milankovitch">
  <title id="t-earth-1-milankovitch">그림 지구과학 1-16 기후변화의 천문학적 요인(밀란코비치 주기)</title>
  <desc id="d-earth-1-milankovitch">① 공전 궤도의 모양이 원에 가까워졌다가 납작해지기를 약 10만 년 주기로 되풀이한다. ② 자전축 경사각이 약 21.5°에서 24.5° 사이에서 약 4만 1천 년 주기로 변한다. ③ 자전축의 방향이 팽이처럼 약 2만 6천 년 주기로 돈다. 궤도의 납작함은 과장한 모식도이다.</desc>
  <style>
    .earth-1-milankovitch-t{font-size:14px;fill:var(--fig-ink)}
    .earth-1-milankovitch-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .earth-1-milankovitch-s{font-size:13px;fill:var(--fig-muted)}
    .earth-1-milankovitch-land{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:0.8;fill-rule:evenodd}
    .earth-1-milankovitch-sea{fill:var(--fig-soft-blue)}
    .earth-1-milankovitch-grat{fill:none;stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3;opacity:0.7}
    .earth-1-milankovitch-frame{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .earth-1-milankovitch-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
<rect x="12" y="10" width="224" height="290" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line)"/><text x="124" y="36" text-anchor="middle" class="earth-1-milankovitch-b">① 공전 궤도 이심률</text><text x="124" y="56" text-anchor="middle" class="earth-1-milankovitch-s">약 10만 년 주기</text><rect x="248" y="10" width="224" height="290" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line)"/><text x="360" y="36" text-anchor="middle" class="earth-1-milankovitch-b">② 자전축 경사각</text><text x="360" y="56" text-anchor="middle" class="earth-1-milankovitch-s">약 4만 1천 년 주기</text><rect x="484" y="10" width="224" height="290" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line)"/><text x="596" y="36" text-anchor="middle" class="earth-1-milankovitch-b">③ 자전축 세차 운동</text><text x="596" y="56" text-anchor="middle" class="earth-1-milankovitch-s">약 2만 6천 년 주기</text><circle cx="124" cy="170" r="72" style="fill:none;stroke:var(--fig-blue);stroke-width:2;stroke-dasharray:5 4"/><ellipse cx="140" cy="170" rx="84" ry="62" style="fill:none;stroke:var(--fig-red);stroke-width:2.5"/><circle cx="124" cy="170" r="11" style="fill:var(--fig-amber)"/><text x="124" y="200" text-anchor="middle" class="earth-1-milankovitch-s">태양</text><text x="124" y="262" text-anchor="middle" class="earth-1-milankovitch-s">원에 가까운 궤도(파랑)</text><text x="124" y="280" text-anchor="middle" class="earth-1-milankovitch-s">↔ 더 납작한 궤도(빨강)</text><circle cx="360" cy="178" r="44" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/><line x1="280" y1="178" x2="440" y2="178" style="stroke:var(--fig-muted);stroke-width:1.5;stroke-dasharray:4 3"/><text x="408" y="172" text-anchor="start" class="earth-1-milankovitch-s">궤도면</text><line x1="360" y1="98" x2="360" y2="240" style="stroke:var(--fig-muted);stroke-width:1.5;stroke-dasharray:2 3"/><line x1="384.2" y1="239.4" x2="335.8" y2="116.6" style="stroke:var(--fig-blue);stroke-width:2.5"/><line x1="387.4" y1="238.1" x2="332.6" y2="117.9" style="stroke:var(--fig-red);stroke-width:2.5"/><path d="M360 116 A62 62 0 0 0 334.3 121.6" style="fill:none;stroke:var(--fig-ink);stroke-width:1.5"/><text x="316" y="88" text-anchor="middle" class="earth-1-milankovitch-b">21.5°~24.5°</text><text x="360" y="262" text-anchor="middle" class="earth-1-milankovitch-s">경사가 클수록</text><text x="360" y="280" text-anchor="middle" class="earth-1-milankovitch-s">계절 차이(연교차)가 커진다</text><ellipse cx="596" cy="105" rx="40" ry="11" style="fill:none;stroke:var(--fig-violet);stroke-width:2;stroke-dasharray:5 3"/><path d="M626 97 L615.1 99.4 L617.5 89.7 Z" style="fill:var(--fig-violet)"/><circle cx="596" cy="175" r="40" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/><line x1="624" y1="241" x2="568" y2="105" style="stroke:var(--fig-red);stroke-width:2.5"/><line x1="596" y1="249" x2="596" y2="95" style="stroke:var(--fig-muted);stroke-width:1.5;stroke-dasharray:2 3"/><text x="596" y="262" text-anchor="middle" class="earth-1-milankovitch-s">자전축이 팽이처럼 돌아</text><text x="596" y="280" text-anchor="middle" class="earth-1-milankovitch-s">근일점에서 맞는 계절이 바뀐다</text>
</svg>
