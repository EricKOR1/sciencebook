  <text x="130.0" y="124.0" text-anchor="middle" class="m2-06-vessels-b" style="fill:var(--fig-red)">동맥</text>
  <text x="360.0" y="124.0" text-anchor="middle" class="m2-06-vessels-b" style="fill:var(--fig-violet)">모세혈관 (온몸에 그물처럼)</text>
  <text x="590.0" y="124.0" text-anchor="middle" class="m2-06-vessels-b" style="fill:var(--fig-blue)">정맥</text>
  <line x1="20.0" y1="140.0" x2="700.0" y2="140.0" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4;fill:none"/>
  <text x="360.0" y="164.0" text-anchor="middle" class="m2-06-vessels-s">잘라 본 단면 (크기는 모식적)</text>
  <circle cx="130.0" cy="236.0" r="50.0" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2"/>
