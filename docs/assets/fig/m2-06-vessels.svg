  <text x="560.0" y="310.0" text-anchor="middle" class="m2-06-vessels-t">벽이 얇고</text>
  <text x="560.0" y="328.0" text-anchor="middle" class="m2-06-vessels-s">판막이 있다 · 혈압 가장 낮다</text>
