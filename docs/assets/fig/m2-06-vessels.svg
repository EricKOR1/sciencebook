<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-m2-06-vessels d-m2-06-vessels">
  <title id="t-m2-06-vessels">그림 중2-6-5 동맥, 모세혈관, 정맥의 비교</title>
  <desc id="d-m2-06-vessels">동맥은 심장에서 나간 혈액이 흐르며 벽이 두껍고 탄력이 크다. 모세혈관은 한 겹의 세포층으로 된 매우 가는 혈관으로 조직세포와 물질을 주고받는다. 정맥은 심장으로 돌아가는 혈액이 흐르며 벽이 얇고 판막이 있다. 모식도이다.</desc>
  <style>.m2-06-vessels-t{font-size:14px;fill:var(--fig-ink)} .m2-06-vessels-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .m2-06-vessels-s{font-size:13px;fill:var(--fig-muted)} .m2-06-vessels-hd{font-size:15px;font-weight:700;fill:var(--fig-ink)} </style>
  <text x="360.0" y="28.0" text-anchor="middle" class="m2-06-vessels-hd">심장 → 동맥 → 모세혈관 → 정맥 → 심장</text>
  <path d="M30 70 L230 70 L230 96 L30 96 Z" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:5"/>
