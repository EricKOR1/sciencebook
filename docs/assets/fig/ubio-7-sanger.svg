.ubio-7-sanger-h{font-size:14px;font-weight:700;fill:var(--fig-ink)} .ubio-7-sanger-t{font-size:13px;fill:var(--fig-ink)} .ubio-7-sanger-s{font-size:13px;fill:var(--fig-muted)} .ubio-7-sanger-b{font-size:13px;font-weight:700;fill:var(--fig-ink)}
</style>
