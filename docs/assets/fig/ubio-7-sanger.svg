<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="t-ubio-7-sanger d-ubio-7-sanger">
<title id="t-ubio-7-sanger">그림 일반생명과학 7-9 사슬 종결법(생어 방법)의 원리</title>
<desc id="d-ubio-7-sanger">왼쪽: 프라이머에서 시작해 자라던 새 가닥에 형광 표지 ddNTP가 들어가면 그 자리에서 사슬이 멈추므로, 길이가 한 염기씩 다른 조각들이 생긴다. 오른쪽: 모세관 전기 영동에서 짧은 조각부터 차례로 검출되므로, 끝 염기의 색을 순서대로 읽으면 새 가닥의 서열(5′→3′)이 나오고 주형은 그 상보 서열이다. 서열은 예시이다.</desc>
