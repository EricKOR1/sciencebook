<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="t-umath-7-q-calibration-residuals d-umath-7-q-calibration-residuals">
  <title id="t-umath-7-q-calibration-residuals">그림 수학 도구 7-15 문제 17의 두 맞춤과 잔차 그림</title>
  <desc id="d-umath-7-q-calibration-residuals">문제 17 해설. 위: 다섯 측정점과 원점을 지나는 직선 A = 0.0568c(빨간 점선), 절편이 있는 직선 A = 0.05015c + 0.0485(파란 실선). 아래: 원점 맞춤의 잔차(+0.035, +0.021, +0.011, −0.007, −0.017)는 농도에 따라 한 방향으로 줄어드는 체계적 패턴이고, 절편 맞춤의 잔차는 ±0.003 안에서 0 둘레에 무작위하다.</desc>
