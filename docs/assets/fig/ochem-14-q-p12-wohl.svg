  <title id="t-ochem-14-q-p12-wohl">그림 유기화학 14-21 문제 12 풀이 — 볼 분해와 타타르산</title>
  <desc id="d-ochem-14-q-p12-wohl">왼쪽: D-리보스(C2·C3·C4 OH 모두 오른쪽)를 볼 분해하면 C1이 떨어져 D-에리트로스(오른쪽, 오른쪽)가 되고, 질산 산화로 메조 타타르산(가운데 가로 점선 거울면, 광학 비활성)이 된다. 오른쪽: D-자일로스(오른쪽, 왼쪽, 오른쪽) → D-트레오스(왼쪽, 오른쪽) → (2S,3S)-타타르산(광학 활성). 초록 테두리가 답(X = D-자일로스, Y = D-트레오스).</desc>
