  <title id="t-bio-3-homologous-organs">그림 생명과학 3-8 상동 기관 — 사람의 팔, 고래의 가슴지느러미, 박쥐의 날개</title>
  <desc id="d-bio-3-homologous-organs">사람의 팔, 고래의 가슴지느러미, 박쥐의 날개는 하는 일이 다르지만 위팔뼈, 아래팔뼈, 손목뼈, 손가락뼈가 같은 순서로 배열되어 있다. 같은 색은 기원이 같은 뼈이다. 모식도(뼈의 개수와 크기는 단순화함).</desc>
