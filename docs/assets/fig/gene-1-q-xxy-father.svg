  <desc id="d-gene-1-q-xxy-father">아버지(XᴿY)의 정자 형성 과정에서 감수 1분열 때 X와 Y가 갈라지지 않으면 X와 Y를 함께 가진 정자 2개와 성염색체가 없는 정자 2개가 생긴다. X와 Y를 함께 가진 정자가 어머니의 Xʳ 난자와 수정하면 시각이 정상인 XᴿXʳY 아들이 된다. 성염색체만 나타낸 모식도이다.</desc>
