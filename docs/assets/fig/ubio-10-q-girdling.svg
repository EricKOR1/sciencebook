  <desc id="d-ubio-10-q-girdling">사과나무 가지의 한 부분에서 수피를 폭 2 cm의 고리 모양으로 벗겨 낸 모습이다. 잎과 열매는 박피 부위보다 가지 끝 쪽에 있고, 반대쪽은 나무의 줄기와 뿌리로 이어진다. 모식도이다.</desc>
