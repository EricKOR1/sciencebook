<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 448" role="img" aria-labelledby="t-ubio-3-z d-ubio-3-z">
  <title id="t-ubio-3-z">그림 일반생명과학 3-2 Z 도식 — 환원 전위로 본 명반응의 전자 흐름</title>
  <desc id="d-ubio-3-z">세로축은 환원 전위이며 위로 갈수록 음수(전자의 에너지가 높음)이다. 물(+0.82 V)에서 나온 전자는 광계 Ⅱ의 P680에서 빛으로 한 번 끌어올려진 뒤 페오피틴, 플라스토퀴논(PQ), 사이토크롬 b₆f(H⁺ 퍼내기), 플라스토사이아닌(PC)을 따라 내려가고, 광계 Ⅰ의 P700에서 다시 빛으로 끌어올려져 페레독신(Fd)을 거쳐 NADP⁺(−0.32 V)를 환원한다. 점선은 Fd에서 b₆f로 돌아가는 순환 전자 흐름이다. 중간 운반체의 전위는 대략값이다.</desc>
  <defs>
    <marker id="ubio-3-z-a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-ink)"/></marker>
    <marker id="ubio-3-z-a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-amber)"/></marker>
    <marker id="ubio-3-z-a-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-violet)"/></marker>
  </defs>
