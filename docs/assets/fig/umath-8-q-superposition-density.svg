    .u8sd-t{font-size:14px;fill:var(--fig-ink)}
    .u8sd-s{font-size:13px;fill:var(--fig-muted)}
    .u8sd-b{font-size:14px;fill:var(--fig-ink);font-weight:600}
    .u8sd-tk{stroke:var(--fig-ink);stroke-width:1.2}
    .u8sd-c{stroke:var(--fig-violet);stroke-width:2.6;fill:none}
    .u8sd-fl{fill:var(--fig-soft-violet)}
    .u8sd-wall{fill:var(--fig-line);fill-opacity:0.5}
    .u8sd-mid{stroke:var(--fig-muted);stroke-width:1;stroke-dasharray:4 3;fill:none}

  </style>
