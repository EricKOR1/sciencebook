<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t-umath-8-q-superposition-density d-umath-8-q-superposition-density">
  <title id="t-umath-8-q-superposition-density">그림 수학 도구 8-13 문제 14 해설: 두 정상 상태가 겹친 확률 밀도의 시간 변화</title>
  <desc id="d-umath-8-q-superposition-density">무한 우물(0~L)에서 |Ψ(x, t)|² = ½[ψ₁² + ψ₂² + 2ψ₁ψ₂ cos(Δω t)]를 Δω t = 0, π/2, π에 그렸다. t = 0에는 확률이 왼쪽(x &amp;lt; L/2)에, t = T/2에는 오른쪽에 몰리고, t = T/4에는 좌우 대칭이다(T ≈ 3.7 fs).</desc>
