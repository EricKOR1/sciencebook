<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 486" role="img" aria-labelledby="t-astro-1-lagrange-points d-astro-1-lagrange-points">
  <title id="t-astro-1-lagrange-points">그림 행성우주과학 1-2 태양–지구계의 라그랑주점과 우주 망원경의 위치</title>
  <desc id="d-astro-1-lagrange-points">태양과 지구의 중력, 공전 운동이 균형을 이루는 다섯 점이다. L1은 태양과 지구 사이, L2는 지구 바깥쪽 태양 반대편에 있으며 둘 다 지구에서 약 150만 km 떨어져 있다. L1에는 태양 관측·태양풍 감시 위성이, L2에는 제임스 웹 우주 망원경이 있다. L4와 L5는 지구 궤도에서 60° 앞뒤에 있다. L1·L2의 거리를 크게 과장한 모식도이다.</desc>
  <style>.astro-1-lagrange-points-ink{fill:var(--fig-ink)} .astro-1-lagrange-points-mut{fill:var(--fig-muted)} .astro-1-lagrange-points-t{font-size:14px;fill:var(--fig-ink)} .astro-1-lagrange-points-s{font-size:13px;fill:var(--fig-muted)} .astro-1-lagrange-points-b{font-weight:600} .astro-1-lagrange-points-ax{stroke:var(--fig-line);stroke-width:1.5;fill:none}</style>
  <circle cx="290.0" cy="240.0" r="210.0" style="fill:none;stroke:var(--fig-line);stroke-width:1.4;stroke-dasharray:6 5"/>
  <path d="M489.7 175.1 L487.3 168.2 L484.7 161.3 L481.8 154.6 L478.7 147.9 L475.4 141.4 L471.9 135.0 L468.1 128.7" style="fill:none;stroke:var(--fig-blue);stroke-width:2"/>
  <path d="M468.1 128.7 L476.2 134.6 L469.5 138.6 Z" style="fill:var(--fig-blue)"/>
  <text x="458.1" y="132.7" text-anchor="end" class="astro-1-lagrange-points-s" style="fill:var(--fig-blue)">지구의 공전 방향</text>
  <line x1="290.0" y1="240.0" x2="580.0" y2="240.0" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:2 4"/>
  <circle cx="290.0" cy="240.0" r="30.0" style="fill:var(--fig-amber);stroke:none;stroke-width:1"/>
  <text x="290.0" y="290.0" text-anchor="middle" class="astro-1-lagrange-points-t astro-1-lagrange-points-b">태양</text>
  <circle cx="500.0" cy="240.0" r="9.0" style="fill:var(--fig-blue);stroke:var(--fig-panel);stroke-width:2"/>
  <text x="504.0" y="270.0" text-anchor="middle" class="astro-1-lagrange-points-t astro-1-lagrange-points-b" style="fill:var(--fig-blue)">지구</text>
  <path d="M443.0 233.0 L457.0 247.0 M443.0 247.0 L457.0 233.0" style="fill:none;stroke:var(--fig-red);stroke-width:2.4"/>
  <path d="M543.0 233.0 L557.0 247.0 M543.0 247.0 L557.0 233.0" style="fill:none;stroke:var(--fig-red);stroke-width:2.4"/>
  <path d="M73.0 233.0 L87.0 247.0 M73.0 247.0 L87.0 233.0" style="fill:none;stroke:var(--fig-red);stroke-width:2.4"/>
  <path d="M388.0 51.1 L402.0 65.1 M388.0 65.1 L402.0 51.1" style="fill:none;stroke:var(--fig-red);stroke-width:2.4"/>
  <path d="M388.0 414.9 L402.0 428.9 M388.0 428.9 L402.0 414.9" style="fill:none;stroke:var(--fig-red);stroke-width:2.4"/>
  <text x="450.0" y="226.0" text-anchor="middle" class="astro-1-lagrange-points-t astro-1-lagrange-points-b" style="fill:var(--fig-red)">L1</text>
  <text x="550.0" y="226.0" text-anchor="middle" class="astro-1-lagrange-points-t astro-1-lagrange-points-b" style="fill:var(--fig-red)">L2</text>
  <text x="68.0" y="245.0" text-anchor="end" class="astro-1-lagrange-points-t astro-1-lagrange-points-b" style="fill:var(--fig-red)">L3</text>
  <text x="409.0" y="52.1" text-anchor="start" class="astro-1-lagrange-points-t astro-1-lagrange-points-b" style="fill:var(--fig-red)">L4</text>
  <text x="409.0" y="437.9" text-anchor="start" class="astro-1-lagrange-points-t astro-1-lagrange-points-b" style="fill:var(--fig-red)">L5</text>
  <line x1="290.0" y1="240.0" x2="395.0" y2="58.1" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 3"/>
  <line x1="290.0" y1="240.0" x2="395.0" y2="421.9" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 3"/>
  <path d="M350.0 240.0 L349.8 234.8 L349.1 229.6 L348.0 224.5 L346.4 219.5 L344.4 214.6 L342.0 210.0 L339.1 205.6 L336.0 201.4 L332.4 197.6 L328.6 194.0 L324.4 190.9 L320.0 188.0" style="fill:none;stroke:var(--fig-muted);stroke-width:1.2"/>
  <text x="356.0" y="210.0" text-anchor="start" class="astro-1-lagrange-points-s">60°</text>
  <line x1="450.0" y1="248.0" x2="470.0" y2="316.0" style="stroke:var(--fig-line);stroke-width:1"/>
  <line x1="550.0" y1="220.0" x2="590.0" y2="130.0" style="stroke:var(--fig-line);stroke-width:1"/>
  <rect x="470.0" y="302.0" width="236.0" height="56.0" rx="6" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1"/>
  <text x="480.0" y="322.0" text-anchor="start" class="astro-1-lagrange-points-t astro-1-lagrange-points-b">L1: 늘 태양을 마주 본다</text>
  <text x="480.0" y="344.0" text-anchor="start" class="astro-1-lagrange-points-s">태양 관측 위성, 태양풍 감시 위성</text>
  <rect x="520.0" y="64.0" width="190.0" height="66.0" rx="6" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1"/>
  <text x="530.0" y="84.0" text-anchor="start" class="astro-1-lagrange-points-t astro-1-lagrange-points-b">L2: 제임스 웹 망원경</text>
  <text x="530.0" y="104.0" text-anchor="start" class="astro-1-lagrange-points-s">태양·지구·달이 늘 같은</text>
  <text x="530.0" y="122.0" text-anchor="start" class="astro-1-lagrange-points-s">쪽에 있어 한 번에 가린다</text>
  <text x="20.0" y="26.0" text-anchor="start" class="astro-1-lagrange-points-t astro-1-lagrange-points-b">L1·L2: 지구에서 약 150만 km (태양–지구 거리의 약 1/100)</text>
  <text x="20.0" y="46.0" text-anchor="start" class="astro-1-lagrange-points-s" style="paint-order:stroke;stroke:var(--fig-panel);stroke-width:5px;stroke-linejoin:round">그림에서는 L1·L2를 지구에서 멀리 떨어뜨려 과장했다</text>
  <text x="20.0" y="474.0" text-anchor="start" class="astro-1-lagrange-points-s">L4·L5: 태양·지구와 정삼각형을 이루는 점. 목성의 L4·L5 부근에는 트로이군 소행성이 모여 있다.</text>
</svg>
