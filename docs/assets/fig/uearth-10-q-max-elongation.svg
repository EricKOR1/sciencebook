  <text x="230.0" y="286.0" text-anchor="middle" class="uearth-10-q-max-elongation-lbl uearth-10-q-max-elongation-b">지구</text>
  <text x="304.3" y="203.9" class="uearth-10-q-max-elongation-lbl uearth-10-q-max-elongation-b">행성</text>
  <text x="304.3" y="220.9" class="uearth-10-q-max-elongation-sm">(최대 이각)</text>
  <text x="271.2" y="164.4" class="uearth-10-q-max-elongation-lbl uearth-10-q-max-elongation-b" style="fill:var(--fig-teal);font-style:italic">r</text>
