<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 310" class="fig-small" role="img" aria-labelledby="t-uearth-10-q-max-elongation d-uearth-10-q-max-elongation">
  <title id="t-uearth-10-q-max-elongation">그림 일반지구과학 10-11 문제 12 풀이 — 최대 이각의 기하</title>
  <desc id="d-uearth-10-q-max-elongation">최대 이각일 때 지구에서 행성을 보는 시선이 행성 궤도에 접하므로, 태양–행성–지구가 행성에서 직각을 이룬다. 지구에서 잰 태양과 행성 사이의 각이 47°이므로 r = 1 AU × sin 47°이다. 북쪽에서 본 모식도.</desc>
  <style>.uearth-10-q-max-elongation-lbl{font-size:14px;fill:var(--fig-ink)} .uearth-10-q-max-elongation-sm{font-size:13px;fill:var(--fig-muted)} .uearth-10-q-max-elongation-b{font-weight:600} .uearth-10-q-max-elongation-ax{stroke:var(--fig-ink);stroke-width:1.2;fill:none} .uearth-10-q-max-elongation-grid{stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3;fill:none} </style>
  <circle cx="230.0" cy="135.0" r="125.0" style="fill:none;stroke:var(--fig-line);stroke-width:1.4;stroke-dasharray:5 4"/>
  <circle cx="230.0" cy="135.0" r="91.4" style="fill:none;stroke:var(--fig-teal);stroke-width:1.4;stroke-dasharray:5 4"/>
  <line x1="230.0" y1="260.0" x2="230.0" y2="135.0" style="stroke:var(--fig-ink);stroke-width:1.6"/>
  <line x1="230.0" y1="260.0" x2="292.3" y2="201.9" style="stroke:var(--fig-ink);stroke-width:1.6"/>
  <line x1="230.0" y1="135.0" x2="292.3" y2="201.9" style="stroke:var(--fig-teal);stroke-width:2"/>
  <line x1="292.3" y1="201.9" x2="328.9" y2="167.8" style="stroke:var(--fig-ink);stroke-width:1;stroke-dasharray:3 3"/>
  <polyline points="284.8,193.8 276.8,201.3 284.3,209.4" style="fill:none;stroke:var(--fig-red);stroke-width:1.4"/>
  <path d="M230.0 218.0 A42 42 0 0 1 260.7 231.4" style="fill:none;stroke:var(--fig-red);stroke-width:1.6"/>
  <text x="254.3" y="212.6" text-anchor="middle" class="uearth-10-q-max-elongation-lbl uearth-10-q-max-elongation-b" style="fill:var(--fig-red)">47°</text>
  <circle cx="230.0" cy="135.0" r="11" style="fill:#f4b400;stroke:var(--fig-amber);stroke-width:1.6"/>
  <circle cx="230.0" cy="260.0" r="7" style="fill:var(--fig-blue);stroke:var(--fig-ink);stroke-width:1"/>
  <circle cx="292.3" cy="201.9" r="6" style="fill:var(--fig-teal);stroke:var(--fig-ink);stroke-width:1"/>
