<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-ubio-8-tree-reading d-ubio-8-tree-reading">
<title id="t-ubio-8-tree-reading">그림 일반생명과학 8-5 계통수 읽기</title>
<desc id="d-ubio-8-tree-reading">왼쪽: 계통수의 뿌리, 분기점(가장 최근 공통 조상), 자매군, 기저 분류군. 오른쪽: 두 분기점에서 가지를 돌려 그린 같은 나무. 끝에 늘어선 이름의 순서가 바뀌어 사람이 개구리 옆에 놓여도, 사람은 여전히 개구리보다 도마뱀·새와 더 최근의 공통 조상을 공유한다. 가지 길이는 시간을 뜻하지 않는다.</desc>
