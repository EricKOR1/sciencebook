  <line x1="650" y1="170" x2="650" y2="249" style="stroke:var(--fig-muted);stroke-width:1;stroke-linecap:round;stroke-dasharray:3 3"/>
  <line x1="470" y1="220" x2="470" y2="249" style="stroke:var(--fig-muted);stroke-width:1;stroke-linecap:round;stroke-dasharray:3 3"/>
  <line x1="320" y1="245" x2="176" y2="245" style="stroke:var(--fig-muted);stroke-width:1.3;stroke-linecap:butt"/>
