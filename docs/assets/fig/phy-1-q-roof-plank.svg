  <line x1="400" y1="134" x2="409" y2="158" style="stroke:var(--fig-ink);stroke-width:2.5;stroke-linecap:round"/>
  <line x1="400" y1="113" x2="390" y2="126" style="stroke:var(--fig-ink);stroke-width:2.5;stroke-linecap:round"/>
  <line x1="400" y1="113" x2="411" y2="124" style="stroke:var(--fig-ink);stroke-width:2.5;stroke-linecap:round"/>
  <text x="400" y="78" text-anchor="middle" class="phy-1-q-roof-plank-t">사람 600 N</text>
