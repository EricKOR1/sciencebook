<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-m2-02-earth-layers d-m2-02-earth-layers">
  <title id="t-m2-02-earth-layers">그림 중2-2-1 지권의 층상 구조</title>
  <desc id="d-m2-02-earth-layers">지구를 반으로 자른 모식도. 겉에서부터 지각, 맨틀, 외핵, 내핵으로 나뉘며, 외핵만 액체이고 나머지는 고체이다.</desc>
  <style>.m2-02-earth-layers-t{font-size:15px;font-weight:600;fill:var(--fig-ink)} .m2-02-earth-layers-s{font-size:13px;fill:var(--fig-muted)} .m2-02-earth-layers-ld{stroke:var(--fig-muted);stroke-width:1}</style>
  <path d="M250 35.0 A180.0 180.0 0 0 1 250 395.0 Z" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.5"/>
  <path d="M250 43.0 A172.0 172.0 0 0 1 250 387.0 Z" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <path d="M250 117.1 A97.9 97.9 0 0 1 250 312.9 Z" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5"/>
  <path d="M250 180.7 A34.3 34.3 0 0 1 250 249.3 Z" style="fill:var(--fig-amber);stroke:var(--fig-red);stroke-width:1.5"/>
  <path d="M250 35 A180 180 0 0 0 250 395 Z" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
  <text x="160" y="220" text-anchor="middle" class="m2-02-earth-layers-s">지구의 겉모습</text>
  <line x1="250" y1="29" x2="250" y2="401" style="stroke:var(--fig-ink);stroke-width:1.5"/>
  <circle cx="332.6" cy="59.6" r="3" style="fill:var(--fig-ink)"/>
  <polyline points="332.6,59.6 470,65 482,65" style="fill:none;stroke:var(--fig-muted);stroke-width:1"/>
  <text x="488" y="70" class="m2-02-earth-layers-t" style="fill:var(--fig-green)">지각</text>
  <text x="488" y="90" class="m2-02-earth-layers-s">고체 · 가장 바깥의 얇은 겉껍질</text>
  <circle cx="366.9" cy="147.5" r="3" style="fill:var(--fig-ink)"/>
  <polyline points="366.9,147.5 470,145 482,145" style="fill:none;stroke:var(--fig-muted);stroke-width:1"/>
  <text x="488" y="150" class="m2-02-earth-layers-t" style="fill:var(--fig-amber)">맨틀</text>
  <text x="488" y="170" class="m2-02-earth-layers-s">고체 · 가장 두꺼운 층</text>
  <circle cx="315.5" cy="224.2" r="3" style="fill:var(--fig-ink)"/>
  <polyline points="315.5,224.2 470,230 482,230" style="fill:none;stroke:var(--fig-muted);stroke-width:1"/>
  <text x="488" y="235" class="m2-02-earth-layers-t" style="fill:var(--fig-red)">외핵</text>
  <text x="488" y="255" class="m2-02-earth-layers-s">액체 · 네 층 중 유일한 액체</text>
  <circle cx="260.0" cy="221.0" r="3" style="fill:var(--fig-ink)"/>
  <polyline points="260.0,221.0 470,315 482,315" style="fill:none;stroke:var(--fig-muted);stroke-width:1"/>
  <text x="488" y="320" class="m2-02-earth-layers-t" style="fill:var(--fig-red)">내핵</text>
  <text x="488" y="340" class="m2-02-earth-layers-s">고체 · 지구의 중심</text>
  <text x="360" y="424" text-anchor="middle" class="m2-02-earth-layers-s">지구 반지름 약 6400 km · 지각은 실제보다 두껍게 그린 모식도</text>
</svg>
