  <line x1="90" y1="275" x2="90" y2="287" class="f5-3-q-bottle-setup-dim"/><line x1="490" y1="275" x2="490" y2="287" class="f5-3-q-bottle-setup-dim"/>
  <text x="290" y="275" text-anchor="middle" class="f5-3-q-bottle-setup-t">25 cm</text>
  <text x="686" y="280" text-anchor="end" class="f5-3-q-bottle-setup-s">가운데 붉은 점: 온도계</text>
</svg>
