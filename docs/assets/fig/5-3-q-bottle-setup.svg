<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-5-3-q-bottle-setup d-5-3-q-bottle-setup">
  <title id="t-5-3-q-bottle-setup">그림 5-3-9 문제 13의 실험 배치(위에서 본 모습)</title>
  <desc id="d-5-3-q-bottle-setup">문제 13의 실험 기록대로 배치한 모습을 위에서 본 것이다. 광원에서 B(초록색 병, 이산화 탄소)까지 15 cm, A(투명 병, 공기)까지 25 cm이며 거리 비율을 기록에 맞추어 그렸다.</desc>
  <style>.f5-3-q-bottle-setup-tb{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2} .f5-3-q-bottle-setup-lamp{fill:#ffd54a;stroke:var(--fig-ink);stroke-width:1.4} .f5-3-q-bottle-setup-ray{stroke:var(--fig-amber);stroke-width:1.4;stroke-dasharray:4 4;fill:none} .f5-3-q-bottle-setup-gb{fill:#4caf50;fill-opacity:0.55;stroke:#2e7d32;stroke-width:2} .f5-3-q-bottle-setup-cb{fill:var(--fig-paper);fill-opacity:0.4;stroke:var(--fig-ink);stroke-width:2} .f5-3-q-bottle-setup-th{fill:var(--fig-red);stroke:var(--fig-ink);stroke-width:1} .f5-3-q-bottle-setup-dim{stroke:var(--fig-ink);stroke-width:1.2;fill:none} .f5-3-q-bottle-setup-dh{fill:var(--fig-ink)} .f5-3-q-bottle-setup-t{font-size:14px;font-weight:600;fill:var(--fig-ink)} .f5-3-q-bottle-setup-s{font-size:13px;fill:var(--fig-muted)} .f5-3-q-bottle-setup-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}</style>
  <rect x="20" y="30" width="680" height="260" rx="10" class="f5-3-q-bottle-setup-tb"/>
  <text x="686" y="54" text-anchor="end" class="f5-3-q-bottle-setup-s">실험대(위에서 본 모습)</text>
  <line x1="90" y1="165" x2="300" y2="95" class="f5-3-q-bottle-setup-ray"/>
  <line x1="90" y1="165" x2="460" y2="235" class="f5-3-q-bottle-setup-ray"/>
  <line x1="70.9" y1="154" x2="55.4" y2="145" class="f5-3-q-bottle-setup-ray" style="stroke-dasharray:none"/>
  <line x1="70.9" y1="176" x2="55.4" y2="185" class="f5-3-q-bottle-setup-ray" style="stroke-dasharray:none"/>
  <line x1="68" y1="165" x2="50" y2="165" class="f5-3-q-bottle-setup-ray" style="stroke-dasharray:none"/>
  <line x1="79" y1="145.9" x2="70" y2="130.4" class="f5-3-q-bottle-setup-ray" style="stroke-dasharray:none"/>
  <line x1="79" y1="184.1" x2="70" y2="199.6" class="f5-3-q-bottle-setup-ray" style="stroke-dasharray:none"/>
  <circle cx="90" cy="165" r="18" class="f5-3-q-bottle-setup-lamp"/>
  <text x="90" y="205" text-anchor="middle" class="f5-3-q-bottle-setup-t">광원</text>
  <circle cx="330" cy="95" r="28" class="f5-3-q-bottle-setup-gb"/><circle cx="330" cy="95" r="5" class="f5-3-q-bottle-setup-th"/>
  <circle cx="490" cy="235" r="28" class="f5-3-q-bottle-setup-cb"/><circle cx="490" cy="235" r="5" class="f5-3-q-bottle-setup-th"/>
  <text x="370" y="91" class="f5-3-q-bottle-setup-h">B</text><text x="370" y="110" class="f5-3-q-bottle-setup-s">초록색 병, 이산화 탄소</text>
  <text x="530" y="231" class="f5-3-q-bottle-setup-h">A</text><text x="530" y="250" class="f5-3-q-bottle-setup-s">투명 병, 공기</text>
  <line x1="90" y1="49" x2="330" y2="49" class="f5-3-q-bottle-setup-dim"/>
  <path d="M90 49 L98 53 L98 45 Z" class="f5-3-q-bottle-setup-dh"/><path d="M330 49 L322 45 L322 53 Z" class="f5-3-q-bottle-setup-dh"/>
  <line x1="90" y1="43" x2="90" y2="55" class="f5-3-q-bottle-setup-dim"/><line x1="330" y1="43" x2="330" y2="55" class="f5-3-q-bottle-setup-dim"/>
  <text x="210" y="43" text-anchor="middle" class="f5-3-q-bottle-setup-t">15 cm</text>
  <line x1="90" y1="281" x2="490" y2="281" class="f5-3-q-bottle-setup-dim"/>
