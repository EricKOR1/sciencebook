<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="t-chem-3-dynamic-equilibrium d-chem-3-dynamic-equilibrium">
  <title id="t-chem-3-dynamic-equilibrium">그림 화학 3-2 N₂O₄ ⇌ 2NO₂가 평형에 이르는 과정(입자 모형)</title>
  <desc id="d-chem-3-dynamic-equilibrium">1 L 용기에 N₂O₄ 1.0 mol을 넣으면 정반응이 점점 느려지고 역반응이 점점 빨라진다. 두 반응의 속도가 같아지면 N₂O₄ 0.8 M, NO₂ 0.4 M에서 농도가 더 변하지 않지만, 분자 수준에서는 두 반응이 계속 일어난다(동적 평형). 입자 1개는 0.1 M에 해당한다.</desc>
