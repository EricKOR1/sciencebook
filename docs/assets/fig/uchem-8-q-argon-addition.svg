  <title id="t-uchem-8-q-argon-addition">그림 일반화학 8-8 문제 15의 세 용기</title>
  <desc id="d-uchem-8-q-argon-addition">입자 모형(모식도)이다. (가) N₂O₄ ⇌ 2NO₂가 전체 1.00 bar에서 평형을 이룬 용기(N₂O₄ 13개, NO₂ 6개). (나) 부피를 그대로 두고 아르곤을 넣어 전체 2.00 bar로 만든 직후. (다) 피스톤으로 전체 압력을 1.00 bar로 유지하며 아르곤을 넣어 부피가 2배가 된 직후. 아르곤은 (나), (다) 모두 19개이다.</desc>
