<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-ubio-5-crossover d-ubio-5-crossover">
  <title id="t-ubio-5-crossover">그림 일반생명과학 5-1 교차와 재조합형 염색 분체</title>
  <desc id="d-ubio-5-crossover">감수 1분열 전기에 2가 염색체의 비자매 염색 분체 두 개가 유전자 A와 B 사이에서 일부를 교환하면, 네 염색 분체 가운데 두 개(Ab, aB)가 재조합형이 되고 두 개(AB, ab)는 어버이형으로 남는다. 재조합 빈도 1%를 지도 거리 1 cM으로 정한다.</desc>
  <style>.ubio-5-crossover-t{font-size:14px;fill:var(--fig-ink)} .ubio-5-crossover-s{font-size:13px;fill:var(--fig-muted)} .ubio-5-crossover-b{font-size:14px;fill:var(--fig-ink);font-weight:600} .ubio-5-crossover-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-5-crossover-m{font-size:13px;fill:var(--fig-ink)}</style>
  <defs><marker id="ubio-5-crossover-ar0" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-ink)"/></marker></defs>
  <text x="180.0" y="24.0" text-anchor="middle" class="ubio-5-crossover-b">① 전기 Ⅰ: 2가 염색체에서 교차</text>
  <text x="540.0" y="24.0" text-anchor="middle" class="ubio-5-crossover-b">② 감수 분열 뒤의 네 염색 분체</text>
  <rect x="50.0" y="60.0" width="260.0" height="20.0" rx="9" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <rect x="50.0" y="156.0" width="260.0" height="20.0" rx="9" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
  <rect x="50.0" y="86.0" width="140.0" height="20.0" rx="9" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <rect x="50.0" y="130.0" width="140.0" height="20.0" rx="9" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
  <rect x="202.0" y="86.0" width="108.0" height="20.0" rx="9" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
  <rect x="202.0" y="130.0" width="108.0" height="20.0" rx="9" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <path d="M188 96 C196 96 196 140 204 140" style="fill:none;stroke:var(--fig-blue);stroke-width:6"/>
  <path d="M188 140 C196 140 196 96 204 96" style="fill:none;stroke:var(--fig-red);stroke-width:6"/>
  <circle cx="78.0" cy="83.0" r="9" style="fill:var(--fig-ink)"/>
  <circle cx="78.0" cy="153.0" r="9" style="fill:var(--fig-ink)"/>
  <text x="120.0" y="75.0" text-anchor="middle" class="ubio-5-crossover-b">A</text>
  <text x="260.0" y="75.0" text-anchor="middle" class="ubio-5-crossover-b">B</text>
  <text x="120.0" y="101.0" text-anchor="middle" class="ubio-5-crossover-b">A</text>
  <text x="260.0" y="101.0" text-anchor="middle" class="ubio-5-crossover-b">b</text>
  <text x="120.0" y="145.0" text-anchor="middle" class="ubio-5-crossover-b">a</text>
  <text x="260.0" y="145.0" text-anchor="middle" class="ubio-5-crossover-b">B</text>
  <text x="120.0" y="171.0" text-anchor="middle" class="ubio-5-crossover-b">a</text>
  <text x="260.0" y="171.0" text-anchor="middle" class="ubio-5-crossover-b">b</text>
  <text x="196.0" y="206.0" text-anchor="middle" class="ubio-5-crossover-s">키아즈마(교차 지점)</text>
  <line x1="196.0" y1="192.0" x2="196.0" y2="176.0" style="fill:none;stroke:var(--fig-muted);stroke-width:1.2"/>
  <text x="318.0" y="88.0" text-anchor="start" class="ubio-5-crossover-s" style="fill:var(--fig-blue)">자매 염색 분체</text>
  <text x="318.0" y="158.0" text-anchor="start" class="ubio-5-crossover-s" style="fill:var(--fig-red)">자매 염색 분체</text>
  <text x="180.0" y="236.0" text-anchor="middle" class="ubio-5-crossover-s">파랑: 어머니에게서, 빨강: 아버지에게서 받은 상동 염색체</text>
  <line x1="396.0" y1="118.0" x2="440.0" y2="118.0" style="fill:none;stroke:var(--fig-ink);stroke-width:2" marker-end="url(#ubio-5-crossover-ar0)"/>
  <rect x="456.0" y="48.0" width="84.0" height="20.0" rx="9" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <rect x="540.0" y="48.0" width="80.0" height="20.0" rx="9" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <circle cx="470.0" cy="58.0" r="6" style="fill:var(--fig-ink)"/>
  <text x="500.0" y="63.0" text-anchor="middle" class="ubio-5-crossover-b">A</text>
  <text x="586.0" y="63.0" text-anchor="middle" class="ubio-5-crossover-b">B</text>
  <text x="632.0" y="63.0" text-anchor="start" class="ubio-5-crossover-s">어버이형</text>
  <rect x="456.0" y="88.0" width="84.0" height="20.0" rx="9" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <rect x="540.0" y="88.0" width="80.0" height="20.0" rx="9" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
  <circle cx="470.0" cy="98.0" r="6" style="fill:var(--fig-ink)"/>
  <text x="500.0" y="103.0" text-anchor="middle" class="ubio-5-crossover-b">A</text>
  <text x="586.0" y="103.0" text-anchor="middle" class="ubio-5-crossover-b">b</text>
  <text x="632.0" y="103.0" text-anchor="start" class="ubio-5-crossover-b" style="fill:var(--fig-violet)">재조합형</text>
  <rect x="456.0" y="128.0" width="84.0" height="20.0" rx="9" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
  <rect x="540.0" y="128.0" width="80.0" height="20.0" rx="9" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.8"/>
  <circle cx="470.0" cy="138.0" r="6" style="fill:var(--fig-ink)"/>
  <text x="500.0" y="143.0" text-anchor="middle" class="ubio-5-crossover-b">a</text>
  <text x="586.0" y="143.0" text-anchor="middle" class="ubio-5-crossover-b">B</text>
  <text x="632.0" y="143.0" text-anchor="start" class="ubio-5-crossover-b" style="fill:var(--fig-violet)">재조합형</text>
  <rect x="456.0" y="168.0" width="84.0" height="20.0" rx="9" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
  <rect x="540.0" y="168.0" width="80.0" height="20.0" rx="9" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.8"/>
  <circle cx="470.0" cy="178.0" r="6" style="fill:var(--fig-ink)"/>
  <text x="500.0" y="183.0" text-anchor="middle" class="ubio-5-crossover-b">a</text>
  <text x="586.0" y="183.0" text-anchor="middle" class="ubio-5-crossover-b">b</text>
  <text x="632.0" y="183.0" text-anchor="start" class="ubio-5-crossover-s">어버이형</text>
  <text x="540.0" y="236.0" text-anchor="middle" class="ubio-5-crossover-s">한 번의 교차 → 네 개 중 두 개만 재조합형</text>
  <rect x="30.0" y="256.0" width="660.0" height="62.0" rx="10" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="360.0" y="280.0" text-anchor="middle" class="ubio-5-crossover-t">재조합 빈도 = 재조합형 자손 수 ÷ 전체 자손 수 × 100%,   1% = 지도 거리 1 cM</text>
  <text x="360.0" y="304.0" text-anchor="middle" class="ubio-5-crossover-s">두 유전자 사이가 멀수록 그 사이에서 교차가 일어날 확률이 커진다(재조합 빈도는 최대 50%).</text>
</svg>
