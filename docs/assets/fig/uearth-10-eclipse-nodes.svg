  <title id="t-uearth-10-eclipse-nodes">그림 일반지구과학 10-2 교점선과 식 계절</title>
  <desc id="d-uearth-10-eclipse-nodes">달의 궤도면(백도)은 황도면에 기울어 있고 두 면이 만나는 교점선은 공간에서 거의 같은 방향을 유지한다. 교점선이 태양을 향하는 두 시기(약 반년 간격)에는 삭과 망이 교점 근처에서 일어나 일식과 월식이 생기고, 그 사이 시기에는 달이 태양–지구 선의 위나 아래로 비켜 지나가 식이 일어나지 않는다.</desc>
