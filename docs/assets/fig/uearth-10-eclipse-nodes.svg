<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-uearth-10-eclipse-nodes d-uearth-10-eclipse-nodes">
  <title id="t-uearth-10-eclipse-nodes">그림 일반지구과학 10-6 교점선과 식 계절</title>
  <desc id="d-uearth-10-eclipse-nodes">왼쪽: 위에서 본 지구 공전 궤도. 달 궤도면(백도)과 황도면이 만나는 교점선은 공간에서 거의 같은 방향을 유지하므로, 1년에 두 번(약 173일 간격) 교점선이 태양을 향한다. 오른쪽: 옆에서 본 모습. 교점선이 태양을 향하면 삭의 달이 교점, 곧 황도면 안에 있어 그림자가 지구에 닿고(일식), 교점선이 태양 방향과 직각이면 달이 황도면 위나 아래로 비켜 지나가 식이 일어나지 않는다.</desc>
