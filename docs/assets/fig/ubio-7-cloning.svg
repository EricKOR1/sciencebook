<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-ubio-7-cloning d-ubio-7-cloning">
<title id="t-ubio-7-cloning">그림 일반생명과학 7-7 플라스미드를 이용한 유전자 클로닝과 청·백 선별</title>
<desc id="d-ubio-7-cloning">① 플라스미드 벡터는 복제 원점, 앰피실린 내성 유전자, lacZ 안의 다중 클로닝 자리를 가진다. ② 벡터와 외부 DNA를 같은 제한 효소(예: EcoRI)로 잘라 상보적인 점착 말단을 만든다. ③ DNA 연결 효소로 이으면 외부 DNA가 lacZ를 끊은 재조합 플라스미드가 된다. ④ 대장균에 넣어 앰피실린·X-gal·IPTG 배지에서 키우면 빈 벡터를 가진 집락은 파란색, 재조합 플라스미드를 가진 집락은 흰색이 된다. 모식도이다.</desc>
<style>
.ubio-7-cloning-h{font-size:14px;font-weight:700;fill:var(--fig-ink)} .ubio-7-cloning-t{font-size:13px;fill:var(--fig-ink)} .ubio-7-cloning-s{font-size:13px;fill:var(--fig-muted)} .ubio-7-cloning-b{font-size:13px;font-weight:700;fill:var(--fig-ink)}
.ubio-7-cloning-it{font-size:13px;font-style:italic;fill:var(--fig-ink)}
</style>
