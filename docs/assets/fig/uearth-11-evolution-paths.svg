  <line x1="432" y1="278.0" x2="449" y2="278.0" style="stroke:var(--fig-muted);stroke-width:1.4" marker-end="url(#uearth-11-evolution-paths-ar)"/>
  <rect x="452" y="250" width="110" height="56" rx="8" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4"/>
