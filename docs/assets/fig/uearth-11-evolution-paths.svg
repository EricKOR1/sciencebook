  <rect x="584" y="40" width="128" height="56" rx="8" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1.4;stroke-dasharray:5 4"/>
  <text x="648.0" y="64" text-anchor="middle" class="uearth-11-evolution-paths-h">아직 진화를 끝낸</text>
  <text x="648.0" y="82" text-anchor="middle" class="uearth-11-evolution-paths-s">별이 없다</text>
