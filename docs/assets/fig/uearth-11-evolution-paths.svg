<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="t-uearth-11-evolution-paths d-uearth-11-evolution-paths">
  <title id="t-uearth-11-evolution-paths">그림 일반지구과학 11-2 질량에 따라 갈리는 별의 일생</title>
  <desc id="d-uearth-11-evolution-paths">처음 질량이 작은 별일수록 주계열에 오래 머문다. 태양 정도의 별은 적색 거성과 점근 거성 가지를 거쳐 행성상 성운과 백색 왜성을 남기고, 약 8배보다 무거운 별은 초거성이 되어 철 핵을 만든 뒤 핵붕괴 초신성으로 폭발하여 중성자별이나 블랙홀을 남긴다.</desc>
  <style>
    .uearth-11-evolution-paths-h{font-size:13px;font-weight:600;fill:var(--fig-ink)}
    .uearth-11-evolution-paths-t{font-size:13px;fill:var(--fig-ink)}
    .uearth-11-evolution-paths-s{font-size:12px;fill:var(--fig-muted)}
  </style>
  <defs><marker id="uearth-11-evolution-paths-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--fig-muted)"/></marker></defs>
  <text x="204.0" y="24" text-anchor="middle" class="uearth-11-evolution-paths-s" style="font-weight:600">주계열</text>
