  <text x="648.0" y="292" text-anchor="middle" class="uearth-11-evolution-paths-s">약 3 M☉ 이상, Rs = 2GM/c²</text>
  <text x="10" y="342" class="uearth-11-evolution-paths-h">무거운 별의 마지막 단계 — 양파 껍질 구조(모식도)</text>
