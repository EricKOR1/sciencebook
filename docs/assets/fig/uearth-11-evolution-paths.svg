  <text x="507.0" y="222" text-anchor="middle" class="uearth-11-evolution-paths-s">Ⅱ형 등</text>
  <line x1="564" y1="208.0" x2="581" y2="208.0" style="stroke:var(--fig-muted);stroke-width:1.4" marker-end="url(#uearth-11-evolution-paths-ar)"/>
  <rect x="584" y="180" width="128" height="56" rx="8" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.4"/>
  <text x="648.0" y="204" text-anchor="middle" class="uearth-11-evolution-paths-h">중성자별</text>
