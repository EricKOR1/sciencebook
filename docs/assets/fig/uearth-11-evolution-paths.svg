  <text x="507.0" y="292" text-anchor="middle" class="uearth-11-evolution-paths-s">(초신성)</text>
  <line x1="564" y1="278.0" x2="581" y2="278.0" style="stroke:var(--fig-muted);stroke-width:1.4" marker-end="url(#uearth-11-evolution-paths-ar)"/>
