  <text x="360.0" y="204" text-anchor="middle" class="uearth-11-evolution-paths-h">적색 초거성</text>
  <text x="360.0" y="222" text-anchor="middle" class="uearth-11-evolution-paths-s">C·Ne·O·Si 핵융합→철 핵</text>
  <line x1="432" y1="208.0" x2="449" y2="208.0" style="stroke:var(--fig-muted);stroke-width:1.4" marker-end="url(#uearth-11-evolution-paths-ar)"/>
  <rect x="452" y="180" width="110" height="56" rx="8" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.4"/>
