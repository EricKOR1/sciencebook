  <text x="140" y="475" text-anchor="middle" class="uearth-11-evolution-paths-s" style="fill:var(--fig-paper);font-size:11px;font-weight:600">Fe</text>
  <text x="280" y="386" class="uearth-11-evolution-paths-t">안쪽으로 갈수록 더 무거운 원소를 더 높은 온도에서 태운다.</text>
  <text x="280" y="406" class="uearth-11-evolution-paths-t">뒤 단계의 연료일수록 내는 에너지가 적어 단계마다 시간이 짧아진다.</text>
  <text x="280" y="426" class="uearth-11-evolution-paths-t">철은 핵융합으로 에너지를 낼 수 없다 → 철 핵이 약 1.4 M☉를</text>
  <text x="280" y="446" class="uearth-11-evolution-paths-t">넘으면 1초도 안 되어 붕괴한다(핵붕괴 초신성).</text>
  <text x="280" y="466" class="uearth-11-evolution-paths-s">경계 질량은 질량 손실·금속 함량에 따라 달라 대략적인 값이다.</text>
