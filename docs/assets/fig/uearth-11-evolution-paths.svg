  <text x="507.0" y="24" text-anchor="middle" class="uearth-11-evolution-paths-s" style="font-weight:600">마지막 사건</text>
  <text x="648.0" y="24" text-anchor="middle" class="uearth-11-evolution-paths-s" style="font-weight:600">남는 천체</text>
