  <title id="t-6-2-nwp-grid">그림 6-2-3 수치예보 — 대기를 격자로 나누어 계산하기</title>
  <desc id="d-6-2-nwp-grid">수치예보는 대기를 가로·세로·높이 방향의 격자로 나누고, 위성·레이더·지상 관측소·고층 관측에서 모은 자료로 각 칸의 기온·기압·바람·수증기 값을 정한 뒤, 슈퍼컴퓨터가 물리 법칙으로 앞으로의 변화를 계산한다. 격자 크기와 층 수는 모식도이다.</desc>
