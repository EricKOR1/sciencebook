<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-earth-1-ts-diagram d-earth-1-ts-diagram">
  <title id="t-earth-1-ts-diagram">그림 지구과학 1-3 T-S도와 등밀도선</title>
  <desc id="d-earth-1-ts-diagram">가로축은 염분, 세로축은 수온이고 회색 곡선은 밀도가 같은 점을 이은 등밀도선이다(수압 무시). 오른쪽 아래(염분이 높고 수온이 낮은 쪽)로 갈수록 밀도가 크며, 수괴 B가 A보다 무겁다. 등밀도선은 수온이 낮을수록 더 가파르게 휜다.</desc>
  <style>
    .earth-1-ts-diagram-t{font-size:14px;fill:var(--fig-ink)}
    .earth-1-ts-diagram-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .earth-1-ts-diagram-s{font-size:13px;fill:var(--fig-muted)}
    .earth-1-ts-diagram-land{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:0.8;fill-rule:evenodd}
    .earth-1-ts-diagram-sea{fill:var(--fig-soft-blue)}
    .earth-1-ts-diagram-grat{fill:none;stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3;opacity:0.7}
    .earth-1-ts-diagram-frame{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .earth-1-ts-diagram-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
