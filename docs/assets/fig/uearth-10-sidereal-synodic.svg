  <text x="324.6" y="106.5" class="uearth-10-sidereal-synodic-t">먼 별은 다시 남중</text>
  <text x="258.6" y="169.5" text-anchor="end" class="uearth-10-sidereal-synodic-b uearth-10-sidereal-synodic-o" style="fill:var(--fig-red)">약 1° 더 자전(약 4분)</text>
  <text x="258.6" y="185.5" text-anchor="end" class="uearth-10-sidereal-synodic-n uearth-10-sidereal-synodic-o">→ 태양 남중: 1태양일(24시간)</text>
  <text x="242.6" y="322.5" text-anchor="middle" class="uearth-10-sidereal-synodic-n" style="fill:var(--fig-teal)">먼 별 방향(평행)</text>
  <text x="180.0" y="352.0" text-anchor="middle" class="uearth-10-sidereal-synodic-n">지구 공전 각도는 과장(실제 하루 약 1°)</text>
  <text x="180.0" y="370.0" text-anchor="middle" class="uearth-10-sidereal-synodic-n">빨간 점: 같은 관측자</text>
  <text x="540.0" y="24.0" text-anchor="middle" class="uearth-10-sidereal-synodic-h">항성월과 삭망월</text>
