<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-uearth-10-sidereal-synodic d-uearth-10-sidereal-synodic">
  <title id="t-uearth-10-sidereal-synodic">그림 일반지구과학 10-5 항성일과 태양일, 항성월과 삭망월</title>
  <desc id="d-uearth-10-sidereal-synodic">왼쪽: 지구가 별을 기준으로 한 번 자전하는 동안(1항성일, 약 23시간 56분) 공전 궤도를 따라 조금 이동하므로, 먼 별은 다시 남중하지만 태양이 남중하려면 약 1°(약 4분) 더 자전해야 한다(1태양일, 24시간). 오른쪽: 달이 별을 기준으로 한 바퀴 도는 동안(27.32일) 지구는 약 27° 공전하므로, 다시 삭이 되려면 달이 그만큼 더 돌아야 한다(삭망월 29.53일). 왼쪽 그림의 각도는 과장했다.</desc>
