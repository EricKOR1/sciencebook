  <title id="t-ochem-7-q-p17-tree">그림 유기화학 7-22 도전 17 풀이: δ 7.08 신호의 갈라짐 나무</title>
  <desc id="d-ochem-7-q-p17-tree">(E)-뷰트-2-엔산 C3–H(δ 7.08)의 신호. 한 줄이 먼저 J = 15.6 Hz(trans H)로 ±7.8 Hz의 두 줄로, 각 줄이 다시 CH₃ 3H에 의해 J = 6.9 Hz의 1 : 3 : 3 : 1 사중선으로 갈라져 −18.15, −11.25, −4.35, −2.55, +2.55, +4.35, +11.25, +18.15 Hz의 여덟 줄(세기 1, 3, 3, 1, 1, 3, 3, 1)이 된다. 아래는 두 사중선을 다른 색으로 겹쳐 그린 dq 모양(선 너비 0.8 Hz)이다.</desc>
