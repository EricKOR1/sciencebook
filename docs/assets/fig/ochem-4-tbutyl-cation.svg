<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-ochem-4-tbutyl-cation d-ochem-4-tbutyl-cation">
  <title id="t-ochem-4-tbutyl-cation">그림 유기화학 4-9 tert-뷰틸 양이온의 구조와 초공액</title>
  <desc id="d-ochem-4-tbutyl-cation">왼쪽: tert-뷰틸 양이온의 양전하 탄소는 세 C–C 결합이 120°로 한 평면에 놓인 sp² 탄소이고(전자 6개), 그 평면에 수직인 빈 2p 오비탈(점선 아령)을 가진다. 오른쪽: 메틸기 하나를 확대한 그림. 빈 p 오비탈과 나란히 정렬한 C–H σ 결합의 전자 밀도가 옆으로 겹쳐 p 쪽으로 조금 흘러 들어간다(초공액, 온 화살촉 굽은 화살표). 아래: CH₃⁺, CH₃CH₂⁺, (CH₃)₂CH⁺, (CH₃)₃C⁺ 순서로 빈 p와 겹칠 수 있는 이웃 C–H의 수는 0, 3, 6, 9이고 안정성도 이 순서로 커진다.</desc>
