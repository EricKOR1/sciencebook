<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-2-5-bonding-hands d-2-5-bonding-hands">
  <title id="t-2-5-bonding-hands">그림 2-5-1 결합 손의 개수와 연결 모양</title>
  <desc id="d-2-5-bonding-hands">공유 결합의 손이 1개인 원자는 한 원자와만 이어져 사슬의 끝이 되고, 손이 2개인 원자는 한 줄로 이어지지만 갈라지지 못하며, 손이 4개인 원자는 가지를 치거나 고리·그물을 만들 수 있다. 회색 짧은 선은 아직 쓰지 않은 손이다. 모식도.</desc>
