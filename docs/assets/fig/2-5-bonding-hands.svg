    .bh-a1{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.6}
    .bh-a2{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.6}
    .bh-a4{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.6}
    .bh-b{stroke:var(--fig-ink);stroke-width:2.4;fill:none;stroke-linecap:round}
    .bh-stub{stroke:var(--fig-muted);stroke-width:2.4;fill:none;stroke-linecap:round}
    .bh-sep{stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4}
  </style>
