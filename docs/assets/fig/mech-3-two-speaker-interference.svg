<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-mech-3-two-speaker-interference d-mech-3-two-speaker-interference">
  <title id="t-mech-3-two-speaker-interference">그림 역학과 에너지 3-7 두 스피커에서 나온 음파의 간섭 무늬(위에서 본 모식도)</title>
  <desc id="d-mech-3-two-speaker-interference">같은 위상, 같은 진동수로 소리를 내는 두 스피커에서 퍼지는 음파의 마루(실선 원)와 골(점선 원)을 그렸다. 두 스피커까지의 경로차가 파장의 정수배인 곳을 이은 선(빨간 실선)에서는 보강 간섭으로 소리가 크고, 반 파장의 홀수배인 곳을 이은 선(파란 점선)에서는 상쇄 간섭으로 소리가 작다.</desc>
