<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-ubio-5-nondisjunction d-ubio-5-nondisjunction">
  <title id="t-ubio-5-nondisjunction">그림 일반생명과학 5-3 감수 1분열 비분리와 감수 2분열 비분리</title>
  <desc id="d-ubio-5-nondisjunction">한 쌍의 상동 염색체(파랑, 빨강)만 그렸다. 감수 1분열에서 상동 염색체가 갈라지지 않으면 생식세포 네 개가 모두 비정상(n+1 두 개, n−1 두 개)이 되고, 감수 2분열에서 염색 분체가 갈라지지 않으면 n+1 하나, n−1 하나, 정상 n 두 개가 생긴다. n+1 생식세포가 정상 생식세포와 수정하면 삼염색체(2n+1)가 된다.</desc>
  <style>.ubio-5-nondisjunction-t{font-size:14px;fill:var(--fig-ink)} .ubio-5-nondisjunction-s{font-size:13px;fill:var(--fig-muted)} .ubio-5-nondisjunction-b{font-size:14px;fill:var(--fig-ink);font-weight:600} .ubio-5-nondisjunction-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-5-nondisjunction-m{font-size:13px;fill:var(--fig-ink)}</style>
