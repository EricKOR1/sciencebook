  <text x="500.0" y="442.0" text-anchor="start" class="ubio-5-nondisjunction-s">(교차가 없을 때)</text>
  <text x="360.0" y="500.0" text-anchor="middle" class="ubio-5-nondisjunction-s">모식도: 한 쌍의 상동 염색체만 그렸고, 다른 염색체는 정상적으로 분리된다고 가정했다.</text>
