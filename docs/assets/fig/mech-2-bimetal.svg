<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t-mech-2-bimetal d-mech-2-bimetal">
  <title id="t-mech-2-bimetal">그림 역학과 에너지 2-4 바이메탈과 철로 이음매 — 열팽창의 활용</title>
  <desc id="d-mech-2-bimetal">(가) 선팽창 계수가 큰 금속(구리)과 작은 금속(강철)을 붙인 바이메탈은 가열하면 더 많이 늘어나는 구리가 바깥쪽이 되도록 강철 쪽으로 휜다. 휘는 정도는 과장하여 그렸다. (나) 철로의 이음매에는 여름철 레일이 늘어날 틈을 남겨 둔다.</desc>
  <rect x="10.0" y="10.0" width="380.0" height="300.0" rx="10" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
