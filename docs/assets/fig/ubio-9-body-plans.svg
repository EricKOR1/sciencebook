<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 538" role="img" aria-labelledby="t-ubio-9-body-plans d-ubio-9-body-plans">
<title id="t-ubio-9-body-plans">그림 일반생명과학 9-6 체강의 세 가지 설계와 선구·후구동물의 원구</title>
<desc id="d-ubio-9-body-plans">위: 몸의 가로 단면. 무체강은 외배엽과 소화관 사이가 중배엽 조직으로 차 있고, 의체강은 중배엽이 몸벽 안쪽만 싸며, 진체강은 중배엽이 몸벽과 소화관을 모두 싸서 체강이 중배엽으로 완전히 둘러싸인다. 아래: 낭배의 원구가 선구동물에서는 입이, 후구동물에서는 항문이 된다. 모식도이다.</desc>
<style>
.ubio-9-body-plans-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .ubio-9-body-plans-s{font-size:13px;fill:var(--fig-muted)} .ubio-9-body-plans-t{font-size:13px;fill:var(--fig-ink)}
.ubio-9-body-plans-ec{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5}
.ubio-9-body-plans-me{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5}
.ubio-9-body-plans-cav{fill:var(--fig-panel);stroke:var(--fig-red);stroke-width:1.5}
.ubio-9-body-plans-pcav{fill:var(--fig-panel);stroke:none}
.ubio-9-body-plans-en{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5}
.ubio-9-body-plans-lu{fill:var(--fig-paper);stroke:var(--fig-amber);stroke-width:1}
.ubio-9-body-plans-ld{stroke:var(--fig-muted);stroke-width:1}
</style>
<circle cx="120" cy="120" r="70" class="ubio-9-body-plans-ec"/>
<circle cx="120" cy="120" r="60" class="ubio-9-body-plans-me"/>
<circle cx="120" cy="120" r="22" class="ubio-9-body-plans-en"/>
<circle cx="120" cy="120" r="13" class="ubio-9-body-plans-lu"/>
<circle cx="360" cy="120" r="70" class="ubio-9-body-plans-ec"/>
<circle cx="360" cy="120" r="60" class="ubio-9-body-plans-me"/>
<circle cx="360" cy="120" r="49" class="ubio-9-body-plans-pcav"/>
<circle cx="360" cy="120" r="22" class="ubio-9-body-plans-en"/>
<circle cx="360" cy="120" r="13" class="ubio-9-body-plans-lu"/>
<line x1="396" y1="106" x2="452" y2="58" class="ubio-9-body-plans-ld"/>
<text x="454" y="54" text-anchor="start" class="ubio-9-body-plans-t">의체강</text>
<circle cx="600" cy="120" r="70" class="ubio-9-body-plans-ec"/>
<circle cx="600" cy="120" r="60" class="ubio-9-body-plans-me"/>
<circle cx="600" cy="120" r="50" class="ubio-9-body-plans-cav"/>
<rect x="594" y="69" width="12" height="102" style="fill:var(--fig-soft-red);stroke:none"/>
<line x1="594" y1="70" x2="594" y2="170" style="stroke:var(--fig-red);stroke-width:1.5"/>
<line x1="606" y1="70" x2="606" y2="170" style="stroke:var(--fig-red);stroke-width:1.5"/>
<circle cx="600" cy="120" r="32" class="ubio-9-body-plans-me"/>
<circle cx="600" cy="120" r="22" class="ubio-9-body-plans-en"/>
<circle cx="600" cy="120" r="13" class="ubio-9-body-plans-lu"/>
<line x1="638" y1="104" x2="684" y2="58" class="ubio-9-body-plans-ld"/>
<text x="660" y="54" text-anchor="start" class="ubio-9-body-plans-t">진체강</text>
<line x1="120" y1="120" x2="50" y2="46" class="ubio-9-body-plans-ld"/>
<text x="46" y="42" text-anchor="start" class="ubio-9-body-plans-t">소화관</text>
<text x="120" y="216" text-anchor="middle" class="ubio-9-body-plans-h">무체강</text>
<text x="120" y="235" text-anchor="middle" class="ubio-9-body-plans-t">소화관 둘레가 중배엽 조직으로 참</text>
<text x="120" y="252" text-anchor="middle" class="ubio-9-body-plans-s">예: 편형동물</text>
<text x="360" y="216" text-anchor="middle" class="ubio-9-body-plans-h">의체강</text>
<text x="360" y="235" text-anchor="middle" class="ubio-9-body-plans-t">중배엽이 몸벽 쪽만 쌈</text>
<text x="360" y="252" text-anchor="middle" class="ubio-9-body-plans-s">예: 선형동물</text>
<text x="600" y="216" text-anchor="middle" class="ubio-9-body-plans-h">진체강</text>
<text x="600" y="235" text-anchor="middle" class="ubio-9-body-plans-t">중배엽이 몸벽과 소화관을 모두 쌈</text>
<text x="600" y="252" text-anchor="middle" class="ubio-9-body-plans-s">예: 환형·연체·절지·척삭동물</text>
<rect x="150" y="275" width="18" height="13" class="ubio-9-body-plans-ec"/>
<text x="174" y="286" text-anchor="start" class="ubio-9-body-plans-s">외배엽</text>
<rect x="260" y="275" width="18" height="13" class="ubio-9-body-plans-me"/>
<text x="284" y="286" text-anchor="start" class="ubio-9-body-plans-s">중배엽</text>
<rect x="370" y="275" width="18" height="13" class="ubio-9-body-plans-en"/>
<text x="394" y="286" text-anchor="start" class="ubio-9-body-plans-s">내배엽</text>
<rect x="480" y="275" width="18" height="13" class="ubio-9-body-plans-cav"/>
<text x="504" y="286" text-anchor="start" class="ubio-9-body-plans-s">체강</text>
<line x1="16" y1="306" x2="704" y2="306" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4"/>
<text x="16" y="328" text-anchor="start" class="ubio-9-body-plans-h">낭배의 원구는 무엇이 되는가</text>
<ellipse cx="250" cy="432" rx="58" ry="64" class="ubio-9-body-plans-ec" style="stroke-width:7;fill:var(--fig-panel)"/>
<path d="M238 496 C238 452 224 398 250 398 C276 398 262 452 262 496" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:6"/>
<circle cx="250" cy="368" r="9" style="fill:none;stroke:var(--fig-muted);stroke-width:1.5;stroke-dasharray:3 3"/>
<text x="250" y="352" text-anchor="middle" class="ubio-9-body-plans-t">나중에 뚫린 구멍 → 항문</text>
<text x="250" y="522" text-anchor="middle" class="ubio-9-body-plans-t" style="font-weight:700">원구 → 입</text>
<text x="320" y="426" text-anchor="start" class="ubio-9-body-plans-s">원장</text>
<line x1="264" y1="422" x2="316" y2="422" class="ubio-9-body-plans-ld"/>
<text x="170" y="392" text-anchor="end" class="ubio-9-body-plans-h">선구동물</text>
<text x="170" y="416" text-anchor="end" class="ubio-9-body-plans-s">나선 난할·결정 난할</text>
<text x="170" y="434" text-anchor="end" class="ubio-9-body-plans-s">체강: 중배엽 덩어리가</text>
<text x="170" y="452" text-anchor="end" class="ubio-9-body-plans-s">갈라져 생김</text>
<ellipse cx="580" cy="432" rx="58" ry="64" class="ubio-9-body-plans-ec" style="stroke-width:7;fill:var(--fig-panel)"/>
<path d="M568 496 C568 452 554 398 580 398 C606 398 592 452 592 496" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:6"/>
<circle cx="580" cy="368" r="9" style="fill:none;stroke:var(--fig-muted);stroke-width:1.5;stroke-dasharray:3 3"/>
<text x="580" y="352" text-anchor="middle" class="ubio-9-body-plans-t">나중에 뚫린 구멍 → 입</text>
<text x="580" y="522" text-anchor="middle" class="ubio-9-body-plans-t" style="font-weight:700">원구 → 항문</text>
<text x="650" y="426" text-anchor="start" class="ubio-9-body-plans-s">원장</text>
<line x1="594" y1="422" x2="646" y2="422" class="ubio-9-body-plans-ld"/>
<text x="500" y="392" text-anchor="end" class="ubio-9-body-plans-h">후구동물</text>
<text x="500" y="416" text-anchor="end" class="ubio-9-body-plans-s">방사 난할·조절 난할</text>
<text x="500" y="434" text-anchor="end" class="ubio-9-body-plans-s">체강: 원장 벽이</text>
<text x="500" y="452" text-anchor="end" class="ubio-9-body-plans-s">접혀 나와 생김</text>
</svg>
