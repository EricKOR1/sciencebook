<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-m1-05-spring-graph d-m1-05-spring-graph">
  <title id="t-m1-05-spring-graph">그림 중1-5-5 용수철에 매단 무게와 늘어난 길이</title>
  <desc id="d-m1-05-spring-graph">무게가 1 N인 추를 하나씩 더 매달면 용수철은 2 cm씩 늘어난다. 늘어난 길이를 무게에 대해 그리면 원점을 지나는 직선이 되어, 늘어난 길이가 무게에 비례함을 알 수 있다(탄성 한계 안에서). 길이는 모식적인 축척이다.</desc>
