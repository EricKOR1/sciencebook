<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="t-pchem-12-stopped-flow d-pchem-12-stopped-flow">
  <title id="t-pchem-12-stopped-flow">그림 물리화학 12-1 정지 흐름 장치(모식도)</title>
  <desc id="d-pchem-12-stopped-flow">공통 구동 막대가 용액 A와 용액 B가 든 두 주사기를 동시에 밀면 두 용액이 혼합 장치(T자 접합)에서 섞여 관측 칸으로 흘러간다. 빛은 광원 → 관측 칸 → 단색화 장치 → 검출기로 일직선을 지난다. 관측 칸 뒤의 정지 주사기가 멈춤 막이에 닿아 흐름이 멈추는 순간 "시간 0 · 기록 시작" 신호가 나간다. 아래 그래프는 기록된 흡광도로, 처음 약 1 ms(불감 시간)는 관측할 수 없고 그 뒤 지수적으로 증가한다.</desc>
