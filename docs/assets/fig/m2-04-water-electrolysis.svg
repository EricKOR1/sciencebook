<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-m2-04-water-electrolysis d-m2-04-water-electrolysis">
  <title id="t-m2-04-water-electrolysis">그림 중2-4-3 물의 전기 분해 장치</title>
  <desc id="d-m2-04-water-electrolysis">물에 전류를 흘리면 (−)극 쪽 시험관에는 수소가, (+)극 쪽 시험관에는 산소가 모이며, 모인 기체의 부피는 수소가 산소의 약 2배이다. 수소는 성냥불을 대면 '퍽' 소리를 내며 타고, 산소는 꺼져 가는 불씨를 다시 살린다. 물이 성질이 다른 두 물질로 분해되므로 물은 원소가 아니라 화합물이다. 전류가 잘 흐르도록 물에 수산화 나트륨을 조금 녹인다. 모식도이다.</desc>
  <style>
    .m2-04-water-electrolysis-t{font-size:14px;fill:var(--fig-ink)}
    .m2-04-water-electrolysis-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .m2-04-water-electrolysis-s{font-size:13px;fill:var(--fig-muted)}

  </style>
  <rect x="0" y="0" width="720" height="360" style="fill:var(--fig-paper)"/>
  <rect x="14.0" y="14.0" width="376.0" height="332.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="28.0" y="40.0" class="m2-04-water-electrolysis-b">(가) 장치</text>
  <rect x="60.0" y="172.0" width="280.0" height="118.0" style="fill:var(--fig-soft-blue)"/>
  <path d="M60 150 L60 290 L340 290 L340 150" style="fill:none;stroke:var(--fig-ink);stroke-width:2.2"/>
  <text x="200.0" y="204.0" text-anchor="middle" class="m2-04-water-electrolysis-t" style="font-weight:600">물</text>
  <text x="200.0" y="222.0" text-anchor="middle" class="m2-04-water-electrolysis-s">(수산화 나트륨을</text>
  <text x="200.0" y="238.0" text-anchor="middle" class="m2-04-water-electrolysis-s">조금 녹임)</text>
  <rect x="110.0" y="58.0" width="40.0" height="204.0" style="fill:var(--fig-soft-blue)"/>
  <rect x="110.0" y="58.0" width="40.0" height="120.0" style="fill:var(--fig-panel)"/>
  <path d="M110.0 262 L110.0 68 Q110.0 58 120.0 58 L140.0 58 Q150.0 58 150.0 68 L150.0 262" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/>
  <line x1="110.0" y1="178.0" x2="150.0" y2="178.0" style="stroke:var(--fig-blue);stroke-width:1.4"/>
  <circle cx="122.0" cy="230.0" r="3.0" style="fill:var(--fig-panel);stroke:var(--fig-blue);stroke-width:1"/>
  <circle cx="136.0" cy="205.0" r="3.0" style="fill:var(--fig-panel);stroke:var(--fig-blue);stroke-width:1"/>
  <circle cx="127.0" cy="180.0" r="3.0" style="fill:var(--fig-panel);stroke:var(--fig-blue);stroke-width:1"/>
  <circle cx="139.0" cy="240.0" r="3.0" style="fill:var(--fig-panel);stroke:var(--fig-blue);stroke-width:1"/>
  <circle cx="132.0" cy="222.0" r="3.0" style="fill:var(--fig-panel);stroke:var(--fig-blue);stroke-width:1"/>
  <text x="130.0" y="123.0" text-anchor="middle" class="m2-04-water-electrolysis-t" style="font-weight:600">수소</text>
  <rect x="124.0" y="248.0" width="12.0" height="22.0" style="fill:var(--fig-ink)"/>
  <line x1="130.0" y1="270.0" x2="130.0" y2="318.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="102.0" y="196.0" text-anchor="end" class="m2-04-water-electrolysis-t" style="fill:var(--fig-blue);font-weight:600">부피 2</text>
  <text x="118.0" y="312.0" text-anchor="end" class="m2-04-water-electrolysis-t">(−)극</text>
  <rect x="250.0" y="58.0" width="40.0" height="204.0" style="fill:var(--fig-soft-blue)"/>
  <rect x="250.0" y="58.0" width="40.0" height="60.0" style="fill:var(--fig-panel)"/>
  <path d="M250.0 262 L250.0 68 Q250.0 58 260.0 58 L280.0 58 Q290.0 58 290.0 68 L290.0 262" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/>
  <line x1="250.0" y1="118.0" x2="290.0" y2="118.0" style="stroke:var(--fig-blue);stroke-width:1.4"/>
  <circle cx="262.0" cy="230.0" r="3.0" style="fill:var(--fig-panel);stroke:var(--fig-blue);stroke-width:1"/>
  <circle cx="276.0" cy="205.0" r="3.0" style="fill:var(--fig-panel);stroke:var(--fig-blue);stroke-width:1"/>
  <circle cx="267.0" cy="180.0" r="3.0" style="fill:var(--fig-panel);stroke:var(--fig-blue);stroke-width:1"/>
  <circle cx="279.0" cy="240.0" r="3.0" style="fill:var(--fig-panel);stroke:var(--fig-blue);stroke-width:1"/>
  <circle cx="272.0" cy="222.0" r="3.0" style="fill:var(--fig-panel);stroke:var(--fig-blue);stroke-width:1"/>
  <text x="270.0" y="93.0" text-anchor="middle" class="m2-04-water-electrolysis-t" style="font-weight:600">산소</text>
  <rect x="264.0" y="248.0" width="12.0" height="22.0" style="fill:var(--fig-ink)"/>
  <line x1="270.0" y1="270.0" x2="270.0" y2="318.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="298.0" y="136.0" class="m2-04-water-electrolysis-t" style="fill:var(--fig-blue);font-weight:600">부피 1</text>
  <text x="282.0" y="312.0" class="m2-04-water-electrolysis-t">(+)극</text>
  <line x1="130.0" y1="318.0" x2="193.0" y2="318.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <line x1="207.0" y1="318.0" x2="270.0" y2="318.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <line x1="193.0" y1="310.0" x2="193.0" y2="326.0" style="stroke:var(--fig-ink);stroke-width:4"/>
  <line x1="207.0" y1="302.0" x2="207.0" y2="334.0" style="stroke:var(--fig-ink);stroke-width:1.6"/>
  <line x1="190.0" y1="318.0" x2="193.0" y2="318.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <line x1="207.0" y1="318.0" x2="210.0" y2="318.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="226.0" y="340.0" class="m2-04-water-electrolysis-s">전원</text>
  <rect x="406.0" y="14.0" width="300.0" height="332.0" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="420.0" y="40.0" class="m2-04-water-electrolysis-b">(나) 모인 기체 확인하기</text>
  <rect x="420.0" y="56.0" width="272.0" height="92.0" rx="6" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.2"/>
  <text x="434.0" y="80.0" class="m2-04-water-electrolysis-t" style="font-weight:600">(−)극 → 수소 (부피 약 2)</text>
  <text x="434.0" y="104.0" class="m2-04-water-electrolysis-t">성냥불을 가까이 하면</text>
  <text x="434.0" y="124.0" class="m2-04-water-electrolysis-t">'퍽' 소리를 내며 탄다</text>
  <rect x="420.0" y="160.0" width="272.0" height="92.0" rx="6" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.2"/>
  <text x="434.0" y="184.0" class="m2-04-water-electrolysis-t" style="font-weight:600">(+)극 → 산소 (부피 약 1)</text>
  <text x="434.0" y="208.0" class="m2-04-water-electrolysis-t">꺼져 가는 불씨를 넣으면</text>
  <text x="434.0" y="228.0" class="m2-04-water-electrolysis-t">불씨가 다시 살아난다</text>
  <text x="556.0" y="286.0" text-anchor="middle" class="m2-04-water-electrolysis-b">물 → 수소 + 산소</text>
  <text x="556.0" y="310.0" text-anchor="middle" class="m2-04-water-electrolysis-s">성질이 다른 두 물질로 분해된다</text>
  <text x="556.0" y="328.0" text-anchor="middle" class="m2-04-water-electrolysis-s">→ 물은 원소가 아니라 화합물</text>
</svg>
