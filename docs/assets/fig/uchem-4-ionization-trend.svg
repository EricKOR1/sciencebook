<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-uchem-4-ionization-trend d-uchem-4-ionization-trend">
  <title id="t-uchem-4-ionization-trend">그림 일반화학 4-8 원자 번호에 따른 1차 이온화 에너지</title>
  <desc id="d-uchem-4-ionization-trend">H부터 Ca까지 1차 이온화 에너지(kJ/mol). 같은 주기에서는 오른쪽으로 갈수록 대체로 커져 18족에서 가장 크고, 새 주기의 1족에서 크게 떨어진다. 2족→13족(Be→B, Mg→Al)과 15족→16족(N→O, P→S)에서 값이 줄어드는 꺾임이 두 주기에서 같은 자리에 되풀이된다.</desc>
  <style>
    .uchem-4-ie-ax{stroke:var(--fig-ink);stroke-width:1.2;fill:none}
    .uchem-4-ie-gr{stroke:var(--fig-line);stroke-width:0.6;fill:none;stroke-dasharray:2 3}
    .uchem-4-ie-ln{stroke:var(--fig-accent);stroke-width:2;fill:none;stroke-linejoin:round}
    .uchem-4-ie-dot{fill:var(--fig-panel);stroke:var(--fig-accent);stroke-width:2}
    .uchem-4-ie-t{font-size:13px;fill:var(--fig-ink)}
    .uchem-4-ie-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-4-ie-ex{font-size:12px;fill:var(--fig-red)}
  </style>
