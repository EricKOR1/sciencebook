  <title id="t-m3-07-infection-growth">그림 중3-7-4 1명이 옮기는 사람 수와 감염병의 확산</title>
  <desc id="d-m3-07-infection-growth">감염자 1명이 평균 2명에게 옮기고 한 번 옮기는 데 5일이 걸리면, 새 감염자는 5일마다 2배가 되어 1, 2, 4, 8, 16, 32, 64명으로 처음에는 천천히, 나중에는 폭발적으로 늘어난다. 1명이 평균 1명에게만 옮기면 새 감염자는 계속 1명이다. 설명을 위해 가정한 값이다.</desc>
