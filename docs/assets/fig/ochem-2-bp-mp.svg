<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-ochem-2-bp-mp d-ochem-2-bp-mp">
  <title id="t-ochem-2-bp-mp">그림 유기화학 2-5 곧은 사슬 알케인의 끓는점과 녹는점</title>
  <desc id="d-ochem-2-bp-mp">가로축은 탄소 수 1~20, 세로축은 온도(℃). 채운 원과 실선은 끓는점(−162 ℃에서 343 ℃까지 오르며 증가 폭이 점점 줄어든다), 빈 원과 점선은 녹는점(짝수 탄소에서 위로 튀는 지그재그). 25 ℃의 가로 점선이 실온이다. 세모는 가지 친 이성질체의 끓는점(2-메틸뷰테인 28 ℃, 2,2-다이메틸프로페인 10 ℃, 2,2-다이메틸뷰테인 50 ℃)으로, 같은 탄소 수의 곧은 사슬보다 낮다.</desc>
