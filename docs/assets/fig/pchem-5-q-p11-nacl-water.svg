<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-pchem-5-q-p11-nacl-water d-pchem-5-q-p11-nacl-water">
  <title id="t-pchem-5-q-p11-nacl-water">그림 물리화학 5-17 문제 11의 NaCl–물계 상 도표(물 쪽 부분, 개형)</title>
  <desc id="d-pchem-5-q-p11-nacl-water">가로축은 NaCl의 질량 백분율(0~30 %), 세로축은 온도(−25~+5 ℃). 0 %, 0 ℃에서 오른쪽 아래로 내려가는 얼음의 액상선과 그 오른쪽에서 위로 올라가는 NaCl 수화물(NaCl·2H₂O)의 용해도 곡선이 점 E(약 23 %, 약 −21 ℃)에서 만나고, E의 온도에 수평선이 있다. 영역은 소금물(액체), 얼음 + 소금물, 수화물 + 소금물, 얼음 + 수화물(고체)이다.</desc>
