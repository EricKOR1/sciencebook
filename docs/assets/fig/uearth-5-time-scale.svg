<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-uearth-5-time-scale d-uearth-5-time-scale">
<title id="t-uearth-5-time-scale">그림 일반지구과학 5-2 지질 시대 — 실제 시간 비율과 현생누대 확대</title>
<desc id="d-uearth-5-time-scale">위 띠는 46억 년 지구 역사를 실제 비율로 그린 것으로, 선캄브리아 시대가 약 88 %를 차지한다. 아래 띠는 현생누대 5억 3900만 년을 약 8.5배 확대하여 대와 기, 다섯 번의 대량 멸종을 표시했다.</desc>
