<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-cell-3-mito-chloro d-cell-3-mito-chloro">
<title id="t-cell-3-mito-chloro">그림 세포와 물질대사 3-3 미토콘드리아와 엽록체의 막 구조</title>
<desc id="d-cell-3-mito-chloro">미토콘드리아는 외막과 주름진 내막(크리스타)을 가지며, 전자 전달계가 H⁺을 기질에서 막 사이 공간으로 퍼낸다. 엽록체는 2중막 안에 틸라코이드가 쌓인 그라나가 있으며, H⁺이 스트로마에서 틸라코이드 내부로 퍼내진다. 두 경우 모두 H⁺이 모인 쪽에서 ATP 합성 효소를 지나 돌아오며 기질·스트로마 쪽에서 ATP가 만들어진다. 모식도.</desc>
<style>
.c3mc-lbl{font-size:13px;fill:var(--fig-ink)} .c3mc-b{font-size:14px;font-weight:700;fill:var(--fig-ink)} .c3mc-sm{font-size:13px;fill:var(--fig-muted)} .c3mc-arr{fill:none;stroke:var(--fig-ink);stroke-width:2} .c3mc-ah{fill:var(--fig-ink)} .c3mc-lead{fill:none;stroke:var(--fig-muted);stroke-width:1}
.c3mc-hi{fill:var(--fig-soft-red)}
.c3mc-lo{fill:var(--fig-soft-amber)}
.c3mc-mm{fill:none;stroke:var(--fig-red);stroke-width:2.2;stroke-linejoin:round}
.c3mc-cm{fill:none;stroke:var(--fig-green);stroke-width:2.2}
.c3mc-thy{fill:var(--fig-soft-red);stroke:var(--fig-green);stroke-width:2}
.c3mc-h{font-size:11px;font-weight:700;fill:var(--fig-red)}
.c3mc-ttl{font-size:15px;font-weight:700;fill:var(--fig-ink)}
.c3mc-sw{stroke:var(--fig-line);stroke-width:1}
</style>
