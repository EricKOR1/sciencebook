l">막 사이 공간</text><rect x="390" y="60" width="300" height="200" rx="90" class="c3mc-lo"/><rect x="390" y="60" width="300" height="200" rx="90" class="c3mc-cm"/><rect x="397" y="67" width="286" height="186" rx="83" class="c3mc-cm"/><rect x="425" y="118" width="60" height="14" rx="7" class="c3mc-thy"/><rect x="425" y="135" width="60" height="14" rx="7" class="c3mc-thy"/><rect x="425" y="152" width="60" height="14" rx="7" class="c3mc-thy"/><rect x="425" y="169" width="60" height="14" rx="7" class="c3mc-thy"/><rect x="510" y="88" width="60" height="14" rx="7" class="c3mc-thy"/><rect x="510" y="105" width="60" height="14" rx="7" class="c3mc-thy"/><rect x="510" y="122" width="60" height="14" rx="7" class="c3mc-thy"/><rect x="510" y="139" width="60" height="14" rx="7" class="c3mc-thy"/><rect x="590" y="133" width="60" height="14" rx="7" class="c3mc-thy"/><rect x="590" y="150" width="60" height="14" rx="7" class="c3mc-thy"/><rect x="590" y="167" width="60" height="14" rx="7" class="c3mc-thy"/><rect x="590" y="184" width="60" height="14" rx="7" class="c3mc-thy"/><path d="M485 140 Q512 120 510 110 M570 125 Q600 145 590 160" class="c3mc-cm"/><text x="455" y="146" text-anchor="middle" class="c3mc-h">H⁺</text><text x="540" y="116" text-anchor="middle" class="c3mc-h">H⁺</text><text x="620" y="161" text-anchor="middle" class="c3mc-h">H⁺</text><text x="540" y="230" text-anchor="middle" class="c3mc-b">스트로마</text><path d="M394 190 L400 286" class="c3mc-lead"/><text x="384" y="300" class="c3mc-lbl">2중막</text><path d="M465 179 L520 286" class="c3mc-lead"/><text x="466" y="300" class="c3mc-lbl">틸라코이드(쌓인 것: 그라나)</text><path d="M620 152 L660 286" class="c3mc-lead"/><text x="612" y="320" class="c3mc-lbl">틸라코이드 내부</text><rect x="30" y="344" width="22" height="16" rx="3" class="c3mc-hi c3mc-sw"/><text x="60" y="357" class="c3mc-lbl">H⁺이 모이는 곳(pH 낮음): 막 사이 공간 · 틸라코이드 내부</text><rect x="30" y="370" width="22" height="16" rx="3" class="c3mc-lo c3mc-sw"/><text x="60" y="383" class="c3mc-lbl">ATP가 만들어지는 곳: 기질 · 스트로마</text><text x="30" y="410" class="c3mc-sm">H⁺ 퍼내는 방향 — 미토콘드리아: 기질 → 막 사이 공간, 엽록체: 스트로마 → 틸라코이드 내부. 모식도.</text></svg>
