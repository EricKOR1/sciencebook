<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-uearth-3-rebound d-uearth-3-rebound">
  <title id="t-uearth-3-rebound">그림 일반지구과학 3-1 탄성 반발과 지진 주기</title>
  <desc id="d-uearth-3-rebound">단층을 위에서 본 모습. 단층이 잠긴 채 양쪽 판이 반대로 움직이면 단층을 가로지르는 도로가 휘며 변형 에너지가 쌓이고, 마찰 강도를 넘는 순간 단층이 미끄러지며 도로는 끊어져 어긋난 채 다시 곧아진다. 아래 그래프처럼 응력은 천천히 쌓였다가 지진 때 갑자기 떨어지기를 되풀이한다.</desc>
