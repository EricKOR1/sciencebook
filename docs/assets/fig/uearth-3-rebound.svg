    .uearth-3-rebound-l{font-size:13px;fill:var(--fig-ink)}
    .uearth-3-rebound-s{font-size:13px;fill:var(--fig-muted)}
    .uearth-3-rebound-a{stroke:var(--fig-ink);stroke-width:1.8}
  </style>
