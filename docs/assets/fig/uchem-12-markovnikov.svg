<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-uchem-12-markovnikov d-uchem-12-markovnikov">
  <title id="t-uchem-12-markovnikov">그림 일반화학 12-8 마르코브니코프 규칙 — 더 안정한 탄소 양이온을 거친다</title>
  <desc id="d-uchem-12-markovnikov">프로펜에 HBr이 첨가될 때 먼저 H⁺가 이중 결합의 한 탄소에 붙어 탄소 양이온이 생긴다. H⁺가 끝 탄소(수소가 더 많은 탄소)에 붙으면 양전하가 가운데 탄소에 놓인 2차 탄소 양이온이, 가운데 탄소에 붙으면 1차 탄소 양이온이 생긴다. 2차 탄소 양이온은 이웃 탄소 두 개가 전자를 밀어 주어 더 안정하므로 그 경로의 활성화 에너지가 낮고, Br⁻이 결합해 2-브로모프로페인이 주생성물이 된다. 아래 에너지 도표는 모식도이다.</desc>
  <style>.uchem-12-markovnikov-t{font-size:14px;fill:var(--fig-ink)} .uchem-12-markovnikov-s{font-size:13px;fill:var(--fig-muted)} .uchem-12-markovnikov-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}</style>
