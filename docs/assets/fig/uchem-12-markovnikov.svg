  <text x="600.0" y="56.0" text-anchor="middle" class="uchem-12-markovnikov-b">CH₃–CHBr–CH₃</text>
  <text x="600.0" y="76.0" text-anchor="middle" class="uchem-12-markovnikov-s" style="fill:var(--fig-green)">2-브로모프로페인 (주생성물)</text>
  <line x1="132.0" y1="140.0" x2="225.3" y2="169.9" style="stroke:var(--fig-red);stroke-width:2;stroke-linecap:round;stroke-dasharray:6 4"/>
  <polygon points="232.0,172.0 223.3,173.0 225.5,166.1" style="fill:var(--fig-red);stroke:none;stroke-width:1;stroke-linejoin:round"/>
