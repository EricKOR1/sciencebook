  <title id="t-m2-06-heart">그림 중2-6-4 심장의 구조</title>
  <desc id="d-m2-06-heart">심장은 우심방·우심실·좌심방·좌심실의 네 방으로 나뉜다. 대정맥은 우심방, 폐동맥은 우심실, 폐정맥은 좌심방, 대동맥은 좌심실과 연결된다. 심방과 심실 사이, 심실과 동맥 사이에는 판막이 있어 혈액이 거꾸로 흐르지 않으며, 좌심실의 벽이 가장 두껍다. 몸을 앞에서 본 모식도로, 그림의 왼쪽이 몸의 오른쪽이다.</desc>
