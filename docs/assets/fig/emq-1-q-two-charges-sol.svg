  <text x="110" y="156" text-anchor="middle" class="emq-1-q-two-charges-sol-b" style="font-size:18px">+</text>
  <circle cx="270" cy="310" r="15" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2"/>
