<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 345" class="fig-small" role="img" aria-labelledby="t-emq-1-q-two-charges-sol d-emq-1-q-two-charges-sol">
  <title id="t-emq-1-q-two-charges-sol">그림 전자기와 양자 1-12 문제 12 풀이의 전기장 합성</title>
  <desc id="d-emq-1-q-two-charges-sol">+4.0 μC이 P에 만드는 전기장 E₁은 +x 방향 4.0×10⁵ N/C, +3.0 μC이 만드는 E₂는 +y 방향 3.0×10⁵ N/C이다. 두 벡터를 이어 붙이면 합성 전기장은 5.0×10⁵ N/C이고 +x축과 약 37°를 이룬다. 화살표 길이는 크기에 비례한다.</desc>
  <style>.emq-1-q-two-charges-sol-t{font-size:14px;fill:var(--fig-ink)} .emq-1-q-two-charges-sol-s{font-size:13px;fill:var(--fig-muted)} .emq-1-q-two-charges-sol-b{font-size:15px;font-weight:700;fill:var(--fig-ink)}</style>
