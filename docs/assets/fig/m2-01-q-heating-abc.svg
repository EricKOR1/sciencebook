  <title id="t-m2-01-q-heating-abc">그림 중2-1-10 문제 13 해설: 액체 A, B, C의 가열 곡선</title>
  <desc id="d-m2-01-q-heating-abc">표의 끓는 동안의 온도와 끓는 구간의 길이를 나타낸 그래프. A와 B는 같은 78 °C에서 평평한 구간이 생기고, 양이 2배인 B의 평평한 구간이 2배 길다. C는 끓는 동안 82 °C에서 90 °C로 계속 올라간다. 끓기 전 구간의 모양과 걸린 시간은 같은 장치로 가열했다고 보고 그린 모식이다.</desc>
