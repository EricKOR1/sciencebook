  <title id="t-chem-3-q-nh3-removal">그림 화학 3-7 문제 13의 농도–시간 그래프</title>
  <desc id="d-chem-3-q-nh3-removal">1 L 용기에서 N₂(g) + 3H₂(g) ⇌ 2NH₃(g)가 평형을 이루다가 시각 t₁에 조건 하나를 바꾸었을 때 세 물질의 농도를 시간에 따라 나타냈다. 농도 값은 문제의 표와 같고, 온도는 일정하다. 시간 축은 모식적이다.</desc>
