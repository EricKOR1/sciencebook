<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uearth-9-oxygen-isotope d-uearth-9-oxygen-isotope">
  <title id="t-uearth-9-oxygen-isotope">그림 일반지구과학 9-4 산소 동위 원소로 고기온을 읽는 원리</title>
  <desc id="d-uearth-9-oxygen-isotope">저위도 바다에서 증발한 수증기는 가벼운 ¹⁶O가 많아 δ¹⁸O가 바닷물보다 낮다. 수증기가 극지방으로 가며 비·눈으로 빠질 때 무거운 ¹⁸O가 먼저 떨어지므로, 남은 수증기와 그것이 내리는 눈의 δ¹⁸O는 점점 더 낮아지고, 기온이 낮을수록 이 과정이 더 진행되어 빙상의 눈은 δ¹⁸O가 매우 낮다. 빙기에는 ¹⁶O가 많은 물이 대륙 빙상에 갇혀 바닷물과 유공충 껍데기의 δ¹⁸O는 높아지고, 극지 얼음의 δ¹⁸O는 더 낮아진다. 화살표와 구름의 크기는 모식적이다.</desc>
  <style>
    .uearth-9-oxygen-isotope-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .uearth-9-oxygen-isotope-t{font-size:13px;fill:var(--fig-ink)}
    .uearth-9-oxygen-isotope-b{font-size:13px;font-weight:600;fill:var(--fig-ink)}
    .uearth-9-oxygen-isotope-s{font-size:13px;fill:var(--fig-muted)}
    .uearth-9-oxygen-isotope-ax{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .uearth-9-oxygen-isotope-grid{fill:none;stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 4}
    .uearth-9-oxygen-isotope-panel{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1}
    .uearth-9-oxygen-isotope-sea{fill:var(--fig-soft-blue);stroke:none}
    .uearth-9-oxygen-isotope-land{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:0.7;fill-rule:evenodd}
    .uearth-9-oxygen-isotope-grat{fill:none;stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 4}
    .uearth-9-oxygen-isotope-frame{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .uearth-9-oxygen-isotope-c-ink{font-size:13px;font-weight:600;fill:var(--fig-ink)}
    .uearth-9-oxygen-isotope-c-muted{font-size:13px;font-weight:600;fill:var(--fig-muted)}
    .uearth-9-oxygen-isotope-c-line{font-size:13px;font-weight:600;fill:var(--fig-line)}
    .uearth-9-oxygen-isotope-c-accent{font-size:13px;font-weight:600;fill:var(--fig-accent)}
    .uearth-9-oxygen-isotope-c-blue{font-size:13px;font-weight:600;fill:var(--fig-blue)}
    .uearth-9-oxygen-isotope-c-red{font-size:13px;font-weight:600;fill:var(--fig-red)}
    .uearth-9-oxygen-isotope-c-green{font-size:13px;font-weight:600;fill:var(--fig-green)}
    .uearth-9-oxygen-isotope-c-amber{font-size:13px;font-weight:600;fill:var(--fig-amber)}
    .uearth-9-oxygen-isotope-c-violet{font-size:13px;font-weight:600;fill:var(--fig-violet)}
    .uearth-9-oxygen-isotope-c-teal{font-size:13px;font-weight:600;fill:var(--fig-teal)}
    .uearth-9-oxygen-isotope-sea{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.2}
    .uearth-9-oxygen-isotope-icesh{fill:var(--fig-panel);stroke:var(--fig-violet);stroke-width:1.6}
    .uearth-9-oxygen-isotope-cl{fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.3}
    .uearth-9-oxygen-isotope-rain{stroke:var(--fig-blue);stroke-width:1.4;stroke-dasharray:5 4}
    .uearth-9-oxygen-isotope-snow{stroke:var(--fig-violet);stroke-width:1.4;stroke-dasharray:2 4}
  </style>
  <defs>
    <marker id="uearth-9-oxygen-isotope-ah-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--fig-ink)"/></marker>
    <marker id="uearth-9-oxygen-isotope-ah-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--fig-teal)"/></marker>
  </defs>
  <path d="M20,270 L470,270 L470,310 L20,310 Z" class="uearth-9-oxygen-isotope-sea"/>
  <path d="M470,310 L470,270 C520,240 600,200 700,190 L700,310 Z" class="uearth-9-oxygen-isotope-icesh"/>
  <text x="60.0" y="296.0" class="uearth-9-oxygen-isotope-c-blue">저위도 바다(따뜻함)</text>
  <text x="600.0" y="280.0" class="uearth-9-oxygen-isotope-c-violet" text-anchor="middle">극지 빙상</text>
  <text x="600.0" y="298.0" class="uearth-9-oxygen-isotope-b" text-anchor="middle">δ¹⁸O 매우 낮음</text>
  <path d="M70,266 C62,240 78,220 70,190" style="fill:none;stroke:var(--fig-teal);stroke-width:1.8" marker-end="url(#uearth-9-oxygen-isotope-ah-teal)"/>
  <path d="M100,266 C92,240 108,220 100,190" style="fill:none;stroke:var(--fig-teal);stroke-width:1.8" marker-end="url(#uearth-9-oxygen-isotope-ah-teal)"/>
  <path d="M130,266 C122,240 138,220 130,190" style="fill:none;stroke:var(--fig-teal);stroke-width:1.8" marker-end="url(#uearth-9-oxygen-isotope-ah-teal)"/>
  <rect x="147.0" y="243.0" width="185.4" height="18" rx="3" style="fill:var(--fig-paper);opacity:0.85;stroke:none"/>
  <text x="150.0" y="256.0" class="uearth-9-oxygen-isotope-c-teal">증발: ¹⁶O가 먼저 빠져나감</text>
  <ellipse cx="110" cy="120" rx="60" ry="25" class="uearth-9-oxygen-isotope-cl"/>
  <path d="M172,116 L202,101" style="fill:none;stroke:var(--fig-ink);stroke-width:1.8" marker-end="url(#uearth-9-oxygen-isotope-ah-ink)"/>
  <ellipse cx="260" cy="105" rx="52" ry="22" class="uearth-9-oxygen-isotope-cl"/>
  <line x1="236" y1="125" x2="231" y2="270" class="uearth-9-oxygen-isotope-rain"/>
  <line x1="252" y1="125" x2="247" y2="270" class="uearth-9-oxygen-isotope-rain"/>
  <line x1="268" y1="125" x2="263" y2="270" class="uearth-9-oxygen-isotope-rain"/>
  <line x1="284" y1="125" x2="279" y2="270" class="uearth-9-oxygen-isotope-rain"/>
  <path d="M314,101 L350,88" style="fill:none;stroke:var(--fig-ink);stroke-width:1.8" marker-end="url(#uearth-9-oxygen-isotope-ah-ink)"/>
  <ellipse cx="400" cy="92" rx="44" ry="19" class="uearth-9-oxygen-isotope-cl"/>
  <line x1="380" y1="109" x2="375" y2="270" class="uearth-9-oxygen-isotope-rain"/>
  <line x1="393" y1="109" x2="388" y2="270" class="uearth-9-oxygen-isotope-rain"/>
  <line x1="407" y1="109" x2="402" y2="270" class="uearth-9-oxygen-isotope-rain"/>
  <line x1="420" y1="109" x2="415" y2="270" class="uearth-9-oxygen-isotope-rain"/>
  <path d="M446,88 L488,78" style="fill:none;stroke:var(--fig-ink);stroke-width:1.8" marker-end="url(#uearth-9-oxygen-isotope-ah-ink)"/>
  <ellipse cx="530" cy="82" rx="36" ry="15" class="uearth-9-oxygen-isotope-cl"/>
  <line x1="513" y1="96" x2="508" y2="222" class="uearth-9-oxygen-isotope-snow"/>
  <line x1="524" y1="96" x2="519" y2="222" class="uearth-9-oxygen-isotope-snow"/>
  <line x1="536" y1="96" x2="531" y2="222" class="uearth-9-oxygen-isotope-snow"/>
  <line x1="547" y1="96" x2="542" y2="222" class="uearth-9-oxygen-isotope-snow"/>
  <path d="M568,78 L606,72" style="fill:none;stroke:var(--fig-ink);stroke-width:1.8" marker-end="url(#uearth-9-oxygen-isotope-ah-ink)"/>
  <ellipse cx="640" cy="76" rx="29" ry="12" class="uearth-9-oxygen-isotope-cl"/>
  <line x1="627" y1="87" x2="622" y2="189" class="uearth-9-oxygen-isotope-snow"/>
  <line x1="636" y1="87" x2="631" y2="189" class="uearth-9-oxygen-isotope-snow"/>
  <line x1="644" y1="87" x2="639" y2="189" class="uearth-9-oxygen-isotope-snow"/>
  <line x1="653" y1="87" x2="648" y2="189" class="uearth-9-oxygen-isotope-snow"/>
  <text x="110.0" y="66.0" class="uearth-9-oxygen-isotope-b" text-anchor="middle">수증기 δ¹⁸O 낮음</text>
  <text x="640.0" y="40.0" class="uearth-9-oxygen-isotope-b" text-anchor="middle">남은 수증기·눈의 δ¹⁸O</text>
  <text x="640.0" y="57.0" class="uearth-9-oxygen-isotope-b" text-anchor="middle">더욱 낮아짐</text>
  <rect x="237.3" y="152.0" width="185.4" height="18" rx="3" style="fill:var(--fig-paper);opacity:0.85;stroke:none"/>
  <text x="330.0" y="165.0" class="uearth-9-oxygen-isotope-c-blue" text-anchor="middle">비·눈으로 ¹⁸O가 먼저 빠짐</text>
  <line x1="200" y1="196" x2="560" y2="196" style="stroke:var(--fig-red);stroke-width:1.6"/>
  <path d="M560,190 L572,196 L560,202 Z" style="fill:var(--fig-red)"/>
  <rect x="235.5" y="203.0" width="288.9" height="18" rx="3" style="fill:var(--fig-paper);opacity:0.85;stroke:none"/>
  <text x="380.0" y="216.0" class="uearth-9-oxygen-isotope-c-red" text-anchor="middle">극으로 갈수록, 기온이 낮을수록 δ¹⁸O 감소</text>
  <text x="20.0" y="344.0" class="uearth-9-oxygen-isotope-t">빙기: ¹⁶O가 많은 물이 빙상에 갇힘 → 바닷물·유공충 껍데기 δ¹⁸O ↑ (해저 퇴적물에서 "높으면 빙기")</text>
  <text x="56.0" y="366.0" class="uearth-9-oxygen-isotope-t">더 추움 → 극지 얼음 δ¹⁸O ↓ (빙하 코어에서 "낮으면 추운 시기")</text>
  <text x="20.0" y="390.0" class="uearth-9-oxygen-isotope-s">δ¹⁸O = (시료의 ¹⁸O/¹⁶O ÷ 표준의 ¹⁸O/¹⁶O − 1) × 1000 ‰</text>
</svg>
