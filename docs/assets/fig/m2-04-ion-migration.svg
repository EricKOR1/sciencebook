<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-m2-04-ion-migration d-m2-04-ion-migration">
  <title id="t-m2-04-ion-migration">그림 중2-4-7 전기를 이용한 이온의 이동 실험</title>
  <desc id="d-m2-04-ion-migration">질산 칼륨 수용액에 적신 거름종이의 양 끝을 전원의 (+)극과 (−)극에 연결하고 가운데에 황산 구리 수용액과 과망가니즈산 칼륨 수용액을 떨어뜨린다. 시간이 지나면 파란색을 띤 구리 이온(Cu²⁺, 양이온)은 (−)극 쪽으로, 보라색을 띤 과망가니즈산 이온(MnO₄⁻, 음이온)은 (+)극 쪽으로 이동한다. 다른 종류의 전하끼리 끌어당기기 때문이다. 위에서 내려다본 모식도이다.</desc>
  <style>
    .m2-04-ion-migration-t{font-size:14px;fill:var(--fig-ink)}
    .m2-04-ion-migration-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .m2-04-ion-migration-s{font-size:13px;fill:var(--fig-muted)}

  </style>
  <rect x="0" y="0" width="720" height="330" style="fill:var(--fig-paper)"/>
  <rect x="60.0" y="96.0" width="600.0" height="180.0" rx="6" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.2"/>
  <rect x="90.0" y="116.0" width="540.0" height="140.0" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.4"/>
  <text x="360.0" y="292.0" text-anchor="middle" class="m2-04-ion-migration-s">질산 칼륨 수용액에 적신 거름종이 (유리판 위)</text>
  <rect x="76.0" y="160.0" width="28.0" height="52.0" rx="4" style="fill:var(--fig-line);stroke:var(--fig-ink);stroke-width:1.4"/>
  <text x="90.0" y="234.0" text-anchor="middle" class="m2-04-ion-migration-t" style="font-weight:600">(+)극</text>
  <rect x="616.0" y="160.0" width="28.0" height="52.0" rx="4" style="fill:var(--fig-line);stroke:var(--fig-ink);stroke-width:1.4"/>
  <text x="630.0" y="234.0" text-anchor="middle" class="m2-04-ion-migration-t" style="font-weight:600">(−)극</text>
  <path d="M90 160 L90 74 L340 74" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/>
  <path d="M630 160 L630 74 L380 74" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/>
  <line x1="340.0" y1="58.0" x2="340.0" y2="90.0" style="stroke:var(--fig-ink);stroke-width:1.8"/>
  <line x1="352.0" y1="64.0" x2="352.0" y2="84.0" style="stroke:var(--fig-ink);stroke-width:4"/>
  <line x1="368.0" y1="58.0" x2="368.0" y2="90.0" style="stroke:var(--fig-ink);stroke-width:1.8"/>
  <line x1="380.0" y1="64.0" x2="380.0" y2="84.0" style="stroke:var(--fig-ink);stroke-width:4"/>
  <text x="360.0" y="44.0" text-anchor="middle" class="m2-04-ion-migration-s">전원 (9 V 전지)</text>
  <text x="326.0" y="70.0" text-anchor="end" class="m2-04-ion-migration-t" style="font-weight:700">+</text>
  <text x="394.0" y="70.0" class="m2-04-ion-migration-t" style="font-weight:700">−</text>
  <line x1="360.0" y1="122.0" x2="360.0" y2="250.0" style="stroke:var(--fig-muted);stroke-width:1;stroke-dasharray:4 4"/>
  <text x="360.0" y="270.0" text-anchor="middle" class="m2-04-ion-migration-s">처음 떨어뜨린 곳</text>
  <circle cx="360.0" cy="160.0" r="10.0" style="fill:none;stroke:var(--fig-blue);stroke-width:1.4;stroke-dasharray:3 2"/>
  <ellipse cx="470" cy="160" rx="26" ry="12" style="fill:var(--fig-blue);opacity:.75"/>
  <line x1="374.0" y1="160.0" x2="434.6" y2="160.0" style="stroke:var(--fig-blue);stroke-width:2;fill:none"/>
  <polygon points="440.0,160.0 431.8,163.7 431.8,156.3" style="fill:var(--fig-blue)"/>
  <text x="470.0" y="190.0" text-anchor="middle" class="m2-04-ion-migration-t" style="fill:var(--fig-blue);font-weight:600">Cu²⁺ (파란색, 양이온)</text>
  <text x="470.0" y="206.0" text-anchor="middle" class="m2-04-ion-migration-s">→ (−)극 쪽으로</text>
  <circle cx="360.0" cy="228.0" r="10.0" style="fill:none;stroke:var(--fig-violet);stroke-width:1.4;stroke-dasharray:3 2"/>
  <ellipse cx="250" cy="228" rx="26" ry="12" style="fill:var(--fig-violet);opacity:.75"/>
  <line x1="346.0" y1="228.0" x2="285.4" y2="228.0" style="stroke:var(--fig-violet);stroke-width:2;fill:none"/>
  <polygon points="280.0,228.0 288.2,224.3 288.2,231.7" style="fill:var(--fig-violet)"/>
  <text x="232.0" y="196.0" text-anchor="middle" class="m2-04-ion-migration-t" style="fill:var(--fig-violet);font-weight:600">MnO₄⁻ (보라색, 음이온)</text>
  <text x="232.0" y="212.0" text-anchor="middle" class="m2-04-ion-migration-s">(+)극 쪽으로 ←</text>
  <text x="360.0" y="318.0" text-anchor="middle" class="m2-04-ion-migration-t" style="font-weight:600">다른 전하끼리 끌어당긴다: 양이온 → (−)극, 음이온 → (+)극</text>
</svg>
