<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-ochem-11-interconversion-ladder d-ochem-11-interconversion-ladder">
  <title id="t-ochem-11-interconversion-ladder">그림 유기화학 11-10 유도체 상호 변환의 사다리</title>
  <desc id="d-ochem-11-interconversion-ladder">위에서 아래로 산 염화물 RCOCl, 산 무수물 (RCO)₂O, 에스터 RCOOR′(옆에 같은 높이의 카복실산 RCOOH), 아마이드 RCONR′₂, 카복실산 이온 RCOO⁻. 초록 화살표는 바로 일어나는 내리막 변환과 시약이다: 산 염화물 → 무수물(RCOO⁻), → 에스터(R′OH, 피리딘), → 아마이드(R′₂NH 2 당량), → 카복실산(H₂O). 무수물 → 에스터(R′OH), → 아마이드(R′₂NH). 에스터 → 아마이드(R′₂NH, 가열), → 카복실산 이온(NaOH, 비누화). 아마이드 → 카복실산 이온(NaOH, 가열). 굵은 파란 화살표: 카복실산을 SOCl₂ 또는 (COCl)₂로 활성화해 산 염화물로 올린다. 카복실산 ⇌ 에스터는 피셔 에스터화(R′OH, H⁺, 평형)이다.</desc>
