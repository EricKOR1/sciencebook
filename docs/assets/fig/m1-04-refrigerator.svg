    .rf-t{font-size:14px;fill:var(--fig-ink)}
    .rf-sm{font-size:13px;fill:var(--fig-muted)}
    .rf-redb{font-size:14px;font-weight:700;fill:var(--fig-red)}
    .rf-sred{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.6}
    .rf-blueb{font-size:14px;font-weight:700;fill:var(--fig-blue)}
    .rf-sblue{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6}
    .rf-greenb{font-size:14px;font-weight:700;fill:var(--fig-green)}
    .rf-sgreen{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.6}
    .rf-amberb{font-size:14px;font-weight:700;fill:var(--fig-amber)}
    .rf-samber{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.6}
    .rf-violetb{font-size:14px;font-weight:700;fill:var(--fig-violet)}
    .rf-sviolet{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.6}
    .rf-tealb{font-size:14px;font-weight:700;fill:var(--fig-teal)}
    .rf-steal{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.6}
    .rf-panel{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.4}
    .rf-paper{fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1.4}
    .rf-axis{fill:none;stroke:var(--fig-ink);stroke-width:1.6}
    .rf-grid{fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 4}
    .rf-dash{fill:none;stroke:var(--fig-muted);stroke-width:1.4;stroke-dasharray:5 4}
    .rf-pipe{fill:none;stroke:var(--fig-ink);stroke-width:5;stroke-linejoin:round;stroke-linecap:round} .rf-in{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6} .rf-out{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.6} .rf-comp{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2}
