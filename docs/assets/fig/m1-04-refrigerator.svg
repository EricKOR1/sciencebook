<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="t-m1-04-refrigerator d-m1-04-refrigerator">
  <title id="t-m1-04-refrigerator">그림 중1-4-9 냉장고가 열을 옮기는 원리</title>
  <desc id="d-m1-04-refrigerator">냉매가 관을 따라 돌면서 냉장고 안쪽 관에서는 기화하며 안의 열을 흡수하고, 압축기를 지나 냉장고 바깥쪽 관에서는 액화하며 열을 방출한다. 액체가 된 냉매는 가는 관을 지나 다시 안쪽으로 돌아온다. 관의 모양과 배치는 모식적이다.</desc>
  <style>
    .rf-red{fill:none;stroke:var(--fig-red)} .rf-redh{fill:var(--fig-red)}
    .rf-blue{fill:none;stroke:var(--fig-blue)} .rf-blueh{fill:var(--fig-blue)}
    .rf-green{fill:none;stroke:var(--fig-green)} .rf-greenh{fill:var(--fig-green)}
    .rf-amber{fill:none;stroke:var(--fig-amber)} .rf-amberh{fill:var(--fig-amber)}
    .rf-violet{fill:none;stroke:var(--fig-violet)} .rf-violeth{fill:var(--fig-violet)}
    .rf-teal{fill:none;stroke:var(--fig-teal)} .rf-tealh{fill:var(--fig-teal)}
    .rf-ink{fill:none;stroke:var(--fig-ink)} .rf-inkh{fill:var(--fig-ink)}
    .rf-muted{fill:none;stroke:var(--fig-muted)} .rf-mutedh{fill:var(--fig-muted)}
    .rf-line{fill:none;stroke:var(--fig-line)} .rf-lineh{fill:var(--fig-line)}
