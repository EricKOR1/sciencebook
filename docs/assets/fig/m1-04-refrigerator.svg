  <path d="M668.0 255.0 L658.0 259.8 L658.0 250.2 Z" class="rf-redh"/>
  <text x="46.0" y="160.0" class="rf-redb">열</text>
  <text x="640.0" y="160.0" class="rf-redb">열</text>
  <text x="165.0" y="278.0" text-anchor="middle" class="rf-t">① 액체 → 기체 (기화)</text>
  <text x="165.0" y="296.0" text-anchor="middle" class="rf-sm">안의 열을 흡수 → 차가워짐</text>
  <text x="360.0" y="82.0" text-anchor="middle" class="rf-t">② 기체를 압축</text>
  <text x="555.0" y="278.0" text-anchor="middle" class="rf-t">③ 기체 → 액체 (액화)</text>
  <text x="555.0" y="296.0" text-anchor="middle" class="rf-sm">열을 방출 → 바깥이 따뜻해짐</text>
  <text x="360.0" y="180.0" text-anchor="middle" class="rf-sm">냉매가</text>
  <text x="360.0" y="198.0" text-anchor="middle" class="rf-sm">관을 따라 돈다</text>
