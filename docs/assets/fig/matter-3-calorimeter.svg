<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-matter-3-calorimeter d-matter-3-calorimeter">
  <title id="t-matter-3-calorimeter">그림 물질과 에너지 3-3 간이 열량계와 온도 변화</title>
  <desc id="d-matter-3-calorimeter">스타이로폼 컵 두 개를 겹치고 뚜껑을 덮어 열 손실을 줄인 간이 열량계에 온도 센서와 젓개를 꽂는다. 섞은 뒤 온도가 올라 최고 온도에 이르면 처음 온도와의 차이 Δt로 Q = cmΔt를 구한다. 그래프는 예제 1(25.0 °C → 31.7 °C)의 모양을 나타낸 모식도이다.</desc>
