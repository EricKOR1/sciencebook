    .matter-3-calorimeter-g{fill:none;stroke:var(--fig-muted);stroke-width:1.2;stroke-dasharray:4 4}
    .matter-3-calorimeter-lv{fill:none;stroke:var(--fig-ink);stroke-width:3;stroke-linecap:round}
    .matter-3-calorimeter-ink{fill:var(--fig-ink)}
    .matter-3-calorimeter-l{font-size:14px;fill:var(--fig-ink)}
