<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-uphy-12-q-muon-frames d-uphy-12-q-muon-frames">
  <title id="t-uphy-12-q-muon-frames">그림 일반물리학 12-2 예제 1 풀이의 두 기준틀에서 본 뮤온</title>
  <desc id="d-uphy-12-q-muon-frames">(가) 지상 기준틀: 뮤온이 고도 10 km에서 0.995c로 내려오는 데 33.5 μs가 걸리지만, 뮤온의 시계는 그 1/γ인 3.35 μs만 간다. (나) 뮤온 기준틀: 뮤온은 정지해 있고 대기층과 지면이 0.995c로 다가오며, 대기층의 두께는 10 km/γ ≈ 1.0 km로 수축해 있다. 두 칸의 세로 길이는 같은 축척이다.</desc>
  <style>.u12qd-t{font-size:14px;fill:var(--fig-ink)} .u12qd-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .u12qd-s{font-size:13px;fill:var(--fig-muted)} .u12qd-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}</style>
