<text x="400.0" y="142.0" class="u12qd-t">대기층 약 1.0 km</text>
<circle cx="580.0" cy="100.0" r="7" style="fill:var(--fig-red);stroke:var(--fig-ink);stroke-width:1.2"/>
<text x="592.0" y="104.0" class="u12qd-s">뮤온 (정지)</text>
