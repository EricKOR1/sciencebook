<text x="300.0" y="282.0" text-anchor="end" class="u12qd-s">지면</text>
<line x1="74.0" y1="50.0" x2="86.0" y2="50.0" style="stroke:var(--fig-muted);stroke-width:1.2;fill:none"/>
<line x1="74.0" y1="290.0" x2="86.0" y2="290.0" style="stroke:var(--fig-muted);stroke-width:1.2;fill:none"/>
<line x1="80.0" y1="170.0" x2="80.0" y2="57.0" style="stroke:var(--fig-muted);stroke-width:1.2;fill:none"/>
<path d="M80.0 50.0 L83.5 57.0 L76.5 57.0 Z" style="fill:var(--fig-muted);stroke:none"/>
