<text x="88.0" y="175.0" class="u12qd-t">10 km</text>
<circle cx="200.0" cy="66.0" r="7" style="fill:var(--fig-red);stroke:var(--fig-ink);stroke-width:1.2"/>
<text x="212.0" y="62.0" class="u12qd-s">뮤온 생성</text>
<line x1="200.0" y1="80.0" x2="200.0" y2="150.0" style="stroke:var(--fig-red);stroke-width:2.6;fill:none"/>
<path d="M200.0 160.0 L195.0 150.0 L205.0 150.0 Z" style="fill:var(--fig-red);stroke:none"/>
<text x="208.0" y="130.0" class="u12qd-t" style="fill:var(--fig-red)">0.995c</text>
<text x="175.0" y="200.0" text-anchor="middle" class="u12qd-t">지상 시계 33.5 μs</text>
<text x="175.0" y="220.0" text-anchor="middle" class="u12qd-t">뮤온 시계 3.35 μs</text>
