<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-astro-2-multiwavelength d-astro-2-multiwavelength">
  <title id="t-astro-2-multiwavelength">그림 행성우주과학 2-5 같은 순간 여러 파장으로 본 태양</title>
  <desc id="d-astro-2-multiwavelength">같은 활동 영역을 네 파장으로 본 모식도이다. 가시광선에서는 광구의 흑점이 어둡고 가장자리가 어두워진다. Hα선에서는 채층의 흑점 주변이 밝게 보이고, 원반 위의 필라멘트는 어두운 줄로, 가장자리 밖의 홍염은 밝게 보인다. 극자외선과 X선에서는 원반 전체가 어둡지만 흑점 위 코로나 고리는 가장 밝게 빛나고 코로나 구멍은 어둡다. 영상의 색은 파장을 구분하려고 붙인 표시용 색이다.</desc>
  <style>.astro-2-multiwavelength-ink{fill:var(--fig-ink)} .astro-2-multiwavelength-mut{fill:var(--fig-muted)} .astro-2-multiwavelength-t{font-size:14px;fill:var(--fig-ink)} .astro-2-multiwavelength-s{font-size:13px;fill:var(--fig-muted)} .astro-2-multiwavelength-b{font-weight:600} .astro-2-multiwavelength-ax{stroke:var(--fig-line);stroke-width:1.5;fill:none}</style>
  <defs><radialGradient id="astro-2-multiwavelength-g0"><stop offset="0" style="stop-color:#fff6c8"/><stop offset="0.75" style="stop-color:#f7c84a"/><stop offset="1" style="stop-color:#d9822b"/></radialGradient><radialGradient id="astro-2-multiwavelength-g1"><stop offset="0" style="stop-color:#ff9c80"/><stop offset="0.75" style="stop-color:#e0533c"/><stop offset="1" style="stop-color:#8a2219"/></radialGradient><radialGradient id="astro-2-multiwavelength-g2"><stop offset="0" style="stop-color:#4a5a20"/><stop offset="0.75" style="stop-color:#2e3a14"/><stop offset="1" style="stop-color:#1c240c"/></radialGradient><radialGradient id="astro-2-multiwavelength-g3"><stop offset="0" style="stop-color:#3b3046"/><stop offset="0.75" style="stop-color:#241c2c"/><stop offset="1" style="stop-color:#16101c"/></radialGradient></defs>
  <rect x="15.0" y="50.0" width="170.0" height="180.0" rx="6" style="fill:#05070c;stroke:var(--fig-line);stroke-width:1"/>
  <circle cx="100.0" cy="140" r="66" style="fill:url(#astro-2-multiwavelength-g0)"/>
  <circle cx="107.0" cy="128.0" r="9.5" style="fill:#9a6a2a;stroke:none;stroke-width:1"/>
  <circle cx="107.0" cy="128.0" r="6.5" style="fill:#3a2610;stroke:none;stroke-width:1"/>
  <circle cx="123.0" cy="128.0" r="8.0" style="fill:#9a6a2a;stroke:none;stroke-width:1"/>
  <circle cx="123.0" cy="128.0" r="5.0" style="fill:#3a2610;stroke:none;stroke-width:1"/>
  <circle cx="70.0" cy="166.0" r="3.0" style="fill:#5a3c18;stroke:none;stroke-width:1"/>
  <text x="100.0" y="254.0" text-anchor="middle" class="astro-2-multiwavelength-t astro-2-multiwavelength-b">가시광선</text>
  <text x="100.0" y="274.0" text-anchor="middle" class="astro-2-multiwavelength-s">광구</text>
  <text x="100.0" y="294.0" text-anchor="middle" class="astro-2-multiwavelength-t" style="fill:var(--fig-accent)">흑점: 어둡다</text>
  <rect x="190.0" y="50.0" width="170.0" height="180.0" rx="6" style="fill:#05070c;stroke:var(--fig-line);stroke-width:1"/>
  <circle cx="275.0" cy="140" r="66" style="fill:url(#astro-2-multiwavelength-g1)"/>
  <ellipse cx="289.0" cy="128" rx="22" ry="13" style="fill:#ffd9b8;opacity:0.9"/>
  <path d="M235.0 160 q14 -8 26 0 t24 4" style="fill:none;stroke:#4a1008;stroke-width:3.2"/>
  <path d="M215.0 106 q-18 -10 -10 -26 q8 8 6 18" style="fill:#ff8a6a;stroke:#ff8a6a;stroke-width:2"/>
  <text x="275.0" y="254.0" text-anchor="middle" class="astro-2-multiwavelength-t astro-2-multiwavelength-b">Hα선</text>
  <text x="275.0" y="274.0" text-anchor="middle" class="astro-2-multiwavelength-s">채층</text>
  <text x="275.0" y="294.0" text-anchor="middle" class="astro-2-multiwavelength-t" style="fill:var(--fig-accent)">주변이 밝다</text>
  <rect x="365.0" y="50.0" width="170.0" height="180.0" rx="6" style="fill:#05070c;stroke:var(--fig-line);stroke-width:1"/>
  <circle cx="450.0" cy="140" r="66" style="fill:url(#astro-2-multiwavelength-g2)"/>
  <ellipse cx="464.0" cy="128" rx="28" ry="18" style="fill:#b8d84a;opacity:0.55"/>
  <path d="M450.0 132 q12 -22 26 0" style="fill:none;stroke:#e9ff9a;stroke-width:2.2"/>
  <path d="M453.0 132 q12 -26 26 0" style="fill:none;stroke:#e9ff9a;stroke-width:2.2"/>
  <path d="M456.0 132 q12 -30 26 0" style="fill:none;stroke:#e9ff9a;stroke-width:2.2"/>
  <path d="M459.0 132 q12 -34 26 0" style="fill:none;stroke:#e9ff9a;stroke-width:2.2"/>
  <ellipse cx="432.0" cy="174" rx="22" ry="14" style="fill:#000000;opacity:0.8"/>
  <circle cx="450.0" cy="140" r="75" style="fill:none;stroke:#b8d84a;stroke-width:6;opacity:0.25"/>
  <text x="450.0" y="254.0" text-anchor="middle" class="astro-2-multiwavelength-t astro-2-multiwavelength-b">극자외선</text>
  <text x="450.0" y="274.0" text-anchor="middle" class="astro-2-multiwavelength-s">코로나 아래쪽</text>
  <text x="450.0" y="294.0" text-anchor="middle" class="astro-2-multiwavelength-t" style="fill:var(--fig-accent)">고리가 밝다</text>
  <rect x="540.0" y="50.0" width="170.0" height="180.0" rx="6" style="fill:#05070c;stroke:var(--fig-line);stroke-width:1"/>
  <circle cx="625.0" cy="140" r="66" style="fill:url(#astro-2-multiwavelength-g3)"/>
  <ellipse cx="639.0" cy="128" rx="24" ry="15" style="fill:#d9c8ff;opacity:0.55"/>
  <path d="M625.0 132 q12 -22 26 0" style="fill:none;stroke:#ffffff;stroke-width:2.2"/>
  <path d="M628.0 132 q12 -26 26 0" style="fill:none;stroke:#ffffff;stroke-width:2.2"/>
  <path d="M631.0 132 q12 -30 26 0" style="fill:none;stroke:#ffffff;stroke-width:2.2"/>
  <path d="M634.0 132 q12 -34 26 0" style="fill:none;stroke:#ffffff;stroke-width:2.2"/>
  <ellipse cx="607.0" cy="174" rx="22" ry="14" style="fill:#000000;opacity:0.8"/>
  <circle cx="625.0" cy="140" r="75" style="fill:none;stroke:#d9c8ff;stroke-width:6;opacity:0.25"/>
  <text x="625.0" y="254.0" text-anchor="middle" class="astro-2-multiwavelength-t astro-2-multiwavelength-b">X선</text>
  <text x="625.0" y="274.0" text-anchor="middle" class="astro-2-multiwavelength-s">코로나</text>
  <text x="625.0" y="294.0" text-anchor="middle" class="astro-2-multiwavelength-t" style="fill:var(--fig-accent)">매우 밝다</text>
  <text x="20.0" y="30.0" text-anchor="start" class="astro-2-multiwavelength-t astro-2-multiwavelength-b">같은 활동 영역(흑점 자리)을 네 파장으로 본 모식도</text>
  <text x="20.0" y="326.0" text-anchor="start" class="astro-2-multiwavelength-s">Hα: 어두운 줄 = 필라멘트, 왼쪽 위 가장자리 밖 = 홍염</text>
  <text x="20.0" y="346.0" text-anchor="start" class="astro-2-multiwavelength-s">극자외선·X선: 원반 아래쪽의 어두운 얼룩 = 코로나 구멍</text>
</svg>
