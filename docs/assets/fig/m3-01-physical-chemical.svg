  <text x="359" y="285" text-anchor="middle" class="m3-01-physical-chemical-l">물리 변화: 분자는 그대로, <tspan style="font-weight:700">배열·거리만</tspan> 바뀐다   |   화학 변화: 원자가 <tspan style="font-weight:700">새로 짝을 지어</tspan> 다른 분자가 생긴다</text>
