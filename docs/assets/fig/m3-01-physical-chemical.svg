<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-m3-01-physical-chemical d-m3-01-physical-chemical">
  <title id="t-m3-01-physical-chemical">그림 중3-1-4 물리 변화와 화학 변화를 입자로 본 모습</title>
  <desc id="d-m3-01-physical-chemical">왼쪽은 물이 끓어 수증기가 되는 물리 변화로, 물 분자 사이의 거리와 배열만 달라지고 물 분자 자체는 그대로이다. 오른쪽은 수소와 산소가 반응하여 물이 되는 화학 변화로, 원자들이 결합을 끊고 새로 짝을 지어 다른 분자가 생긴다. 두 경우 모두 원자의 종류와 수는 변하지 않는다. 흰 구슬은 수소 원자, 빨간 구슬은 산소 원자이며 크기는 단순화한 모식도이다.</desc>
  <style>.m3-01-physical-chemical-l{font-size:14px;fill:var(--fig-ink)} .m3-01-physical-chemical-t{font-size:13px;fill:var(--fig-muted)} .m3-01-physical-chemical-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .m3-01-physical-chemical-H{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.5} .m3-01-physical-chemical-O{fill:var(--fig-red);stroke:var(--fig-ink);stroke-width:1.5}</style>
  <text x="180" y="28" text-anchor="middle" class="m3-01-physical-chemical-h" style="fill:var(--fig-blue)">물리 변화 — 물이 끓어 수증기가 된다</text>
