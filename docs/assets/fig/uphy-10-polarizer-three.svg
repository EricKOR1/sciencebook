<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-labelledby="t-uphy-10-polarizer-three d-uphy-10-polarizer-three">
  <title id="t-uphy-10-polarizer-three">그림 일반물리학 10-7 편광판 세 장을 지나는 빛의 세기</title>
  <desc id="d-uphy-10-polarizer-three">빛이 왼쪽에서 오른쪽으로 나아가며 투과축이 0°, 30°, 90°인 편광판을 차례로 지난다(진행 방향에서 바라본 모습). 비편광 빛은 첫 판에서 절반이 되고, 둘째 판에서 cos²30° = 0.75배, 셋째 판에서 cos²60° = 0.25배가 되어 최종 세기는 약 0.094 I₀이다. 가운데 판을 빼면 0°와 90°가 수직이므로 빛이 전혀 지나가지 못한다. 원 안의 양쪽 화살표는 빛의 전기장 진동 방향(편광 방향)이다.</desc>
