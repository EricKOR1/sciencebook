<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-m1-01-science-timeline d-m1-01-science-timeline">
<title id="t-m1-01-science-timeline">그림 중1-1-2 과학과 기술이 바꾼 인류 문명의 연표</title>
<desc id="d-m1-01-science-timeline">금속 활자 인쇄에서 인공지능까지, 과학 지식과 기술의 발전이 기록·인쇄, 농업·식량, 관측 도구, 동력·교통, 의학, 전기·통신 분야를 바꾸어 온 주요 사건을 시간 순서로 나타냈다. 사건 사이의 간격은 실제 시간 비율과 다르다.</desc>
