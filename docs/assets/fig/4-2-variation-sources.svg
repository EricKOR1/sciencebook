<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-4-2-variation-sources d-4-2-variation-sources">
  <title id="t-4-2-variation-sources">그림 4-2-3 유전적 변이가 생기는 세 가지 원인</title>
  <desc id="d-4-2-variation-sources">① 돌연변이로 DNA의 염기 하나가 바뀌면 새로운 유전자가 생길 수 있다. ② 생식세포가 만들어질 때 부모에게서 받은 염색체 쌍(파란색은 아버지, 빨간색은 어머니에게서 받은 것)이 무작위로 나뉘어 들어가, 염색체 두 쌍만으로도 네 가지 생식세포가 생긴다. ③ 어떤 정자와 어떤 난자가 수정할지도 무작위여서 조합이 더욱 다양해진다. 염색체 수를 줄인 모식도.</desc>
  <style>
    .vs-h{font-size:14px;font-weight:700;fill:var(--fig-ink)}
    .vs-t{font-size:13px;fill:var(--fig-ink)}
    .vs-mu{font-size:13px;fill:var(--fig-muted)}
    .vs-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1}
    .vs-base{fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1}
    .vs-mut{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:2}
    .vs-b{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .vs-cell{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5}
    .vs-p{fill:var(--fig-blue);stroke:none}
    .vs-m{fill:var(--fig-red);stroke:none}
    .vs-arr{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
    .vs-arrh{fill:var(--fig-ink)}
  </style>
  <rect x="8" y="8" width="220" height="324" rx="6" class="vs-box"/>
  <rect x="236" y="8" width="252" height="324" rx="6" class="vs-box"/>
  <rect x="496" y="8" width="216" height="324" rx="6" class="vs-box"/>
  <text x="118" y="32" text-anchor="middle" class="vs-h">① 돌연변이</text>
  <text x="362" y="32" text-anchor="middle" class="vs-h">② 생식세포 형성</text>
  <text x="604" y="32" text-anchor="middle" class="vs-h">③ 수정</text>
  <text x="118" y="64" text-anchor="middle" class="vs-mu">원래 염기 서열</text>
  <rect x="22" y="74" width="28" height="28" rx="4" class="vs-base"/><text x="36" y="94" text-anchor="middle" class="vs-b">A</text>
  <rect x="54" y="74" width="28" height="28" rx="4" class="vs-base"/><text x="68" y="94" text-anchor="middle" class="vs-b">T</text>
  <rect x="86" y="74" width="28" height="28" rx="4" class="vs-base"/><text x="100" y="94" text-anchor="middle" class="vs-b">G</text>
