  <rect x="382" y="88.0" width="8" height="24" rx="4" class="vs-m"/>
  <text x="414" y="76" class="vs-mu">부모에게서</text><text x="414" y="92" class="vs-mu">받은 염색체</text><text x="414" y="108" class="vs-mu">2쌍</text>
