  <rect x="150" y="74" width="28" height="28" rx="4" class="vs-base"/><text x="164" y="94" text-anchor="middle" class="vs-b">C</text>
  <rect x="182" y="74" width="28" height="28" rx="4" class="vs-base"/><text x="196" y="94" text-anchor="middle" class="vs-b">A</text>
