  <text x="128" y="128" class="vs-mu">복제 오류,</text><text x="128" y="144" class="vs-mu" dx="0">자외선 등</text>
  <rect x="22" y="160" width="28" height="28" rx="4" class="vs-base"/><text x="36" y="180" text-anchor="middle" class="vs-b">A</text>
  <rect x="54" y="160" width="28" height="28" rx="4" class="vs-base"/><text x="68" y="180" text-anchor="middle" class="vs-b">T</text>
  <rect x="86" y="160" width="28" height="28" rx="4" class="vs-base"/><text x="100" y="180" text-anchor="middle" class="vs-b">G</text>
