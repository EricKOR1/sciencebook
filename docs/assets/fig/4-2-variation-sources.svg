  <text x="118" y="218" text-anchor="middle" class="vs-t">염기 하나가 바뀜</text>
  <text x="118" y="250" text-anchor="middle" class="vs-t">→ 다른 단백질이 만들어져</text>
  <text x="118" y="270" text-anchor="middle" class="vs-t">새로운 형질이 나타날 수 있다</text>
  <text x="118" y="308" text-anchor="middle" class="vs-mu">새로운 유전자의 근본 원천</text>
