  <rect x="461" y="219.0" width="8" height="18" rx="4" class="vs-m"/>
  <text x="362" y="282" text-anchor="middle" class="vs-t">각 쌍에서 어느 쪽이 들어갈지 무작위</text>
  <text x="362" y="302" text-anchor="middle" class="vs-t">→ 두 쌍만으로도 생식세포 4가지</text>
  <rect x="262" y="314" width="10" height="10" rx="2" class="vs-p"/><text x="276" y="324" class="vs-mu">아버지에게서</text>
  <rect x="372" y="314" width="10" height="10" rx="2" class="vs-m"/><text x="386" y="324" class="vs-mu">어머니에게서</text>
  <text x="604" y="62" text-anchor="middle" class="vs-t">정자 4가지 중 하나</text>
  <text x="604" y="80" text-anchor="middle" class="vs-t">× 난자 4가지 중 하나</text>
  <circle cx="650" cy="150" r="34" class="vs-cell"/>
  <text x="650" y="155" text-anchor="middle" class="vs-t">난자</text>
  <ellipse cx="560" cy="150" rx="12" ry="8" class="vs-cell"/>
  <path d="M548 150 Q538 142 530 150 T512 150" class="vs-arr"/>
  <path d="M574 150 H608" class="vs-arr"/><path d="M604 144 L614 150 L604 156 Z" class="vs-arrh"/>
  <text x="560" y="178" text-anchor="middle" class="vs-t">정자</text>
  <text x="604" y="226" text-anchor="middle" class="vs-t">어떤 정자와 어떤 난자가</text>
  <text x="604" y="246" text-anchor="middle" class="vs-t">만날지도 무작위</text>
  <text x="604" y="276" text-anchor="middle" class="vs-b">4 × 4 = 16가지 조합</text>
  <text x="604" y="308" text-anchor="middle" class="vs-mu">→ 형제자매도 서로 다르다</text>
