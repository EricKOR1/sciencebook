<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" class="fig-small" role="img" aria-labelledby="t-uearth-1-q-compaction d-uearth-1-q-compaction">
<title id="t-uearth-1-q-compaction">그림 일반지구과학 1-12 문제 15 풀이 — 다짐 전후의 알갱이와 공극</title>
<desc id="d-uearth-1-q-compaction">단위 넓이 기둥으로 본 진흙(공극률 60 %)과 셰일(공극률 10 %). 알갱이만 모은 두께 19.8 m는 다짐 전후에 같으므로, 진흙층은 19.8 ÷ 0.40 = 49.5 m, 셰일은 22 m이다. 높이는 두께에 비례한다.</desc>
