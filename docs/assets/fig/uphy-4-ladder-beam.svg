<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-uphy-4-ladder-beam d-uphy-4-ladder-beam">
  <title id="t-uphy-4-ladder-beam">그림 일반물리학 4-8 정적 평형 문제의 힘 — 벽에 기댄 사다리와 간판 받침대</title>
  <desc id="d-uphy-4-ladder-beam">왼쪽(예제 11): 마찰 없는 벽에 기댄 사다리에는 벽의 수직 항력 N_w, 바닥의 수직 항력 N_f와 마찰력 f, 사다리 무게(중점)와 사람 무게가 작용한다. 바닥 접촉점을 기준점으로 잡으면 N_f와 f의 토크가 0이다. 오른쪽(예제 12): 경첩에 연결된 수평 들보에 케이블 장력 T, 들보 무게(중점), 간판 무게, 경첩의 힘 H_x, H_y가 작용한다. 모식도이며 화살표 길이는 대략적이다.</desc>
