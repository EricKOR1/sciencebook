  <text x="422.0" y="192.0" text-anchor="start" class="rxn-2-q-scratched-coatings-a">철(Fe)</text>
  <line x1="440.0" y1="140.0" x2="440.0" y2="112.0" style="stroke:var(--fig-muted);stroke-width:1"/>
  <text x="406.0" y="104.0" text-anchor="start" class="rxn-2-q-scratched-coatings-t">주석(Sn) 도금층</text>
  <line x1="570.0" y1="108.0" x2="610.0" y2="82.0" style="stroke:var(--fig-muted);stroke-width:1"/>
  <text x="614.0" y="80.0" text-anchor="start" class="rxn-2-q-scratched-coatings-t">빗물</text>
