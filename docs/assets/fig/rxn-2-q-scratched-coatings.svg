<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-labelledby="t-rxn-2-q-scratched-coatings d-rxn-2-q-scratched-coatings">
  <title id="t-rxn-2-q-scratched-coatings">그림 화학 반응의 세계 2-10 문제 17의 표면이 긁힌 두 강판</title>
  <desc id="d-rxn-2-q-scratched-coatings">(가)는 아연을, (나)는 주석을 입힌 강판의 단면으로, 두 강판 모두 표면이 긁혀 철이 드러난 곳이 빗물에 젖어 있다. 도금층의 두께와 긁힌 부분의 크기는 모식적으로 나타냈다.</desc>
  <style>
    .rxn-2-q-scratched-coatings-t{font-size:14px;fill:var(--fig-ink)}
    .rxn-2-q-scratched-coatings-b{font-size:15px;fill:var(--fig-ink);font-weight:700}
    .rxn-2-q-scratched-coatings-s{font-size:13px;fill:var(--fig-muted)}
    .rxn-2-q-scratched-coatings-a{font-size:15px;fill:var(--fig-ink);font-weight:600}
  </style>
  <text x="180.0" y="34.0" text-anchor="middle" class="rxn-2-q-scratched-coatings-a">(가) 아연을 입힌 강판(함석)</text>
  <path d="M30 150 H164 L174 168 H186 L196 150 H330 V215 H30 Z" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <rect x="30" y="134" width="134" height="16" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <rect x="196" y="134" width="134" height="16" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <path d="M128 134 Q180 76 232 134 H196 V150 L186 168 H174 L164 150 V134 Z" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.8;opacity:0.9"/>
  <text x="62.0" y="192.0" text-anchor="start" class="rxn-2-q-scratched-coatings-a">철(Fe)</text>
  <line x1="80.0" y1="140.0" x2="80.0" y2="112.0" style="stroke:var(--fig-muted);stroke-width:1"/>
  <text x="46.0" y="104.0" text-anchor="start" class="rxn-2-q-scratched-coatings-t">아연(Zn) 도금층</text>
  <line x1="210.0" y1="108.0" x2="250.0" y2="82.0" style="stroke:var(--fig-muted);stroke-width:1"/>
  <text x="254.0" y="80.0" text-anchor="start" class="rxn-2-q-scratched-coatings-t">빗물</text>
  <line x1="180.0" y1="162.0" x2="180.0" y2="236.0" style="stroke:var(--fig-muted);stroke-width:1"/>
  <text x="180.0" y="252.0" text-anchor="middle" class="rxn-2-q-scratched-coatings-t">긁혀서 철이 드러난 부분</text>
  <text x="540.0" y="34.0" text-anchor="middle" class="rxn-2-q-scratched-coatings-a">(나) 주석을 입힌 강판(양철)</text>
  <path d="M390 150 H524 L534 168 H546 L556 150 H690 V215 H390 Z" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <rect x="390" y="134" width="134" height="16" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2"/>
