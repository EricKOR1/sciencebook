<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" class="fig-small" role="img" aria-labelledby="t-uchem-2-q-two-flasks d-uchem-2-q-two-flasks">
  <title id="t-uchem-2-q-two-flasks">그림 일반화학 2-11 문제 15의 두 플라스크</title>
  <desc id="d-uchem-2-q-two-flasks">꼭지가 닫힌 연결관으로 이어진 플라스크 A(질소, 2.00 L, 1.50 atm)와 플라스크 B(산소, 3.00 L, 0.800 atm). 두 플라스크의 온도는 같다. 크기는 모식적이다.</desc>
  <style>.uchem-2-q-two-flasks-t{font-size:14px;fill:var(--fig-ink)} .uchem-2-q-two-flasks-s{font-size:13px;fill:var(--fig-muted)} .uchem-2-q-two-flasks-b{font-size:15px;font-weight:700;fill:var(--fig-ink)} .uchem-2-q-two-flasks-p{font-size:13px;fill:var(--fig-ink)} .uchem-2-q-two-flasks-r{font-size:14px;fill:var(--fig-red)} .uchem-2-q-two-flasks-bl{font-size:14px;fill:var(--fig-blue)} .uchem-2-q-two-flasks-g{font-size:14px;fill:var(--fig-green)}</style>
  <rect x="168" y="133" width="110" height="14" rx="0" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.5"/>
  <circle cx="110" cy="140" r="62" style="fill:var(--fig-soft-blue);stroke:var(--fig-ink);stroke-width:2"/>
  <circle cx="345" cy="140" r="71" style="fill:var(--fig-soft-red);stroke:var(--fig-ink);stroke-width:2"/>
  <circle cx="223" cy="140" r="11" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.6"/>
  <line x1="223" y1="131" x2="223" y2="149" style="stroke:var(--fig-ink);stroke-width:3"/>
  <text x="223" y="120" text-anchor="middle" class="uchem-2-q-two-flasks-s">꼭지(닫힘)</text>
  <text x="110" y="134" text-anchor="middle" class="uchem-2-q-two-flasks-b">A</text>
  <text x="110" y="156" text-anchor="middle" class="uchem-2-q-two-flasks-t">N₂</text>
  <text x="345" y="134" text-anchor="middle" class="uchem-2-q-two-flasks-b">B</text>
  <text x="345" y="156" text-anchor="middle" class="uchem-2-q-two-flasks-t">O₂</text>
  <text x="110" y="240" text-anchor="middle" class="uchem-2-q-two-flasks-t">2.00 L, 1.50 atm</text>
  <text x="345" y="240" text-anchor="middle" class="uchem-2-q-two-flasks-t">3.00 L, 0.800 atm</text>
  <text x="240" y="262" text-anchor="middle" class="uchem-2-q-two-flasks-s">연결관의 부피는 무시한다</text>
</svg>
