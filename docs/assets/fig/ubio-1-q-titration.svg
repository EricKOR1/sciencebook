<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-ubio-1-q-titration d-ubio-1-q-titration">
  <title id="t-ubio-1-q-titration">그림 일반생명과학 1-3 약산 HA(pKa 6.8)의 적정 곡선</title>
  <desc id="d-ubio-1-q-titration">0.10 M 약산 HA 용액에 NaOH를 조금씩 넣을 때 pH의 변화를 계산한 곡선이다(부피 변화는 무시). 가로축은 넣은 OH⁻의 양을 처음 HA의 양에 대한 비로 나타냈고, 점선은 pH = pKa = 6.8이다.</desc>
