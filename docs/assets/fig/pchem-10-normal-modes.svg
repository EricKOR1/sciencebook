<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 484" role="img" aria-labelledby="t-pchem-10-normal-modes d-pchem-10-normal-modes">
  <title id="t-pchem-10-normal-modes">그림 물리화학 10-5 H₂O와 CO₂의 기준 진동 방식</title>
  <desc id="d-pchem-10-normal-modes">화살표는 한 순간의 원자 변위 방향이다(모식도). 질량 중심이 움직이지 않고 분자가 돌지 않도록 질량×변위의 합을 0으로 맞추었으므로 가벼운 H는 크게, 무거운 O·C는 작게 움직인다(H₂O의 O 화살표만 5배로 키워 그렸다). H₂O(굽은형, 104.5°): ν₁ 대칭 신축 3657 cm⁻¹, ν₂ 굽힘 1595 cm⁻¹, ν₃ 비대칭 신축 3756 cm⁻¹, 세 진동 모두 쌍극자가 변하고 적외선·라만 활성이다. CO₂(선형): ν₁ 대칭 신축 1388 cm⁻¹은 쌍극자가 변하지 않아(Δμ = 0) 적외선 불활성·라만 활성, ν₂ 굽힘 667 cm⁻¹(종이면에 수직인 같은 진동이 하나 더 있어 2중 축퇴)과 ν₃ 비대칭 신축 2349 cm⁻¹은 Δμ ≠ 0으로 적외선 활성이다.</desc>
