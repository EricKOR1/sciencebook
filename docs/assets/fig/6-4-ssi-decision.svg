<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-6-4-ssi-decision d-6-4-ssi-decision">
  <title id="t-6-4-ssi-decision">그림 6-4-2 과학 관련 사회적 쟁점의 의사결정 — 사실 판단과 가치 판단</title>
  <desc id="d-6-4-ssi-decision">하나의 쟁점 안에는 관찰·실험으로 답할 사실 질문과 사회가 함께 정할 가치 질문이 섞여 있다. 사실 질문의 답은 정보 수집 단계의 과학적 증거가 되고, 가치 질문은 판단 기준과 그 중요도를 정하는 데 쓰인다. 새 증거가 나오면 결정을 다시 검토한다.</desc>
  <style>
    .f64sd-h{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .f64sd-tx{font-size:13px;fill:var(--fig-ink)}
    .f64sd-sm{font-size:12px;fill:var(--fig-muted)}
    .f64sd-step{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}
    .f64sd-arr{fill:var(--fig-ink)}
    .f64sd-ln{stroke:var(--fig-ink);stroke-width:2;fill:none}
  </style>
  <!-- 쟁점 -->
  <rect x="150" y="12" width="420" height="44" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <text x="360" y="39" text-anchor="middle" class="f64sd-h">쟁점: 유전자 변형 쌀을 국내에서 재배해도 될까?</text>
  <path d="M260 56 L200 80" class="f64sd-ln"/><path d="M192 84 l6 -12 l6 9 z" class="f64sd-arr"/>
  <path d="M460 56 L520 80" class="f64sd-ln"/><path d="M528 84 l-12 -3 l6 -9 z" class="f64sd-arr"/>

  <!-- 사실 판단 -->
  <rect x="16" y="88" width="336" height="148" rx="10" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <text x="32" y="114" class="f64sd-h" style="fill:var(--fig-blue)">과학이 답할 질문 — 사실 판단</text>
  <text x="32" y="142" class="f64sd-tx">ㄱ. 먹으면 알레르기 반응이 다르게 나타날까?</text>
  <text x="32" y="166" class="f64sd-tx">ㄴ. 유전자가 야생 벼로 옮겨 갈 가능성은?</text>
  <text x="32" y="198" class="f64sd-sm">확인 방법</text>
  <text x="32" y="220" class="f64sd-tx" style="font-weight:600">관찰 · 실험 · 데이터</text>

  <!-- 가치 판단 -->
  <rect x="368" y="88" width="336" height="148" rx="10" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:2"/>
  <text x="384" y="114" class="f64sd-h" style="fill:var(--fig-violet)">사회가 함께 답할 질문 — 가치 판단</text>
  <text x="384" y="142" class="f64sd-tx">ㄷ. 수확 이익과 생태계 위험 중 무엇이 더 중요?</text>
  <text x="384" y="166" class="f64sd-tx">ㄹ. 소비자에게 반드시 알려야 할까?</text>
  <text x="384" y="198" class="f64sd-sm">확인 방법</text>
  <text x="384" y="220" class="f64sd-tx" style="font-weight:600">가치·원칙에 근거한 논의 · 사회적 합의</text>

  <!-- 연결 -->
  <path d="M184 236 L184 282" class="f64sd-ln" style="stroke:var(--fig-blue)"/><path d="M184 290 l-6 -11 h12 z" style="fill:var(--fig-blue)"/>
  <text x="192" y="264" class="f64sd-sm">과학적 증거</text>
  <path d="M536 236 C 536 262 424 258 424 282" class="f64sd-ln" style="stroke:var(--fig-violet)"/><path d="M424 290 l-6 -11 h12 z" style="fill:var(--fig-violet)"/>
  <text x="520" y="270" class="f64sd-sm">판단 기준과 중요도</text>

  <!-- 의사결정 단계 -->
  <rect x="18" y="292" width="104" height="44" rx="8" class="f64sd-step"/>
  <rect x="134" y="292" width="104" height="44" rx="8" class="f64sd-step" style="stroke:var(--fig-blue);stroke-width:2.5"/>
  <rect x="250" y="292" width="104" height="44" rx="8" class="f64sd-step"/>
  <rect x="366" y="292" width="104" height="44" rx="8" class="f64sd-step" style="stroke:var(--fig-violet);stroke-width:2.5"/>
  <rect x="482" y="292" width="104" height="44" rx="8" class="f64sd-step"/>
  <rect x="598" y="292" width="104" height="44" rx="8" class="f64sd-step"/>
  <g class="f64sd-tx" text-anchor="middle">
    <text x="70" y="319">① 문제 확인</text><text x="186" y="319">② 정보 수집</text><text x="302" y="319">③ 대안 만들기</text>
    <text x="418" y="319">④ 기준 정하기</text><text x="534" y="319">⑤ 평가·결정</text><text x="650" y="319">⑥ 반성·수정</text>
  </g>
  <g class="f64sd-arr">
    <path d="M133 314 l-10 -5 v10 z"/><path d="M249 314 l-10 -5 v10 z"/><path d="M365 314 l-10 -5 v10 z"/><path d="M481 314 l-10 -5 v10 z"/><path d="M597 314 l-10 -5 v10 z"/>
  </g>
  <path d="M650 336 V362 H186 V346" class="f64sd-ln" style="stroke-dasharray:6 4"/>
  <path d="M186 338 l-6 11 h12 z" class="f64sd-arr"/>
  <text x="418" y="384" text-anchor="middle" class="f64sd-sm">새로운 증거가 나오면 다시 모으고 다시 판단한다</text>
</svg>
