  <desc id="d-ochem-3-q-ex8-wedges">(1) 브로모클로로플루오로메테인: F는 왼쪽 위, Cl은 왼쪽 아래(평면), Br은 오른쪽 쐐기, H는 오른쪽 점선. (2) 알라닌: COOH는 왼쪽 위, CH₃은 오른쪽 위(평면), NH₂는 아래 점선, H는 아래 쐐기.</desc>
