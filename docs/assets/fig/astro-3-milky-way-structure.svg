<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-astro-3-milky-way-structure d-astro-3-milky-way-structure">
  <title id="t-astro-3-milky-way-structure">그림 행성우주과학 3-4 옆에서 본 우리은하의 구조</title>
  <desc id="d-astro-3-milky-way-structure">지름 약 10만 광년의 납작한 원반 가운데에 팽대부가 있고, 원반을 공 모양의 헤일로가 둘러싼다. 구상 성단은 은하 중심을 중심으로 헤일로에 공 모양으로 퍼져 있으며, 태양은 중심에서 약 2만 6천 광년 떨어진 원반에 있다.</desc>
  <style>
    .astro-3-milky-way-structure-ink{fill:var(--fig-ink)} .astro-3-milky-way-structure-mut{fill:var(--fig-muted)}
    .astro-3-milky-way-structure-lbl{font-size:14px;fill:var(--fig-ink)} .astro-3-milky-way-structure-sm{font-size:13px;fill:var(--fig-muted)} .astro-3-milky-way-structure-b{font-weight:600}
    .astro-3-milky-way-structure-ax{stroke:var(--fig-line);stroke-width:1.5;fill:none}
    
  </style>
