  <text x="360" y="35" text-anchor="middle" class="astro-3-milky-way-structure-sm">구상 성단 분포의 중심 = 은하 중심 (섀플리)</text>
  <text x="360" y="342" text-anchor="middle" class="astro-3-milky-way-structure-sm">원반 두께와 성단 크기는 보이도록 과장했다 · 헤일로는 원반보다 더 넓게 퍼져 있다</text>
