  <title id="t-pchem-4-phase-rule-points">그림 물리화학 4-9 순물질의 상 규칙과 상 도표</title>
  <desc id="d-pchem-4-phase-rule-points">일반 물질형 순물질의 개략적 P–T 상 도표(고체–액체 경계는 오른쪽으로 기움). 액체 영역 안의 점은 한 상(P = 1)으로 자유도 F = 2, 증발 곡선 위의 점은 두 상(P = 2)으로 F = 1, 삼중점은 세 상(P = 3)으로 F = 0이다.</desc>
