<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-ochem-13-butylamine-alpha-cleavage d-ochem-13-butylamine-alpha-cleavage">
  <title id="t-ochem-13-butylamine-alpha-cleavage">그림 유기화학 13-2 뷰탄-1-아민의 α 절단과 질량 스펙트럼</title>
  <desc id="d-ochem-13-butylamine-alpha-cleavage">위: 뷰탄-1-아민의 분자 이온(라디칼 양이온, N에 홀전자와 양전하)에서 N의 홀전자 하나와 C1–C2 결합 전자 하나가 C1–N 사이에 새 π 결합을 만들고, C1–C2 결합의 다른 전자 하나는 C2로 가서 프로필 라디칼이 떨어진다(낚싯바늘 화살표 3개). 남는 이미늄 이온 CH₂=NH₂⁺(m/z 30)가 기준 봉우리가 되고, 중성 라디칼은 검출되지 않는다. 아래: 막대 스펙트럼(모식도). m/z 30이 100 %, 분자 이온 m/z 73이 약 10 %, 44·56·58은 작은 봉우리이다.</desc>
