<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-uearth-10-retrograde-models d-uearth-10-retrograde-models">
  <title id="t-uearth-10-retrograde-models">그림 일반지구과학 10-1 화성의 역행 — 지구 중심설과 태양 중심설의 설명</title>
  <desc id="d-uearth-10-retrograde-models">왼쪽: 지구 중심설에서는 화성이 주전원을 돌고 주전원의 중심이 이심원을 돌아, 지구에서 보면 고리 모양으로 거꾸로 가는 구간이 생긴다. 오른쪽: 태양 중심설에서는 안쪽에서 더 빨리 도는 지구가 화성을 추월할 때 시선 방향이 잠시 거꾸로 돌아 화성이 역행하는 것처럼 보인다.</desc>
