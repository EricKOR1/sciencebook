<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-m3-02-land-sea-breeze d-m3-02-land-sea-breeze">
  <title id="t-m3-02-land-sea-breeze">그림 중3-2-7 해풍과 육풍</title>
  <desc id="d-m3-02-land-sea-breeze">낮에는 육지가 바다보다 빨리 데워져 육지 위 공기가 상승하고 육지 쪽 기압이 낮아지므로, 지표에서는 바다에서 육지로 해풍이 분다. 밤에는 육지가 바다보다 빨리 식어 육지 쪽 기압이 높아지므로 육지에서 바다로 육풍이 분다. 위쪽에서는 반대 방향으로 공기가 움직여 순환을 이룬다(모식도). 계절풍도 같은 원리이다.</desc>
  <style>.m3-02-land-sea-breeze-l{font-size:14px;fill:var(--fig-ink)} .m3-02-land-sea-breeze-t{font-size:13px;fill:var(--fig-muted)} .m3-02-land-sea-breeze-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}</style>
