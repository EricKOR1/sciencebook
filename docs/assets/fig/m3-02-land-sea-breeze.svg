  <text x="270" y="236" text-anchor="middle" class="m3-02-land-sea-breeze-l" style="font-weight:700">육지</text>
  <line x1="132" y1="196" x2="224" y2="196" style="fill:none;stroke:var(--fig-red);stroke-width:3.5;stroke-linecap:round;stroke-width:5"/>
  <path d="M230.0,196.0 L214.0,188.0 L214.0,204.0 Z" style="fill:var(--fig-red)"/>
