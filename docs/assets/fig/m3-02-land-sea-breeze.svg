  <text x="540" y="30" text-anchor="middle" class="m3-02-land-sea-breeze-h">밤 — 육풍 (육지 → 바다)</text>
  <path d="M672,55 A15,15 0 1 0 672,85 A11,11 0 1 1 672,55 Z" style="fill:var(--fig-amber)"/>
  <text x="662" y="138" text-anchor="middle" class="m3-02-land-sea-breeze-t">빨리 식음</text>
  <text x="662" y="157" text-anchor="middle" class="m3-02-land-sea-breeze-l" style="font-weight:700">기압 높음</text>
  <text x="418" y="138" text-anchor="middle" class="m3-02-land-sea-breeze-t">덜 식음</text>
  <text x="418" y="157" text-anchor="middle" class="m3-02-land-sea-breeze-l" style="font-weight:700">기압 낮음</text>
  <text x="360" y="282" text-anchor="middle" class="m3-02-land-sea-breeze-l">지표의 바람은 기압이 높은 곳 → 낮은 곳. 위쪽에서는 반대로 움직여 순환한다.</text>
  <text x="360" y="306" text-anchor="middle" class="m3-02-land-sea-breeze-l"><tspan style="font-weight:700">계절풍도 같은 원리</tspan> — 여름: 해양 → 대륙(낮의 해풍처럼), 겨울: 대륙 → 해양(밤의 육풍처럼)</text>
  <text x="360" y="330" text-anchor="middle" class="m3-02-land-sea-breeze-t">육지와 바다의 차이는 물의 비열이 크기 때문이다. 높이와 거리의 비율은 실제와 다르다(모식도).</text>
</svg>
