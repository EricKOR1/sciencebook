  <text x="180" y="30" text-anchor="middle" class="m3-02-land-sea-breeze-h">낮 — 해풍 (바다 → 육지)</text>
  <circle cx="308" cy="70" r="12" style="fill:var(--fig-amber)"/>
  <line x1="325.0" y1="70.0" x2="331.0" y2="70.0" style="stroke:var(--fig-amber);stroke-width:2.4;stroke-linecap:round"/>
  <line x1="320.0" y1="82.0" x2="324.3" y2="86.3" style="stroke:var(--fig-amber);stroke-width:2.4;stroke-linecap:round"/>
