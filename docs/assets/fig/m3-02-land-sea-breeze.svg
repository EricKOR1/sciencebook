  <line x1="296.0" y1="58.0" x2="291.7" y2="53.7" style="stroke:var(--fig-amber);stroke-width:2.4;stroke-linecap:round"/>
  <line x1="308.0" y1="53.0" x2="308.0" y2="47.0" style="stroke:var(--fig-amber);stroke-width:2.4;stroke-linecap:round"/>
  <line x1="320.0" y1="58.0" x2="324.3" y2="53.7" style="stroke:var(--fig-amber);stroke-width:2.4;stroke-linecap:round"/>
  <text x="302" y="138" text-anchor="middle" class="m3-02-land-sea-breeze-t">빨리 데워짐</text>
  <text x="302" y="157" text-anchor="middle" class="m3-02-land-sea-breeze-l" style="font-weight:700">기압 낮음</text>
  <text x="58" y="138" text-anchor="middle" class="m3-02-land-sea-breeze-t">덜 데워짐</text>
  <text x="58" y="157" text-anchor="middle" class="m3-02-land-sea-breeze-l" style="font-weight:700">기압 높음</text>
