  <title id="t-uphy-5-q-floating-cube">그림 일반물리학 5-10 문제 8의 물에 뜬 나무 정육면체</title>
  <desc id="d-uphy-5-q-floating-cube">(가) 한 변이 0.20 m, 밀도 600 kg/m³인 나무 정육면체가 물에 떠 있다. (나) 위에 추를 올려 정육면체가 완전히 잠긴 모습이다. 잠긴 깊이는 모식적으로 그렸다.</desc>
