<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 270" class="fig-small" role="img" aria-labelledby="t-matter-1-q-connected-flasks d-matter-1-q-connected-flasks">
  <title id="t-matter-1-q-connected-flasks">그림 물질과 에너지 1-9 문제 8의 꼭지로 연결된 두 용기</title>
  <desc id="d-matter-1-q-connected-flasks">꼭지가 닫힌 채 관으로 연결된 두 용기. 용기 A(2.0 L)에는 질소 1.5 atm, 용기 B(1.0 L)에는 산소 3.0 atm이 들어 있고 온도는 27 °C이다. 용기의 크기는 부피 비에 맞추었고, 분자 수는 줄여 그린 모식도이다.</desc>
  <style>
    .matter-1-q-connected-flasks-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
    .matter-1-q-connected-flasks-gr{fill:none;stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4}
    .matter-1-q-connected-flasks-l{font-size:14px;fill:var(--fig-ink)}
    .matter-1-q-connected-flasks-t{font-size:13px;fill:var(--fig-muted)}
    .matter-1-q-connected-flasks-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .matter-1-q-connected-flasks-ink{fill:var(--fig-ink)}
    .matter-1-q-connected-flasks-lead{fill:none;stroke:var(--fig-muted);stroke-width:1}
    .matter-1-q-connected-flasks-box{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2.2}
    .matter-1-q-connected-flasks-n{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5}
    .matter-1-q-connected-flasks-o{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5}
  </style>
