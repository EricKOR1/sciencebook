<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" role="img" aria-labelledby="t-earth-3-pre-ms-tracks d-earth-3-pre-ms-tracks">
  <title id="t-earth-3-pre-ms-tracks">그림 지구과학 3-9 질량에 따른 전주계열 단계의 진화 경로</title>
  <desc id="d-earth-3-pre-ms-tracks">H-R도에서 질량이 태양 정도인 원시별은 오른쪽 위에서 거의 수직으로 내려온 뒤 왼쪽으로 이동해 영년 주계열의 아래쪽에 도달하고, 질량이 큰 원시별은 거의 수평으로 왼쪽으로 이동해 영년 주계열의 위쪽에 도달한다. 경로는 모양만 나타낸 모식도이다.</desc>
  <style>
    .earth-3-pre-ms-tracks-t{font-size:14px;fill:var(--fig-ink)}
    .earth-3-pre-ms-tracks-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .earth-3-pre-ms-tracks-s{font-size:13px;fill:var(--fig-muted)}
    .earth-3-pre-ms-tracks-land{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:0.8;fill-rule:evenodd}
    .earth-3-pre-ms-tracks-sea{fill:var(--fig-soft-blue)}
    .earth-3-pre-ms-tracks-grat{fill:none;stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3;opacity:0.7}
    .earth-3-pre-ms-tracks-frame{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .earth-3-pre-ms-tracks-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
<rect x="90" y="40" width="510" height="340" style="fill:var(--fig-panel);stroke:var(--fig-line)"/><text x="142.9" y="400" text-anchor="middle" class="earth-3-pre-ms-tracks-s">30000</text><text x="345" y="400" text-anchor="middle" class="earth-3-pre-ms-tracks-s">10000</text><text x="439" y="400" text-anchor="middle" class="earth-3-pre-ms-tracks-s">6000</text><text x="566.5" y="400" text-anchor="middle" class="earth-3-pre-ms-tracks-s">3000</text><text x="345" y="422" text-anchor="middle" class="earth-3-pre-ms-tracks-b">표면 온도(K) ← 고온  저온 →</text><text x="82" y="347.2" text-anchor="end" class="earth-3-pre-ms-tracks-s">10⁻²</text><text x="82" y="271.7" text-anchor="end" class="earth-3-pre-ms-tracks-s">1</text><text x="82" y="196.1" text-anchor="end" class="earth-3-pre-ms-tracks-s">10²</text><text x="82" y="120.6" text-anchor="end" class="earth-3-pre-ms-tracks-s">10⁴</text><text x="82" y="45" text-anchor="end" class="earth-3-pre-ms-tracks-s">10⁶</text><text x="30" y="26" text-anchor="start" class="earth-3-pre-ms-tracks-b">광도(태양 = 1)</text><path d="M99.4 66.4 C106.7 70.2 118.3 73.3 142.9 89.2 C167.6 105 210.5 139.5 247.4 161.7 C284.3 183.9 331.4 203.8 364.4 222.2 C397.3 240.7 418.8 256.3 445.2 272.5 C471.6 288.7 502.8 303.5 523 319.5 C543.2 335.5 559.2 360.4 566.5 368.6" style="fill:none;stroke:var(--fig-ink);stroke-width:3.5;opacity:0.55"/><text x="146.9" y="115.2" text-anchor="start" class="earth-3-pre-ms-tracks-b earth-3-pre-ms-tracks-halo">영년 주계열</text><path d="M504.6 210.9 C504.2 214.5 503.1 225.1 502.4 232.5 C501.7 240 501.3 249 500.2 255.3 C499.2 261.6 500.6 267.6 496 270.3 C491.4 273 481 271 472.5 271.4 C464 271.8 449.7 272.3 445.2 272.5" style="fill:none;stroke:var(--fig-blue);stroke-width:3;stroke-linecap:round"/><path d="M445.2 272.5 L456 266.6 L456.4 277.6 Z" style="fill:var(--fig-blue)"/><text x="512.6" y="204.9" text-anchor="start" class="earth-3-pre-ms-tracks-b earth-3-pre-ms-tracks-halo">태양 질량(1)</text><path d="M491.9 159.2 C489.9 159.8 488.8 162.3 480 163.1 C471.2 164 458.2 164.1 439 164.1 C419.7 164 388.1 163.1 364.4 162.8 C340.7 162.5 316.2 162.5 296.7 162.3 C277.2 162.1 255.6 161.8 247.4 161.7" style="fill:none;stroke:var(--fig-red);stroke-width:3;stroke-linecap:round"/><path d="M247.4 161.7 L258.5 156.3 L258.3 167.3 Z" style="fill:var(--fig-red)"/><text x="499.9" y="149.2" text-anchor="start" class="earth-3-pre-ms-tracks-b earth-3-pre-ms-tracks-halo">태양의 약 5배</text><path d="M532.9 248.6 C532.5 253 531.2 266.9 530.4 275 C529.5 283.2 529.1 290.4 527.9 297.8 C526.7 305.2 523.8 315.9 523 319.5" style="fill:none;stroke:var(--fig-green);stroke-width:3;stroke-linecap:round"/><path d="M523 319.5 L520 307.5 L530.8 310 Z" style="fill:var(--fig-green)"/><text x="540.9" y="242.6" text-anchor="start" class="earth-3-pre-ms-tracks-b earth-3-pre-ms-tracks-halo">태양의 0.5배</text><text x="496" y="218" text-anchor="end" class="earth-3-pre-ms-tracks-s earth-3-pre-ms-tracks-halo">거의 수직으로 내려옴</text><text x="494" y="262" text-anchor="end" class="earth-3-pre-ms-tracks-s earth-3-pre-ms-tracks-halo">왼쪽으로</text><text x="364.4" y="148.8" text-anchor="middle" class="earth-3-pre-ms-tracks-s earth-3-pre-ms-tracks-halo">거의 수평으로 왼쪽</text><text x="594" y="58" text-anchor="end" class="earth-3-pre-ms-tracks-s earth-3-pre-ms-tracks-halo">경로는 모양만 나타낸 모식도</text>
</svg>
