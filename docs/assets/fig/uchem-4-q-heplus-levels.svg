<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" class="fig-small" role="img" aria-labelledby="t-uchem-4-q-heplus-levels d-uchem-4-q-heplus-levels">
  <title id="t-uchem-4-q-heplus-levels">그림 일반화학 4-14 문제 15 해설 — He⁺ 이온의 에너지 준위</title>
  <desc id="d-uchem-4-q-heplus-levels">He⁺(Z = 2)의 에너지 준위 Eₙ = −54.4 eV/n²(세로축은 에너지에 비례). n = 1로 떨어지는 계열의 가장 긴 두 선이 2 → 1(30.4 nm)과 3 → 1(25.6 nm)이고, n = 2로 떨어지는 계열의 가장 긴 선은 3 → 2(164 nm)이다.</desc>
  <style>
    .uchem-4-q-heplus-levels-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-4-q-heplus-levels-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-4-q-heplus-levels-b{font-size:15px;fill:var(--fig-ink);font-weight:bold}
    .uchem-4-q-heplus-levels-ax{stroke:var(--fig-ink);stroke-width:1.3;fill:none}
    .uchem-4-q-heplus-levels-gr{stroke:var(--fig-line);stroke-width:0.7;fill:none;stroke-dasharray:3 3}
    .uchem-4-q-heplus-levels-ln{stroke:var(--fig-ink);stroke-width:2;fill:none}
    .uchem-4-q-heplus-levels-lv{stroke:var(--fig-ink);stroke-width:2.2;fill:none}
    .uchem-4-q-heplus-levels-bl{stroke:var(--fig-blue);stroke-width:2.4;fill:none}
    .uchem-4-q-heplus-levels-rd{stroke:var(--fig-red);stroke-width:2.4;fill:none}
    .uchem-4-q-heplus-levels-gn{stroke:var(--fig-green);stroke-width:2.4;fill:none}
    .uchem-4-q-heplus-levels-am{stroke:var(--fig-amber);stroke-width:2.4;fill:none}
    .uchem-4-q-heplus-levels-dash{stroke:var(--fig-muted);stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    .uchem-4-q-heplus-levels-fink{fill:var(--fig-ink)} .uchem-4-q-heplus-levels-fbl{fill:var(--fig-blue)} .uchem-4-q-heplus-levels-frd{fill:var(--fig-red)}
    .uchem-4-q-heplus-levels-fgn{fill:var(--fig-green)} .uchem-4-q-heplus-levels-fam{fill:var(--fig-amber)} .uchem-4-q-heplus-levels-fmu{fill:var(--fig-muted)}
    .uchem-4-q-heplus-levels-box{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.4}
    .uchem-4-q-heplus-levels-sb{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6}
    .uchem-4-q-heplus-levels-sr{fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.6}
    .uchem-4-q-heplus-levels-sg{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.6}
    .uchem-4-q-heplus-levels-sa{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.6}
    .uchem-4-q-heplus-levels-sv{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.6}
    .uchem-4-q-heplus-levels-st{fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.6}
  </style>
  <line x1="70.0" y1="360.0" x2="330.0" y2="360.0" class="uchem-4-q-heplus-levels-lv"/>
  <text x="340.0" y="365.0" text-anchor="start" class="uchem-4-q-heplus-levels-t"><tspan dy="0">n = 1</tspan></text>
  <text x="62.0" y="365.0" text-anchor="end" class="uchem-4-q-heplus-levels-s"><tspan dy="0">−54.4</tspan></text>
  <line x1="70.0" y1="127.5" x2="330.0" y2="127.5" class="uchem-4-q-heplus-levels-lv"/>
  <text x="340.0" y="132.5" text-anchor="start" class="uchem-4-q-heplus-levels-t"><tspan dy="0">n = 2</tspan></text>
  <text x="62.0" y="132.5" text-anchor="end" class="uchem-4-q-heplus-levels-s"><tspan dy="0">−13.6</tspan></text>
  <line x1="70.0" y1="84.4" x2="330.0" y2="84.4" class="uchem-4-q-heplus-levels-lv"/>
  <text x="340.0" y="89.4" text-anchor="start" class="uchem-4-q-heplus-levels-t"><tspan dy="0">n = 3</tspan></text>
  <text x="62.0" y="89.4" text-anchor="end" class="uchem-4-q-heplus-levels-s"><tspan dy="0">−6.0</tspan></text>
  <line x1="70.0" y1="69.4" x2="330.0" y2="69.4" class="uchem-4-q-heplus-levels-lv"/>
  <text x="340.0" y="74.4" text-anchor="start" class="uchem-4-q-heplus-levels-t"><tspan dy="0">n = 4</tspan></text>
  <line x1="70.0" y1="50.0" x2="330.0" y2="50.0" class="uchem-4-q-heplus-levels-dash"/>
  <text x="340.0" y="55.0" text-anchor="start" class="uchem-4-q-heplus-levels-t"><tspan dy="0">n = ∞</tspan></text>
  <text x="62.0" y="55.0" text-anchor="end" class="uchem-4-q-heplus-levels-s"><tspan dy="0">0</tspan></text>
  <text x="20.0" y="30.0" text-anchor="start" class="uchem-4-q-heplus-levels-s"><tspan dy="0">E(eV)</tspan></text>
  <line x1="130.0" y1="129.5" x2="130.0" y2="348.0" class="uchem-4-q-heplus-levels-rd"/>
  <path d="M130.0 358.0 L125.0 348.0 L135.0 348.0 Z" class="uchem-4-q-heplus-levels-frd"/>
  <line x1="200.0" y1="86.4" x2="200.0" y2="348.0" class="uchem-4-q-heplus-levels-bl"/>
  <path d="M200.0 358.0 L195.0 348.0 L205.0 348.0 Z" class="uchem-4-q-heplus-levels-fbl"/>
  <line x1="270.0" y1="86.4" x2="270.0" y2="115.5" class="uchem-4-q-heplus-levels-dash"/>
  <path d="M270.0 125.5 L265.0 115.5 L275.0 115.5 Z" class="uchem-4-q-heplus-levels-fmu"/>
  <text x="138.0" y="230.0" text-anchor="start" class="uchem-4-q-heplus-levels-t"><tspan dy="0">2 → 1</tspan></text>
  <text x="138.0" y="248.0" text-anchor="start" class="uchem-4-q-heplus-levels-s"><tspan dy="0">30.4 nm</tspan></text>
  <text x="208.0" y="290.0" text-anchor="start" class="uchem-4-q-heplus-levels-t"><tspan dy="0">3 → 1</tspan></text>
  <text x="208.0" y="308.0" text-anchor="start" class="uchem-4-q-heplus-levels-s"><tspan dy="0">25.6 nm</tspan></text>
  <text x="278.0" y="103.0" text-anchor="start" class="uchem-4-q-heplus-levels-t"><tspan dy="0">3 → 2</tspan></text>
  <text x="278.0" y="120.0" text-anchor="start" class="uchem-4-q-heplus-levels-s"><tspan dy="0">164 nm</tspan></text>
</svg>
