<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-pchem-1-cp-temperature d-pchem-1-cp-temperature">
  <title id="t-pchem-1-cp-temperature">그림 물리화학 1-7 기체의 정압 몰 열용량과 온도</title>
  <desc id="d-pchem-1-cp-temperature">N₂와 CO₂의 C_p,m을 경험식 a + bT + c/T²로 300~2000 K에서 그렸다. N₂는 298 K에서 29.1, 1000 K에서 32.3, 2000 K에서 약 36 J/(mol·K), CO₂는 각각 약 37, 52, 62 J/(mol·K)이다. 점선은 진동이 기여하지 않을 때의 값 7R/2(선형 분자)와 단원자 기체(Ar)의 5R/2이다.</desc>
