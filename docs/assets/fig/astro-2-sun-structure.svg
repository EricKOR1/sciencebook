<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-astro-2-sun-structure d-astro-2-sun-structure">
  <title id="t-astro-2-sun-structure">그림 행성우주과학 2-1 태양의 층 구조와 쌀알 무늬의 단면</title>
  <desc id="d-astro-2-sun-structure">왼쪽은 태양을 4분의 1만 자른 단면으로, 중심핵(반지름의 약 1/4)에서 만든 에너지가 복사층(약 0.7 반지름까지)과 대류층을 지나 광구에 이른다. 광구 위에 얇은 채층, 그 바깥에 희박한 코로나가 넓게 퍼진다. 오른쪽은 광구 바로 아래의 대류를 확대한 단면으로, 뜨거운 기체가 솟는 쌀알 가운데는 밝고 식은 기체가 가라앉는 경계는 어둡다. 채층과 코로나의 두께는 과장하였다.</desc>
  <style>.astro-2-sun-structure-ink{fill:var(--fig-ink)} .astro-2-sun-structure-mut{fill:var(--fig-muted)} .astro-2-sun-structure-t{font-size:14px;fill:var(--fig-ink)} .astro-2-sun-structure-s{font-size:13px;fill:var(--fig-muted)} .astro-2-sun-structure-b{font-weight:600} .astro-2-sun-structure-ax{stroke:var(--fig-line);stroke-width:1.5;fill:none}</style>
