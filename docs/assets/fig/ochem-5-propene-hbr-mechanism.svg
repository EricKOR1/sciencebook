<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-ochem-5-propene-hbr-mechanism d-ochem-5-propene-hbr-mechanism">
  <title id="t-ochem-5-propene-hbr-mechanism">그림 유기화학 5-3 프로펜과 HBr의 친전자성 첨가: 주 경로와 부 경로</title>
  <desc id="d-ochem-5-propene-hbr-mechanism">1단계에서 C=C의 π 전자쌍이 HBr의 H로 가서 말단 탄소(C1)와 H 사이에 새 결합을 만들고, H–Br 결합의 전자쌍이 Br로 간다(화살표 2개). 주 경로에서는 가운데 탄소에 양전하가 있는 평면의 프로판-2-일 양이온(2°, 빈 p 오비탈)과 Br⁻가 생기고, 2단계에서 Br⁻의 전자쌍이 C⁺로 가서 2-브로모프로페인(주생성물)이 된다. 옅게 그린 부 경로는 H가 가운데 탄소에 붙어 프로필 양이온(1°)을 거쳐 1-브로모프로페인을 주는 길로, 거의 일어나지 않는다.</desc>
