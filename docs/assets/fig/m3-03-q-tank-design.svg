<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 345" role="img" aria-labelledby="t-m3-03-q-tank-design d-m3-03-q-tank-design">
  <title id="t-m3-03-q-tank-design">그림 중3-3-9 문제 16의 학생 D가 설계한 수조 실험</title>
  <desc id="d-m3-03-q-tank-design">두 모둠의 수조 실험 설계를 나란히 나타낸 것이다. 모둠 1은 전등을 수면 위 30 cm에 두고 바람을 약하게, 모둠 2는 전등을 수면 위 15 cm에 두고 바람을 강하게 불며, 물의 깊이는 둘 다 25 cm이다. 전등 높이와 물의 깊이는 같은 비율로 줄여 그렸다.</desc>
