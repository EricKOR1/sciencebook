<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-mech-3-noise-cancelling d-mech-3-noise-cancelling">
  <title id="t-mech-3-noise-cancelling">그림 역학과 에너지 3-8 능동 소음 제어(노이즈 캔슬링)의 원리</title>
  <desc id="d-mech-3-noise-cancelling">헤드폰의 마이크가 바깥 소음을 받으면 회로가 진폭이 같고 위상이 반대인 소리를 만들어 스피커로 낸다. 귀 안에서 소음과 반대 위상의 소리가 중첩되어 상쇄 간섭이 일어나 소리의 변위가 거의 0이 된다.</desc>
