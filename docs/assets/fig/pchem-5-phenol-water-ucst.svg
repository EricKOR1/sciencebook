<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-pchem-5-phenol-water-ucst d-pchem-5-phenol-water-ucst">
  <title id="t-pchem-5-phenol-water-ucst">그림 물리화학 5-13 물–페놀 계의 액체–액체 상 도표(개형)</title>
  <desc id="d-pchem-5-phenol-water-ucst">가로축은 페놀의 질량 백분율, 세로축은 온도. 돔 모양 공존 곡선의 꼭대기가 상부 임계 용해 온도(UCST, 약 66 ℃, 페놀 약 34 %)이다. 돔 바깥은 한 액체 상, 안은 물이 풍부한 층과 페놀이 풍부한 층의 두 액체 상이다. 40 ℃의 연결선 양 끝은 약 10 %와 67 %이고, 전체 조성 30 %의 점에서 두 팔의 길이로 두 층의 양을 정한다(지렛대 규칙).</desc>
