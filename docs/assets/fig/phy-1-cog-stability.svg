<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" role="img" aria-labelledby="t-phy-1-cog-stability d-phy-1-cog-stability">
  <title id="t-phy-1-cog-stability">그림 물리학 1-1 무게중심과 받침면으로 보는 안정성</title>
  <desc id="d-phy-1-cog-stability">같은 상자를 오른쪽 아래 모서리를 축으로 기울였을 때, 무게중심의 연직선이 처음 받침면 안을 지나면 되돌아오고 밖으로 나가면 넘어진다.</desc>
  <style>
    .phy-1-cog-stability-ink{fill:var(--fig-ink)} .phy-1-cog-stability-mut{fill:var(--fig-muted)}
    .phy-1-cog-stability-lbl{font-size:14px;fill:var(--fig-ink)} .phy-1-cog-stability-sm{font-size:13px;fill:var(--fig-muted)} .phy-1-cog-stability-b{font-weight:600}
    .phy-1-cog-stability-ax{stroke:var(--fig-ink);stroke-width:1.5;fill:none} .phy-1-cog-stability-grid{stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 3;fill:none}
  </style>
