<text x="360.0" y="312.0" text-anchor="middle" class="phy-1-cog-stability-sm">무게중심에서 내린 연직선이 받침면 안에 있으면 중력의 돌림힘이 물체를 되돌리고, 밖으로 나가면 넘어뜨린다</text>
