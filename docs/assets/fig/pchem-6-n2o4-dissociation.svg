<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="t-pchem-6-n2o4-dissociation d-pchem-6-n2o4-dissociation">
  <title id="t-pchem-6-n2o4-dissociation">그림 물리화학 6-2 N₂O₄ ⇌ 2NO₂의 해리도와 전체 압력</title>
  <desc id="d-pchem-6-n2o4-dissociation">298.15 K, K = 0.148일 때 해리도 α = [K/(K + 4p/p°)]^(1/2)를 전체 압력(로그 눈금)에 대해 그렸다. 압력이 0.10 bar에서 10 bar로 커지면 α는 0.520에서 0.061로 줄고, 압력이 0에 가까워지면 1(완전 해리)에 다가간다. K는 그대로이고 Kx = K(p/p°)^(−1)이 변한다.</desc>
