  <title id="t-uphy-3-q-spring-potential">그림 일반물리학 3-13 문제 14 해설: 용수철에 매단 추의 퍼텐셜 에너지</title>
  <desc id="d-uphy-3-q-spring-potential">용수철의 퍼텐셜 에너지 ½ky²(k = 200 N/m)와 중력 퍼텐셜 에너지 mgy(mg = 4.90 N)를 더한 U(y)는 y = −2.45 cm에서 최소 −0.0600 J이다. 자연 길이(y = 0)에서 놓으면 E = 0이므로 추는 U = 0인 y = 0과 y = −4.90 cm 사이를 왕복하고, 평형 위치에서 운동 에너지는 0.0600 J이다.</desc>
