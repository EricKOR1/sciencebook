<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 324" role="img" aria-labelledby="t-matter-4-rate-methods d-matter-4-rate-methods">
  <title id="t-matter-4-rate-methods">그림 물질과 에너지 4-2 반응 속도를 측정하는 여러 가지 방법</title>
  <desc id="d-matter-4-rate-methods">(가) 발생한 기체가 기체 주사기의 피스톤을 밀어낸 부피를 시간마다 읽는다. (나) 밀폐한 플라스크의 압력 변화를 압력 센서로 실시간 기록한다. (다) 티오황산 나트륨과 염산의 반응에서 황 앙금이 생겨 비커 밑의 × 표가 보이지 않게 될 때까지의 시간을 잰다. 장치는 모식도이다.</desc>
  <style>
    .matter-4-rate-methods-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.5}
    .matter-4-rate-methods-gr{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4}
    .matter-4-rate-methods-g{fill:none;stroke:var(--fig-muted);stroke-width:1.2;stroke-dasharray:4 4}
    .matter-4-rate-methods-lv{fill:none;stroke:var(--fig-ink);stroke-width:3;stroke-linecap:round}
    .matter-4-rate-methods-ink{fill:var(--fig-ink)}
    .matter-4-rate-methods-l{font-size:14px;fill:var(--fig-ink)}
    .matter-4-rate-methods-b{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .matter-4-rate-methods-s{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .matter-4-rate-methods-t{font-size:13px;fill:var(--fig-muted)}
  </style>
  <rect x="12" y="12" width="224" height="300" rx="10" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="124.0" y="38.0" text-anchor="middle" class="matter-4-rate-methods-s">(가) 기체 부피 — 기체 주사기</text>
  <rect x="248" y="12" width="224" height="300" rx="10" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="360.0" y="38.0" text-anchor="middle" class="matter-4-rate-methods-s">(나) 기체 압력 — 압력 센서</text>
  <rect x="484" y="12" width="224" height="300" rx="10" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="596.0" y="38.0" text-anchor="middle" class="matter-4-rate-methods-s">(다) 탁해짐 — × 표 사라짐</text>
  <polyline points="58.0,134.0 58.0,160.0 24.0,230.0 116.0,230.0 82.0,160.0 82.0,134.0" style="fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:2;stroke-linejoin:round"/>
  <polygon points="40.6,202.0 99.4,202.0 112.0,227.0 28.0,227.0" style="fill:var(--fig-soft-teal);stroke:none"/>
  <circle cx="56" cy="216" r="3" style="fill:var(--fig-panel);stroke:var(--fig-teal);stroke-width:1.2"/>
  <circle cx="76" cy="210" r="3" style="fill:var(--fig-panel);stroke:var(--fig-teal);stroke-width:1.2"/>
  <circle cx="88" cy="220" r="3" style="fill:var(--fig-panel);stroke:var(--fig-teal);stroke-width:1.2"/>
  <circle cx="68" cy="222" r="3" style="fill:var(--fig-panel);stroke:var(--fig-teal);stroke-width:1.2"/>
  <rect x="55" y="124" width="30" height="14" rx="3" style="fill:var(--fig-ink)"/>
  <path d="M70 124 L70 100 L118 100" style="fill:none;stroke:var(--fig-muted);stroke-width:3"/>
  <rect x="118" y="86" width="90" height="28" rx="3" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.8"/>
  <rect x="120" y="88" width="40" height="24" style="fill:var(--fig-soft-blue);stroke:none"/>
  <line x1="130" y1="86" x2="130" y2="93" style="stroke:var(--fig-muted);stroke-width:1.2"/>
  <line x1="146" y1="86" x2="146" y2="93" style="stroke:var(--fig-muted);stroke-width:1.2"/>
  <line x1="162" y1="86" x2="162" y2="93" style="stroke:var(--fig-muted);stroke-width:1.2"/>
  <line x1="178" y1="86" x2="178" y2="93" style="stroke:var(--fig-muted);stroke-width:1.2"/>
  <line x1="194" y1="86" x2="194" y2="93" style="stroke:var(--fig-muted);stroke-width:1.2"/>
  <rect x="160" y="88" width="5" height="24" style="fill:var(--fig-ink)"/>
  <line x1="165" y1="100" x2="214" y2="100" style="stroke:var(--fig-ink);stroke-width:2.5"/>
  <line x1="170.0" y1="126.0" x2="197.0" y2="126.0" style="stroke:var(--fig-accent);stroke-width:2;fill:none"/>
  <path d="M205.0 126.0 L197.0 130.0 L197.0 122.0 Z" style="fill:var(--fig-accent)"/>
  <text x="165.0" y="146.0" text-anchor="middle" class="matter-4-rate-methods-t">피스톤이 밀려남</text>
  <text x="124.0" y="262.0" text-anchor="middle" class="matter-4-rate-methods-t">발생한 기체의 부피를</text>
  <text x="124.0" y="280.0" text-anchor="middle" class="matter-4-rate-methods-t">시간마다 읽는다</text>
  <text x="124.0" y="298.0" text-anchor="middle" class="matter-4-rate-methods-t">예: Mg + 염산</text>
  <polyline points="298.0,134.0 298.0,160.0 264.0,230.0 356.0,230.0 322.0,160.0 322.0,134.0" style="fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:2;stroke-linejoin:round"/>
  <polygon points="280.6,202.0 339.4,202.0 352.0,227.0 268.0,227.0" style="fill:var(--fig-soft-teal);stroke:none"/>
  <circle cx="296" cy="216" r="3" style="fill:var(--fig-panel);stroke:var(--fig-teal);stroke-width:1.2"/>
  <circle cx="316" cy="210" r="3" style="fill:var(--fig-panel);stroke:var(--fig-teal);stroke-width:1.2"/>
  <circle cx="328" cy="220" r="3" style="fill:var(--fig-panel);stroke:var(--fig-teal);stroke-width:1.2"/>
  <circle cx="308" cy="222" r="3" style="fill:var(--fig-panel);stroke:var(--fig-teal);stroke-width:1.2"/>
  <rect x="295" y="124" width="30" height="14" rx="3" style="fill:var(--fig-ink)"/>
  <rect x="304" y="102" width="12" height="22" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5"/>
  <path d="M310 102 C310 74 360 94 378 96" style="fill:none;stroke:var(--fig-violet);stroke-width:2"/>
  <rect x="378" y="68" width="76" height="56" rx="5" style="fill:var(--fig-paper);stroke:var(--fig-ink);stroke-width:1.6"/>
  <polyline points="384.0,118.0 387.2,112.4 390.4,107.6 393.6,103.5 396.8,100.0 400.0,96.9 403.2,94.3 406.4,92.0 409.6,90.0 412.8,88.4 416.0,86.9 419.2,85.7 422.4,84.6 425.6,83.7 428.8,82.9 432.0,82.2 435.2,81.6 438.4,81.1 441.6,80.7 444.8,80.3 448.0,80.0" style="fill:none;stroke:var(--fig-red);stroke-width:2"/>
  <path d="M384 74 L384 118 L450 118" style="fill:none;stroke:var(--fig-muted);stroke-width:1"/>
  <text x="416.0" y="140.0" text-anchor="middle" class="matter-4-rate-methods-t">데이터 기록</text>
  <text x="322.0" y="116.0" class="matter-4-rate-methods-t">센서</text>
  <text x="360.0" y="262.0" text-anchor="middle" class="matter-4-rate-methods-t">압력 증가 ∝ 발생한 O₂의 몰수</text>
  <text x="360.0" y="280.0" text-anchor="middle" class="matter-4-rate-methods-t">1초 간격으로 자동 기록</text>
  <text x="360.0" y="298.0" text-anchor="middle" class="matter-4-rate-methods-t">예: H₂O₂ + MnO₂</text>
  <circle cx="528" cy="125" r="28" style="fill:var(--fig-paper);stroke:var(--fig-muted);stroke-width:2"/>
  <path d="M516 113 L540 137 M540 113 L516 137" style="fill:none;stroke:var(--fig-ink);stroke-width:4;stroke-linecap:round"/>
  <text x="528.0" y="173.0" text-anchor="middle" class="matter-4-rate-methods-t">처음</text>
  <circle cx="596" cy="125" r="28" style="fill:var(--fig-paper);stroke:var(--fig-muted);stroke-width:2"/>
  <path d="M584 113 L608 137 M608 113 L584 137" style="fill:none;stroke:var(--fig-ink);stroke-width:4;stroke-linecap:round"/>
  <circle cx="596" cy="125" r="27" style="fill:var(--fig-soft-amber);fill-opacity:0.55;stroke:none"/>
  <text x="596.0" y="173.0" text-anchor="middle" class="matter-4-rate-methods-t">흐려짐</text>
  <circle cx="664" cy="125" r="28" style="fill:var(--fig-paper);stroke:var(--fig-muted);stroke-width:2"/>
  <path d="M652 113 L676 137 M676 113 L652 137" style="fill:none;stroke:var(--fig-ink);stroke-width:4;stroke-linecap:round"/>
  <circle cx="664" cy="125" r="27" style="fill:var(--fig-soft-amber);fill-opacity:0.95;stroke:none"/>
  <text x="664.0" y="173.0" text-anchor="middle" class="matter-4-rate-methods-t">× 표 사라짐</text>
  <line x1="512.0" y1="196.0" x2="660.0" y2="196.0" style="stroke:var(--fig-muted);stroke-width:1.6;fill:none"/>
  <path d="M668.0 196.0 L660.0 200.0 L660.0 192.0 Z" style="fill:var(--fig-muted)"/>
  <text x="590.0" y="214.0" text-anchor="middle" class="matter-4-rate-methods-t">시간</text>
  <text x="596.0" y="72.0" text-anchor="middle" class="matter-4-rate-methods-t">비커를 위에서 본 모습</text>
  <text x="596.0" y="244.0" text-anchor="middle" class="matter-4-rate-methods-t">황 앙금이 생겨 용액이 탁해진다</text>
  <text x="596.0" y="262.0" text-anchor="middle" class="matter-4-rate-methods-t">× 표가 사라질 때까지 시간 t를 잰다</text>
  <text x="596.0" y="280.0" text-anchor="middle" class="matter-4-rate-methods-s">반응 속도 ∝ 1/t</text>
  <text x="596.0" y="298.0" text-anchor="middle" class="matter-4-rate-methods-t">예: Na₂S₂O₃ + 염산</text>
</svg>
