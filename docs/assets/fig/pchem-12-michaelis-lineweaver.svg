<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="t-pchem-12-michaelis-lineweaver d-pchem-12-michaelis-lineweaver">
  <title id="t-pchem-12-michaelis-lineweaver">그림 물리화학 12-8 미카엘리스–멘텐 곡선과 라인위버–버크 도시</title>
  <desc id="d-pchem-12-michaelis-lineweaver">(가) v = 60[S]/(1.5 + [S]) 곡선과 예제 8의 네 점. 수평 점선은 Vmax = 60과 Vmax/2 = 30 μM s⁻¹이며, v = Vmax/2인 곳의 [S]가 KM = 1.5 mM이다. 낮은 [S]에서는 기울기 Vmax/KM인 접선을 따르고(1차), 높은 [S]에서는 Vmax로 포화한다(0차). (나) 1/v = 0.0250(1/[S]) + 0.01667 직선. 세로 절편이 1/Vmax, 가로 절편이 −1/KM = −0.667 mM⁻¹이다.</desc>
