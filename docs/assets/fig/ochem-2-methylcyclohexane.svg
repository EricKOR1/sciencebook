<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="t-ochem-2-methylcyclohexane d-ochem-2-methylcyclohexane">
  <title id="t-ochem-2-methylcyclohexane">그림 유기화학 2-16 메틸사이클로헥세인의 두 의자 형태</title>
  <desc id="d-ochem-2-methylcyclohexane">위: 왼쪽은 메틸이 C1의 축(위)에 있는 형태로, 메틸의 H와 같은 쪽(위)을 향한 C3·C5의 축 H 사이에 1,3-이축 상호작용(붉은 점선)이 있다. 고리 뒤집힘으로 오른쪽 형태가 되면 같은 메틸이 적도(약간 위, 바깥쪽)에 놓인다. K ≈ 19(95 : 5), ΔG° = −7.3 kJ/mol. 아래: 각 형태의 C1–C2 결합을 따라 본 뉴먼 투영식(앞 C1: CH₃, H, C6 / 뒤 C2: H, H, C3). 축 형태에서는 CH₃와 C3가 고시(60°), 적도 형태에서는 안티(180°)이다.</desc>
