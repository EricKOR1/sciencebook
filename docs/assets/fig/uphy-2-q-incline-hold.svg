<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-uphy-2-q-incline-hold d-uphy-2-q-incline-hold">
  <title id="t-uphy-2-q-incline-hold">그림 일반물리학 2-9 문제 12 해설: 빗면에서 상자를 붙잡아 두는 힘의 최솟값과 최댓값</title>
  <desc id="d-uphy-2-q-incline-hold">30.0° 빗면 위 5.00 kg 상자의 자유 물체 도형이다. (가) 아래로 미끄러지기 직전에는 정지 마찰력 17.0 N이 빗면 위쪽으로 작용하여 F = 24.5 − 17.0 = 7.53 N이다. (나) 위로 미끄러지기 직전에는 정지 마찰력이 빗면 아래쪽으로 바뀌어 F = 24.5 + 17.0 = 41.5 N이다. 중력 49.0 N, 수직 항력 42.4 N이며 화살표 길이는 힘의 크기에 비례한다.</desc>
