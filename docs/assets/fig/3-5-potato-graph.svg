<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-3-5-potato-graph d-3-5-potato-graph">
  <title id="t-3-5-potato-graph">그림 3-5-5 설탕 용액의 농도와 감자 조각의 질량 변화율</title>
  <desc id="d-3-5-potato-graph">예제 2의 자료를 그래프로 나타낸 것이다. 바깥 용액이 묽으면 물이 들어와 질량이 늘고, 진하면 물이 빠져나가 질량이 준다. 질량 변화율이 0이 되는 약 10 %가 감자 세포 안 용액과 농도가 비슷한 설탕 용액이다.</desc>
  <style>
    .f3-5-potato-graph-lbl{font-size:15px;fill:var(--fig-ink)} .f3-5-potato-graph-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .f3-5-potato-graph-sm{font-size:13px;fill:var(--fig-muted)} .f3-5-potato-graph-ink{font-size:13px;fill:var(--fig-ink)}
    .f3-5-potato-graph-ax{stroke:var(--fig-ink);stroke-width:1.5;fill:none} .f3-5-potato-graph-grid{stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 4;fill:none}
  </style>
<rect x="100" y="40" width="540" height="141.8" style="fill:var(--fig-soft-blue);stroke:none"/><rect x="100" y="181.8" width="540" height="118.2" style="fill:var(--fig-soft-amber);stroke:none"/><line x1="100" y1="300.0" x2="640" y2="300.0" class="f3-5-potato-graph-grid"/><text x="92" y="305.0" text-anchor="end" class="f3-5-potato-graph-sm">−10</text><line x1="100" y1="276.4" x2="640" y2="276.4" class="f3-5-potato-graph-grid"/><text x="92" y="281.4" text-anchor="end" class="f3-5-potato-graph-sm">−8</text><line x1="100" y1="252.7" x2="640" y2="252.7" class="f3-5-potato-graph-grid"/><text x="92" y="257.7" text-anchor="end" class="f3-5-potato-graph-sm">−6</text><line x1="100" y1="229.1" x2="640" y2="229.1" class="f3-5-potato-graph-grid"/><text x="92" y="234.1" text-anchor="end" class="f3-5-potato-graph-sm">−4</text><line x1="100" y1="205.5" x2="640" y2="205.5" class="f3-5-potato-graph-grid"/><text x="92" y="210.5" text-anchor="end" class="f3-5-potato-graph-sm">−2</text><text x="92" y="186.8" text-anchor="end" class="f3-5-potato-graph-sm">0</text><line x1="100" y1="158.2" x2="640" y2="158.2" class="f3-5-potato-graph-grid"/><text x="92" y="163.2" text-anchor="end" class="f3-5-potato-graph-sm">+2</text><line x1="100" y1="134.5" x2="640" y2="134.5" class="f3-5-potato-graph-grid"/><text x="92" y="139.5" text-anchor="end" class="f3-5-potato-graph-sm">+4</text><line x1="100" y1="110.9" x2="640" y2="110.9" class="f3-5-potato-graph-grid"/><text x="92" y="115.9" text-anchor="end" class="f3-5-potato-graph-sm">+6</text><line x1="100" y1="87.3" x2="640" y2="87.3" class="f3-5-potato-graph-grid"/><text x="92" y="92.3" text-anchor="end" class="f3-5-potato-graph-sm">+8</text><line x1="100" y1="63.6" x2="640" y2="63.6" class="f3-5-potato-graph-grid"/><text x="92" y="68.6" text-anchor="end" class="f3-5-potato-graph-sm">+10</text><line x1="100" y1="40.0" x2="640" y2="40.0" class="f3-5-potato-graph-grid"/><text x="92" y="45.0" text-anchor="end" class="f3-5-potato-graph-sm">+12</text><line x1="100.0" y1="300" x2="100.0" y2="306" class="f3-5-potato-graph-ax"/><text x="100.0" y="324" text-anchor="middle" class="f3-5-potato-graph-sm">0</text><line x1="235.0" y1="300" x2="235.0" y2="306" class="f3-5-potato-graph-ax"/><text x="235.0" y="324" text-anchor="middle" class="f3-5-potato-graph-sm">4</text><line x1="370.0" y1="300" x2="370.0" y2="306" class="f3-5-potato-graph-ax"/><text x="370.0" y="324" text-anchor="middle" class="f3-5-potato-graph-sm">8</text><line x1="505.0" y1="300" x2="505.0" y2="306" class="f3-5-potato-graph-ax"/><text x="505.0" y="324" text-anchor="middle" class="f3-5-potato-graph-sm">12</text><line x1="640.0" y1="300" x2="640.0" y2="306" class="f3-5-potato-graph-ax"/><text x="640.0" y="324" text-anchor="middle" class="f3-5-potato-graph-sm">16</text><line x1="100" y1="181.8" x2="640" y2="181.8" style="stroke:var(--fig-ink);stroke-width:1.5"/><line x1="100" y1="300" x2="648" y2="300" class="f3-5-potato-graph-ax"/><line x1="100" y1="300" x2="100" y2="30" class="f3-5-potato-graph-ax"/><path d="M100.0 63.6 L235.0 110.9 L370.0 158.2 L505.0 205.5 L640.0 252.7" style="fill:none;stroke:var(--fig-green);stroke-width:2.5"/><circle cx="100.0" cy="63.6" r="6" style="fill:var(--fig-green);stroke:var(--fig-paper);stroke-width:2"/><text x="122.0" y="49.6" text-anchor="start" class="f3-5-potato-graph-ink" style="font-weight:600">+10 %</text><circle cx="235.0" cy="110.9" r="6" style="fill:var(--fig-green);stroke:var(--fig-paper);stroke-width:2"/><text x="249.0" y="102.9" text-anchor="start" class="f3-5-potato-graph-ink" style="font-weight:600">+6 %</text><circle cx="370.0" cy="158.2" r="6" style="fill:var(--fig-green);stroke:var(--fig-paper);stroke-width:2"/><text x="384.0" y="150.2" text-anchor="start" class="f3-5-potato-graph-ink" style="font-weight:600">+2 %</text><circle cx="505.0" cy="205.5" r="6" style="fill:var(--fig-green);stroke:var(--fig-paper);stroke-width:2"/><text x="519.0" y="197.5" text-anchor="start" class="f3-5-potato-graph-ink" style="font-weight:600">−2 %</text><circle cx="640.0" cy="252.7" r="6" style="fill:var(--fig-green);stroke:var(--fig-paper);stroke-width:2"/><text x="626.0" y="274.7" text-anchor="end" class="f3-5-potato-graph-ink" style="font-weight:600">−6 %</text><line x1="437.5" y1="181.8" x2="437.5" y2="300" style="stroke:var(--fig-red);stroke-width:2;stroke-dasharray:5 4"/><circle cx="437.5" cy="181.8" r="7" style="fill:var(--fig-paper);stroke:var(--fig-red);stroke-width:3"/><text x="427.5" y="227.8" text-anchor="end" class="f3-5-potato-graph-ink" style="fill:var(--fig-red);font-weight:600">약 10 %: 질량 변화 0</text><text x="427.5" y="245.8" text-anchor="end" class="f3-5-potato-graph-sm">(감자 세포 안과 농도가 비슷)</text><text x="632" y="62" text-anchor="end" class="f3-5-potato-graph-ink">질량 증가: 물이 감자 안으로 들어옴</text><text x="632" y="80" text-anchor="end" class="f3-5-potato-graph-sm">(바깥 용액이 세포 안보다 묽다)</text><text x="118" y="272" class="f3-5-potato-graph-ink">질량 감소: 물이 감자 밖으로 빠져나감</text><text x="118" y="290" class="f3-5-potato-graph-sm">(바깥 용액이 세포 안보다 진하다)</text><text x="94" y="24" class="f3-5-potato-graph-lbl">질량 변화율 (%)</text><text x="648" y="346" text-anchor="end" class="f3-5-potato-graph-lbl">설탕 용액의 농도 (%)</text></svg>
