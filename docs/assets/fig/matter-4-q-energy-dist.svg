<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 362" role="img" aria-labelledby="t-matter-4-q-energy-dist d-matter-4-q-energy-dist">
  <title id="t-matter-4-q-energy-dist">그림 물질과 에너지 4-9 문제 9 해설의 분자 운동 에너지 분포</title>
  <desc id="d-matter-4-q-energy-dist">상온에서는 활성화 에너지 이상의 에너지를 가진 분자(파랑 넓이)가 매우 적어 종이가 거의 반응하지 않는다. 성냥불로 온도를 높이면 분포가 오른쪽으로 넓게 퍼져 이런 분자의 비율(빨강 넓이)이 크게 는다. 온도와 Eₐ의 값은 모양을 보이기 위한 모식도이다.</desc>
