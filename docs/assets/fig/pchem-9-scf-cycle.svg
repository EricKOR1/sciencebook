<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-pchem-9-scf-cycle d-pchem-9-scf-cycle">
  <title id="t-pchem-9-scf-cycle">그림 물리화학 9-14 하트리–폭 자체 일관장(SCF) 계산의 흐름</title>
  <desc id="d-pchem-9-scf-cycle">분자 구조와 기저 함수를 정하고 처음 오비탈 계수 C를 추측한 뒤, C로 포크 행렬 F를 만들고 로탄–홀 방정식 FC = SCε를 풀어 새 C를 얻는 과정을 에너지와 밀도의 변화가 허용 오차보다 작아질 때까지 되풀이한다. F가 C에 의존하므로 반복이 필요하다.</desc>
  <style>.pchem-9-scf-cycle-lbl{font-size:14px;fill:var(--fig-ink)} .pchem-9-scf-cycle-sm{font-size:13px;fill:var(--fig-muted)} .pchem-9-scf-cycle-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .pchem-9-scf-cycle-tk{font-size:13px;fill:var(--fig-muted)} .pchem-9-scf-cycle-ax{font-size:14px;fill:var(--fig-ink)} .pchem-9-scf-cycle-big{font-size:16px;font-weight:700;fill:var(--fig-ink)} .pchem-9-scf-cycle-red{font-size:14px;fill:var(--fig-red)} .pchem-9-scf-cycle-redb{font-size:14px;font-weight:600;fill:var(--fig-red)} .pchem-9-scf-cycle-blue{font-size:14px;fill:var(--fig-blue)} .pchem-9-scf-cycle-blueb{font-size:14px;font-weight:600;fill:var(--fig-blue)} .pchem-9-scf-cycle-green{font-size:14px;fill:var(--fig-green)} .pchem-9-scf-cycle-greenb{font-size:14px;font-weight:600;fill:var(--fig-green)} .pchem-9-scf-cycle-amber{font-size:14px;fill:var(--fig-amber)} .pchem-9-scf-cycle-amberb{font-size:14px;font-weight:600;fill:var(--fig-amber)} .pchem-9-scf-cycle-violet{font-size:14px;fill:var(--fig-violet)} .pchem-9-scf-cycle-violetb{font-size:14px;font-weight:600;fill:var(--fig-violet)} .pchem-9-scf-cycle-teal{font-size:14px;fill:var(--fig-teal)} .pchem-9-scf-cycle-tealb{font-size:14px;font-weight:600;fill:var(--fig-teal)} .pchem-9-scf-cycle-accent{font-size:14px;fill:var(--fig-accent)} .pchem-9-scf-cycle-accentb{font-size:14px;font-weight:600;fill:var(--fig-accent)}</style>
  <rect x="20.0" y="40.0" width="200.0" height="70.0" rx="10" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.6"/>
  <text x="120.0" y="71.0" text-anchor="middle" class="pchem-9-scf-cycle-b">① 분자 구조(핵 좌표)</text>
  <text x="120.0" y="89.0" text-anchor="middle" class="pchem-9-scf-cycle-lbl">와 기저 함수 선택</text>
  <rect x="20.0" y="170.0" width="200.0" height="60.0" rx="10" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.6"/>
  <text x="120.0" y="196.0" text-anchor="middle" class="pchem-9-scf-cycle-b">② 처음 오비탈</text>
  <text x="120.0" y="214.0" text-anchor="middle" class="pchem-9-scf-cycle-lbl">계수 C 추측</text>
  <rect x="270.0" y="40.0" width="210.0" height="70.0" rx="10" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6"/>
  <text x="375.0" y="71.0" text-anchor="middle" class="pchem-9-scf-cycle-b">③ C로 전자 밀도 →</text>
  <text x="375.0" y="89.0" text-anchor="middle" class="pchem-9-scf-cycle-lbl">포크 행렬 F 만들기</text>
  <rect x="500.0" y="170.0" width="200.0" height="80.0" rx="10" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.6"/>
  <text x="600.0" y="197.0" text-anchor="middle" class="pchem-9-scf-cycle-b">④ FC = SCε 풀기</text>
  <text x="600.0" y="215.0" text-anchor="middle" class="pchem-9-scf-cycle-lbl">(대각화)</text>
  <text x="600.0" y="233.0" text-anchor="middle" class="pchem-9-scf-cycle-lbl">→ 새 C, ε</text>
  <rect x="270.0" y="290.0" width="210.0" height="70.0" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.6"/>
  <text x="375.0" y="321.0" text-anchor="middle" class="pchem-9-scf-cycle-b">⑤ 수렴 판정: 에너지·밀도</text>
  <text x="375.0" y="339.0" text-anchor="middle" class="pchem-9-scf-cycle-lbl">변화 &lt; 허용 오차?</text>
  <rect x="20.0" y="290.0" width="210.0" height="90.0" rx="10" style="fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:1.6"/>
  <text x="125.0" y="322.0" text-anchor="middle" class="pchem-9-scf-cycle-b">결과: 전체 에너지,</text>
  <text x="125.0" y="340.0" text-anchor="middle" class="pchem-9-scf-cycle-lbl">오비탈 에너지 ε<tspan baseline-shift="sub" style="font-size:75%">i</tspan>,</text>
  <text x="125.0" y="358.0" text-anchor="middle" class="pchem-9-scf-cycle-lbl">전자 밀도, 쌍극자 모멘트</text>
  <line x1="120.0" y1="110.0" x2="120.0" y2="159.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <path d="M120.0 168.0 L115.5 159.0 L124.5 159.0 Z" style="fill:var(--fig-ink);stroke:none"/>
  <path d="M220 200 L245 200 L245 75 L268 75" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/>
  <line x1="250.0" y1="75.0" x2="259.0" y2="75.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <path d="M268.0 75.0 L259.0 79.5 L259.0 70.5 Z" style="fill:var(--fig-ink);stroke:none"/>
  <path d="M480 75 L600 75 L600 160" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/>
  <line x1="600.0" y1="150.0" x2="600.0" y2="159.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <path d="M600.0 168.0 L595.5 159.0 L604.5 159.0 Z" style="fill:var(--fig-ink);stroke:none"/>
  <path d="M600 250 L600 325 L492 325" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/>
  <line x1="500.0" y1="325.0" x2="491.0" y2="325.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <path d="M482.0 325.0 L491.0 320.5 L491.0 329.5 Z" style="fill:var(--fig-ink);stroke:none"/>
  <path d="M375 290 L375 250 L375 112" style="fill:none;stroke:var(--fig-red);stroke-width:2;stroke-dasharray:6 4"/>
  <line x1="375.0" y1="130.0" x2="375.0" y2="121.0" style="stroke:var(--fig-red);stroke-width:2"/>
  <path d="M375.0 112.0 L379.5 121.0 L370.5 121.0 Z" style="fill:var(--fig-red);stroke:none"/>
  <text x="384.0" y="205.0" class="pchem-9-scf-cycle-redb">아니요:</text>
  <text x="384.0" y="223.0" class="pchem-9-scf-cycle-red">새 C로 다시</text>
  <line x1="270.0" y1="335.0" x2="243.0" y2="335.0" style="stroke:var(--fig-green);stroke-width:2.2"/>
  <path d="M234.0 335.0 L243.0 330.5 L243.0 339.5 Z" style="fill:var(--fig-green);stroke:none"/>
  <text x="252.0" y="326.0" text-anchor="middle" class="pchem-9-scf-cycle-greenb">예</text>
  <text x="612.0" y="110.0" class="pchem-9-scf-cycle-sm">F는 C에 의존</text>
  <text x="612.0" y="128.0" class="pchem-9-scf-cycle-sm">→ 반복이 필요</text>
  <text x="470.0" y="388.0" text-anchor="middle" class="pchem-9-scf-cycle-sm">③ → ④ → ⑤ 반복 = 자체 일관장(SCF)</text>
</svg>
