<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 385" role="img" aria-labelledby="t-chem-4-ph-scale d-chem-4-ph-scale">
  <title id="t-chem-4-ph-scale">그림 화학 4-4 pH 눈금과 수소 이온 농도</title>
  <desc id="d-chem-4-ph-scale">pH 0에서 14까지의 눈금 위에 [H₃O⁺]를, 아래에 [OH⁻]를 나타냈다. pH가 1 커질 때마다 [H₃O⁺]는 10분의 1이 되고 [OH⁻]는 10배가 되며, 두 농도의 곱은 25 °C에서 늘 1.0×10⁻¹⁴이다. 위액, 식초, 우유, 혈액, 비눗물 같은 생활 속 물질의 대략적인 pH도 함께 나타냈다.</desc>
  <style>
    .chem-4-ph-scale-t{font-size:14px;fill:var(--fig-ink)} .chem-4-ph-scale-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .chem-4-ph-scale-s{font-size:13px;fill:var(--fig-muted)} .chem-4-ph-scale-ax{stroke:var(--fig-ink);stroke-width:1.4;fill:none}
    .chem-4-ph-scale-gr{stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4;fill:none;opacity:0.7}
    .chem-4-ph-scale-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}

  </style>
