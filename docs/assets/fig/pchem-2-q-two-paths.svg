<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-pchem-2-q-two-paths d-pchem-2-q-two-paths">
  <title id="t-pchem-2-q-two-paths">그림 물리화학 2-1 디딤돌 예제의 두 경로</title>
  <desc id="d-pchem-2-q-two-paths">이상 기체 1 mol을 A(10.0 L, 300 K)에서 B(20.0 L, 600 K)로 바꾸는 두 경로를 p–V 도표에 나타냈다. 경로 ㉠은 등적 가열 후 600 K 등온 팽창, 경로 ㉡은 300 K 등온 팽창 후 등적 가열이다. 받은 열은 다르지만 열을 그때의 온도로 나누어 더한 값은 같다.</desc>
