<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 272" class="fig-small" role="img" aria-labelledby="t-m1-07-q-annular-size d-m1-07-q-annular-size">
  <title id="t-m1-07-q-annular-size">그림 중1-7-12 문제 17 해설: 달의 겉보기 크기와 일식의 모습</title>
  <desc id="d-m1-07-q-annular-size">(가) 달이 태양과 같은 크기로 보이면 밝은 광구가 모두 가려져 어두운 채층과 코로나가 드러난다(개기 일식). (나) 달이 더 멀어 태양보다 작게 보이면 가장자리에 광구가 고리처럼 남아(금환 일식) 채층과 코로나가 그 빛에 묻힌다. 모식도이다.</desc>
  <style>.m1-07-q-annular-size-t{font-size:14px;fill:var(--fig-ink)} .m1-07-q-annular-size-s{font-size:13px;fill:var(--fig-muted)} .m1-07-q-annular-size-b{font-size:15px;font-weight:700;fill:var(--fig-ink)} .m1-07-q-annular-size-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.4} .m1-07-q-annular-size-gr{fill:none;stroke:var(--fig-line);stroke-width:0.7;stroke-dasharray:3 3}</style>
  <rect x="20" y="30" width="210" height="186" rx="6" style="fill:#141a26;stroke:var(--fig-line);stroke-width:1"/>
  <circle cx="125" cy="115" r="84" style="fill:#e8eefc;fill-opacity:0.18;stroke:none"/>
  <circle cx="125" cy="115" r="70" style="fill:#e8eefc;fill-opacity:0.3;stroke:none"/>
  <circle cx="125" cy="115" r="60" style="fill:#e8eefc;fill-opacity:0.5;stroke:none"/>
  <circle cx="125" cy="115" r="52" style="fill:#ff6b5a;stroke:none"/>
  <circle cx="125" cy="115" r="50" style="fill:#ffb52e;stroke:none"/>
  <circle cx="125" cy="115" r="50.5" style="fill:#2a3140;stroke:#5a6578;stroke-width:1"/>
  <text x="125" y="22" text-anchor="middle" class="m1-07-q-annular-size-t">(가) 지금처럼 꼭 맞을 때</text>
  <text x="125" y="240" text-anchor="middle" class="m1-07-q-annular-size-b">개기 일식</text>
  <rect x="250" y="30" width="210" height="186" rx="6" style="fill:#141a26;stroke:var(--fig-line);stroke-width:1"/>
  <circle cx="355" cy="115" r="50" style="fill:#ffb52e;stroke:none"/>
  <circle cx="355" cy="115" r="40" style="fill:#2a3140;stroke:#5a6578;stroke-width:1"/>
  <text x="355" y="22" text-anchor="middle" class="m1-07-q-annular-size-t">(나) 달이 더 멀 때</text>
  <text x="355" y="240" text-anchor="middle" class="m1-07-q-annular-size-b">금환 일식</text>
  <text x="125" y="209" text-anchor="middle" class="m1-07-q-annular-size-s" style="fill:#c9d3e6">코로나·채층이 보인다</text>
  <text x="355" y="209" text-anchor="middle" class="m1-07-q-annular-size-s" style="fill:#c9d3e6">광구가 고리처럼 남는다</text>
  <text x="240" y="264" text-anchor="middle" class="m1-07-q-annular-size-s">달(검은 원)과 태양(주황 원)의 겉보기 크기 비교</text>
</svg>
