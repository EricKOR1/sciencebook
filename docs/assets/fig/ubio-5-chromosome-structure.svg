<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-ubio-5-chromosome-structure d-ubio-5-chromosome-structure">
  <title id="t-ubio-5-chromosome-structure">그림 일반생명과학 5-9 염색체 구조 이상 — 결실, 중복, 역위, 전좌</title>
  <desc id="d-ubio-5-chromosome-structure">글자는 염색체 위의 구간, 검은 점은 동원체이다. 결실은 구간(E)이 없어지고, 중복은 구간(E F)이 한 번 더 들어가며, 역위는 구간(D E F)이 뒤집혀 F E D가 되고, 전좌는 서로 다른(비상동) 두 염색체가 일부(E F G와 P Q)를 맞바꾼다. 역위와 균형 잡힌 전좌는 유전자 양이 그대로라 보인자가 대개 정상이다. 모식도.</desc>
