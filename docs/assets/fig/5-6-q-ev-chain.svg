<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="t-5-6-q-ev-chain d-5-6-q-ev-chain">
  <title id="t-5-6-q-ev-chain">그림 5-6-9 문제 15의 두 자동차의 에너지 전환 단계</title>
  <desc id="d-5-6-q-ev-chain">휘발유 자동차는 엔진 한 단계(효율 25%)를 거치고, 석탄 화력 발전소의 전기로 충전하는 전기 자동차는 발전(40%), 송전(95%), 배터리 충전(90%), 구동 모터(90%)의 네 단계를 거쳐 바퀴의 운동 에너지가 된다.</desc>
  <style>.f5-6-q-ev-chain-t{font-size:14px;fill:var(--fig-ink)} .f5-6-q-ev-chain-s{font-size:13px;fill:var(--fig-muted)} .f5-6-q-ev-chain-h{font-size:15px;font-weight:700;fill:var(--fig-ink)} .f5-6-q-ev-chain-ax{stroke:var(--fig-ink);stroke-width:1.4;fill:none} .f5-6-q-ev-chain-grid{stroke:var(--fig-line);stroke-width:0.8;fill:none} .f5-6-q-ev-chain-w{stroke:var(--fig-ink);stroke-width:2;fill:none} .f5-6-q-ev-chain-coil{stroke:var(--fig-amber);stroke-width:2.6;fill:none}</style>
