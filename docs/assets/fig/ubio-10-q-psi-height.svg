<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-ubio-10-q-psi-height d-ubio-10-q-psi-height">
  <title id="t-ubio-10-q-psi-height">그림 일반생명과학 10-16 문제 18 해설 — 높이에 따른 물관의 수분 퍼텐셜</title>
  <desc id="d-ubio-10-q-psi-height">압력실로 재는 물관의 수분 퍼텐셜(중력 성분 제외)을 높이에 따라 나타낸 것. 흐름 저항이 높이에 따라 고르다고 본 모식도이다. 새벽(흐름 없음)에는 중력분만큼만 낮아져 꼭대기가 −0.99 MPa, 정오에는 흐름분 1.11 MPa가 더해져 −2.10 MPa이다. 가뭄(토양 −1.20 MPa)에 정오와 같은 증산이면 꼭대기가 −2.80 MPa로 공동화 한계 −2.50 MPa를 넘고, 증산을 약 27% 줄이면 흐름분이 0.81 MPa가 되어 −2.50 MPa에 머문다.</desc>
