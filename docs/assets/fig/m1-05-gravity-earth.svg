<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-m1-05-gravity-earth d-m1-05-gravity-earth">
  <title id="t-m1-05-gravity-earth">그림 중1-5-3 중력의 방향과 질량·무게</title>
  <desc id="d-m1-05-gravity-earth">지구 어디에서나 중력은 지구 중심 방향으로 작용한다. 같은 물체를 달에서 재면 용수철저울은 지구의 약 1/6만 늘어나 무게가 줄지만, 양팔저울은 지구와 같은 추와 평형을 이루어 질량은 그대로이다. 크기와 거리는 모식적이다.</desc>
