<title id="t-uearth-4-q-hjulstrom">그림 일반지구과학 4-11 유속–입자 크기 그래프(휼스트룀 도표)</title>
<desc id="d-uearth-4-q-hjulstrom">가로축은 입자 지름, 세로축은 유속이며 둘 다 로그 눈금이다. 위 곡선보다 물살이 빠르면 바닥의 입자가 침식되기 시작하고, 아래 곡선보다 느려지면 떠 있던 입자가 퇴적되며, 두 곡선 사이에서는 이미 움직이는 입자가 계속 운반된다. 곡선은 대표적인 실험 결과를 단순화한 것이다.</desc>
