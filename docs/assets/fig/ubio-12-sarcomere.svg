  <title id="t-ubio-12-sarcomere">그림 일반생명과학 12-3 근육 원섬유 마디의 구조와 교차 다리 순환</title>
  <desc id="d-ubio-12-sarcomere">위: 이완(2.6 μm)과 수축(2.1 μm) 때의 근육 원섬유 마디. 마이오신 필라멘트 길이인 A대는 그대로이고 I대와 H대만 짧아진다. 아래: 마이오신 머리가 ATP 결합으로 떨어지고, ATP 가수 분해로 장전되고, 액틴에 붙은 뒤 인산이 떨어지며 액틴을 M선 쪽으로 당기는 교차 다리 순환. 모식도이다.</desc>
