  <title id="t-uphy-7-q-cu-steel-rod">그림 일반물리학 7-10 문제 6의 이어 붙인 두 막대</title>
  <desc id="d-uphy-7-q-cu-steel-rod">길이 0.20 m인 구리 막대와 강철 막대를 이어 붙이고, 구리 쪽 끝은 100 °C 열원, 강철 쪽 끝은 0 °C 열원에 닿아 있다. 옆면은 단열재로 감쌌다. 접합면의 온도 T는 문제에서 구할 값이다.</desc>
