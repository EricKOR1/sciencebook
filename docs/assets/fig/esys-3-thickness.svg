<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-esys-3-thickness d-esys-3-thickness">
  <title id="t-esys-3-thickness">그림 지구시스템과학 3-5 따뜻한 공기 기둥은 키가 크다</title>
  <desc id="d-esys-3-thickness">지상 기압이 같아도 찬 공기 기둥(고위도)에서는 기압이 높이에 따라 빨리 줄어 등압면이 낮고, 따뜻한 공기 기둥(저위도)에서는 천천히 줄어 등압면이 높다. 그래서 같은 높이에서는 저위도 쪽 기압이 더 높아 상층에서 고위도 쪽으로 기압 경도력이 생기고, 위로 갈수록 커진다. 기온 250 K와 290 K의 공기 기둥으로 계산한 높이이다.</desc>
  <style>
    .esys-3-thickness-t{font-size:13px;fill:var(--fig-ink)}
    .esys-3-thickness-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .esys-3-thickness-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .esys-3-thickness-s{font-size:13px;fill:var(--fig-muted)}
    .esys-3-thickness-r{font-size:13px;font-weight:600;fill:var(--fig-red)}
    .esys-3-thickness-u{font-size:13px;font-weight:600;fill:var(--fig-blue)}
    .esys-3-thickness-g{font-size:13px;font-weight:600;fill:var(--fig-green)}
    .esys-3-thickness-a{font-size:13px;font-weight:600;fill:var(--fig-amber)}
    .esys-3-thickness-v{font-size:13px;font-weight:600;fill:var(--fig-violet)}
    .esys-3-thickness-e{font-size:13px;font-weight:600;fill:var(--fig-teal)}
    .esys-3-thickness-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
<rect x="150" y="60.0" width="210.0" height="240.0" style="fill:var(--fig-soft-blue);stroke:none"/><rect x="360.0" y="60.0" width="210.0" height="240.0" style="fill:var(--fig-soft-red);stroke:none"/><path d="M150 300.0 C330 300.0 390 300.0 570 300.0" style="fill:none;stroke:var(--fig-ink);stroke-width:1.6"/><text x="576.0" y="304.0" class="esys-3-thickness-t">1000 hPa (0.0 km)</text><text x="144.0" y="304.0" text-anchor="end" class="esys-3-thickness-s">0.0 km</text><path d="M150 276.2 C330 276.2 390 272.4 570 272.4" style="fill:none;stroke:var(--fig-ink);stroke-width:1.6"/><text x="576.0" y="276.4" class="esys-3-thickness-t">850 hPa (1.4 km)</text><text x="144.0" y="280.2" text-anchor="end" class="esys-3-thickness-s">1.2 km</text><path d="M150 247.8 C330 247.8 390 239.4 570 239.4" style="fill:none;stroke:var(--fig-ink);stroke-width:1.6"/><text x="576.0" y="243.4" class="esys-3-thickness-t">700 hPa (3.0 km)</text><text x="144.0" y="251.8" text-anchor="end" class="esys-3-thickness-s">2.6 km</text><path d="M150 198.5 C330 198.5 390 182.3 570 182.3" style="fill:none;stroke:var(--fig-ink);stroke-width:1.6"/><text x="576.0" y="186.3" class="esys-3-thickness-t">500 hPa (5.9 km)</text><text x="144.0" y="202.5" text-anchor="end" class="esys-3-thickness-s">5.1 km</text><path d="M150 123.7 C330 123.7 390 95.5 570 95.5" style="fill:none;stroke:var(--fig-ink);stroke-width:1.6"/><text x="576.0" y="99.5" class="esys-3-thickness-t">300 hPa (10.2 km)</text><text x="144.0" y="127.7" text-anchor="end" class="esys-3-thickness-s">8.8 km</text><line x1="150" y1="300" x2="570" y2="300" style="stroke:var(--fig-ink);stroke-width:2"/><text x="255.0" y="320.0" text-anchor="middle" class="esys-3-thickness-u">고위도: 찬 공기(250 K)</text><text x="465.0" y="320.0" text-anchor="middle" class="esys-3-thickness-r">저위도: 따뜻한 공기(290 K)</text><line x1="150" y1="120.0" x2="570" y2="120.0" style="stroke:var(--fig-violet);stroke-width:1.5;stroke-dasharray:6 4"/><text x="162.0" y="114.0" class="esys-3-thickness-v">약 293 hPa</text><text x="558.0" y="114.0" text-anchor="end" class="esys-3-thickness-v">약 347 hPa</text><line x1="450.0" y1="138.0" x2="278.8" y2="138.0" style="stroke:var(--fig-violet);stroke-width:3"/><polygon points="270.0,138.0 281.0,131.4 281.0,144.6" style="fill:var(--fig-violet);stroke:none"/><text x="360.0" y="160.0" text-anchor="middle" class="esys-3-thickness-v esys-3-thickness-halo">같은 높이(9 km)에서의 기압 경도력 → 고위도 쪽</text><text x="360.0" y="78.0" text-anchor="middle" class="esys-3-thickness-b esys-3-thickness-halo">전향력과 균형 → 상층의 서풍(편서풍·제트류)</text><text x="144.0" y="64.0" text-anchor="end" class="esys-3-thickness-s">높이</text></svg>
