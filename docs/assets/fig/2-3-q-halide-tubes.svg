  <desc id="d-2-3-q-halide-tubes">세 시험관에 넣은 수용액의 종류·농도·부피와 떨어뜨린 질산 은 수용액의 방울 수, 생긴 앙금의 색과 양을 나란히 나타냈다. 수용액의 높이는 부피에 비례하고, 진한 수용액은 색을 진하게 그렸다. 모식도.</desc>
