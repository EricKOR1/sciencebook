<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-ubio-3-activation d-ubio-3-activation">
  <title id="t-ubio-3-activation">그림 일반생명과학 3-4 효소는 활성화 에너지를 낮춘다</title>
  <desc id="d-ubio-3-activation">왼쪽: 반응 진행에 따른 자유 에너지. 효소가 없을 때(회색)보다 효소가 있을 때(초록) 전이 상태의 언덕이 낮아 활성화 에너지가 작지만, 반응물과 생성물의 자유 에너지 차이 ΔG는 같다. 오른쪽: 기질이 활성 부위에 결합하면 효소의 모양이 조금 바뀌어 기질을 꼭 감싼다(유도 적합). 그 뒤 생성물이 떨어져 나가고 효소는 다시 쓰인다. 모식도이다.</desc>
