<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-4-2-biodiversity-levels d-4-2-biodiversity-levels">
  <title id="t-4-2-biodiversity-levels">그림 4-2-2 생물다양성의 세 수준</title>
  <desc id="d-4-2-biodiversity-levels">유전적 다양성은 같은 종(예: 아시아무당벌레) 안에서 개체마다 유전자가 달라 형질이 다양한 정도, 종 다양성은 한 지역에 사는 종의 수와 고르게 분포한 정도, 생태계 다양성은 숲·초원·강·갯벌·바다처럼 한 지역에 있는 생태계의 다양한 정도이다. 모식도.</desc>
