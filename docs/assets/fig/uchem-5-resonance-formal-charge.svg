  <text x="58" y="314" class="uchem-5-rf-t" style="font-weight:600">형식 전하 = (원자가 전자) − (비공유 전자) − ½(결합 전자)</text>
  <text x="58" y="338" class="uchem-5-rf-t">N: 5 − 0 − ½×8 = <tspan class="uchem-5-rf-pos">+1</tspan>     이중 결합 O: 6 − 4 − ½×4 = 0     단일 결합 O: 6 − 6 − ½×2 = <tspan class="uchem-5-rf-neg">−1</tspan></text>
  <text x="58" y="362" class="uchem-5-rf-s">합: +1 + 0 + (−1) + (−1) = −1 = 이온의 전하.  혼성체에서는 −1 두 개가 세 O에 고르게 퍼져 O마다 −2/3이다.</text>
