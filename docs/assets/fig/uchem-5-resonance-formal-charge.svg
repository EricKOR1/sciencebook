<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uchem-5-resonance-formal-charge d-uchem-5-resonance-formal-charge">
  <title id="t-uchem-5-resonance-formal-charge">그림 일반화학 5-4 질산 이온의 공명 구조와 형식 전하</title>
  <desc id="d-uchem-5-resonance-formal-charge">질산 이온 NO₃⁻은 이중 결합의 위치만 다른 루이스 구조 세 개로 그릴 수 있다. 각 구조에서 N의 형식 전하는 +1, 단일 결합 O는 −1, 이중 결합 O는 0이다. 실제 이온은 셋의 평균인 공명 혼성체 하나로, 세 N–O 결합이 모두 같고 결합 차수는 4/3, 각 O에는 평균 −2/3의 음전하가 퍼져 있다.</desc>
