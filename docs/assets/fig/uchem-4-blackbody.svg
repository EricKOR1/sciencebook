<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" role="img" aria-labelledby="t-uchem-4-blackbody d-uchem-4-blackbody">
  <title id="t-uchem-4-blackbody">그림 일반화학 4-4 흑체 복사 스펙트럼과 고전 물리학의 예측</title>
  <desc id="d-uchem-4-blackbody">온도가 3000 K, 4000 K, 5000 K인 흑체가 내는 빛의 세기를 파장에 대해 플랑크 식으로 계산해 그렸다(세로축은 5000 K 곡선의 최댓값을 1로 둔 상대 세기). 온도가 높을수록 전체 세기가 커지고 봉우리가 짧은 파장 쪽으로 옮겨 간다. 점선은 에너지를 연속적으로 주고받는다고 본 고전 물리학의 예측(5000 K)으로, 짧은 파장으로 갈수록 끝없이 커져 실제와 어긋난다(자외선 파탄).</desc>
