<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-mech-1-centripetal-examples d-mech-1-centripetal-examples">
  <title id="t-mech-1-centripetal-examples">그림 역학과 에너지 1-6 무엇이 구심력 역할을 하는가</title>
  <desc id="d-mech-1-centripetal-examples">(가) 평평한 커브 길에서는 도로가 타이어에 주는 정지 마찰력이 커브 중심 쪽을 향해 구심력이 된다. (나) 회전 그네에서는 줄 장력의 연직 성분이 중력과 평형을 이루고, 수평 성분이 구심력이 된다. (다) 루프 꼭대기에서는 중력과 레일의 수직항력이 모두 아래(중심)를 향하고 그 합이 구심력이 된다.</desc>
  <rect x="10.0" y="10.0" width="227.0" height="340.0" rx="10" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <rect x="247.0" y="10.0" width="227.0" height="340.0" rx="10" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <rect x="484.0" y="10.0" width="227.0" height="340.0" rx="10" style="fill:var(--fig-paper);stroke:var(--fig-line);stroke-width:1"/>
  <text x="24.0" y="36.0" style="font-size:15px;fill:var(--fig-ink);font-weight:600">(가) 평평한 커브 길</text>
  <text x="24.0" y="56.0" style="font-size:13px;fill:var(--fig-muted)">뒤에서 본 모습</text>
  <line x1="20.0" y1="250.0" x2="228.0" y2="250.0" style="stroke:var(--fig-line);stroke-width:2.5;fill:none"/>
  <rect x="80.0" y="140.0" width="70.0" height="92.0" rx="6" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <circle cx="92.0" cy="241.0" r="9.0" style="fill:var(--fig-ink);stroke:none;stroke-width:1.5"/>
  <circle cx="138.0" cy="241.0" r="9.0" style="fill:var(--fig-ink);stroke:none;stroke-width:1.5"/>
  <line x1="115.0" y1="180.0" x2="115.0" y2="230.0" style="stroke:var(--fig-ink);stroke-width:3.5;fill:none"/>
  <path d="M115.0 242.0 L109.0 230.0 L121.0 230.0 Z" style="fill:var(--fig-ink);stroke:none"/>
  <text x="109.0" y="210.0" text-anchor="end" style="font-size:14px;fill:var(--fig-ink);font-weight:600">mg</text>
  <line x1="137.0" y1="250.0" x2="137.0" y2="141.0" style="stroke:var(--fig-blue);stroke-width:3;fill:none"/>
  <path d="M137.0 130.0 L142.5 141.0 L131.5 141.0 Z" style="fill:var(--fig-blue);stroke:none"/>
  <text x="143.0" y="140.0" style="font-size:14px;fill:var(--fig-blue);font-weight:600">N</text>
  <line x1="115.0" y1="254.0" x2="42.0" y2="254.0" style="stroke:var(--fig-green);stroke-width:3.5;fill:none"/>
  <path d="M30.0 254.0 L42.0 248.0 L42.0 260.0 Z" style="fill:var(--fig-green);stroke:none"/>
  <text x="29.0" y="276.0" style="font-size:14px;fill:var(--fig-green);font-weight:600">정지 마찰력 f</text>
  <text x="26.0" y="108.0" style="font-size:13px;fill:var(--fig-muted)">← 커브의 중심</text>
  <text x="122.0" y="318.0" text-anchor="middle" style="font-size:15px;fill:var(--fig-red);font-weight:600">구심력 = f</text>
  <text x="122.0" y="338.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-muted)">N = mg (연직 평형)</text>
  <text x="261.0" y="36.0" style="font-size:15px;fill:var(--fig-ink);font-weight:600">(나) 회전 그네</text>
  <rect x="367.0" y="62.0" width="60.0" height="8.0" rx="0" style="fill:var(--fig-line);stroke:none;stroke-width:1.5"/>
