  <line x1="325.5" y1="184.5" x2="361.5" y2="126.8" style="stroke:var(--fig-blue);stroke-width:3.5;fill:none"/>
  <path d="M367.9 116.6 L366.6 130.0 L356.4 123.6 Z" style="fill:var(--fig-blue);stroke:none"/>
  <text x="373.9" y="134.6" style="font-size:15px;fill:var(--fig-blue);font-weight:600">T</text>
  <line x1="367.9" y1="116.6" x2="325.5" y2="116.6" style="stroke:var(--fig-line);stroke-width:1.2;fill:none;stroke-dasharray:4 3"/>
  <line x1="367.9" y1="116.6" x2="367.9" y2="184.5" style="stroke:var(--fig-line);stroke-width:1.2;fill:none;stroke-dasharray:4 3"/>
  <line x1="325.5" y1="184.5" x2="325.5" y2="125.6" style="stroke:var(--fig-violet);stroke-width:2.5;fill:none"/>
  <path d="M325.5 116.6 L330.0 125.6 L321.0 125.6 Z" style="fill:var(--fig-violet);stroke:none"/>
  <line x1="325.5" y1="184.5" x2="357.9" y2="184.5" style="stroke:var(--fig-red);stroke-width:3;fill:none"/>
  <path d="M367.9 184.5 L357.9 189.5 L357.9 179.5 Z" style="fill:var(--fig-red);stroke:none"/>
  <line x1="325.5" y1="184.5" x2="325.5" y2="240.3" style="stroke:var(--fig-ink);stroke-width:3.5;fill:none"/>
  <path d="M325.5 252.3 L319.5 240.3 L331.5 240.3 Z" style="fill:var(--fig-ink);stroke:none"/>
  <circle cx="325.5" cy="184.5" r="8.0" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <text x="317.5" y="154.5" text-anchor="end" style="font-size:13px;fill:var(--fig-violet);font-weight:600">T cosθ</text>
  <text x="329.5" y="282.5" style="font-size:14px;fill:var(--fig-ink);font-weight:600">mg</text>
  <text x="371.9" y="176.5" style="font-size:13px;fill:var(--fig-red);font-weight:600">T sinθ</text>
  <text x="360.0" y="318.0" text-anchor="middle" style="font-size:15px;fill:var(--fig-red);font-weight:600">구심력 = T sinθ</text>
  <text x="360.0" y="338.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-muted)">T cosθ = mg (연직 평형)</text>
  <text x="498.0" y="36.0" style="font-size:15px;fill:var(--fig-ink);font-weight:600">(다) 루프의 꼭대기</text>
  <circle cx="597.0" cy="205.0" r="85.0" style="fill:none;stroke:var(--fig-line);stroke-width:4"/>
  <circle cx="597.0" cy="205.0" r="3.0" style="fill:var(--fig-ink);stroke:none;stroke-width:1.5"/>
  <text x="603.0" y="223.0" style="font-size:13px;fill:var(--fig-muted)">중심</text>
  <rect x="575.0" y="124.0" width="44.0" height="24.0" rx="5" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2"/>
  <line x1="589.0" y1="136.0" x2="589.0" y2="196.0" style="stroke:var(--fig-ink);stroke-width:3.5;fill:none"/>
  <path d="M589.0 208.0 L583.0 196.0 L595.0 196.0 Z" style="fill:var(--fig-ink);stroke:none"/>
  <text x="583.0" y="206.0" text-anchor="end" style="font-size:14px;fill:var(--fig-ink);font-weight:600">mg</text>
  <line x1="607.0" y1="124.0" x2="607.0" y2="173.0" style="stroke:var(--fig-blue);stroke-width:3;fill:none"/>
  <path d="M607.0 184.0 L601.5 173.0 L612.5 173.0 Z" style="fill:var(--fig-blue);stroke:none"/>
  <text x="613.0" y="182.0" style="font-size:14px;fill:var(--fig-blue);font-weight:600">N</text>
  <text x="557.0" y="114.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-muted)">← 진행</text>
  <text x="597.0" y="318.0" text-anchor="middle" style="font-size:15px;fill:var(--fig-red);font-weight:600">구심력 = mg + N</text>
  <text x="597.0" y="338.0" text-anchor="middle" style="font-size:13px;fill:var(--fig-muted)">N ≥ 0 이려면 v ≥ √(gr)</text>
</svg>
