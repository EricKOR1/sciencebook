<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-pchem-6-vant-hoff-cp d-pchem-6-vant-hoff-cp">
  <title id="t-pchem-6-vant-hoff-cp">그림 물리화학 6-3 암모니아 합성의 판트호프 그래프와 ΔrCp° 보정</title>
  <desc id="d-pchem-6-vant-hoff-cp">N₂ + 3H₂ ⇌ 2NH₃의 ln K를 1/T에 대해 그렸다. 점선은 ΔrH° = −92.22 kJ/mol 일정(직선, 기울기 +11 092 K), 실선은 ΔrCp° = −45.46 J/(mol·K) 일정으로 적분한 곡선이며 두 선은 298.15 K에서 접한다. 700 K에서 ln K는 각각 −8.08과 −9.61이고, 실선의 700 K 접선 기울기가 −ΔrH°(700 K)/R(ΔrH°(700 K) = −110.5 kJ/mol)이다.</desc>
