<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-esys-1-q-igneous-chart d-esys-1-q-igneous-chart">
  <title id="t-esys-1-q-igneous-chart">그림 지구시스템과학 1-13 문제 14 해설의 화성암 분류</title>
  <desc id="d-esys-1-q-igneous-chart">SiO₂ 함량(가로)과 조직(세로)으로 화성암을 나눈 표에 암석 A(약 50 %, 조립질), B(약 72 %, 세립질), C(약 58 %, 반상 조직)를 놓았다. A는 반려암, B는 유문암, C는 (반상) 안산암 칸에 들어간다.</desc>
  <style>
    .esys-1-q-igneous-chart-t{font-size:14px;fill:var(--fig-ink)} .esys-1-q-igneous-chart-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .esys-1-q-igneous-chart-s{font-size:13px;fill:var(--fig-muted)} .esys-1-q-igneous-chart-ax{fill:none;stroke:var(--fig-muted);stroke-width:1.4} .esys-1-q-igneous-chart-gr{fill:none;stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4}
  </style>
  <rect x="170" y="60" width="121.3" height="100" style="fill:var(--fig-soft-violet);stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="230.7" y="88" text-anchor="middle" class="esys-1-q-igneous-chart-b">현무암</text>
  <rect x="291.3" y="60" width="190.7" height="100" style="fill:var(--fig-soft-teal);stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="386.7" y="88" text-anchor="middle" class="esys-1-q-igneous-chart-b">안산암</text>
  <rect x="482" y="60" width="208" height="100" style="fill:var(--fig-soft-amber);stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="586" y="88" text-anchor="middle" class="esys-1-q-igneous-chart-b">유문암</text>
  <text x="20" y="100" class="esys-1-q-igneous-chart-b">화산암</text>
  <text x="20" y="120" class="esys-1-q-igneous-chart-s">세립질·반상 조직</text>
  <text x="20" y="138" class="esys-1-q-igneous-chart-s">빨리 식음(지표 부근)</text>
  <rect x="170" y="160" width="121.3" height="100" style="fill:var(--fig-soft-violet);stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="230.7" y="188" text-anchor="middle" class="esys-1-q-igneous-chart-b">반려암</text>
  <rect x="291.3" y="160" width="190.7" height="100" style="fill:var(--fig-soft-teal);stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="386.7" y="188" text-anchor="middle" class="esys-1-q-igneous-chart-b">섬록암</text>
  <rect x="482" y="160" width="208" height="100" style="fill:var(--fig-soft-amber);stroke:var(--fig-line);stroke-width:1.2"/>
  <text x="586" y="188" text-anchor="middle" class="esys-1-q-igneous-chart-b">화강암</text>
  <text x="20" y="200" class="esys-1-q-igneous-chart-b">심성암</text>
  <text x="20" y="220" class="esys-1-q-igneous-chart-s">조립질 조직</text>
  <text x="20" y="238" class="esys-1-q-igneous-chart-s">천천히 식음(깊은 곳)</text>
  <text x="230.7" y="50" text-anchor="middle" class="esys-1-q-igneous-chart-s">현무암질</text>
  <text x="386.7" y="50" text-anchor="middle" class="esys-1-q-igneous-chart-s">안산암질</text>
  <text x="586" y="50" text-anchor="middle" class="esys-1-q-igneous-chart-s">유문암질</text>
  <line x1="170" y1="260" x2="170" y2="268" class="esys-1-q-igneous-chart-ax"/>
  <text x="170" y="284" text-anchor="middle" class="esys-1-q-igneous-chart-s">45</text>
  <line x1="291.3" y1="260" x2="291.3" y2="268" class="esys-1-q-igneous-chart-ax"/>
  <text x="291.3" y="284" text-anchor="middle" class="esys-1-q-igneous-chart-s">52</text>
  <line x1="482" y1="260" x2="482" y2="268" class="esys-1-q-igneous-chart-ax"/>
  <text x="482" y="284" text-anchor="middle" class="esys-1-q-igneous-chart-s">63</text>
  <line x1="690" y1="260" x2="690" y2="268" class="esys-1-q-igneous-chart-ax"/>
  <text x="690" y="284" text-anchor="middle" class="esys-1-q-igneous-chart-s">75</text>
  <line x1="170" y1="260" x2="690" y2="260" class="esys-1-q-igneous-chart-ax"/>
  <text x="690" y="302" text-anchor="end" class="esys-1-q-igneous-chart-s">SiO₂ 함량(%)</text>
  <text x="170" y="330" class="esys-1-q-igneous-chart-s">← 어두운 색, 밀도 큼</text>
  <text x="690" y="330" text-anchor="end" class="esys-1-q-igneous-chart-s">밝은 색, 밀도 작음 →</text>
  <circle cx="256.7" cy="215" r="14" style="fill:var(--fig-panel);stroke:var(--fig-red);stroke-width:2.5"/>
  <text x="256.7" y="220" text-anchor="middle" class="esys-1-q-igneous-chart-b" style="fill:var(--fig-red)">A</text>
  <circle cx="638" cy="115" r="14" style="fill:var(--fig-panel);stroke:var(--fig-red);stroke-width:2.5"/>
  <text x="638" y="120" text-anchor="middle" class="esys-1-q-igneous-chart-b" style="fill:var(--fig-red)">B</text>
  <circle cx="395.3" cy="115" r="14" style="fill:var(--fig-panel);stroke:var(--fig-red);stroke-width:2.5"/>
  <text x="395.3" y="120" text-anchor="middle" class="esys-1-q-igneous-chart-b" style="fill:var(--fig-red)">C</text>
</svg>
