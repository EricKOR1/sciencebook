<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="t-uearth-4-river-profile d-uearth-4-river-profile">
<title id="t-uearth-4-river-profile">그림 일반지구과학 4-1 하천의 종단면과 구간별 지형</title>
<desc id="d-uearth-4-river-profile">상류에서 가파르고 하류에서 완만한 오목한 종단면을 따라, 상류에서는 바닥을 깎는 하각 작용으로 V자곡이, 중·하류에서는 측방 침식과 퇴적으로 곡류와 범람원이 생기며, 퇴적물은 하류로 갈수록 고와진다. 해수면이 최종 침식 기준면이다.</desc>
