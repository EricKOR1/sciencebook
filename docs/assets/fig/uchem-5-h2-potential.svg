    .uchem-5-h2-potential-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-5-h2-potential-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-5-h2-potential-b{font-size:15px;fill:var(--fig-ink);font-weight:bold}
    .uchem-5-h2-potential-ax{stroke:var(--fig-ink);stroke-width:1.2;fill:none}
    .uchem-5-h2-potential-gr{stroke:var(--fig-line);stroke-width:0.6;fill:none;stroke-dasharray:2 3}

    .uchem-5-h2-potential-cv{stroke:var(--fig-accent);stroke-width:2.6;fill:none}
    .uchem-5-h2-potential-dash{stroke:var(--fig-muted);stroke-width:1.2;stroke-dasharray:5 4;fill:none}
    .uchem-5-h2-potential-arr{stroke:var(--fig-red);stroke-width:1.6;fill:none}
    .uchem-5-h2-potential-ah{fill:var(--fig-red)}
    .uchem-5-h2-potential-h{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.2;fill-opacity:0.8}
    .uchem-5-h2-potential-nu{fill:var(--fig-ink)}
  </style>
