<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uchem-5-h2-potential d-uchem-5-h2-potential">
  <title id="t-uchem-5-h2-potential">그림 일반화학 5-1 수소 분자의 퍼텐셜 에너지 곡선</title>
  <desc id="d-uchem-5-h2-potential">두 수소 원자 사이 거리(핵간 거리)에 따른 계의 에너지. 멀리 떨어져 있으면 에너지가 0이고, 가까워지면 인력 때문에 내려가다가, 너무 가까우면 원자핵끼리·전자끼리의 반발로 급격히 올라간다. 가장 낮은 점의 거리 74 pm이 결합 길이, 그 깊이 436 kJ/mol이 결합 에너지이다. 곡선 모양은 모스 함수로 어림한 것이다.</desc>
