<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-chem-1-ammonia-ratio d-chem-1-ammonia-ratio">
  <title id="t-chem-1-ammonia-ratio">그림 화학 1-3 계수비는 몰수비, 질량비와는 다르다</title>
  <desc id="d-chem-1-ammonia-ratio">암모니아 합성 반응에서 질소 1 mol, 수소 3 mol이 반응하여 암모니아 2 mol이 생긴다. 몰수를 막대로 나타내면 1 : 3 : 2로 계수비와 같지만, 질량은 28 g, 6 g, 34 g으로 계수비와 다르다. 반응 전후 질량의 합(34 g)은 같다. 분자 모형은 모식적이다.</desc>
  <style>
    .c1ar-ink{fill:var(--fig-ink)} .c1ar-mut{fill:var(--fig-muted)}
    .c1ar-lbl{font-size:14px;fill:var(--fig-ink)} .c1ar-b{font-size:15px;font-weight:600;fill:var(--fig-ink)} .c1ar-sm{font-size:13px;fill:var(--fig-muted)}
    .c1ar-H{fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.2} .c1ar-O{fill:var(--fig-red);stroke:var(--fig-red);stroke-width:1} .c1ar-C{fill:var(--fig-ink);stroke:var(--fig-ink);stroke-width:1} .c1ar-N{fill:var(--fig-blue);stroke:var(--fig-blue);stroke-width:1}
    .c1ar-Cl{fill:var(--fig-green);stroke:var(--fig-green);stroke-width:1} .c1ar-at{font-size:13px;font-weight:600}
    .c1ar-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2} .c1ar-bN{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5} .c1ar-bH{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5} .c1ar-bA{fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5}
  </style>
  <text x="360.0" y="28.0" text-anchor="middle" class="c1ar-b">N₂(g) + 3H₂(g) → 2NH₃(g)</text>
  <circle cx="85.0" cy="82.0" r="13" class="c1ar-N"/><text x="85.0" y="86.5" text-anchor="middle" class="c1ar-at" style="fill:var(--fig-paper)">N</text>
  <circle cx="107.0" cy="82.0" r="13" class="c1ar-N"/><text x="107.0" y="86.5" text-anchor="middle" class="c1ar-at" style="fill:var(--fig-paper)">N</text>
  <text x="96.0" y="124.0" text-anchor="middle" class="c1ar-lbl">N₂ 1 mol</text>
  <text x="170.0" y="87.0" text-anchor="middle" class="c1ar-b">+</text>
  <circle cx="216.0" cy="82.0" r="10" class="c1ar-H"/><text x="216.0" y="86.5" text-anchor="middle" class="c1ar-at" style="fill:var(--fig-ink)">H</text>
  <circle cx="234.0" cy="82.0" r="10" class="c1ar-H"/><text x="234.0" y="86.5" text-anchor="middle" class="c1ar-at" style="fill:var(--fig-ink)">H</text>
  <circle cx="266.0" cy="82.0" r="10" class="c1ar-H"/><text x="266.0" y="86.5" text-anchor="middle" class="c1ar-at" style="fill:var(--fig-ink)">H</text>
  <circle cx="284.0" cy="82.0" r="10" class="c1ar-H"/><text x="284.0" y="86.5" text-anchor="middle" class="c1ar-at" style="fill:var(--fig-ink)">H</text>
  <circle cx="316.0" cy="82.0" r="10" class="c1ar-H"/><text x="316.0" y="86.5" text-anchor="middle" class="c1ar-at" style="fill:var(--fig-ink)">H</text>
  <circle cx="334.0" cy="82.0" r="10" class="c1ar-H"/><text x="334.0" y="86.5" text-anchor="middle" class="c1ar-at" style="fill:var(--fig-ink)">H</text>
  <text x="275.0" y="124.0" text-anchor="middle" class="c1ar-lbl">H₂ 3 mol</text>
  <line x1="372.0" y1="82.0" x2="409.0" y2="82.0" style="stroke:var(--fig-ink);stroke-width:3"/><path d="M420.0 82.0 L409.0 87.5 L409.0 76.5 Z" style="fill:var(--fig-ink)"/>
  <circle cx="483.0" cy="73.0" r="9" class="c1ar-H"/><text x="483.0" y="77.5" text-anchor="middle" class="c1ar-at" style="fill:var(--fig-ink)">H</text>
  <circle cx="517.0" cy="73.0" r="9" class="c1ar-H"/><text x="517.0" y="77.5" text-anchor="middle" class="c1ar-at" style="fill:var(--fig-ink)">H</text>
  <circle cx="500.0" cy="99.0" r="9" class="c1ar-H"/><text x="500.0" y="103.5" text-anchor="middle" class="c1ar-at" style="fill:var(--fig-ink)">H</text>
  <circle cx="500.0" cy="79.0" r="13" class="c1ar-N"/><text x="500.0" y="83.5" text-anchor="middle" class="c1ar-at" style="fill:var(--fig-paper)">N</text>
  <circle cx="573.0" cy="73.0" r="9" class="c1ar-H"/><text x="573.0" y="77.5" text-anchor="middle" class="c1ar-at" style="fill:var(--fig-ink)">H</text>
  <circle cx="607.0" cy="73.0" r="9" class="c1ar-H"/><text x="607.0" y="77.5" text-anchor="middle" class="c1ar-at" style="fill:var(--fig-ink)">H</text>
  <circle cx="590.0" cy="99.0" r="9" class="c1ar-H"/><text x="590.0" y="103.5" text-anchor="middle" class="c1ar-at" style="fill:var(--fig-ink)">H</text>
  <circle cx="590.0" cy="79.0" r="13" class="c1ar-N"/><text x="590.0" y="83.5" text-anchor="middle" class="c1ar-at" style="fill:var(--fig-paper)">N</text>
  <text x="545.0" y="124.0" text-anchor="middle" class="c1ar-lbl">NH₃ 2 mol</text>
  <text x="360.0" y="150.0" text-anchor="middle" class="c1ar-sm">분자 1개 그림 = 1 mol(6.02×10²³개)의 묶음</text>
  <rect x="30" y="166" width="320" height="216" rx="8" class="c1ar-box"/>
  <text x="190.0" y="190.0" text-anchor="middle" class="c1ar-b">몰수(mol)</text>
  <line x1="60" y1="330" x2="320" y2="330" style="stroke:var(--fig-ink);stroke-width:1.5"/>
  <rect x="85" y="298.0" width="50" height="32.0" class="c1ar-bN"/>
  <text x="110.0" y="292.0" text-anchor="middle" class="c1ar-lbl">1 mol</text>
  <text x="110.0" y="348.0" text-anchor="middle" class="c1ar-lbl">N₂</text>
  <rect x="165" y="234.0" width="50" height="96.0" class="c1ar-bH"/>
  <text x="190.0" y="228.0" text-anchor="middle" class="c1ar-lbl">3 mol</text>
  <text x="190.0" y="348.0" text-anchor="middle" class="c1ar-lbl">H₂</text>
  <rect x="245" y="266.0" width="50" height="64.0" class="c1ar-bA"/>
  <text x="270.0" y="260.0" text-anchor="middle" class="c1ar-lbl">2 mol</text>
  <text x="270.0" y="348.0" text-anchor="middle" class="c1ar-lbl">NH₃</text>
  <text x="190.0" y="372.0" text-anchor="middle" class="c1ar-b" style="fill:var(--fig-blue)">1 : 3 : 2 = 계수비</text>
  <rect x="370" y="166" width="320" height="216" rx="8" class="c1ar-box"/>
  <text x="530.0" y="190.0" text-anchor="middle" class="c1ar-b">질량(g)</text>
  <line x1="400" y1="330" x2="660" y2="330" style="stroke:var(--fig-ink);stroke-width:1.5"/>
  <rect x="425" y="248.8" width="50" height="81.2" class="c1ar-bN"/>
  <text x="450.0" y="242.8" text-anchor="middle" class="c1ar-lbl">28 g</text>
  <text x="450.0" y="348.0" text-anchor="middle" class="c1ar-lbl">N₂</text>
  <rect x="505" y="312.6" width="50" height="17.4" class="c1ar-bH"/>
  <text x="530.0" y="306.6" text-anchor="middle" class="c1ar-lbl">6 g</text>
  <text x="530.0" y="348.0" text-anchor="middle" class="c1ar-lbl">H₂</text>
  <rect x="585" y="231.4" width="50" height="98.6" class="c1ar-bA"/>
  <text x="610.0" y="225.4" text-anchor="middle" class="c1ar-lbl">34 g</text>
  <text x="610.0" y="348.0" text-anchor="middle" class="c1ar-lbl">NH₃</text>
  <text x="530.0" y="372.0" text-anchor="middle" class="c1ar-b" style="fill:var(--fig-red)">14 : 3 : 17 ≠ 계수비</text>
  <text x="475.0" y="216.0" text-anchor="middle" class="c1ar-sm">28 g + 6 g = 34 g (질량 보존)</text>
</svg>
