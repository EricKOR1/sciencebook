  <text x="545.0" y="150.0" text-anchor="start" class="m1-03-q-sea-breeze-t">데워진 공기가 올라간다</text>
  <text x="175.0" y="150.0" text-anchor="end" class="m1-03-q-sea-breeze-t">공기가</text>
  <text x="175.0" y="168.0" text-anchor="end" class="m1-03-q-sea-breeze-t">내려온다</text>
