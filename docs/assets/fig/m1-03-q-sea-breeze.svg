<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-m1-03-q-sea-breeze d-m1-03-q-sea-breeze">
  <title id="t-m1-03-q-sea-breeze">그림 중1-3-16 문제 11 해설 — 낮에 바닷가에서 부는 바람</title>
  <desc id="d-m1-03-q-sea-breeze">낮에 비열이 작은 육지가 바다보다 빨리 데워져 육지 위 공기가 올라가고, 그 빈자리로 바다 위 공기가 육지 쪽으로 불어 들어온다. 위쪽에서는 공기가 바다 쪽으로 돌아가 바다 위에서 내려오며 순환(대류)한다.</desc>
  <style>.m1-03-q-sea-breeze-t{font-size:14px;fill:var(--fig-ink)} .m1-03-q-sea-breeze-b{font-size:15px;font-weight:700;fill:var(--fig-ink)} .m1-03-q-sea-breeze-s{font-size:13px;fill:var(--fig-muted)} .m1-03-q-sea-breeze-big{font-size:18px;font-weight:700;fill:var(--fig-ink)}</style>
  <path d="M20 230 L360 230 L360 280 L20 280 Z" style="fill:var(--fig-soft-blue);stroke:none"/>
  <path d="M20 230 Q50 224 80 230 T140 230 T200 230 T260 230 T320 230 L360 230" style="fill:none;stroke:var(--fig-blue);stroke-width:2"/>
  <path d="M360 280 L360 226 L700 220 L700 280 Z" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <text x="190.0" y="262.0" text-anchor="middle" class="m1-03-q-sea-breeze-t">바다: 비열이 크다 → 천천히 데워진다</text>
  <text x="530.0" y="262.0" text-anchor="middle" class="m1-03-q-sea-breeze-t">육지: 비열이 작다 → 빨리 데워진다</text>
