<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="t-uearth-8-cyclone-life d-uearth-8-cyclone-life">
  <title id="t-uearth-8-cyclone-life">그림 일반지구과학 8-3 중위도 저기압의 일생 — 노르웨이 모형(지상, 북반구)</title>
  <desc id="d-uearth-8-cyclone-life">① 정체 전선 위에 작은 파동이 생긴다. ② 저기압 중심의 동쪽에 온난 전선, 남서쪽에 한랭 전선이 생기고 그 사이에 따뜻한 온난 구역이 놓인다. ③ 빠른 한랭 전선이 온난 전선을 따라잡아 폐색 전선이 생기며 저기압이 가장 깊어진다. ④ 따뜻한 공기가 모두 위로 밀려 올라가 지상은 찬 공기로 덮이고 저기압이 약해진다. 위쪽이 북쪽인 모식도이다.</desc>
