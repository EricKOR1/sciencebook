<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-labelledby="t-pchem-9-helium-coordinates d-pchem-9-helium-coordinates">
  <title id="t-pchem-9-helium-coordinates">그림 물리화학 9-1 헬륨 원자의 좌표와 해밀토니언의 다섯 항</title>
  <desc id="d-pchem-9-helium-coordinates">원자핵(+2e)에서 두 전자까지의 거리 r₁, r₂와 두 전자 사이의 거리 r₁₂. 오른쪽은 원자 단위 해밀토니언의 항을 운동 에너지, 핵 인력, 전자 반발로 나누어 적은 것으로, 마지막 항 1/r₁₂이 두 전자의 좌표를 묶어 변수 분리를 막는다.</desc>
