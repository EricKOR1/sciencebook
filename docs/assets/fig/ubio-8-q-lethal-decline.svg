<title id="t-ubio-8-q-lethal-decline">그림 일반생명과학 8-2 예제 5 풀이의 치사 열성 대립유전자 빈도</title>
<desc id="d-ubio-8-q-lethal-decline">q의 처음 값 0.10에서 1/q = 1/q₀ + t에 따라 계산한 a의 빈도. 빈도가 0.10에서 0.050으로 반이 되는 데는 10세대, 0.020에서 0.010으로 반이 되는 데는 50세대가 걸려, 빈도가 낮을수록 감소가 느려진다. 0.010에는 90세대 만에 도달한다.</desc>
