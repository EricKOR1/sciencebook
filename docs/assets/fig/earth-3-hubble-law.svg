<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 386" role="img" aria-labelledby="t-earth-3-hubble-law d-earth-3-hubble-law">
  <title id="t-earth-3-hubble-law">그림 지구과학 3-11 허블–르메트르 법칙</title>
  <desc id="d-earth-3-hubble-law">외부 은하의 거리와 후퇴 속도를 그래프에 찍으면 거의 원점을 지나는 직선 위에 놓이며, 그 기울기가 허블 상수 H₀(약 70 km/(s·Mpc))이다. 점은 설명을 위해 만든 가상의 자료이다.</desc>
  <style>
    .earth-3-hubble-law-t{font-size:14px;fill:var(--fig-ink)}
    .earth-3-hubble-law-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .earth-3-hubble-law-s{font-size:13px;fill:var(--fig-muted)}
    .earth-3-hubble-law-land{fill:var(--fig-soft-green);stroke:var(--fig-green);stroke-width:0.8;fill-rule:evenodd}
    .earth-3-hubble-law-sea{fill:var(--fig-soft-blue)}
    .earth-3-hubble-law-grat{fill:none;stroke:var(--fig-line);stroke-width:0.6;stroke-dasharray:3 3;opacity:0.7}
    .earth-3-hubble-law-frame{fill:none;stroke:var(--fig-line);stroke-width:1.2}
    .earth-3-hubble-law-halo{paint-order:stroke;stroke:var(--fig-paper);stroke-width:3.5px;stroke-linejoin:round}
  </style>
