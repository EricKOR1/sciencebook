  <title id="t-umath-3-spherical-coords">그림 수학 도구 3-1 구면 좌표와 단위 벡터</title>
  <desc id="d-umath-3-spherical-coords">점 P의 구면 좌표 (r, θ, φ): θ는 +z축에서 잰 극각, φ는 xy 평면에서 x축으로부터 잰 방위각이다. P에서 서로 수직인 세 단위 벡터 r̂(바깥), θ̂(θ가 커지는 쪽, 남쪽), φ̂(φ가 커지는 쪽, 동쪽)와, 세 변이 dr, r dθ, r sinθ dφ인 부피 요소를 그렸다.</desc>
