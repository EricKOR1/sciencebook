<text x="623.7" y="272" class="u12a-sm" style="fill:var(--fig-blue)">v</text>
<text x="20" y="372" class="u12a-s">빛은 땅에서도 양쪽으로 c로 퍼진다. 뒤쪽 벽은 빛을 향해 다가오고 앞쪽 벽은 멀어지므로 뒤쪽에 먼저 닿는다.</text>
<text x="20" y="390" class="u12a-s">점선 기차: 빛이 출발한 순간의 위치. (나)의 기차는 땅에서 잰 길이(고유 길이의 1/γ)로 그린 모식도이다.</text>
