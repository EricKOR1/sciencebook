<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 402" role="img" aria-labelledby="t-uphy-12-simultaneity-train d-uphy-12-simultaneity-train">
  <title id="t-uphy-12-simultaneity-train">그림 일반물리학 12-1 동시성의 상대성 — 기차 가운데에서 보낸 빛</title>
  <desc id="d-uphy-12-simultaneity-train">(가) 기차 기준틀에서는 기차 가운데에서 앞뒤로 보낸 빛이 같은 거리를 같은 속력 c로 가서 두 벽에 동시에 도착한다. (나) 기차가 0.4c로 달리는 것을 보는 땅 기준틀에서도 빛은 출발 지점에서 양쪽으로 c로 퍼지지만, 뒤쪽 벽은 빛을 향해 다가오고 앞쪽 벽은 멀어지므로 뒤쪽 벽에 먼저 도착한다. 한 기준틀에서 동시인 두 사건이 다른 기준틀에서는 동시가 아니다.</desc>
  <style>
    .u12a-t{font-size:14px;fill:var(--fig-ink)} .u12a-tb{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .u12a-s{font-size:13px;fill:var(--fig-muted)} .u12a-sm{font-size:13px;fill:var(--fig-ink)}
    .u12a-ax{stroke:var(--fig-ink);stroke-width:1.5;fill:none} .u12a-grid{stroke:var(--fig-line);stroke-width:0.8;stroke-dasharray:3 4;fill:none}
  </style>
