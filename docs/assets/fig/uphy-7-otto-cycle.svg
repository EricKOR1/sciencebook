<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uphy-7-otto-cycle d-uphy-7-otto-cycle">
  <title id="t-uphy-7-otto-cycle">그림 일반물리학 7-8 오토 순환의 P–V 그림</title>
  <desc id="d-uphy-7-otto-cycle">1→2 단열 압축, 2→3 등적 가열(점화, 열 Q_H 흡수), 3→4 단열 팽창(일을 함), 4→1 등적 냉각(배기, 열 Q_C 방출). 닫힌 곡선이 둘러싼 넓이가 한 순환의 알짜 일이다. 보기 쉽도록 압축비 r = 4, γ = 1.40으로 그린 모식도이다.</desc>
