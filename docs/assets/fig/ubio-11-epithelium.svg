<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-ubio-11-epithelium d-ubio-11-epithelium">
  <title id="t-ubio-11-epithelium">그림 일반생명과학 11-1 상피 조직의 모양과 층수</title>
  <desc id="d-ubio-11-epithelium">상피 조직 네 가지의 단면 모식도. 모든 상피는 한쪽이 내강(바깥)을 향하고 반대쪽이 기저막에 붙어 있다. 단층 편평 상피는 납작한 세포 한 층으로 얇아 폐포와 모세혈관 벽에서 확산이 빠르다. 단층 입방 상피는 세뇨관 벽에서 분비와 흡수를 한다. 단층 원주 상피는 길쭉한 세포 위에 미세 융털이 있어 소장에서 흡수 표면을 넓힌다. 중층 편평 상피는 여러 층이 쌓여 피부와 식도에서 마찰을 견딘다.</desc>
