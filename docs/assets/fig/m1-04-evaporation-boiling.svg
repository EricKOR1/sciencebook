    .eb-ar{fill:none;stroke:var(--fig-red);stroke-width:1.5;stroke-linecap:round}
    .eb-ah{fill:var(--fig-red)}
    .eb-fl{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.6}
    .eb-fl2{fill:var(--fig-amber);stroke:none}
    .eb-st{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.5}
    .eb-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .eb-t{font-size:13.5px;fill:var(--fig-ink)}
    .eb-sm{font-size:13px;fill:var(--fig-muted)}
    .eb-ld{fill:none;stroke:var(--fig-line);stroke-width:1.2}
  </style>
