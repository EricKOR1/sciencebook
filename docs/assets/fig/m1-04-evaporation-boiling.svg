<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-m1-04-evaporation-boiling d-m1-04-evaporation-boiling">
  <title id="t-m1-04-evaporation-boiling">그림 중1-4-2 기화의 두 가지 방법: 증발과 끓음</title>
  <desc id="d-m1-04-evaporation-boiling">증발은 액체 표면의 입자가 어느 온도에서나 조금씩 기체가 되어 빠져나가는 것이고, 끓음은 특정한 온도에서 액체 내부에서도 기체가 생겨 기포(수증기)로 올라오는 것이다. 입자 크기와 개수는 모식적으로 나타냈다.</desc>
