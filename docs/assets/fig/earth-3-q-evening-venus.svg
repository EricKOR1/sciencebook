  <title id="t-earth-3-q-evening-venus">그림 지구과학 3-12 예제 2의 저녁 서쪽 하늘</title>
  <desc id="d-earth-3-q-evening-venus">해가 진 직후 서쪽 하늘을 바라본 모습이다. 왼쪽이 남쪽, 오른쪽이 북쪽이며, 지평선 위에 금성이 밝게 보인다. 오른쪽 위 원은 같은 때 망원경으로 본 금성의 모양이다. 고도와 크기는 모식적이다.</desc>
