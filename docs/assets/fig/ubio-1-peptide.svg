<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img" aria-labelledby="t-ubio-1-peptide d-ubio-1-peptide">
  <title id="t-ubio-1-peptide">그림 일반생명과학 1-8 아미노산의 구조와 펩타이드 결합</title>
  <desc id="d-ubio-1-peptide">왼쪽: 아미노산은 α 탄소에 아미노기(생리적 pH에서 –NH₃⁺), 카복실기(–COO⁻), 수소, 곁사슬 R이 붙어 있다. 오른쪽: 한 아미노산의 카복실기와 다음 아미노산의 아미노기가 물 1분자를 내놓으며 펩타이드 결합(–CO–NH–)을 만든다. 펩타이드 결합 주위 6개 원자(음영)는 한 평면에 고정되고, 사슬은 N 말단에서 C 말단 쪽으로 방향이 있다.</desc>
  <defs><marker id="ubio-1-peptide-a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-ink)"/></marker><marker id="ubio-1-peptide-a-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-muted)"/></marker><marker id="ubio-1-peptide-a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-blue)"/></marker><marker id="ubio-1-peptide-a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-red)"/></marker><marker id="ubio-1-peptide-a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-green)"/></marker><marker id="ubio-1-peptide-a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-amber)"/></marker><marker id="ubio-1-peptide-a-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-violet)"/></marker><marker id="ubio-1-peptide-a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-teal)"/></marker><marker id="ubio-1-peptide-a-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--fig-line)"/></marker></defs>
  <style>.ubio-1-peptide-t{font-size:14px;fill:var(--fig-ink)} .ubio-1-peptide-s{font-size:13px;fill:var(--fig-muted)} .ubio-1-peptide-b{font-size:15px;fill:var(--fig-ink);font-weight:700} .ubio-1-peptide-k{font-size:13px;fill:var(--fig-ink)} .ubio-1-peptide-ink{font-size:13px;fill:var(--fig-ink);font-weight:700} .ubio-1-peptide-muted{font-size:13px;fill:var(--fig-muted);font-weight:700} .ubio-1-peptide-blue{font-size:13px;fill:var(--fig-blue);font-weight:700} .ubio-1-peptide-red{font-size:13px;fill:var(--fig-red);font-weight:700} .ubio-1-peptide-green{font-size:13px;fill:var(--fig-green);font-weight:700} .ubio-1-peptide-amber{font-size:13px;fill:var(--fig-amber);font-weight:700} .ubio-1-peptide-violet{font-size:13px;fill:var(--fig-violet);font-weight:700} .ubio-1-peptide-teal{font-size:13px;fill:var(--fig-teal);font-weight:700} .ubio-1-peptide-line{font-size:13px;fill:var(--fig-line);font-weight:700}</style>
