  <text x="466.0" y="245.0" text-anchor="start" class="mco12-txt">분사 효과를 lbf·s로 넘김</text>
  <text x="466.0" y="271.0" text-anchor="start" class="mco12-lbl">항법 소프트웨어</text>
  <text x="466.0" y="290.0" text-anchor="start" class="mco12-txt">같은 숫자를 N·s로 읽음</text>
  <text x="466.0" y="316.0" text-anchor="start" class="mco12-lbl">결과</text>
  <text x="466.0" y="335.0" text-anchor="start" class="mco12-txt" style="fill:var(--fig-red)">분사 효과를 약 4.45분의 1로</text>
  <text x="466.0" y="361.0" text-anchor="start" class="mco12-txt" style="fill:var(--fig-red)">작게 계산 → 오차가 쌓여 낮게 접근</text>
