<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="t-1-2-mco-trajectory d-1-2-mco-trajectory">
  <title id="t-1-2-mco-trajectory">그림 1-2-4 화성 기후 궤도선: 계획한 경로와 실제 경로</title>
  <desc id="d-1-2-mco-trajectory">추력기 분사 효과를 단위 혼동으로 실제보다 작게 계산한 탓에 경로 오차가 쌓여, 탐사선은 계획보다 훨씬 낮은 고도(약 57 km)로 화성에 접근했고 대기에 부딪혀 파괴되었거나 궤도를 벗어난 것으로 추정된다. 모식도(대기의 두께와 고도 차이는 과장함).</desc>
