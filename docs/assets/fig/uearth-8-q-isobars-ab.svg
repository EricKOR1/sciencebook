<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" class="fig-small" role="img" aria-labelledby="t-uearth-8-q-isobars-ab d-uearth-8-q-isobars-ab">
  <title id="t-uearth-8-q-isobars-ab">그림 일반지구과학 8-14 문제 13의 등압선과 관측소 A, B</title>
  <desc id="d-uearth-8-q-isobars-ab">위도 37°의 지상 일기도에서 곧은 등압선(4 hPa 간격)과, 1020 hPa 등압선 위의 관측소 A와 1012 hPa 등압선 위의 관측소 B를 나타냈다. A와 B는 등압선에 수직 방향으로 400 km 떨어져 있다.</desc>
  <style>
    .uearth-8-q-isobars-ab-t{font-size:14px;fill:var(--fig-ink)}
    .uearth-8-q-isobars-ab-b{font-size:14px;font-weight:700;fill:var(--fig-ink)}
    .uearth-8-q-isobars-ab-s{font-size:13px;fill:var(--fig-muted)}
    .uearth-8-q-isobars-ab-h{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .uearth-8-q-isobars-ab-red{font-size:14px;font-weight:600;fill:var(--fig-red)}
    .uearth-8-q-isobars-ab-blue{font-size:14px;font-weight:600;fill:var(--fig-blue)}
    .uearth-8-q-isobars-ab-green{font-size:14px;font-weight:600;fill:var(--fig-green)}
    .uearth-8-q-isobars-ab-amber{font-size:14px;font-weight:600;fill:var(--fig-amber)}
    .uearth-8-q-isobars-ab-violet{font-size:14px;font-weight:600;fill:var(--fig-violet)}
    .uearth-8-q-isobars-ab-ax{fill:none;stroke:var(--fig-ink);stroke-width:1.4}
    .uearth-8-q-isobars-ab-grid{fill:none;stroke:var(--fig-line);stroke-width:0.7;stroke-dasharray:3 3}
  </style>
