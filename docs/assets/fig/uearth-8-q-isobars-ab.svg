  <text x="368.0" y="75.0" class="uearth-8-q-isobars-ab-t">1012 hPa</text>
  <line x1="30.0" y1="150.0" x2="360.0" y2="150.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="368.0" y="155.0" class="uearth-8-q-isobars-ab-t">1016 hPa</text>
  <line x1="30.0" y1="230.0" x2="360.0" y2="230.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="368.0" y="235.0" class="uearth-8-q-isobars-ab-t">1020 hPa</text>
  <circle cx="140" cy="230" r="6" style="fill:var(--fig-red);stroke:var(--fig-paper);stroke-width:1.5"/>
  <circle cx="140" cy="70" r="6" style="fill:var(--fig-blue);stroke:var(--fig-paper);stroke-width:1.5"/>
  <text x="152.0" y="250.0" class="uearth-8-q-isobars-ab-h">A</text>
  <text x="152.0" y="62.0" class="uearth-8-q-isobars-ab-h">B</text>
  <line x1="90.0" y1="150.0" x2="90.0" y2="83.0" style="fill:none;stroke:var(--fig-muted);stroke-width:1.5"/>
  <path d="M90.0,74.0 L94.0,83.0 L86.0,83.0 Z" style="fill:var(--fig-muted);stroke:none"/>
