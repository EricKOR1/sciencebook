<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-uchem-11-q-deposition-potential d-uchem-11-q-deposition-potential">
  <title id="t-uchem-11-q-deposition-potential">그림 일반화학 11-11 문제 16 해설: 석출이 시작되는 전위</title>
  <desc id="d-uchem-11-q-deposition-potential">환원 전극의 전위를 낮추면 0.74 V에서 은이 먼저 석출되기 시작하고, 0.31 V까지는 은만 석출된다. 0.31 V에서 구리가 석출되기 시작할 때 남은 [Ag⁺]는 약 5×10⁻⁹ M이다.</desc>
  <style>.uchem-11-q-deposition-potential-t{font-size:14px;fill:var(--fig-ink)} .uchem-11-q-deposition-potential-s{font-size:13px;fill:var(--fig-muted)} .uchem-11-q-deposition-potential-b{font-size:15px;font-weight:600;fill:var(--fig-ink)} .uchem-11-q-deposition-potential-x{font-size:13px;fill:var(--fig-ink)}</style>
  <rect x="0" y="0" width="720" height="330" style="fill:none;stroke:none"/>
  <line x1="230.0" y1="40.0" x2="230.0" y2="290.0" style="stroke:var(--fig-ink);stroke-width:1.8;stroke-linecap:round"/>
  <line x1="224.0" y1="290.0" x2="230.0" y2="290.0" style="stroke:var(--fig-ink);stroke-width:1.2;stroke-linecap:round"/>
  <text x="220.0" y="294.5" text-anchor="end" class="uchem-11-q-deposition-potential-s">0.2</text>
  <line x1="224.0" y1="251.5" x2="230.0" y2="251.5" style="stroke:var(--fig-ink);stroke-width:1.2;stroke-linecap:round"/>
  <text x="220.0" y="256.0" text-anchor="end" class="uchem-11-q-deposition-potential-s">0.3</text>
  <line x1="224.0" y1="213.1" x2="230.0" y2="213.1" style="stroke:var(--fig-ink);stroke-width:1.2;stroke-linecap:round"/>
  <text x="220.0" y="217.6" text-anchor="end" class="uchem-11-q-deposition-potential-s">0.4</text>
  <line x1="224.0" y1="174.6" x2="230.0" y2="174.6" style="stroke:var(--fig-ink);stroke-width:1.2;stroke-linecap:round"/>
  <text x="220.0" y="179.1" text-anchor="end" class="uchem-11-q-deposition-potential-s">0.5</text>
  <line x1="224.0" y1="136.2" x2="230.0" y2="136.2" style="stroke:var(--fig-ink);stroke-width:1.2;stroke-linecap:round"/>
  <text x="220.0" y="140.7" text-anchor="end" class="uchem-11-q-deposition-potential-s">0.6</text>
  <line x1="224.0" y1="97.7" x2="230.0" y2="97.7" style="stroke:var(--fig-ink);stroke-width:1.2;stroke-linecap:round"/>
  <text x="220.0" y="102.2" text-anchor="end" class="uchem-11-q-deposition-potential-s">0.7</text>
  <line x1="224.0" y1="59.2" x2="230.0" y2="59.2" style="stroke:var(--fig-ink);stroke-width:1.2;stroke-linecap:round"/>
  <text x="220.0" y="63.7" text-anchor="end" class="uchem-11-q-deposition-potential-s">0.8</text>
  <text x="230.0" y="26.0" text-anchor="middle" class="uchem-11-q-deposition-potential-t">환원 전극의 전위 E (V)</text>
  <rect x="242.0" y="82.0" width="176.0" height="165.5" rx="0" style="fill:var(--fig-soft-red);fill-opacity:0.6;stroke:none"/>
  <line x1="160.0" y1="66.9" x2="160.0" y2="255.9" style="stroke:var(--fig-muted);stroke-width:2;stroke-linecap:round"/>
  <polygon points="160.0,266.9 155.1,255.9 164.9,255.9" style="fill:var(--fig-muted);stroke:none"/>
  <text x="148.0" y="166.9" text-anchor="end" class="uchem-11-q-deposition-potential-s">전위를</text>
  <text x="148.0" y="184.9" text-anchor="end" class="uchem-11-q-deposition-potential-s">낮춘다</text>
  <line x1="230.0" y1="59.2" x2="270.0" y2="59.2" style="stroke:var(--fig-red);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:4 3"/>
  <text x="276.0" y="63.2" class="uchem-11-q-deposition-potential-s">E°(Ag⁺/Ag) = 0.80</text>
  <line x1="230.0" y1="236.2" x2="270.0" y2="236.2" style="stroke:var(--fig-blue);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:4 3"/>
  <text x="276.0" y="233.2" class="uchem-11-q-deposition-potential-s">E°(Cu²⁺/Cu) = 0.34</text>
  <circle cx="230.0" cy="82.0" r="6" style="fill:var(--fig-red);stroke:none"/>
  <text x="450.0" y="87.0" class="uchem-11-q-deposition-potential-x" style="fill:var(--fig-red)">0.74 V: 은 석출 시작 ([Ag⁺] = 0.10 M)</text>
  <circle cx="230.0" cy="247.5" r="6" style="fill:var(--fig-blue);stroke:none"/>
  <text x="450.0" y="252.5" class="uchem-11-q-deposition-potential-x" style="fill:var(--fig-blue)">0.31 V: 구리 석출 시작 ([Cu²⁺] = 0.10 M)</text>
  <line x1="430.0" y1="82.0" x2="444.0" y2="82.0" style="stroke:var(--fig-red);stroke-width:1.5;stroke-linecap:round"/>
  <line x1="430.0" y1="247.5" x2="444.0" y2="247.5" style="stroke:var(--fig-blue);stroke-width:1.5;stroke-linecap:round"/>
  <text x="330.0" y="158.0" text-anchor="middle" class="uchem-11-q-deposition-potential-t">은만 석출되는 구간</text>
  <text x="330.0" y="178.0" text-anchor="middle" class="uchem-11-q-deposition-potential-s">[Ag⁺]: 0.10 M → 5×10⁻⁹ M</text>
  <text x="450.0" y="273.5" class="uchem-11-q-deposition-potential-s">이때 남은 [Ag⁺] ≈ 5×10⁻⁹ M</text>
</svg>
