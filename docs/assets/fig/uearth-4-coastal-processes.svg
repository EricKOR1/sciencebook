<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 468" role="img" aria-labelledby="t-uearth-4-coastal-processes d-uearth-4-coastal-processes">
<title id="t-uearth-4-coastal-processes">그림 일반지구과학 4-10 파랑의 굴절과 연안 표류</title>
<desc id="d-uearth-4-coastal-processes">(가) 해안으로 다가오는 파랑의 마루(파란 선)는 얕은 곳부터 느려져 해안선과 나란해지도록 꺾이므로, 마루에 수직한 파향선(점선)이 곶으로 모여 에너지가 집중되고 만에서는 흩어진다. (나) 비스듬히 부서지는 파랑에 실린 모래는 지그재그로 해안을 따라 이동하고(연안 표류), 돌제의 상류 쪽에는 모래가 쌓이고 하류 쪽은 깎이며, 해안 끝에서는 사취가 바다 쪽으로 뻗는다. 모식도이다.</desc>
