<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 395" role="img" aria-labelledby="t-uphy-12-hydrogen-levels d-uphy-12-hydrogen-levels">
  <title id="t-uphy-12-hydrogen-levels">그림 일반물리학 12-9 수소 원자의 에너지 준위와 스펙트럼 계열</title>
  <desc id="d-uphy-12-hydrogen-levels">수소 원자의 에너지 준위 E_n = −13.6 eV/n²을 실제 비율로 그렸다. n이 커질수록 준위 사이가 좁아져 0 eV(n = ∞, 이온화)로 모인다. n = 1로 내려오는 전이가 라이먼 계열(자외선, 예: 2 → 1은 10.2 eV, 122 nm), n = 2로 내려오는 전이가 발머 계열(가시광선 포함, 예: 3 → 2는 656 nm), n = 3으로 내려오는 전이가 파셴 계열(적외선)이다. 각 준위의 상태 수는 스핀까지 2n²이다.</desc>
  <style>
    .u12h-t{font-size:14px;fill:var(--fig-ink)} .u12h-b{font-size:14px;font-weight:600;fill:var(--fig-ink)}
    .u12h-s{font-size:13px;fill:var(--fig-muted)} .u12h-sm{font-size:13px;fill:var(--fig-ink)}
    .u12h-h{font-size:15px;font-weight:600;fill:var(--fig-ink)}
  </style>
