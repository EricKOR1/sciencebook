<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="t-uphy-3-potential-force d-uphy-3-potential-force">
  <title id="t-uphy-3-potential-force">그림 일반물리학 3-2 이중 우물 퍼텐셜 에너지와 힘</title>
  <desc id="d-uphy-3-potential-force">예제 5의 U(x) = 2x⁴ − 4x²(위)와 힘 F = −dU/dx = −8x³ + 8x(아래)를 같은 x축에 맞추어 그렸다. 힘은 U의 기울기의 반대이므로 내리막 쪽을 향하고, 평형점 x = 0, ±1 m에서 힘이 0이다. E = −1.00 J이면 입자는 0.541 m와 1.31 m(또는 그 거울상) 사이에 갇히고, E = +1.00 J이면 −1.49 m와 1.49 m 사이를 왕복한다.</desc>
