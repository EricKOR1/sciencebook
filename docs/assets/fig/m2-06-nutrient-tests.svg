  <title id="t-m2-06-nutrient-tests">그림 중2-6-4 영양소 검출 반응의 색 변화</title>
  <desc id="d-m2-06-nutrient-tests">녹말은 아이오딘-아이오딘화 칼륨 용액으로 청람색, 포도당은 베네딕트 용액을 넣고 가열하면 황적색, 단백질은 뷰렛 반응으로 보라색, 지방은 수단 Ⅲ 용액으로 선홍색이 된다. 왼쪽 시험관은 용액을 넣은 직후, 오른쪽은 반응 뒤의 색이다.</desc>
