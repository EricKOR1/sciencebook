  <title id="t-ubio-2-q-fluidity">그림 일반생명과학 2-15 문제 18 해설 15 °C로 옮긴 세균의 포도당 흡수 속도 변화(예상)</title>
  <desc id="d-ubio-2-q-fluidity">37 °C에서 기른 세균을 15 °C로 옮긴 직후 15 °C에서 잰 흡수 속도는 약 25로 낮지만, 막의 불포화 지방산 비율이 점차 높아지며 몇 시간에 걸쳐 15 °C 배양균의 값(80) 가까이로 올라가 평평해진다. 회복에 걸리는 시간은 가정한 모식 그래프이다.</desc>
