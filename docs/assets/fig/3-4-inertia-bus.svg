<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-3-4-inertia-bus d-3-4-inertia-bus">
  <title id="t-3-4-inertia-bus">그림 3-4-2 버스가 갑자기 출발하거나 멈출 때 승객이 쏠리는 방향</title>
  <desc id="d-3-4-inertia-bus">버스가 갑자기 출발하면 승객의 몸은 정지 상태를 유지하려 해 뒤로 쏠리고, 갑자기 멈추면 앞으로 가던 운동을 유지하려 해 앞으로 쏠린다. 점선은 원래 서 있던 자세이다. 모식도.</desc>
  <style>
    .3-4-inertia-bus-lbl{font-size:15px;fill:var(--fig-ink)} .3-4-inertia-bus-b{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .3-4-inertia-bus-sm{font-size:13px;fill:var(--fig-muted)} .3-4-inertia-bus-ink{font-size:13px;fill:var(--fig-ink)}
    .3-4-inertia-bus-ax{stroke:var(--fig-ink);stroke-width:1.5;fill:none} .3-4-inertia-bus-grid{stroke:var(--fig-line);stroke-width:1;stroke-dasharray:3 4;fill:none}
  </style>
<line x1="360" y1="14" x2="360" y2="316" style="stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4"/><text x="180" y="28" text-anchor="middle" class="3-4-inertia-bus-b">① 갑자기 출발할 때</text><line x1="70.0" y1="58.0" x2="189.0" y2="58.0" style="stroke:var(--fig-blue);stroke-width:3;fill:none"/><path d="M200.0 58.0 L189.0 64.0 L189.0 52.0 Z" style="fill:var(--fig-blue)"/><text x="210" y="63" class="3-4-inertia-bus-ink">버스의 운동 방향</text><line x1="70.0" y1="84.0" x2="189.0" y2="84.0" style="stroke:var(--fig-green);stroke-width:3;fill:none"/><path d="M200.0 84.0 L189.0 90.0 L189.0 78.0 Z" style="fill:var(--fig-green)"/><text x="210" y="89" class="3-4-inertia-bus-ink">속도가 커진다</text><rect x="30" y="104" width="300" height="130" rx="14" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2.5"/><rect x="44" y="116" width="56" height="34" rx="4" style="fill:var(--fig-panel);stroke:var(--fig-blue);stroke-width:1.5"/><rect x="106" y="116" width="56" height="34" rx="4" style="fill:var(--fig-panel);stroke:var(--fig-blue);stroke-width:1.5"/><rect x="246" y="116" width="56" height="34" rx="4" style="fill:var(--fig-panel);stroke:var(--fig-blue);stroke-width:1.5"/><line x1="38" y1="216" x2="322" y2="216" style="stroke:var(--fig-blue);stroke-width:2"/><circle cx="90" cy="236" r="17" style="fill:var(--fig-ink)"/><circle cx="90" cy="236" r="7" style="fill:var(--fig-paper)"/><circle cx="272" cy="236" r="17" style="fill:var(--fig-ink)"/><circle cx="272" cy="236" r="7" style="fill:var(--fig-paper)"/><line x1="10" y1="254" x2="350" y2="254" style="stroke:var(--fig-line);stroke-width:2"/><g transform="rotate(0 188 216)"><path d="M178 216 L188 182 L198 216 M188 182 L188 146 M172 168 L188 154 L204 168" style="stroke:var(--fig-line);stroke-width:2;stroke-dasharray:4 3;fill:none"/><circle cx="188" cy="134" r="11" style="fill:none;stroke:var(--fig-line);stroke-width:2;stroke-dasharray:4 3"/></g><g transform="rotate(-16 188 216)"><path d="M178 216 L188 182 L198 216 M188 182 L188 146 M172 168 L188 154 L204 168" style="stroke:var(--fig-ink);stroke-width:3;fill:none;stroke-linecap:round"/><circle cx="188" cy="134" r="11" style="fill:var(--fig-soft-amber);stroke:var(--fig-ink);stroke-width:2.5"/></g><text x="180" y="280" text-anchor="middle" class="3-4-inertia-bus-sm">버스는 앞으로 나가는데 몸은 정지 상태를</text><text x="180" y="299" text-anchor="middle" class="3-4-inertia-bus-sm">유지하려 한다 → 뒤로 쏠린다</text><text x="540" y="28" text-anchor="middle" class="3-4-inertia-bus-b">② 갑자기 멈출 때</text><line x1="430.0" y1="58.0" x2="549.0" y2="58.0" style="stroke:var(--fig-blue);stroke-width:3;fill:none"/><path d="M560.0 58.0 L549.0 64.0 L549.0 52.0 Z" style="fill:var(--fig-blue)"/><text x="570" y="63" class="3-4-inertia-bus-ink">버스의 운동 방향</text><line x1="560.0" y1="84.0" x2="441.0" y2="84.0" style="stroke:var(--fig-red);stroke-width:3;fill:none"/><path d="M430.0 84.0 L441.0 78.0 L441.0 90.0 Z" style="fill:var(--fig-red)"/><text x="570" y="89" class="3-4-inertia-bus-ink">속도가 줄어든다(제동)</text><rect x="390" y="104" width="300" height="130" rx="14" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2.5"/><rect x="404" y="116" width="56" height="34" rx="4" style="fill:var(--fig-panel);stroke:var(--fig-blue);stroke-width:1.5"/><rect x="466" y="116" width="56" height="34" rx="4" style="fill:var(--fig-panel);stroke:var(--fig-blue);stroke-width:1.5"/><rect x="606" y="116" width="56" height="34" rx="4" style="fill:var(--fig-panel);stroke:var(--fig-blue);stroke-width:1.5"/><line x1="398" y1="216" x2="682" y2="216" style="stroke:var(--fig-blue);stroke-width:2"/><circle cx="450" cy="236" r="17" style="fill:var(--fig-ink)"/><circle cx="450" cy="236" r="7" style="fill:var(--fig-paper)"/><circle cx="632" cy="236" r="17" style="fill:var(--fig-ink)"/><circle cx="632" cy="236" r="7" style="fill:var(--fig-paper)"/><line x1="370" y1="254" x2="710" y2="254" style="stroke:var(--fig-line);stroke-width:2"/><g transform="rotate(0 548 216)"><path d="M538 216 L548 182 L558 216 M548 182 L548 146 M532 168 L548 154 L564 168" style="stroke:var(--fig-line);stroke-width:2;stroke-dasharray:4 3;fill:none"/><circle cx="548" cy="134" r="11" style="fill:none;stroke:var(--fig-line);stroke-width:2;stroke-dasharray:4 3"/></g><g transform="rotate(16 548 216)"><path d="M538 216 L548 182 L558 216 M548 182 L548 146 M532 168 L548 154 L564 168" style="stroke:var(--fig-ink);stroke-width:3;fill:none;stroke-linecap:round"/><circle cx="548" cy="134" r="11" style="fill:var(--fig-soft-amber);stroke:var(--fig-ink);stroke-width:2.5"/></g><text x="540" y="280" text-anchor="middle" class="3-4-inertia-bus-sm">버스는 멈추는데 몸은 앞으로 가던 운동을</text><text x="540" y="299" text-anchor="middle" class="3-4-inertia-bus-sm">유지하려 한다 → 앞으로 쏠린다</text></svg>
