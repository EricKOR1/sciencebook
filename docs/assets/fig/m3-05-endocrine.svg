<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="t-m3-05-endocrine d-m3-05-endocrine">
  <title id="t-m3-05-endocrine">그림 중3-5-10 내분비샘의 위치와 호르몬이 전달되는 방법</title>
  <desc id="d-m3-05-endocrine">왼쪽은 몸에서 뇌하수체(성장호르몬), 갑상샘(티록신), 이자(인슐린·글루카곤)의 위치를 나타낸 모식도이다. 오른쪽 위는 관을 통해 분비하는 외분비샘과 관 없이 혈액으로 분비하는 내분비샘의 비교이고, 오른쪽 아래는 혈액을 따라 온몸을 도는 호르몬이 그 호르몬을 받아들일 수 있는 표적 세포에만 작용하는 모습이다.</desc>
  <style>
    .m3-05-endocrine-l{font-size:14px;fill:var(--fig-ink);font-weight:600} .m3-05-endocrine-t{font-size:14px;fill:var(--fig-ink)}
    .m3-05-endocrine-s{font-size:13px;fill:var(--fig-muted)} .m3-05-endocrine-h{font-size:15px;fill:var(--fig-ink);font-weight:700}
    .m3-05-endocrine-ld{stroke:var(--fig-muted);stroke-width:1;fill:none}

  </style>
