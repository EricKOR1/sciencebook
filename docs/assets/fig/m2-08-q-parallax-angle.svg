  <desc id="d-m2-08-q-parallax-angle">지구가 공전 궤도의 양 끝에 있을 때(6개월 간격) 같은 별을 바라본 두 방향과, 두 방향 사이의 각도(시차) 0.6″를 나타냈다. 각도를 실제보다 매우 크게 그린 모식도이다.</desc>
  <style>.m2-08-q-parallax-angle-t{font-size:14px;fill:var(--fig-ink)} .m2-08-q-parallax-angle-s{font-size:13px;fill:var(--fig-muted)} .m2-08-q-parallax-angle-h{font-size:15px;fill:var(--fig-ink);font-weight:700} .m2-08-q-parallax-angle-ln{stroke:var(--fig-ink);stroke-width:2;fill:none} .m2-08-q-parallax-angle-th{stroke:var(--fig-muted);stroke-width:1;fill:none} </style>
