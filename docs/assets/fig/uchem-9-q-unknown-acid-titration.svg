  <title id="t-uchem-9-q-unknown-acid-titration">그림 일반화학 9-10 문제 14의 적정 곡선과 두 지시약</title>
  <desc id="d-uchem-9-q-unknown-acid-titration">약산(3.20 mmol, Kₐ = 6.6×10⁻⁵) 50.0 mL를 0.100 M NaOH로 적정한 곡선을 전하 균형으로 계산했다. 반당량점 16.0 mL에서 pH 4.18, 당량점 32.0 mL에서 pH 8.39이다. 페놀프탈레인의 변색 범위(8.2~10.0)는 당량점의 수직 구간 안에 있지만, 메틸 레드(4.4~6.2)는 완충 구간인 약 20~32 mL에 걸쳐 서서히 변색한다.</desc>
