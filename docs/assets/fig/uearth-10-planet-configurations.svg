<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" role="img" aria-labelledby="t-uearth-10-planet-configurations d-uearth-10-planet-configurations">
  <title id="t-uearth-10-planet-configurations">그림 일반지구과학 10-6 내행성과 외행성의 위치 관계</title>
  <desc id="d-uearth-10-planet-configurations">북쪽에서 내려다본 태양계로, 행성은 모두 시계 반대 방향으로 공전한다. 왼쪽: 내행성은 내합(태양과 지구 사이)과 외합(태양 너머)을 지나며, 지구에서 그은 접선이 궤도에 닿는 곳에서 태양과 가장 멀리 떨어져 보인다(최대 이각, 금성은 약 46°). 태양의 동쪽에 있는 최대 동방 이각에서는 저녁 서쪽 하늘에, 최대 서방 이각에서는 새벽 동쪽 하늘에 보인다. 오른쪽: 외행성은 합(태양 너머), 충(태양 반대편, 밤새 보임), 동구·서구(태양과 90°)를 지난다. 역행은 내행성은 내합 부근, 외행성은 충 부근에서 일어난다. 궤도 크기의 비는 금성·화성과 비슷하게 잡은 모식도.</desc>
