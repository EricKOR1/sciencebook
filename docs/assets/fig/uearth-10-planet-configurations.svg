    .uearth-10-planet-configurations-t{font-size:13px;fill:var(--fig-ink)}
    .uearth-10-planet-configurations-s{font-size:13px;fill:var(--fig-muted)}
    .uearth-10-planet-configurations-n{font-size:12px;fill:var(--fig-muted)}
    .uearth-10-planet-configurations-b{font-size:13px;font-weight:600;fill:var(--fig-ink)}
    .uearth-10-planet-configurations-o{paint-order:stroke;stroke:var(--fig-paper);stroke-width:4px;stroke-linejoin:round}
  </style>
