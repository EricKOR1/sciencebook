<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="t-ubio-12-eye d-ubio-12-eye">
  <title id="t-ubio-12-eye">그림 일반생명과학 12-9 눈과 망막의 구조, 막대 세포의 어둠·빛 상태</title>
  <desc id="d-ubio-12-eye">왼쪽: 각막과 수정체가 빛을 모아 망막의 중심오목에 상을 맺고, 시각 신경이 나가는 맹점에는 광수용기가 없다. 가운데: 망막의 층. 빛은 신경절 세포와 쌍극 세포 층을 지나 가장 안쪽의 막대·원뿔 세포에 닿고, 신호는 반대 방향으로 쌍극 세포→신경절 세포→시각 신경으로 간다. 오른쪽: 막대 세포는 어둠에서 cGMP 개폐 Na⁺ 통로가 열려 탈분극(약 −40 mV)된 채 글루탐산을 분비하고, 빛을 받으면 통로가 닫혀 과분극(약 −70 mV)되며 분비가 줄어든다. 모식도이다.</desc>
