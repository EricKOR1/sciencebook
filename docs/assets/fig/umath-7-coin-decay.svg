<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t-umath-7-coin-decay d-umath-7-coin-decay">
  <title id="t-umath-7-coin-decay">그림 수학 도구 7-11 동전 붕괴 모의 실험의 정리 예시</title>
  <desc id="d-umath-7-coin-decay">활동 A 결과 정리의 예시. 왼쪽은 회차 n에 따른 남은 동전 수의 평균(점)과 ± 표준 편차(막대), 이론 곡선 100 × (1/2)ⁿ이다. 오른쪽은 같은 자료의 ln N̄–n 그래프와 기울기 −0.693 직선으로, ln N̄의 불확도 s/N̄가 뒤 회차로 갈수록 커진다. 수치는 난수로 만든 예시이다.</desc>
