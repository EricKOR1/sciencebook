<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-bio-1-energy-matter d-bio-1-energy-matter">
  <title id="t-bio-1-energy-matter">그림 생명과학 1-4 에너지의 흐름과 탄소의 순환</title>
  <desc id="d-bio-1-energy-matter">(가) 빛에너지가 생산자의 화학 에너지가 된 뒤 먹이 사슬을 따라 약 10%씩 다음 단계로 전달되고, 각 단계와 분해자에서 호흡으로 열이 되어 빠져나간다(에너지 값은 예시 상대값). (나) 탄소는 광합성으로 생산자에 고정되어 먹이 사슬을 따라 이동하고, 호흡·분해·연소로 다시 CO₂가 되어 순환한다. 모식도.</desc>
