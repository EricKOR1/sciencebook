<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-ubio-1-protein d-ubio-1-protein">
  <title id="t-ubio-1-protein">그림 일반생명과학 1-7 단백질 구조의 네 단계</title>
  <desc id="d-ubio-1-protein">1차 구조는 펩타이드 결합으로 이어진 아미노산 순서(소수성은 주황, 양전하는 파랑, 음전하는 빨강), 2차 구조는 주사슬 수소 결합(점선)이 만든 α 나선과 β 병풍, 3차 구조는 소수성 곁사슬이 안쪽에 모인 사슬 하나의 접힌 모양과 염다리·이황화 결합, 4차 구조는 헤모글로빈처럼 소단위 여러 개가 조립된 모양이다. 모식도이다.</desc>
