<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" role="img" aria-labelledby="t-m2-07-field-shapes d-m2-07-field-shapes">
  <title id="t-m2-07-field-shapes">그림 중2-7-6 막대자석과 곧은 도선 주위의 자기장</title>
  <desc id="d-m2-07-field-shapes">막대자석 주위의 자기력선은 N극에서 나와 S극으로 들어가며, 양 극 근처에서 촘촘하다. 곧은 도선에 전류가 흐르면 도선을 중심으로 동심원 모양의 자기장이 생기고, 오른손 엄지를 전류 방향으로 하면 네 손가락이 감기는 방향이 자기장의 방향이다.</desc>
  <style>.m2-07-field-shapes-t{font-size:14px;fill:var(--fig-ink)} .m2-07-field-shapes-b{font-size:14px;font-weight:600;fill:var(--fig-ink)} .m2-07-field-shapes-s{font-size:13px;fill:var(--fig-muted)} .m2-07-field-shapes-hd{font-size:15px;font-weight:700;fill:var(--fig-ink)} </style>
  <text x="180.0" y="26.0" text-anchor="middle" class="m2-07-field-shapes-hd">(가) 막대자석</text>
  <text x="540.0" y="26.0" text-anchor="middle" class="m2-07-field-shapes-hd">(나) 전류가 흐르는 곧은 도선</text>
