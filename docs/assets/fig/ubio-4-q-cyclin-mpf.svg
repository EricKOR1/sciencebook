<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-ubio-4-q-cyclin-mpf d-ubio-4-q-cyclin-mpf">
  <title id="t-ubio-4-q-cyclin-mpf">그림 일반생명과학 4-10 문제 5 해설: 사이클린, Cdk, MPF 활성의 변화</title>
  <desc id="d-ubio-4-q-cyclin-mpf">세포 주기 두 번 동안의 모식도. 사이클린 B의 양은 간기 동안 늘다가 M기 중에 분해되어 급히 줄고, Cdk1의 양은 거의 일정하다. MPF(사이클린 B–Cdk1) 활성은 G₂기 말에 급히 커져 M기에 최대가 되었다가 사이클린 B가 분해되면 꺼진다.</desc>
