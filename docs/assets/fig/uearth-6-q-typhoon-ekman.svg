<title id="t-uearth-6-q-typhoon-ekman">그림 일반지구과학 6-14 문제 13의 태풍 바람과 에크만 수송(위에서 본 모습)</title>
<desc id="d-uearth-6-q-typhoon-ekman">북위 20°의 바다에서 반지름 100 km 안의 바람(빨강)이 저기압성, 곧 시계 반대 방향으로 돈다. 원 둘레 어디에서나 에크만 수송(파랑)은 원 바깥쪽으로 일어난다고 가정한다. 화살표 길이는 크기와 무관하다.</desc>
