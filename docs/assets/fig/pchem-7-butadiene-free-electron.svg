<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" class="fig-small" role="img" aria-labelledby="t-pchem-7-butadiene-free-electron d-pchem-7-butadiene-free-electron">
  <title id="t-pchem-7-butadiene-free-electron">그림 물리화학 7-10 1,3-뷰타다이엔의 자유 전자 모형</title>
  <desc id="d-pchem-7-butadiene-free-electron">탄소 네 개를 결합 길이 0.140 nm인 일직선 사슬로 펴고, 양 끝에 결합 길이의 절반씩을 더한 L = 4 × 0.140 = 0.560 nm의 상자에 π 전자 4개를 넣는다. 준위 n = 1, 2에 전자가 두 개씩 채워지고, HOMO(n = 2) → LUMO(n = 3) 전이 에너지는 ΔE = 5h²/8mL²로 λ ≈ 207 nm이다. 준위 높이는 1 : 4 : 9 : 16이다.</desc>
