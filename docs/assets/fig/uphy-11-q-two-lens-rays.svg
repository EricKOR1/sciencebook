  <title id="t-uphy-11-q-two-lens-rays">그림 일반물리학 11-9 문제 6 풀이의 두 렌즈 광선 작도</title>
  <desc id="d-uphy-11-q-two-lens-rays">초점 거리 10 cm인 볼록렌즈 L₁과 L₂가 50 cm 떨어져 있고, 물체는 L₁ 앞 15 cm에 있다. L₁은 뒤 30 cm에 거꾸로 선 2배 실상(첫 상)을 만들고, 이 첫 상이 L₂ 앞 20 cm의 물체가 되어 L₂ 뒤 20 cm에 다시 뒤집힌 최종 상을 만든다. 최종 상은 처음 물체보다 2배 크고 똑바로 서 있다. 가로 축척은 7 px = 1 cm이고 높이는 과장했다.</desc>
