<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="t-ochem-2-ring-flip-energy d-ochem-2-ring-flip-energy">
  <title id="t-ochem-2-ring-flip-energy">그림 유기화학 2-14 사이클로헥세인 고리 뒤집힘의 퍼텐셜 에너지 도표</title>
  <desc id="d-ochem-2-ring-flip-energy">가로축은 반응 좌표(고리 뒤집힘), 세로축은 의자 형태 기준 에너지(kJ/mol). 의자(0) → 반의자(45, 극대) → 뒤틀린 보트(23, 극소) → 보트(29, 작은 극대) → 뒤틀린 보트(23) → 반의자(45) → 뒤집힌 의자(0). 각 점 옆의 작은 그림은 그 형태의 모식도이다. 보트의 두 깃대 수소(붉은색)는 약 183 pm까지 가까워지고, 보트의 C2–C3 결합을 따라 보면 C–H가 가려 있다(작은 뉴먼 투영식). 곡선 모양은 모식도이다.</desc>
