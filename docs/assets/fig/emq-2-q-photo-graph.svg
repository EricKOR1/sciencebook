  <title id="t-emq-2-q-photo-graph">그림 전자기와 양자 2-11 문제 15 풀이의 최대 운동 에너지–진동수 그래프</title>
  <desc id="d-emq-2-q-photo-graph">두 측정값(350 nm: 진동수 8.6×10¹⁴ Hz, 1.24 eV / 450 nm: 6.7×10¹⁴ Hz, 0.46 eV)을 잇는 직선의 기울기는 약 4.1×10⁻¹⁵ eV·s로 플랑크 상수와 같다. 직선이 가로축과 만나는 문턱 진동수는 약 5.5×10¹⁴ Hz(문턱 파장 약 540 nm)이고, 세로축 절편은 약 −2.3 eV(= −일함수)이다. 600 nm 빛(5.0×10¹⁴ Hz)은 문턱 진동수보다 진동수가 작다.</desc>
