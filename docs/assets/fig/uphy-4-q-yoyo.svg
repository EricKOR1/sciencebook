<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" class="fig-small" role="img" aria-labelledby="t-uphy-4-q-yoyo d-uphy-4-q-yoyo">
  <title id="t-uphy-4-q-yoyo">그림 일반물리학 4-12 문제 6의 요요</title>
  <desc id="d-uphy-4-q-yoyo">줄 끝을 손에 쥔 채 요요를 가만히 놓는다. 줄은 요요(속이 찬 원판으로 본다) 바깥 둘레에 감겨 있고 연직으로 풀린다.</desc>
  <style>.cuphy4qyoyo-t{font-size:14px;fill:var(--fig-ink)} .cuphy4qyoyo-s{font-size:13px;fill:var(--fig-muted)} .cuphy4qyoyo-b{font-size:15px;font-weight:700;fill:var(--fig-ink)} .cuphy4qyoyo-i{font-size:15px;font-style:italic;fill:var(--fig-ink)} .cuphy4qyoyo-ax{stroke:var(--fig-ink);stroke-width:1.4;fill:none} .cuphy4qyoyo-grid{stroke:var(--fig-line);stroke-width:0.7;fill:none}</style>
  <rect x="220.0" y="26.0" width="52.0" height="26.0" rx="10" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.8"/>
  <text x="280.0" y="44.0" class="cuphy4qyoyo-t">손</text>
  <line x1="246.0" y1="52.0" x2="246.0" y2="190.0" style="fill:none;stroke:var(--fig-ink);stroke-width:2;stroke-linecap:round"/>
  <circle cx="200.0" cy="190.0" r="46.0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:2.5"/>
  <circle cx="200.0" cy="190.0" r="30.0" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.2"/>
  <circle cx="200.0" cy="190.0" r="4.0" style="fill:var(--fig-blue);stroke:none"/>
  <text x="256.0" y="120.0" class="cuphy4qyoyo-s">줄(연직)</text>
  <text x="142.0" y="195.0" text-anchor="end" class="cuphy4qyoyo-t">요요 0.20 kg</text>
  <text x="200.0" y="258.0" text-anchor="middle" class="cuphy4qyoyo-s">바깥 둘레에 감긴 줄이 풀린다</text>
</svg>
