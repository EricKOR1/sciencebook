<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t-pchem-2-q-four-expansions d-pchem-2-q-four-expansions">
  <title id="t-pchem-2-q-four-expansions">그림 물리화학 2-18 문제 14의 네 가지 팽창 과정</title>
  <desc id="d-pchem-2-q-four-expansions">처음 상태 i(400 K, 2.00 bar, 16.6 L)에서 1.00 bar까지의 네 과정. (가) 400 K 등온선을 따라 f(33.3 L)까지 가는 가역 등온 팽창(실선), (라) 400 K에서 일정한 외부 압력 1.00 bar에 맞선 등온 팽창(계단 모양 점선은 외부 압력을 나타낸 것일 뿐 실제 경로가 아니다). (나) 자유 팽창과 (다) 가역 단열 팽창은 나중 압력이 1.00 bar라는 것만 주어지며, 나중 상태가 1.00 bar 선 위의 어느 점인지는 그리지 않았다(문제에서 구한다).</desc>
