  <title id="t-pchem-2-q-four-expansions">그림 물리화학 2-18 문제 14의 네 가지 팽창 과정</title>
  <desc id="d-pchem-2-q-four-expansions">처음 상태 i(400 K, 2.00 bar, 16.6 L)에서 1.00 bar까지의 네 과정. (가) 400 K 등온선을 따라 f1(33.3 L)까지 가는 가역 등온 팽창(실선), (나) i에서 f1으로의 자유 팽창(경로가 없으므로 두 점만 점선 화살표로 이음), (다) 가역 단열선을 따라 1.00 bar의 f3까지(실선, f3의 온도는 문제에서 구함), (라) 일정한 외부 압력 1.00 bar에 맞선 팽창. (라)의 계단 모양 점선은 외부 압력을 나타낸 것일 뿐 실제 경로가 아니다.</desc>
