<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t-chem-2-q-h2o-of2-dipoles d-chem-2-q-h2o-of2-dipoles">
  <title id="t-chem-2-q-h2o-of2-dipoles">그림 화학 2-10 문제 11 해설 — 물과 플루오린화 산소의 결합 쌍극자와 분자 쌍극자</title>
  <desc id="d-chem-2-q-h2o-of2-dipoles">두 분자는 모두 굽은형이다. 물에서는 O가 δ−라 두 결합의 쌍극자(H → O)를 더한 분자 쌍극자가 O 쪽을 향하고, 플루오린화 산소에서는 O가 δ+라 결합의 쌍극자(O → F)와 분자 쌍극자가 두 F 쪽, 곧 O의 반대쪽을 향한다. 화살표 길이는 모식적이다.</desc>
