    .c2qdp-ink{fill:var(--fig-ink)} .c2qdp-mut{fill:var(--fig-muted)}
    .c2qdp-lbl{font-size:14px;fill:var(--fig-ink)} .c2qdp-b{font-size:15px;font-weight:600;fill:var(--fig-ink)} .c2qdp-sm{font-size:13px;fill:var(--fig-muted)}
    .c2qdp-H{fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.2} .c2qdp-O{fill:var(--fig-red);stroke:var(--fig-red);stroke-width:1} .c2qdp-C{fill:var(--fig-ink);stroke:var(--fig-ink);stroke-width:1} .c2qdp-N{fill:var(--fig-blue);stroke:var(--fig-blue);stroke-width:1}
    .c2qdp-at{font-size:13px;font-weight:600} .c2qdp-atH{font-size:11px;font-weight:600;fill:var(--fig-ink)}
    .c2qdp-box{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2}
    .c2qdp-sym{font-size:22px;font-weight:600;fill:var(--fig-ink)} .c2qdp-sh{fill:var(--fig-blue)} .c2qdp-lp{fill:var(--fig-violet)}
  </style>
  <style>.c2qdp-F{fill:var(--fig-green);stroke:var(--fig-green);stroke-width:1}</style>
