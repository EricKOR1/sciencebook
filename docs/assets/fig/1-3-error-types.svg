  <title id="t-1-3-error-types">그림 1-3-3 우연 오차와 계통 오차</title>
  <desc id="d-1-3-error-types">질량이 58.4 kg인 사람이 같은 체중계에 다섯 번 올라섰을 때의 측정값을 점으로 나타냈다. 우연 오차만 있으면 값이 참값 양쪽으로 흩어져 평균이 참값에 가깝지만, 영점이 0.3 kg 어긋난 체중계(계통 오차)는 값이 한쪽으로 몰려 평균을 내도 치우침이 남는다. 측정값은 설명을 위해 만든 값이다.</desc>
