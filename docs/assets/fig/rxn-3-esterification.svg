  <text x="156.0" y="105.5" text-anchor="middle" class="rxn-3-esterification-b" style="fill:var(--fig-red);font-weight:700">O</text>
  <line x1="166.0" y1="100.0" x2="182.0" y2="100.0" style="stroke:var(--fig-ink);stroke-width:2"/>
