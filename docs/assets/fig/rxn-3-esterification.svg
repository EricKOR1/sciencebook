    .rxn-3-esterification-T{font-size:15px;fill:var(--fig-ink);font-weight:700}
    .rxn-3-esterification-f{font-size:14px;fill:var(--fig-ink);font-weight:600}
    .rxn-3-esterification-k{font-size:13px;fill:var(--fig-ink)}
    .rxn-3-esterification-s{font-size:13px;fill:var(--fig-muted)}
    .rxn-3-esterification-b{font-size:15px;fill:var(--fig-ink);font-weight:600}
  </style>
  <text x="60.0" y="105.5" text-anchor="middle" class="rxn-3-esterification-b">CH₃</text>
  <line x1="78.0" y1="100.0" x2="102.0" y2="100.0" style="stroke:var(--fig-ink);stroke-width:2"/>
  <text x="112.0" y="105.5" text-anchor="middle" class="rxn-3-esterification-b">C</text>
