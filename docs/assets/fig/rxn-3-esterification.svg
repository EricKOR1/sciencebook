  <text x="267.0" y="273.5" text-anchor="start" class="rxn-3-esterification-b">CH₂CH₃</text>
  <text x="400.0" y="274.0" text-anchor="middle" class="rxn-3-esterification-T">+</text>
  <rect x="424.0" y="250.0" width="64.0" height="36.0" rx="8" style="fill:var(--fig-soft-red);stroke:var(--fig-red);stroke-width:1.5"/>
  <text x="456.0" y="273.5" text-anchor="middle" class="rxn-3-esterification-b">H₂O</text>
  <text x="232.0" y="302.0" text-anchor="middle" class="rxn-3-esterification-k" style="fill:var(--fig-green);font-weight:700">−COO− 연결 (에스터)</text>
