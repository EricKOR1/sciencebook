<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" role="img" aria-labelledby="t-rxn-3-esterification d-rxn-3-esterification">
  <title id="t-rxn-3-esterification">그림 화학 반응의 세계 3-4 알코올과 카복실산의 반응 — 어떤 원자가 물로 빠지는가</title>
  <desc id="d-rxn-3-esterification">아세트산 카복실기의 −OH와 에탄올 하이드록시기의 H가 물 분자로 빠져나가고, 남은 두 부분이 −COO− 연결로 이어져 에스터가 된다. 진한 황산은 촉매로 쓰인다.</desc>
