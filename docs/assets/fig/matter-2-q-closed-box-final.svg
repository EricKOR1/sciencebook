  <title id="t-matter-2-q-closed-box-final">그림 물질과 에너지 2-13 문제 17 해설: 처음과 물의 이동이 멈춘 뒤</title>
  <desc id="d-matter-2-q-closed-box-final">처음에는 A(물 100 g, 포도당 0.10 mol)와 B(물 100 g, 포도당 0.30 mol)의 수면 높이가 같다. 증기 압력이 큰 A에서 B로 물이 옮겨 가, 두 용액의 몰랄 농도가 같아지면(A 물 50 g, B 물 150 g) 이동이 멈춘다. 포도당 입자 수는 몰수 비(1 : 3)에 맞춘 모식도이다.</desc>
