  <title id="t-gene-2-q-lac-operon">그림 생물의 유전 2-5 예제 6의 젖당 오페론과 돌연변이 위치</title>
  <desc id="d-gene-2-q-lac-operon">조절 유전자와 젖당 오페론(프로모터, 작동 부위, 구조 유전자 lacZ·lacY·lacA)의 배치에 균 (가)~(다)의 돌연변이 위치를 표시하였다. (라)는 젖당 유도체와 결합하는 자리에 이상이 있는 억제 단백질을 만든다. 길이 비율은 실제와 다른 모식도이다.</desc>
