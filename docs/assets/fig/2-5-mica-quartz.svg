<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t-2-5-mica-quartz d-2-5-mica-quartz">
  <title id="t-2-5-mica-quartz">그림 2-5-4 흑운모와 석영 — 약한 면이 있는가?</title>
  <desc id="d-2-5-mica-quartz">흑운모는 사면체가 산소를 공유해 만든 판이 겹겹이 쌓여 있고, 판과 판 사이는 양이온이 비교적 약하게 잇고 있어 그 면을 따라 얇게 벗겨진다. 석영은 모든 꼭짓점의 산소를 공유하는 입체 그물이라 약한 면이 없다. 사면체를 삼각형으로 단순하게 나타낸 모식도이다.</desc>
