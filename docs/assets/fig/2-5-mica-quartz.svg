    .mq-tet{fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5;stroke-linejoin:round}
    .mq-cat{fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.3} .mq-ct{font-size:11px;font-weight:700;fill:var(--fig-amber)}
    .mq-cut{stroke:var(--fig-red);stroke-width:2;stroke-dasharray:7 5;fill:none} .mq-red{font-size:13px;font-weight:600;fill:var(--fig-red)}
    .mq-blue{font-size:13px;font-weight:600;fill:var(--fig-blue)}
    .mq-ld{stroke:var(--fig-muted);stroke-width:1.1;fill:none} .mq-sep{stroke:var(--fig-line);stroke-width:1;stroke-dasharray:4 4}
  </style>
