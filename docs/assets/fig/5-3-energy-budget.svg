<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 476" role="img" aria-labelledby="t-5-3-energy-budget d-5-3-energy-budget">
  <title id="t-5-3-energy-budget">그림 5-3-1 지구 열수지 (태양 복사 100 기준)</title>
  <desc id="d-5-3-energy-budget">지구에 들어오는 태양 복사 100 가운데 30은 반사되고 23은 대기, 47은 지표가 흡수한다. 지표는 대기 역복사 97을 더 받아 지표 복사 116, 증발 23, 전도·대류 5를 내보내고, 대기는 우주로 58을 방출한다. 지구 전체·대기·지표 각각에서 들어온 양과 나간 양이 같다. 반올림한 대표값이며 자료마다 조금씩 다를 수 있다.</desc>
  <style>
    .eb-space{fill:var(--fig-paper)} .eb-atm{fill:var(--fig-soft-blue)} .eb-ground{fill:var(--fig-soft-green)}
    .eb-sun{fill:var(--fig-amber)} .eb-cloud{fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2}
    .eb-sw{stroke:var(--fig-amber);fill:none} .eb-sw-h{fill:var(--fig-amber)}
    .eb-lw{stroke:var(--fig-red);fill:none} .eb-lw-h{fill:var(--fig-red)}
    .eb-ht{stroke:var(--fig-teal);fill:none} .eb-ht-h{fill:var(--fig-teal)}
    .eb-band{font-size:15px;font-weight:700;fill:var(--fig-ink)}
    .eb-big{font-size:15px;font-weight:700}
    .eb-lbl{font-size:14px;font-weight:600}
    .eb-sm{font-size:12px;fill:var(--fig-muted)}
    .eb-c-sw{fill:var(--fig-amber)} .eb-c-lw{fill:var(--fig-red)} .eb-c-ht{fill:var(--fig-teal)} .eb-c-ink{fill:var(--fig-ink)}
    .eb-sum{font-size:13.5px;fill:var(--fig-ink)} .eb-sumh{font-weight:700}
  </style>
  <rect x="0" y="0" width="720" height="100" class="eb-space"/>
  <rect x="0" y="110" width="720" height="150" class="eb-atm"/>
  <rect x="0" y="350" width="720" height="42" class="eb-ground"/>
  <text x="12" y="22" class="eb-band">우주</text>
  <text x="12" y="132" class="eb-band">대기</text>
  <text x="12" y="376" class="eb-band">지표</text>
  <circle cx="70" cy="34" r="16" class="eb-sun"/>
  <path d="M104 160 a12 12 0 0 1 10 -20 a16 16 0 0 1 30 -4 a12 12 0 0 1 18 14 a10 10 0 0 1 -4 10 z" class="eb-cloud"/>
  <line x1="70" y1="52" x2="70" y2="150" class="eb-sw" style="stroke-width:21.0"/>
  <line x1="70" y1="150" x2="70" y2="195" class="eb-sw" style="stroke-width:16.2"/>
  <line x1="70" y1="195" x2="70" y2="338" class="eb-sw" style="stroke-width:11.3"/>
  <path d="M70 350 L60.361000000000004 340.928 L79.639 340.928 Z" class="eb-sw-h"/>
  <text x="92" y="64" class="eb-big eb-c-sw">태양 복사 100</text>
  <path d="M78 150 Q200 150 200 110 V40" class="eb-sw" style="fill:none;stroke-width:4.8"/>
  <path d="M200 28 L194 37 L206 37 Z" class="eb-sw-h"/>
  <text x="192" y="84" text-anchor="end" class="eb-lbl eb-c-sw">반사 23</text>
  <text x="192" y="99" text-anchor="end" class="eb-sm">(대기·구름)</text>
  <path d="M76 196 Q120 196 138 206" class="eb-sw" style="fill:none;stroke-width:4.8"/>
  <path d="M150 212 L134 199 L130 213 Z" class="eb-sw-h"/>
  <text x="156" y="216" class="eb-lbl eb-c-sw">대기 흡수 23</text>
  <path d="M76 338 Q250 338 250 296 V40" class="eb-sw" style="fill:none;stroke-width:2.5"/>
  <path d="M250 28 L244 37 L256 37 Z" class="eb-sw-h"/>
  <text x="258" y="84" class="eb-lbl eb-c-sw">반사 7</text>
  <text x="258" y="99" class="eb-sm">(지표)</text>
  <text x="92" y="378" class="eb-lbl eb-c-ink">지표 흡수 47</text>
  <line x1="378" y1="345" x2="378" y2="206" class="eb-lw" style="stroke-width:21.8"/>
  <path d="M378 192 L359.436 209.472 L396.564 209.472 Z" class="eb-lw-h"/>
  <line x1="398" y1="345" x2="398" y2="40" class="eb-lw" style="stroke-width:2.5"/>
  <path d="M398 28 L392 37 L404 37 Z" class="eb-lw-h"/>
  <text x="362" y="318" text-anchor="end" class="eb-lbl eb-c-lw">지표 복사 116</text>
  <text x="362" y="236" text-anchor="end" class="eb-lbl eb-c-lw">대기 흡수 104</text>
  <text x="406" y="84" class="eb-lbl eb-c-lw">대기 통과 12</text>
  <line x1="470" y1="345" x2="470" y2="216" class="eb-ht" style="stroke-width:4.8"/>
  <path d="M470 204 L464 213 L476 213 Z" class="eb-ht-h"/>
  <line x1="500" y1="345" x2="500" y2="216" class="eb-ht" style="stroke-width:2.5"/>
  <path d="M500 204 L494 213 L506 213 Z" class="eb-ht-h"/>
  <text x="458" y="300" text-anchor="end" class="eb-lbl eb-c-ht">증발(숨은열) 23</text>
  <text x="508" y="300" class="eb-lbl eb-c-ht">전도·대류 5</text>
  <line x1="612" y1="186" x2="612" y2="336" class="eb-lw" style="stroke-width:20.4"/>
  <path d="M612 350 L594.6855 333.704 L629.3145 333.704 Z" class="eb-lw-h"/>
  <text x="596" y="240" text-anchor="end" class="eb-lbl eb-c-lw">대기 역복사 97</text>
  <line x1="680" y1="186" x2="680" y2="44" class="eb-lw" style="stroke-width:12.2"/>
  <path d="M680 28 L669.647 37.744 L690.353 37.744 Z" class="eb-lw-h"/>
  <text x="664" y="84" text-anchor="end" class="eb-lbl eb-c-lw">대기의 방출 58</text>
  <text x="12" y="290" class="eb-sm">화살표 굵기: 크기 비교용(작은 값은 같은 굵기)</text>
  <text x="12" y="420" class="eb-sum"><tspan class="eb-sumh">지구 전체</tspan>  들어옴: 태양 복사 100  =  나감: 반사 30 + 대기의 방출 58 + 대기 통과 12</text>
  <text x="12" y="442" class="eb-sum"><tspan class="eb-sumh">대기</tspan>  들어옴: 23 + 104 + 23 + 5 = 155  =  나감: 대기 역복사 97 + 대기의 방출 58</text>
  <text x="12" y="464" class="eb-sum"><tspan class="eb-sumh">지표</tspan>  들어옴: 47 + 97 = 144  =  나감: 지표 복사 116 + 증발 23 + 전도·대류 5</text>
</svg>
