  <title id="t-mech-1-equivalence-elevator">그림 역학과 에너지 1-8 아인슈타인의 엘리베이터와 등가 원리</title>
  <desc id="d-mech-1-equivalence-elevator">지구 표면에 정지한 엘리베이터와 우주에서 위로 9.8 m/s²로 가속하는 엘리베이터 안에서는 똑같이 공이 떨어지고, 자유 낙하하는 엘리베이터와 우주에 떠 있는 엘리베이터 안에서는 똑같이 모든 것이 떠 있다. 창문 없는 엘리베이터 안에서는 두 경우를 구별할 수 없다.</desc>
