<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" class="fig-small" role="img" aria-labelledby="t-ochem-1-q-enolate-resonance d-ochem-1-q-enolate-resonance">
  <title id="t-ochem-1-q-enolate-resonance">그림 유기화학 1-17 예제 14 아세톤 엔올레이트의 공명</title>
  <desc id="d-ochem-1-q-enolate-resonance">왼쪽 탄소 음이온형에서 CH₂⁻의 전자쌍 → C–C 결합 자리(새 C=C), C=O π → O(굽은 화살표 2개)로 오른쪽 산소 음이온형이 된다. 음전하가 전기 음성도가 큰 O에 있는 오른쪽 구조가 주된 기여 구조이다. 아래 혼성체에서 π 전자는 C–C–O에 걸쳐 퍼져 있고(점선), 음전하는 O에 크게(δ−), CH₂에 작게(δ−) 있다.</desc>
