<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-labelledby="t-emq-2-q-fiber-entry d-emq-2-q-fiber-entry">
  <title id="t-emq-2-q-fiber-entry">그림 전자기와 양자 2-12 문제 16의 광섬유 끝면으로 들어가는 빛</title>
  <desc id="d-emq-2-q-fiber-entry">공기 중에서 광섬유의 끝면에 축과 각 α를 이루며 들어간 빛이 굴절하여 코어 속에서 축과 각 β를 이루며 나아가 코어–클래딩 경계에 닿는다. 코어의 굴절률은 1.50, 클래딩은 1.47이다. 굵기를 과장한 모식도이다.</desc>
  <style>.emq-2-q-fiber-entry-t{font-size:14px;fill:var(--fig-ink)} .emq-2-q-fiber-entry-s{font-size:13px;fill:var(--fig-muted)} .emq-2-q-fiber-entry-b{font-size:15px;font-weight:700;fill:var(--fig-ink)}</style>
  <rect x="200" y="78" width="500" height="32" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.5"/>
  <rect x="200" y="190" width="500" height="32" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.5"/>
  <rect x="200" y="110" width="500" height="80" style="fill:var(--fig-soft-blue);stroke:none"/>
  <line x1="200" y1="78" x2="200" y2="222" style="stroke:var(--fig-ink);stroke-width:2.4"/>
  <line x1="110" y1="150" x2="700" y2="150" style="stroke:var(--fig-muted);stroke-width:1.2;stroke-dasharray:8 6"/>
  <text x="704" y="146" text-anchor="end" class="emq-2-q-fiber-entry-s">축</text>
  <text x="200" y="66" text-anchor="middle" class="emq-2-q-fiber-entry-s">끝면</text>
  <text x="30" y="60" class="emq-2-q-fiber-entry-s">공기 (굴절률 1.00)</text>
  <text x="690" y="99" text-anchor="end" class="emq-2-q-fiber-entry-s">클래딩 (1.47)</text>
  <text x="690" y="211" text-anchor="end" class="emq-2-q-fiber-entry-s">클래딩 (1.47)</text>
  <text x="690" y="180" text-anchor="end" class="emq-2-q-fiber-entry-t">코어 (1.50)</text>
  <line x1="55.1" y1="188.8" x2="192.3" y2="152.1" style="stroke:var(--fig-red);stroke-width:2.4"/>
  <path d="M200 150 L189.2 148.2 L191.5 156.9 Z" style="fill:var(--fig-red)"/>
  <line x1="200" y1="150" x2="428.3" y2="110" style="stroke:var(--fig-red);stroke-width:2.4"/>
  <line x1="428.3" y1="110" x2="682.1" y2="154.5" style="stroke:var(--fig-red);stroke-width:2.4"/>
  <path d="M690 155.8 L680.9 149.7 L679.4 158.5 Z" style="fill:var(--fig-red)"/>
  <line x1="428.3" y1="110" x2="428.3" y2="168" style="stroke:var(--fig-ink);stroke-width:1;stroke-dasharray:3 3"/>
  <path d="M120 150 A80 80 0 0 0 122.7 170.7" style="fill:none;stroke:var(--fig-ink);stroke-width:1.3"/>
  <text x="112" y="168" text-anchor="end" class="emq-2-q-fiber-entry-b">α</text>
  <path d="M310 150 A110 110 0 0 0 308.4 131" style="fill:none;stroke:var(--fig-ink);stroke-width:1.3"/>
  <text x="318" y="146" class="emq-2-q-fiber-entry-b">β</text>
  <text x="360" y="270" text-anchor="middle" class="emq-2-q-fiber-entry-s">굵기와 각의 크기를 과장한 모식도</text>
</svg>
