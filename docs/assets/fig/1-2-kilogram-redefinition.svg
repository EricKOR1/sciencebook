  <text x="440" y="250" text-anchor="middle" class="kg12-txt">1 kg</text>
  <line x1="540" y1="110" x2="540" y2="140" class="kg12-ar"/>
  <path d="M540 146 l-5 -9 h10 z" style="fill:var(--fig-ink)" transform="rotate(-0 540 146)"/>
  <path d="M506 176 V160 L523 150 L540 160 L557 150 L574 160 V176 Z" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.5"/>
  <text x="540" y="194" text-anchor="middle" class="kg12-sm">실험실 B</text>
  <path d="M524 232 L529 208 H551 L556 232 Z" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5"/>
  <circle cx="540" cy="205" r="4" style="fill:none;stroke:var(--fig-violet);stroke-width:1.5"/>
  <text x="540" y="250" text-anchor="middle" class="kg12-txt">1 kg</text>
  <line x1="540" y1="110" x2="640" y2="140" class="kg12-ar"/>
  <path d="M640 146 l-5 -9 h10 z" style="fill:var(--fig-ink)" transform="rotate(-28 640 146)"/>
  <path d="M606 176 V160 L623 150 L640 160 L657 150 L674 160 V176 Z" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:1.5"/>
  <text x="640" y="194" text-anchor="middle" class="kg12-sm">실험실 C</text>
  <path d="M624 232 L629 208 H651 L656 232 Z" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5"/>
  <circle cx="640" cy="205" r="4" style="fill:none;stroke:var(--fig-violet);stroke-width:1.5"/>
  <text x="640" y="250" text-anchor="middle" class="kg12-txt">1 kg</text>
  <text x="540" y="270" text-anchor="middle" class="kg12-sm">기술을 갖추면 어디서나 같은 1 kg을 만든다</text>
  <text x="360" y="312" text-anchor="middle" class="kg12-txt">바뀐 것은 1 kg의 <tspan style="font-weight:600">크기</tspan>가 아니라 <tspan style="font-weight:600">무엇을 기준으로 삼는가</tspan>이다</text>
</svg>
