<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-1-2-kilogram-redefinition d-1-2-kilogram-redefinition">
  <title id="t-1-2-kilogram-redefinition">그림 1-2-2 킬로그램의 기준: 원기에서 자연의 상수로</title>
  <desc id="d-1-2-kilogram-redefinition">2019년 전에는 금속 원기 하나가 1 kg의 기준이어서 복제품과 차이가 생겨도 어느 쪽이 변했는지 알 수 없었다. 2019년부터는 플랑크 상수의 값을 고정하여, 기술을 갖춘 어느 실험실에서나 같은 1 kg을 구현한다. 1 kg의 크기는 그대로이다.</desc>
  <style>
    .kg12-lbl{font-size:15px;font-weight:600;fill:var(--fig-ink)}
    .kg12-txt{font-size:14px;fill:var(--fig-ink)}
    .kg12-sm{font-size:13px;fill:var(--fig-muted)}
    .kg12-ar{stroke:var(--fig-ink);stroke-width:1.6;fill:none}
  </style>
  <rect x="10" y="10" width="340" height="270" rx="12" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1.2"/>
  <rect x="370" y="10" width="340" height="270" rx="12" style="fill:var(--fig-panel);stroke:var(--fig-accent);stroke-width:1.5"/>
  <text x="180" y="38" text-anchor="middle" class="kg12-lbl">1889~2019년: 물건이 기준</text>
  <text x="540" y="38" text-anchor="middle" class="kg12-lbl" style="fill:var(--fig-accent)">2019년~: 자연의 상수가 기준</text>
  <path d="M153.0 78 V128 A27.0 7.714285714285714 0 0 0 207.0 128 V78 Z" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <ellipse cx="180" cy="78" rx="27.0" ry="7.714285714285714" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <text x="180" y="160" text-anchor="middle" class="kg12-txt">국제 킬로그램 원기</text>
  <text x="180" y="177" text-anchor="middle" class="kg12-sm">(정의상 정확히 1 kg)</text>
  <path d="M52.0 196 V228 A18.0 5.142857142857143 0 0 0 88.0 228 V196 Z" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <ellipse cx="70" cy="196" rx="18.0" ry="5.142857142857143" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <text x="70" y="256" text-anchor="middle" class="kg12-sm">복제품</text>
  <path d="M272.0 196 V228 A18.0 5.142857142857143 0 0 0 308.0 228 V196 Z" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <ellipse cx="290" cy="196" rx="18.0" ry="5.142857142857143" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:1.5"/>
  <text x="290" y="256" text-anchor="middle" class="kg12-sm">복제품</text>
  <path d="M140 140 Q100 160 84 186" class="kg12-ar" style="stroke-dasharray:4 3"/>
  <path d="M220 140 Q260 160 276 186" class="kg12-ar" style="stroke-dasharray:4 3"/>
  <text x="180" y="214" text-anchor="middle" class="kg12-lbl" style="fill:var(--fig-red)">약 50 μg 차이</text>
  <text x="180" y="234" text-anchor="middle" class="kg12-txt">어느 쪽이 변했을까?</text>
  <text x="180" y="252" text-anchor="middle" class="kg12-sm">원기 자체가 기준이라</text>
  <text x="180" y="268" text-anchor="middle" class="kg12-sm">알 수 없다</text>
  <rect x="400" y="54" width="280" height="54" rx="8" style="fill:var(--fig-soft-blue);stroke:var(--fig-blue);stroke-width:1.5"/>
  <text x="540" y="76" text-anchor="middle" class="kg12-lbl">플랑크 상수 h (값을 고정)</text>
  <text x="540" y="98" text-anchor="middle" class="kg12-txt">6.626 070 15 × 10⁻³⁴ J·s</text>
  <line x1="540" y1="110" x2="440" y2="140" class="kg12-ar"/>
  <path d="M440 146 l-5 -9 h10 z" style="fill:var(--fig-ink)" transform="rotate(28 440 146)"/>
