  <title id="t-gene-3-q-frameshift">그림 생물의 유전 3-10 문제 14 해설 — 염기 1개 결실과 3개 결실의 비교</title>
  <desc id="d-gene-3-q-frameshift">칸 하나는 염기 하나이고, 칸의 색은 원래 속한 코돈을 나타낸다. 굵은 테두리는 실제로 3개씩 읽히는 코돈이다. 염기 1개가 결실된 (가)에서는 절단 위치 뒤의 읽는 틀이 모두 어긋나 코돈이 달라지고, 3개가 결실된 (나)에서는 코돈 하나만 빠지고 뒤의 읽는 틀은 원래대로 유지된다. 모식도이다.</desc>
