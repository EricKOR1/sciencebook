<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-ubio-9-tree-of-life d-ubio-9-tree-of-life">
<title id="t-ubio-9-tree-of-life">그림 일반생명과학 9-4 3역으로 본 생명의 계통수</title>
<desc id="d-ubio-9-tree-of-life">rRNA 서열로 그린 생명의 계통수. 세균역이 먼저 갈라지고, 고세균역과 진핵생물역이 자매군이다. 점선 화살표는 세포 내 공생으로, 프로테오박테리아의 한 계통이 미토콘드리아가 되고 남세균이 아키플라스티다의 엽록체가 되었음을 뜻한다. 각 역 안의 무리 사이 관계는 단순화하여 한 점에서 갈라지게(다분기) 그렸다.</desc>
<style>
.ubio-9-tree-of-life-h{font-size:14px;font-weight:700;fill:var(--fig-ink)} .ubio-9-tree-of-life-t{font-size:13px;fill:var(--fig-ink)} .ubio-9-tree-of-life-s{font-size:13px;fill:var(--fig-muted)} .ubio-9-tree-of-life-b{font-size:13px;font-weight:700;fill:var(--fig-ink)}
</style>
