<text x="448.0" y="291.0" text-anchor="start" class="ubio-9-tree-of-life-b" style="fill:var(--fig-red)">← 엽록체(1차 공생)</text>
<text x="20.0" y="410.0" text-anchor="start" class="ubio-9-tree-of-life-s">원핵생물 사이의 수평 유전자 이동까지 더하면 뿌리 근처는 나무보다 그물에 가깝다. 가지 길이는 시간을 뜻하지 않는다.</text>
