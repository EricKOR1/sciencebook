<line x1="270" y1="260" x2="440" y2="260" style="stroke:var(--fig-green);stroke-width:2.4"/>
<text x="448.0" y="265.0" text-anchor="start" class="ubio-9-tree-of-life-t">아키플라스티다(식물 등)</text>
<line x1="230" y1="310" x2="230" y2="370" style="stroke:var(--fig-blue);stroke-width:2.4"/>
<line x1="230" y1="310" x2="440" y2="310" style="stroke:var(--fig-blue);stroke-width:2.4"/>
<text x="448.0" y="315.0" text-anchor="start" class="ubio-9-tree-of-life-t">프로테오박테리아</text>
