<line x1="270" y1="200" x2="440" y2="200" style="stroke:var(--fig-green);stroke-width:2.4"/>
<text x="448.0" y="205.0" text-anchor="start" class="ubio-9-tree-of-life-t">SAR(규조류·갈조류 등)</text>
