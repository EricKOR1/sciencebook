<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-uearth-6-q-baroclinic d-uearth-6-q-baroclinic">
<title id="t-uearth-6-q-baroclinic">그림 일반지구과학 6-16 문제 17 해설 — 서안 경계류의 단면과 유속 분포</title>
<desc id="d-uearth-6-q-baroclinic">북쪽으로 흐르는 서안 경계류를 서–동으로 자른 단면을 남쪽에서 바라본 모습이다(⊗는 지면 안쪽, 곧 북쪽으로 흐름). 해수면은 동쪽이 1.0 m 높고(크게 과장), 표층 유속 약 1.3 m/s가 수심 800 m에서 0이 되도록 직선으로 줄어든다. 깊이 평균 유속은 표층 값의 절반인 약 0.67 m/s이다.</desc>
