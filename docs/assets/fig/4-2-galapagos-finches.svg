<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t-4-2-galapagos-finches d-4-2-galapagos-finches">
  <title id="t-4-2-galapagos-finches">그림 4-2-4 갈라파고스 제도의 위치와 먹이에 따른 핀치의 부리</title>
  <desc id="d-4-2-galapagos-finches">갈라파고스 제도는 남아메리카 에콰도르 해안에서 서쪽으로 약 1000 km 떨어진 적도 부근의 화산섬들이다. 대륙에서 건너온 조상 핀치가 섬마다 다른 먹이 환경에 적응하여, 큰 씨앗을 깨 먹는 핀치는 굵고 단단한 부리를, 곤충을 잡아먹는 핀치는 가늘고 뾰족한 부리를 갖게 되었다. 지도는 작은 섬을 생략한 모식 지도이고, 부리 그림은 모식도이다.</desc>
