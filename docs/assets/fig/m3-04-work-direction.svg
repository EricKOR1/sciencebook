  <text x="125.0" y="270.0" class="m3-04-work-direction-t" style="fill:var(--fig-red);font-weight:600">미는 힘</text>
  <text x="283.0" y="278.0" text-anchor="middle" class="m3-04-work-direction-t" style="fill:var(--fig-blue);font-weight:600">이동 거리</text>
  <text x="283.0" y="298.0" text-anchor="middle" class="m3-04-work-direction-t" style="fill:var(--fig-blue);font-weight:600">= 0</text>
  <text x="185.0" y="360.0" text-anchor="middle" class="m3-04-work-direction-t" style="fill:var(--fig-red);font-weight:600">힘은 주었지만 움직이지 않음 → 일 = 0</text>
  <rect x="365" y="202" width="340" height="170" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1"/>
  <text x="377.0" y="224.0" class="m3-04-work-direction-l">(라) 물체를 천천히 들어 올린다</text>
  <line x1="377.0" y1="340.0" x2="565.0" y2="340.0" style="stroke:var(--fig-line);stroke-width:2"/>
  <rect x="425" y="314" width="36" height="26" rx="3" style="fill:var(--fig-soft-teal);stroke:var(--fig-teal);stroke-width:2"/>
  <rect x="425" y="242" width="36" height="26" rx="3" style="fill:none;stroke:var(--fig-muted);stroke-width:1.5;stroke-dasharray:4 3"/>
  <text x="443.0" y="332.0" text-anchor="middle" class="m3-04-work-direction-t">m</text>
  <line x1="443.0" y1="310.0" x2="443.0" y2="288.0" style="stroke:var(--fig-red);stroke-width:2.5"/>
  <path d="M443.0 278.0 L448.5 288.0 L437.5 288.0 Z" style="fill:var(--fig-red)"/>
  <text x="385.0" y="274.0" class="m3-04-work-direction-s" style="fill:var(--fig-red);font-weight:600">드는 힘</text>
  <text x="385.0" y="290.0" class="m3-04-work-direction-s" style="fill:var(--fig-red);font-weight:600">= 무게</text>
  <line x1="485.0" y1="338.0" x2="485.0" y2="254.0" style="stroke:var(--fig-blue);stroke-width:2.5"/>
  <path d="M485.0 244.0 L490.5 254.0 L479.5 254.0 Z" style="fill:var(--fig-blue)"/>
