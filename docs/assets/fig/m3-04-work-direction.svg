<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" role="img" aria-labelledby="t-m3-04-work-direction d-m3-04-work-direction">
  <title id="t-m3-04-work-direction">그림 중3-4-3 일을 했을까, 안 했을까 — 힘의 방향과 이동 방향</title>
  <desc id="d-m3-04-work-direction">빨간 화살표는 물체에 준 힘, 파란 화살표는 물체가 이동한 방향과 거리이다. 힘의 방향으로 이동해야 일을 한 것이고, 이동 거리가 0이거나 힘과 이동 방향이 수직이면 그 힘이 한 일은 0이다.</desc>
  <style>
    .m3-04-work-direction-l{font-size:14px;fill:var(--fig-ink);font-weight:600} .m3-04-work-direction-t{font-size:14px;fill:var(--fig-ink)}
    .m3-04-work-direction-s{font-size:13px;fill:var(--fig-muted)} .m3-04-work-direction-h{font-size:15px;fill:var(--fig-ink);font-weight:700}
    .m3-04-work-direction-ld{stroke:var(--fig-muted);stroke-width:1;fill:none}

  </style>
  <rect x="15" y="12" width="340" height="170" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1"/>
  <text x="27.0" y="34.0" class="m3-04-work-direction-l">(가) 수레를 밀어 옮긴다</text>
