  <text x="575.0" y="262.0" class="m3-04-work-direction-t">중력에 대해서</text>
  <text x="575.0" y="282.0" class="m3-04-work-direction-t">한 일</text>
  <text x="575.0" y="306.0" class="m3-04-work-direction-t" style="fill:var(--fig-green);font-weight:600">= 9.8 × m × h</text>
