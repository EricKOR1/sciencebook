  <circle cx="131" cy="129" r="5" style="fill:var(--fig-soft-amber);stroke:var(--fig-amber);stroke-width:2"/>
  <rect x="245" y="100" width="60" height="26" rx="3" style="fill:none;stroke:var(--fig-muted);stroke-width:1.5;stroke-dasharray:4 3"/>
  <circle cx="259" cy="129" r="5" style="fill:none;stroke:var(--fig-muted);stroke-width:1.5;stroke-dasharray:4 3"/>
  <circle cx="291" cy="129" r="5" style="fill:none;stroke:var(--fig-muted);stroke-width:1.5;stroke-dasharray:4 3"/>
  <line x1="37.0" y1="113.0" x2="73.0" y2="113.0" style="stroke:var(--fig-red);stroke-width:2.5"/>
  <path d="M83.0 113.0 L73.0 118.5 L73.0 107.5 Z" style="fill:var(--fig-red)"/>
  <text x="35.0" y="92.0" class="m3-04-work-direction-t" style="fill:var(--fig-red);font-weight:600">힘 20 N</text>
  <line x1="115.0" y1="60.0" x2="265.0" y2="60.0" style="stroke:var(--fig-blue);stroke-width:2.5"/>
  <path d="M275.0 60.0 L265.0 65.5 L265.0 54.5 Z" style="fill:var(--fig-blue)"/>
  <text x="195.0" y="54.0" text-anchor="middle" class="m3-04-work-direction-t" style="fill:var(--fig-blue);font-weight:600">이동 거리 5 m</text>
  <text x="185.0" y="170.0" text-anchor="middle" class="m3-04-work-direction-t" style="fill:var(--fig-green);font-weight:600">힘과 이동 방향이 같다 → 일 = 20 × 5 = 100 J</text>
  <rect x="365" y="12" width="340" height="170" rx="8" style="fill:var(--fig-panel);stroke:var(--fig-line);stroke-width:1"/>
  <text x="377.0" y="34.0" class="m3-04-work-direction-l">(나) 가방을 들고 수평으로 걷는다</text>
  <line x1="377.0" y1="134.0" x2="693.0" y2="134.0" style="stroke:var(--fig-line);stroke-width:2"/>
