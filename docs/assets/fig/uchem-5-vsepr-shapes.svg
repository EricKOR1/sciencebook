<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" role="img" aria-labelledby="t-uchem-5-vsepr-shapes d-uchem-5-vsepr-shapes">
  <title id="t-uchem-5-vsepr-shapes">그림 일반화학 5-4 전자 영역 수와 분자 모양(VSEPR)</title>
  <desc id="d-uchem-5-vsepr-shapes">중심 원자(파랑) 주위의 전자 영역 2~6개는 서로 가장 멀리 떨어진 직선, 평면 삼각형, 사면체, 삼각쌍뿔, 팔면체로 배치된다. 그중 일부가 비공유 전자쌍(보라 풍선)이면 원자(초록)만 이은 분자 모양은 굽은형, 삼각뿔형, 시소형, T자형, 사각뿔형, 평면 사각형 등이 된다. 삼각쌍뿔에서 비공유 전자쌍은 적도 자리에 들어간다. 입체를 비스듬히 본 모식도이다.</desc>
