<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" role="img" aria-labelledby="t-ubio-11-digestive d-ubio-11-digestive">
  <title id="t-ubio-11-digestive">그림 일반생명과학 11-2 소화계 — 기관별 분비물과 호르몬</title>
  <desc id="d-ubio-11-digestive">사람 소화계의 모식도(관찰자가 마주 본 방향이므로 몸의 왼쪽이 그림의 오른쪽). 음식물은 입 → 식도 → 위 → 소장(십이지장 포함) → 대장 → 항문으로 한 방향으로 지나간다. 침샘은 침 아밀레이스, 위는 염산과 펩시노젠, 이자는 아밀레이스·트립시노젠·라이페이스와 탄산수소 이온을 내고, 간이 만든 쓸개즙은 쓸개에 저장되었다가 십이지장으로 나온다. 위는 가스트린, 십이지장은 세크레틴과 콜레시스토키닌(CCK)을 분비한다. 소장에서 대부분의 소화와 흡수가, 대장에서 물 재흡수가 일어난다.</desc>
