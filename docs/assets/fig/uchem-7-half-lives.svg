  <title id="t-uchem-7-half-lives">그림 일반화학 7-3 0·1·2차 반응의 반감기와 직선 그래프</title>
  <desc id="d-uchem-7-half-lives">세 반응 모두 처음 농도 1, 첫 반감기 1(시간 단위)이 되게 맞추었다. 위: 농도–시간 곡선에서 연이은 반감기가 0차는 짧아지고, 1차는 일정하며, 2차는 두 배씩 길어진다. 아래: 각 차수에서 직선이 되는 그래프([A], ln[A], 1/[A] 대 t)와 그 기울기.</desc>
