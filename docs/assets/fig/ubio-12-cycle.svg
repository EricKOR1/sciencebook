<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="t-ubio-12-cycle d-ubio-12-cycle">
  <title id="t-ubio-12-cycle">그림 일반생명과학 12-2 생식 주기의 호르몬, 난소, 자궁 내막 변화</title>
  <desc id="d-ubio-12-cycle">28일 주기를 가정한 모식 그래프. 위에서부터 뇌하수체 전엽 호르몬(FSH, LH), 난소의 여포·황체, 난소 호르몬(에스트로젠, 프로게스테론), 자궁 내막 두께. 에스트로젠이 높게 유지된 뒤 LH가 급증하고 약 하루 뒤 배란이 일어나며, 황체기에는 프로게스테론이 높고 내막이 가장 두껍다.</desc>
