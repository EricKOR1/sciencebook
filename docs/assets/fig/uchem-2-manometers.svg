<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-uchem-2-manometers d-uchem-2-manometers">
  <title id="t-uchem-2-manometers">그림 일반화학 2-1 열린 관 압력계와 닫힌 관 압력계</title>
  <desc id="d-uchem-2-manometers">기체는 수은을 밀어 반대쪽 면을 올린다. 열린 관에서는 대기 쪽 면이 h만큼 높으면 기체 압력이 대기압보다 h만큼 크고, 낮으면 h만큼 작다. 진공으로 막힌 닫힌 관에서는 높이 차 h가 곧 기체의 압력이다(h를 mm로 재면 압력은 mmHg 단위, 모식도).</desc>
  <style>
    .uchem-2-mm-glass{fill:none;stroke:var(--fig-ink);stroke-width:20;stroke-linejoin:round}
    .uchem-2-mm-in{fill:none;stroke:var(--fig-paper);stroke-width:15;stroke-linejoin:round}
    .uchem-2-mm-hg{fill:none;stroke:var(--fig-muted);stroke-width:15;stroke-linejoin:round}
    .uchem-2-mm-bulb{fill:var(--fig-soft-amber);stroke:var(--fig-ink);stroke-width:2.5}
    .uchem-2-mm-gas{fill:var(--fig-amber)}
    .uchem-2-mm-guide{stroke:var(--fig-red);stroke-width:1.3;stroke-dasharray:4 3}
    .uchem-2-mm-h{stroke:var(--fig-red);stroke-width:2}
    .uchem-2-mm-hl{font-size:15px;font-weight:600;fill:var(--fig-red);font-style:italic}
    .uchem-2-mm-t{font-size:14px;fill:var(--fig-ink)}
    .uchem-2-mm-hd{font-size:15px;font-weight:600;fill:var(--fig-ink);text-anchor:middle}
    .uchem-2-mm-s{font-size:13px;fill:var(--fig-muted)}
    .uchem-2-mm-eq{font-size:15px;font-weight:600;fill:var(--fig-accent);text-anchor:middle}
  </style>
  <defs>
    <g id="uchem-2-mm-bulbg">
      <circle cx="40" cy="110" r="30" class="uchem-2-mm-bulb"/>
      <circle cx="30" cy="100" r="3" class="uchem-2-mm-gas"/><circle cx="50" cy="96" r="3" class="uchem-2-mm-gas"/>
      <circle cx="40" cy="118" r="3" class="uchem-2-mm-gas"/><circle cx="26" cy="122" r="3" class="uchem-2-mm-gas"/><circle cx="54" cy="124" r="3" class="uchem-2-mm-gas"/>
      <text x="40" y="160" text-anchor="middle" class="uchem-2-mm-s">기체</text>
    </g>
  </defs>

  <!-- ① 열린 관: 기체 압력 > 대기압 -->
  <g transform="translate(0 0)">
    <path d="M66 110 H90 Q100 110 100 120 V230 Q100 260 130 260 Q160 260 160 230 V76" class="uchem-2-mm-glass"/>
    <path d="M66 110 H90 Q100 110 100 120 V230 Q100 260 130 260 Q160 260 160 230 V75" class="uchem-2-mm-in"/>
    <path d="M100 195 V230 Q100 260 130 260 Q160 260 160 230 V145" class="uchem-2-mm-hg"/>
    <use href="#uchem-2-mm-bulbg"/>
    <line x1="160" y1="34" x2="160" y2="60" style="stroke:var(--fig-blue);stroke-width:2.5"/>
    <path d="M160 68 l-6 -10 h12 z" style="fill:var(--fig-blue)"/>
    <text x="172" y="44" class="uchem-2-mm-s">대기압</text>
    <line x1="92" y1="195" x2="200" y2="195" class="uchem-2-mm-guide"/>
    <line x1="168" y1="145" x2="200" y2="145" class="uchem-2-mm-guide"/>
    <line x1="194" y1="147" x2="194" y2="193" class="uchem-2-mm-h"/>
    <text x="202" y="176" class="uchem-2-mm-hl">h</text>
    <text x="120" y="20" class="uchem-2-mm-hd">열린 관 ①</text>
    <text x="120" y="296" class="uchem-2-mm-s" text-anchor="middle">대기 쪽 수은 면이 높다</text>
    <text x="120" y="326" class="uchem-2-mm-eq">P기체 = P대기 + h</text>
  </g>

  <!-- ② 열린 관: 기체 압력 < 대기압 -->
  <g transform="translate(240 0)">
    <path d="M66 110 H90 Q100 110 100 120 V230 Q100 260 130 260 Q160 260 160 230 V76" class="uchem-2-mm-glass"/>
    <path d="M66 110 H90 Q100 110 100 120 V230 Q100 260 130 260 Q160 260 160 230 V75" class="uchem-2-mm-in"/>
    <path d="M100 150 V230 Q100 260 130 260 Q160 260 160 230 V198" class="uchem-2-mm-hg"/>
    <use href="#uchem-2-mm-bulbg"/>
    <line x1="160" y1="34" x2="160" y2="60" style="stroke:var(--fig-blue);stroke-width:2.5"/>
    <path d="M160 68 l-6 -10 h12 z" style="fill:var(--fig-blue)"/>
    <text x="172" y="44" class="uchem-2-mm-s">대기압</text>
    <line x1="92" y1="150" x2="200" y2="150" class="uchem-2-mm-guide"/>
    <line x1="168" y1="198" x2="200" y2="198" class="uchem-2-mm-guide"/>
    <line x1="194" y1="152" x2="194" y2="196" class="uchem-2-mm-h"/>
    <text x="202" y="179" class="uchem-2-mm-hl">h</text>
    <text x="120" y="20" class="uchem-2-mm-hd">열린 관 ②</text>
    <text x="120" y="296" class="uchem-2-mm-s" text-anchor="middle">대기 쪽 수은 면이 낮다</text>
    <text x="120" y="326" class="uchem-2-mm-eq">P기체 = P대기 − h</text>
  </g>

  <!-- ③ 닫힌 관 -->
  <g transform="translate(480 0)">
    <path d="M66 110 H90 Q100 110 100 120 V230 Q100 260 130 260 Q160 260 160 230 V52" class="uchem-2-mm-glass"/>
    <path d="M66 110 H90 Q100 110 100 120 V230 Q100 260 130 260 Q160 260 160 230 V55" class="uchem-2-mm-in"/>
    <path d="M100 205 V230 Q100 260 130 260 Q160 260 160 230 V105" class="uchem-2-mm-hg"/>
    <use href="#uchem-2-mm-bulbg"/>
    <line x1="170" y1="70" x2="186" y2="62" style="stroke:var(--fig-muted);stroke-width:1.2"/>
    <text x="188" y="62" class="uchem-2-mm-s">진공</text>
    <line x1="92" y1="205" x2="200" y2="205" class="uchem-2-mm-guide"/>
    <line x1="168" y1="105" x2="200" y2="105" class="uchem-2-mm-guide"/>
    <line x1="194" y1="107" x2="194" y2="203" class="uchem-2-mm-h"/>
    <text x="202" y="160" class="uchem-2-mm-hl">h</text>
    <text x="120" y="20" class="uchem-2-mm-hd">닫힌 관 ③</text>
    <text x="120" y="296" class="uchem-2-mm-s" text-anchor="middle">위쪽은 진공(압력 0)</text>
    <text x="120" y="326" class="uchem-2-mm-eq">P기체 = h</text>
  </g>
</svg>
