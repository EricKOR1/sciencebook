<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="t-chem-4-volumetric-flask d-chem-4-volumetric-flask">
  <title id="t-chem-4-volumetric-flask">그림 화학 4-1 부피 플라스크로 0.10 M 염화 나트륨 수용액 250 mL 만들기</title>
  <desc id="d-chem-4-volumetric-flask">NaCl 1.46 g(0.025 mol)을 재어 비커에서 녹인 뒤 250 mL 부피 플라스크에 옮기고, 비커를 헹군 물도 넣는다. 증류수를 표선까지 채울 때는 눈높이에서 용액의 아랫면(메니스커스)을 표선에 맞추고, 마개를 막아 뒤집어 섞는다.</desc>
  <style>
    .c4vf-ink{fill:var(--fig-ink)} .c4vf-mut{fill:var(--fig-muted)}
    .c4vf-lbl{font-size:14px;fill:var(--fig-ink)} .c4vf-b{font-size:15px;font-weight:600;fill:var(--fig-ink)} .c4vf-sm{font-size:13px;fill:var(--fig-muted)}
    .c4vf-H{fill:var(--fig-panel);stroke:var(--fig-muted);stroke-width:1.2} .c4vf-O{fill:var(--fig-red);stroke:var(--fig-red);stroke-width:1} .c4vf-C{fill:var(--fig-ink);stroke:var(--fig-ink);stroke-width:1} .c4vf-N{fill:var(--fig-blue);stroke:var(--fig-blue);stroke-width:1}
    .c4vf-gl{fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:2} .c4vf-liq{fill:var(--fig-soft-blue);stroke:none} .c4vf-num{font-size:15px;font-weight:600;fill:var(--fig-accent)}
  </style>
  <text x="72" y="24" text-anchor="middle" class="c4vf-b">① 질량 재기</text>
  <rect x="24" y="224" width="96" height="26" rx="4" style="fill:var(--fig-soft-violet);stroke:var(--fig-violet);stroke-width:1.5"/><rect x="42" y="230" width="40" height="14" rx="2" style="fill:var(--fig-panel);stroke:var(--fig-violet)"/><text x="62" y="241" text-anchor="middle" style="font-size:11px;fill:var(--fig-ink)">1.46 g</text><rect x="38" y="216" width="68" height="6" rx="2" style="fill:var(--fig-line)"/><path d="M48 216 L54 206 L90 206 L96 216 Z" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.2"/><circle cx="62" cy="202" r="2.6" class="c4vf-mut"/><circle cx="67" cy="204" r="2.6" class="c4vf-mut"/><circle cx="72" cy="202" r="2.6" class="c4vf-mut"/><circle cx="77" cy="204" r="2.6" class="c4vf-mut"/><circle cx="82" cy="202" r="2.6" class="c4vf-mut"/>
  <text x="72" y="276" text-anchor="middle" class="c4vf-sm">0.025 mol × 58.5 g/mol</text>
  <text x="72" y="294" text-anchor="middle" class="c4vf-sm">≈ 1.46 g</text>
  <text x="212" y="24" text-anchor="middle" class="c4vf-b">② 비커에서 녹이기</text>
  <rect x="179" y="210" width="66" height="39" class="c4vf-liq"/><path d="M178 170 L178 250 L246 250 L246 170" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/><line x1="222" y1="150" x2="200" y2="242" style="stroke:var(--fig-muted);stroke-width:3;stroke-linecap:round"/>
  <text x="212" y="276" text-anchor="middle" class="c4vf-sm">증류수를 조금 넣고</text>
  <text x="212" y="294" text-anchor="middle" class="c4vf-sm">완전히 녹인다</text>
  <text x="352" y="24" text-anchor="middle" class="c4vf-b">③ 옮기고 헹구기</text>
  <path d="M322 216 A34 34 0 0 0 382 216 Z" class="c4vf-liq" transform="translate(0 0)"/><path d="M319 214 Q352 254 385 214 Z" class="c4vf-liq"/><path d="M346 100 L346 188 A34 34 0 1 0 358 188 L358 100" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/><line x1="341" y1="140" x2="363" y2="140" style="stroke:var(--fig-red);stroke-width:2"/><path d="M336 80 L368 80 L355 100 L349 100 Z" style="fill:var(--fig-panel);stroke:var(--fig-ink);stroke-width:1.5"/><line x1="352" y1="100" x2="352" y2="110" style="stroke:var(--fig-ink);stroke-width:1.5"/><path d="M306 50 l26 14 l-4 6 l-26 -12 z" style="fill:var(--fig-soft-blue);stroke:var(--fig-ink);stroke-width:1.2"/><path d="M331 68 Q338 72 344 78" style="fill:none;stroke:var(--fig-blue);stroke-width:2"/>
  <text x="352" y="276" text-anchor="middle" class="c4vf-sm">비커·유리 막대를 헹군</text>
  <text x="352" y="294" text-anchor="middle" class="c4vf-sm">물도 모두 넣는다</text>
  <text x="492" y="24" text-anchor="middle" class="c4vf-b">④ 표선까지 채우기</text>
  <path d="M486 138 L486 188 A34 34 0 1 0 498 188 L498 138 Z" class="c4vf-liq"/><path d="M486 100 L486 188 A34 34 0 1 0 498 188 L498 100" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/><line x1="481" y1="140" x2="503" y2="140" style="stroke:var(--fig-red);stroke-width:2"/><path d="M522 128 q-6 6 -12 8" style="fill:none;stroke:var(--fig-blue);stroke-width:1.5"/><rect x="516" y="100" width="10" height="22" rx="3" style="fill:var(--fig-soft-blue);stroke:var(--fig-ink);stroke-width:1.2"/><text x="448" y="144" text-anchor="end" class="c4vf-sm" style="fill:var(--fig-red)">표선</text>
  <text x="492" y="276" text-anchor="middle" class="c4vf-sm">마지막은 스포이트로</text>
  <text x="492" y="294" text-anchor="middle" class="c4vf-sm">한 방울씩</text>
  <text x="640" y="24" text-anchor="middle" class="c4vf-b">⑤ 뒤집어 섞기</text>
  <g transform="rotate(165 640 168)"><path d="M634 138 L634 188 A34 34 0 1 0 646 188 L646 138 Z" class="c4vf-liq"/><path d="M634 100 L634 188 A34 34 0 1 0 646 188 L646 100" style="fill:none;stroke:var(--fig-ink);stroke-width:2"/><line x1="629" y1="140" x2="651" y2="140" style="stroke:var(--fig-red);stroke-width:2"/><rect x="632" y="88" width="16" height="14" rx="3" style="fill:var(--fig-line);stroke:var(--fig-ink)"/></g><path d="M592 100 a50 50 0 0 1 30 -26" style="fill:none;stroke:var(--fig-accent);stroke-width:2"/><path d="M626 72 l-10 -2 l4 9 z" style="fill:var(--fig-accent)"/>
  <text x="640" y="276" text-anchor="middle" class="c4vf-sm">마개를 막고 여러 번</text>
  <text x="640" y="294" text-anchor="middle" class="c4vf-sm">뒤집는다</text>
  <text x="360" y="330" text-anchor="middle" class="c4vf-lbl">눈높이를 표선에 맞추고 오목한 <tspan style="font-weight:600">용액의 아랫면(메니스커스)</tspan>이 표선에 닿게 한다 · 표선을 넘기면 처음부터 다시</text>
</svg>
