<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-uearth-6-latitude-profiles d-uearth-6-latitude-profiles">
<title id="t-uearth-6-latitude-profiles">그림 일반지구과학 6-2 위도에 따른 수온의 연직 분포</title>
<desc id="d-uearth-6-latitude-profiles">저위도는 표층이 따뜻하여 혼합층 아래에 강한 수온 약층이 1년 내내 있고, 중위도는 여름에 얕은 계절 수온 약층이 생기며 겨울에는 혼합층이 수백 m까지 깊어진다. 고위도는 표층부터 깊은 곳까지 차가워 수온 약층이 거의 없다. 1000 m 아래 심해층은 어디서나 0~4 °C 정도이다.</desc>
<style>
.uearth-6-latitude-profiles-t{font-size:14px;fill:var(--fig-ink)} .uearth-6-latitude-profiles-s{font-size:13px;fill:var(--fig-muted)} .uearth-6-latitude-profiles-b{font-size:14px;fill:var(--fig-ink);font-weight:600}
</style>
