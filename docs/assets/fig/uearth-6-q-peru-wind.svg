<title id="t-uearth-6-q-peru-wind">그림 일반지구과학 6-12 문제 4의 페루 연안과 바람</title>
<desc id="d-uearth-6-q-peru-wind">남아메리카 대륙 서해안(페루 연안)과 그 앞바다를 나타낸 지도이다. 화살표는 연안을 따라 남쪽에서 북쪽으로 부는 바람(남풍)이다.</desc>
