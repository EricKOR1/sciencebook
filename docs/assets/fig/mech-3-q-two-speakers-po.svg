  <desc id="d-mech-3-q-two-speakers-po">같은 신호(680 Hz)를 연결한 두 스피커가 1.0 m 간격으로 놓여 있다(위에서 본 모습). O는 두 스피커에서 같은 거리에 있는 점이고, P는 두 스피커까지의 경로차가 0.25 m인 점이다.</desc>
