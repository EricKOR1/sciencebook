<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-ochem-8-diels-alder-mechanism d-ochem-8-diels-alder-mechanism">
  <title id="t-ochem-8-diels-alder-mechanism">그림 유기화학 8-8 딜스–알더 반응의 협동 메커니즘(뷰타-1,3-다이엔 + 말레산 무수물)</title>
  <desc id="d-ochem-8-diels-alder-mechanism">왼쪽: s-시스 다이엔 아래로 친다이엔체의 C=C가 평행하게 다가간다. 굽은 화살표 세 개가 고리를 이룬다: C1=C2 π → C1–Cα 사이, Cα=Cβ π → Cβ–C4 사이, C3=C4 π → C2–C3 사이. 가운데: 여섯 원자의 고리형 전이 상태(‡). 점선은 부분 결합이고, 긴 점선 두 개가 형성 중인 σ 결합이다. 오른쪽: cis-3a,4,7,7a-테트라하이드로-2-벤조퓨란-1,3-다이온. 새 σ 결합 두 개(파랑)와 새 C=C(빨강, C2=C3). 고리 접합 H 두 개가 모두 쐐기(같은 쪽)로 cis이다.</desc>
