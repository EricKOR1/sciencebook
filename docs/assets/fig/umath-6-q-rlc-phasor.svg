  <text x="218.0" y="386.9" class="umath-6-q-rlc-phasor-t umath-6-q-rlc-phasor-b" style="fill:var(--fig-red)">Ṽ = V<tspan dy="4" style="font-size:0.72em">R</tspan><tspan dy="-4">&#8203;</tspan> + V<tspan dy="4" style="font-size:0.72em">L</tspan><tspan dy="-4">&#8203;</tspan> + V<tspan dy="4" style="font-size:0.72em">C</tspan><tspan dy="-4">&#8203;</tspan></text>
  <text x="218.0" y="404.9" class="umath-6-q-rlc-phasor-t umath-6-q-rlc-phasor-b" style="fill:var(--fig-red)">|Ṽ| = 10 V</text>
  <path d="M170.4 295.4 L171.4 293.7 L172.3 292.0 L173.1 290.2 L174.0 288.5 L174.7 286.7 L175.4 284.8 L176.1 283.0 L176.7 281.2 L177.3 279.3 L177.8 277.4 L178.3 275.5 L178.7 273.6 L179.0 271.7 L179.3 269.7 L179.6 267.8 L179.8 265.9 L179.9 263.9 L180.0 262.0 L180.0 260.0" style="fill:none;stroke:var(--fig-ink);stroke-width:1.6;stroke-linejoin:round"/>
