  <text x="390.8" y="362.6" class="umath-6-q-rlc-phasor-t umath-6-q-rlc-phasor-b">Ṽ 가 Ĩ 보다 30.4° 뒤짐</text>
  <line x1="179.5" y1="278.9" x2="388.1" y2="357.2" style="stroke:var(--fig-ink);stroke-width:1;stroke-dasharray:2 2"/>
  <text x="390.8" y="382.6" class="umath-6-q-rlc-phasor-s">(전류가 30.4° 앞섬)</text>
  <text x="20.0" y="450.0" class="umath-6-q-rlc-phasor-s">전압 화살표의 길이는 크기에 비례한다. V<tspan dy="4" style="font-size:0.72em">C</tspan><tspan dy="-4">&#8203;</tspan> 는 V<tspan dy="4" style="font-size:0.72em">L</tspan><tspan dy="-4">&#8203;</tspan> 과 겹치지 않게 옆으로 비켜 그렸다.</text>
