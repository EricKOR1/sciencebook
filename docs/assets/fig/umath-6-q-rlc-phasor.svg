<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="t-umath-6-q-rlc-phasor d-umath-6-q-rlc-phasor">
  <title id="t-umath-6-q-rlc-phasor">그림 수학 도구 6-5 예제 3의 위상자 그림</title>
  <desc id="d-umath-6-q-rlc-phasor">전류 위상자 Ĩ(0.173 A)를 실수축 방향 기준으로 잡았다. 저항 전압 V_R = 8.63 V 는 전류와 같은 방향, 인덕터 전압 V_L = 8.67 V 는 90° 앞선 +허수 방향, 축전기 전압 V_C = 13.73 V 는 90° 뒤진 −허수 방향이다. 세 화살표를 이으면 전체 전압 Ṽ(크기 10 V)가 실수축 아래 30.4° 를 가리킨다. 즉 전압이 전류보다 30.4° 뒤진다(전류가 앞선다).</desc>
