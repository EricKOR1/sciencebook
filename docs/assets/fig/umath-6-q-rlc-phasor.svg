  <text x="103.0" y="373.0" class="umath-6-q-rlc-phasor-s" text-anchor="end">−4 V</text>
  <line x1="107.0" y1="152.0" x2="113.0" y2="152.0" style="stroke:var(--fig-ink);stroke-width:1"/>
  <text x="103.0" y="157.0" class="umath-6-q-rlc-phasor-s" text-anchor="end">4 V</text>
