<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="t-matter-1-water-phase d-matter-1-water-phase">
  <title id="t-matter-1-water-phase">그림 물질과 에너지 1-7 물의 상평형 그림(모식도)</title>
  <desc id="d-matter-1-water-phase">온도와 압력에 따라 얼음·물·수증기 중 어느 상태가 안정한지 나타낸 모식도이다. 세 곡선이 만나는 삼중점에서는 세 상태가 함께 존재하고, 1 atm 선은 융해 곡선과 0 °C, 증기 압력 곡선과 100 °C에서 만난다. 눈금 간격은 실제 비율과 다르다.</desc>
