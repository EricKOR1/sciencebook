<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t-ubio-8-life-timeline d-ubio-8-life-timeline">
<title id="t-ubio-8-life-timeline">그림 일반생명과학 8-4 생명의 역사 연표</title>
<desc id="d-ubio-8-life-timeline">위: 46억 년을 같은 비율로 그린 띠. 원핵생물만 살던 기간이 생명의 역사 대부분을 차지하고, 동물과 육상 식물의 역사는 마지막 약 5억 4천만 년뿐이다. 아래: 마지막 5억 4천만 년을 확대한 띠와 다섯 번의 대멸종. 연대는 대략적인 값이다.</desc>
