  <text x="180.0" y="278.0" text-anchor="middle" class="m3-07-q-wet-stopping-sm">0</text>
  <line x1="245.0" y1="258" x2="245.0" y2="264" style="stroke:var(--fig-line);stroke-width:1.5"/>
  <text x="245.0" y="278.0" text-anchor="middle" class="m3-07-q-wet-stopping-sm">10</text>
  <line x1="310.0" y1="258" x2="310.0" y2="264" style="stroke:var(--fig-line);stroke-width:1.5"/>
  <text x="310.0" y="278.0" text-anchor="middle" class="m3-07-q-wet-stopping-sm">20</text>
  <line x1="375.0" y1="258" x2="375.0" y2="264" style="stroke:var(--fig-line);stroke-width:1.5"/>
  <text x="375.0" y="278.0" text-anchor="middle" class="m3-07-q-wet-stopping-sm">30</text>
  <line x1="440.0" y1="258" x2="440.0" y2="264" style="stroke:var(--fig-line);stroke-width:1.5"/>
  <text x="440.0" y="278.0" text-anchor="middle" class="m3-07-q-wet-stopping-sm">40</text>
  <line x1="505.0" y1="258" x2="505.0" y2="264" style="stroke:var(--fig-line);stroke-width:1.5"/>
  <text x="505.0" y="278.0" text-anchor="middle" class="m3-07-q-wet-stopping-sm">50</text>
  <line x1="570.0" y1="258" x2="570.0" y2="264" style="stroke:var(--fig-line);stroke-width:1.5"/>
  <text x="570.0" y="278.0" text-anchor="middle" class="m3-07-q-wet-stopping-sm">60</text>
  <line x1="635.0" y1="258" x2="635.0" y2="264" style="stroke:var(--fig-line);stroke-width:1.5"/>
  <text x="635.0" y="278.0" text-anchor="middle" class="m3-07-q-wet-stopping-sm">70</text>
  <text x="649.0" y="278.0" class="m3-07-q-wet-stopping-sm">m</text>
