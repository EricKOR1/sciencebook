<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-ochem-2-chair-newman d-ochem-2-chair-newman">
  <title id="t-ochem-2-chair-newman">그림 유기화학 2-12 의자 형태를 뉴먼 투영식으로 확인하기</title>
  <desc id="d-ochem-2-chair-newman">왼쪽: 의자 형태의 원근 그림과 탄소 번호 C1~C6, 보는 방향(눈 모양 화살표: C2 → C1, C4 → C5). 오른쪽: C1–C2 결합과 C5–C4 결합을 동시에 따라 본 이중 뉴먼 투영식(앞 탄소 C2·C4 = 점, 뒤 탄소 C1·C5 = 원). 두 결합 모두 엇갈린 형태이고, 고리 탄소 C3과 C6은 서로 고시 관계(이면각 약 55°)이다.</desc>
